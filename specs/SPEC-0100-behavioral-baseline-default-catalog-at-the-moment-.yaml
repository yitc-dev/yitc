id: SPEC-0100
title: Behavioral-baseline default catalog — at-the-moment delivery of the seeded
  cross-project behavioral/UX-safety defaults (before-authoring-interaction)
status: active
created_at: 2026-06-22 14:50:30+00:00
travels: null
consumed: false
implements: []
body: "## Scenario\n\nA project (a consumer, or the kernel) is about to author a user-facing\
  \ interaction — a delete button,\na form submit, a money action. At THAT moment\
  \ it should be reminded, without having to remember, that\na catalog of cross-project\
  \ behavioral/UX-safety DEFAULTS already exists — so it FILLS a concrete project\n\
  spec from the relevant default instead of re-deriving the rule from an incident\
  \ (the <project>\ncabinet-delete class: an irreversible action fired with no confirm).\
  \ The owner sees: a new project\ninherits «confirm-before-irreversible» (and the\
  \ candidate defaults) for free, names them once, and grows\nthe catalog when it\
  \ finds a new universal default.\n\n## Internal\n\nThe named cross-project behavioral/UX-safety\
  \ DEFAULTS live in the catalog pattern-doc\n`patterns/behavioral-baseline-defaults.md`\
  \ — the single home of the named index + the fill/grow/\nadopt-back protocol + the\
  \ review lens (SoT; this spec does NOT restate the UX-safety defaults — CHARTER\
  \ §P5). EXCEPTION — the SECURITY authoring-moment defaults (§Security authoring-moment\
  \ defaults below) single-home in THIS spec body: a DISTINCT axis (before-handling-a-secret\
  \ / before-authoring-auth), so naming them here is not a double-home.\nThis spec\
  \ is the catalog's RETRIEVAL-DELIVERY contract: it binds the `before-authoring-interaction`\n\
  floor surface, so `graph build` surfaces it in the always-loaded floor trigger-map\
  \ (the at-the-moment\nreminder, the floor-trigger-map analog). The floor trigger-map\
  \ is kernel-derived and TRAVELS to consumer\nbuild sessions (the kernel_provided\
  \ consumer-build note) — so the reminder reaches a consumer at the\nmoment of UI\
  \ authoring, where it belongs.\n\nScope bound (anti-complexity, CHARTER §Principle\
  \ 1): this seeds the cross-project DEFAULTS + their\ndelivery — it is NOT a new\
  \ rule engine. A project's behavioral rules already home in its own `specs/`;\n\
  the only added value is naming the defaults ONCE so a new project does not re-derive\
  \ them. The delivery\nREUSES the existing floor-trigger pipeline (per-spec `binding:`\
  \ → `_build_binding_views` →\n`_render_floor_trigger_map`, SPEC-0013), it does not\
  \ add a parallel mechanism.\n\n## AI-session behavioral default (owner-communication\
  \ axis)\n\nThe catalog ALSO names ONE AI-session behavioral default beside the user-facing\
  \ UX-safety defaults:\n`offer-audit-adhoc-on-a-structural-pre-plan-fork` (catalog\
  \ naming in\n`patterns/behavioral-baseline-defaults.md` §AI-session behavioral defaults).\
  \ Its RULE-HOME is\nAGENTS-PROTOCOL.md §Recommendation Default — read there for\
  \ the trigger, scope bound, and\noffered-not-auto semantics (named, not restated\
  \ here — CHARTER §P5). This axis is delivered via that\nalways-loaded controller\
  \ seed, NOT the before-authoring-interaction floor, which stays scoped to\nuser-facing\
  \ UI.\n\nAdoption (CHARTER §Principle 8, infra-class): a consumer FILLS a default\
  \ by authoring its own concrete\n`specs/<SPEC>.yaml` that `cites:` the catalog —\
  \ that cite IS the consumer-read evidence. First evidence:\n<project> <workshop-spec>\
  \ (confirm-before-irreversible) — tracked by the blocking adopt-back cross to <project>\n\
  (a consumer-repo edit is cross-territory from the kernel).\n\n## Security authoring-moment\
  \ defaults (owner-adjudicated LIGHT secbaseline)\n\nBeside the user-facing UX-safety\
  \ defaults (catalog SoT above) this spec ALSO names a SECURITY axis:\nsix authoring-moment\
  \ security defaults, delivered on TWO floor surfaces — `before-handling-a-secret`\n\
  (a session about to handle key material / a credential / a ciphertext surface) and\
  \ `before-authoring-auth`\n(a session about to author an auth flow). These are PROMPTS/DEFAULTS\
  \ a project FILLS or waives at the\nmoment it authors — never a gate, register,\
  \ waiver-contract, or probe obligation (the heavier enforcement\nform B is PARKED;\
  \ owner adjudication decisions/secbaseline-fork-audit-adhoc.yaml GREEN, sole survivor\
  \ =\nthis LIGHT form). Origin: a day of real <project> incidents (X-0369 — an 8h\
  \ prod-auth outage + a 5h\nkey-rotation outage from exactly the knowledge this catalog\
  \ exists to deliver; X-0345 item 1 — a key\nrotation with no ciphertext-surface\
  \ map). Unlike the UX defaults (SoT = the catalog pattern-doc), this\nsecurity axis\
  \ single-homes HERE in the spec body (a distinct axis — no P5 double-home).\n\n\
  **Delivered at `before-handling-a-secret`:**\n1. **Key separation** — a data-encryption\
  \ key is NEVER derived from or shared with the session / JWT\n   signing key (distinct\
  \ purpose ⇒ distinct key). *Incident: X-0369 (<project> reused the JWT-signing key\n\
  \   for data encryption).*\n2. **No secret in runtime output** — no key / token\
  \ / credential ever reaches logs, traces, or error\n   bodies. *Incident: X-0369\
  \ cluster.*\n3. **No placeholder secret in a live env** — a live/prod environment\
  \ never runs on a dev/placeholder/\n   example secret; the deployed secret is real\
  \ and env-scoped. *Incident: X-0369 cluster.*\n4. **Rotation is a rehearsed scripted\
  \ procedure covering every ciphertext surface** (CAPABILITY, not a\n   one-time\
  \ act) — the project CAN rotate a credential via a rehearsed script that re-encrypts\
  \ every\n   ciphertext surface; a project with no ciphertext surface binds not-applicable\
  \ WITH proof of that\n   absence. *Incident: X-0345 item 1 (rotation with no ciphertext-surface\
  \ map → 5h outage).*\n5. **Backup restore-drill** (CAPABILITY, same phrasing) —\
  \ the project CAN restore from backup via a\n   rehearsed drill; not-applicable\
  \ is bound only with proof of no persisted secret / ciphertext surface.\n   *Incident:\
  \ X-0345 (secrets / crypto continuity).*\n\n**Delivered at `before-authoring-auth`:**\n\
  6. **Auth baseline** — an authored auth flow sets an httpOnly session cookie, states\
  \ its CSRF posture,\n   returns UNIFORM auth errors (no user-enumeration oracle),\
  \ and rate-limits login. *Incident: X-0369 /\n   <project> CSRF retrofit-live (8h\
  \ prod-auth outage).*\n\nOptional probe pointers (EXAMPLES ONLY — evidence a project\
  \ MAY choose to add, never a required SPEC-0098\nprobe and never binding state):\
  \ a grep of logs/responses for known secret prefixes (item 2); a scripted\nrotation\
  \ dry-run asserting every ciphertext column re-encrypts (item 4); a restore-drill\
  \ that boots from a\nfresh backup (item 5); an auth smoke asserting httpOnly + a\
  \ 401 shape identical for unknown-user vs\nbad-password (item 6). A project FILLS\
  \ a default as its own concrete `specs/<SPEC>.yaml` (the cite IS the\nconsumer-read\
  \ evidence) or waives with a reason — CONSIDERATION, never forced adoption.\n\n\
  ## UI accessibility authoring-moment defaults (before-authoring-UI)\n\nA THIRD axis,\
  \ delivered on the EXISTING `before-authoring-UI` floor surface — the row that already\n\
  points at this spec, derived from the SPEC-0093 `ui` concern block, NOT from this\
  \ spec's\n`binding:` list. This section therefore adds NO trigger and changes no\
  \ delivery wiring; it fills the\nsurface that reader already reaches. Like the security\
  \ axis above (and unlike the UX-safety defaults,\nwhose SoT is the catalog pattern-doc),\
  \ accessibility single-homes HERE — a distinct axis, so no P5\ndouble-home.\n\n\
  These three are a CONSTANT floor: they apply from the FIRST user, at any project\
  \ size, and are NEVER\nprofile-gated — an interface either exposes its controls\
  \ to a keyboard and a screen reader or it does\nnot, and retrofitting that later\
  \ is the expensive path. Like every catalog item they are\nCONSIDERATION, never\
  \ forced adoption: a project FILLS one as its own concrete `specs/<SPEC>.yaml`\n\
  (that cite IS the consumer-read evidence) or waives it with a reason. They are never\
  \ a gate,\nregister, waiver-contract, or probe obligation.\n\n1. **Every interactive\
  \ control has an accessible name** — every button, link, input, and icon-only\n\
  \   control exposes a non-empty accessible name (a visible label, `aria-label`,\
  \ or `aria-labelledby`);\n   an icon-only control with no text is the recurring\
  \ miss. A control a screen reader announces as\n   \"button\" is unusable, not merely\
  \ unpolished.\n2. **Every flow is keyboard-reachable** — each flow can be started,\
  \ completed, and escaped with the\n   keyboard alone: every interactive element\
  \ is focusable, focus is VISIBLE, focus order follows\n   reading order, and an\
  \ overlay/modal traps focus then RESTORES it on close. No action is reachable\n\
  \   only by hover or pointer.\n3. **A validation/error state is ANNOUNCED, not colour-only**\
  \ — an error carries TEXT tied\n   programmatically to its control (`aria-invalid`\
  \ + `aria-describedby`), and when it appears\n   asynchronously it lands in a polite\
  \ live region so it is announced rather than silently painted.\n   Colour is never\
  \ the sole carrier of the state.\n\nOptional probe pointers (EXAMPLES ONLY — cheap\
  \ evidence a project MAY adopt, never a required\nSPEC-0098 probe and never binding\
  \ state): item 1 — the axe-core `button-name` / `link-name` /\n`image-alt` rules,\
  \ or a DOM assertion that every focusable control resolves a non-empty accessible\n\
  name; item 2 — a DOM assertion walking Tab order through one flow and asserting\
  \ it completes, or the\naxe-core `focus-order-semantics` rule plus a no-positive-`tabindex`\
  \ check; item 3 — a DOM assertion\nthat after an invalid submit the error TEXT is\
  \ present and associated with its field, or the axe-core\n`aria-valid-attr-value`\
  \ rule over that wiring.\n\n**i18n is deliberately NOT here yet** (locale formatting,\
  \ RTL, translation-readiness): the accessibility\nfloor is constant from the first\
  \ user, whereas i18n's cost and timing depend on whether a project will\nserve a\
  \ second locale at all. Recorded as a CHOICE, not an oversight — added when a project\
  \ pulls it.\n\n## Born-secure authoring-moment baseline (before-authoring-public-boundary\
  \ / before-adding-a-dependency)\n\nA FOURTH axis, delivered on TWO new floor surfaces\
  \ — `before-authoring-public-boundary` (a session about\nto author an endpoint,\
  \ accept external input, render user text, read/write an object on someone's behalf,\n\
  accept an upload, or make an outbound request on a caller-supplied URL) and `before-adding-a-dependency`.\n\
  The adjudication (decisions/security-born-secure-authoring-baseline-audit-adhoc.yaml,\
  \ finding 2)\ndeliberately kept it to TWO tokens: a per-seam split (`before-authoring-an-endpoint`\
  \ +\n`before-accepting-external-input`) would deliver this same spec twice at one\
  \ seam. Like the\nsecurity axis and the accessibility axis, these items single-home\
  \ HERE — a distinct axis, no P5\ndouble-home. Derived from OWASP ASVS L1 (the CHARTER\
  \ §Principle 1 Filter 4 documented external analog),\nNOT pasted from it: ten items,\
  \ each with ONE cheap differential probe. What is deliberately NOT seeded at\nthis\
  \ baseline, recorded as a CHOICE: ASVS L2/L3 depth, WAF/RASP/SIEM platforms, pen-test\
  \ programs,\nSLSA/SBOM signing, HSM key ceremonies, enterprise SAML/SCIM, and broad\
  \ scanner-platform mandates — all\nprofile-escalatable later. Like every catalog\
  \ item these are CONSIDERATION, never forced adoption: a\nproject FILLS one as its\
  \ own concrete `specs/<SPEC>.yaml` (that cite IS the consumer-read evidence) or\n\
  waives it with a reason. They are never a gate, register, waiver-contract, or probe\
  \ obligation.\n\nDELIVERY IS PROFILE-GATED (SPEC-0198). Two items are a CONSTANT\
  \ FLOOR — every project hears them from the\nfirst line of code, at any size. The\
  \ other eight are BOUNDARY items, delivered when the project's resolved\n`surface`\
  \ is `public` or `unknown` (SPEC-0198 rule 2 treats an unresolved dimension as WIDE;\
  \ rule 7 means a\nproven `prototype` hears the constant floor alone). The gate is\
  \ membership of the item's lens in the\n`check_set` `bin/lib/profile.py` resolves\
  \ — the ONE derivation site, never re-derived here. Because a\nprofile is a snapshot\
  \ and an EDIT can move it, the delivery's FIRST line asks whether THIS edit raises\
  \ the\nprofile (SPEC-0198 §8); if it does, apply the higher check-set to THIS edit\
  \ rather than to the next one.\n\n1. **Object-level authorization** — `object-level-authz`\
  \ (ASVS L1 V4.1.1 / V4.2.1). Every object read,\n   update and delete re-checks\
  \ that the CALLER owns or is granted THAT object id; a route-level\n   logged-in\
  \ check is authentication, not authorization.\n   *Probe:* as user A, request user\
  \ B's object id and assert the response carries none of B's fields.\n   *Bad input:*\
  \ `GET /objects/<B_id>` with A's session — a 200 carrying B's data FAILS the probe.\n\
  2. **Input validation and canonicalization** — `input-validation` (ASVS L1 V5.1.3\
  \ / V5.1.4). Every\n   external field is validated against a positive schema (type,\
  \ enum membership, length) BEFORE use, and\n   a rejection changes no state.\n \
  \  *Probe:* send a malformed type, an unknown enum value, and an oversized field;\
  \ assert 4xx and that\n   the stored record is byte-identical to before.\n   *Bad\
  \ input:* `{\"role\": \"wizard\", \"age\": \"abc\"}` on a route accepting `role`\
  \ in `{user,admin}` — a 2xx,\n   or a mutated record, FAILS the probe.\n3. **Injection-safe\
  \ data access** — `injection-safe-data-access` (ASVS L1 V5.3.4 / V5.3.8). Every\
  \ query\n   and command is built from parameterized/bound values, never from concatenated\
  \ caller input.\n   *Probe:* submit a control-character payload in a filter field\
  \ and assert the result set is EMPTY (or\n   the literal match), never widened,\
  \ and that no shell/DB command ran.\n   *Bad input:* `' OR '1'='1` in a search field\
  \ — a response returning ALL rows FAILS the probe.\n4. **Output encoding** — `output-encoding`\
  \ (ASVS L1 V5.3.1 / V5.3.3). Stored and reflected user text is\n   contextually\
  \ encoded at render; markup in data is never markup in output.\n   *Probe:* store\
  \ text containing script markup, re-render the page, and assert it appears as inert\
  \ TEXT.\n   *Bad input:* `<script>alert(1)</script>` saved in a display name — a\
  \ live script node in the DOM FAILS\n   the probe.\n5. **Public endpoint size and\
  \ rate bounds** — `endpoint-size-rate-bounds` (ASVS L1 V13.2.4 / V12.1.1). A\n \
  \  publicly reachable endpoint caps request body size and has a deterministic burst-protection\
  \ path.\n   *Probe:* POST a body over the cap and assert 413; then burst the endpoint\
  \ and assert a deterministic\n   429/protection response rather than a timeout.\n\
  \   *Bad input:* a 100 MB body to an endpoint documented for 1 MB — a 200 (or a\
  \ hung worker) FAILS.\n6. **Security headers and CORS** — `headers-cors` (ASVS L1\
  \ V14.4.1 / V14.5.3). Public responses carry the\n   baseline headers, and a disallowed\
  \ Origin never receives a credentialed\n   `Access-Control-Allow-Origin`.\n   *Probe:*\
  \ request with a disallowed `Origin` and assert no ACAO echo alongside\n   `Access-Control-Allow-Credentials`.\n\
  \   *Bad input:* `Origin: https://attacker.example` — a response echoing that origin\
  \ with credentials\n   allowed FAILS the probe.\n7. **Upload handling** — `upload-handling`\
  \ (ASVS L1 V12.1.1 / V12.3.1 / V12.5.1). Uploads are bounded by\n   size, restricted\
  \ by verified type, stripped of path components in the filename, and served\n  \
  \ non-executable and non-inline.\n   *Probe:* upload a file whose name traverses\
  \ and whose type is disallowed; assert rejection, and assert\n   an ACCEPTED file\
  \ is served with a non-executable content type and `Content-Disposition: attachment`.\n\
  \   *Bad input:* a filename of `../../etc/passwd.php` — an accepted upload, or one\
  \ written outside the\n   upload root, FAILS the probe.\n8. **SSRF and outbound\
  \ URL restriction** — `ssrf-outbound-url` (ASVS L1 V12.6.1 / V5.2.6). A\n   caller-supplied\
  \ URL is validated against an allowlist and resolved-address check BEFORE any outbound\n\
  \   request; loopback, link-local, private and cloud-metadata ranges are refused.\n\
  \   *Probe:* submit a metadata-service URL and assert the refusal happens with NO\
  \ outbound request made.\n   *Bad input:* `http://<ip>/latest/meta-data/` — any\
  \ outbound attempt at all FAILS the probe.\n9. **Dependency hygiene** — `dependency-hygiene`\
  \ (ASVS L1 V14.2.1 / V14.2.4). CONSTANT FLOOR. Every\n   dependency is pinned in\
  \ a manifest WITH a committed lockfile, installs are frozen (no resolution drift\n\
  \   at build time), and no critical/high advisory is carried unwaived.\n   *Probe:*\
  \ run the frozen install and the advisory audit in CI and assert both are clean.\n\
  \   *Bad input:* an unpinned range with no lockfile entry — a frozen install that\
  \ silently resolves it, or\n   an audit reporting an unwaived critical, FAILS the\
  \ probe.\n10. **PII, log and error safety** — `pii-log-error-safety` (ASVS L1 V7.1.1\
  \ / V8.3.4 / V14.3.2). CONSTANT\n   FLOOR. Credentials, tokens and personal data\
  \ never reach logs, traces or error bodies, and a public\n   error response never\
  \ carries a stack trace or internal identifier.\n   *Probe:* drive a request with\
  \ a fake password/token/email through a deliberate failure and grep the\n   logs\
  \ and the response body for those literals.\n   *Bad input:* a request carrying\
  \ `password=hunter2-probe` that 500s — that literal appearing in a log\n   line\
  \ or the response, or a stack trace in the public body, FAILS the probe.\n\n## Rationale\n\
  \nReal incident (CHARTER §Principle 1 Filter 4): <project> cabinet delete fired\
  \ immediately on click, no\nconfirm → <project> <workshop-spec>. Today every project\
  \ re-derives such universal defaults from scratch, usually\nonly after its own incident.\
  \ Prior-art: the existing general UX patterns (`ux-destructive-operation-safety`,\n\
  `ux-general-principles`) carry the CONTENT but are not a NAMED, delivered cross-project\
  \ default catalog.\nThe seed-and-grow shape (the LOGIC sibling of design-by-default)\
  \ names them once + delivers them. Origin:\ncross X-0059.\n\n## Verification\n\n\
  - graph query SPEC-0100 resolves the active spec (post-activation).\n- graph query\
  \ behavioral-baseline-defaults resolves the catalog pattern node; the pattern carries\
  \ a\n  \"## Review lens\" section (state-check).\n- A seeded ACTIVE spec bound to\
  \ `before-authoring-interaction` inverts into verb_to_specs (the floor-row\n  mechanism,\
  \ exercised by tests/test_t9421_behavioral_baseline_catalog.py; the live floor ROW\
  \ lands in).\n- The two security tokens (before-handling-a-secret / before-authoring-auth)\
  \ each render a\n  floor-trigger-map row pointing at this spec; differential — removing\
  \ a token from binding: removes\n  its row (graph build regenerates graph/floor-trigger-map.md).\n\
  - The two born-secure tokens (before-authoring-public-boundary / before-adding-a-dependency)\n\
  \  each render a floor-trigger-map row pointing at this spec; differential — removing\
  \ a token from\n  binding: removes its row (tests/test_t12086_born_secure_triggers.py).\n\
  - The ten §Born-secure items are delivered PROFILE-GATED by `graph.born_secure_render`\
  \ off the ONE\n  SPEC-0198 resolver: a prototype-profile checkout receives the two\
  \ constant-floor items and NOT the\n  eight boundary ones; a public-surface checkout\
  \ receives all ten; an UNRESOLVABLE profile fails CLOSED\n  to the two constant-floor\
  \ items. The profile-raising question (SPEC-0198 §8) is the FIRST line of the\n\
  \  delivery, ahead of the section heading (differential — same test file).\n- Each\
  \ of the ten items names a one-line differential probe and the bad input that FAILS\
  \ it (state check\n  over this body; the probes are exercised table-driven in the\
  \ same test file).\n- The three accessibility items (accessible name · keyboard-reachable\
  \ flow · error announced,\n  not colour-only) are present in §UI accessibility authoring-moment\
  \ defaults, each with an optional\n  example probe (state check: grep this body\
  \ for the three item headings and for the probe-pointer\n  paragraph naming an axe-core\
  \ rule or a DOM assertion for each). Differential — deleting an item\n  drops its\
  \ heading from that grep; and the `before-authoring-UI` floor row is UNCHANGED by\
  \ this\n  section because the row is derived from the SPEC-0093 `ui` concern block,\
  \ not from this\n  spec's binding: (differential — the row moves only if that concern\
  \ block or binding: changes,\n  neither of which this section touches).\n"
