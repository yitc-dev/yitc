init_concern:
  init_question: When authoring a user-facing interaction (a delete button, a form
    submit, a money action), does this project FILL the relevant cross-project behavioral/UX-safety
    DEFAULT (e.g. confirm-before-irreversible) from the catalog `patterns/behavioral-baseline-defaults.md`
    into its own spec — instead of re-deriving the rule from an incident? Adopt the
    behavioral-baseline defaults, or waive.
  waiver: A project with no user-facing interactions (a pure library / CLI with no
    destructive or irreversible actions) may bare-waive. A project that HAS such actions
    but waives a specific default must record a reason — the catalog guarantees CONSIDERATION,
    never forced adoption (SPEC-0096 rule 5).
  evidence: 'a consumer-authored `specs/<SPEC>.yaml` that `cites:` the catalog (the
    consumer-read evidence — first instance: <project> <workshop-spec>, confirm-before-irreversible),
    reached at authoring time via the `before-authoring-interaction` floor reminder
    in graph/floor-trigger-map.md.'
  recommended: Adopt the behavioral-baseline defaults — before building a delete /
    submit / money action, copy the matching default (e.g. confirm-before-irreversible)
    from `patterns/behavioral-baseline-defaults.md` into your own spec. A project
    with no user-facing actions yet (a library, a CLI) may waive with that reason.
  record_at: Your own `specs/<SPEC>.yaml` for each user-facing action, citing `patterns/behavioral-baseline-defaults.md`
    — written when you author that action, not at init.
  tier: universal
