requires: []
supersedes: ~
activation_owner_task: # task close activates proposed→active
proposed_by: # provenance (work-first authoring task)
binding: # before-authoring-interaction : the FIRST behavioral, non-CLI-verb
  - before-authoring-interaction # floor surface. Registered in BINDING_VERB_SURFACES here; the FLOOR_TRIGGERS
                               # ROW that renders it in the floor trigger-map is wired by (requires).
  - before-handling-a-secret # — security authoring-moment defaults (secret/key/ciphertext axis)
  - before-authoring-auth # — auth baseline (delivered when authoring an auth flow)
  - before-authoring-public-boundary # — the born-secure boundary items (endpoint / external input /
                               # output rendering / object access / upload / outbound URL), profile-gated
  - before-adding-a-dependency # — the born-secure dependency-hygiene item (constant floor)
init_concern: # — activation baseline-concern declaration (SPEC-0030 schema;
                                 # DERIVED into graph/activation-checklist.md by SPEC-0096). The cross-project
                                 # behavioral/UX-safety DEFAULTS are inherited by every consumer regardless
                                 # of stack/archetype (the catalog travels — SPEC-0100) → tier: universal.
  init_question: >-
    When authoring a user-facing interaction (a delete button, a form submit, a money action), does
    this project FILL the relevant cross-project behavioral/UX-safety DEFAULT (e.g.
    confirm-before-irreversible) from the catalog `patterns/behavioral-baseline-defaults.md` into its
    own spec — instead of re-deriving the rule from an incident? Adopt the behavioral-baseline
    defaults, or waive.
  waiver: >-
    A project with no user-facing interactions (a pure library / CLI with no destructive or
    irreversible actions) may bare-waive. A project that HAS such actions but waives a specific default
    must record a reason — the catalog guarantees CONSIDERATION, never forced adoption (SPEC-0096
    rule 5).
  evidence: >-
    a consumer-authored `specs/<SPEC>.yaml` that `cites:` the catalog (the consumer-read evidence —
    first instance: kupiclub SPEC-0016, confirm-before-irreversible), reached at authoring time via the
    `before-authoring-interaction` floor reminder in graph/floor-trigger-map.md.
  tier: universal
