id: SPEC-1004
title: Session refresh hand-off — trigger (owner cue or telemetry) plus a per-project
  ephemeral hand-off store with journal pointers, taken by owner pick (interactive
  sessions only)
status: active
created_at: 2026-09-29 16:07:33+00:00
