id: SPEC-0065
title: Land inert-retry re-verify skip — an inert concurrency retry fast-forwards
  without re-running verify
status: active
created_at: 2026-06-09 10:14:30+00:00
consumed: false
implements:
- bin/lib/worktree.py#_land_integrate
- bin/lib/worktree.py#_land_stage6_credit
- bin/lib/worktree.py#_land_post_sync_proof_credit
- bin/lib/worktree.py#_stage6_run_record
- bin/lib/worktree.py#_land_verify_skip_judge
body: "## Scenario\n\nUnder concurrent sessions, land's optimistic-concurrency retry\
  \ re-runs the FULL verify every time\n`main` advanced during its verify window —\
  \ even when the attempt is re-merging onto a `main` tip\nthat is itself already\
  \ green, and its own change is non-executable. That repeated ~96s verify is\nthe\
  \ worst-case 457s land. When the delta this attempt is about to fast-forward — the\
  \ landing\nbranch's OWN change on top of the freshly merged `main` tip — is nothing\
  \ the verification\nenvironment observes, re-verifying proves nothing new. This\
  \ rule lets such a retry fast-forward\nwithout re-verifying — and ONLY such a retry,\
  \ apart from the two first-attempt proofs §Bound states\nseparately: the inert first-attempt\
  \ skip and the Stage-6 credit.\n\n## Internal\n\nLAND INERT-RETRY RE-VERIFY SKIP.\
  \ On a land retry (the in-lock HEAD re-check found `main` advanced\npast the merged\
  \ base, so the attempt re-merges newer `main`):\n\n- Classify **the delta this attempt's\
  \ ff is about to apply** — `merged_base..HEAD`, the landing\n  branch's OWN delta\
  \ on top of the `main` tip this attempt merged — with the inert-path classifier\n\
  \  (SPEC-0064 §3: one authority AND one evaluation point). It is never the initial\
  \ branch diff, and\n  never the set of paths newer `main` brought in — that content\
  \ cancels out of this diff, being\n  present in both `merged_base` and `HEAD`.\n\
  - **Delta INERT → MAY skip the full re-verify** for this retry and proceed to the\
  \ ff. `main`\n  advances ONLY via a green land, so `merged_base` is itself already\
  \ verified; an inert branch\n  delta on top of it changes nothing the suite or canary\
  \ executes or observes, so the merged\n  result is verification-equivalent to that\
  \ already-green base and its verdict still holds.\n- **Delta OBSERVABLE (or classifier\
  \ unavailable) → MUST re-run the full verify** before ff — exactly\n  today's behaviour.\
  \ Fail-closed: anything not provably inert re-verifies. That re-verify is the\n\
  \  candidate verify, and on a retry it MAY take the per-layer case of §Bound against\
  \ an earlier\n  attempt of this land.\n\n### Safety — \"never ff an untested combination\"\
  \ is preserved, not weakened\nThe land safety contract is that `main` never fast-forwards\
  \ to a combination whose verification was\nnot green. This rule does NOT relax it:\
  \ it asserts that an INERT delta-about-to-ff yields the SAME\nverification verdict\
  \ as the already-green `merged_base` it sits on (between that base and the merged\n\
  tree the executed code / tests / config / fixtures are byte-identical; only unobserved\n\
  artifact/journal/derived content differs), so the combination is not \"untested\"\
  \ — it is\nverification-equivalent to a tree that already passed. The skip is therefore\n\
  an optimization that removes provably-redundant work, never a relaxation of the\
  \ green-before-ff gate.\n\n### Bound\nThe decision is per-retry: a later retry whose\
  \ delta is observable re-verifies regardless of earlier\ninert retries. The skip\
  \ never persists across an observable change.\n\n**Why attempt 1 was pinned out,\
  \ and what lever B leans on.** The original card scoped this\nlever to concurrency\
  \ retries, and on a retry an EARLIER attempt of the same land had already run the\n\
  full verify over the branch's own bytes. That earlier verify is a real backstop,\
  \ not a formality:\nSPEC-0064 §5's note that tests never read the real artifact\
  \ dirs is not literally true (some tests\nread named real `tasks/` cards, glob `tasks/`,\
  \ or fold the real journal). So lever B now requires\nthat some attempt of this\
  \ land actually RAN the test verify; a land none of whose attempts did takes\nthe\
  \ first-attempt proof below on every attempt instead of leaning on a verify that\
  \ never happened.\n\n**The inert first-attempt skip (`reverify_skip_reason: inert-first-attempt-delta`).**\
  \ A land\nnone of whose attempts has verified, not declaring a rebaseline, MAY skip\
  \ the suite, the host-leak\ncanary and the SPEC-0077 pinned re-run when ALL of these\
  \ hold — any unproven part, or any error,\nmeans the full verify (fail-closed):\n\
  \  (a) BRANCH DELTA INERT — `merged_base..HEAD` (this lever's own delta) is inert\
  \ by the ONE SPEC-0064\n      authority, so `tests/**` and every other observable\
  \ class in the branch always verify.\n  (b) ANCHOR V — the newest ok `land_completed`\
  \ on main's bounded journal tail that actually verified\n      (`reverify_skipped`\
  \ false, no `no_tests`) recorded the tree its GREEN verify tested, and V is a\n\
  \      real tree object: the tree the venue tested (`verify_metrics.venue_cand_tree`,\
  \ `venue_outcome`\n      GREEN), or the tree a LOCAL candidate verify tested (`verify_metrics.cand_tree`).\
  \ A\n      local verify records its tree only when its sweep and its consumer layers\
  \ are green AND the\n      files on disk were exactly HEAD's tree both before and\
  \ after the run — judged from the files\n      themselves, file modes included,\
  \ never from a view a setting can narrow. A row recording neither tree never\n \
  \     anchors (every local row written before, a verify of a dirty worktree); nor\
  \ does a row\n      outside the bound. A Stage-6-CREDITED land (`reverify_skip_reason:\
  \ stage6-credit`) that recorded\n      the tree its credited Stage-6 run tested\
  \ (`stage6_credit.tree`) is such a row too, with V that\n      tree; a credited\
  \ row without it is passed over and the scan goes on to older rows.\n  (c) NET DELTA\
  \ INERT — `V..HEAD`, tree to tree with rename detection OFF, is inert: code from\
  \ ANY\n      commit after V — a raw commit, a `--no-tests` land, a merge's second\
  \ parent, a rename into an\n      inert dir — is in it, and so is a `tests/verify-durations.json`\
  \ rewrite. ONE exemption, for\n      that table alone: it is COVERED, and leaves\
  \ (c) and (d), when its bytes at HEAD are exactly\n      the table a land's bookkeeping\
  \ commit wrote after the tail tripwire ran the table's\n      readers GREEN on them.\
  \ Proven from git and the journal together, all of: C, the newest commit\n     \
  \ reaching HEAD that touched the table, has one parent, is on `main` (an ancestor\
  \ of the merged\n      base) and is titled `land: bookkeeping (<branch>)`; HEAD's\
  \ table blob is C's; C's own journal\n      diff adds that branch's ok `land_completed`\
  \ row whose `verify_table_refresh` records the write\n      (`written` true) with\
  \ tripwire `ok` true and reason `green`; and `C..HEAD` is inert. Any other\n   \
  \   table bytes — a hand or branch edit, a withheld or red tripwire, no such row\
  \ — stay in (c).\n  (d) NO READER — no test file in any declared test dir names\
  \ a changed readable path of (c) by\n      basename (the reader derivation), so\
  \ an earlier skip's card still unverified since V\n      is checked too. A readable\
  \ path is any path but the journal, its archive segments and the\n      generated\
  \ graph views: every land rebuilds those views from the merged sources, and a\n\
  \      changed source stays in the set. A test that reads a generated view's content\
  \ by\n      id, without naming the source file, is outside this derivation: the\
  \ same bound the lever-B\n      paragraph above names for a test that globs the\
  \ card directory or folds the real journal.\nSoundness rests on CONTENT equality\
  \ to V, never on which row or commit is attributed: a raw commit\nmade between V's\
  \ verify and its row is in (c). Every path enumeration here (and lever B's) runs\
  \ with\n`--no-renames` and keeps each path exactly as git names it, so a rename\
  \ reports its deleted source as well as its new\npath, and the SPEC-0064 classifier\
  \ judges each path EXACTLY (never whitespace-stripped: `\" tasks/x\"`\nis an unknown\
  \ dir, not `tasks/`).\n**A skipped land is still floor-scanned.** The inert first-attempt\
  \ skip withholds the\nsuite, the host-leak canary and the pinned re-run, and nothing\
  \ else: on a consumer build the\nSPEC-0163 any-author land floor runs over the same\
  \ branch delta as on a verifying land, and its\nrefusal aborts the land with `main`\
  \ untouched. An inert-only diff is never landed unscanned.\n**The Stage-6 credit\
  \ (`reverify_skip_reason: stage6-credit`).** A land none of whose attempts\nhas\
  \ verified, not declaring a rebaseline, MAY take its CANDIDATE-leg verdict from\
  \ the task's own\nStage-6 run instead of running the candidate verify again. Unlike\
  \ every skip above it applies to an\nOBSERVABLE branch delta: what makes it sound\
  \ is that the very tree the land is about to fast-forward\nwas already tested, on\
  \ the very `main` it fast-forwards onto — so `main` still never advances to a\n\
  combination whose verification was not green. The land proves ALL FIVE conditions\
  \ itself (nothing is\ntaken on the worker's word), and any unproven part, or any\
  \ error, means the candidate verify\n(fail-closed):\n  (1) MAIN HAS NOT MOVED, OR\
  \ MOVED ONLY INERTLY — the branch contains `main`'s tip, and the base the\n    \
  \  run recorded (the branch's merge-base with `main` at the run) IS that tip; or\
  \ `main` advanced\n      since the run and keeps the credit only when that advance\
  \ — main's OWN delta between the\n      recorded base and the tip, never the branch's\
  \ — is inert by the ONE SPEC-0064 authority AND no\n      declared test file names\
  \ a changed readable path of it (the reader derivation of condition\n      (d) above).\
  \ Any other advance ends the credit: an observable path, a card a test\n      names,\
  \ a rewrite of the verify duration table (a test-directory path, so never inert),\
  \ or a\n      delta that cannot be read.\n      **The post-sync-proof arm (owner,\
  \ events.jsonl#ts= and\n      events.jsonl#ts=).** Where (1) fails, the land MAY\
  \ still credit the run when\n      the card was synced with `main` after it and\
  \ that sync's post-sync proof passed (SPEC-0152 rule\n      16 §post_sync_set: the\
  \ merged tree is the tested tree plus main's own advance, and the declared\n   \
  \   quick set ran green on it). The proof stands in for the run's base when ALL\
  \ of these hold — any\n      unproven part, or any error, keeps the refusal (fail-closed),\
  \ naming the proof's reason on the\n      `main-moved` delta when a passed proof\
  \ existed:\n        (a) it is the NEWEST post-sync proof recorded for this card\
  \ and branch — in each of main's\n            and the worktree's bounded journal\
  \ tails, by journal order; two journals whose newest\n            differ at the\
  \ same time are ambiguous and refuse — and it says `passed`: a later failed\n  \
  \          or ineligible proof is never bypassed by an older passed one;\n     \
  \   (b) it judged the Stage-6 row (3) proves — the same row time, tested tree and\
  \ base;\n        (c) its merged tree resolves and its base is on the `main` this\
  \ attempt merged;\n        (d) `main`'s advance past the proof's base is judged\
  \ STEP BY STEP along main's own ref log,\n            one step per update of `main`\
  \ (a land's fast-forward, a direct commit): each step is\n            inert by the\
  \ ONE SPEC-0064 authority, or is the fast-forward of a land whose OWN ok\n     \
  \       `land_completed` row records `reverify_skipped: true` — read off the row,\
  \ never\n            re-derived — so a land is exempt for its own step only. Any\
  \ other step (a verified land's\n            non-inert change, a direct commit of\
  \ code) refuses, and so does a log that no longer\n            reaches the proof's\
  \ base, has a gap (an entry whose old value is not the previous\n            entry's\
  \ new one) or rewinds between it and the merged tip;\n        (e) the land's candidate\
  \ tree differs from the proof's tree only by inert paths, or by paths\n        \
  \    such a verify-exempt land brought whose content the candidate still holds as\
  \ `main` has it;\n        (f) no declared test names an inert readable path of (d)\
  \ or (e) (the reader derivation above).\n      Conditions (3), (4) and (5) still\
  \ hold and (2) is replaced by (e). The facts taken from the\n      rows are that\
  \ the quick set ran green and which land skipped its verify; both keys\n      (`post_sync_proof`,\
  \ `reverify_skipped`) are reserved, so the hand `event` route refuses them.\n  (2)\
  \ THE SAME TREE — the land's candidate tree differs from the tree the run recorded\
  \ only by inert\n      paths (the ONE SPEC-0064 authority, tree to tree with renames\
  \ off — the closure bookkeeping a\n      branch adds after its tests), and no declared\
  \ test file names a changed readable path\n      (condition (d) above). The comparison\
  \ is the land's own, from git.\n  (3) A RUNNER'S ROW — the NEWEST Stage-6 verdict\
  \ row of that task is green and carries the mark only\n      the runner of a measured\
  \ run writes (`stage6_run`: the tree it tested and the base it sat on).\n      The\
  \ mark is RESERVED: the hand event route refuses it, a hand-recorded evidence row\
  \ carries\n      none, and a red run writes a different row — so a red, a hand-recorded\
  \ or an unmarked newest\n      row is never credited. The runner records a tree\
  \ only when the files on disk after the run are\n      that tree apart from the\
  \ journal's own growth and, on a routed run, the venue reports having\n      tested\
  \ that tree. A failed run's row may carry the same mark; it is still a red row,\n\
  \      refused as red before the mark is read.\n  (4) THE RUN COVERS THE LAND —\
  \ where the land would sweep a declared test directory the run must\n      have\
  \ swept ALL of it, or have run exactly the set the land's own sweep would run: a\
  \ narrowed\n      run records the set it selected, and the land computes its own\
  \ selection for the tree it would\n      verify — the same SPEC-0181 selector over\
  \ its merged-tree delta, its governor reading `main`'s\n      journal, a pre-deploy\
  \ skip set taken out of both sets after the skip-set equality below — and\n    \
  \  credits the run only when the two sets, compared whole (the always-run files\
  \ included, never\n      a count) at the same selection rule version, are EQUAL.\
  \ A narrowed row that records counts\n      only is a PARTIAL run and refuses `run-narrowed`;\
  \ a land that cannot compute its own selection\n      refuses `run-narrowed-set-unknown`;\
  \ unequal sets refuse `run-narrowed-set-differs`. On a\n      consumer every declared\
  \ layer must have passed in the run,\n      or have been subject-skipped there AND\
  \ be skipped by the land's own decision. A layer whose\n      row in the run records\
  \ a PARTIAL run (SPEC-1030: a deciding selection left units out, a\n      deciding\
  \ credit reused passes) is the one case with a rule of its own: when the land takes\n\
  \      such a row and when it refuses it is SPEC-1030 rule 6 (`bin/yitc-v2 graph\
  \ query SPEC-1030`),\n      not restated here. Where a pre-deploy class lists its\
  \ units, the run also covers the land only\n      when the skip set the land computes\
  \ equals the one the run recorded (SPEC-1051 rule 2).\n  (5) THE REST OF THE LAND\
  \ STILL RUNS — the credit replaces the candidate leg and nothing else. The\n   \
  \   SPEC-0163 any-author floor runs over the same branch delta and its refusal aborts\
  \ the land with\n      `main` untouched; the host-leak check runs; and the SPEC-0077\
  \ pinned leg runs exactly when its\n      trigger and the project's policy (SPEC-0186)\
  \ say so — the credit neither reads nor moves\n      either. Where the pinned leg\
  \ is due the head is verified ALONE (no batch is formed onto a\n      credited tree)\
  \ and a pinned failure refuses the land as on any other.\nA project MAY switch the\
  \ credit off (`verify_policy.stage6_credit`, SPEC-0186 rule 10); absent a\ndeclaration\
  \ it is ON, for the engine as for a consumer. Every credited land records WHICH\
  \ Stage-6 row\nit credited (`land_completed.stage6_credit`) — on the post-sync-proof\
  \ arm also the proof it took\n(`stage6_credit.post_sync_proof`: its row time, tree,\
  \ base and quick set, the verify-exempt lands it\npassed over, and main's advance\
  \ past its base) — and the tree that run tested (`stage6_credit.tree`),\nwhich anchors\
  \ a later inert first-attempt skip ((b)). A retry re-proves from scratch against\
  \ the\n`main` it then merged: (1) holds only while\nmain's whole advance since the\
  \ run is still inert and named by no test, or while the post-sync-proof\narm still\
  \ holds for that attempt; else the candidate verify runs.\nA land that REFUSED the\
  \ credit to a runner-marked green newest Stage-6 row records WHY\n(`land_completed.stage6_credit_refused`\
  \ — the one reason of the condition that failed, `main-moved`\nfor (1)), so what\
  \ each condition costs is counted from the journal. The key means «a\ncredit was\
  \ possible and was refused», never «no credit»: a land with no Stage-6 row, a red\
  \ or an\nunmarked newest row, an opted-out project, an error inside the proof, or\
  \ one this step is not\nasked on records neither key. It is the land's, not one\
  \ attempt's — a retry that is not asked\nagain keeps it. A `main-moved` refusal\
  \ also records what main's OWN advance since the run touched\n: that delta — never\
  \ the branch's — classified by the SPEC-0064 authority as inert,\nobservable or\
  \ unknown, with its path count and its first 20 paths by name, and unknown (never\
  \ inert) whenever it cannot be read; an\ninert advance refused because a test names\
  \ it also records that reader. A CREDITED land over an\ninert advance records, with\
  \ the credited row, the advance it accepted, so the journal\ncounts how often that\
  \ arm fires.\n**The per-layer case of a tree difference.** When condition (2) is\
  \ what failed, for a path\nthat is not inert — conditions (1) and (3) proven as\
  \ above — or when condition (1) failed on a\n`main` advance that is readable and\
  \ not inert, condition (3) proven (an inert advance a test names,\nor one that cannot\
  \ be read, keeps the whole candidate verify), and the project declares verify\n\
  layers, the candidate verify still runs, and the land MAY take the verdict of one\
  \ or more declared\nlayers from the run instead of running them again. This is a\
  \ permission with conditions: a land\nthat takes no layer's verdict from the run\
  \ is not touched by any of it and runs its candidate\nverify as it did before this\
  \ case existed. On a land that takes it, each declared layer falls\nunder exactly\
  \ one of three rules:\n  (A) IT TAKES ITS VERDICT FROM THE RUN instead of running\
  \ again, when ALL of these hold; any\n      unproven part, or any error, sends it\
  \ to (C) (fail-closed):\n      (i) it passed WHOLE in the run — the row records\
  \ exactly one outcome for that layer, it is\n            a pass, and it is not the\
  \ row of a partial run (SPEC-1030 rule 5's `passed-partial`, or\n            an\
  \ adapter record marked partial);\n      (ii) nothing in its subject changed since\
  \ — its declared subject is disjoint from every path\n            that differs between\
  \ the tested tree and the candidate tree, the journal and the\n            closure\
  \ bookkeeping included, by the predicate the land's own subject skip uses\n    \
  \        (SPEC-0152 rule 16); a layer that declares no subject never qualifies;\n\
  \      (iii) the verifier's own surface did not change since — that difference meets\
  \ none of the\n            fail-closed edges of the land's own subject skip (SPEC-0152\
  \ rule 16: the verifier's own\n            surface, the project's verify declaration,\
  \ a check surface a layer declares), taken\n            WITHOUT that skip's section-aware\
  \ narrowing, and with its ownership-aware narrowing only\n            for a LEAF\
  \ test file — a changed test path that narrowing frees, which sits directly in\n\
  \            the test directory, is not `conftest.py` or `__init__.py`, is in the\
  \ candidate tree, and\n            is not imported by another file of that directory\
  \ — no file names it beside an import of\n            it or beside any load of a\
  \ module by path: such a path is no edge, and (ii) judges it —\n            the\
  \ layers whose subject holds it run, the others may take the run's verdict; every\n\
  \            other test path is an edge. A test file loaded by a path that names\
  \ no test file is a\n            shared one as the project declares it (`verify.infra_globs`),\
  \ as for that skip;\n      (iv) it is declared unambiguously — its name is declared\
  \ once, and it is not the layer the\n            test sweep is delegated to (that\
  \ layer stands in for the sweep);\n      (v) when it is backed by a report adapter\
  \ (<workshop-spec>), that difference meets none of the\n            adapter's declared\
  \ `sources` (<workshop-spec> rule 6 — a change there runs the layer whatever\n \
  \           its subject), and its adapter declaration reads well-formed.\n    A\
  \ layer that takes its verdict from the run under (A) does not run, so no adapter\
  \ selection,\n    attempt record or credit (<workshop-spec>, SPEC-1030 rule 3) is\
  \ taken for it at this land; a layer\n    that runs keeps its adapter selection\
  \ and credit exactly as on any land.\n  (B) IT RUNS WHATEVER ITS SUBJECT when it\
  \ did not pass whole in the run — failed, skipped, partial or unrecorded\n     \
  \ there. This is the condition of leaning on the run at all: the run holds no verdict\
  \ for such\n      a layer, so on a land that takes another layer's verdict from\
  \ that run the land's own subject\n      skip does not apply to it — it runs even\
  \ where the candidate diff is disjoint from its\n      subject. (A layer the project\
  \ waives stays waived: a waiver is the project's declaration, not\n      a verdict.)\n\
  \  (C) OTHERWISE IT IS JUDGED AS ON ANY LAND — by the land's own subject skip over\
  \ the candidate\n      diff, recorded as before.\nThe test-directory sweep is outside\
  \ all three: the land sweeps exactly what it would sweep with no\nStage-6 row at\
  \ all, so a project that declares no layers (the engine) keeps its whole candidate\n\
  verify. Condition (5) holds unchanged, and a project that switched the credit off\
  \ has switched this\ncase off too. A land that takes this case is NOT a credited\
  \ land — its re-verify is not skipped —\nand it is LESS than the land's own candidate\
  \ verify: its head forms alone, it records no tested\ntree (so it never anchors\
  \ (b)), and it is not the earlier verify lever B leans on — a retry\nre-proves from\
  \ scratch. It records its refusal reason (`tree-differs:` or `main-moved`), the\
  \ Stage-6 row its layers\nwere judged against, the layers that took that row's verdict\
  \ (each also by its own outcome) and\nthe layers it ran. A `main-moved` refusal\
  \ over a readable advance that is not inert also records,\nfor every declared layer,\
  \ `credited` or the FIRST condition that kept it from the run's verdict\n(`rerun:<reason>`:\
  \ a fail-closed edge of (iii), which names every layer alike, or the condition of\n\
  (i), (ii), (iv) or (v) that failed) — whether or not any layer took the run's verdict.\
  \ `rerun`\nsays only that the run's verdict was not taken; the layer is then judged\
  \ under (B) or (C). The\ndifference judged is the tested tree against the candidate\
  \ tree, so it carries the branch's own\ncommits since the run as well as `main`'s\
  \ advance: the moved paths of that advance are not the\nset the layers are judged\
  \ by. Where more paths moved than the record names, it says how many it\nleaves\
  \ out. Soundness of (A): such a layer passed on the\ntested tree, and by the project's\
  \ own declaration nothing that\nlayer reads differs between that tree and the one\
  \ about to fast-forward — the premise SPEC-0152\nrule 16 already rests on for a\
  \ layer disjoint from the candidate diff. It is NOT a credit over the\nspec status\
  \ lines a closing card's activation writes: those are an observable difference like\
  \ any\nother, and every layer whose subject holds them runs on the tree that carries\
  \ them.\n**The per-layer case on a retry.** An attempt of a land discarded because\
  \ `main` advanced\npast its merge base by a path the in-lock fold does not take\
  \ (`retry-main-advanced`), whose own\ncandidate verify passed and recorded the tree\
  \ it tested on the terms of (b), leaves that tree and\nits per-layer outcome trail\
  \ to the land; a later attempt that records its own tree replaces them,\nand one\
  \ that takes this case leaves them in place for any retry after it.\nA later attempt\
  \ of the same land that runs its candidate verify, declares no rebaseline and was\n\
  not asked the Stage-6 credit MAY take the per-layer case against that attempt in\
  \ place of a\nStage-6 row: (A) to (C) apply with the attempt's trail as the run\
  \ and the difference between its\ntree and the candidate tree — which carries `main`'s\
  \ advance — as the difference, with one change\nto (B): a layer the attempt's own\
  \ subject skip skipped is judged under (C), since that skip was\nthis land's own\
  \ decision on its own branch delta, not a run's. The opt-out switches it off too.\n\
  Such an attempt records which attempt and tree its layers were judged against, the\
  \ layers that\ntook that attempt's verdict and the layers it ran, in place of the\
  \ Stage-6 row; like the case\nabove it forms alone and records no tested tree.\n\
  **Residuals, stated:** the runner's mark is as trustworthy as every other journal\
  \ row a land reads\n(the anchor row of (b) included): it closes the governed hand\
  \ route, not a raw write to the journal\nfile, which no verb performs. V was verified\
  \ by its own land's candidate selection — the same last-green\npremise SPEC-0077's\
  \ pinned leg and lever B already rest on; tests that GLOB `tasks/` or read the real\n\
  journal are not caught by (d) — the owner-accepted residual (events.jsonl#ts=);\n\
  untracked files an ignore rule matches are outside the local tested-tree comparison\
  \ of (b), as\nthey are outside the tree a venue ship carries.\n\n**`reverify_skipped`\
  \ has a SECOND producer (SPEC-0184 rule 8) — this rule is unchanged.**\nA reader\
  \ who took that field to imply \"an inert concurrency retry\" would now be reading\
  \ a silent\ncontradiction, so it is named here rather than left to drift. SPEC-0184\
  \ rule 8 skips the verify for a\nSUPERSEDED BATCH MEMBER — a land carrying nothing\
  \ not already in `main` — on a strictly narrower\ncondition than lever B (no commits\
  \ at all, not merely an inert tree), and it reuses this telemetry\ncarrier rather\
  \ than adding a parallel one. The two are discriminated by `reverify_skip_reason`\n\
  (`inert-retry-delta` here, `superseded-nothing-to-integrate` there). Nothing about\
  \ lever B's own\n`attempt > 1` bound, its classification, or its fail-closed direction\
  \ is altered by that rule.\n\n## Parameters\n\nNone. The inert/observable boundary\
  \ is owned by SPEC-0064 (cited, not duplicated — P5).\n\n## Rationale\n\nWorst-case\
  \ land 457s = full re-verify on each concurrency retry; ~79% of ships (and thus\
  \ most\nconcurrent retries) carry only inert deltas (2026-06-09 telemetry, plan\n\
  `speed-up-land-under-concurrency-inert-retry-re-ver`). The fail-closed observability\
  \ framing is the\nload-bearing safety condition (external audits cited in SPEC-0064\
  \ + the plan).\n\nReadable paths : every land rebuilds the graph index, and its\
  \ bare file name occurs in\n264 test files, nearly all fixture indexes. Read by\
  \ basename, it ended the Stage-6 credit for all\n9 inert main advances of 2026-10-07..14\
  \ (about 135 verify-minutes). An on-demand consult chose to\ncut the generated graph\
  \ views and state the id-keyed bound, over matching the repo-relative path\n(88\
  \ test files carry it) and over matching card ids (each card's own test names its\
  \ id).\n\nThe per-layer case on a retry (public issue 107): one consumer measured\
  \ 5 attempts\ndiscarded as `retry-main-advanced`, about 40 verify-minutes, one card\
  \ landing on its third\nfull ~9-minute verify. An on-demand consult chose amending\
  \ this section in place over a successor\nspec and over leaving the text behind\
  \ the code (decisions/-audit-consult-on-demand.yaml).\n\nThe per-layer record :\
  \ in the 20 `main-moved` lands of <project> and <project> after the\nper-layer case\
  \ reached that refusal (2026-10-14..16), no layer took the run's verdict, and the\
  \ row\ncould not say why. A replay of the split over each land's real difference\
  \ found the conditions\nworking as written: in <project> every one of its 8 layers\
  \ declares `specs/**`, `backend/tests/**`\nand `bin/**` in its subject, which nearly\
  \ every card's closure or test writes, or the project's\nverify declaration moved;\
  \ in <project> the difference always held a `tests/` path, the fail-closed\nedge\
  \ of (iii). The moved-path list had suggested untouched layers because it shows\
  \ `main`'s\nadvance only, without the branch's own commits since the run.\n\nThe\
  \ narrowed-run arm of (4) (owner, events.jsonl#ts=: as in the\nprojects, the test\
  \ set at the run and at the land is one and the same, and a land accepts a\nnarrowed\
  \ run). Measured: after the land-admission queue switched on, no kernel task land\
  \ took the\ncredit; Stage-6 run selected 962 of 2471 files and recorded counts only,\
  \ so its land\nrefused `run-narrowed` and ran the same 962 files again on the venue\
  \ (338.9 s of verify). The land's\nown row counts 953 selected beside 21 always-run\
  \ files that partly overlap them, which is why the\ntwo sets are compared whole\
  \ and never by a count.\n\nThe credited anchor of (b). On 2026-10-27 the filing\
  \ branch of the repair card for a red\nmain (one task card and journal rows) was\
  \ admitted by SPEC-0181 rule 8 and still ran the full verify\ntwice (events.jsonl#ts=,\
  \ #ts=), aborting on main's broken\ntest: the skip answered `observable-since-anchor:bin`.\
  \ The newest land that verified was 2026-10-26\n21:41Z; the eight lands after it\
  \ were Stage-6 credits carrying `bin/` code, and while main is known\nbroken no\
  \ land that verifies can pass, so the anchor could only age. With the newest credited\n\
  land's tested tree as V the same proof passed (9 inert paths, read by no test).\n\
  \nThe covered table of (c). On 2026-10-29 a cards-only filing batch ran a 117-file\
  \ verify\nand aborted on main's red (events.jsonl#ts=): its anchor was the credited\n\
  \ tree, and that land's own bookkeeping commit had then rewritten the table (coverage,\
  \ tail\ntripwire ok/green), so the skip answered `observable-since-anchor:tests`.\
  \ Of 480 ok lands since\n2026-10-22, 148 rewrote the table, each leaving every filing\
  \ batch a full verify until the next\nverified land. The proof the skip lacked already\
  \ existed: the tripwire ran the table's readers on\nthe written bytes before the\
  \ write was admitted.\n\n## Verification\nThe covered table of §Bound (c): a cards-only\
  \ branch skips when the anchor land's bookkeeping wrote\nthe table under a green\
  \ tripwire, and verifies on a hand edit, a withheld, red or non-green\ntripwire,\
  \ a missing or foreign row, a non-bookkeeping writer, a tests/ change after the\
  \ write (also\none reverted to V's bytes), and a branch editing the table\n(tests/test_t14344_bookkeeping_table_covered_by_tripwire.py).\n\
  \nBehavioural probe (the load-bearing safety test): during a land's verify window,\
  \ force the retry\nbranch with a concurrent sibling land (the sibling is what MAKES\
  \ `main` advance; its own content is\nheld INERT throughout and is not the subject).\
  \ What varies is the LANDING branch's OWN footprint —\nthe delta this rule classifies:\
  \ (i) INERT → the retry SKIPS re-verify AND ff's correctly; (ii)\nOBSERVABLE → the\
  \ retry RE-RUNS the full verify before ff; (iii) classifier raises → fail-closed,\
  \ full\nre-verify. Telemetry: `land_completed`\ncarries `reverify_skipped` (bool)\
  \ + reason, so every skip is journal-visible (Principle 8 — never\nsilent). Seam:\
  \ the existing `_after_verify_hook` deterministically drives the retry branch.\n\
  \nStage-6 credit probes (one per condition, each differing from the credited fixture\
  \ by that\none thing): a consumer land after the REAL runner's green run on the\
  \ same tree, `main` unmoved, runs\nno candidate sweep and no layer, records `stage6-credit`\
  \ and names the row it credited — and with the\ncredit removed the same land runs\
  \ both. The candidate verify runs when `main` moved since the run, a\nnon-inert\
  \ path differs, the newest row is red, narrowed with counts only, or unmarked, a\
  \ declared\nlayer is uncovered, a\ntest names a card changed since the run, a rebaseline\
  \ is declared, or the project opted out; the hand\nevent route refuses the mark.\
  \ Refusal-reason probes : the land after `main` advanced records\n`stage6_credit_refused:\
  \ main-moved` and its credited twin records none; each other refusal of a\nmarked\
  \ green row records its own reason; a hand row, a red newest row, no row, an opted-out\
  \ project\nand a declared rebaseline record none — and a writer stamping every uncredited\
  \ land is told apart\nby those arms. Main-delta probes : an inert-only advance is\
  \ still refused and records\n«inert» with its count; an observable advance records\
  \ «observable»; an unreadable delta records\n«unknown», never «inert»; the branch's\
  \ own delta is observable, so a reader of it is told apart;\nthe credited twin and\
  \ a non-`main-moved` refusal record none. A credited land carrying a credential\
  \ is refused by the floor with\n`main` untouched, and its clean twin calls the host-leak\
  \ verdict. Under a verify-path touch with the\npinned leg due, the credited land\
  \ still runs the pinned leg once and aborts on its failure.\nNarrowed-run probes\
  \ (a kernel fixture declaring no layers, the REAL runner's narrowed\ngreen run,\
  \ the REAL land judge, tests/test_t14228_narrowed_stage6_credit.py): a recorded\
  \ set equal\nto the land's own selection is credited (`stage6-credit`, no candidate\
  \ sweep); one file differing\nrefuses `run-narrowed-set-differs`, a counts-only\
  \ row `run-narrowed`, a land whose selection would\nrun every file (its governor\
  \ off) `run-narrowed-set-differs` and a selection the land cannot compute\n`run-narrowed-set-unknown`\
  \ — each running the candidate sweep; both credit arms (the unmoved one\nand the\
  \ post-sync-proof one) hand the judge the main checkout and the inert authority.\n\
  \nPer-layer probes (three declared layers of disjoint subjects, the REAL runner's\
  \ green run,\nthe real layer runner and the real sweep, each command and each swept\
  \ file leaving its own mark): a\nlater change under ONE layer's subject makes the\
  \ land execute that layer and the sweep and neither\nother layer, and its row names\
  \ the refusal, the Stage-6 row, the layers that took its verdict and\nthe layers\
  \ run — where before the change all three ran. That layer made red after the run\
  \ aborts\nthe land with `main` untouched. A layer the real run SKIPPED (its subject\
  \ untouched by the branch,\nso the land's own subject skip would skip it again)\
  \ executes at a land that takes a sibling's\nverdict from the run, and so does a\
  \ layer whose run outcome is failed, absent, doubled or not a\npass; at a land with\
  \ no layer to credit that same skipped layer stays skipped, as before. A test\n\
  path, the verify declaration or a declared check surface in the difference, a layer\
  \ with no\ndeclared subject, the layer carrying the delegated sweep, an opted-out\
  \ project and an inert `main`\nadvance a test names take no verdict from the run;\
  \ an inert `main` advance keeps the case and is\nrecorded with it; an observable\
  \ `main` advance keeps it too — a layer whose subject the advance\ntouches runs,\
  \ the others take the run's verdict, the refusal stays `main-moved` and the row\
  \ names\nthe moved paths (tests/test_t13936_stage6_layer_credit_main_moved.py);\
  \ with no branch change since\nthe run and an advance under one layer's subject,\
  \ that layer alone runs and the row maps it\n`rerun:globs-touched` and both others\
  \ `credited`, a test-path advance maps every layer to the\nshared edge, a subject\
  \ every layer shares maps every layer `globs-touched`, each per-layer condition\n\
  maps to its own reason, an error leaves no map, and a 25-path advance records 5\
  \ paths left out\n(tests/test_t13936_stage6_layer_credit_main_moved.py); a retry\
  \ after an attempt that took\nverdicts from the Stage-6 run re-proves; a\nretry\
  \ after an attempt that verified every layer itself takes that attempt's verdict\
  \ for each layer\nthe advance does not reach, re-runs the one it does, and leaves\
  \ a layer that attempt subject-skipped\nto its own skip (tests/test_t13950_retry_layer_credit.py);\
  \ a land that took a verdict from the\nrun records no tested tree and forms alone,\
  \ and one that took none does neither.\n\n## Drift review\n\n (2026-06-09): re-verified\
  \ this body against `bin/lib/worktree.py#_land_integrate` step-4a. The\n`attempt\
  \ > 1` retry gate, the FINAL merged-tree classification via `_classify_inert_paths(\n\
  _merged_tree_delta_paths(W, merged_base))`, the `reverify_skipped` / `do_test_verify`\
  \ gating of the\ntest suite + canary, and the fail-closed observable/classifier-raised\
  \ → re-verify path all match the\nspec as written. The graph last-touch flag was\
  \ a region shift only (later land-bookkeeping commits\nmoved the `_land_integrate`\
  \ symbol). No semantic drift; this re-touch clears the possibly-stale flag. Re-verified\
  \ again at : that change only tagged the 8 abort-path `_die` sites in `_land_integrate`\
  \ with a structured `abort_class` (the repeated-abort backstop) — ORTHOGONAL to\
  \ this spec's success-path inert re-verify-skip logic; no semantic drift, this re-touch\
  \ clears the possibly-stale flag.\n"
