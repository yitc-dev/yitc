id: SPEC-0065
title: Land inert-retry re-verify skip — an inert concurrency retry fast-forwards
  without re-running verify
status: active
created_at: 2026-06-09 10:14:30+00:00
consumed: false
implements:
- bin/lib/worktree.py#_land_integrate
- bin/lib/worktree.py#_land_stage6_credit
- bin/lib/worktree.py#_stage6_run_record
body: "## Scenario\n\nUnder concurrent sessions, land's optimistic-concurrency retry\
  \ re-runs the FULL verify every time\n`main` advanced during its verify window —\
  \ even when the attempt is re-merging onto a `main` tip\nthat is itself already\
  \ green, and its own change is non-executable. That repeated ~96s verify is\nthe\
  \ worst-case 457s land. When the delta this attempt is about to fast-forward — the\
  \ landing\nbranch's OWN change on top of the freshly merged `main` tip — is nothing\
  \ the verification\nenvironment observes, re-verifying proves nothing new. This\
  \ rule lets such a retry fast-forward\nwithout re-verifying — and ONLY such a retry,\
  \ apart from the two first-attempt proofs §Bound states\nseparately: the inert first-attempt\
  \ skip and the Stage-6 credit.\n\n## Internal\n\nLAND INERT-RETRY RE-VERIFY SKIP.\
  \ On a land retry (the in-lock HEAD re-check found `main` advanced\npast the merged\
  \ base, so the attempt re-merges newer `main`):\n\n- Classify **the delta this attempt's\
  \ ff is about to apply** — `merged_base..HEAD`, the landing\n  branch's OWN delta\
  \ on top of the `main` tip this attempt merged — with the inert-path classifier\n\
  \  (SPEC-0064 §3: one authority AND one evaluation point). It is never the initial\
  \ branch diff, and\n  never the set of paths newer `main` brought in — that content\
  \ cancels out of this diff, being\n  present in both `merged_base` and `HEAD`.\n\
  - **Delta INERT → MAY skip the full re-verify** for this retry and proceed to the\
  \ ff. `main`\n  advances ONLY via a green land, so `merged_base` is itself already\
  \ verified; an inert branch\n  delta on top of it changes nothing the suite or canary\
  \ executes or observes, so the merged\n  result is verification-equivalent to that\
  \ already-green base and its verdict still holds.\n- **Delta OBSERVABLE (or classifier\
  \ unavailable) → MUST re-run the full verify** before ff — exactly\n  today's behaviour.\
  \ Fail-closed: anything not provably inert re-verifies.\n\n### Safety — \"never\
  \ ff an untested combination\" is preserved, not weakened\nThe land safety contract\
  \ is that `main` never fast-forwards to a combination whose verification was\nnot\
  \ green. This rule does NOT relax it: it asserts that an INERT delta-about-to-ff\
  \ yields the SAME\nverification verdict as the already-green `merged_base` it sits\
  \ on (between that base and the merged\ntree the executed code / tests / config\
  \ / fixtures are byte-identical; only unobserved\nartifact/journal/derived content\
  \ differs), so the combination is not \"untested\" — it is\nverification-equivalent\
  \ to a tree that already passed. The skip is therefore\nan optimization that removes\
  \ provably-redundant work, never a relaxation of the green-before-ff gate.\n\n###\
  \ Bound\nThe decision is per-retry: a later retry whose delta is observable re-verifies\
  \ regardless of earlier\ninert retries. The skip never persists across an observable\
  \ change.\n\n**Why attempt 1 was pinned out, and what lever B leans on.** The original\
  \ card scoped this\nlever to concurrency retries, and on a retry an EARLIER attempt\
  \ of the same land had already run the\nfull verify over the branch's own bytes.\
  \ That earlier verify is a real backstop, not a formality:\nSPEC-0064 §5's note\
  \ that tests never read the real artifact dirs is not literally true (some tests\n\
  read named real `tasks/` cards, glob `tasks/`, or fold the real journal). So lever\
  \ B now requires\nthat some attempt of this land actually RAN the test verify; a\
  \ land none of whose attempts did takes\nthe first-attempt proof below on every\
  \ attempt instead of leaning on a verify that never happened.\n\n**The inert first-attempt\
  \ skip (`reverify_skip_reason: inert-first-attempt-delta`).** A land\nnone of whose\
  \ attempts has verified, not declaring a rebaseline, MAY skip the suite, the host-leak\n\
  canary and the SPEC-0077 pinned re-run when ALL of these hold — any unproven part,\
  \ or any error,\nmeans the full verify (fail-closed):\n  (a) BRANCH DELTA INERT\
  \ — `merged_base..HEAD` (this lever's own delta) is inert by the ONE SPEC-0064\n\
  \      authority, so `tests/**` and every other observable class in the branch always\
  \ verify.\n  (b) ANCHOR V — the newest ok `land_completed` on main's bounded journal\
  \ tail that actually verified\n      (`reverify_skipped` false, no `no_tests`) recorded\
  \ the tree its GREEN verify tested, and V is a\n      real tree object: the tree\
  \ the venue tested (`verify_metrics.venue_cand_tree`, `venue_outcome`\n      GREEN),\
  \ or the tree a LOCAL candidate verify tested (`verify_metrics.cand_tree`). A\n\
  \      local verify records its tree only when its sweep and its consumer layers\
  \ are green AND the\n      files on disk were exactly HEAD's tree both before and\
  \ after the run — judged from the files\n      themselves, file modes included,\
  \ never from a view a setting can narrow. A row recording neither tree never\n \
  \     anchors (every local row written before, a verify of a dirty worktree); nor\
  \ does a row\n      outside the bound.\n  (c) NET DELTA INERT — `V..HEAD`, tree\
  \ to tree with rename detection OFF, is inert, with NO\n      exemption: code from\
  \ ANY commit after V — a raw commit, a `--no-tests` land, a merge's second\n   \
  \   parent, a rename into an inert dir — is in it, and so is a `tests/verify-durations.json`\n\
  \      rewrite (tests read that table and nothing records which of its bytes a tail\
  \ tripwire\n      validated, so an anchor whose own bookkeeping rewrote it simply\
  \ does not anchor a skip).\n  (d) NO READER — no test file in any declared test\
  \ dir names a changed non-journal path of (c) by\n      basename (the reader derivation),\
  \ so an earlier skip's card still unverified since V\n      is checked too.\nSoundness\
  \ rests on CONTENT equality to V, never on which row or commit is attributed: a\
  \ raw commit\nmade between V's verify and its row is in (c). Every path enumeration\
  \ here (and lever B's) runs with\n`--no-renames` and keeps each path exactly as\
  \ git names it, so a rename reports its deleted source as well as its new\npath,\
  \ and the SPEC-0064 classifier judges each path EXACTLY (never whitespace-stripped:\
  \ `\" tasks/x\"`\nis an unknown dir, not `tasks/`).\n**A skipped land is still floor-scanned.**\
  \ The inert first-attempt skip withholds the\nsuite, the host-leak canary and the\
  \ pinned re-run, and nothing else: on a consumer build the\nSPEC-0163 any-author\
  \ land floor runs over the same branch delta as on a verifying land, and its\nrefusal\
  \ aborts the land with `main` untouched. An inert-only diff is never landed unscanned.\n\
  **The Stage-6 credit (`reverify_skip_reason: stage6-credit`).** A land none of whose\
  \ attempts\nhas verified, not declaring a rebaseline, MAY take its CANDIDATE-leg\
  \ verdict from the task's own\nStage-6 run instead of running the candidate verify\
  \ again. Unlike every skip above it applies to an\nOBSERVABLE branch delta: what\
  \ makes it sound is that the very tree the land is about to fast-forward\nwas already\
  \ tested, on the very `main` it fast-forwards onto — so `main` still never advances\
  \ to a\ncombination whose verification was not green. The land proves ALL FIVE conditions\
  \ itself (nothing is\ntaken on the worker's word), and any unproven part, or any\
  \ error, means the candidate verify\n(fail-closed):\n  (1) MAIN HAS NOT MOVED —\
  \ the branch contains `main`'s tip, and the base the run recorded IS that\n    \
  \  tip. A `main` that advanced since the run, by anything at all, ends the credit.\n\
  \  (2) THE SAME TREE — the land's candidate tree differs from the tree the run recorded\
  \ only by inert\n      paths (the ONE SPEC-0064 authority, tree to tree with renames\
  \ off — the closure bookkeeping a\n      branch adds after its tests), and no declared\
  \ test file names a changed non-journal path\n      (condition (d) above). The comparison\
  \ is the land's own, from git.\n  (3) A RUNNER'S ROW — the NEWEST Stage-6 verdict\
  \ row of that task is green and carries the mark only\n      the runner of a measured\
  \ run writes (`stage6_run`: the tree it tested and the base it sat on).\n      The\
  \ mark is RESERVED: the hand event route refuses it, a hand-recorded evidence row\
  \ carries\n      none, and a red run writes a different row — so a red, a hand-recorded\
  \ or an unmarked newest\n      row is never credited. The runner records a tree\
  \ only when the files on disk after the run are\n      that tree apart from the\
  \ journal's own growth and, on a routed run, the venue reports having\n      tested\
  \ that tree.\n  (4) THE RUN COVERS THE LAND — where the land would sweep a declared\
  \ test directory the run must\n      have swept ALL of it (a narrowed run records\
  \ counts, not names, so it is a PARTIAL run for this\n      purpose and is never\
  \ credited); on a consumer every declared layer must have passed in the run,\n \
  \     or have been subject-skipped there AND be skipped by the land's own decision.\n\
  \  (5) THE REST OF THE LAND STILL RUNS — the credit replaces the candidate leg and\
  \ nothing else. The\n      SPEC-0163 any-author floor runs over the same branch\
  \ delta and its refusal aborts the land with\n      `main` untouched; the host-leak\
  \ check runs; and the SPEC-0077 pinned leg runs exactly when its\n      trigger\
  \ and the project's policy (SPEC-0186) say so — the credit neither reads nor moves\n\
  \      either. Where the pinned leg is due the head is verified ALONE (no batch\
  \ is formed onto a\n      credited tree) and a pinned failure refuses the land as\
  \ on any other.\nA project MAY switch the credit off (`verify_policy.stage6_credit`,\
  \ SPEC-0186 rule 10); absent a\ndeclaration it is ON, for the engine as for a consumer.\
  \ Every credited land records WHICH Stage-6 row\nit credited (`land_completed.stage6_credit`)\
  \ and, having run no candidate verify of its own, records\nno tested tree — so it\
  \ never anchors a later inert first-attempt skip ((b) reads only a land that\nverified).\
  \ A retry re-proves from scratch: `main` moved, so (1) fails and the candidate verify\
  \ runs.\n**Residuals, stated:** the runner's mark is as trustworthy as every other\
  \ journal row a land reads\n(the anchor row of (b) included): it closes the governed\
  \ hand route, not a raw write to the journal\nfile, which no verb performs. V was\
  \ verified by its own land's candidate selection — the same last-green\npremise\
  \ SPEC-0077's pinned leg and lever B already rest on; tests that GLOB `tasks/` or\
  \ read the real\njournal are not caught by (d) — the owner-accepted residual (events.jsonl#ts=);\n\
  untracked files an ignore rule matches are outside the local tested-tree comparison\
  \ of (b), as\nthey are outside the tree a venue ship carries.\n\n**`reverify_skipped`\
  \ has a SECOND producer (SPEC-0184 rule 8) — this rule is unchanged.**\nA reader\
  \ who took that field to imply \"an inert concurrency retry\" would now be reading\
  \ a silent\ncontradiction, so it is named here rather than left to drift. SPEC-0184\
  \ rule 8 skips the verify for a\nSUPERSEDED BATCH MEMBER — a land carrying nothing\
  \ not already in `main` — on a strictly narrower\ncondition than lever B (no commits\
  \ at all, not merely an inert tree), and it reuses this telemetry\ncarrier rather\
  \ than adding a parallel one. The two are discriminated by `reverify_skip_reason`\n\
  (`inert-retry-delta` here, `superseded-nothing-to-integrate` there). Nothing about\
  \ lever B's own\n`attempt > 1` bound, its classification, or its fail-closed direction\
  \ is altered by that rule.\n\n## Parameters\n\nNone. The inert/observable boundary\
  \ is owned by SPEC-0064 (cited, not duplicated — P5).\n\n## Rationale\n\nWorst-case\
  \ land 457s = full re-verify on each concurrency retry; ~79% of ships (and thus\
  \ most\nconcurrent retries) carry only inert deltas (2026-06-09 telemetry, plan\n\
  `speed-up-land-under-concurrency-inert-retry-re-ver`). The fail-closed observability\
  \ framing is the\nload-bearing safety condition (external audits cited in SPEC-0064\
  \ + the plan).\n\n## Verification\n\nBehavioural probe (the load-bearing safety\
  \ test): during a land's verify window, force the retry\nbranch with a concurrent\
  \ sibling land (the sibling is what MAKES `main` advance; its own content is\nheld\
  \ INERT throughout and is not the subject). What varies is the LANDING branch's\
  \ OWN footprint —\nthe delta this rule classifies: (i) INERT → the retry SKIPS re-verify\
  \ AND ff's correctly; (ii)\nOBSERVABLE → the retry RE-RUNS the full verify before\
  \ ff; (iii) classifier raises → fail-closed, full\nre-verify. Telemetry: `land_completed`\n\
  carries `reverify_skipped` (bool) + reason, so every skip is journal-visible (Principle\
  \ 8 — never\nsilent). Seam: the existing `_after_verify_hook` deterministically\
  \ drives the retry branch.\n\nStage-6 credit probes (one per condition, each differing\
  \ from the credited fixture by that\none thing): a consumer land after the REAL\
  \ runner's green run on the same tree, `main` unmoved, runs\nno candidate sweep\
  \ and no layer, records `stage6-credit` and names the row it credited — and with\
  \ the\ncredit removed the same land runs both. The candidate verify runs when `main`\
  \ moved since the run, a\nnon-inert path differs, the newest row is red, narrowed\
  \ or unmarked, a declared layer is uncovered, a\ntest names a card changed since\
  \ the run, a rebaseline is declared, or the project opted out; the hand\nevent route\
  \ refuses the mark. A credited land carrying a credential is refused by the floor\
  \ with\n`main` untouched, and its clean twin calls the host-leak verdict. Under\
  \ a verify-path touch with the\npinned leg due, the credited land still runs the\
  \ pinned leg once and aborts on its failure.\n\n## Drift review\n\n (2026-06-09):\
  \ re-verified this body against `bin/lib/worktree.py#_land_integrate` step-4a. The\n\
  `attempt > 1` retry gate, the FINAL merged-tree classification via `_classify_inert_paths(\n\
  _merged_tree_delta_paths(W, merged_base))`, the `reverify_skipped` / `do_test_verify`\
  \ gating of the\ntest suite + canary, and the fail-closed observable/classifier-raised\
  \ → re-verify path all match the\nspec as written. The graph last-touch flag was\
  \ a region shift only (later land-bookkeeping commits\nmoved the `_land_integrate`\
  \ symbol). No semantic drift; this re-touch clears the possibly-stale flag. Re-verified\
  \ again at : that change only tagged the 8 abort-path `_die` sites in `_land_integrate`\
  \ with a structured `abort_class` (the repeated-abort backstop) — ORTHOGONAL to\
  \ this spec's success-path inert re-verify-skip logic; no semantic drift, this re-touch\
  \ clears the possibly-stale flag.\n"
