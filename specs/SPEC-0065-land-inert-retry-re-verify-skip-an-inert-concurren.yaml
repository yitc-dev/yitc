id: SPEC-0065
title: Land inert-retry re-verify skip — an inert concurrency retry fast-forwards
  without re-running verify
status: active
created_at: 2026-06-09 10:14:30+00:00
consumed: false
implements:
- bin/lib/worktree.py#_land_integrate
body: "## Scenario\n\nUnder concurrent sessions, land's optimistic-concurrency retry\
  \ re-runs the FULL verify every time\n`main` advanced during its verify window —\
  \ even when the attempt is re-merging onto a `main` tip\nthat is itself already\
  \ green, and its own change is non-executable. That repeated ~96s verify is\nthe\
  \ worst-case 457s land. When the delta this attempt is about to fast-forward — the\
  \ landing\nbranch's OWN change on top of the freshly merged `main` tip — is nothing\
  \ the verification\nenvironment observes, re-verifying proves nothing new. This\
  \ rule lets such a retry fast-forward\nwithout re-verifying — and ONLY such a retry,\
  \ apart from the inert first-attempt skip §Bound proves\nseparately.\n\n## Internal\n\
  \nLAND INERT-RETRY RE-VERIFY SKIP. On a land retry (the in-lock HEAD re-check found\
  \ `main` advanced\npast the merged base, so the attempt re-merges newer `main`):\n\
  \n- Classify **the delta this attempt's ff is about to apply** — `merged_base..HEAD`,\
  \ the landing\n  branch's OWN delta on top of the `main` tip this attempt merged\
  \ — with the inert-path classifier\n  (SPEC-0064 §3: one authority AND one evaluation\
  \ point). It is never the initial branch diff, and\n  never the set of paths newer\
  \ `main` brought in — that content cancels out of this diff, being\n  present in\
  \ both `merged_base` and `HEAD`.\n- **Delta INERT → MAY skip the full re-verify**\
  \ for this retry and proceed to the ff. `main`\n  advances ONLY via a green land,\
  \ so `merged_base` is itself already verified; an inert branch\n  delta on top of\
  \ it changes nothing the suite or canary executes or observes, so the merged\n \
  \ result is verification-equivalent to that already-green base and its verdict still\
  \ holds.\n- **Delta OBSERVABLE (or classifier unavailable) → MUST re-run the full\
  \ verify** before ff — exactly\n  today's behaviour. Fail-closed: anything not provably\
  \ inert re-verifies.\n\n### Safety — \"never ff an untested combination\" is preserved,\
  \ not weakened\nThe land safety contract is that `main` never fast-forwards to a\
  \ combination whose verification was\nnot green. This rule does NOT relax it: it\
  \ asserts that an INERT delta-about-to-ff yields the SAME\nverification verdict\
  \ as the already-green `merged_base` it sits on (between that base and the merged\n\
  tree the executed code / tests / config / fixtures are byte-identical; only unobserved\n\
  artifact/journal/derived content differs), so the combination is not \"untested\"\
  \ — it is\nverification-equivalent to a tree that already passed. The skip is therefore\n\
  an optimization that removes provably-redundant work, never a relaxation of the\
  \ green-before-ff gate.\n\n### Bound\nThe decision is per-retry: a later retry whose\
  \ delta is observable re-verifies regardless of earlier\ninert retries. The skip\
  \ never persists across an observable change.\n\n**Why attempt 1 was pinned out,\
  \ and what lever B leans on.** The original card scoped this\nlever to concurrency\
  \ retries, and on a retry an EARLIER attempt of the same land had already run the\n\
  full verify over the branch's own bytes. That earlier verify is a real backstop,\
  \ not a formality:\nSPEC-0064 §5's note that tests never read the real artifact\
  \ dirs is not literally true (some tests\nread named real `tasks/` cards, glob `tasks/`,\
  \ or fold the real journal). So lever B now requires\nthat some attempt of this\
  \ land actually RAN the test verify; a land none of whose attempts did takes\nthe\
  \ first-attempt proof below on every attempt instead of leaning on a verify that\
  \ never happened.\n\n**The inert first-attempt skip (`reverify_skip_reason: inert-first-attempt-delta`).**\
  \ A land\nnone of whose attempts has verified, not declaring a rebaseline, MAY skip\
  \ the suite, the host-leak\ncanary and the SPEC-0077 pinned re-run when ALL of these\
  \ hold — any unproven part, or any error,\nmeans the full verify (fail-closed):\n\
  \  (a) BRANCH DELTA INERT — `merged_base..HEAD` (this lever's own delta) is inert\
  \ by the ONE SPEC-0064\n      authority, so `tests/**` and every other observable\
  \ class in the branch always verify.\n  (b) ANCHOR V — the newest ok `land_completed`\
  \ on main's bounded journal tail that actually verified\n      (`reverify_skipped`\
  \ false, no `no_tests`) recorded the tree the venue tested\n      (`verify_metrics.venue_cand_tree`)\
  \ with `venue_outcome` GREEN, and V is a real tree object. A\n      local verify\
  \ records no tree, so it never anchors; nor does a row outside the bound.\n  (c)\
  \ NET DELTA INERT — `V..HEAD`, tree to tree with rename detection OFF, is inert,\
  \ with NO\n      exemption: code from ANY commit after V — a raw commit, a `--no-tests`\
  \ land, a merge's second\n      parent, a rename into an inert dir — is in it, and\
  \ so is a `tests/verify-durations.json`\n      rewrite (tests read that table and\
  \ nothing records which of its bytes a tail tripwire\n      validated, so an anchor\
  \ whose own bookkeeping rewrote it simply does not anchor a skip).\n  (d) NO READER\
  \ — no test file in any declared test dir names a changed non-journal path of (c)\
  \ by\n      basename (the reader derivation), so an earlier skip's card still unverified\
  \ since V\n      is checked too.\nSoundness rests on CONTENT equality to V, never\
  \ on which row or commit is attributed: a raw commit\nmade between V's verify and\
  \ its row is in (c). Every path enumeration here (and lever B's) runs with\n`--no-renames`\
  \ and keeps each path exactly as git names it, so a rename reports its deleted source\
  \ as well as its new\npath, and the SPEC-0064 classifier judges each path EXACTLY\
  \ (never whitespace-stripped: `\" tasks/x\"`\nis an unknown dir, not `tasks/`).\n\
  **Residuals, stated:** V was verified by its own land's candidate selection — the\
  \ same last-green\npremise SPEC-0077's pinned leg and lever B already rest on; tests\
  \ that GLOB `tasks/` or read the real\njournal are not caught by (d) — the owner-accepted\
  \ residual (events.jsonl#ts=).\n\n**`reverify_skipped` has a SECOND producer (SPEC-0184\
  \ rule 8) — this rule is unchanged.**\nA reader who took that field to imply \"\
  an inert concurrency retry\" would now be reading a silent\ncontradiction, so it\
  \ is named here rather than left to drift. SPEC-0184 rule 8 skips the verify for\
  \ a\nSUPERSEDED BATCH MEMBER — a land carrying nothing not already in `main` — on\
  \ a strictly narrower\ncondition than lever B (no commits at all, not merely an\
  \ inert tree), and it reuses this telemetry\ncarrier rather than adding a parallel\
  \ one. The two are discriminated by `reverify_skip_reason`\n(`inert-retry-delta`\
  \ here, `superseded-nothing-to-integrate` there). Nothing about lever B's own\n\
  `attempt > 1` bound, its classification, or its fail-closed direction is altered\
  \ by that rule.\n\n## Parameters\n\nNone. The inert/observable boundary is owned\
  \ by SPEC-0064 (cited, not duplicated — P5).\n\n## Rationale\n\nWorst-case land\
  \ 457s = full re-verify on each concurrency retry; ~79% of ships (and thus most\n\
  concurrent retries) carry only inert deltas (2026-06-09 telemetry, plan\n`speed-up-land-under-concurrency-inert-retry-re-ver`).\
  \ The fail-closed observability framing is the\nload-bearing safety condition (external\
  \ audits cited in SPEC-0064 + the plan).\n\n## Verification\n\nBehavioural probe\
  \ (the load-bearing safety test): during a land's verify window, force the retry\n\
  branch with a concurrent sibling land (the sibling is what MAKES `main` advance;\
  \ its own content is\nheld INERT throughout and is not the subject). What varies\
  \ is the LANDING branch's OWN footprint —\nthe delta this rule classifies: (i) INERT\
  \ → the retry SKIPS re-verify AND ff's correctly; (ii)\nOBSERVABLE → the retry RE-RUNS\
  \ the full verify before ff; (iii) classifier raises → fail-closed, full\nre-verify.\
  \ Telemetry: `land_completed`\ncarries `reverify_skipped` (bool) + reason, so every\
  \ skip is journal-visible (Principle 8 — never\nsilent). Seam: the existing `_after_verify_hook`\
  \ deterministically drives the retry branch.\n\n## Drift review\n\n (2026-06-09):\
  \ re-verified this body against `bin/lib/worktree.py#_land_integrate` step-4a. The\n\
  `attempt > 1` retry gate, the FINAL merged-tree classification via `_classify_inert_paths(\n\
  _merged_tree_delta_paths(W, merged_base))`, the `reverify_skipped` / `do_test_verify`\
  \ gating of the\ntest suite + canary, and the fail-closed observable/classifier-raised\
  \ → re-verify path all match the\nspec as written. The graph last-touch flag was\
  \ a region shift only (later land-bookkeeping commits\nmoved the `_land_integrate`\
  \ symbol). No semantic drift; this re-touch clears the possibly-stale flag. Re-verified\
  \ again at : that change only tagged the 8 abort-path `_die` sites in `_land_integrate`\
  \ with a structured `abort_class` (the repeated-abort backstop) — ORTHOGONAL to\
  \ this spec's success-path inert re-verify-skip logic; no semantic drift, this re-touch\
  \ clears the possibly-stale flag.\n"
