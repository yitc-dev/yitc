id: SPEC-0006
title: 'Durable spec-code anchors: file/symbol over line numbers + report-not-block
  resolution'
status: active
created_at: 2026-06-01 04:23:28+00:00
consumed: false
implements:
- bin/lib/cli.py#_resolve_implements_anchor
- bin/lib/textutil.py#anchor_file
- bin/lib/cli.py#_anchor_drift_warning
- bin/lib/cli.py#_anchor_content_signature
- bin/lib/spec.py#cmd_spec_reverify
- GRAPH.md#Schema
