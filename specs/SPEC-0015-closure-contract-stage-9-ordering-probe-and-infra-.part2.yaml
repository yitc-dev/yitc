body: "### Audit-stage YAMLs are committed BY `task close`, never a standalone `task\
  \ commit`\nThe `decisions/<task>-audit-pre.yaml` / `-audit-post.yaml` records are\
  \ committed by `task close`\nitself — its closure-record commit (E-0007) folds the\
  \ dirty audit YAML(s) in, because they\nare IN that commit's staging set: the closure\
  \ record stages the task YAML, the journal delta, the\ntask's own audit records\
  \ (`_foldable_audit_records`, incl. the slug-named adhoc verdict) and the\nspec/graph\
  \ updates the closure itself writes — and NOTHING else (a dirty path outside the\
  \ set is\nREPORTED and left in the worktree, behind land's dirt guard). After `audit\
  \ post --commit X` writes the verdict YAML, LEAVE IT DIRTY; do NOT run a\nstandalone\
  \ `task commit` on it. A standalone `task commit` creates a NEW commit Y that becomes\
  \ the\ntask's recorded commit (: recorded = the latest `commit_landed`), shifting\
  \ the recorded commit\nPAST the audited commit X. `task close` then pins audit-post.commit==recorded\
  \ and finds X≠Y, demanding\na re-audit of Y — which an exhausted audit-loop ceiling\
  \ can BLOCK (the closure DEADLOCK,\nE-0008). The closure-record commit does NOT\
  \ have this problem: it runs AFTER the audit-post check, so\nrecorded == the audited\
  \ commit at the moment close verifies it. `cmd_task_commit` enforces this with a\n\
  foot-gun guard (`_audit_commit_shift_hazard`): a standalone `task commit` that would\
  \ stage an\naudit-<stage>.yaml whose verdict commit == the current recorded commit\
  \ is REFUSED, with a hint to\nleave it dirty and run `task close`. (This is an ORDERING\
  \ + foot-gun-guard clarification of the\nexisting chain-of-custody — no new store/event/flag.)\n\
  **CUSTODY IS THE LAST AUTHORED SHIP — a bookkeeping SELF-commit is TRANSPARENT to\
  \ it.**\nThe ONE custody resolver (`audit_custody_commit`, read by `audit decide`\
  \ and by `audit post`'s\ndefault-subject leg) SKIPS `commit_landed` rows whose kind\
  \ is one of the closed three {`park`,\n`pause`, `wont-do`} and resolves the last\
  \ AUTHORED ship instead — under TWO bounds, both fail-closed.\n(i) THE DIFF DECIDES,\
  \ NOT THE KIND: a kinded row is skipped only when its own diff is PROVABLY\nrecord-only,\
  \ asked through the SAME `_bookkeeping_commit_authored_paths` predicate `--repin-ship`\
  \ and\nthe guard ask, so a record commit that SWEPT authored source still moves\
  \ custody (an unwired\nor unanswerable predicate is not proof). (ii) IT NARROWS\
  \ ONLY THE UNLANDED STATE: where the displaced\nship IS an ancestor of `main`, `audit\
  \ post --commit <ship> --repin-ship` is the route and the\nrefusal there is UNCHANGED.\
  \ Both readers ask ONE ancestry predicate (`_git_ship_landed`). An AUTHORED\ncommit\
  \ still moves custody exactly as today, and every CLOSE-TAIL kind stays outside\
  \ the skip set, so\n`task close` folding the dirty audit YAML into its closure-record\
  \ commit goes on being the\nrecorded audited commit. This NARROWS what may be CALLED\
  \ the audited commit; it removes no refusal,\nand it changes nothing about what\
  \ `task pause` commits. `task close` resolves its closure custody through the SAME\
  \ resolver under the SAME two bounds : a trailing proven record-only bookkeeping\
  \ self-commit never displaces the audited ship at close, so `_require_audit_post_for_commit`\
  \ and `--commit` compare against that ship, while a kinded commit carrying an authored\
  \ path keeps custody and the refusal is unchanged. AND `task close` closes ON THE\
  \ SHIP when the RECORDED commit is a RECORD-ONLY revision that PROVABLY CONTAINS\
  \ the ship the audit-post record covers (<project> X-1482): a `--fix-red --card-repair`\
  \ repair is kind-less by design, so the resolver above keeps custody on it, and\
  \ AT the ceiling the one `--on-decisions` pass (SPEC-0204 rule 3) is redirected\
  \ to the SHIP (SPEC-0204 rules 2-3) and pins the GREEN there — closure then read\
  \ its own GREEN as «for another commit» with no pass left to spend. The containment\
  \ is asked of the SAME `_ship_contained_record_only` predicate the redirect asks\
  \ (one computation, CHARTER §P1 F1), honoured only when the ship it names IS the\
  \ record's `commit:`; an unverifiable or non-containing recorded revision leaves\
  \ custody untouched and `_require_audit_post_for_commit` refuses exactly as before.\
  \ Below the ceiling nothing moves: the mandated re-audit pins the GREEN to the repair\
  \ commit itself and custody matches without this leg.\n**AN AMBIGUOUS RECORDED PREFIX\
  \ IS RESOLVED ONLY THROUGH A FULL SHA EXTENDING IT.** Custody\nrows record through\
  \ `audit.recorded_sha` (SPEC-0025 `commit_landed`), so a new row names exactly one\n\
  commit. A row written earlier may carry a 7-character prefix that later COLLIDED\
  \ (<project>).\nWhere the recorded value does not resolve AND names two or more\
  \ objects, `resolve_recorded_commit`\nadmits the full sha of a commit that EXTENDS\
  \ it, and nothing else: `audit post --commit <full sha>`\npasses the equality guard,\
  \ and `task close` pins to `--commit`, else to the audit-post\nrecord's own full\
  \ `commit:`. A bare `audit post` over such a row, and a close with no extending\
  \ sha,\nREFUSE naming the ambiguity and the candidate commits (`unresolved_ref_refusal`)\
  \ instead of «not a\nvalid git ref»; a sha that does not extend the record keeps\
  \ the unchanged refusal. This adds a case\nthe contract did not address — every\
  \ resolvable record behaves exactly as before.\n**THE RULE IS ABOUT DISPLACEMENT,\
  \ NOT ABOUT A DIRTY YAML — the guard has TWO arms.** After a\nmode-a absorption\
  \ the audit YAML is COMMITTED and CLEAN, so the first arm cannot see a later\nbookkeeping-only\
  \ commit that displaces custody. The SECOND arm (`_bookkeeping_only_custody_shift`)\n\
  REFUSES a standalone, NON-`--absorb` `task commit` when the task already HAS a recorded\
  \ commit and\nevery path the commit would stage is lifecycle bookkeeping (the existing\
  \ `_zero_ship_diff_bookkeeping`\nallow-list). A commit carrying AUTHORED content\
  \ is untouched. The first arm is checked FIRST and is\nbyte-unchanged, and the mode-a\
  \ carve-out below — gated on it — never reaches the second arm.\n**The honest bound.**\
  \ The second arm fires only on POSITIVE proof: `_worktree_dirty_paths` returns `[]`\n\
  on ANY git failure, and `git status --porcelain` collapses a wholly-untracked directory\
  \ to a bare\n`decisions/` row the allow-list reads as authored; both unprovable\
  \ shapes leave the arm SILENT — it\nMISSES rather than MISFIRES. A missed displacement\
  \ is covered by the governed RECOVERY route\n. No new store, event, flag or hook.\n\
  **At-closure audit-YAML displacement (SPEC-0052 — non-normative cross-ref):** after\
  \ the\nclosure-record commit, `task close` runs a BEST-EFFORT, non-fatal `git mv`\
  \ of the task's committed\naudit YAMLs into `decisions/archive/`; it does not change\
  \ the ordering / probe / audit-post\nprecondition, and a failure never blocks a\
  \ valid closure. Homed in SPEC-0052.\n\nTHREE sanctioned exceptions carve out of\
  \ the rule above — the Stage-8 mode-a absorption cycle\n, the Stage-8 RED IN-SCOPE-FIX\
  \ leg, and the ship-custody RE-PIN recovery ( —\n§Ship-custody re-pin, further down).\
  \ All three are ADDITIVE, and each is gated on evidence the guard\nitself DERIVES,\
  \ never asserted.\nFIRST sanctioned exception — the Stage-8 mode-a absorption carve-out.\
  \ When an audit-post\nfinding warrants an INLINE fix (mode-a: fix → second ship\
  \ commit → re-audit), `task commit\n--absorb` declares that cycle explicitly: the\
  \ superseded verdict YAML is folded INTO the\nabsorption commit (NEVER hand-deleted\
  \ — deletion zeroes `_count_audit_passes` and silently loses\nthe trail, the 3x-in-one-day\
  \ manual-fallback class), and the REQUIRED follow-up `audit post\n--commit <new>`\
  \ re-pins custody (verdict.commit == recorded) and carries the prior pass into the\n\
  new verdict's `passes_trail:`. The carve-out is gated PRECISELY: only the audit-POST\
  \ hazard state\nqualifies (not audit-pre), and the absorption commit is journal-marked\
  \ (`commit_landed`\n`data.absorption: true`). The INVARIANT is unchanged: `task\
  \ close` still commits the GOVERNING\n(latest-pass) verdict, pinned to the recorded\
  \ commit; a forgotten re-audit after --absorb\nfail-closes at `task close` (audit-post\
  \ is for the old commit) — no deadlock, the re-audit is\nwithin ceiling by construction.\n\
  **Exhausted-ceiling refusal + its OWNER-AUTHORIZED escape (E-0030).** When the required\n\
  re-audit (pass N+1) is past EVEN the owner-reset ceiling, a bare `--absorb` REFUSES.\
  \ The sanctioned\nexit is an OWNER-AUTHORIZED `task commit --absorb --owner-reset`:\
  \ it COMMITS the late fix past the\nexhausted ceiling purely to materialize a committed\
  \ subject the ceiling-convergence consult can then\ngovern, re-pinning custody via\
  \ the REQUIRED follow-up `audit post --commit <new> --owner-reset`. It\nis structurally\
  \ NON-STACKABLE: the escape commit folds the dirty audit-post YAML in and shifts\
  \ the\nrecorded commit, dissolving the hazard this section requires, so a SECOND\
  \ escape is REFUSED until the\nconsult-governed re-pin restores it. It is journal-observable\
  \ (`commit_landed` `data.owner_reset:\ntrue`) and FAIL-CLOSED (no flag → the refusal\
  \ stands). Primary home: SPEC-0124 §Audit-loop ceiling\n(kept in sync, not duplicated\
  \ — P7).\n\nSECOND sanctioned exception — the Stage-8 RED IN-SCOPE-FIX leg (`task\
  \ commit --fix-red`).\nThe mode-a carve-out above is the YELLOW branch ONLY (an\
  \ absorption run against a RED is refused). The RED refusal PRESCRIBES «fix the\
  \ RED cause in scope and re-audit the new commit», and\n`--fix-red` is that remedy\
  \ as a verb. It EXTENDS the mode-a cycle rather than paralleling it: the\nsuperseded\
  \ verdict is folded INTO the commit (never hand-deleted) and the follow-up `audit\
  \ post\n--commit <new>` is EQUALLY REQUIRED to re-pin custody and carry the passes\
  \ trail. What\ndiffers is the ADMITTING EVIDENCE, and only that. It is gated on\
  \ FOUR conditions, every one derived,\nnone asserted: (i) the audit-POST hazard\
  \ state (an audit-pre hazard does not qualify); (ii) the\nsuperseded verdict is\
  \ exactly **RED** — never ABORT, which names no cause an in-scope fix could\naddress\
  \ (its exit is the SPEC-0103 escalation), and never YELLOW, which remains `--absorb`'s;\
  \ (iii)\nPOSITIVE proof the commit carries AUTHORED content, read through the SAME\n\
  `_zero_ship_diff_bookkeeping` allow-list the second guard arm reads (`_red_fix_authored_paths`);\
  \ and\n(iv) the REQUIRED re-audit is still within the ceiling, checked BEFORE the\
  \ commit — **UNLESS the owner\ngrants the one-pass-wide arm (`--fix-red --owner-reset`)**,\
  \ the RED analog of the mode-a\nE-0030 continuation and on identical terms: it admits\
  \ the commit EXACTLY ONE pass past the exhausted\nceiling (a second is refused with\
  \ or without the flag), ONLY on condition (iii)'s authored-content\nproof (so the\
  \ CARD-REPAIR ARM below is refused there), journal-marked `commit_landed`\n`data.owner_reset_commit:\
  \ true`. It widens the COMMIT door ONLY: the AUDIT ceiling is untouched, so\nthe\
  \ REQUIRED `audit post --commit <new> --owner-reset` stays gated on the unchanged\
  \ consult-reopen\nfreshness axis, and it is non-stackable for the same reason the\
  \ mode-a escape is. Co-homed with\nSPEC-0124 §Audit-loop ceiling. The two flags\
  \ are MUTUALLY EXCLUSIVE: a caller declares exactly one\ncycle. The commit is journal-marked\
  \ (`commit_landed` `data.red_fix: true`).\n**THE GUARD IS NOT WEAKENED.** `--absorb`\
  \ over a non-YELLOW verdict stays refused on every\npath, byte-unchanged; a FIXLESS\
  \ RED absorption fails condition (iii) and is refused at THIS door too.\n**The failure\
  \ DIRECTION is deliberately opposite to the second guard arm's, off the same primitive.**\n\
  `_worktree_dirty_paths` returns `[]` on any git failure: the arm MISSES on that\
  \ input, this leg\nREFUSES on it; a missing injection refuses identically. The one\
  \ known over-admission (the collapsed\nbare `decisions/` row) is bounded by conditions\
  \ (i), (ii) and (iv) holding simultaneously.\n**SCOPE BOUND — the leg is for a fix\
  \ that SHIPS, and the refusal must ROUTE.** When a RED\ncause's ONLY honest fix\
  \ is a correction to the task's OWN records (its card, its acceptance text, its\n\
  audit YAML), that fix is BOOKKEEPING, and a bookkeeping-only commit cannot earn\
  \ custody on the\nORDINARY leg. Such a correction either RIDES a commit that also\
  \ carries authored work, or takes the\nCARD-REPAIR ARM below, or — when the card\
  \ has no shipping fix at all — the governed exit is the\nSPEC-0103 escalation. The\
  \ refusal text NAMES every route.\n\n**THE CARD-REPAIR ARM (`task commit --fix-red\
  \ --card-repair`) — and the retirement it\ncarries.** RETIRED (P1 F3): the escalate-only\
  \ ending the SCOPE BOUND above used to have for a RED whose\nONLY named cause was\
  \ the card's OWN record (its only terminal was park-mid-audit, recording a\nCOMPLETE\
  \ card as `parked`).\n\nIt is an ARM of this leg, never a leg of its own: passed\
  \ alone it is refused, `--absorb` stays\nincompatible, and it relaxes NONE of conditions\
  \ (i), (ii) or (iv), which run first and unchanged. It\nreplaces condition (iii)\
  \ ALONE, with a DIFFERENT positive proof rather than a weaker one. Its\nconjuncts\
  \ are all DERIVED from the repo, never asserted by the flag, and fail-closed on\
  \ any\nunprovable input (a missing injection, a git that cannot answer, an unreadable\
  \ record):\n  (A) **SHAPE** — the staged set is EXACTLY the task's own lifecycle\
  \ records (its card, its own\n      `decisions/<tid>-*.yaml`, `events.jsonl` — the\
  \ `_zero_ship_diff_bookkeeping` allow-list reused\n      whole, so there is no second\
  \ notion of \"the task's own records\") AND the CARD ITSELF is among\n      them.\
  \ The audit YAMLs are INSIDE that set by necessity, not by indulgence: this leg's\
  \ mechanic\n      is that the superseded RED verdict is FOLDED IN rather than hand-deleted,\
  \ so a dirty\n      `decisions/<tid>-audit-post.yaml` is required to be there. A\
  \ staged set carrying anything\n      authored is not this case and falls through\
  \ to the ordinary leg, which already admits it.\n  (B) **A REAL AUDITED SHIP ALREADY\
  \ EXISTS** — the commit the superseded RED verdict COVERS provably\n      carries\
  \ authored content. The arm never claims the repair IS a ship; it proves there is\
  \ one for\n      the repair to ride on. That is what makes it incapable of manufacturing\
  \ authored work, and it\n      is why a card that has genuinely shipped nothing\
  \ is refused here and routed to SPEC-0103.\n  (C) **THE RED'S CAUSE DERIVES TO THIS\
  \ CARD'S OWN RECORD** (X-1251) — the superseded RED\n      must actually BE about\
  \ the card. This leg and the audit-post admission (SPEC-0036) call ONE\n      shared\
  \ predicate (`_red_cause_is_card_record`), so the two doors cannot answer differently\n\
  \      about one RED.\n\n**RETIRED (P1 F3) by — the KEYWORD TEST over auditor prose.**\
  \ Admission used to turn on WHAT\nTHE AUDITOR HAPPENED TO WRITE. It is REPLACED\
  \ by a DERIVATION from what the record REFERS TO, in two\nparts, BOTH required:\n\
  \  1. **No authored reference.** Every repo-path-shaped token in the record is lifecycle\
  \ bookkeeping\n     for THIS card by the SAME `_zero_ship_diff_bookkeeping` allow-list\
  \ conjunct (A) reads — no second\n     list. One authored path (`bin/lib/task.py:100`)\
  \ refuses outright: that RED is `--fix-red`\n     PROPER's case, and a record-only\
  \ subject over it would move custody onto a commit that fixes\n     nothing. This\
  \ half carries the safety, and it needs no judgement about prose at all.\n  2. **At\
  \ least one reference that IS this card's own record**, by any of three strands,\
  \ each read\n     from an artifact the auditor does not author: (i) a path the allow-list\
  \ classes as this card's\n     own record — its card YAML or its own `decisions/<tid>-*.yaml`\
  \ (bare `events.jsonl` is\n     excluded: the journal FILE is where every card's\
  \ records live, so naming it identifies no card);\n     (ii) an event TYPE this\
  \ card's OWN acceptance NAMES for which a `task_id`-tied row exists — the\n    \
  \  card-opt-in CONJUNCTION reused whole, and the measured X-1251 shape; (iii) an\n\
  \     acceptance-criterion id (`AC<N>`) THIS CARD DECLARES — the DECLARING shape,\
  \ whose route\n     is thereby PRESERVED on a derivation instead of on the phrase\
  \ it had to match.\nA fourth strand would need a fourth measured shape.\n\n**THE\
  \ AUDIT IS NOT WEAKENED.** Custody moves onto the repair commit, and the REQUIRED\
  \ follow-up\n`audit post --commit <new>` covers it: `get_audit_post_diff` sends\
  \ the CUMULATIVE range\n`merge-base(sha, main)..sha` (since), so the auditor grades\
  \ the authored ship AND the repair\nTOGETHER — strictly MORE material than on the\
  \ RED pass. The journal marks the commit (`commit_landed`\n`data.card_repair: true`)\
  \ — an additive marker, deliberately NOT a `kind:`, because a `kind` marks a\nbookkeeping\
  \ self-commit that DISPLACES custody and this is the commit custody is meant to\
  \ LAND on.\nSPEC-0036 homes the matching audit-post admission; this section homes\
  \ the commit arm.\n**ROUTE (2) COVERS THE DECLARING-card shape (X-1240).** A carrier-/entry-DECLARING\
  \ card — one\nwhose deliverable IS a declaration (a live entrance, a carrier, a\
  \ host config) — cannot read the\nevidence of its own declaration before the LAND.\
  \ Its RED therefore names the evidence the CARD\nRECORDS as stale or wrong, and\
  \ the only honest fix is to re-record that reading on the card:\nBOOKKEEPING, no\
  \ authored content. That IS condition (iii)'s replaced case and this arm IS its\
  \ route.\n**NO SIXTH DEFERRED-ADOPTION VARIANT IS COMING, and that is the P1 F3\
  \ retirement this widening\ncarries:** the reading that a declaring card needs an\
  \ overlay variant of its OWN\n(`--declaration-evidence-at-land`) is RETIRED. The\
  \ ORDERING half is covered by the deferred-adoption\nmember that matches the ship\
  \ (`host_config: true` → `--host-config`, a serve/deploy ship → `--serve-deploy`),\
  \ which `audit post`\nDERIVES from the card's own declaration (SPEC-0036), and the\
  \ COMMIT half by this arm. So a\ndeclaring card that took the ordering false-RED\
  \ is a card MISSING its declaration — itself a\ncard-record correction, which is\
  \ route (2) again.\n**NARROWER than mode-a on the ceiling, deliberately:** at an\
  \ exhausted ceiling this leg\nrefuses UNCONDITIONALLY and `--owner-reset` does NOT\
  \ open it — that continuation was owner-authorized\nfor the mode-a cycle (E-0030)\
  \ and widening it to a new leg is an owner-class decision this\nleg does not make\
  \ for itself. Nothing deadlocks by refusing there: the ceiling-convergence consult\n\
  (SPEC-0124) is the governed exit and is the correct one.\n\n### Reverify-at-close\
  \ via author signal (`task close --reverify SPEC-XXXX`)\nWhen the closing task's\
  \ own diff changes code an ACTIVE spec anchors, `task close` SURFACES the\npossibly-stale\
  \ spec (the `spec_drift_unverified` WARN) and NEVER silently re-stamps it — only\n\
  the author can tell a cosmetic anchor-edit from a contract change. `task close --reverify\
  \ SPEC-XXXX`\n(repeatable) asserts \"I re-read SPEC-XXXX against the changed code;\
  \ its body still holds\" and\nre-blesses its durable `implements_signature:` (the\
  \ `spec reverify` core / SPEC-0013), staged\nBY NAME into the closure-record commit,\
  \ so the spec drops out of the WARN. FAIL-CLOSED scope: honoured\nONLY for a spec\
  \ THIS task's diff left possibly-stale; a `--reverify` of any other spec is REFUSED\
  \ up\nfront. A genuine BEHAVIOUR change is NOT --reverify's job — the author edits\
  \ the spec body. The\nreverified ids are recorded in `task_closed` (`reverified_specs`,\
  \ honest-only). No new gate, ledger,\nor FSM (CHARTER non-goal #7).\n\n### Reverify-at-commit\
  \ (`task commit --reverify SPEC-XXXX`)\nThe SAME author signal, one seam earlier,\
  \ so the re-stamp rides the PRODUCT commit instead of a\nseparate re-sign commit\
  \ (and precedes audit-post by construction). `task commit --reverify SPEC-XXXX`\n\
  (repeatable) is never automatic and asserts exactly what the close flag asserts.\
  \ FAIL-CLOSED scope:\neligibility is the PRE-commit drift set — the Stage-6 touched\
  \ set (merge-base..working tree +\nuntracked) fed to the one detector — narrowed\
  \ PER ANCHOR to anchors whose content signature\ndiffers from their signature at\
  \ merge-base(HEAD, main); any other id is REFUSED before anything\nis written, naming\
  \ the eligible set. Only those moved anchors are re-signed (`only_anchors`,\nSPEC-0006\
  \ scope — every other anchor's baseline stays byte-identical), the re-stamp is\n\
  written before staging so it ships in the same commit, and each sign emits `spec_reverified`\n\
  (`via: task-commit`). The Stage-6 report names it as the one-commit route; the post-commit\
  \ Stage-7\nWARN names it as the one-command recovery. No new gate, event, or store.\n\
  \n### Ship-custody RE-PIN — the THIRD sanctioned exception (X-0422)\nThe guard above\
  \ pins custody to `_recorded_commit_sha` = the LATEST `commit_landed`. THREE\ngoverned\
  \ self-commits legitimately emit a `commit_landed` AFTER the ship — `task update\
  \ --status\nparked`, `task pause`, and `task update --status wont-do` — and so SHIFT\n\
  recorded custody past the ship, wedging the task: `audit post --commit <ship>` refuses\
  \ (ship ≠\nrecorded), a bare `audit post` audits the PARK diff (GREEN-BY-VACUITY),\
  \ and `task close` stays\nRED-blocked.\n\nThe governed exit is `yitc-v2 audit post\
  \ --task T-XXXX --commit <ship-sha> --repin-ship`. It re-pins\naudit custody to\
  \ the DISPLACED SHIP, and it is NOT a weakening of the guard: every leg is DERIVED\
  \ by\n`_require_ship_custody_repin` from durable task-linked journal + git state,\
  \ never asserted by the\ncaller, and each refuses FAIL-CLOSED (same `read_gate_refused`\
  \ kind=`verification-exists` channel, NO\nnew event/emit path):\n- **Custody must\
  \ be genuinely BOOKKEEPING-SHIFTED** — a displaced ship exists AND every `commit_landed`\n\
  \  after it DISPLACED custody rather than SHIPPED (the anti-custody-game fence:\
  \ the path can NEVER\n  re-pin off a genuine ship commit). A record DISPLACED when\
  \ either arm holds:\n  (i) it carries a kind in the CLOSED admissible set (`_BOOKKEEPING_COMMIT_KINDS`\
  \ — park/pause/\n  wont-do); the close-tail kinds (`closure`/`closes_fp_link`/`pv_late_link`)\
  \ are not admitted — nor is\n  any unknown kind; or\n  (ii) — it carries NO kind\
  \ at all AND its own diff is PROVABLY record-only (the existing\n  `_zero_ship_diff_bookkeeping`\
  \ allow-list, via `_bookkeeping_commit_authored_paths`); an UNPROVABLE\n  diff refuses.\
  \ This is NOT a general custody-repointing flag: the target stays DERIVED from the\n\
  \  ordered chain, `--commit` stays a confirmation token, and a kind-less record\
  \ carrying AUTHORED paths\n  still refuses here.\n  **The SELECTION half of the\
  \ same question.** When NO kind-absent record carries authored\n  content AND the\
  \ chain as a WHOLE is record-only (`_chain_is_record_only` — the SAME predicate\
  \ the\n  mode selector applies), the card records NO PRODUCT SHIP, and MODE B applies:\
  \ a pre-card ship is\n  admissible only on ITS own fences (governed-landing evidence,\
  \ ancestor-of-`main`, and the\n  diff-limited leg scanning the FULL chain). **This\
  \ NARROWS what may be called a ship; it removes no\n  refusal.** ANY authored content\
  \ anywhere on the chain leaves the branch inert; an unprovable diff\n  answers False\
  \ (fail-closed). The demotion stays OPT-IN, so the pre-shipped-deliverable anchor\
  \ is\n  unmoved.\n- **`--commit` must EQUAL the displaced ship** — a CONFIRMATION\
  \ token, never a selector: exactly ONE\n  admissible sha is derived from the ORDERED\
  \ `commit_landed` chain, and an untied sha, or an OLDER ship\n  of a multi-ship\
  \ (mode-a) task, is REFUSED.\n- **Every displacing self-commit must be DIFF-LIMITED\
  \ to bookkeeping** (the existing\n  `_zero_ship_diff_bookkeeping` allow-list). A\
  \ park/pause commit that swept AUTHORED source in (X-0359)\n  is REFUSED: re-pinning\
  \ to the ship would leave that content shipped-but-unaudited.\n- **The ship must\
  \ be INTEGRATED-OR-REACHABLE** — TWO admissible shapes, and only two. Any git failure\n\
  \  refuses either way.\n  (i) **LANDED** — the named commit is an ancestor of `main`.\n\
  \  (ii) **DISPLACED ON AN UNLANDED BRANCH** — when the commit is NOT an ancestor\
  \ of `main`, it\n  is admitted on the CONJUNCTION of: it is **reachable from HEAD**\
  \ (the tree the audit will run\n  against); AND it **carries this card's AUTHORED\
  \ content**, judged by the SAME\n  `_bookkeeping_commit_authored_paths` predicate\
  \ legs (a)/(c) apply (fail-closed).\n  **Why (ii) is not a weakening.** It audits\
  \ a diff `main` does not carry YET, which is what EVERY\n  pre-land audit does;\
  \ the authored-content half refuses the green-by-vacuity target; and this leg runs\n\
  \  LAST, after the anti-custody-game fence has already decided.\n  **Guidance follows\
  \ the rule.** The custody-mismatch refusal's recovery sentence\n  (`_custody_mismatch_recovery_route`)\
  \ asks the ENFORCING predicate in the not-an-ancestor state too;\n  LAND FIRST survives\
  \ only for the inputs where the re-pin is genuinely refused.\n\nJOURNAL-EVIDENCED\
  \ + re-verified, never trusted: the completed `audit_post_completed` event carries\n\
  `custody_repin` + the ship/from shas + the displacing kind, and the verdict YAML\
  \ records the same\n(`custody_repin`, `custody_repin_ship_commit`, `custody_repin_from`,\
  \ `custody_repin_from_kind`). That\nmarker is a TRAIL, not an assertion `task close`\
  \ believes: closure RE-DERIVES the whole guard at the\nclose seam (the belt's SECOND\
  \ control point — the zero-ship-diff two-point precedent) and\npins to the guard-verified\
  \ ship, so drift between audit-post and close (a new bookkeeping record, a\nrewritten\
  \ branch, a payload authored into the park commit) trips the fence at the actual\
  \ close moment.\nSelf-gating: a no-op unless the verdict marks `custody_repin` —\
  \ every ordinary close keeps the plain\n recorded-commit pin, UNCHANGED. This is\
  \ an ADDITIVE extension (SPEC-0005 §additive-extension): it adds an answer for a\
  \ case the rule never addressed and alters no already-covered case.\n\n**THE AUDITED\
  \ SUBJECT — the SPAN, not the target alone (<project> X-1435).** The four legs\n\
  above answer the ADMISSION question («may this target be re-pinned to at all»).\
  \ They are UNCHANGED.\nThis bullet answers the question the section never addressed:\
  \ once a target IS admitted, WHAT\nMATERIAL the auditor is shown.\n- **The subject\
  \ is the SPAN** of the card's own non-bookkeeping `commit_landed` members up to\
  \ AND\n  INCLUDING the target — asked through the SAME `_bookkeeping_commit_authored_paths`\
  \ predicate legs\n  (a)/(c)/(ii) already use, so there is no second notion of what\
  \ counts as authored content. It is\n  assembled as the UNION of the members' OWN\
  \ commits, NEVER a `<first>^..<last>` range on `main`:\n  concurrent lands from\
  \ OTHER cards interleave between one card's ships, so a range would hand the\n \
  \ auditor foreign content.\n  **Why this was needed.** A re-pin target is admitted\
  \ by the LANDED leg precisely BECAUSE it is an\n  ancestor of `main`, so `merge-base(target,\
  \ main) == target`, `get_audit_post_diff`'s range branch\n  is skipped and its single-commit\
  \ fallback fires. On a single-ship card that is correct; on a\n  MULTI-ship card\
  \ every EARLIER ship fell silently outside the subject. Measured on <project> :\n\
  \  custody re-pinned onto the CHORE ship rather than the PRODUCT ship, the packet\
  \ printed `audited in\n  the diff (2)` vs `declared but NOT audited (5)`, and it\
  \ ADMITTED — all 8 of that card's acceptance\n  criteria concerned content the auditor\
  \ would never, so a GREEN would have been\n  green-by-vacuity, the exact wedge this\
  \ whole exception exists to prevent.\n- **THREE NEW FAIL-CLOSED REFUSAL LEGS** (this\
  \ is why the enumeration above became incomplete):\n  (1) a span member whose authored-paths\
  \ are UNPROVABLE, or which is not provably REACHABLE FROM\n  THE TREE BEING AUDITED\
  \ (ancestor-of-`HEAD`, NOT ancestor-of-`main`: the subject question is whether\n\
  \  the material is PRESENT, and binding it to `main` would refuse the LEG-(ii) unlanded-branch\
  \ shape\n  this section explicitly ADMITS), REFUSES naming that record; (2) a failed\
  \ `git show` for ANY member REFUSES naming that member; (3) a target that\n  matches\
  \ MORE THAN ONE recorded commit of the card REFUSES naming the candidates — the\
  \ chain holds\n  whatever the emitting verb wrote (in practice a SHORT sha) while\
  \ the settled target is FULL, so\n  position is decided by the SAME bidirectional\
  \ prefix compare used elsewhere for this pair, and an\n  ambiguous prefix names\
  \ no single position (the / ambiguity family). NONE ever\n  falls back to the last-ship\
  \ subject — falling back IS the vacuous audit this closes, so «today's\n  behaviour»\
  \ is not the safe direction here: a guard that cannot CONSTRUCT its subject must\
  \ not\n  pass. All three fire before any auditor invocation, so a refusal costs\
  \ no auditor call and burns\n  no ceiling pass.\n- **THE SINGLE-SHIP INVARIANT.**\
  \ A chain with <= 1 non-bookkeeping member derives exactly the commit\n  it derives\
  \ today and DELEGATES to the same single-commit call, so every existing single-ship\n\
  \  re-pin is byte-identical. A target recorded by no card-tied row (the MODE-B shape)\
  \ has no chain to\n  span and likewise spans to itself, without refusing.\n- **THE\
  \ TRAIL:** `custody_repin_span` (the ordered member shas) on the verdict YAML and\
  \ in\n  `audit_post_completed`, beside `custody_repin_bound_by` — additive-optional,\
  \ and ABSENT on every\n  single-ship re-pin. **Custody itself is UNCHANGED:** `commit:`\
  \ still pins to the ONE displaced\n  ship, and `--commit` stays a confirmation token,\
  \ so the «`--commit` must EQUAL the displaced ship\n... an OLDER ship of a multi-ship\
  \ task is REFUSED» leg above stays literally true and literally\n  enforced. This\
  \ bullet changes WHAT THE AUDITOR SEES, never WHO SIGNS.\n- **THE ORDINARY ROUTE\
  \ SHARES THE SPAN (<project> X-1481).** The span was gated on\n  DISPLACEMENT (`--repin-ship`)\
  \ where the defect is a matter of MULTIPLICITY: a two-ship card whose\n  custody\
  \ no record ever displaced had NO governed route to its earlier ship (`--commit\
  \ <earlier>`\n  refuses by equality, `--repin-ship` refuses at leg (a)), and once\
  \ its last ship was an\n  ancestor of `main` the bare `git show` handed the auditor\
  \ none of the deliverable (:\n  declared 14 · audited 7 · NOT audited 8). So the\
  \ ORDINARY custody leg derives its subject through\n  the SAME reader with the SAME\
  \ predicates (`bin/lib/audit.py#ship_span_commits`), with three bounds\n  that keep\
  \ every existing contract literally true: (1) a chain of ONE recorded ship is not\
  \ spanned\n  at all — the single-ship subject, INCLUDING its refusal surface, is\
  \ byte-identical to before;\n  (2) a `--commit <full sha>` that EXTENDS an ambiguous\
  \ recorded prefix resolves that row,\n  so the ambiguity refusal cannot fire on\
  \ a row the operator just resolved; (3) **the span starts\n  AFTER the card's last\
  \ RENDERED audit-post verdict** (GREEN/YELLOW/RED — an ABORT rendered none and\n\
  \  bounds nothing): a further ship past a GREEN (`task commit --reship`, the landed-pause\
  \ further\n  ship) is audited alone, as SPEC-0036 (a) no-relitigation requires.\
  \ The bound never narrows on\n  doubt — a prior custody sha that names no chain\
  \ row, or more than one, bounds nothing. **THE FORM\n  IS DECIDED ONCE, in `get_audit_post_span_diff`:**\
  \ an UNLANDED last member keeps the RANGE form\n  (`merge-base..custody`), which\
  \ is a SUPERSET of the span — it also carries a `work commit`\n  collateral fix\
  \ and a `worktree sync --resolved` hand-resolution that no `commit_landed` row\n\
  \  names, so the union would NARROW an unlanded subject; a LANDED last member (every\
  \ re-pin target,\n  and the landed-then-re-audited ordinary card) takes the per-member\
  \ union. Custody and admission\n  are untouched: `commit:` still pins to the custody\
  \ sha and `--commit` must still EQUAL it.\n  **THE TRAIL:** `audited_span` (the\
  \ ordered member shas) beside `audited_base` on the\n  verdict YAML and in `audit_post_completed`\
  \ — additive-optional, ABSENT on every single-ship\n  subject and on the re-pin\
  \ route, which keeps `custody_repin_span`.\nThis is likewise an ADDITIVE extension\
  \ (SPEC-0005 §additive-extension): it adds an answer for a\nquestion the rule was\
  \ silent on, and alters no already-covered case's required behaviour.\n\n## Rationale\n\
  \nThe `retrieved`-tier home of LIFECYCLE §Stage 9 (plan `part-i-a-retrieval-delivery-mechanism`),\n\
