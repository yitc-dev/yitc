body: "### Audit-stage YAMLs are committed BY `task close`, never a standalone `task\
  \ commit`\nThe `decisions/<task>-audit-pre.yaml` / `-audit-post.yaml` records are\
  \ committed by `task close`\nitself — its closure-record commit (E-0007) folds the\
  \ dirty audit YAML(s) in, because they\nare IN that commit's staging set: the closure\
  \ record stages the task YAML, the journal delta, the\ntask's own audit records\
  \ (`_foldable_audit_records`, incl. the slug-named adhoc verdict) and the\nspec/graph\
  \ updates the closure itself writes — and NOTHING else (a dirty path outside the\
  \ set is\nREPORTED and left in the worktree, behind land's dirt guard). After `audit\
  \ post --commit X` writes the verdict YAML, LEAVE IT DIRTY; do NOT run a\nstandalone\
  \ `task commit` on it. A standalone `task commit` creates a NEW commit Y that becomes\
  \ the\ntask's recorded commit (: recorded = the latest `commit_landed`), shifting\
  \ the recorded commit\nPAST the audited commit X. `task close` then pins audit-post.commit==recorded\
  \ and finds X≠Y, demanding\na re-audit of Y — which an exhausted audit-loop ceiling\
  \ can BLOCK (the closure DEADLOCK,\nE-0008). The closure-record commit does NOT\
  \ have this problem: it runs AFTER the audit-post check, so\nrecorded == the audited\
  \ commit at the moment close verifies it. `cmd_task_commit` enforces this with a\n\
  foot-gun guard (`_audit_commit_shift_hazard`): a standalone `task commit` that would\
  \ stage an\naudit-<stage>.yaml whose verdict commit == the current recorded commit\
  \ is REFUSED, with a hint to\nleave it dirty and run `task close`.\n**CUSTODY IS\
  \ THE LAST AUTHORED SHIP — a bookkeeping SELF-commit is TRANSPARENT to it.**\nThe\
  \ ONE custody resolver (`audit_custody_commit`, read by `audit decide` and by `audit\
  \ post`'s\ndefault-subject leg) SKIPS `commit_landed` rows whose kind is one of\
  \ the closed three {`park`,\n`pause`, `wont-do`} and resolves the last AUTHORED\
  \ ship instead — under TWO bounds, both fail-closed.\n(i) THE DIFF DECIDES, NOT\
  \ THE KIND: a kinded row is skipped only when its own diff is PROVABLY\nrecord-only,\
  \ asked through the SAME `_bookkeeping_commit_authored_paths` predicate `--repin-ship`\
  \ and\nthe guard ask, so a record commit that SWEPT authored source still moves\
  \ custody (an unwired\nor unanswerable predicate is not proof). (ii) IT NARROWS\
  \ ONLY THE UNLANDED STATE: where the displaced\nship IS an ancestor of `main`, `audit\
  \ post --commit <ship> --repin-ship` is the route and the\nrefusal there is UNCHANGED.\
  \ An AUTHORED\ncommit still moves custody exactly as today, and every CLOSE-TAIL\
  \ kind stays outside the skip set, so\n`task close` folding the dirty audit YAML\
  \ into its closure-record commit goes on being the\nrecorded audited commit. This\
  \ NARROWS what may be CALLED the audited commit; it removes no refusal,\nand it\
  \ changes nothing about what `task pause` commits. `task close` resolves its closure\
  \ custody through the SAME resolver under the SAME two bounds : a trailing proven\
  \ record-only bookkeeping self-commit never displaces the audited ship at close,\
  \ so `_require_audit_post_for_commit` and `--commit` compare against that ship,\
  \ while a kinded commit carrying an authored path keeps custody and the refusal\
  \ is unchanged. AND `task close` closes ON THE SHIP when the RECORDED commit is\
  \ a RECORD-ONLY revision that PROVABLY CONTAINS the ship the audit-post record covers\
  \ (<project> X-1482): a `--fix-red --card-repair` repair is kind-less by design,\
  \ so the resolver above keeps custody on it, and AT the ceiling the one `--on-decisions`\
  \ pass (SPEC-0204 rule 3) is redirected to the SHIP (SPEC-0204 rules 2-3) and pins\
  \ the GREEN there — closure then read its own GREEN as «for another commit» with\
  \ no pass left to spend. The containment is asked of the SAME `_ship_contained_record_only`\
  \ predicate the redirect asks (one computation, CHARTER §P1 F1), honoured only when\
  \ the ship it names IS the record's `commit:`; an unverifiable or non-containing\
  \ recorded revision leaves custody untouched and `_require_audit_post_for_commit`\
  \ refuses exactly as before. Below the ceiling nothing moves: the mandated re-audit\
  \ pins the GREEN to the repair commit itself and custody matches without this leg.\n\
  **AN AMBIGUOUS RECORDED PREFIX IS RESOLVED ONLY THROUGH A FULL SHA EXTENDING IT.**\n\
  Where the recorded value does not resolve AND names two or more objects, `resolve_recorded_commit`\n\
  admits the full sha of a commit that EXTENDS it, and nothing else: `audit post --commit\
  \ <full sha>`\npasses the equality guard, and `task close` pins to `--commit`, else\
  \ to the audit-post\nrecord's own full `commit:`. A bare `audit post` over such\
  \ a row, and a close with no extending sha,\nREFUSE naming the ambiguity and the\
  \ candidate commits (`unresolved_ref_refusal`) instead of «not a\nvalid git ref»;\
  \ a sha that does not extend the record keeps the unchanged refusal.\n**THE RULE\
  \ IS ABOUT DISPLACEMENT, NOT ABOUT A DIRTY YAML — the guard has TWO arms.** After\
  \ a\nmode-a absorption the audit YAML is COMMITTED and CLEAN, so the first arm cannot\
  \ see a later\nbookkeeping-only commit that displaces custody. The SECOND arm (`_bookkeeping_only_custody_shift`)\n\
  REFUSES a standalone, NON-`--absorb` `task commit` when the task already HAS a recorded\
  \ commit and\nevery path the commit would stage is lifecycle bookkeeping (the existing\
  \ `_zero_ship_diff_bookkeeping`\nallow-list). A commit carrying AUTHORED content\
  \ is untouched. The first arm is checked FIRST and is\nbyte-unchanged, and the mode-a\
  \ carve-out below — gated on it — never reaches the second arm.\n**The honest bound.**\
  \ A missed displacement is covered by the governed RECOVERY route\n. No new store,\
  \ event, flag or hook.\n**At-closure audit-YAML displacement (SPEC-0052 — non-normative\
  \ cross-ref):** after the\nclosure-record commit, `task close` runs a BEST-EFFORT,\
  \ non-fatal `git mv` of the task's committed\naudit YAMLs into `decisions/archive/`;\
  \ it does not change the ordering / probe / audit-post\nprecondition, and a failure\
  \ never blocks a valid closure. Homed in SPEC-0052.\n\nTHREE sanctioned exceptions\
  \ carve out of the rule above — the Stage-8 mode-a absorption cycle\n, the Stage-8\
  \ RED IN-SCOPE-FIX leg, and the ship-custody RE-PIN recovery ( —\n§Ship-custody\
  \ re-pin, further down). All three are ADDITIVE, and each is gated on evidence the\
  \ guard\nitself DERIVES, never asserted.\nFIRST sanctioned exception — the Stage-8\
  \ mode-a absorption carve-out. When an audit-post\nfinding warrants an INLINE fix\
  \ (mode-a: fix → second ship commit → re-audit), `task commit\n--absorb` declares\
  \ that cycle explicitly: the superseded verdict YAML is folded INTO the\nabsorption\
  \ commit (NEVER hand-deleted — deletion zeroes `_count_audit_passes` and silently\
  \ loses\nthe trail, the 3x-in-one-day manual-fallback class), and the REQUIRED follow-up\
  \ `audit post\n--commit <new>` re-pins custody (verdict.commit == recorded) and\
  \ carries the prior pass into the\nnew verdict's `passes_trail:`. The carve-out\
  \ is gated PRECISELY: only the audit-POST hazard state\nqualifies (not audit-pre),\
  \ and the absorption commit is journal-marked (`commit_landed`\n`data.absorption:\
  \ true`). The INVARIANT is unchanged: `task close` still commits the GOVERNING\n\
  (latest-pass) verdict, pinned to the recorded commit; a forgotten re-audit after\
  \ --absorb\nfail-closes at `task close` (audit-post is for the old commit) — no\
  \ deadlock, the re-audit is\nwithin ceiling by construction.\n**Exhausted-ceiling\
  \ refusal + its OWNER-AUTHORIZED escape (E-0030).** When the required\nre-audit\
  \ (pass N+1) is past the ceiling, a bare `--absorb` REFUSES. The exit still admitted\
  \ at the\nCOMMIT door is an OWNER-AUTHORIZED `task commit --absorb --owner-reset`:\
  \ it COMMITS the late fix\npast the exhausted ceiling purely to materialize a committed\
  \ subject. The custody re-pin it was\nfirst paired with — `audit post --commit <new>`\
  \ under the audit-side owner reset, governed by a\nceiling-convergence consult —\
  \ is RETIRED by SPEC-0204 rule 6 and refuses: a pass on the new commit\nis admitted\
  \ only by the SPEC-0204 route (one `audit decide` per residual, then ONE `audit\
  \ post\n--on-decisions` pass), and where that route admits none the commit stays\
  \ un-re-pinned. It\nis structurally NON-STACKABLE: the escape commit folds the dirty\
  \ audit-post YAML in and shifts the\nrecorded commit, dissolving the hazard this\
  \ section requires, so a SECOND escape is REFUSED until a\nfurther audit-post pass\
  \ has re-pinned custody. It is journal-observable (`commit_landed` `data.owner_reset:\n\
  true`) and FAIL-CLOSED (no flag → the refusal stands). Full text: SPEC-1018 §Late\
  \ finding after the\naudit-post budget is spent (kept in sync, not duplicated —\
  \ P7).\n\nSECOND sanctioned exception — the Stage-8 RED IN-SCOPE-FIX leg (`task\
  \ commit --fix-red`).\nThe mode-a carve-out above is the YELLOW branch ONLY (an\
  \ absorption run against a RED is refused). The RED refusal PRESCRIBES «fix the\
  \ RED cause in scope and re-audit the new commit», and\n`--fix-red` is that remedy\
  \ as a verb. It EXTENDS the mode-a cycle rather than paralleling it: the\nsuperseded\
  \ verdict is folded INTO the commit (never hand-deleted) and the follow-up `audit\
  \ post\n--commit <new>` is EQUALLY REQUIRED to re-pin custody and carry the passes\
  \ trail. What\ndiffers is the ADMITTING EVIDENCE, and only that. It is gated on\
  \ FOUR conditions, every one derived,\nnone asserted: (i) the audit-POST hazard\
  \ state (an audit-pre hazard does not qualify); (ii) the\nsuperseded verdict is\
  \ exactly **RED** — never ABORT, which names no cause an in-scope fix could\naddress\
  \ (its exit is the SPEC-0103 escalation), and never YELLOW, which remains `--absorb`'s;\
  \ (iii)\nPOSITIVE proof the commit carries AUTHORED content, read through the SAME\n\
  `_zero_ship_diff_bookkeeping` allow-list the second guard arm reads (`_red_fix_authored_paths`);\
  \ and\n(iv) the REQUIRED re-audit is still within the ceiling, checked BEFORE the\
  \ commit. The one-pass-wide\narm that once widened (iv) past an exhausted ceiling\
  \ — `--fix-red --owner-reset`, the\nspent-budget bypass — is RETIRED by SPEC-0204\
  \ rule 6 and refuses: the audit-side owner reset it\nbootstrapped a subject for\
  \ no longer exists. Past the ceiling the route is the SPEC-0204 one — one\n`audit\
  \ decide` per residual, then ONE `audit post --on-decisions` pass. Co-homed with\n\
  SPEC-0124 §Audit-loop ceiling. The two flags are MUTUALLY EXCLUSIVE: a caller declares\
  \ exactly one\ncycle. The commit is journal-marked (`commit_landed` `data.red_fix:\
  \ true`).\n**THE GUARD IS NOT WEAKENED.** `--absorb` over a non-YELLOW verdict stays\
  \ refused on every\npath, byte-unchanged; a FIXLESS RED absorption fails condition\
  \ (iii) and is refused at THIS door too.\n**The failure DIRECTION is deliberately\
  \ opposite to the second guard arm's, off the same primitive.**\n`_worktree_dirty_paths`\
  \ returns `[]` on any git failure: the arm MISSES on that input, this leg\nREFUSES\
  \ on it; a missing injection refuses identically. The one known over-admission (the\
  \ collapsed\nbare `decisions/` row) is bounded by conditions (i), (ii) and (iv)\
  \ holding simultaneously.\n**SCOPE BOUND — the leg is for a fix that SHIPS, and\
  \ the refusal must ROUTE.** When a RED\ncause's ONLY honest fix is a correction\
  \ to the task's OWN records (its card, its acceptance text, its\naudit YAML), that\
  \ fix is BOOKKEEPING, and a bookkeeping-only commit cannot earn custody on the\n\
  ORDINARY leg. Such a correction either RIDES a commit that also carries authored\
  \ work, or takes the\nCARD-REPAIR ARM below, or — when the card has no shipping\
  \ fix at all — the governed exit is the\nSPEC-0103 escalation. The refusal text\
  \ NAMES every route.\n\n**THE CARD-REPAIR ARM (`task commit --fix-red --card-repair`)\
  \ — and the retirement it\ncarries.** RETIRED (P1 F3): the escalate-only ending\
  \ the SCOPE BOUND above used to have for a RED whose\nONLY named cause was the card's\
  \ OWN record (its only terminal was park-mid-audit, recording a\nCOMPLETE card as\
  \ `parked`).\n\nIt is an ARM of this leg, never a leg of its own: passed alone it\
  \ is refused, `--absorb` stays\nincompatible, and it relaxes NONE of conditions\
  \ (i), (ii) or (iv), which run first and unchanged. It\nreplaces condition (iii)\
  \ ALONE, with a DIFFERENT positive proof rather than a weaker one. Its\nconjuncts\
  \ are all DERIVED from the repo, never asserted by the flag, and fail-closed on\
  \ any\nunprovable input (a missing injection, a git that cannot answer, an unreadable\
  \ record):\n  (A) **SHAPE** — the staged set is EXACTLY the task's own lifecycle\
  \ records (its card, its own\n      `decisions/<tid>-*.yaml`, `events.jsonl` — the\
  \ `_zero_ship_diff_bookkeeping` allow-list reused\n      whole, so there is no second\
  \ notion of \"the task's own records\") AND the CARD ITSELF is among\n      them.\
  \ The audit YAMLs are INSIDE that set by necessity, not by indulgence: this leg's\
  \ mechanic\n      is that the superseded RED verdict is FOLDED IN rather than hand-deleted,\
  \ so a dirty\n      `decisions/<tid>-audit-post.yaml` is required to be there. A\
  \ staged set carrying anything\n      authored is not this case and falls through\
  \ to the ordinary leg, which already admits it.\n  (B) **A REAL AUDITED SHIP ALREADY\
  \ EXISTS** — the commit the superseded RED verdict COVERS provably\n      carries\
  \ authored content. The arm never claims the repair IS a ship; it proves there is\
  \ one for\n      the repair to ride on. That is what makes it incapable of manufacturing\
  \ authored work, and it\n      is why a card that has genuinely shipped nothing\
  \ is refused here and routed to SPEC-0103.\n  (C) **THE RED'S CAUSE DERIVES TO THIS\
  \ CARD'S OWN RECORD** (X-1251) — the superseded RED\n      must actually BE about\
  \ the card.\n\n**RETIRED (P1 F3) by — the KEYWORD TEST over auditor prose.** It\
  \ is REPLACED by a DERIVATION from what the record REFERS TO, in two\nparts, BOTH\
  \ required:\n  1. **No authored reference.** Every repo-path-shaped token in the\
  \ record is lifecycle bookkeeping\n     for THIS card by the SAME `_zero_ship_diff_bookkeeping`\
  \ allow-list conjunct (A) reads — no second\n     list. One authored path (`bin/lib/task.py:100`)\
  \ refuses outright: that RED is `--fix-red`\n     PROPER's case, and a record-only\
  \ subject over it would move custody onto a commit that fixes\n     nothing. This\
  \ half carries the safety, and it needs no judgement about prose at all.\n  2. **At\
  \ least one reference that IS this card's own record**, by any of three strands,\
  \ each read\n     from an artifact the auditor does not author: (i) a path the allow-list\
  \ classes as this card's\n     own record — its card YAML or its own `decisions/<tid>-*.yaml`\
  \ (bare `events.jsonl` is\n     excluded: the journal FILE is where every card's\
  \ records live, so naming it identifies no card);\n     (ii) an event TYPE this\
  \ card's OWN acceptance NAMES for which a `task_id`-tied row exists — the\n    \
  \  card-opt-in CONJUNCTION reused whole, and the measured X-1251 shape; (iii) an\n\
  \     acceptance-criterion id (`AC<N>`) THIS CARD DECLARES — the DECLARING shape,\
  \ whose route\n     is thereby PRESERVED on a derivation instead of on the phrase\
  \ it had to match.\nA fourth strand would need a fourth measured shape.\n\n**THE\
  \ AUDIT IS NOT WEAKENED.** Custody moves onto the repair commit, and the REQUIRED\
  \ follow-up\n`audit post --commit <new>` covers it: `get_audit_post_diff` sends\
  \ the CUMULATIVE range\n`merge-base(sha, main)..sha` (since), so the auditor grades\
  \ the authored ship AND the repair\nTOGETHER — strictly MORE material than on the\
  \ RED pass. The journal marks the commit (`commit_landed`\n`data.card_repair: true`)\
  \ — an additive marker, deliberately NOT a `kind:`, because a `kind` marks a\nbookkeeping\
  \ self-commit that DISPLACES custody and this is the commit custody is meant to\
  \ LAND on.\nSPEC-0036 homes the matching audit-post admission; this section homes\
  \ the commit arm.\n**ROUTE (2) COVERS THE DECLARING-card shape (X-1240).** A carrier-/entry-DECLARING\
  \ card — one\nwhose deliverable IS a declaration (a live entrance, a carrier, a\
  \ host config) — cannot read the\nevidence of its own declaration before the LAND.\
  \ Its RED therefore names the evidence the CARD\nRECORDS as stale or wrong, and\
  \ the only honest fix is to re-record that reading on the card:\nBOOKKEEPING, no\
  \ authored content. That IS condition (iii)'s replaced case and this arm IS its\
  \ route.\n**NO SIXTH DEFERRED-ADOPTION VARIANT IS COMING, and that is the P1 F3\
  \ retirement this widening\ncarries:** the reading that a declaring card needs an\
  \ overlay variant of its OWN\n(`--declaration-evidence-at-land`) is RETIRED. The\
  \ ORDERING half is covered by the deferred-adoption\nmember that matches the ship\
  \ (`host_config: true` → `--host-config`, a serve/deploy ship → `--serve-deploy`),\
  \ which `audit post`\nDERIVES from the card's own declaration (SPEC-0036), and the\
  \ COMMIT half by this arm. So a\ndeclaring card that took the ordering false-RED\
  \ is a card MISSING its declaration — itself a\ncard-record correction, which is\
  \ route (2) again.\n**NARROWER than mode-a on the ceiling, deliberately:** at an\
  \ exhausted ceiling this leg\nrefuses UNCONDITIONALLY and `--owner-reset` does NOT\
  \ open it — that continuation was owner-authorized\nfor the mode-a cycle (E-0030)\
  \ and widening it to a new leg is an owner-class decision this\nleg does not make\
  \ for itself. Nothing deadlocks by refusing there: the governed exit is the\nSPEC-0204\
  \ route — one `audit decide` per residual, then ONE `audit post --on-decisions`\
  \ pass.\n\n### Reverify-at-close via author signal (`task close --reverify SPEC-XXXX`)\n\
  When the closing task's own diff changes code an ACTIVE spec anchors, `task close`\
  \ SURFACES the\npossibly-stale spec (the `spec_drift_unverified` WARN) and NEVER\
  \ silently re-stamps it — only\nthe author can tell a cosmetic anchor-edit from\
  \ a contract change. `task close --reverify SPEC-XXXX`\n(repeatable) asserts \"\
  I re-read SPEC-XXXX against the changed code; its body still holds\" and\nre-blesses\
  \ its durable `implements_signature:` (the `spec reverify` core / SPEC-0013), staged\n\
  BY NAME into the closure-record commit, so the spec drops out of the WARN. FAIL-CLOSED\
  \ scope: honoured\nONLY for a spec THIS task's diff left possibly-stale; a `--reverify`\
  \ of any other spec is REFUSED up\nfront. A genuine BEHAVIOUR change is NOT --reverify's\
  \ job — the author edits the spec body. The\nreverified ids are recorded in `task_closed`\
  \ (`reverified_specs`, honest-only). No new gate, ledger,\nor FSM (CHARTER non-goal\
  \ #7).\n\n### Reverify-at-commit (`task commit --reverify SPEC-XXXX`)\nThe SAME\
  \ author signal, one seam earlier, so the re-stamp rides the PRODUCT commit instead\
  \ of a\nseparate re-sign commit (and precedes audit-post by construction). `task\
  \ commit --reverify SPEC-XXXX`\n(repeatable) is never automatic and asserts exactly\
  \ what the close flag asserts. FAIL-CLOSED scope:\neligibility is the PRE-commit\
  \ drift set — the Stage-6 touched set (merge-base..working tree +\nuntracked) fed\
  \ to the one detector — narrowed PER ANCHOR to anchors whose content signature\n\
  differs from their signature at merge-base(HEAD, main); any other id is REFUSED\
  \ before anything\nis written, naming the eligible set. Only those moved anchors\
  \ are re-signed (`only_anchors`,\nSPEC-0006 scope — every other anchor's baseline\
  \ stays byte-identical), the re-stamp is\nwritten before staging so it ships in\
  \ the same commit, and each sign emits `spec_reverified`\n(`via: task-commit`).\
  \ The Stage-6 report names it as the one-commit route; the post-commit Stage-7\n\
  WARN names it as the one-command recovery. No new gate, event, or store.\n\n**RECOVERY\
  \ RECIPES → patterns/rare-task-recovery-recipes.md (index).** Two rare states have\
  \ their\nrecipe in that how-to (`graph query rare-task-recovery-recipes`): a task\
  \ the owner parks while its\naudit-post is RED — lead «Park-mid-audit land path»;\
  \ and a task closed before its land-verify passed,\nwhose closure is still on its\
  \ branch — lead «Prematurely-closed UNLANDED task» (rework in place, or\ndiscard\
  \ + re-claim). Read it before acting in either state.\n\n### Ship-custody RE-PIN\
  \ — the THIRD sanctioned exception (X-0422)\nThe guard above pins custody to `_recorded_commit_sha`\
  \ = the LATEST `commit_landed`. THREE\ngoverned self-commits legitimately emit a\
  \ `commit_landed` AFTER the ship — `task update --status\nparked`, `task pause`,\
  \ and `task update --status wont-do` — and so SHIFT\nrecorded custody past the ship,\
  \ wedging the task: `audit post --commit <ship>` refuses (ship ≠\nrecorded), a bare\
  \ `audit post` audits the PARK diff (GREEN-BY-VACUITY), and `task close` stays\n\
  RED-blocked.\n\nThe governed exit is `yitc-v2 audit post --task T-XXXX --commit\
  \ <ship-sha> --repin-ship`. It re-pins\naudit custody to the DISPLACED SHIP, and\
  \ it is NOT a weakening of the guard: every leg is DERIVED by\n`_require_ship_custody_repin`\
  \ from durable task-linked journal + git state, never asserted by the\ncaller, and\
  \ each refuses FAIL-CLOSED (same `read_gate_refused` kind=`verification-exists`\
  \ channel, NO\nnew event/emit path).\n\n**THE ADMISSION LEGS AND THE AUDITED SUBJECT\
  \ → SPEC-1022 (index).** The two paragraphs above say\nwhen custody counts as shifted\
  \ and name the governed exit; the verb itself decides whether a re-pin\nis admitted.\
  \ Its four legs — custody genuinely bookkeeping-shifted, the named commit equal\
  \ to the\ndisplaced ship, every displacing self-commit diff-limited to bookkeeping,\
  \ the ship\nintegrated-or-reachable — and the material the auditor is shown once\
  \ a target is admitted (the span\nof the card's own ships, on the re-pin route and\
  \ on the ordinary route of a multi-ship card) are\nthe reference SPEC-1022: `bin/yitc-v2\
  \ graph query SPEC-1022`, heading «Ship-custody re-pin —\nadmission legs and the\
  \ audited subject». Read it when a custody-mismatch refusal names the re-pin,\n\
  before running it, and when a re-pin is refused. No stage entry renders it.\n\n\
  JOURNAL-EVIDENCED + re-verified, never trusted: the completed `audit_post_completed`\
  \ event carries\n`custody_repin` + the ship/from shas + the displacing kind, and\
  \ the verdict YAML records the same\n(`custody_repin`, `custody_repin_ship_commit`,\
  \ `custody_repin_from`, `custody_repin_from_kind`). That\nmarker is a TRAIL, not\
  \ an assertion `task close` believes: closure RE-DERIVES the whole guard at the\n\
  close seam (the belt's SECOND control point — the zero-ship-diff two-point precedent)\
  \ and\npins to the guard-verified ship, so drift between audit-post and close (a\
  \ new bookkeeping record, a\nrewritten branch, a payload authored into the park\
  \ commit) trips the fence at the actual close moment.\nSelf-gating: a no-op unless\
  \ the verdict marks `custody_repin` — every ordinary close keeps the plain\n recorded-commit\
  \ pin, UNCHANGED.\n\n## Rationale\n\nThe `retrieved`-tier home of LIFECYCLE §Stage\
  \ 9 (plan `part-i-a-retrieval-delivery-mechanism`),\ndelivered at the Closure stage-entry\
  \ (`stage-entry:Closure`) + the `audit post` pointer,\nreached through the per-spec\
  \ `binding:` field (SPEC-0013).\n\n### History moved from the rule body\n\nEach\
  \ entry is a passage moved word for word out of the rule text of the section it\
  \ names;\nthe rule it explains stays there.\n\n- From «#### THE EVIDENCE-LOCATOR\
  \ ADDRESS SPACE»: The journal grammar is shared by all three\n  consumers, and widening\
  \ it in place would have silently widened the other two — the reason\n  sat the\
  \ third kind beside that shared home instead of inside it.\n- From «### Post-verification\
  \ authoring at close»: (fail-closed as of, amending the original\n  non-blocking\
  \ WARN)\n- From «#### The EVENT carrier must resolve machine evidence + a differential»:\
  \ (measured on\n  : no engine land row carries the payload key its mechanism writes;\
  \ every land row of the\n  consumer that runs it does)\n- From «#### The EVENT carrier\
  \ must resolve machine evidence + a differential»: An in-place ADDITIVE\n  extension\
  \ (SPEC-0005 §additive-extension): it adds an answer for a class the rule left with\
