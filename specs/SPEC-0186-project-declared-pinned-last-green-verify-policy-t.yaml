- bin/lib/debt.py#_consumer_carrier_posture
body: "## Scenario\n\nA project decides it will not pay the pinned last-green verify\
  \ leg, and says so out loud, with a\nreason, in its own operating contract. From\
  \ the next land onward that project's lands do not run the\nleg, and its cards stop\
  \ being isolated one-at-a-time for a supersession nothing will check. Every\nother\
  \ project is untouched; the engine is one more declarant, on the same terms. Turning\
  \ it off is not\na flick of a toggle: the declaration is itself an audited change\
  \ that names who accepted the risk and why.\n\n## Internal\n\n### Rule 1 — Two states,\
  \ and only two; `reason` is required IFF `never`\n`verify_policy.pinned_last_green`\
  \ takes exactly `all` or `never`. **`all` is the READ default** —\nabsence of a\
  \ declaration means `all`, fail-closed.\n\n**What a project is BORN with is a separate\
  \ question from what an absence READS, and since\nthe two answers differ** (SPEC-0189\
  \ rules 7+8; the earlier wording said `all` was both, which was\ntrue only while\
  \ `init` wrote no declaration at all). What an ABSENT declaration reads is UNCHANGED\n\
  and stays `all` — the sentence above, and the code path that serves it, are untouched.\
  \ What `init`\nWRITES moved: a birth carrying an explicit human confirmation writes\
  \ `never` with its reason AND\nthat confirmation's ratification provenance, while\
  \ an UNCONFIRMED or noninteractive birth writes no\ndeclaration at all and therefore\
  \ lands in the `all` state above. So no project is ever silently\nrelaxed, and no\
  \ existing consumer is re-declared by this change.\n\n**The born entry and `presence_policy:\
  \ opt-in` are NOT in conflict, and this rule says so rather than\nleaving a later\
  \ reader to re-derive it** (plan-check residual). The generated born block is\n\
  ADVISORY DEFAULT MATERIAL written at `init`: its guidance prose reaches every project\
  \ verbatim while\nits two keys ship COMMENTED, so a freshly-born project carries\
  \ the section as DOCUMENTATION and\ndeclares nothing — and ABSENCE of a declaration\
  \ is VALID and reads `all`.\n\n**The keys are commented rather than live, and the\
  \ plan bound that said otherwise is amended here\nrather than quietly reversed**\
  \ (external consult `t11281-born-block-vs-day-one-adoption-debt`,\nwhich refuted\
  \ the alternatives). The decomposition bound absorbed at the plan's accept gate\
  \ said a\nfreshly-born project \"carries `pinned_last_green: all` explicitly\".\
  \ Shipping it live was measured to\nbreak a different, already-shipped guarantee:\
  \ a LIVE key is a DECLARATION, the SPEC-0143 adoption\npre-seed stamps it `adopt@init`,\
  \ and the unratified-adoption debt view then reports a day-one debt for\nEVERY bootstrapped\
  \ project — against the named false-positive guard that a virgin consumer's born\n\
  carrier is CLEAN. The two rejected alternatives were accepting that nag (it breaks\
  \ a shipped guard for\nconsumers that will never touch this switch) and teaching\
  \ the debt view to exempt a born-default value\n(concern-specific policy inside\
  \ shared machinery). The sibling opt-in concern `audit_scrutiny` already\nships\
  \ commented for exactly this reason: an OPT-IN section whose ABSENCE is the fail-closed\
  \ default\nowes no stance at birth. What the bound was protecting — that the option\
  \ is VISIBLE in a born\ncontract, not hidden in a spec — is fully kept: the block,\
  \ its two states, the reason condition and\nthe audit cost are all written into\
  \ the born template where the project reads them. `presence_policy: opt-in`\nmeans\
  \ the fail-closed sweep DEMANDS nothing — it never asks a project to declare this\
  \ section, and only\nchecks the SHAPE of one that is present. Two roads to the same\
  \ safe state, neither of them a presence\nrequirement. This is also why EXISTING\
  \ consumers need no migration: <project> / <project> / <project> hold\na `yitc-ops.yaml`\
  \ that will not receive the new section, and that is correct BY CONSTRUCTION rather\
  \ than\nan undelivered carrier — so the parked born-subfield-delivery card is NOT\
  \ triggered by this\nconcern.\n\n**The schema is VALUE-DEPENDENT, stated here so\
  \ it is not left to a template comment:**\n`reason` is **required and non-empty\
  \ if and only if** the value is `never`. For `all` it MAY be\nabsent or null — which\
  \ is why the born template ships `pinned_last_green: all` with `reason: ~` and\n\
  that is VALID, not a contradiction. A `never` with a missing, null, or empty/whitespace\
  \ `reason` is\nan **INVALID declaration**: it does not take effect, and the project\
  \ reads `all` (fail-closed, the\nsame direction as rule 4's unresolvable case).\
  \ Probed at Verification 8.\n\nA third state — run the leg only where audit-post\
  \ was waived — was considered and **REJECTED**. All\nten demonstrated catches occurred\
  \ on cards whose audit-post RAN and passed GREEN, so that state would\nhave caught\
  \ 0 of 10: the compensating-control intuition is inverted for this layer, whose\
  \ whole value\nis catching what a PASSING audit missed. Recorded as rejected design\
  \ rationale — it is not a claim\nthat such a state must have zero value in future.\n\
  \n### Rule 2 — Its own carrier, and NOT `audit_scrutiny`\nThe declaration lives\
  \ in a `verify_policy:` section of the project's `yitc-ops.yaml` (the SPEC-0093\n\
  ops-contract). It **must not** be carried by `audit_scrutiny`: CHARTER §Project-declared\
  \ audit-post\nexemption bound 1 is `audit-post ONLY — a case never reaches audit-pre,\
  \ the Tests stage, the\nland-verify layers, the worktree-before-write rule, or the\
  \ Closure probes`, and the pinned leg is a\nland-verify layer. That bound is NOT\
  \ amended here; it exists so an audit-post exemption can never\nquietly become a\
  \ licence to drop verification.\n\n**The two surfaces do not compose.** An `audit_scrutiny`\
  \ case never affects the pinned leg; a\n`verify_policy` declaration never affects\
  \ audit-post. Neither implies the other in either direction.\n\n### Rule 3 — One\
  \ declaration, generated surfaces, ONE reader (SPEC-0128)\nThis spec's `concern:`\
  \ block is the single authoritative declaration. The born `yitc-ops.yaml`\ntemplate\
  \ entry and the declare-or-waive fail-closed sweep are GENERATED from it at `graph\
  \ build`.\nNo hand-maintained parser, no hand-maintained value list, no second registry.\n\
  \n**The enum and the `reason` condition are carried by a NAMED KERNEL VALIDATOR,\
  \ not by prose or a\nlist.** The `concern:` block declares `shape_hook: verify_policy_pinned_last_green`\
  \ alongside its\nFINITE metadata (`declare_key`, `presence_policy: opt-in`, `waiver_policy`);\
  \ that hook is the ONE\nenforcement carrier for the closed `all|never` enum and\
  \ for the reason-required-IFF-`never` condition,\nso the generated declare checks\
  \ and the runtime reader share a single source and no hand-maintained\nschema or\
  \ value table exists anywhere. This is the existing SPEC-0128 rule-2 mechanism —\
  \ the same\ncarrier the STRICT security waiver's reason+compensating_control+expiry\
  \ stance check uses — not a new\nshape language (SPEC-0128 rule 1 forbids a shape-DSL).\n\
  \n**Implementation constraint — ONE reader serves BOTH call sites.** Generation\
  \ covers the born\ntemplate and the sweep, but the RUNTIME value is read by two\
  \ places: the land verify path (rule 4)\nand batch formation (rule 9). Both MUST\
  \ resolve it through the **one existing ops-contract/concern\nparser entry point**\
  \ — no second ad-hoc YAML reader, and no enum table duplicated beside the\ngenerated\
  \ one. This is what makes the rule-9 \"one authority, two call sites\" requirement\
  \ concrete\nrather than aspirational, and it is the probe that carries the otherwise-weak\
  \ F3 removal claim:\nif a second reader or a second value list appears, the change\
  \ has ADDED machinery, not reused it.\nProbed at Verification 7.\n\n**A reader CALL\
  \ that decides nothing.** The Stage-6 `task test --run` result line asks\nthis same\
  \ reader, of the same main tree rule 4 names, whether to print its pinned-leg sentence.\n\
  That is wording only: no verdict, leg or class assignment reads the answer, and\
  \ every doubt\nprints the sentence.\n\n### Rule 4 — The policy is read PRE-MERGE,\
  \ from the old tree\nA land resolves the policy from the **base/main** tree it is\
  \ landing onto, never from the merged\ncandidate. A diff that sets `never` therefore\
  \ still pays the leg on its OWN land; the new value takes\neffect only from the\
  \ next land. Reading post-merge would let the diff that disables the layer exempt\n\
  itself from the layer — the self-reference hole this rule closes. Unresolvable policy\
  \ → `all`\n(fail-closed), the same direction as the existing `_verdict = \"observable\"\
  ` classifier fallback.\n\n### Rule 5 — The guard sits on the DECLARATION, not on\
  \ the diff\nTurning the leg off is governed by making the DECLARATION expensive\
  \ and visible, not by re-checking\nevery diff. `yitc-ops.yaml` is inside the SPEC-0077\
  \ pinned-test surface, so it is fast-path\nINELIGIBLE at any diff size (LIFECYCLE\
  \ §Two flow types): any edit to it — including this section —\nmechanically takes\
  \ the substantive path with BOTH audits, and the `reason` is mandatory and non-empty\n\
  or the declaration is invalid.\n\nCarrying SPEC-0178's governance-surface guard\
  \ over verbatim was MEASURED and REJECTED: it catches\n82.3% of the 1168 lands on\
  \ which the leg actually ran, leaving the switch effective on 17.7% — a\ndecorative\
  \ switch. That guard is broad because its exemption is per-case and `match`-patterned,\
  \ so a\ncase can be CRAFTED to cover exactly the dangerous diff. A binary repo-level\
  \ switch has no `match`\nand nothing to craft, so the defence it imports is against\
  \ a capability this construction lacks.\n\n### Rule 6 — The engine is switchable\
  \ by declaration, on the same terms\nThe engine may make the same declaration a\
  \ project makes, through rule 2's carrier, and rules 1, 4,\n5, 7, 8 and 9 then hold\
  \ for it exactly as for a project. Nothing here is engine-specific: the engine\n\
  gets no value, default or exemption a project does not have.\n\nWhat the engine\
  \ declares there is its own verify policy and nothing else. The engine is not a\n\
  consumer of its own ops contract, so every sweep that judges a repository AS a consumer\
  \ of that\ncontract excludes the engine by IDENTITY, never by whether a file exists.\
  \ Wherever this corpus says\nthe engine has «no carrier» or «no ops contract», it\
  \ is the CONSUMER ops contract that is meant.\n\nThe engine's declaration is this\
  \ repository's own: it is never part of a release, so a release\ncarries this rule\
  \ and never the engine's choice, and no adopter inherits that choice as a default.\n\
  \n(Amended by : this rule previously forbade an engine declaration, on the ground\
  \ that the\nengine had no carrier. Why that was lifted lives in the task record\
  \ and its plan, not here.)\n\n### Rule 7 — A distinct verify outcome, never a reuse\
  \ of `candidate`\nA land that skips the leg by policy records `verify_mode: candidate_policy_off`.\
  \ This is a new value\nin the EXISTING `land_completed.verify_mode` value set —\
  \ SPEC-0025 (the `events.jsonl` schema home) is\namended in the same change; no\
  \ new event type, no second schema home.\n\nNot cosmetic. Conflating \"did not run\"\
  \ with \"ran and passed\" already corrupted analysis of this very\nlayer: 15 of\
  \ 30 decisive cases were misread as \"the tree later passed the pinned check\" when\
  \ the leg\nhad simply not run. Shipping the switch without this value poisons every\
  \ future measurement at source.\n\n**The value marks a POLICY SKIP, not merely a\
  \ project's policy**. It is recorded when the land\nDID touch the verifier surface\
  \ — i.e. the leg would have run — and the declaration stopped it. A land\nthat touched\
  \ nothing records plain `candidate` under either policy, because nothing was skipped\
  \ there;\nreading `candidate_policy_off` as \"this project has the leg off\" instead\
  \ of \"this land skipped the leg\"\nwould re-introduce the same conflation in the\
  \ other direction.\n\n### Rule 8 — `--rebaseline` refuses when the leg did not run\n\
  A re-baseline waives a superseded pinned check. Where the leg did not run there\
  \ is nothing to waive,\nso `--rebaseline` REFUSES with that reason. Additive and\
  \ orthogonal to, which left the\nrebaseline gate (`_change_is_audited`) unchanged\
  \ and altered only the refusal message.\n\n### Rule 9 — Batch formation consults\
  \ the same resolver, and lands FIRST\nThe three-class batch formation must read\
  \ the policy through the SAME resolver a land uses — one\nauthority, every call\
  \ site — or formation and verify disagree. When the policy resolves to `never`,\n\
  what is INERT for class assignment is EVERYTHING that describes the unrun leg: the\
  \ pinned-supersession\nkey (a member carrying it is not forced into the isolate-alone\
  \ class for a check that will not run)\nAND the cost ladder's two-pass rung itself,\
  \ which exists only to say «this member pays the pinned leg\nas well». A member\
  \ is otherwise isolated for a second pass that does not happen — the residual\n\
  left when it wired this resolver into the key alone, closed. All three inputs (repo\
  \ policy,\nthe card's audit-post presence, the diff paths) are readable at the formation\
  \ instant, and the rung\nmeanings themselves are SPEC-0184 rule 9's business, not\
  \ this spec's: this rule supplies the policy\ninput, that rule owns the ladder.\n\
  \n**Ordering:** the formation-side read must land BEFORE `never` is reachable. shipped\
  \ the\nthree-class formation with no notion of this policy, so until then a declaring\
  \ project would still\nhave its keyed cards isolated for an unrun check.\n\n###\
  \ Rule 10 — The Stage-6 credit is ON by default, and a project may opt out here\n\
  SPEC-0065 §Bound lets a land take its CANDIDATE-leg verdict from the task's own\
  \ Stage-6 run instead of\nrepeating it, when the land itself proves five conditions:\
  \ (1) `main` has not advanced since the run —\nthe base the run recorded is its\
  \ merge-base with `main` — or advanced only by inert paths no declared\ntest names;\
  \ any other advance ends the credit;\n(2) its candidate tree is the tested tree\
  \ apart from inert paths; (3) the row is the runner's own\ngreen, full-breadth,\
  \ marked row — never a red, partial or hand-recorded one; (4) the run's set covers\n\
  the land's set; (5) the any-author floor and the host-leak check still run, and\
  \ the pinned leg runs\nexactly as rules 1-9 here say. That rule and its conditions\
  \ are homed there\n(`bin/yitc-v2 graph query SPEC-0065`); THIS rule owns only the\
  \ per-project switch.\n\n`verify_policy.stage6_credit` takes `allowed` or `never`.\
  \ **Absence reads `allowed`** — the credit is ON\nfor a project that declares nothing,\
  \ and for the engine on the same terms (rule 6). `never` switches\nit off: every\
  \ land of that project then runs its candidate verify, as before the credit existed.\n\
  \n**It fails toward VERIFYING.** An unrecognised value, a section that is not a\
  \ mapping and a carrier\nnobody can parse all read `never` — the same direction\
  \ rule 1 fails in, since here it is `never` that\nkeeps the check. For that reason\
  \ NO `reason:` is owed (opting out removes no verification), and the\nkey is not\
  \ a relaxation for SPEC-0189's purposes. It sits beside `pinned_last_green`, which\
  \ a PRESENT\nsection must still declare (rule 1).\n\n**The two keys do not compose.**\
  \ The credit never decides whether the pinned leg runs, and the pinned\npolicy never\
  \ decides whether the candidate leg may be credited: a land whose candidate leg\
  \ is\ncredited runs the pinned leg, or records `candidate_policy_off`, exactly as\
  \ rules 1, 4 and 7 say.\n\n**Read PRE-MERGE, from the base tree (rule 4's reading).**\
  \ A diff that turns the credit back ON still\npays its own candidate verify; the\
  \ new value takes effect from the next land.\n\n**One reader, still (rule 3).**\
  \ The switch is answered off the SAME read of the carrier that serves\n`pinned_last_green`\
  \ — no second function opens the ops contract for it.\n\n## Rationale\n\nThe external\
  \ audit `decisions/groupland-strategy-audit-adhoc.yaml` returned RED, finding 3:\
  \ audit the\nhistorical pinned failures, classify unique real catches versus audit-covered\
  \ ones, then trial a\nnarrowed or removed leg behind a reversible gate.\n\nThat\
  \ classification was done (`events.jsonl#ts=`) over 496 aborts on 301 kernel\nbranches,\
  \ whole history. Because audit-post runs at Stage 8 and closure at Stage 9, every\
  \ pinned\nfailure at land is BY CONSTRUCTION a diff the external auditor had already\
  \ passed GREEN/YELLOW — a\nnatural experiment, not a proxy. Ten branches answered\
  \ the pinned objection by changing the tree\nrather than blessing it; five touched\
  \ production `bin/`. So the leg is not removable.\n\nIt is also not universally\
  \ worth its price: it runs on 27% of kernel lands, 21% <project>, 9% <project>,\n\
  and costs the suite a second time (2.93 s scaffold, then 3284.8 cpu-s over 792 files).\
  \ In\n<project> 61 of 62 firings are the untouched-file drift class and zero are\
  \ catches. Hence a per-project\ndecision rather than a global one.\n\nDesign fork\
  \ consulted before this spec existed:\n`decisions/pinned-layer-project-switch-audit-adhoc.yaml`\
  \ (YELLOW, no RED blocker).\n\n## Verification\n\nDifferential probes, one per silently-breakable\
  \ rule (SPEC-0165):\n1. R1/R4 — `never` declared → leg does not run and the land\
  \ records `candidate_policy_off`; policy\n   removed → same tree runs it.\n2. R4\
  \ — a diff that SETS `never` still pays the leg on its own land; the next land does\
  \ not.\n3. R9 — with `never`, a member carrying the supersession key is not forced\
  \ to the isolate-alone\n   class; with `all`, it is.\n4. R8 — `--rebaseline` refuses\
  \ when the leg did not run.\n5. R6 — an engine declaration switches the engine's\
  \ leg exactly as a project's does, read from the\n   base tree in both directions;\
  \ and the engine is excluded from the consumer-posture sweeps by\n   identity —\
  \ with that exclusion removed, the same tree shows the consumer readings.\n6. R2\
  \ — an `audit_scrutiny` case does not change the pinned leg, and a `verify_policy`\
  \ declaration\n   does not change audit-post (non-composition, both directions).\n\
  7. R3 — the born template entry and the declare-or-waive sweep are GENERATED, and\
  \ BOTH runtime call\n   sites (land verify, batch formation) resolve the value through\
  \ the ONE existing ops-contract\n   parser: no second reader, no second enum table.\
  \ This probe carries the F3 removal claim.\n8. R1 — a `never` declaration whose\
  \ `reason` is missing, null, or whitespace-only is INVALID and the\n   project reads\
  \ `all`; the same declaration with a non-empty reason takes effect. `all` with an\n\
  \   absent/null reason is VALID (the born default), so the probe must assert both\
  \ directions.\n9. R10 — with no declaration a land that meets SPEC-0065 §Bound's\
  \ five conditions is credited (no\n   candidate verify); the same land under `stage6_credit:\
  \ never` on the base tree runs it. An\n   unrecognised value, a non-mapping section\
  \ and an unparseable carrier each read `never`; a section\n   declaring both keys\
  \ validates under the rule-3 hook; and under a verify-path touch the credited\n\
  \   land still runs the pinned leg (policy `all`) or records `candidate_policy_off`\
  \ (policy `never`).\n"
