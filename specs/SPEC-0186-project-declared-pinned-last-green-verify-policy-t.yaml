concern:
  section: verify_policy
  born_order: 220
  spec: SPEC-0186
  declare_key: pinned_last_green
  presence_policy: opt-in
  update_policy: owner-declared
  waiver_policy: reason-required-on-never
  born_stance: permissive
  detector: verify-policy-pinned-last-green
  shape_hook: verify_policy_pinned_last_green
  born: "verify_policy:\n  # SPEC-0186. Whether THIS project pays the SPEC-0077 pinned\
    \ last-green verify leg at land:\n  # all — run it. The DEFAULT, and the state\
    \ every project is born in (absence reads `all`).\n  # never — skip it; a test\
    \ weakened inside a branch whose own suite stays green is then caught\n  # by\
    \ audit-post alone. `reason:` is MANDATORY for `never`, or the declaration is\
    \ INVALID.\n  # Editing this is an AUDITED act (this file is pinned-test surface);\
    \ unrelated to `audit_scrutiny`;\n  # the ENGINE declares it the same way (SPEC-0186\
    \ rule 6).\n  # see SPEC-0186 §Rule 1, §Rule 5\n  # The keys are COMMENTED by\
    \ design — uncomment one to make a real choice:\n  # pinned_last_green: all\n\
    \  # reason: ~\n  #\n  # BORN-PERMISSIVE DECLARATION (SPEC-0189): the fragment\
    \ below is LIVE. It is written only into a\n  # birth carrying an explicit per-section\
    \ confirmation, which records its ratification:\n  # `init --confirm-born-permissive\
    \ verify_policy:<owner>`\n  # an unconfirmed or noninteractive birth has the section\
    \ WITHHELD (absence reads `all`).\n  # ACCEPTED RISK — no pinned last-green leg\
    \ from day one. Restoration is this project's own act —\n  # set `pinned_last_green:\
    \ all` here (SPEC-0189 rule 4).\n  # see SPEC-0189 §Rule 8\n  pinned_last_green:\
    \ never\n  reason: \"born permissive per the owner directive of 2026-08-21 — a\
    \ new project does not pay the\n    pinned last-green leg from day one; the periodic\
    \ review watches for the absence starting to cost\n    something and PROPOSES\
    \ turning it back on (SPEC-0189). Restoration is this project's own explicit\n\
    \    act — set `pinned_last_green: all` here.\"\n"
