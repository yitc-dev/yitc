id: SPEC-0059
title: Universal stage contract — deliver / check / readiness across the task and plan axes (the per-verb map is a derived view, not stored here)

status: active

created_at:

consumed: false

implements: # ACTIVATED : the three UNIVERSAL enforcement primitives that
                               # realize the contract's three blocking legs on BOTH axes. The per-verb
                               # wiring (which verb calls which) is the DERIVED view — regenerates by grep,
                               # NOT enumerated here (§The map is a DERIVED VIEW).
  - bin/lib/gates.py#_require_reads # read-check leg (semantics home: SPEC-0050)
  - bin/lib/gates.py#_require_stage_correspondence # stage-correspondence leg
  - bin/lib/cli.py#_require_verification_artifact # verification-exists / readiness leg (R4)

body: |
  ## Scenario

  Every lifecycle stage — on BOTH axes (the task 9-stage lifecycle and the plan
  `draft→specs→trial→accepted→executing→postcheck→realized` FSM) — runs ONE rhythm, so the AI is
  reliably pointed at the right doctrine and cannot silently skip the read or act at the wrong stage.
  A stage's ENTRY delivers that stage's doctrine; the stage's WORK-VERB both checks the doctrine was
  read in the current session AND does the stage's work; a readiness gate confirms the prior stage's
  exit plus the existence of the per-unit verification artifact. This spec states the cross-axis
  INVARIANT only; the per-verb realization is owned by the existing carriers (§The map is a derived
  view), never restated as a normative table here.

  ## Internal

  This spec states ONLY the cross-axis INVARIANT — that the three-leg stage rhythm holds IDENTICALLY
  on BOTH axes. It RE-HOMES nothing: every per-surface rule named below stays normative in its own
  home (read-check semantics → SPEC-0050; refusal-event shape/kinds → SPEC-0025; report-only structural
  pre-pass → SPEC-0046; per-stage doctrine → SPEC-0014/0015/0027/0034/0036; delivery binding →
  SPEC-0013). So NO rule-text is deleted from those specs — this is consolidation of the one thing none
  of them owns (the cross-axis contract), NOT a second normative layer over them (accept-gate F1,
  2026-06-08). The §Replacement map below makes that boundary explicit; the §Enforcement-classes and
  §Carrier-rule sections state the invariant and POINT — they do not re-define their homes' rules.

  ### The universal stage contract — three legs (the cross-axis INVARIANT)
  Every stage, on BOTH axes, has these three legs. This spec asserts only that the legs EXIST at every
  stage and NAMES each leg's home; each leg's behavior-changing SEMANTICS live ONLY in that home — no
  sentence here changes consumer behavior a home already owns (accept-gate F1, 2026-06-08):
  1. **Entry DELIVERS the stage doctrine** — home: the per-stage doctrine spec, routed by its `binding:`
     (delivery mechanics → SPEC-0013). The ONE cross-cutting rule SPEC-0059 owns (no per-stage spec can
     state it about all the others): a stage doctrine spec carries how-to + how-to-VERIFY + the
     mechanical-check procedure as ONE doctrine. Carve-out: **Filing** has no preceding entry verb, so
     its doctrine is a session-start REFERENCE (availability, no gate) and only its CHECK leg holds.
  2. **Entry READINESS gate** — home: the `_require_*` code gates + each per-stage spec's entry-gate.
     Invariant: the gate confirms BOTH (a) the prior stage's exit AND (b) the per-unit verification
     artifact EXISTS (the per-axis specifics — task `acceptance` / plan realization-exit — are
     SPEC-0027 / SPEC-0034's, not restated here).
  3. **Work-verb CHECKS its stage's docs were read (current context) AND does the work** — home: the
     read-check primitive SPEC-0050 (session-scope + the `read_gate_refused` emission) + the
     stage-correspondence guard `_require_stage_correspondence`. Invariant: every stage work-verb
     carries BOTH a read-check leg AND a stage-correspondence leg.

  ### Enforcement split (the invariant; semantics point out)
  The three checks above BLOCK (refuse the verb); the decomposition structural pre-pass is REPORT-ONLY
  (home: SPEC-0046 — a judgement heuristic, never a hard block). Every BLOCK emits `read_gate_refused`
  with its `kind` (`read-check` / `stage-correspondence` / `verification-exists` /
  `post-verification-fill`) — the emission + the event shape are owned by SPEC-0025 / SPEC-0050;
  SPEC-0059 asserts only that the emission is UNIFORM
  across every blocking kind, so discipline is analyzable **per kind** (`cli_invoked` denominator;
  `read_gate_refused` numerator split BY `kind` — the lens is kind-aware, never one mixed ratio).

  ### Carrier rule (no-work-verb stages) — a contract CLASS
  A stage with no single acting work-verb has its check carried by its ENTRY/TRANSITION verb (or the
  next control-point); no stage is left without a carrier. This is the invariant CLASS — the CONCRETE
  carrier verb per stage is a realization owned by that stage's per-stage spec/code, not fixed here
  (illustratively today: `trial` → `plan stage trial` + journaled runs; `realized` → the `plan stage
  realized` finalize-gate; `postcheck` soak → the `audit post --plan` refresh).

  ### The map is a DERIVED VIEW, not a normative store (Single-SoT, P5)
  The per-verb map (verb → entry-delivers / work-verb-checks+does / readiness) is NOT hand-authored
  here. Each of its three columns is ALREADY owned by an existing single source — restating them in a
  normative table would double-bookkeep and drift (#10) as the verb surface evolves:
  - **entry-delivers** = the per-spec `binding:` fields, GENERATED into the graph + the floor-trigger-map
    (the existing generated view; never hand-edited);
  - **work-verb checks+does** = each stage's own per-stage spec (SPEC-0014/0015/0027/0034/0036/0050…) + the verb's code;
  - **readiness** = the `_require_*` code gates + the per-stage spec's stated entry-gate.
  So: this spec holds the cross-axis INVARIANT (the three legs above + enforcement classes + the
  no-work-verb carrier class). The verb INVENTORY stays `bin/yitc-v2 --help`; the delivery relations
  stay the generated binding view. A CONSOLIDATED map artifact, IF a real drift incident ever pulls
  for one, is produced as a GENERATED view (the floor-trigger-map precedent: source first, generate
  later) — never a hand-maintained table. When a verb/stage/gate changes, the change lands in its TRUE
  owner only (binding source · per-stage spec · code gate); any consolidated view regenerates.

  GREEN is always a work-verb's RESULT that gates the NEXT stage's entry — never a stage's own
  precondition (an invariant of the contract, not a map row).

  ### Replacement map — consolidation, not a second rule layer (accept-gate F1, 2026-06-08)
  | leg / concern | OWNED here (the irreducible invariant) | stays normative in its home (this spec only POINTS) |
  |---|---|---|
  | entry-delivers | "every stage entry delivers its doctrine" | the per-spec `binding:` source + the generated floor-trigger-map view (SPEC-0013) |
  | work-verb checks+does | "the work-verb checks ITS stage's docs read, current session, then does the work" | read-check semantics → SPEC-0050; per-stage doctrine → SPEC-0014/0015/0027/0034/0036 |
  | readiness | "prior-exit satisfied AND the per-unit verification artifact exists" | the `_require_*` code gates + each per-stage spec's stated entry-gate |
  | refusal event | "every blocking refusal is journaled" | event shape + kinds → SPEC-0025 / SPEC-0050 |
  | enforcement split | "read-check + stage-correspondence + verification-exists BLOCK; structural pre-pass REPORT-ONLY" | the structural pre-pass rule → SPEC-0046 |
  **No rule-text is DELETED from those specs** — SPEC-0059 re-homes none of them; it adds the cross-axis
  invariant none owns. The deletion obligation is CONDITIONAL: if a corpus pass (R3) ever finds a
  per-surface rule actually DUPLICATED in this body, THAT duplicate is the delete target (pointerize it
  into its home), keeping this spec invariant-only. At birth this body carries only the invariant + pointers.

  ### First-stage check-carrier gap (an invariant, NOT a verb list)
  Today the Analysis (task) and draft (plan) stages have NO dedicated work-verb, so under checkpoint 3
  they lack a check carrier — a gap each axis must close. **The INVARIANT:** each first stage MUST gain
  a check carrier. The CONCRETE realization (the carrier verb + any stage-artifact field it records, and
  the one-carrier-per-datum rule for that field) is owned by the per-stage mechanics spec (SPEC-0027
  task / SPEC-0034 plan) and built by the plan's activation tasks — named THERE, not here (the
  derived-view discipline above; concrete carriers are realizations, not contract text).

  ## Parameters

  None consumed.

  ## Rationale

  Real incident: the `postcheck-to-realized` plan re-designed a procedure SPEC-0034 already shipped
  because `plan file` delivered SPEC-0034 as a POINTER that was never fetched, and no verb gated the
  read before `plan stage specs`. The SPEC-0050 pilot (`task commit` / `task close`) proves the
  read-check lever works; this contract GENERALIZES that proven pilot to every stage's work-verb. The
  contract is CROSS-AXIS — neither SPEC-0034 (plan-axis mechanics) nor SPEC-0027 (task-axis FSM) nor
  SPEC-0013 (delivery binding) owns it — so it lives here, in one home, pointed to from LIFECYCLE.

  ## Verification

  Behavioral (primary):
  - each mapped work-verb REFUSES when its stage docs are unread (read-check) and when invoked at the
    wrong `current_stage` (stage-correspondence); PASSES on the valid flow (no false-refuse);
  - every blocking refusal emits a `read_gate_refused` event with its `kind`;
  - the verification-artifact-exists check refuses when the artifact is missing (task `acceptance`
    before Tests/Closure; plan realization-exit at accept-gate / postcheck entry);
  - a real plan-draft cannot reach `plan stage specs` without a recorded SPEC-0034 fetch.
  Structural (secondary): every lifecycle stage resolves to the three contract legs (delivery carrier ·
  check carrier · readiness gate) through its TRUE owners (binding · per-stage spec · code gate) — NOT
  a table in this spec.
  Evidence: the journal (`cli_invoked` + `read_gate_refused`); the kind-aware `discipline-ratio`
  saved view (`bin/yitc-v2 graph query discipline-ratio`) is the analysis lens — the
  `read_gate_refused` numerator split BY `kind` over the `cli_invoked` denominator, a SEPARATE ratio per
  kind (read-check / stage-correspondence / verification-exists / post-verification-fill), never one
  mixed ratio. The `post-verification-fill` kind is the SPEC-0038 §3 fill-or-waive block at
  `task close`; its ratio is the successor signal to the retired `post_verification_gap` marker — the
  rule's own skip rate stays measurable from the journal after the block replaced the WARN. The view
  MECHANISM is owned by SPEC-0031; this is a non-normative cross-reference (it names the
  realizing lens, it does not change what this spec requires).

