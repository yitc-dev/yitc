  \ it would emit a row\n    the fold DROPS, i.e. a verb reporting success while the\
  \ store learns nothing.\n    **READ SURFACE:** `cross show` prints it as its OWN\
  \ line, `closed naming task:`, beside the\n     `filed for task:` birth link and\
