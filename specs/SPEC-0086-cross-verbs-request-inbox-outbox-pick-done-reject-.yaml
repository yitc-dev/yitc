body: "## Scenario\n\nA session works the shared coordination log entirely through\
  \ `cross` verbs — never a raw append. It\nfiles an item (`cross request`), sees\
  \ what is addressed to it (`cross inbox`) or what it authored and\nmust now finalize\
  \ (`cross outbox`), and drives an item through its protocol (`pick` → `done` →\n\
  `close`, or `ack`, or `reject`). At session start it is SHOWN its `outbox` — the\
  \ items it authored\nthat a peer has fixed and now await its close — so \"consumer\
  \ sees fixed → verify at start\" is a\nsurfaced fact, not a manual peer-scan. Each\
  \ verb owns the unsafe mechanics (id allocation, atomic\nappend, the role-emit guard)\
  \ and emits its `cross_*` event deterministically.\n\n## Internal\n\nTHE VERB CONTRACT\
  \ for the shared coordination log — the `cross` verb group, the fold-rendering views,\n\
  and the `outbox` session-start surface (with its post-`/compact` re-delivery). The\
  \ DATA model + event\nFSM + view fold-semantics live in the protocol sibling (this\
  \ plan's protocol spec); the store's\nauthority/placement in the authority sibling.\
  \ This spec owns only the CLI surface + the startup\ndelivery. Each verb is checked\
  \ against `patterns/verb-design.md` (the 5 aspects). Five rules.\n\n**AUTHOR-SIDE\
  \ VERBS → SPEC-1020 (index).** The rule-1 bullets of the three author-side verbs\
  \ —\n`cross request`, `cross dispute` and `cross close` — live in SPEC-1020, under\
  \ the heading of rule 1:\n`graph query SPEC-1020`, then search for the verb name.\
  \ Rule 1 below keeps one pointer bullet for each of\nthem and the bullet of every\
  \ other verb in full. Where text kept in this spec says «§`cross close`»,\nnames\
  \ `cross close --note` as «below», or cites the re-entry disposition or its whose-echo\
  \ decision,\nit refers to the `cross close` bullet in SPEC-1020. What rules 3, 4\
  \ and 6 of this spec say about a\nrequest or a close stays here. A new case of one\
  \ of these three verbs is authored in SPEC-1020.\n\n### 1. The verb group — names\
  \ pinned (D3), each a control chokepoint for its write\nTen verbs (the D3-pinned\
  \ names, plus the author-side `dispute`); raw appends to the shared store are FORBIDDEN\
  \ — a `cross` verb is\nthe ONLY path (verb-design #4 control-chokepoint), so the\
  \ id-allocation + atomic append + role-guard +\n`cross_*` emit cannot be hand-done\
  \ wrong:\n  - **`cross request`** — the AUTHOR files an item. HOMED in SPEC-1020\
  \ §`cross request` and NOT restated\n    here (SPEC-0005 rule 8).\n  - **`cross\
  \ inbox`** (read-only) — renders the fold-derived INBOX view (non-terminal `to:me`);\
  \ a query\n    verb, no mutation. (View definition: protocol sibling rule 5a.)\n\
  \  - **`cross outbox`** (read-only) — renders the fold-derived OUTBOX view (`from:me`\
  \ awaiting MY\n    action: done-awaiting-close / rejected-awaiting-close); a query\
  \ verb. (Same fold home.)\n  - **`cross pick`** (#2+#3+#4) — receiver accepts; appends\
  \ + emits `cross_picked` (role-guard: only `to`).\n    **Intake hygiene, BEFORE\
  \ the FSM guard:** REFUSE (journal-observable) a STALE pick — a DONE\n    local\
  \ task already resolves the item (its `resolves_cross` link names it), naming the\
  \ resolver, with\n    a `--force` override; and SURFACE a not-actionable-for-this-side\
  \ item (addressed to a different peer)\n    as a clear skip line (the FSM guard\
  \ then refuses it wrong-role). So no side re-picks already-addressed\n    or irrelevant\
  \ work (the duplicate-intake class). The advisories are PURE/derived (`intake_advisories`\n\
  \    over a deterministic done-resolver scan), no stored state.\n    **Double-intake\
  \ visibility (X-0456) — the THIRD advisory, `already_held`:** an item a peer\n \
  \   ALREADY holds (a live `picked`/`done` intake, per the fold's derived `held{by,ts,task}`\
  \ view) is\n    REFUSED naming the HOLDER + its pick ts + its resolving task when\
  \ known. This adds NO gate — the FSM\n    guard (`from_states={\"requested\"}`)\
  \ already refused this state; what was missing is WHO holds it, so a\n    raced\
  \ second intake reads as a bare wrong-state code instead of a nameable conflict.\
  \ NOT\n    `--force`-overridable (`--force` covers only the staleness advisory;\
  \ a second pick is\n    FSM-illegal regardless). A SETTLED (terminal) item is excluded\
  \ — that is the `already_addressed`\n    staleness case above, not a concurrent\
  \ double-intake.\n    **The `task file --resolves-cross` half of the same rule:**\
  \ the auto-pick below SKIPS an item\n    it cannot advance; when the cause is `already_held`,\
  \ the filing PRINTS an already-linked advisory\n    naming the holder + its existing\
  \ task (report-only — it never blocks a filing, emits no event, and\n    never changes\
  \ the exit code). Both surfaces render the holder through the ONE shared\n    `describe_holder`\
  \ renderer, so the wording cannot drift between them (the `premise_review_cue`\n\
  \    single-emitter precedent). Real incident: two live controllers both intook\
  \ X-0452 while the filing\n    path skipped SILENTLY -> duplicate cards and a wasted\
  \ dispatch cycle (a recurrence of\n    the X-0430 two-controllers-one-concern class).\n\
  \    **Unanswered-link visibility (X-0943) — the file-side warn for EVERY link the\
  \ auto-pick\n    could not advance.** The close-side auto-`cross_done` fires ONLY\
  \ for an item self RECEIVES that is\n    EXACTLY `picked`, so PICKED is the discriminator\
  \ and an UNPICKED linked item is silently NEVER\n    answered. The `already_held`\
  \ advisory above covers ONE of the auto-pick's skips; the rest — a\n    non-pickable\
  \ `note` kind, a wrong-role link, and a `parked`/`wont-do` filing that does not\
  \ auto-pick\n    at all — emitted nothing. So `task file` PRINTS one WARN per link\
  \ that will not be answered at\n    close, naming the item, its KIND and STATUS,\
  \ and the next command that is CORRECT FOR THAT KIND: a\n    `note` is advised toward\
  \ `cross ack` (its only receiver terminal — advising `cross pick`/`cross done`\n\
  \    would name a command the verb REFUSES, which is worse than no warn), a pickable\
  \ kind toward\n    `cross pick`, an item this side AUTHORED toward `cross close`.\
  \ An item already `done`/terminal, or\n    one the close WILL answer, stays silent;\
  \ ids the already-linked advisory just named are skipped so\n    one filing never\
  \ double-signals one item. The \"will it answer?\" oracle is `cross_done_for_close`\n\
  \    ITSELF, not a re-derived copy of its conditions, so the warn and the emit cannot\
  \ drift apart. ADDS\n    NO GATE — report-only, no event, no status change, no exit-code\
  \ change, fail-open (making `close`\n    REFUSE would gate a card on a peer-log\
  \ state, CHARTER non-goal #7). Real incident: <project>'s\n    X-0750 / X-0829 /\
  \ X-0649 each stayed `[note/requested]` after the resolving task landed done, while\n\
  \    `cross pick` refused them naming that same done task and `cross show` printed\
  \ `task: (none)` — three\n    surfaces, three different answers about one item;\
  \ their PICKED pair auto-closed correctly, which is\n    what isolates PICKED as\
  \ the cause. Pure renderer: `cross.unanswered_cross_link_advice`; the ONE print\n\
  \    site `cross.print_unanswered_cross_link_warns`.\n    **Auto-pick on `task file`,\
  \ the symmetric mirror of the close-side auto-`cross_done`:**\n    filing a READY\
  \ local task that carries `resolves_cross:[X-NNNN]` auto-emits `cross_picked` for\
  \ each\n    linked item self RECEIVES that is EXACTLY `requested` + a pickable kind\
  \ (`task`/`bugfix`) — so the\n    normal flow (file → work → close) moves the item\
  \ off the \"new inbound\" surface AND makes the\n    close-side auto-`cross_done`\
  \ (which fires only from `picked`) reachable. Idempotent + fail-open\n    (pick\
  \ ONLY when the item exists, `to==self`, kind pickable, status EXACTLY `requested`;\
  \ else skip,\n    NEVER fail the `task file`). READY-only: a `parked`/`wont-do`\
  \ filing does NOT auto-pick (not an\n    active-claim acceptance). REUSES the cross\
  \ mechanism (a direct emit — no new event/verb/state); a\n    `cross_*` append needs\
  \ no worktree. Pure FSM-legality: `cross.cross_pick_for_file`.\n  - **`cross done`**\
  \ (#2+#3+#4) — receiver finishes (may carry the receiver's `T-NNNN`); emits `cross_done`.\n\
  **The done MAY carry `--note <text>` : WHAT the receiver actually did, recorded\
  \ on\n`cross_done.data.note` and surfaced by `cross show` as the item's resolution\
  \ note** — the\nreceiver-side mirror of `cross close --note` below. A receiver whose\
  \ outcome DIVERGES from the\nrequest needs a durable home ON the item to say so:\
  \ X-0227 was closed with a bare `cross_done`\nafter the kernel retired the requested\
  \ change (SPEC-0146), and the author, unable to\nlearn that outcome, re-filed the\
  \ identical ask as X-0256. OPTIONAL — a bare done emits the same\n`{id, by}` (a\
  \ REQUIRED flag would be a new gate, forbidden here by CHARTER §Principle 1). No\n\
  read-side change: `resolution_note` already reads a `note` key off ANY accepted\
  \ event, the LAST\none winning, so a later author-side `cross close --note` supersedes\
  \ it.\n**The close-side AUTO-`cross_done` ( at `task close` / at land) DERIVES a\
  \ resolution\ntext from the RESOLVING TASK — its title + closing commit sha (`cross.resolution_note_for_close`,\n\
  the ONE emitter of the wording, so the two auto paths cannot drift) — so an auto-resolved\
  \ item\nnever reaches its author bare (X-0356: X-0346 + X-0351 arrived bare and\
  \ the author had\nto re-ask).** The card already HOLDS the answer, so nothing is\
  \ stored anew and no receiver must\nremember to type it; a task too thin to say\
  \ anything (no title) emits NO text rather than a blank\none.\n**The derived text\
  \ SAYS WHAT THE FIX CANNOT REACH, when the resolving card declares it (X-1179).**\
  \ A fix can resolve the reported CLASS while structurally excluding the reported\n\
  INSTANCE, and the derived note read as a plain resolution either way — so a requester\
  \ acted on a\nclosure that did not reach them, re-claiming the reported card and\
  \ spending an external auditor\ninvocation before the (correct) guard refused. When\
  \ the resolving card carries the OPTIONAL\n`resolution_excludes:` (SPEC-0028), the\
  \ same one emitter appends it to the derived text, on the\nsame `auto_note` key,\
  \ with no read-side change. It is DECLARED, never inferred — no code judges\nreach\
  \ — and it is ADDITIVE: a card that omits it emits the identical note as before,\
  \ so an\nordinary closure is not taxed to describe the rare one. The bound: this\
  \ makes a KNOWN limitation\nlegible; it cannot discover one the resolver never noticed.\n\
  **That derived text rides `auto_note` — PROVENANCE, never the receiver's return\
  \ slot (X-0618).** It used to be written to `note`, and because the auto-emit fires\
  \ at LAND it always got\nthere FIRST: the resolver's substantive return then had\
  \ nowhere to go, and `cross done` refused a\nsecond emit, so both sides read a completed\
  \ handoff while the payload was a generated stub. The\nworkaround cost a hand-authored\
  \ extra item per truncated return and only worked when a human\nNOTICED (X-0616\
  \ re-delivered a whole trial return as its own item; X-0620 asked for that\nre-delivery;\
  \ X-0622 was it). So the two texts are separated AT THE KEY: `auto_note` is read\
  \ by\n`cross.auto_resolution_note` and rendered by `cross show` on its own `auto-resolution:`\
  \ line;\n`note` (`_NOTE_KEYS`, `cross.resolution_note`) stays the receiver's own\
  \ words. `_NOTE_KEYS` is\ndeliberately NOT widened to include it — that would put\
  \ the stub back in the slot.\n**The done is legal from `done` as a NOTE-ATTACH,\
  \ and then `--note` is REQUIRED.**\n`from_states` is `{picked, done}`: the resolver\
  \ writes its substantive return AFTER the land (it\ncites the landed sha), by which\
  \ point the auto-close has already moved the item to `done`, so a\n`picked`-only\
  \ guard locked the receiver out of its own item. From `done` a bare repeat is REFUSED\n\
  through the ordinary journal-observable refusal (the transition already happened\
  \ — it would\nresolve nothing); with a `--note` it appends the return, which the\
  \ LAST-accepted-note read side\nsurfaces with no change. The data-model half — that\
  \ this adds no state, no event type, and is not\nthe forbidden terminal reanimation\
  \ — is the protocol sibling SPEC-0085 rule 2's.\n  - **`cross reject`** (#2+#3+#4)\
  \ — receiver declines with reason; emits `cross_rejected` (terminal).\n    **It\
  \ carries the RE-ENTRY DISPOSITION ** — see §`cross close` for the one shared rule.\n\
  \    This is the leg the rule exists for most sharply: a reject is terminal AND\
  \ the author never gets\n    a close to be gated at, so a conditional decline captured\
  \ nowhere here is captured nowhere at all\n    (X-0387). `--re-entry \"<condition>\"\
  ` (optionally `--re-entry-awaits <T-NNNN>`) arms the waiter in\n    the RECEIVER's\
  \ debt echo; `--no-re-entry \"<why>\"` records the dismissal on `cross_rejected`\
  \ as\n    the additive `re_entry_dismissed` key, outside `_NOTE_KEYS`. `--reason`\
  \ stays REQUIRED and is the\n    text the guard reads alongside the chain-derived\
  \ resolution note.\n  - **`cross dispute`** — the AUTHOR records that a peer-declared\
  \ fix does not reach the case.\n    HOMED in SPEC-1020 §`cross dispute` and NOT\
  \ restated here (SPEC-0005 rule 8).\n  - **`cross ack`** (#2+#3+#4) — receiver acknowledges\
  \ a `note`; emits `cross_acked` (terminal).\n    **It carries the RE-ENTRY DISPOSITION\
  \ too **, on identical terms to `cross reject` above\n    and for the identical\
  \ reason: it is the `note` kind's ONLY terminal, so a conditional decline\n    written\
  \ on it strands with no author close to gate. The guard reads the ack's own `--note`\
  \ plus\n    the chain-derived resolution note, and it holds on the note-attach from\
  \ `acked` as well.\n  **The ack MAY carry `--note <text>` (X-0889): the receiver's\
  \ SUBSTANTIVE RETURN,\n  recorded on `cross_acked.data.note` and surfaced by `cross\
  \ show` as the item's resolution\n  note** — the note kind's equivalent of `cross\
  \ done --note` above, on the ONE terminal a note\n  has. A `note` that ASKED for\
  \ work previously had no answer slot anywhere: `cross done` is\n  kind-guarded to\
  \ `{task, bugfix}` and the ack emitted `{id, by}` only, so a receiver who did the\n\
  \  work had to re-file the answer as a SEPARATE id (X-0872 → X-0890) while the answered\
  \ item read\n  `resolution note: (none)`. Optional by construction on a FIRST ack\
  \ — a bare ack emits the same\n  `{id, by}` it always did (most notes are one-way\
  \ FYI with nothing to return, and a required\n  flag would be a new gate, CHARTER\
  \ §P1) — and needs no read-side change, since `_NOTE_KEYS`\n  already reads a `note`\
  \ off ANY accepted event, the LAST one winning.\n  **The ack is legal from `acked`\
  \ as a NOTE-ATTACH, and then `--note` is REQUIRED.**\n  The exact shape of the `cross\
  \ done` attach from `done` above, one kind over, and for the same\n  reason: the\
  \ return is often written AFTER the terminal fired (X-0872 was acked at\n   and\
  \ the evidence came later), so gating on `requested` alone locks the\n  receiver\
  \ out of its own item and leaves the separate-id workaround as the only path. A\
  \ BARE\n  repeat resolves nothing and is refused journal-observably (`cross_refused`,\
  \ reason\n  `already-acked`), appending no event; with a `--note` it appends the\
  \ return, which the\n  last-accepted-note read side surfaces. The data-model half\
  \ — that this adds no state, no event\n  type, and is not terminal reanimation (same-type\
  \ terminals leave the fold's winner, the\n  `acked` status and `contested` all unchanged)\
  \ — is the protocol sibling SPEC-0085 rule 3's.\n  - **`cross close`** — the AUTHOR\
  \ finalizes their own item (and, in the orphan-author case, the\n    receiver closes\
  \ it). HOMED in SPEC-1020 §`cross close` and NOT restated here (SPEC-0005 rule 8).\n\
  \  - **`cross archive`** (#1+#4) — the KERNEL archivist rotates terminal+old items\
  \ to the archive\n    sibling; emits `cross_archived`. Kernel-only (authority sibling\
  \ §3 / protocol sibling rule 5c).\n    **IMPL DEFERRED (owner-split 2026-06-18):**\
  \ the verb surface is documented here (forward design B5) but archival rotation\
  \ is built by the follow-up plan\n    `cross-log-archival-rotation-move-terminal-old-coor`,\
  \ NOT by this plan's cut (the active log\n    simply grows until that plan lands).\
  \ The other 8 verbs ship in this cut (card).\n**Failure-behaviour (#5):** every\
  \ mutating verb appends atomically (clean-fail — no half-written\nline), refuses\
  \ a wrong-ROLE or wrong-STATE emit (the FSM, protocol sibling rule 2), and a refusal\
  \ is\njournal-observable (a `gate_refused`-class trace, not stderr-only — the rubric\
  \ §3 corollary), so a\nblocked cross-write is analyzable across sessions.\n\n###\
  \ 2. The two views are DERIVED, never a second stored state\n`cross inbox` / `cross\
  \ outbox` compute their content by FOLDING the shared log by id at read time\n(protocol\
  \ sibling rule 5a) — there is NO stored per-item status, NO second state model.\
  \ A terminal\nitem is absent from both views by fold (zero maintenance). The verbs\
  \ render; the fold is the truth.\n\n### 3. Deviation-origin discipline (router unchanged)\n\
  A `cross request` of a DEVIATION-origin item is filed ONLY via the triage/promotion\
  \ path (SPEC-0055/\n0056 stays the sole router); a non-deviation ask may be `cross\
  \ request`-ed directly. The verb does not\nbypass triage — it is the carrier, not\
  \ a second router (protocol sibling rule 3). (Pointer, not a\nrestated rule — P5.)\n\
  \n### 4. The `outbox` session-start surface — REPLACES the <workshop-spec> inbound\
  \ count (co-designed re-delivery)\n\n**WORKTREE EXCEPTION at the session-start seam\
  \ (WIDENED to the checkout).**\nThis surface — and the shared-log FOLD that computes\
  \ it — is SKIPPED when the run is inside a\nWORKTREE. That is the whole condition\
  \ (`cli.py#_receipt_only_session_start`), two arms in this ORDER:\n(1) a main-checkout\
  \ journal that resolves AND differs from this checkout's; (2) ONLY when that main\n\
  lookup returns NONE, the BARE-CLONE arm — `git worktree list --porcelain` at this\
  \ checkout\nSUCCEEDS, names NO `branch refs/heads/main`, lists a `bare` entry FIRST,\
  \ and THIS checkout (its root\nAND the directory its journal lives in, as realpaths)\
  \ is one of the LINKED entries: the remote-verify\nbox leg, a detached checkout\
  \ of a bare clone in which no checkout holds main, so no main-checkout seam\nexists\
  \ there. The second arm is never OR'd in unordered and never keyed on the\nharness-narrowed\
  \ locus. No flag, no config, no new store; the skip prints one line naming the re-fold.\
  \ originally keyed this on a FRESH same-ref same-epoch\n`seed_read` receipt on the\
  \ main journal and justified it as RE-DELIVERY ONLY — such a session had\nalready\
  \ been shown this surface on main. measured the case that ground does not reach\
  \ (a\nFIRST-in-checkout anchor holding no receipt) and re-grounded the skip on AUDIENCE\
  \ + SEAM: this\nsurface's session-start seam is the MAIN CHECKOUT. The re-fold this\
  \ rule already prescribes\n(`cross outbox` / `cross inbox` — the same pointer covering\
  \ post-`/compact` eviction below) is what\nkeeps that safe. Nothing else moves:\
  \ report-only, suppressed-when-clean, no-auto-pull and the\nLOG-vs-queue line are\
  \ unchanged. On the MAIN checkout the two journal paths are equal, so the\npredicate\
  \ is False BY CONSTRUCTION and that seam is untouched; where the main checkout cannot\
  \ be\nRESOLVED and the bare-clone arm does not hold — a FAILED listing, an unresolved\
  \ main in a NON-bare\nrepo, or a journal redirected off the checkout — the predicate\
  \ answers False and the run takes the\nFULL surface (fail-closed toward the prior\
  \ behaviour, deliberately not degraded to \"assume worktree\";\nthe bare-clone arm\
  \ is NOT that declined degrade, since its listing PROVES that no checkout holds\n\
  main). This exception is stated\nIDENTICALLY in SPEC-0119 rule 2 — the two describe\
  \ ONE condition, and a surface stating a different\nbound is a standing contradiction\
  \ (CHARTER §Principle 7), not a wording variation.\n\n`session start` SURFACES the\
  \ author's `outbox` (report-only, after the type choice): the count +\npointer of\
  \ `from:me` items a peer has actioned and that now await MY close. This **replaces**\
  \ the\nretired <workshop-spec> per-repo inbound-COUNT surface (the #16 over-counter\
  \ that could not be acked):\nterminal items are gone by fold, so the surface cannot\
  \ over-count. It COUNTS + POINTS to `cross\noutbox`; it does NOT auto-pull (surfacing\
  \ ≠ queue-scan — the LOG-vs-queue line holds). It also\nsurfaces the `inbox` count\
  \ — the NEEDS-DECISION subset (: items `to:me` that are EXACTLY\n`requested` AND\
  \ not yet tracked by a local CARRIER via `resolves_cross`; `picked`/`done`/linked\n\
  items do NOT inflate it), preserving the kernel→consumer intake direction <workshop-spec>\
  \ §6.\nIt ALSO surfaces the ACCEPTED-BUT-UNTRACKED count : items `to:me` this side\
  \ has PICKED that\nNO local CARRIER declares. This is the MIRROR of the needs-decision\
  \ cut, not a\nwidening of it — the `requested` cut is UNCHANGED.\n**A local CARRIER\
  \ is a TASK naming the id in its `resolves_cross:`, or a NON-TERMINAL PLAN naming\
  \ it\nin its frontmatter `resolves_cross:`.** Both cuts read the ONE host-scanned\
  \ declared set\n(`bin/lib/cross.py#_cross_linked_ids`); the fold predicates are\
  \ carrier-agnostic. The plan carrier\nexists because the SPEC-0140 sieve routes\
  \ an ask needing a spec corpus or a coordinated cut to a\nPLAN — so without it,\
  \ routing an item to its CORRECT carrier made it read as tracked by NOTHING\nforever\
  \ (measured 2026-08-26: X-0560 and X-1113 both named while each had a live plan\
  \ carrying it).\nTwo bounds hold the widening honest. **(a) The key is `resolves_cross`,\
  \ never `cites:`** — a\nsubtraction that drops \"already handled\" must key on a\
  \ marker whose PRESENCE is an assertion by its\nauthor, never on provenance, or\
  \ it goes quiet exactly where it should speak; `cites:` is any-to-any\nprovenance\
  \ (GRAPH §Edge types), so honouring it would let an id cited for CONTEXT silence\
  \ the\ndetector (the task side already ruled this — WARNs on cites-without-`resolves_cross`).\n\
  **(b) A TERMINAL plan's declaration does NOT count** — a realized/partial/rejected/cancelled\
  \ plan\ntracks nothing forward, so honouring it would be silence-by-stale-carrier,\
  \ the very failure this cut\nexists to prevent. Nothing is auto-linked in either\
  \ direction: the honesty test is that a\nplan-declared item drops OUT while an item\
  \ declared by NOTHING still appears. It exists because that cut, by design,\nstops\
  \ counting an item the moment it is picked: PICKING is therefore the act that removes\
  \ an item\nfrom the only surface naming it, while LINKING a task — what would restore\
  \ visibility — is exactly\nwhat has not happened, so the system is quietest about\
  \ the items it has already promised to do.\nMeasured 2026-08-16 on the live ledger:\
  \ 8 of 8 picked items read `task: (none)`, and hours later the\n`requested` cut\
  \ had fallen to ZERO while six picked items were tracked by nothing. Harm confirmed\
  \ on\nX-0595: picked and then fully delivered, yet left at `picked` with no resolution\
  \ note, so its\nreporter was never told (hand-closed ~10 days late). The cut is\
  \ FENCED on both sides — a picked item\nthat IS task-linked and any terminal item\
  \ are excluded (a surface counting those would fire always\nand mean nothing, the\
  \ failure mode that narrowed the other counts) — and it is REPORT-ONLY in the\n\
  identical posture: suppressed-when-clean, no event, no status change, no exit-code\
  \ move, NO auto-pull\nand NO auto-linking (linking is a judgement about intent;\
  \ the LOG-vs-queue line holds). It names the\nids, because not going to look is\
  \ the condition it exists for.\n`cross inbox` renders the full non-terminal SUPERSET\
  \ (the startup surface is the actionable subset,\nand now also the accepted-but-untracked\
  \ subset — both are cuts of that one fold, SPEC-0086 rule 2).\n**Co-designed post-`/compact`\
  \ re-delivery (SPEC-0007 §5b coherence invariant — MANDATORY because this\nCHANGES\
  \ a `session start` delivery):** the surfaced count is a CONVENIENCE over durable\
  \ state (the\nshared log on disk), NOT held in context. A `/compact` evicts the\
  \ printed line; do NOT re-run `session\nstart` to recover it (that re-emits the\
  \ startup side-effects). Re-surface by re-folding the shared log\ndirectly (`cross\
  \ outbox` / `cross inbox`) — the same fold path, no count held in memory; each verb\
  \ is\nthe full SUPERSET re-fold of its actionable START subset (the start surfaces\
  \ are the done-awaiting-close\nand needs-decision cuts/ — the re-fold is the durable\
  \ source, the start cut a convenience). AGENTS\n§Three-phase-startup + §After-`/compact`\
  \ are co-amended: the <workshop-spec> inbound-count text → this\noutbox/inbox surface\
  \ (its home, SPEC-0005 §8 one-home; this spec is the authority home it points to).\n\
  **UNREADABLE-LOG DEGRADE (<workshop-spec> rule 4).** Suppressed-when-clean means\
  \ an empty fold\nprints nothing, so an unreadable shared log (an OSError on read)\
  \ must NOT fold to that same silence:\nstartup prints ONE `cross-coord: DEGRADED\
  \ — shared log unreadable (<errno>)` line and journals a\n`cross_coord_degraded`\
  \ row, then continues fail-soft (exit unchanged). A MISSING log is a clean empty\n\
  fold, not a degrade. This names a measurement failure; it is not a surfaced count,\
  \ so the counts'\n\"no event\" posture above is unchanged.\n\n### 5. Module home\
  \ — a dedicated `bin/lib/cross.py` from day 1 (scale-aware code placement)\nThe\
  \ `cross` verbs are authored in a DEDICATED module `bin/lib/cross.py` (prior-art:\
  \ the `bin/lib/\nstate.py` / `bin/lib/error.py` extractions), with only thin dispatch\
  \ wiring in the `bin/yitc-v2`\nbody — NOT appended into the monolith. This is CHARTER\
  \ §P1 scale-aware refinement (design the split\nUP FRONT — migration cost is asymmetric)\
  \ applied to code PLACEMENT, so the after-the-fact kernel\nsurgery the extraction\
  \ effort is doing now is never repeated. Classified `kernel` per SPEC-0073 at\n\
  authoring. (A code-placement directive for THIS surface, not a new rule about modules\
  \ generally.)\n\n### 6. Peer identity — one canonical id per project (supersedes\
  \ the basename contract)\nA **participant id is the project's CANONICAL REGISTRY\
  \ KEY** (`registry.yaml`, the `yitc_v2` entries).\nIts **main-checkout BASENAME\
  \ is an ALIAS** of that key, and nothing else is. The two are usually the\nsame\
  \ string; where they differ (a key whose checkout directory carries another name)\
  \ only the key is the identity.\n\nThis REPLACES the prior claim that a participant\
  \ id is the checkout basename — a rule that named\nSPEC-0084 §3 as its home although\
  \ SPEC-0084 defines no participant id at all. It had no authority home;\nit has\
  \ one now, here.\n\nIncident (X-0259, the reason this rule exists): `_cross_self`\
  \ minted the basename while the nightly\nconcern-drift auto-file (SPEC-0143 Rule\
  \ 4) addressed the registry key. Three live inbound items —\nX-0121, X-0200, X-0222\
  \ — were therefore addressed to a peer NO session folded, and sat invisible in the\n\
  shared log. fail-closed `--to` validation could not catch this: it guards `cross\
  \ request`\nalone, while the nightly appends through `cross_emit` directly; and\
  \ the known-participant LOG-UNION\nmade any bad spelling permanently \"known\" once\
  \ written, so validation could never refuse it again.\n\nThree obligations follow,\
  \ and they are what make the alias a NORMALIZATION rather than the \"two names\n\
  per peer\" that rightly declined:\n  (a) **One choke point.** Canonicalization happens\
  \ exactly once, in `cross.read_events(path, aliases)`,\n      which rewrites every\
  \ event's `from`/`to`/`by` before anything folds them. `fold` and every view,\n\
  \      guard and pure helper take NO `aliases` argument and compare canonical to\
  \ canonical. Two seams\n      could disagree; one cannot. (Structurally guarded\
  \ by a signature test.)\n  (b) **Writes are canonical.** `cross request` canonicalizes\
  \ `--to` before validating and appending,\n      and `self_name` arrives canonical.\
  \ Exactly ONE spelling ever reaches the log going forward; the\n      alias exists\
  \ only to read history and to forgive a human typing the other name.\n  (c) **An\
  \ unroutable `to:` is REPORTED, never silently dropped.** A non-terminal item addressed\
  \ to a\n      peer in no registry reaches nobody — no inbox folds it and the author\
  \ is never told. `cross inbox`\n      and `cross outbox` print a loud WARN naming\
  \ each such id and its bad `to:` value (X-0067's\n      `to:__invalid__` is the\
  \ specimen). Report-only: a read view never gates. Terminal items are\n      exempt\
  \ — a withdrawn item needed no route, and warning about it forever is noise.\n \
  \ (d) **An unregistered `from:` is LABELLED at read time**. The mirror of (c) one\
  \ field\n      over: (c) flags an item nobody will fold, (d) flags one nobody sent.\
  \ A non-terminal item whose\n      `from` names no registered peer is not a peer\
  \ ask, but it renders identically to one — so\n      `cross inbox` and `cross outbox`\
  \ print a loud WARN naming each such id and its bad `from:`\n      value, in the\
  \ same report-only shape as (c) (never a gate, terminal items exempt, silent on\
  \ an\n      unreadable registry). Specimen: the 20-row burst of from a sender `clone`\n\
  \      — an ad-hoc COPY of a governed repo resolving its own directory basename\
  \ as its identity — of\n      which 15 sat in the inbox reading as live peer requests\
  \ and cost a full controller triage pass.\n      THE MEMBERSHIP TEST IS `registry_peers`\
  \ DIRECTLY, never `known_participants_from_events`: that\n      helper unions in\
  \ every `from`/`to` already on the log, which is right for validating a `--to`\n\
  \      (a peer mid-conversation is addressable before it is registered) and exactly\
  \ wrong here, since\n      it would let a phantom sender vouch for itself the instant\
  \ its own first row landed. Self is\n      exempt so an unregistered local checkout\
  \ does not flag its own rows. A LABEL, NOT A BELT: it\n      would not have prevented\
  \ the specimen — that checkout existed on disk when it appended — and\n      the\
  \ write-side isolation is a separate mechanism (`ensure_shared_store`).\n\nFail-soft\
  \ READS, fail-CLOSED write on an UNREADABLE registry (matching the\nunreadable=alert\
  \ direction; ABSENT != UNREADABLE): an unreadable/absent registry yields an empty\
  \ alias\nmap (the identity map) and an empty known-peer set, so READS degrade to\
  \ the pre- basename\nbehaviour and the WARN stays silent rather than flagging every\
  \ item — refusing a read would wedge inbox\ninspection. But `cross request` (the\
  \ WRITE) FAILS CLOSED when the registry is UNREADABLE (corrupt /\nnon-mapping top\
  \ level — distinguished from a legitimately-absent or empty registry via the host\n\
  `_registry_unreadable_reason`, which reuses `state.load_path(errors=)`): authoring\
  \ a NEW item while\nidentity resolution is broken would silently orphan it under\
  \ the wrong id (the X-0259/X-0101 disease),\nso the request is REFUSED with a named\
  \ error and the `--force` escape. An ABSENT registry stays benign\n(fail-soft) —\
  \ it is not corruption. The kernel module never reads the registry itself (identity-\n\
  agnostic, SPEC-0073 `bin/` HARD class) — the host residue resolves the map and injects\
  \ it.\n\n### 6e. Registry birth at init — the host project list is born and kept\
  \ by `init`\nThe registry this rule reads (the host project list, `registry.yaml`)\
  \ is WRITTEN in exactly one place:\na SUCCESSFUL `init` of a project adds that project\
  \ to it — key = the project folder name,\n`methodology: yitc_v2`, `path:` = its\
  \ absolute folder — and BIRTHS the file with that one entry when\nnone exists yet.\
  \ Without this, a newcomer machine has no list at all, so the home folder and the\
  \ peer\nrouting above both see nobody. Four properties, each tested:\n  (a) **A\
  \ refused init writes nothing.** The write sits at init's success tail, after every\
  \ refusal and\n      the dry-run exit; a refused or previewed init never reaches\
  \ it, and an init that withholds a\n      refresh (exits non-zero to protect the\
  \ project's own lines) registers nothing either.\n  (b) **Atomic.** The new content\
  \ goes to a temporary file in the same folder, is flushed to disk, then\n      replaces\
  \ the list in one step — a failure at any point leaves the PRIOR content, never\
  \ a partial\n      file. A failed registration fails the init (non-zero exit, cause\
  \ named) rather than reporting a\n      success the list does not reflect.\n  (c)\
  \ **The owner's file is never rewritten.** The list is hand-authored (comments,\
  \ other top-level\n      sections), so the entry is inserted as text — at the end\
  \ of the `projects:` block, or as a new\n      `projects:` block when there is none\
  \ — and the result must re-read with every prior entry\n      unchanged before it\
  \ may replace the file. An unreadable list, or a key already naming ANOTHER\n  \
  \    folder, is refused with nothing written.\n  (d) **Idempotent, and ONE list.**\
  \ A project already listed (by path or key) is a no-op. There is no\n      second\
  \ project list, no derivation from the coordination log and no folder scan: the\
  \ registry\n      stays the single source, `init` only keeps it from being empty.\n\
  Test runs never touch the live list: under the test harness a write happens only\
  \ into a list the test\nnamed via `$YITC_REGISTRY`. **A scratch project is not a\
  \ real one :** when no `$YITC_REGISTRY`\nis named and the project's resolved folder\
  \ lies under the system temp directory, `init` adds nothing\nto the host list and\
  \ says so in one line — a directly-run test file or a hand probe (neither carries\n\
  the harness guard) otherwise leaked 31 `/tmp` entries into the live list on 2026-09-28.\
  \ A named\n`$YITC_REGISTRY` still registers a temp-dir project there; a project\
  \ outside the temp dir is unchanged.\n**A linked worktree is not a project either\
  \ :** when `git rev-parse --git-dir` differs from\n`--git-common-dir`, `init` adds\
  \ nothing to the host list (named `$YITC_REGISTRY` or not) and says so in\none line\
  \ — the main checkout is the project, and a worktree's entry dangled once `land`\
  \ removed it.\n\n### 6f. Project picker — a read-only view over the registry\n`bin/yitc-v2\
  \ session pick` shows a person the projects on this machine, numbered, in plain\
  \ words, and\non their choice (a number or a name, given as an argument or typed\
  \ once at an interactive prompt)\nenters that project and runs its own existing\
  \ `session start` — nothing else. Three properties, each\ntested:\n  (a) **A VIEW,\
  \ never a second list.** It reads the registry through the ONE reader the nightly\
  \ uses\n      (`_v2_projects`); it owns no project list and never writes the registry\
  \ — rule 6e's `init` stays\n      its only writer. The list always ends with a **new\
  \ project** entry; choosing it starts nothing and writes nothing — it prints the\
  \ bootstrap-order I4 order (folder + `git init`, `session start`, then `init`),\
  \ and the command in (d) runs that order after asking a name restricted to one lowercase\
  \ path segment.\n  (b) **It writes nothing itself.** A list-only run, or a choice\
  \ that matches nothing (exit 2, nothing\n      started), leaves the registry and\
  \ every journal byte-identical: the verb carries no invocation\n      marker and\
  \ is a member of the zero-write-view clause beside `nightly --status` (no auto-sync,\
  \ no\n      seed-gate refusal row) — a newcomer runs it before any session exists.\
  \ The only writes are those\n      of the chosen project's own `session start`,\
  \ in that project. An entry whose folder is not an existing directory stays listed\
  \ at its own number, marked `(folder missing)`; choosing it starts nothing, writes\
  \ nothing and exits non-zero with one plain line.\n  (c) **One start path.** The\
  \ chosen project is started by the same `session start` a person would\n      type\
  \ (`-C <folder>` form), so its visible start line (SPEC-0125) is the one they.\n\
  \  (d) **Reachable from the home folder.** `release install` (after a verified copy,\
  \ ending\n      with one plain next-step line naming the command) and `init`, at\
  \ the host-registration seam, install ONE\n      user-level command `/yitc-projects`\
  \ in the adopter's AI tool (a provider-adapter table in\n      `bin/lib/init.py`\
  \ maps each tool to its command folder), ONLY if absent — an existing file is\n\
  \      reported and left byte-identical — and under the registry write's own test/temp-dir\
  \ guards. **An\n      engine running from a linked git worktree installs nothing\
  \ :** the body names the engine\n      by absolute path and `land` removes a worktree,\
  \ so when `git rev-parse --git-dir` in the engine\n      folder differs from `--git-common-dir`\
  \ the installer creates and refreshes no command file and\n      says so in one\
  \ line; an engine in a main checkout or an installed release is unchanged. Its\n\
  \      body runs `<engine-absolute>/bin/yitc-v2 session pick`, then the chosen project's\
  \ start in the same\n      session, tells the AI to answer in the person's language,\
  \ and ends with the start-line relay — it\n      does not repeat the return order\
  \ at every run. The ONE start order stands:\n      to start, restart or come back,\
  \ open the AI tool in any folder (or clear the open session) and\n      run the\
  \ command again — never a relaunch in the project folder, which the engine does\
  \ not need\n      (it finds the session record by session id in any folder); the\
  \ person is told it once, at the\n      first start, by station [A] Start (SPEC-0147).\
  \ The\n      non-interactive hint names the engine-absolute path. No in-project\
  \ command, no hooks.\n\n### 7. Receiver-side premise review — before any pick /\
  \ resolves_cross association\nHOMED in SPEC-1010 §3 — the premise review, the default\
  \ disposition, the ownership judgement,\nthe outcomes and the report-only cue —\
  \ and NOT restated here (SPEC-0005 rule 8).\n\n## Parameters\n\nNone consumed.\n\
  \n## Rationale\n\nThe pre-specs audit named the AUTHOR-side close-loop as the missing\
  \ piece: `inbox` (receiver pickup)\nalone does not make the done-criterion (\"consumer\
  \ sees fixed → verify at start\") provable, so an\nexplicit author-side `outbox`\
  \ view + its session-start delivery (rule 4) is required, and — because it\nchanges\
  \ a `session start` surface — it must co-design its post-`/compact` re-delivery\
  \ (SPEC-0007 §5b).\nThe verb names are D3-pinned (owner-settled); each is checked\
  \ against the verb-design rubric (the\ncontrol-chokepoint that makes the FSM role-guard\
  \ + deterministic emit enforceable — verb-design #2/#3/\n#4/#5). Module-home-from-day-1\
  \ (rule 5) is the owner's scale-aware code-placement refinement. Anti-\ncomplexity:\
  \ REUSES the existing `session start` surface slot + the `task file`-style id-allocation\
  \ +\nthe fold (no stored status) — adds the verb group as the ONE governed write\
  \ path, no new gate, no\nsecond state store. The deliberation lives in the plan\
  \ (SPEC-0005 §3).\n\n## Verification\n\n- **VP1 (verbs are the only write path):**\
  \ a raw append to the shared store is not the sanctioned path;\n  each `cross` mutating\
  \ verb allocates/append/emits atomically and refuses a wrong-role/wrong-state\n\
  \  emit with a journal-observable refusal. (test at activation)\n- **VP2 (views\
  \ derived, no stored status):** `cross inbox`/`outbox` fold the log at read time;\
  \ a\n  terminal item is absent from both with no stored flag. (test)\n- **VP3 (outbox\
  \ startup surface replaces the inbound count):** `session start` surfaces the outbox/inbox\n\
  \  count+pointer (report-only, no auto-pull); the <workshop-spec> per-repo inbound\
  \ count is gone and cannot\n  over-count (terminal items fold out). (test + grep\
  \ AGENTS startup)\n- **VP4 (post-`/compact` re-delivery co-designed — D5 probe):**\
  \ consumer-session journal/read evidence\n  that `outbox` surfaced at session start,\
  \ DROPPED from the view after `cross close`, and was\n  RE-DELIVERED correctly after\
  \ `/compact` (by re-folding the log, not by re-running `session start`).\n  (the\
  \ plan's startup-surface probe — D5)\n- **VP5 (module home):** the verbs live in\
  \ `bin/lib/cross.py` with thin `bin/yitc-v2` dispatch, not in\n  the monolith body;\
  \ classified kernel per SPEC-0073. (state-check at activation)\n- **VP6 (re-entry\
  \ disposition, DIFFERENTIAL):** MOVED with `cross close` — its verification is\n\
  \  SPEC-1020 VP1.\n- **VP7 (re-entry disposition on the RECEIVER terminals, DIFFERENTIAL):**\
  \ a `cross reject`\n  whose `--reason` NAMES a re-entry condition, declaring neither\
  \ flag, EXITS NONZERO, emits no\n  `cross_rejected` (the item stays non-terminal)\
  \ and arms nothing; the SAME reject carrying\n  `--re-entry` succeeds and arms exactly\
  \ ONE followup whose `relates_to` is that X-NNNN. COHORT\n  COMPLEMENT, in the same\
  \ probe: a reject with an UNCONDITIONAL reason goes terminal cleanly,\n  refuses\
  \ nothing and arms nothing — so forcing the predicate always-true turns the complement\
  \ RED\n  and the guard cannot be green by construction. Second axis: the armed row\
  \ lands in the journal of\n  the session that ran the REJECT (the RECEIVER's — the\
  \ whose-echo decision above, asserted rather\n  than assumed) and names the AUTHOR\
  \ as its counterparty. Third axis: the same guard holds on\n  `cross ack`, including\
  \ the note-attach from `acked`. (test)\n- **VP8 (triage default disposition):**\
  \ MOVED with rule 7 — its verification is\n  SPEC-1010 VP1.\n"
