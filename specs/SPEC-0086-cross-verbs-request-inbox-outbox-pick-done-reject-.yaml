  \ cut (the active log\n    simply grows until that plan lands). The other 8 verbs\
  \ ship in this cut (card).\n**Failure-behaviour (#5):** every mutating verb appends\
  \ atomically (clean-fail — no half-written\nline), refuses a wrong-ROLE or wrong-STATE\
  \ emit (the FSM, protocol sibling rule 2), and a refusal is\njournal-observable\
