  \ is NOT\n    widened and stays `{task, bugfix}`: it gates from `done`, a state\
  \ no note can reach, so admitting\n    the kind there would add an unreachable path\
  \ rather than a terminal. **The out-of-band-ONLY\n    constraint is enforced where\
  \ the log is READ, not only where this CLI writes :**\n    `EVENT_KINDS` is coarse\
  \ (event × kind) AND is the shared log's defense-in-depth gate — and that log\n\
  \    is append-only and written by many peers' CLI versions, so the verb branch\
  \ is not the boundary.\n    `_legality` therefore DROPS a `cross_closed` on a kind-`note`\
  \ item unless the event POSITIVELY\n    carries `out_of_band` EXACTLY `true` AND\
  \ a `reason` that is a non-empty STRING (never a coerced\n  non-string — `[]` must\
  \ not read as the non-empty \"[]\"), reusing the existing `kind` drop-reason (no\n\
  \    new vocabulary, no new store). A positive marker, never inferred from an absence.\
  \ The plain close is gated on `done`, i.e.\n    reachable only after a `cross_done`;\
  \ when delivery happened out of band that event never comes, so the\n    author's\
  \ only terminal was `--withdraw` — a RETRACTION, which misreports delivered work\
  \ as never-wanted.\n    The item therefore stayed non-terminal forever and the session-start\
  \ `outbox` echoed FINISHED work as\n    open — signal erosion in the one surface\
  \ built to be trusted at a glance (<project> reported exactly this).\n    A MODE\
  \ of the existing verb on the existing event — no new verb, no new event type, no\
  \ new store. It is\n    NOT a mute button, and two fences keep it honest — `--reason`\
  \ is REQUIRED (it rides `_NOTE_KEYS`, so\n    `cross show` prints it as the resolution\
  \ note with no read-side change), and `out_of_band` is recorded\n    on the event\
  \ so the closure reads as REQUESTER-closed rather than peer-returned. The chain\
  \ carries no\n    `cross_done`, `cross show` names the provenance on its own closure\
  \ line (`out_of_band_closure`, a\n    derived accepted-only read, never a stored\
  \ status), and the author role-guard is unchanged, so a peer\n    cannot use it.\
  \ `--note` and `--withdraw` are both REFUSED alongside it (one terminal, one text\
  \ slot).\n    **CITATION ORDERING (X-0643) — whichever human string this verb PUBLISHES\
  \ (`--note` on a\n    close, `--reason` on a withdraw or an out-of-band close) is\
  \ REFUSED when it cites an `X-NNNN` that\n    does not resolve in the fold**, journal-observably\
  \ (the same `cross_refused` trace as the FSM\n    guards), with a message naming\n\
  \    the unresolved id(s) and the required ORDER: file the replacement FIRST (`cross\
  \ request`, the ONE\n    allocation site — it prints the id), THEN close citing\
  \ the id it printed. The item's OWN id is not a\n    forward reference and is exempt.\
  \ Real incident: an author whose re-file `cross request` was refused\n    missed\
  \ the refusal and closed the superseded items citing an id nothing ever allocated\
  \ — and the log\n    is APPEND-ONLY, so the dangling citation was published to the\
  \ peer and could not be retracted. The\n    refusal runs BEFORE the emit, which\
  \ is what makes the ordering safe BY CONSTRUCTION. `cross close`\n    stays a pure\
  \ terminal verb: allocating the replacement inside it would make a second id-allocation\n\
  \    site (rule 4), so the check RESOLVES against the existing fold rather than\
  \ creating anything. No new\n    verb, no new status, no new event type.\n    **RE-ENTRY\
  \ DISPOSITION (X-0472; extended to the RECEIVER terminals) — a\n    conditional\
  \ decline may not go terminal unwatched.** Some resolutions decline an ask FOR NOW\
  \ and\n    name the moment to come back (\"Re-entry: declare subject_globs when\
  \ verify.layers gain executable\n    entries\"). Going terminal ends the item, so\
  \ that condition survives only as prose in a note\n    nothing watches. X-0472's\
  \ condition FIRED weeks later and the author side never learned.\n    **The rule\
  \ binds every terminal that can strand a condition — THREE verbs, ONE guard:**\n\
  \    `cross close` (both modes: plain and `--out-of-band`) on the AUTHOR side, and\
  \ `cross reject` +\n    `cross ack` on the RECEIVER side. wired the author side\
  \ alone; extended the SAME\n    predicate and the SAME guard to the receiver side\
  \ rather than authoring a second mechanism\n    (`bin/lib/cross.py#_re_entry_disposition`\
  \ — one module-level home, called from all three).\n    **The receiver leg is not\
  \ a mirror — it is where the asymmetry bites.** On a REJECT the author\n    NEVER\
  \ GETS A CLOSE to be gated at, so a disposition not captured where the RECEIVER\
  \ acts is never\n    captured at all. X-0387 (kernel -> a consumer) is that shape\
  \ live on the log: `rejected`,\n    carrying \"please FIX the <project> record +\
  \ re-issue\", nothing gating it and no close that will\n    ever come. `cross ack`\
  \ is the same hole one kind over — the `note` kind's ONLY terminal, given a\n  \
  \  substantive-return slot.\n    So: when the item's RESOLUTION names a re-entry\
  \ condition — the chain-derived `resolution_note`\n    `cross show` displays, **not**\
  \ only the acting party's own string, because in X-0472 the condition\n    was the\
  \ RECEIVER's `cross done --note` and the author closed bare — the verb **REFUSES**\
  \ until the\n    acting party declares exactly ONE of **`--re-entry \"<condition>\"\
  `** or **`--no-re-entry \"<why>\"`**.\n    **WHOSE debt echo does a receiver-side\
  \ re-entry belong in? The RECEIVER's** — the journal of the\n    session that ran\
  \ the verb — decided on its own grounds, NOT by mirroring the author case.\n   \
  \ (1) MECHANICAL BOUND: a followup is an append to the LOCAL journal, and §3 / SPEC-0084\
  \ rule 5 make\n    the shared coordination store the ONE cross-party writable surface\
  \ — arming into the AUTHOR's echo\n    is unreachable by any sanctioned path, and\
  \ building one would be the cross-repo write the boundary\n    forbids. (2) The\
  \ condition is the RECEIVER'S OWN UTTERANCE — they wrote \"come back when X\", they\n\
  \    know it, and they are the party who will be asked again, so the waiter is a\
  \ real obligation rather\n    than manufactured debt. (3) The AUTHOR IS NOT BLIND:\
  \ the condition is PUBLISHED to them on the\n    shared log via this verb's own\
  \ `--reason`/`--note`, which rides `_NOTE_KEYS`, so `cross show <id>`\n    renders\
  \ it as the resolution note with no read-side change. (4) THE HONEST BOUND: this\
  \ puts NO\n    debt in the author's echo and no kernel mechanism can — the party\
  \ who must RE-ASK learns of the\n    condition by reading `cross show`, because\
  \ a terminal item leaves the outbox. That residual is the\n    price of the territory\
  \ boundary, recorded here rather than left to be rediscovered.\n    **COVERAGE BOUND\
  \ of the predicate, stated so it is not mistaken for total.** The predicate is\n\
  \    MARKER-KEYED, and X-0387's \"re-issue\" is NOT one of its markers — so this\
  \ gate would not have\n    fired on the very item that demonstrates the reject leg.\
  \ Widening was MEASURED and DECLINED\n    : over the live log `re-?issue|re-?file|re-?submit|re-?send`\
  \ adds 26 hits of which ~2 are\n    genuine, the rest NARRATING a past re-file (\"\
  re-filed to:<project>\", \"the ask re-issued\n    corrected as X-0397\"). The predicate\
  \ GUARDS AN ACTION and so fails closed; its precision is the\n    property that\
  \ must not erode, and the shared predicate would carry those false hits onto the\n\
  \    AUTHOR side too. X-0387 was dispositioned by one-time backfill instead.\n \
  \   The refusal runs BEFORE the emit (the same by-construction ordering as the citation\
  \ check) and is\n    journal-observable via the ordinary `cross_refused` trace.\n\
  \    `--re-entry` arms an ORDINARY followup through `followup add` (SPEC-0095) —\
  \ one capture\n    mechanism, one event shape, one fold — carrying the X-NNNN as\
  \ `relates_to` (PROVENANCE) and the\n    author's words as `trigger`; optional **`--re-entry-awaits\
  \ <T-NNNN>`** supplies the `awaits` fire\n    key, and without it the waiter stays\
  \ VISIBLE in the debt echo's armed clause but cannot auto-fire\n    (SPEC-0095's\
  \ own stated honest limit — a condition about a PEER's repo state has no local\n\
  \    terminal task, and inventing one is the false-fire class). `--no-re-entry`\
  \ records its\n    reason on the SAME `cross_closed` as an additive `re_entry_dismissed`\
  \ key — deliberately OUTSIDE\n    `_NOTE_KEYS`, so a dismissal can never occupy\
  \ the resolution-note slot. Both flags are REFUSED on\n    `--withdraw`: a retraction\
  \ unasks the question, so there is nothing to come back on.\n    **The condition\
  \ is DECLARED, never inferred.** The prose predicate decides only whether the\n\
  \    author must ANSWER; it never writes a trigger and never mutates the log's content\
  \ — SPEC-0095\n    settles that axis and is the incident. Because the predicate\
  \ now guards an ACTION it\n    requires an EXPLICIT re-entry marker (never a bare\
  \ \"when\"/\"once\") and its precision was MEASURED\n    before it was trusted:\
  \ over the 439 noted terminal items it returns 19 hits, and 13/13 of those\n   \
  \ on the author side — the only side this seam gates — are genuine conditional declines.\
  \ No new\n    verb, no new event type, no new store, no new state.\n  - **`cross\
  \ archive`** (#1+#4) — the KERNEL archivist rotates terminal+old items to the archive\n\
  \    sibling; emits `cross_archived`. Kernel-only (authority sibling §3 / protocol\
  \ sibling rule 5c).\n    **IMPL DEFERRED (owner-split 2026-06-18):** the verb surface\
