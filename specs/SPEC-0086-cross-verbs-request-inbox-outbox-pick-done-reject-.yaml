body: "## Scenario\n\nA session works the shared coordination log entirely through\
  \ `cross` verbs — never a raw append. It\nfiles an item (`cross request`), sees\
  \ what is addressed to it (`cross inbox`) or what it authored and\nmust now finalize\
  \ (`cross outbox`), and drives an item through its protocol (`pick` → `done` →\n\
  `close`, or `ack`, or `reject`). At session start it is SHOWN its `outbox` — the\
  \ items it authored\nthat a peer has fixed and now await its close — so \"consumer\
  \ sees fixed → verify at start\" is a\nsurfaced fact, not a manual peer-scan. Each\
  \ verb owns the unsafe mechanics (id allocation, atomic\nappend, the role-emit guard)\
  \ and emits its `cross_*` event deterministically.\n\n## Internal\n\nTHE VERB CONTRACT\
  \ for the shared coordination log — the `cross` verb group, the fold-rendering views,\n\
  and the `outbox` session-start surface (with its post-`/compact` re-delivery). The\
  \ DATA model + event\nFSM + view fold-semantics live in the protocol sibling (this\
  \ plan's protocol spec); the store's\nauthority/placement in the authority sibling.\
  \ This spec owns only the CLI surface + the startup\ndelivery. Each verb is checked\
  \ against `patterns/verb-design.md` (the 5 aspects). Five rules.\n\n### 1. The verb\
  \ group — names pinned (D3), each a control chokepoint for its write\nTen verbs\
  \ (the D3-pinned names, plus the author-side `dispute`); raw appends to the shared\
  \ store are FORBIDDEN — a `cross` verb is\nthe ONLY path (verb-design #4 control-chokepoint),\
  \ so the id-allocation + atomic append + role-guard +\n`cross_*` emit cannot be\
  \ hand-done wrong:\n  - **`cross request`** (#1 ease + #2 error-reduction) — allocates\
  \ the immutable id under flock,\n    validates `from`/`to`/`kind`/brief, atomically\
  \ appends + emits `cross_requested`. The author verb.\n    The `to` validation is\
  \ FAIL-CLOSED against the KNOWN participants : the registry's yitc_v2\n    project\
  \ CANONICAL IDS (§Peer identity below) ∪ every participant already in the shared\
  \ log ∪ self.\n    `to` is CANONICALIZED before validation, so a peer addressed\
  \ by either spelling resolves to its one\n    id. An unknown `to` is REFUSED with\
  \ the closest `did you mean <X>?` suggestion — so a misaddressed\n    item cannot\
  \ be silently folded by no one — unless `--force` files it to a genuinely-new\n\
  \    not-yet-registered peer (the documented escape, mirroring `cross pick --force`).\n\
  \    DEAD-LETTER WARN (X-0547) — after a successful emit, if `to` resolves to a\
  \ REGISTERED\n    but NO-TEAM project (neither `methodology: yitc_v2` nor an active\
  \ `team_mode`/`ai_team.enabled`, so\n    it never runs a session that could `cross\
  \ pick/reject/ack`), a REPORT-ONLY WARN names the\n    dead-letter risk + a host-infra\
  \ routing hint. It is NOT a gate (CHARTER non-goal #7): the request\n    still succeeds\
  \ (a no-team project may be a legitimate FYI-note target) and it is orthogonal to\
  \ the\n    membership check + `--force` (which concern identity, not intake-capability).\n\
  \    PREMATURE-AVAILABILITY-ANNOUNCEMENT WARN (X-1048) — after a successful emit,\
  \ when the\n  sending session HOLDS AN UNLANDED WRITING CLAIM (a `task/T-XXXX` /\
  \ `work/<slug>` branch; derived\n  host-side and INJECTED, never read inside this\
  \ module) **AND** the brief reads as an announcement\n  of AVAILABILITY («this is,\
  \ go run it»), a REPORT-ONLY WARN names the BRANCH, its task id\n  and its distance\
  \ from `main`, plus the land command to run first. Same posture as the two WARNs\n\
  \  above and NOT a gate: the item stands as filed, unaltered, and no event records\
  \ the advisory.\n  THE CONJUNCTION IS THE RULE, not an implementation detail — the\
  \ narrow target is an announcement\n  of availability, so a deviation capture, a\
  \ question, a reframe and an ordinary note are UNTOUCHED\n  from a worktree, with\
  \ no added step. That bound is load-bearing: the no-worktree coordination path\n\
  \  exists so the capture reflex stays ONE command, and a fix that taxes that reflex\
  \ would be\n  worse than the defect it closes. Two BOUNDS are stated in the WARN\
  \ text itself rather than\n  implied away: the detector is a HEURISTIC over prose\
  \ (there is no enumerated field to route on —\n  cf. SPEC-0085 §3), so an availability\
  \ claim worded outside the matched set is NOT caught and\n  silence is not proof\
  \ of absence; and an undecidable claim (non-git / detached HEAD / any git\n  error)\
  \ degrades to SILENCE, never to an accusation. Grounds: X-1041 announced a capability\
  \ as\n  SHIPPED at and it landed at 07:56:52Z — the consumer ran the verb it was\n\
  \  told to run, measured an absence, and audited the sender's source.\n  PLACEHOLDER-AWAITS-KEY\
  \ WARN (<project> X-1379) — after a successful emit, when the\n  request is `--kind\
  \ task` **AND** its brief still carries the LITERAL placeholder\n  `type=<event_type>`,\
  \ a REPORT-ONLY WARN names it and the way to resolve it. Same posture as the\n \
  \ two WARNs above and NOT a gate: the item stands as filed, unaltered, and no event\
  \ records the\n  advisory. THE CONJUNCTION IS THE RULE — a `bugfix` routes a deviation\
  \ and prescribes no awaits at\n  all, so it is silent, as are `question` / `note`.\
  \ The asking side owns every emitter the awaited\n  moment could fire from and the\
  \ receiver owns none of them, so the key is knowable at authoring\n  time and merely\
  \ guessable at reading time; an `--awaits events.jsonl#type=<t>` armed on a type\n\
  \  nothing emits NEVER fires, which makes the handed-over obligation unfireable\
  \ by construction.\n  The RULE is homed in SPEC-0095 §Armed (an ask may only prescribe\
  \ an awaits key the asking side\n  has verified exists); this section documents\
  \ the verb's mechanism, which is the standing division\n  of labour between the\
  \ two specs. Deliberately a LITERAL match and not a catalog validation — for\n \
  \ the reason SPEC-0095 gives for REPORTING rather than validating an event type:\
  \ a class that has\n  never fired is exactly what these records wait for. Grounds:\
  \ of the X-1274..X-1291 family, three\n  asks prescribed an awaits key on a moment\
  \ that emits no event at all (a printed refusal, a\n  stdout-only view, an absent\
  \ emitter), leaving the consumer to guess.\n  **`cross request --task T-NNNN`**\
  \ (X-1152) — OPTIONAL: the card this request is filed IN\n    SERVICE OF. Stored\
  \ on `cross_requested` as BIRTH meta, so the fold reads it off that event alone\n\
  \    and the audit packet of THAT card can see the request as its own evidence (SPEC-0168\
  \ rule 4).\n    Validated FAIL-CLOSED on SHAPE only (`T-NNNN`, anchored): the tie\
  \ downstream is an EQUALITY\n    against a card id, so a malformed value would store\
  \ quietly and match nothing forever. Existence\n    is deliberately NOT checked\
  \ — the store is shared and the card lives in a repo this verb may not\n    have\
  \ (SPEC-0084 rule 5), so shape is the only thing checkable without reaching across\
  \ a project\n    boundary. Read from BOTH input modes and therefore listed in the\
  \ `--from-stdin` × argv conflict\n    table like every other such field. `cross\
  \ show` prints it as a `filed for task:` line ABOVE the\n    receiver-side `task:`\
  \ line, never merged into it: the author's link says what the AUTHOR was\n    working\
  \ on when they raised the item, the receiver's says which card RESOLVED it.\n  The\
  \ `cross_requested` payload ALSO carries **`actor`** — the PERSON who authored the\
  \ item, beside\n    the `from` PROJECT that raised it. DERIVED host-side from the\
  \ launch context\n    (`lib/memory.py#resolve_actor`: the owner-role host user records\
  \ the default `ai-agent`; a named\n    provisioned user, e.g. <collaborator>, records\
  \ their own name) — zero added input from the human, no\n    `--actor` flag (owner\
  \ directive 2026-07-11). BIRTH meta, immutable like `kind`/`from`/`to`: the\n  \
  \  fold reads it off the meta-establishing `cross_requested` alone, so a later protocol\
  \ event can\n    never re-write who authored the item. `cross show` prints an `actor:`\
  \ line when one is recorded\n    (the same shape as `origin_fp` / `origin_ref`).\
  \ Reuses the existing event — NO new store (§P1).\n  - **`cross inbox`** (read-only)\
  \ — renders the fold-derived INBOX view (non-terminal `to:me`); a query\n    verb,\
  \ no mutation. (View definition: protocol sibling rule 5a.)\n  - **`cross outbox`**\
  \ (read-only) — renders the fold-derived OUTBOX view (`from:me` awaiting MY\n  \
  \  action: done-awaiting-close / rejected-awaiting-close); a query verb. (Same fold\
  \ home.)\n  - **`cross pick`** (#2+#3+#4) — receiver accepts; appends + emits `cross_picked`\
  \ (role-guard: only `to`).\n    **Intake hygiene, BEFORE the FSM guard:** REFUSE\
  \ (journal-observable) a STALE pick — a DONE\n    local task already resolves the\
  \ item (its `resolves_cross` link names it), naming the resolver, with\n    a `--force`\
  \ override; and SURFACE a not-actionable-for-this-side item (addressed to a different\
  \ peer)\n    as a clear skip line (the FSM guard then refuses it wrong-role). So\
  \ no side re-picks already-addressed\n    or irrelevant work (the duplicate-intake\
  \ class). The advisories are PURE/derived (`intake_advisories`\n    over a deterministic\
  \ done-resolver scan), no stored state.\n    **Double-intake visibility (X-0456)\
  \ — the THIRD advisory, `already_held`:** an item a peer\n    ALREADY holds (a live\
  \ `picked`/`done` intake, per the fold's derived `held{by,ts,task}` view) is\n \
  \   REFUSED naming the HOLDER + its pick ts + its resolving task when known. This\
  \ adds NO gate — the FSM\n    guard (`from_states={\"requested\"}`) already refused\
  \ this state; what was missing is WHO holds it, so a\n    raced second intake reads\
  \ as a bare wrong-state code instead of a nameable conflict. NOT\n    `--force`-overridable\
  \ (`--force` covers only the staleness advisory; a second pick is\n    FSM-illegal\
  \ regardless). A SETTLED (terminal) item is excluded — that is the `already_addressed`\n\
  \    staleness case above, not a concurrent double-intake.\n    **The `task file\
  \ --resolves-cross` half of the same rule:** the auto-pick below SKIPS an item\n\
  \    it cannot advance; when the cause is `already_held`, the filing PRINTS an already-linked\
  \ advisory\n    naming the holder + its existing task (report-only — it never blocks\
  \ a filing, emits no event, and\n    never changes the exit code). Both surfaces\
  \ render the holder through the ONE shared\n    `describe_holder` renderer, so the\
  \ wording cannot drift between them (the `premise_review_cue`\n    single-emitter\
  \ precedent). Real incident: two live controllers both intook X-0452 while the filing\n\
  \    path skipped SILENTLY -> duplicate cards and a wasted dispatch cycle (a recurrence\
  \ of\n    the X-0430 two-controllers-one-concern class).\n    **Unanswered-link\
  \ visibility (X-0943) — the file-side warn for EVERY link the auto-pick\n    could\
  \ not advance.** The close-side auto-`cross_done` fires ONLY for an item self RECEIVES\
  \ that is\n    EXACTLY `picked`, so PICKED is the discriminator and an UNPICKED\
  \ linked item is silently NEVER\n    answered. The `already_held` advisory above\
  \ covers ONE of the auto-pick's skips; the rest — a\n    non-pickable `note` kind,\
  \ a wrong-role link, and a `parked`/`wont-do` filing that does not auto-pick\n \
  \   at all — emitted nothing. So `task file` PRINTS one WARN per link that will\
  \ not be answered at\n    close, naming the item, its KIND and STATUS, and the next\
  \ command that is CORRECT FOR THAT KIND: a\n    `note` is advised toward `cross\
  \ ack` (its only receiver terminal — advising `cross pick`/`cross done`\n    would\
  \ name a command the verb REFUSES, which is worse than no warn), a pickable kind\
  \ toward\n    `cross pick`, an item this side AUTHORED toward `cross close`. An\
  \ item already `done`/terminal, or\n    one the close WILL answer, stays silent;\
  \ ids the already-linked advisory just named are skipped so\n    one filing never\
  \ double-signals one item. The \"will it answer?\" oracle is `cross_done_for_close`\n\
  \    ITSELF, not a re-derived copy of its conditions, so the warn and the emit cannot\
  \ drift apart. ADDS\n    NO GATE — report-only, no event, no status change, no exit-code\
  \ change, fail-open (making `close`\n    REFUSE would gate a card on a peer-log\
  \ state, CHARTER non-goal #7). Real incident: <project>'s\n    X-0750 / X-0829 /\
  \ X-0649 each stayed `[note/requested]` after the resolving task landed done, while\n\
  \    `cross pick` refused them naming that same done task and `cross show` printed\
  \ `task: (none)` — three\n    surfaces, three different answers about one item;\
  \ their PICKED pair auto-closed correctly, which is\n    what isolates PICKED as\
  \ the cause. Pure renderer: `cross.unanswered_cross_link_advice`; the ONE print\n\
  \    site `cross.print_unanswered_cross_link_warns`.\n    **Auto-pick on `task file`,\
  \ the symmetric mirror of the close-side auto-`cross_done`:**\n    filing a READY\
  \ local task that carries `resolves_cross:[X-NNNN]` auto-emits `cross_picked` for\
  \ each\n    linked item self RECEIVES that is EXACTLY `requested` + a pickable kind\
  \ (`task`/`bugfix`) — so the\n    normal flow (file → work → close) moves the item\
  \ off the \"new inbound\" surface AND makes the\n    close-side auto-`cross_done`\
  \ (which fires only from `picked`) reachable. Idempotent + fail-open\n    (pick\
  \ ONLY when the item exists, `to==self`, kind pickable, status EXACTLY `requested`;\
  \ else skip,\n    NEVER fail the `task file`). READY-only: a `parked`/`wont-do`\
  \ filing does NOT auto-pick (not an\n    active-claim acceptance). REUSES the cross\
  \ mechanism (a direct emit — no new event/verb/state); a\n    `cross_*` append needs\
  \ no worktree. Pure FSM-legality: `cross.cross_pick_for_file`.\n  - **`cross done`**\
  \ (#2+#3+#4) — receiver finishes (may carry the receiver's `T-NNNN`); emits `cross_done`.\n\
  **The done MAY carry `--note <text>` : WHAT the receiver actually did, recorded\
  \ on\n`cross_done.data.note` and surfaced by `cross show` as the item's resolution\
  \ note** — the\nreceiver-side mirror of `cross close --note` below. A receiver whose\
  \ outcome DIVERGES from the\nrequest needs a durable home ON the item to say so:\
  \ X-0227 was closed with a bare `cross_done`\nafter the kernel retired the requested\
  \ change (SPEC-0146), and the author, unable to\nlearn that outcome, re-filed the\
  \ identical ask as X-0256. OPTIONAL — a bare done emits the same\n`{id, by}` (a\
  \ REQUIRED flag would be a new gate, forbidden here by CHARTER §Principle 1). No\n\
  read-side change: `resolution_note` already reads a `note` key off ANY accepted\
  \ event, the LAST\none winning, so a later author-side `cross close --note` supersedes\
  \ it.\n**The close-side AUTO-`cross_done` ( at `task close` / at land) DERIVES a\
  \ resolution\ntext from the RESOLVING TASK — its title + closing commit sha (`cross.resolution_note_for_close`,\n\
  the ONE emitter of the wording, so the two auto paths cannot drift) — so an auto-resolved\
  \ item\nnever reaches its author bare (X-0356: X-0346 + X-0351 arrived bare and\
  \ the author had\nto re-ask).** The card already HOLDS the answer, so nothing is\
  \ stored anew and no receiver must\nremember to type it; a task too thin to say\
  \ anything (no title) emits NO text rather than a blank\none.\n**The derived text\
  \ SAYS WHAT THE FIX CANNOT REACH, when the resolving card declares it (X-1179).**\
  \ A fix can resolve the reported CLASS while structurally excluding the reported\n\
  INSTANCE, and the derived note read as a plain resolution either way — so a requester\
  \ acted on a\nclosure that did not reach them, re-claiming the reported card and\
  \ spending an external auditor\ninvocation before the (correct) guard refused. When\
  \ the resolving card carries the OPTIONAL\n`resolution_excludes:` (SPEC-0028), the\
  \ same one emitter appends it to the derived text, on the\nsame `auto_note` key,\
  \ with no read-side change. It is DECLARED, never inferred — no code judges\nreach\
  \ — and it is ADDITIVE: a card that omits it emits the identical note as before,\
  \ so an\nordinary closure is not taxed to describe the rare one. The bound: this\
  \ makes a KNOWN limitation\nlegible; it cannot discover one the resolver never noticed.\n\
  **That derived text rides `auto_note` — PROVENANCE, never the receiver's return\
  \ slot (X-0618).** It used to be written to `note`, and because the auto-emit fires\
  \ at LAND it always got\nthere FIRST: the resolver's substantive return then had\
  \ nowhere to go, and `cross done` refused a\nsecond emit, so both sides read a completed\
  \ handoff while the payload was a generated stub. The\nworkaround cost a hand-authored\
  \ extra item per truncated return and only worked when a human\nNOTICED (X-0616\
  \ re-delivered a whole trial return as its own item; X-0620 asked for that\nre-delivery;\
  \ X-0622 was it). So the two texts are separated AT THE KEY: `auto_note` is read\
  \ by\n`cross.auto_resolution_note` and rendered by `cross show` on its own `auto-resolution:`\
  \ line;\n`note` (`_NOTE_KEYS`, `cross.resolution_note`) stays the receiver's own\
  \ words. `_NOTE_KEYS` is\ndeliberately NOT widened to include it — that would put\
  \ the stub back in the slot.\n**The done is legal from `done` as a NOTE-ATTACH,\
  \ and then `--note` is REQUIRED.**\n`from_states` is `{picked, done}`: the resolver\
  \ writes its substantive return AFTER the land (it\ncites the landed sha), by which\
  \ point the auto-close has already moved the item to `done`, so a\n`picked`-only\
  \ guard locked the receiver out of its own item. From `done` a bare repeat is REFUSED\n\
  through the ordinary journal-observable refusal (the transition already happened\
  \ — it would\nresolve nothing); with a `--note` it appends the return, which the\
  \ LAST-accepted-note read side\nsurfaces with no change. The data-model half — that\
  \ this adds no state, no event type, and is not\nthe forbidden terminal reanimation\
  \ — is the protocol sibling SPEC-0085 rule 2's.\n  - **`cross reject`** (#2+#3+#4)\
  \ — receiver declines with reason; emits `cross_rejected` (terminal).\n    **It\
  \ carries the RE-ENTRY DISPOSITION ** — see §`cross close` for the one shared rule.\n\
  \    This is the leg the rule exists for most sharply: a reject is terminal AND\
  \ the author never gets\n    a close to be gated at, so a conditional decline captured\
  \ nowhere here is captured nowhere at all\n    (X-0387). `--re-entry \"<condition>\"\
  ` (optionally `--re-entry-awaits <T-NNNN>`) arms the waiter in\n    the RECEIVER's\
  \ debt echo; `--no-re-entry \"<why>\"` records the dismissal on `cross_rejected`\
  \ as\n    the additive `re_entry_dismissed` key, outside `_NOTE_KEYS`. `--reason`\
  \ stays REQUIRED and is the\n    text the guard reads alongside the chain-derived\
  \ resolution note.\n  - **`cross dispute`** (#2+#3+#4) — the AUTHOR records that\
  \ a peer-declared `done` fix does NOT reach\n    the case: emits `cross_disputed`\
  \ (NON-terminal), returning the item to `picked`. The symmetric\n    sibling of\
  \ `cross reject` one role over — the receiver has always been able to decline with\
  \ a\n    reason; the author had no way to say the delivered fix does not work. Role-guard:\
  \ only `from`;\n    kinds `{task, bugfix}`; from-state `done`. **`--reason` is REQUIRED**\
  \ (unlike `cross done --note` /\n    `cross close --note`, which are optional):\
  \ the disproof is the entire content of the edge, and a\n    dispute without it\
  \ is indistinguishable from a mis-click and gives the peer nothing to act on —\n\
  \    the same reasoning that makes `--reason` required on `cross reject`. Required\
  \ by the VERB BODY\n    on both input routes, not by argparse : `dispute`, `reject`,\
  \ `done` and `ack` carry\n    **`--from-stdin`** — the shell-proof route `request`\
  \ / `close` already had, the `cross close`\n    shape (shared `textutil.stdin_mapping_ingest`\
  \ as the verb's first statement, argv content flag\n    beside it REFUSED, unknown\
  \ key REFUSED). The argv-side backtick refusal for these flags is\n    SPEC-0209's\
  \ pre-parse seam (`ARGV_PROSE_SEAMS`), not a per-verb check\n    (<project> X-1452\
  \ / X-1453). It rides `_NOTE_KEYS`, so\n    `cross show` renders it as the resolution\
  \ note with no read-side change, and it takes the\n    CITATION ORDERING check like\
  \ every other human string this verb group publishes (refused BEFORE\n    the emit,\
  \ so an unallocated `X-NNNN` never reaches the append-only log).\n    **WHY (X-1093,\
  \ reported by <project> and caused by us):** an author who VERIFIED that a peer's\
  \ fix\n    does not reach the reported case had two moves and both were wrong. `cross\
  \ close` ASSERTS\n    verification, so closing writes a false record — and it was\
  \ a single command, i.e. the dishonest\n    act was the cheap one. Doing nothing\
  \ left the item in the fixed-to-verify outbox cut (rule 4)\n    indefinitely, carrying\
  \ no trace of the verification that already happened. The partial route that\n \
  \   existed — the RECEIVER re-running `cross done --note` on an already-done item\
  \ — puts the\n    disproof on the item but is available only to the OTHER party,\
  \ needs them to volunteer it, and\n    leaves the item still reading `done`. Measured\
  \ 2026-08-22 on X-1044 + X-1045.\n    **THE FENCE: `cross close` is NOT widened.**\
  \ Its role, kinds and from-states are untouched, so a\n    close still means «I\
  \ verified»; on a disputed item (`picked`) a close is refused wrong-state by\n \
  \   the ordinary guard. Solving this by admitting the negative case into `close`\
  \ would have destroyed\n    the one thing the close record means. And the item stays\
  \ TERMINABLE: a real fix emits a new\n    `cross_done` and the author then closes\
  \ for real (no new status class, nothing stranded). The\n    data-model half — the\
  \ statusless event, the done-cancelling fold rule and its order-independence —\n\
  \    is the protocol sibling SPEC-0085 rule 2's.\n  - **`cross ack`** (#2+#3+#4)\
  \ — receiver acknowledges a `note`; emits `cross_acked` (terminal).\n    **It carries\
  \ the RE-ENTRY DISPOSITION too **, on identical terms to `cross reject` above\n\
  \    and for the identical reason: it is the `note` kind's ONLY terminal, so a conditional\
  \ decline\n    written on it strands with no author close to gate. The guard reads\
  \ the ack's own `--note` plus\n    the chain-derived resolution note, and it holds\
  \ on the note-attach from `acked` as well.\n  **The ack MAY carry `--note <text>`\
  \ (X-0889): the receiver's SUBSTANTIVE RETURN,\n  recorded on `cross_acked.data.note`\
  \ and surfaced by `cross show` as the item's resolution\n  note** — the note kind's\
  \ equivalent of `cross done --note` above, on the ONE terminal a note\n  has. A\
  \ `note` that ASKED for work previously had no answer slot anywhere: `cross done`\
  \ is\n  kind-guarded to `{task, bugfix}` and the ack emitted `{id, by}` only, so\
  \ a receiver who did the\n  work had to re-file the answer as a SEPARATE id (X-0872\
  \ → X-0890) while the answered item read\n  `resolution note: (none)`. Optional\
  \ by construction on a FIRST ack — a bare ack emits the same\n  `{id, by}` it always\
  \ did (most notes are one-way FYI with nothing to return, and a required\n  flag\
  \ would be a new gate, CHARTER §P1) — and needs no read-side change, since `_NOTE_KEYS`\n\
  \  already reads a `note` off ANY accepted event, the LAST one winning.\n  **The\
  \ ack is legal from `acked` as a NOTE-ATTACH, and then `--note` is REQUIRED.**\n\
  \  The exact shape of the `cross done` attach from `done` above, one kind over,\
  \ and for the same\n  reason: the return is often written AFTER the terminal fired\
  \ (X-0872 was acked at\n   and the evidence came later), so gating on `requested`\
  \ alone locks the\n  receiver out of its own item and leaves the separate-id workaround\
  \ as the only path. A BARE\n  repeat resolves nothing and is refused journal-observably\
  \ (`cross_refused`, reason\n  `already-acked`), appending no event; with a `--note`\
  \ it appends the return, which the\n  last-accepted-note read side surfaces. The\
  \ data-model half — that this adds no state, no event\n  type, and is not terminal\
  \ reanimation (same-type terminals leave the fold's winner, the\n  `acked` status\
  \ and `contested` all unchanged) — is the protocol sibling SPEC-0085 rule 3's.\n\
  \  - **`cross close`** (#2+#3+#4) — the AUTHOR finalizes their own item: `cross_closed`\
  \ when the work\n    was done + verified, OR `cross_withdrawn` when the author RETRACTS\
  \ a not-done item (`--withdraw`\n    + reason). One author-terminal verb covers\
  \ both author terminals (the D3 set has no separate\n    `withdraw` verb); role-guard:\
  \ only `from`. **The close MAY carry `--note <text>` : WHAT\n    the author verified,\
  \ recorded on `cross_closed.data.note` and surfaced by `cross show` as the\n   \
  \ item's resolution note.** Closing ASSERTS «I verified the peer fixed it», so that\
  \ assertion gets a\n    durable home ON the item instead of only in the closing\
