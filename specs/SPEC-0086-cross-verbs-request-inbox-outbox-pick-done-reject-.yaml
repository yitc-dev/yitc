  \ gave: they are written by different parties at different moments.\n    **ORPHAN-AUTHOR\
  \ CLOSE — the plain close's ROLE guard relaxes to the RECEIVER, and only\n    then,\
  \ when the item's `from` names NO registered peer.** SPEC-0085 rule 2 carries the\
  \ FSM half and\n    the incident (X-0905/X-0907/X-0909 from the phantom sender `clone`);\
