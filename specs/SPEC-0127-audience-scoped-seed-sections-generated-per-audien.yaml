id: SPEC-0127
title: Audience-scoped seed sections + generated per-audience views (worker seed /
  controller supplement / startup inventory)
status: active
created_at: 2026-07-02 19:18:37+00:00
travels: null
consumed: false
implements:
- bin/lib/graph.py#_parse_audience_doc
- bin/lib/graph.py#_render_audience_views
- bin/lib/graph.py#_audience_views_drift
body: "## Scenario\n\nA dispatched **Worker** (a headless one-shot session that runs\
  \ ONE task through the 9 stages and\n`land`s) and the interactive **Controller**\
  \ do NOT need the same startup reading. A Worker never\ndispatches, never runs the\
  \ queue picker, never authors/stages plans — so the Controller-only parts\nof the\
  \ handbook seed (orchestrate/dispatch governance, the picker, the plan lifecycle,\
  \ the\ncontroller startup echoes, the owner-facing register rules) are dead weight\
  \ in its bootstrap. This\nspec makes the seed's audience explicit at the SECTION\
  \ level and GENERATES what each audience reads,\nso a Worker boots a smaller seed\
  \ while the Controller still receives everything — from ONE tagged\nsource, never\
  \ a hand-maintained second copy.\n\n## Internal\n\nTHE AUDIENCE-TAG MECHANISM +\
  \ THE THREE GENERATED VIEWS. This spec owns the MECHANISM; the seed\nCONTRACT (per-audience\
  \ read-order + per-audience post-`/compact` re-delivery) is homed in SPEC-0007\n\
  and amended by this plan (one-home, P5). This spec adds a generator + a reader,\
  \ no new store.\n\n### 1. The audience tag (section-level, on the source) — ONE\
  \ storage contract\nA seed SECTION carries AT MOST ONE audience tag — `core` | `controller`\
  \ | `worker` — via an\nin-document managed marker at the section boundary, the SAME\
  \ carrier shape as the existing\n`<!--GEN:read-order:…-->` managed regions in AGENTS.md\
  \ (an HTML-comment marker the generator reads;\nthe exact token spelling is FIXED\
  \ by in §1a below). The tag lives on the SOURCE\nsection, never in a second list.\
  \ A section with MORE than one tag is a storage-format error (fails\nthe drift/format\
  \ check fail-closed, §6). \"At most one\" + \"untagged = `core`\" (§2) is ONE contract,\n\
  not two: absence is the fail-safe VALUE of the same single-tag field, and every\
  \ untagged section is\nsurfaced by the inventory (§2) as a to-tag drift signal —\
  \ so untagged is a VISIBLE default, never a\nsilent one.\n\n### 1a. Marker syntax\
  \ + section-resolution (FIXED)\nThe token spelling §1 deferred is FIXED here — the\
  \ tagging card chose it; the generator\n and the inspection read THIS:\n  - **Token:**\
  \ an HTML comment `<!--AUDIENCE:VALUE-->`, `VALUE` ∈ {`core`|`controller`|`worker`},\
  \ on\n    its OWN line as the FIRST line immediately below the Markdown heading\
  \ (`#`/`##`/`###`) it tags.\n    Reader regex `^<!--\\s*AUDIENCE:\\s*(core|controller|worker)\\\
  s*-->\\s*$` (the authored form carries no\n    inner whitespace). Same HTML-comment\
  \ carrier family as `<!--GEN:read-order:…-->` — but AUTHORED\n    source READ by\
  \ the generator, NOT a generated region (`graph build` never overwrites it).\n \
  \ - **Section span:** a heading + all content beneath it UP TO the next heading\
  \ of the SAME OR HIGHER\n    level (the heading's subtree, incl. deeper subsections).\
  \ Headings inside fenced code blocks are NOT\n    boundaries — the reader tracks\
  \ fence (```) state and ignores them (real case: the YAML-schema `#`\n    comment\
  \ lines inside a fence in AGENTS-PROTOCOL).\n  - **Resolution (runtime, fail-safe\
  \ over-inclusion):** effective audience = OWN marker; else nearest\n    ANCESTOR\
  \ heading's marker; else `core` (§2). Worker seed = sections whose effective audience\
  \ ∈\n    {`core`,`worker`}; controller supplement = effective audience == `controller`.\
  \ A section leaves the\n    worker seed ONLY via an explicit `controller` tag on\
  \ itself or an ancestor — never by omission (§2).\n  - **Multiplicity:** at most\
  \ ONE marker per heading (§1); 2+ = storage-format error (fail-closed).\n  - **Granularity\
  \ applied by :** every `#`/`##` heading carries an OWN marker (no top-level\n  \
  \  section is `core` by omission — the §5 re-accretion guard bites there); a `###`\
  \ carries an own\n    marker only when its audience DIFFERS from its enclosing section,\
  \ else it inherits. The §3c\n    inventory reports any `#`/`##` heading lacking\
  \ an own marker as to-tag drift.\n  - **`graph/floor-trigger-map.md` (a GENERATED\
  \ seed surface):** `graph build` overwrites hand edits,\n    so it carries NO hand-authored\
  \ marker — it is a whole-file `core` surface (every session reads the\n    floor);\
  \ its explicit `core` marker is EMITTED by the generator when builds the views.\
  \ Until\n    then it resolves to `core` by the §2 default.\n\n### 2. FAIL-SAFE default\
  \ = `core` (load-for-everyone), surfaced as drift\nAn UNTAGGED section resolves\
  \ to `core` — read by EVERY audience. The default fails toward\nOVER-inclusion:\
  \ a section can only be REMOVED from the worker seed by an EXPLICIT `controller`\
  \ tag,\nnever by omission. This makes anti-Forgetting the default — a newly-added\
  \ or forgotten-to-tag\nsection is never silently withheld from a Worker. The worker-startup\
  \ inventory (§3c) REPORTS every\nuntagged section as a drift signal («tag me»),\
  \ so the fail-safe default is observable and does not\nquietly accumulate untagged\
  \ content.\n\n### 3. The three GENERATED views (derived-only, committed; `graph\
  \ build`)\n`graph build` derives three artifacts from the section tags — the SIBLING\
  \ pattern of\n`graph/floor-trigger-map.md` (derived-only, committed, drift-checked):\n\
  \  (a) **worker seed** — the sections tagged `core` + `worker` (what a `--type build`\
  \ Worker reads),\n  emitted as SIZE-BOUNDED PARTS. A generated startup read surface\
  \ is held to the SPEC-0120 §3\n  one-bounded-read ceiling exactly as a source doc\
  \ is (SPEC-0007 §5c) — and the single assembled file\n  breached it (measured: 1275\
  \ lines / 50,775 reader-tokens / 4 read-calls; the reader truncated it).\n  So `graph\
  \ build` packs the assembled `core`+`worker` content into parts at the SOURCE-DOC\
  \ seam, by\n  CONTIGUOUS APPEND-ONLY next-fit under a SIZE band: one part is open\
  \ at a time, a whole source-doc\n  chunk is appended to it, and only an overflow\
  \ closes it and opens the next. The band has TWO bounds:\n  a LINE cap (SPEC-0120\
  \ §3's, \"stricter and trivially measured\") AND a BYTE budget. Both are needed\
  \ —\n  the reader's cap is on TOKENS, and seed-doc density is NOT uniform (a measured\
  \ 1.7x spread across the\n  seed docs), so a line-only cap can pack two comfortably\
  \ in-band docs into one part sitting at ~94% of\n  the reader's page cap. Bytes\
  \ stay deterministic and trivially measured (`wc -c`), so §3's virtue is\n  kept\
  \ while the bound that actually binds is the one enforced. Consequences of next-fit,\
  \ all\n  load-bearing: part ORDER equals source order (a closed part is never revisited,\
  \ so no chunk is ever\n  reordered); a chunk is NEVER cut mid-doc; and a source\
  \ doc whose own slice exceeds the band becomes\n  its own sole part and is REPORTED\
  \ (§5 probe 3) — the fix there is to split that SOURCE doc, never to\n  cut it here.\
  \ **Part 1 KEEPS the pre-split name** `graph/worker-seed.md` (the AGENTS.md split\n\
  \  precedent), continuations are `graph/worker-seed-<n>.md`, and every part names\
  \ its NEXT hop while\n  part 1 names the whole chain. The part COUNT is DERIVED\
  \ from the packing, never declared in a second\n  list; consumers discover it from\
  \ the emitted files. **The CHAIN is the seed** — a reader that stops\n  at part\
  \ 1 has read a sub-subset, which §4 and SPEC-0007 §5c both forbid.\n  (b) **controller\
  \ supplement** — the sections tagged `controller`. Since (Axis-1) this is a\n  \
  \    DERIVED REFERENCE view, NO LONGER the Controller's runtime read: the interactive\
  \ Controller\n      reads the SOURCE parts directly (its union = ALL sections =\
  \ the read-order files, each\n      SPEC-0120-band-sized — contract home: SPEC-0007\
  \ §5c). The view stays generated + drift-checked\n      (the audience partition\
  \ it renders is still the §5 inspection's subject).\n  (c) **worker-startup inventory**\
  \ — a report: each seed section → its audience tag, the worker\n      seed's line/token\
  \ total, and the HARD PROBE result (§5).\nThese are DERIVED-ONLY committed views\
  \ (never hand-edited); `graph build` regenerates them and a\ndrift check asserts\
  \ committed == regenerated, exactly as `_read_order_drift` / `_floor_map_drift`\
  \ do\nfor the read-order and the floor-trigger-map today. NO new store, NO caching\
  \ layer, NO new node-type.\n**Single home for build-output rules (P5):** these three\
  \ views are registered UNDER the existing\n`graph build` output contract (SPEC-0031)\
  \ — SPEC-0031 stays the ONE home for \"what `graph build`\nemits + where\"; SPEC-0127\
  \ supplies ONLY the audience-derivation rule feeding them. The implementing\ntask\
  \ amends SPEC-0031's output list to name the three artifacts (it does NOT open a\
  \ second\nbuild-output home here). **Source-of-truth (one line):** the tagged SOURCE\
  \ sections are the ONLY\nnormative text; the three generated views are DERIVED-ONLY\
  \ renderings of that source (no view is ever\nhand-edited or independently authoritative),\
  \ so they are not parallel storage (CHARTER §P5).\n\n### 4. Delivery is per-audience,\
  \ and MUST cover BOTH load surfaces\nA startup-served seed doc has TWO INDEPENDENT\
  \ load surfaces (the `doc-split-covers-every-load-surface`\nlesson): (i) the **manual\
  \ read-order** — the generated `HANDBOOK_READ_ORDER`, read by hand / echoed\nat\
  \ session start; and (ii) the **primary tool-adapter auto-inject import surface**\
  \ — the vendor\nadapter's native import directive, which loads ONLY the parts it\
  \ NAMES and re-fires on every\ncwd-change into a checkout/worktree (so a Worker's\
  \ `worktree new` + `cd` re-floors whatever the import\nnames). Per-audience delivery\
  \ MUST cover BOTH: the Worker's generated read-order lists `core`+`worker`\n(the\
  \ generated worker-seed) and the Controller's lists the SOURCE parts directly (its\
  \ whole\n`core`+`worker`+`controller` union —, contract home SPEC-0007 §5c) (surface\
  \ i), AND the audience split must NOT leave the\nauto-inject surface (ii) naming\
  \ a stale/whole set that re-floods a Worker with `controller` content —\nthe auto-inject\
  \ is co-designed WITH the split, never left behind.\n**Naming the CHAIN, not the\
  \ entry.** Now that the worker seed is emitted as size-bounded\nparts (§3a), \"\
  names the worker seed\" means names EVERY part — a surface that names only\n`graph/worker-seed.md`\
  \ delivers a TRUNCATED seed while LOOKING correct, because part 1 is a real,\nreadable\
  \ file. Both surfaces therefore carry the whole CHAIN: surface (i) names all parts\
  \ (the manual\nread-order prose + the `session start` echo, whose part list is DERIVED\
  \ from the emitted files, never\nhand-listed), and surface (ii)'s minimal inline\
  \ floor (§4a) routes the Worker to part 1 AND to the\ncontinuation parts it chains\
  \ to. Each part additionally names its own next hop, so a reader entering\nmid-chain\
  \ still reaches the end. Same both-surfaces obligation as above, applied to a part\
  \ COUNT that\ncan change: a hand-maintained per-part list is exactly the drift the\
  \ derivation exists to prevent (P5).\n(The concrete adapter that realizes\nsurface\
  \ (ii) — the `<vendor-adapter>.md` `@`-import — is an implementation anchor named\
  \ in the plan's corpus\nimpact + the implementing task, NOT the norm; the norm is\
  \ provider-neutral, CHARTER §P4b.) There is\nNO second echo mechanism and NO divergent\
  \ third order (the SPEC-0007 §5b coherence invariant,\nrestated per-audience). Post-`/compact`\
  \ re-delivery is the SAME re-read discipline applied to the\nreader's own audience\
  \ view — a `/compact` restores that audience's WHOLE view, never a sub-subset.\n\
  Consumer-delivery cross-reference (SPEC-0074 §7): under `-C`, the per-audience view\
  \ a consumer reads\nresolves from the engine's IDENTITY-AGNOSTIC release-view (`ENGINE_ROOT/release-view/<rel>`),\
  \ NEVER\nthe raw dev-entangled handbook — so this per-audience split composes WITH\
  \ the clean-view contract\n(SPEC-0074 §7): the delivered surface is both audience-scoped\
  \ (here) AND identity-agnostic (there).\nAny change to the consumer-echo delivery\
  \ (`bin/lib/session.py cmd_session_start`, which already names\nSPEC-0074 §7) must\
  \ keep both contracts satisfied.\n(The contract wording is amended into SPEC-0007\
  \ by this plan; this spec supplies the generated\nsurfaces the contract points at.)\n\
  \n#### 4a. Auto-inject surface (ii) carries a MINIMAL inline floor, NOT the whole\
  \ seed\nThe auto-inject surface (ii) re-fires on EVERY cwd-change with NO dedup,\
  \ so naming the whole\n`core`+`worker` seed there re-flooded the entire ~1300-line\
  \ seed on every `cd` into a worktree\n(the real incident: an interactive Controller\
  \ re-injecting a seed it already held, ~6000 wasted\nlines/session). So surface\
  \ (ii) NO LONGER names the generated worker seed: the vendor adapter\ncarries only\
  \ a MINIMAL inline anti-Forgetting floor (the CHARTER §P1 + deviation-capture anchors,\n\
  the audience routing, the read-order line, and the \"no governed action before the\
  \ seed_read\nreceipt\" pointer — the bootstrap-floor content of SPEC-0007 §4). The\
  \ FULL audience seed is\ndelivered AND GUARANTEED by the enforced one-time startup\
  \ read — the epoch-scoped `seed_read`\ngate (`_require_seed_read`, SPEC-0050 §8):\
  \ every governed/mutating verb refuses until the reader\nhas recorded a receipt\
  \ fresh for the current context epoch, so the seed reaches the reader before\nany\
  \ work regardless of what the auto-inject carries. This SUPERSEDES the surface-(ii)\
  \ \"name the\nworker seed\" wiring above WITHOUT weakening the both-surfaces principle:\
  \ the anti-Forgetting floor\nis now minimal-inline (the belt) + enforced-read (the\
  \ guarantee), and the \"MUST NOT re-flood a\nWorker with `controller` content\"\
  \ concern is subsumed — the auto-inject carries no seed sections\nat all, only the\
  \ tiny floor. The manual read-order (surface i) is UNCHANGED (each audience still\n\
  reads its whole view there). Decision provenance: `decisions/seed-floor-inline-vs-pointer-audit-adhoc.yaml`\n\
  (auditor finding #4 — keep a minimal inline floor so non-verb reasoning cannot happen\
  \ before any\ngate fires). The concrete adapter (`<vendor-adapter>.md`) is the implementation\
  \ anchor, not the norm (P4b).\n\n### 5. The HARD invariant (the inspection probe)\n\
  The inspection HARD-FAILS on ANY of three conditions — runtime audience default\
  \ stays `core` so a worker is NEVER starved of a rule (SPEC-0124 consult, decomposition-executing,\
  \ option 1): (1) **any `controller`-tagged section inside the worker seed**, (2)\
  \ **any UNTAGGED seed section** (untagged resolves to `core` at RUNTIME for safety,\
  \ but MUST be explicitly tagged — an untagged section FAILS the inspection, so controller-only\
  \ content cannot silently re-accrete as core). The worker-startup inventory computes\
  \ both; AND (3) **any worker-seed PART over the §3a line band** — the band is what\
  \ makes each part single-read-safe, so an over-band part is a broken read surface,\
  \ not a style nit.\nthe recurring inspection (roster) FAILS on any violation — this\
  \ is the mechanical guard that\nController-only content cannot re-accrete into the\
  \ worker seed over time.\n**The size signal is a PROBE now, not advice (superseding\
  \ the report-only reading).** The\nworker-seed line/token TOTAL stays report-only\
  \ — a total has no reader-facing threshold, only a\ntrajectory. What IS mechanically\
  \ checked is the PER-PART line band (probe 3): the packer holds it by\nconstruction\
  \ at every SOURCE-DOC seam, so probe 3 can fire in exactly ONE way — a single source\
  \ doc\nwhose own `core`+`worker` slice exceeds a bound, which the packer must not\
  \ cut mid-doc. The remedy is\nthen to SPLIT THAT SOURCE DOC (SPEC-0120 §3), and\
  \ the probe names it. The owner-set-threshold clause is\nDISCHARGED: the threshold\
  \ is not a preference, it is the reader's bounded-read page cap, measured\n and\
  \ grounded in SPEC-0120 §3.\n\n### 6. Bounds (what this is NOT)\nNOT a new node-type\
  \ (the audience tag is a section marker, not a graph node — GRAPH node-count bound\n\
  holds). NOT a validation/legality layer (a malformed audience token fails the storage-format\
  \ check\nfail-closed, like the read-order drift check; the generator judges no semantics).\
  \ NOT a second copy\nof any seed content — the views are DERIVED from the one tagged\
  \ source. The worker keep-list (which\nsections stay `core`/`worker`) is decided\
  \ at tagging time, not encoded here.\n\n### 7. What this RETIRES (P1 F3 — the removal,\
  \ not just the addition)\nThis does NOT only ADD a mechanism; it RETIRES the current\
  \ load model: **«one undifferentiated whole\nseed, loaded identically by EVERY session»**\
  \ ceases to be how the seed is delivered. After this, the\nseed is delivered per-audience,\
  \ and a dispatched Worker NO LONGER loads the `controller`-tagged\nsections (the\
  \ ~300-400 controller-only lines — orchestrate/dispatch governance, the queue picker,\
  \ the\nplan lifecycle, the controller startup echoes) at startup. The whole-seed\
  \ contract in SPEC-0007 §5 is\nAMENDED (not merely extended) to the three-tier model\
  \ — the old \"restore the WHOLE seed\" wording is\nsuperseded by \"restore the WHOLE\
  \ of YOUR audience's seed\" (per-audience coherence). Nothing is\nDELETED from the\
  \ corpus — controllers still receive every section — but the undifferentiated-load\n\
  RULE is removed and replaced.\n\n### 8. The seed budget — set membership, the byte/token\
  \ axis, compaction\nThe LINE cap — its hard limit and its warning threshold — is\
  \ stated in CHARTER §Principle 2 «Size\nbudget» and is not restated here; the rest\
  \ of the budget rule is this section. The seed keeps two\npre-edit cues that point\
  \ here: AGENTS.md «Authoring the seed» and the CHARTER «Size budget» list.\n\n**Canonical\
  \ handbook = the generated `HANDBOOK_READ_ORDER` set** (the single carrier in `bin/yitc-v2`,\
  \ from which every read-order surface is generated). A file is a handbook member\
  \ iff it is in that read-order — canonical is the SET, not a fixed file COUNT. Current\
  \ members: `CHARTER.md`, the AGENTS protocol (split across `AGENTS.md` + `AGENTS-SESSIONS.md`\
  \ + `AGENTS-PROTOCOL.md` for single-Read safety, SPEC-0120), `LIFECYCLE.md`, `QUEUE.md`,\
  \ `GRAPH.md`. Per SPEC-0120 an over-ceiling handbook doc SPLITS into read-order-served\
  \ parts (all parts served at startup), so the member list grows by splitting — the\
  \ old fixed \"5 files\" count is RETIRED (replacement: the generated set).\n\n-\
  \ **Byte/token axis — a REPORTED OUTCOME + a trajectory warn, NEVER a second cap\
  \ (owner ruling Q1,\n  2026-07-17).** The line cap is blind to DENSITY: a diff may\
  \ grow the set's reading cost while\n  its line count holds or even falls. So the\
  \ aggregate BYTES + a bytes/4 token estimate are REPORTED\n  beside the line cap,\
  \ and the existing report-only `seed-growth` WARN (`graph conformance`) fires on\n\
  \  byte growth as well as line growth. This axis decrees **no second hard cap and\
  \ no token number** —\n  deliberately: a decreed number is voluntaristic (established\
  \ by the cancelled plan\n  `startup-slice-compression-re-home-handbook-bodies-`),\
  \ so what decides whether content STAYS in the\n  seed is the **three-bucket placement\
  \ test** (creed stays · triggered detail demotes to its spec ·\n  provenance cuts),\
  \ never a threshold. Same rule already ratified for the sibling worker-seed total\
  \ at\n  SPEC-0127 §5: *a total has no reader-facing threshold, only a trajectory*.\
  \ Report-only means exactly\n  that — outside the conformance RED set, no exit code\
  \ moves.\n  - **Origin datum (so the trajectory has a zero point) — mind the two\
  \ distinct numbers.** At\n    2026-07-17 this budget's own subject, the `HANDBOOK_READ_ORDER`\
  \ set, measured **1739 lines = 70% of\n    the 2500 cap and GREEN, carrying ~173kB\
  \ (~100 bytes/line) ≈ ~43k tokens** — green on the only axis\n    that existed while\
  \ density grew unchecked. Distinct and wider: **~177k tokens** is the TOTAL\n  \
  \  per-substantive-task protocol weight (~37k seed + ~140k stage bundles), which\
  \ grew **×2.7** vs\n    2026-06-06 — the trajectory this axis exists to make visible,\
  \ but NOT what this budget measures\n    (stage bundles are not handbook members).\n\
  \    Do not read the two ~177 figures as one: the SET is ~173kB, the whole per-task\
  \ read is ~177k **tok**.\n    Method + both derivations: `ideas/protocol-weight-compaction-review-stage-bundles-seed.md`\
  \ §1/§1a.\n- Compaction trigger: any single decision adds > 100 lines OR session\
  \ adds > 200 lines aggregate → mandatory file follow-up task «compact / refactor\
  \ / delete equivalent content»\n- If approaching cap, split MUST involve **deletion**\
  \ of equivalent content, not just addition of a new file\n- **Distinct from a SPEC-0120\
  \ per-file safety split (orthogonal, aggregate-neutral):** relocating an\n  over-ceiling\
  \ doc's content VERBATIM into read-order-served sibling parts (SPLIT-never-delete)\
  \ is NOT\n  the compaction-split above — it does not change the aggregate line count,\
  \ so it needs no paired\n  deletion. Compaction (the deletion discipline above)\
  \ stays a separate action, applied when the\n  aggregate itself approaches the cap.\n\
  \n**Excluded from canonical handbook (not counted in the cap):**\n- `<vendor-adapter>.md`\
  \ — 5-line vendor-tool adapter pointing to `AGENTS.md`\n- `PATTERNS.md` — reference\
  \ catalog for migrated patterns + methodology lessons (rejected/withdrawn methodological\
  \ options + the why-rationale — the role orphaned when the `decision new` class\
  \ retired; see `patterns/methodology-lessons.md`) (not normative)\n- `README.md`\
  \ — repo entry point for humans (not normative)\n- `specs/*.yaml`, `tasks/*.yaml`,\
  \ `decisions/*.yaml` — operational state, not normative handbook\n\n## Rationale\n\
  \nReal driver: a Worker today bootstraps the full 1596-line seed, ~20-25% of it\
  \ Controller-only dead\nweight, while the handbook itself names handbook-bootstrap\
  \ as the biggest context burn and makes\nshrinking it the point of dispatch (`patterns/background-session-operation.md\
  \ §Working rhythm`).\nPrior-art / analog (CHARTER §P1 F1/F4): the MEMORY worker-exemption\
  \ (SPEC-0039 §0 `audience:\nbackground`) proves an audience-scoped worker read-set\
  \ is legitimate; the `HANDBOOK_READ_ORDER`\nread-order generation + the `floor-trigger-map`\
  \ generated-sibling (both with committed==regenerated\ndrift checks) are the exact\
  \ reuse targets — this mechanism EXTENDS them (F2 view-over-new-entity),\nit invents\
  \ no parallel generator or store. External adhoc audit 2026-07-02 steered a GENERATED\
  \ view\nover a hand-maintained worker-core doc (drift risk, P5).\n\n## Verification\n\
  \n- `graph build` emits the three views; a probe reads the worker-startup inventory\
  \ and asserts\n  `0 controller-tagged sections in the worker seed` (the §5 hard\
  \ invariant).\n- A drift probe: mutate a section's audience tag → `graph build`\
  \ → the committed worker seed /\n  controller supplement / inventory change accordingly,\
  \ and the drift check flags a stale committed\n  view (parity with `_read_order_drift`\
  \ / `_floor_map_drift`).\n- Adoption (real-data): ≥5 dispatched Workers complete\
  \ their 9 stages + `land` on the generated\n  worker seed with no stage blocked\
  \ by a relocated rule (the plan's postcheck probe block).\n"
cites:
