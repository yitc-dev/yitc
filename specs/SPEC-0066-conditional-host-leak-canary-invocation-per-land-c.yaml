id: SPEC-0066
title: Conditional host-leak canary invocation — per-land canary gated on the inert-path
  classifier, with a weekly-Review backstop
status: active
created_at: 2026-06-09 12:25:04+00:00
consumed: false
implements:
- bin/lib/worktree.py#_land_integrate
- bin/lib/worktree.py#_host_leak_land_verdict
- bin/lib/worktree.py#_host_leak_surface_state
body: "## Scenario\n\nLand's per-land verification runs the host-leak canary (`_run_host_leak_canary`,\
  \ `YITC_CANARY_RUN=1`)\n— historically the full suite shape re-run a SECOND time\
  \ on a clean checkout to detect host-leak\ndebris (~48s of the ~96s verify, 2026-06-09\
  \ telemetry). ** REPLACED that redundant re-run on\nthe per-land path:** the host-leak\
  \ DETECTION now folds into a before/after snapshot around land's OWN\n`_run_verify_tests`\
  \ pass (`_host_leak_land_verdict` / `_host_leak_surface_state`) — the SAME\nwatched-path\
  \ debris check (a `graph/index.json` rewrite shows as ` M` in `git status`, plus\n\
  `decisions/T-99*` debris + an orphan `graph/.index.json.*.tmp`; the git-status-only\
  \ land\nverdict, so a pure mtime-touch on a byte-clean tree is still not a leak)\
  \ with NO second suite execution. The re-run\nhad grown to 454 files and, under\
  \ concurrent-land CPU contention, tipped over the 300s per-file bound\n→ the `land-verify-timeout:test_t0402_host_leak_canary.py`\
  \ recurrence (3× on 2026-06-28). The\nstandalone canary (`tests/test_t0402_host_leak_canary.py`)\
  \ + the weekly `audit canary-backstop` keep\nthe active-run form for surfaces the\
  \ suite is not otherwise run against. On a land whose final merged tree touches\
  \ ONLY inert\npaths, the canary's verdict is identical to its periodic verdict —\
  \ a host-leak is introduced only by a\nchange to executable test/code, which is\
  \ an OBSERVABLE land. So on the ~64% of ships classified inert\n(measured — sibling\
  \ trial run 2, 211/326; the early telemetry estimate was ~79%), the per-land canary\n\
  re-proves nothing. This rule makes the per-land canary\nCONDITIONAL on the inert-path\
  \ classifier (SPEC-0064), and adds a weekly-Review backstop that covers\nthe one\
  \ residual a per-land skip leaves — a classifier misclassification.\n\n## Internal\n\
  \nCONDITIONAL HOST-LEAK CANARY INVOCATION. Two carriers, one rule: the per-land\
  \ gate + the weekly\nbackstop. The canary itself (`tests/test_t0402_host_leak_canary.py`,\
  \ the enforcement probe of\nSPEC-0041 §3) is UNCHANGED — this rule governs only\
  \ WHEN land invokes it.\n\n### 1. The per-land gate (when the canary runs)\nAt the\
  \ canary-invocation point in land's verification, classify the **final merged tree\
  \ about to\nfast-forward `main`** with the inert-path classifier (SPEC-0064 — one\
  \ authority; evaluated on the\nfinal tree, never an initial branch diff):\n- **final\
  \ tree INERT → SKIP the per-land canary** for this land. An inert final tree cannot\
  \ have\n  introduced a host-leak (a leak comes only from executable test/code, which\
  \ the classifier marks\n  OBSERVABLE), so the just-run periodic/standing canary\
  \ verdict still holds.\n- **final tree OBSERVABLE (or classifier unavailable) →\
  \ RUN the per-land host-leak CHECK** — the\n  cheap `_host_leak_land_verdict` snapshot-diff\
  \ around land's own `_run_verify_tests` pass,\n  NOT a second suite execution. Fail-closed:\
  \ anything not provably inert runs the check.\nONE skip-evidence carrier (no parallel\
  \ signals): a canary-skip is recorded as a `canary_skipped`\nfield (bool + classifier\
  \ reason) on the `land_completed` event — the SAME carrier shape lever B uses\n\
  for `reverify_skipped`, on the same event. A run is the existing behaviour. The\
  \ skip is never silent\n(Principle 8); `land_completed.canary_skipped` is the single\
  \ home for the skip signal everywhere.\n\n### 2. Evaluation point — the FINAL merged\
  \ tree\nThe gate is ALWAYS evaluated on the final merged tree about to ff (post\
  \ last re-merge/retry), NOT the\ninitial branch diff. Under concurrency a re-merge\
  \ can pull observable content into a tree whose branch\ndiff was inert; only the\
  \ final-tree evaluation sees it. (Same final-tree rule SPEC-0064 §3 mandates —\n\
  consumed, not re-stated.)\n\n### 3. The weekly-Review backstop (the residual net)\n\
  A per-land skip removes the canary only from a land the classifier called inert.\
  \ The single residual\nis a classifier MISCLASSIFICATION (a leak-capable land wrongly\
  \ classed inert) — improbable\n(fail-closed allowlist, trial-proven) and bounded\
  \ by a cadence. The backstop is therefore a\nbelt-and-suspenders net for that narrow\
  \ residual, NOT a primary guard:\n- **Carrier:** ONE line in QUEUE.md §Re-review\
  \ triggers (the EXISTING weekly Review cadence — no new\n  operating lane, no cron,\
  \ no new session type) that INVOKES A GOVERNED VERB — not a hand-run.\n- **Action\
  \ (governed, not prose):** the weekly trigger runs `bin/yitc-v2 audit canary-backstop`;\
  \ that\n  verb runs `_run_host_leak_canary` once on `main`, confirms green, and\
  \ EMITS the `canary_backstop_ran`\n  run-evidence event. The verb owns the run +\
  \ the emit (AGENTS §Verb-execution discipline — the emit is\n  never a hand action);\
  \ the weekly Review only invokes it. **Verb shape PINNED (no open accept-level\n\
  \  decision):** it is a NEW thin `canary-backstop` subcommand under the EXISTING\
  \ `audit` verb group\n  (`audit pre` / `audit post` / `audit adhoc` → `audit canary-backstop`)\
  \ — extending the established\n  verb family, not a parallel verb (anti-complexity\
  \ F1 extend-not-create; built to\n  `patterns/verb-design.md`).\n- **Failure-signal:**\
  \ absence of `canary_backstop_ran` for more than one Review cycle is visible in\n\
  \  the journal — no new detector. The backstop rots only if Review itself lapses,\
  \ which is acceptable\n  because the PRIMARY protection (the canary on every OBSERVABLE\
  \ land, §1) never lapses.\n\n### 4. Relationship to SPEC-0041 (cites, not)\nThis\
  \ rule CITES SPEC-0041 + SPEC-0064 and supersedes NEITHER. SPEC-0041 §3 EXPLICITLY\
  \ disclaims the\ninvocation wiring (\"Wiring it as a dedicated `land`/CI step is\
  \ — out of this spec's scope; the\ncanary itself is the probe\"), so the canary's\
  \ invocation TIMING is a NEW concern, not a reshape of\nSPEC-0041's host-isolation\
  \ contract. SPEC-0041 still owns WHAT the canary checks and the\ntest-authoring\
  \ isolation rules; this spec owns only WHEN land invokes it.\n\n### 5. One classifier\
  \ authority (no re-encoding)\nThe inert/observable decision is computed by the SPEC-0064\
  \ classifier helper and nothing else. This\nrule MUST NOT re-derive \"inert\" from\
  \ its own path test — it consumes the same single authority lever\nB consumes (SPEC-0064\
  \ §4). The A′ implementing task `requires:` the classifier task.\n\n## Parameters\n\
  \nNone consumed. The proven-inert allowlist + the observability definition + the\
  \ final-tree rule are\nowned by SPEC-0064 (cited, not duplicated — P5). The backstop\
  \ cadence (weekly) is the existing Review\ncadence, not a new param.\n\n## Rationale\n\
  \nLand median ≈ 96s ≈ the whole land; ~48s of that is the host-leak canary; ~64%\
  \ of real ship commits\nclassify inert (measured — sibling trial run 2, 211/326;\
  \ ~79% was the early 2026-06-09 telemetry\nestimate, refined down by the measured\
  \ classification — plan\n`conditional-per-land-host-leak-canary-gated-on-the`).\
  \ Two FULL external ad-hoc consults established\nthe load-bearing safety conditions:\
  \ moving the canary fully to periodic is unsound (its verdict\ndepends on branch\
  \ code the suite executes), but a fail-closed conditional canary is acceptable when\n\
  narrowed to (i) a narrow proven-inert set, (ii) evaluation on the final merged tree,\
  \ (iii) a backstop\nfor the misclassification residual. The deliberation + the rejected\
  \ forms live in the plan (SPEC-0005\nrule 3); this body carries only the resulting\
  \ rule.\n\n## Verification\n\nBehavioural probes (Principle 3 — observed behaviour):\n\
  - **Gating:** a land whose final merged tree touches only inert paths → canary SKIPPED\
  \ (journal shows\n  the skip + the classifier reason); a land touching `bin/**`/`tests/**`/config/fixture\
  \ → canary RUNS;\n  an unknown/new path → canary RUNS (fail-closed).\n- **Final-tree:**\
  \ a concurrency re-merge that pulls observable content into an otherwise-inert tree\
  \ →\n  canary RUNS (the gate evaluated the final tree, not the branch diff).\n-\
  \ **Backstop self-evidence:** the governed `audit canary-backstop` verb (invoked\
  \ by the weekly Review\n  trigger) emits `canary_backstop_ran` on cadence; running\
  \ it IS the P8 consumer evidence (the\n  discipline-ratio-lens precedent). Absence\
  \ for >1 Review cycle is journal-visible.\n- **No false-skip:** a land that SHOULD\
  \ run the canary (observable final tree) never skips.\n\n## Drift review\n\n (2026-06-09):\
  \ re-verified this body against `bin/lib/worktree.py#_land_integrate` (the per-land\
  \ canary\ngate) + `cmd_audit_canary_backstop` / `_run_host_leak_canary`. The conditional\
  \ per-land canary —\nclassifying the FINAL merged tree via `_classify_inert_paths(_merged_tree_delta_paths(W,\
  \ merged_base))`,\nthe `canary_skip_reason = \"inert-final-tree\"` skip vs the fail-closed\
  \ RUN on observable/unavailable,\nand the `audit canary-backstop` weekly verb emitting\
  \ `canary_backstop_ran` — all match the spec as\nwritten. The graph last-touch flag\
  \ was a region shift only (later land-bookkeeping commits moved the\n`_land_integrate`\
  \ symbol). No semantic drift; this re-touch clears the possibly-stale flag. Re-verified\
  \ again at : that change only tagged the 8 abort-path `_die` sites in `_land_integrate`\
  \ with a structured `abort_class` (the repeated-abort backstop) — ORTHOGONAL to\
  \ this spec's success-path conditional-canary logic; no semantic drift, this re-touch\
  \ clears the possibly-stale flag.\nAdoption (activation gate, CHARTER §P3/§P8 —\
  \ infra-class): both the per-land skip on an inert final\ntree and the canary run\
  \ on an observable final tree are OBSERVED in a real concurrent soak, the\nbackstop\
  \ event is present on cadence, and both consumers (this canary gate; lever-B re-verify\
  \ skip)\ncall the SAME SPEC-0064 helper.\n"
