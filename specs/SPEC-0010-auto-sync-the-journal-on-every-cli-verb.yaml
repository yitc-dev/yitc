id: SPEC-0010
title: Auto-sync the journal on every CLI verb
status: active
created_at: 2026-06-02 04:38:39+00:00
consumed: false
implements:
- bin/lib/cli.py#_auto_sync
binding:
- code-enforced
body: '## Scenario

  The owner never has to remember to "sync the journal". Whatever CLI verb they run,
  the durable

  journal (events.jsonl) is brought up to date as a side-effect, so cross-session
  state is never

  silently stale because a sync step was forgotten.


  ## Internal

  **Rule (invariant):** every `bin/yitc-v2` CLI verb runs `_auto_sync` around dispatch
  BEFORE the

  verb''s own effect, for ALL non-excluded verbs **including read-only ones**, and
  INDEPENDENT of the

  verb''s exit status (a failing verb must not skip the sync). Sync is **ON by default**.


  **The ONLY opt-OUT verbs are exactly two — `journal sync` and `land`** — excluded
  to avoid

  recursion / self-observation (`journal sync` IS the sync; `land` runs its own integrate-time
  sync).

  No third exclusion is added without amending this spec.


  **MODE amendment — the `--read-only` skip is on the MODE axis, not the verb axis.**
  The

  opt-out VERB set above is still exactly two and is UNCHANGED. Additionally, `_auto_sync`
  is skipped

  entirely under the `-C <path> --read-only` evidence mode — for a reason the verb
  axis cannot express:

  the sync WRITES (it materializes `journal-sync-state/` into `REPO_ROOT` and appends
  events), and in

  that mode `REPO_ROOT` is a foreign checkout this session has promised not to write
  to. So the skip is

  a property of the TARGET, not of the verb — every one of these verbs still syncs
  normally in every

  other invocation. Nothing about around-dispatch invocation, exit-status independence
  or the sync-ON

  default changes outside the mode. This amendment is the amending §Rule requires;
  the mode''s own rule

  is homed in **SPEC-0078 §5** and is not restated here (SPEC-0005 rule 8).


  **ZERO-WRITE VIEW amendment — one FLAG-scoped opt-out, `nightly --status`.** The
  opt-out

  VERB set above is still exactly two; the bare `nightly` runner still syncs. The
  `--status` view alone

  skips `_auto_sync`, because its contract (SPEC-0105 §1e, the rule home — not restated)
  is that it

  writes NOTHING into either journal, and it is typically run with `-C` against a
  consumer, where a

  live caller session''s sync would be exactly such a write. Keyed on the function
  object plus the

  parsed flag (`cli.py#_zero_write_view`), so it cannot widen to another verb or flag
  without

  editing that predicate and this paragraph. This amendment is the amending §Rule
  requires.

  **Second member : `session pick`**, the project picker (SPEC-0086 rule 6f, the rule
  home) —

  keyed on its function object alone. It writes nothing itself (the only writes are
  the chosen

  project''s own child `session start`, which syncs as usual) and a newcomer runs
  it before any

  session exists; the predicate was renamed from `_nightly_status_view` to name both
  members.

  **Third member : `init --dry-run`** — keyed on the function object plus the parsed

  `dry_run` flag. Its --help promises a preview that writes nothing and emits no event,
  so the sync''s

  transcript rows and journal-sync-state/ update were exactly such a write; bare `init`
  still syncs.


  **Why a read-only verb still syncs:** events.jsonl is **replayable derived state**
  (the provider

  transcript is the authoritative origin), so a read-only session leaving transient
  allowlisted dirt

  on `main` is intentional and FOLDABLE by the next `land` — not substantive drift.
  This is what makes

  always-on sync safe.


  An editor changing CLI dispatch, adding a verb, or touching `_auto_sync` MUST preserve:
  around-dispatch

  invocation · exit-status independence · the exactly-two opt-out set (plus the zero-write
  views

  above: `nightly --status`, `session pick` and `init --dry-run`) · sync-ON default.


  ## Rationale

  Blind-zone incident ( origin, 2026-05-30): without a control-point sync, cross-session
  journal

  state silently lagged — a verb could act on stale truth. Homing the rule here makes
  the contract a

  durable, analyzable invariant instead of an inline code comment. Prior-art: the
  rule was authored as

  decision (now historical-only, migrated here — Part F leg B). Extends the

  control-point-sync doctrine ( §cache argument; CHARTER §P5 derived-state-is-committed).


  ## Verification

  Probe (observable): a read-only verb emits a sync side-effect (e.g. `task list`
  brings events.jsonl

  current), and the two excluded verbs do NOT recurse/double-sync. Grep proof of the
  contract home:

  this spec''s `## Internal` states the around-dispatch + exit-independent + two-exclusion
  + ON-default

  rule. (This spec does NOT claim sole/exclusive normative authority — that anchored
  phrase belongs

  only to SPEC-0008''s retirement-authority rule, per VP7.)

  '
