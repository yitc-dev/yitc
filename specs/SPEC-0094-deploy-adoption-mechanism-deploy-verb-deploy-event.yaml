init_concern:
  init_question: Does this project deploy a change to a live serving surface — and
    if so, what is its governed `deploy:` command, and how is each user-facing change
    probed live before close (the per-change live_probe)? Declare the deploy seam
    + live-probe, or waive.
  waiver: A non-deploying project (no live serving surface) may bare-waive — omitting
    the `deploy:` command and the live_probe declaration. A deploying project that
    waives the per-change live_probe must record a compensating control + a `recheck_by`
    expiry (the overdue-recheck debt then falls due — SPEC-0094 §3/§4).
  evidence: the `deploy_completed` event (the current-live revision, SPEC-0094 §1)
    + the per-change `live_probe` soak at the deploy seam (SPEC-0094 §4).
  recommended: 'If the project serves users live: declare `deploy:` with the one command
    you already run to ship, plus a live_probe of one user-facing URL checked after
    each deploy. If it serves nothing live yet (a library, a CLI, a prototype): waive
    with reason "no live serving surface yet" and revisit when it starts serving.'
  record_at: '`yitc-ops.yaml` — the `deploy:`, `rollback:` and `live_probe:` sections:
    each carries the declaration, or a `waiver: {reason: <why>}`.'
  tier: universal
