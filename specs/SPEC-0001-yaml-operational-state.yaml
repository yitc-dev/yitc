id: SPEC-0001
title: All operational state lives in YAML per-entry files
status: active
created_at: '2026-05-26'
consumed: false
implements: []
binding:
- floor
body: "## Internal\n\nOperational state — tasks, decisions, specs — lives as per-entry\
  \ YAML files\nin dedicated directories (`tasks/`, `decisions/`, `specs/`). No aggregate\n\
  index file is the source of truth. Markdown is reserved for human-facing\ndocumentation\
  \ (CHARTER, AGENTS, LIFECYCLE, QUEUE, GRAPH, PATTERNS, README).\n\n### Boundaries\n\
  \n- **operational state** = mutable data managed by AI agent or CLI:\n  tasks (`tasks/<id>.yaml`),\
  \ decisions (`decisions/<id>.yaml`), specs\n  (`specs/<id>.yaml`).\n- **derived\
  \ artifacts** = build outputs (`graph/index.yaml`, future\n  aggregate views). These\
  \ ARE generated, BUT committed to repo (not\n  `.gitignored`).\n- **event log**\
  \ = single `events.jsonl` append-only file. JSON Lines\n  format (one JSON object\
  \ per line). Schema: `{ts, type, task_id?, data}`.\n- **documentation** = markdown\
  \ in repo root. Stable, version-controlled,\n  human-edited.\n\n### Violations\n\
  \nAny of:\n- Adding a markdown file under `tasks/` or `decisions/` or `specs/`\n\
  - Maintaining a parallel aggregate index file editable by writers\n- Adding a second\
  \ event log file alongside `events.jsonl` — **SCOPED (additive amendment, SPEC-0084).**\n\
  \  This violation governs a repo OPERATIONAL-STATE storage (a divergent PARALLEL\
  \ store + a second\n  PARSER path — the failure named below). The ONE kernel-owned\
  \ SHARED coordination instance is NOT a\n  second event log in this sense: it is\
  \ the SAME journal MECHANISM (SPEC-0002 entry schema, ONE parser,\n  append + union-merge),\
  \ a permitted explicitly-scoped instance adding NO second format or parser path\n\
  \  — so the storage-truth invariant stays intact. A literal second FORMAT/parser\
  \ path still violates.\n  See CHARTER §Principle 5 amendment + SPEC-0084.\n- Adding\
  \ `*.yaml` operational state to `.gitignore`\n\n→ anti-complexity filter applies.\
  \ Requires owner approval + D-XXX\ndecision recording why exception warranted.\n\
  \n## Rationale\n\nV1 split-storage (markdown aggregate + YAML per-entry + aggregate\
  \ index)\ncaused 200-tool-call debugging session on 2026-05-26: writers and readers\n\
  operated on different storage contracts; consumers fell through to stale\nmarkdown\
  \ when YAML reader path failed. Single source of truth eliminates\nthis class of\
  \ bug entirely.\n\nPer-entry over aggregate: aggregate files force concurrent writers\
  \ to\nserialize through one file (merge conflicts) and make grep-style discovery\n\
  noisier. Per-entry scales to thousands of items without coordination cost.\n\n##\
  \ Verification\n\n- `find./tasks./decisions./specs -name '*.md' -type f` returns\
  \ nothing\n- `find./tasks./decisions./specs -name '*.yaml' -type f` returns valid\
  \ YAML\n- No file outside `events.jsonl` accumulates operational mutations\n- `graph/index.yaml`\
  \ is committed (not in `.gitignore`)\n"
cites:
