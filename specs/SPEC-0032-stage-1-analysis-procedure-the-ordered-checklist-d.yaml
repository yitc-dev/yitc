- bin/lib/cli.py#_plan_structural_findings
- bin/lib/cli.py#_print_cross_territory_routing_hint
- bin/lib/cli.py#_stage_sequence_skeleton
body: "## Scenario\n\nThe moment a Build session CLAIMS a task (`worktree new --task\
  \ T-XXXX`) it must RECEIVE the ordered\nStage-1 (Analysis) procedure — the checklist\
  \ of what to establish before any edit — at that exact\nmoment, in that exact place\
  \ (the owner-paramount concern: do not miss the delivery moment). The\nsession never\
  \ has to remember the procedure from memory: the claim verb surfaces it (the\nAnalysis\
  \ stage-entry — the claim IS Analysis-entry) and runs the decomposition structural\
  \ pre-pass\nover the task's scope+acceptance. Surfaces + reports, never gates —\
  \ claim-counting stays AI/auditor judgement.\n\n## Internal\n\nRead the task YAML\
  \ in full, then work these ORDERED Stage-1 steps IN ORDER before any edit. Each\
  \ step\nREFERENCES its detail home; it does NOT duplicate the discipline (DRY —\
  \ those specs/principles stay the single homes):\n\n1. **Prior-art grep** — CHARTER\
  \ §Principle 1 filter 1: does a similar mechanism / file / decision\n   already\
  \ exist? Sweep current artifacts AND the PLAN layer (`bin/yitc-v2 plan list --status\
  \ accepted` —\n   is this already planned, or does it contradict a plan? plans are\
  \ committed direction/;\n   : plans are NOT startup-scanned, this is a targeted\
  \ Stage-1 sweep). ALSO consult `patterns/methodology-lessons.md` (the catalog of\
  \ rejected/withdrawn methodological options + their why) — anti-reinvention #5:\
  \ is this approach already weighed and rejected? Extend it, don't create parallel.\
  \ ALSO surface relevant `lessons/` entries for this topic — the Stage-1 lessons\
  \ read-surface (SPEC-0091 Rule 1).\n   - **Already-SHIPPED dup-check (BEFORE claiming/implementing)**\
  \ — \"prior-art\" is not only \"is there an\n     analog?\" but \"is this exact\
  \ work already DONE?\". Grep the task's core implementation SYMBOL (the\n     function\
  \ / flag / artifact the task would create), AND check the CITED plan's done tasks\
  \ +\n     `closed_into` — a realized plan that still carries `closed_into: []` makes\
  \ the \"already done\" link\n     INVISIBLE, so check the plan's done-task list\
  \ too, not only the field. If the symbol resolves to\n     shipped code OR a cited\
  \ plan-task already closed it → it is a duplicate: HALT, do not re-implement.\n\
  1a. **REPEATED-WORK CHECK** — the prevention half of filter 1: an \"existing analog?\"\
  \ that is not\n   REUSED becomes the same work done twice. Does this change add\
  \ a read, a loop, a poll, a remote\n   fetch, a scan or a worker pass? Then NAME\
  \ the NEIGHBOURING mechanism at the same seam that\n   already folds / caches /\
  \ bounds / watermarks that work and state what is reused — or record that\n   none\
  \ exists (this change then owns the first one). Classes, detect heuristics and the\
  \ severity\n   rubric: `patterns/repeated-work-lens.md` (the single home — never\
  \ restated here, SPEC-0005 rule 8).\n   Report-only, like the rest of this checklist:\
  \ no verb refuses on it, and the `analysis:` record is\n   its only carrier. The\
  \ KERNEL-VERB counterpart of this check — the read contract for composed kernel\n\
  \   seams — is SPEC-0190 rule 10.\n2. **Cite-the-proof** — (failure classes #7/#8):\
  \ an asserted existence/absence MUST cite the\n   grep/path that proves it, and\
  \ sweep `decisions/` (not only code). «I think it exists» is not prior-art.\n  \
  \ - **Premise check — the CARD's own assertions. NARROW, and never a gate.** The\
  \ rule above\n     governs YOUR assertions; this applies it to the CARD's. If the\
  \ card STATES a **causal or empirical\n     premise** («X happens because Y», «no\
  \ verb covers this», «the row is absent»), TEST that one claim\n     against the\
  \ NEAREST code/corpus evidence and RECORD the outcome in the `analysis:` record\
  \ as\n     **confirmed / refined / refuted**. A card that states no such claim is\
  \ recorded **not-applicable** —\n     for a purely descriptive card that branch\
  \ is the expected answer, not an escape.\n     **Three bounds, all load-bearing:**\
  \ it is NOT a blanket re-derivation of the card (re-litigating a\n     card at Stage\
  \ 1 costs more than the gap this closes), NOT a second decomposition pass, and NOT\n\
  \     permission to reopen an accepted design decision the card is downstream of.\
  \ **It never blocks:** no\n     verb refuses on it and it adds no artifact — the\
  \ analysis record is its only carrier.\n     A REFUTED premise found BEFORE the\
  \ claim takes the governed pre-claim exit (`task refuse` —\n     SPEC-0133); found\
  \ AFTER, capture the deviation and escalate per SPEC-0103.\n     Siblings — pointers,\
  \ not restatements, so the corpus reads as one rule: SPEC-0060 item 3 is the\n \
  \    FILING-side cue (how a card is written); `patterns/validate-deviation-task-premise-at-analysis.md`\n\
  \     is the how-to for the deviation-framed subset («X is missing») — read it when\
  \ the card has that\n     shape; SPEC-0166 is the same discipline at the IMPORT-INTAKE\
  \ seam (`imported_from:` cards, where it\n     does gate dispatch) — this clause\
  \ neither extends nor re-gates it. The duty is homed HERE so it\n     reaches every\
  \ executing session, including a Controller self-executing.\n3. **Standing-rule\
  \ check** — does this establish/change a rule / invariant / contract / design-boundary\n\
  \   / governing parameter? If yes it is a candidate `proposed` spec (SPEC-0005)\
  \ — name it now, STAGE it\n   in Plan (it is NOT authored in Analysis).\n4. **Decomposition\
  \ check** — ONE provable claim per accept-unit (<workshop-spec>): if the unit proves\
  \ >1\n   claim, SPLIT (encode the order via `requires:`); a deferral MUST be a tracked\
  \ task, never prose.\n5. **Spec-coverage reverse-lookup** — for EACH file/symbol\
  \ this task EXPECTS TO TOUCH (its\n   `expected_touch`), run the reverse lookup\
  \ `bin/yitc-v2 graph query <file>` (code→specs, SPEC-0031)\n   → READ the governing\
  \ active spec(s) → DECLARE in `implementation_plan` one line PER DIRECTION: (1)\n\
  \   the touched code IS governed by spec(s) → `spec update: yes <which>` OR `no,\
  \ because <reason>`; (2)\n   the touched code has NO governing spec → either justified\
  \ spec-less (the SPEC-0005 admission test\n   does not warrant one) OR name the\
  \ candidate `proposed` spec (this JOINS step 3 standing-rule check,\n   it does\
  \ not duplicate it).\n6. **Read the cited specs / decisions / prior tasks.**\n7.\
  \ **Scope unclear?** File a clarification to a Review session — do NOT proceed on\
  \ a guess.\n\n**Done when** you can name: (a) what already exists, (b) what changes,\
  \ (c) the smallest concrete edit.\n\nCROSS-TERRITORY ROUTING HINT (additive —, SPEC-0005\
  \ §7). Alongside the structural pre-pass, the\nclaim path ALSO surfaces a **report-only\
  \ cross-territory routing hint**:\nwhen the claimed task's forecast paths (`expected_touch`)\
  \ resolve OUTSIDE own territory (a path-based\nsignal — AGENTS §Scope boundary),\
  \ the work looks like ANOTHER project's, so the hint names the\nterritory-safe route\
  \ — file a coordination item via `yitc-v2 cross request --to <project>` (the shared\n\
  coordination log) instead of `task file`-ing it into THIS queue. The SAME hint fires\
  \ at `cmd_task_file`\n(filing time, before the write). It is **report-not-block**\
  \ like the pre-pass (never gates — CHARTER\nnon-goal #7), and a **navigational POINTER**\
  \ (SPEC-0005 rule 8): the governing routing CONTRACT lives\nsingle-SoT in **SPEC-0084**\
  \ (the cross system) — this spec does not restate it, it only wires the\nwrite-side\
  \ surfacing of it at the Analysis claim + filing moments.\n\n## Rationale\n\nProvenance\
  \ (the founding incidents, the refinement history and the rejected alternatives)\
  \ lives in\ngit history and the authoring plan — not here.\n\n### History moved\
  \ from the rule body\n\nEach entry is a passage moved word for word out of the rule\
  \ text of the section it names;\nthe rule it explains stays there.\n\nFrom «Internal»:\n\
  \nThis spec HOMES the ordered SEQUENCE + the delivery contract — NOT a copy of each\
  \ step's discipline\n(those are CHARTER §1 / / SPEC-0005 / <workshop-spec>). LIFECYCLE\
  \ §Stage 1 prose is demoted INTO this\nspec, and the standalone before-file decomposition\
  \ surfacing is retired — the decomposition step now\nreaches the session at CLAIM,\
  \ before filing.\n\n## Implementation notes\n\nNotes for the maintainer of the code,\
  \ moved word for word out of the rule text of the section\neach names.\n\n- From\
  \ «Internal»: (`cmd_worktree_new` → `_claim_task`)\n- From «Internal»: (`_analysis_procedure_reminder`)\n\
  - From «Internal»: (`_plan_structural_findings` over scope+acceptance, reused —\
  \ not a parallel\n  validator)\n- From «Internal»: (`_print_cross_territory_routing_hint`)\n\
  - From «Internal»: (`_stage_sequence_skeleton`, appended to `_analysis_procedure_reminder`)\n\
  \n### Moved from the rule text\n\nReference and maintainer passages moved word for\
  \ word out of the rule text of the section\neach names; no rule an acting reader\
  \ applies moved with them.\n\nFrom «Internal — delivery»:\n\nDELIVERY (the load-bearing\
  \ contract). This procedure is delivered at the **Analysis stage-entry** ( —\n`binding:\
  \ [stage-entry:Analysis]`; the `worktree new --task` claim IS Analysis-entry, so\
  \ it surfaces this\nprocedure, and `stage Analysis` re-delivers it — as a pointer\
  \ line while the session's context epoch\nalready holds it unchanged, in full after\
  \ a `/compact`; rule home SPEC-0050 §4). The claim path\nSURFACES the checklist\
  \ AND runs\nthe decomposition step's mechanical half — the EXISTING structural pre-pass.\
  \ Both are **report-not-block** (CHARTER\nnon-goal #7 + <workshop-spec> §C). The\
  \ `task_picked` event carries `trigger: \"stage-entry:Analysis\"` (the\nalways-present,\
  \ activation-independent claim-time delivery marker) + `governing_contract` (the\
  \ standard\nactive-only delivery-observability projection, SPEC-0013; resolves to\
  \ this spec once active).\n\nFrom «Internal — per-stage command sequence»:\n\nPER-STAGE\
  \ COMMAND SEQUENCE (additive). The claim moment ALSO surfaces the canonical\nper-stage\
  \ command sequence:\nfor every substantive stage IN ORDER it prints ENTER (`stage\
  \ <NAME> --task`) -> WORK -> FINALIZE\n(the STAGE_WORK_VERBS work-verb), then `land`,\
  \ and names per stage the contracts ENTER DELIVERS\n(DERIVED from `_stage_bundle_specs`\
  \ — the SAME carrier `_require_reads` enforces, P5). This is a\ndelivery/discoverability\
  \ fix, NOT a new gate: a fresh executor learns the whole ENTER->WORK->\nFINALIZE\
  \ shape ONCE at claim instead of via the cascading stage-correspondence / read-gate\
  \ refusals\n(the gates are UNCHANGED + correct). Report-not-block (CHARTER non-goal\
  \ #7).\nNO FETCH STEP : ENTER delivers each contract in full and writes the receipt\
  \ the read-gate\ncredits, so the sequence does not tell the executor to fetch a\
  \ delivered contract before working;\n`graph query <SPEC>` is named once, as the\
  \ RE-READ after a `/compact` (delivery rule: SPEC-0050 §4).\n\n## Verification\n\
  \n- **VP1 (delivery — the paramount probe, CHARTER §P3/§P8 infra-class):** a LIVE\
  \ claim of a real task\n  (`worktree new --task T-XXXX`) surfaces the ordered checklist\
  \ (INCLUDING the decomposition step) and\n  emits a `task_picked` carrying `trigger:\
  \ \"stage-entry:Analysis\"`; a dedicated `live_trigger_evidence` event\n  names\
  \ this spec. PROBE = the event present in events.jsonl + the surfaced output captured\
  \ from a real\n  claim (NOT a unit test asserting the binding string).\n- **VP2\
  \ (stage delivery):** `stage_to_specs[\"Analysis\"]` (graph/index.yaml binding_report)\
  \ contains\n  SPEC-0032, so `stage Analysis` delivers it. PROBE: inspect the index\
  \ / run `stage Analysis`.\n- **VP3 (references, not duplication):** the §Internal\
  \ steps reference <workshop-spec> + SPEC-0005 + CHARTER §1 without restating their\
  \ rules. PROBE: grep this body.\n- **VP4 (control-point, not pointer-only):** the\
  \ binding-completeness report shows SPEC-0032 delivered\n  (non-empty binding) with\
  \ 0 unexplained dangling, and the `implements:` anchors resolve. PROBE: graph\n\
  \  build / binding report.\n- **VP5 (dup-check sub-step present + executed):** step\
  \ 1 carries the explicit Already-SHIPPED\n  dup-check sub-bullet (grep the core\
  \ implementation SYMBOL + check the cited plan's done tasks +\n  `closed_into` BEFORE\
  \ claiming/implementing). STATE-CHECK probe: grep this body for the dup-check\n\
  \  sub-bullet. CONSUMER-READ probe: a Build/dispatched session's Stage-1 record\
  \ cites a live grep-proof of\n  the dup-check applied to its OWN task (\"symbol\
  \ resolves to nothing / cited plan has no done task for\n  this\") — a `consumer_read_evidence`\
  \ event naming this spec counts.\n- **VP6 (reverse-lookup sub-step present + applied):**\
  \ §Internal step 5 carries the\n  spec-coverage reverse-lookup (`graph query <file>`\
  \ per touched file → read governing active specs →\n  declare a per-direction `spec\
  \ update:` line in `implementation_plan`). STATE-CHECK probe: grep this\n  body\
  \ for the reverse-lookup sub-step (both directions present). CONSUMER-READ probe:\
  \ a real task's\n  `implementation_plan` carries the declared `spec update: yes/no\
  \ + why` line produced by applying it —\n  a `consumer_read_evidence` event naming\
  \ this spec counts.\n- **VP7 (per-stage command sequence surfaced at claim):** the\
  \ claim-moment surface\n  (`_analysis_procedure_reminder`) embeds `_stage_sequence_skeleton`,\
  \ which prints — for every\n  substantive stage in lifecycle order — the ENTER (`stage\
  \ <NAME>`) command, the contracts it\n  DELIVERS (from `_stage_bundle_specs`), and\
  \ the FINALIZE (STAGE_WORK_VERBS) commands + trailing `land`.\n  STATE-CHECK probe:\
  \ tests/test_t9741_stage_sequence_skeleton.py asserts the full\n  ENTER->WORK->FINALIZE\
  \ sequence is present in ONE place AND that it prescribes no per-contract\n  fetch\
  \ before working. CONSUMER-READ probe: a real claim\n  surfaces the sequence in\
  \ its captured output (the per-stage refusal cascade is no longer the only\n  discovery\
  \ path).\n"
