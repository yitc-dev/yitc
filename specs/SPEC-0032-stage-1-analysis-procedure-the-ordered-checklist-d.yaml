id: SPEC-0032
title: Stage-1 (Analysis) procedure — the ordered checklist delivered at task claim
status: active
created_at: 2026-06-03 15:25:47+00:00
consumed: false
implements:
- bin/lib/worktree_lifecycle.py#cmd_worktree_new
