body: "## Scenario\n\nThe person says «ок, ставим внешнего». The AI helps them install\
  \ whichever provider's CLI they chose\nand log in — how, is their business. Then\
  \ ONE file outside the engine tree gets three or four lines:\n`bin/yitc-v2 config\
  \ set auditor.routine.provider <adapter>`, `… auditor.routine.binary <path>`,\n\
  optionally `… auditor.routine.home <dir>` and `… auditor.routine.model <id>`. That\
  \ is the whole\nbinding. `release verify` and `update` never see the file; `config\
  \ list` shows it; the next audit\nruns on the bound provider, the verdict says which\
  \ provider and model, and the reminder goes silent.\n\n## Internal\n\n### Rule 1\
  \ — A third machine-settings class: `binding` (amends SPEC-0193 rule 2)\nSPEC-0193\
  \ rule 2 has PERFORMANCE and GATE. This spec adds `binding` — a LOCATOR the operator\
  \ declares:\nWHICH auditor runs on this machine. It is neither cadence (performance)\
  \ nor a threshold a refusal\nreads (gate): it changes WHO judges, not whether a\
  \ judged thing passes. Exactly EIGHT keys per tier\n(`routine` | `full`): `auditor.<tier>.provider`\
  \ (an adapter name the ADAPTER REGISTRY knows —\nSPEC-0036 §Auditor selection +\
  \ `bin/audit-config.yaml`, where the adapter names live and where a\nnew adapter\
  \ is added as one function; no brand is restated here, CHARTER §P4b),\n`auditor.<tier>.binary`\n\
  (a path), `auditor.<tier>.home` (the provider's auth/config home dir), `auditor.<tier>.model`\
  \ (a\nmodel id), and —, owner directive 2026-09-23 «основной и доп» switchable from\
  \ the machine\nsettings — `auditor.<tier>.effort` (the primary pair's effort) plus\
  \ `auditor.<tier>.reserve.model`\nand `auditor.<tier>.reserve.effort` (the rule-6\
  \ reserve pair). Every pair half is stamped on the\nverdict it produced (rule 6),\
  \ which is what keeps a machine-switched pair honest. And —,\nowner directive 2026-09-29\
  \ «лимит в параметрах быстро менялся без задачи» — `auditor.<tier>.timeout`,\nthe\
  \ bound auditor's wall-clock in seconds. It is admitted here, not as GATE, because\
  \ its expiry\nproduces NO verdict (a no-answer: rule 6's reserve, else ABORT) —\
  \ it decides how long the bound\nauditor may take, never whether a judged thing\
  \ passes. Resolution: env `YITC_AUDIT_TIMEOUT_SECONDS`\n→ this key → the shipped\
  \ constant (`bin/lib/audit.py#audit_timeout_resolution`; a non-positive or\nnon-integer\
  \ value reads as absent); `audit status` prints each tier's value and the layer\
  \ that\nanswered. The env knob and the code constants stay GATE, changed only by\
  \ a card. Anything else\nunder `auditor.*` is unclassified → GATE → refused, as\
  \ SPEC-0193 rule 2 already says.\n\n### Rule 2 — Why `model` is in the binding,\
  \ and the two guards that make that honest\n(gate-specs finding 2.) A model choice\
  \ changes audit STRENGTH, so a silently weaker model would be a\ndegradation nobody\
  \ sees. It is admitted into the binding because an adopter on a non-default\nprovider\
  \ MUST be able to name a model without editing the engine tree (a tracked-file edit\
  \ is refused\nby `release verify`). Two guards: (a) every verdict STAMPS `auditor_model`\
  \ beside\n`auditor_provider` (SPEC-0201 rule 2) — the model that ran is always on\
  \ record; (b) when the bound\nmodel differs from the repo config's tier default,\
  \ the SPEC-0201 rule-3 line names BOTH («bound model\nX, shipped default Y») at\
  \ `session start` and in the `audit status` re-fold — session-start-only by owner\
  \ decision 2026-09-06 («только на старте»); NO per-audit line. No refusal, no threshold\
  \ — visibility.\n\n### Rule 3 — Resolution order and precedence (one chokepoint,\
  \ extends)\nFor each of provider / binary / home / model: environment (`YITC_AUDIT_PROVIDER`,\n\
  `YITC_CODEX_AUDIT_BIN`, `CODEX_HOME`, `YITC_AUDIT_MODEL`) → the binding file → PATH\
  \ lookup (binary\nonly) → the repo `bin/audit-config.yaml` tier default → (binary\
  \ only) a NAMED refusal telling the\noperator how to bind one. Resolved in bin/lib/audit.py's\
  \ existing resolve_* functions — no second\nresolver. SPEC-0193 rule 7's «environment\
  \ > machine file > built-in default» is preserved; the\nbinding class simply becomes\
  \ a second thing the file may carry (rule 3 there is amended: «PERFORMANCE\nand\
  \ BINDING-class values only»). Rule 4 there is unchanged: GATE keys are still refused\
  \ and dropped.\n\n### Rule 4 — The hint's home and its post-/compact re-fold (SPEC-0007\
  \ §5b co-design)\nThe SPEC-0201 rule-3 line at `session start` is a report-only\
  \ echo of the debt-echo shape (SPEC-0119):\ncomputed, suppressed-when-clean, no\
  \ stored state. Its on-demand / post-`/compact` view is the\nread-only verb `bin/yitc-v2\
  \ audit status`: prints the resolved auditor per tier, its independence\n(external\
  \ | same-provider), the bound-vs-default model, the same-provider verdict count,\
  \ and — per\ntier — the rule-6 RESERVE PAIR: what is declared as the second door,\
  \ whether that door is itself\nresolvable on this machine, and the CAUSE when it\
  \ is not. All four reserve states SAY their case,\nthe two absence states (none\
  \ declared; an environment model pin, whose precedence bypasses both\npairs) naming\
  \ the CONSEQUENCE — no second door, or this tier waits on its primary — rather than\n\
  printing nothing. The view is QUALIFIED ONCE, at its head, by the bound it cannot\
  \ escape: it reads\nRESOLUTION, never the ability to ANSWER, and it invokes no auditor.\
  \ That qualification is part of\nthe contract, not decoration — a provider AT CAPACITY\
  \ resolves perfectly and returns no verdict, and\na surface that reports only resolution\
  \ reads as health during exactly the outage a reader is\nchecking it for (X-1431:\
  \ forty minutes; closes it at this reader). It states its silence\nexplicitly when\
  \ invoked bare (the `frontend-errors` precedent, SPEC-0171). It also reports, per\
  \ tier\nover a stated window (default 7 d, bounds printed), how often the PRIMARY\
  \ did not answer: the rule-6\nnon-answer captures against the tier's attempted audits\
  \ (`audit_prompt_sent`), the answered count,\nand the last non-answer — NO-DATA\
  \ when the window holds no audit, never a 0 rate. AGENTS\n§After-/compact gains\
  \ one pointer line to it (co-designed in the same change).\n\n### Rule 6 — Each\
  \ tier has a PRIMARY pair and an OPTIONAL RESERVE pair\nA tier declares a PRIMARY\
  \ pair — model + effort — and MAY declare a RESERVE pair, also model +\neffort.\
  \ A PAIR, not a bare model: a reserve model may need its own effort to be usable\
  \ at all. The\ntiers differ from each other by EFFORT, not by model: a tier's model\
  \ is not what makes its audits\nheavier, so binding one tier to another model would\
  \ change the lens every audit at that tier is\njudged by — a standing change made\
  \ to answer a transient outage.\n\nResolution: run the PRIMARY — unless the tier's\
  \ BREAKER is tripped (THE BREAKER, after the wait), in which case the\nRESERVE runs\
  \ first. Use the tier's RESERVE once, on the SAME packet, if and only if the\nprimary\
  \ DOES NOT ANSWER. «Does not answer» is NARROW and is the whole trigger: the provider\n\
  produced NO verdict — a capacity refusal, a timeout, a transport failure. A verdict\
  \ that ARRIVES is\nan answer, INCLUDING a RED one and INCLUDING a malformed one,\
  \ and never falls back: retrying an\nadverse or unparseable verdict on a second\
  \ model would mask the defect the audit exists to find. A\npermanent refusal — a\
  \ model id the provider does not serve to this account — is not a non-answer:\n\
  it names no capacity, timeout or transport cause, so it stays the refusal it already\
  \ was.\n\nWHEN A TIER DECLARES NO RESERVE THERE IS NO SWITCHING. The run WAITS on\
  \ its primary and retries it\nuntil the primary answers or the caller interrupts,\
  \ journaling a heartbeat before every wait so a\nwaiting audit is visibly waiting\
  \ rather than hung. It does not abort on the first refusal and it\nnever picks another\
  \ model on its own. The wait has no retry budget by design: a budget that expires\n\
  is the abort this rule forbids.\n\nTHE BREAKER — a tier that DECLARES a reserve\
  \ remembers across audits. Each primary\nnon-answer otherwise costs a full provider\
  \ timeout before the reserve starts, audit after audit.\nWhen the tier's PRIMARY\
  \ pair has missed N audits IN A ROW inside the window the no-answer rate is\nreported\
  \ over (rule 4) — the streak is keyed to the resolved primary pair, so a re-bound\
  \ primary\nstarts fresh, and only an answer from THAT pair resets it — the breaker\
  \ TRIPS: the tier runs its\nRESERVE first until a COOL-DOWN lapses, then probes\
  \ the primary again. A primary that answers the\nprobe RESETS the breaker; one that\
  \ does not re-trips it for another cool-down. While tripped, a\nreserve that does\
  \ not answer falls back to the primary once — the breaker only REORDERS the two\n\
  declared pairs, it never adds a judge and never turns a verdict into a refusal.\
  \ N is PER TIER\n: the FULL tier — every consult, every default or --full ad-hoc,\
  \ every full gate audit —\ntrips on its FIRST miss (N=1, `lib.audit.AUDITOR_BREAKER_FULL_THRESHOLD`),\
  \ the routine tier on its\nthird (N=3, `lib.audit.AUDITOR_BREAKER_THRESHOLD`); the\
  \ trip is journaled AT the miss that reaches N,\nonce per open trip, so the next\
  \ audit of that tier runs the reserve first. N and the cool-down\n(`lib.audit.AUDITOR_BREAKER_COOLDOWN_SECONDS`)\
  \ are SPEC-0193 performance keys. The state is DERIVED from the journal rows the\n\
  no-answer rate already counts — no store. The trip and the reset each journal ONE\
  \ row per\ntransition (the deviation-capture carrier, a `transition_id` every racing\
  \ audit derives identically — a reset\nnames the trip it clears in `trip_id` —\n\
  appended under a lock), naming the tier, the window count and the owner of the auditor\
  \ config — never\na row per audit; a trip that cannot be journaled exactly once\
  \ is not acted on. Each completion row records THIS\ninvocation's tier and route\
  \ (`auditor_tier`, `auditor_route`: primary | breaker), so the rule-4\nrate counts\
  \ an audit the breaker routed to the reserve as neither a primary answer nor a miss,\
  \ and a\nbreaker-routed audit neither pair answered as a primary miss. A tier with\
  \ NO reserve never trips: its wait above is unchanged. The environment\nmodel override\
  \ bypasses the breaker exactly as it bypasses both pairs.\n\nA SUBSTITUTION IS NEVER\
  \ SILENT. The saved verdict records WHICH pair answered — the model, its\neffort,\
  \ and whether it was the primary or the reserve — and the run journals the switch\
  \ naming both\npairs. A verdict's authority rests on who produced it (CHARTER §P4a\
  \ / SPEC-0201 rule 2); two\nverdicts from different judges must not read as interchangeable.\
  \ The journaled rows reuse the\nexisting deviation-capture carrier: a primary that\
  \ will not answer IS «something is not as it\nshould be», and capturing it is what\
  \ makes the outage class countable. No new event type.\n\nPRECEDENCE is rule 3's,\
  \ unchanged: the environment model override wins over BOTH pairs. Where the\noperator\
  \ has named a model for this invocation the tier's declaration is bypassed entirely\
  \ — there\nis no second pair to switch to AND no wait to enter, and that invocation's\
  \ refusal stays exactly\nwhat it is today. Imposing the wait there would turn an\
  \ explicit model pin into a hang.\n\nVALUES LIVE IN THE CONFIG, THE RULE LIVES HERE\
  \ (CHARTER §P4b). This rule names NO model id and NO\neffort level. Every concrete\
  \ value — each tier's primary pair and its optional reserve pair — is\nowner-editable\
  \ data: the repo auditor-config file carries the shipped DEFAULTS, and the rule-1\n\
  machine binding overrides any HALF of either pair per machine, in the rule-3 order\
  \ (environment →\nbinding → repo config), so either door switches without a repo\
  \ edit. The code carries no\nliteral. Deleting a tier's reserve block (and binding\
  \ no reserve model) is the supported way to\nchoose the wait. A reserve that resolves\
  \ EQUAL to its primary is no second door: `config set` warns\non it and `audit status`\
  \ names it.\n\nA RESERVE BELONGS TO ITS TIER'S CONFIGURED PROVIDER. It differs from\
  \ the primary in model\nand effort only, so its model id is one the CONFIGURED provider\
  \ (binding → repo config) serves.\nWhen the tier RESOLVES to a different provider\
  \ — the environment provider override, or the\nSPEC-0201 same-provider admission\
  \ on a machine where the configured one does not resolve — the\nreserve is DROPPED:\
  \ the tier behaves as one that declares none (it waits on its primary; the\nbreaker\
  \ never trips), and `audit status` prints the dropped pair with the reason. A model\
  \ declared\nfor one provider is never launched on another.\n\nA PAIR RUNS ONLY ON\
  \ A CLI THAT CAN SERVE IT. The check is PER ADAPTER: an auditor adapter\nthat carries\
  \ it (today ONE adapter — the `invoke_codex` anchor above; another adapter gains\
  \ it only by\nits own change, and until then runs unchecked) runs it before EVERY\
  \ spawn — primary and reserve alike —\nchecking the resolved provider CLI's version\
  \ against the minimum declared for the model it would run,\nread from the SAME per-model\
  \ floor map that provider's dispatched workers use (SPEC-0072 rule 8):\none map,\
  \ never a second, because a model's CLI floor belongs to the provider CLI and the\
  \ model, not\nto the role running it. A CLI older than the floor — or one whose\
  \ version cannot be read where a\nfloor exists — is a PRE-SPAWN REFUSAL naming the\
  \ binary, its version and the minimum: no verdict,\nABORT class, never a RED. It\
  \ is not a non-answer either: nothing was asked, so it neither switches\nto the\
  \ reserve nor enters the wait. A model with no floor row is not checked. Floors\
  \ are observed\nvalues, never guesses: each is the version the model was seen working\
  \ on, reduced only on evidence.\n\n### Rule 5 — What this does NOT do\nNo install\
  \ procedure for any provider (unregulated — owner directive 2026-09-06); no change\
  \ to\n`config set`'s GATE refusal; no new store, no new file (the machine-settings\
  \ file already exists,\nSPEC-0193 rule 3); no provider brand in this spec's normative\
  \ sentences (CHARTER §P4b — adapter NAMES\nlive in SPEC-0036's config description\
  \ and in `bin/audit-config.yaml`).\n\n## Parameters\nNone consumed (the binding\
  \ keys are machine values read through `machine_settings.get_value`, never a\ngoverning\
  \ scalar out of this spec).\n\n## Rationale\nReal incidents: pre-claim refusal (2026-09-06)\
  \ measured that the auditor binary is\nGATE-class today and `config set` refuses\
  \ it — so a per-machine binding is impossible without this\nclass; the adopter probe\
  \ measured audits ABORTing on this workshop's paths carried in the\nkernel config.\
  \ Prior-art: SPEC-0193 (the file, the classes, the precedence), SPEC-0036 §Auditor\n\
  selection (the three knobs + env), SPEC-0119/SPEC-0171 (the echo + re-fold shape)\
  \ (PATH +\nnamed refusal). REMOVED (P1 F3): the implicit «external auditor = this\
  \ workshop's binding»\nassumption; ADDED: one class value, one verb — the minimum\
  \ that makes «три строки в одном файле»\ntrue.\n\n## Verification\n  bin/yitc-v2\
  \ config set auditor.routine.provider the AI provider # accepted (binding class);\
  \ config_changed row\n  bin/yitc-v2 config set auditor.full.reserve.model <m> #\
  \ accepted (binding class); warns if = primary\n  bin/yitc-v2 config set auditor.routine.anything\
  \ x # REFUSED (unclassified under auditor.* → GATE)\n  bin/yitc-v2 config list #\
  \ shows the eight keys per tier with class=binding\n  bin/yitc-v2 audit status #\
  \ resolved auditor per tier + independence + counts\n  # tripwires: a binding-file\
  \ value is READ by resolve_* (differential: remove it → PATH/default);\n  # the\
  \ hint prints when unbound and is silent when bound; bound model ≠ default → both\
  \ named\n"
