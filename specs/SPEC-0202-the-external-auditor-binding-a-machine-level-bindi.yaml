id: SPEC-0202
title: 'The external-auditor binding: a machine-level binding class in the settings
  file (provider, binary, home, model), stamped on every verdict, with the session-start
  hint until an external one is bound'
status: active
created_at: 2026-09-06 09:27:37+00:00
