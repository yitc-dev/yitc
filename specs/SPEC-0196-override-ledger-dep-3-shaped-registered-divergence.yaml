body: |
  ## Scenario

  A project pinned to a released methodology sometimes needs to DIVERGE locally from an
  upstream-owned file — a fix it needs before upstream ships it, or a documented exception. Instead
  of editing the file and silently drifting into a shadow methodology, the project REGISTERS the
  divergence in a thin ledger: which path, why, what it intends upstream, when it is reviewed, and
  that it is deleted the moment upstream carries it. The owner sees every local divergence in one
  place, each with an expiry, and an update-pull tells them which entries are now redundant.

  ## Internal

  THE OVERRIDE LEDGER — the ONLY sanctioned form of local divergence from an upstream-owned file
  (release contract rule 2). It is a divergence RECORD, not a second methodology. Five rules.

  ### 1. One ledger, DEP-3-shaped entries
  The project keeps ONE override ledger (a section of its ops contract carrier `yitc-ops.yaml`,
  SPEC-0093 rule 1 — never a second file). Each entry carries EXACTLY: `path` (the upstream-owned
  file diverged from); `rationale` (one plain sentence); `upstream_intent` — a CLOSED,
  machine-readable status `temporary-patch | forwarded | accepted-exception | not-forwarded`;
  `review_trigger` (an ISO date OR a named artifact whose close re-opens the entry); and the implicit
  obligation of rule 4. No other fields; no free-form policy text.

  ### 2. What an override may NOT be
  An entry is a divergence of ONE existing upstream-owned file. It is NOT a place for new normative
  text, a parallel rule, a local lifecycle stage, or a whole-directory exemption. A divergence that
  cannot be expressed as one path with one rationale is not an override — it is either a proposal
  upstream (the contribution policy) or a project-realm artifact of the project's own.

  ### 3. Registered vs unregistered divergence
  On update (release contract rule 8) a diverged upstream-owned file with a ledger entry is
  PRESERVED and re-checked; one WITHOUT an entry is a CONFLICT, reported and never auto-resolved.
  The drift check is REPORT-ONLY and rides EXISTING surfaces by symbol — the ledger section is read
  by the yitc-ops concern reader (`bin/lib/init.py#_load_concern_registry` + the SPEC-0128
  registry-driven `_sweep_ops_carrier` for shape and declare-or-waive), and its report rides the
  update path's divergence report and the nightly/conformance sweep that already carries the
  SPEC-0122 R6 adoption-completeness report (`bin/lib/nightly.py#_check_adoption_completeness`). A
  standalone ledger parser or a second report path is FORBIDDEN (CHARTER §P1/§P5); it adds no land
  gate. It names, per entry: the path, the entry's status, whether the pinned release now carries
  the change, and whether the review trigger has fired.

  ### 4. Delete-on-merge, expiry, forwarding
  When the pinned release carries the divergence (the upstream fix landed and the project re-pinned),
  the entry MUST be deleted and the local edit dropped — the drift check reports the entry as
  REDUNDANT until it is. A `temporary-patch` entry MUST become `forwarded` (a proposal filed through
  the contribution policy) or `accepted-exception` by its review trigger; `not-forwarded` is a
  recorded decision with its own review trigger, never a default. An entry whose trigger fired and
  was not re-reviewed is reported as OVERDUE.

  ### 5. No shadow core — the ledger is visible, bounded, converging
  The ledger's purpose is to keep local overrides SMALL, EXPLICIT, and VISIBLY diverging from the
  pinned core so the pin stays a pin. It is never read by the kernel as methodology truth; it is a
  consumer-owned record the update and drift checks read to report. Growth of the ledger is itself a
  report-only signal at the project's review cadence.

  ## Parameters

  None consumed. The closed `upstream_intent` vocabulary is this spec's rule; review triggers are
  per-entry values.

  ## Rationale

  The highest-leverage risk of a pin-based distribution is internal: a project quietly accumulates
  its own quasi-methodology through untracked local edits and the "pin, not fork" claim breaks before
  any outsider exists. The concept consult checked the ledger for scope creep and cleared it: update
  conflict semantics need a durable consumer-owned record. Prior-art: Debian quilt + DEP-3
  (`Forwarded` / `Applied-Upstream` machine-readable headers, delete-on-merge, the
  `patch-not-forwarded-upstream` lint); Copier/Cruft `update` + skip-list for the merge shape.
  Extends SPEC-0093 (one carrier, one section per concern) and SPEC-0122 R2 (fix upstream, then
  re-pin) rather than adding a new store.

  ## Verification

  - **VP1 (entry shape):** an entry missing any required field, or carrying an `upstream_intent`
    outside the closed vocabulary, is reported as MALFORMED by the drift check (state-check).
  - **VP2 (registered survives, unregistered conflicts):** on an update N→N+1 a path with an entry is
    preserved and re-checked; a diverged path without one is reported as a conflict and left
    unresolved (differential — the same edit with and without its entry).
  - **VP3 (delete-on-merge):** after re-pinning to a release that carries the divergence, the entry
    is reported REDUNDANT until deleted; deleting it clears the report.
  - **VP4 (review trigger):** an entry whose trigger date passed (or whose named artifact closed) is
    reported OVERDUE; re-recording the trigger clears it.
  - **VP5 (no new store/gate):** the ledger is a section of the existing ops carrier and the drift
    check rides the existing report-only conformance surface — no new file, parser, or land gate
    (grep + the SPEC-0128 concern registry row).

