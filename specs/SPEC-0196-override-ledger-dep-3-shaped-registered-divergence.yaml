id: SPEC-0196
title: Override ledger — DEP-3-shaped registered divergence from an upstream-owned
  file, drift check, delete-on-merge
status: active
created_at: 2026-09-04 02:43:50+00:00
travels: null
consumed: false
extension: null
implements:
- bin/lib/init.py#override_entry_errors
