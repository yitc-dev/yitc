                               # activation owner (that is `activation_owner_task` above). Work-first
                               # : the authoring task `T-XXXX`. Plan-born (`plan accept`): the
                               # PLAN slug (so the plan's corpus + finalization gate keep seeing it — P5).
                               # NOT cites (cites is informational-only).
concern: # SPEC-0128 rule 1 — the ONE authoritative declaration of THE OVERRIDE
                               # LEDGER (rule 1 above). Rule 2 GENERATES the born yitc-ops.yaml stanza
                               # + the registry row + the declare-or-waive sweep from THIS block at
                               # `graph build`; there is deliberately no second registry, no standalone
                               # ledger parser and no second report path (rule 3 / CHARTER §P1 F1+F2).
  section: overrides
  born_order: 230 # LAST top-level section, after verify_policy (220). Appended rather
                               # than slotted: the born template's comment ATTRIBUTION is positional,
                               # so inserting between existing sections re-parents their citations.
  spec: SPEC-0196
  declare_key: entries # the ledger IS the list of entries — the section's declaration
  declare_type: list
  presence_policy: opt-in # a project with no local divergence carries no section, and that is
                               # the CORRECT and commonest state. Absence adopts nothing; only the
                               # SHAPE of what IS present is checked (the `extensions` / `reads`
                               # precedent). NOT declare-or-waive: there is nothing to waive when
                               # the honest answer is "we diverge from nothing".
  update_policy: init re-seed
  waiver_policy: loose
  shape_hook: override_ledger_shape # the KERNEL-OWNED per-entry validator carrying rule 1's
                               # required field set AND the CLOSED `upstream_intent` vocabulary
                               # (`bin/lib/init.py#_hook_override_ledger`). It is the SINGLE entry-shape
                               # judgement: the report-only drift check (rule 3) calls the SAME
                               # function for its MALFORMED finding, so the init sweep and the drift
                               # report can never disagree about what a well-formed entry is.
  born: |
    overrides:
      # SPEC-0196 — THE OVERRIDE LEDGER: the ONLY sanctioned form of local divergence from an
      # upstream-owned file of the pinned release (SPEC-0195 rule 2). Born EMPTY, which is the
      # honest default: a fresh project diverges from nothing. Add an entry ONLY when this project
      # must run a local edit of an upstream-owned file before upstream carries it.
      #
      # Each entry carries EXACTLY these four fields (rule 1) — no others, no free-form policy text:
      # path: the upstream-owned file diverged from
      # rationale: one plain sentence — why this project needs the divergence now
      # upstream_intent: temporary-patch | forwarded | accepted-exception | not-forwarded
      # (a CLOSED vocabulary; `not-forwarded` is a recorded decision, never a default)
      # review_trigger: an ISO date (YYYY-MM-DD) OR a named artifact whose close re-opens the entry
      #
      # DELETE-ON-MERGE (rule 4): the moment the pinned release carries the divergence, delete the
      # entry AND drop the local edit — the drift check reports the entry REDUNDANT until you do.
      # The check is REPORT-ONLY and adds no land gate; it rides `update`'s divergence report and the
      # nightly sweep. An UNREGISTERED edit of an upstream-owned file is a CONFLICT on update and is
      # never resolved silently in either direction (rule 3).
      entries: []
binding:
