  \ to mention it. Measured 2026-08-16 across all nine v2 consumers (<project> X-0961):\n\
  \    `consumer-suite-parallelization` is live in exactly TWO projects, and they\
  \ are the two named in\n    its own `sourced_from` — seven of nine never met it.\
  \ The sharpest case, and the one this line\n    addresses, is a practice built PARTLY\
  \ FROM A PROJECT'S OWN EVIDENCE that never returned to that\n    project (<project>\
  \ X-0956).\n    **THE CHOSEN FORM, and the four REJECTED — recorded here so a later\
  \ reader sees the fork was\n    decided, not defaulted.** CHOSEN: match on `sourced_from`\
  \ — narrow, mechanical, needing no new\n    carrier, since that field is already\
  \ authored and already indexed. REJECTED: (i) making patterns\n    declare-or-waive\
  \ CATALOG members like specs — it would oblige all nine projects to answer for\n\
  \    every pattern: process for its own sake, and exactly the blanket obligation\
  \ X-0946 argues\n    against; (ii) adding a machine-readable trigger key to all\
  \ 64 patterns — wider reach, but a NEW\n    carrier plus authoring across 64 files,\
  \ so it is DEFERRED to its own card rather than abandoned;\n    (iii) matching on\
  \ the existing `applies_to` field — 59 of 64 patterns carry it, but its values\n\
  \    are FREE PROSE, not machine-matchable predicates; (iv) a bare count of uncited\
  \ patterns —\n    reaches everything and says nothing actionable. Doing NOTHING\
  \ is refuted by the measurement.\n    **NO FLEET-WIDE THRESHOLD IS DERIVED FROM\
  \ THAT TABLE — the load-bearing bound.** The\n    nine-project measurement is evidence\
  \ of a DELIVERY gap, never a target shape. This line reports\n    that a pattern\
  \ built from a project's own evidence went uncited BY THAT PROJECT; it makes NO\n\
  \    claim that adopting it is right. Zero `subject_globs`, or one monolithic layer,\
  \ can be the\n    correct answer for a young or genuinely coupled project, and no\
  \ surface here may say otherwise —\n    that is the decreed-number failure CHARTER\
  \ §Principle 2 names, and the REPORTER raised it\n    against their own ask before\
  \ we did.\n    **SURFACING IS NOT PRESCRIBING.** It names no remedy, ranks nothing,\
  \ selects nothing; adopting a\n    pattern stays the project's own call — the boundary\
  \ rule 21 already draws for plans.\n    **HONEST REACH, stated so the line is never\
  \ over-read:** 8 of 64 patterns name a project in\n    `sourced_from` (<project>\
  \ 4, <project> 4, <project> 1, <project> 1, <project> 1). The other\n    56 are\
  \ NOT covered.\n    **FAIL-SOFT, like every sibling:** a missing/unreadable patterns\
  \ dir folds to a clean zero\n    rather than raising, so a repo with no catalog\
  \ owes nothing and history is never retro-charged.\n    Citation detection matches\
  \ the pattern SLUG and therefore false-NEGATIVES on a prose-only\n    citation —\
  \ chosen deliberately over a false POSITIVE, since a wrong nag teaches the reader\
  \ to\n    ignore the line. Unit tests: the fold REPORTS an uncited own-evidence\
  \ pattern; the SAME pattern\n    once cited prints NOTHING (the differential a fold\
  \ that always reported would fail); a pattern\n    sourced from ANOTHER project\
  \ is never reported (no cross-project leakage); a missing dir yields\n    a clean\
  \ zero without raising.\n\n### Rule 20 — Remote-lag (the declared offsite copy has\
  \ fallen behind) — / X-0932\n    **SUBJECT.** How far a project's DECLARED offsite\
  \ copy has fallen behind its integration branch.\n    A collaborator (<collaborator>,\
  \ <project>, X-0932) asked for `land` to PUSH to the declared remote \"so a\n  \
  \  project's offsite copy cannot silently fall behind main\". The request's own\
  \ purpose clause names\n    the harm — SILENT lag — and this rule removes the silence\
  \ WITHOUT giving `land` a network side\n    effect. `cmd_land` is not touched by\
  \ this rule at all.\n    **WHY A SIGNAL AND NOT A PUSH (the rejected direction,\
  \ named — CHARTER §P1 F3/F4).** A push is a\n    substantive OUTBOUND EXTERNAL MUTATION\
  \ (SPEC-0116). Making one an unconditional side effect of\n    every land would\
  \ change what `land` IS: it would add the kernel's first network write to the\n\
  \    integration path, and a new mid-land failure class (a push that fails halfway).\
  \ It also cannot\n    satisfy its own purpose — because a push must never fail a\
  \ land that otherwise succeeded, a\n    failed push must be swallowed, and a swallowed\
  \ push RECREATES the exact harm reported (an\n    offsite copy silently behind)\
  \ while appearing to handle it. A count cannot fail silently. A\n    separate push\
  \ VERB was also rejected: `git push` already is that verb, and wrapping it removes\n\
  \    nothing and drags in the credentials surface the request put out of scope.\
  \ Neither rejection is\n    permanent — a lag count that turns out to be routinely\
  \ acted on by hand is the real incident\n    that would justify an operator-invoked\
  \ push verb later, properly capturable under SPEC-0116.\n    **OPT-IN THROUGH THE\
  \ EXISTING DECLARATION — no new carrier.** The subject is SPEC-0163's\n    `remote_sync:`\
  \ concern (`remote:` + `pusher:` + `ci:`, declare-or-waive). A project that declares\n\
  \    nothing, or WAIVES, contributes NOTHING and behaves exactly as before this\
  \ rule. No new config\n    key, no new section, no new stance to take.\n    **LOCAL\
  \ READ ONLY — NO NETWORK, BY CONSTRUCTION.** The baseline is the LOCAL remote-tracking\
  \ ref;\n    the fold never runs `fetch` / `ls-remote` / `push` / `pull` (a declared\
  \ forbidden set, asserted\n    by test rather than promised in prose). Three grounds:\
  \ SPEC-0163 rule 3 holds that the kernel\n    checks the STANCE and \"never the\
  \ remote's reachability\" — scoped to the init sweep, but its\n    INTENT reaches\
  \ here and is honoured rather than routed around (CHARTER §P7); it makes \"land\
  \ is\n    never contingent on the remote\" STRUCTURAL rather than a matter of remembering\
  \ every error path;\n    and it costs nothing at two hot seams.\n    **WHY THE LOCAL\
  \ READ IS HONEST — AND THE ONE CONDITION IT RESTS ON (<project> X-1094).**\n   \
  \ `git push` updates the tracking ref ONLY when it names a CONFIGURED REMOTE; a\
  \ push BY URL updates\n    the offsite copy and no local ref at all. Since `remote_sync.remote`\
  \ may itself BE a URL, the\n    baseline is EXACT for the single declared `pusher:`\
  \ PROVIDED that pusher pushes by remote NAME —\n    which is why the rendered remedy\
  \ prints the RESOLVED CONFIGURED NAME rather than the declared\n    string. That\
  \ condition is not decorative: while the line interpolated the declared value, a\n\
  \    URL-declaring project that followed this view's OWN advice pushed successfully\
  \ and the count did\n    not move, so the remedy could not clear the signal that\
  \ printed it (measured, <project>\n    2026-08-22). The motivating failure — a pusher\
  \ that STOPS (<project>'s v1\n    auto-pusher died at quiesce, SPEC-0163 rationale)\
  \ — leaves the ref frozen while `main`\n    advances, so the count climbs at every\
  \ seam. The residual imprecision runs in ONE direction only:\n    a third party\
  \ pushing elsewhere leaves our ref behind, so the count may OVER-report. It can\
  \ never\n    under-report to a false zero from staleness alone, so the view cannot\
  \ go SILENT on real lag. The\n    line states this bound rather than presenting\
  \ the reading as more than it is.\n    **UNFLOORED (rule 3 applied).** An offsite\
  \ copy ONE commit behind is already the state this makes\n    visible, and the failure\
  \ mode is a count growing unwatched — a floor would re-hide precisely the\n    early\
  \ reading that is cheapest to act on.\n    **THE DEGRADES PRINT; ONLY A REAL OPT-OUT\
  \ IS SILENT.** `not-declared` (absent carrier / no\n    section / waived / no `remote:`)\
  \ is suppressed. But an UNREADABLE carrier, a MALFORMED\n    declaration, a declared\
  \ remote that is NOT CONFIGURED, and a MISSING tracking ref each get their\n   \
  \ OWN line — a project that MEANT to declare must never be silently read as having\
  \ declared\n    nothing, and \"cannot compute the lag\" is not the same fact as\
  \ \"in sync\". This is the rule-23\n    live-revision adapter's named-degrade discipline,\
  \ and it is the false-zero this view must never\n    have.\n    It rides rules 2/3/5\
  \ verbatim — the SAME seams (session-start / `debt` re-fold)\n    from the ONE host\
  \ residue, SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a gate: no verb gains a\n \
  \   refusal on account of this row and no exit code moves. NO new store / event\
  \ type / verb / env\n    knob / seam / config key — one more OPTIONAL injected collaborator\
  \ over a declaration that\n    already exists (P1 F1/F2). A repo declaring no remote\
  \ ⇒ suppressed, so nothing is retro-charged.\n\n23. **DEAD LANDS — the land that\
  \ died before its own terminal signal (<project> X-0976).**\n    An OPTIONAL injected\
  \ report-only view over the BRANCH FRONTIER joined to the journal\n    (`debt.dead_lands`),\
  \ wired at the ONE shared host residue like every sibling and riding all\n    seams\
  \ (session-start / the `debt` re-fold).\n    **SUBJECT.** A `land` killed between\
  \ its FIRST COMMIT and its FIRST EVENT. This is the one\n    failure every existing\
  \ surface is blind to AT ONCE, and the blindness is structural rather than\n   \
  \ an oversight: they all key off rows such a land never wrote. The `LAND:` terminal-status\
  \ token\n    is stdout of a process that is gone. The repeated-abort backstop counts\
  \ `land_completed{abort}`\n    ROWS. Rules 12/18 fold dispatches and worker halts;\
  \ rules 4/21 fold followups and plans. So the\n    ONE trace a dead land leaves\
  \ is a GIT COMMIT — `land` step-1's bookkeeping fold — and this rule\n    is the\
  \ only reader that looks at it.\n    **THE MEASUREMENT (kernel, 2026-08-18; the\
  \ consumer half is <project> X-0976).** `land` ran on\n    `work/cross-triage-round-2`\
  \ at, committed its step-1 bookkeeping\n    (5fe2f328d) and died before update-from-main\
  \ / verify / ff. NO `land_completed` row exists in\n    main's journal, the branch's\
  \ own journal, or the still-present worktree's — not even\n    `status=abort`. Three\
  \ filed cards sat stranded and INVISIBLE on\n    main for ~16 hours, and were found\
  \ only because an unrelated `task file` overlap advisory\n    happened to name the\
  \ branch. In the consumer half, two detached lands had aborted and the\n    controller\
  \ learned of it only when the OWNER asked why nothing was running — the box at loadavg\n\
  \    11 with zero building workers for ~20 minutes. Both causes were trivial; the\
  \ cost was entirely\n    in NOT KNOWING.\n    **THE PREDICATE — two conditions,\
  \ BOTH necessary.** A branch reports iff (1) it is NOT merged\n    into main AND\
  \ its tip subject is the land step-1 fold marker FOR THAT SAME BRANCH\n    (`land:\
  \ bookkeeping (<branch>)`) — so a land STARTED here; AND (2) NO `land_completed`\
  \ row names\n    that branch at a ts AT OR AFTER the tip's own committerdate — so\
  \ that land never REPORTED.\n    **WHY CONDITION 2 IS HALF THE DESIGN, NOT A REFINEMENT\
  \ — the measured trap.** \"A branch ahead of\n    main with a bookkeeping-only tip\"\
  \ is BY ITSELF a false-positive generator. SIX branches in the\n    kernel repo\
  \ carry that tip and are unmerged; FIVE landed FINE, each carrying a\n    `land_completed{ok}`\
  \ at or just after its tip. They persist only because\n    `_land_bookkeeping_commit`\
  \ AMENDS its commit, leaving the stale PRE-amend object on the\n    local ref while\
  \ main carries the amended one. The tip test ALONE would report 6 and be WRONG on\n\
  \    5. A view that flags every unlanded branch does not satisfy this rule — it\
  \ is a noise generator,\n    and noise buries the echo it rides (the SPEC-0149 39-line\
  \ trial disproof, paid for once already).\n    **AT OR AFTER THE TIP, never merely\
  \ \"any row for this branch\".** A branch may have landed ok once\n    and had a\
  \ LATER land die on it; anchoring to the tip's OWN timestamp is what lets the newest\
  \ land\n    be judged on its own evidence instead of being excused by an ancestor's\
  \ success.\n    **AN ABORT IS NOT HERE — it REPORTED.** A `land_completed{abort}`\
  \ suppresses exactly as an `ok`\n    does. This rule is for SILENCE, not for failure:\
  \ the repeated-abort backstop already owns the\n    abort class, and duplicating\
  \ it here would bury the row that has no other home.\n    **THE ROW SET IS THE UNIONED\
  \ ONE — a correctness condition, not a wiring detail.** `land` runs\n    from main\
  \ and appends to MAIN's journal, but a row can also sit in a branch's own journal\
  \ or a\n    live worktree's; a local-only read would report a land that DID report.\
  \ The view binds the SAME\n    unioned reader rule 18 uses (local checkout + MAIN\
  \ + every live worktree), narrowed BY TYPE and\n    never by AGE — a dead land must\
  \ not age out of its own detection. Verified across all three loci\n    on the live\
  \ incident before shipping: 0 rows in each.\n    **UNCERTAINTY DIRECTION — deliberately\
  \ the OPPOSITE of rule 18, and the difference is the\n    SUBJECT, not a change\
  \ of posture** (`lessons/fail-closed-belongs-to-the-reader-not-the-parser`:\n  \
  \  the missing-value judgement belongs to the use site). Rule 18 fails closed toward\
  \ VISIBLE because\n    its subject is a decision still owed. THIS subject is \"\
  nothing was reported at all\", so a\n    terminal row that EXISTS but whose ts will\
  \ not parse is already not that class and SUPPRESSES.\n    Every OTHER uncertainty\
  \ — an unreadable frontier reader, an unreadable journal reader — folds the\n  \
  \  WHOLE view to a clean zero rather than a partial guess (rule 12's report-only\
  \ posture, verbatim).\n    **COLLABORATOR CRITICALITY — two classes, never conflated.**\
  \ The frontier reader and the row\n    reader ARE the predicate: either raising\
  \ folds to zero. The worktree-path lookup is REMEDY\n    CONTEXT ONLY, is never\
  \ consulted by the predicate, and is guarded PER BRANCH — a raise or a None\n  \
  \  yields a row with no worktree path, never a suppressed row. A dead land whose\
  \ worktree was\n    already removed is still a dead land, and a cosmetic lookup\
  \ failure must never silence the\n    incident this rule exists for.\n    **THE\
  \ AGE FLOOR (rule 3 applied as an AGE floor, never a COUNT floor) — and the retraction\
  \ that\n    earned it.** This rule was DRAFTED unfloored, on the reasoning that\
  \ a dead land is debt from its\n    first minute. That reasoning was WRONG, and\
  \ the card's OWN AC2 live probe is what refuted it:\n    between land step-1's bookkeeping\
  \ commit and its terminal row, a HEALTHY IN-FLIGHT land is\n    byte-for-byte INDISTINGUISHABLE\
  \ from a dead one — same marker tip, same absent row. The first\n    live run named\
  \ 1 branch; a run minutes later, with four sibling lanes mid-`land`, named 5 — FOUR\n\
  \    of them healthy lands still verifying. Nagging a controller about workers that\
  \ are working is\n    how a report-only line teaches its reader to ignore it, which\
  \ would cost this rule the very\n    signal it exists to carry. The retraction is\
  \ recorded rather than quietly edited because the\n    unfloored claim was ACTIVE\
  \ spec text (§Principle 7).\n    So a candidate younger than the floor is SUPPRESSED\
  \ — an AGE floor, so the COUNT is never\n    hidden and only YOUTH suppresses. **WHY\
  \ 90 MINUTES — measured, not decreed:** over the 4365\n    `land_completed` rows\
  \ carrying timings in the kernel journal, the longest healthy land (verify +\n \
  \   admission wait) ran 38.7 min and p95 was 8.0 min, so 90 exceeds the observed\
  \ maximum by 2.3x. A\n    merely SLOW land — a long verify, a SPEC-0132 admission\
  \ wait, a retry — can never read as dead,\n    while the originating incident (20\
  \ HOURS silent) surfaces with an enormous margin; the measured\n    separation is\
  \ 20h against minutes, not a marginal call. The shape AND the value are\n    DELIBERATELY\
  \ rule 12's (`_debt_dispatch_monitor_floor_minutes`), reused rather than newly\n\
  \    decreed, and configurable by the same env-knob convention\n    (`YITC_DEBT_DEAD_LAND_FLOOR_MINUTES`;\
  \ non-positive disables). A candidate whose TIP DATE will\n    not parse cannot\
  \ be aged, so the floor cannot apply to it and it is KEPT — condition 2 has\n  \
  \  already established that no terminal row exists, and an unparseable git committerdate\
  \ is a\n    corruption worth a line, not a reason to go quiet.\n    **THIS IS THE\
  \ P8 CASE MADE AGAINST THIS RULE ITSELF.** No unit test written from the plan would\n\
  \    have produced that input, because the plan did not know the state existed;\
  \ only running the\n    shipped surface against the live repo did. It is the concrete\
  \ argument for CHARTER §Principle 8\n    demanding a live trigger for infra-class\
  \ closure rather than a direct-call test, and the\n    tripwire that now holds it\
  \ (an in-flight candidate is silent, the aged one speaks, and disabling\n    the\
  \ floor makes the fresh one fire) is in the rule's suite.\n    **WHAT THIS IS NOT\
  \ — the fence, and the REJECTED alternative named (CHARTER §6 named retirement\n\
  \    (d)).** The rejected design was (a) `land` writing an IN-FLIGHT MARKER at start\
  \ that a later\n    sweep finds unresolved. It is refused on two independent grounds.\
  \ First, a marker is only useful\n    if something later ARMS on it and judges it\
  \ stale — that is the liveness-arming FSM §6 forbids by\n    name, and the external-auditor\
  \ placement consult for rule 18\n    (`decisions/halted-worker-surface-placement-audit-adhoc.yaml`)\
  \ already REJECTED extending watcher\n    machinery for this exact reason. Second,\
  \ it could not see the incident anyway: the failure class\n    is a process dying\
  \ at an ARBITRARY point, including before its own marker write. This rule needs\n\
  \    no writer because the state already exists and is durable — the git ref IS\
  \ the marker `land`\n    already wrote, and the journal IS the record of whether\
  \ it reported (P1 F2: a view, not a new\n    entity). So it stores NO queue state,\
  \ arms NO FSM, registers NO watcher, and STARTS NOTHING; it\n    NAMES a branch\
  \ and points at the EXISTING idempotent `worktree recover-land`, which a human runs.\n\
  \    **AND IT NAMES THE FORM THAT ACCEPTS THAT BRANCH.** Pointing at the verb is\
  \ not enough:\n    this view folds the whole frontier, so it surfaces `work/<slug>`\
  \ branches as readily as\n    `task/T-XXXX` ones, and the verb takes `--task` OR\
  \ `--work` — a line that named a branch and then\n    an invocation refusing it\
  \ would walk every reader into a dead end at the exact seam they reached\n    because\
  \ something was already wrong. So the remedy is RENDERED PER BRANCH from its namespace\n\
  \    (`debt.dead_land_remedy`, the ONE renderer both this rule's `next:` and the\
  \ session-start\n    echo consume, so the two cannot name different remedies for\
  \ one branch). A branch\n    OUTSIDE `task/`+`work/` gets a read-only `git log`\
  \ diagnostic instead of a verb form — never a\n    bare command the required flag\
  \ group would refuse. This adds NO rule and changes NO posture: it is\n    what\
  \ \"points at the remedy\" already claimed to mean, made true per namespace.\n \
  \   It rides rules 2/3/5 verbatim — SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a\
  \ gate: no verb gains a\n    refusal and no exit code moves. NO STORE, NO EVENT\
  \ TYPE, NO VERB, NO SEAM, NO CONFIG KEY —\n    ONE env knob, `YITC_DEBT_DEAD_LAND_FLOOR_MINUTES`\
  \ (`cli._debt_dead_land_floor_minutes`), the\n    AGE floor this rule documents\
  \ above and registers below.\n    A repo whose every started land left a terminal\
  \ row ⇒ suppressed, so history is never\n    retro-charged, and a row drops by itself\
  \ the moment a terminal row lands for that branch.\n\n24. **WORK BRANCHES AHEAD\
  \ OF MAIN — the one fact that separates a benign stale branch from a serious\n \
  \   one (<project> X-1001, corrected by X-1003).**\n    An OPTIONAL injected report-only\
  \ view over the git BRANCH FRONTIER (`debt.ahead_work_branches`),\n    wired at\
  \ the ONE shared host residue like every sibling and riding all seams (session-start\
  \ / the `debt` re-fold).\n    **SUBJECT.** A `task/*` or `work/*` branch carrying\
  \ commits `main` does not have. Being AHEAD of\n    main is the single fact that\
  \ tells a harmless leftover apart from stranded work, and it was\n    reported by\
  \ NOTHING. The blindness is structural in each existing surface rather than an\n\
  \    oversight: the dispatch-status census counts live WORKTREES, not branches;\
  \ the rule-2\n    not-adopted view walks main→live, the INVERSE leg, so a branch\
  \ that never reached main is\n    invisible to it BY CONSTRUCTION; and `worktree\
  \ sweep` removes the desk copy while leaving the\n    branch, saying nothing at\
  \ any seam. Rule 23 names branches, but only those whose TIP is the land\n    step-1\
  \ marker.\n    **THE MEASUREMENT (kernel).** `git for-each-ref --no-merged main\
  \ refs/heads/`\n    returns 18 branches, every one ahead of main by 1-5 commits.\
  \ Under this rule's bounds FOUR\n    report: `work/bench-base-T0387|T9527|T9542`\
  \ (3 commits each, 56d — an undeclared June benchmark\n    leftover no lifecycle\
  \ owns) and `work/park-bound-evidence-trigger` (1 commit, 25.8h — a chore\n    that\
  \ never landed). Every one of the four carries an ordinary work subject, so rule\
  \ 23's\n    condition 1 rejects them and no other surface looks at all. The consumer\
  \ half is <project>'s\n    X-1001: four abandoned worktrees aged 28-40h on a fleet-shared\
  \ host, found only because a\n    conversation went looking.\n    **THE COUNT IS\
  \ BY SHA, NEVER BY CONTENT — and this rule is written on the CORRECTED ground.**\
  \ In\n    X-1003 the reporter RETRACTED the supporting half of their own X-1001:\
  \ they had read a\n    `git diff main..branch` as absence, which it is not — a change\
  \ that reached main by another\n    commit still shows as a difference — and a line-level\
  \ re-measure found both branches' substance\n    already in main, with only routine\
  \ bookkeeping rows genuinely absent. So this rule must NOT be\n    justified by\
  \ that instance, and it is not: its ground is that the ahead-ness FACT had no\n\
  \    surface, which is exactly why nobody could tell the two cases apart without\
  \ doing it by hand.\n    The view therefore REPORTS the fact as the fact it is and\
  \ judges nothing, and the rendered line\n    states the SHA-not-content bound in\
  \ its own words so no reader can repeat the retracted reading.\n    **THE PREDICATE\
  \ — four bounds, applied in the FOLD.** A branch reports iff (1) its name is in\n\
  \    `AHEAD_BRANCH_NAMESPACES` (`task/`, `work/`) — the two namespaces `worktree\
  \ new` creates and the\n    lifecycle is therefore responsible for landing; AND\
  \ (2) its ahead-count is a positive int; AND\n    (3) it is not rule-23-owned (below);\
  \ AND (4) it is at least `floor_hours` old.\n    **THE COMPLEMENT BOUNDARY, and\
  \ why `ahead == 1` is half of it.** Rule 23 owns branches whose land\n    STARTED\
  \ and never reported; this rule owns branches where a land never started at all.\
  \ The two\n    are partitioned by rule 23's OWN tip predicate (`_dead_land_tip_is_land_marker`,\
  \ reused, never\n    re-derived) under one conjunct: a branch is dropped here iff\
  \ `ahead == 1` AND its tip is that\n    marker. The bound is LOAD-BEARING and was\
  \ added at audit-pre pass 1 on a high finding. An\n    unbounded tip test would\
  \ drop a branch whose TIP merely looks like bookkeeping while EARLIER\n    commits\
  \ of real work are still missing from main — and rule 23 does not catch that branch\n\
  \    either once its land REPORTED, since a `land_completed{abort}` row suppresses\
  \ it there. The\n    blind spot this rule exists to close would then be restored\
  \ inside the very predicate meant to\n    divide the two views. Bounded to `ahead\
  \ == 1` the drop covers exactly the class it was written\n    for: the `_land_bookkeeping_commit`\
  \ AMEND residue is by construction a SINGLE commit —\n    the branch's work reached\
  \ main by fast-forward and differs by no SHA, leaving only the stale\n    pre-amend\
  \ object — which is why all four such branches on the live frontier measure ahead=1\n\
  \    (task). A marker-tipped branch at ahead>1 IS reported.\n    **THE AGE FLOOR\
  \ (rule 3 applied as an AGE floor, never a COUNT floor).** EVERY healthy in-flight\n\
  \    build has a branch ahead of main — that is what a worktree IS — so youth is\
  \ precisely what must\n    never fire, and this rule is floored from birth rather\
  \ than learning it from a live probe as\n    rule 23 did. **WHY 24 HOURS — measured,\
  \ not decreed:** on the live frontier at design time two\n    genuinely live lanes\
  \ sat at 15.7h and 17.5h (`work/bump-11323`, `task/-recovered`)\n    against the\
  \ one genuinely abandoned branch at 25.8h, and the originating incident measured\n\
  \    28-40h — so the floor sits above every live instance and below every reported\
  \ one. Shape and\n    knob convention are rules 12/23's, reused rather than newly\
  \ decreed\n    (`YITC_DEBT_AHEAD_BRANCH_FLOOR_HOURS`; non-positive disables). A\
  \ candidate whose TIP DATE will\n    not parse cannot be aged, so the floor cannot\
  \ apply and it is KEPT — ahead-ness is already\n    established, and an unparseable\
  \ committerdate is a corruption worth a line, not a reason to go\n    quiet.\n \
  \   **UNCERTAINTY DIRECTION — silent, never wrong.** The frontier reader IS the\
  \ predicate: a raise\n    or a non-list folds the WHOLE view to a clean zero rather\
  \ than a partial guess (rule 12's\n    report-only posture, verbatim — a view must\
  \ never break the seam it rides). `%(ahead-behind:)`\n    needs git >= 2.41; on\
  \ an older git the field returns EMPTY, bound (2) drops the branch, and the\n  \
  \  view degrades to SILENT rather than to a wrong count, which is the right direction\
  \ for a\n    report-only surface.\n    **THE READ IS BROAD, THE TRIGGER IS NARROW**\
  \ (`lessons/scope-the-trigger-not-the-view`). ONE\n    `for-each-ref` covers every\
  \ branch — breadth is what makes the sweep possible — and the three\n    bounds\
  \ that decide what INTERRUPTS live in the FOLD, never smuggled into the reader.\
  \ Cost is one\n    subprocess per echo and NO per-branch call: a branch is `--no-merged\
  \ main` iff\n    `rev-list --count main..<branch>` > 0, so the frontier call already\
  \ yields exactly the\n    ahead-of-main set, and `%(ahead-behind:main)` carries\
  \ the count itself.\n    **SURFACING IS NOT PICKING — the rule-21 fence, mirrored.**\
  \ The line NAMES branches and nothing\n    more: no candidate, no ranking, no selection,\
  \ no next-action verb, and its only pointer is a\n    read-only `git log --oneline\
  \ main..<branch>`. Merging or deleting a branch stays a human act.\n    A branch\
  \ NOT ahead of main is NOT reported — reporting harmless leftovers is the\n    alarm-on-normal-behaviour\
  \ shape that teaches a reader to stop reading the echo, which costs more\n    than\
  \ the blind spot this rule closes. It rides rules 2/3/5 verbatim — SUPPRESSED-WHEN-CLEAN,\n\
  \    REPORT-ONLY, never a gate: no verb gains a refusal and no exit code moves.\
  \ NO new store, NO new\n    state, NO new status field, NO new verb, NO new event\
  \ type, NO new seam. A repo whose every work\n    branch is merged ⇒ suppressed,\
  \ so history is never retro-charged, and a row drops by itself the\n    moment its\
  \ branch merges or is deleted.\n\n25. **CONCURRENT SESSION HOLDS — the repo renders\
  \ as single-actor while it is not (<project> X-1025).**\n    An OPTIONAL injected\
  \ report-only view over the LIVE WORKTREE LIST + the session stamps\n    (`debt.concurrent_session_holds`),\
  \ rendered through the ONE shared host residue like every\n    sibling but riding\
  \ TWO of the three debt seams — SESSION-START and the on-demand `debt`\n    re-fold,\
  \ NOT the land tail (§Seam set below).\n    **SUBJECT.** A live worktree in THIS\
  \ repo stamped by a session OTHER than the reading one.\n    **WHY NOTHING ELSE\
  \ SHOWS IT, and the one line that looks like it does.** A claim\n    (`ready ->\
  \ in-progress`) is written INSIDE the claiming worktree and reaches `main` only\
  \ through\n    `land` ( option B). So `session._session_build_dispatch`'s \"N task(s)\
  \ in-progress in other\n    sessions\" — which folds `tasks/*.yaml` STATUS on the\
  \ reading checkout — is silent for exactly\n    the holds that matter, and `task\
  \ list` reports the held card as `ready`. The only surface that\n    does reveal\
  \ a second actor is `journal query --dispatch-status`, a per-task liveness read\
  \ a\n    controller has to think to run. Rule 24 names branches AHEAD of main, which\
  \ is a different fact\n    and misses a fresh claim entirely.\n    **THE MEASUREMENT\
  \ (kernel, 2026-08-20/21).** A controller session ran this repo all evening\n  \
  \  beside a second controller and learned of it only BY ACCIDENT — an unfamiliar\
  \ branch name\n    noticed in a `git worktree list` run for another reason. Later\
  \ the same evening it read\n    and as `ready` on main, both already claimed by\
  \ that other session, and was one step\n    from dispatching duplicate workers;\
  \ what stopped it was a hand `git worktree list`. At the time\n    this rule was\
  \ built, this repo's own fold returned 12 distinct foreign stamps holding 12 live\n\
  \    worktrees, while the session-start echo printed 7 debt lines and named none\
  \ of them.\n    **THE PREDICATE — the bounds live in the FOLD.** A row reports iff\
  \ (1) it is a live `task/*` or\n    `work/*` worktree (the main checkout is where\
  \ everyone reads, never a hold); AND (2) its stamp\n    is NOT the reading session's;\
  \ AND (3) its stamp was not positively attributed to a worker the\n    READING controller\
  \ itself dispatched (the attribution paragraph below). Rows are then GROUPED BY\n\
  \    STAMP, and the count is of DISTINCT FOREIGN STAMPS while `worktrees` counts\
  \ what they hold\n    between them. An UNSTAMPED worktree (raw\n    `git worktree\
  \ add`, unreadable stamp) is FOREIGN — fail-closed, `_read_worktree_stamp`'s own\n\
  \    rule — and is deliberately NOT grouped: two unknowns are two unknowns, never\
  \ one holder.\n    **WHAT THE STAMP PROVES, AND WHAT IT DOES NOT — stated in the\
  \ line, not left to the reader\n, AND ITS MEASURED EXCEPTION.** Background workers\
  \ that INHERIT their\n    controller's provider session id SHARE one `session_ref`,\
  \ so such a fleet reads as ONE stamp and\n    own/foreign collapses inside it. A\
  \ DISPATCH-LAUNCHED worker does NOT: `dispatch` assigns a FRESH\n    ref per worker\
  \ (it scrubs the identity carriers deliberately) and records it as `expected` on\
  \ its\n    own `bg_dispatch_launched`, so one controller's dispatched fleet reads\
  \ as N distinct \"other\"\n    stamps. Measured on the kernel : the line read 19\
  \ stamps holding 19 worktrees,\n    at least two of them the READING controller's\
  \ own workers (verified against its\n    own launch records) — and the one genuinely\
  \ foreign holder that night (a neighbouring plan's\n    worker on) was found by\
  \ hand in `git worktree list`, because here it would have been the\n    20th row\
  \ among 19 of the reader's own. The question this view exists to answer — is a DIFFERENT\n\
  \    controller working this repo — was therefore unanswerable from it.\n    **ATTRIBUTION,\
  \ AND IT NEEDS NO NEW STATE.** The launch record already carries both halves: its\n\
  \    ENVELOPE `session_ref` is the LAUNCHING controller and its `data.expected`\
  \ the ref that worker\n    will stamp with. So own-versus-foreign is a FOLD over\
  \ the journal the debt echo already reads —\n    no store, no registry, no new event,\
  \ no new read path (CHARTER §P1 F2: a view, not an entity). A\n    holder positively\
  \ attributed to the reader's own fleet moves to a separate `own_fleet` field and\n\
  \    is NAMED in the line as such; it is EXCLUDED from the count, which keeps meaning\
  \ DISTINCT FOREIGN\n    STAMPS. The line is never SUPPRESSED for own dominance and\
  \ the foreign count is computed\n    independently of it, so a genuinely foreign\
  \ holder stays visible behind any number of own workers.\n    **AND ATTRIBUTION\
  \ FAILS SAFE THE OPPOSITE WAY TO THE REST OF THIS RULE.** Everywhere else here\n\
  \    the generous reading is safe, because over-reporting costs only noise. Attribution\
  \ SILENCES, so a\n    wrong one hides the exact holder this view exists to surface.\
  \ It therefore demands POSITIVE PROOF\n    — a launch record the reader itself emitted\
  \ naming that exact ref — and every uncertainty\n    resolves to FOREIGN and VISIBLE:\
  \ no ref set, an unreadable journal, an unresolvable own identity,\n    an UNSTAMPED\
  \ worktree (`UNKNOWN_HOLDER` is not a ref and can never match a launch record).\
  \ The\n    view therefore still reports \"another session's work is live here\"\
  \ and NEVER an actor count.\n    Scoping the wording to what the stamp actually\
  \ proves is a requirement of this rule, not a\n    nicety: a line that over-claimed\
  \ would be wrong in the direction that matters.\n    **LIVENESS IS ADVISORY, NEVER\
  \ AUTHORITY, AND NEVER ORed WITH PRESENCE.** A worktree's PRESENCE\n    is not proof\
  \ its holder is alive — that conflation caused the double-claim, where a live\n\
  \    hold read as a resumable orphan. Liveness is read the way the existing readers\
  \ read it\n    (`_session_proc_alive`, one probe per DISTINCT stamp, fail-closed\
  \ toward \"not confirmed alive\")\n    and is carried in a field SEPARATE from the\
  \ presence count, three-valued (alive / not-seen /\n    undetermined), per `lessons/a-presence-count-is-not-a-liveness-probe`:\
  \ a boolean that ORs a\n    cheap presence proxy with a real probe takes the proxy's\
  \ answer. The view adopts nothing,\n    re-stamps nothing, cleans nothing up and\
  \ acts on nothing it finds.\n    **WHICH OF THE THREE STATES A HOLDER GETS — the\
  \ probe is told what it can.** The\n    probe matches the launch argv that only\
  \ a DISPATCHED worker carries, and a worker's launch\n    record declares that it\
  \ does. So a holder reads `alive` when the probe finds its process;\n    `not-seen`\
  \ ONLY when the probe does not find it AND a launch record declares that argv for\n\
  \    this exact stamp — the probe could have seen it and did not; and `undetermined`\
  \ in every\n    other case: a holder no such record names (an interactive controller\
  \ never carries the\n    argv), or a journal that cannot be read. Not-found is never\
  \ reported about a holder the probe\n    cannot see by construction. The declaration\
  \ is read in the SAME pass over the launch records\n    the attribution above already\
  \ makes, and — unlike attribution — from ANY launcher's record:\n    it silences\
  \ nothing, it only chooses between two advisory wordings.\n    **UNCERTAINTY DIRECTION\
  \ — silent, never accusing.** The reader IS the predicate: a raise or a\n    non-list\
  \ folds the WHOLE view to a clean zero. And when the READING session's own identity\n\
  \    cannot be resolved, NOTHING can be proved foreign, so the view goes silent\
  \ rather than reporting\n    every holder — the fail-safe direction for a signal\
  \ about someone else\n    (`lessons/a-signal-about-a-reader-fails-safe-the-opposite-way-to-a-gate`).\n\
  \    **SEAM SET — session-start + the `debt` re-fold, and the land tail is WITHHELD\
  \ (rule 21's\n    detached-not-conditioned discipline, reused; moot since retired\
  \ the land-tail seam).** Every sibling view here is a JOURNAL or carrier\n    fold,\
  \ and pins the LAND TAIL's counts to AGREE with the `debt` verb re-folded over the\n\
  \    SAME journal after the land. This view is a CHECKOUT fold — and the land tail\
  \ is precisely the\n    seam that DELETES a checkout (the landing worktree, which\
  \ the post-land re-fold can no longer\n), so the two instruments necessarily read\
  \ different frontiers there. A view that cannot\n    honour a seam's contract is\
  \ WITHHELD from that seam by not injecting the collaborator at all,\n    never conditioned\
  \ into silence inside it (rule 21's rule, verbatim). Its seam set is therefore\n\
  \    the two seams a controller reads BEFORE acting, which is exactly where the\
  \ remedy lives.\n    **CONTROLLER-AUDIENCE-ONLY, rule 12's gate reused verbatim.**\
  \ Injected as None in a dispatched\n    WORKER (`YITC_EXPECTED_SESSION_REF` set):\
  \ a worker inherits its controller's session id, so its\n    own fleet reads as\
  \ its own stamp while every other controller's work reads as a hold it can do\n\
  \    nothing about, and the remedy the line points at — read before you dispatch\
  \ or claim — is a\n    CONTROLLER's.\n    **VISIBLE IS NOT EXCLUSIVE — the fence,\
  \ and it is the whole design.** It rides rules 2/3/5\n    verbatim — SUPPRESSED-WHEN-CLEAN,\
  \ REPORT-ONLY, never a gate: no verb gains a refusal, no exit\n    code moves, no\
  \ event is emitted. It takes NO lock, NO lease, NO owner-election and refuses NO\n\
  \    dispatch; a change that made anything REFUSE because another session is present\
  \ would be a\n    lock, which is a DIFFERENT and unauthorized rule. Concurrent sessions\
  \ are NORMAL (and\n    the reason per-write worktree isolation is mandatory) — this\
  \ makes them VISIBLE. NO new store,\n    NO lease/registry/heartbeat/liveness FSM\
  \ (CHARTER §6 named retirements), NO new state, NO new\n    verb, NO new event type,\
  \ NO new seam. UNFLOORED: one unseen concurrent holder is exactly the\n    case\
  \ that re-litigates a settled decision or duplicates a dispatch. A repo where every\
  \ live\n    worktree carries the reading session's OWN stamp — or is attributed\
  \ to its OWN dispatched fleet\n    — ⇒ suppressed, indistinguishably from an empty\
  \ frontier, and a holder drops by itself the\n    moment its worktree is removed\
  \ by `land`.\n\n27. **WHAT ABORTED LANDS COST, SPLIT BY ABORT CLASS — and the DECAYING/STANDING\
  \ distinction that\n    keeps the number actionable** (<project> X-1036, ARITHMETIC\
  \ CORRECTED by X-1039).\n    SUBJECT: `land_completed` rows with `status: abort`\
  \ inside a trailing 7-day window, priced by the\n    `duration_ms` they already\
  \ carry, grouped by `abort_class`.\n    **THE GAP.** Every other rule here reports\
  \ work that is PENDING — debt not adopted, followups not\n    triaged, plans not\
  \ tracked, branches not landed. NOTHING reported what a project already SPENT on\n\
  \    runs that shipped nothing. The land tail reports a graph cache hit rate; `dispatch-status`\n\
  \    reports worker liveness; the repeated-abort backstop counts abort ROWS without\
  \ ever pricing them.\n    So a project could not discover its own most expensive\
  \ waste, and X-1036 surfaced only because an\n    owner asked a question that made\
  \ someone go looking — the same accidental-discovery shape rules\n    23 and 24\
  \ were each written to end.\n    **PAID-vs-EARLY IS READ FROM A MARKER, NEVER INFERRED\
  \ FROM THE CLASS NAME.** `verify_mode` is\n    written onto the abort payload IFF\
  \ the verify actually ran. Measured on the kernel journal at\n    design time (trailing\
  \ 7 days to, 309 aborts): present on 168/168 rows of the\n    three verify-running\
  \ classes, absent on all 141 others; `duration_ms` present on 2113/2113 abort\n\
  \    rows repo-wide. Pricing by class NAME is refused on own finding that an `abort_class`\
  \ is\n    not a reliable proxy for cost — `rebaseline-unauthorized` splits by `abort_preflight`\
  \ into a cheap\n    pre-verify refusal and an expensive post-verify one under ONE\
  \ name, so a class-name price would\n    average two populations into a number describing\
  \ neither.\n    **AND THE SAME MINUTES ARE RE-PARTITIONED BY PHASE — QUEUE WAIT\
  \ versus verify RUN**.\n    Every figure above prices an abort by its whole-land\
  \ wall, which answers \"what did this cost\"\n    and not \"what was it DOING\"\
  \ — and the two answers point at DIFFERENT remedies. measured\n    this repo's 352\
  \ aborts over 2026-08-18..2026-08-25: the reservation WAIT is the majority of the\n\
  \    cost (3918 of 6178 min) and the actual verify RUN is 1.6% of it (99 min), so\
  \ a reader who took\n    the minutes above for gate cost would build against the\
  \ wrong 1.6%. The fold therefore also\n    folds the land's OWN `journal.LAND_QUEUE_WAIT_TYPES`\
  \ heartbeats — the PRIMARY instrument the\n    SPEC-0132 admission lens uses — folding\
  \ the `waited_s` series inside that row's own\n    `[ts - duration_ms, ts]` span\
  \ as the WAIT, and the remainder of `duration_ms` as the RUN.\n    **THE FOLD IS\
  \ A RESET-AWARE SEGMENT SUM, NOT A PEAK, AND THAT CORRECTION IS.**\n    `waited_s`\
  \ is cumulative WITHIN ONE PARK and restarts at 0 when a displaced land parks again\n\
  \    (`_t0` is re-seeded on every entry to `_acquire_land_reservation`), so a peak\
  \ reported only the\n    land's LONGEST park while the land paid the SUM of all\
  \ of them — low by construction, in the\n    one direction that makes a wait-dominated\
  \ cost read gate-dominated, which is precisely the\n    verdict this split decides.\
  \ `journal.fold_wait_segments` cuts a new park at every DROP and sums\n    the per-park\
  \ peaks; it is NOT a sum across rows, and a span with no reset is ONE segment that\n\
  \    folds to exactly the peak it folded to before, so no single-park row moves.\
  \ Measured over the\n     window (411 abort rows, 2026-08-30) the same rows fold\
  \ to 4774 reservation minutes\n    against the peak fold's 4334 — 440 minutes of\
  \ real waiting that the peak could not.\n    **THE WAIT IS NOT `admission_wait_ms`,\
  \ AND THE CORRECTION IS ** (external RED verdict,\n    `decisions/admission-wait-lens-dissonance-audit-adhoc.yaml`\
  \ finding 1). sourced it from\n    that field, which the admission lens simultaneously\
  \ labelled a `secondary_instrument` carrying\n    \"UNDER-REPORTING... Do not quote\
  \ these figures as admission waits\" — one lens\n    forbidding exactly what the\
  \ other did. The field is not false, it answers about the WRONG QUEUE:\n    `admission_waits`\
  \ is appended only by `_verify_under_admission`, so it measures the SPEC-0132\n\
  \    verify-admission-SLOT queue and never the land-fairness RESERVATION, which\
  \ is where\n    parks queued peers. Measured 2026-08-29: `task/` and `task/` carry\
  \ reservation\n    peaks of 8042s and 2950s with ZERO admission-slot heartbeats\
  \ and `admission_wait_ms: 0`. The\n    cost of the wrong instrument was the whole\
  \ reading: over one 7-day window it reported 2.6 queue\n    minutes against 1283.1\
  \ verify-RUN minutes across 189 of 469 rows, so the split could only ever\n    point\
  \ at the gate; re-sourced, the SAME window reports 7642.9 against 3421.6 across\
  \ 290 rows and\n    the verdict INVERTS to wait-dominated. ATTRIBUTION IS PER-LAND,\
  \ not per `(session_ref, branch)`\n    as the admission lens folds it: one key routinely\
  \ carries several land rows, so a key-wide peak\n    would charge every one of them\
  \ the longest wait any of them paid. This partition is\n    **ORTHOGONAL** to the\
  \ four groups and is added to NONE of\n    them: it re-cuts the same minutes by\
  \ phase, so the never-summed rule above is untouched and\n    there is still no\
  \ headline. **A ROW THAT CANNOT PROVE THE SPLIT CARRIES NONE**, on exactly the\n\
  \    terms `duration_ms` already uses — a row with NO attributable heartbeat inside\
  \ its own span, a\n    row whose `duration_ms` is undetermined, or a wait exceeding\
  \ the wall that contains it. A land\n    that never queued and a land whose queueing\
  \ left no record are different claims, and an absent\n    attribution proves only\
  \ the second. The\n    coverage count travels WITH the minutes everywhere they are\
  \ reported, because a partial split\n    presented as covering every abort is the\
  \ same over-reading the never-zero-fill rule exists to\n    prevent — and coercing\
  \ the absent key to zero is not hypothetical: it already published every\n    abort\
  \ as aborted-before-verify with 0.0 verify hours although 196/352 demonstrably ran\
  \ the\n    suite. Report-only, gating nothing, and deliberately carrying NO threshold\
  \ and no judgement\n    about whether any duration is too long.\n    **AND A SECOND\
  \ QUEUE, REPORTED BESIDE THAT SPLIT AND NEVER MERGED INTO IT**. The\n    paragraph\
  \ above conflates two different waits under one word, and the conflation was\n \
  \   load-bearing: the figure it cites as \"the reservation WAIT\" was folded from\n\
  \    `waiting_for_land_reservation` heartbeats, while the wait this fold's phase\
  \ split attributes is\n    the verify-ADMISSION queue — a different wait, which\
  \ the erratum (2026-08-14) already\n    found to under-report and explicitly forbade\
  \ citing as the queue series.\n    So this rule's own live output read `2.6 min\
  \ was QUEUE WAIT... 1250.8 min was the verify RUN`\n    over 174 aborts: not because\
  \ queueing was cheap, but because the DOMINANT queue was in no\n    summary field\
  \ on any row. The fold therefore also reads `reservation_wait_ms` ( — the wait\n\
  \    for the serialized merge->verify->ff window a peer land holds) and reports\
  \ it as its own\n    phase with its own coverage count, plus a derived `queue_wait_minutes`\
  \ total. **THE TWO ARE KEPT\n    APART** — an admission wait asks for verify slot-pool\
  \ capacity, a reservation wait asks why a PEER\n    is holding the window, so a\
  \ single collapsed number would name neither remedy; the total is safe\n    to offer\
  \ only BECAUSE both components are printed beside it. The reservation wait is also\
  \ NOT a\n    re-slice of the verify wall: it is spent before the merge and before\
  \ step 4, so it is a THIRD\n    phase, not a third of the wall — which is why `_abort_phase_split`'s\
  \ wait/work identity is left\n    exactly as it is and this reading is added alongside\
  \ it. Same never-zero-fill terms throughout: a\n    pre- row has no key and a preflight\
  \ abort carries `null`, both reported as uncovered rather\n    than as zero minutes\
  \ proven; a real `0` (an in-loop abort that took the reservation without\n    waiting)\
  \ is a measurement and is admitted as one. Report-only, gating nothing, no threshold.\n\
  \    **THE GROUPS ARE NEVER SUMMED — the honest-reading requirement, and it is load-bearing.**\n\
  \    gate-caught (paid, the verify FAILED) · inconclusive (paid, concluded nothing)\
  \ · process-refusal\n    (paid a FULL verify, then refused on BOOKKEEPING) · preflight-refused\
  \ (carries a verify marker\n    but the row's OWN `abort_preflight` records that\
  \ it stopped at the step-4a preflight, before the\n    suite and the admission slot,\
  \ so it never paid the full verify) · early (refused\n    before paying one). ONLY\n\
  \    process-refusal is called reclaimable. A high `verify-failed` count is NOT\
  \ waste — it is the gate\n    EARNING ITS KEEP, a real defect caught before it landed\
  \ — and a single headline number summing\n    caught defects together with paperwork\
  \ refusals would present the gate's best work as the\n    project's worst cost,\
  \ pointing a reader at the one thing they must not weaken. No number the fold\n\
  \    returns and no number the line prints crosses a group boundary, so no caller\
  \ can sum them by\n    accident. **A ROW IS BUCKETED BY ITS OWN RECORDED REFUSAL\
  \ POINT, NEVER BY ITS `abort_class`\n    NAME**. Measured on this repo 2026-08-28:\
  \ 25 `rebaseline-unauthorized` rows carrying\n    `abort_preflight` reported 579.1\
  \ min under RECLAIMABLE — \"paid a FULL verify and then refused on\n    BOOKKEEPING\"\
  \ — on 12.9 min (2.2%) of actual `verify_duration_ms`, 0.0 min admission wait. They\n\
  \    refused at the step-4a preflight; the sentence was not true of them, and the\
  \ remedy it\n    prescribes (move the refusal earlier) was already done for that\
  \ arm. So `paid` is\n    read first, the row's own `abort_preflight` second, and\
  \ the class name LAST. The minutes are\n    never dropped: `preflight-refused` reports\
  \ them in full with its own count and trend, because\n    trading an overstatement\
  \ for a disappearance is the same failure pointed the other way. **THE FOLD IS KEYED\
  \ BY THE (CLASS, GROUP) PAIR, never by class alone** — corrected at\n    audit-post\
  \ pass 2, and a correctness bound rather than a refinement. A class can be MIXED:\n\
  \    `rebaseline-unauthorized` splits by `abort_preflight` into a cheap pre-verify\
  \ refusal and an\n    expensive post-verify one under ONE name, which is the very\
  \ finding that made the\n    marker the measurement. Folding such a class into one\
  \ preferred group put its EARLY minutes\n    inside the PAID group's total — for\
  \ a paid non-gate class, the RECLAIMABLE total — so minutes\n    nobody spent on\
  \ bookkeeping would have been reported as reclaimable, breaking this rule from\n\
  \    the inside. Keying by the pair makes every group total the sum of its OWN rows\
  \ by construction.\n    **AND THE KEY IS THE (CLASS, ARM, GROUP) TRIPLE, because\
  \ one class NAME can carry two REFUSALS**\n    (<project> X-1096 — the corrected\
  \ measurement they owed us after their earlier X-1037 was\n    refuted on a false\
  \ premise). `rebaseline-unauthorized` unions the AUTHORIZATION refusal, MOVED to\n\
  \    the step-4a preflight by on 2026-08-09 — which refuses before verify but after\
  \ the land reservation queue,\n    so it is NOT cheap (amended : the 15 authorization-arm\
  \ preflight aborts of 2026-09-06..09-12\n    ran a wall p50 546 s, max 4393 s, of\
  \ which 77% was `waiting_for_land_reservation` wait, 0 s admission,\n    no verify;\
  \ the step-4a preflight runs after `_acquire_land_reservation`) — with the\n   \
  \ WAIVE-COVERAGE refusal, which has moved only in PART: moved its TOKEN-BINDING\
  \ half to that\n    same step-4a preflight (refused off ONE file, taking no admission\
  \ slot), while its COVERAGE half\n    still reads `pinned_bad` and so is reachable\
  \ only after a full pinned run. (Un-amended, this\n    sentence said the waive-coverage\
  \ arm had NOT been moved — true when wrote it, superseded\n, and re-levelled here\
  \ by together with the render that quoted it.) They still\n    differ in **MOVABILITY**,\
  \ which is what makes the union actively misleading rather than merely\n    coarse:\
  \ it prices a refusal we already made cheap together with one that is still only\
  \ partly so,\n    and reports ONE remedy where there are TWO. The (class, GROUP)\
  \ pair does not separate\n    them — BOTH arms sit in the paid group — so the ARM\
  \ is a third key, not a re-reading of the second.\n    **THE ARM IS READ, NEVER\
  \ CAPTURED** — no new payload key, no new event, no change to `land` (the\n    same\
  \ second-reading-of-an-existing-payload discipline as rules 18/19 and as this rule's\
  \ own\n    paid-vs-early marker). `_abort_arm` reads, IN ORDER: ** the three per-refusal\
  \ markers,\n    most-specific first — `inland_reaudit_refusal` ⇒ inland-reaudit;\
  \ `waive_coverage_preflight` ⇒\n    waive-coverage; `entry_authorization` ⇒ authorization**;\
  \ then `abort_preflight` ⇒\n    authorization; the authorization refusal's own invariant\
  \ sentence ⇒ authorization; the\n    waive-coverage refusal's ⇒ waive-coverage;\n\
  \    `failing_assertions`/`rebaseline_bad_token_reasons` ⇒ waive-coverage; otherwise\n\
  \    `unattributed` — counted and priced like any arm, NEVER guessed into one (the\
  \ same direction as\n    UNDETERMINED below).\n    **AMENDED — THE CLASS CARRIES\
  \ THREE REFUSALS, NOT TWO, AND THE MARKER LEG IS WHAT\n    SEPARATES THEM.** The\
  \ union this rule was written against was under-counted: alongside the\n    authorization\
  \ and waive-coverage arms sits MID-LAND RE-AUDIT, which refuses when it\n    cannot\
  \ obtain a verdict (`could-not-run`) or when the SPEC-0204 ladder refuses its one\
  \ bounded\n    pass (`ceiling-refused`). Its remedy is an audit that can RUN, or\
  \ `audit decide` — neither of\n    which is \"earn an audit-post\", so counting\
  \ it as authorization described it wrongly rather than\n    coarsely. MEASURED :\
  \ every `abort_preflight` row in the fold reached the first rule\n    and landed\
  \ in the authorization bucket. The cause was not the reader: each `_die` site already\n\
  \    composed its own discriminator onto `abort_detail` and `_emit_land_abort`'s\
  \ allow-list dropped\n    all three, so the reader had nothing to discriminate on.\
  \ THE READ-NEVER-CAPTURED DISCIPLINE\n    ABOVE IS UNCHANGED in substance — no new\
  \ event, no new vocabulary, and no change to what `land`\n    DECIDES; what adds\
  \ is three additive, present-only, report-only keys carrying markers\n    that already\
  \ existed the last inch onto the row they describe (SPEC-0025 §land_completed).\
  \ The\n    ordered rules below stay VERBATIM as the fall-through, which is what\
  \ keeps every HISTORICAL row\n    — including the 180 tabulated here — reading exactly\
  \ as it did, since none of them can carry a\n    forward-only marker. **THE MESSAGE\
  \ LEG IS LOAD-BEARING AND MEASURED, not a shortcut.** Over the\n    kernel's whole\
  \ journal, 180 rows of this class: 13 preflight + 57 carrying `failing_assertions`\
  \ +\n    46 carrying no structured marker at all are AUTHORIZATION, and 63 carrying\
  \ `failing_assertions`\n    are WAIVE-COVERAGE. The 57 are decisive — the pre- deep\
  \ authorization site appended its own\n    `FAILING ASSERTION(S)` block and so SET\
  \ the very key that otherwise identifies the other arm, so a\n    purely structured\
  \ reader would MIS-BUCKET 57 authorization rows, and a placement-based one\n   \
  \ (preflight-vs-not, which <project>'s own journal happened to support) would mis-bucket\
  \ 103. The\n    message leg is sound for exactly those rows because they are FROZEN:\
  \ REMOVED that site, so\n    no new row can carry the text and no re-wording can\
  \ reach it — and the order is fail-safe for\n    current rows either way, since\
  \ the structured legs alone attribute everything today's code emits,\n    so a future\
  \ re-wording degrades LEGACY attribution only. **RENAMING the recorded class was\n\
  \    weighed and rejected:** eleven readers key on the literal string, and every\
  \ historical row would\n    still need this same reader — strictly more risk for\
  \ an identical outcome.\n    **A SECOND CLASS SPLITS BY ARM, AND IT UNIONS SOMETHING\
  \ DIFFERENT**. `verify-failed` is\n    emitted by ONE refusal over a SHARED failing\
  \ list, and that list is fed by more than the test suite:\n    three CORPUS-INTEGRITY\
  \ guards append to it AFTER the suite — SPEC-0054's decision content-freeze,\n \
  \   SPEC-0005's off-path spec-edit chokepoint, SPEC-0165's card-shape rationale\
  \ — and their inputs are\n    the branch's COMMITTED DELTA, not the code's behaviour.\
  \ So a land that refused purely on BOOKKEEPING\n    was recorded, counted and TRENDED\
  \ under the one label this rule reserves for a caught defect, and\n    the echo\
  \ said of it, verbatim, \"that is the gate EARNING ITS KEEP, a real defect caught\
  \ before it\n    landed\". For those rows that sentence is false. Same remedy as\
  \ above, one level down: `_abort_arm`\n    dispatches PER CLASS to a reader that\
  \ knows THAT class's two refusals — `test-failure` /\n    `corpus-bookkeeping` /\
  \ `mixed` / `unattributed` — and the render scopes the not-waste sentence to\n \
  \   the arm it is true of, naming the arms it is not. **THE KEY IS `failing_assertions`,\
  \ AND THE OBVIOUS\n    STRUCTURED READER IS THE ONE THAT FAILS.** Measured over\
  \ the kernel's whole journal, 185 rows of\n    this class: 173 carry a test assertion\
  \ and a named failing test file; 4 carry an assertion and NO\n    failing test file\
  \ (a pinned-ENGINE driver error, which names no test and IS a real verify failure);\n\
  \    5 carry ONLY guard messages; 3 carry BOTH. The 4 are decisive — a reader keyed\
  \ on\n    `failing_tests == []` would mis-bucket 4 genuine gate-catches as paperwork,\
  \ the same shape as the 57\n    above. `failing_assertions` (present on 185/185)\
  \ works because each guard's message lands in it as a\n    SEPARATE ELEMENT, so\
  \ the reader partitions ELEMENTS: only that can tell a SOLE-guard refusal from a\n\
  \    MIXED one, which a scan of the flattened reason blob can never do. A MIXED\
  \ row gets its OWN arm —\n    splitting one abort's minutes would invent a division\
  \ the row does not record, and putting it in\n    either arm whole would overstate\
  \ that arm. **A FIFTH ARM, AND IT COMES FROM A CONSUMER** (<project> X-1326). A\
  \ consumer verify LAYER that runs out of wall-clock reaches this same reader as\
  \ a\n    `verify-failed` row: `worktree._run_verify_tests` appends its `verify layer\
  \ 'X' command TIMED OUT\n    after Ns` sentence to the SHARED failing list WITHOUT\
  \ the `_VERIFY_TIMEOUT_MARKER` the class fork\n    keys on, so no timeout is ever\
  \ seen and the `test-failure` rule above — \"no assertion is a guard\n    message\"\
  \ — claimed it as the one arm entitled to the caught-defect sentence. Measured on\
  \ <project>\n    2026-09-04: SIX rows across FOUR branches, each with exactly one\
  \ assertion (that sentence),\n    `failing_tests` empty, and a `consumer_verify_layers`\
  \ trail whose `frontend-unit` layer reads\n    `outcome: timed-out` at ~300.1s against\
  \ a 300.0s limit while `static`/`sandbox`/`stack` PASSED.\n    A host that times\
  \ out an otherwise-healthy layer under a land wave is a HOST/LIMITS signal, not\
  \ a\n    statement about the code, and pricing all six as defects the gate caught\
  \ made the honest signal\n    invisible. The arm is `layer-timeout`, read from the\
  \ STRUCTURED trail already records\n    (never from the prose), ordered BEFORE the\
  \ `test-failure` rule, and EXCLUDED from\n    `ABORT_ARMS_CAUGHT_DEFECT` — which\
  \ needs no edit, because that allowlist is positive by design and\n    a new arm\
  \ is outside it by construction. A timed-out layer beside a real failing test, or\
  \ beside a\n    guard message, is MIXED on the same reasoning as above; a pre- row\
  \ with no trail is admitted\n    by a belt bounded to a SOLE timeout sentence, since\
  \ with more than one assertion nothing in the row\n    can say whether the others\
  \ are tests that genuinely failed. **THE CLASS EMISSION IS AGAIN NOT\n    TOUCHED**\
  \ — a third application of the same two reasons: eleven readers key on the literal\n\
  \    `verify-failed` string, and every historical row would need this reader anyway.\
  \ **AND THE NOT-WASTE SENTENCE IS COMPUTED FROM THE ROWS IT IS\n    TRUE OF, never\
  \ merely caveated afterwards**: stating the whole group's count and minutes and\n\
  \    qualifying them a clause later has still ASSERTED them to a reader who stops\
  \ at the first\n    sentence. So the gate-caught group renders in THREE buckets\
  \ — the rows an ALLOWLIST predicate\n    (`abort_arm_is_caught_defect`) admits as\
  \ a caught defect, the rows PROVEN to be bookkeeping, and\n    the `unattributed`\
  \ rows, each with its own count and minutes. The allowlist is what keeps an\n  \
  \  unplaceable row out of BOTH claims: it is no more evidence of bookkeeping than\
  \ of a defect, and\n    sweeping it into the bookkeeping clause would be this rule's\
  \ own over-claim pointed the other\n    way. **THE GROUP IS NOT MOVED**: re-homing\
  \ the bookkeeping arm\n    into `process-refusal` (whose definition it fits) was\
  \ weighed and rejected here, because it would\n    move minutes into the RECLAIMABLE\
  \ headline — a louder claim than a READ is entitled to make while\n    the card\
  \ that actually MOVES those guards is a separate one.\n    The `early` group keeps\
  \ its OWN minutes rather than being dropped: on the kernel's own\n    window its\
  \ two expensive classes (merge-non-union-conflict 569.9 min, audited-diff-stale\
  \ 194.1\n    min) cost 764 min/week while paying no verify at all, and a paid-only\
  \ reading would have made\n    that invisible.\n    **THE TREND READING EXISTS BECAUSE\
  \ OF THE CORRECTION, and this is the rule's real content.** In\n    X-1039 the requester\
  \ volunteered, AGAINST THEIR OWN INTEREST, that their window straddled a\n    regime\
  \ change: ~6.6 of the 8 h/week they had attributed to the pinned last-green leg\
  \ was already\n    gone, removed by a ONE-LINE project declaration (`verify_policy:\
  \ pinned_last_green: never`) and\n    not by any fix anyone would build. A view\
  \ ranking by RAW MINUTES would have printed that leg at\n    the top and sent someone\
  \ to build against a cost that no longer existed. So a DECAYING cost MUST\n    be\
  \ distinguishable from a STANDING one: each class carries a trend computed by splitting\
  \ the SAME\n    window into halves and comparing THE CLASS'S OWN DETERMINED MINUTES\
  \ — paid AND early alike\n    (recent ≤ 0.5× older ⇒ decaying; ≥ 2.0× ⇒ growing;\
  \ otherwise standing; below a 5-minute total,\n    or with no older half, `unknown`\
  \ rather than a guess — a first observation read as GROWING would\n    nag every\
  \ newly-appearing class on its first day). **THE SUBJECT IS THE MINUTES THE CLASS\n\
  \    REPORTS, not only its paid ones** — corrected at audit-post pass 1 against\
  \ this rule's own first\n    draft, which said \"paid minutes\". The `early` group\
  \ carries REPORTED MINUTES (764 min/week on\n    the kernel's own window), so restricting\
  \ the trend to paid rows would print the largest early\n    class's cost with NO\
  \ trend beside it — which is precisely the raw-minutes-only reading X-1039\n   \
  \ disproved, re-created inside the mechanism built to prevent it. Every minute this\
  \ rule PRICES\n    therefore carries a trend, and the two are never separable in\
  \ the rendered text.\n    Verified as REAL SIGNAL on the kernel's own 7 days, not\
  \ asserted: `verify-failed` reads GROWING\n    (1171.5 min recent vs 567.1 older).\
  \ **AND THE TREND IS PER ARM, NEVER OVER A UNION** :\n    this rule's own first\
  \ draft cited `rebaseline-unauthorized` reading DECAYING (97.3 vs 325.4) as\n  \
  \  the matching evidence, and that citation is WITHDRAWN — it was computed over\
  \ the union of two\n    arms of different movability, so it described neither. A\
  \ correct count under a union trend leaves\n    exactly the misleading half in place,\
  \ which is why the trend is derived from the SAME (class,\n    ARM, GROUP) entry\
  \ the count is, by construction rather than by a second code path.\n    The trend\
  \ is printed BESIDE the minutes of every named class, at the same prominence, so\
  \ the\n    raw-minutes reading the correction disproved is never the only one on\
  \ offer.\n    **AN EVICTION IS NOT AN ABORT, AND IS NOT IN THIS POPULATION AT ALL**\
  \ (owner ruling\n    2026-09-11 «в долгах не считать»). A `land_completed{status:\
  \ abort}` row whose `abort_class` is\n    `land-reservation-park-limit` (the halt)\
  \ is EXCLUDED from the abort rows this rule folds\n    — from every class, group,\
  \ count, minute, trend and from the window's `aborts` total — and is\n    reported\
  \ APART under `evicted`. It is NOT a cheap abort to be bucketed with the early ones:\
  \ the\n    land verified nothing, merged nothing and spent no CPU; it waited out\
  \ the land reservation behind\n    a holder that would not release and then STOPPED\
  \ rather than racing for the ff. Every other class\n    here describes a branch\
  \ that was JUDGED and refused, which is a question about the branch; an\n    eviction\
  \ is a fact about the QUEUE, and nothing about the branch was ever judged. Counting\
  \ it as\n    a failed attempt therefore reads ONE congestion TWICE — once as the\
  \ reservation wait this rule\n    already reports, and once again as a failure that\
  \ never happened. MEASURED 2026-09-11: `debt`\n    read 476 aborted lands over 7\
  \ days and the roster part-3 fold read `abort share 53%`, while in\n    the 11:39-13:40Z\
  \ window alone 4 of 14 aborts were evictions ( —\n    each after 149 min queued).\
  \ **THE KEY IS THE CLASS, READ STRUCTURALLY** — `abort_class` is set at\n    the\
  \ `_die` origin and carried by `_emit_land_abort`; folded over this repo's whole\n\
  \    journal, 29 rows carry it and zero park-limit rows lack it, so no `abort_reason`\
  \ regex is used\n    (the structured-state-only discipline this module already holds).\
  \ ONE constant and ONE predicate\n    are the single classification home; the roster\
  \ part-3 fold, which is contracted to run on pure\n    stdlib against any repo and\
  \ so cannot import them, carries the literal under a test asserting\n    the two\
  \ agree. **AND THE MINUTES ARE NEVER DROPPED** — the same bound rule 27 sets for\n\
  \    `preflight-refused`: `evicted` carries the wait those rows PROVE (`reservation_wait_ms`)\
  \ WITH its\n    coverage (`waited_n` of `n`), and the render prints the coverage\
  \ beside the figure and suppresses\n    the figure entirely when nothing proves\
  \ it. Removing an eviction from the abort count while\n    leaving its wall-clock\
  \ unreported would trade an overstatement for a DISAPPEARANCE, the same\n    direction\
  \ as pricing an undetermined cost at zero. Because an eviction can no longer un-suppress\n\
  \    the abort headline, the render OPENS on `evicted` alone when a window's only\
  \ aborts were\n    evictions — the exclusion is not permitted to make a visible\
  \ cost silent. SCOPE: the\n    CLASSIFICATION only. The eviction BEHAVIOUR (whether\
  \ an evicted branch should be re-queued) is a\n    separate card, no other abort\
  \ class moves, and no threshold on the share is introduced.\n    **AN UNDETERMINED\
  \ COST IS NEVER A ZERO** (the fabricated-measurement class). A row whose\n    `duration_ms`\
  \ is absent or not an integer is reported as UNDETERMINED and counts toward the\n\
  \    reportable set. It is unreachable on today's corpus, which is exactly why it\
  \ is built and\n    fixture-driven rather than assumed away: the one direction this\
  \ fold must not fail is making an\n    unmeasurable cost read as a free one.\n \
  \   **CLEAN MEANS \"NOTHING COST ANYTHING WORTH REPORTING\", NOT \"NOTHING ABORTED\"\
  ** (rule 3 applied as\n    a COST floor, never a count floor). The count is the\
  \ number of aborts that paid a verify, OR whose\n    determined cost clears 60s,\
  \ OR whose cost is undetermined. Sub-floor rows are still counted and\n    carried\
  \ per class and summarised in one trailing clause, but cannot un-suppress the line\
  \ — a\n    window of instant `uncommitted-dirt` refusals is CLEAN and prints nothing,\
  \ which is the card's own\n    \"cost nothing worth reporting\". It rides rules\
  \ 2/3/5 verbatim — SUPPRESSED-WHEN-CLEAN,\n    REPORT-ONLY, never a gate: no verb\
  \ gains a refusal, no exit code moves, nothing is stored, no\n    event is emitted\
  \ by the render. NO new store, NO new state, NO new verb, NO new event type, NO\
  \ new\n    seam and NOT A CADENCE (SPEC-0142 §4) — a THIRD reading of the `land_completed`\
  \ payload rules 19\n    and 23 already read, wired at the ONE shared residue so\
  \ it rides all three debt seams. A repo that\n    has never aborted a land folds\
  \ to 0 ⇒ suppressed, so history is never retro-charged.\n    **AND BECAUSE THEY\
  \ ARE, THE HEADLINE NAMES THE POPULATION THE GROUP COUNTS COVER**.\n    The two\
  \ facts above — the count is a COST-floored subset, while the per-class `n` the\
  \ groups sum\n    is the WHOLE window — mean the headline and the buckets printed\
  \ beside it are counts of DIFFERENT\n    populations. Stating them in one sentence\
  \ without relating them is not a wording preference but a\n    defect: measured\
  \ on the kernel journal 2026-08-30 the line read \"371 aborted land(s)\" over group\n\
  \    counts summing 501 and a trailing \"130 FURTHER abort(s)\", so 371, 501 and\
  \ 130 composed in no\n    stated way (501 + 130 = 631 is not a quantity that exists)\
  \ and the headline understated the\n    window's aborts by 26%. So the render's\
  \ headline count is the WINDOW TOTAL — equal, by\n    construction, to the sum of\
  \ the bucket counts printed after it — with the reportable sub-count\n    and its\
  \ floor named beside it, and the sub-floor count is reported as a SUBSET of that\
  \ total,\n    never as a further addend. This is the coverage count and the gate-caught\
  \ split\n    applied to the headline: name the population a number is true of. It\
  \ changes NO number the fold\n    computes and does NOT touch suppression, which\
  \ stays keyed on the cost-floored count above; nor\n    is it the cross-group sum\
  \ the never-summed rule forbids, which fences MINUTES presented as waste\n    and\
  \ not a count of the window's own population. A result that cannot prove a total\
  \ keeps the\n    pre-change headline and makes no reconciling claim.\n    **NOT\
  \ IN SCOPE, named so the evidence is not miscounted:** the CAUSE-CAPTURE half of\
  \ X-1039 (58 of\n    75 verify-failed aborts carrying no captured assertion identifier)\
  \ SHIPPED as, closed\n. Their measurement window closed roughly three hours BEFORE\
  \ that fix landed,\n    so it is a CURRENCY problem, not a disclosure one — it does\
  \ not strengthen (capabilities\n    never ANNOUNCED to a project) and is deliberately\
  \ not added there.\n\n## Parameters\n\n\nNone consumed FROM this spec (`consumed:\
  \ false` holds — no governing scalar is read from the spec\nYAML). TWO env-homed\
  \ config knobs govern print-discipline details (rule 3), both host-read and passed\n\
  into the render helper, neither a spec-consumed parameter:\n  - `YITC_DEBT_FOLLOWUP_FLOOR`\
  \ (default 5) — the open-followups COUNT floor (`_debt_followup_floor`): a backlog\
  \ of 1..floor-1 actionable followups is suppressed.\n  - `YITC_DEBT_SECURITY_FINDING_FLOOR_DAYS`\
  \ (default 30) — the open sub-critical security-findings\n    AGE floor in days\
  \ (rule 11, `_debt_security_finding_floor_days`): a finding open for\n    less than\
  \ this is not yet surfaced. It is an AGE floor, NOT a count floor — the count is\
  \ never\n    hidden (one warning open for a year is real debt); only youth suppresses.\
  \ A non-positive value\n    disables it, as with the followup floor.\n  - `YITC_DEBT_DEAD_LAND_FLOOR_MINUTES`\
  \ (default 90) — the dead-land AGE floor in minutes (rule 23, `_debt_dead_land_floor_minutes`):\
  \ a candidate younger than this is not yet surfaced,\n    because a HEALTHY in-flight\
  \ land is indistinguishable from a dead one between land step-1's\n    bookkeeping\
  \ commit and its terminal row. An AGE floor, never a count floor. Non-positive\n\
  \    disables. The value is rule 12's, reused rather than newly decreed, and justified\
  \ against\n    measurement: the longest healthy land observed over 4365 timed rows\
  \ ran 38.7 min (p95 8.0).\n  - `YITC_DEBT_AHEAD_BRANCH_FLOOR_HOURS` (default 24)\
  \ — the ahead-work-branch AGE floor in hours\n    (rule 24, `_debt_ahead_branch_floor_hours`):\
  \ a branch whose tip is younger than this is\n    not yet surfaced, because EVERY\
  \ healthy in-flight build has a branch ahead of main. An AGE floor,\n    never a\
  \ count floor. Non-positive disables. Justified against measurement: two live lanes\
  \ at 15.7h\n    and 17.5h against the one abandoned branch at 25.8h, with the originating\
  \ incident at 28-40h.\n  - `YITC_DEBT_BRANCH_BURN_MIN_ATTEMPTS` (default 4, FLOORED\
  \ at 2) — how many UNLANDED land\n    attempts ONE branch must burn inside the window\
  \ before rule 34's line prints\n    (`_debt_branch_burn_min_attempts`). Deliberately\
  \ NOT rule 26's 2: retrying is the normal shape\n    of a converging build, so this\
  \ floor sits above the ordinary iteration band (measured — the\n    three-attempt\
  \ band dominates the population, and both proven stuck shapes carried five and\n\
  \    seven). Rule 34 declares NO window knob of its own; its horizon is\n    `YITC_DEBT_ABORT_BREADTH_WINDOW_HOURS`\
  \ above, since the two folds are transposes of one\n    reading met at one seam.\n\
  \  - `YITC_DEBT_DISPATCH_MONITOR_FLOOR_MINUTES` (default 90) — the unmonitored-dispatch\
  \ AGE floor in\n    minutes (rule 12, `_debt_dispatch_monitor_floor_minutes`): an\
  \ in-flight dispatch younger\n    than this is not yet surfaced. Also an AGE floor,\
  \ never a count floor. The default is chosen to\n    EXCEED the longest sanctioned\
  \ watch cycle (the watcher journals its receipt at EXIT, so an armed\n    watch\
  \ is invisible until it finishes: `WATCH_MAX_RUNTIME_SECS` = 30 min, and the §Watcher\
  \ recipe\n    shows `--watch-timeout 3600` = 60 min) — so a controller who keeps\
  \ re-arming the blessed watcher\n    can never be false-nagged. A non-positive value\
  \ disables it.\n\n## Rationale\n\nX-0142: a project reached `not_adopted=50` completely\
  \ unnoticed — the debt grew mid-session, so a\nsession-start-ONLY count showed stale\
  \ and never updated; the owner caught it only by asking. X-0141:\nthe sibling open-followups\
  \ disposition-surfacing gap (subsumed). Prior-art: the SPEC-0086 `cross-coord:`\n\
  echo (report-only, count-derived, suppressed-when-clean, no store). Full deliberation\
  \ (delta-vs-total,\ndropping batch-done, new-spec-vs-amend): the plan\n[[proactive-debt-surfacing-at-the-3-debt-change-poin]]\
  \ + its gate-specs + external consult (2026-07-01).\n\n## Verification\n\n- **Deterministic:**\
  \ with synthetic non-zero debt (a repo with not_adopted>0 / an open followup / an\n\
  \  overdue recheck) session-start and the on-demand `debt` each print its line;\
  \ with a clean repo\n  NEITHER prints (suppressed-when-clean). A land prints NO\
  \ debt line at all (rule 2(b) retired — tripwire tests/test_t13142_land_tail_debt_retired.py,\
  \ RED if a debt fold is wired back\n  into the land tail or if either surviving\
  \ seam loses the echo). Unit tests per call site + one render-helper test (the SPEC-0086\
  \ echo tests\n  are the template).\n- **Real-data soak (≥3 owner-observed sessions\
  \ with carried debt):** the counts track the debt as it\n  changes (each session\
  \ start / `debt` re-fold re-derives the fresh total); a per-run postcheck row records\n\
  \  {session-ref, seam that printed, count snapshot} — replayable via the journal,\
  \ not owner memory.\n- **Open sub-critical security findings (rule 11):** DIFFERENTIAL\
  \ over a fixture findings\n  series — an aged OPEN warning surfaces ONE report-only\
  \ line at `bin/yitc-v2 debt` (and therefore\n  at all 3 seams, which share the one\
  \ host residue); the SAME finding resolved in the latest report,\n  or younger than\
  \ the floor, or carrying a CRITICAL severity (the deploy gate's business), or\n\
  \  carrying an ABSENT/unknown severity (never nag on an unknown), prints NOTHING.\
  \ An open-run BROKEN\n  by a resolved report restarts the clock (the regressed finding\
  \ is new debt, not old). A missing\n  findings dir folds to a clean zero-count without\
  \ raising — the seam is never broken. A malformed\n  report likewise never raises,\
  \ but is a NAMED DEGRADE, not a clean zero, verified by a\n  CONTROL-FIRST differential:\
  \ the healthy arm asserted at count 1 BEFORE the broken arm is built (a\n  mis-armed\
  \ probe and a silent instrument are indistinguishable from output alone), then the\
  \ SAME\n  series made unparseable must yield `authority_source: \"unreadable\"`\
  \ + an `authority_degrade` line\n  rather than a clean 0; corrupting ONLY the latest\
  \ report while an older one still carries the\n  finding must yield `older-report-promoted`\
  \ + a degrade naming both files (the count stays 1 — the\n  seam holds — but the\
  \ swap is stated); a never-audited repo stays `none` with NO degrade key (no\n \
  \ false degrade). Unit tests: the `debt.open_subcritical_findings` fold verdict\
  \ + the render-helper\n  line (incl. the degrade line firing at count 0, and clean\
  \ still suppressed) + the\n  absent-collaborator no-op (the 3 base views' output\
  \ is byte-identical without it).\n- **Unmonitored dispatches (rule 12):** DIFFERENTIAL\
  \ over a synthetic fleet — an in-flight\n  dispatch launched past the floor with\
  \ NO monitoring receipt surfaces ONE report-only line at\n  `bin/yitc-v2 debt` (and\
  \ therefore at all 3 seams, which share the one host residue); the SAME state\n\
  \  plus ONE `dispatch --watch` receipt NAMING that task prints NOTHING. The per-task\
