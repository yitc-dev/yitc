  \ per rules 2/3/5; a fold-side write is excluded by\n    construction and pinned\
  \ by a sandbox byte-sweep.\n    **SCOPE — ONE INSTANCE, THE SIBLING NAMED NOT BUILT.**\
  \ SPEC-0161's coverage is wired because it has\n    a NUMERIC floor to measure distance\
  \ from. The `dev-utilities/root-cwd-read-sets-*.json` reports are\n    the named\
