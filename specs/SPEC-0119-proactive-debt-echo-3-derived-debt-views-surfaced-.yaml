  18. **Unresolved worker halts — dispatch/worker TERMINAL-ATTENTION debt.** An OPTIONAL
      injected report-only view (`debt.unresolved_worker_halts`, collaborator of `_render_debt_echo`)
      over the dispatch journal: the worker halts whose CAUSE the journal has NOT recorded as cleared.
      The SIBLING of rule 12 — same family, same seams, same posture — differing in exactly one thing,
      which is the whole rule: **its drop criterion is RESOLUTION, never AGE. An unresolved worker halt
      stays visible until its cause is resolved, however old it is.**
      **The gap it closes.** Both surfaces a controller routinely reads go SILENT on a halt exactly as
      it ages — when it needs attention most. Rule 12's fold is bounded by the wave window (a launch aged
      out of it is not surfaced, by design), and `--fleet-verdict` drops an aged-out halt from `rows`
      (the SPEC-0133 rule 2a recency window). The truth survives in `journal query --dispatch-status`,
      but no seam routes a controller there. Real incident, kupiclub 2026-08-09: idle 4h and
       idle 2.5h, both ABSENT from `--fleet-verdict`, both plainly listed by `--dispatch-status`,
      while a 5-worker fleet ran other plans. The OWNER surfaced it; no system surface did.
      **What this REMOVES (CHARTER §P1 F3, named).** The state in which a worker halt is announced
      roughly once and then ages into silence on every routinely-read surface. For this row AGE ceases
      to be the silencer and RESOLUTION becomes it — a REPLACEMENT of the drop criterion, not an
      addition beside it.
      **The NAMING is load-bearing: this is dispatch/worker TERMINAL-ATTENTION debt, NOT fleet
      liveness.** The subject is a worker that STOPPED and is still owed a decision; the view claims
      nothing about who is flying now. That wording is what keeps the mechanism out of
      `--fleet-verdict` semantics and away from watcher machinery — and it is the framing the external
      auditor's placement consult required (`decisions/halted-worker-surface-placement-audit-adhoc.yaml`).
      **THREE NON-GOALS, each REJECTED by that consult — do not re-open them.** (a) The SPEC-0133 rule
      2a recency window is NOT widened or removed: that window is precisely what stops a LIVE-fleet
      reader degenerating into a backlog surface. (b) `dispatch --watch` is NOT lengthened, re-armed or
      otherwise life-extended: CHARTER §6 names `no liveness-arming FSM` among its retirements, and that
      is the drift. (c) NO second dispatch-classifier path is introduced (SPEC-0133 rule 5 admits none).
      This rule touches none of the three; it adds one derived view beside them.
      **ONE PREDICATE, reused verbatim.** Resolution is decided SOLELY by `journal._halt_resolution`
      (rule 2d) — the same fail-closed predicate `--fleet-verdict` and the re-dispatch brief
      already share: a halt is cleared when the task's branch landed ok, when the designed ceiling
      continuation ran (a converged consult plus that stage's granted GREEN pass), when a MAIN-attributed
      halt's main went green again, or when the task's own CARD was DISPOSED after the halt — parked,
      wont-do or closed (arm (iv)). This view invents no second notion of "resolved", and that
      is exactly why arm (iv) lives in the PREDICATE and not here: a card REFUSED AT PRE-CLAIM and then
      PARKED can satisfy no other arm ever, and while it went unread this line and `--dispatch-status`
      gave two answers about one halt (CHARTER P7). For that shape the remedy this line names is the
      DISPOSITION route specifically — park or wont-do the card — because re-dispatch is REFUSED for a
      pre-claim refusal (SPEC-0166) and `resolve` would need the very owner decision the park IS. shipped the half where a CLEARED halt stops reading as an
      open block; this is the opposite half — stopping AGE from silencing an UNCLEARED one — and the two
      together give the row its whole contract: surface while unresolved, drop on resolution.
      **The COHORT COMPLEMENT is the mechanism, not a courtesy.** A row that never drops is an
      accumulating graveyard — exactly the failure the consult's rejection of (a) names — so the
      resolved cohort must really vanish, and it does: on the engine journal (2026-08-09) 232 distinct
      halted task ids fold to 60 unresolved, the predicate already excluding 172. The exclusion is
      tripwired in BOTH directions, because a selector is only as good as what it refuses.
      **BOUNDED BY TYPE, NEVER BY AGE — the cost axis moves, the signal axis does not.** Dropping the age
      bound means the fold cannot pass its reader a `since` window, and an unbounded read of the union is
      far too heavy for a surface riding session-start. So the bound moves to the axis that costs no
      signal: the reader is narrowed to `journal.HALT_RESOLUTION_INPUT_TYPES` — the exact event types
      `_halt_resolution` can match, homed BESIDE that predicate so a future third resolution arm cannot
      silently outgrow the filter (a coupling the ledger tripwires). It is a NARROWING of the ONE unioned
      `_dispatch_status_events` reader (`include_types=`), never a second reader: every caller must keep
      reading the same union (local checkout + MAIN + every live worktree) or two halves of a fold can
      disagree about which journal they mean. Measured on the engine journal (271787 lines, ~116MB per
      journal): unbounded 3.47s/journal over 252936 events; type-bounded ~0.8s/journal over 18744, and
      ~5.5s across a 5-worktree union. That residue is raw I/O over near-duplicate worktree journals; the
      lever on it is journal SIZE (SPEC-0002 rotation), not a window here. The live-worktree leg is kept
      even though it adds no halt today, because dropping a journal leg re-introduces a by-construction
      blind spot — an abandoned unlanded worktree holding the only copy of a halt — which is the exact
      failure class this row exists to end.
      **ATTRIBUTED TO THE READING SESSION.** The row states a COUNT and the OLDEST id — both
      true, neither attributable — so a controller can read its own stopped fleet as somebody else's.
      Real incident, kupiclub 2026-08-20 (X-1014): a controller dispatched three workers, all three
      stopped, the journal recorded every one correctly and the fold counted them correctly, and half
      an hour later that same controller read `6 worker halt(s)` and did not recognise its own fleet in
      it. So the line additionally states how many of the counted halts THIS session dispatched, naming
      the ids when they fit. **NO NEW STORE, EVENT OR STATE — the join already exists in the journal**
      and the fold simply did not perform it: `bg_dispatch_halted.session_ref` is the WORKER's ref, and
      the `bg_dispatch_launched` whose `data.expected` equals it names the LAUNCHING controller in its
      own `session_ref`. Re-measured before adoption on the engine journal (2026-08-20, 361491 lines):
      389 of 468 halts join to a dispatcher across 120 distinct dispatching sessions; 79 do not.
      **ATTRIBUTION IS ADDITIVE, NEVER A FILTER, AND FAIL-CLOSED IN THE OTHER DIRECTION FROM THE ROW
      ITSELF.** The count stays the TOTAL: nothing is dropped, reordered or hidden by attribution. A
      halt whose dispatcher cannot be resolved is counted in the total and attributed to NOBODY — never
      to the reader — and the line says how many such halts there are, so the remainder can never be
      read as "therefore someone else's". Where the row fails toward VISIBLE (an uncertain halt still
      prints), attribution fails toward UNCLAIMED: a wrongly-attributed halt puts a stranger's stopped
      worker in the reader's own column, which is this rule's own error inverted and harder to catch
      than a plain unknown. An unresolvable reading session attributes nothing and the clause is
      omitted entirely, rather than printing a zero the fold never computed. The reader is widened by
      TYPE only — `journal.HALT_ATTRIBUTION_INPUT_TYPES`, the resolution set PLUS the launch row —
      leaving the resolution bound, and therefore `--fleet-verdict` and the re-dispatch brief,
      untouched. **STILL REPORT-ONLY (rule 21):** the clause moves no exit code, emits no event on
      render, and triggers no recovery; it says nothing about whether a controller armed a watcher.
      **FAIL-CLOSED TOWARD VISIBLE.** A false silence is far worse than a false row here: a surfaced line
      costs a line, a wrong silence loses the signal entirely. So every uncertainty leaves the halt
      UNRESOLVED and visible — an unattributable halt, an unparseable ts (which loses only its reported
      AGE, never its row), a predicate returning nothing. Age is REPORTED, never applied: nothing in this
      fold is filtered by it, which is what makes the differential honest.
      **TERMINAL-CARD EXCLUSION — the SECOND drop criterion, and it lives in the READER.** A
      halt whose TASK CARD has already reached a TERMINAL status (`done` / `wont-do`) does NOT print.
      **DISPOSED PRE-CLAIM REFUSAL — the same criterion, extended to the one disposition that is
      deliberately NOT a terminal status.** Since a pre-claim refusal leaves a
      trace on the card (`refused_at`) and its governed exit `task refuse --clear` records the
      disposition and returns the card to plain `ready` — the shape a re-authored acceptance ends
      in. Read by STATUS alone that card is indistinguishable from an undisposed one, so its halt
      row could never drop and this rule's "surface while unresolved, drop on resolution" contract
      would fail on that path. So the SAME reader arm also drops a halt when the halt's NEWEST row
      is a pre-claim refusal (`kind: refused`) AND the card POSITIVELY reads `refused: false`.
      Narrow by construction: only that halt class, only a positive false, and a card that does not
      answer the question at all (an older reader, a missing key, an unparseable card) KEEPS its
      row — the same fail-closed-toward-visible asymmetry as every other criterion here. Still NO
      predicate change: `_halt_resolution` and `HALT_RESOLUTION_INPUT_TYPES` are untouched, so
      `--fleet-verdict` and the re-dispatch brief are unaffected.
      The subject of this row is a card still AWAITING A DECISION; a closed card is awaiting none,
      whatever the journal can or cannot prove about the halt itself. Measured on the engine journal
      (2026-08-10): 60 rows -> 5, of which 55 named a `done` or `wont-do` card. That wall is not
      cosmetic — a surface whose first print is mostly settled history trains its reader to skip it,
      which defeats the row this rule.
      **THE PREDICATE IS NOT AT FAULT AND MUST NOT GAIN A THIRD ARM.** `_halt_resolution` looks only
      FORWARD from the newest halt, so a resolution that PRE-DATES the halt is unfindable by
      construction: 7 of the excluded cases are literally a halt emitted AFTER its task closed AND
      landed ( card closed 08:58:45Z, its branch landed 08:59:32Z, the halt arrived 09:00:38Z;
      same shape for). The predicate REPORTS THE JOURNAL
      FAITHFULLY, which is its documented contract. The defect was in what THIS READER did with a
      faithful UNRESOLVED — so the fix is homed here, in the reader. Teaching the predicate a
      `task_closed` arm would change `--fleet-verdict` and the re-dispatch brief, which consume the
      same predicate, as a side effect nothing authorised. Governing craft rule:
      `lessons/fail-closed-belongs-to-the-reader-not-the-parser` — fail-closed is a property of a USE
      SITE, not of a parse result, and each reader owns what a missing/uncertain value means for it.
      **REUSE, NOT A SECOND READER.** The cross-check is the EXISTING `_main_task_strand_state`
      (X-0557) — the same card reader `--fleet-verdict` already injects to read a
      paused card for its `pause_detail` — passed to the fold as its `_card_state` collaborator. A
      second card reader here would be the failure, not the fix (CHARTER §P1 F1). Only that reader's
      `status` is consulted; its `terminal` key means `not stranded` and is TRUE for `ready` / `parked`
      / paused cards, so reading it instead would silence the very remainder this row exists to show.
      **SCOPE BOUND — the honest remainder KEEPS PRINTING, and this is half the rule.** ONLY `done` and
      `wont-do` drop. A card that is `ready`, `parked`, or ABSENT ENTIRELY is NOT terminal and keeps its
      row — the no-card case most of all, being the shape most likely to be a genuine orphan. So does
      an unknown status, an unreadable card, a raising reader, and an absent collaborator: the
      exclusion is ASYMMETRIC by construction, dropping a row only on a POSITIVE terminal-status read,
      which is the same fail-closed-toward-visible posture stated directly above. Over-silencing is the
      failure mode that matters here, because from the outside it is indistinguishable from a repo with
      nothing owed.
      **TWO RESOLUTION SHAPES THE READER COULD NOT SEE — cleared by POSITIVE EVIDENCE, NEVER BY ABSENCE
.** The terminal-card cross-check clears a halt off a status ON A CARD, so a resolution
      that left NO CARD BEHIND was invisible to it and the halt was unclearable BY ANY VERB, forever.
      Two such shapes were measured on the engine journal and are now dispositioned by a THIRD drop
      criterion, consulted ONLY when the card read produced no card (so it can never second-guess a
      live one) and homed in the SAME reader beside the other two:
      (i) **RESOLUTION BY CARD DELETION.** / were resolved and acted on 70 days before
      this rule was amended: commit ce8d5f153 DELETED them as confirmed duplicates of shipped /
       and reconciled the part-c plan to realized. Deleting a duplicate card is a legitimate
      disposition, not an anomaly. Evidence = the deleting COMMIT, so the drop is attributable to that
      commit rather than to the card's mere absence.
      (ii) **LEAKED TEST-FIXTURE IDS.** is not a task at all — a fixture id whose ~140 historical
      journal rows persist because the journal is APPEND-ONLY (CHARTER §P5; the leak itself was closed
      AT SOURCE by, and its history may never be rewritten). Having no card it can never be
      marked terminal, so a TEST ID was being presented to the owner as a worker awaiting a decision.
      Proven by a CONJUNCTION, never by either half: git history NEVER carried a card for the id AND it
      is used as a fixture id under `tests/`. That conjunction is what keeps a REAL task id out — real
      ids are named in tests constantly, but they have (or had) a card.
      **THE DIFFERENTIAL IS THE SAFETY PROPERTY, and it is non-negotiable.** A halt whose card is absent
      for NO RECORDED REASON STILL REPORTS. Absence alone must never clear a halt, or this criterion
      becomes the hiding mechanism the rule exists to prevent. The set of accepted dispositions is
      CLOSED (`debt.ABSENT_CARD_RESOLUTIONS`), and the arm is asymmetric exactly as the terminal-card
      one is: only a positive disposition with real evidence drops a row; None, a raise, a non-dict, an
