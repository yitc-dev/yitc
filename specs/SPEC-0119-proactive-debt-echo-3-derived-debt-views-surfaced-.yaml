  \    between them, whitespace / `/` / `,` / the bare conjunction `and` are admitted\
  \ — `and` never\n    opens a run, so it cannot carry the scan into prose; every\
  \ run still ends at the ` — ` that opens\n    each description. Membership is EXACT-TOKEN:\
  \ `foo` is never declared by a declaration of\n    `foo_bar`. These bounds are the\
  \ RULE, not an implementation detail — the predecessor card\n    derived the set\
  \ from ANY code-span/bold token and was refused terminal at the audit-pre ceiling\n\
  \    precisely because markup alone cannot tell a catalog DECLARATION from a formatted\
  \ PROSE MENTION.\n    **THE EXCLUSION IS REPORTED, NEVER SILENT.** The fold carries\
  \ `excluded_types` (sorted) and the\n    line names them: «N consumer-authored type(s)\
