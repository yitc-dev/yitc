  \   one and absent in the other, no refusal text); the sandbox write-sweep; and\
  \ the one-oracle\n    agreement check.\n\n29. **TESTS KNOWN BROKEN ON MAIN — the\
  \ fact every branch inherits, folded once instead of proven\n    repeatedly (SPEC-0181\
  \ §Known-broken-on-main).**\n    An OPTIONAL injected report-only fold over the\
  \ JOURNAL (`debt.open_known_broken`), wired at the ONE\n    shared host residue\
  \ like every sibling and riding all seams (session-start / the\n    `debt` re-fold).\n\
  \    **SUBJECT.** A test whose failure a land's OWN attribution probe REPRODUCED\
  \ at the merge-base —\n    main WITHOUT that branch's diff (`land_completed.failure_attribution.at_main`)\
  \ — with no\n    later evidence of it passing there. MEASURED: on 2026-08-23 a pre-existing\
  \ main breakage made main\n    un-landable for every card and each branch paid a\
  \ full 420-570s verify to rediscover the same fact;\n    on 2026-08-22 two causes\
