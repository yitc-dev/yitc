  \ every one of them a different guard). It reached main only because\n    a human\
  \ noticed and re-ran the land by hand. The sibling merge refusal is the control:\
  \ 42 rows\n    carrying its text DO sit on main — every one from a branch that landed\
  \ anyway.\n    **THE FIX PRESERVES THE CHEAPNESS IT DOCUMENTS.** The record is composed\
  \ from values the refusal\n    had ALREADY computed for its operator-facing message,\
  \ and delivered as a `ts`-pinned\n    byte-identical COPY to main through the EXISTING\
  \ / seam. A row is an APPEND, never\n    a reservation: no extra git call, no verify\
