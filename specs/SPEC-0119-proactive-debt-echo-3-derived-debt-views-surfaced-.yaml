  37. **A SEAM THAT READ MORE OF THE CORPUS THAN IT COMPOSED — the reading moment the read counters
      never had (plan card C3).** An OPTIONAL injected report-only WINDOWED fold over the
      JOURNAL (`debt.seam_read_amplification`), wired at the ONE shared host residue like every
      sibling and riding all 3 seams (session-start / land-tail / the `debt` re-fold).
      **SUBJECT.** A (project, verb) SEAM whose PHYSICAL reads over the window exceeded its bound on
      any of three ratios, read straight off the `cli_invoked.data.reads` counters:
      **folds_per_segment** (`folds`/`segments`), **rows_parse_ratio** (`rows_parsed`/`rows`),
      **card_parse_ratio** (`cards_parsed`/`cards`). The WORST observation per seam is kept, never
      the mean: a seam that reads the corpus 22x once and cleanly 200 times has a mean inside the
      bound and a real defect, and the worst is also the only reading that names a specific run a
      human can go and look at.
      **THIS IS THE READING HALF OF SPEC-0190 RULE 10, NOT A SECOND SPELLING OF IT.** Rule 10 binds
      the AUTHOR — a composed seam owns ONE request-scoped ReadScope at its wiring site, proved by
      that seam's own differential regression. This rule binds nothing and reads the RESULT, for the
      seams no regression covers yet and for the drift a passing regression cannot. The two move
      independently: a seam can hold its scope and still read a wider horizon than its question
      needs, and a seam with no regression at all still shows up here.
      **WHY IT WAS RENDERED NOWHERE, and it is not an oversight to sneer at.** shipped the
      counters onto a row that is already emitted once per verb, correctly and cheaply — and then
      nothing read them back. That is the same silence the sibling rules 29/30/33 each ended: a
      mechanism recording faithfully into a payload with no reader is indistinguishable, from
      outside, from a mechanism that was never built. The cost is not hypothetical: session
      start ran **383 s**, of which **378 s** was ~20 whole-corpus passes; the engine's `debt`
      measured **2,052 physical segment reads over 93 segments (22x)** and **11.1M `json.loads` over
      ~596k rows**; kupiclub under `-C` measured **27x on the same code**. Every one of those was
      found by a HUMAN WAITING. Rule 10 makes the next one a test failure; this rule makes the
      current one a LINE, at the three moments a controller already reads before acting.
      **THE VIEW MUST ITSELF PASS THE BOUND IT REPORTS, and this is a construction requirement rather
      than an aspiration.** The fold reads through the INSTRUMENTED primitives
      (`journal.segment_rows`, the memoised `state.load_path`), both of which a ReadScope serves — so
      inside the wiring site's scope it performs NO physical read of its own. The card-side join
      resolves closed cards BY ID off the fold's own `task_closed` rows and loads them one at a time;
      a whole-corpus `tasks/*.yaml` glob would be *conformant* with the bound (one parse per card)
      and would still parse ~3,300 cards to name a handful. Rule 10 is a ceiling, not a licence.
      **`measured` AND `count` ARE BOTH REPORTED, AND THE SPLIT IS THE HONESTY OF THE RULE.**
      `measured` is how many seams carried usable counters at all, computed BEFORE the within-bound
      seams are dropped; `count` is the amplified subset. Without the split a CLEAN corpus and an
      UNINSTRUMENTED one both fold to `count: 0`, and no downstream reader can tell "every seam is
      within bound" from "nothing here has ever been measured" — the CHARTER §P3 «presence ≠ absence»
      fault, in the one place it would be invisible. The SPEC-0105 nightly leg decides its
      **`no counters`** verdict on `measured` ALONE for exactly this reason, and reports it as its own
      answer: never `ok`, and never a fabricated ratio of 1.0.
      **THE BOUND, AND WHY IT IS 1.05 RATHER THAN 1.0.** Rule 10's bound is one physical fold per
      segment in scope, and a real process legitimately reads a little more than the scope it
      composes — a fetch-receipt tail scan, a segment appended mid-request, a point-read of one card
      outside the memo. A bound of exactly 1.0 would fire on those and teach its reader to skip the
      line, which is how a signal in this repo actually dies. What 1.05 cannot absorb is a SECOND
      PASS over the corpus: the shapes this exists to catch measured 22x and 27x, not 1.02x.
      **RED at 2.0 on the seams a human WAITS on** (session start / land / `debt`) is recorded as a
      constant beside the bound so this fold and the roster's T4.P6 probe cannot drift on the number;
      the fold MARKS such a seam and grades nothing — what to do about a RED is the roster's
      judgement and the owner's, never this view's.
      **THE DECLARED EXEMPTION IS HONOURED HERE, WHICH IS WHAT MAKES IT AN EXEMPTION.** A seam that
      genuinely cannot hold the bound declares it in `yitc-ops.yaml reads.exemptions[]` — all four of
      `seam`/`ratio_bound`/`reason`/`until`, fail-closed, shape-validated at its one home
      (`init.py#_hook_reads_exemptions`, SPEC-0160 rule 25). That hook's own record says this surface
      "has NO reader that fails visibly... a half-registered entry would be inert AND invisible".
      This fold is that reader: it raises THAT seam's bound to the declared `ratio_bound`, matching
      the seam label EXACTLY (prefix-matching `land` would silently exempt a family nobody wrote an
      entry for) and falling back to the default on any entry it cannot use — an unusable exemption
      must never read as a wider bound. Absence reads as "this project exempts no seam".
      **WINDOWED (7d) so the line DECAYS INTO SILENCE once a seam's scope is fixed**, instead of
      standing as a monument to a seam repaired a month ago — the rule-14 / rule-27 / rule-33
      discipline. Seven is READ from the subject rather than decreed: SPEC-0190's own
      `JOURNAL_LIVE_WINDOW_DAYS` is 7, so the fold is answerable from the LIVE segment on an ordinary
      corpus. A view about read amplification that itself required an archive walk would be its own
      first finding. It is a REPORTING window only: nothing expires, the rows stay forever.
      **THE INSTANCE-FIX JOIN NAMES WORK, NOT A VERDICT (the plan's F2).** Beside the seams, the line
      names cards closed in the window whose OWN `expected_touch` declares the debt/echo view surface
      — derived from the card's declaration joined to the journal's `task_closed` rows, with NO human
      tag, because a tag is the step this repo has repeatedly watched go unmade. It says work was
      landing ON this surface while it was over bound; it does NOT say each card was an amplification
      fix, and the line says so out loud. Read it for the SHAPE: a class paid off one instance at a
      time is asking for a rule, which is the roster's T5 escalation. `lib/views.py` is deliberately
      OUTSIDE the join — it is the shared renderer for every lens in the system, so including it
      named 52 cards on the engine's own week, which is not a class, it is the week's closures.
      **POSTURE — and this fence is the load-bearing half.** Rides rules 2/3/5 verbatim:
      suppressed-when-clean, report-only, ZERO stored state, NO new event type, no new store, no new
      verb, no new seam, no exit code, no gate. It NAMES A COST AND PROPOSES NO CACHE: the remedy is
      the seam's ONE ReadScope at its wiring site, or a narrower horizon/slice. A cache bolted onto a
      view inside a composed seam is a proposal to SKIP rule 10 — the very rule this reports — so the
      line must never appear to suggest one. A repo whose seams are all within bound ⇒ 0 ⇒
      suppressed; a repo that has measured nothing says so rather than going quiet.
      Unit tests (`tests/test_t12037_amplification_surfaces.py`): all three closure-provable ACs,
      each DIFFERENTIAL — the roster rows asserted against their absence; the SAME fixture journal
      rendered at 3.0x (names the seam and the ratio) and at 1.0x (prints nothing); and the nightly's
      two zero-count shapes proved DISTINGUISHABLE — a project with no `reads` rows grading `skip` /
      `no counters` beside a clean one grading `ok` / `counters: true`, so the honesty claim is
      exercised rather than asserted.

  38. **THE NIGHTLY'S READER — verdict CHANGES vs the previous night, and a dated line for each
      chronic condition (fu_7c82f8a69c15, owner ask 2026-09-04).** An OPTIONAL injected
      report-only fold over the JOURNAL (`debt.nightly_verdict_changes`), wired at the ONE shared
      host residue like every sibling and riding all 3 seams (session-start / land-tail / the `debt`
      re-fold).
      **SUBJECT.** The last TWO `nightly_run_completed` rows (SPEC-0105 — the bounded nightly's one
      per-run record, carrying `data.results[]`, one entry per registry project, each holding ~16
      per-check sub-dicts with a `verdict`). The view reports, per project, WHICH CHECKS FLIPPED AND
      FROM WHAT TO WHAT since the night before.
      **WHY IT EXISTS: THE ROW HAD NO READER, AND THIS IS MEASURED, NOT ALLEGED.** The nightly has
      run daily at 23:00 and written that row every night; `grep nightly_run_completed
      bin/lib/debt.py` returned **zero hits** until this rule. A fleet-wide governance report existed
      in the journal and reached no seam a session opens — the same silence rules 29/30/33/37 each
      ended, on the largest payload of the five. A mechanism recording faithfully into a payload with
      no reader is indistinguishable, from outside, from one that was never built.
      **CHANGES, NOT STATE — the design decision the rule turns on.** The row's own headline read
      `projects_flagged=11/11` EVERY night from 2026-08-31 onward, because two chronic conditions
      paint every project the same colour; the real movers (queue=warn on boomrocket/aiseller,
      freshness=alert on boomrocket, no_local_diff=alert on three) were invisible underneath. A view
      that re-printed the flag would re-print that saturation and be skimmed within a week. What a
      controller can act on is what MOVED. Measured on the engine's own journal for the
      2026-09-03→2026-09-04 pair: the flag says 11/11, this view says **three** projects moved and
      names the five checks that did.
      **THE TWO CHRONIC CONDITIONS ARE SPLIT OUT, NOT DROPPED (`NIGHTLY_CHRONIC_CHECKS` =
      `corpus` / `born_waivers`).** They are EXCLUDED from the per-project change line — a condition
      present every night contributes only ok↔stale noise to a differential — and each gets ONE DATED
      line carrying its count, the FIRST NIGHT of its CURRENT UNBROKEN SPELL, and a NAMED REMEDY
      (`NIGHTLY_CHRONIC_REMEDY`): corpus staleness → fix the `stale_root` cause the row already names,
      then `graph build` in that project; born-waiver placeholders → the `init --backfill-mandatory`
      expiry sweep, disposing of each rather than re-stamping. **NAMING the remedy is this rule's
      whole scope; PERFORMING either is explicitly not** — nothing here runs, schedules or offers to
      run anything, and each remedy is its own card. The spell is dated by walking BACKWARDS to the
      first night the condition was absent, which is what makes the line dated rather than aged: a
      bare "chronic for 5 days" names nothing a reader can go and look at and silently re-starts its
      own clock on every fold, and a condition that cleared and returned is honestly dated from its
      RETURN, because the older spell is over.
      **THE CHRONIC VERDICT IS AN EXACT MATCH, NEVER "not ok" (`NIGHTLY_CHRONIC_VERDICT`).** A check
      reading `skip` or `none` — not adopted, nothing to judge — is NOT the condition, and folding it
      in would count an UNMEASURED project as an afflicted one. That is the CHARTER §P3 «presence ≠
      absence» fault the sibling rule 37 names in its own `measured`/`count` split, in the one place
      it would be invisible.
      **A FIRST SIGHTING IS NOT A FLIP — for CHECKS as well as PROJECTS, and the second half is the
      one measured in production.** Only projects present in BOTH nights are compared (a project that
      joined the registry today has no previous verdict set to have changed against, and reporting
      its whole set would make every registry addition read as a fleet-wide incident), and within
      them only checks present in both. The check half is not hypothetical: on the night
      landed, its newly-shipped `seam_reads` check appeared on all 11 projects at once — a union
      comparison reported 11 changed projects, which is a RELEASE NOTE wearing the costume of an
      incident. With fewer than two rows the view says NOTHING: a first night has no yesterday, and
      the honest answer to «what changed» is silence, never «everything».
      **IT READS THROUGH THE INSTRUMENTED PRIMITIVE AND PROPOSES NO CACHE.** `journal.segment_rows`
      is the segment-aware fold (rule 4 of SPEC-0190 — the WHOLE logical journal; a raw read of the
      journal PATH sees the live segment alone and would report an older night as absent) and is one
      of the two readers a request-scoped ReadScope serves (SPEC-0190 rule 10), so inside the wiring
      site's scope this view performs NO physical read of its own. Only the VERDICT MAP of each night
      is retained, plus the raw `results` of the last two rows for the chronic detail — holding 111
      nights of full payload to answer a question about the last one would be the very amplification
      the sibling rule 37 reports. A cache on a view inside a composed seam is a proposal to skip
      rule 10, so this view must never appear to suggest one.
      **NO WINDOW, DELIBERATELY** — unlike its windowed siblings this fold compares the last two rows
      whenever they were written. A fleet whose nightly STOPPED RUNNING therefore keeps reporting the
      last real comparison rather than going quiet exactly when something is wrong; a 7-day window
      would convert a broken scheduler into silence, which is the failure mode this rule exists to
      end rather than to reproduce.
      **POSTURE.** Rides rules 2/3/5 verbatim: suppressed-when-clean, report-only, ZERO stored state,
      NO new event type, no new store, no new verb, no new seam, no knob, no exit code, no gate. The
      per-project count and the chronic lines are INDEPENDENT: a fleet where nothing moved but the
      chronic conditions persist still says so, and a fleet that is wholly clean says nothing at all.
      **CHARTER §P1 FILTER 3, STATED PLAINLY.** What this removes is the standing condition that
      `nightly_run_completed` is written-and-unread, and with it the 11/11 flag as the only fleet
      reading anyone had. No further deletion is invented to make the filter look stronger.
      Unit tests (`tests/test_nightly_reader_debt_line.py`): all three closure-provable ACs, each
      DIFFERENTIAL — one project moving out of three (identical nights and a single-row journal both
      printing NOTHING); the two chronic lines dated from a spell that starts mid-fixture (a night
      pair carrying neither condition printing neither line, and a project flipping ONLY `corpus`
      stale→ok staying OUT of the change line — the leg that catches a split that merely renamed the
      chronic checks); and the wiring asserted in the residue's own source slice, where a fold wired
      only into `debt` would not appear.

  39. **THE BROWNFIELD GAP REGISTER — what this project's own derived profile REQUIRES and its own
      carrier does not answer (SPEC-0198 rules 5+7).** An OPTIONAL injected report-only
      fold (`debt.profile_gap_register`), wired at the ONE shared host residue like every sibling
      and riding all 3 seams (session-start / land-tail / the `debt` re-fold).
      **SUBJECT — ONE DATED ROW per profile-required baseline item the project does not meet.** The
      required set is DERIVED, never asked for: the lenses `profile.required_check_set` activates
      (SPEC-0198) name the SPEC-0100 baseline items, and each item names the SPEC-0093 concern
      section whose answer would meet it — and, where the item is one of several asked of the SAME
      section, the KEY within it (`carrier_key`). An item is UNMET when the thing that
      would answer it — that section, or that key within it — is absent, empty or unanswered.
      PER-KEY GRANULARITY IS NOT COSMETIC: while every item sharing a section answered at the
      SECTION, ONE declared key cleared ALL of them, so a live carrier that declared a health
      endpoint was never again asked what happens to its logs. A reasoned `waiver:` on the SECTION
      still answers every key under it — rule 1 is a section-level stance, and without that
      inheritance this granularity would retro-create debt for every born-waived consumer, the
      SPEC-0149 §1 harm this fold exists not to do. A per-key `waiver:` answers just its own key,
      and a SCALAR section names no key, so it answers no per-key item. AND A DECLARATION THAT
    FALLS SHORT OF THE SHAPE ITS CONCERN REQUIRES IS NOT AN ANSWER: where a concern imposes a
    shape on a key, this fold DEFERS to that concern's own predicate rather than re-deriving
    it, so the birth-time check and this register cannot disagree about what counts
    (`debt._GAP_SHAPED_ANSWER_KEYS` names WHERE to ask, never what the answer is — CHARTER
    §P5). Shipped as two independent readings they DID disagree: SPEC-0164's hook refused a
    half-declared `slo:` at birth while this fold counted it adopted, so the obligation
    vanished while the declaration was still broken. A concern that cannot be
    consulted leaves the item UNMET, never adopted — the same fail-SAFE direction every other
    reading here takes. A repo with NO `yitc-ops.yaml` registers NOTHING — the engine kernel itself folds
      to 0 and stays silent, the `declared_checks` no-retro-nag discipline (SPEC-0149 §1).
      **NO NEW STORE. The row's carrier is the EXISTING followup/task link.** The dedupe key
      (`dimension + item id`, SPEC-0198 rule 7) rides the followup's existing `fingerprint` field
; the row's DATE is the `ts` of its own `followup_added` event. Nothing here adds a
      store, an event type, an FSM, a schedule or a gate.
      **TERMINAL STATES — `adopted | adapted | waived | out-of-scope | task-linked`.** A row in ANY
      of them LEAVES the count. The first four are read from the carrier's own words (a declaration
      is `adopted`, a declaration naming its own divergence is `adapted`, a waiver is `waived`, or
      `out-of-scope` when its reason says the surface does not exist). `task-linked` REQUIRES A
      RESOLVABLE T-id — an absent, malformed or unresolvable id is NOT terminal and the row keeps
      its place. That direction is deliberate: a register whose rows may leave the count pointing at
      a task nobody can open is where obligations go to disappear.
      **TRIAGE WINDOW — HALF-OPEN [0, 14) DAYS.** A filed row aged under 14 days is `within-triage`;
      at or beyond it, `overdue-triage`, named in ONE trailing clause on the same line. An UNFILED
      item has no date and is never overdue. The window informs; it gates nothing.
      **THE LINE IS CAPPED, AND THE CAP IS THE RULE.** ONE summary line: the count, the TOP TWO
      labels by the single deterministic order (`debt.gap_rank` — risk-ordered lens, `item_id`
      tie-break), and a pointer. NEVER one line per item. A project with twenty gaps costs the same
      two lines of attention as one with three; an uncapped register is what made the design this
      rule replaces unusable. Suppressed-when-clean like every sibling.
      **A LONE `task:` POINTER IS NOT AN ANSWER — it is what makes the armed fork reachable.** A
      carrier section whose only content is `task: T-NNNN` says "we have NOT met this yet; that
      card is doing it": the item STAYS in the register, and the writer arms its followup on that
      id. Counting the pointer as a declaration would close the row on a promise and leave nothing
      waiting for the card. The id is read STRUCTURALLY, from that one key, never mined out of the
      section's prose.
      **AUTO-FILING IS PART OF THIS RULE, AND SO IS ITS FENCE.** At the same seams, the host files
      ONE followup per unmet item through `followup add`'s OWN body (the carrier shape) —
      deduped FOREVER by the key, bounded per RUN by `debt.GAP_AUTOFILE_CAP`, born ARMED only when
      the carrier section names a resolvable task id and ACTIONABLE otherwise (SPEC-0095 §Armed).
      It FILES AND NOTHING ELSE: no dispatch, no audit, no deploy, no PR, no code mutation
      (SPEC-0198 rule 5 / CHARTER §6). Fail-open but NEVER silent — a writer that cannot write names
      itself on stderr, because "nothing was owed" and "the writer is broken" must not read alike.
      **CHARTER §P1 FILTER 3, STATED PLAINLY.** What this removes is the identical security question
      asked of every project regardless of stage — the standalone `security` subject of the T6
      inspection theme, retired into the profile-gated production-readiness lens row
      (`patterns/inspection-criteria-roster*.md`) — and the unbounded gap register the cancelled
      plan `kernel-security-baseline-seeded-into-the-spec-0100` designed. No further deletion is
      invented to make the filter look stronger.
      Unit tests (`tests/test_t12085_gap_register.py`): the capped line (6 unmet -> ONE line, count
      6 + exactly 2 labels; clean -> nothing), the writer (one row per item carrying its key; a
      second run at the same seam files none; an 11-item fixture files at most the cap; and the
      fence proven BY ABSENCE — no dispatch/deploy/audit row), each terminal state, the
      unresolvable-`task-linked` refusal, and the [0,14) boundary at 13/14/15 days — each
      DIFFERENTIAL, with the pre-change behaviour reconstructed inline through the same path.

  40. **THE ECHO RENDER SHAPE — a compact TABLE at the two echo seams, the long text ONE VERB
      away.** Rules 1-39 govern WHAT counts as debt; this rule governs only how the
      result is RENDERED, and it moves no threshold, window, class or count. **The occasion:** the
      echo prints one dense paragraph per class — measured on this repo 19,014 bytes over 20 lines
      — so it arrived at every `session start` and every land tail as several KB of prose the
      Controller does not read (owner, 2026-09-09: «читать нельзя»). An echo nobody reads is
      report-only in the worst sense: it costs the seam and delivers nothing.
      **THE TWO ECHO SEAMS RENDER ONE ROW PER CLASS:** `<marker>: <class> | <count> | <verb>` —
      the class DERIVED from the line's own head, the count the head's own first integer, the verb
      the FIRST `bin/yitc-v2 …` the line names. One row per non-clean class in first-appearance
      order, equal classes FOLDED with counts summed (which is what collapses the per-project
      nightly/chronic lines to one row each), every row within `debt.DEBT_ROW_WIDTH`.
      **SUPPRESSED-WHEN-CLEAN IS UNCHANGED (rule 5).** Clean in yields clean out and the table
      renderer prints NO header, ever — so the property is structural, not a second thing to
      maintain.
      **THE LONG TEXT IS RELOCATED, NEVER REWRITTEN — one home per rule text (CHARTER §P5).**
      `bin/yitc-v2 debt` BARE keeps today's FULL render unchanged: it IS the post-`/compact`
      re-fold (rule 5), whose whole job is to give back what the compact echo no longer prints.
      `debt --explain <class>` returns ONE class's lines VERBATIM — the same rendered line objects,
      not a re-authoring — and `--explain` bare lists the classes. Because the text returned IS the
      text rendered, preservation is checkable by byte-identity rather than asserted, and no class
      can be silently dropped.
      **NO CLASS REGISTRY.** The class slug is derived mechanically from each line's own head
      (parentheticals, quoted ids, digit-bearing tokens, a trailing ` for <x>` clause and stopwords
      dropped, capped at `DEBT_CLASS_MAX_WORDS`). A hand-maintained registry was the obvious design
      and is rejected under CHARTER §P1 F1/F2: it is a second home that drifts silently every time
      a renderer's wording changes, and it buys nothing the head does not already carry.
      **FAIL-OPEN AT BOTH SEAMS.** The fold is presentation riding two seam verbs, so a failure
      falls back to the FULL lines — degrading to unreadable beats degrading to broken, and beats
      degrading to silent (which returning nothing would be). The shared render helper
      (`views._render_debt_echo`) and the host helpers it feeds are UNCHANGED: the compaction
      happens at the two PRINT/INJECT seams, so every suite pinning what those helpers RETURN
      still measures the helper rather than this presentation.
      Unit tests (`tests/test_debt_echo_table.py`): the real `session start` subprocess
      emits only rows and no surviving paragraph (AC1), a GOLDEN byte-identity comparison per
      class between `debt --explain` and the pre-change paragraph (AC2), a clean fixture prints
      nothing at both seams (AC3), plus the drift tripwires — distinct heads stay distinct classes
      and every rendered verb is a real `bin/yitc-v2` verb.

  41. **A DECLARED LOAD-SENSITIVE FILE THAT NO LIVE CARD IS HOLDING — the exit nobody is walking
      (SPEC-0119 rule 41).** made ENTRY into `tests/load-sensitive.txt` automatic
      and EXIT never automatic, and BOTH halves are correct: a listed file no longer runs in the
      concurrent pool, so nothing can ever prove it pool-robust again, and only a CARD can remove
      its line — by making the file load-robust (removing the line in its ship diff) or by ratifying
      the line with a reason. The consequence is that the set is MONOTONIC unless a human acts, and
      until this rule the carrier's own header was the only place that said so.
      **THE OCCASION IS MEASURED, not anticipated.** 193 `land_completed` rows named test_t11451
      before was filed BY HAND, while the rule-26 line reported the CAUSE at every session
      start. An echo that reports a cause nobody is holding is how a known defect survives 193
      lands; this rule reports the HOLDER'S ABSENCE instead, which is the reading that was missing.
      **THE VIEW:** every file in the declared set for which NO non-terminal card carries the
      fingerprint `load-sensitive:<file>` in its `cites:`, each with the DATE it entered (the rule-38
      dated shape — a standing debt with a first day, not a permanent flag) and the two honest
      remedies NAMED. Derived at read time from the carrier + `tasks/` alone; zero stored state.
      **ONLY A NON-TERMINAL CARD SUPPRESSES.** `done` and `wont-do` hold nothing: a `done` card
      either removed the line (so there is no listed file left to report) or closed without removing
      it, which is exactly the un-held file this rule names. `ready` / `in-progress` / `parked` all
      suppress — a parked card is a recorded decision with a return trigger, which is somebody
      holding it. This is the OPPOSITE polarity from rule 36's fail-closed-toward-silence, and
      deliberately: there the claim is strong («this can NEVER be picked») and needs proof, here the
      claim is an absence the carrier itself already asserts is owed.
      **THE FINGERPRINT HAS ONE HOME** (`debt.load_sensitive_fingerprint`), because two consumers
      must agree on it EXACTLY: this view's suppression and the land-tail filer's idempotency check.
      A second spelling would let a card exist that one sees and the other does not — the filer
      would duplicate, or the echo would nag forever, depending on which drifted.
      **THE FILER IS THE OTHER HALF OF THE SAME CARD, and it is bounded by CHARTER §6.** At the land
      tail, the moment a file ENTERS the set, `land` also files ONE `ready` card for it through the
      same primitives `task file` uses, idempotent by that fingerprint, recording the card id on the
      `load_sensitive_entered` row IT IS EMITTED WITH (the journal is append-only — a row is never
      patched afterwards). The engine NEVER claims, dispatches or picks that card: filing is
      automatic, taking it into work stays an owner cue. The precedent is SPEC-0085 §3's auto-route
      of a kernel-bound deviation into a `cross request` — deterministic, idempotent, no owner
      reminder — and this is the SECOND seam of that shape, not a new mechanism.
      **WHY BOTH HALVES.** The filer covers every automatic entry from now on; the view covers what
      it cannot — a line added by hand, a card closed `wont-do` without removing its line, and every
      line already in the carrier before the filer.
      **REPORT-ONLY, like every sibling.** It names remedies and performs none: it removes no line,
      files no card, and moves no exit code. Removing a line stays a card's decision.
      Unit tests (`tests/test_load_sensitive_autofile.py`): exactly one card per entering file with
      its id on the emitted carrier row and never a second (AC1), the card `ready` / unstaged /
      unclaimed with no `task_picked` or dispatch row (AC2), and the dated line in its three states —
      uncarded prints, carded suppresses, empty set silent (AC3).


