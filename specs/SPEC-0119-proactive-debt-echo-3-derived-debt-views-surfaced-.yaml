  \ legs (a name appears AND the digest survives), bounded and truncated.\n\n33. **THE\
  \ LANDS A KNOWN-BROKEN MAIN ACTUALLY STOPPED — the cost side of rule 29.**\n   \
  \ An OPTIONAL injected report-only WINDOWED fold over the JOURNAL\n    (`debt.prequeue_known_broken_refusals`),\
  \ wired at the ONE shared host residue like every sibling\n    and riding all seams\
  \ (session-start / the `debt` re-fold).\n    **SUBJECT.** A land REFUSED BEFORE\
