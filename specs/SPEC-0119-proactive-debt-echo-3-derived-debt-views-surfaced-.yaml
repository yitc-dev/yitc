  \ burn from a three-minute one, so the\n    elapsed span and the number of distinct\
  \ abort classes are carried IN the rendered line —\n    annotations that make the\
  \ count actionable, never better keys.\n    **NO CAUSE IDENTITY IS CONSULTED, COMPUTED\
  \ OR BORROWED ANYWHERE IN THIS FOLD.** Rule 26 owns\n    that reading; a second\
  \ opinion here would let the two disagree about what one cause is\n    (CHARTER\
  \ §P5). The `class_count` annotation reads the coarse `abort_class` the row already\n\
  \    carries and derives no key from it. **How cause keys are computed, and whether\
  \ the\n    identity-absent classes should carry an identity, is a REAL and SEPARATE\
  \ question this rule\n    MEASURED but deliberately does not absorb.**\n    **N\
  \ DEFAULTS TO 4, AND IT IS NOT RULE 26's 2 — measured, not decreed.** Rule 26's\
  \ floor is the\n    EARLIEST moment its fact exists, because each further miss costs\
  \ ANOTHER branch a full verify.\n    Here the opposite pressure governs: retrying\
  \ IS the normal shape of a converging build, so the\n    floor must sit ABOVE the\
  \ ordinary iteration band. On this repo's journal over 2026-08-21..28 —\n    the\
  \ FREEZE week, i.e. the unfavourable case — still-unlanded refusals per branch in\
  \ a trailing\n    24h run: 106 branches never exceed 1, then 50 reach 2 or more,\
  \ 28 reach 3 or more, 18 reach 4\n    or more. The three-attempt convergence band\
  \ dominates; 4 is the first value clear of it and\n    one BELOW the smaller of\
  \ the two shapes that proved the gap (five aborts, seven aborts), so\n    the line\
  \ arrives while the burn is still worth interrupting rather than after it has\n\
  \    completed. Exposed as `YITC_DEBT_BRANCH_BURN_MIN_ATTEMPTS`, FLOORED AT 2 (a\
  \ single unlanded\n    attempt is not a repeat at all), so the knob can only ever\
  \ make the line LESS eager.\n    **THE WINDOW IS RULE 26's, REUSED AND NOT RE-DECLARED**\
  \ — `_ABORT_BREADTH_WINDOW_HOURS` /\n    `YITC_DEBT_ABORT_BREADTH_WINDOW_HOURS`\
  \ (24h). The two folds are transposes of ONE reading met\n    by the same reader\
  \ at the same seam, and a second horizon would mean a reader holding two.\n    Measured\
  \ free besides: at N=4 the reading barely moves between a 12h and a 24h horizon.\n\
  \    **A LANDED BRANCH STOPS BEING REPORTED — this is what the word UNLANDED buys.**\
  \ Attempts are\n    counted only AFTER the branch's most recent SUCCESSFUL land\
  \ inside the window: a branch whose\n    attempts reached main is provably not burning\
  \ now. A fold predicate, never a gate — the exact\n    analog of rule 26's \"the\
  \ row drops by itself once the cause stops recurring\".\n    **POSTURE — the load-bearing\
  \ half.** Rides rules 2/3/5 verbatim: suppressed-when-clean,\n    report-only, ZERO\
  \ stored state, NO new event type, no new abort class, no new store, no new\n  \
  \  verb, no new seam, no exit code, no gate. A cause-agnostic GATE was REJECTED\
  \ by the external\n    adjudication (GREEN, zero findings, `decisions/stuck-branch-surfacing-proposal-audit-adhoc.yaml`,\n\
  \    2026-08-28) as a first move, and the reason is recorded here because it constrains\
  \ any future\n    strengthening: it would confuse stuckness with LEGITIMATE ITERATION\
  \ — a branch that first\n    resolves a merge conflict, then refreshes audit currency,\
  \ then fixes verify fallout, where\n    each abort reveals real forward progress.\
  \ That is what `task/` did before landing on\n    its sixth attempt. If ever built,\
  \ advisory before enforcement.\n    **THE WEAK FILTER, STATED RATHER THAN DRESSED\
  \ UP.** CHARTER §P1 filter 3 is weak here: no code\n    is removed. The same adjudication\
  \ judged that \"weak but not fatal\" — this is a report-only\n    second projection\
  \ of an existing fold over already-emitted events, and what it removes is the\n\
  \    MANUAL JOURNAL INSPECTION a human did by eye on 2026-08-28 to establish the\
  \ premise above. No\n    deletion is invented to make the filter look stronger.\n\
  \    **DISTINCT FROM THE ROUTING HALF, which is out of scope.** Routing may send\
  \ a branch\n    solo after repeated rides, but it creates no explicit stuck signal,\
  \ preserves no cross-cause\n    evidence, and does not help notice a branch that\
  \ keeps failing SOLO for changing reasons.\n    Unit tests (`tests/test_stuck_branch_unlanded_attempts_surfacing.py`):\
  \ two tripwires, one per\n    atom — the line-and-what-it-carries atom (AC1+AC2)\
  \ and the report-only atom (AC3), both\n    DIFFERENTIAL against a pre-change baseline\
  \ copied INLINE, never a moving ref.\n\n36. **A `ready` CARD BLOCKED FOREVER BY\
  \ A `wont-do` REQUIREMENT — the permanently-unpickable set\n.** An OPTIONAL injected\
  \ report-only fold over `tasks/` alone\n    (`debt.unpickable_ready_cards`), wired\
  \ at the ONE shared host residue like every sibling and\n    riding all seams (session-start\
  \ / the `debt` re-fold).\n    **SUBJECT.** A card whose own status is `ready` and\
  \ whose `requires:` names an id whose card,\n    in THIS checkout, is `wont-do`.\n\
  \    **THE GAP.** `requires:` is the picker's BLOCKING edge — a card is pickable\
  \ only once every id\n    it requires is DONE — and `wont-do` is the OTHER terminal\
  \ status, terminal in the direction\n    that NEVER satisfies: the required work\
  \ was decided against. Such a card can therefore never be\n    picked, while reading\
  \ `ready` at every surface that folds card status; measured 2026-08-30, no\n   \
  \ lens read `requires:` at all and `wont-do` appeared in this module only in\n \
  \   `TERMINAL_CARD_STATUSES`.\n    **WHY THE PICKER'S OWN REFUSAL DOES NOT COVER\
  \ IT — the load-bearing part.** The picker refuses\n    the card at SELECTION, correctly,\
  \ and says so to whoever asked. But nobody asks: a card that is\n    never selected\
  \ is never refused, so the refusal is reachable only along the path the blockage\n\
  \    makes nobody take. The debt seam is the surface a controller passes ANYWAY,\
  \ which is what makes\n    it the one that can say this unprompted.\n    **IT CLAIMS\
  \ ONLY WHAT IT CAN PROVE — fail-closed toward SILENCE, and the asymmetry with rule\
  \ 18\n    is deliberate.** A required id whose card is ABSENT, unreadable, malformed,\
  \ not id-shaped, or\n    carrying any other status contributes NOTHING. Absence\
  \ is the ORDINARY state of an id a\n    checkout has not got, and the claim this\
  \ line makes is strong («this can never be picked»), so\n    it is made only where\
  \ a `wont-do` card is sitting right there — otherwise every consumer repo\n    and\
  \ every fixture tree would nag. Rule 18's opposite posture (every uncertainty KEEPS\
  \ the row)\n    belongs to a view whose subject is a stopped worker awaiting a decision;\
  \ here an uncertain read\n    would manufacture a permanence nobody can verify.\n\
  \    **THE REMEDY IS A DECISION, NEVER A SWEEP, and the line says so.** Two honest\
  \ exits — DROP the\n    dead `requires:` edge if the requirement turned out not\
  \ to be needed, or CLOSE the card itself\n    `wont-do` if it was the point. Which\
  \ one applies is a judgement about the WORK, so the view\n    names the pair and\
  \ picks neither. It never suggests deleting the edge to make the row go away:\n\
  \    that re-admits the card to a queue nothing has re-justified.\n    **SURFACING\
  \ IS NOT PICKING** (SPEC-0085 §8): it names the STUCK cards — the opposite of naming\n\
  \    a candidate — ranks nothing and selects nothing. Report-only, suppressed-when-clean,\
  \ UNFLOORED\n    (one card stuck forever is debt at count 1, and count-hiding it\
  \ restores the silence the rule\n    ends), zero stored state, NEVER gates. A repo\
  \ with no `tasks/` folds to a clean zero, so\n    history is never retro-charged\
  \ (SPEC-0149 §2 — pure: files in, no clock, no subprocess).\n\n35. **A DECLARED\
  \ `subject_globs:` SUBJECT WHOSE SUITE FILE IS EXECUTED BY NOTHING — the EXECUTION\n\
  \    axis of subject-scoping.** An OPTIONAL injected report-only fold over the ops\
  \ CARRIER\n    plus the CHECKOUT (`debt.unexecuted_subject_files`), wired at the\
  \ ONE shared host residue like\n    every sibling and riding all seams (session-start\
  \ / the `debt` re-fold).\n    **SUBJECT.** A suite file that (a) is one of this\
  \ consumer's DECLARED test probe files, (b) is\n    matched by some EXECUTABLE layer's\
  \ declared `subject_globs:`, and (c) is named NOWHERE in the\n    UNION of those\
  \ layers' execution registries. Declared, therefore believed covered; named by\n\
  \    nothing, therefore run by nothing.\n    **THE MEASURED INCIDENT (X-0860, <project>,\
  \ 2026-08-13).** `task test --run` printed PASS while\n    two declared test files\
  \ were executed by NOTHING, and four mutation-verified tripwires shipped\n    through\
  \ `land` believing they were gated. A false GREEN is the worst failure shape there\
  \ is,\n    because its absence and its success are indistinguishable from outside.\n\
  \    **THE REALM IS KERNEL, AND THE INVARIANT IS NARROWED TO THE PLACEMENT CONSULT'S\
  \ WORDING**\n    (`decisions/verify-layer-execution-check-placement-audit-adhoc.yaml`,\
  \ YELLOW, 2026-08-30, both\n    findings absorbed): the kernel DEFINES `verify.layers[].subject_globs`\
  \ and EMITS the verdict, so\n    it owns preventing a false GREEN over its own declared\
  \ contract — «a kernel PASS must not include\n    declared subject_globs with ZERO\
  \ observed execution». **Project-specific ADEQUACY thresholds —\n    how much coverage\
  \ is enough — stay with the CONSUMER, and that bound is load-bearing:** without\n\
  \    it the same argument pulls an unbounded class of consumer-side verification\
  \ into the kernel,\n    which the consult explicitly warned against. The bound is\
  \ STRUCTURAL, not a promise — the fold's\n    only inputs are the carrier and the\
  \ file NAMES, so it holds no coverage figure, assertion count\n    or size through\
  \ which an adequacy judgement could enter.\n    **THE THIRD PROJECTION OF ONE SUBJECT-SCOPING\
  \ READING, NOT A NEW MECHANISM.** Rule 16's carrier\n    line (`undeclared_subject_layers`)\
  \ asks «is a subject DECLARED?»; its observed line\n    (`zero_skip_verify_layers`)\
  \ asks «does the layer ever actually SKIP?»; this asks «is\n    what the subject\
  \ CLAIMS actually run?». The first two report a COST (a layer running more often\n\
  \    than it needs to); this reports owed WORK (a file believed covered and executed\
  \ by nothing).\n    **NOTHING IS RE-IMPLEMENTED — the reuse IS what keeps consumer\
  \ assumptions out of kernel code.**\n    Glob matching is the land seam's own `worktree._subject_globs_would_skip`,\
  \ so the view can never\n    disagree with the mechanism it reports on; the registry\
  \ walk is `worktree._registry_text`; the\n    «where are this consumer's suites»\
  \ answer is `worktree._declared_test_sweep_probe_files`\n    (SPEC-0185 SS1 — a\
  \ DECLARATION, never a kernel `tests/` literal); and the naming predicate is\n \
  \   `worktree._registry_names_file`, EXTRACTED by this rule from the former nested\
  \ closure in\n    `_delegated_tests_execution_gap` so both X-0860 axes share ONE\
  \ definition of «named» and cannot\n    drift (CHARTER §P1 F1 — extend, never parallel).\
  \ <project>'s `tests/test_declared_vs_executed.py`\n    is the prior art; its `SUITE_DIR\
  \ = \"tests\"`, its `bash <script>` regex and its `*_acceptance.py`\n    convention\
  \ are deliberately NOT carried over.\n    **DISTINCT FROM THE `covers:` AXIS, which\
  \ is not superseded.** That check asks\n    the same question on the `covers:` declaration\
  \ and fires ONLY on the delegation route — where\n    `task test --run` hands its\
  \ tests sweep to a layer whose `covers:` glob claims the test dir — and\n    renders\
  \ only inside that skip note. A consumer declaring its suites on `subject_globs:`\
  \ with no\n    delegation firing is not reached by it at all. The overlap is deliberate\
  \ and bounded, exactly as\n    rule 16's two lines overlap.\n    **WHAT IS ACTUALLY\
  \ PROVABLE, and the wording that must not be laundered in EITHER direction.**\n\
  \    There is no generic execution ledger — a layer is an arbitrary command — so\
  \ this asks the NARROW\n    provable question, «does any registry NAME this file?»,\
  \ never «was it executed». Equally, a clean\n    read is NOT proof that a file ran:\
  \ a comment or a dead branch can name a file that never runs.\n    **ONE KNOWN BOUND,\
  \ IN THE CONSERVATIVE DIRECTION AND STATED RATHER THAN HIDDEN:** the shared\n  \
  \  registry reader does not strip comments, so a COMMENT mentioning a suite file\
  \ suppresses the\n    finding for it. That is silence, never a false accusation,\
  \ and it is the ALREADY-SHIPPED\n    `covers:` axis's behaviour too — so tightening\
  \ it is a separate decision with its own evidence\n    (filed as a followup), not\
  \ a quiet widening. The unit test MEASURES this bound rather than\n    avoiding\
  \ it.\n    **THE DISCOVERY SHAPE — the branch that makes the list trustworthy.**\
  \ If the union registry names\n    NO candidate at all, the consumer runs a DISCOVERY\
  \ runner (`pytest tests/`) whose executed set\n    cannot be read file-by-file;\
  \ a per-file claim there would accuse every suite in the repo. So that\n    case\
  \ yields count 0 and NO claim. The list is non-empty ONLY where the layers demonstrably\n\
  \    ENUMERATE their suites — i.e. only where a gap is real and reportable.\n  \
  \  **FAIL-SAFE DIRECTION IS INVERTED RELATIVE TO A GATE, deliberately** — this is\
  \ a report-only\n    SIGNAL about a reader, so every unanswerable state (missing/unreadable/malformed\
  \ carrier, a\n    section or layer waiver, no declared subject, no candidate, any\
  \ swallowed exception) resolves to\n    the reading that does NOT accuse (`lessons/a-signal-about-a-reader-fails-safe-the-opposite-way-to-a-gate.md`):\n\
  \    one false accusation gets the whole echo skimmed, while a missed detection\
  \ only leaves the\n    silence that already existed. A repo with no carrier — the\
  \ engine kernel itself — folds to 0, so\n    history is never retro-charged (the\
  \ SPEC-0149 lesson).\n    **ROLLOUT IS REPORT-ONLY BY CONSTRUCTION, answering the\
  \ consult's finding 2** (an immediate hard\n    gate would redden the whole fleet\
  \ at once): a debt view returns a dict rendered into an echo that\n    nothing reads\
  \ for a verdict, so NO consumer's PASS can become a FAIL through this rule. Promotion\n\
  \    to enforcement, if ever, is a separate decision with its own evidence.\n  \
  \  **POSTURE.** Rides rules 2/3/5 verbatim: suppressed-when-clean, ZERO stored state,\
  \ NO new event\n    type, no new store, no new verb, no new seam, no knob, no exit\
  \ code, no gate. UNFLOORED — one\n    declared-but-unexecuted file is already the\
  \ whole defect. Names the FILES, not a bare count: the\n    remedy is per-file.\n\
  \    **CHARTER §P1 FILTER 3, STATED PLAINLY.** What this removes is N consumer-local\
  \ reimplementations\n    of the same comparison (<project> already carries one)\
  \ and the blind spot in false-PASS verdicts on\n    the subject_globs axis; it also\
  \ removes a duplicated naming predicate by extracting it. No further\n    deletion\
  \ is invented to make the filter look stronger.\n    Unit tests (`tests/test_t11886_unexecuted_subject_files.py`):\
  \ the DIFFERENTIAL is in the file, not\n    a story about it — a red leg (two suites\
  \ inside a declared subject, one named) and its green twin\n    differing by exactly\
  \ ONE line, plus the AC2 adequacy boundary proved twice (a thin-but-executed\n \
  \   fixture, and the signature carrying no adequacy input at all), the purity of\
  \ the fold, and the\n    report-only atom asserted on the real verb's exit status\
  \ in BOTH states.\n\n37. **A SEAM THAT READ MORE OF THE CORPUS THAN IT COMPOSED\
  \ — the reading moment the read counters\n    never had (plan card C3).** An OPTIONAL\
  \ injected report-only WINDOWED fold over the\n    JOURNAL (`debt.seam_read_amplification`),\
  \ wired at the ONE shared host residue like every\n    sibling and riding all seams\
  \ (session-start / the `debt` re-fold).\n    **SUBJECT.** A (project, verb) SEAM\
  \ whose PHYSICAL reads over the window exceeded its bound on\n    any of three ratios,\
  \ read straight off the `cli_invoked.data.reads` counters:\n    **folds_per_segment**\
  \ (`folds`/`artifacts` — the distinct physical journal files the row's span\n  \
  \  folded, rule 10's own \"per artifact in scope\"; a row without `artifacts` falls\
  \ back to\n    `segments`), **rows_parse_ratio** (`rows_parsed`/`rows`),\n    **card_parse_ratio**\
  \ (`cards_parsed`/`cards`). The WORST observation per seam is kept, never\n    the\
  \ mean: a seam that reads the corpus 22x once and cleanly 200 times has a mean inside\
  \ the\n    bound and a real defect, and the worst is also the only reading that\
  \ names a specific run a\n    human can go and look at.\n    **THIS IS THE READING\
  \ HALF OF SPEC-0190 RULE 10, NOT A SECOND SPELLING OF IT.** Rule 10 binds\n    the\
  \ AUTHOR — a composed seam owns ONE request-scoped ReadScope at its wiring site,\
  \ proved by\n    that seam's own differential regression. This rule binds nothing\
  \ and reads the RESULT, for the\n    seams no regression covers yet and for the\
  \ drift a passing regression cannot. The two move\n    independently: a seam can\
  \ hold its scope and still read a wider horizon than its question\n    needs, and\
  \ a seam with no regression at all still shows up here.\n    **WHY IT WAS RENDERED\
  \ NOWHERE, and it is not an oversight to sneer at.** shipped the\n    counters onto\
  \ a row that is already emitted once per verb, correctly and cheaply — and then\n\
  \    nothing read them back. That is the same silence the sibling rules 29/30/33\
  \ each ended: a\n    mechanism recording faithfully into a payload with no reader\
  \ is indistinguishable, from\n    outside, from a mechanism that was never built.\
  \ The cost is not hypothetical: session\n    start ran **383 s**, of which **378\
  \ s** was ~20 whole-corpus passes; the engine's `debt`\n    measured **2,052 physical\
  \ segment reads over 93 segments (22x)** and **11.1M `json.loads` over\n    ~596k\
  \ rows**; <project> under `-C` measured **27x on the same code**. Every one of those\
  \ was\n    found by a HUMAN WAITING. Rule 10 makes the next one a test failure;\
  \ this rule makes the\n    current one a LINE, at the three moments a controller\
  \ already reads before acting.\n    **THE VIEW MUST ITSELF PASS THE BOUND IT REPORTS,\
  \ and this is a construction requirement rather\n    than an aspiration.** The fold\
  \ reads through the INSTRUMENTED primitives\n    (`journal.segment_rows`, the memoised\
  \ `state.load_path`), both of which a ReadScope serves — so\n    inside the wiring\
  \ site's scope it performs NO physical read of its own. The card-side join\n   \
  \ resolves closed cards BY ID off the fold's own `task_closed` rows and loads them\
  \ one at a time;\n    a whole-corpus `tasks/*.yaml` glob would be *conformant* with\
  \ the bound (one parse per card)\n    and would still parse ~3,300 cards to name\
  \ a handful. Rule 10 is a ceiling, not a licence.\n    **`measured` AND `count`\
  \ ARE BOTH REPORTED, AND THE SPLIT IS THE HONESTY OF THE RULE.**\n    `measured`\
  \ is how many seams carried usable counters at all, computed BEFORE the within-bound\n\
  \    seams are dropped; `count` is the amplified subset. Without the split a CLEAN\
  \ corpus and an\n    UNINSTRUMENTED one both fold to `count: 0`, and no downstream\
  \ reader can tell \"every seam is\n    within bound\" from \"nothing here has ever\
  \ been measured\" — the CHARTER §P3 «presence ≠ absence»\n    fault, in the one\
  \ place it would be invisible. The SPEC-0105 nightly leg decides its\n    **`no\
  \ counters`** verdict on `measured` ALONE for exactly this reason, and reports it\
  \ as its own\n    answer: never `ok`, and never a fabricated ratio of 1.0.\n   \
  \ **THE BOUND, AND WHY IT IS 1.05 RATHER THAN 1.0.** Rule 10's bound is one physical\
  \ fold per\n    segment in scope, and a real process legitimately reads a little\
  \ more than the scope it\n    composes — a fetch-receipt tail scan, a segment appended\
  \ mid-request, a point-read of one card\n    outside the memo. A bound of exactly\
  \ 1.0 would fire on those and teach its reader to skip the\n    line, which is how\
  \ a signal in this repo actually dies. What 1.05 cannot absorb is a SECOND\n   \
  \ PASS over the corpus: the shapes this exists to catch measured 22x and 27x, not\
  \ 1.02x.\n    **RED at 2.0 on the seams a human WAITS on** (session start / land\
  \ / `debt`) is recorded as a\n    constant beside the bound so this fold and the\
  \ roster's T4.P6 probe cannot drift on the number;\n    the fold MARKS such a seam\
  \ and grades nothing — what to do about a RED is the roster's\n    judgement and\
  \ the owner's, never this view's.\n    **THE DECLARED EXEMPTION IS HONOURED HERE,\
  \ WHICH IS WHAT MAKES IT AN EXEMPTION.** A seam that\n    genuinely cannot hold\
  \ the bound declares it in `yitc-ops.yaml reads.exemptions[]` — all four of\n  \
  \  `seam`/`ratio_bound`/`reason`/`until`, fail-closed, shape-validated at its one\
  \ home\n    (`init.py#_hook_reads_exemptions`, SPEC-0160 rule 25). That hook's own\
  \ record says this surface\n    \"has NO reader that fails visibly... a half-registered\
  \ entry would be inert AND invisible\".\n    This fold is that reader: it raises\
  \ THAT seam's bound to the declared `ratio_bound`, matching\n    the seam label\
  \ EXACTLY (prefix-matching `land` would silently exempt a family nobody wrote an\n\
  \    entry for) and falling back to the default on any entry it cannot use — an\
  \ unusable exemption\n    must never read as a wider bound. Absence reads as \"\
  this project exempts no seam\".\n    **WINDOWED (7d) so the line DECAYS INTO SILENCE\
  \ once a seam's scope is fixed**, instead of\n    standing as a monument to a seam\
  \ repaired a month ago — the rule-14 / rule-27 / rule-33\n    discipline. Seven\
  \ is READ from the subject rather than decreed: SPEC-0190's own\n    `JOURNAL_LIVE_WINDOW_DAYS`\
  \ is 7, so the fold is answerable from the LIVE segment on an ordinary\n    corpus.\
  \ A view about read amplification that itself required an archive walk would be\
  \ its own\n    first finding. It is a REPORTING window only: nothing expires, the\
  \ rows stay forever.\n    **THE INSTANCE-FIX JOIN NAMES WORK, NOT A VERDICT (the\
  \ plan's F2).** Beside the seams, the line\n    names cards closed in the window\
  \ whose OWN `expected_touch` declares the debt/echo view surface\n    — derived\
  \ from the card's declaration joined to the journal's `task_closed` rows, with NO\
  \ human\n    tag, because a tag is the step this repo has repeatedly watched go\
  \ unmade. It says work was\n    landing ON this surface while it was over bound;\
  \ it does NOT say each card was an amplification\n    fix, and the line says so\
  \ out loud. Read it for the SHAPE: a class paid off one instance at a\n    time\
  \ is asking for a rule, which is the roster's T5 escalation. `lib/views.py` is deliberately\n\
  \    OUTSIDE the join — it is the shared renderer for every lens in the system,\
  \ so including it\n    named 52 cards on the engine's own week, which is not a class,\
  \ it is the week's closures.\n    **POSTURE — and this fence is the load-bearing\
  \ half.** Rides rules 2/3/5 verbatim:\n    suppressed-when-clean, report-only, ZERO\
  \ stored state, NO new event type, no new store, no new\n    verb, no new seam,\
  \ no exit code, no gate. It NAMES A COST AND PROPOSES NO CACHE: the remedy is\n\
  \    the seam's ONE ReadScope at its wiring site, or a narrower horizon/slice. A\
  \ cache bolted onto a\n    view inside a composed seam is a proposal to SKIP rule\
  \ 10 — the very rule this reports — so the\n    line must never appear to suggest\
  \ one. A repo whose seams are all within bound ⇒ 0 ⇒\n    suppressed; a repo that\
  \ has measured nothing says so rather than going quiet.\n    **AUDIENCE — under\
  \ `-C` the line is the KERNEL's cost (GitHub #5).** Every seam it\n    measures\
  \ is a `bin/yitc-v2` verb, i.e. engine code, so in a consumer session (the canonical\n\
  \    `_is_consumer_build`, never a bare root compare) it keeps the count/worst/ratio\
  \ facts but drops\n    the BLOCKING verdict, the instance-fix join and the wiring-site\
  \ remedy, and says plainly there is\n    nothing to do in the project — `reads.exemptions[]`\
  \ would only silence a cost it did not cause.\n    The engine's own rendering is\
  \ unchanged.\n    Unit tests (`tests/test_t12037_amplification_surfaces.py`): all\
  \ three closure-provable ACs,\n    each DIFFERENTIAL — the roster rows asserted\
  \ against their absence; the SAME fixture journal\n    rendered at 3.0x (names the\
  \ seam and the ratio) and at 1.0x (prints nothing); and the nightly's\n    two zero-count\
  \ shapes proved DISTINGUISHABLE — a project with no `reads` rows grading `skip`\
  \ /\n    `no counters` beside a clean one grading `ok` / `counters: true`, so the\
  \ honesty claim is\n    exercised rather than asserted.\n\n38. **THE NIGHTLY'S READER\
  \ — verdict CHANGES vs the previous night, and a dated line for each\n    chronic\
  \ condition (fu_7c82f8a69c15, owner ask 2026-09-04).** An OPTIONAL injected\n  \
  \  report-only fold over the JOURNAL (`debt.nightly_verdict_changes`), wired at\
  \ the ONE shared\n    host residue like every sibling and riding all seams (session-start\
  \ / the `debt`\n    re-fold).\n    **SUBJECT.** The last TWO `nightly_run_completed`\
  \ rows (SPEC-0105 — the bounded nightly's one\n    per-run record, carrying `data.results[]`,\
  \ one entry per registry project, each holding ~16\n    per-check sub-dicts with\
  \ a `verdict`). The view reports, per project, WHICH CHECKS FLIPPED AND\n    FROM\
  \ WHAT TO WHAT since the night before.\n    **WHY IT EXISTS: THE ROW HAD NO READER,\
  \ AND THIS IS MEASURED, NOT ALLEGED.** The nightly has\n    run daily at 23:00 and\
  \ written that row every night; `grep nightly_run_completed\n    bin/lib/debt.py`\
  \ returned **zero hits** until this rule. A fleet-wide governance report existed\n\
  \    in the journal and reached no seam a session opens — the same silence rules\
  \ 29/30/33/37 each\n    ended, on the largest payload of the five. A mechanism recording\
  \ faithfully into a payload with\n    no reader is indistinguishable, from outside,\
  \ from one that was never built.\n    **CHANGES, NOT STATE — the design decision\
  \ the rule turns on.** The row's own headline read\n    `projects_flagged=11/11`\
  \ EVERY night from 2026-08-31 onward, because two chronic conditions\n    paint\
  \ every project the same colour; the real movers (queue=warn on <project>/<project>,\n\
  \    freshness=alert on <project>, no_local_diff=alert on three) were invisible\
  \ underneath. A view\n    that re-printed the flag would re-print that saturation\
  \ and be skimmed within a week. What a\n    controller can act on is what MOVED.\
  \ Measured on the engine's own journal for the\n    2026-09-03→2026-09-04 pair:\
  \ the flag says 11/11, this view says **three** projects moved and\n    names the\
  \ five checks that did.\n    **THE TWO CHRONIC CONDITIONS ARE SPLIT OUT, NOT DROPPED\
  \ (`NIGHTLY_CHRONIC_CHECKS` =\n    `corpus` / `born_waivers`).** They are EXCLUDED\
  \ from the per-project change line — a condition\n    present every night contributes\
  \ only ok↔stale noise to a differential — and each gets ONE DATED\n    line carrying\
  \ its count, the FIRST NIGHT of its CURRENT UNBROKEN SPELL, and a NAMED REMEDY\n\
  \    (`NIGHTLY_CHRONIC_REMEDY`): corpus staleness → fix the `stale_root` cause the\
  \ row already names,\n    then `graph build` in that project; born-waiver placeholders\
  \ → the `init --backfill-mandatory`\n    expiry sweep, disposing of each rather\
  \ than re-stamping. **NAMING the remedy is this rule's\n    whole scope; PERFORMING\
  \ either is explicitly not** — nothing here runs, schedules or offers to\n    run\
  \ anything, and each remedy is its own card. The spell is dated by walking BACKWARDS\
  \ to the\n    first night the condition was absent, which is what makes the line\
  \ dated rather than aged: a\n    bare \"chronic for 5 days\" names nothing a reader\
  \ can go and look at and silently re-starts its\n    own clock on every fold, and\
  \ a condition that cleared and returned is honestly dated from its\n    RETURN,\
  \ because the older spell is over.\n    **THE CHRONIC VERDICT IS AN EXACT MATCH,\
  \ NEVER \"not ok\" (`NIGHTLY_CHRONIC_VERDICT`).** A check\n    reading `skip` or\
  \ `none` — not adopted, nothing to judge — is NOT the condition, and folding it\n\
  \    in would count an UNMEASURED project as an afflicted one. That is the CHARTER\
  \ §P3 «presence ≠\n    absence» fault the sibling rule 37 names in its own `measured`/`count`\
  \ split, in the one place\n    it would be invisible.\n    **A FIRST SIGHTING IS\
  \ NOT A FLIP — for CHECKS as well as PROJECTS, and the second half is the\n    one\
  \ measured in production.** Only projects present in BOTH nights are compared (a\
  \ project that\n    joined the registry today has no previous verdict set to have\
  \ changed against, and reporting\n    its whole set would make every registry addition\
  \ read as a fleet-wide incident), and within\n    them only checks present in both.\
  \ The check half is not hypothetical: on the night\n    landed, its newly-shipped\
  \ `seam_reads` check appeared on all 11 projects at once — a union\n    comparison\
  \ reported 11 changed projects, which is a RELEASE NOTE wearing the costume of an\n\
  \    incident. With fewer than two rows the change line and the chronic lines say\
  \ NOTHING: a first\n    night has no yesterday, and the honest answer to «what changed»\
  \ is silence, never «everything».\n    **IT READS THROUGH THE INSTRUMENTED PRIMITIVE\
  \ AND PROPOSES NO CACHE.** `journal.segment_rows`\n    is the segment-aware fold\
  \ (rule 4 of SPEC-0190 — the WHOLE logical journal; a raw read of the\n    journal\
  \ PATH sees the live segment alone and would report an older night as absent) and\
  \ is one\n    of the two readers a request-scoped ReadScope serves (SPEC-0190 rule\
  \ 10), so inside the wiring\n    site's scope this view performs NO physical read\
  \ of its own. Only the VERDICT MAP of each night\n    is retained, plus the raw\
  \ `results` of the last two rows for the chronic detail — holding 111\n    nights\
  \ of full payload to answer a question about the last one would be the very amplification\n\
  \    the sibling rule 37 reports. A cache on a view inside a composed seam is a\
  \ proposal to skip\n    rule 10, so this view must never appear to suggest one.\n\
  \    **NO WINDOW, DELIBERATELY** — unlike its windowed siblings this fold compares\
  \ the last two rows\n    whenever they were written. A fleet whose nightly STOPPED\
  \ RUNNING therefore keeps reporting the\n    last real comparison rather than going\
  \ quiet exactly when something is wrong; a 7-day window\n    would convert a broken\
  \ scheduler into silence, which is the failure mode this rule exists to\n    end\
  \ rather than to reproduce.\n    **A `failed` ENGINE QUIET-LANE READING GETS A DATED\
  \ LINE OF ITS OWN (ADDITIVE).**\n    The same row carries the engine quiet lane's\
  \ readings (SPEC-0105 §2c — the wall-clock\n    instruments SPEC-0077 §3b moved\
  \ off the per-land verify), and that block had no reader either:\n    the nightly\
  \ reported a failed reading on its own stdout and nowhere a session looks. Measured\n\
  \    on the engine's own journal: the journal-length-coupling instrument recorded\
  \ `failed` on every\n    night from 2026-09-13 to 2026-10-02 and reached no seam.\
  \ So this view ALSO reports, per engine\n    quiet-lane instrument whose LATEST\
  \ reading is `failed`, ONE line naming the instrument, the\n    FIRST NIGHT of its\
  \ CURRENT UNBROKEN failed spell, the night count, and the FIRST LINE of the\n  \
  \  reason that night recorded. The spell is dated by the SAME backwards walk as\
  \ a chronic\n    condition, so a spell that cleared and returned is dated from its\
  \ RETURN.\n    WHAT `failed` MEANS, AND WHAT THE LINE MAY CLAIM. `failed` is the\
  \ lane's verdict for an\n    instrument that exited non-zero, was killed at the\
  \ lane's bound, or could not be run. It\n    therefore covers TWO different facts\
  \ — an instrument that never measured, and one that\n    measured and failed its\
  \ own assertion — and the line asserts NEITHER: it says the timing\n    assertion\
  \ has had no passing reading for the spell, and leaves the telling-apart to the\n\
  \    recorded reason it quotes. (The measured spell above was the first kind: it\
  \ raised before\n    measuring.) Either fact is worth the line, because this lane\
  \ is the only place that assertion\n    runs.\n    `failed` IS AN EXACT MATCH, on\
  \ the terms of the chronic verdict above: a `skipped` reading (the\n    host was\
  \ not quiet, so nothing was measured) and a night carrying no reading for the instrument\n\
  \    are UNMEASURED nights — each ENDS a spell and neither starts one. SUPPRESSED\
  \ the first night the\n    latest reading is anything but `failed`: the line reports\
  \ a current failed reading, not a\n    history. IT NEEDS NO YESTERDAY — unlike the\
  \ change line, it prints on a single row, because a\n    `failed` reading is a fact\
  \ about that night and not a comparison. OUT OF THIS LINE,\n    deliberately: an\
  \ `ok` reading flagged `regression` (a passing run slower than its baseline — a\n\
  \    different verdict) and the per-project lanes (a different subject on the same\
  \ row). It reads\n    the rows the fold already iterates — no further read, no cache\
  \ — and names no remedy, because\n    the remedy for a failed reading is whatever\
  \ its recorded reason says.\n    **POSTURE.** Rides rules 2/3/5 verbatim: suppressed-when-clean,\
  \ report-only, ZERO stored state,\n    NO new event type, no new store, no new verb,\
  \ no new seam, no knob, no exit code, no gate. The\n    per-project count, the chronic\
  \ lines and the quiet-lane lines are INDEPENDENT: a fleet where\n    nothing moved\
  \ but the chronic conditions persist still says so, and a fleet that is wholly clean\n\
  \    says nothing at all.\n    **CHARTER §P1 FILTER 3, STATED PLAINLY.** What this\
  \ removes is the standing condition that\n    `nightly_run_completed` is written-and-unread,\
  \ and with it the 11/11 flag as the only fleet\n    reading anyone had. No further\
  \ deletion is invented to make the filter look stronger.\n    Unit tests (`tests/test_nightly_reader_debt_line.py`):\
  \ all three closure-provable ACs, each\n    DIFFERENTIAL — one project moving out\
  \ of three (identical nights and a single-row journal both\n    printing NOTHING);\
  \ the two chronic lines dated from a spell that starts mid-fixture (a night\n  \
  \  pair carrying neither condition printing neither line, and a project flipping\
  \ ONLY `corpus`\n    stale→ok staying OUT of the change line — the leg that catches\
  \ a split that merely renamed the\n    chronic checks); and the wiring asserted\
  \ in the residue's own source slice, where a fold wired\n    only into `debt` would\
  \ not appear. The quiet-lane line, likewise DIFFERENTIAL: one\n    `ok` night then\
  \ three `failed` nights rendering exactly ONE line that names the instrument,\n\
  \    the first failed night, the count and the reason's first line (the pre-change\
  \ reader rendering\n    none); a latest night reading `ok` rendering none; a spell\
  \ broken by an `ok` night dated from\n    its return; and a `skipped` or absent\
  \ reading ending a spell without starting one.\n\n39. **THE BROWNFIELD GAP REGISTER\
  \ — what this project's own derived profile REQUIRES and its own\n    carrier does\
  \ not answer (SPEC-0198 rules 5+7).** An OPTIONAL injected report-only\n    fold\
  \ (`debt.profile_gap_register`), wired at the ONE shared host residue like every\
  \ sibling\n    and riding all seams (session-start / the `debt` re-fold).\n    **SUBJECT\
  \ — ONE DATED ROW per profile-required baseline item the project does not meet.**\
  \ The\n    required set is DERIVED, never asked for: the lenses `profile.required_check_set`\
  \ activates\n    (SPEC-0198) name the SPEC-0100 baseline items, and each item names\
  \ the SPEC-0093 concern\n    section whose answer would meet it — and, where the\
  \ item is one of several asked of the SAME\n    section, the KEY within it (`carrier_key`).\
  \ An item is UNMET when the thing that\n    would answer it — that section, or that\
  \ key within it — is absent, empty or unanswered.\n    PER-KEY GRANULARITY IS NOT\
  \ COSMETIC: while every item sharing a section answered at the\n    SECTION, ONE\
  \ declared key cleared ALL of them, so a live carrier that declared a health\n \
  \   endpoint was never again asked what happens to its logs. A reasoned `waiver:`\
  \ on the SECTION\n    still answers every key under it — rule 1 is a section-level\
  \ stance, and without that\n    inheritance this granularity would retro-create\
  \ debt for every born-waived consumer, the\n    SPEC-0149 §1 harm this fold exists\
  \ not to do. A per-key `waiver:` answers just its own key,\n    and a SCALAR section\
  \ names no key, so it answers no per-key item. AND A DECLARATION THAT\n  FALLS SHORT\
  \ OF THE SHAPE ITS CONCERN REQUIRES IS NOT AN ANSWER: where a concern imposes a\n\
  \  shape on a key, this fold DEFERS to that concern's own predicate rather than\
  \ re-deriving\n  it, so the birth-time check and this register cannot disagree about\
  \ what counts\n  (`debt._GAP_SHAPED_ANSWER_KEYS` names WHERE to ask, never what\
  \ the answer is — CHARTER\n  §P5). Shipped as two independent readings they DID\
  \ disagree: SPEC-0164's hook refused a\n  half-declared `slo:` at birth while this\
  \ fold counted it adopted, so the obligation\n  vanished while the declaration was\
  \ still broken. A concern that cannot be\n  consulted leaves the item UNMET, never\
  \ adopted — the same fail-SAFE direction every other\n  reading here takes. A repo\
  \ with NO `yitc-ops.yaml` registers NOTHING, the `declared_checks`\n    no-retro-nag\
  \ discipline (SPEC-0149 §1); the engine kernel itself registers nothing either —\
  \ it is\n    excluded by identity, not a consumer of its own ops contract (SPEC-0186\
  \ rule 6).\n    **NO NEW STORE. The row's carrier is the EXISTING followup/task\
  \ link.** The dedupe key\n    (`dimension + item id`, SPEC-0198 rule 7) rides the\
  \ followup's existing `fingerprint` field\n; the row's DATE is the `ts` of its own\
  \ `followup_added` event. Nothing here adds a\n    store, an event type, an FSM,\
  \ a schedule or a gate.\n    **TERMINAL STATES — `adopted | adapted | waived | out-of-scope\
  \ | task-linked`.** A row in ANY\n    of them LEAVES the count. The first four are\
  \ read from the carrier's own words (a declaration\n    is `adopted`, a declaration\
  \ naming its own divergence is `adapted`, a waiver is `waived`, or\n    `out-of-scope`\
  \ when its reason says the surface does not exist). `task-linked` REQUIRES A\n \
  \   RESOLVABLE T-id — an absent, malformed or unresolvable id is NOT terminal and\
  \ the row keeps\n    its place. That direction is deliberate: a register whose rows\
  \ may leave the count pointing at\n    a task nobody can open is where obligations\
  \ go to disappear.\n    **TRIAGE WINDOW — HALF-OPEN [0, 14) DAYS.** A filed row\
  \ aged under 14 days is `within-triage`;\n    at or beyond it, `overdue-triage`,\
  \ named in ONE trailing clause on the same line. An UNFILED\n    item has no date\
  \ and is never overdue. The window informs; it gates nothing.\n    **THE LINE IS\
  \ CAPPED, AND THE CAP IS THE RULE.** ONE summary line: the count, the TOP TWO\n\
  \    labels by the single deterministic order (`debt.gap_rank` — risk-ordered lens,\
  \ `item_id`\n    tie-break), and a pointer. NEVER one line per item. A project with\
  \ twenty gaps costs the same\n    two lines of attention as one with three; an uncapped\
  \ register is what made the design this\n    rule replaces unusable. Suppressed-when-clean\
  \ like every sibling.\n    **A LONE `task:` POINTER IS NOT AN ANSWER — it is what\
  \ makes the armed fork reachable.** A\n    carrier section whose only content is\
  \ `task: T-NNNN` says \"we have NOT met this yet; that\n    card is doing it\":\
  \ the item STAYS in the register, and the writer arms its followup on that\n   \
  \ id. Counting the pointer as a declaration would close the row on a promise and\
  \ leave nothing\n    waiting for the card. The id is read STRUCTURALLY, from that\
  \ one key, never mined out of the\n    section's prose.\n    **AUTO-FILING IS PART\
  \ OF THIS RULE, AND SO IS ITS FENCE.** At the same seams, the host files\n    ONE\
  \ followup per unmet item through `followup add`'s OWN body (the carrier shape)\
  \ —\n    deduped FOREVER by the key, bounded per RUN by `debt.GAP_AUTOFILE_CAP`,\
  \ born ARMED only when\n    the carrier section names a resolvable task id and ACTIONABLE\
  \ otherwise (SPEC-0095 §Armed).\n    It FILES AND NOTHING ELSE: no dispatch, no\
  \ audit, no deploy, no PR, no code mutation\n    (SPEC-0198 rule 5 / CHARTER §6).\
  \ Fail-open but NEVER silent — a writer that cannot write names\n    itself on stderr,\
  \ because \"nothing was owed\" and \"the writer is broken\" must not read alike.\n\
  \    **UNDER `--read-only` THE FOLD FILES NOTHING.** When the fold runs read-only\n\
  \    (`READ_ONLY_ROOT` set), this writer and the SPEC-0198 rule-7 snapshot writer\
  \ are SKIPPED and the\n    render is unchanged: their appends would land in the\
  \ READER's journal while the dedupe/latch\n    folds read the TARGET's, so a read-only\
  \ fold must stay write-free.\n    **CHARTER §P1 FILTER 3, STATED PLAINLY.** What\
  \ this removes is the identical security question\n    asked of every project regardless\
  \ of stage — the standalone `security` subject of the T6\n    inspection theme,\
  \ retired into the profile-gated production-readiness lens row\n    (`patterns/inspection-criteria-roster*.md`)\
  \ — and the unbounded gap register the cancelled\n    plan `kernel-security-baseline-seeded-into-the-spec-0100`\
  \ designed. No further deletion is\n    invented to make the filter look stronger.\n\
  \    Unit tests (`tests/test_t12085_gap_register.py`): the capped line (6 unmet\
  \ -> ONE line, count\n    6 + exactly 2 labels; clean -> nothing), the writer (one\
  \ row per item carrying its key; a\n    second run at the same seam files none;\
  \ an 11-item fixture files at most the cap; and the\n    fence proven BY ABSENCE\
  \ — no dispatch/deploy/audit row), each terminal state, the\n    unresolvable-`task-linked`\
  \ refusal, and the [0,14) boundary at 13/14/15 days — each\n    DIFFERENTIAL, with\
  \ the pre-change behaviour reconstructed inline through the same path.\n\n40. **THE\
  \ ECHO RENDER SHAPE — a compact TABLE at the two echo seams, the long text ONE VERB\n\
  \    away.** Rules 1-39 govern WHAT counts as debt; this rule governs only how the\n\
  \    result is RENDERED, and it moves no threshold, window, class or count. **The\
  \ occasion:** the\n    echo prints one dense paragraph per class — measured on this\
  \ repo 19,014 bytes over 20 lines\n    — so it arrived at every `session start`\
  \ and every land tail as several KB of prose the\n    Controller does not read (owner,\
  \ 2026-09-09: «читать нельзя»). An echo nobody reads is\n    report-only in the\
  \ worst sense: it costs the seam and delivers nothing.\n    **THE TWO ECHO SEAMS\
  \ RENDER ONE ROW PER CLASS:** `<marker>: <class> | <count> | <verb>` —\n    the\
  \ class DERIVED from the line's own head, the count the head's own first integer,\
  \ the verb\n    the FIRST `bin/yitc-v2 …` the line names. One row per non-clean\
  \ class in first-appearance\n    order, equal classes FOLDED with counts summed\
  \ (which is what collapses the per-project\n    nightly/chronic lines to one row\
  \ each), every row within `debt.DEBT_ROW_WIDTH`.\n    **A CONSUMER BUILD NAMES ITS\
  \ INVOCATION ONCE.** Where the host invocation form is\n    not bare `bin/yitc-v2`\
  \ (a consumer has no local copy), ONE prefix line above the rows names\n    the\
  \ runnable form and each row drops its leading `bin/yitc-v2 `; the engine render\
  \ stays\n    byte-identical. The form is resolved OUTSIDE the fail-open fallback,\
  \ so a failed resolution\n    never renders a bare-form table on a consumer that\
  \ cannot run it.\n    **SUPPRESSED-WHEN-CLEAN IS UNCHANGED (rule 5).** Clean in\
  \ yields clean out and the table\n    renderer prints NO header, ever — so the property\
  \ is structural, not a second thing to\n    maintain.\n    **THE LONG TEXT IS RELOCATED,\
  \ NEVER REWRITTEN — one home per rule text (CHARTER §P5).**\n    `bin/yitc-v2 debt`\
  \ BARE keeps today's FULL render unchanged: it IS the post-`/compact`\n    re-fold\
  \ (rule 5), whose whole job is to give back what the compact echo no longer prints.\n\
  \    `debt --explain <class>` returns ONE class's lines VERBATIM — the same rendered\
  \ line objects,\n    not a re-authoring — and `--explain` bare lists the classes.\
  \ Because the text returned IS the\n    text rendered, preservation is checkable\
  \ by byte-identity rather than asserted, and no class\n    can be silently dropped.\n\
  \    **NO CLASS REGISTRY.** The class slug is derived mechanically from each line's\
  \ own head\n    (parentheticals, quoted ids, digit-bearing tokens, a trailing `\
  \ for <x>` clause and stopwords\n    dropped, capped at `DEBT_CLASS_MAX_WORDS`).\
  \ A NEGATION (`no` / `not`) is never a stopword and\n    never counts toward the\
  \ cap, and each one past the cap is appended with the word it negates: dropping\
  \ it inverted the label — «does not meet» rendered «does\n    meet» — and leaving\
  \ it out of the count keeps every negation-free slug unchanged.\n    A hand-maintained\
  \ registry was the obvious design\n    and is rejected under CHARTER §P1 F1/F2:\
  \ it is a second home that drifts silently every time\n    a renderer's wording\
  \ changes, and it buys nothing the head does not already carry.\n    **FAIL-OPEN\
  \ AT ITS SEAM.** The fold is presentation riding the session-start seam (the land\n\
  \    tail was a second compacting seam until retired it, rule 2(b)), so a failure\n\
  \    falls back to the FULL lines — degrading to unreadable beats degrading to broken,\
  \ and beats\n    degrading to silent (which returning nothing would be). The shared\
  \ render helper\n    (`views._render_debt_echo`) and the host helpers it feeds are\
  \ UNCHANGED: the compaction\n    happens at the session-start INJECT seam, so every\
  \ suite pinning what those helpers RETURN\n    still measures the helper rather\
  \ than this presentation.\n    Unit tests (`tests/test_debt_echo_table.py`): the\
  \ real `session start` subprocess\n    emits only rows and no surviving paragraph\
  \ (AC1), a GOLDEN byte-identity comparison per\n    class between `debt --explain`\
  \ and the pre-change paragraph (AC2), a clean fixture prints\n    nothing (AC3),\
  \ plus the drift tripwires — distinct heads stay distinct classes\n    and every\
  \ rendered verb is a real `bin/yitc-v2` verb.\n\n41. **A DECLARED LOAD-SENSITIVE\
  \ FILE THAT NO LIVE CARD IS HOLDING — the exit nobody is walking\n    (SPEC-0119\
  \ rule 41).** made ENTRY into `tests/load-sensitive.txt` automatic\n    and EXIT\
  \ never automatic, and BOTH halves are correct: a listed file no longer runs in\
  \ the\n    concurrent pool, so nothing can ever prove it pool-robust again, and\
  \ only a CARD can remove\n    its line — by making the file load-robust (removing\
  \ the line in its ship diff) or by ratifying\n    the line with a reason. The consequence\
  \ is that the set is MONOTONIC unless a human acts, and\n    until this rule the\
  \ carrier's own header was the only place that said so.\n    **THE OCCASION IS MEASURED,\
  \ not anticipated.** 193 `land_completed` rows named test_t11451\n    before was\
  \ filed BY HAND, while the rule-26 line reported the CAUSE at every session\n  \
  \  start. An echo that reports a cause nobody is holding is how a known defect survives\
  \ 193\n    lands; this rule reports the HOLDER'S ABSENCE instead, which is the reading\
  \ that was missing.\n    **THE VIEW:** every file in the declared set for which\
  \ NO non-terminal card carries the\n    fingerprint `load-sensitive:<file>` in its\
  \ `cites:`, each with the DATE it entered (the rule-38\n    dated shape — a standing\
  \ debt with a first day, not a permanent flag) and the two honest\n    remedies\
  \ NAMED. Derived at read time from the carrier + `tasks/` alone; zero stored state.\n\
  \    **TWO THINGS SUPPRESS, ONE PER ADVERTISED EXIT.** The rule shipped advertising\
  \ two\n    exits and implementing one, which is the state it now forbids: whatever\
  \ the view's `next:` text\n    names, the reader must implement, and nothing else.\n\
  \    **(a) A NON-TERMINAL CARD carrying the fingerprint — the exit that EXPIRES.**\
  \ `done` and\n    `wont-do` hold nothing: a `done` card either removed the line\
  \ (so there is no listed file left\n    to report) or closed without removing it,\
  \ which is exactly the un-held file this rule names.\n    `ready` / `in-progress`\
  \ / `parked` all suppress — a parked card is a recorded decision with a\n    return\
  \ trigger, which is somebody holding it. This is the OPPOSITE polarity from rule\
  \ 36's\n    fail-closed-toward-silence, and deliberately: there the claim is strong\
  \ («this can NEVER be\n    picked») and needs proof, here the claim is an absence\
  \ the carrier itself already asserts is\n    owed.\n    **(b) A RATIFICATION ON\
  \ THE CARRIER LINE — the exit that is DURABLE.** The form is\n    `ratified by card\
  \ T-NNNN: <reason>`, read by `debt.load_sensitive_ratification`, its ONE home,\n\
  \    and it is the exact string the view's own `next:` text tells an author to write.\
  \ It is read\n    from the LINE, not from a card, and that is what makes it durable:\
  \ a line outlives every card,\n    so a file deliberately serialized stays discharged\
  \ after the card that decided it closes.\n    Exit (a) cannot do this by construction\
  \ — it holds only while a card is open, so before this\n    exit existed NO card\
  \ could durably discharge a line it ratified rather than removed, and every\n  \
  \  ratified line reported forever as held by nobody (5 of 5, measured 2026-09-16).\n\
  \    **THE NAMED CARD IS EXISTENCE-CHECKED, AND DELIBERATELY NOT STATUS-CHECKED.**\
  \ It must be a real\n    card in this repo's `tasks/`, in ANY status INCLUDING `done`\
  \ / `wont-do` — existence is\n    permanent where status is not. Existence-checking\
  \ stops a fabricated or mistyped id from buying\n    permanent silence (a suppression\
  \ nothing could ever surface again would be a worse failure than\n    the one this\
  \ exit fixes); status-checking would re-create exactly the expiry (a) already has.\n\
  \    The id set comes from the SAME `tasks/` walk the (a) fold makes (its `ids_out`\
  \ out-channel) —\n    one scan, two answers. A near-miss — no card id, an empty\
  \ reason, or an id no card carries —\n    does NOT suppress and the file REPORTS:\
  \ fail-closed toward reporting, never toward discharging\n    a line on a corpus\
  \ nobody could read.\n    **THE FINGERPRINT HAS ONE HOME** (`debt.load_sensitive_fingerprint`),\
  \ because two consumers\n    must agree on it EXACTLY: this view's suppression and\
  \ the land-tail filer's idempotency check.\n    A second spelling would let a card\
  \ exist that one sees and the other does not — the filer\n    would duplicate, or\
  \ the echo would nag forever, depending on which drifted.\n    **THE FILER IS THE\
  \ OTHER HALF OF THE SAME CARD, and it is bounded by CHARTER §6.** At the land\n\
  \    tail, the moment a file ENTERS the set, `land` also files ONE `ready` card\
  \ for it through the\n    same primitives `task file` uses, idempotent by that fingerprint,\
  \ recording the card id on the\n    `load_sensitive_entered` row IT IS EMITTED WITH\
  \ (the journal is append-only — a row is never\n    patched afterwards). The engine\
  \ NEVER claims, dispatches or picks that card: filing is\n    automatic, taking\
  \ it into work stays an owner cue. The precedent is SPEC-0085 §3's auto-route\n\
  \    of a kernel-bound deviation into a `cross request` — deterministic, idempotent,\
  \ no owner\n    reminder — and this is the SECOND seam of that shape, not a new\
  \ mechanism.\n    **WHY BOTH HALVES.** The filer covers every automatic entry from\
  \ now on; the view covers what\n    it cannot — a line added by hand, a card closed\
  \ `wont-do` without removing its line, and every\n    line already in the carrier\
  \ before the filer.\n    **REPORT-ONLY, like every sibling.** It names remedies\
  \ and performs none: it removes no line,\n    files no card, and moves no exit code.\
  \ Removing a line stays a card's decision.\n    Unit tests (`tests/test_load_sensitive_autofile.py`):\
  \ exactly one card per entering file with\n    its id on the emitted carrier row\
  \ and never a second (AC1), the card `ready` / unstaged /\n    unclaimed with no\
  \ `task_picked` or dispatch row (AC2), and the dated line in its three states —\n\
  \    uncarded prints, carded suppresses, empty set silent (AC3); and that every\
  \ exit the\n    `next:` text ADVERTISES is one the reader IMPLEMENTS — each exercised\
  \ on a declared file, with\n    the near-miss and fabricated-id rows still reporting,\
  \ and the repo's own carrier read through\n    the runner's parser so the existing\
  \ ratified backlog is covered rather than only new lines.\n\n42. **THE LIVE DEPENDENTS\
  \ OF A CARD GOING `wont-do` OR `parked` — reported AT THE TRANSITION,\n    not only\
  \ at the next debt seam (X-1462).** Rule 36 folds the SAME relation — a\n    card\
  \ whose `requires:` names a target the picker's blocking edge can never satisfy\
  \ — at the\n    debt seams, and it stays the standing sweep for cards ALREADY stranded.\
  \ What it cannot do is\n    speak at the MOMENT the strand is created. This rule\
  \ adds that second delivery.\n    **THE OCCASION IS MEASURED, not anticipated.**\
  \ <project> closed `wont-do` after a\n    SPEC-0204 rule-3 terminal RED (2026-09-16).\
  \ Two READY cards carried `requires: `, so\n    BOTH became permanently unclaimable\
  \ at the moment of closure, and the closure output — which\n    warned about `post_verification`\
  \ and about scoped-staging dirt — named neither. The block is\n    invisible from\
  \ the closed card too, so the reporter found it by scanning every `tasks/*.yaml`\n\
  \    for the id by hand. Succession IS the documented outcome of a terminal RED,\
  \ so every such\n    closure carries the hazard by construction; the same day the\
  \ kernel's own Controller retired\n     for the same reason and checked for dependents\
  \ by hand afterwards — a near miss that\n    held only because a human remembered.\n\
  \    **THE VIEW:** at a `task update --status wont-do` and at a `--status parked`,\
  \ every card\n    whose `requires:` names the transitioning id and whose OWN status\
  \ is NOT terminal, named BY\n    ID with its status and title. Derived at read time\
  \ from `tasks/` alone; zero stored state;\n    no new event, no new store, no new\
  \ verb.\n    **LIVE, NOT `ready` — the ONE place this rule's scope differs from\
  \ rule 36's, deliberately.**\n    Rule 36 asks which cards are waiting to be PICKED\
  \ right now, so `ready` is its subject. This\n    rule asks whom THIS transition\
  \ strands, and an `in-progress` or `parked` dependent is equally\n    blocked when\
  \ it comes to be re-picked — naming it while the operator still holds the context\n\
  \    is the whole point. A `done` or `wont-do` dependent is strandable by nothing\
  \ and never fires\n    a row. A card naming ITSELF is never reported against itself.\n\
  \    **PARKED IS IN SCOPE, AND ITS WORDING DIFFERS.** A parked target is not terminal,\
  \ but it\n    does not satisfy `requires:` either, so its dependents are blocked\
  \ for as long as the park\n    lasts. The two targets are not flattened into one\
  \ sentence, because the honest exits differ:\n    a park may simply end, so the\
  \ parked line names the `--return-trigger` instead of succession.\n    **BEFORE\
  \ THE FREEZE.** The report is emitted BEFORE the card is written to disk — the\n\
  \    ordering its sibling `post_verification` WARN on this same verb already keeps.\
  \ A report that\n    arrives after the door closes is not weaker advice, it COSTS:\
  \ it spends the operator's\n    attention at the only moment the context that makes\
  \ re-pointing a DECISION rather than\n    archaeology is already gone.\n    **SUPPRESSED-WHEN-CLEAN\
  \ IS THE CONTRACT, not an optimisation.** A line that printed on every\n    closure\
  \ would be read past, and then it would mean nothing on the closure where it matters.\n\
  \    **REPORT-ONLY, like every sibling — and this one is load-bearing.** The closure\
  \ is\n    LEGITIMATE; the silence is the defect. So it never blocks, never moves\
  \ an exit code, and\n    picks no remedy: re-pointing a dependent is a judgement\
  \ about the WORK (the reporter's own\n    fix turned on prose references no verb\
  \ can), and an auto-sweep would re-admit cards to a\n    queue nothing has re-justified.\
  \ It names the honest exits and performs none.\n    **AND IT PRINTS NO PASTE-READY\
  \ EDIT (audit-post pass 1, class `data-loss`).** The first\n    draft rendered a\
  \ concrete `--new 'requires: []'`, which is correct ONLY for a dependent\n    whose\
  \ sole requirement is the closing card and SILENTLY ERASES every other edge otherwise.\n\
  \    Advice that is safe only on the simplest input is precisely what an operator\
  \ follows\n    verbatim, so the remedy NAMES the verb and the ONE list entry to\
  \ act on and stops there.\n    A report-only line that hands over a destructive\
  \ command is no longer report-only.\n    Unit tests (`tests/test_t12644_terminal_closure_live_dependents.py`):\
  \ dependents named by id\n    on both targets with the park wording distinct (AC1),\
  \ silence when there are none, when the\n    only dependents are settled, on a self-naming\
  \ row and on an unrelated `requires:` edge (AC2),\n    and the transition still\
  \ succeeding — status written + `task_wont_do` / `task_parked`\n    emitted — with\
  \ dependents present, which is the leg that pins this never became a gate (AC3).\n\
  \n43. **USER-SURFACE FILES NO SCENARIO COVERS (SPEC-0093 rule 29 / SPEC-0076 §6c).**\
  \ One\n    report-only row `debt: user-surface files no scenario covers: N (<prefix>\
  \ <n>, …)`, DERIVED at\n    each read from the project's DECLARED `ui.surfaces:`\
  \ prefixes + every TRACKED file under them\n    (`git ls-files`) + the graph index's\
  \ scenario `covers` (a file is covered when any non-retired\n    scenario names\
  \ it, whole-file or `file#symbol`; test-shaped paths never count). Appended in the\n\
  \    SAME shared residue as the rule-7 startup-check line, so it rides the SAME\
  \ seams — session start\n    and the `debt` re-fold — with no new view type, store,\
  \ event or seam.\n    SUPPRESSED-WHEN-CLEAN and SILENT WITHOUT A DECLARATION (the\
  \ engine itself declares none).\n    Best-effort: any failure yields no row. It\
  \ is the STANDING count of the same gap the per-task\n    Analysis/Closure line\
  \ names (SPEC-0076 §6c) — both read ONE derivation,\n    `bin/lib/debt.py#uncovered_surface_files`.\
  \ **What it retires (CHARTER §P1 F3):** the ad-hoc\n    history sweep (`dev-utilities/uncovered-surface-precision-sweep-.py`)\
  \ as the ONLY way to\n    see this gap. **Out:** no gate, no numeric scenario target,\
  \ no \"update\" row (a covered-anchor\n    touch fired on 79.5% of UI tasks in the\
  \ trial). Tests:\n    `tests/test_t12789_uncovered_user_surface.py` (count when\
  \ >0, nothing when 0, no file written).\n44. **DECLARED SECURITY PROBES WITH NO\
  \ VOUCHING VERDICT (SPEC-0093 rule 27 / SPEC-0098).**\n    One report-only row naming\
  \ the declared `security.probes[]` properties the repo's journal does\n    not vouch\
  \ for — chiefly a probe the land floor ADMITTED as newly declared, awaiting its\
  \ first\n    post-deploy check. DERIVED at each read by asking the land floor's\
  \ OWN probes predicate\n    (`bin/lib/debt.py#probes_awaiting_first_check` calls\
  \ `_floor_declared_probes` with an empty base),\n    so the row and the admission\
  \ can never disagree about what \"vouched\" means. Wired in the shared\n    residue,\
  \ so it rides session start and the `debt` re-fold. SUPPRESSED-WHEN-CLEAN,\n   \
  \ UNFLOORED, best-effort, never gates — the gate is the floor itself, which refuses\
  \ every later\n    land until the probe passes. **What it retires (CHARTER §P1 F3):**\
  \ the closed loop in which a\n    branch shipping protected code could not also\
  \ declare its probe. Tests:\n    `tests/test_t12982_new_probe_admitted_pending.py`.\n\
  \n45. **LATE AUDIT FINDINGS — recorded history, and a closure blocker ONLY where\
  \ the close gate says\n    so.** The line SPEC-0204 rule 8 asks for («late findings\
  \ per pass are\n    counted»): an OPTIONAL injected report-only fold over the audit\
  \ completion rows inside a\n    trailing window, UNFLOORED, suppressed-when-clean.\
  \ Its COUNT is recorded history — the measured\n    cost of an incomplete pass-1\
  \ survey — and includes findings already decided and findings on\n    cards already\
  \ closed; nothing is ever dropped from it. What the line says about CLOSURE is not\n\
  \    its own judgement: it is the close gate's (SPEC-0204 rule 8 — the judgement\
  \ `task close`\n    refuses on), joined to the card's status. A finding is named\
  \ a blocker ONLY when that judgement\n    lists it undecided AND its card is not\
  \ terminal (`done` / `wont-do` have no close left to\n    block). When the judgement\
  \ could not be made the finding is named UNJUDGED — never a blocker,\n    and never\
  \ read as cleared; «none blocks a close» is said only when every finding in the\
  \ window\n    was judged. The card is read first and only a non-terminal card is\
  \ judged. The judgement is\n    fed from the fold's OWN declared read, never a second\
  \ walk of the journal (SPEC-0190 rule 10),\n    so its corpus is the reading checkout's\
  \ journal: on the main checkout that is what the gate\n    reads; in a task worktree\
  \ a decision recorded on main is not yet in that journal, so the\n    on-demand\
  \ re-fold there may still name that worktree's own decided finding — erring toward\n\
  \    visible, with `task close` the authority. The gate itself is unchanged by this\
  \ rule. Tests:\n    `tests/test_t13470_debt_lines_state_backed.py`.\n"
