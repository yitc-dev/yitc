  \ card that does not\n    answer the question at all (an older reader, a missing\
  \ key, an unparseable card) KEEPS its\n    row — the same fail-closed-toward-visible\
  \ asymmetry as every other criterion here. Still NO\n    predicate change: `_halt_resolution`\
  \ and `HALT_RESOLUTION_INPUT_TYPES` are untouched, so\n    `--fleet-verdict` and\
  \ the re-dispatch brief are unaffected.\n    The subject of this row is a card still\
  \ AWAITING A DECISION; a closed card is awaiting none,\n    whatever the journal\
  \ can or cannot prove about the halt itself. Measured on the engine journal\n  \
  \  (2026-08-10): 60 rows -> 5, of which 55 named a `done` or `wont-do` card. That\
  \ wall is not\n    cosmetic — a surface whose first print is mostly settled history\
  \ trains its reader to skip it,\n    which defeats the row this rule.\n    **THE\
  \ PREDICATE IS NOT AT FAULT AND MUST NOT GAIN A THIRD ARM.** `_halt_resolution`\
  \ looks only\n    FORWARD from the newest halt, so a resolution that PRE-DATES the\
  \ halt is unfindable by\n    construction: 7 of the excluded cases are literally\
  \ a halt emitted AFTER its task closed AND\n    landed ( card closed 08:58:45Z,\
  \ its branch landed 08:59:32Z, the halt arrived 09:00:38Z;\n    same shape for).\
  \ The predicate REPORTS THE JOURNAL\n    FAITHFULLY, which is its documented contract.\
  \ The defect was in what THIS READER did with a\n    faithful UNRESOLVED — so the\
  \ fix is homed here, in the reader. Teaching the predicate a\n    `task_closed`\
  \ arm would change `--fleet-verdict` and the re-dispatch brief, which consume the\n\
  \    same predicate, as a side effect nothing authorised. Governing craft rule:\n\
  \    `lessons/fail-closed-belongs-to-the-reader-not-the-parser` — fail-closed is\
  \ a property of a USE\n    SITE, not of a parse result, and each reader owns what\
  \ a missing/uncertain value means for it.\n    **REUSE, NOT A SECOND READER.** The\
  \ cross-check is the EXISTING `_main_task_strand_state`\n    (X-0557) — the same\
  \ card reader `--fleet-verdict` already injects to read a\n    paused card for its\
  \ `pause_detail` — passed to the fold as its `_card_state` collaborator. A\n   \
  \ second card reader here would be the failure, not the fix (CHARTER §P1 F1). Only\
  \ that reader's\n    `status` is consulted; its `terminal` key means `not stranded`\
  \ and is TRUE for `ready` / `parked`\n    / paused cards, so reading it instead\
  \ would silence the very remainder this row exists to show.\n    **SCOPE BOUND —\
  \ the honest remainder KEEPS PRINTING, and this is half the rule.** ONLY `done`\
  \ and\n    `wont-do` drop. A card that is `ready`, `parked`, or ABSENT ENTIRELY\
  \ is NOT terminal and keeps its\n    row — the no-card case most of all, being the\
