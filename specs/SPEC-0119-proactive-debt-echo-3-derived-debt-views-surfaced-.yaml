      two declared test files were executed by NOTHING, and four mutation-verified tripwires shipped
      through `land` believing they were gated. A false GREEN is the worst failure shape there is,
      because its absence and its success are indistinguishable from outside.
      **THE REALM IS KERNEL, AND THE INVARIANT IS NARROWED TO THE PLACEMENT CONSULT'S WORDING**
      (`decisions/verify-layer-execution-check-placement-audit-adhoc.yaml`, YELLOW, 2026-08-30, both
      findings absorbed): the kernel DEFINES `verify.layers[].subject_globs` and EMITS the verdict, so
      it owns preventing a false GREEN over its own declared contract — «a kernel PASS must not include
      declared subject_globs with ZERO observed execution». **Project-specific ADEQUACY thresholds —
      how much coverage is enough — stay with the CONSUMER, and that bound is load-bearing:** without
      it the same argument pulls an unbounded class of consumer-side verification into the kernel,
      which the consult explicitly warned against. The bound is STRUCTURAL, not a promise — the fold's
      only inputs are the carrier and the file NAMES, so it holds no coverage figure, assertion count
      or size through which an adequacy judgement could enter.
      **THE THIRD PROJECTION OF ONE SUBJECT-SCOPING READING, NOT A NEW MECHANISM.** Rule 16's carrier
      line (`undeclared_subject_layers`) asks «is a subject DECLARED?»; its observed line
      (`zero_skip_verify_layers`) asks «does the layer ever actually SKIP?»; this asks «is
      what the subject CLAIMS actually run?». The first two report a COST (a layer running more often
      than it needs to); this reports owed WORK (a file believed covered and executed by nothing).
