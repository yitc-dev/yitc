  \ by construction, dropping a row only on a POSITIVE terminal-status read,\n   \
  \ which is the same fail-closed-toward-visible posture stated directly above. Over-silencing\
  \ is the\n    failure mode that matters here, because from the outside it is indistinguishable\
  \ from a repo with\n    nothing owed.\n    **TWO RESOLUTION SHAPES THE READER COULD\
  \ NOT SEE — cleared by POSITIVE EVIDENCE, NEVER BY ABSENCE\n.** The terminal-card\
  \ cross-check clears a halt off a status ON A CARD, so a resolution\n    that left\
  \ NO CARD BEHIND was invisible to it and the halt was unclearable BY ANY VERB, forever.\n\
  \    Two such shapes were measured on the engine journal and are now dispositioned\
  \ by a THIRD drop\n    criterion, consulted ONLY when the card read produced no\
  \ card (so it can never second-guess a\n    live one) and homed in the SAME reader\
  \ beside the other two:\n    (i) **RESOLUTION BY CARD DELETION.** / were resolved\
  \ and acted on 70 days before\n    this rule was amended: commit ce8d5f153 DELETED\
  \ them as confirmed duplicates of shipped /\n     and reconciled the part-c plan\
  \ to realized. Deleting a duplicate card is a legitimate\n    disposition, not an\
  \ anomaly. Evidence = the deleting COMMIT, so the drop is attributable to that\n\
  \    commit rather than to the card's mere absence.\n    (ii) **LEAKED TEST-FIXTURE\
  \ IDS.** is not a task at all — a fixture id whose ~140 historical\n    journal\
  \ rows persist because the journal is APPEND-ONLY (CHARTER §P5; the leak itself\
  \ was closed\n    AT SOURCE, and its history may never be rewritten). Having no\
  \ card it can never be\n    marked terminal, so a TEST ID was being presented to\
  \ the owner as a worker awaiting a decision.\n    Proven by a CONJUNCTION, never\
  \ by either half: git history NEVER carried a card for the id AND it\n    is used\
  \ as a fixture id under `tests/`. That conjunction is what keeps a REAL task id\
  \ out — real\n    ids are named in tests constantly, but they have (or had) a card.\n\
  \    **THE DIFFERENTIAL IS THE SAFETY PROPERTY, and it is non-negotiable.** A halt\
  \ whose card is absent\n    for NO RECORDED REASON STILL REPORTS. Absence alone\
  \ must never clear a halt, or this criterion\n    becomes the hiding mechanism the\
