  \ remaining bound. The signals chosen are the GENERAL, cheap, per-user ones.\n \
  \   **The gap it closes.** The engine ASSUMES the invoking user can run its declared\
  \ verify/audit\n    commands, but those tools are provisioned PER USER (SPEC-0093's\
  \ per-user surface): a second developer\n    routinely has none — `pytest` only\
