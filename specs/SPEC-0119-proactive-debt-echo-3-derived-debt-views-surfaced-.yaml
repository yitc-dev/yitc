  \ and the arm is asymmetric exactly as the terminal-card\n    one is: only a positive\
  \ disposition with real evidence drops a row; None, a raise, a non-dict, an\n  \
  \  unknown kind, empty evidence and an absent collaborator all KEEP it.\n    **AND\
