.** The counts above name NOTHING, and that is the reading that failed: the forgotten
      security plan (deviation `plan-parked-in-draft-on-unnameable-pull-trigger-forgotten`) sat 7
      weeks while this line faithfully reported one more plan in `draft`, and a multi-slice umbrella
      can realize its first slice and let the rest rot with every per-stage count still healthy. So
      the census line gains a TAIL, absent when there is nothing to say, carrying THREE clauses:
      (a) a plan in `decomposition` for >= 14 days — mid-cut, its remaining cards unfiled;
      (b) an `executing` plan with a cut card (a `tasks/*.yaml` card whose `decomposed_from` names
