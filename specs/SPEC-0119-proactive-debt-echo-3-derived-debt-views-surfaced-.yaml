  \ counted off the additive\n    `land_completed.prequeue_known_broken` key that\
  \ refusal itself writes (SPEC-0025).\n    **THE SIBLING OF RULE 29, NOT A SECOND\
  \ SPELLING OF IT.** Rule 29 answers *what is broken on\n    main*; this answers\
  \ *what that cost and who was stopped by it*. The two move INDEPENDENTLY — a\n \
  \   standing record can refuse nobody all day, and a burst of refusals can be the\
  \ whole story of a\n    morning that produced no new record — so neither can be\
  \ read off the other.\n    **WHY IT WAS COUNTED NOWHERE, and it is not an oversight\
  \ to sneer at.** The refusal is SILENT\n    BECAUSE IT IS CHEAP: it fires above\
  \ the attempt loop and takes nothing — no reservation, no\n    verify slot, no batch\
  \ membership — so it never reaches the seam that publishes a land outcome to\n \
  \   main, and its abort row is written to the LANDING CHECKOUT's journal, which\
  \ reaches main only if\n    the refused branch eventually LANDS. A refused branch\
  \ very often never lands (discarded, parked,\n    re-cut), so the record died with\
  \ the worktree. Meanwhile the rule-27 abort-cost views count only\n    lands that\
  \ reached a verify, and a pre-queue refusal reaches none: the cheapest refusal in\
  \ the\n    system was invisible in the very statistics used to reason about land\
  \ cost.\n    **MEASURED, 2026-08-28.** `work/red-main-guard-and-repair-path` was\
