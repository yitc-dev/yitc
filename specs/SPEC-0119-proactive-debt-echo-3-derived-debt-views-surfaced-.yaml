  \ broken on main blocks EVERY\n    branch, so it is never count-hidden. **REPORT-ONLY,\
  \ and pointedly so** — it names a cause and\n    excuses none: nothing here waives\
  \ a gate, skips an assertion or makes a land pass. It makes a broken\n    main cheap\
  \ to KNOW ABOUT, never cheap to bypass.\n\n30. **AFFECTED-TEST SELECTION ROLLED\
  \ BACK — the safety valve that fired in silence (SPEC-0181 auto-rollback).**\n \
  \   An OPTIONAL injected report-only fold over the JOURNAL (`debt.selection_rollback`),\
  \ wired at the\n    ONE shared host residue like every sibling and riding all seams\
  \ (session-start / the\n    `debt` re-fold).\n    **SUBJECT.** Whether the SPEC-0181\
  \ auto-rollback currently has governing affected-test selection\n    OFF on this\
  \ journal — i.e. whether `worktree._selection_governs` answers with its\n    `miss-threshold:<n>/<t>`\
  \ token. MEASURED 2026-08-23: that token reached\n    `land_completed.verify_metrics.selection_govern_reason`\
  \ and NOTHING ELSE — a grep of `views.py`,\n    `debt.py` and `session.py` returned\
  \ zero hits. From outside, a firing showed up only as lands\n    getting SLOWER\
  \ (the governed 5.3 min median drifting back toward the 10.6 min full-suite median),\n\
  \    which is indistinguishable from host load or a long admission queue. The valve\
  \ built to catch\n    silent test loss was itself silent.\n    **AND IT DOES NOT\
  \ SELF-CLEAR — which is what makes it debt rather than a notice.**\n    `_selection_recorded_misses`\
  \ counts every disagreement recorded under the rule version in force\n    and never\
  \ decreases, so once the threshold is reached selection stays off until a human\
  \ bumps\n    `_SELECTION_RULE_VERSION`. A silent firing is not a temporary revert;\
  \ it is a mechanism switched\n    off with nobody informed.\n    **THE GOVERNOR\
  \ IS THE ONE ORACLE, BORROWED AND NEVER RE-DERIVED** — the same discipline rule\
  \ 26\n    states for the abort-cause identity. The fold counts nothing itself: it\
  \ asks the injected governor\n    and reads BOTH numbers back out of its own token,\
  \ so this view cannot disagree with the rule that\n    decides what runs, even if\
  \ the rule changes. The ENV SWITCH IS NEUTRALISED ON PURPOSE (`env={}`):\n    as\
  \ a GATE the governor must short-circuit on `YITC_SELECTION_GOVERN` before it counts,\
  \ but a debt\n    view that inherited that would go SILENT in exactly the session\
  \ that switched selection off by\n    hand — hiding a journal state independent\
  \ of the switch.\n    **ONLY THE ROLLBACK FIRES IT.** `switch-off` is an operator\
  \ choice and `governor-cannot-count` /\n    `governor-error:*` are read failures;\
  \ none is this rule, and printing on them would make the line\n    unreadable inside\
  \ a day. Fail-quiet on every other shape, like every sibling.\n    **THE LINE TELLS\
  \ THE READER WHAT TO DO.** It names the recorded count against the threshold,\n\
  \    states that the counter does not self-clear, and names the rule-version bump\
  \ — after FIXING the\n    coverage map, never raising the threshold — as the route\
  \ back to governing. A line reading only\n    \"selection is off\" would pass a\
  \ presence check and leave its reader stuck.\n    **NOT AT THE MOMENT OF FIRING.**\
  \ Owner ruling 2026-08-23 (option B of four offered): the firing is\n    learned\
  \ at the NEXT SESSION START, not on the land tail. That is why there is no land-tail-only\n\
  \    output and no new event.\n    **NO STORE, NO EVENT, NO VERB, NO KNOB** — derived\
  \ on demand from the journal alone, no window and\n    no clock. **UNFLOORED, and\
  \ there is nothing to floor:** the fold is a BOOLEAN state, not a count of\n   \
  \ instances. **REPORT-ONLY** — it reports a mechanism that is off; it neither reads\
  \ nor moves\n    `_SELECTION_MISS_THRESHOLD`, which stays 3 by the same owner ruling\
  \ and is out of this rule's\n    scope. Unit tests: the fold's threshold/below-threshold\
  \ differential over two journals the test\n    builds itself (SPEC-0165 rule 3),\
  \ the rule-version window arm, the env-neutrality arm, the\n    fail-quiet arms,\
  \ the three AC2 element probes asserted separately, and the shipped-residue seam\n\
  \    probes driven rather than read.\n\n31. **AN INFRA CLOSURE WHOSE CHARTER §P8\
  \ ADOPTION WARN FIRED AND NOTHING IS HOLDING IT.**\n    An OPTIONAL injected report-only\
  \ fold over the JOURNAL (`debt.uncarried_p8_warns`), wired at\n    the ONE shared\
  \ host residue like every sibling and riding all seams (session-start / the on-demand\
  \ `debt` re-fold). It names `class: infra` closures whose P8 adoption\n    WARN\
  \ fired — `task_closed.adoption_evidence_seen: false`, the key `task close` already\
  \ writes\n    (E-0005) — and for which NO carrier is declared.\n    **WHY IT IS\
  \ A LINE AT ALL.** The E-0005 WARN is NON-BLOCKING BY DESIGN: semantic adoption\n\
  \    evidence cannot be a false-positive-free hard gate, so closure proceeds and\
  \ records the gap.\n    That design is right and is UNCHANGED by this rule — but\
  \ it left the WARN as one line on a\n    closing session's stdout with nothing afterwards\
  \ able to read it. Two infra closures went out\n    that way in two days ( 2026-08-22\
  \ 2026-08-23), each with no followup, no\n    post-ship observation and no armed\
  \ waiter. Both had emitted an honest, well-formed P8 event\n    that could not RESOLVE\
  \ for a structural reason (an artifact-and-test mechanism emits no\n    journal\
  \ row of its own; SPEC-0015's `test:<path>::<node>` arm was, at the time, gated\
  \ to\n    a CONSUMER instance). This rule is the WARN's reading moment, not a second\
  \ WARN.\n    **THAT STRUCTURAL REASON IS RETIRED, AND SO IS THIS ARM'S SILENT DIVERGENCE\
  \ FROM\n    `task close`.** SPEC-0015 now admits the `test:` arm on the KERNEL too,\
  \ under a\n    stricter red-contrast bound — so the class that produced this rule's\
  \ two founding closures\n    is citable, and the sentence above is history rather\
  \ than a standing fact. The\n    later-evidence arm below claims to reuse the close-time\
  \ `task._p8_evidence_is_substantive`\n    \"so the two standards cannot drift\"\
  ; it was calling that predicate WITHOUT the repo root\n    those ref forms need,\
  \ so for exactly this class the two standards had ALREADY drifted — the\n    fold\
  \ reported a row still owed that `task close` would have cleared. The root is now\n\
  \    injected. This is rule-PRESERVING: it restores the reuse this rule already\
  \ promises and\n    widens nothing about what counts as evidence, and an unusable\
  \ root still leaves those forms\n    dark, which is this fold's standing fail-toward-silence\
  \ direction.\n    **THE CARRIER MUST BE DECLARED, NEVER INFERRED — and `relates_to`\
  \ is deliberately NOT the\n    key.** A followup carries a closure's P8 obligation\
  \ only when its text SAYS SO:\n    `P8-CARRIER: <task-id>` (`debt.P8_CARRIER_MARKER`,\
  \ named once so fold, remedy text and tests\n    cannot drift). `relates_to` is\
  \ PROVENANCE — \"what this followup is ABOUT\" — so keying on it\n    would let\
  \ ANY unrelated residual captured under a card silently hide that card's uncarried\n\
  \    WARN, which is the exact false-negative this rule exists to end (established\
  \ as a high finding\n    at this card's audit-pre pass 1). This is the same declared-not-inferred\
  \ discipline that made\n    `awaits`, never `relates_to`, the followup FIRE key.\
  \ The line PRINTS the marker\n    form, so the carrier is learnable at the one moment\
  \ a reader needs it.\n    **AND IT PRINTS THE REF GRAMMAR OF THE OTHER REMEDY, ON\
  \ THAT SAME PRINCIPLE (X-1245).**\n    The line offers two remedies; the marker\
  \ form above made the CARRIER one learnable in place, while\n    the FIRST — record\
  \ the adoption evidence — said only \"refs to journal rows the MECHANISM emitted\"\
  \n    and left the SPELLING unstated. Measured cost (<project> 2026-09-03): an author\
  \ who had just read\n    CHARTER §Principle 2 wrote its journal locator `events.jsonl#ts=<ISO>`,\
  \ no ref resolved, and two\n    emissions were burned before the grammar was found\
  \ by reading the resolver. So the remedy now\n    renders the accepted forms with\
  \ an example of each, CONSUMED from the single-SoT\n    `task.py#P8_EVIDENCE_REF_GRAMMAR`\
  \ — never respelled here or in the `task close` E-0005 WARN, which\n    reads the\
  \ same constant, so the two cannot drift. Rendered ONCE per line, not per row, so\
  \ the\n    per-card `unproved_reason` stays short. The P2 locator is NOT admitted\
  \ as an evidence ref (it names\n    no event type, and 35.1% of journal rows share\
  \ a timestamp, so \"maps to ONE row\" is not an\n    applicable rule); what was\
  \ retired is the UNDIAGNOSED refusal — that shape is now refused BY NAME.\n    Payload-contract\
  \ home: SPEC-0015; this bullet is its debt-view face.\n    **THE ROUTE NOW HAS AN\
  \ AUTOMATIC PRODUCER — `task close` FILES THE CARRIER ITSELF.**\n    The marker\
  \ form above was, until now, only ever PRINTED as an instruction for a human to\
  \ run\n    by hand, and the measured result is what this rule already reports: 26\
  \ infra closures in one\n    168h window fired the WARN with nothing holding it\
  \ (engine session-start debt echo,\n    2026-09-02). So `task close` runs this SAME\
  \ route at the closing seam — when the E-0005 WARN\n    fires AND none of the carriers\
  \ above is present, it files `P8-CARRIER: <task-id> <what is owed\n    and what\
  \ fires it>` through the followup primitive's own body (no new store, no second\
  \ FSM, no\n    new event — `followup_added` exactly as `followup add` writes it),\
  \ derives the text from the\n    card, relates it to the card, and NAMES the filed\
  \ id in the WARN. The rule's own reading is\n    UNCHANGED: this fold still reports\
  \ what nothing holds, still keys on the DECLARED marker, and\n    still fails toward\
  \ silence — what changes is that the population it reads is now produced at\n  \
  \  the closing seam rather than left to a hand-run remedy, so an uncarried WARN\
  \ becomes actionable\n    debt on the open-followups view instead of a line nobody\
  \ reads again. IDEMPOTENT by that same\n    carrier test: a card already holding\
  \ an open/promoted `P8-CARRIER:` followup is CITED, never\n    given a second one.\
  \ The auto-file REFUSES nothing and demands nothing new of an author — the\n   \
  \ WARN stays exactly as non-blocking as it was (SPEC-0015 §Infrastructure-class\
  \ adoption\n    strength, the third-satisfier clause, is the rule home; this bullet\
  \ is its debt-view face).\n    **THE OTHER TWO CARRIERS ARE THE CARD'S OWN AND ARE\
  \ SUBTRACTED TOO** — a\n    `post_ship_observation:` (SPEC-0036 variant (e)) and\
  \ a `probes: {ACx: deferred}`.\n    Each already has its own echo clause under rule\
  \ 3, and naming one obligation on two lines\n    tells the reader neither.\n   \
  \ **THE FOURTH TEST READS A PROOF, NOT A PROMISE — the later-evidence arm (X-1170\
  \ +\n    X-1190).** The three carriers above are all ways of saying *the proof is\
  \ still OWED*, and\n    until this arm nothing here re-read the journal for the\
  \ adoption evidence ITSELF. So emitting\n    the genuine `consumer_read_evidence`\
  \ / `live_trigger_evidence` that CHARTER §P8 actually\n    recognises left the row\
  \ exactly where it was, while writing a followup promising it removed\n    the row.\
  \ A reporting consumer routed 11 named closures and the count fell from 11 to 8\
  \ — by\n    the three PROMISES and by NONE of the eight PROOFS; that card's own\
  \ AC2 had to be authored to\n    EXPECT it, which is the sharpest evidence available\
  \ (X-1190). The sibling report is the same\n    fold from the false-positive side:\
  \ 7 of 11 rows were closures whose substantive evidence was\n    emitted 17-38 SECONDS\
  \ after the `task_closed` row (X-1170). The cause is structural, not\n    incidental\
  \ — the WARN is a HISTORICAL SNAPSHOT taken at close and is immutable once fired.\n\
  \    So a surviving candidate whose task id carries a P8 adoption event stamped\
  \ AT-OR-AFTER its\n    WARN, judged substantive, is dropped (`debt._p8_later_evidence_clears`).\
  \ At-or-after rather\n    than strictly after: the WARN's own firing proves close\
  \ did not see the evidence, and a\n    second-resolution stamp cannot separate \"\
  the same instant\" from \"just after\".\n    **THE STANDARD IS NOT WIDENED — IT\
  \ IS THE CLOSE-TIME ONE, REUSED.** The judgement is\n    `task._p8_evidence_is_substantive`,\
  \ the same predicate `task close` applies (SPEC-0015):\n    imported, never re-implemented,\
  \ so the two cannot drift (CHARTER §P5), with its realm probe\n    `_is_consumer_build`\
  \ INJECTED by the host caller exactly as `task close` injects it,\n    so a consumer\
  \ ref is judged under the consumer arm; with no probe injected the predicate reads\n\
  \    KERNEL, the stricter of its two readings. A prose-only or circular payload\
  \ therefore still\n    fails and the row still reports.\n    No new store, field,\
  \ event, verb or seam, and no second journal read: `segment_rows` already\n    materialises\
  \ the whole logical journal as a list, so the fold HOLDS that list as the\n    resolution\
  \ corpus and collects the P8 rows in the SAME pass that finds the WARNs, consulting\n\
  \    the arm for SURVIVING candidates only.\n    **KERNEL SELF-TELEMETRY CLEARS\
  \ NOTHING UNDER `-C`.** A P8 row the ENGINE stamped\n    `subject_realm: kernel`\
  \ (e.g. dispatch's readiness / watch receipts) proves a KERNEL surface was read;\n\
  \    in a consumer journal it is never a consumer card's proof, so under a consumer\
  \ build the arm skips it\n    (an id collision with the kernel's own task ids cannot\
  \ clear a consumer closure).\n    **IT FAILS TOWARD SILENCE, WHICH IS THE OPPOSITE\
  \ OF A GATE**\n    (`lessons/a-signal-about-a-reader-fails-safe-the-opposite-way-to-a-gate`).\
  \ This DESCRIBES what\n    a closing session did, so every state it cannot decide\
  \ — an absent or unparseable card, an\n    unparseable `ts`, a followup fold that\
  \ raises — reads as CARRIED and drops out. A false \"you\n    left this uncarried\"\
  \ defames a real carrier and gets the whole line skimmed; a missed\n    detection\
  \ only leaves the silence that already exists. Candidacy is an IDENTITY test\n \
  \   (`is False`), so an absent or non-bool key is never a fired WARN.\n    **THE\
  \ ONE PLACE THAT DIRECTION INVERTS, and it is deliberate ( audit-pre pass 1,\n \
  \   high):** the later-evidence arm alone. The three carrier tests ask \"is someone\
  \ HOLDING this\n    obligation?\", where an unreadable state is no evidence that\
  \ anyone dropped it. That arm asks\n    \"has the proof been EMITTED?\", and reading\
  \ an unanswerable state as YES would fabricate an\n    adoption claim — precisely\
  \ the self-issued prose `_p8_evidence_is_substantive` exists to\n    reject. So\
  \ an import failure, a raising predicate or an unparseable stamp CLEARS NOTHING.\n\
  \    That direction is not accusing either: it reproduces the fold's pre-change\
  \ output exactly and\n    can never print a row this view would not already print.\n\
  \    **NO STORE, NO EVENT TYPE, NO VERB, NO SEAM, NO CONFIG KEY — ONE env knob**,\n\
  \    `YITC_DEBT_UNCARRIED_P8_WINDOW_HOURS` (`cli._debt_uncarried_p8_window_hours`,\
  \ default 168 =\n    7 days; non-positive DISABLES). A reading HORIZON, never a\
  \ count floor — it hides nothing\n    INSIDE the window. It exists because the horizon\
  \ is load-bearing at this corpus size: the\n    engine journal carries 452 historical\
  \ `adoption_evidence_seen: false` rows, so an unbounded\n    fold would print a\
  \ number no session can act on — the noise that buries the echo it rides\n    (SPEC-0149's\
  \ own trial-run disproof). Measured on this repo at ship: 168h reads 29, 72h 14,\n\
  \    24h 5. 168 is the rule-27 window reused rather than a new number, and it spans\
  \ a weekend,\n    which a 72h horizon does not.\n    **REPORT-ONLY, and deliberately\
  \ nothing more:** it does not gate closing without a carrier,\n    does not re-open\
  \ a card, and moves no exit code. Nothing in SPEC-0015's P8 payload contract is\n\
  \    weakened by it — the carriers it counts are the sanctioned THIRD P8 satisfier\
  \ (a filed\n    follow-up), not a fourth.\n    Unit tests (`tests/test_t11740_p8_later_evidence_arm.py`,\
  \ the later-evidence arm): the AC1\n  differential as a PAIR of corpora identical\
  \ but for whether adoption was actually proved,\n  with the pre-change baseline\
  \ proved by execution (3/11 against the un-edited fold — every\n  AC1/AC2 probe\
  \ fails and the three carrier probes pass); the honesty guard on both rejected\n\
  \  payload shapes, prose-only and circular, each with a substantive control as teeth;\
  \ the three\n  pre-existing paths each still clearing; the inverted fail-direction\
  \ asserted by making the\n  predicate RAISE; and the ordering, correlation, no-second-read\
  \ and constant-parity teeth.\n  Unit tests (`tests/test_uncarried_p8_warn_surfaced.py`):\
  \ the AC3 DIFFERENTIAL written as\n    INDISTINGUISHABILITY rather than presence\
  \ (the fold over a CARRIED corpus is byte-equal to the\n    fold over a corpus with\
  \ no WARN at all, and the uncarried fixture is the only input that\n    breaks that\
  \ equality); each carrier kind separately, including the audit-pre pass-1 case\n\
  \    asserted by name (a `relates_to` match with NO marker does NOT carry); the\
  \ fail-toward-silence\n    arms; the window and knob arms; the render driven through\
  \ the real `debt` CLI in both halves;\n    and the teeth arms, without which every\
  \ assertion above could be vacuously true.\n\n32. **HOW FAR BEHIND MAIN EACH LIVE\
  \ WORK BRANCH IS — the other half of rule 24 (<project>\n    X-1105).**\n    An\
  \ OPTIONAL injected report-only view over the FULL git BRANCH FRONTIER\n    (`debt.behind_work_branches`),\
  \ wired at the ONE shared host residue like every sibling and\n    riding all seams\
  \ (session-start / the `debt` re-fold).\n    **SUBJECT.** A `task/*` or `work/*`\
  \ branch that HAS A WORKTREE and sits more than\n    `floor_commits` behind main.\
  \ Rule 24 reports how far AHEAD a branch is, which says whether it\n    holds work\
  \ nobody else has; it says nothing about the other direction, and that is the half\n\
  \    that says whether the branch is about to hit a painful merge or to run a suite\
  \ against a tree\n    main fixed hours ago. Behind-ness is computed in exactly ONE\
  \ place in the whole engine — inside\n    `worktree sync`, the verb that also CURES\
  \ it — so `worktree_synced.behind_before` is a receipt\n    for the cure and never\
  \ a signal of the disease, and a branch nobody synced is measured by\n    nothing\
  \ at all.\n    **THE MEASUREMENT.** Consumer side (<project> X-1105): five live\
  \ worktrees, ALL behind main — by\n    881, 881, 881, 273 and 168 commits — while\
  \ that morning's debt echo named exactly ONE branch,\n    and named it for being\
  \ AHEAD by a single commit. Over that repo's whole history 1077 worktrees\n    were\
  \ created and 80 carry a sync record, so 7% were ever measured, biased toward the\n\
  \    best-tended copies. The concrete cost is theirs too (<project>, 2026-08-20/21):\
  \ a\n    234-behind worktree carried two verify REDs already fixed on main, so the\
  \ session correctly ran\n    on main instead — where the stage-bound verb was inapplicable,\
  \ so it hand-ran per-layer\n    scripts, missed one of three declared layers, and\
  \ wrote receipts naming scripts rather than\n    declared test classes. Sync-then-run-in-the-worktree\
  \ cost a minute and is what the next morning\n    did. Kernel side (2026-08-25):\
  \ the six genuinely live lanes sat at 29 / 33 / 33 / 33 / 42 / 68\n    commits behind\
  \ and the three genuinely stale desk copies at 995 / 3946 / 4268.\n    **THE COUNT\
  \ IS BY SHA, NEVER BY CONTENT — rule 24's honest bound, carried verbatim.**\n  \
  \  `<branch>..main` counts commits main has BY SHA that the branch lacks; it is\
  \ NEVER a claim\n    their CONTENT is absent from the branch, since a change that\
  \ reached the branch by another\n    commit still shows as a difference. The bound\
  \ is stated in the lens, in the `next:` and in the\n    rendered line, for the same\
  \ reason rule 24 states it: the reporter's own supporting claim had\n    to be retracted\
  \ on exactly this point (X-1003), and a view that overstates its measurement\n \
  \   earns the skimming it gets.\n    **THE PREDICATE — four bounds, applied in the\
  \ FOLD, never in the reader\n    (`lessons/scope-the-trigger-not-the-view`).** A\
  \ branch reports iff (1) its name is in\n    `AHEAD_BRANCH_NAMESPACES` — SHARED\
  \ with rule 24, never re-declared, so the subject bound cannot\n    drift between\
  \ the two halves; AND (2) its behind-count is a positive int (a git older than 2.41\n\
  \    has no `%(ahead-behind:)` field, so an unreadable count DROPS the branch and\
  \ the view degrades\n    to SILENT rather than to a wrong number); AND (3) it HAS\
  \ A WORKTREE; AND (4) it is at least\n    `floor_commits` behind.\n    **WHY THE\
  \ LIVE-WORKTREE BOUND, and why the two halves legitimately differ here.** Rule 24's\n\
  \    subject is unmerged WORK, which is at risk whether or not a desk copy still\
  \ exists. This rule's\n    subject is a tree someone can RUN something in, which\
  \ is the entire cost above — a stale suite,\n    a re-fixed RED, a merge about to\
  \ hurt — and a branch with no worktree can host none of it.\n    Measured: the four\
  \ abandoned `_land_bookkeeping_commit` amend-residue refs (task) sit 16.8k-17.6k\
  \ commits behind with no worktree and no future, so an\n    unbounded fold would\
  \ put four permanent lines on every echo forever — which teaches a reader to\n \
  \   skim the echo and costs more than the blind spot this closes.\n    **THE FLOOR\
  \ IS ON COMMITS, NOT ON AGE — the deliberate departure from every sibling floor\
  \ here\n    (`_debt_behind_branch_floor_commits`, `YITC_DEBT_BEHIND_BRANCH_FLOOR_COMMITS`,\
  \ default 200).**\n    Elapsed time carries no information for this subject: a repo\
  \ committing hundreds of times a day\n    makes a copy cut this morning hundreds\
  \ behind by noon while a quiet day barely moves it, so the\n    same hours mean\
  \ opposite things in two repos, and in one repo on two days. Distance from main\n\
  \    is what hurts, so distance is what is floored. WHY 200: on the kernel frontier\
  \ nothing whatever\n    lies between the live lanes' 68 and the stale copies' 995,\
  \ so the floor sits an order of\n    magnitude above every live lane and an order\
  \ below every stale one — and it is below the\n    originating incident's own 234,\
  \ so it would have fired there. It rides rule 3 unchanged: the\n    count is never\
  \ hidden, only nearness suppresses, and a non-positive value disables the bound.\n\
  \    **THE READER NEEDS THE FULL FRONTIER — and that is why it does not reuse rule\
  \ 24's.**\n    `--no-merged main` yields exactly the branches AHEAD of main, so\
  \ it can never yield a branch\n    that is 0-ahead and far behind, which is precisely\
  \ the worst case this rule reports. One lives\n    on the kernel frontier now (`work/batch-culprit-attribution`,\
  \ 0 ahead / 3625 behind, measured\n    2026-08-25): fully merged, so invisible to\
  \ rule 24 by construction AND unreachable by its\n    reader. So `_behind_branch_view`\
  \ reads `for-each-ref refs/heads/` WITHOUT that flag, plus ONE\n    `git worktree\
  \ list --porcelain` parse for the live set — two whole-frontier calls, never one\n\
  \    per branch. A git error on either read fails toward SILENCE (an empty frontier,\
  \ an empty live\n    set), never toward reporting every branch as live\n    (`lessons/a-signal-about-a-reader-fails-safe-the-opposite-way-to-a-gate`).\n\
  \    It rides rules 2/3/5 verbatim — SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a\
  \ gate: no verb gains\n    a refusal, no exit code moves, and NOTHING is stored\
  \ or emitted. NO new store / event type /\n    verb / seam / config key. **AND THE\
  \ REPORT-ONLY BOUND IS THE REQUESTER'S OWN, not an inherited\n    default:** a stale\
  \ copy is very often perfectly fine — a parked card's worktree is stale BY\n   \
  \ DEFINITION and harmless until someone runs a suite in it — so a threshold that\
  \ refused, or a\n    verb that declined to serve a behind branch, would turn a surfacing\
  \ view into a fence and ship\n    something nobody asked for. A repo whose every\
  \ live worktree is current ⇒ suppressed, and a row\n    drops by itself once the\
  \ branch catches up or its worktree goes away.\n\n26. **ONE ABORT CAUSE REFUSING\
  \ SEVERAL DIFFERENT BRANCHES — the reading no per-lane surface can make\n    (the\
  \ 2026-08-21 04:27-04:49 window).**\n    An OPTIONAL injected report-only fold over\
  \ the JOURNAL (`debt.land_abort_cause_breadth`), wired at\n    the ONE shared host\
  \ residue like every sibling and riding all seams (session-start /\n    the `debt`\
  \ re-fold).\n    **A FOURTH READ — THE LAND HEAD, BEFORE THE SPEND (<project> X-1365).**\
  \ This fold is ALSO\n    read at the head of `land` itself — after the repeated-abort\
  \ backstop and BEFORE the\n    SPEC-0132 verify-admission wait and the verify behind\
  \ it — and prints ONE line per still-unresolved\n    cause on stderr (`views.abort_cause_breadth_land_head_lines`,\
  \ wired at the `cmd_land` residue).\n    ADDITIVE, and NOT a fourth debt-echo seam:\
  \ it does not ride `_debt_echo_lines`, so the «two code\n    call sites» the echo\
  \ rule states are UNCHANGED and every existing seam's output is byte-identical.\n\
  \    MEASURED (<project>, 2026-09-10): one unresolved cause — `verify-failed#e7ab35cc1f71`,\
  \ a\n    SECRETS-atom false positive later fixed in 7d78788963 — refused FOUR different\
  \ branches, and each\n    paid a FULL verify to re-diagnose what another branch\
