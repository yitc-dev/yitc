      digest is NOT dropped to make room: it is what ties this line to the repeated-abort backstop and to
      `worktree._land_abort_cause_identity`. The sample stays SHORT by rule — this is one
      suppressed-when-clean line on a seam that already carries a dozen others, and a failing-set dump
      gets read past for a different reason. A cause whose rows carried no assertion text prints the
      digest alone rather than inventing a name.
      **THE ROW NAMES WHEN ITS CAUSE LAST FIRED.** Each reported cause also carries the age
    of the `last_ts` the fold already returns, rendered beside the branch list in the rule-34 span
    idiom (`Xh0Ym` / `Xm`). MEASURED, and it is the second reading-failure this line has had rather
    than a polish pass: on 2026-08-30 the named cause last fired at 10:55:22Z, four later lands
    passed the same pinned leg, and at 15:13Z the line was still reported to the owner as «one
    cause is STILL failing seven branches». Everything the line prints is 24h-WINDOWED and reads in
