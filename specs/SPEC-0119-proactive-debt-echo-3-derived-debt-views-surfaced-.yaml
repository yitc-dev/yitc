  \ spec-carried leaves the recomputed set; one newly-governing key is\n    ~3 points).\
  \ **What is a defect is WHEN the drift is discovered.** With no seam reading the\n\
  \    coverage, the first reader is `land`, refusing as a hard gate. MEASURED, twice\
  \ in one day: coverage\n    reached 79% and refused `work/spec0161-name-acceptance-probe-recorded`\
  \ — the land of the very card\n    filed to unblock a frozen branch — with ten governing\
  \ pairs unnamed; separately found the\n    root-cwd read-set reports stale mid-land\
