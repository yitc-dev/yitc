      previous day (06:52Z / 13:31Z / 18:12Z) and the fixing card had landed at 02:38Z. Every
      fact printed was true and the reading it produced — «one cause is refusing three branches» — was
      false. A report-only surface that survives its own fix is read as spam, and a surface read as spam
      is not read at all.
      **BORROWED, NOT INVENTED.** Rule 34, this rule's own transpose, has stopped reporting a landed
      branch since («attempts are counted only AFTER the branch's most recent SUCCESSFUL land
      inside the window»), and rule 18 states the family doctrine: the drop criterion is
      RESOLUTION, never AGE. Rule 26 was the last member of the family still dropping on the clock.
      **WHAT THE ROW REPORTS, so the two counts are not confused.** The named branch list and its count
      stay EVERY branch the cause refused in the window — unchanged, because a reader chasing the cause
      wants every lane it hit — and the line appends «K since landed» when K > 0, so a partially
      resolved cause is legible. What GATES the line is the UNRESOLVED count alone. A cause with nothing
