      until this arm nothing here re-read the journal for the adoption evidence ITSELF. So emitting
      the genuine `consumer_read_evidence` / `live_trigger_evidence` that CHARTER §P8 actually
      recognises left the row exactly where it was, while writing a followup promising it removed
      the row. A reporting consumer routed 11 named closures and the count fell from 11 to 8 — by
      the three PROMISES and by NONE of the eight PROOFS; that card's own AC2 had to be authored to
      EXPECT it, which is the sharpest evidence available (X-1190). The sibling report is the same
      fold from the false-positive side: 7 of 11 rows were closures whose substantive evidence was
      emitted 17-38 SECONDS after the `task_closed` row (X-1170). The cause is structural, not
      incidental — the WARN is a HISTORICAL SNAPSHOT taken at close and is immutable once fired.
      So a surviving candidate whose task id carries a P8 adoption event stamped AT-OR-AFTER its
      WARN, judged substantive, is dropped (`debt._p8_later_evidence_clears`). At-or-after rather
      than strictly after: the WARN's own firing proves close did not see the evidence, and a
      second-resolution stamp cannot separate "the same instant" from "just after".
      **THE STANDARD IS NOT WIDENED — IT IS THE CLOSE-TIME ONE, REUSED.** The judgement is
      `task._p8_evidence_is_substantive`, the same predicate `task close` applies (SPEC-0015):
      imported, never re-implemented, so the two cannot drift (CHARTER §P5), with its consumer-arm
      deps left un-injected — which that predicate reads as KERNEL, the stricter of its two
      readings. A prose-only or circular payload therefore still fails and the row still reports.
      No new store, field, event, verb or seam, and no second journal read: `segment_rows` already
      materialises the whole logical journal as a list, so the fold HOLDS that list as the
      resolution corpus and collects the P8 rows in the SAME pass that finds the WARNs, consulting
      the arm for SURVIVING candidates only.
      **IT FAILS TOWARD SILENCE, WHICH IS THE OPPOSITE OF A GATE**
      (`lessons/a-signal-about-a-reader-fails-safe-the-opposite-way-to-a-gate`). This DESCRIBES what
      a closing session did, so every state it cannot decide — an absent or unparseable card, an
      unparseable `ts`, a followup fold that raises — reads as CARRIED and drops out. A false "you
      left this uncarried" defames a real carrier and gets the whole line skimmed; a missed
      detection only leaves the silence that already exists. Candidacy is an IDENTITY test
      (`is False`), so an absent or non-bool key is never a fired WARN.
      **THE ONE PLACE THAT DIRECTION INVERTS, and it is deliberate ( audit-pre pass 1,
      high):** the later-evidence arm alone. The three carrier tests ask "is someone HOLDING this
      obligation?", where an unreadable state is no evidence that anyone dropped it. That arm asks
      "has the proof been EMITTED?", and reading an unanswerable state as YES would fabricate an
      adoption claim — precisely the self-issued prose `_p8_evidence_is_substantive` exists to
      reject. So an import failure, a raising predicate or an unparseable stamp CLEARS NOTHING.
      That direction is not accusing either: it reproduces the fold's pre-change output exactly and
      can never print a row this view would not already print.
      **NO STORE, NO EVENT TYPE, NO VERB, NO SEAM, NO CONFIG KEY — ONE env knob**,
      `YITC_DEBT_UNCARRIED_P8_WINDOW_HOURS` (`cli._debt_uncarried_p8_window_hours`, default 168 =
      7 days; non-positive DISABLES). A reading HORIZON, never a count floor — it hides nothing
      INSIDE the window. It exists because the horizon is load-bearing at this corpus size: the
      engine journal carries 452 historical `adoption_evidence_seen: false` rows, so an unbounded
      fold would print a number no session can act on — the noise that buries the echo it rides
      (SPEC-0149's own trial-run disproof). Measured on this repo at ship: 168h reads 29, 72h 14,
      24h 5. 168 is the rule-27 window reused rather than a new number, and it spans a weekend,
      which a 72h horizon does not.
      **REPORT-ONLY, and deliberately nothing more:** it does not gate closing without a carrier,
      does not re-open a card, and moves no exit code. Nothing in SPEC-0015's P8 payload contract is
      weakened by it — the carriers it counts are the sanctioned THIRD P8 satisfier (a filed
      follow-up), not a fourth.
      Unit tests (`tests/test_t11740_p8_later_evidence_arm.py`, the later-evidence arm): the AC1
    differential as a PAIR of corpora identical but for whether adoption was actually proved,
    with the pre-change baseline proved by execution (3/11 against the un-edited fold — every
    AC1/AC2 probe fails and the three carrier probes pass); the honesty guard on both rejected
    payload shapes, prose-only and circular, each with a substantive control as teeth; the three
    pre-existing paths each still clearing; the inverted fail-direction asserted by making the
    predicate RAISE; and the ordering, correlation, no-second-read and constant-parity teeth.
    Unit tests (`tests/test_uncarried_p8_warn_surfaced.py`): the AC3 DIFFERENTIAL written as
      INDISTINGUISHABILITY rather than presence (the fold over a CARRIED corpus is byte-equal to the
      fold over a corpus with no WARN at all, and the uncarried fixture is the only input that
      breaks that equality); each carrier kind separately, including the audit-pre pass-1 case
      asserted by name (a `relates_to` match with NO marker does NOT carry); the fail-toward-silence
      arms; the window and knob arms; the render driven through the real `debt` CLI in both halves;
      and the teeth arms, without which every assertion above could be vacuously true.

  32. **HOW FAR BEHIND MAIN EACH LIVE WORK BRANCH IS — the other half of rule 24 (kupiclub
      X-1105).**
      An OPTIONAL injected report-only view over the FULL git BRANCH FRONTIER
      (`debt.behind_work_branches`), wired at the ONE shared host residue like every sibling and
      riding all 3 seams (session-start / land-tail / the `debt` re-fold).
      **SUBJECT.** A `task/*` or `work/*` branch that HAS A WORKTREE and sits more than
      `floor_commits` behind main. Rule 24 reports how far AHEAD a branch is, which says whether it
      holds work nobody else has; it says nothing about the other direction, and that is the half
      that says whether the branch is about to hit a painful merge or to run a suite against a tree
      main fixed hours ago. Behind-ness is computed in exactly ONE place in the whole engine — inside
      `worktree sync`, the verb that also CURES it — so `worktree_synced.behind_before` is a receipt
      for the cure and never a signal of the disease, and a branch nobody synced is measured by
      nothing at all.
      **THE MEASUREMENT.** Consumer side (kupiclub X-1105): five live worktrees, ALL behind main — by
      881, 881, 881, 273 and 168 commits — while that morning's debt echo named exactly ONE branch,
      and named it for being AHEAD by a single commit. Over that repo's whole history 1077 worktrees
      were created and 80 carry a sync record, so 7% were ever measured, biased toward the
      best-tended copies. The concrete cost is theirs too (kupiclub, 2026-08-20/21): a
      234-behind worktree carried two verify REDs already fixed on main, so the session correctly ran
      on main instead — where the stage-bound verb was inapplicable, so it hand-ran per-layer
      scripts, missed one of three declared layers, and wrote receipts naming scripts rather than
      declared test classes. Sync-then-run-in-the-worktree cost a minute and is what the next morning
      did. Kernel side (2026-08-25): the six genuinely live lanes sat at 29 / 33 / 33 / 33 / 42 / 68
      commits behind and the three genuinely stale desk copies at 995 / 3946 / 4268.
      **THE COUNT IS BY SHA, NEVER BY CONTENT — rule 24's honest bound, carried verbatim.**
      `<branch>..main` counts commits main has BY SHA that the branch lacks; it is NEVER a claim
      their CONTENT is absent from the branch, since a change that reached the branch by another
      commit still shows as a difference. The bound is stated in the lens, in the `next:` and in the
      rendered line, for the same reason rule 24 states it: the reporter's own supporting claim had
      to be retracted on exactly this point (X-1003), and a view that overstates its measurement
      earns the skimming it gets.
      **THE PREDICATE — four bounds, applied in the FOLD, never in the reader
      (`lessons/scope-the-trigger-not-the-view`).** A branch reports iff (1) its name is in
      `AHEAD_BRANCH_NAMESPACES` — SHARED with rule 24, never re-declared, so the subject bound cannot
      drift between the two halves; AND (2) its behind-count is a positive int (a git older than 2.41
      has no `%(ahead-behind:)` field, so an unreadable count DROPS the branch and the view degrades
      to SILENT rather than to a wrong number); AND (3) it HAS A WORKTREE; AND (4) it is at least
      `floor_commits` behind.
      **WHY THE LIVE-WORKTREE BOUND, and why the two halves legitimately differ here.** Rule 24's
      subject is unmerged WORK, which is at risk whether or not a desk copy still exists. This rule's
      subject is a tree someone can RUN something in, which is the entire cost above — a stale suite,
      a re-fixed RED, a merge about to hurt — and a branch with no worktree can host none of it.
      Measured: the four abandoned `_land_bookkeeping_commit` amend-residue refs (task) sit 16.8k-17.6k commits behind with no worktree and no future, so an
      unbounded fold would put four permanent lines on every echo forever — which teaches a reader to
      skim the echo and costs more than the blind spot this closes.
      **THE FLOOR IS ON COMMITS, NOT ON AGE — the deliberate departure from every sibling floor here
      (`_debt_behind_branch_floor_commits`, `YITC_DEBT_BEHIND_BRANCH_FLOOR_COMMITS`, default 200).**
      Elapsed time carries no information for this subject: a repo committing hundreds of times a day
      makes a copy cut this morning hundreds behind by noon while a quiet day barely moves it, so the
      same hours mean opposite things in two repos, and in one repo on two days. Distance from main
      is what hurts, so distance is what is floored. WHY 200: on the kernel frontier nothing whatever
      lies between the live lanes' 68 and the stale copies' 995, so the floor sits an order of
      magnitude above every live lane and an order below every stale one — and it is below the
      originating incident's own 234, so it would have fired there. It rides rule 3 unchanged: the
      count is never hidden, only nearness suppresses, and a non-positive value disables the bound.
      **THE READER NEEDS THE FULL FRONTIER — and that is why it does not reuse rule 24's.**
      `--no-merged main` yields exactly the branches AHEAD of main, so it can never yield a branch
      that is 0-ahead and far behind, which is precisely the worst case this rule reports. One lives
      on the kernel frontier now (`work/batch-culprit-attribution`, 0 ahead / 3625 behind, measured
      2026-08-25): fully merged, so invisible to rule 24 by construction AND unreachable by its
      reader. So `_behind_branch_view` reads `for-each-ref refs/heads/` WITHOUT that flag, plus ONE
      `git worktree list --porcelain` parse for the live set — two whole-frontier calls, never one
      per branch. A git error on either read fails toward SILENCE (an empty frontier, an empty live
      set), never toward reporting every branch as live
      (`lessons/a-signal-about-a-reader-fails-safe-the-opposite-way-to-a-gate`).
      It rides rules 2/3/5 verbatim — SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a gate: no verb gains
      a refusal, no exit code moves, and NOTHING is stored or emitted. NO new store / event type /
      verb / seam / config key. **AND THE REPORT-ONLY BOUND IS THE REQUESTER'S OWN, not an inherited
      default:** a stale copy is very often perfectly fine — a parked card's worktree is stale BY
      DEFINITION and harmless until someone runs a suite in it — so a threshold that refused, or a
      verb that declined to serve a behind branch, would turn a surfacing view into a fence and ship
      something nobody asked for. A repo whose every live worktree is current ⇒ suppressed, and a row
      drops by itself once the branch catches up or its worktree goes away.

