  \ echo, which is how a report-only surface trains its readers to stop reading it.\n\
  \    **The unit is the CONCERN, not the carrier** (`lessons/scope-the-trigger-not-the-view`):\
  \ one row per\n    unratified record, so a ratified sibling can never clear an unratified\
