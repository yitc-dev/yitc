body: "## Scenario\n\nAny session — the engine's own or a `-C` consumer's — is SHOWN\
  \ its outstanding technical debt at the\nmoments the debt changes, without having\
  \ to ask. Three DERIVED debt views —\nnot-adopted (shipped-but-not-live) / open-followups\
  \ / overdue-rechecks — are rendered as short\nREPORT-ONLY lines at session-start\
  \ and at each land; when there is no debt, nothing prints. The\nopen-followups line\
  \ names what to DO (the disposition fork), so the debt is not just visible but\n\
  actionable.\n\n## Internal\n\nTHE PROACTIVE-DEBT-ECHO RULE. A push over EXISTING\
  \ derived views at EXISTING code seams — no new\nstore, cron, autopilot, or view\
  \ (CHARTER §P1). Reuses the SPEC-0086 `cross-coord:` echo discipline.\n\n1. **One\
  \ render helper.** A single function computes the counts from the EXISTING derived\
  \ views.\n   THREE BASE views — not-adopted + overdue-rechecks (SPEC-0094 §2/§3,\
  \ `_view_not_adopted` /\n   `_view_overdue_recheck`) and open-followups (SPEC-0095,\
  \ `cmd_followup_list`) — PLUS optional\n   INJECTED views appended under the same\
  \ discipline: startup_checks (rule 7), born-schema-skew\n   (rule 8), concern-conformance\
  \ (rule 9), and **review-due** (rule 10). NO stored state:\n   re-derived on every\
  \ call. (\"three views\" in this spec's title/prose is the historical BASE count\
  \ —\n   the injected views extend it.)\n2. **Two seams: one code call site + the\
  \ on-demand verb (the land-tail seam RETIRED).** The\n   helper is invoked at\n\
  \   (a) **session-start** (`cmd_session_start`, beside the SPEC-0086 `cross-coord:`\
  \ echo) and\n   **WORKTREE EXCEPTION at the session-start seam (WIDENED to the checkout).**\n\
  \   The session-start invocation is SKIPPED — the helper is not called at all —\
  \ when the run is\n   inside a WORKTREE. That is the whole condition (`cli.py#_receipt_only_session_start`),\
  \ two arms in\n   this ORDER: (1) a main-checkout journal that resolves AND differs\
  \ from this checkout's; (2) ONLY\n   when that main lookup returns NONE, the BARE-CLONE\
  \ arm — `git worktree list --porcelain`\n   at this checkout SUCCEEDS, names NO\
  \ `branch refs/heads/main`, lists a `bare` entry FIRST, and THIS\n   checkout (its\
  \ root AND the directory its journal lives in, as realpaths) is one of the LINKED\n\
  \   entries: the remote-verify box leg, a detached checkout of a bare clone in which\
  \ no checkout holds\n   main, so no main-checkout seam exists there. The second\
  \ arm is never OR'd in unordered and never\n   keyed on the harness-narrowed locus.\
  \ No flag, no config, no new store. The skip announces\n   itself in one line naming\
  \ the re-fold.\n   **The seam is the MAIN CHECKOUT; the ground is AUDIENCE, not\
  \ re-delivery.** originally\n   keyed this on a FRESH same-ref same-epoch `seed_read`\
  \ receipt on the main journal and justified\n   it as RE-DELIVERY ONLY — such a\
  \ session had already received the echo. That ground is sound but\n   reaches only\
  \ part of the case, and measured the remainder in a `task/` worktree\n   2026-09-07:\
  \ a dispatched Worker's `session start --type build` ALREADY skipped (its launcher\n\
  \   pre-records the main receipt — 2.8s whole run), but a FIRST-in-checkout anchor\
  \ holding\n   no prior receipt spent 7.8s deciding the predicate and then 28.5s\
  \ folding 18 debt lines, inside\n   a checkout where this echo reaches nobody who\
  \ acts on it. So the recorded ground is now\n   AUDIENCE + SEAM: this echo is a\
  \ Controller/MAIN-CHECKOUT session-start surface — the same\n   reasoning SPEC-0039\
  \ §0 uses to exempt a dispatched worker from the MEMORY.md buffer. Widening\n  \
  \ the condition also REMOVES the ref resolution and the `gates.fresh_seed_receipt`\
  \ read (CHARTER\n   §P1 F3). That read was that helper's ONLY caller, so `gates.fresh_seed_receipt`\
  \ — and\n   tail-first cut inside it — is left UNWIRED; it is deliberately NOT deleted\
  \ by this card, whose\n   scope is the echo wiring, and its retirement (which also\
  \ retires two suites and touches\n   `gates.py`) is filed as its own adjacent card\
  \ per §Filing rule. The SPEC-0050 §8 seed read-gate\n   does NOT use this helper\
  \ — it has its own readers — so nothing about that gate moves.\n   **What does NOT\
  \ move, and the fail-closed direction.** (The LAND-TAIL seam (b) was later RETIRED\n\
  \   outright —, below — so the main checkout's session start is the echo's only\
  \ SEAM-borne delivery.)\n   rule 3's report-only + suppressed-when-clean discipline\
  \ is unchanged; the echo gates nothing, so\n   nothing that gates moves; rule 5's\
  \ on-demand `bin/yitc-v2 debt` re-fold stays the escape — the\n   same pointer that\
  \ already covers post-`/compact` eviction — and the skip line names it. On the\n\
  \   MAIN checkout the two journal paths are equal, so the predicate is False BY\
  \ CONSTRUCTION and\n   that seam is untouched. Where the main checkout cannot be\
  \ RESOLVED and the bare-clone arm does not\n   hold — a FAILED listing, an unresolved\
  \ main in a NON-bare repo, or a journal redirected off the\n   checkout — the predicate\
  \ answers False and the session pays exactly the full echo it paid before:\n   fail-closed\
  \ toward the prior behaviour, deliberately NOT degraded to \"assume worktree\",\
  \ which would\n   invert the direction and could suppress the echo on `main` itself.\
  \ The bare-clone arm is NOT that\n   declined degrade: its listing PROVES that no\
  \ checkout holds main. Earlier grounds, unchanged: the\n   fold cost 52.6s of a\n\
  \   57.5s fresh-worktree `session start` measured 2026-09-05 (fu_2f8148e07bea, owner-surfaced).\n\
  \   (b) **land-tail — RETIRED (owner decisions 2026-09-28 events.jsonl#ts=\n   and\
  \ #ts=).** `land` prints NO debt echo, for ANY lander (dispatched worker,\n   Controller,\
  \ interactive — no discriminator). Grounds: (i) no reader consumed it — a worker's\
  \ land\n   stdout reaches only its own dispatch log, and nothing in bin/ or tests/\
  \ outside the retired\n   land-tail tests parses a land log for `debt:` lines; (ii)\
  \ it was the costliest line of every land\n   — the whole fold, measured 4.2 GiB\
  \ / 63 s on the kernel (2026-09-28); (iii) its two SIDE-EFFECT\n   WRITERS (`_profile_gap_autofile`,\
  \ rule 39 / SPEC-0198 rule 5; `_profile_snapshot_record`, SPEC-0198\n   rule 7)\
  \ never persisted from this seam: a land runs with REPO_ROOT = EVENTS_PATH = the\
  \ landing\n   worktree W, the tail was computed AFTER the ff-merge, and `worktree\
  \ remove --force` then discarded\n   W's post-integrate journal dirt — so nothing\
  \ depended on them firing at the land. Both writers ride\n   main-checkout session\
  \ start + the on-demand `debt` re-fold exactly as before. Currency is kept by\n\
  \   those two seams: each re-derives the CURRENT TOTAL (no per-land delta was ever\
  \ computed).\n   **READING THE REST OF THIS SPEC (interpreting clause).** Every\
  \ later rule that says a view rides\n   \"the seams (session-start / `debt` re-fold)\"\
  , \"all three debt seams\", or names the\n   land tail as a place a debt line prints,\
  \ is read as the TWO surviving seams — main-checkout session\n   start + the on-demand\
  \ `bin/yitc-v2 debt` re-fold. Where a rule WITHHELD a collaborator from the land\n\
  \   tail (rules 21, 25), that withholding is now moot: there is no land-tail seam\
  \ to withhold from. No\n   other obligation of any rule moves.\n3. **Print discipline\
  \ (reuses SPEC-0086 verbatim).** A line prints ONLY when its count > 0;\n   SUPPRESSED-WHEN-CLEAN;\
  \ REPORT-ONLY — it never gates, blocks, or auto-acts.\n   **Open-followups floor\
  \ (X-0157).** The open-followups line additionally requires its\n   count AT/ABOVE\
  \ a configurable floor (env `YITC_DEBT_FOLLOWUP_FLOOR`, default 5): a SMALL backlog\n\
  \   of 1..floor-1 open followups is treated as CLEAN (suppressed) so it does not\
  \ spam the echo; a\n   non-positive floor disables it (any count > 0 fires). The\
  \ floor is scoped to open-followups ONLY —\n   not-adopted is already status-gated\
  \ to `shipped-not-live` (a floor there would risk re-hiding the\n   X-0142 LARGE-count\
  \ incident this echo exists to catch) and overdue-rechecks are date-triggered\n\
  \   genuine past-due obligations (never count-hidden); both stay unfloored.\n  \
  \ **The floor governs the ACTIONABLE headline ONLY.** Of the three open-followup\
  \ counts\n   (SPEC-0095 §Armed), `actionable` is the floored headline; `armed_fired`\
  \ gets its OWN clause and is\n   **UNFLOORED** — a fired trigger is a dated, event-triggered\
  \ obligation exactly like an overdue\n   recheck, so it is never count-hidden (this\
  \ is what forbids \"arm it and it silently disappears\n   forever\"); `armed_waiting`\
  \ is a TAIL on whichever followup line already prints and NEVER forces one\n   (a\
  \ waiter is not yet actionable, so it must never nag). The tail rides exactly ONE\
  \ line, never both.\n   **POST-SHIP OBSERVATIONS — a FOURTH clause, UNFLOORED, off\
  \ the SAME `_view_overdue_recheck` call\n   (SPEC-0036 / X-0710).** The overdue-recheck\
  \ view folds a second dated deferred-proof\n   carrier: a task's `post_ship_observation:\
  \ {observation, due_by}` — the declaration the Stage-8\n   `--post-ship-observation`\
  \ carve-out requires when an acceptance proof is a multi-day post-ship\n   production\
  \ observation. It gets its OWN echo line, deliberately NOT folded into the overdue-recheck\n\
  \   count: that count means \"waivers past recheck_by\" and its remedy is a live_probe\
  \ at the deploy\n   seam, while this one means \"an acceptance proof a Stage-8 audit\
  \ deferred is still unrecorded\" and\n   its remedy is to take the reading and record\
  \ it — two signals, two lines, two remedies, never\n   conflated (the comment-contract\
  \ precedent). UNFLOORED **and printed while still `pending`**\n   (not only once\
  \ past `due_by`), on rule 3's own ground: a deferred proof that goes quiet until\
  \ it is\n   late is exactly how deferred adoption becomes never-adopted. It adds\
  \ NO new collaborator and NO new\n   call site — the clause reads the view the echo\
  \ already folds — and clears only when the card's\n   `settled_by` names where the\
  \ recorded reading landed.\n   **AN OBSERVATION ON A `wont-do` CARD THAT NEVER SHIPPED\
  \ IS NOT OWED, AND IS COUNTED APART\n.** The clause above counts an obligation on\
  \ a SHIPPED change. A card that went\n   `wont-do` with no recorded `commit` shipped\
  \ nothing, so its declared observation has no subject\n   — and no verb can settle\
  \ it, since `task close --settle-observation` admits a `done` card only.\n   Such\
  \ an observation leaves the pending / overdue counts and is reported on its OWN\
  \ named,\n   counted set, each row carrying its task id. It is MOVED, never dropped:\
  \ the echo names the\n   group beside the observation line, and alone when the group\
  \ is all that is left. A `wont-do`\n   card that DID record a `commit` is a partial\
  \ ship with something to observe and stays counted;\n   every other status is counted\
  \ exactly as before.\n   **DEFERRED ACCEPTANCE PROBES — a FIFTH clause, UNFLOORED,\
  \ off the SAME `_view_overdue_recheck`\n   call (SPEC-0015 / <project> X-1066).**\
  \ The overdue-recheck view folds a THIRD\n   deferred-proof carrier: a card's own\
  \ `probes: {ACx: deferred}` — a proof the CLOSURE recorded as\n   owed. The state\
  \ was first-class and its settle already existed (`task close --settle-probe`, fail-closed\
  \ against a probe that was never deferred); what was missing was the RETURN, so\n\
  \   <project> closed with both probes correctly deferred and nothing but the card\
  \ remembered.\n   That is the shipped-but-not-adopted shape this echo exists to\
  \ catch, arriving through the one door\n   left open — an HONEST deferral — and\
  \ the incentive ran the wrong way: an overclaim is caught by the\n   auditor, a\
  \ correct deferral got silence. It gets its OWN echo line, deliberately NOT folded\
  \ into\n   the overdue-recheck count nor into the observations one: three deferred\
  \ proofs, three remedies —\n   this one's is to settle the probe with its evidence\
  \ — and a conflated count tells the reader none\n   of them. UNFLOORED, and **COUNTED\
  \ from the moment the deferral is recorded, HEADLINED from the\n   moment it is\
  \ DUE** ( — the split the FOURTH clause already carries, arriving here now\n   that\
  \ a deferral records its firing moment). At closure `--probe-deferred <AC>:<moment>`\
  \ records\n   WHAT FIRES the probe, in one of the two forms the corpus already has\
  \ — a `due_by` ISO date (the\n   post_ship_observation shape) or an `awaits` ref\
  \ (`T-NNNN` / `X-NNNN` /\n   `events.jsonl#type=<t>[@after=<ISO ts>]`, the SPEC-0095\
  \ §Armed shape) — stored as the ONE\n   sibling mapping `probe_moments:` beside\
  \ `probes:` (schema home SPEC-0028); a BARE key is\n   REFUSED at every close-time\
  \ door onto that mapping, naming both accepted forms. DUE is decided\n   by the\
  \ SAME predicate the followup `armed → fired` fold reads (`followup.arrived_ids`\
  \ /\n   `event_after_arrived`), never a second one. So the headline names what a\
  \ reader can act on\n   TODAY and the rest rides a «(N deferred, not yet due)» TAIL\
  \ — and, exactly as in the fourth\n   clause, the pending count MOVES SLOT but never\
  \ DISAPPEARS: with zero due the line still PRINTS\n   («no deferred probe is due\
  \ — N awaiting their moment»), because filtering the view down to due\n   would\
  \ headline the right number by making every not-yet-due obligation silently vanish,\
  \ which\n   is the failure this rule exists to prevent. A LEGACY key-only deferral\
  \ reads DUE — it names no\n   moment, so «now» is the only truthful reading of it,\
  \ and DUE is the safe direction. The prior\n   ground for headlining the whole set\
  \ from deferral — that a deferred probe carried NO due date\n   at all, so there\
  \ was no moment at which a delayed line would start printing — is RETIRED: after\n\
  \   this change it does carry one, and the unbounded from-deferral headline that\
  \ ground justified\n   surfaced 94 cards / 96 probes on 2026-09-04, most of whose\
  \ readings could not be taken that day. It adds NO new collaborator and NO new call\
  \ site — the clause reads the view the echo\n   already folds — and NOTHING but\
  \ the settle clears it (the discharge is keyed on the recorded value\n   the settle\
  \ itself flips out of `deferred`, never a parallel marker). REPORT-ONLY, and deliberately\n\
  \   nothing more: it does not change what may be deferred and does not gate closing\
  \ with a deferral —\n   deferring is the honest move and must stay cheap.\n   **THE\
  \ TWO NON-PASS TERMINALS — a SIXTH and SEVENTH clause, off the SAME\n   `_view_overdue_recheck`\
