  \ no exit code moves. NO new store / event type / verb / env knob\n    (one more\
  \ OPTIONAL injected collaborator; P1). UNFLOORED in COUNT and in AGE alike — on\
  \ the same\n    ground as rules 11/12/13/14 for the count, and because an age floor\
  \ here would be the very silencer\n    the rule removes. A repo whose journal records\
  \ no halt ⇒ count 0 ⇒ suppressed, so history is never\n    retro-charged. BEST-EFFORT\
  \ / fail-safe: a reader that RAISES, a malformed record, or one unreadable\n   \
  \ task id is contained — never fatal to the seam it rides, never a false silence.\n\
  \n19. **A CHANGE in the recorded slowest test files.** An OPTIONAL injected report-only\
  \ view\n    (`debt.slowest_decile_changes`, collaborator of `_render_debt_echo`)\
  \ over the per-file test\n    duration SERIES records on every successful land\n\
  \    (`land_completed.data.verify_metrics.per_file_durations`). It reports what\
  \ MOVED in the recorded\n    slow tail between the latest land and the median of\
  \ the previous window: a file that newly\n    ENTERED the recorded slowest set,\
  \ or a member that GREW materially.\n    **THE DELTA, NEVER THE LEVEL — this is\
  \ the whole rule, not an implementation detail.** A slowest\n    set EXISTS BY DEFINITION,\
  \ so a view that printed the set itself would print on EVERY land, and a\n    surface\
  \ that always prints trains its reader to skip it — the same silent failure, reached\
  \ by\n    another route, as having no surface at all. Reporting only the change\
  \ is what makes\n    SUPPRESSED-WHEN-CLEAN a real property here rather than a decoration:\
  \ clean means no new entrant\n    and no material growth, and clean prints NOTHING.\
  \ The current tail stays available ON DEMAND from\n    the latest land's own record,\
  \ exactly as the debt views themselves are available on demand.\n    **NO ABSOLUTE\
  \ BAR, and the rejected one is named.** The original design anchored to the 300s\n\
  \    per-file verify timeout (SPEC-0071). That is an ABORT bound, not a health target:\
  \ it makes a file\n    interesting only once it is near failing a land (135.7s reads\
  \ as a comfortable 45% while being a\n    bad cost for one test), and it goes silent\
  \ entirely once everything sits under it — precisely\n    when durations creep back\
  \ up unwatched. A relative reading decrees nothing and self-calibrates.\n    The\
  \ 300s bound stays what it already is: the hard abort.\n    **ENTRANT IS DEFINED\
  \ BY MEMBERSHIP, never by \"unseen anywhere before\".** A file counts as an\n  \
  \  entrant when it is absent from the BASELINE SLOWEST-SET MEMBERSHIP — the union\
  \ of the prior\n    window's recorded names. An EXISTING, long-known test file CLIMBING\
  \ INTO the slow tail is the\n    primary way a creep first shows itself; an \"absent\
  \ from all duration data\" reading would miss\n    exactly that case, and it is\
  \ the reading the audit-pre of the authoring task rejected.\n    **THE BASELINE\
  \ IS A MEDIAN OF A WINDOW, not the previous land.** Comparing against a single prior\n\
  \    run fires on ordinary run-to-run jitter, and a view that fires on noise is\
  \ skipped within a week —\n    taking its next real signal with it. The median over\
  \ the window is the noise-robust reading and,\n    on a genuinely unchanged series,\
  \ is exactly the unchanged value, so the clean case stays silent.\n    GROWTH must\
  \ clear TWO bars together: a RELATIVE one (scale-free, so a slow file and a fast\
  \ one are\n    judged alike) and an ABSOLUTE ms one (so a small file's wobble stays\
  \ mute).\n    **ONLY `passed` OBSERVATIONS COMPARE.** A file that failed, timed\
  \ out, was killed by fail-fast or\n    never launched exits early or is capped,\
  \ so its wall is not comparable across lands; scoring it\n    would manufacture\
  \ growth and shrinkage out of test OUTCOMES. Such an entry scores on neither side.\n\
  \    This hides nothing — record still carries every outcome; this view's subject\
  \ is duration\n    comparability, not test health.\n    **THE EVIDENCE FLOOR (rule\
  \ 3 applied).** Below a minimum number of prior records the view says\n    NOTHING:\
  \ with one or two lands there is no previous state to have changed from, and every\
  \ file\n    would read as an entrant. A freshly-started series therefore stays silent\
  \ BY DESIGN — the state\n    of the real journal immediately after.\n    **THE FAIL\
  \ DIRECTION IS TOWARD SILENCE — and it INVERTS rule 18's, deliberately.** Rule 18\
  \ fails\n    toward VISIBLE because a lost halt loses a decision someone is owed.\
  \ Here the subject is an\n    advisory trend, and a FABRICATED change is worse than\
  \ a missed one: a creep watch that cries wolf\n    is unread within a week. So every\
  \ uncertainty — too little history, an unparseable record, a\n    non-comparable\
  \ outcome — resolves to saying nothing.\n    **NOT A CADENCE (SPEC-0142 §4).** This\
  \ stands up no recurring obligation and owns no trigger of\n    its own: it is computed\
  \ inline at seams a controller already passes, and computes nothing when\n    nobody\
  \ passes one. NO fourth cadence layer, no cadence store, no registry. The rejected\n\
  \    alternative was a nightly check, and the reason is the rule's own subject:\
  \ a nightly report is\n    read only if someone opens it, so its failure is indistinguishable\
  \ from a quiet week.\n    **WHAT IT REPLACES (P1 F3, named).** The REACTIVE watch\
  \ on test duration — a followup armed to\n    return only once a test ACTUALLY crosses\
  \ the timeout, i.e. after a land has already aborted on\n    it. That trigger becomes\
  \ redundant the moment this line ships, and is dropped with this rule.\n    It rides\
  \ rules 2/3/5 verbatim — the SAME seams (session-start / `debt` re-fold) from\n\
  \    the ONE host residue, SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a gate: no\
  \ verb gains a refusal on\n    account of this row and no exit code moves. NO new\
  \ store / event type / verb / env knob / seam —\n    one more OPTIONAL injected\
  \ collaborator reading a payload that already exists (P1 F1/F2). A repo\n    whose\
  \ journal carries no such series ⇒ count 0 ⇒ suppressed, so history is never retro-charged.\n\
