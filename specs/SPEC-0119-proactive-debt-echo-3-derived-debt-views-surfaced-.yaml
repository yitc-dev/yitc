  \ ARM IS BYTE-IDENTICAL.** `borrowed_record` defaults False: governing / named /\n\
  \    unnamed / coverage are unchanged there, and the result only gains `excluded_types:\
  \ []` +\n    `declared_types_resolved: true`.\n    **THE FLOOR IS NOT MOVED AND\
  \ NOT OWNED HERE.** `debt.SPEC0161_COVERAGE_FLOOR` is 0.80 because\n    SPEC-0161's\
  \ gate says 0.80; this rule reports distance from it and changes it by no path.\
  \ The\n    margin is a notice width, never a bar: it cannot make any measurement\
  \ pass or fail anything.\n    **ONE ORACLE, STRUCTURALLY (the discipline).** The\
  \ computation is NOT re-implemented here.\n    It was MOVED out of the catalog gate\
  \ into `debt.spec0161_payload_key_coverage` — pure, no I/O,\n    inputs by keyword\
  \ — and BOTH readers call it: this fold and the gate. A debt-side copy would drift\n\
  \    from the gate's exactly as the record drifts from the corpus, reproducing one\
  \ level up the very\n    failure this line exists to catch. The fold's own test\
  \ asserts the two agree on the repo's live\n    reading, so a future edit that forks\
  \ them reddens.\n    **AN EMPTY DENOMINATOR IS NOT A READING.** Nothing governing\
  \ folds to `coverage: None` and count 0,\n    deliberately NOT to 0% — a probe that\
  \ found nothing to measure is a different condition from a\n    record gone stale,\
