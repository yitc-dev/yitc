  \ debt` integration probe end-to-end.\n\n28. **A RECORDED MEASUREMENT DRIFTING TOWARD\
  \ ITS OWN FLOOR (the 2026-08-21 79% refusal).**\n    An OPTIONAL injected report-only\
  \ fold (`debt.recorded_measurement_drift`), wired at the ONE shared\n    host residue\
  \ like every sibling and riding all seams (session-start / the `debt`\n    re-fold).\n\
  \    **SUBJECT.** SPEC-0161's recorded PAYLOAD-KEY candidate set is a RECORDED MEASUREMENT:\
  \ a number\n    written down once, which a land-verify gate (`tests/test_event_catalog_completeness.py`\
  \ AC2)\n    re-computes live and compares against a declared floor of 0.80. Such\
  \ a record DRIFTS by\n    construction as the corpus grows, and the drift is NOT\
