      dated AFTER that branch's last refusal on that cause. Only UNRESOLVED branches count toward
      `min_branches`; a cause every one of whose branches has since landed reports NOTHING, at any
      threshold, from the moment the last of them lands. The window SURVIVES as the OUTER HORIZON and
      nothing more — its honest remaining job is the branch that NEVER lands (abandoned or parked),
      which can only age out.
      **TWO REFUSAL SHAPES, TWO RESOLUTION SHAPES — the symmetry is load-bearing.** A resolution row is
      a `land_completed{status: ok}` row OR a `land_member_verdict{verdict: landed}` row. The second is
      REQUIRED, not decorative: MEASURED on this repo's journal 2026-09-04, of 209 member `landed` rows,
