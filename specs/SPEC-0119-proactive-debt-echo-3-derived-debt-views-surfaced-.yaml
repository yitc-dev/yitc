      NOTHING — grouping is on the cause identity FIRST, and the branch count is only ever read WITHIN one
      such group. A line that fired on any burst of aborts would be filtered by its reader inside a day,
      which is how a surface stops being read at all. `min_branches` is NOT a rule-3 count floor either: a
      branch retrying ten times on one cause contributes exactly 1, because the key is DISTINCT branches.
      **POSTURE.** Report-only, suppressed when clean, ZERO stored state, no new event, no store, no exit
      code, no gate; it names a CAUSE, never a candidate. Knobs
      `YITC_DEBT_ABORT_BREADTH_WINDOW_HOURS` / `YITC_DEBT_ABORT_BREADTH_MIN_BRANCHES`, both degrading to
