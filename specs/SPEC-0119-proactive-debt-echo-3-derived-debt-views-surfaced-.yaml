  \    it, but the SWAP is stated), `unreadable` (no report could be read at all —\
  \ count 0 means UNKNOWN,\n    not clean)} plus a CONDITIONAL `authority_degrade`\
  \ sentence, present iff something was dropped —\n    including a drop that left\
  \ the authority INTACT but holed the series, because an unreadable report\n    is\
  \ invisible to the age walk-back rather than breaking it, so the run of open-ness\
  \ silently JUMPS\n    the gap and an age can be over-stated (a fresh regression\
  \ read as month-old debt).\n    The degrade renders as its own report-only `debt:`\
  \ line REGARDLESS of the count — the ONE\n    exception to suppressed-when-clean\
  \ in this rule, on the ground that a broken subject rendering as\n    debt-free\
  \ is exactly the silence this view exists to end. Still report-only: it never gates\
  \ and\n    never raises.\n12. **In-flight dispatches with no journaled monitoring\
  \ read (X-0336).** An OPTIONAL injected\n    report-only view (`debt.unmonitored_dispatches`,\
  \ collaborator of `_render_debt_echo`) over the\n    IN-FLIGHT fleet: the dispatched\
