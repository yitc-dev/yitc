      from the carrier NOW, so the probe's green proves nothing (`never` = admitted on a promise;
      `rewired` = demonstrated once, then its definition CHANGED — the old RED proved a probe that no
      longer exists, and this is the only state here that can name an honest DATE, the ts of the
      superseded demonstration).
