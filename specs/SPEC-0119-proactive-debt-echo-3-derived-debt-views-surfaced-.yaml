  \ than measuring wrongly; it never reverts to the unfiltered computation.\n    **THE\
  \ SAME MEMBERSHIP GOVERNS THE BRANCH REMEDY.** `debt_spec0161.spec0161_branch_unnamed`\
  \ passes\n    the consumer arm to BOTH oracle legs it runs (the journal leg and\
  \ the added-code leg), so a\n    consumer branch introducing a key on its OWN private\
  \ type never becomes `introduced`, never\n    reaches the `--brief` list of `spec0161_unnamed_key_message`,\
