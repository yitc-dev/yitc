  \ reports the APPROACH, so the refresh is ordinary maintenance done when someone\n\
  \    chooses instead of an ambush during an unrelated land.\n    **WHEN IT PRINTS.**\
  \ `coverage <= floor + margin`, where margin is the NOTICE WIDTH knob\n    `YITC_DEBT_MEASUREMENT_MARGIN`\
  \ (default 0.10, so from 90% down). It fires while coverage is still\n    ABOVE\
  \ the floor and approaching it — the whole point — AND while it is already BENEATH\
  \ it, where\n    going quiet would be the one genuinely harmful reading. A non-positive\
  \ margin disables only the\n    APPROACH arm; the at-or-beneath arm is not disableable,\
  \ so the knob can make the line less\n    eager, never blind.\n    **WHAT THE AT-OR-BENEATH\
  \ ARM SAYS DEPENDS ON THE ROOT IT PRINTS TO (<project> X-1417).**\n    «A land is\
  \ being refused right now» is true on the KERNEL root and FALSE on a CONSUMER one:\n\
  \    since `worktree._spec0161_land_preflight` takes the consumer arm — warns on\
  \ stderr,\n    appends ONE `deviation_captured`, RETURNS — and the land proceeds\
  \ and exits 0. The REMEDY forks\n    for the same reason and not a cosmetic one:\
  \ refreshing the record means `spec edit SPEC-0161`, a\n    KERNEL spec write SPEC-0078\
  \ refuses under `-C`, which is the very refusal the preflight cites as\n    the\
  \ reason for the consumer downgrade. So an unforked line told a consumer that something\
  \ was\n    broken NOW and that the fix was an action it could not perform — measured\
  \ as four tool calls\n    spent tracing kernel source to establish that lands were\
  \ not blocked, before any work could be\n    planned. The fold therefore carries\
  \ `borrowed_record` (the predicate's own answer,\n    already in `engine_specs_dir`\
  \ — never a second derivation) and `remedy`, THE SINGLE HOME of the\n    root-specific\
  \ instruction: the renderer forks the posture clause on that token and prints the\n\
  \    remedy VERBATIM, composing none of its own, and the fold's `next` IS that same\
  \ string. The\n    consumer arm names the route that can actually get a key named\
  \ — `cross request --to yitc-v2` —\n    the same route the land/commit WARN already\
  \ names, RENDERED IN THE FORM THAT ROOT CAN RUN: a\n    `-C` consumer has no local\
  \ `bin/yitc-v2`, so the command carries the ENGINE's own path and\n    `-C <consumer-root>`,\
  \ concrete rather than a form the reader must assemble. Printing a\n    repo-local\
  \ invocation would reproduce, in the replacement text, the very defect this rule\
  \ was\n    amended to remove. The KERNEL arm is unchanged, and a fold dict without\
  \ the two keys degrades\n    to it.\n    **THE CONSUMER ARM COUNTS ONLY STRUCTURALLY\
  \ DECLARED KERNEL TYPES (<project> X-1516).**\n    On the BORROWED arm (`borrowed_record`\
  \ — this root does not own the record and reads the kernel's),\n    a (type, key)\
  \ pair GOVERNS only when its event TYPE is STRUCTURALLY DECLARED by that record.\n\
  \    WHY: `governing` admits a pair on «the type is mentioned in THIS repo's corpus»,\
  \ so a\n    CONSUMER-PRIVATE event type sat in the denominator; `named` then asks\
  \ the KERNEL record, which\n    can never name a type the kernel neither emits nor\
  \ owns. The pair was therefore permanently\n    unnamed, the consumer was told every\
  \ session it was beneath the floor, and the remedy above\n    routed that pair to\
  \ the kernel as a `cross request` the kernel cannot execute — unclearable\n    debt\
  \ with an impossible remedy.\n    **DECLARED IS A STRUCTURAL HEAD-PARSE, NEVER A\
  \ MARKUP SCAN** (`debt_spec0161.spec0161_declared_types`).\n    The parse admits\
  \ exactly TWO line-anchored shapes, each bounded to its DECLARATION HEAD, and\n\
  \    nothing else. **SHAPE 1 — the CATALOG item:** a markdown list item whose bold\
  \ span OPENS with a\n    backticked identifier, `- **<backticked type>** — <emitter>\
  \ — <meaning>`. It is bounded TWICE by\n    one scanner: at LINE level only the\
  \ LEADING run of bold spans is consumed, stopping at the first\n    thing that is\
  \ not one — so the line's DESCRIPTIVE REMAINDER, and every markup token in it, is\n\
  \    never read; at SPAN level only the LEADING run of backticked identifiers inside\
  \ a span is taken,\n    so payload keys a declaration goes on to name are not mistaken\
  \ for types. The line qualifies only\n    when its FIRST bold span yields a non-empty\
  \ run, which excludes the sibling shape\n    `- **SPEC-0025** — …` (bold, not backticked)\
  \ and every ordinary prose line. **SHAPE 2 — the\n    RECORD's own PAYLOAD-KEY item:**\
