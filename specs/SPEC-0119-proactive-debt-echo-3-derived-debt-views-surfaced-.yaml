  \ the resolution set PLUS the launch row —\n    leaving the resolution bound, and\
  \ therefore `--fleet-verdict` and the re-dispatch brief,\n    untouched. **STILL\
  \ REPORT-ONLY (rule 21):** the clause moves no exit code, emits no event on\n  \
  \  render, and triggers no recovery; it says nothing about whether a controller\
  \ armed a watcher.\n    **FAIL-CLOSED TOWARD VISIBLE.** A false silence is far worse\
  \ than a false row here: a surfaced line\n    costs a line, a wrong silence loses\
  \ the signal entirely. So every uncertainty leaves the halt\n    UNRESOLVED and\
  \ visible — an unattributable halt, an unparseable ts (which loses only its reported\n\
  \    AGE, never its row), a predicate returning nothing. Age is REPORTED, never\
  \ applied: nothing in this\n    fold is filtered by it, which is what makes the\
  \ differential honest.\n    **TERMINAL-CARD EXCLUSION — the SECOND drop criterion,\
  \ and it lives in the READER.** A\n    halt whose TASK CARD has already reached\
  \ a TERMINAL status (`done` / `wont-do`) does NOT print.\n    **DISPOSED PRE-CLAIM\
