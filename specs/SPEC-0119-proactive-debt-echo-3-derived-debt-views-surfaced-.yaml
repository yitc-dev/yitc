  \ leg is NOT cosmetic: `shutil.which` consults PATH only for a\n    BARE name —\
  \ handed a token containing a path separator it checks that literal path against\
  \ the\n    PROCESS cwd — so resolving a repo-relative command through it made the\
  \ verdict CWD-DEPENDENT,\n    breaking the `-C` contract (operate on the NAMED repo\
  \ regardless of cwd) and inventing gaps for a\n    consumer's own present scripts\
  \ (X-0436: <project>'s `bin/verify-hermetic.sh` +\n    `bin/verify-alembic-topology.sh`\
  \ read as 2 gaps from `<host-home>`, 0 from the repo root — the same\n    call).\
  \ A repo-relative token therefore resolves ONLY against `repo_root/<token>` (exists\
  \ +\n    executable) with NO cwd-dependent PATH fallback, and its gap is worded\
  \ for what it is (\"not found\n    (or not executable) in the repo\", never \"not\
  \ on your PATH\"); still absent/non-executable ⇒ a REAL\n    gap, reported as ever.\
  \ A declared `command:` that reads as PROSE is NOT a missing executable\n    (X-0719):\
