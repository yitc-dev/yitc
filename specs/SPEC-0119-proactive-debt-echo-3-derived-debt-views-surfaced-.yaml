      assertions, the last-fired age) are built from the UNRESOLVED refusals only — putting a
      since-landed refusal's stamp on the age would be the misread arriving through its own fix.
      **Unit tests :** the four-arm threshold differential (all branches resolved => silent;
      one unresolved, below `min_branches` => silent; both unresolved => reported and named; the
      one-unresolved journal at `min_branches=1` => reported), the ORDERING arm (a landing dated BEFORE
