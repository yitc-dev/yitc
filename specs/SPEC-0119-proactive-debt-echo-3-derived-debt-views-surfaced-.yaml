  \ project declares a theme of its OWN the row appears exactly as before.\n    **(v)\
  \ — and the section's VALUES must be the project's, not values the KERNEL RENDERED.**\n\
  \    The sibling of (iv) on the other axis: (iv) asks who DECLARED the section,\
  \ (v) asks who wrote what is\n    IN it. A section EVERY value of which `init` RENDERED\
  \ from the `__YITC_CLI__` token is a DERIVED\n    value, and SPEC-0198's doctrine\
  \ is that a derived value is never asked as a question — so such a\n    section\
  \ records no human answer, is ratified BY CONSTRUCTION, and contributes nothing.\
  \ Today that is\n    one case: `security.audit.profile_snapshot`, whose sole value\
