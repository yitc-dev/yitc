  \ whose special value `0` = node_modules layout ⇒ SKIP, else\n    `~/.cache/ms-playwright`);\
  \ an absent/empty cache ⇒ the line names the affected label + `npx playwright\n\
  \    install`, a populated cache ⇒ silent, an undeterminable probe ⇒ SKIP (never\
