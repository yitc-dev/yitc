  - bin/lib/debt.py#gap_rank # rule 39 — the ONE deterministic risk order
  - bin/lib/debt.py#gap_task_linked # rule 39 — `task-linked` needs a RESOLVABLE T-id
  - bin/lib/debt.py#_gap_waiver_answer # rule 39 — WAIVER-IS-TERMINAL-ONLY-WITH-A-REASON, at its one home; a container is never coerced to a reason by `str`, so only a non-blank STRING reason (or a bare string waiver) closes the obligation
  - bin/lib/init.py#_ops_waiver_reasoned # rule 39 — the fail-closed adapter the BIRTH-time shape hooks ask, so a hook and the register cannot drift on whether a waiver closes anything (they contradicted each other twice)
  - bin/lib/cli.py#_profile_gap_autofile # rule 39 — the capped, deduped, FILING-ONLY writer
  - bin/lib/debt.py#debt_echo_table # rule 40 — the one-row-per-class table the 2 ECHO seams render
  - bin/lib/debt.py#load_sensitive_fingerprint # rule 41 — the ONE home of the `load-sensitive:<file>` fingerprint, shared by this view's suppression and the land-tail filer's idempotency check
  - bin/lib/debt.py#load_sensitive_carded # rule 41 — the NON-TERMINAL cards holding a listed file; `done`/`wont-do` hold nothing and never suppress
  - bin/lib/debt.py#load_sensitive_uncarded # rule 41 — the PURE fold (no I/O, no clock) over the runner's own carrier reader + the card fold
  - bin/lib/cli.py#_load_sensitive_uncarded_view # rule 41 — the host residue binding THIS repo's tests/ + tasks/, wired at the ONE shared debt-echo residue so it reaches all three seams
  - bin/lib/worktree.py#_load_sensitive_file_card # rule 41 — the auto-filed `ready` card, composed with the SAME primitives `task file` uses; the engine never claims/dispatches/picks it (CHARTER §6)
  - bin/lib/debt.py#debt_explain # rule 40 — the ONE home of the long-form text, returned VERBATIM
  - bin/lib/debt.py#debt_row_class # rule 40 — the class slug DERIVED from the line's own head (no registry)
  - bin/lib/debt.py#debt_row_count # rule 40 — the count, bounded to the head so no tail number is misreported
  - bin/lib/debt.py#debt_row_verb # rule 40 — the FIRST remedy verb the line itself names
  - bin/lib/cli.py#_debt_echo_compact # rule 40 — the fail-open session-start seam wrapper (falls back to the FULL lines)
  - bin/lib/cli.py#_main_task_strand_state # rule 18 — the EXISTING card cross-check REUSED as the fold's _card_state
  - bin/lib/debt.py#runtime_delivery_coherence # rule 16 — the REVERSE reading of not-adopted: a bypassable deploy, declared or detected
  - bin/lib/debt.py#source_mount_evidence # rule 16 — the fail-OPEN detector: does this repo bind-mount its OWN source into a service?
  - bin/lib/debt.py#_declared_prod_composes # rule 16 (X-0711) — the DECLARATION leg of the prod/dev discriminator: the compose files the carrier's own deploy command names
  - bin/lib/debt.py#_compose_paths # rule 16 — the prod-compose resolution: declaration first, `_is_dev_compose` naming convention as the fallback
  - bin/lib/views.py#_mount_clause # rule 16 — the ONE named-mounts clause both arms print: every evidence row names the compose it came from
  - bin/lib/init.py#_render_init_runtime_delivery_prompt # rule 16 — the same question asked report-only at the init/bootstrap seam
  - bin/lib/init.py#_render_init_unwaived_prod_mount_prompt # rule 16 arm (c) — the declared-yet-unwaived prod-mount doctrine prompt at init/bootstrap
  - bin/lib/debt.py#broken_outcome_invariants # rule 17 — the fold: declared outcome-invariants read as broken / degraded / unproven
  - bin/lib/debt.py#declared_outcome_invariants # rule 17 — the DECLARED set (only it can interrupt — lessons/scope-the-trigger-not-the-view)
  - bin/lib/debt.py#_run_invariant_probe # rule 17 — the read-only probe runner (SPEC-0110 L3 / rule-23 adapter shape); a probe that cannot answer is DEGRADED, never green

body: |
  ## Scenario

  Any session — the engine's own or a `-C` consumer's — is SHOWN its outstanding technical debt at the
  moments the debt changes, without having to ask. Three DERIVED debt views —
  not-adopted (shipped-but-not-live) / open-followups / overdue-rechecks — are rendered as short
  REPORT-ONLY lines at session-start and at each land; when there is no debt, nothing prints. The
  open-followups line names what to DO (the disposition fork), so the debt is not just visible but
  actionable.

  ## Internal

  THE PROACTIVE-DEBT-ECHO RULE. A push over EXISTING derived views at EXISTING code seams — no new
  store, cron, autopilot, or view (CHARTER §P1). Reuses the SPEC-0086 `cross-coord:` echo discipline.

  1. **One render helper.** A single function computes the counts from the EXISTING derived views.
     THREE BASE views — not-adopted + overdue-rechecks (SPEC-0094 §2/§3, `_view_not_adopted` /
     `_view_overdue_recheck`) and open-followups (SPEC-0095, `cmd_followup_list`) — PLUS optional
     INJECTED views appended under the same discipline: startup_checks (rule 7), born-schema-skew
     (rule 8), concern-conformance (rule 9), and **review-due** (rule 10). NO stored state:
     re-derived on every call. ("three views" in this spec's title/prose is the historical BASE count —
     the injected views extend it.)
  2. **Two code call sites (both pre-existing REAL seams).** The helper is invoked at
     (a) **session-start** (`cmd_session_start`, beside the SPEC-0086 `cross-coord:` echo) and
     **WORKTREE EXCEPTION at the session-start seam (WIDENED to the checkout by).**
     The session-start invocation is SKIPPED — the helper is not called at all — when the run is
     inside a WORKTREE. That is the WHOLE condition (`cli.py#_receipt_only_session_start`): a
     main-checkout journal that resolves AND differs from this checkout's. No flag, no config, no
     new store. The skip announces itself in one line naming the re-fold.
     **The seam is the MAIN CHECKOUT; the ground is AUDIENCE, not re-delivery.** originally
     keyed this on a FRESH same-ref same-epoch `seed_read` receipt on the main journal and justified
     it as RE-DELIVERY ONLY — such a session had already received the echo. That ground is sound but
     reaches only part of the case, and measured the remainder in a `task/` worktree
     2026-09-07: a dispatched Worker's `session start --type build` ALREADY skipped (its launcher
     pre-records the main receipt — 2.8s whole run), but a FIRST-in-checkout anchor holding
     no prior receipt spent 7.8s deciding the predicate and then 28.5s folding 18 debt lines, inside
     a checkout where this echo reaches nobody who acts on it. So the recorded ground is now
     AUDIENCE + SEAM: this echo is a Controller/MAIN-CHECKOUT session-start surface — the same
     reasoning SPEC-0039 §0 uses to exempt a dispatched worker from the MEMORY.md buffer. Widening
     the condition also REMOVES the ref resolution and the `gates.fresh_seed_receipt` read (CHARTER
     §P1 F3). That read was that helper's ONLY caller, so `gates.fresh_seed_receipt` — and
     tail-first cut inside it — is left UNWIRED; it is deliberately NOT deleted by this card, whose
     scope is the echo wiring, and its retirement (which also retires two suites and touches
     `gates.py`) is filed as its own adjacent card per §Filing rule. The SPEC-0050 §8 seed read-gate
     does NOT use this helper — it has its own readers — so nothing about that gate moves.
     **What does NOT move, and the fail-closed direction.** The LAND-TAIL seam (b) is UNCONDITIONAL;
     rule 3's report-only + suppressed-when-clean discipline is unchanged; the echo gates nothing, so
     nothing that gates moves; rule 5's on-demand `bin/yitc-v2 debt` re-fold stays the escape — the
     same pointer that already covers post-`/compact` eviction — and the skip line names it. On the
     MAIN checkout the two journal paths are equal, so the predicate is False BY CONSTRUCTION and
     that seam is untouched. Where the main checkout cannot be RESOLVED at all the predicate answers
     False and the session pays exactly the full echo it paid before: fail-closed toward the prior
     behaviour, deliberately NOT degraded to "assume worktree", which would invert the direction and
     could suppress the echo on `main` itself. Earlier grounds, unchanged: the fold cost 52.6s of a
     57.5s fresh-worktree `session start` measured 2026-09-05 (fu_2f8148e07bea, owner-surfaced).
     (b) **land-tail** (`cmd_land` final print). Each re-derives the CURRENT TOTAL outstanding debt.
     Recomputing at every land is what keeps a count that grew MID-session from going stale — a
     per-land DELTA is NOT computed and NOT required (the debt needs currency, not per-land attribution).
  3. **Print discipline (reuses SPEC-0086 verbatim).** A line prints ONLY when its count > 0;
     SUPPRESSED-WHEN-CLEAN; REPORT-ONLY — it never gates, blocks, or auto-acts.
     **Open-followups floor (X-0157).** The open-followups line additionally requires its
     count AT/ABOVE a configurable floor (env `YITC_DEBT_FOLLOWUP_FLOOR`, default 5): a SMALL backlog
     of 1..floor-1 open followups is treated as CLEAN (suppressed) so it does not spam the echo; a
     non-positive floor disables it (any count > 0 fires). The floor is scoped to open-followups ONLY —
     not-adopted is already status-gated to `shipped-not-live` (a floor there would risk re-hiding the
     X-0142 LARGE-count incident this echo exists to catch) and overdue-rechecks are date-triggered
     genuine past-due obligations (never count-hidden); both stay unfloored.
     **The floor governs the ACTIONABLE headline ONLY.** Of the three open-followup counts
     (SPEC-0095 §Armed), `actionable` is the floored headline; `armed_fired` gets its OWN clause and is
     **UNFLOORED** — a fired trigger is a dated, event-triggered obligation exactly like an overdue
     recheck, so it is never count-hidden (this is what forbids "arm it and it silently disappears
     forever"); `armed_waiting` is a TAIL on whichever followup line already prints and NEVER forces one
     (a waiter is not yet actionable, so it must never nag). The tail rides exactly ONE line, never both.
     **POST-SHIP OBSERVATIONS — a FOURTH clause, UNFLOORED, off the SAME `_view_overdue_recheck` call
     (SPEC-0036 / X-0710).** The overdue-recheck view folds a second dated deferred-proof
     carrier: a task's `post_ship_observation: {observation, due_by}` — the declaration the Stage-8
     `--post-ship-observation` carve-out requires when an acceptance proof is a multi-day post-ship
     production observation. It gets its OWN echo line, deliberately NOT folded into the overdue-recheck
     count: that count means "waivers past recheck_by" and its remedy is a live_probe at the deploy
     seam, while this one means "an acceptance proof a Stage-8 audit deferred is still unrecorded" and
     its remedy is to take the reading and record it — two signals, two lines, two remedies, never
     conflated (the comment-contract precedent). UNFLOORED **and printed while still `pending`**
     (not only once past `due_by`), on rule 3's own ground: a deferred proof that goes quiet until it is
     late is exactly how deferred adoption becomes never-adopted. It adds NO new collaborator and NO new
     call site — the clause reads the view the echo already folds — and clears only when the card's
     `settled_by` names where the recorded reading landed.
     **DEFERRED ACCEPTANCE PROBES — a FIFTH clause, UNFLOORED, off the SAME `_view_overdue_recheck`
     call (SPEC-0015 / kupiclub X-1066).** The overdue-recheck view folds a THIRD
     deferred-proof carrier: a card's own `probes: {ACx: deferred}` — a proof the CLOSURE recorded as
     owed. The state was first-class and its settle already existed (`task close --settle-probe`, fail-closed against a probe that was never deferred); what was missing was the RETURN, so
     kupiclub closed with both probes correctly deferred and nothing but the card remembered.
     That is the shipped-but-not-adopted shape this echo exists to catch, arriving through the one door
     left open — an HONEST deferral — and the incentive ran the wrong way: an overclaim is caught by the
     auditor, a correct deferral got silence. It gets its OWN echo line, deliberately NOT folded into
     the overdue-recheck count nor into the observations one: three deferred proofs, three remedies —
     this one's is to settle the probe with its evidence — and a conflated count tells the reader none
     of them. UNFLOORED, and **COUNTED from the moment the deferral is recorded, HEADLINED from the
     moment it is DUE** ( — the split the FOURTH clause already carries, arriving here now
     that a deferral records its firing moment). At closure `--probe-deferred <AC>:<moment>` records
     WHAT FIRES the probe, in one of the two forms the corpus already has — a `due_by` ISO date (the
     post_ship_observation shape) or an `awaits` ref (`T-NNNN` / `X-NNNN` /
     `events.jsonl#type=<t>[@after=<ISO ts>]`, the SPEC-0095 §Armed shape) — stored as the ONE
     sibling mapping `probe_moments:` beside `probes:` (schema home SPEC-0028); a BARE key is
     REFUSED at every close-time door onto that mapping, naming both accepted forms. DUE is decided
     by the SAME predicate the followup `armed → fired` fold reads (`followup.arrived_ids` /
     `event_after_arrived`), never a second one. So the headline names what a reader can act on
     TODAY and the rest rides a «(N deferred, not yet due)» TAIL — and, exactly as in the fourth
     clause, the pending count MOVES SLOT but never DISAPPEARS: with zero due the line still PRINTS
     («no deferred probe is due — N awaiting their moment»), because filtering the view down to due
     would headline the right number by making every not-yet-due obligation silently vanish, which
     is the failure this rule exists to prevent. A LEGACY key-only deferral reads DUE — it names no
     moment, so «now» is the only truthful reading of it, and DUE is the safe direction. The prior
     ground for headlining the whole set from deferral — that a deferred probe carried NO due date
     at all, so there was no moment at which a delayed line would start printing — is RETIRED: after
     this change it does carry one, and the unbounded from-deferral headline that ground justified
     surfaced 94 cards / 96 probes on 2026-09-04, most of whose readings could not be taken that day. It adds NO new collaborator and NO new call site — the clause reads the view the echo
     already folds — and NOTHING but the settle clears it (the discharge is keyed on the recorded value
     the settle itself flips out of `deferred`, never a parallel marker). REPORT-ONLY, and deliberately
     nothing more: it does not change what may be deferred and does not gate closing with a deferral —
     deferring is the honest move and must stay cheap.
     **THE TWO NON-PASS TERMINALS — a SIXTH and SEVENTH clause, off the SAME
     `_view_overdue_recheck` call (owner ruling 2026-08-27,
     events.jsonl#ts=).** A deferred probe can now also be discharged
     `unreachable` (a proof that can NEVER arrive) or `falsified` (a reading that ARRIVED and came
     back NEGATIVE), each with a mandatory free-text reason — the settle contract is homed in
     SPEC-0015 §Settling, not restated here. This rule owns the REPORTING half, and it is the half
     that keeps the widening honest: each terminal gets its OWN separate visible counted line,
     naming its cards and their recorded reasons.
     **NEITHER folded into the pending count, and NEVER merged with each other.** Not folded,
     because a silent decrement would hide exactly what this is meant to make visible: 19
     consumer-owned criteria sat in the pending population reading as a backlog when they were a
     permanent FLOOR nothing could move. (The proposing card also counted 4 criteria unreachable
     for a GRAMMAR reason; that half is FALSE and is retracted at its rule home — SPEC-0015
     §Settling, fu_73ae05baab19 — so no proportion derived from it is quoted here either.) What
     leaves the pending line must ARRIVE on its own named line. Not merged, because the two ask for
     DIFFERENT REMEDIES and a reader must see at a glance how much of the floor is
     proof-can-never-arrive versus proof-came-back-negative: the first is an AUTHORING defect fixed
     for the NEXT card (SPEC-0060 — a criterion whose evidence lives in a consumer
     repository was mis-authored, the scope boundary already forbids it), the second is a REAL
     FINDING about a shipped change that someone may need to act on. A single merged "non-pass"
     count tells the reader neither — the same two-signals-two-lines discipline this rule already
     applies to its three deferred-proof siblings.
     They inherit the clause above verbatim in every other respect: UNFLOORED, printed from the
     moment the terminal is recorded, no new collaborator and no new call site (they read the view
     the echo already folds), zero stored state, REPORT-ONLY — nothing gated. And NEITHER ever
     satisfies CHARTER §Principle 8 adoption evidence, `falsified` least of all: it records that the
     adoption reading came back negative, which is the opposite of adoption evidence rather than a
     weaker form of it.
  4. **Disposition fork.** The open-followups line names the choice: resolve (promote → a task / drop
     with a reason) OR take straight into work. (Subsumes the X-0141 followup-surfacing ask.)
     **Actionable vs armed.** The headline counts followups needing a disposition NOW; ARMED
     WAITERS (open followups carrying a named `trigger` — SPEC-0095 §Armed) are reported BESIDE it and
     never summed into it, so the number the owner reads is the number of decisions actually owed. The
     armed halves reach the render helper as TWO OPTIONAL injected collaborators (`_armed_fired_count` /
     `_armed_waiting_count`, both derived from the ONE `followup.open_followup_counts` fold) under the
     same optional-collaborator discipline as rules 8-10: absent ⇒ they contribute nothing and the line
     renders exactly as it did before the split, so no un-updated caller can silently lose its line.
  5. **Post-`/compact` re-surface (co-designed with SPEC-0007 §5b).** The session-start line is a
     `session start` ECHO that a `/compact` evicts (session start is not re-run). It re-surfaces the
     SAME way the SPEC-0086 `cross-coord:` echo does — a derived command the session re-runs after
     `/compact` (a pointer in the AGENTS §After-`/compact` re-fold list) — NO new store.
  6. **`orchestrate batch-done` is NOT a wiring point.** It is the Controller's narrated summary, not
     a code seam; wiring an echo there would be a new non-deterministic surface (excluded — a coded
     batch-done seam is a future follow-up only).
  7. **Consumer `startup_checks:` ride this echo (SPEC-0152 rule 17 / X-0191).** A project's
     OPTIONAL, report-only `startup_checks:` (declared in its `yitc-ops.yaml` — the SHAPE + declaration
     contract is owned by SPEC-0152 rule 17, not restated here) are run + AGGREGATED into ONE report-only
     `startup-check: …` line APPENDED to this echo's output (the host residue that computes the debt
     lines also appends `session.startup_check_lines`). It therefore inherits rules 2/3/5 verbatim —
     the same 3 seams (session-start / land-tail / `debt` re-fold) verbatim, SUPPRESSED-WHEN-CLEAN, report-only,
     no new store/mechanism (P1). The kernel's own sessions have no `yitc-ops.yaml`, so this appends
     nothing there.
  8. **Per-consumer born-schema-skew SELF-check (SPEC-0123; supersedes engine-side
     sweep).** A report-only line APPENDED to this echo (host residue `session.born_skew_check_line`,
     after the startup-check line): whether THIS repo's OWN `yitc-ops.yaml` carrier is BEHIND the current
     kernel born schema — the born sections / nested subfields a re-`bin/yitc-v2 -C <repo> init` WOULD
     deliver (missing extensible top-level sections + missing born nested subfields like
     `deploy.policy`/`deploy.host_config`). Each project WATCHES AND UPDATES ITSELF at its own debt seams
     (owner directive 2026-07-03) — this REPLACES the retired KERNEL-SIDE registry enumeration (the engine
     sweeping every registry consumer on their behalf via a registry-resident host residue + view + debt
     line, all removed by; CHARTER §P1 F3 removal). It is DERIVED read-only from
     THIS repo's carrier by the SAME `init._consumer_carrier_skew` the init UPDATE path uses to decide
     what to deliver (ONE SoT — the report can never claim a skew the update would not deliver, nor miss
     one it would; the nested-subfield gap is both delivered AND reported). It is APPENDED inside
     the SAME shared host residue (`_debt_echo_lines`) that rule 7 uses, so it is STRUCTURALLY wired into
     all three debt seams (session-start / land-tail / `debt` re-fold) and is SUPPRESSED-WHEN-CLEAN,
     report-only, NO gate/event/auto-apply (CHARTER §6) — rules 2/3/5. The engine's OWN repo has no
     `yitc-ops.yaml`, so the line is suppressed there (the inverse of rule 7's engine-empty note); a `-C`
     consumer's session rebinds REPO_ROOT to the consumer before any verb runs, so the self-check reads
     the consumer's own carrier at that consumer's seams. A pre-init / unreadable / non-mapping carrier is
     NOT a schema-skew row (fail-open, skipped) — a different, pre-init condition. Because the check is
     over THIS repo ONLY, it needs no registry enumeration and carries NONE of the retired sweep's
     engine-only / registry-resident host-leak gates (there is no cross-project scan to leak-guard).
  9. **Concern-conformance view (SPEC-0128 Rule 2).** A FIFTH DERIVED, report-only line rides
     this echo: the standing declare-or-waive STANCE + waiver-CURRENCY conformance of THIS repo's
     `yitc-ops.yaml` carrier against the kernel concern registry (SPEC-0128). It surfaces (a) STANCE
     drift — a registry concern that is unanswered / contradictory / wrong-typed (the SAME verdict the
     SPEC-0093 init sweep fails closed on — the standing view reuses the ONE source
     `init._ops_carrier_violations`, so the two can never disagree, CHARTER §P5); and (b) waiver-CURRENCY
     — a waiver whose `expiry:` has LAPSED (the currency complement the init sweep's SHAPE check does not
     make — `_ops_waiver_errors` verifies expiry is a real ISO date, never whether it passed). Computed by
     `init.concern_conformance(ops_path)` and injected as an OPTIONAL collaborator of `_render_debt_echo`
     (DISTINCT from rule 8's skew line, which is a host-residue APPEND — this one is a per-repo carrier
     check on THIS repo, engine or consumer); count 0 (incl. the no-carrier engine kernel itself) ⇒ CLEAN
     ⇒ suppressed. It rides rules 2/3/5 verbatim — the SAME 3 seams (session-start / land-tail / `debt`
     re-fold), SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a gate, NO new store, NO new event type (the debt
     echo helper gains one OPTIONAL injected collaborator; P1). The SAME source ALSO feeds the nightly
     runner (SPEC-0105, `_check_concern_conformance`) so a repo no session has opened is still checked.
     This REALIZES SPEC-0128 Rule 2's "the standing conformance/skew views ride SPEC-0119's `debt` echo".
     **(c) CARRIER COMMENT-CONTRACT (X-0401) — a THIRD signal on this SAME view, with its OWN
     report-only line.** The `yitc-ops.yaml` carrier delivers much of its kernel contract THROUGH its
     COMMENTS (the declare-or-waive rules, the per-section semantics, the view-XOR-sweep rule), and a
     `yaml.safe_load`->`yaml.dump` round-trip edit silently STRIPS every one of them: trend-finder's
      lost all 436 comment lines and nothing kernel-side noticed (caught only by a lucky self-test
     break). So `concern_conformance` ALSO reports `comment_contract` — the kernel CONTRACT-COMMENT
     ANCHORS (the `SPEC-NNNN rule N` citations the born template carries in each section's comments,
     DERIVED from `graph/born-ops.yaml`, never hand-listed) that are MISSING from the sections this
     carrier actually HAS (`init._carrier_comment_contract_gaps` / `init._born_comment_anchors`). It reads
     the carrier's RAW TEXT, because comments do not survive a YAML parse — which is exactly why a
     parsed-only view was structurally BLIND to this defect. Anti-false-positive: an anchor counts as
     present by SUBSTRING, so a consumer that RE-WORDS or extends the kernel's prose stays silent as long
     as it keeps the rule pointers. TWO REPORT-ONLY BOUNDS, both load-bearing: it is NOT added to
     `init._ops_carrier_violations` (the FAIL-CLOSED init sweep) — a comment gap must never REFUSE a
     consumer's init, which would fail-close every consumer that ever re-worded a comment; and it is NOT
     folded into this view's `count`, whose established meaning is the DECLARE-OR-WAIVE issue count that
     existing callers key on (folding it in silently redefined "a stance-conformant carrier is clean").
     **ATTRIBUTION — a citation belongs to the section it DOCUMENTS (X-0720).** A born section
     may ship COMMENTED OUT: `startup_checks` is OPT-IN, so the template carries it as a commented-out
     example block, not a live section. Deriving the anchors from LIVE column-0 headers alone therefore
     credited that block's `SPEC-0152 rule 17` to whichever section was still open above it (`coverage`),
     and a consumer that legitimately DECLARED `startup_checks` — citing rule 17 inside its own bounds —
     was still reported `coverage: SPEC-0152 rule 17` missing, on a section it had done nothing to
     (hit by aiseller AND kupiclub). So a COMMENTED-OUT column-0 section header opens its own attribution
     scope, and the shape is deliberately TIGHT (`# <name>:`, nothing after the colon) — the template's
     commented-out blocks also carry indented mapping lines and its prose header carries `# <name>:
     SECTION (…)`, and a looser pattern would let prose open a bogus section and steal the citations that
     follow. The CONSUMER side is unchanged: only sections the carrier ACTUALLY declares are checked, so a
     consumer that leaves the section commented out is still never nagged, and one that declares it
     without the citation is still reported — under its OWN name. Corrects attribution, never removes the
     check. It is its OWN arm and its OWN line. **TWO CAUSES, TWO REMEDIES — the line follows the cause
     (X-0423).** A missing anchor is EITHER the X-0401 whole-file strip (remedy: restore the
     contract comment text from the born template; edit the carrier as TEXT, never via a YAML round-trip)
     OR a kernel spec SPLIT that re-homed a rule while the consumer's comments stayed INTACT (remedy:
     reconcile ONE citation — the restore would DESTROY the consumer's own prose; boomrocket's
     tripped 3 anchors this way after SPEC-0152 re-homed rules out of SPEC-0093). So the view ALSO reports
     `comment_contract_kind` + `comment_contract_rehome` (`init._carrier_comment_contract_verdict`): the
     kind is THRESHOLD-FREE — `full-strip` = no comment survived in the checked sections, `partial` =
     comments survive, so the gap is citation drift — and the re-home CANDIDATE is named by comparing the
     carrier's cite against the born anchor for the SAME rule number. A `partial` gap with no candidate
     asks for a hand comparison rather than inventing a remedy (a candidate is evidence, not a verdict).
     Rides the SAME 3 seams, report-only, no new store, no new event, no new gate class, no new
     collaborator (P1 — a signal on an EXISTING view).
  10. **Review-due semaphore (SPEC-0057 §9).** An OPTIONAL injected report-only view
     (`views._view_review_due`, collaborator of `_render_debt_echo`) that surfaces which PERIODIC REVIEWS
     are now DUE: the WEEKLY operational-hygiene tier (anchored by `inspect record --tier weekly`),
     each T1-T10 system-inspection THEME (anchored by `inspect record --theme T<n>`), and each
