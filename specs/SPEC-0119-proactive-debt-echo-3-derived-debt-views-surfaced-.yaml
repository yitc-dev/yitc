      a fixed one. The teaching here is two additional POSITIVE resolution shapes; it is never a
      licence to forget.
      **NOT controller-seam-gated — a DELIBERATE divergence from rule 12.** Rule 12 contributes nothing
      in a dispatched-worker session because its remedy (arming a fleet watcher) is the CONTROLLER's and
