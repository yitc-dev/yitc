  \ by `self_session_ref`, so a landing\n    worker can never report ITSELF as unmonitored.\n\
  \    **The wording states what the JOURNAL shows** — \"no journaled monitoring read\"\
  \ — never that the\n    controller failed to look: a hand read is real but leaves\
