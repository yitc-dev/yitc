  \ makes the string a shell syntax error — scanned on\n    the RAW string with quote\
  \ awareness, so a real `missing-tool \"(\"` is untouched; a SENTINEL leading token\n\
  \    (`none`/`n/a`/`TBD`/`manual`/`see`/…); or SENTENCE SHAPE — 3+ tokens, NONE\
