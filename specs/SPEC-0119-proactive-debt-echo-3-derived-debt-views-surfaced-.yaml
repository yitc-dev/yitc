  \ precise failure rule 18\n    exists to prevent, and a change that emptied the\
  \ lens would look, from the outside, exactly like\n    a fixed one. The teaching\
  \ here is two additional POSITIVE resolution shapes; it is never a\n    licence\
  \ to forget.\n    **NOT controller-seam-gated — a DELIBERATE divergence from rule\
  \ 12.** Rule 12 contributes nothing\n    in a dispatched-worker session because\
  \ its remedy (arming a fleet watcher) is the CONTROLLER's and\n    a worker cannot\
  \ perform it. Here the subject is not a live fleet a worker would be nagged about\
  \ but\n    a stopped worker still owed a decision, and the originating incident\
  \ is precisely that NO surface\n    reported one. Every session that reads a debt\
