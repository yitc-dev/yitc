      **PROVABLE YOUTH SILENCES — the guard on that inversion, and it is part of the rule.** Reading
      absence as age is right for an artifact whose rows aged out and WRONG for one that is simply
      young, so a plan whose `created:` — or a card whose `created_at:` — proves it younger than the
