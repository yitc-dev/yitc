  33. **THE LANDS A KNOWN-BROKEN MAIN ACTUALLY STOPPED — the cost side of rule 29.**
      An OPTIONAL injected report-only WINDOWED fold over the JOURNAL
      (`debt.prequeue_known_broken_refusals`), wired at the ONE shared host residue like every sibling
      and riding all 3 seams (session-start / land-tail / the `debt` re-fold).
      **SUBJECT.** A land REFUSED BEFORE THE LAND QUEUE by the SPEC-0181 known-broken guard
      (`_land_prequeue_known_broken_refusal`), counted off the additive
      `land_completed.prequeue_known_broken` key that refusal itself writes (SPEC-0025).
      **THE SIBLING OF RULE 29, NOT A SECOND SPELLING OF IT.** Rule 29 answers *what is broken on
      main*; this answers *what that cost and who was stopped by it*. The two move INDEPENDENTLY — a
      standing record can refuse nobody all day, and a burst of refusals can be the whole story of a
      morning that produced no new record — so neither can be read off the other.
      **WHY IT WAS COUNTED NOWHERE, and it is not an oversight to sneer at.** The refusal is SILENT
      BECAUSE IT IS CHEAP: it fires above the attempt loop and takes nothing — no reservation, no
      verify slot, no batch membership — so it never reaches the seam that publishes a land outcome to
      main, and its abort row is written to the LANDING CHECKOUT's journal, which reaches main only if
      the refused branch eventually LANDS. A refused branch very often never lands (discarded, parked,
      re-cut), so the record died with the worktree. Meanwhile the rule-27 abort-cost views count only
      lands that reached a verify, and a pre-queue refusal reaches none: the cheapest refusal in the
      system was invisible in the very statistics used to reason about land cost.
      **MEASURED, 2026-08-28.** `work/red-main-guard-and-repair-path` was refused at ~07:59Z; its
      ENTIRE journal footprint across its whole life is three rows (`worktree_created`, a HAND-emitted
      `deviation_captured`, `work_batch_discarded`), none of them naming the refusal, and main's
      journal named this refusal ZERO times in its whole history (440 `land_completed` abort rows, 14
      `corpus-integrity`+preflight, every one of them a different guard). It reached main only because
      a human noticed and re-ran the land by hand. The sibling merge refusal is the control: 42 rows
      carrying its text DO sit on main — every one from a branch that landed anyway.
      **THE FIX PRESERVES THE CHEAPNESS IT DOCUMENTS.** The record is composed from values the refusal
      had ALREADY computed for its operator-facing message, and delivered as a `ts`-pinned
      byte-identical COPY to main through the EXISTING / seam. A row is an APPEND, never
      a reservation: no extra git call, no verify slot, no batch membership, no per-branch walk. It is
      FAIL-OPEN on both appends (each under its own broad guard, the copy's strictly after the
      primary), so a journal write that raises leaves the refusal's exit status and its
      operator-facing `LAND: ABORT <reason>` byte-identical and can never turn a refusal into a pass.
      **THE COUNT IS OF REFUSALS, NEVER OF BRANCHES.** A branch refused nine times is a FREEZE, and
      collapsing it to one would hide exactly the shape worth seeing; the distinct branch set is
      reported beside the count so a reader can tell the two apart at a glance.
      **WINDOWED (1d) so the line DECAYS INTO SILENCE once refusals stop**, instead of standing as a
      monument to a main already fixed — the rule-14 / rule-27 discipline. It is a REPORTING window
      only: nothing expires, and the rows stay in the journal forever.
      **THE WINDOW DELIBERATELY DOES NOT REUSE RULE 27'S — do not "restore" the reuse.**
      This rule shipped at 7d on the ground that this cost IS an abort cost, so the rule-27 window
      should be reused rather than a new number decreed. That reuse is GIVEN UP, because the two
      rules answer different questions and the shared number made this one report a falsehood. Rule
      27 aggregates a cost TREND, and a long horizon is precisely what makes a trend readable. This
      rule reports a LIVE FREEZE — its reader is asking *is main stopping people RIGHT NOW* — so a
      horizon outliving the fix yields a phantom rather than a trend. MEASURED, 2026-08-30: the line
      named a branch for a main FIXED THE PREVIOUS DAY (six consecutive lands had already succeeded
      in the hour before the echo) and was read as a live freeze, one step from a worker dispatched
      at nothing. At 7d the rule failed its OWN decay-into-silence contract, above. The DIVERGENCE
      from the sibling window is therefore the rule, not an oversight.
      **READER-FACING OVERRIDE.** `YITC_DEBT_PREQUEUE_REFUSAL_WINDOW_DAYS` (blank/malformed ⇒
      default, never an error), resolved host-side in `cli._debt_prequeue_refusal_window_days` — the
      rule-26 / rule-31 knob SHAPE reused, in this fold's own DAYS unit; the fold itself reads no
      environment and keeps `window_days` a plain argument.
      **POSTURE — and this fence is the load-bearing half.** Rides rules 2/3/5 verbatim:
      suppressed-when-clean, report-only, ZERO stored state, NO new event type, no new abort class, no
      new store, no new verb, no new seam, no exit code, no gate. It NAMES A COST and NEVER EXCUSES
      ONE — it waives no gate, retries no land and re-queues nothing, and the row it counts is
      deliberately NOT shaped as a queue entry (no position, no ordering key, no retry hook). Whether
      a refused land should be resumed at all, and by whom, is a SEPARATE question this rule does not
      answer and must not appear to. A repo whose main has frozen nobody in the window ⇒ 0 ⇒
      suppressed.
      Unit tests (`tests/test_t11799_prequeue_refusal_leaves_a_record.py`): both legs of all four ACs
      — the row on main is DIFFERENTIAL against the pre-change copy-selection spelled out inline; the
      cheapness arm carries an inverted leg asserting a reservation WAS taken, which must FAIL; the
      fail-open arm forces the append to raise and asserts an identical exit and identical
      operator-facing message; and the countability arm renders through the real fold in both halves.


  34. **ONE BRANCH BURNING REPEATED UNLANDED LAND ATTEMPTS, WHATEVER THE CAUSE EACH TIME — the
      TRANSPOSE of rule 26.** An OPTIONAL injected report-only WINDOWED fold over the
      JOURNAL (`debt.branch_unlanded_attempt_burn`), wired at the ONE shared host residue like every
      sibling and riding all 3 seams (session-start / land-tail / the `debt` re-fold).
      **SUBJECT.** A BRANCH that recorded `min_attempts` or more UNLANDED land attempts inside the
      window, GROUPED ON THE BRANCH AND ON NOTHING ELSE. An attempt is a refusal of either shape
      rule 26 already defines — a `land_completed{status: abort}` row or a
      `land_member_verdict{verdict: requeued-after-red-batch}` row — and the `_ABORT_BREADTH_EVENTS`
      type set and requeue-verdict constant are REUSED, not restated, so the two projections can
      never disagree about which rows are refusals.
      **THE SECOND PROJECTION OF ONE FOLD, NOT A SECOND MECHANISM.** Rule 26 reads ONE CAUSE across
      MANY BRANCHES; this reads ONE BRANCH across MANY CAUSES, over the same already-emitted rows at
      the same seams. It is the CHARTER §P1 F1/F2 answer — extend the existing fold with another
      view, rather than build a parallel surface.
      **THE GAP IS A KEYING GAP, NOT A THRESHOLD GAP — and this is the whole reason the rule
      exists.** Every surface that could catch a stuck branch is keyed on the REPETITION OF A CAUSE:
      the repeated-abort backstop is per BRANCH but arms only on N CONSECUTIVE aborts sharing
      a cause key; the SPEC-0124 audit-loop ceiling is per TASK and counts audit passes, not land
      aborts; the CHARTER §P7 re-run-vs-resolve discipline is per SESSION and behavioural; rule 27's
      aborted-land cost view groups BY CLASS, so one branch's several classes scatter across several
      rows and never sum. A branch that fails for a DIFFERENT reason each time trips none of them.
      **MEASURED AT THE KEY LEVEL, 2026-08-28 — the premise is proven, not inferred.** Read directly
      off this repo's journal: `task/` carried five aborts of five distinct classes, FOUR of
      them `cause_identity_absent: true` with an empty failing-assertion list; `task/` carried
      seven, and no two CONSECUTIVE aborts shared a refined cause key. The backstop never armed on
      either — proven at the key level, not at the level of abort CLASSES.
      **AND THE STATEMENT IS SHARPER THAN "A DIFFERENT REASON EACH TIME" — it must not be softened
      back to that.** A whole FAMILY of abort classes carries NO cause identity at all
      (`concurrent-land-same-worktree`, `merge-non-union-conflict`, `audited-diff-stale`,
      `unexpected`): for those rows the refined key cannot be COMPUTED, so consecutive aborts within
      that family are INCOMPARABLE rather than merely different. A branch cycling through
      infrastructure aborts is structurally UN-ARMABLE, not unlucky — which is why the answer is a
      cause-AGNOSTIC projection and not a threshold change: no threshold on a key that does not
      exist will ever fire. The line reports that count of identity-absent attempts explicitly,
      because it is what explains the backstop's silence to a reader.
      **THE COUNT IS THE PRIMARY KEY; ELAPSED TIME AND DISTINCT-CLASS COUNT ARE ANNOTATIONS IN THE
      LINE.** The class is "many unlanded attempts REGARDLESS of cause", so the count of attempts is
      what selects. But a bare count cannot tell a three-hour burn from a three-minute one, so the
      elapsed span and the number of distinct abort classes are carried IN the rendered line —
      annotations that make the count actionable, never better keys.
      **NO CAUSE IDENTITY IS CONSULTED, COMPUTED OR BORROWED ANYWHERE IN THIS FOLD.** Rule 26 owns
      that reading; a second opinion here would let the two disagree about what one cause is
      (CHARTER §P5). The `class_count` annotation reads the coarse `abort_class` the row already
      carries and derives no key from it. **How cause keys are computed, and whether the
      identity-absent classes should carry an identity, is a REAL and SEPARATE question this rule
      MEASURED but deliberately does not absorb.**
      **N DEFAULTS TO 4, AND IT IS NOT RULE 26's 2 — measured, not decreed.** Rule 26's floor is the
      EARLIEST moment its fact exists, because each further miss costs ANOTHER branch a full verify.
      Here the opposite pressure governs: retrying IS the normal shape of a converging build, so the
      floor must sit ABOVE the ordinary iteration band. On this repo's journal over 2026-08-21..28 —
      the FREEZE week, i.e. the unfavourable case — still-unlanded refusals per branch in a trailing
      24h run: 106 branches never exceed 1, then 50 reach 2 or more, 28 reach 3 or more, 18 reach 4
      or more. The three-attempt convergence band dominates; 4 is the first value clear of it and
      one BELOW the smaller of the two shapes that proved the gap (five aborts, seven aborts), so
      the line arrives while the burn is still worth interrupting rather than after it has
      completed. Exposed as `YITC_DEBT_BRANCH_BURN_MIN_ATTEMPTS`, FLOORED AT 2 (a single unlanded
      attempt is not a repeat at all), so the knob can only ever make the line LESS eager.
      **THE WINDOW IS RULE 26's, REUSED AND NOT RE-DECLARED** — `_ABORT_BREADTH_WINDOW_HOURS` /
      `YITC_DEBT_ABORT_BREADTH_WINDOW_HOURS` (24h). The two folds are transposes of ONE reading met
      by the same reader at the same seam, and a second horizon would mean a reader holding two.
      Measured free besides: at N=4 the reading barely moves between a 12h and a 24h horizon.
      **A LANDED BRANCH STOPS BEING REPORTED — this is what the word UNLANDED buys.** Attempts are
      counted only AFTER the branch's most recent SUCCESSFUL land inside the window: a branch whose
      attempts reached main is provably not burning now. A fold predicate, never a gate — the exact
      analog of rule 26's "the row drops by itself once the cause stops recurring".
      **POSTURE — the load-bearing half.** Rides rules 2/3/5 verbatim: suppressed-when-clean,
      report-only, ZERO stored state, NO new event type, no new abort class, no new store, no new
      verb, no new seam, no exit code, no gate. A cause-agnostic GATE was REJECTED by the external
      adjudication (GREEN, zero findings, `decisions/stuck-branch-surfacing-proposal-audit-adhoc.yaml`,
      2026-08-28) as a first move, and the reason is recorded here because it constrains any future
      strengthening: it would confuse stuckness with LEGITIMATE ITERATION — a branch that first
      resolves a merge conflict, then refreshes audit currency, then fixes verify fallout, where
      each abort reveals real forward progress. That is what `task/` did before landing on
      its sixth attempt. If ever built, advisory before enforcement.
      **THE WEAK FILTER, STATED RATHER THAN DRESSED UP.** CHARTER §P1 filter 3 is weak here: no code
      is removed. The same adjudication judged that "weak but not fatal" — this is a report-only
      second projection of an existing fold over already-emitted events, and what it removes is the
      MANUAL JOURNAL INSPECTION a human did by eye on 2026-08-28 to establish the premise above. No
      deletion is invented to make the filter look stronger.
      **DISTINCT FROM THE ROUTING HALF, which is out of scope.** Routing may send a branch
      solo after repeated rides, but it creates no explicit stuck signal, preserves no cross-cause
      evidence, and does not help notice a branch that keeps failing SOLO for changing reasons.
      Unit tests (`tests/test_stuck_branch_unlanded_attempts_surfacing.py`): two tripwires, one per
      atom — the line-and-what-it-carries atom (AC1+AC2) and the report-only atom (AC3), both
      DIFFERENTIAL against a pre-change baseline copied INLINE, never a moving ref.

  36. **A `ready` CARD BLOCKED FOREVER BY A `wont-do` REQUIREMENT — the permanently-unpickable set
.** An OPTIONAL injected report-only fold over `tasks/` alone
      (`debt.unpickable_ready_cards`), wired at the ONE shared host residue like every sibling and
      riding all 3 seams (session-start / land-tail / the `debt` re-fold).
      **SUBJECT.** A card whose own status is `ready` and whose `requires:` names an id whose card,
      in THIS checkout, is `wont-do`.
      **THE GAP.** `requires:` is the picker's BLOCKING edge — a card is pickable only once every id
      it requires is DONE — and `wont-do` is the OTHER terminal status, terminal in the direction
      that NEVER satisfies: the required work was decided against. Such a card can therefore never be
      picked, while reading `ready` at every surface that folds card status; measured 2026-08-30, no
      lens read `requires:` at all and `wont-do` appeared in this module only in
      `TERMINAL_CARD_STATUSES`.
      **WHY THE PICKER'S OWN REFUSAL DOES NOT COVER IT — the load-bearing part.** The picker refuses
      the card at SELECTION, correctly, and says so to whoever asked. But nobody asks: a card that is
      never selected is never refused, so the refusal is reachable only along the path the blockage
      makes nobody take. The debt seam is the surface a controller passes ANYWAY, which is what makes
      it the one that can say this unprompted.
      **IT CLAIMS ONLY WHAT IT CAN PROVE — fail-closed toward SILENCE, and the asymmetry with rule 18
      is deliberate.** A required id whose card is ABSENT, unreadable, malformed, not id-shaped, or
      carrying any other status contributes NOTHING. Absence is the ORDINARY state of an id a
      checkout has not got, and the claim this line makes is strong («this can never be picked»), so
      it is made only where a `wont-do` card is sitting right there — otherwise every consumer repo
      and every fixture tree would nag. Rule 18's opposite posture (every uncertainty KEEPS the row)
      belongs to a view whose subject is a stopped worker awaiting a decision; here an uncertain read
      would manufacture a permanence nobody can verify.
      **THE REMEDY IS A DECISION, NEVER A SWEEP, and the line says so.** Two honest exits — DROP the
      dead `requires:` edge if the requirement turned out not to be needed, or CLOSE the card itself
      `wont-do` if it was the point. Which one applies is a judgement about the WORK, so the view
      names the pair and picks neither. It never suggests deleting the edge to make the row go away:
      that re-admits the card to a queue nothing has re-justified.
      **SURFACING IS NOT PICKING** (SPEC-0085 §8): it names the STUCK cards — the opposite of naming
      a candidate — ranks nothing and selects nothing. Report-only, suppressed-when-clean, UNFLOORED
      (one card stuck forever is debt at count 1, and count-hiding it restores the silence the rule
      ends), zero stored state, NEVER gates. A repo with no `tasks/` folds to a clean zero, so
      history is never retro-charged (SPEC-0149 §2 — pure: files in, no clock, no subprocess).

  35. **A DECLARED `subject_globs:` SUBJECT WHOSE SUITE FILE IS EXECUTED BY NOTHING — the EXECUTION
      axis of subject-scoping.** An OPTIONAL injected report-only fold over the ops CARRIER
      plus the CHECKOUT (`debt.unexecuted_subject_files`), wired at the ONE shared host residue like
      every sibling and riding all 3 seams (session-start / land-tail / the `debt` re-fold).
      **SUBJECT.** A suite file that (a) is one of this consumer's DECLARED test probe files, (b) is
      matched by some EXECUTABLE layer's declared `subject_globs:`, and (c) is named NOWHERE in the
      UNION of those layers' execution registries. Declared, therefore believed covered; named by
      nothing, therefore run by nothing.
