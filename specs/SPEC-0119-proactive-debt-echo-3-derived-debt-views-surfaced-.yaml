  \ requeued-after-red-batch}` row — and the `_ABORT_BREADTH_EVENTS`\n    type set\
  \ and requeue-verdict constant are REUSED, not restated, so the two projections\
  \ can\n    never disagree about which rows are refusals.\n    **THE SECOND PROJECTION\
  \ OF ONE FOLD, NOT A SECOND MECHANISM.** Rule 26 reads ONE CAUSE across\n    MANY\
  \ BRANCHES; this reads ONE BRANCH across MANY CAUSES, over the same already-emitted\
  \ rows at\n    the same seams. It is the CHARTER §P1 F1/F2 answer — extend the existing\
  \ fold with another\n    view, rather than build a parallel surface.\n    **THE\
  \ GAP IS A KEYING GAP, NOT A THRESHOLD GAP — and this is the whole reason the rule\n\
  \    exists.** Every surface that could catch a stuck branch is keyed on the REPETITION\
  \ OF A CAUSE:\n    the repeated-abort backstop is per BRANCH but arms only on N\
  \ CONSECUTIVE aborts sharing\n    a cause key; the SPEC-0124 audit-loop ceiling\
  \ is per TASK and counts audit passes, not land\n    aborts; the CHARTER §P7 re-run-vs-resolve\
  \ discipline is per SESSION and behavioural; rule 27's\n    aborted-land cost view\
  \ groups BY CLASS, so one branch's several classes scatter across several\n    rows\
  \ and never sum. A branch that fails for a DIFFERENT reason each time trips none\
  \ of them.\n    **MEASURED AT THE KEY LEVEL, 2026-08-28 — the premise is proven,\
  \ not inferred.** Read directly\n    off this repo's journal: `task/` carried five\
  \ aborts of five distinct classes, FOUR of\n    them `cause_identity_absent: true`\
  \ with an empty failing-assertion list; `task/` carried\n    seven, and no two CONSECUTIVE\
  \ aborts shared a refined cause key. The backstop never armed on\n    either — proven\
  \ at the key level, not at the level of abort CLASSES.\n    **AND THE STATEMENT\
  \ IS SHARPER THAN \"A DIFFERENT REASON EACH TIME\" — it must not be softened\n \
  \   back to that.** A whole FAMILY of abort classes carries NO cause identity at\
  \ all\n    (`concurrent-land-same-worktree`, `merge-non-union-conflict`, `audited-diff-stale`,\n\
  \    `unexpected`): for those rows the refined key cannot be COMPUTED, so consecutive\
  \ aborts within\n    that family are INCOMPARABLE rather than merely different.\
  \ A branch cycling through\n    infrastructure aborts is structurally UN-ARMABLE,\
  \ not unlucky — which is why the answer is a\n    cause-AGNOSTIC projection and\
  \ not a threshold change: no threshold on a key that does not\n    exist will ever\
  \ fire. The line reports that count of identity-absent attempts explicitly,\n  \
  \  because it is what explains the backstop's silence to a reader.\n    **THE COUNT\
  \ IS THE PRIMARY KEY; ELAPSED TIME AND DISTINCT-CLASS COUNT ARE ANNOTATIONS IN THE\n\
  \    LINE.** The class is \"many unlanded attempts REGARDLESS of cause\", so the\
