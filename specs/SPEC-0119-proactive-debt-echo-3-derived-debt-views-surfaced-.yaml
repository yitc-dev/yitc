  \ never nag on an unknown.\n    **An AGE floor, set above the longest sanctioned\
  \ watch cycle** (env\n    `YITC_DEBT_DISPATCH_MONITOR_FLOOR_MINUTES`, default 90\
  \ min; non-positive disables it). The watcher\n    journals its receipt at EXIT,\
  \ so a currently-ARMED watch is invisible to the fold until it finishes\n    (`WATCH_MAX_RUNTIME_SECS`\
