  \ either. The nightly REUSES this\n    same one source (CHARTER §P5 — no parallel\
  \ stance logic), so the two surfaces can never disagree.\n    **The unreadable-carrier\
  \ answer belongs to each READER, not to the source**\n    (`lessons/fail-closed-belongs-to-the-reader-not-the-parser`:\
  \ fail-closed is a property of a use site,\n    not of a parse result). The VIEW\
  \ stays faithful — an unreadable/malformed carrier ⇒ count 0, and the\n    debt\
  \ echo never nags on it (the SPEC-0093 init sweep owns malformed-carrier errors,\
  \ and in a repo with\n    a live session that sweep will run). The NIGHTLY reader\
  \ has the opposite duty — it exists precisely to\n    check repos NOBODY opens,\
  \ where no sweep ever runs — so it FAILS CLOSED and alerts on a broken\n    carrier,\
  \ the rule its 3 sibling checks already hold (collapsing ABSENT and CORRUPTED into\
  \ one\n    `skip` makes a broken carrier read as health exactly when the check matters\
  \ most). It names no items\n    on that arm (the counts stay total-safe) and neither\
  \ re-prints the UNREADABLE cause nor re-counts the\n    broken carrier: counts the\
  \ carrier once, and it is one fault on one file.\n\n14. **Recent security-gate overrides\
  \ (SPEC-0155 rule 7, X-0362/X-0363).** An OPTIONAL injected\n    report-only view\
