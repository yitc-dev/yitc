  ### Rule 20 — Remote-lag (the declared offsite copy has fallen behind) — / X-0932
      **SUBJECT.** How far a project's DECLARED offsite copy has fallen behind its integration branch.
      A collaborator (<collaborator>, kupiclub, X-0932) asked for `land` to PUSH to the declared remote "so a
      project's offsite copy cannot silently fall behind main". The request's own purpose clause names
      the harm — SILENT lag — and this rule removes the silence WITHOUT giving `land` a network side
      effect. `cmd_land` is not touched by this rule at all.
      **WHY A SIGNAL AND NOT A PUSH (the rejected direction, named — CHARTER §P1 F3/F4).** A push is a
      substantive OUTBOUND EXTERNAL MUTATION (SPEC-0116). Making one an unconditional side effect of
      every land would change what `land` IS: it would add the kernel's first network write to the
      integration path, and a new mid-land failure class (a push that fails halfway). It also cannot
      satisfy its own purpose — because a push must never fail a land that otherwise succeeded, a
      failed push must be swallowed, and a swallowed push RECREATES the exact harm reported (an
      offsite copy silently behind) while appearing to handle it. A count cannot fail silently. A
      separate push VERB was also rejected: `git push` already is that verb, and wrapping it removes
      nothing and drags in the credentials surface the request put out of scope. Neither rejection is
      permanent — a lag count that turns out to be routinely acted on by hand is the real incident
      that would justify an operator-invoked push verb later, properly capturable under SPEC-0116.
      **OPT-IN THROUGH THE EXISTING DECLARATION — no new carrier.** The subject is SPEC-0163's
      `remote_sync:` concern (`remote:` + `pusher:` + `ci:`, declare-or-waive). A project that declares
      nothing, or WAIVES, contributes NOTHING and behaves exactly as before this rule. No new config
      key, no new section, no new stance to take.
      **LOCAL READ ONLY — NO NETWORK, BY CONSTRUCTION.** The baseline is the LOCAL remote-tracking ref;
      the fold never runs `fetch` / `ls-remote` / `push` / `pull` (a declared forbidden set, asserted
      by test rather than promised in prose). Three grounds: SPEC-0163 rule 3 holds that the kernel
      checks the STANCE and "never the remote's reachability" — scoped to the init sweep, but its
      INTENT reaches here and is honoured rather than routed around (CHARTER §P7); it makes "land is
      never contingent on the remote" STRUCTURAL rather than a matter of remembering every error path;
      and it costs nothing at two hot seams.
      **WHY THE LOCAL READ IS HONEST — AND THE ONE CONDITION IT RESTS ON (kupiclub X-1094).**
      `git push` updates the tracking ref ONLY when it names a CONFIGURED REMOTE; a push BY URL updates
      the offsite copy and no local ref at all. Since `remote_sync.remote` may itself BE a URL, the
      baseline is EXACT for the single declared `pusher:` PROVIDED that pusher pushes by remote NAME —
      which is why the rendered remedy prints the RESOLVED CONFIGURED NAME rather than the declared
      string. That condition is not decorative: while the line interpolated the declared value, a
      URL-declaring project that followed this view's OWN advice pushed successfully and the count did
      not move, so the remedy could not clear the signal that printed it (measured, kupiclub
      2026-08-22). The motivating failure — a pusher that STOPS (aiseller's v1
      auto-pusher died at quiesce, SPEC-0163 rationale) — leaves the ref frozen while `main`
      advances, so the count climbs at every seam. The residual imprecision runs in ONE direction only:
      a third party pushing elsewhere leaves our ref behind, so the count may OVER-report. It can never
      under-report to a false zero from staleness alone, so the view cannot go SILENT on real lag. The
      line states this bound rather than presenting the reading as more than it is.
      **UNFLOORED (rule 3 applied).** An offsite copy ONE commit behind is already the state this makes
      visible, and the failure mode is a count growing unwatched — a floor would re-hide precisely the
      early reading that is cheapest to act on.
      **THE DEGRADES PRINT; ONLY A REAL OPT-OUT IS SILENT.** `not-declared` (absent carrier / no
      section / waived / no `remote:`) is suppressed. But an UNREADABLE carrier, a MALFORMED
      declaration, a declared remote that is NOT CONFIGURED, and a MISSING tracking ref each get their
      OWN line — a project that MEANT to declare must never be silently read as having declared
      nothing, and "cannot compute the lag" is not the same fact as "in sync". This is the rule-23
      live-revision adapter's named-degrade discipline, and it is the false-zero this view must never
      have.
      It rides rules 2/3/5 verbatim — the SAME 3 seams (session-start / land-tail / `debt` re-fold)
      from the ONE host residue, SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a gate: no verb gains a
      refusal on account of this row and no exit code moves. NO new store / event type / verb / env
      knob / seam / config key — one more OPTIONAL injected collaborator over a declaration that
      already exists (P1 F1/F2). A repo declaring no remote ⇒ suppressed, so nothing is retro-charged.

  23. **DEAD LANDS — the land that died before its own terminal signal (kupiclub X-0976).**
      An OPTIONAL injected report-only view over the BRANCH FRONTIER joined to the journal
      (`debt.dead_lands`), wired at the ONE shared host residue like every sibling and riding all 3
      seams (session-start / land-tail / the `debt` re-fold).
      **SUBJECT.** A `land` killed between its FIRST COMMIT and its FIRST EVENT. This is the one
      failure every existing surface is blind to AT ONCE, and the blindness is structural rather than
      an oversight: they all key off rows such a land never wrote. The `LAND:` terminal-status token
      is stdout of a process that is gone. The repeated-abort backstop counts `land_completed{abort}`
      ROWS. Rules 12/18 fold dispatches and worker halts; rules 4/21 fold followups and plans. So the
      ONE trace a dead land leaves is a GIT COMMIT — `land` step-1's bookkeeping fold — and this rule
      is the only reader that looks at it.
      **THE MEASUREMENT (kernel, 2026-08-18; the consumer half is kupiclub X-0976).** `land` ran on
      `work/cross-triage-round-2` at, committed its step-1 bookkeeping
      (5fe2f328d) and died before update-from-main / verify / ff. NO `land_completed` row exists in
      main's journal, the branch's own journal, or the still-present worktree's — not even
      `status=abort`. Three filed cards sat stranded and INVISIBLE on
      main for ~16 hours, and were found only because an unrelated `task file` overlap advisory
      happened to name the branch. In the consumer half, two detached lands had aborted and the
      controller learned of it only when the OWNER asked why nothing was running — the box at loadavg
      11 with zero building workers for ~20 minutes. Both causes were trivial; the cost was entirely
      in NOT KNOWING.
      **THE PREDICATE — two conditions, BOTH necessary.** A branch reports iff (1) it is NOT merged
      into main AND its tip subject is the land step-1 fold marker FOR THAT SAME BRANCH
      (`land: bookkeeping (<branch>)`) — so a land STARTED here; AND (2) NO `land_completed` row names
      that branch at a ts AT OR AFTER the tip's own committerdate — so that land never REPORTED.
      **WHY CONDITION 2 IS HALF THE DESIGN, NOT A REFINEMENT — the measured trap.** "A branch ahead of
      main with a bookkeeping-only tip" is BY ITSELF a false-positive generator. SIX branches in the
      kernel repo carry that tip and are unmerged; FIVE landed FINE, each carrying a
      `land_completed{ok}` at or just after its tip. They persist only because
      `_land_bookkeeping_commit` AMENDS its commit, leaving the stale PRE-amend object on the
      local ref while main carries the amended one. The tip test ALONE would report 6 and be WRONG on
      5. A view that flags every unlanded branch does not satisfy this rule — it is a noise generator,
      and noise buries the echo it rides (the SPEC-0149 39-line trial disproof, paid for once already).
      **AT OR AFTER THE TIP, never merely "any row for this branch".** A branch may have landed ok once
      and had a LATER land die on it; anchoring to the tip's OWN timestamp is what lets the newest land
      be judged on its own evidence instead of being excused by an ancestor's success.
      **AN ABORT IS NOT HERE — it REPORTED.** A `land_completed{abort}` suppresses exactly as an `ok`
      does. This rule is for SILENCE, not for failure: the repeated-abort backstop already owns the
      abort class, and duplicating it here would bury the row that has no other home.
      **THE ROW SET IS THE UNIONED ONE — a correctness condition, not a wiring detail.** `land` runs
      from main and appends to MAIN's journal, but a row can also sit in a branch's own journal or a
      live worktree's; a local-only read would report a land that DID report. The view binds the SAME
      unioned reader rule 18 uses (local checkout + MAIN + every live worktree), narrowed BY TYPE and
      never by AGE — a dead land must not age out of its own detection. Verified across all three loci
      on the live incident before shipping: 0 rows in each.
      **UNCERTAINTY DIRECTION — deliberately the OPPOSITE of rule 18, and the difference is the
      SUBJECT, not a change of posture** (`lessons/fail-closed-belongs-to-the-reader-not-the-parser`:
      the missing-value judgement belongs to the use site). Rule 18 fails closed toward VISIBLE because
      its subject is a decision still owed. THIS subject is "nothing was reported at all", so a
      terminal row that EXISTS but whose ts will not parse is already not that class and SUPPRESSES.
      Every OTHER uncertainty — an unreadable frontier reader, an unreadable journal reader — folds the
      WHOLE view to a clean zero rather than a partial guess (rule 12's report-only posture, verbatim).
      **COLLABORATOR CRITICALITY — two classes, never conflated.** The frontier reader and the row
      reader ARE the predicate: either raising folds to zero. The worktree-path lookup is REMEDY
      CONTEXT ONLY, is never consulted by the predicate, and is guarded PER BRANCH — a raise or a None
      yields a row with no worktree path, never a suppressed row. A dead land whose worktree was
      already removed is still a dead land, and a cosmetic lookup failure must never silence the
      incident this rule exists for.
      **THE AGE FLOOR (rule 3 applied as an AGE floor, never a COUNT floor) — and the retraction that
      earned it.** This rule was DRAFTED unfloored, on the reasoning that a dead land is debt from its
      first minute. That reasoning was WRONG, and the card's OWN AC2 live probe is what refuted it:
      between land step-1's bookkeeping commit and its terminal row, a HEALTHY IN-FLIGHT land is
      byte-for-byte INDISTINGUISHABLE from a dead one — same marker tip, same absent row. The first
      live run named 1 branch; a run minutes later, with four sibling lanes mid-`land`, named 5 — FOUR
      of them healthy lands still verifying. Nagging a controller about workers that are working is
      how a report-only line teaches its reader to ignore it, which would cost this rule the very
      signal it exists to carry. The retraction is recorded rather than quietly edited because the
      unfloored claim was ACTIVE spec text (§Principle 7).
      So a candidate younger than the floor is SUPPRESSED — an AGE floor, so the COUNT is never
      hidden and only YOUTH suppresses. **WHY 90 MINUTES — measured, not decreed:** over the 4365
      `land_completed` rows carrying timings in the kernel journal, the longest healthy land (verify +
      admission wait) ran 38.7 min and p95 was 8.0 min, so 90 exceeds the observed maximum by 2.3x. A
      merely SLOW land — a long verify, a SPEC-0132 admission wait, a retry — can never read as dead,
      while the originating incident (20 HOURS silent) surfaces with an enormous margin; the measured
      separation is 20h against minutes, not a marginal call. The shape AND the value are
      DELIBERATELY rule 12's (`_debt_dispatch_monitor_floor_minutes`), reused rather than newly
      decreed, and configurable by the same env-knob convention
      (`YITC_DEBT_DEAD_LAND_FLOOR_MINUTES`; non-positive disables). A candidate whose TIP DATE will
      not parse cannot be aged, so the floor cannot apply to it and it is KEPT — condition 2 has
      already established that no terminal row exists, and an unparseable git committerdate is a
      corruption worth a line, not a reason to go quiet.
      **THIS IS THE P8 CASE MADE AGAINST THIS RULE ITSELF.** No unit test written from the plan would
      have produced that input, because the plan did not know the state existed; only running the
      shipped surface against the live repo did. It is the concrete argument for CHARTER §Principle 8
      demanding a live trigger for infra-class closure rather than a direct-call test, and the
      tripwire that now holds it (an in-flight candidate is silent, the aged one speaks, and disabling
      the floor makes the fresh one fire) is in the rule's suite.
      **WHAT THIS IS NOT — the fence, and the REJECTED alternative named (CHARTER §6 named retirement
      (d)).** The rejected design was (a) `land` writing an IN-FLIGHT MARKER at start that a later
      sweep finds unresolved. It is refused on two independent grounds. First, a marker is only useful
      if something later ARMS on it and judges it stale — that is the liveness-arming FSM §6 forbids by
      name, and the external-auditor placement consult for rule 18
      (`decisions/halted-worker-surface-placement-audit-adhoc.yaml`) already REJECTED extending watcher
      machinery for this exact reason. Second, it could not see the incident anyway: the failure class
      is a process dying at an ARBITRARY point, including before its own marker write. This rule needs
      no writer because the state already exists and is durable — the git ref IS the marker `land`
      already wrote, and the journal IS the record of whether it reported (P1 F2: a view, not a new
      entity). So it stores NO queue state, arms NO FSM, registers NO watcher, and STARTS NOTHING; it
      NAMES a branch and points at the EXISTING idempotent `worktree recover-land`, which a human runs.
      **AND IT NAMES THE FORM THAT ACCEPTS THAT BRANCH.** Pointing at the verb is not enough:
      this view folds the whole frontier, so it surfaces `work/<slug>` branches as readily as
      `task/T-XXXX` ones, and the verb takes `--task` OR `--work` — a line that named a branch and then
      an invocation refusing it would walk every reader into a dead end at the exact seam they reached
      because something was already wrong. So the remedy is RENDERED PER BRANCH from its namespace
      (`debt.dead_land_remedy`, the ONE renderer both this rule's `next:` and the session-start /
      land-tail echo consume, so the two cannot name different remedies for one branch). A branch
      OUTSIDE `task/`+`work/` gets a read-only `git log` diagnostic instead of a verb form — never a
      bare command the required flag group would refuse. This adds NO rule and changes NO posture: it is
      what "points at the remedy" already claimed to mean, made true per namespace.
      It rides rules 2/3/5 verbatim — SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a gate: no verb gains a
      refusal and no exit code moves. NO STORE, NO EVENT TYPE, NO VERB, NO SEAM, NO CONFIG KEY —
      ONE env knob, `YITC_DEBT_DEAD_LAND_FLOOR_MINUTES` (`cli._debt_dead_land_floor_minutes`), the
      AGE floor this rule documents above and registers below.
      A repo whose every started land left a terminal row ⇒ suppressed, so history is never
      retro-charged, and a row drops by itself the moment a terminal row lands for that branch.

  24. **WORK BRANCHES AHEAD OF MAIN — the one fact that separates a benign stale branch from a serious
      one (kupiclub X-1001, corrected by X-1003).**
      An OPTIONAL injected report-only view over the git BRANCH FRONTIER (`debt.ahead_work_branches`),
      wired at the ONE shared host residue like every sibling and riding all 3 seams (session-start /
      land-tail / the `debt` re-fold).
      **SUBJECT.** A `task/*` or `work/*` branch carrying commits `main` does not have. Being AHEAD of
      main is the single fact that tells a harmless leftover apart from stranded work, and it was
      reported by NOTHING. The blindness is structural in each existing surface rather than an
      oversight: the dispatch-status census counts live WORKTREES, not branches; the rule-2
      not-adopted view walks main→live, the INVERSE leg, so a branch that never reached main is
      invisible to it BY CONSTRUCTION; and `worktree sweep` removes the desk copy while leaving the
      branch, saying nothing at any seam. Rule 23 names branches, but only those whose TIP is the land
      step-1 marker.
      **THE MEASUREMENT (kernel).** `git for-each-ref --no-merged main refs/heads/`
      returns 18 branches, every one ahead of main by 1-5 commits. Under this rule's bounds FOUR
      report: `work/bench-base-T0387|T9527|T9542` (3 commits each, 56d — an undeclared June benchmark
      leftover no lifecycle owns) and `work/park-bound-evidence-trigger` (1 commit, 25.8h — a chore
      that never landed). Every one of the four carries an ordinary work subject, so rule 23's
      condition 1 rejects them and no other surface looks at all. The consumer half is kupiclub's
      X-1001: four abandoned worktrees aged 28-40h on a fleet-shared host, found only because a
      conversation went looking.
      **THE COUNT IS BY SHA, NEVER BY CONTENT — and this rule is written on the CORRECTED ground.** In
      X-1003 the reporter RETRACTED the supporting half of their own X-1001: they had read a
      `git diff main..branch` as absence, which it is not — a change that reached main by another
      commit still shows as a difference — and a line-level re-measure found both branches' substance
      already in main, with only routine bookkeeping rows genuinely absent. So this rule must NOT be
      justified by that instance, and it is not: its ground is that the ahead-ness FACT had no
      surface, which is exactly why nobody could tell the two cases apart without doing it by hand.
      The view therefore REPORTS the fact as the fact it is and judges nothing, and the rendered line
      states the SHA-not-content bound in its own words so no reader can repeat the retracted reading.
      **THE PREDICATE — four bounds, applied in the FOLD.** A branch reports iff (1) its name is in
      `AHEAD_BRANCH_NAMESPACES` (`task/`, `work/`) — the two namespaces `worktree new` creates and the
      lifecycle is therefore responsible for landing; AND (2) its ahead-count is a positive int; AND
      (3) it is not rule-23-owned (below); AND (4) it is at least `floor_hours` old.
      **THE COMPLEMENT BOUNDARY, and why `ahead == 1` is half of it.** Rule 23 owns branches whose land
      STARTED and never reported; this rule owns branches where a land never started at all. The two
      are partitioned by rule 23's OWN tip predicate (`_dead_land_tip_is_land_marker`, reused, never
      re-derived) under one conjunct: a branch is dropped here iff `ahead == 1` AND its tip is that
      marker. The bound is LOAD-BEARING and was added at audit-pre pass 1 on a high finding. An
      unbounded tip test would drop a branch whose TIP merely looks like bookkeeping while EARLIER
      commits of real work are still missing from main — and rule 23 does not catch that branch
      either once its land REPORTED, since a `land_completed{abort}` row suppresses it there. The
      blind spot this rule exists to close would then be restored inside the very predicate meant to
      divide the two views. Bounded to `ahead == 1` the drop covers exactly the class it was written
      for: the `_land_bookkeeping_commit` AMEND residue is by construction a SINGLE commit —
      the branch's work reached main by fast-forward and differs by no SHA, leaving only the stale
      pre-amend object — which is why all four such branches on the live frontier measure ahead=1
      (task). A marker-tipped branch at ahead>1 IS reported.
      **THE AGE FLOOR (rule 3 applied as an AGE floor, never a COUNT floor).** EVERY healthy in-flight
      build has a branch ahead of main — that is what a worktree IS — so youth is precisely what must
      never fire, and this rule is floored from birth rather than learning it from a live probe as
      rule 23 did. **WHY 24 HOURS — measured, not decreed:** on the live frontier at design time two
      genuinely live lanes sat at 15.7h and 17.5h (`work/bump-11323`, `task/-recovered`)
      against the one genuinely abandoned branch at 25.8h, and the originating incident measured
      28-40h — so the floor sits above every live instance and below every reported one. Shape and
      knob convention are rules 12/23's, reused rather than newly decreed
      (`YITC_DEBT_AHEAD_BRANCH_FLOOR_HOURS`; non-positive disables). A candidate whose TIP DATE will
      not parse cannot be aged, so the floor cannot apply and it is KEPT — ahead-ness is already
      established, and an unparseable committerdate is a corruption worth a line, not a reason to go
      quiet.
      **UNCERTAINTY DIRECTION — silent, never wrong.** The frontier reader IS the predicate: a raise
      or a non-list folds the WHOLE view to a clean zero rather than a partial guess (rule 12's
      report-only posture, verbatim — a view must never break the seam it rides). `%(ahead-behind:)`
      needs git >= 2.41; on an older git the field returns EMPTY, bound (2) drops the branch, and the
      view degrades to SILENT rather than to a wrong count, which is the right direction for a
      report-only surface.
      **THE READ IS BROAD, THE TRIGGER IS NARROW** (`lessons/scope-the-trigger-not-the-view`). ONE
      `for-each-ref` covers every branch — breadth is what makes the sweep possible — and the three
      bounds that decide what INTERRUPTS live in the FOLD, never smuggled into the reader. Cost is one
      subprocess per echo and NO per-branch call: a branch is `--no-merged main` iff
      `rev-list --count main..<branch>` > 0, so the frontier call already yields exactly the
      ahead-of-main set, and `%(ahead-behind:main)` carries the count itself.
      **SURFACING IS NOT PICKING — the rule-21 fence, mirrored.** The line NAMES branches and nothing
      more: no candidate, no ranking, no selection, no next-action verb, and its only pointer is a
      read-only `git log --oneline main..<branch>`. Merging or deleting a branch stays a human act.
      A branch NOT ahead of main is NOT reported — reporting harmless leftovers is the
      alarm-on-normal-behaviour shape that teaches a reader to stop reading the echo, which costs more
      than the blind spot this rule closes. It rides rules 2/3/5 verbatim — SUPPRESSED-WHEN-CLEAN,
      REPORT-ONLY, never a gate: no verb gains a refusal and no exit code moves. NO new store, NO new
      state, NO new status field, NO new verb, NO new event type, NO new seam. A repo whose every work
      branch is merged ⇒ suppressed, so history is never retro-charged, and a row drops by itself the
      moment its branch merges or is deleted.

  25. **CONCURRENT SESSION HOLDS — the repo renders as single-actor while it is not (kupiclub X-1025).**
      An OPTIONAL injected report-only view over the LIVE WORKTREE LIST + the session stamps
      (`debt.concurrent_session_holds`), rendered through the ONE shared host residue like every
      sibling but riding TWO of the three debt seams — SESSION-START and the on-demand `debt`
      re-fold, NOT the land tail (§Seam set below).
      **SUBJECT.** A live worktree in THIS repo stamped by a session OTHER than the reading one.
      **WHY NOTHING ELSE SHOWS IT, and the one line that looks like it does.** A claim
      (`ready -> in-progress`) is written INSIDE the claiming worktree and reaches `main` only through
      `land` ( option B). So `session._session_build_dispatch`'s "N task(s) in-progress in other
      sessions" — which folds `tasks/*.yaml` STATUS on the reading checkout — is silent for exactly
      the holds that matter, and `task list` reports the held card as `ready`. The only surface that
      does reveal a second actor is `journal query --dispatch-status`, a per-task liveness read a
      controller has to think to run. Rule 24 names branches AHEAD of main, which is a different fact
      and misses a fresh claim entirely.
      **THE MEASUREMENT (kernel, 2026-08-20/21).** A controller session ran this repo all evening
      beside a second controller and learned of it only BY ACCIDENT — an unfamiliar branch name
      noticed in a `git worktree list` run for another reason. Later the same evening it read
      and as `ready` on main, both already claimed by that other session, and was one step
      from dispatching duplicate workers; what stopped it was a hand `git worktree list`. At the time
      this rule was built, this repo's own fold returned 12 distinct foreign stamps holding 12 live
      worktrees, while the session-start echo printed 7 debt lines and named none of them.
      **THE PREDICATE — the bounds live in the FOLD.** A row reports iff (1) it is a live `task/*` or
      `work/*` worktree (the main checkout is where everyone reads, never a hold); AND (2) its stamp
      is NOT the reading session's; AND (3) its stamp was not positively attributed to a worker the
      READING controller itself dispatched (the attribution paragraph below). Rows are then GROUPED BY
      STAMP, and the count is of DISTINCT FOREIGN STAMPS while `worktrees` counts what they hold
      between them. An UNSTAMPED worktree (raw
      `git worktree add`, unreadable stamp) is FOREIGN — fail-closed, `_read_worktree_stamp`'s own
      rule — and is deliberately NOT grouped: two unknowns are two unknowns, never one holder.
      **WHAT THE STAMP PROVES, AND WHAT IT DOES NOT — stated in the line, not left to the reader
, AND ITS MEASURED EXCEPTION.** Background workers that INHERIT their
      controller's provider session id SHARE one `session_ref`, so such a fleet reads as ONE stamp and
      own/foreign collapses inside it. A DISPATCH-LAUNCHED worker does NOT: `dispatch` assigns a FRESH
      ref per worker (it scrubs the identity carriers deliberately) and records it as `expected` on its
      own `bg_dispatch_launched`, so one controller's dispatched fleet reads as N distinct "other"
      stamps. Measured on the kernel : the line read 19 stamps holding 19 worktrees,
      at least two of them the READING controller's own workers (verified against its
      own launch records) — and the one genuinely foreign holder that night (a neighbouring plan's
      worker on) was found by hand in `git worktree list`, because here it would have been the
      20th row among 19 of the reader's own. The question this view exists to answer — is a DIFFERENT
      controller working this repo — was therefore unanswerable from it.
      **ATTRIBUTION, AND IT NEEDS NO NEW STATE.** The launch record already carries both halves: its
      ENVELOPE `session_ref` is the LAUNCHING controller and its `data.expected` the ref that worker
      will stamp with. So own-versus-foreign is a FOLD over the journal the debt echo already reads —
      no store, no registry, no new event, no new read path (CHARTER §P1 F2: a view, not an entity). A
      holder positively attributed to the reader's own fleet moves to a separate `own_fleet` field and
      is NAMED in the line as such; it is EXCLUDED from the count, which keeps meaning DISTINCT FOREIGN
      STAMPS. The line is never SUPPRESSED for own dominance and the foreign count is computed
      independently of it, so a genuinely foreign holder stays visible behind any number of own workers.
      **AND ATTRIBUTION FAILS SAFE THE OPPOSITE WAY TO THE REST OF THIS RULE.** Everywhere else here
      the generous reading is safe, because over-reporting costs only noise. Attribution SILENCES, so a
      wrong one hides the exact holder this view exists to surface. It therefore demands POSITIVE PROOF
      — a launch record the reader itself emitted naming that exact ref — and every uncertainty
      resolves to FOREIGN and VISIBLE: no ref set, an unreadable journal, an unresolvable own identity,
      an UNSTAMPED worktree (`UNKNOWN_HOLDER` is not a ref and can never match a launch record). The
      view therefore still reports "another session's work is live here" and NEVER an actor count.
      Scoping the wording to what the stamp actually proves is a requirement of this rule, not a
      nicety: a line that over-claimed would be wrong in the direction that matters.
      **LIVENESS IS ADVISORY, NEVER AUTHORITY, AND NEVER ORed WITH PRESENCE.** A worktree's PRESENCE
      is not proof its holder is alive — that conflation caused the double-claim, where a live
      hold read as a resumable orphan. Liveness is read the way the existing readers read it
      (`_session_proc_alive`, one probe per DISTINCT stamp, fail-closed toward "not confirmed alive")
      and is carried in a field SEPARATE from the presence count, three-valued (alive / not-seen /
      undetermined), per `lessons/a-presence-count-is-not-a-liveness-probe`: a boolean that ORs a
      cheap presence proxy with a real probe takes the proxy's answer. The view adopts nothing,
      re-stamps nothing, cleans nothing up and acts on nothing it finds.
      **UNCERTAINTY DIRECTION — silent, never accusing.** The reader IS the predicate: a raise or a
      non-list folds the WHOLE view to a clean zero. And when the READING session's own identity
      cannot be resolved, NOTHING can be proved foreign, so the view goes silent rather than reporting
      every holder — the fail-safe direction for a signal about someone else
      (`lessons/a-signal-about-a-reader-fails-safe-the-opposite-way-to-a-gate`).
      **SEAM SET — session-start + the `debt` re-fold, and the land tail is WITHHELD (rule 21's
      detached-not-conditioned discipline, reused).** Every sibling view here is a JOURNAL or carrier
      fold, and pins the LAND TAIL's counts to AGREE with the `debt` verb re-folded over the
      SAME journal after the land. This view is a CHECKOUT fold — and the land tail is precisely the
      seam that DELETES a checkout (the landing worktree, which the post-land re-fold can no longer
), so the two instruments necessarily read different frontiers there. A view that cannot
      honour a seam's contract is WITHHELD from that seam by not injecting the collaborator at all,
      never conditioned into silence inside it (rule 21's rule, verbatim). Its seam set is therefore
      the two seams a controller reads BEFORE acting, which is exactly where the remedy lives.
      **CONTROLLER-AUDIENCE-ONLY, rule 12's gate reused verbatim.** Injected as None in a dispatched
      WORKER (`YITC_EXPECTED_SESSION_REF` set): a worker inherits its controller's session id, so its
      own fleet reads as its own stamp while every other controller's work reads as a hold it can do
      nothing about, and the remedy the line points at — read before you dispatch or claim — is a
      CONTROLLER's.
      **VISIBLE IS NOT EXCLUSIVE — the fence, and it is the whole design.** It rides rules 2/3/5
      verbatim — SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a gate: no verb gains a refusal, no exit
      code moves, no event is emitted. It takes NO lock, NO lease, NO owner-election and refuses NO
      dispatch; a change that made anything REFUSE because another session is present would be a
      lock, which is a DIFFERENT and unauthorized rule. Concurrent sessions are NORMAL (and
      the reason per-write worktree isolation is mandatory) — this makes them VISIBLE. NO new store,
      NO lease/registry/heartbeat/liveness FSM (CHARTER §6 named retirements), NO new state, NO new
      verb, NO new event type, NO new seam. UNFLOORED: one unseen concurrent holder is exactly the
      case that re-litigates a settled decision or duplicates a dispatch. A repo where every live
      worktree carries the reading session's OWN stamp — or is attributed to its OWN dispatched fleet
      — ⇒ suppressed, indistinguishably from an empty frontier, and a holder drops by itself the
      moment its worktree is removed by `land`.

  27. **WHAT ABORTED LANDS COST, SPLIT BY ABORT CLASS — and the DECAYING/STANDING distinction that
      keeps the number actionable** (kupiclub X-1036, ARITHMETIC CORRECTED by X-1039).
      SUBJECT: `land_completed` rows with `status: abort` inside a trailing 7-day window, priced by the
      `duration_ms` they already carry, grouped by `abort_class`.
      **THE GAP.** Every other rule here reports work that is PENDING — debt not adopted, followups not
      triaged, plans not tracked, branches not landed. NOTHING reported what a project already SPENT on
      runs that shipped nothing. The land tail reports a graph cache hit rate; `dispatch-status`
      reports worker liveness; the repeated-abort backstop counts abort ROWS without ever pricing them.
      So a project could not discover its own most expensive waste, and X-1036 surfaced only because an
      owner asked a question that made someone go looking — the same accidental-discovery shape rules
      23 and 24 were each written to end.
      **PAID-vs-EARLY IS READ FROM A MARKER, NEVER INFERRED FROM THE CLASS NAME.** `verify_mode` is
      written onto the abort payload IFF the verify actually ran. Measured on the kernel journal at
      design time (trailing 7 days to, 309 aborts): present on 168/168 rows of the
      three verify-running classes, absent on all 141 others; `duration_ms` present on 2113/2113 abort
      rows repo-wide. Pricing by class NAME is refused on own finding that an `abort_class` is
      not a reliable proxy for cost — `rebaseline-unauthorized` splits by `abort_preflight` into a cheap
      pre-verify refusal and an expensive post-verify one under ONE name, so a class-name price would
      average two populations into a number describing neither.
      **AND THE SAME MINUTES ARE RE-PARTITIONED BY PHASE — QUEUE WAIT versus verify RUN**.
      Every figure above prices an abort by its whole-land wall, which answers "what did this cost"
      and not "what was it DOING" — and the two answers point at DIFFERENT remedies. measured
      this repo's 352 aborts over 2026-08-18..2026-08-25: the reservation WAIT is the majority of the
      cost (3918 of 6178 min) and the actual verify RUN is 1.6% of it (99 min), so a reader who took
      the minutes above for gate cost would build against the wrong 1.6%. The fold therefore also
      folds the land's OWN `journal.LAND_QUEUE_WAIT_TYPES` heartbeats — the PRIMARY instrument the
      SPEC-0132 admission lens uses — folding the `waited_s` series inside that row's own
      `[ts - duration_ms, ts]` span as the WAIT, and the remainder of `duration_ms` as the RUN.
      **THE FOLD IS A RESET-AWARE SEGMENT SUM, NOT A PEAK, AND THAT CORRECTION IS.**
      `waited_s` is cumulative WITHIN ONE PARK and restarts at 0 when a displaced land parks again
      (`_t0` is re-seeded on every entry to `_acquire_land_reservation`), so a peak reported only the
      land's LONGEST park while the land paid the SUM of all of them — low by construction, in the
      one direction that makes a wait-dominated cost read gate-dominated, which is precisely the
      verdict this split decides. `journal.fold_wait_segments` cuts a new park at every DROP and sums
      the per-park peaks; it is NOT a sum across rows, and a span with no reset is ONE segment that
      folds to exactly the peak it folded to before, so no single-park row moves. Measured over the
       window (411 abort rows, 2026-08-30) the same rows fold to 4774 reservation minutes
      against the peak fold's 4334 — 440 minutes of real waiting that the peak could not.
      **THE WAIT IS NOT `admission_wait_ms`, AND THE CORRECTION IS ** (external RED verdict,
      `decisions/admission-wait-lens-dissonance-audit-adhoc.yaml` finding 1). sourced it from
      that field, which the admission lens simultaneously labelled a `secondary_instrument` carrying
      "UNDER-REPORTING... Do not quote these figures as admission waits" — one lens
      forbidding exactly what the other did. The field is not false, it answers about the WRONG QUEUE:
      `admission_waits` is appended only by `_verify_under_admission`, so it measures the SPEC-0132
      verify-admission-SLOT queue and never the land-fairness RESERVATION, which is where
      parks queued peers. Measured 2026-08-29: `task/` and `task/` carry reservation
      peaks of 8042s and 2950s with ZERO admission-slot heartbeats and `admission_wait_ms: 0`. The
      cost of the wrong instrument was the whole reading: over one 7-day window it reported 2.6 queue
      minutes against 1283.1 verify-RUN minutes across 189 of 469 rows, so the split could only ever
      point at the gate; re-sourced, the SAME window reports 7642.9 against 3421.6 across 290 rows and
      the verdict INVERTS to wait-dominated. ATTRIBUTION IS PER-LAND, not per `(session_ref, branch)`
      as the admission lens folds it: one key routinely carries several land rows, so a key-wide peak
      would charge every one of them the longest wait any of them paid. This partition is
      **ORTHOGONAL** to the four groups and is added to NONE of
      them: it re-cuts the same minutes by phase, so the never-summed rule above is untouched and
      there is still no headline. **A ROW THAT CANNOT PROVE THE SPLIT CARRIES NONE**, on exactly the
      terms `duration_ms` already uses — a row with NO attributable heartbeat inside its own span, a
      row whose `duration_ms` is undetermined, or a wait exceeding the wall that contains it. A land
      that never queued and a land whose queueing left no record are different claims, and an absent
      attribution proves only the second. The
      coverage count travels WITH the minutes everywhere they are reported, because a partial split
      presented as covering every abort is the same over-reading the never-zero-fill rule exists to
      prevent — and coercing the absent key to zero is not hypothetical: it already published every
      abort as aborted-before-verify with 0.0 verify hours although 196/352 demonstrably ran the
      suite. Report-only, gating nothing, and deliberately carrying NO threshold and no judgement
      about whether any duration is too long.
      **AND A SECOND QUEUE, REPORTED BESIDE THAT SPLIT AND NEVER MERGED INTO IT**. The
      paragraph above conflates two different waits under one word, and the conflation was
      load-bearing: the figure it cites as "the reservation WAIT" was folded from
      `waiting_for_land_reservation` heartbeats, while the wait this fold's phase split attributes is
      the verify-ADMISSION queue — a different wait, which the erratum (2026-08-14) already
      found to under-report and explicitly forbade citing as the queue series.
      So this rule's own live output read `2.6 min was QUEUE WAIT... 1250.8 min was the verify RUN`
      over 174 aborts: not because queueing was cheap, but because the DOMINANT queue was in no
      summary field on any row. The fold therefore also reads `reservation_wait_ms` ( — the wait
      for the serialized merge->verify->ff window a peer land holds) and reports it as its own
      phase with its own coverage count, plus a derived `queue_wait_minutes` total. **THE TWO ARE KEPT
      APART** — an admission wait asks for verify slot-pool capacity, a reservation wait asks why a PEER
      is holding the window, so a single collapsed number would name neither remedy; the total is safe
      to offer only BECAUSE both components are printed beside it. The reservation wait is also NOT a
      re-slice of the verify wall: it is spent before the merge and before step 4, so it is a THIRD
      phase, not a third of the wall — which is why `_abort_phase_split`'s wait/work identity is left
      exactly as it is and this reading is added alongside it. Same never-zero-fill terms throughout: a
      pre- row has no key and a preflight abort carries `null`, both reported as uncovered rather
      than as zero minutes proven; a real `0` (an in-loop abort that took the reservation without
      waiting) is a measurement and is admitted as one. Report-only, gating nothing, no threshold.
      **THE GROUPS ARE NEVER SUMMED — the honest-reading requirement, and it is load-bearing.**
      gate-caught (paid, the verify FAILED) · inconclusive (paid, concluded nothing) · process-refusal
      (paid a FULL verify, then refused on BOOKKEEPING) · preflight-refused (carries a verify marker
      but the row's OWN `abort_preflight` records that it stopped at the step-4a preflight, before the
      suite and the admission slot, so it never paid the full verify —) · early (refused
      before paying one). ONLY
      process-refusal is called reclaimable. A high `verify-failed` count is NOT waste — it is the gate
      EARNING ITS KEEP, a real defect caught before it landed — and a single headline number summing
      caught defects together with paperwork refusals would present the gate's best work as the
      project's worst cost, pointing a reader at the one thing they must not weaken. No number the fold
      returns and no number the line prints crosses a group boundary, so no caller can sum them by
      accident. **A ROW IS BUCKETED BY ITS OWN RECORDED REFUSAL POINT, NEVER BY ITS `abort_class`
      NAME**. Measured on this repo 2026-08-28: 25 `rebaseline-unauthorized` rows carrying
      `abort_preflight` reported 579.1 min under RECLAIMABLE — "paid a FULL verify and then refused on
      BOOKKEEPING" — on 12.9 min (2.2%) of actual `verify_duration_ms`, 0.0 min admission wait. They
      refused at the step-4a preflight; the sentence was not true of them, and the remedy it
      prescribes (move the refusal earlier) was already done for that arm by. So `paid` is
      read first, the row's own `abort_preflight` second, and the class name LAST. The minutes are
      never dropped: `preflight-refused` reports them in full with its own count and trend, because
      trading an overstatement for a disappearance is the same failure pointed the other way. **THE FOLD IS KEYED BY THE (CLASS, GROUP) PAIR, never by class alone** — corrected at
      audit-post pass 2, and a correctness bound rather than a refinement. A class can be MIXED:
      `rebaseline-unauthorized` splits by `abort_preflight` into a cheap pre-verify refusal and an
      expensive post-verify one under ONE name, which is the very finding that made the
      marker the measurement. Folding such a class into one preferred group put its EARLY minutes
      inside the PAID group's total — for a paid non-gate class, the RECLAIMABLE total — so minutes
      nobody spent on bookkeeping would have been reported as reclaimable, breaking this rule from
      the inside. Keying by the pair makes every group total the sum of its OWN rows by construction.
      **AND THE KEY IS THE (CLASS, ARM, GROUP) TRIPLE, because one class NAME can carry two REFUSALS**
      (kupiclub X-1096 — the corrected measurement they owed us after their earlier X-1037 was
      refuted on a false premise). `rebaseline-unauthorized` unions the AUTHORIZATION refusal, MOVED to
      the step-4a preflight by on 2026-08-09 and therefore already cheap, with the
      WAIVE-COVERAGE refusal, which has moved only in PART: moved its TOKEN-BINDING half to that
      same step-4a preflight (refused off ONE file, taking no admission slot), while its COVERAGE half
      still reads `pinned_bad` and so is reachable only after a full pinned run. (Un-amended, this
      sentence said the waive-coverage arm had NOT been moved — true when wrote it, superseded
      by, and re-levelled here by together with the render that quoted it.) They still
      differ in **MOVABILITY**, which is what makes the union actively misleading rather than merely
      coarse: it prices a refusal we already made cheap together with one that is still only partly so,
      and reports ONE remedy where there are TWO. The (class, GROUP) pair does not separate
      them — BOTH arms sit in the paid group — so the ARM is a third key, not a re-reading of the second.
      **THE ARM IS READ, NEVER CAPTURED** — no new payload key, no new event, no change to `land` (the
      same second-reading-of-an-existing-payload discipline as rules 18/19 and as this rule's own
      paid-vs-early marker). `_abort_arm` reads, IN ORDER: `abort_preflight` ⇒ authorization; the
      authorization refusal's own invariant sentence ⇒ authorization; the waive-coverage refusal's ⇒
      waive-coverage; `failing_assertions`/`rebaseline_bad_token_reasons` ⇒ waive-coverage; otherwise
      `unattributed` — counted and priced like any arm, NEVER guessed into one (the same direction as
      UNDETERMINED below). **THE MESSAGE LEG IS LOAD-BEARING AND MEASURED, not a shortcut.** Over the
      kernel's whole journal, 180 rows of this class: 13 preflight + 57 carrying `failing_assertions` +
      46 carrying no structured marker at all are AUTHORIZATION, and 63 carrying `failing_assertions`
      are WAIVE-COVERAGE. The 57 are decisive — the pre- deep authorization site appended its own
      `FAILING ASSERTION(S)` block and so SET the very key that otherwise identifies the other arm, so a
      purely structured reader would MIS-BUCKET 57 authorization rows, and a placement-based one
      (preflight-vs-not, which kupiclub's own journal happened to support) would mis-bucket 103. The
      message leg is sound for exactly those rows because they are FROZEN: REMOVED that site, so
      no new row can carry the text and no re-wording can reach it — and the order is fail-safe for
      current rows either way, since the structured legs alone attribute everything today's code emits,
      so a future re-wording degrades LEGACY attribution only. **RENAMING the recorded class was
      weighed and rejected:** eleven readers key on the literal string, and every historical row would
      still need this same reader — strictly more risk for an identical outcome.
      **A SECOND CLASS SPLITS BY ARM, AND IT UNIONS SOMETHING DIFFERENT**. `verify-failed` is
      emitted by ONE refusal over a SHARED failing list, and that list is fed by more than the test suite:
      three CORPUS-INTEGRITY guards append to it AFTER the suite — SPEC-0054's decision content-freeze,
      SPEC-0005's off-path spec-edit chokepoint, SPEC-0165's card-shape rationale — and their inputs are
      the branch's COMMITTED DELTA, not the code's behaviour. So a land that refused purely on BOOKKEEPING
      was recorded, counted and TRENDED under the one label this rule reserves for a caught defect, and
      the echo said of it, verbatim, "that is the gate EARNING ITS KEEP, a real defect caught before it
      landed". For those rows that sentence is false. Same remedy as above, one level down: `_abort_arm`
      dispatches PER CLASS to a reader that knows THAT class's two refusals — `test-failure` /
      `corpus-bookkeeping` / `mixed` / `unattributed` — and the render scopes the not-waste sentence to
      the arm it is true of, naming the arms it is not. **THE KEY IS `failing_assertions`, AND THE OBVIOUS
      STRUCTURED READER IS THE ONE THAT FAILS.** Measured over the kernel's whole journal, 185 rows of
      this class: 173 carry a test assertion and a named failing test file; 4 carry an assertion and NO
      failing test file (a pinned-ENGINE driver error, which names no test and IS a real verify failure);
      5 carry ONLY guard messages; 3 carry BOTH. The 4 are decisive — a reader keyed on
      `failing_tests == []` would mis-bucket 4 genuine gate-catches as paperwork, the same shape as the 57
      above. `failing_assertions` (present on 185/185) works because each guard's message lands in it as a
      SEPARATE ELEMENT, so the reader partitions ELEMENTS: only that can tell a SOLE-guard refusal from a
      MIXED one, which a scan of the flattened reason blob can never do. A MIXED row gets its OWN arm —
      splitting one abort's minutes would invent a division the row does not record, and putting it in
      either arm whole would overstate that arm. **A FIFTH ARM, AND IT COMES FROM A CONSUMER** (kupiclub X-1326). A consumer verify LAYER that runs out of wall-clock reaches this same reader as a
      `verify-failed` row: `worktree._run_verify_tests` appends its `verify layer 'X' command TIMED OUT
      after Ns` sentence to the SHARED failing list WITHOUT the `_VERIFY_TIMEOUT_MARKER` the class fork
      keys on, so no timeout is ever seen and the `test-failure` rule above — "no assertion is a guard
      message" — claimed it as the one arm entitled to the caught-defect sentence. Measured on kupiclub
      2026-09-04: SIX rows across FOUR branches, each with exactly one assertion (that sentence),
      `failing_tests` empty, and a `consumer_verify_layers` trail whose `frontend-unit` layer reads
      `outcome: timed-out` at ~300.1s against a 300.0s limit while `static`/`sandbox`/`stack` PASSED.
      A host that times out an otherwise-healthy layer under a land wave is a HOST/LIMITS signal, not a
      statement about the code, and pricing all six as defects the gate caught made the honest signal
      invisible. The arm is `layer-timeout`, read from the STRUCTURED trail already records
      (never from the prose), ordered BEFORE the `test-failure` rule, and EXCLUDED from
      `ABORT_ARMS_CAUGHT_DEFECT` — which needs no edit, because that allowlist is positive by design and
      a new arm is outside it by construction. A timed-out layer beside a real failing test, or beside a
      guard message, is MIXED on the same reasoning as above; a pre- row with no trail is admitted
      by a belt bounded to a SOLE timeout sentence, since with more than one assertion nothing in the row
      can say whether the others are tests that genuinely failed. **THE CLASS EMISSION IS AGAIN NOT
      TOUCHED** — a third application of the same two reasons: eleven readers key on the literal
      `verify-failed` string, and every historical row would need this reader anyway. **AND THE NOT-WASTE SENTENCE IS COMPUTED FROM THE ROWS IT IS
      TRUE OF, never merely caveated afterwards**: stating the whole group's count and minutes and
      qualifying them a clause later has still ASSERTED them to a reader who stops at the first
      sentence. So the gate-caught group renders in THREE buckets — the rows an ALLOWLIST predicate
      (`abort_arm_is_caught_defect`) admits as a caught defect, the rows PROVEN to be bookkeeping, and
      the `unattributed` rows, each with its own count and minutes. The allowlist is what keeps an
      unplaceable row out of BOTH claims: it is no more evidence of bookkeeping than of a defect, and
      sweeping it into the bookkeeping clause would be this rule's own over-claim pointed the other
      way. **THE GROUP IS NOT MOVED**: re-homing the bookkeeping arm
      into `process-refusal` (whose definition it fits) was weighed and rejected here, because it would
      move minutes into the RECLAIMABLE headline — a louder claim than a READ is entitled to make while
      the card that actually MOVES those guards is a separate one.
      The `early` group keeps its OWN minutes rather than being dropped: on the kernel's own
      window its two expensive classes (merge-non-union-conflict 569.9 min, audited-diff-stale 194.1
      min) cost 764 min/week while paying no verify at all, and a paid-only reading would have made
      that invisible.
      **THE TREND READING EXISTS BECAUSE OF THE CORRECTION, and this is the rule's real content.** In
      X-1039 the requester volunteered, AGAINST THEIR OWN INTEREST, that their window straddled a
      regime change: ~6.6 of the 8 h/week they had attributed to the pinned last-green leg was already
      gone, removed by a ONE-LINE project declaration (`verify_policy: pinned_last_green: never`) and
      not by any fix anyone would build. A view ranking by RAW MINUTES would have printed that leg at
      the top and sent someone to build against a cost that no longer existed. So a DECAYING cost MUST
      be distinguishable from a STANDING one: each class carries a trend computed by splitting the SAME
      window into halves and comparing THE CLASS'S OWN DETERMINED MINUTES — paid AND early alike
      (recent ≤ 0.5× older ⇒ decaying; ≥ 2.0× ⇒ growing; otherwise standing; below a 5-minute total,
      or with no older half, `unknown` rather than a guess — a first observation read as GROWING would
      nag every newly-appearing class on its first day). **THE SUBJECT IS THE MINUTES THE CLASS
      REPORTS, not only its paid ones** — corrected at audit-post pass 1 against this rule's own first
      draft, which said "paid minutes". The `early` group carries REPORTED MINUTES (764 min/week on
      the kernel's own window), so restricting the trend to paid rows would print the largest early
      class's cost with NO trend beside it — which is precisely the raw-minutes-only reading X-1039
      disproved, re-created inside the mechanism built to prevent it. Every minute this rule PRICES
      therefore carries a trend, and the two are never separable in the rendered text.
      Verified as REAL SIGNAL on the kernel's own 7 days, not asserted: `verify-failed` reads GROWING
      (1171.5 min recent vs 567.1 older). **AND THE TREND IS PER ARM, NEVER OVER A UNION** :
      this rule's own first draft cited `rebaseline-unauthorized` reading DECAYING (97.3 vs 325.4) as
      the matching evidence, and that citation is WITHDRAWN — it was computed over the union of two
      arms of different movability, so it described neither. A correct count under a union trend leaves
      exactly the misleading half in place, which is why the trend is derived from the SAME (class,
      ARM, GROUP) entry the count is, by construction rather than by a second code path.
      The trend is printed BESIDE the minutes of every named class, at the same prominence, so the
      raw-minutes reading the correction disproved is never the only one on offer.
      **AN EVICTION IS NOT AN ABORT, AND IS NOT IN THIS POPULATION AT ALL** (owner ruling
      2026-09-11 «в долгах не считать»). A `land_completed{status: abort}` row whose `abort_class` is
      `land-reservation-park-limit` (the halt) is EXCLUDED from the abort rows this rule folds
      — from every class, group, count, minute, trend and from the window's `aborts` total — and is
      reported APART under `evicted`. It is NOT a cheap abort to be bucketed with the early ones: the
      land verified nothing, merged nothing and spent no CPU; it waited out the land reservation behind
      a holder that would not release and then STOPPED rather than racing for the ff. Every other class
      here describes a branch that was JUDGED and refused, which is a question about the branch; an
      eviction is a fact about the QUEUE, and nothing about the branch was ever judged. Counting it as
      a failed attempt therefore reads ONE congestion TWICE — once as the reservation wait this rule
      already reports, and once again as a failure that never happened. MEASURED 2026-09-11: `debt`
      read 476 aborted lands over 7 days and the roster part-3 fold read `abort share 53%`, while in
      the 11:39-13:40Z window alone 4 of 14 aborts were evictions ( —
      each after 149 min queued). **THE KEY IS THE CLASS, READ STRUCTURALLY** — `abort_class` is set at
      the `_die` origin and carried by `_emit_land_abort`; folded over this repo's whole
      journal, 29 rows carry it and zero park-limit rows lack it, so no `abort_reason` regex is used
      (the structured-state-only discipline this module already holds). ONE constant and ONE predicate
      are the single classification home; the roster part-3 fold, which is contracted to run on pure
      stdlib against any repo and so cannot import them, carries the literal under a test asserting
      the two agree. **AND THE MINUTES ARE NEVER DROPPED** — the same bound rule 27 sets for
      `preflight-refused`: `evicted` carries the wait those rows PROVE (`reservation_wait_ms`) WITH its
      coverage (`waited_n` of `n`), and the render prints the coverage beside the figure and suppresses
      the figure entirely when nothing proves it. Removing an eviction from the abort count while
      leaving its wall-clock unreported would trade an overstatement for a DISAPPEARANCE, the same
      direction as pricing an undetermined cost at zero. Because an eviction can no longer un-suppress
      the abort headline, the render OPENS on `evicted` alone when a window's only aborts were
      evictions — the exclusion is not permitted to make a visible cost silent. SCOPE: the
      CLASSIFICATION only. The eviction BEHAVIOUR (whether an evicted branch should be re-queued) is a
      separate card, no other abort class moves, and no threshold on the share is introduced.
      **AN UNDETERMINED COST IS NEVER A ZERO** (the fabricated-measurement class). A row whose
      `duration_ms` is absent or not an integer is reported as UNDETERMINED and counts toward the
      reportable set. It is unreachable on today's corpus, which is exactly why it is built and
      fixture-driven rather than assumed away: the one direction this fold must not fail is making an
      unmeasurable cost read as a free one.
      **CLEAN MEANS "NOTHING COST ANYTHING WORTH REPORTING", NOT "NOTHING ABORTED"** (rule 3 applied as
      a COST floor, never a count floor). The count is the number of aborts that paid a verify, OR whose
      determined cost clears 60s, OR whose cost is undetermined. Sub-floor rows are still counted and
      carried per class and summarised in one trailing clause, but cannot un-suppress the line — a
      window of instant `uncommitted-dirt` refusals is CLEAN and prints nothing, which is the card's own
      "cost nothing worth reporting". It rides rules 2/3/5 verbatim — SUPPRESSED-WHEN-CLEAN,
      REPORT-ONLY, never a gate: no verb gains a refusal, no exit code moves, nothing is stored, no
      event is emitted by the render. NO new store, NO new state, NO new verb, NO new event type, NO new
      seam and NOT A CADENCE (SPEC-0142 §4) — a THIRD reading of the `land_completed` payload rules 19
      and 23 already read, wired at the ONE shared residue so it rides all three debt seams. A repo that
      has never aborted a land folds to 0 ⇒ suppressed, so history is never retro-charged.
      **AND BECAUSE THEY ARE, THE HEADLINE NAMES THE POPULATION THE GROUP COUNTS COVER**.
      The two facts above — the count is a COST-floored subset, while the per-class `n` the groups sum
      is the WHOLE window — mean the headline and the buckets printed beside it are counts of DIFFERENT
      populations. Stating them in one sentence without relating them is not a wording preference but a
      defect: measured on the kernel journal 2026-08-30 the line read "371 aborted land(s)" over group
      counts summing 501 and a trailing "130 FURTHER abort(s)", so 371, 501 and 130 composed in no
      stated way (501 + 130 = 631 is not a quantity that exists) and the headline understated the
      window's aborts by 26%. So the render's headline count is the WINDOW TOTAL — equal, by
      construction, to the sum of the bucket counts printed after it — with the reportable sub-count
      and its floor named beside it, and the sub-floor count is reported as a SUBSET of that total,
      never as a further addend. This is the coverage count and the gate-caught split
      applied to the headline: name the population a number is true of. It changes NO number the fold
      computes and does NOT touch suppression, which stays keyed on the cost-floored count above; nor
      is it the cross-group sum the never-summed rule forbids, which fences MINUTES presented as waste
      and not a count of the window's own population. A result that cannot prove a total keeps the
      pre-change headline and makes no reconciling claim.
      **NOT IN SCOPE, named so the evidence is not miscounted:** the CAUSE-CAPTURE half of X-1039 (58 of
      75 verify-failed aborts carrying no captured assertion identifier) SHIPPED as, closed
. Their measurement window closed roughly three hours BEFORE that fix landed,
      so it is a CURRENCY problem, not a disclosure one — it does not strengthen (capabilities
      never ANNOUNCED to a project) and is deliberately not added there.

  ## Parameters


  None consumed FROM this spec (`consumed: false` holds — no governing scalar is read from the spec
  YAML). TWO env-homed config knobs govern print-discipline details (rule 3), both host-read and passed
  into the render helper, neither a spec-consumed parameter:
    - `YITC_DEBT_FOLLOWUP_FLOOR` (default 5) — the open-followups COUNT floor (`_debt_followup_floor`): a backlog of 1..floor-1 actionable followups is suppressed.
    - `YITC_DEBT_SECURITY_FINDING_FLOOR_DAYS` (default 30) — the open sub-critical security-findings
      AGE floor in days (rule 11, `_debt_security_finding_floor_days`): a finding open for
      less than this is not yet surfaced. It is an AGE floor, NOT a count floor — the count is never
      hidden (one warning open for a year is real debt); only youth suppresses. A non-positive value
      disables it, as with the followup floor.
    - `YITC_DEBT_DEAD_LAND_FLOOR_MINUTES` (default 90) — the dead-land AGE floor in minutes (rule 23, `_debt_dead_land_floor_minutes`): a candidate younger than this is not yet surfaced,
      because a HEALTHY in-flight land is indistinguishable from a dead one between land step-1's
      bookkeeping commit and its terminal row. An AGE floor, never a count floor. Non-positive
      disables. The value is rule 12's, reused rather than newly decreed, and justified against
      measurement: the longest healthy land observed over 4365 timed rows ran 38.7 min (p95 8.0).
    - `YITC_DEBT_AHEAD_BRANCH_FLOOR_HOURS` (default 24) — the ahead-work-branch AGE floor in hours
      (rule 24, `_debt_ahead_branch_floor_hours`): a branch whose tip is younger than this is
      not yet surfaced, because EVERY healthy in-flight build has a branch ahead of main. An AGE floor,
      never a count floor. Non-positive disables. Justified against measurement: two live lanes at 15.7h
      and 17.5h against the one abandoned branch at 25.8h, with the originating incident at 28-40h.
    - `YITC_DEBT_BRANCH_BURN_MIN_ATTEMPTS` (default 4, FLOORED at 2) — how many UNLANDED land
      attempts ONE branch must burn inside the window before rule 34's line prints
      (`_debt_branch_burn_min_attempts`). Deliberately NOT rule 26's 2: retrying is the normal shape
      of a converging build, so this floor sits above the ordinary iteration band (measured — the
      three-attempt band dominates the population, and both proven stuck shapes carried five and
      seven). Rule 34 declares NO window knob of its own; its horizon is
      `YITC_DEBT_ABORT_BREADTH_WINDOW_HOURS` above, since the two folds are transposes of one
      reading met at one seam.
    - `YITC_DEBT_DISPATCH_MONITOR_FLOOR_MINUTES` (default 90) — the unmonitored-dispatch AGE floor in
      minutes (rule 12, `_debt_dispatch_monitor_floor_minutes`): an in-flight dispatch younger
      than this is not yet surfaced. Also an AGE floor, never a count floor. The default is chosen to
      EXCEED the longest sanctioned watch cycle (the watcher journals its receipt at EXIT, so an armed
      watch is invisible until it finishes: `WATCH_MAX_RUNTIME_SECS` = 30 min, and the §Watcher recipe
      shows `--watch-timeout 3600` = 60 min) — so a controller who keeps re-arming the blessed watcher
      can never be false-nagged. A non-positive value disables it.

  ## Rationale

  X-0142: a project reached `not_adopted=50` completely unnoticed — the debt grew mid-session, so a
  session-start-ONLY count showed stale and never updated; the owner caught it only by asking. X-0141:
  the sibling open-followups disposition-surfacing gap (subsumed). Prior-art: the SPEC-0086 `cross-coord:`
  echo (report-only, count-derived, suppressed-when-clean, no store). Full deliberation (delta-vs-total,
  dropping batch-done, new-spec-vs-amend): the plan
  [[proactive-debt-surfacing-at-the-3-debt-change-poin]] + its gate-specs + external consult (2026-07-01).

  ## Verification

  - **Deterministic:** with synthetic non-zero debt (a repo with not_adopted>0 / an open followup / an
    overdue recheck) each of session-start + land-tail prints its line; with a clean repo NEITHER prints
    (suppressed-when-clean). Unit tests per call site + one render-helper test (the SPEC-0086 echo tests
    are the template).
  - **Real-data soak (≥3 owner-observed sessions with carried debt):** the counts track the debt as it
    changes (each land re-derives the fresh total); a per-run postcheck row records
    {session-ref, seam that printed, count snapshot} — replayable via the journal, not owner memory.
  - **Open sub-critical security findings (rule 11):** DIFFERENTIAL over a fixture findings
    series — an aged OPEN warning surfaces ONE report-only line at `bin/yitc-v2 debt` (and therefore
    at all 3 seams, which share the one host residue); the SAME finding resolved in the latest report,
    or younger than the floor, or carrying a CRITICAL severity (the deploy gate's business), or
    carrying an ABSENT/unknown severity (never nag on an unknown), prints NOTHING. An open-run BROKEN
