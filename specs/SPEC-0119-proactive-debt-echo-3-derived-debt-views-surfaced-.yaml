  \ stops being kernel-rendered and\n    the whole section counts as before. A HUMAN\
  \ stance born from `init` remains unratified debt (the\n     ruling) — this excludes\
  \ a derived CARRIER, never a stance.\n    **Why (iv) is a condition and not an exception\
  \ to be argued each time:** this view asks \"did a human\n    review this declaration?\"\
  , and ratification is the honest exit it names. For a kernel-owned baseline\n  \
  \  there is no decision to review — the entry is not the project's to decline —\
