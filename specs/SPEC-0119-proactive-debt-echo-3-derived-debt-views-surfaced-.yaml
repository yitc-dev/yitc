  19. **A CHANGE in the recorded slowest test files.** An OPTIONAL injected report-only view
      (`debt.slowest_decile_changes`, collaborator of `_render_debt_echo`) over the per-file test
      duration SERIES records on every successful land
      (`land_completed.data.verify_metrics.per_file_durations`). It reports what MOVED in the recorded
      slow tail between the latest land and the median of the previous window: a file that newly
      ENTERED the recorded slowest set, or a member that GREW materially.
      **THE DELTA, NEVER THE LEVEL — this is the whole rule, not an implementation detail.** A slowest
      set EXISTS BY DEFINITION, so a view that printed the set itself would print on EVERY land, and a
      surface that always prints trains its reader to skip it — the same silent failure, reached by
      another route, as having no surface at all. Reporting only the change is what makes
      SUPPRESSED-WHEN-CLEAN a real property here rather than a decoration: clean means no new entrant
      and no material growth, and clean prints NOTHING. The current tail stays available ON DEMAND from
      the latest land's own record, exactly as the debt views themselves are available on demand.
      **NO ABSOLUTE BAR, and the rejected one is named.** The original design anchored to the 300s
      per-file verify timeout (SPEC-0071). That is an ABORT bound, not a health target: it makes a file
      interesting only once it is near failing a land (135.7s reads as a comfortable 45% while being a
      bad cost for one test), and it goes silent entirely once everything sits under it — precisely
      when durations creep back up unwatched. A relative reading decrees nothing and self-calibrates.
      The 300s bound stays what it already is: the hard abort.
      **ENTRANT IS DEFINED BY MEMBERSHIP, never by "unseen anywhere before".** A file counts as an
      entrant when it is absent from the BASELINE SLOWEST-SET MEMBERSHIP — the union of the prior
      window's recorded names. An EXISTING, long-known test file CLIMBING INTO the slow tail is the
      primary way a creep first shows itself; an "absent from all duration data" reading would miss
      exactly that case, and it is the reading the audit-pre of the authoring task rejected.
      **THE BASELINE IS A MEDIAN OF A WINDOW, not the previous land.** Comparing against a single prior
      run fires on ordinary run-to-run jitter, and a view that fires on noise is skipped within a week —
      taking its next real signal with it. The median over the window is the noise-robust reading and,
      on a genuinely unchanged series, is exactly the unchanged value, so the clean case stays silent.
      GROWTH must clear TWO bars together: a RELATIVE one (scale-free, so a slow file and a fast one are
      judged alike) and an ABSOLUTE ms one (so a small file's wobble stays mute).
      **ONLY `passed` OBSERVATIONS COMPARE.** A file that failed, timed out, was killed by fail-fast or
      never launched exits early or is capped, so its wall is not comparable across lands; scoring it
      would manufacture growth and shrinkage out of test OUTCOMES. Such an entry scores on neither side.
      This hides nothing — record still carries every outcome; this view's subject is duration
      comparability, not test health.
      **THE EVIDENCE FLOOR (rule 3 applied).** Below a minimum number of prior records the view says
      NOTHING: with one or two lands there is no previous state to have changed from, and every file
      would read as an entrant. A freshly-started series therefore stays silent BY DESIGN — the state
      of the real journal immediately after.
      **THE FAIL DIRECTION IS TOWARD SILENCE — and it INVERTS rule 18's, deliberately.** Rule 18 fails
      toward VISIBLE because a lost halt loses a decision someone is owed. Here the subject is an
      advisory trend, and a FABRICATED change is worse than a missed one: a creep watch that cries wolf
      is unread within a week. So every uncertainty — too little history, an unparseable record, a
      non-comparable outcome — resolves to saying nothing.
      **NOT A CADENCE (SPEC-0142 §4).** This stands up no recurring obligation and owns no trigger of
      its own: it is computed inline at seams a controller already passes, and computes nothing when
      nobody passes one. NO fourth cadence layer, no cadence store, no registry. The rejected
      alternative was a nightly check, and the reason is the rule's own subject: a nightly report is
      read only if someone opens it, so its failure is indistinguishable from a quiet week.
      **WHAT IT REPLACES (P1 F3, named).** The REACTIVE watch on test duration — a followup armed to
      return only once a test ACTUALLY crosses the timeout, i.e. after a land has already aborted on
      it. That trigger becomes redundant the moment this line ships, and is dropped with this rule.
      It rides rules 2/3/5 verbatim — the SAME 3 seams (session-start / land-tail / `debt` re-fold) from
      the ONE host residue, SUPPRESSED-WHEN-CLEAN, REPORT-ONLY, never a gate: no verb gains a refusal on
      account of this row and no exit code moves. NO new store / event type / verb / env knob / seam —
      one more OPTIONAL injected collaborator reading a payload that already exists (P1 F1/F2). A repo
      whose journal carries no such series ⇒ count 0 ⇒ suppressed, so history is never retro-charged.
  21. **The NON-TERMINAL PLAN CENSUS.** An OPTIONAL injected report-only view
