      `PLAN_UMBRELLA_RENEWAL_DAYS`) and are stated here so the rule and the code cannot drift.
      **THE BOUNDARY IS UNCHANGED, AND NAMING IS NOT PICKING.** The tail reports CANDIDATES for the
      OWNER; it ranks nothing, selects nothing and recommends no order, exactly as rule 36 names
      STUCK cards without choosing between their two exits. Taking a plan into work stays an OWNER
      CUE, and this clause creates no exception to that.
      **THE AGE INSTRUMENT IS THE EXISTING JOURNAL, OVER ONE BOUNDED WINDOW.** Plan frontmatter
