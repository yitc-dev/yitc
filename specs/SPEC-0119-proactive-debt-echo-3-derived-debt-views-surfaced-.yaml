  \ no\n    main-versus-branch attribution. Its own line names the successor: \"make\
  \ the gate\n    branch-attributable, which is the actual fix\". This rule is that\
  \ reading. It is ATTRIBUTED (the\n    probe proved the failure is main's, not the\
  \ branch's), CORROBORATED (the pair failed in two\n    independent executions on\
  \ two different trees, so one flaky failure establishes nothing), and it\n    clears\
  \ ONLY on evidence that the test RAN and PASSED on a fresh main — never on elapsed\
  \ time.\n    Rule 26 stays: it answers a different question, and it answers it for\
  \ causes this one cannot\n    attribute.\n    **NO STORE.** Derived on demand from\
  \ the journal alone — no side ledger, no stored status field, no\n    followup carrier,\
  \ no window and no clock. The establishing and clearing rules, the fail-closed\n\
  \    edges and the third VACATED disposition (a green land whose tree did not contain\
