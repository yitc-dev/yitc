      by making the gate branch-attributable; this rule only makes an ongoing one VISIBLE
      sooner. Unit tests: the fold's differential arms (one cause across N branches FIRES; N different
      causes are INDISTINGUISHABLE from an empty journal; one branch repeating is silent; identity-less
      and branchless rows never streak) + the frozen 2026-08-21 incident replay pinning the under-count
