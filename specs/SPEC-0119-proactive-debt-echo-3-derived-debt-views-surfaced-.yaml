      ``, ``, ``, ``) — a branch that reached main AS A BATCH MEMBER can
      have its success recorded ONLY in the member verdict, so reading the abort row alone would fix
      this for the abort shape while re-creating it for the requeue shape. Both types are already in
      the rule's event set: no new source, no new event, no new store, no new knob, no new window.
      The resolution predicate computes and consults NO cause identity — a land resolves the BRANCH,
      whatever refused it — and is FAIL-CLOSED on a blank branch, which here leans toward CONTINUING to
      report rather than clearing on a row that could not be read.
      **MEASURED — the incident this amends for (fingerprint `debt-rule26-stale-cause-after-fix-landed`,
      owner-surfaced).** 2026-09-04 ~04:00Z this line named `verify-failed#af84843f8263` on
