      enforced). So when the fingerprints differ but the tree delta between them consists of NOTHING
      but that consult's own record (plus the derived bookkeeping every governed commit sweeps by
      construction — the journal and the rebuilt graph index), the basis still GOVERNS.
    - **The guarantee is SCOPED, never removed.** The relief opens only on POSITIVE evidence on every
      axis (both fingerprints resolve to real commits, the delta is non-empty, it CONTAINS the
      consult record, and every other path is derived bookkeeping); anything unanswerable refuses. A
      delta touching ANY other path — above all the absorb-then-consult cycle's absorbed source,
      where the subject genuinely postdates the consult and the re-consult is the sanctioned
      exit — is STILL stale. Sibling carve-out in the same slot: the `adopted_fingerprint`
      path, the other self-inflicted invalidation.
