body: |
  ## Scenario

  When an audit RED/YELLOWs, the AI absorbs findings and re-audits. Without a bound this loops
  forever — the auditor re-surveys from scratch, a passable cosmetic finding re-burns a pass, a
  benign freshness re-pin looks like a fresh defect — so sound work never converges. The
  audit-loop ceiling is the bound: a fixed max number of absorption passes per target per stage,
  a family of ledger-SKIP exemptions for re-audits that are NOT real absorption loops, an external
  CONSULT that adjudicates convergence before the owner is ever asked, and an owner-authorized
  single-pass continuation. This spec is the ONE home for that machinery (re-homed from the audit
  contract SPEC-0036 by — a stable-surface split, SPEC-0005 §7 / rule-6 anti-oversize);
  SPEC-0036 keeps the invocation/verdict/lens/overlay contract and points here.

  ## Internal

  THE AUDIT-LOOP CEILING. Re-homed VERBATIM from the parent contract SPEC-0036 (its former audit-loop-ceiling section; stable-surface
  split, SPEC-0005 §7). It governs TASK audit-pre/post AND the ceiling-bearing PLAN gates; the parent
  contract (invocation, verdicts, lens, per-stage overlays, saved-result schema) stays in SPEC-0036
  (`bin/yitc-v2 graph query SPEC-0036`).

  ### Audit-loop ceiling (CHARTER §Principle 1 applied to audits)
  Post-ceiling adjudication is governed by SPEC-0200.

  Maximum 2 absorption passes per target per audit stage. Pass 3 does NOT go straight to the owner —
  it enters the CEILING-CONVERGENCE TRIAGE below; the owner is reached only on non-convergence or a
  failed granted pass (never a silent loop). The ceiling counts RE-AUDIT passes — so HOW a finding is absorbed
  decides whether it costs a pass (E-0008): a PASSABLE finding (YELLOW / cosmetic / evidence-only —
  does NOT change the plan/diff) is absorbed via **mode-b** — recorded in this verdict's
  `notes:`/`absorbed:` fields, NO re-plan, NO re-audit, burns NO pass. Only a finding that genuinely
  changes the plan/diff uses **mode-a** — re-plan/re-implement → re-audit, which costs a pass.
  Pushing a passable finding through mode-a is the E-0008 false-ceiling defect. (Fuller mode-a/b
  treatment: LIFECYCLE §Stage 4.)

  **Mode-b is VERB-ONLY, on both targets (X-0928).** A mode-b absorption is recorded ONLY
  through the governed route — `audit pre --task T-XXXX --absorb "<text>"` for a task verdict
, and `audit pre --plan <slug> --gate <id> --absorb "<text>"` for a ceiling-bearing PLAN
  GATE's verdict (gate id per §Plan-target parity below — the SAME five tokens `audit consult --plan
  --gate` takes). Both write `absorbed:`/`notes:` on the EXISTING verdict, run NO auditor, leave
  `verdict:`/`passes:`/the recorded freshness signature untouched (so mode-b burns NO pass — an absorb
  that generated a re-audit pass would be a ceiling loophole), refuse a non-YELLOW record NAMING the
  verdict, and emit `audit_finding_absorbed` carrying the target identity. HAND-EDITING either verdict
  YAML to record an absorption is FORBIDDEN (AGENTS §Verb-execution discipline): the hand edit skips
  the deterministic emit, so the absorption is invisible to every later session — measured on the plan
  side by X-0928, where 5 absorbed gate-specs findings left no journal record at all.

  **Trend-aware grant — a bounded +1 on a clearly-converging trend.** When the recorded
  per-pass finding-count trend is STRICTLY DECREASING across the passes AND the residual severity is
  LOW (the work is clearly about to converge — e.g. 3->1, 2->1), the session earns ONE bounded extra
  pass AUTONOMOUSLY (no owner ask). The grant is the SAME single +1 mechanic as --owner-reset (it
  raises the EFFECTIVE ceiling by exactly +1, never +2 when both fire), so it is BOUNDED: a FLAT (e.g.
  2->2) or GROWING trend, or a second still-decreasing step at the now-raised cap, is blocked/escalated
  EXACTLY as before. Residual-severity gate: ZERO residual findings is the MOST-converged state and IS
  eligible (the test is residual-severity-is-LOW, NOT non-empty-residual); a PRESENT residual finding
  must be `low` — a medium/high/unknown residual blocks (FAIL-CLOSED). Journal-visible at the GRANT
  MOMENT via an `audit_ceiling_trend_grant` event (emitted BEFORE the auditor runs) and durably in the
  completed audit YAML + completion events (`trend_ceiling_grant: true`). Decided BEFORE the auditor
  runs (pure f(prior record)) — the autonomous sibling of --owner-reset. Scope: TASK pre/post AND the
  PLAN FINALIZATION gate (target_kind==plan, stage==post — the cmd_audit-reachable plan ceiling). The
  predicate (is_trend_convergence_grant / finding_count_trend) is target-AGNOSTIC — it reads
  passes_trail + findings, which the plan finalization post ALSO records — and the plan
  corpus/lens/task-carrier freshness axes still pre-empt it (a stale re-pin is never read as a
  converging trend). The EARLY plan gates (draft-specs/specs-trial/trial-accepted/
  decomposition-executing) run in _run_plan_gate_audit (a separate ceiling path, NOT cmd_audit) —
  their L2/L3 parity is the tracked deferral.

  **DECISION — trend-vs-flat-count ceiling refinement: DEFER.** A fully trend-keyed ceiling
  (keep granting passes as long as findings strictly decrease) is REJECTED; the flat 2-pass cap + the
  bounded +1 trend-grant stay as-is. Full rationale (the unbounded-passes anti-spin objection, the
  «wide change = decomposition signal, not ceiling signal» reframing, and the already-existing
  owner/consult-governed escapes) + the future-revisit ADOPT-condition:.

  **WHAT HAPPENS AT THE CEILING — homed in SPEC-0204, not here.** This spec keeps the ceiling
  ITSELF: the pass arithmetic, the ledger-skip axes, the trend grant. What happens once the ceiling is
  REACHED for a TASK audit-pre / audit-post is the SOLE subject of **SPEC-0204** — the Controller
  records ONE typed `ceiling_decision` per residual of the ceiling row (`audit decide`, rule 2) and
  exactly ONE further pass runs on those decisions (`audit pre|post --on-decisions`, rule 3), with a
  RED there TERMINAL for that (task, stage). Read it: `bin/yitc-v2 graph query SPEC-0204`.

  RETIRED by SPEC-0204 rule 6 and NOT described here any more: the consult EPISODES that adjudicated
  the ceiling (frozen finding ids, retest rounds, the PROCEED/HOLD option pair, `--reopen`), the
  `--owner-reset` continuation on `audit pre|post` and its consult-governed basis, the
  dispatched-worker AUTO-CONSULT, the `WITHDRAWN`/`CUT` card markers, and the spent-budget commit
  bypass. A DISPATCHED worker at the ceiling does not consult and does not self-grant: it HALTS with
  the existing SPEC-0103 §3 `bg_dispatch_halted`, naming its residual FINGERPRINTS; the Controller
  decides; the re-dispatched worker resumes with `--on-decisions`. Every retired flag REFUSES with a
  pointer to that route.

  NOT retired, and unchanged: `audit consult --on-demand` (the BELOW-ceiling technical-fork pick,
  §On-demand technical-fork consult), the PLAN-gate consult and `plan stage --owner-reset` (§Plan-target
  parity — a plan gate keeps its own consult-governed reset), and the trend grant above.

  **The ENGINE drives the continuation, not the worker.** The at-ceiling block fires only when
  `audit post` is invoked with prior_passes >= AUDIT_PASS_CEILING — i.e. a 3rd invocation. But a REAL
  dispatched worker, after its 2nd audit-post RED (which RECORDS passes == cap), follows its SPEC-0103
  preamble and HALTS — it never makes that 3rd call, so the path was STRUCTURALLY BYPASSED. So when
  `cmd_audit` records the ceiling-REACHING audit-POST RED in a dispatched-worker context (verdict RED,
  stage post, `prior_passes + 1 == AUDIT_PASS_CEILING`, `YITC_EXPECTED_SESSION_REF` set, and no
  ledger-skip / trend-grant / carry-forward exemption), it fully persists that pass-2 RED (YAML + both
  completion events) — so the on-disk trail equals a real 2nd invocation — then raises the
  `WorkerCeilingContinuation` sentinel; the host wrapper catches it and RE-INVOKES `audit.cmd_audit`
  ONCE in-process. The re-invoked call reads prior_passes == cap from disk and enters the at-ceiling
  block. Structurally ONE-SHOT (the `prior_passes + 1 == cap` gate is False on the re-invoked
  prior_passes == cap call). SCOPE: audit-POST only; audit-pre keeps its existing block.

   did not weaken this — it made it MORE load-bearing. What the re-entry used to reach was the
  auto-consult grant; what it reaches now is the ceiling refusal, which is where the halt naming the
  card's residual FINGERPRINTS is emitted (SPEC-0204 rule 6). Without the continuation a worker's 2nd
  RED would yield with no halt row at all, and the controller would read an orphan.

  **SCOPE — the ceiling itself, not what follows it.** The paragraph that stood here
  described the auto-consult's authority bounds, its detector and its journal carriers
  (`audit_worker_auto_consult_granted`, `worker_auto_consult` / `owner_reset` / `owner_reset_basis` /
  `consult_governed` on the completed record). All of it is RETIRED with the auto-consult (SPEC-0204
  rule 6): no route sets those fields, so no new record carries them, and rows already on disk keep
  theirs and stay readable. WHAT SURVIVES UNCHANGED, and belongs to this spec: the ceiling is not an
  authority transfer, and a worker's dispatched context is read from the EXISTING signal
  `YITC_EXPECTED_SESSION_REF` — never a new liveness / autonomy / state machine (CHARTER non-goals).
  The EARLY plan gates keep their own ceiling path in `_run_plan_gate_audit` (§Plan-target parity),
  which this retirement does not touch; their L3 parity remains the tracked deferral.
  SUPERSEDED IN PART by SPEC-0204 rule 9 (the plan-gate arm): what happens AT a plan-gate ceiling is now
  the typed-decision route homed there, and §Plan-target parity's consult-governed-only continuation —
  together with the plan-gate auto-consult deferral above — is retired by SPEC-0204 rule 6. This spec
  keeps the ceiling ITSELF (pass arithmetic, ledger-skips) for plan targets as for task targets.

  **Reject-as-wrong rationale.** Absorption (mode-a/mode-b) is for findings the session
  ACCEPTS. A THIRD disposition is REJECTING a YELLOW finding as WRONG — the auditor was mistaken,
  so the session declines to absorb it AND files no follow-up. A reject is neither mode-a nor mode-b
  and burns no pass, but left silent it makes the decline UN-AUDITABLE (no trace of why a flagged
  point was overruled). So when a session rejects a YELLOW finding as wrong it MUST record a
  one-line rejection rationale in the verdict 'notes:' (e.g. "rejected finding N: <why the
  auditor is wrong>"), making the override auditable. Guidance text only — no new mechanism (CHARTER
  §P1 F4); surfaced to the worker via the audit prompt's absorption clause.

  ### Ledger-skip axes — re-audits that are NOT absorption loops

  The ceiling counts ABSORPTION passes. A re-audit that merely re-verifies an UNCHANGED or benignly-
  drifted subject is not one, so it earns a LEDGER-SKIP. Each axis below is decided from the saved
  record (plus, where the row names it, git history) — mostly BEFORE the auditor runs. The PREDICATE
  and the FAIL-CLOSED clause in each row ARE the rule; the `marker` column is the additive-optional
  field the run records (§Saved-result ledger-skip markers).

  | Axis | Trigger predicate | Pre-block exempt? | Advances `passes`? | Marker | Scope |
  |---|---|---|---|---|---|
  | **Plan-freshness** | prior recorded verdict GREEN AND recorded `corpus_signature` DIFFERS from the current one (genuinely stale) | YES — allowed to RUN even at/past the pass cap | NO, when it comes back a clean GREEN with no findings | `freshness_reaudit: true` | `audit post --plan` only |
  | **Plan lens-version** | the saved plan verdict's recorded `lens_version` (= `PLAN_FINALIZATION_LENS_VERSION`) DIFFERS from current. Fires REGARDLESS of the prior verdict, because a STALE LENS can produce a STALE RED | YES | NO, when it returns a clean GREEN | `freshness_reaudit: true` (the same ledger-skip as the corpus axis) | `audit post --plan` only |
  | **Unchanged-fingerprint** | a TASK audit-pre re-run whose freshly-computed `plan_fingerprint` EQUALS the prior audit-pre record (the plan is UNCHANGED) | YES | NO — and the prior verdict + findings are CARRIED FORWARD VERBATIM with NO auditor re-invocation | `unchanged_fp_reaudit: true` | TASK `audit pre` only |
  | **Concurrent-merge-churn** (E-0041) | a post-close `--reaudit-after-close` re-audit whose tree drifted ONLY by already-landed-and-audited SIBLING commits: the prior audit-post verdict GREEN/YELLOW with a recorded commit that is a proper ANCESTOR of HEAD, AND HEAD is exactly the clean RE-MERGE of the audited commit with current `main`, with no new observable worker contribution (`_concurrent_merge_churn_only`: re-derive `git merge-tree --write-tree <prior_commit> main` and check the paths where HEAD's tree DIFFERS from that re-merge are ALL inert bookkeeping) | YES — allowed to RUN even at/past the cap, else a passes:3 re-audit `_die`s before confirming the merged tree is still GREEN | NO — on ANY verdict. The CHARGE keys on the TRIGGER, never on the VERDICT: the pass exists because MAIN moved, not because the AUTHOR moved, so it is not this card's absorption loop to pay for. The auditor STILL RE-RUNS over HEAD — SAFETY rests on a REAL fresh verdict confirming the MERGED tree — and a non-GREEN one STILL STOPS the land and STILL BLOCKS closure: what is withheld is the ceiling CHARGE, never the refusal | `concurrent_merge_reaudit: true` | TASK `audit post --reaudit-after-close` only |
  | **TASK lens-version** (X-0117) | a TASK pre/post verdict whose recorded `lens_version` DIFFERS from current `TASK_AUDIT_LENS_VERSION` (the TASK-audit LENS = the audit overlays PLUS the diff-invisible evidence surfacer `_ac_probe_evidence_events_for` the prompt is built from). INDEPENDENT of the prior verdict, because a STALE LENS can produce a STALE RED | YES | NO, when it comes back a clean GREEN. The auditor STILL RE-RUNS under the corrected lens (SAFETY rests on a real fresh verdict), so this takes PRECEDENCE over the unchanged-fingerprint carry-forward — a stale lens forces a real re-audit, never a verbatim carry of the stale verdict | `task_lens_reaudit: true` | TASK `audit pre` / `audit post` |
  | **Passable-absorption** (E-0008 regression) | a TASK `audit post` RE-AUDIT (prior_passes >= 1) whose current verdict is YELLOW, carries NO high-severity finding, whose PRIOR audit-post verdict was ALSO YELLOW, AND whose audited COMMIT is UNCHANGED from the prior audit (current commit == prior recorded commit). The COMMIT-EQUALITY is the decisive diff-change signal: a true mode-b re-run re-audits the SAME commit, whereas a GENUINE mode-a rework — even one that stays YELLOW — re-commits via `task commit --absorb` → a DIFFERENT commit → NOT passable | NO — deliberately (anti-cx F3): the pre-block contract is UNCHANGED, so a prior-YELLOW audit-post AT the cap still `_die`s on a re-run | NO. `ledger_skip` preserves the verdict-note record (findings / notes / absorbed are written regardless — that IS the mode-b record); only the pass counter is withheld, and the verb WARNs that mode-b (record-and-proceed) was the right route | `passable_absorption_reaudit: true` | TASK `audit post` only |
  | **Consult-governed carry** | the granted continuation is CONSULT-GOVERNED — `_consult_basis` verified a FRESH single-survivor GREEN/YELLOW consult bound to the CURRENT subject fingerprint, so the pass carries that consult's verdict VERBATIM and the auditor is NOT re-invoked (`consult_adjudication` is non-None; the carry) | n/a — the continuation was already granted (this axis decides the CHARGE, never the admission) | NO — UNCONDITIONALLY on the carried verdict (GREEN/YELLOW alike), because no auditor produced it: nothing was absorbed against one | `consult_governed: true` (the existing marker, now also the ledger-skip marker) | TASK `audit pre` / `audit post` + the plan finalization gate |
  | **Plan task-carrier** | the plan's recorded `tasks:` carrier (`_plan_task_carrier`, the plan's cites-set recorded in the verdict's `tasks:`) DIFFERS from current — a cited task filed/removed OR a status change (e.g. in-progress→done). INDEPENDENT of the prior verdict (like the lens axis), because a stale carrier marks the verdict STALE (`_require_plan_finalization_ready` clause (d)) | YES | NO, when it returns a clean GREEN | `freshness_reaudit: true` (the same ledger-skip as the corpus/lens axes) | `audit post --plan` only |

  | **Ship-custody re-pin** | `audit post --repin-ship` on a TASK: the card's ship LANDED but a BOOKKEEPING self-commit (pause/park/wont-do) displaced custody, and `_require_ship_custody_repin` has ALREADY proven — fail-closed, before any auditor call — that custody is genuinely bookkeeping-shifted, that the named sha IS the displaced ship, that every displacing record is diff-limited to bookkeeping, and that the ship landed on `main`. AND the saved audit-post record does NOT already pin that ship | YES — allowed to RUN even at/past the cap. Grounds are : this re-audits the ALREADY-GREEN LANDED SHIP DIFF, never the card's own absorption loop, and the ceiling bounds absorption loops. Without it a converged card at the ceiling cannot close AT ITS OWN LANDED SHIP — `task close` demands a verdict for the recorded commit and the pass producing it is refused (measured 2026-09-12) | YES — the pass COUNTS, deliberately. Unlike the currency route (`status: done`-only) this runs on a LIVE card, so it pays; the charge is the second bound | none new — the existing `custody_repin_from` provenance already identifies the route | TASK `audit post --repin-ship` only |

  **FAIL-CLOSED clauses (per axis — these bound every row above; when none matches, NORMAL pass
  counting + the ceiling apply):**
  - **Plan-freshness:** a prior-GREEN re-run with an UNCHANGED signature is NOT a freshness re-audit
    (normal pass counting + ceiling — no blanket prior-GREEN exemption); a missing/blank signature on
    either side falls through to normal counting; and a freshness re-audit that surfaces
    YELLOW/RED/findings IS a real outcome — it advances `passes` +1 and the normal RED/YELLOW handling
    + ceiling apply.
  - **Plan lens-version:** a missing prior `lens_version` (pre- record) also counts as changed
    (it predates the versioned lens); an EQUAL version is NOT exempt. It NEVER lowers `passes` or
    forces a verdict — a lens re-audit can still RED on a genuine finding (then it counts a normal pass).
  - **Unchanged-fingerprint:** the carry is UNCONDITIONAL on the carried verdict — GREEN / YELLOW / RED
    alike — because the plan never changed, so the prior verdict for THIS exact fingerprint is
    authoritative: a same-plan re-run can neither manufacture a fresh (spurious) RED nor flip a real
    one. A carried RED still BLOCKS progression, but WITHOUT re-burning a pass or re-scoring — it is
    NOT a bypass (the plan still does not pass). This is the INVERSE freshness predicate of the plan
    axis (the plan axis exempts a CHANGED `corpus_signature`; this exempts an UNCHANGED
    `plan_fingerprint`). A genuine plan-EDIT re-audit (mode-a) changes `plan_fingerprint` -> NOT exempt
    -> a real counted pass; a missing/blank prior `plan_fingerprint` (pre-) or a non-canonical
    prior verdict never matches -> normal counting + a real audit.
  - **Concurrent-merge-churn:** the skip is UNCONDITIONAL on the verdict — a surfaced
    YELLOW/RED/finding does NOT advance `passes`, because the CAUSE of the re-audit was main
    moving, not the author moving, and the ceiling counts the CARD'S OWN absorption passes. The
    RED still STOPS the land and still blocks closure (`task close` is GREEN-gated) — this axis
    removes the CHARGE, never the refusal. INCIDENT (2026-09-05): the in-land re-audit
    over the merged tree RED'd on a real defect the gate rightly caught, but the pass landed on
    the card's own budget — passes reached 3, the ceiling-convergence consult HOLD'd for the owner
    at 07:10:46Z, and the card lost ~3 hours to a consult/owner-reset dance over a diff that had
    not changed since its GREEN. TWO BOUNDS make this ONE-SHOT rather than an open loop, and both
    are properties of the trigger predicate, not added machinery: (i) the predicate requires the
    PRIOR record's verdict to be GREEN/YELLOW, so an exempted RED becomes the next run's prior and
    CLOSES its own exemption; (ii) it requires the prior audited commit to DIFFER from the current
    one, so a re-audit at an UNMOVED HEAD is charged normally. An uncharged pass therefore costs
    main genuinely advancing again — real external progress, never a self-spun loop — and
    `_INLAND_REAUDIT_MAX_PER_LAND` bounds the in-land caller a second time per land. What is
    UNCHANGED: a worker's OWN post-audit SOURCE edit leaves an observable
    differing path -> NOT exempt -> a real counted re-audit, so the genuine-recovery case is
    PRESERVED. A merge-tree CONFLICT is likewise NOT exempt -> EXCEPT when EVERY conflicting path is
    INERT : a sync merge that regenerated a DERIVED artifact both sides rebuilt
    (graph/index.json is the measured case) conflicts on a path whose content the audit never judged
    and `land` rebuilds anyway, so the bare rc!=0 short-circuit read that as new observable content
    and defeated an audited re-baseline forever (measured 2026-09-04 on task/ — ONE conflict,
    in graph/index.json, after a GREEN owner-reset audit-post, with the re-audit route unreachable
    because audit-post custody pins the subject to the ship commit; the livelock class, one
    conflict-in-a-derived-file wider). The conflict paths are classified through the SAME
    `_classify_inert_paths` authority the differing-path check uses (SPEC-0064 §4 — no second inert
    encoding, no new flag): ALL-INERT falls through to that differing-path check, which still decides
    (the conflicted blobs carry markers, so those paths reappear in the diff); ANY OBSERVABLE
    conflict path -> NOT exempt, exactly as before. A NARROWING inside this axis's invariant «only
    pure concurrent-merge churn is exempt», never a conflict waiver — additionally fail-closed on a
    non-conflict rc, on rc==1 with no readable CONFLICT line, and on any conflict KIND other than
    `CONFLICT (content)`.
  - **TASK lens-version:** ONE-SHOT — a missing prior `lens_version` (pre- record) counts as
    changed; an EQUAL version is NOT exempt (no blanket bypass); and the re-audit records the CURRENT
    version, so a follow-up with an unchanged version re-applies the ceiling. A surfaced
    YELLOW/RED/finding is a real outcome that advances `passes` normally.
  - **Passable-absorption:** a prior RED/ABORT (a GENUINE blocker that forced this re-plan — mode-a
    rework), ANY high-severity finding (genuinely changes the plan/diff), OR a CHANGED / missing
    audited commit (a genuine re-committed rework) falls through to NORMAL pass counting; a first
    audit-post (prior_passes==0) always counts. At the cap, mode-b is to RECORD the passable finding in
    the already-recorded YELLOW verdict's notes and PROCEED to `task close` (the existing Stage-8
    YELLOW close route), NOT to re-run `audit post`; `--owner-reset` stays the designed escape if a
    genuine re-audit is ever needed. Because a passable absorption never advances `passes`, a sequence
    of passable absorptions can NEVER push sound work to the ceiling — the E-0008 sub-cause-1 deadlock
    is prevented at its source, not patched at the wall.
  - **Plan task-carrier:** ONE-SHOT — the saved verdict re-pins the CURRENT carrier, so a follow-up
    re-run with no further task change matches → the ceiling re-applies (no unlimited bypass). A missing
    prior `tasks:` (pre- record) reads as [] → a non-empty current set differs → also a change. A
    surfaced YELLOW/RED/finding is a real outcome that advances `passes` normally + the ceiling applies.

  - **Ship-custody re-pin:** ONE-SHOT by construction — the exemption holds only while the saved
    audit-post record does not ALREADY pin the ship, and the repin pass records it, so an immediate
    re-run's predicate is False and the ceiling re-applies. There is no sequence of repins that walks
    past the cap. Everything unprovable REFUSES rather than grants: an unresolvable `--commit`, an
    unreadable prior record, or an unresolvable prior pin leaves the exemption OFF. This axis grants
    NOTHING that `_require_ship_custody_repin` has not already proven — it only stops the ceiling
    pre-block from refusing a pass that gate admitted; a displacement caused by an AUTHORED commit is
    still refused THERE, not here (that card's route is the SPEC-0204 rule-3 empty-set admission).
    And it takes NO ledger skip: the pass advances `passes` like any other, which is what bounds it a
    second time.

  - **Consult-governed carry:** the OWNER GRANT IS UNCHANGED — this axis removes EXACTLY ONE of the two
    costs a consult-carried verdict used to pay, never both. The continuation still requires a fresh
    `--owner-reset` (or, for a dispatched worker, the auto-consult grant, which is the SAME
    single +1 and is itself fail-closed on a clean single TECHNICAL survivor); what is removed is only
    the CEILING-PASS charge. The argument is measurement validity, not relief: the ceiling counts
    ABSORPTION passes against an AUDITOR, and a consult-governed pass invokes NONE — charging it makes
    the counter measure something other than what it bounds. Fail-closed by construction: the axis
    fires ONLY where `consult_adjudication` is non-None, which `_consult_basis` reaches only on a FRESH
    single-survivor GREEN/YELLOW consult matching the current subject fingerprint; a `stale` / `multi` /
    `owner-held` basis never reaches it (an `owner-held` basis deliberately runs a REAL fresh auditor
    and therefore counts a NORMAL pass), and EVERY consult is itself a real auditor invocation,
    so no auditor-free loop is reachable. A genuine re-audit that DOES invoke an auditor — including one
    run under the same owner grant — advances `passes` exactly as before, and an authority-class decision
    still reaches the AUTHORITY it requires — the owner, or a holder of `decide-authority` for
    that project (SPEC-0191 §5a, superseding SPEC-0121) — kept unconditionally against any auditor
    verdict. The claim THIS section makes is unchanged by that: a consult-governed pass never becomes an
    authority decision, whoever the authority is. What is corrected is only the cross-reference naming
    WHO that authority is, which SPEC-0191 reshaped and this sentence would otherwise still mis-state.
    **Disclosed interaction with the §RE-OPEN anti-spin axis (stated, not hidden):** because a
    consult-governed pass no longer advances `passes`, the POST re-open's freshness axis (the consult's
    recorded `passes` >= prior_passes) no longer self-invalidates after such a pass, so a repeat
    invocation can re-carry the SAME consult. That is harmless by construction and is NOT the spin the
    axis guards: a re-carry is an IDEMPOTENT no-op — it re-records the SAME already-validated
    GREEN/YELLOW verdict, invokes no auditor, and cannot manufacture a different outcome (spin only
    matters where repetition can yield a better result). It also still costs an explicit grant every
    time. This is the same shape the unchanged-fingerprint carry-forward already has, and for
    the same reason: re-verifying a subject that did not change must cost nothing. What the anti-spin
    axis actually bounds — reaching a NEW verdict — is untouched: that still requires a genuinely
    re-resolved subject and a fresh FULL consult.
    **The two live instances, in their own terms — and only ONE of them is governed by this axis:**
    kupiclub **X-0965** at audit-**POST** is the GOVERNED case — of four audit-post passes, passes 1-2
    ran a real auditor and returned RED (one a genuine catch), while passes 3-4 invoked NO auditor and
    produced no finding: they existed only to legalise an adjudication the consult had already made, at
    the cost of two owner interruptions. Those are the passes this axis stops charging. Kernel
    **** at audit-**PRE**, the same day, is CORROBORATION, NOT a second governed case, and its
    cost is deliberately NOT removed: its auto-consult RAN and HELD at RED — it declined to adjudicate
    technical merit, so it carried NO verdict, `consult_adjudication` is None, the `owner-held` basis
    routes it to a REAL fresh auditor and that pass is CHARGED as normal. What cost
    was the OWNER GRANT, and the owner grant is exactly the cost this fork KEEPS: a consult that says
    "the owner decides" is asking for the owner. Clearing a grant off a RED hold would be removing the
    second cost too. earns its citation by showing the double charge is not one repo's quirk —
    the same shape reached the kernel's own audit-PRE within a day. Two instances are enough to identify
    a STRUCTURAL double-charge and no more: this axis therefore introduces NO threshold, NO number, and
    NO claim about how often consults occur.

  Every axis extends the ONE ledger-skip mechanism in-place (`cmd_audit` `ledger_skip`) — no parallel
  counter, no new gate.

