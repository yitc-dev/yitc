  \ 6).** Its convergence rules and the\nwithdrawn full-verdict HOLD rule are cut\
  \ from this spec; the route past the ceiling is SPEC-0204 rules 1-3.\n\n**On-demand\
  \ technical-fork consult (lever #6) — a BELOW-ceiling consult ENTRY for a design\n\
  fork.** This is a separate, NARROW consult ENTRY for a session standing at a\nTECHNICAL\
