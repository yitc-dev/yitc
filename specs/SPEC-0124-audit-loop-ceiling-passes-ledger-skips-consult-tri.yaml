id: SPEC-0124
title: Audit-loop ceiling — passes, ledger-skips, consult triage & owner-reset continuation
status: active
created_at: 2026-07-02 09:33:43+00:00
travels: null
consumed: false
implements:
- bin/lib/audit.py#cmd_audit
binding:
- stage-entry:Audit-pre
- stage-entry:Audit-post
body: "## Scenario\n\nWhen an audit RED/YELLOWs, the AI absorbs findings and re-audits.\
  \ Without a bound this loops\nforever — the auditor re-surveys from scratch, a passable\
  \ cosmetic finding re-burns a pass, a\nbenign freshness re-pin looks like a fresh\
  \ defect — so sound work never converges. The\naudit-loop ceiling is the bound:\
  \ a fixed max number of absorption passes per target per stage,\na family of ledger-SKIP\
  \ exemptions for re-audits that are NOT real absorption loops, an external\nCONSULT\
  \ that adjudicates convergence before the owner is ever asked, and an owner-authorized\n\
  single-pass continuation. This spec is the ONE home for that machinery (re-homed\
  \ from the audit\ncontract SPEC-0036 by — a stable-surface split, SPEC-0005 §7 /\
  \ rule-6 anti-oversize);\nSPEC-0036 keeps the invocation/verdict/lens/overlay contract\
  \ and points here.\n\n## Internal\n\nTHE AUDIT-LOOP CEILING. Re-homed VERBATIM from\
  \ the parent contract SPEC-0036 (its former audit-loop-ceiling section; stable-surface\n\
  split, SPEC-0005 §7). It governs TASK audit-pre/post AND the ceiling-bearing PLAN\
  \ gates; the parent\ncontract (invocation, verdicts, lens, per-stage overlays, saved-result\
  \ schema) stays in SPEC-0036\n(`bin/yitc-v2 graph query SPEC-0036`).\n\n### Audit-loop\
  \ ceiling (CHARTER §Principle 1 applied to audits)\nPost-ceiling adjudication is\
  \ governed by <workshop-spec>.\n\nMaximum 2 absorption passes per TASK target per\
  \ audit stage (a PLAN gate has NO pass-count\nceiling — its budget is decision-bounded,\
  \ SPEC-0204 rule 9(f), patterns/methodology-lessons.md\nLesson 11). Pass 3 does\
  \ NOT go straight to the owner —\nit enters the CEILING-CONVERGENCE TRIAGE below;\
  \ the owner is reached only on non-convergence or a\nfailed granted pass (never\
  \ a silent loop). The ceiling counts RE-AUDIT passes — so HOW a finding is absorbed\n\
  decides whether it costs a pass (E-0008): a PASSABLE finding (YELLOW / cosmetic\
  \ / evidence-only —\ndoes NOT change the plan/diff) is absorbed via **mode-b** —\
  \ recorded in this verdict's\n`notes:`/`absorbed:` fields, NO re-plan, NO re-audit,\
  \ burns NO pass. Only a finding that genuinely\nchanges the plan/diff uses **mode-a**\
  \ — re-plan/re-implement → re-audit, which costs a pass.\nPushing a passable finding\
  \ through mode-a is the E-0008 false-ceiling defect. (Fuller mode-a/b\ntreatment:\
  \ LIFECYCLE §Stage 4.)\n\n**Mode-b is VERB-ONLY, on both targets (X-0928).** A mode-b\
  \ absorption is recorded ONLY\nthrough the governed route — `audit pre --task T-XXXX\
  \ --absorb \"<text>\"` for a task verdict\n, and `audit pre --plan <slug> --gate\
  \ <id> --absorb \"<text>\"` for a ceiling-bearing PLAN\nGATE's verdict (gate id\
  \ per §Plan-target parity below — the SAME five tokens `audit consult --plan\n--gate`\
  \ takes). Both write `absorbed:`/`notes:` on the EXISTING verdict, run NO auditor,\
  \ leave\n`verdict:`/`passes:`/the recorded freshness signature untouched (so mode-b\
  \ burns NO pass — an absorb\nthat generated a re-audit pass would be a ceiling loophole),\
  \ refuse a non-YELLOW record NAMING the\nverdict, and emit `audit_finding_absorbed`\
  \ carrying the target identity. HAND-EDITING either verdict\nYAML to record an absorption\
  \ is FORBIDDEN (AGENTS §Verb-execution discipline): the hand edit skips\nthe deterministic\
  \ emit, so the absorption is invisible to every later session — measured on the\
  \ plan\nside by X-0928, where 5 absorbed gate-specs findings left no journal record\
  \ at all.\n\n**Trend-aware grant — a bounded +1 on a clearly-converging trend.**\
  \ When the recorded\nper-pass finding-count trend is STRICTLY DECREASING across\
  \ the passes AND the residual severity is\nLOW (the work is clearly about to converge\
  \ — e.g. 3->1, 2->1), the session earns ONE bounded extra\npass AUTONOMOUSLY (no\
  \ owner ask). The grant is the SAME single +1 mechanic as --owner-reset (it\nraises\
  \ the EFFECTIVE ceiling by exactly +1, never +2 when both fire), so it is BOUNDED:\
  \ a FLAT (e.g.\n2->2) or GROWING trend, or a second still-decreasing step at the\
  \ now-raised cap, is blocked/escalated\nEXACTLY as before. Residual-severity gate:\
  \ ZERO residual findings is the MOST-converged state and IS\neligible (the test\
  \ is residual-severity-is-LOW, NOT non-empty-residual); a PRESENT residual finding\n\
  must be `low` — a medium/high/unknown residual blocks (FAIL-CLOSED). Journal-visible\
  \ at the GRANT\nMOMENT via an `audit_ceiling_trend_grant` event (emitted BEFORE\
  \ the auditor runs) and durably in the\ncompleted audit YAML + completion events\
  \ (`trend_ceiling_grant: true`). Decided BEFORE the auditor\nruns (pure f(prior\
  \ record)) — the autonomous sibling of --owner-reset. Scope: TASK pre/post AND the\n\
  PLAN FINALIZATION gate (target_kind==plan, stage==post — the cmd_audit-reachable\
  \ plan ceiling). The\npredicate (is_trend_convergence_grant / finding_count_trend)\
  \ is target-AGNOSTIC — it reads\npasses_trail + findings, which the plan finalization\
  \ post ALSO records — and the plan\ncorpus/lens/task-carrier freshness axes still\
  \ pre-empt it (a stale re-pin is never read as a\nconverging trend). The EARLY plan\
  \ gates (draft-specs/specs-trial/trial-accepted/\ndecomposition-executing) run in\
  \ _run_plan_gate_audit (a separate ceiling path, NOT cmd_audit) —\ntheir L2/L3 parity\
  \ is the tracked deferral.\n\n**WHAT HAPPENS AT THE CEILING — homed in SPEC-0204,\
  \ not here.** This spec keeps the ceiling\nITSELF: the pass arithmetic, the ledger-skip\
  \ axes, the trend grant. What happens once the ceiling is\nREACHED for a TASK audit-pre\
  \ / audit-post is the SOLE subject of **SPEC-0204** — the Controller\nrecords ONE\
  \ typed `ceiling_decision` per residual of the ceiling row (`audit decide`, rule\
  \ 2) and\nexactly ONE further pass runs on those decisions (`audit pre|post --on-decisions`,\
  \ rule 3), with a\nRED there TERMINAL for that (task, stage). Read it: `bin/yitc-v2\
  \ graph query SPEC-0204`.\n\nRETIRED by SPEC-0204 rule 6 and NOT described here\
  \ any more: the consult EPISODES that adjudicated\nthe ceiling (frozen finding ids,\
  \ retest rounds, the PROCEED/HOLD option pair, `--reopen`), the\n`--owner-reset`\
  \ continuation on `audit pre|post` and its consult-governed basis, the\ndispatched-worker\
  \ AUTO-CONSULT, the `WITHDRAWN`/`CUT` card markers, and the spent-budget commit\n\
  bypass. A DISPATCHED worker at the ceiling does not consult and does not self-grant:\
  \ it HALTS with\nthe existing SPEC-0103 §3 `bg_dispatch_halted`, naming its residual\
  \ FINGERPRINTS; the Controller\ndecides; the re-dispatched worker resumes with `--on-decisions`.\
  \ Every retired flag REFUSES with a\npointer to that route.\n\nNOT retired, and\
  \ unchanged: `audit consult --on-demand` (the BELOW-ceiling technical-fork pick,\n\
  §On-demand technical-fork consult), the PLAN-gate consult and `plan stage --owner-reset`\
  \ (§Plan-target\nparity — a plan gate keeps its own consult-governed reset), and\
  \ the trend grant above.\n\n**The ENGINE drives the continuation, not the worker.**\
  \ The at-ceiling block fires only when\n`audit post` is invoked with prior_passes\
  \ >= AUDIT_PASS_CEILING — i.e. a 3rd invocation. But a REAL\ndispatched worker,\
  \ after its 2nd audit-post RED (which RECORDS passes == cap), follows its SPEC-0103\n\
  preamble and HALTS — it never makes that 3rd call, so the path was STRUCTURALLY\
  \ BYPASSED. So when\n`cmd_audit` records the ceiling-REACHING audit-POST RED in\
  \ a dispatched-worker context (verdict RED,\nstage post, `prior_passes + 1 == AUDIT_PASS_CEILING`,\
  \ `YITC_EXPECTED_SESSION_REF` set, and no\nledger-skip / trend-grant / carry-forward\
  \ exemption), it fully persists that pass-2 RED (YAML + both\ncompletion events)\
  \ — so the on-disk trail equals a real 2nd invocation — then raises the\n`WorkerCeilingContinuation`\
  \ sentinel; the host wrapper catches it and RE-INVOKES `audit.cmd_audit`\nONCE in-process.\
  \ The re-invoked call reads prior_passes == cap from disk and enters the at-ceiling\n\
  block. Structurally ONE-SHOT (the `prior_passes + 1 == cap` gate is False on the\
  \ re-invoked\nprior_passes == cap call). SCOPE: audit-POST only; audit-pre keeps\
  \ its existing block.\n\nWhat the re-entry used to reach was the\nauto-consult grant;\
  \ what it reaches now is the ceiling refusal, which is where the halt naming the\n\
  card's residual FINGERPRINTS is emitted (SPEC-0204 rule 6). Without the continuation\
  \ a worker's 2nd\nRED would yield with no halt row at all, and the controller would\
  \ read an orphan.\n\n**SCOPE — the ceiling itself, not what follows it.** The auto-consult's\
  \ journal\ncarriers — the event `audit_worker_auto_consult_granted`, and `worker_auto_consult`\
  \ /\n`owner_reset` / `owner_reset_basis` / `consult_governed` on the completed record\
  \ — are RETIRED\nwith it (SPEC-0204 rule 6): no route sets them, so no new record\
  \ carries them, and rows already\non disk keep theirs and stay readable. WHAT SURVIVES\
  \ UNCHANGED, and belongs to this spec: the ceiling is not an\nauthority transfer,\
  \ and a worker's dispatched context is read from the EXISTING signal\n`YITC_EXPECTED_SESSION_REF`\
  \ — never a new liveness / autonomy / state machine (CHARTER non-goals).\nThe EARLY\
  \ plan gates keep their own ceiling path in `_run_plan_gate_audit` (§Plan-target\
  \ parity),\nwhich this retirement does not touch; their L3 parity remains the tracked\
  \ deferral.\nSUPERSEDED IN PART by SPEC-0204 rule 9 (the plan-gate arm): what happens\
  \ AT a plan-gate ceiling is now\nthe typed-decision route homed there, and §Plan-target\
  \ parity's consult-governed-only continuation —\ntogether with the plan-gate auto-consult\
  \ deferral above — is retired by SPEC-0204 rule 6. This spec\nkeeps the ceiling\
  \ ITSELF (pass arithmetic, ledger-skips) for plan targets as for task targets.\n\
  TARGET-KIND SPLIT (amended): the 2-pass ceiling is where BOTH kinds reach the decision\
  \ route, but\nwhat follows differs. A TASK keeps 2 + 1 (one `--on-decisions` pass,\
  \ then terminal). A PLAN gate is\ndecision-bounded (`audit.PLAN_GATE_BUDGET`): every\
  \ further round past the ceiling is admitted by a fresh\n`ceiling_decision` on each\
  \ residual of the latest RED row, never by a count and never by silence — SPEC-0204\n\
  rule 9(f).\n\n**Reject-as-wrong rationale.** Absorption (mode-a/mode-b) is for findings\
  \ the session\nACCEPTS. A THIRD disposition is REJECTING a YELLOW finding as WRONG\
  \ — the auditor was mistaken,\nso the session declines to absorb it AND files no\
  \ follow-up. A reject is neither mode-a nor mode-b\nand burns no pass, but left\
  \ silent it makes the decline UN-AUDITABLE (no trace of why a flagged\npoint was\
  \ overruled). So when a session rejects a YELLOW finding as wrong it MUST record\
  \ a\none-line rejection rationale in the verdict 'notes:' (e.g. \"rejected finding\
  \ N: <why the\nauditor is wrong>\"), making the override auditable. Guidance text\
  \ only — no new mechanism (CHARTER\n§P1 F4); surfaced to the worker via the audit\
  \ prompt's absorption clause.\n\n### Ledger-skip axes — re-audits that are NOT absorption\
  \ loops\n\nThe ceiling counts ABSORPTION passes. A re-audit that merely re-verifies\
  \ an UNCHANGED or benignly-\ndrifted subject is not one, so it earns a LEDGER-SKIP.\
  \ Each axis below is decided from the saved\nrecord (plus, where the row names it,\
  \ git history) — mostly BEFORE the auditor runs. The PREDICATE\nand the FAIL-CLOSED\
  \ clause in each row ARE the rule; the `marker` column is the additive-optional\n\
  field the run records (§Saved-result ledger-skip markers).\n\n| Axis | Trigger predicate\
  \ | Pre-block exempt? | Advances `passes`? | Marker | Scope |\n|---|---|---|---|---|---|\n\
  | **Plan-freshness** | prior recorded verdict GREEN AND recorded `corpus_signature`\
  \ DIFFERS from the current one (genuinely stale) | YES — allowed to RUN even at/past\
  \ the pass cap | NO, when it comes back a clean GREEN with no findings | `freshness_reaudit:\
  \ true` | `audit post --plan` only |\n| **Plan lens-version** | the saved plan verdict's\
  \ recorded `lens_version` (= `PLAN_FINALIZATION_LENS_VERSION`) DIFFERS from current.\
  \ Fires REGARDLESS of the prior verdict, because a STALE LENS can produce a STALE\
  \ RED | YES | NO, when it returns a clean GREEN | `freshness_reaudit: true` (the\
  \ same ledger-skip as the corpus axis) | `audit post --plan` only |\n| **Unchanged-fingerprint**\
  \ | a TASK audit-pre re-run whose freshly-computed `plan_fingerprint` EQUALS the\
  \ prior audit-pre record (the plan is UNCHANGED) | YES | NO — and the prior verdict\
  \ + findings are CARRIED FORWARD VERBATIM with NO auditor re-invocation, and the\
  \ prior record is judged THREE ways on its auditor root (owner decision 2026-09-19;\
  \ SPEC-0036 §Verdict producer — ABSENCE OF A STAMP IS NOT PROOF NO AUDITOR RAN):\
  \ **ROOTED** (its `verdict_producer` or the `auditor_model` stamp names one) → carried,\
  \ recorded `verdict_producer: {kind: carry-forward, from: <that record>, auditor:\
  \ <copied stamp>}`; **POSITIVELY DENIED** (the record ITSELF states no auditor ran\
  \ — `external_invoked: false`, or its own `verdict_producer.kind: none`) → NOT carried,\
  \ the re-run records ABORT (`verdict_producer.kind: none`, a no-data ledger-skip)\
  \ and a plan edit (mode-a) is the way to a real verdict; **UNKNOWN** (a legacy record\
  \ predating the stamp, which neither names a producer nor denies one) → carried\
  \ UNCHANGED with `verdict_producer: {kind: carry-forward, auditor_root: unrecorded}`\
  \ — it is unstamped because the stamp did not exist when it was written, so overwriting\
  \ it would wedge every benign pre- re-run | `unchanged_fp_reaudit: true` | TASK\
  \ `audit pre` only |\n| **Concurrent-merge-churn** (E-0041) | a post-close `--reaudit-after-close`\
  \ re-audit whose tree drifted ONLY by already-landed-and-audited SIBLING commits:\
  \ the prior audit-post verdict GREEN/YELLOW with a recorded commit that is a proper\
  \ ANCESTOR of HEAD, AND HEAD is exactly the clean RE-MERGE of the audited commit\
  \ with current `main`, with no new observable worker contribution (`_concurrent_merge_churn_only`:\
  \ re-derive `git merge-tree --write-tree <prior_commit> main` and check the paths\
  \ where HEAD's tree DIFFERS from that re-merge are ALL inert bookkeeping) | YES\
  \ — allowed to RUN even at/past the cap, else a passes:3 re-audit `_die`s before\
  \ confirming the merged tree is still GREEN | NO — on ANY verdict. The CHARGE keys\
  \ on the TRIGGER, never on the VERDICT: the pass exists because MAIN moved, not\
  \ because the AUTHOR moved, so it is not this card's absorption loop to pay for.\
  \ The auditor STILL RE-RUNS over HEAD — SAFETY rests on a REAL fresh verdict confirming\
  \ the MERGED tree — and a non-GREEN one STILL STOPS the land and STILL BLOCKS closure:\
  \ what is withheld is the ceiling CHARGE, never the refusal | `concurrent_merge_reaudit:\
  \ true` | TASK `audit post --reaudit-after-close` only |\n| **TASK lens-version**\
  \ (X-0117) | a TASK pre/post verdict whose recorded `lens_version` DIFFERS from\
  \ current `TASK_AUDIT_LENS_VERSION` (the TASK-audit LENS = the audit overlays PLUS\
  \ the diff-invisible evidence surfacer `_ac_probe_evidence_events_for` the prompt\
  \ is built from). INDEPENDENT of the prior verdict, because a STALE LENS can produce\
  \ a STALE RED | YES | NO, when it comes back a clean GREEN. The auditor STILL RE-RUNS\
  \ under the corrected lens (SAFETY rests on a real fresh verdict), so this takes\
  \ PRECEDENCE over the unchanged-fingerprint carry-forward — a stale lens forces\
  \ a real re-audit, never a verbatim carry of the stale verdict | `task_lens_reaudit:\
  \ true` | TASK `audit pre` / `audit post` |\n| **Passable-absorption** (E-0008 regression)\
  \ | a TASK `audit post` RE-AUDIT (prior_passes >= 1) whose current verdict is YELLOW,\
  \ carries NO high-severity finding, whose PRIOR audit-post verdict was ALSO YELLOW,\
  \ AND whose audited COMMIT is UNCHANGED from the prior audit (current commit ==\
  \ prior recorded commit). The COMMIT-EQUALITY is the decisive diff-change signal:\
  \ a true mode-b re-run re-audits the SAME commit, whereas a GENUINE mode-a rework\
  \ — even one that stays YELLOW — re-commits via `task commit --absorb` → a DIFFERENT\
  \ commit → NOT passable | NO — deliberately (anti-cx F3): the pre-block contract\
  \ is UNCHANGED, so a prior-YELLOW audit-post AT the cap still `_die`s on a re-run\
  \ | NO. `ledger_skip` preserves the verdict-note record (findings / notes / absorbed\
  \ are written regardless — that IS the mode-b record); only the pass counter is\
  \ withheld, and the verb WARNs that mode-b (record-and-proceed) was the right route\
  \ | `passable_absorption_reaudit: true` | TASK `audit post` only |\n| **Consult-governed\
  \ carry** | the granted continuation is CONSULT-GOVERNED — `_consult_basis` verified\
  \ a FRESH single-survivor GREEN/YELLOW consult bound to the CURRENT subject fingerprint,\
  \ so the pass carries that consult's verdict VERBATIM and the auditor is NOT re-invoked\
  \ (`consult_adjudication` is non-None; the carry) | n/a — the continuation was already\
  \ granted (this axis decides the CHARGE, never the admission) | NO — UNCONDITIONALLY\
  \ on the carried verdict (GREEN/YELLOW alike), because no auditor produced it: nothing\
  \ was absorbed against one | `consult_governed: true` (the existing marker, now\
  \ also the ledger-skip marker) | TASK `audit pre` / `audit post` + the plan finalization\
  \ gate |\n| **Plan task-carrier** | the plan's recorded `tasks:` carrier (`_plan_task_carrier`,\
  \ the plan's cites-set recorded in the verdict's `tasks:`) DIFFERS from current\
  \ — a cited task filed/removed OR a status change (e.g. in-progress→done). INDEPENDENT\
  \ of the prior verdict (like the lens axis), because a stale carrier marks the verdict\
  \ STALE (`_require_plan_finalization_ready` clause (d)) | YES | NO, when it returns\
  \ a clean GREEN | `freshness_reaudit: true` (the same ledger-skip as the corpus/lens\
  \ axes) | `audit post --plan` only |\n\n| **Ship-custody re-pin** | `audit post\
  \ --repin-ship` on a TASK: the card's ship LANDED but a BOOKKEEPING self-commit\
  \ (pause/park/wont-do) displaced custody, and `_require_ship_custody_repin` has\
  \ ALREADY proven — fail-closed, before any auditor call — that custody is genuinely\
  \ bookkeeping-shifted, that the named sha IS the displaced ship, that every displacing\
  \ record is diff-limited to bookkeeping, and that the ship landed on `main`. AND\
  \ the saved audit-post record does NOT already pin that ship | YES — allowed to\
  \ RUN even at/past the cap. Grounds are : this re-audits the ALREADY-GREEN LANDED\
  \ SHIP DIFF, never the card's own absorption loop, and the ceiling bounds absorption\
  \ loops. Without it a converged card at the ceiling cannot close AT ITS OWN LANDED\
  \ SHIP — `task close` demands a verdict for the recorded commit and the pass producing\
  \ it is refused (measured 2026-09-12) | YES — the pass COUNTS, deliberately. Unlike\
  \ the currency route (`status: done`-only) this runs on a LIVE card, so it pays;\
  \ the charge is the second bound | none new — the existing `custody_repin_from`\
  \ provenance already identifies the route | TASK `audit post --repin-ship` only\
  \ |\n| **Post-GREEN merge integration** | an ORDINARY TASK `audit post` at/past\
  \ the cap whose only delta since a GREEN is ONE governed merge with main: the latest\
  \ recorded audit-post verdict (journal order; the saved record agreeing) is GREEN\
  \ at the custody commit A; HEAD is a two-parent merge M whose FIRST parent is A\
  \ exactly (no commit before or after it); a `merge_resolved_by_hand` row of the\
  \ card names M with `head_before` = A, `main_sha` = M's second parent and `resolved_source:\
  \ merge-msg` (git's conflict-time `# Conflicts:` record); every path where M differs\
  \ from `git merge-tree --write-tree A <main parent>` is one of those recorded conflict\
  \ paths, which must themselves be conflicts git re-derives; and a `tests_passed`\
  \ row postdates the sync (`audit_ceiling.merge_integration_admission`) | YES — the\
  \ ONE pass SPEC-0077 §3a demands for a hand resolution; a GREEN ceiling row has\
  \ no residual for `audit decide` to bind, so without this axis no governed route\
  \ re-audits it (: the GREEN build was discarded and re-claimed) | YES — the pass\
  \ COUNTS (the re-pin posture); ONE-SHOT is the bound | `basis: merge-integration`\
  \ + `merge_integration_reaudit: {merge_commit, prior_commit, main_sha, conflict_paths,\
  \ sync_evidence}` on the row and the saved record, beside `sync_merge_ship: A` (closure\
  \ custody moves onto M) — route provenance, NOT a ledger-skip marker | TASK `audit\
  \ post` ordinary leg only |\n\n**FAIL-CLOSED clauses (per axis — these bound every\
  \ row above; when none matches, NORMAL pass\ncounting + the ceiling apply):**\n\
  - **Plan-freshness:** a prior-GREEN re-run with an UNCHANGED signature is NOT a\
  \ freshness re-audit\n  (normal pass counting + ceiling — no blanket prior-GREEN\
  \ exemption); a missing/blank signature on\n  either side falls through to normal\
  \ counting; and a freshness re-audit that surfaces\n  YELLOW/RED/findings IS a real\
  \ outcome — it advances `passes` +1 and the normal RED/YELLOW handling\n  + ceiling\
  \ apply.\n- **Plan lens-version:** a missing prior `lens_version` (pre- record)\
  \ also counts as changed\n  (it predates the versioned lens); an EQUAL version is\
  \ NOT exempt. It NEVER lowers `passes` or\n  forces a verdict — a lens re-audit\
  \ can still RED on a genuine finding (then it counts a normal pass).\n- **Unchanged-fingerprint:**\
  \ the carry is UNCONDITIONAL on the carried verdict — GREEN / YELLOW / RED\n  alike\
  \ — because the plan never changed, so the prior verdict for THIS exact fingerprint\
  \ is\n  authoritative: a same-plan re-run can neither manufacture a fresh (spurious)\
  \ RED nor flip a real\n  one. A carried RED still BLOCKS progression, but WITHOUT\
  \ re-burning a pass or re-scoring — it is\n  NOT a bypass (the plan still does not\
  \ pass). This is the INVERSE freshness predicate of the plan\n  axis (the plan axis\
  \ exempts a CHANGED `corpus_signature`; this exempts an UNCHANGED\n  `plan_fingerprint`).\
  \ A genuine plan-EDIT re-audit (mode-a) changes `plan_fingerprint` -> NOT exempt\n\
  \  -> a real counted pass; a missing/blank prior `plan_fingerprint` (pre-) or a\
  \ non-canonical\n  prior verdict never matches -> normal counting + a real audit.\n\
  - **Concurrent-merge-churn:** the skip is UNCONDITIONAL on the verdict — a surfaced\n\
  \  YELLOW/RED/finding does NOT advance `passes`, because the CAUSE of the re-audit\
  \ was main\n  moving, not the author moving, and the ceiling counts the CARD'S OWN\
  \ absorption passes. The\n  RED still STOPS the land and still blocks closure (`task\
  \ close` is GREEN-gated) — this axis\n  removes the CHARGE, never the refusal. TWO\
  \ BOUNDS make this ONE-SHOT rather than an open loop, and both\n  are properties\
  \ of the trigger predicate, not added machinery: (i) the predicate requires the\n\
  \  PRIOR record's verdict to be GREEN/YELLOW, so an exempted RED becomes the next\
  \ run's prior and\n  CLOSES its own exemption; (ii) it requires the prior audited\
  \ commit to DIFFER from the current\n  one, so a re-audit at an UNMOVED HEAD is\
  \ charged normally. An uncharged pass therefore costs\n  main genuinely advancing\
  \ again — real external progress, never a self-spun loop — and\n  `_INLAND_REAUDIT_MAX_PER_LAND`\
  \ bounds the in-land caller a second time per land. What is\n  UNCHANGED: a worker's\
  \ OWN post-audit SOURCE edit leaves an observable\n  differing path -> NOT exempt\
  \ -> a real counted re-audit, so the genuine-recovery case is\n  PRESERVED. A merge-tree\
  \ CONFLICT is likewise NOT exempt -> EXCEPT when EVERY conflicting path is\n  INERT\
  \ : a sync merge that regenerated a DERIVED artifact both sides rebuilt\n  (graph/index.json\
  \ is the measured case) conflicts on a path whose content the audit never judged\n\
  \  and `land` rebuilds anyway, so the bare rc!=0 short-circuit read that as new\
  \ observable content\n  and defeated an audited re-baseline forever. The conflict\
