  took them STRAIGHT to the external auditor as a consult, whose structured single-survivor verdict
  then governed a continuation. That whole route is retired. At the ceiling nothing is consulted,
  re-surveyed or re-tested: the residuals ARE the findings of the last RED, each carrying an engine
  fingerprint, and the CONTROLLER records ONE typed decision per residual before exactly ONE further
  pass runs on them. Read the contract: `bin/yitc-v2 graph query SPEC-0204` (rules 1-3). The verb form
  the triage used REFUSES with that pointer; the below-ceiling on-demand fork and the plan-gate consult
  are NOT retired. (A bare `audit adhoc` consult remains the manual fallback when the CLI is
  unavailable.)
