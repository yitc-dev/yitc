    owner ask). If realizing it needs a re-audit past the ceiling, that is ONE STANDING-AUTHORIZED
    `--owner-reset` pass (below), citing the consult verdict YAML as the basis — the owner is NOT
    asked for that single pass.
  - **Escalate to the owner (Review session) ONLY when (exhaustive):** (a) >1 option survives the
    consult; OR (b) the session DISAGREES with the external single surviving option (including a NEW
    option the external introduced); OR (c) the consult verdict is ABORT; OR (d) the single granted
    reset pass STILL ends not-GREEN / not-YELLOW-clear (session and external converged on the path,
    but it did not help on the first try). Outside these four, never a premature owner ask and never
    a silent loop.

