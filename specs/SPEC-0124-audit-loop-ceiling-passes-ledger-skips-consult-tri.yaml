  \ subject against the revision the decisions RECORD, so the two cannot diverge —\
  \ there is only one recorded value, not two carriers to keep in step. See §Post-close\
  \ reaudit exit above.\n\n**Owner-facing escalation-summary honesty + overlay-before-owner-reset\
  \ (X-).** When\nthe ceiling escalates — a DISPATCHED worker's `bg_dispatch_halted`\
  \ marker OR the INTERACTIVE ceiling\n`_die` / `--owner-reset` ask — the summary\
  \ the owner reads MUST NAME each RESIDUAL finding's REAL\nseverity + governance\
  \ class (e.g. `high, P8-adoption`), taken VERBATIM from the recorded finding's\n\
  `severity` (absent → `unknown`), NEVER softened. Rendered by `residual_findings_summary`\
  \ /\n`finding_class` over the prior audit record's `findings` (the escalation carries\
  \ a\n`residual_findings_summary` field on the `bg_dispatch_halted` marker) — a keyword-sniff\
  \ class, no new\ntaxonomy store (anti-cx F1/F2). SECOND half — **prefer the deferred-adoption\
  \ overlay flag BEFORE\n`--owner-reset`:** for a GENUINE deferred-adoption RED (a\
  \ residual classed `P8-adoption`), the\nescalation POINTS at the purpose-built overlay\
  \ flag (`--event-emit-only` / `--land-emitted-event` /\n`--host-config` / `--serve-deploy`,\
  \ the SPEC-0036 overlay family) as the non-owner path to try FIRST;\n`--owner-reset`\
  \ stays the fallback. Guidance only —\nno new gate; the overlay flags and the `--owner-reset`\
  \ mechanics above are unchanged.\n\n### Saved-result ledger-skip markers (the ceiling's\
  \ YAML side-effects)\n\nEvery marker named in the §Ledger-skip axes `marker` column\
  \ is written on the saved audit-result\nYAML (canonical schema home: SPEC-0036 §Saved\
  \ audit result + AGENTS §Saved audit result schema) as\nan ADDITIVE-OPTIONAL field:\
  \ present ONLY on the run its axis describes, ABSENT on every other run\n(never\
  \ `false`). It signals that `passes` was NOT advanced for that verdict. This trail\
  \ is what the\nceiling reads to enforce itself, and it enables post-hoc \"which\
  \ verdict governed which ship\" + drift\ndetection. ONE further marker rides the\
  \ identical additive-optional shape but is NOT a ledger-skip\naxis: `tooling_absence_abort:\
  \ true`, present ONLY on the transient no-read-tooling ABORT\n(rule home: SPEC-0036\
  \ §Verdict handling ABORT exception). `consult_governed: true` is\npresent ONLY\
  \ on a CONSULT-GOVERNED `--owner-reset` continuation pass (§Consult GOVERNS the\
  \ granted\npass), where `notes` carries the consult artifact path + verdict + recommendation\
  \ as the\nadjudication-trail provenance — and since it is ALSO that axis's ledger-skip\
  \ marker (the\n§Ledger-skip axes Consult-governed-carry row): the pass it marks\
  \ did not advance `passes`, because no\nauditor was invoked. It was previously listed\
  \ here as a non-ledger-skip marker; that is superseded.\n`merge_integration_reaudit`\
  \ rides the same additive-optional shape but is NOT a ledger-skip\nmarker: it records\
  \ the post-GREEN merge-integration ROUTE, and that pass advances `passes`.\nRELATEDLY,\
  \ every TASK audit (pre/post) verdict records `lens_version:\n<TASK_AUDIT_LENS_VERSION>`\
  \ (the lens version it was rendered under; drives the TASK lens-version\naxis) —\
  \ additive-optional, task audits only, the task analog of the plan `lens_version`.\n\
  \n**ONE marker also rides the JOURNAL, not the YAML alone.**\n`concurrent_merge_reaudit:\
  \ true` is ALSO spread into the run's EXISTING `audit_post_completed`\nand `external_audit_completed`\
  \ rows, in the same additive-optional shape as `owner_reset` /\n`trend_ceiling_grant`\
  \ / `custody_repin` — present ONLY on a merge-triggered pass, ABSENT (never\n`false`)\
  \ on every other run. NO new event type: the SPEC-0025 catalog is untouched and\
  \ no new\nemit path is added. WHY the journal and not the YAML alone — after this\
  \ marker is the\ndiscriminator for whether a pass was charged at all, and the saved\
  \ YAML is OVERWRITTEN in place\nby the next pass, so a reader asking «was this pass\
  \ charged, and why not?» across a card's\nhistory has only the journal to ask. The\
  \ other markers in this section stay YAML-only; this one\nis named because it is\
  \ the one the ledger's own history is read from.\n\n## Verification\n\n- `bin/yitc-v2\
  \ graph query SPEC-0124` resolves; `graph build` maps the Audit-pre + Audit-post\n\
  \  stage-entries to this spec once active (the binding axis), so the ceiling is\
  \ delivered at both\n  audit stages exactly as before the split.\n- `wc -l specs/SPEC-0036*.yaml`\
  \ shows the remainder back in the 400-500 band; neither spec is\n  over-ceiling\
  \ (SPEC-0120 §3 must-split resolved).\n- No LIVE surface still cites the moved anchors\
  \ at the old home: the stale-ref probe over live\n  docs/code/tests finds 0 hits\
  \ for either moved anchor (the former ceiling + plan-target-parity refs).\n"
