  ### Post-close reaudit exit — a done-but-UNLANDED task IS admitted (the circle)

  **The canonical exit for a done-but-UNLANDED task that needs a pass past the ceiling is the
  DECISION route, not park+redo (amended, SPEC-0204 rule 6).** A task on the sanctioned
  `--reaudit-after-close` post-close rebaseline flow is `status: done` while its closure lives
  only on the un-integrated branch. It is NOT stranded: SPEC-0204 rule 3's admission carries its own
  `--reaudit-after-close` arm, so once every residual of the ceiling row carries a recorded
  `ceiling_decision` the card takes its ONE bounded `--on-decisions` pass at HEAD. What USED to be the
  exit — a HEAD-pinned consult on that target re-opening a spent `--owner-reset` —
  is retired with both the consult basis and the reset. The dead-end below is what the exit exists to
  prevent, and is why this section stays.

  **What is NOT the exit: park + rebuild the task elsewhere.** On 2026-07-12/13 a converged
   build was park+transplanted into a fresh card because the flagless consult's
  refusal named no exit and read as an absolute wall — the reopen was available the whole time (fp
  `consult-refuses-done-unlanded-task-circular-ceiling-deadend`). The capability existed; only its
  DISCOVERABILITY was missing, so made the refusal self-delivering (it now names the flag,
  `consult_status_refusal`) rather than adding any new admission. Treat a park+redo here as the
  workaround it is, and capture the deviation if a governed reopen was reachable.

  **Boundary — a LANDED `done` has no reopen at all.** This exit is scoped to the UNLANDED case
  (closure on the branch, task still `ready` on main). A task whose `done` reached main is terminal:
  file a NEW task (LIFECYCLE §Stage 9 "no clean reopen", QUEUE §Prematurely-closed). No flag, no
  consult, and no `status:` hand-edit re-opens it.

  ### Worked example — consult -> --owner-reset re-open sequence

  A step-by-step worked example of the re-open invariant + THE ESCAPE above (POST stage; the
  PRE stage is symmetric on a real plan change) is re-homed to
  **`patterns/audit-ceiling-consult-reopen-worked-example.md`** — read it ON DEMAND at the moment a
  ceiling is actually exhausted. It is a NON-NORMATIVE illustration: every rule it shows is stated
  above (§Owner-authorized ceiling continuation — its RE-OPEN and THE ESCAPE bullets), which WINS on
  any conflict.
  **Consult GOVERNS the granted pass — no weaker-model relitigation.** The re-open
  above secures the PASS; this secures the PASSS VERDICT. When a `--owner-reset` continuation is
  CONSULT-GOVERNED — `owner_reset_basis` resolves to `consult:<file>`, i.e. `_consult_basis` already
  verified a FRESH single-survivor GREEN/YELLOW consult matching the CURRENT subject (pre =
  plan_fingerprint, post = commit SHA) — the granted pass does NOT re-invoke a routine (weaker)
  auditor. The FULL ceiling-convergence consult IS the governing adjudication, so the granted pass
  CARRIES the consults verdict VERBATIM as its recorded verdict (`consult_governed: true` +
  `owner_reset_basis: consult:<file>`; the consult artifact path + verdict + recommendation are
  kept in `notes` for a transparent adjudication trail. The structured `findings` field follows the
  carried verdict: a consult-GREEN records `findings: []` (the consult RESOLVED everything), a
  consult-YELLOW records exactly ONE structural residual entry — the surviving option carried from the
  consult — so a carried residual is visible in the canonical field, not only in free-form `notes`).
  This is DETERMINISTIC: a consult-GREEN single-survivor records GREEN and can NEVER be defeated by a
  routine re-RED — so the manual hand-edit / verdict override is RETIRED, replaced by this sanctioned
  verb path (the 2026-06-07 forced overrides 3x: post post hand-edit closures
  pre verdict override, fingerprints `routine-owner-reset-relitigates-full-consult-resolved-findings-needs-governance-override`,
  `ceiling-convergence-consult-green-cannot-override-recorded-routine-red-at-close-gate`,
  `audit-post-owner-reset-flag-inert-refuses-pass4-no-post-side-escape`). SAFETY rests ENTIRELY on the
  existing freshness/convergence guards already proven before this point — a stale / multi-survivor /
  ABORT consult never reaches `owner_reset_basis: consult:<file>` (it REFUSES → escalate-to-owner,
  unchanged), so consult-governs fires ONLY on a fresh single-survivor FULL convergence the session
  agreed with. A NON-consult `--owner-reset` (explicit owner-authorized) re-invokes the auditor as
  before — consult-governs is the consult-basis-only path. NB this is the consult-GOVERNS resolution
  (Option b): the FULL-consult GREEN single-survivor is the governing verdict at the gate.
  Anti-complexity admission (recorded at adoption): extends the single ceiling gate + the
  escape-hatch pattern; one flag + one recorded field; removes the manual hand-run workaround;
  real incident E-0008 sub-cause 3 (N≥3). Home of the ceiling rule: this section (P5).

  **Adopted-plan axis (X-0111) — a consult whose recommendation is to CHANGE the plan GOVERNS
  the FIRST re-audit of the changed plan.** A TASK PRE ceiling-convergence consult can converge to a
  single survivor whose adoption IS a plan edit (the session sets `implementation_plan` to the
  recommended option's text — the same self-staleness named). Adopting it re-fingerprints the
  plan, so the consult's `basis_fingerprint` (pinned to the PRE-change plan) no longer matches and the
  consult-governs carry re-stales — the SAME consult that adjudicated "change the plan as recommended"
  could not govern the changed plan, forcing a redundant fresh ceiling pass / re-consult (
  re-consult against the already-changed plan asks a now-moot question). RESOLUTION (no new mechanism —
  one additional recorded field, reuses the consult_governed / owner-reset carry): at convergence a PRE
  single-survivor consult ALSO records `adopted_fingerprint` = `_plan_content_hash(survivor text)` — the
  fingerprint the plan WILL hash to once adopted. `_consult_basis` (pre) then treats the consult as
  FRESH when the CURRENT plan_fingerprint matches EITHER `basis_fingerprint` (the normal pre-change
  case) OR `adopted_fingerprint` (the post-change case); the consult-governs carry binds its recorded
  basis to that adopted (changed) plan. The exact-match still PROVES the session adopted the
  auditor-approved option VERBATIM — a paraphrase matches neither fingerprint and falls through to the
   stale re-consult path (unchanged). FAIL-CLOSED + BOUND: fires ONCE per adopted plan (a further
  edit away from the survivor text matches neither fingerprint → stale → re-consult), POST adjudicates a
  commit SHA not a plan so it is PRE-only, and a multi-survivor / non-converged / plan-gate consult
  records no `adopted_fingerprint` (the field is absent → the extra match is inert). Scope: TASK
  `audit pre` consult-governs only (the X-0111 incident surface). Extends the consult-governs path
  in-place, no parallel mechanism (anti-cx F1/F4 — the way / / extended this
  section).

  **Exhaustion-with-late-finding — the COMMIT-side owner-reset continuation (E-0030).** The
  reopen + consult-governs paths above secure a re-audit PASS and its VERDICT once the late fix is
  COMMITTED — but they presuppose a committed subject. A distinct failure mode (E-0030, DISTINCT from
  E-0008's premature false-block): a LEGITIMATE, non-deferrable finding surfaces AFTER the audit-post
  ceiling is exhausted (the owner-reset pass already spent on EARLIER findings) and its fix is NOT YET
  committable — so every in-CLI exit is blocked AT ONCE: `task commit --absorb` REFUSES past the
  ceiling (the carve-out interlock), a standalone `task commit` trips the chain-of-custody
  guard, `task close` requires a non-RED audit-post, and the ceiling-convergence consult ABORTs because
  the fix is not in the committed diff (it adjudicates a COMMITTED subject — pre=plan_fingerprint,
  post=commit SHA — and an uncommitted fix has none). The only prior exit was a manual emergency
  re-baseline (the incident, commit fe52664) — an out-of-CLI bypass, not a sanctioned path. The
  sanctioned in-CLI exit is the COMMIT-side mirror of `audit --owner-reset`: an OWNER-AUTHORIZED
  `task commit {tid} --absorb --owner-reset` grants an owner-authorized continuation that COMMITS the
  late fix past the exhausted ceiling — its sole purpose is to MATERIALIZE a committed subject; it is
  the BOOTSTRAP only, NOT a verdict continuation. It is structurally NON-STACKABLE (NOT a repeatable
  ceiling bypass): the escape commit folds the dirty audit-post YAML in (now clean) AND shifts the
  recorded commit, so the hazard the `--absorb` carve-out REQUIRES — a DIRTY audit-post pinned
  to the recorded commit — is dissolved; a SECOND escape is REFUSED until `audit post --commit <new>
  --owner-reset` re-pins custody, and that re-pin is itself CONSULT-GOVERNED (a fresh single-survivor
  FULL convergence). So escapes are interleaved with consult-governed re-pins, NEVER stacked — the
  escape inherits the audit-side single-continuation/reopen bound (PARITY, not a looser ceiling). Once
  committed,
  the EXISTING machinery completes the chain with no new mechanism: `audit consult` (the committed diff
  now contains the fix) → consult-reopen (re-opens one `--owner-reset`) → consult-governs (carries the
  fresh single-survivor verdict verbatim) → `audit post --commit <new> --owner-reset` RE-PINS custody
  (verdict.commit == the new recorded commit). OWNER-GATED by default (the session passes the flag only
  on explicit owner authorization — there is NO consult yet at commit time, by construction); it is
  journal-observable (the `commit_landed` event carries `owner_reset: true`, the same additive-optional
  carrier as the audit verb). FAIL-CLOSED: WITHOUT the flag the exhausted-ceiling `--absorb`
  REFUSAL stands (the ceiling is never silently disabled), and the downstream re-audit pass remains
  gated by the consult-reopen freshness axis (a fresh single-survivor FULL convergence each cycle), so
  the ceiling's purpose — force owner involvement + external adjudication — is preserved. Anti-complexity
  admission: ONE flag on the EXISTING `task commit` verb gating ONLY the existing exhausted-ceiling
  refusal; no new verb / event type / store; reuses the owner-reset vocabulary + carrier; removes the
  manual re-baseline as the only exit; real incident E-0030 (the emergency bypass). The
  COMMIT-side refusal + its escape are co-homed in SPEC-0015 §"Audit-stage YAMLs committed BY task
  close " (the guard's home) — kept in sync, not duplicated (P7). **The RED leg has the
  SAME arm, on identical terms.** `task commit --fix-red --owner-reset` grants the same
  one-pass-wide, owner-authorized, journal-observable continuation (marker `owner_reset_commit: true`
  on `commit_landed`) when an IN-SCOPE fix for a RED audit-post is green but the ceiling — including
  the owner-reset pass — is spent: without it the fix reaches no auditor at all, because the
  ceiling-convergence consult judges the COMMITTED diff and so re-finds the very findings the fix
  resolved (measured). It admits ONLY a commit carrying AUTHORED content
  (so the `--card-repair` shape, whose custody is earned by an already-audited ship, is refused
  there), it is exactly one pass wide (a second is refused with or without the flag), and — like its
  mode-a sibling — it widens the COMMIT door ONLY: the AUDIT ceiling is untouched, so the follow-up
  `audit post --commit <new> --owner-reset` stays gated by the unchanged consult-reopen freshness
  axis.

  **Plan-target parity (the ceiling-convergence triage extends to PLAN gates).** The triage
  above is stated for a TASK (`--task … --stage pre|post`); it applies IDENTICALLY to the
  ceiling-bearing PLAN gates — `draft-specs` (P2, mandatory-blocking), `specs-trial`
  (P3), `trial-accepted` (P4), `decomposition-executing` (P5), `finalization` (the aggregate `audit
  post --plan`): the gates this section already marks "ceiling applies", each `--gate` token reusing
  its EXISTING gate identity (no new namespace). At a plan-gate ceiling the session formulates options
  and runs `audit consult --plan <slug> --gate <id>` (FULL); it REFUSES below the ceiling
  (`prior_passes >= 2`, read from the saved plan gate audit YAML) and returns `survivors:` + one
  `recommendation:`, saved to `decisions/<slug>-audit-consult-<gate>.yaml` (the SAME consult artifact
  schema as the task path — `target_kind: consult`, keyed by (slug, gate); no new schema). A single
  agreed survivor proceeds AUTONOMOUSLY via the matching gate verb's `--owner-reset` (`plan stage
  <NEXT> --owner-reset` for P2-P5, `audit post --plan --owner-reset` for finalization), consult-GOVERNED
  VERBATIM — but a plan consult basis is keyed to BOTH its `--gate <id>` AND its `basis_fingerprint`,
  where the fingerprint REUSES the gate audit's already-RECORDED signature (INV-2: `content_hash` for
  the prose gates, `card_set_fingerprint` for decomposition-executing, `corpus_signature` for
  finalization — no second scheme): `owner_reset_basis: consult:<file>` resolves ONLY on an exact
  (gate id, recorded fingerprint) match; a consult from a DIFFERENT gate, or a stale fingerprint,
  settles NOTHING (REFUSE → escalate-to-owner). UNLIKE the task path the plan `--owner-reset` is
  CONSULT-GOVERNED ONLY — there is no bare owner-authorized single-pass fallback for a plan gate
  (a plan owner-reset without a fresh converged consult REFUSES). The four non-convergence
  owner-escalation conditions and the consult-governs verdict-carry are identical to the task path. No
  new verb, no new event type — `audit consult` gains `--plan`/`--gate`, the existing `owner_reset`
  carrier + `audit_*` / `external_audit_completed` events carry the plan case.

  ### Saved-result ledger-skip markers (the ceiling's YAML side-effects)

  Every marker named in the §Ledger-skip axes `marker` column is written on the saved audit-result
  YAML (canonical schema home: SPEC-0036 §Saved audit result + AGENTS §Saved audit result schema) as
  an ADDITIVE-OPTIONAL field: present ONLY on the run its axis describes, ABSENT on every other run
  (never `false`). It signals that `passes` was NOT advanced for that verdict. This trail is what the
  ceiling reads to enforce itself, and it enables post-hoc "which verdict governed which ship" + drift
  detection. ONE further marker rides the identical additive-optional shape but is NOT a ledger-skip
  axis: `tooling_absence_abort: true`, present ONLY on the transient no-read-tooling ABORT
  (rule home: SPEC-0036 §Verdict handling ABORT exception). `consult_governed: true` is
  present ONLY on a CONSULT-GOVERNED `--owner-reset` continuation pass (§Consult GOVERNS the granted
  pass), where `notes` carries the consult artifact path + verdict + recommendation as the
  adjudication-trail provenance — and since it is ALSO that axis's ledger-skip marker (the
  §Ledger-skip axes Consult-governed-carry row): the pass it marks did not advance `passes`, because no
  auditor was invoked. It was previously listed here as a non-ledger-skip marker; that is superseded.
  RELATEDLY, every TASK audit (pre/post) verdict records `lens_version:
  <TASK_AUDIT_LENS_VERSION>` (the lens version it was rendered under; drives the TASK lens-version
  axis) — additive-optional, task audits only, the task analog of the plan `lens_version`.

  **ONE marker also rides the JOURNAL, not the YAML alone.**
  `concurrent_merge_reaudit: true` is ALSO spread into the run's EXISTING `audit_post_completed`
  and `external_audit_completed` rows, in the same additive-optional shape as `owner_reset` /
  `trend_ceiling_grant` / `custody_repin` — present ONLY on a merge-triggered pass, ABSENT (never
  `false`) on every other run. NO new event type: the SPEC-0025 catalog is untouched and no new
  emit path is added. WHY the journal and not the YAML alone — after this marker is the
  discriminator for whether a pass was charged at all, and the saved YAML is OVERWRITTEN in place
  by the next pass, so a reader asking «was this pass charged, and why not?» across a card's
  history has only the journal to ask. The other markers in this section stay YAML-only; this one
  is named because it is the one the ledger's own history is read from.

