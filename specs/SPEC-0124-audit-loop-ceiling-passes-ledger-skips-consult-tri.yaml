    already consumed). In case (d) the explicit-owner-authorized fallback of §Basis resolution is NOT
    available: that single grant is already spent, which is precisely what "hard-exhausted" means. A
    hard-exhausted budget with no fresh single-survivor convergence is a genuine non-convergence — the
    owner is the backstop (CHARTER §P6), exactly as the «pass-4 not» clause intends.

