    budget re-opens ONE more `--owner-reset` — the absorb-then-consult cycle's escape. ONE rule, both
    stages, same invariant: a re-open MUST re-earn a fresh single-survivor GREEN/YELLOW FULL
    convergence each cycle — DOUBLE-LOCKED against spin by a per-stage freshness axis that differs only
    because the failure modes differ. **PRE axis — a real plan change** (recorded plan_fingerprint !=
    current): the absorb loop genuinely edits the plan. **POST axis — a consult re-RUN after the last
    recorded pass** (the consult's recorded `passes` >= prior_passes), NOT a commit change: the
    recurring post dead-end is a SOUND diff mis-categorized by a routine RED (a coherence/authoring
    rule with no runtime consumer), which legitimately does NOT change — so requiring a commit change
    would block the very case; re-running the FULL consult (the owner-proxy escalation) is the bound,
    and it also covers the mode-a changed-commit cycle. Either axis NEVER lowers the passes counter or
    forces a verdict (a re-opened pass is a real recorded pass that can still RED). So the «pass-4 not»
    clause above means «not WITHOUT a fresh converged consult re-pinned on its per-stage freshness
    axis». TASK pre AND post.
