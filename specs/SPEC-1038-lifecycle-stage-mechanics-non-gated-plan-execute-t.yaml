  \ min against ~30 s for\naudit-post, ≈35% of closed tasks met ≥1 RED audit-post\
  \ and re-ran the suite ~463 times after it.\nDesign audited by `decisions/task-fsm-tests-after-audit-audit-adhoc.yaml`\
