  \ flag: false positive, refreshed last-touch.\n\nDrift note : `cmd_task_plan --finalize`\
  \ gained an AC-COVERAGE PRECONDITION — it now\nREFUSES an `implementation_plan`\
  \ that never NAMES one of the card's acceptance criteria (a\nwhole-word `ACn`, or\
  \ a range/list like `AC1-AC3`; a bare number does not count), and journals the\n\
  refusal as `plan_ac_coverage_refused`. This IS a change to the plan-finalize mechanics\
  \ this spec\ngoverns, not merely an added gate CALL, so it is recorded here rather\
  \ than as a false-positive\nrefresh: finalize now validates `implementation_plan`\
  \ AND its AC coverage before emitting\n`plan_finalized`. It is the pre-flight checklist\
  \ item 1 above (PROBE PER AC) given a MECHANICAL\nfloor at the Plan seam — a NECESSARY\
  \ CONDITION ONLY, deliberately not a substance judgement:\naudit-pre (<workshop-spec>)\
  \ stays the enforcer of whether the plan actually SATISFIES each criterion,\nexactly\
  \ as §Plan-entry pre-flight says. Canonical AC ids reuse `audit._ac_canonical_id`,\
  \ so this\nseam and the audit packet's readiness rows label a criterion identically.\n\
  \nDrift note : `cmd_task_plan` (and `cmd_stage`'s Plan branch) gained the Plan-entry\
  \ readiness\nCALL `_require_analysis_for_plan` — an ADDED gate CALL, NOT a change\
  \ to the plan-finalize mechanics\nthis spec governs (still: validate `implementation_plan`,\
  \ emit `plan_finalized`). The CONCRETE\nAnalysis carrier (verb + field + the one-carrier-per-datum\
  \ rule) is NAMED in this spec at\nSPEC-0059's activation, per SPEC-0059's deferral.\
  \ Co-anchor `possibly-stale` flag: false positive,\nrefreshed last-touch.\n"
