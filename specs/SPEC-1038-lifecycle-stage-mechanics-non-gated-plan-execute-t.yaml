id: SPEC-1038
title: Lifecycle stage mechanics (non-gated) — plan/execute/test detail + resume,
  hygiene fast-path, stage-FSM with the governed test run after audit-post
status: active
created_at: 2026-10-19 15:52:08+00:00
travels: null
consumed: false
implements:
- bin/lib/task.py#cmd_task_plan
- bin/lib/task.py#cmd_task_execute
- bin/lib/task.py#cmd_task_test
- bin/lib/task.py#cmd_task_commit
- bin/lib/task.py#cmd_task_close
- bin/lib/gates.py#stage_pointer_move
- bin/lib/gates.py#advance_stage_pointer
- bin/lib/audit.py#cmd_audit
binding:
- stage-entry:Plan
- stage-entry:Execution
- stage-entry:Tests
body: "## Scenario\n\nA Build session runs a task through nine stages, in the order\
  \ Analysis → Filing → Plan →\nAudit-pre → Execution → Commit → Audit-post → Tests\
  \ → Closure: the governed test run comes AFTER\naudit-post, so a RED audit-post\
  \ is answered by a fix commit and a re-audit with no full test run in\nbetween,\
  \ and the full run sits next to the land. The control-point stages (audit-pre, commit,\n\
  audit-post, closure) carry irreversible obligations and are floor-delivered before\
  \ the action\n(SPEC-0014 / SPEC-0015 / <workshop-spec>). The remaining NON-gated\
  \ mechanics — how to write the plan, how\nto execute (incl. acting on a staged `proposed`\
  \ spec), how to run tests, plus the resume contract,\nthe hygiene fast-path, and\
  \ the per-class stage-FSM — are reference detail consulted WHEN entering\nthat stage,\
  \ not before a gated action. They live in the `retrieved` tier. The Plan, Execution\
  \ and\nTests mechanics are STAGE-DELIVERED at their stage-ENTRY (by `stage Plan`\
  \ / `stage Execution` /\n`stage Tests`, the\nlifecycle delivery axis — a lighter\
  \ pointer than a floor-trigger, since these stages are still\nNON-gated, not control-points);\
  \ the always-loaded LIFECYCLE handbook keeps the 9-stage skeleton\n(stage names\
  \ + goal + done-when + a pointer-stub naming this spec), and the whole body (incl.\
  \ the\nExecution / resume / hygiene / FSM detail) is also fetched on demand via\
  \ `graph query SPEC-1038`.\n\n## Internal\n\nTHE NON-GATED LIFECYCLE STAGE DETAIL\
  \ — this spec is the retrieved home; LIFECYCLE keeps the 9-stage\nskeleton and points\
  \ here (P5, one home). No floor-trigger: these are not gated control-points\n(SPEC-0007\
  \ §5a query-only class).\n\n### Stage 3 — Plan (detail)\n- Write `implementation_plan:`\
  \ field in task YAML.\n- Plan must name: files to touch, order of changes, test\
  \ strategy, risks.\n- **If Analysis flagged a standing rule, Plan STAGES the `proposed`\
  \ spec(s)** the task itself births\n  (`bin/yitc-v2 spec new --draft --proposed-by\
  \ T-XXXX`, then the spec FSM `proposed` head — GRAPH\n  §Spec lifecycle). There\
  \ is **NO new stage**: the merge-point into the existing flow is simply\n  «proposed\
  \ specs exist» — Audit-pre then receives them, Audit-post verifies code\n  against\
  \ them.\n- **WORK-FIRST scope (per Part C narrow):** a spec the task itself births\
  \ has `proposed_by == this\n  task`, so it activates (`proposed → active`) at **THIS\
  \ task's closure** (Stage 9). A\n  **plan-born** spec (`proposed_by ==` a plan,\
  \ born by `plan accept`, Part B)\n  activates at the closure of the ONE task named\
  \ as its activation owner (<workshop-spec> rule 5 homes\n  that carrier; SPEC-0034\
  \ says how a plan's decomposition names the task). So this task's closure\n  activates\
  \ a plan-born spec only when this task is that named owner.\n- **Changing an active\
  \ spec:** adding to it (a new case, a clarification) → `spec edit` in place; a\n\
  \  successor only when a reader must act differently in a case the spec already\
  \ covers (<workshop-spec> rule 7).\n- Plan ~45 lines is a **soft guideline, not\
  \ a hard gate**: `task plan --finalize` **WARNs**\n  past it but proceeds. If the\
  \ task is genuinely too big, decompose at Stage 2 — but that is a\n  judgement,\
  \ and the ~45 measures plan verbosity, not task decomposability (a single coherent\
  \ artifact\n  may legitimately exceed it).\n- **REPEATED-WORK STATEMENT (advisory).**\
  \ For any plan STEP that adds a read, a loop, a poll, a\n  remote fetch, a scan\
  \ or a worker pass, the `implementation_plan` carries ONE line for that step:\n\
  \  `reuses: <the neighbouring mechanism at this seam that already folds / caches\
  \ / bounds /\n  watermarks this work>` — or `adds-first: <why no such neighbour\
  \ exists>`. It is the Plan-stage\n  face of the Analysis REPEATED-WORK CHECK (SPEC-0032\
  \ §Internal item 1a); the classes and detect\n  heuristics live single-home in `patterns/repeated-work-lens.md`\
  \ and are NOT restated here\n  (<workshop-spec> rule 8). **ADVISORY, and it gates\
  \ NOTHING:** `task plan --finalize` neither refuses nor\n  warns on its absence,\
  \ and no other verb reads it — a plan that omits the line finalizes exactly as\n\
  \  before.\n- **For substantive plans** (foundational decisions, multi-file/multi-step,\
  \ quantitative claims) —\n  consult `patterns/big-plan-checklist.md` (6-probe optional\
  \ discipline).\n\n#### Plan-entry pre-flight checklist (GREEN-first)\nSelf-check\
  \ these FIVE before `task plan --finalize` — a VIEW of the audit-pre lens shifted\
  \ LEFT to\nPlan-entry, so the plan clears Stage-4 on the FIRST pass instead of learning\
  \ the criteria post-hoc\nfrom the auditor. **One home (P5 / <workshop-spec> rule\
  \ 8):** the lens itself lives in SPEC-1040 §Task\nper-stage overlays → audit-pre\
  \ — this is a short pointer to it, NOT a second source of plan-quality\nrules; on\
  \ any doubt read `bin/yitc-v2 graph query SPEC-1040`.\n1. **PROBE PER AC** — each\
  \ acceptance criterion names a concrete grep / command / event that PROVES\n   it\
  \ (not a restatement); an infra-class AC names an unforgeable P8 adoption probe\
  \ (CHARTER §3/§8).\n2. **COHERENCE SWEEP** — «where else is this rule stated?» amend\
  \ the governing spec + handbook prose\n   + any template + the derived index in\
  \ the SAME change (P7 / P5 — leave no second drifting source).\n3. **SCOPE ASSERT**\
  \ — list exactly the surfaces the plan touches, each within the stated task scope;\n\
  \   an adjacent edit becomes a SEPARATE filed task, never silent scope-creep (CHARTER\
  \ §1).\n4. **TEST EXERCISES THE CHANGE** — a negative / edge case per AC, wired\
  \ to the runner and observed\n   RED before the fix (a test green on un-fixed code\
  \ is not a test).\n5. **ALL CONSUMERS** — grep every call-site / consumer of the\
  \ changed surface (parsers / graph /\n   readers / validators) and state per consumer\
  \ how it is updated OR why it is unaffected.\n\n### Stage 5 — Execution (detail)\n\
  - Edit files per plan.\n- Stay in scope (CHARTER #1 filter — don't expand mid-execution).\n\
  - If discovery surfaces — file a separate task for it, don't grow the current one.\n\
  - When creating a new artifact (decision / spec / pattern) — follow `patterns/doc-conventions.md`\n\
  .\n- When the change will bind a scenario step to a test, shape the code so the\
  \ step's boundary exists\n  (a function LOADS or DECIDES, never both) — `patterns/choosing-a-bound-tests-boundary.md`\
  \ §0.\n- The change hand-in has its one home in SPEC-1026, delivered by `stage Plan`\
  \ and `stage Execution`\n  (`bin/yitc-v2 graph query SPEC-1026`).\n- **Own-tests\
  \ check — the fast run BEFORE the commit.** Before `task commit`, run the task's\
  \ OWN\n  tests: the tests the task's diff adds or changes, selected through the\
  \ project's OWN test\n  declarations (the engine's script-style `tests/test_*.py`\
  \ set; a consumer's declared verify layers\n  and their adapters, SPEC-0186 — the\
  \ same selection machinery the governed run uses, restricted to\n  the changed test\
  \ files; plan-check round 1 F4), plus the declared always-run tests of each swept\n\
  \  test directory (the consistency tripwires; the declaration's home is SPEC-0181\
  \ R5), which run on\n  every check because a corpus-wide registry or ratchet test\
  \ names none of the changed paths,\n  through the governed own-tests mode of\n \
  \ `task test` admitted at EVERY stage before Closure — Execution, Commit, Audit-post\
  \ (the fix after\n  a RED audit-post) and Tests (the fix after a red governed run)\
  \ are checked the same way (trial\n  cycles 1-2, D-e / N3). It is the early evidence\
  \ audit-post reads,\n  labelled PARTIAL.\n  Its row is NOT a Tests-stage verdict\
  \ row: it is never runner-marked as the governed run, so it\n  never becomes the\
  \ land's credited row, never satisfies SPEC-0181's \"the governed run covers at\n\
  \  least the land's set\", and never satisfies the Closure-time coverage check (§Tests).\
  \ A diff that\n  adds or changes no test file, in a tree that declares no always-run\
  \ test, records an empty\n  own-tests result, not an error; a changed test file\n\
  \  the declarations cannot map to a runner is recorded `not-determined`, never an\
  \ empty green, and\n  the audit packet shows it so. Iterate on one test\n  by its\
  \ own file while it goes from red to green, as before.\n- **Re-sign specs before\
  \ the commit.** Every spec re-sign the change needs is done before\n  `task commit`:\
  \ a re-sign after audit-post would change the audited subject and need a new commit\n\
  \  and a re-audit. (The spec-drift report that used to run at Tests entry runs at\
  \ Commit entry.)\n\n**Spec mutation during Execution — the EXISTING spec FSM edges,\
  \ no new mechanism (per Part C narrow).**\nIf the task staged a `proposed` spec\
  \ in Plan (Stage 3), Execution may act on it. The four moves are\njust NAMES for\
  \ transitions the spec FSM (GRAPH §Spec lifecycle) already provides — there is\n\
  **no new verb, no new state, no stored taxonomy**:\n\n| Move | What it is (existing\
  \ edge) |\n|---|---|\n| **confirm** | leave the spec `proposed` — no edge; it activates\
  \ (`proposed → active`) at THIS task's closure (Stage 9, work-first scope) |\n|\
  \ **correct** | set the proposed spec's `supersedes:` to the prior spec — atomic\
  \ supersession (the target flips at closure) |\n| **cancel** | move the spec to\
  \ terminal `withdrawn` / `rejected` (abandon) |\n| **birth** | create a fresh `proposed`\
  \ spec via the existing spec-creation path (`bin/yitc-v2 spec new --draft --proposed-by\
  \ T-XXXX`) |\n\n- **Reopen boundary — NO new guard (the EXISTING rule covers it).**\
  \ Changing the `proposed`\n  spec SET during Execution is a plan/scope change, so\
  \ it re-fingerprints the plan and the existing\n   rule (`task execute` requires\
  \ an audit-pre bound to the current plan —\n  `_require_audit_pre_matches_plan`)\
  \ already REFUSES until a fresh audit-pre re-verifies it.\n- **Escalate-to-plan\
  \ escape:** a big or contested spec design does NOT get crammed into the task —\n\
  \  escalate it to a `plans/` entry (Stage 3 / `patterns/plan-lifecycle.md`) and\
  \ let the plan carry it.\n\n### Tests — the governed full run, AFTER audit-post\
  \ (detail)\n- **Position.** Tests follows Audit-post (or, for an audit-exempt card,\
  \ Commit) and precedes\n  Closure. The stage keeps its name and its journal vocabulary\
  \ — `tests_passed` / `tests_failed`,\n  the `stage6_*` rows and the land's \"Stage-6\
  \ credit\" keep their names, which are identifiers,\n  not positions. A pointer\
  \ move into Tests requires a recorded `commit_landed` and, for a card\n  that takes\
  \ audit-post, a GREEN or YELLOW `audit_post_completed` on its last substantive commit\n\
  \  (the commit §Closure-time coverage reads) — through `advance` from Audit-post\
  \ and through an\n  explicit `stage Tests` alike; otherwise the move is refused\
  \ with a `read_gate_refused` row and\n  the route «run `yitc-v2 audit post --task\
  \ <T>` first; Tests follows the audit-post (SPEC-1038)».\n  Not asked: a card matching\
  \ a declared SPEC-0178 audit-post exemption case (from Commit or from\n  Audit-post),\
  \ a hygiene fast-path card, the `return` move, and the governed run itself — `task\n\
  \  test --run` still runs and records while the pointer waits at Audit-post. Which\
  \ run covers\n  Closure is decided ONCE, at Closure, from journal facts (§Closure-time\
  \ coverage below): a governed\n  run may run and record its row at any time, a run\
  \ recorded before the card's last substantive\n  commit never covers Closure, and\
  \ the land's Stage-6 credit compares the candidate tree with the\n  tested tree\
  \ itself (SPEC-0065 condition 2, or with a passed post-sync proof's tree, §Bound)\
  \ — the worst case is one wasted run, never a wrong\n  closure or credit (trial\
  \ cycle 1, D-b; cycle 2, N1; the pre-run call site removed by the owner's\n  simplification,\
  \ events.jsonl#ts=).\n- **One order for every card (owner, option A, events.jsonl#ts=).**\
  \ From the\n  land that activates this spec every ENGINE card — in flight or new\
  \ — follows the rows above, and a\n  CONSUMER's cards follow them once the engine\
  \ version carrying that land serves the consumer\n  (SPEC-1003 §5: at once with\
  \ routing inert; else the canary first, then every other routed consumer\n  on the\
  \ owner's promote); there is no second order and no membership rule, and the <workshop-spec>\
  \ terminal-bearing\n  precondition (items (a)-(d)) is retired in that same land\
  \ by its successor SPEC-1039 (§3). A card in flight\n  before Tests continues on\
  \ the new rows; a committed card continues from where it is and owes at\n  most\
  \ one governed run after its last substantive commit before Closure. The only state\
  \ the rows cannot continue\n  — a card AT Tests with NOTHING committed, which entered\
  \ Tests under the old rows — is refused the\n  Tests → Commit move (no red run after\
  \ a commit), and the refusal names the route: close it\n  `wont-do` and re-file\
  \ its scope as a new card.\n- **What the run covers.** It is run after the card's\
  \ last substantive commit — for an audited\n  card, the audited commit. Which run\
  \ covers Closure is the one journal fact of §Closure-time\n  coverage below; whether\
  \ the tree a run tested is the tree being landed is the land's own check\n  (SPEC-0065\
  \ condition 2), never a Closure comparison. Before the run, `worktree sync` from\
  \ main is recommended so the run's base is\n  fresh for the land's credit; a sync\
  \ that brings a hand-resolved conflict is authored content and\n  takes the audit\
  \ custody rules (SPEC-0077 §3a).\n- **Order of journal rows.** \"Recorded after\"\
  \ and \"newest\" in this spec mean later in the\n  journal's own order as the segment-aware\
  \ reader returns it (SPEC-0190), never a comparison of\n  second-resolution `ts`\
  \ values: a row written in the same second after another is after it.\n  This governs\
  \ the A6 same-row fact, the `return` move and the newest-red-run packet section.\n\
  - **A red run returns the card to Commit.** The fix ships as a new recorded commit:\
  \ for an audited\n  card through the re-ship arm the prior verdict admits (`task\
  \ commit --reship` after GREEN,\n  `--absorb` after YELLOW — no new arm), followed\
  \ by `audit post` on the new commit, then Tests\n  again. That re-audit judges the\
  \ whole accumulated delta from the last audited commit, with the\n  NEWEST red governed\
  \ run in its packet — its `tests_failed` row, evidence and failing tests\n  (trial\
  \ cycle 1, D-d) — and COUNTS as an ordinary pass under SPEC-1034 ON THE SAME CEILING\
  \ ROW as\n  the audit it reopens: a re-ship on a card with ANY runner-marked governed\
  \ run (`tests_passed` or\n  `tests_failed`) recorded after its NEWEST `audit_post_completed`\
  \ does NOT open a new ceiling row —\n  decided by those facts and never by how the\
  \ card reached Commit, an explicit `stage Commit`\n  included (plan-check round\
  \ 1 F2), and never by that run's verdict, so a green run on an unaudited\n  fix\
  \ cannot reset the row (accept-gate round 3 F1). The new-row rule keeps governing\
  \ only\n  the GREEN second ship it was written for: a re-ship after a GREEN audit-post\
  \ with no governed run\n  since it (SPEC-1039 §4). So repeated red-Tests fixes reach\
  \ the ceiling and the SPEC-1039 decision\n  route (trial cycle 2, N2). A fix that\
  \ changes the\n  implementation approach amends `implementation_plan` first, as\
  \ any plan change does. For an audit-exempt\n  card (hygiene, or a declared SPEC-0178\
  \ case) the fix is an ordinary `task commit` and the card\n  goes Commit → Tests\
  \ → Closure again, its exemption unchanged. A re-run of Tests on the SAME commit\n\
  \  (an environmental failure, no new commit) needs no re-audit.\n- **Closure-time\
  \ coverage.** `task close` asks one question of the journal: is the newest\n  runner-marked\
  \ governed run recorded after the card's LAST SUBSTANTIVE COMMIT green? That commit\
  \ is\n  the card's newest `commit_landed` whose commit changes at least one path\
  \ outside the inert\n  bookkeeping paths — the inert-path classification the land's\
  \ Stage-6 credit already uses\n  (SPEC-0065, `_classify_inert_paths`), never a second\
  \ list — so a later commit that touches only\n  bookkeeping (the card, an audit\
  \ record, the journal) asks for no new run. A governed run counts\n  whatever selection\
  \ the existing rules gave it — the full suite, the affected selection, a layer\n\
  \  skipped by its `subject_globs`, a declared consumer waiver; an own-tests row\
  \ never counts. A card\n  with no substantive `commit_landed` owes no run at Closure:\
  \ the hygiene `--batch-close` route (the\n  fix rides the work batch's own commit,\
  \ and its land verifies it) and a card whose only commits are\n  bookkeeping close\
  \ as they do today. **A run that executed nothing because every declared layer\n\
  \  was skipped as DISJOINT SUBJECT** (`task test --run --evidence` prints `TEST:\
  \ NONE`) records ONE\n  `tests_passed` row with `outcome: none-disjoint` and the\
  \ runner's `stage6_run` tree mark — only\n  when every declared layer row is `skipped-disjoint-subject`,\
  \ no test sweep ran, and the runner\n  can name the tree it judged; a NONE for any\
  \ other reason (no layers declared, a declaration that\n  cannot be read, a waived\
  \ layer, a section-level waiver) records nothing and the card stays\n  refused.\
  \ Closure takes that row as covering only while it is the newest governed run after\
  \ the\n  last substantive commit AND its tree is the card head apart from the inert\
  \ paths above\n  (`git diff <tree> HEAD`, the same inert classification); otherwise\
  \ the refusal names it. The\n  land judges the row like any runner-marked row: it\
  \ credits it as its candidate leg only on the\n  SPEC-0065 conditions, a skipped\
  \ layer only where the land's own skip set skips it too. Apart from\n  that one\
  \ head check, nothing else is compared at Closure — no tree comparison, no\n  provenance\
  \ split, no list of admitted differences. The tree stays guarded where it is guarded\n\
  \  today: the closure record commits only what the close itself wrote, the land\
  \ refuses uncommitted\n  non-bookkeeping changes and credits a run only for the\
  \ tree it tested (SPEC-0065 condition 2) or a passed post-sync proof's tree (§Bound),\
  \ and\n  otherwise runs its own verify; changes a sync brings from main are not\
  \ the card's commits and are\n  judged by that land; the closure's own activation\
  \ writes come after this check. Custody is\n  unchanged: a substantive commit after\
  \ the audit-post needs its own audit-post, so for an\n  audited card the last substantive\
  \ commit is the audited one. A refusal names that commit and the\n  route (`task\
  \ test --run --evidence` at Tests) (accept-gate round 5; owner,\n  events.jsonl#ts=).\n\
  \  The planned absence of a governed run BEFORE an audit never blocks that audit\
  \ — including a\n  terminal-bearing pass under SPEC-1039. The coverage check runs\
  \ AFTER `task close`'s existing\n  audit-post and fast-path checks, so their refusals\
  \ keep coming first and unchanged (trial cycle\n  1, D-a). It and the `return` /\
  \ `exempt` move predicates read the journal through the segment-aware\n  reader\
  \ (SPEC-0190), never one physical journal file (trial cycle 1, D-c); a new reader\
  \ site\n  carries the SPEC-0190 obligations — the regenerated reader census and\
  \ a recorded read-contract\n  exemption or its drive in the multiset-identity suite\
  \ — and every existing fixture that closes a\n  card or runs Tests gains a commit\
  \ and a governed-run row in the cut-over card (trial cycle 2, N4).\n- Run the project's\
  \ own test command (`pytest`, `bats`, `npm test`...).\n- **V2 convention:** plain\
  \ Python scripts in `tests/test_<area>.py`, runnable via\n  `python3 tests/test_<area>.py`;\
  \ exit 0 = pass. No pytest/bats overhead. See `tests/README.md`.\n- **The self-check\
  \ is `bin/yitc-v2 task test --run`, and it runs the SELECTED suite, not the whole\n\
  \  one (SPEC-0181).** `--run` executes land's CANDIDATE leg, and that candidate\
  \ run is\n  GOVERNED by the affected-test selection at BOTH seams it happens — here\
  \ and at `land` — through\n  the SAME runner entry point, so the same fail-closed-to-full\
  \ ladder, the same omitted-test\n  tripwire and the same `selection-omitted-a-test-naming-a-changed-path`\
  \ capture apply. The run\n  prints `selection: affected (n of N)` / `selection:\
  \ full (fail-closed) — <reason>` /\n  `selection: full (--full)` plus any omitted-and-recovered\
  \ tests, and the `tests_passed` evidence\n  records the mode + counts — so a green\
  \ row says WHICH suite it is green over. `--run --full` is\n  the explicit whole-enumeration\
  \ escape. `--run --whole` is the MEASURING form: every declared verify\n  layer\
  \ and the test sweep run whole on the current tree — no `subject_globs` skip, no\
  \ deciding\n  selection, no unit credit (it is not the candidate run of one card,\
  \ SPEC-1030 rule 4) — and its row\n  carries `whole: true`; Closure-time coverage\
  \ reads it like any governed run, and the land credits it\n  only on its own SPEC-0065\
  \ conditions. The Stage-6 set is SUPERSET-OR-EQUAL of land's, never\n  narrower\
  \ (SPEC-0181 §Stage-6 seam): the Tests run cannot read land's two optional refinement\
  \ channels,\n  and their absence frees less and recovers more. **Unchanged:** a\
  \ green here is still NOT the land\n  verdict — `land` verifies TWO legs (SPEC-0077)\
  \ and the pinned last-green leg is not run here\n  — and a bare `pytest tests/`\
  \ still reads FALSE-GREEN on script-style `__main__` tests.\n- **A consumer project's\
  \ run (`-C`).** There `--run` executes the project's DECLARED\n  `verify.layers`\
  \ (SPEC-0152 rule 16) — each layer's command, one after another unless the project\n\
  \  names them under `verify.independent_layers`, a layer whose `subject_globs` are\
  \ disjoint from the\n  working tree's changes against the merge-base with `main`\
  \ skipped exactly as `land` skips it —\n  plus the project's test sweep where a\
  \ test directory exists and no declared layer covers it; the\n  result line names\
  \ the layers that ran and the ones skipped or waived, and it states the\n  pinned-leg\
  \ bound only where the project's `verify_policy` has its `land` run that leg (SPEC-0186).\n\
  - Output must be visible (Evidence Rule — not «tests pass», but actual output).\n\
  - **RED-GREEN — trust green only after seeing red** (failure class #8): a\n  behaviour-change\
  \ test MUST be observed FAILING without the fix before its green is trusted (or\
  \ it\n  asserts the negative case — e.g. the guard DOES block without the escape\
  \ hatch, as\n  `test_write_isolation_guard` does). A test that passes whether or\
  \ not the fix is present gives no\n  signal.\n- If tests red → fix code or tests\
  \ (not both in the same iteration — DP#17 mono-variable).\n- **Iterate on one test\
  \ by name; take the governed run once.** While a test goes from red to\n  green,\
  \ re-run only that test, by its own file (in Execution, the own-tests check above).\
  \ Take the\n  self-check run named above (the selected suite, not a whole-suite\
  \ enumeration) ONCE, at the Tests\n  stage after the last audit-post; a second such\
  \ run is then paid only when the first one comes back\n  red. Land verification\
  \ is\n  unchanged by this.\n  A dispatched worker starts every test run it launches\
  \ by hand — one test, one file, or the\n  project's own test command — at the scheduler\
  \ priority a dispatched worker's Stage-6 run takes\n  when it runs on this host,\
  \ so that a land's verification gets the processor first. That is the\n  local value,\
  \ also where the Stage-6 run itself is routed to another host; it is read from this\n\
  \  host's machine setting, never written as a number:\n  `bin/yitc-v2 config get\
  \ YITC_VERIFY_WORKER_NICE` (in a consumer session\n  `<engine>/bin/yitc-v2 -C <repo>\
  \ config get YITC_VERIFY_WORKER_NICE`); pass it to the host's\n  lower-priority\
  \ launcher for that one run. Set it per run, never for the session: a session\n\
  \  started at a lowered priority passes it to everything it starts, its own land\
  \ verification\n  included, and an unprivileged process cannot raise its priority\
  \ back. On a host with no such\n  launcher, run the test as it is. Leave the priority\
  \ of `task test --run` and of `land` to the\n  engine.\n- **Walk each criterion\
  \ at its edges before the final run.** For each acceptance criterion, list\n  its\
  \ edges (empty, absent, one, many, the boundary value, malformed input) and check\
  \ each one\n  against the built change, by hand or with a targeted test, BEFORE\
  \ the commit (the own-tests check). An\n  edge found broken after it costs a second\
  \ run. This is the Plan pre-flight item 4 edge case,\n  checked against the change\
  \ as built rather than as planned.\n\n### Resume contract\n**Scope clarification\
  \ (per F3 absorption):** the Resume contract addresses **logical continuity** of\
  \ a\ntask's progression across pause points — NOT process continuity of multiple\
  \ pipeline stages or role\nhandoffs. CHARTER §Principle 6 (Build + Review only —\
  \ no pipeline, no role-split) remains intact.\n\nResume metadata restores a **previously-authorized\
  \ Build context** within the same AI session or a\nresumed Build session by the\
  \ same AI agent. It does not create a new pipeline stage. It does not\nauthorize\
  \ a role handoff. It restores prior state-of-work for continuing already-decomposed\
  \ task\nlifecycle execution.\n\n**Allowed pause/resume boundaries:**\n- Same Build\
  \ session pause (compact or break) → resume in same session.\n- Cross-session resume\
  \ (owner returns next day) → new Build session reads task YAML state, re-runs\n\
  \  Stage 1 verification, continues.\n- Owner-wait blocking → task stays in-progress\
  \ or moves to paused; resume after owner-input.\n\n**NOT allowed:**\n- Resume by\
  \ a different AI agent or different owner persona — task ownership stays singular.\n\
  - Cross-project task transfer — a V2 task belongs to V2; a production-project task\
  \ belongs to that\n  project.\n- Stage-skip via resume — resume continues from the\
  \ paused stage, not jumps to a later stage.\n\nA task may interrupt mid-stage (owner-wait\
  \ blocking, auditor abort, session boundary). When the AI\nexits an incomplete task,\
  \ the **task YAML records:** `current_stage: <stage name>` (the semantic name of\
  \ the active\nlifecycle stage — §Stage FSM per class below, which refuses a numeric\
  \ value); `resume_from: <step within stage or «start»>`; `last_verified: <ISO ts>`;\
  \ `next_action:\n<one-line concrete next step>`; `paused_at: <ISO ts>` + `paused_reason:\
  \ <one-line>`.\n\n**Resume protocol:**\n1. AI reads task YAML — finds `paused_at`\
  \ + state fields.\n2. Re-runs Stage 1 (Analysis) — verifies prior context still\
  \ valid.\n3. Re-verifies the `last_verified` artifact (file or event still exists?).\n\
  4. Emits a `task_resumed` event with reference to the prior `task_paused` event.\n\
  5. Continues from the `resume_from` step.\n\n**Auto-pause triggers:** session boundary\
  \ (Build session ends), owner unavailable for a blocking\nquestion >24h, external\
  \ API timeout, audit verdict ABORT.\n\n**Dissonance protocol (Stage 1, per CHARTER\
  \ §Principle 7):** if the AI detects inconsistency between\nartifacts during Analysis,\
  \ halt → file or escalate → resume after resolution. Do not silently choose\nan\
  \ interpretation.\n\n### Hygiene Fast-Path\n**Eligible categories** (skip stages\
  \ 2-3-4-7 — Filing, Plan, Audit-pre, Audit-post):\n\n| Category | Example |\n|---|---|\n\
  | typo | spelling fix in comment / string |\n| formatting | whitespace / indent\
  \ / quote-style normalization |\n| comment_update | comment text edit, no code change\
  \ |\n| dep_bump | single-line dependency version update (no API change) |\n| config_bump_1line\
  \ | single-value config tweak |\n| test_fixture_update | test fixture data refresh\
  \ |\n| regen_generated_code | re-run codegen, commit output |\n| docs_typo | typo\
  \ in markdown documentation |\n\n**Excluded** (use full lifecycle):\n- Multi-file\
  \ mechanical refactor (> 5 files) → full lifecycle, audit-pre catches scope creep.\n\
  - New file creation → full lifecycle, filing required.\n- A change whose diff touches\
  \ a spec file or an always-loaded seed file → full lifecycle, a\n  formatting-only\
  \ or typo-only edit included: LIFECYCLE.md §Two flow types classifies those surfaces\n\
  \  as fast-path INELIGIBLE at any diff size and is the home of that classification\
  \ (read its full\n  surface list there; it is not restated here).\n- A change whose\
  \ diff touches the pinned-test surface — test logic, fixtures and generated data\n\
  \  alike, there is no fixture carve-out — or the project's operating contract →\
  \ full lifecycle\n  (same home, LIFECYCLE.md §Two flow types). `test_fixture_update`\
  \ / `regen_generated_code` stay\n  eligible only for data outside those surfaces.\n\
  - `task close --hygiene-fast-path` REFUSES a diff that touches any of these surfaces,\
  \ naming the\n  paths; the refused set is the governance set SPEC-0178 rule 3 composes,\
  \ read whole. Route: the\n  full lifecycle (`task update --class` to a non-hygiene\
  \ class).\n\n**Fast-path flow:** Analysis → Execution → Commit → Tests → Closure.\
  \ Five stages, not nine. A red\nTests run returns the card to Commit; no audit is\
  \ involved.\n\n### Stage FSM per class — current_stage semantic names\n`current_stage:`\
  \ (QUEUE schema) holds a **semantic stage NAME**, not a number — self-documenting,\n\
  stable across stage-set changes (CHARTER §Principle 5). `class:` implies which stage-FSM\
  \ applies:\n\n| class | stage-FSM (ordered) |\n|---|---|\n| `feature` / `fix` /\
  \ `refactor` / `docs` / `infra` (standard) | Analysis → Filing → Plan → Audit-pre\
  \ → Execution → Commit → Audit-post → Tests → Closure |\n| `hygiene` (fast-path)\
  \ | Analysis → Execution → Commit → Tests → Closure |\n\nThe EXECUTABLE pointer\
  \ row of a claimed card omits Filing (the card is already filed): standard =\nAnalysis,\
  \ Plan, Audit-pre, Execution, Commit, Audit-post, Tests, Closure; hygiene = Analysis,\n\
  Execution, Commit, Tests, Closure. The Analysis → Plan move of a filed card is unchanged.\n\
  \nA future class defines its own FSM row here. `status:` (QUEUE coarse lifecycle:\
  \ ready/in-progress/…)\nand `current_stage:` (within-Build FSM position) are **two\
  \ distinct fields** — the 3 lifecycle\nvocabularies stay 3 (CHARTER §Decision lifecycle),\
  \ no new one.\n\n**`class` is the SOLE Fast-Path eligibility key — and it is changed\
  \ ONLY by a governed verb.**\nBecause `class` selects the stage-FSM row above (and\
  \ whether `task close --hygiene-fast-path` /\n`--batch-close` is admissible), reclassifying\
  \ a task is a journal-marked action, NOT an invisible\nYAML edit: `bin/yitc-v2 task\
  \ update --class <class>` flips `class` and emits `task_reclassified`\n({from_class,to_class}).\
  \ The ungoverned class hand-edit is\n**RETIRED** — the `task update` field-edit\
  \ mode refuses any `--old/--new` change to the top-level\n`class` scalar, routing\
  \ to `--class`. No second risk-judgement axis is added; `class` stays the one key.\n\
  \nThe lifecycle CLI verbs ( — `worktree new --task` (claims: ready→in-progress,\
  \ Analysis),\nthen `task execute/test/plan/commit/close`) do not advance `current_stage`\
  \ by a per-verb SETTER (the 5 legacy setters stay retired). Since the pointer instead\
  \ moves along the ordered row above, on the verb sequence itself — the **POINTER\
  \ axis**, added beside the explicit stage-ENTRY verb, which is UNCHANGED: `stage\
  \ <NAME>` remains the explicit entry and the **SOLE deliverer of a stage BUNDLE**,\
  \ and the claim still sets Analysis. Three moves are admitted, and anything else\
  \ REFUSES exactly as before:\n\n| move | condition | effect |\n|---|---|---|\n|\
  \ `explicit` | `current_stage` already IS the verb's stage | proceed (unchanged)\
  \ |\n| `advance` | the verb's stage is the SUCCESSOR of `current_stage` in this\
  \ class's row | record the move, then proceed |\n| `absorb` | `current_stage` is\
  \ an AUDIT stage (Audit-pre / Audit-post) and the verb's stage is EARLIER in the\
  \ row | record the move, then proceed |\n| `return` | `current_stage` is Tests,\
  \ the verb's stage is Commit, and the task's NEWEST runner-marked governed verdict\
  \ row is a `tests_failed` recorded after its last `commit_landed` | record the move,\
  \ then proceed |\n| `exempt` | `current_stage` is Commit, the verb's stage is Tests,\
  \ and the card matches a declared SPEC-0178 audit-post exemption case (the SAME\
  \ predicate `task close` reads) | record the move, then proceed |\n| (refuse) |\
  \ anything else — a forward SKIP, a backward move from a stage not named above,\
  \ or an absent / numeric-legacy / unrecognized `current_stage` | the stage-correspondence\
  \ refusal, unchanged |\n\nThe `absorb` move models the **mode-(a) absorption cycle**\
  \ (LIFECYCLE §Audit-pre / §Audit-post) — a card legitimately returning to an earlier\
  \ stage to absorb an audit finding — which the FSM previously had no edge for at\
  \ all. It is bounded to a return FROM an audit seam, so backward movement is a modelled\
  \ edge, not a free pointer.\n\n**Scope of the move rules (trial cycle 7).** The\
  \ `return` and `exempt` predicates and the\n(refuse) row govern the POINTER axis\
  \ — the moves a work-verb makes on its own. The explicit\n`stage <NAME>` entry is\
  \ unchanged and is not edge-checked, under either order — except an entry\ninto\
  \ Tests, which takes the audit-post check of §Tests «Position»: a card the pointer\n\
  axis refuses to move from Tests to Commit can still be put there by an explicit\
  \ `stage Commit`.\nFrom there every path still runs through the existing guards\
  \ — a new commit needs the re-ship arm\nits verdict admits and a fresh audit-post,\
  \ and Closure coverage refuses a card whose last\nsubstantive commit has no green\
  \ governed run after it — so the explicit\nentry cannot carry an unaudited or untested\
  \ commit to Closure. One artifact gate does apply to the\nexplicit entry: on the\
  \ standard row, every `stage` entry into a stage after Audit-pre (Execution,\nCommit,\
  \ Audit-post, Tests, Closure), whatever the recorded `current_stage`, requires the\
  \ audit-pre\n`task execute` requires — GREEN or YELLOW and bound to the current\
  \ plan — and a refusal\nnames the route (`audit pre`, or `audit decide` then `audit\
  \ pre --on-decisions` at the ceiling). The\nhygiene row has no Audit-pre and is\
  \ not gated.\n\nWhat does NOT change: the stage CONTRACT (which stage delivers what,\
  \ and what each gates), every readiness precondition (notably the advance-out-of-Analysis\
  \ gate, which runs on the edge BEFORE the pointer is written, so a refusal leaves\
  \ no half-entry), and the refusal itself. A pointer move emits the same `stage_entered`\
  \ event marked with its `from_stage` / `mode` / `advanced_by`, and carries NO `delivered`\
  \ key — it delivers no bundle.\n\n\n\n**`task pick` is a read-only inspector** (\
  \ option B) — the\nclaim moved into `worktree new --task` so it is written in the\
  \ worktree and reaches `main` only via\n`land`; `task pick` no longer mutates. Because\
  \ that claim is UNCOMMITTED in the worktree, a path-scoped `git checkout` of the\
  \ card silently reverts it; the recovery is `bin/yitc-v2 task reclaim T-XXXX` —\
  \ admitted only inside that task's own worktree, with the card still `ready` on\
  \ `main` and no other live worktree holding it, idempotent on an intact claim. It\
  \ is a recovery ENTRY to the one claim path, never a second claim path, and hand-restoring\
  \ `status` / `current_stage` stays forbidden. `current_stage` carries a **stage-ENTRY\
  \ correspondence precondition — it IS read in a\nrefusal path**: a task-bound work-verb\
  \ (`task plan`/`execute`/`test`/`commit`/`close`\n+ `audit pre`/`post`) REFUSES\
  \ when the pointer-move table above admits NO move to its stage — i.e.\n`current_stage`\
  \ neither IS its stage, nor its predecessor on this class's row, nor an audit seam\
  \ it\nis returning from, nor one of the `return` / `exempt` moves above. Run `stage\
  \ <NAME>` explicitly whenever you want that stage's BUNDLE (it remains\nthe sole\
  \ deliverer); you no longer need it merely to satisfy the precondition on the documented\n\
  order. This is an entry/delivery check, **NOT** a\nprogression guard — distinct\
  \ from the stage-counter retired (below); the two coexist. (Refinement — the bespoke\
  \ `task plan --finalize` refusal for the mode-a audit-pre absorption sub-case —\
  \ is **RETIRED by **: the `absorb` edge above represents that return, so the special-case\
  \ refusal is DELETED from `cmd_task_plan`. Unchanged either way: `audit pre` re-fingerprints\
  \ an edited plan and re-verifies it, and an Audit-pre stage reached by a move the\
  \ model does not admit still falls through to the generic stage-correspondence refusal.)\
  \ **\nretired current_stage as a guard**: enforcement is by **artifacts-as-gates**\
  \ (a verb validates its\ninput ARTIFACT exists + matches — the data — e.g. `task\
  \ close` requires the recorded commit + an\naudit-post for it; `task execute` requires\
  \ an audit-pre bound to the plan), NOT a stage counter (that\nwould be a second\
  \ progress-truth — P5 — and drift toward a forbidden workflow-engine FSM, non-goal\n\
  #7). Work-verbs carry no per-verb stage setter: `current_stage` is written at the\
  \ claim, by the\n`stage` verb's explicit entry, and by the pointer move described\
  \ above; each work-verb\nemits its stage event as a side-effect.\n\n## Rationale\n\
  \nThese are NON-gated stages: consulted when ENTERING the stage, never before an\
  \ irreversible\ncontrol-point — so they are stage-DELIVERED (the axis, a lighter\
  \ mechanism) and NO\nfloor-trigger is added here. The real control-point stages\
  \ (4/6/7/9 — Audit-pre, Commit, Audit-post, Closure) deliver via SPEC-0014 /\nSPEC-0015\
  \ / <workshop-spec> and are untouched.\n\n### Order change — the governed test run\
  \ after audit-post (plan `run-the-full-governed-test-stage-after-audit-post-`)\n\
