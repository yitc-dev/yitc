id: SPEC-0101
title: Extension capability — the cross-cutting concept, marker semantics, and derived
  catalog
status: active
created_at: 2026-06-24 06:06:59+00:00
travels: null
consumed: false
implements:
- bin/lib/graph.py#graph_build_index
- bin/lib/graph.py#cmd_graph_query
