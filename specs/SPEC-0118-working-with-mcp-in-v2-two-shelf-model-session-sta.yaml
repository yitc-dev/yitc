body: "## Scenario\n\nA session (the kernel's own, or a consumer's) needs an external\
  \ tool-provider — an MCP server — to\ndo its work: a design backend, a chat service,\
  \ a third-party API surface. It should know, without\nre-deriving per project, HOW\
  \ v2 wants it to connect/use that server, how to keep the connected set\nclean across\
  \ sessions, and what it MUST record when an MCP tool changes the outside world.\
  \ The owner\nsees: a project's always-needed servers are declared once in its committed\
  \ MCP config; a one-off\nserver added for a single need is dropped again at the\
  \ next session-start reconcile; and a\nsubstantive external write through any MCP\
  \ tool leaves a journal line like a deploy does.\n\n## Internal\n\nThe MCP working-discipline\
  \ (the two-shelf model, the session-start reconcile, the delivery axis, the\nterritory\
  \ composition) lives in the pattern `patterns/working-with-mcp-in-v2.md` — the single\n\
  PROVIDER-NEUTRAL home (SoT; this spec does NOT restate it — CHARTER §P5). The concrete\
  \ provider\ncommands live separately in a per-client `class: adapter` MCP runbook\
  \ (e.g.\n`patterns/claude-code-mcp-runbook.md`) — NOT a governance source (CHARTER\
  \ §P4b). This spec is that\npattern's RETRIEVAL-DELIVERY contract: it binds the\
  \ delivery so `graph build` surfaces the discipline\nat the two moments it is needed\
  \ (the SPEC-0013 binding contract; plan-check finding #1's two delivery\nmoments):\n\
  \n- **`binding: [seed]`** → the **session-start** delivery, carrying the pattern's\
  \ §session-start\n  reconcile. Because the `binding:[seed]` `_seed_howto` echo is\
  \ a `session start` output evicted by a\n  `/compact` (and `session start` is NOT\
  \ re-run), the concrete post-`/compact` re-delivery surface is\n  the explicit pointer\
  \ in **AGENTS.md §After-/compact** (\"MCP session-start reconcile re-delivery\"\
  ).\n- **`binding: [before-mcp-use]`** → the **connect/use** floor trigger, carrying\
  \ the pattern's\n  §two-shelf model / §delivery axis. Before a session registers\
  \ or uses an MCP server the\n  floor-trigger-map row points it at this spec → the\
  \ pattern; that row re-delivers via the re-readable\n  `graph/floor-trigger-map.md`.\n\
  \nBeyond the one design-backend capability rule stated in §Design-backend capability\
  \ below, this spec\ncarries NO governance rule of its own — the rules (the two-shelf\
  \ model, the reconcile, the capture\nobligation, the delivery axis, the territory\
  \ composition) live ONLY in the pattern sections named\nabove, and the capture floor\
  \ in SPEC-0116 (P5 — no restatement here, so nothing can drift beside the\npattern\
  \ + the AGENTS re-delivery pointer). Read `patterns/working-with-mcp-in-v2.md` for\
  \ the rules.\n\n## Design-backend capability (provider-neutral rule)\n\nA design\
  \ backend has two project types — a reusable **design-system catalog** and a concrete\n\
  **screen design-project canvas**. They are NOT served by the same tool:\n\n- The\
  \ **design-system catalog** round-trips (read + write) through the **built-in /\
  \ harness-native\n  design-sync tool** — no separately-declared design MCP is required\
  \ for that side.\n- The **screen design-project canvas** does **NOT** round-trip\
  \ through the built-in tool. Its\n  round-trip **REQUIRES the declared design MCP\
  \ capability** — an explicitly connected design-backend\n  MCP server (a `before-mcp-use`\
  \ connect, this spec's floor). A session that needs to pull or write a\n  *screen*\
  \ MUST connect that declared design MCP; the built-in tool alone does not reach\
  \ it.\n\nThis rule is stated **provider-neutrally** (CHARTER §Principle 4b — the\
  \ normative text names no\nprovider). *Current implementation facts (non-normative):*\
  \ the built-in tool is **DesignSync**, the\ndeclared design MCP is **`claude_design`**\
  \ (`api.anthropic.com/v1/design/mcp`), both authed via\n**`/design-login`** — named\
  \ as facts, not as the rule. Full discipline + the capability matrix +\nprovenance\
  \ (owner-verified on <project>, cross X-0230, correcting the earlier X-0136 «one\
  \ built-in\ntool covers both types» claim) live in `patterns/design-tool-roundtrip.md`\
  \ §capability matrix.\n\n## Parameters\n\nNone consumed. The binding tokens (`before-mcp-use`,\
  \ `seed`) are the delivery contract, not a\ncode-read scalar — so `consumed: false`.\n\
  \n## Rationale\n\nReal incident: a <project> session wrote a correction into design-project\
  \ `c95f02ff` via the\nharness-native DesignSync tool (2026-06-30) and v2 had no\
  \ documented stance on connecting/using\nexternal tool-providers, nor on capturing\
  \ an MCP-mediated external write (cross X-0138/X-0139). This\nspec is the delivery\
  \ vehicle for that stance; the governance prose is the pattern. Prior-art for the\n\
  delivery SHAPE: SPEC-0100 (a thin floor-binding spec fronting the behavioral-baseline-defaults\n\
  pattern). Deliberation + rejected alternatives (a coded reconcile verb, a dedicated\
  \ MCP verb) live in\nthe proposing plan `external-system-interaction-governance-capture-doc`,\
  \ not here.\n\n## Verification\n\n- **Floor delivery:** after `graph build`, `graph/floor-trigger-map.md`\
  \ carries a `before-mcp-use`\n  row resolving to `SPEC-0118` (once active); `grep\
  \ 'before-mcp-use' graph/floor-trigger-map.md`.\n- **Seed delivery (post-/compact\
  \ survival):** `bin/yitc-v2 session start` echoes the `binding:[seed]`\n  general-verb\
  \ seed line naming `SPEC-0118` (the reconcile pointer). Because that echo is evicted\
  \ by a\n  `/compact` and `session start` is NOT re-run, the concrete post-/compact\
  \ re-delivery surface is the\n  explicit pointer in **AGENTS.md §After-/compact**\
  \ (\"MCP session-start reconcile re-delivery\") — grep\n  `before-mcp-use` / `SPEC-0118`\
  \ in AGENTS.md. (The floor CONNECT/USE half re-delivers via the\n  re-readable `graph/floor-trigger-map.md`\
  \ row.)\n- **Provider-neutrality (CHARTER §P4b):** the pattern `patterns/working-with-mcp-in-v2.md`\
  \ normative\n  text contains NONE of {`the AI provider mcp`, `the AI tool`, `/mcp`,\
  \ `.mcp.json`, `~/<provider-config>.json`} — those\n  live ONLY in the `class: adapter`\
  \ runbook.\n- **Capture composition:** a substantive MCP-mediated external write\
  \ emits a SPEC-0116\n  `external_action` event (probed there, not duplicated here).\n"
