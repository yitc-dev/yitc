seed_cue: 'Before your first MCP connect or use in a session (not at session start),
  list the MCP servers connected to the session and compare them with the standing
  set, which is the project-scope MCP config file committed in the repo (no such file
  = an empty standing set): report each extra server to the person rather than disabling
  it yourself, and name a connector the host or account provides «host-provided, not
  project-declared», never a stray one-off.'
