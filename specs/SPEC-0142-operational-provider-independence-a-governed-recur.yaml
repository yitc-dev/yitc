  - **(rule active)** `bin/yitc-v2 graph query SPEC-0142` → `status: active` with a closed `activation_owner_task`.
  - **(delivered)** after activation, SPEC-0142 appears in `graph/floor-trigger-map.md` under
    `before-scheduling-a-cadence`.
  - **(adoption — Done=Adopted)** the first cadence setup after activation (the security cadence,
    X-0216/0217) CITES SPEC-0142 and lands on an OS trigger + deterministic script — a
    `consumer_read_evidence` / adoption event.
  - **(sweep complete)** §6 register classifies every in-scope governed cadence and every VIOLATION names
    a task id / existing owner (no prose-only) — checkable by reading §6 against the crontab + cadence layers.

