body: |
  ## Scenario
  While a brownfield migration is under way, "migrating the methodology" must not silently become
  "changing the product." So while a migration-window plan is `executing`, dispatching a card that
  touches PRODUCT code refuses unless the owner has explicitly authorized THAT card. The owner sees a
  refusal that names the exact token to add; nothing product-touching ships in a migration window
  without their say-so.

  ## Internal
  - **Window carrier (existing FSM — no new marker/ledger; SOURCE-AGNOSTIC):** the migration window IS
    an active brownfield-onboarding plan in `executing` (the `real-project-integration-onto-v2-phased-migration-`
    class / runbook Branch B). The window is defined by the TARGET (onboarding onto v2), NOT the source
    methodology — so it covers a migration from YITC v1, from a different methodology, OR from pure
    vibe-coding (a vibe-coded project onboarding is still a Branch B brownfield migration; the gate is
    most valuable there, no test safety net). No separate window flag — the plan's own status is the window.
  - **Owner-ack carrier (existing parser):** a per-card OPTIONAL field
    `product_dispatch_owner_ack: <ref>` set via the EXISTING `task update` route — reuses the
    cross-request kind:task owner-gate shape, no new gate cascade.
  - **PRODUCT-touch test (mechanical, fail-closed):** a card whose `expected_touch` reaches any path
    OUTSIDE the governance/docs path set (tasks/ specs/ decisions/ plans/ patterns/ lessons/
    scenarios/ *.md graph/ events.jsonl) is product-touching. When in doubt → product-touching.
  - **The gate:** while a migration-window plan is `executing`, `dispatch` of a product-touching card
    REFUSES unless it carries `product_dispatch_owner_ack:`. Out of a window, or for a
    governance-only card, unchanged. Report-with-the-fix: the refusal prints the exact token to add.

  ## Rationale
  aiseller 2026-07-13: two imported PRODUCT cards ( CSRF) were dispatched inside what the
  owner understood as a migration/revizia context; the CSRF one took prod auth down. The owner's
  expectation "a migration does not touch product code" was encoded nowhere. This gate encodes it.
  Full design: plan `migration-import-safety-provenance-marker-premise-`. Origin cross X-0372.

  ## Verification
  Differential pinned test: with a migration plan `executing`, dispatch of a synthetic
  product-touching card REFUSES without the ack and SUCCEEDS with it; a governance-only card is
  unaffected; out of a window the product card dispatches freely.

