body: "## Scenario\n\nA v2 session — an interactive Controller OR a dispatched Worker,\
  \ under ANY provider harness — gets a\nstable, unique session id and every later\
  \ `bin/yitc-v2` call (each its own short-lived OS subprocess)\nresolves the SAME\
  \ id **without v2 reading any PROVIDER-specific environment variable** at resolution\n\
  time (the interactive agent DOES carry v2's OWN `YITC_SESSION_REF` — harness-unavoidable\
  \ under a headless\nharness with no shared provider-neutral locus — but that is\
  \ a v2-minted, v2-named uuid, NOT provider\ncoupling; option-A, external consult\
  \ 2026-07-06). A `land` verify run never inherits the launching\nsession's identity.\
  \ Concretely the owner sees: a dispatched worker resolves from its launcher-frozen\
  \ id\nwith no provider var; a MISSED interactive carry no longer lands under a provider\
  \ key (it degrades to the\nrecord or fails closed — the retired X-0158 bug); a dispatched\
  \ worker lands with no session-ref-leak\nfalse-RED; and each of N parallel siblings\
  \ carries its OWN id.\n\n**Why it matters (discipline-control framing, owner-asked\
  \ 2026-07-06):** this identity is the load-bearing primitive of V2 *discipline control*\
  \ — one-claim-per-task (the worktree stamp), chain-of-custody (every governed event\
  \ keyed on `session_ref`), the epoch-scoped read-gate/seed receipts, dispatch isolation,\
  \ and verify honesty ALL key on it. That is WHY it must be v2-owned + provider-agnostic\
  \ (CHARTER §4b) and cannot hang off a provider id scheme: swap the provider and\
  \ the control must not collapse. Full narrative: plan `provider-agnostic-session-identity-v2-owned-launch`\
  \ §Postcheck soak narrative.\n\n**What this contract actually DELIVERS (the honest\
  \ benefit framing —, after the Option-A amendment).** Four things, all shipped and\
  \ probed: (1) **provider-neutrality** — no PROVIDER env-var name anywhere in the\
  \ resolution path (Rule 4/8), so swapping the harness cannot break v2's discipline\
  \ control; (2) **fail-closed safety** — a MISSED or unbacked carry degrades to the\
  \ record or REFUSES, never landing a receipt under a foreign/provider key (Rule\
  \ 2.1 bound + Rule 5; the X-0158 class retired); (3) **fan-out distinctness** —\
  \ each dispatched sibling carries its OWN minted id, so the own/foreign stamp distinction\
  \ survives concurrency (Rule 7; the collision repaired for workers); (4) **verify\
  \ isolation** — a `land` verify box never inherits the launcher's identity (Rule\
  \ 6; `fu_54c5905adf9f` closed).\n\n**NOT delivered — and never claim it: \"no manual\
  \ carry\".** An interactive session STILL carries `YITC_SESSION_REF` explicitly\
  \ on every call: `environ(7)` forbids a child exporting into its parent, and under\
  \ a headless harness there is no provider-neutral shared locus to rediscover from\
  \ (external consult `session-identity-harness-locus-fork`, 2026-07-06). The carry\
  \ is bounded and SAFE, not eliminated; the zero-carry goal is DEFERRED to the successor\
  \ plan `interactive-session-identity-via-locus-snapshot-va` (Variant B). Any prose\
  \ here or in the plan claiming manual carry is retired is an OVERCLAIM.\n\n## Internal\n\
  \nThe identity of a v2 session is a **rediscoverable v2-OWNED RECORD**, never an\
  \ env carrier read at\nresolution and never an upward env push from a child process.\
  \ The industry-universal shape (git\nworktrees rediscover `cwd →.git/worktrees/<id>/`;\
  \ systemd rediscovers `INVOCATION_ID` from a cgroup\nxattr because env can be overwritten\
  \ and the persisted store cannot) and an EXISTING v2 analog (the\n per-worktree\
  \ stamp) both point here — this GENERALIZES the stamp, it does not invent a new\
  \ store.\n\n### Rule 1 — Source of truth = a v2-owned session record, found by REDISCOVERY\n\
  `bin/yitc-v2 session start` MINTS a random id (uuid4-class) and PERSISTS it to a\
  \ v2-owned record; every\ngoverned verb resolves its id by REDISCOVERING that record\
  \ — NOT by reading an env carrier. Minting is\neasy; **rediscovery is the crux**\
  \ — the hard part is a later provider-blind process finding WHICH record\nis its\
  \ own (§Rule 2). Because a child cannot mutate its parent's environment (`environ(7)`\
  \ — a law of\nphysics), identity MUST live in a record; the pre-SPEC-0137 mint-and-carry\
  \ convention tried to work\naround this with a manual re-export as the SOLE identity\
  \ path — an UNBACKED carry with no record behind\nit — and produced the X-0158 startup-refusal\
  \ class. What this contract retires is that FRAGILITY, NOT the\ncarry itself: the\
  \ agent STILL carries the v2-own `YITC_SESSION_REF` per call (bounded selector-1,\
  \ Rule 2;\nRule 8a), and the record + fail-closed keyer make a MISSED carry safe\
  \ instead of drifting. **Persistence is ATOMIC**\n(temp + rename) so a concurrent\
  \ reader never sees a half-written record, and the resolver TOLERATES a\ncorrupt/foreign\
  \ file in the record dir by SKIPPING it (never wedged by one bad file — trial finding\
  \ P11).\n**CLOSED record schema (anti-creep, gate-trial F4 / plan-check F3):** a\
  \ runtime record's ONLY permitted\nfields are `session_id`, a `pid` (liveness/locus\
  \ discriminator), `locus_key`, optional `provider_meta`\n(forensic-only, Rule 2.5),\
  \ an optional `provider_session_id` (forensic-only, Rule 2.5 — the provider's\n\
  OWN session id, which NAMES the transcript; see the transcript-join paragraph in\
  \ Rule 4), and an\noptional `isolated_verify` marker (Rule 6). ANY other session\
  \ state is\nFORBIDDEN — this is an identity record, NOT a general session-state\
  \ store, NOT a durable corpus, and adds\nno journal expansion.\n**Bootstrap exemption\
  \ + fail-closed-without-a-record (session-start-skipped defense).** `session start`\n\
  is the SOLE bootstrap verb: it resolves-or-MINTS WITHOUT a pre-existing record (it\
  \ is the record's\nwriter). EVERY OTHER governed verb REQUIRES the record — with\
  \ no record for its locus it FAILS CLOSED\n(Rule 5), AND the read-gate (SPEC-0050:\
  \ the `session_started` anchor + the epoch seed-receipt, emitted\nONLY by `session\
  \ start`) independently REFUSES. So a SKIPPED `session start` cannot proceed: there\
  \ is NO\nprovider-carrier fallback to resolve an id under (the retired PROVIDER-carrier\
  \ fallback, Rule 8), and the\nverb refuses, pointing the user to run `session start`.\
  \ NO chicken-and-egg: `session start` is exempt\nprecisely because it CREATES the\
  \ record; a mid-session record loss (e.g. XDG cleared) fails the next\nverb closed\
  \ → re-run `session start` → the id re-mints. This is STRONGER than the pre-SPEC-0137\
  \ design,\nwhose provider fallback let a verb resolve an id with no `session start`\
  \ and land the receipt under a\ndrifting key — the X-0158 cause.\n\n### Rule 2 —\
  \ Rediscovery selector order (normative vs diagnostic) [gate-specs finding 1]\n\
  A resolving process locates its record by trying, IN ORDER, this ENUMERATED selector\
  \ set. The record's\nown-id match is the identity; the other selectors only NARROW\
  \ which record:\n1. **v2-own carried session ref — BOUNDED (NORMATIVE, highest;\
  \ option-A amendment 2026-07-06)** — a\n   v2-MINTED, v2-NAMED ref the agent carries:\
  \ a Worker's frozen `YITC_EXPECTED_SESSION_REF` (launcher-\n   assigned, self-checked\
  \ —, unchanged) OR the interactive `YITC_SESSION_REF` self-ref. Carrying\n   v2's\
  \ OWN uuid is provider-NEUTRAL — NOT the coupling Rule 4 removes — and it is the\
  \ ONLY stable\n   provider-neutral session anchor under a HEADLESS harness (measured\
  \ 2026-07-06: no controlling tty;\n   each CLI call is its own subprocess with its\
  \ own sid; the sole stable shared ancestor is the provider\n   process, provider-specific\
  \ to identify → pure locus-rediscovery is NOT provider-neutrally achievable\n  \
  \ for the interactive phase; external consult `session-identity-harness-locus-fork`).\
  \ **BOUND (consult\n   finding F4):** a carried ref is honored ONLY when BACKED\
  \ by live v2-owned evidence — a live v2 record\n   for that id OR a current-epoch\
  \ `session_started`/read-gate anchor for it; an UNBACKED carried ref\n   (stale/foreign/typo)\
  \ does NOT silently win — it falls through to the record selectors and, absent a\n\
  \   match, FAILS CLOSED (Rule 5). This is why the carry is SAFE where the retired\
  \ UNBACKED mint-and-carry (a carry with no record behind it — the fragility Rule\
  \ 8a retires, NOT the carry itself) was not:\n   a miss no longer lands under a\
  \ provider key (the X-0158 bug), it degrades to the record or fails closed.\n2.\
  \ **Worktree gitdir locus** (NORMATIVE) — inside a `task/T-XXXX` or `work/<slug>`\
  \ worktree, the record\n   is the stamp in that worktree's private gitdir (`.git/worktrees/<name>/`).\
  \ A per-instance\n   locus by construction; never keyed on cwd content.\n3. **Runtime-record\
  \ id in `XDG_RUNTIME_DIR/yitc/`** (NORMATIVE) — the pre-worktree interactive READ\n\
  \   phase on the shared main checkout; keyed by a per-session-id SUBKEY (the dir\
  \ is per-USER, 0700,\n   local FS, auto-cleared on logout), with a recorded PID\
  \ for liveness. NEVER keyed on cwd.\n4. **Liveness prune — recorded PID (MANDATORY,\
  \ intrinsic)** — every runtime record carries the\n   minting session's PID; the\
  \ resolver prunes DEAD records (signal-0 liveness) BEFORE any ambiguity\n   is declared.\
  \ This is not optional: a crashed/abandoned session leaves a stale record, and without\n\
  \   intrinsic pruning that stale record would wedge a new session in the same locus\
  \ with a false\n   ambiguity (trial finding P9, 2026-07-05). The session-leader/tty\
  \ is the locus_key (selector 3's\n   narrowing key), not a separate identity.\n\
  5. **Provider birth metadata — FORENSIC / recovery ONLY, OFF the resolution chain**\
  \ — the provider id,\n   if present at birth, is folded into the record for recovery/forensics;\
  \ it is NEVER consulted at\n   resolution. Using stored provider_meta as a LIVE\
  \ disambiguator would require reading THIS process's\n   provider env var at resolution\
  \ — the exact coupling Rule 4 bans — so it is deliberately off the\n   selector\
  \ chain; its total absence changes nothing (trial finding P10, 2026-07-05).\nSelector\
  \ 1 (the BOUNDED v2-own carry) resolves first WHEN backed by live v2 evidence; else\
  \ selectors 2–3\n(records) + the mandatory liveness prune of 4; selector 5 is forensic-only.\
  \ A backed carry, or exactly\none LIVE record, is the id. No backed carry AND zero/ambiguous\
  \ record match → Rule 5 (fail-closed).\n\n**Two-role scope — GOVERNANCE-KEYING resolution\
  \ (fail-closed) vs EVENT-ENVELOPE stamping (best-effort)\n[, external consult `t10149-emit-vs-keying-resolution-split`\
  \ YELLOW].** The fail-closed rediscovery\ncontract of this Rule (and the Rule-4\
  \ provider-free grep-probe) governs **governance-KEYING** resolution\n— `_resolve_session_ref`,\
  \ whose result KEYS a governance decision: the read-gate anchor/seed-receipt\nmatch\
  \ (`_require_reads`), the worktree-stamp own-check (`_stamp_is_own` / `_write_worktree_stamp`),\n\
  aspect-audit. There \"who am I, provably\" MUST be bounded — an unbacked/ambiguous\n\
  identity fails closed, never guesses. It does NOT govern **event-envelope STAMPING**:\
  \ `_append_event`\nfills every journal line's `session_ref` provenance field, and\
  \ an emit is append-only provenance that\nMUST NEVER be lost or blocked. So `_append_event`'s\
  \ DEFAULT resolves via a SEPARATE best-effort resolver\n`_resolve_session_ref_for_envelope`\
  \ that NEVER fails closed (frozen/expected → the raw v2-own self-ref\ncarry — the\
  \ caller's DECLARED identity, honored for a stamp even when unbacked → the non-dying\
  \ rediscovery\nresult for a carry-less process → an `unresolved` sentinel). This\
  \ carry precedence DELIBERATELY differs\nfrom the keyer: for KEYING an unbacked\
  \ carry must NOT win (the X-0158 fix); for a PROVENANCE stamp the\ncarried self-ref\
  \ IS the honest identity. The envelope resolver is\n**provider-free** too (it never\
  \ consults a provider carrier — no second provider-coupled surface), so a\nstamped\
  \ `session_ref` is at worst a v2-own best-effort value or `unresolved`, NEVER a\
  \ provider id. A\nbest-effort stamp is **explicitly non-authoritative**: no governance\
  \ consumer keys off a `session_ref`\nread back FROM an event line — the keying consumers\
  \ above resolve LIVE via `_resolve_session_ref`, so a\nbest-effort stamp cannot\
  \ become a parallel identity path. The transcript AUTO-SYNC's current-session\n\
  resolve (`_journal_sync` on every verb) is likewise best-effort — it only LOCATES\
  \ a transcript and\nfail-safes to INERT when none is found, so it too resolves via\
  \ the envelope resolver and never fails\nclosed a bootstrap/unbacked session (the\
  \ explicit `journal sync --session-ref <id>` recovery path passes\nits ref explicitly\
  \ and keeps its own fail-closed-on-missing-log contract).\n**Best-effort is not\
  \ the same as INERT-BY-CONSTRUCTION.** Under Rule 1 a fresh interactive\nsession's\
  \ identity is a MINTED uuid, which by construction names NO transcript — so for\
  \ EVERY\ninteractive Controller, in every home, that current-session resolve found\
  \ none and the auto-sync\nmaterialized nothing at all, leaving every real owner\
  \ turn to be hand-emitted. A fail-safe that can\nnever succeed is a dead path, not\
  \ a graceful one. So on the IMPLICIT resolve ONLY — and only after the\nv2 identity\
  \ has failed to name a transcript — the locator retries with the ref that DOES name\
  \ one, per\nthe transcript-join role in Rule 4. On a hit, the sync keys its checkpoint\
  \ on the ref that LOCATED the\ntranscript, so the implicit path and the explicit\
  \ `--session-ref <provider id>` recovery path share ONE\ncursor over that file rather\
  \ than keeping two. The explicit-ref contract, its fail-closed\n`--session-ref`\
  \ diagnostic, and the no-transcript-yet 0-row return are all UNCHANGED, and a session\n\
  with neither a live carrier nor a recorded provider id still returns 0 without dying.\
  \ **Gate-bearing emits are the exception that\nproves the rule:** an emit that WRITES\
  \ read-gate evidence (the `session_started` anchor, the seed-read /\n`--help` fetch\
  \ receipts) passes an EXPLICIT strict/bootstrap `session_ref` — never the best-effort\n\
  default — so the evidence the keyer later matches is written under the same authoritative\
  \ id (Rule 1\nbootstrap-exemption: `session start` is the record's writer and stamps\
  \ its own anchor under the resolved\nid). This split is why the fail-closed rewrite\
  \ does not break the universal emit path.\n\n### Rule 3 — Identity-state precedence\
  \ & sync (which record is authoritative per phase) [finding 2]\nThere is ONE logical\
  \ identity per session, physically homed by lifecycle phase — NOT two competing\n\
  truths:\n- **pre-worktree (interactive read phase)** — the `XDG_RUNTIME_DIR/yitc/<id>`\
  \ runtime record is\n  authoritative. Created by `session start`.\n- **write phase\
  \ (in a worktree; Worker or self-executing Controller)** — the worktree stamp is\n\
  \  authoritative for that worktree; it is CREATED at `worktree new` and CARRIES\
  \ the same id (the runtime\n  record's id, or the frozen `expected` for a dispatched\
  \ worker). The worktree stamp is a PROJECTION of\n  the one identity into the write\
  \ locus, not a second id.\n- **sync + mismatch** — `worktree new` writes the stamp\
  \ from the resolving session's id, so the stamp\n  and the runtime record agree\
  \ by construction. If a resolver finds a worktree stamp whose id disagrees\n  with\
  \ a frozen `expected` (Rule 2.1), that is the FOREIGN/un-stamped case the existing\
  \ startup contract\n  already BLOCKS (\"already held by session X\") — it is surfaced,\
  \ never silently reconciled or guessed.\n\n### Rule 4 — No PROVIDER var at resolution\
  \ (the v2-own self-ref is KEPT); provider id = optional BIRTH metadata only; anti-regrowth\n\
  Ordinary verbs read only v2-OWNED state. The runtime precedence chain of **PROVIDER\
  \ carriers**\n(`<provider-session-env>` / `CODEX_THREAD_ID` in `SESSION_IDENTITY_REGISTRY['env']`)\
  \ is REMOVED from\nresolution — that was the coupling + the X-0158 drift. This is\
  \ NOT env-purism: the **v2-OWN self-ref**\n(`YITC_SESSION_REF`, a v2-minted v2-named\
  \ uuid) is KEPT as the bounded selector-1 (Rule 2) — carrying\nv2's own id is provider-neutral,\
  \ and under a headless harness it is the only provider-neutral session\nanchor (external\
  \ consult `session-identity-harness-locus-fork`, 2026-07-06). At `session start`/reattach\
  \ the\nprovider env id, IF present, is folded into the record ONLY as recovery/forensic\
  \ metadata (Rule 2.5 —\nNEVER a live resolution selector), and DEGRADES GRACEFULLY\
  \ to a freshly-minted uuid when absent. **Anti-regrowth (bound):** any\nprovider-specific\
  \ env NAME lives ONLY inside a removable, non-normative adapter that can be deleted\n\
  without changing resolution — it MUST NOT reappear in the resolution path, so this\
  \ cannot regrow the\nretired provider-precedence registry. (The SEPARATE transcript-join\
  \ / context-epoch role of the\nprovider carriers — `PROVIDER_CARRIERS` → the `~/<provider-config>/.../<id>.jsonl`\
  \ transcript path — is UNAFFECTED;\nthat is a diagnostic join key, never the identity,\
  \ and this spec does not touch it.)\n**The transcript-join role, named explicitly\
  \ — a NON-identity role, and the ONLY one.** The\nprovider session id is used for\
  \ exactly one thing: NAMING the transcript file, for the forensic\njournal-sync\
  \ join and the context epoch. It is read from the live provider carrier, else from\
  \ the\n`provider_session_id` recorded on the runtime record at birth (the Rule-2.5\
  \ forensic capture above, one\nfield over from `provider_meta` and consumed the\
  \ same way — v2 STATE, not the live env, so a verb that\nno longer carries the provider\
  \ var still joins). NEITHER source is ever consulted by identity\nresolution: `_resolve_session_ref`\
  \ is provider-free, the resolution registry carries no provider\ncarrier, and a\
  \ session whose provider id is absent resolves EXACTLY as before. The bound is what\
  \ makes\nthis safe to state: a role that only names a FILE cannot become a resolution\
  \ selector, because nothing\nin the resolution path reads it — so recording the\
  \ id does not reopen the coupling this rule removed.\n\n### Rule 5 — Ambiguity /\
  \ absence → FAIL-CLOSED [finding 1, the hard corner]\nWhen rediscovery finds MULTIPLE\
  \ live records for one locus and NO distinct selector (the genuinely-hard\ncorner\
  \ — two provider-free, tty-less sessions in ONE cwd), the resolver REFUSES with\
  \ a clear diagnostic\n(\"multiple live session records for this cwd — supply a selector\
  \ / open a worktree\") and NAMES the\nenumerated selectors it tried. It NEVER guesses\
  \ and NEVER cross-credits a read-gate receipt. This corner\nis UNREACHABLE by any\
  \ WRITE (writes are worktree-isolated → Rule 2.2 gives a per-instance locus) and\
  \ is\nconfined to the headless/cron/orchestrator read-phase niche.\n\n### Rule 6\
  \ — Verify hermeticity: targeted identity-carrier SCRUB (NOT default-deny) [finding,\
  \ C5]\n**What SHIPPED is a targeted identity-carrier SCRUB — there is no default-deny\
  \ `env=` allowlist anywhere\nin this contract or in the code.** State it plainly\
  \ up front, because the earlier default-deny phrasing\nin this rule's neighbourhood\
  \ was read as incoherent against the shipped scrub TWICE in one window\n(`deviation_captured`\
  \ × 2, fingerprint `spec0137-rule6-defaultdeny-vs-scrub-coherence`,\n +; triage-promoted\
  \ as `fu_3bf5ba9f4e0b`). This rule text is now\nreconciled to the code; §Rationale's\
  \ Bazel line is a SURVEYED prior-art citation, deliberately NOT the\nadopted design\
  \ (see there).\n\nThe `land` verify harness (`_run_verify_tests` → `_hermetic_child_env`,\
  \ `bin/lib/worktree.py`) makes each\nNON-real-store test box HERMETIC TO THE LAUNCHER'S\
  \ IDENTITY:\n- it SCRUBS the launcher's identity carriers from the box env — the\
  \ DERIVED UNION `_SUBENV_SCRUB_CARRIERS`\n  (= `SESSION_IDENTITY_REGISTRY['env']`\
  \ / `SESSION_REF_ENV_VARS` **plus** the provider transcript\n  carriers `PROVIDER_CARRIERS`)\
  \ — and the frozen `YITC_EXPECTED_SESSION_REF` worker contract var. Scrubbing\n\
  \  the PROVIDER carriers too is what makes the box CURRENT-EPOCH anchored (no inherited\
  \ provider transcript\n  ⇒ `_session_epoch` = 0, matching the box's own receipt);\
  \ deriving the union from the registry keeps ONE\n  scrub SoT, so the Rule-8b registry\
  \ collapse could not silently weaken it;\n- it MINTS a fresh v2-owned `YITC_SESSION_REF`\
  \ for the box and SEEDS the box journal under it\n  (`session_started` + a `cli:seed`\
  \ receipt), so the fail-closed keyer resolves the box's OWN backed id\n  (Rule 2\
  \ selector 1), never the launcher's leaked one.\nResolution ALSO honors a v2-owned\
  \ `isolated-verify` scenario ref (`YITC_ISOLATED_VERIFY`) the resolver\nchecks BEFORE\
  \ probing any record (the runtime-record `isolated_verify` marker, Rule 1), so a\n\
  genuinely-NESTED verify with no driven ref of its own can still own its scenario\
  \ identity. **Honest status\nof that leg: it is a RESOLVER HOOK with no producer\
  \ today** — nothing sets it per-box, deliberately (a\nper-box setter would override\
  \ a test that drives its own ref, since the hook resolves before record\nprobing),\
  \ and its intended setter task was merged/wont-done. The hook is dormant, not;\n\
  hermeticity is delivered by the scrub + fresh backed mint above, which is what the\
  \ probes verify.\n\n**Why targeted and not default-deny (the proportionality call,\
  \ CHARTER §Principle 1).** Default-denying\nthe execution env the ~493-test suite\
  \ legitimately depends on (PATH/HOME/XDG/git/LANG/…) is\ndisproportionate blast\
  \ radius. The strength tradeoff is stated honestly: a FUTURE leaking identity carrier\n\
  is covered ONLY by being added to the canonical carrier registry (the single scrubbed\
  \ SoT — adding a\ncarrier there auto-flows into the scrub) + a regression test,\
  \ NOT by a blanket allowlist. Note the box is\nnonetheless hermetic on the OTHER\
  \ axes by construction (<workshop-spec> Rule 1: a private HOME / TMPDIR / XDG_*\
  \ /\ngit-config + a quarantined default journal per box) — the \"no allowlist\"\
  \ statement is scoped to the\nIDENTITY-carrier surface this rule owns. `_REAL_STORE_ALLOWLIST`\
  \ boxes are the explicit exception (they\nkeep the launcher carriers + real journal\
  \ to assert against the running session's ambient anchor). This is\nSTRONGER than\
  \ the prior EXPECTED-only scrub (which left the identity CARRIERS intact, leaking\
  \ the launcher\nid once the keyer became carrier-precedence-first + fail-closed).\
  \ CLOSES `fu_54c5905adf9f` (the systemic\nverify identity leak) and ends the `test_t0860`\
  \ / `test_t9755`→`test_t10116` false-RED class.\n\n### Rule 7 — Dispatch launch\
  \ fast-path degrades to rediscovery\nWhere v2 OWNS launch (`dispatch.py` already\
  \ sets the worker's frozen `expected` id), setting the v2 id at\nlaunch is a legitimate\
  \ OPTIMIZATION — but it is never the source of truth: it MUST degrade to rediscovery\n\
  (Rule 1) whenever launch control is absent (interactive provider harnesses, direct/IDE/CI\
  \ invocation —\nthe common case: direnv no-ops in non-interactive shells, tmux panes\
  \ go stale, system units start from a\nclean env). The launch-set id is Rule 2.1's\
  \ frozen `expected`; nothing new is stored.\n\n### Rule 8 — Retirement (what this\
  \ contract REMOVES) [finding 4, build order]\nOn activation this contract RETIRES:\
  \ (a) the **FRAGILITY** of mint-and-carry — NOT the v2-own carry\nitself (option-A\
  \ amendment 2026-07-06): the interactive agent STILL carries the v2-own `YITC_SESSION_REF`\n\
  (provider-neutral, Rule 2 selector-1), but a MISSED/unbacked carry is now SAFE —\
  \ the record + fail-closed\n(Rule 5) degrade it to rediscovery or refuse, never\
  \ landing under a provider key (the retired X-0158\nfailure mode); (b) the **runtime\
  \ precedence chain of PROVIDER carriers**\n(`<provider-session-env>`/`CODEX_THREAD_ID`)\
  \ in `SESSION_IDENTITY_REGISTRY['env']` — removed from\nresolution; provider vars\
  \ demoted to at-most Rule-4 birth metadata; (c) the **per-provider coupling**\n\
  (hardcoded provider env-var names + the present-and-stable assumption in the resolution\
  \ path) — restoring\nCHARTER §Principle 4b. Build order (the ordered task cut,\n\
  finding 4): identity-record contract → resolver/rediscovery + records → verify hermeticity\
  \ → dispatch\nfast-path → retire the mint-and-carry FRAGILITY + the provider precedence\
  \ chain (the v2-own carry is KEPT — Rule 8a) → trial + postcheck.\n\n## Parameters\n\
  \n| param | value | consumed | note |\n|---|---|---|---|\n| runtime record home\
  \ | `$XDG_RUNTIME_DIR/yitc/<session-id>` | false | 0700, local FS, auto-cleared\
  \ on logout/reboot; per-session-id subkey + recorded PID |\n| runtime record home\
  \ (XDG unset) | `${TMPDIR:-/tmp}/yitc-<uid>/` (0700, per-uid) | false | fallback\
  \ when `$XDG_RUNTIME_DIR` is unset (headless/cron/non-login); SAME closed schema\
  \ + a staleness sweep prunes dead-PID records (no logout auto-clear there) |\n|\
  \ write-phase record | `.git/worktrees/<name>/yitc-session-stamp.json` | false |\
  \ the projection of the one identity into the write locus |\n| verify box identity\
  \ scrub | the derived carrier UNION `_SUBENV_SCRUB_CARRIERS` (= `SESSION_IDENTITY_REGISTRY['env']`\
  \ + the `PROVIDER_CARRIERS`) + `YITC_EXPECTED_SESSION_REF` | false | Rule 6; targeted\
  \ identity-carrier SCRUB (there is NO default-deny env allowlist), applied per non-real-store\
  \ box + a fresh backed `YITC_SESSION_REF` minted and journal-seeded; the carrier\
  \ set is code-homed (the registry SoT), not a spec-read scalar |\n| isolated-verify\
  \ hook | `YITC_ISOLATED_VERIFY` | false | Rule 6; honored by the resolver BEFORE\
  \ record probing — a dormant hook, no producer sets it today (by design) |\n\nNone\
  \ are `consumed` — a runtime path / an env carrier-set are exactly the env/per-runtime/path\
  \ class the\n consumed-whitelist EXCLUDES. The resolver reads them as behavior,\
  \ not as a governing scalar.\n\n## Rationale\n\nReal incident chain 2026-07-05:\
  \ (1) **X-0158** — a minted ref not carried on the first same-call `--help`\norphaned\
  \ its fetch-receipt under the provider carrier → the first `worktree new` refused.\
  \ (2) The\nsession-ref LEAK into `land` verify subprocesses false-RED'd `test_t0860`\
  \ / `test_t9755`→`test_t10116` and\nwould block EVERY dispatched worker's land (`fu_54c5905adf9f`).\
  \ (3) **Provider coupling** — the registry\nhardcodes each provider's env-var name\
  \ and bets v2 correctness on a specific harness's internals (vs\nCHARTER §P4b).\
  \ Owner concern: v2 must not depend on knowing/pinning any other provider's architecture,\
  \ and\nthe carrier list must not grow into a provider-knowledge chain. Prior-art\
  \ (industry sweep 2026-07-05):\nprovider-agnostic tools mint their OWN id + demote\
  \ the provider id to per-call metadata (OTel\n`gen_ai.conversation.id`; LiteLLM;\
  \ Vercel AI SDK; OpenHands); robust \"many short-lived processes = one\nsession\"\
  \ systems rediscover a persisted record (git worktrees, systemd `INVOCATION_ID`);\
  \ cwd is not a\nsession key (the AI tool #24864, Hermes #46303 both converged on\
  \ mint-id + record-PID); hermeticity is\ndefault-deny + curated env (Bazel — SURVEYED\
  \ prior-art, deliberately NOT the adopted design: Rule 6 ships a targeted identity-carrier\
  \ SCRUB, since default-denying the whole execution env the ~493-test suite depends\
  \ on is disproportionate blast radius, CHARTER §P1). Additional benefit: a v2-minted-per-launch\
  \ id repairs the\nsibling-collision (distinct `session_ref` per sibling → stamp-based\
  \ own/foreign works for arbitrary\nconcurrency) — WITHOUT lifting the CHARTER §6\
  \ in-process-worker ban (that needs worktree-per-subagent + a\n§6 revisit; out of\
  \ scope here).\n\n## Verification\n\nProbe targets (bounded — gate-specs finding\
  \ 3, concrete minimums; failure-threshold = ANY recurrence):\n- **unit** — `_resolve_session_ref`\
  \ resolves from the v2-owned record with ALL provider vars ABSENT; two\n  concurrent\
  \ runtime records → distinct ids; a forced two-provider-free-tty-less-in-one-cwd\
  \ corner →\n  resolver REFUSES with the Rule-5 diagnostic (never guesses).\n- **grep**\
  \ — no runtime dependency on any provider env-var NAME in the `_resolve_session_ref`\
  \ resolution\n  path (Rule 4); no PROVIDER-carrier precedence chain left in the\
  \ resolution registry (Rule 8b), and the\n  seed/handbook states the BOUNDED v2-own\
  \ carry rather than the retired unbacked mint-and-carry (Rule 8a).\n  *(This probe\
  \ once read \"no mint-and-carry prose left in the seed\" — an Option-A overclaim:\
  \ the carry\n  SURVIVES, only its fragility was retired. Corrected.)*\n- **live\
  \ (real-data soak, min-runs)** — ≥ 5 real dispatched-worker `land`s AND ≥ 3 fresh-interactive\n\
  \  first-verb starts over ≥ 5 days, ALL with zero session-identity friction/leak\
  \ events; plus a fan-out of\n  ≥ 4 parallel dispatched workers each carrying a DISTINCT\
  \ `session_ref` (spot-check `bg_dispatch_launched`\n  expected-refs + `task_picked`\
  \ stamps). Evidence-home: `events.jsonl` grep + `land_completed` metrics.\n"
