binding:
  - query-only # RESIDENCY (SPEC-0005 §7 / SPEC-0013) declared at activation by : SPEC-0109
                 # is a RETRIEVED reference, NOT kernel-code-enforced — it governs a CONSUMER's
                 # yitc-ops.yaml product-cron SECTION whose single source of truth is the consumer's
                 # own beat_schedule + product-cron-inventory --check (rule 2/3), so no kernel
                 # `implements:` anchor exists to make it code-enforced. Delivered on-demand via
                 # `graph query SPEC-0109` when governing a consumer's scheduler.
init_concern: ~
