    \ inventory here is DERIVED from it,\n  # never hand-entered. Declared != governed:\
    \ governed needs a visible inventory AND an observed\n  # fired run. A host-only\
    \ crontab job is declared HERE too. Waiver LOOSE but FORWARD-AWARE.\n  # see SPEC-0109\
    \ §1, §2, §3, §4\n  waiver:\n    reason: \"Initialized via `bin/yitc-v2 init`\
    \ — no product scheduler declared yet. This project runs no scheduled work of\
    \ its own; if it gains one (a celery-beat schedule, a host cron), replace this\
    \ waiver with `scheduler:` + `source:` (the definition that stays the sole source\
    \ of truth) + a DERIVED `inventory:` (rendered from that source, never hand-entered\
    \ — SPEC-0109 rule 2).\"\n"
