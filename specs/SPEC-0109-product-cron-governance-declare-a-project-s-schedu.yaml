id: SPEC-0109
title: 'Product-cron governance — declare a project''s scheduler on yitc-ops.yaml, single-source imported never hand-entered'

status: active

created_at:

travels: kernel
# RE-PINNED from draft v2-self to kernel by the activation_owner_task (SPEC-0073 §3): this
# rule governs a CONSUMER's yitc-ops.yaml, so it TRAVELS to every v2 consumer — same
# born-v2-self→activate-kernel path as SPEC-0105/SPEC-0093. (Draft born v2-self, plan-local.)

consumed: false

extension: ~
# A yitc-ops declare-or-waive SECTION concern (SPEC-0093 rule-4 section-add), NOT a SPEC-0101 catalog
# «extension» (classification Variant B, proposing plan).

implements: []
# DRAFT design-phase (SPEC-0005 §4 — governs nothing). The L2 `yitc-ops.yaml` product-cron section
# schema + the import/observe code anchors are filled by the implementing task when a real project
# (trend-finder/boomrocket) pulls L2.

body: |
  ## Scenario

  A project that runs its OWN scheduled work (e.g. a `celery-beat` `beat_schedule`) DECLARES it on its
  `yitc-ops.yaml` so v2 KNOWS and GOVERNS that work — it is never invisible. v2 does NOT run the
  project's cron (the project's deploy does); it GOVERNS it: the owner reads one file to see what the
  project schedules, and the kernel can prove the cron actually fires, not just that it was declared.

  ## Internal

  PRODUCT-CRON GOVERNANCE (L2 — the project's own scheduled work). Rules:

  ### 1. Declare-or-waive on the project ops-contract (P5 — one section, not a new store)
  Product cron is a declare-or-waive SECTION on `yitc-ops.yaml` (a SPEC-0093 rule-4 section-add), NOT a
  new automation registry. A project DECLARES "I have a scheduler" (pointer to its definition) OR
  WAIVES it with a forward-aware waiver (no scheduled work yet; how to flip waive→declare later).

  ### 2. Single-source-of-truth — IMPORTED, never hand-re-entered
  The project's existing scheduler definition (`celery-beat` `beat_schedule` / equivalent) REMAINS the
  single source of truth for the job set. Any kernel-side inventory surface is DERIVED / IMPORTED from
  that definition, NEVER hand-re-entered — there is NO parallel cron ledger (CHARTER §P5). If an
  import-gap ever forces a temporary manual entry, it is a TRACKED, retiring carve-out (named with an
  owner + a retire-trigger), never a standing hand-maintained copy.

  ### 3. "Governed" is an OBSERVABLE, not a declaration
  A declared scheduler is GOVERNED only when BOTH hold: (a) its job inventory is VISIBLE in
  `yitc-ops.yaml` (imported per rule 2), AND (b) ≥1 OBSERVED fired-job / journaled run proves the cron
  actually runs. `declared` alone ≠ `governed`. This observable is L2's OWN evidence — its imported
  `beat_schedule` view (rule 2) + its own fired-job / journaled-run events — NOT a shared catalog
  `wired`-status abstraction (the 2026-06-27 external re-check: L2 is a non-catalog `yitc-ops.yaml`
  section-add that proves its own truth, so it does not depend on the extension-catalog vocabulary).
  (The X-0089 / lesson: a scheduled mechanism must prove it FIRES, not just unit-pass.)

  ### 4. The single governed home for a fragile host-only cron
  A cron that today lives only in one host's crontab (e.g. the boomrocket `orphan-view-bonus` payment
  safety-net, silently lost on redeploy) is declared in THIS section like any other scheduled work — so
  it has a single governed home and cannot be silently lost. No separate carrier.

  ### 5. SEED-then-grow boundary + the named L2 retirement
  L2 governs the project's own scheduled work; it does NOT own the methodology nightly (L1, SPEC-0105)
  nor the freshness probe (L3, SPEC-0110). L2 activates when a real project DECLARES a scheduler
  (trend-finder/boomrocket) — not speculatively (a project with no scheduler, e.g. kupiclub, waives it).
  RETIREMENT (CHARTER §P1 F3): ad-hoc / manual scheduler-inventory tracking is RETIRED in favor of the
  DERIVED `beat_schedule` view (rule 2) — no parallel cron inventory permitted.

  ### Build-order — NO catalog-amendment prerequisite (corrected 2026-06-27)
  L2 has **no** hard dependency on the extension-catalog amendment (plan
  `extension-catalog-population-from-3-project-breadt` / SPEC-0112). The external re-check (consult
  `decisions/extcat-scope-variants-audit-adhoc.yaml`) confirmed L2 is a non-catalog `yitc-ops.yaml`
  declare-or-waive SECTION-ADD (`extension: ~`): its forward-aware waive is already expressible via
  SPEC-0093 rule-6, and its "governed" truth is its OWN observable (rule 3), not the catalog
  `wired`/`resolves_to` vocabulary. So the prior hard `requires:` edge is REMOVED — L2 decomposes/builds
  on its own. (`extension-catalog-population-...` stays an informational `cites:` only.)

  ## Rationale

  All three large v1-incumbents (trend-finder / boomrocket / aiseller) DECLARE a `celery-beat` scheduler
  — product cron is near-universal among mature products — yet v2 had no declaration home, and the only
  source of truth was each project's `beat_schedule`. The 3-project study + the corrected declare/waive
  framing live in the proposing plan (SPEC-0005 §3 content boundary — not restated). Predecessor: the
  withdrawn SPEC-0106 (re-authored here under the follow-on grow-plan; SPEC-0106 frozen historical).

  ## Verification

  Adoption probe (CHARTER §P3 + §P8 — infra-class): the first project to pull L2 (trend-finder) has its
  scheduler inventory VISIBLE in its `yitc-ops.yaml` (imported, not hand-entered) AND ≥1 fired-job /
  journaled run proves the governed cron actually runs (the rule-3 observable). FAILURE-CHECK: a
  `declared` cron with no `wired`/observed evidence read as "governed".

  ADOPTION EVIDENCE (probe SATISFIED — activated by): trend-finder pulled L2 and closed
   with all four probes passing incl. the differential leg (AC1 a falsified inventory entry
  FAILS the check; AC2 state-check; AC3 fired-job; AC4 P8), commit 2f5d15f; cross X-0200 author-closed
  2026-07-10 with a live `product-cron-inventory --check` OK (10 jobs) — the rule-3 observable
  (inventory VISIBLE + ≥1 observed fired-job) holds on a real consumer.

