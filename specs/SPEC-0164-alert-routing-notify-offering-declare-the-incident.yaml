body: |
  ## Scenario

  A project that rides the kernel answers ONE question at activation: when something breaks here, WHERE
  does the alert go — and WHO reads it and acts? It declares the two together in its `yitc-ops.yaml`
  `alert_routing:` section, or it waives with a reason. The owner/AI reads ONE file to see whether this
  project's incidents reach a human at all. A project that routes nowhere says so explicitly, which is
  what makes an unmonitored production service legible as a CONSCIOUS choice rather than an oversight
  nobody noticed. The offering is discovered from the system itself — `bin/yitc-v2 graph query
  extensions-catalog` lists it with its adopt-path — and adopting it is one declaration.

  The kernel NEVER sends the alert. Routing is operator-owned: the kernel grades that the STANCE is
  present and complete, exactly the SPEC-0110 grade-only shape.

  ## Internal

  THE ALERT-ROUTING/NOTIFY OFFERING — a grade-only, presence-graded declare-or-waive concern, packaged as
  a first-class adoptable SPEC-0101 catalog extension. It adds NO new grading mechanism (CHARTER §P1 F2):
  presence + stance are graded by the ALREADY-GENERIC registry-driven sweep (`init._sweep_ops_carrier`,
  SPEC-0128 Rule 2), which this concern joins as one more DECLARED row; the only new code is the small
  kernel-owned residual-shape validator this spec's `concern.shape_hook` names (rule 2) — the escape hatch
  SPEC-0128 Rule 2 explicitly permits. Structural precedent: SPEC-0163 (remote_sync), the same
  presence-only section-add shape. Four rules.

  ### 1. Declare the routing stance, or waive
  A project DECLARES an `alert_routing:` section naming where incident alerts GO and who ACTS on them, or
  WAIVES it with a reason. The section is `checked-if-present`; the waiver is LOOSE (SPEC-0093 rule 6 — a
  non-empty reason). A project with no alerting legitimately waives; silence is not a stance.

  ### 2. A DECLARED section answers BOTH parts — the sink AND its receiver
  `sink:` (WHERE an incident alert is delivered) and `receiver:` (WHO/what reads it and acts — a named
  human, rota, or on-call identity) are ONE stance and are declared together. The generic stance sweep
  counts the section DECLARED on `sink:` alone, so without this rule a section could name a destination
  and silently drop the receiver — and an alert nobody reads is not routing, it is coverage-shaped
  SILENCE: precisely the failure this concern exists to end. Fail-closed on a PRESENT, NON-WAIVED
  declaration missing `receiver:`; an ABSENT or WAIVED section is a stance the generic check owns (the
  hook never backfills, mirrors, or auto-heals it —
  `lessons/a-stance-mirror-is-only-sound-at-birth.md`). Enforced by `_hook_alert_routing`
  (`concern.shape_hook: alert_routing_shape`). Prior-art for the completeness shape: SPEC-0163 rule 4,
  where `remote:` alone was likewise insufficient without `pusher:` + `ci:`.

  ### 3. GRADE-only — the kernel never touches the sink (the SPEC-0110 frame)
  The kernel grades the PRESENCE and COMPLETENESS of the stance. It NEVER contacts the sink, emits a test
  alert, authenticates to a webhook, or judges deliverability, latency, or the sink's quality — the
  SPEC-0093 rule-3 boundary (the kernel checks the stance, never the command's correctness) and the
  SPEC-0110 rule-3 grade-only doctrine: the kernel GRADES, the operator RUNS. Alerting itself stays
  operator-owned and runs on its own loop, independent of any kernel cadence.

  ### 4. Implementation-agnostic
  This mandates NO alerting product and NO transport. `sink:` may name any destination a human really
  reads — a chat webhook, an email alias, a pager rota, an issue tracker, a log with a named reader.
  `receiver:` may name a person, a rota, or the automation that escalates to one. What is NOT a complete
  answer is a sink with no receiver (rule 2). A project that routes nowhere WAIVES (rule 1) rather than
  declaring an empty sink.

  ### 5. A LIVE project also says how it is WATCHED — health, logs, one objective
  Routing an alert answers where an incident GOES. It does not answer how anyone would SEE one. A
  project carrying real users is asked three further things, as OPTIONAL keys on this SAME
  `alert_routing:` section (no new section — SPEC-0005 §7, in place):

  - `health:` — the endpoint a human or a monitor can hit to ask "is it up?".
  - `logs:` — the structured-log stance, and WHERE the logs are read.
  - `slo:` — at least ONE named objective, carrying BOTH `objective:` (what is promised) and
    `target:` (the number that decides whether it was kept).

  Each is declare-or-waive LOOSE per rule 1, and each is GRADE-ONLY per rule 3: the kernel NEVER hits
  the health endpoint, NEVER reads a log, and NEVER measures an SLO. It grades only that the stance is
  said out loud.

  ASKED ONLY OF A LIVE PROJECT, AND ASKED PER KEY. These three are surfaced on the SPEC-0119 rule-39
  brownfield gap register (`bin/lib/debt.py#profile_gap_register`) ONLY when SPEC-0198 resolves this
  project's `operational_criticality` to a live reading — `live`, `live-critical`, or the deliberate
  WIDE `unknown` of rule 2 — and NEVER on a POSITIVE `prototype`, which SPEC-0198 rule 7 collapses to
  the constant floor. A prototype with no users is not asked how it is watched.

  Each key is answered BY ITSELF. The register carries one item PER KEY — `health-rollback-runbook`,
  `structured-log-stance`, `one-slo-declared` — so declaring `health:` does NOT answer `logs:` or
  `slo:`. That per-key granularity is the whole point of asking three questions instead of one: a
  section-granular reading would let a single declared key clear all three, and a project that named a
  health endpoint would never again be asked what happens to its logs. A reasoned `waiver:` on the
  SECTION still waives all three (rule 1 is a section-level stance), and a per-key `waiver:` waives
  just its own key.

  FAIL-CLOSED ON EXACTLY ONE SHAPE. `health:` and `logs:` are free-form prose and are NEVER
  shape-refused — the kernel has no opinion about what a good health endpoint looks like. A present,
  non-waived `slo:`, however, MUST carry BOTH a non-blank `objective:` AND a non-blank `target:`;
  EITHER missing is an init ERROR naming which part is absent. An objective with no target is the same
  coverage-shaped silence as a sink with no receiver (rule 2): it reads as a promise while committing
  to nothing measurable. Absence of all three keys is a STANCE the register asks about, never a shape
  defect the hook invents — so an existing carrier that declares only `sink:` + `receiver:` passes the
  hook unchanged.

  THE TWO SURFACES ASK ONE QUESTION. The birth-time hook and the gap register must not
  disagree about what counts as a declared SLO: a shape the hook REFUSES never counts as
  ANSWERING `one-slo-declared` on the register either. Otherwise a project could close its SLO
  obligation with a promise carrying no number — the coverage-shaped silence this rule exists
  to end, reintroduced by the very mechanism meant to surface it. The completeness predicate
  therefore has exactly ONE home (`bin/lib/init.py#_alert_routing_slo_missing`) and the
  register defers to it (CHARTER §P5); where it cannot be consulted the item stays UNMET,
  never adopted.

  ## Rationale

  Real pull: the 2026-07-04 T9 inspection unanimously GRADUATED incident/alert routing as a
  kernel-adoptable capability, and the follow-through — exposing it as a first-class ADOPTABLE catalog
  offering — had not landed (`t9-graduation-followthrough-stale-20260704`: "graduation decisions not
  landing as offerings"). This is the second of that fingerprint's two graduations; the first shipped as
  SPEC-0162 (restore-drill freshness).

  Prior-art: SPEC-0163 (remote_sync) is the structural analog — a presence-only declare-or-waive concern
  whose code anchor is its own shape hook — and supplies rule 2's completeness shape (a declared
  destination without a named owner is silence: X-0346 /, where an auto-pusher that died with a
  retired system left a remote silently un-synced; the same class as an alert sink nobody reads).
  SPEC-0162 supplies the catalog-packaging shape; SPEC-0110 supplies the grade-only frame; SPEC-0101
  supplies the marker + adopt-path; SPEC-0128 supplies the one-declaration→all-surfaces registry.
  External analog: an on-call escalation policy names a destination AND who is on call — never one alone.

  NOT mirrored from SPEC-0162: its `dev-utilities/` reference ADAPTER. That artifact exists because the
  SPEC-0110 freshness grader SPAWNS a `kind: command` adapter to grade a pipeline's last-pass age. This
  offering grades PRESENCE via the generic sweep, which spawns nothing — so a reference adapter would be
  an artifact no probe exercises and no kernel path invokes (CHARTER §P1 F3/F4). The adopt-path artifact
  here is the generated born template's declare-shape block (Verification).

  ## Verification

  Adoption probe (CHARTER §P3/§P8 — infra-class), the faces of the ONE claim "incident/alert routing is a
  discoverable, adoptable, grade-only offering that switches per-consumer":
  - **catalog exposure (consumer-read P8):** `bin/yitc-v2 graph query extensions-catalog` lists SPEC-0164
    `status: active` + `adoptability: adoptable` + a non-null `adopt_path` (running the lens emits the
    `cli_invoked` consumer-read evidence). Differential: a spec without the `extension:` marker never
    appears; an `internal-only` one carries a null adopt_path.
  - **live stance grade (live_trigger P8):** the generic sweep (`init._sweep_ops_carrier`) grades a real
    carrier's `alert_routing:` section: a complete stance PASSES; a PRESENT non-waived `sink:` with NO
    `receiver:` is REFUSED by `_hook_alert_routing` naming the missing part; a waived section passes; an
    absent section is checked-if-present. Differential: flip the `receiver:` key off and the graded result
    flips pass→refuse — a broken hook would pass the incomplete stance. The kernel spawns no alert.
  - **membership is mechanical:** `init._engine_catalog_members` includes SPEC-0164 BECAUSE it is
    active+adoptable (assert the derivation, not a pinned literal).
  - **per-consumer switch (SPEC-0112 §4b):** a carrier WAIVING SPEC-0164 and one DECLARING it each pass
    their OWN sweep independently — neither gates the other, and the kernel's verify reads no consumer's
    live files (SPEC-0131 rule 4). Differential: were activation fleet-gated, the waiving carrier would
    block the declaring one.
  - **born surface:** the GENERATED `graph/born-ops.yaml` carries the `alert_routing:` section + its
    declare-shape comment. Differential: absent while this spec is proposed (active-only registry gating).
  Test: `tests/test_t10613_alert_routing_offering.py`.

