body: |
  ## Scenario

  A project is born with a verification gate declined, so it does not pay for protection it does not
  yet need. As it grows, the periodic review watches for a signal that the absence has started to cost
  something, and — when one fires — NAMES the project, the surface and the observed signal, and
  proposes turning that gate back on. It never turns it on itself. On a project where no signal has
  fired, the review says nothing at all.

  ## Internal

  ### Rule 1 — No born-permissive default without a named detector
  A default may be born permissive ONLY if a detector for its absence is named in the same corpus. The
  pair is the unit: a permissive birth without a detector is not admitted. This binds at authoring
  time, not at review time.

  ### Rule 2 — Detection rests on signals emitted without a judgement call
  A qualifying signal is one the system emits as a by-product of ordinary work. A signal that requires
  someone to CLASSIFY something — at triage, at closure, or anywhere else — does NOT qualify, because
  an optional classification is an unmade one. Interpreting note, not deliberation: the nearest analog
  in this corpus, the automatic restoration of the audit-post exemption, is stated in CHARTER as
  INOPERATIVE wherever the defect judgement is not made, and that judgement has never been made across
  three consumers' entire history. A detector built on the same input would be inert on arrival.

  ### Rule 3 — Growth gates RELEVANCE; it never supplies EVIDENCE
  A growth reading (corpus size, land volume, or any other count) MAY decide whether a proposal is
  worth making now. It MUST NOT, alone, be the evidence that the absence is costing anything. Only the
  surface's own rule-2 signal carries that. A proposal whose sole support is a count is malformed.

  ### Rule 4 — Propose, never apply
  The review PROPOSES. Restoration is always an explicit project act, performed by the project in its
  own contract. No review path, and no automation reachable from one, may write a project's
  declaration. A proposal states: the project, the surface, the observed signal, and the specific
  tightening — never a bare "consider reviewing this".

  ### Rule 5 — The detector is named code, never a rule expressed in metadata
  Detection logic is CODE. This spec fixes only that boundary — a detector may never be expressed as a
  rule inside a declaration, because a declaration block is a finite table and carries no language for
  one. HOW a detector is named from, and resolved through, the concern registry — the naming
  convention and the refusal when a concern declares a permissive born value without one — is registry
  mechanics and is homed in SPEC-0128, not restated here (one home, SPEC-0005 rule 8).

  ### Rule 6 — A detector is adopted only once it has spoken on real data
  Adoption requires EITHER that the detector has fired with a named proposal on a real project corpus,
  OR that it is demonstrated silent for a stated reason on a corpus that WOULD have tripped a naive
  detector. For a report-only signal the differential is INDISTINGUISHABILITY, not presence: a test
  asserting only that a line printed does not discharge this rule. A detector that has never spoken on
  any real corpus is not adopted, and is not tuned until it speaks.

  ### Rule 7 — Flipping a born default never flips absence
  Changing what `init` WRITES into a new project's contract MUST NOT change what an ABSENT declaration
  reads. The two are separate questions and separate code paths. A change that moves both silently
  re-declares every existing project that never opted in.

  ### Rule 8 — A born declaration that RELAXES a control carries ratification provenance
  A born-written declaration that turns a control OFF, widens an exemption, or otherwise relaxes a
  gate is written ONLY against an explicit human confirmation recorded as that declaration's
  ratification provenance. A safe born default owes no such provenance and may be clean. Where the
  confirmation is unavailable — any noninteractive birth — the declaration is NOT written and the
  section stays absent, which reads fail-closed. Consequence, stated so it is not re-derived: there is
  no state in which a relaxation exists un-ratified, so no debt view is asked to carry one and no
  shared machinery is exempted to tolerate one. The axis is the VALUE'S DIRECTION, not the concern's
  identity: this rule is blind to WHICH gate is being relaxed.

  ## Parameters

  | parameter | value | consumed | owner |
  |---|---|---|---|
  | `growth_window_days` | 30 | yes — read by the shared growth fold | THIS spec |

  **THE VALUE, as a machine-readable token the fold READS.** `consumed: true` means code
  reads a governing scalar FROM this spec, so the parameter needs a value HERE and not a constant in
  `bin/`. The table above is prose for a human; this token is what the reader parses — the same
  carrier/idiom `views.py#_rotation_rereview_bound_mb` and `worktree.py#journal_live_window_days`
  already use on their own governing specs. One carrier, one idiom, no second config path.

      GROWTH_WINDOW_DAYS: 30 # the trailing window the shared growth fold counts
                               # land_completed(status=ok) rows over, per project. Changing it is a
                               # governed spec edit, and it changes the fold's answer by construction —
                               # which is exactly the differential that proves the value is READ rather
                               # than restated in code.

  FAIL-CLOSED, with NO default: a carrier or token that cannot be read yields no value and the fold does
  not run. It never falls back to a number, because a fallback would BE the local literal this parameter
  exists to forbid — a fold quietly answering on a guessed window is worse than one answering nothing,
  since the guess is invisible in the answer.

  The growth window is a GOVERNING scalar and is homed here, not in the code that reads it: the fold
  consumes this value, it does not define it. It is deliberately NOT per-surface — a surface's own
  governing spec owns ONLY its signal threshold and its permissive value, and no surface spec restates
  this window. Everything else about a surface's numbers stays with that surface.

  ## Rationale

  Born-permissive defaults are cheap to grant and hard to revisit: the failure they permit is silent
  by construction, so nothing surfaces it on its own. The restoring review is therefore the whole of
  the safety argument, and a restoring review that cannot fire is worse than none — it is believed in.
  Rules 2 and 6 exist to keep that from happening again on a second generation of defaults.

  ## Verification

  - R1: a concern declaring a permissive born value with no named detector fails the check that pairs
    them (probe: `graph conformance` over a fixture declaring one without the other).
  - R2: a proposed detector whose input is a classification field is rejected at review of the
    concern entry (probe: the fixture names an optional `kind`-style field and is refused).
  - R3: a proposal assembled from a growth count alone is malformed (probe: assemble one; the renderer
    refuses to emit it).
  - R4: no review code path writes a consumer `yitc-ops.yaml` (probe: a mechanical diff-scan over the
    review/debt surfaces proves no write to a consumer contract, and FAILS on a planted write).
  - R5: a detector expressed as a rule inside a declaration is refused (probe: plant one in a fixture
    concern block; the build refuses it). The naming/resolution probes belong to SPEC-0128.
  - R6: for each shipped detector, either a recorded firing on a real corpus, or a recorded silence
    plus the named corpus that would have tripped a naive detector (probe: the recorded review run).
  - R7: differential — flip the born value written by `init`, and assert the ABSENT-declaration read is
    byte-identical before and after (probe: a fixture reading an empty contract on both sides).
  - R8: a noninteractive birth writes NO relaxing declaration and the section reads fail-closed
    (probe: run birth with no confirmation available; assert the section is absent and the resolved
    value is the protective one). Negative control: the SAME birth WITH a confirmation writes the
    declaration AND its ratification provenance — the two runs must be distinguishable.
