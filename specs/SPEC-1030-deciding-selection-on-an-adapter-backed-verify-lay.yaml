id: SPEC-1030
title: Deciding selection and deciding credit on an adapter-backed verify layer —
  project-declared opt-ins with a reason, whose partial runs are recorded and never
  read as full breadth
status: active
created_at: 2026-10-13 14:58:53+00:00
travels: null
consumed: false
extension: null
turn_on: 'yitc-ops.yaml `verify.layers[].adapter` — on an adapter-backed verify layer,
  `selection: deciding` with a `selection_deciding_reason:` (the layer runs only the
  test files a change reaches, the whole layer wherever the change cannot be placed)
  and `credit: deciding` with a `credit_deciding_reason:` (after a failed run and
  a fix, the next attempt reuses the other passes of the failed one); the full run
  before a deploy stays the project''s own'
