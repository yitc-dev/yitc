concern:
- section: environments
  carrier_path: environments
  presence_policy: checked-if-present
  update_policy: init re-seed
  declare_key: config_source
  declare_type: string
  waiver_policy: loose
  born_order: 190
  born: "environments:\n  # SPEC-0199 (production-readiness carriers) — WHERE config\
    \ comes from and whether a staging\n  # environment mirrors prod. Asked by the\
    \ kernel once the project is live (SPEC-0198). Replace with:\n  # config_source:\
    \ \"<env | secrets store | file — and that no prod-only code path exists>\"\n\
    \  # staging: \"<present: <how it mirrors prod> | absent: <why that is acceptable\
    \ now>>\"\n  waiver:\n    reason: \"Initialized via `bin/yitc-v2 init` — no environments\
    \ stance declared yet.\"\n"
- section: data_obligation
  carrier_path: data_obligation
  presence_policy: checked-if-present
  update_policy: init re-seed
  declare_key: classification
  declare_type: string
  waiver_policy: strict
  born_order: 191
  born: "data_obligation:\n  # SPEC-0199 — WHAT personal/sensitive data this project\
    \ holds, for HOW LONG, and how it is DELETED\n  # on request. Asked once the profile\
    \ resolves PII (SPEC-0198). BORN AS A DECLARATION, not a waiver:\n  # a project\
    \ that stores no PII legitimately DECLARES that; the STRICT waiver (reason +\n\
    \  # compensating_control + expiry, SPEC-0093 rule 6) is for a project that HOLDS\
    \ PII and defers the\n  # obligation — write it only then, with a REAL date. Replace\
    \ the born values with:\n  # classification: \"<which stores hold PII / sensitive\
    \ data>\"\n  # retention: \"<how long, and what enforces it>\"\n  # deletion:\
    \ \"<how a deletion request is honoured end-to-end>\"\n  classification: \"none\
    \ — no personal or sensitive data is stored (re-declared at the first PII-shaped\
    \ migration; SPEC-0198 asks then)\"\n  retention: \"n/a — nothing to retain\"\n\
    \  deletion: \"n/a — nothing to delete\"\n"
- section: cost
  carrier_path: cost
  presence_policy: checked-if-present
  update_policy: init re-seed
  declare_key: threshold
  declare_type: string
  waiver_policy: loose
  born_order: 192
  born: "cost:\n  # SPEC-0199 — the spend (infra + AI) at which cost becomes a task,\
    \ and where the number is read.\n  # Asked once money or a live deploy is present\
    \ (SPEC-0198). Replace with:\n  # threshold: \"<amount per period at which a cost\
    \ task is filed>\"\n  # reading: \"<where the current figure is read — a billing\
    \ page, an export, a metric>\"\n  waiver:\n    reason: \"Initialized via `bin/yitc-v2\
    \ init` — no cost threshold declared yet.\"\n"
- section: dependency_cadence
  carrier_path: dependency_cadence
  presence_policy: checked-if-present
  update_policy: init re-seed
  declare_key: rhythm
  declare_type: string
  waiver_policy: loose
  born_order: 193
  born: "dependency_cadence:\n  # SPEC-0199 — pinned manifest + lockfile + the rhythm\
    \ dependencies are updated on. Part of the\n  # CONSTANT floor: every project\
    \ is asked, prototype included (SPEC-0198 §7). Replace with:\n  # rhythm: \"<e.g.\
    \ monthly review of advisories + quarterly upgrade window>\"\n  # lockfile: \"\
    <path — and that installs are frozen to it>\"\n  waiver:\n    reason: \"Initialized\
    \ via `bin/yitc-v2 init` — no dependency cadence declared yet.\"\n"
- section: runbook
  carrier_path: runbook
  presence_policy: checked-if-present
  update_policy: init re-seed
  declare_key: logs
  shape_hook: runbook_shape
  declare_type: string
  waiver_policy: loose
  born_order: 194
  born: "runbook:\n  # SPEC-0199 — what to do when it breaks: where the logs are,\
    \ how to roll back, who to contact.\n  # Asked once the project is live (SPEC-0198).\
    \ Distinct from alert_routing (WHO is told) — this is\n  # WHAT they do. Replace\
    \ with:\n  # logs: \"<where a human reads them>\"\n  # rollback: \"<the command\
    \ or the pointer to yitc-ops rollback: — and how long it takes>\"\n  # contact:\
    \ \"<who to call, in what order>\"\n  waiver:\n    reason: \"Initialized via `bin/yitc-v2\
    \ init` — no runbook declared yet.\"\n"
