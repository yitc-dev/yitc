body: |
  ## Scenario

  When a project grows into a live product, the questions a production-readiness review asks beyond
  security — where does config come from and is staging like prod; what personal data do we hold and
  for how long; what does this project cost and when does that become a task; how do dependencies get
  updated; where are the logs, how do we roll back, who do we call at 3 a.m. — each has ONE declared home
  in `yitc-ops.yaml`. A project answers each with a stance or a reasoned waiver. The kernel never
  judges the answer's correctness; it grades that a stance exists, and the SPEC-0198 profile decides
  WHEN the question is asked (a prototype is not asked about PII retention).

  ## Internal

  FIVE shape-only sections, one concern block each (SPEC-0128 rule 1 — a spec may host several). All are
  DECLARED config (SPEC-0093 rule 7 — no computed status is ever stored), born declare-or-waive, delivered
  to existing carriers by the `init` update path (SPEC-0093 rule 11), and profile-gated for activation
  (SPEC-0198 §6): the born stance is a waiver; the section's question is ASKED (surfaced on the gap
  register) only when the profile dimension that needs it resolves.

  1. **`environments:`** — config-from-environment stance + staging/prod parity stance (12-factor);
     declare `config_source:` + `staging:` (present | absent + why) — or LOOSE waiver. Asked at
     `operational_criticality: live*`.
  2. **`data_obligation:`** — PII classification (which stores hold what), retention, deletion-on-request
     stance; declare `classification:` + `retention:` + `deletion:`. BORN as the DECLARATION
     `classification: none` (a project storing no PII declares that — a stance, not a waiver, so a fresh
     init is valid with no placeholder); the STRICT waiver (reason + compensating control + a REAL dated
     expiry, SPEC-0093 rule 6) applies only to a project that holds PII and defers the obligation. Asked at
     `data_sensitivity: pii|sensitive`.
  3. **`cost:`** — the infra + AI spend threshold at which spend becomes a task; declare `threshold:` +
     `reading:` (where the number is read) — LOOSE waiver. Asked at `money: present` or `live*`.
  4. **`dependency_cadence:`** — pin + lockfile + the update rhythm; declare `rhythm:` + `lockfile:` —
     LOOSE waiver. Asked always (constant floor) — this is the one section a prototype is asked too.
  5. **`runbook:`** — where the logs are, how to roll back, who to contact; declare `logs:` + `rollback:`
     + `contact:` — LOOSE waiver. Asked at `live*`. (Placement decided against a subfield of
     `alert_routing`: SPEC-0164 answers WHO reads an alert; a runbook answers WHAT to do — the
     SPEC-0005 delete-test keeps them separable.)

  ## Parameters
  None consumed. Key names and the born text are the concern blocks below (single source).

  ## Rationale
  Industry prior-art (Google SRE Production Readiness Review, AWS Well-Architected, 12-factor) names
  these as the questions a live service must answer; the kernel had homes for none of them. Real
  incidents: aiseller X-0345 (rotation with no ciphertext-surface map, 5h outage — a runbook question);
  the consumers' identical security shape regardless of stage. Adjudicated:
  `decisions/production-readiness-derived-profile-self-activating-audit-adhoc.yaml` (seed now:
  environments, runbook, data obligation; light: cost, dependency cadence). Anti-complexity: shape-only
  sections on the existing carrier via the rule-4 path (the `ui:`/`tests:` precedent), NO runner, NO
  event, and NO validator beyond the generic declare-or-waive sweep plus ONE registry-declared
  SPEC-0128 Rule-2 shape hook (`runbook_shape`) — the existing narrow escape hatch, named here
  because VP2 requires a half-declared runbook to ERROR and the generic stance check reads only the
  single `declare_key` ( audit-pre, 2026-09-05).

  ## Verification
  - **VP1 (registry round-trip, SPEC-0128):** after `graph build`, all five sections appear in
    `graph/concern-registry.json` + `graph/born-ops.yaml` with NO edit to `init.py`; a fresh `init` on a
    fixture consumer is born with all five as waivers; the update path delivers them to a carrier that
    lacks them and leaves an answered one untouched (byte-identical re-run).
  - **VP2 (declare-or-waive, differential):** the born `data_obligation:` DECLARATION passes the sweep on a
    fresh init (no placeholder anywhere in born-ops.yaml — grep); a `data_obligation:` WAIVER missing
    `expiry` or carrying a non-date is an init/sweep ERROR (strict); a bare-reason `cost:` waiver passes
    (loose); a half-declared `runbook:` (logs without contact) is an ERROR.
  - **VP3 (profile-gated asking):** on a prototype fixture only `dependency_cadence` renders on the gap
    register; on a live+pii fixture all five do.

