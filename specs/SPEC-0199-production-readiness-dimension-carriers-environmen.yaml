supersedes: ~
activation_owner_task: # set at decomposition 2026-09-04 — the C4 carriers card activates this spec at close.
proposed_by: production-readiness-by-derived-profile-a-project-
binding:
  - code-enforced # delivered by the generated born section + declare-or-waive sweep (the ui/tests precedent)
concern:
  - section: environments
    carrier_path: environments
    presence_policy: checked-if-present
    update_policy: init re-seed
    declare_key: config_source
    declare_type: string
    waiver_policy: loose
    born_order: 190
    born: |
      environments:
        # SPEC-0199 (production-readiness carriers) — WHERE config comes from and whether a staging
        # environment mirrors prod. Asked by the kernel once the project is live (SPEC-0198). Replace with:
        # config_source: "<env | secrets store | file — and that no prod-only code path exists>"
        # staging: "<present: <how it mirrors prod> | absent: <why that is acceptable now>>"
        waiver:
          reason: "Initialized via `bin/yitc-v2 init` — no environments stance declared yet."
  - section: data_obligation
    carrier_path: data_obligation
    presence_policy: checked-if-present
    update_policy: init re-seed
    declare_key: classification
    declare_type: string
    waiver_policy: strict
    born_order: 191
    born: |
      data_obligation:
        # SPEC-0199 — WHAT personal/sensitive data this project holds, for HOW LONG, and how it is DELETED
        # on request. Asked once the profile resolves PII (SPEC-0198). BORN AS A DECLARATION, not a waiver:
        # a project that stores no PII legitimately DECLARES that; the STRICT waiver (reason +
        # compensating_control + expiry, SPEC-0093 rule 6) is for a project that HOLDS PII and defers the
        # obligation — write it only then, with a REAL date. Replace the born values with:
        # classification: "<which stores hold PII / sensitive data>"
        # retention: "<how long, and what enforces it>"
        # deletion: "<how a deletion request is honoured end-to-end>"
        classification: "none — no personal or sensitive data is stored (re-declared at the first PII-shaped migration; SPEC-0198 asks then)"
        retention: "n/a — nothing to retain"
        deletion: "n/a — nothing to delete"
  - section: cost
    carrier_path: cost
    presence_policy: checked-if-present
    update_policy: init re-seed
    declare_key: threshold
    declare_type: string
    waiver_policy: loose
    born_order: 192
    born: |
      cost:
        # SPEC-0199 — the spend (infra + AI) at which cost becomes a task, and where the number is read.
        # Asked once money or a live deploy is present (SPEC-0198). Replace with:
        # threshold: "<amount per period at which a cost task is filed>"
        # reading: "<where the current figure is read — a billing page, an export, a metric>"
        waiver:
          reason: "Initialized via `bin/yitc-v2 init` — no cost threshold declared yet."
  - section: dependency_cadence
    carrier_path: dependency_cadence
    presence_policy: checked-if-present
    update_policy: init re-seed
    declare_key: rhythm
    declare_type: string
    waiver_policy: loose
    born_order: 193
    born: |
      dependency_cadence:
        # SPEC-0199 — pinned manifest + lockfile + the rhythm dependencies are updated on. Part of the
        # CONSTANT floor: every project is asked, prototype included (SPEC-0198 §7). Replace with:
        # rhythm: "<e.g. monthly review of advisories + quarterly upgrade window>"
        # lockfile: "<path — and that installs are frozen to it>"
        waiver:
          reason: "Initialized via `bin/yitc-v2 init` — no dependency cadence declared yet."
  - section: runbook
    carrier_path: runbook
    presence_policy: checked-if-present
    update_policy: init re-seed
    declare_key: logs
    shape_hook: runbook_shape # SPEC-0128 Rule 2 — the residual shape VP2 needs (a runbook that
                                     # declares logs but no contact is half-answered, and the generic
                                     # declare-or-waive check reads only the declare_key)
    declare_type: string
    waiver_policy: loose
    born_order: 194
    born: |
      runbook:
        # SPEC-0199 — what to do when it breaks: where the logs are, how to roll back, who to contact.
        # Asked once the project is live (SPEC-0198). Distinct from alert_routing (WHO is told) — this is
        # WHAT they do. Replace with:
        # logs: "<where a human reads them>"
        # rollback: "<the command or the pointer to yitc-ops rollback: — and how long it takes>"
        # contact: "<who to call, in what order>"
        waiver:
          reason: "Initialized via `bin/yitc-v2 init` — no runbook declared yet."
init_concern: ~
