id: SPEC-0199
title: Production-readiness dimension carriers — environments, data obligation, cost,
  dependency cadence, runbook as declare-or-waive yitc-ops sections
status: active
created_at: 2026-09-04 17:49:17+00:00
travels: null
consumed: false
extension: null
implements:
- bin/lib/init.py#_hook_runbook
body: "## Scenario\n\nWhen a project grows into a live product, the questions a production-readiness\
  \ review asks beyond\nsecurity — where does config come from and is staging like\
  \ prod; what personal data do we hold and\nfor how long; what does this project\
  \ cost and when does that become a task; how do dependencies get\nupdated; where\
  \ are the logs, how do we roll back, who do we call at 3 a.m. — each has ONE declared\
  \ home\nin `yitc-ops.yaml`. A project answers each with a stance or a reasoned waiver.\
  \ The kernel never\njudges the answer's correctness; it grades that a stance exists,\
  \ and the SPEC-0198 profile decides\nWHEN the question is asked (a prototype is\
  \ not asked about PII retention).\n\n## Internal\n\nFIVE shape-only sections, one\
  \ concern block each (SPEC-0128 rule 1 — a spec may host several). All are\nDECLARED\
  \ config (SPEC-0093 rule 7 — no computed status is ever stored), born declare-or-waive,\
  \ delivered\nto existing carriers by the `init` update path (SPEC-0093 rule 11),\
  \ and profile-gated for activation\n(SPEC-0198 §6): the born stance is a waiver;\
  \ the section's question is ASKED (surfaced on the gap\nregister) only when the\
  \ profile dimension that needs it resolves.\n\n1. **`environments:`** — config-from-environment\
  \ stance + staging/prod parity stance (12-factor);\n   declare `config_source:`\
  \ + `staging:` (present | absent + why) — or LOOSE waiver. Asked at\n   `operational_criticality:\
  \ live*`.\n2. **`data_obligation:`** — PII classification (which stores hold what),\
  \ retention, deletion-on-request\n   stance; declare `classification:` + `retention:`\
  \ + `deletion:`. BORN as the DECLARATION\n   `classification: none` (a project storing\
  \ no PII declares that — a stance, not a waiver, so a fresh\n   init is valid with\
  \ no placeholder); the STRICT waiver (reason + compensating control + a REAL dated\n\
  \   expiry, SPEC-0093 rule 6) applies only to a project that holds PII and defers\
  \ the obligation. Asked at\n   `data_sensitivity: pii|sensitive`.\n3. **`cost:`**\
  \ — the infra + AI spend threshold at which spend becomes a task; declare `threshold:`\
  \ +\n   `reading:` (where the number is read) — LOOSE waiver. Asked at `money: present`\
  \ or `live*`.\n4. **`dependency_cadence:`** — pin + lockfile + the update rhythm;\
  \ declare `rhythm:` + `lockfile:` —\n   LOOSE waiver. Asked always (constant floor)\
  \ — this is the one section a prototype is asked too.\n5. **`runbook:`** — where\
  \ the logs are, how to roll back, who to contact; declare `logs:` + `rollback:`\n\
  \   + `contact:` — LOOSE waiver. Asked at `live*`. (Placement decided against a\
  \ subfield of\n   `alert_routing`: SPEC-0164 answers WHO reads an alert; a runbook\
  \ answers WHAT to do — the\n   SPEC-0005 delete-test keeps them separable.)\n\n\
  ## Parameters\nNone consumed. Key names and the born text are the concern blocks\
  \ below (single source).\n\n## Rationale\nIndustry prior-art (Google SRE Production\
  \ Readiness Review, AWS Well-Architected, 12-factor) names\nthese as the questions\
  \ a live service must answer; the kernel had homes for none of them. Real\nincidents:\
  \ <project> X-0345 (rotation with no ciphertext-surface map, 5h outage — a runbook\
  \ question);\nthe consumers' identical security shape regardless of stage. Adjudicated:\n\
  `decisions/production-readiness-derived-profile-self-activating-audit-adhoc.yaml`\
  \ (seed now:\nenvironments, runbook, data obligation; light: cost, dependency cadence).\
  \ Anti-complexity: shape-only\nsections on the existing carrier via the rule-4 path\
  \ (the `ui:`/`tests:` precedent), NO runner, NO\nevent, and NO validator beyond\
  \ the generic declare-or-waive sweep plus ONE registry-declared\nSPEC-0128 Rule-2\
  \ shape hook (`runbook_shape`) — the existing narrow escape hatch, named here\n\
  because VP2 requires a half-declared runbook to ERROR and the generic stance check\
  \ reads only the\nsingle `declare_key` ( audit-pre, 2026-09-05).\n\n## Verification\n\
  - **VP1 (registry round-trip, SPEC-0128):** after `graph build`, all five sections\
  \ appear in\n  `graph/concern-registry.json` + `graph/born-ops.yaml` with NO edit\
  \ to `init.py`; a fresh `init` on a\n  fixture consumer is born with all five as\
  \ waivers; the update path delivers them to a carrier that\n  lacks them and leaves\
  \ an answered one untouched (byte-identical re-run).\n- **VP2 (declare-or-waive,\
  \ differential):** the born `data_obligation:` DECLARATION passes the sweep on a\n\
  \  fresh init (no placeholder anywhere in born-ops.yaml — grep); a `data_obligation:`\
  \ WAIVER missing\n  `expiry` or carrying a non-date is an init/sweep ERROR (strict);\
  \ a bare-reason `cost:` waiver passes\n  (loose); a half-declared `runbook:` (logs\
  \ without contact) is an ERROR.\n- **VP3 (profile-gated asking):** on a prototype\
  \ fixture only `dependency_cadence` renders on the gap\n  register; on a live+pii\
  \ fixture all five do.\n"
