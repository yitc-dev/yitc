id: SPEC-0122
title: External shared-library dependency — govern a consumer's fix by pinned-dependency-contract,
  escalate to register-as-project
status: active
created_at: 2026-07-02 08:06:01+00:00
travels: null
consumed: false
implements: []
body: "## Scenario\n\nA v2 consumer depends on a shared library whose source lives\
  \ in ITS OWN git repo OUTSIDE every yitc\nterritory — e.g. `<host-home>/lib/<pkg>`,\
  \ `pip install -e`'d, bind-mounted **read-only** into the\nconsumer's containers,\
  \ and depended on by several projects. One day the consumer needs to FIX that\n\
  library. The load-bearing code sits outside its repo, so a fix is BOTH (a) a cross-territory\
  \ write\nthe territory contract forbids (SPEC-0084 §External territory) AND (b)\
  \ invisible to the consumer's\ngraph/coherence — a drift the consumer's own governance\
  \ can never. The consumer must NOT just\nedit the external file in place. This spec\
  \ is the ONE home for HOW that fix is governed: which of\nthe three candidate mechanisms\
  \ applies, and when.\n\nThe owner/AI sees a simple decision: **by default, pin the\
  \ dependency and send the fix upstream**;\n**escalate to registering the library\
  \ as its own yitc project only when it is genuinely shared or\nrepeatedly patched.**\
  \ Vendoring the library's source into the consumer's repo is off the table.\n\n\
  ## Internal\n\nThis spec adds the FOURTH answer to the project-dimension judgement\
  \ (SPEC-0073 classifies every\nartifact+code as kernel | v2-self | project; the\
  \ cross system SPEC-0084/0085/0086 routes fixes to\nregistered PROJECTS). None of\
  \ those covers code that lives in a repo OUTSIDE all yitc territory and\nis depended\
  \ on by a consumer. That code is an **EXTERNAL DEPENDENCY** — external territory\n\
  (SPEC-0084: referenced read-only, NEVER edited from a consumer write). Five rules.\n\
  \n### R1 — Recognize the external-dependency dimension\nWhen judging an artifact's/code's\
  \ dimension (the `before-project-dimension-judgement` bundle),\ncode that (i) lives\
  \ in a git repo outside every yitc project's territory AND (ii) a consumer\ndepends\
  \ on at runtime is an EXTERNAL DEPENDENCY — neither kernel, v2-self, nor project.\
  \ It is\nexternal territory: read-only to the consumer, never an in-place edit target,\
  \ never a consumer\nacceptance-probe target (SPEC-0084 §Scope-boundary). Its INTERNALS\
  \ stay out of the consumer graph\nby design; what the consumer graph DOES record\
  \ is the **pin** (R2).\n\n### R2 — DEFAULT mechanism: the pinned-dependency-contract\n\
  The consumer governs its relationship to the external lib by a PIN, not by editing\
  \ it:\n- **(a) Declare a pin.** The consumer records the exact version / git commit\
  \ / tag of the lib it\n  runs, in its own dependency manifest (the durable, in-territory\
  \ record of WHAT it depends on).\n  The pin is the coherence anchor — reproducible,\
  \ visible to the consumer's own governance.\n- **(b) Read-only in place.** The lib\
  \ is external territory; the consumer never edits it in place\n  and never makes\
  \ it an acceptance-probe target.\n- **(c) Fix upstream, then re-pin.** A needed\
  \ fix goes to the lib's OWN repo (its own git /\n  maintainer / upstream PR); once\
  \ released there, the consumer moves its pin to the fixed version.\nThis is the\
  \ lightest mechanism (CHARTER P1): it adds no fork to maintain, no new territory,\
  \ no new\ngraph — only a pin the consumer already ought to keep. It is the DEFAULT\
  \ for a single-consumer lib\nwith occasional fixes.\n\n### R3 — ESCALATE to register-as-own-project\
  \ (the decision tree)\nEscalate from R2 to registering the lib as a first-class\
  \ yitc project when EITHER trigger holds:\n- **(a) co-developed by >= 2 consumers**\
  \ — a genuinely shared, independently-evolving component\n  (the pin-and-upstream\
  \ loop is paid by multiple owners; the lib is effectively co-owned); OR\n- **(b)\
  \ a single consumer needs RECURRING local fixes** — the pin-and-upstream loop is\
  \ paid so\n  often that treating the lib as an untouchable external dep is a fiction;\
  \ it is de-facto co-owned.\nRegistration gives the lib its OWN territory + graph\
  \ + 9-stage lifecycle + cross-request intake.\nFixes then route as governed **cross\
  \ requests** (SPEC-0084/0085/0086) into that project, are\nexecuted there through\
  \ the lifecycle, released, and every consumer moves its pin (R2 still governs\n\
  each consumer's *relationship* — the pin — even after registration; registration\
  \ governs the lib's\n*internal* development). Escalation is a heavier answer, so\
  \ it is justified only by a trigger, never\ntaken by default (CHARTER P1: pick the\
  \ lightest carrier that fits — LIFECYCLE §Routing analog).\n\n### R4 — vendor-in\
  \ is REJECTED (named retirement)\nCopying the lib's source INTO the consumer repo\
  \ (\"vendor-in\") is NOT a permitted standing mechanism.\nIt creates a maintained\
  \ fork the consumer must re-sync with upstream forever — accretion the P1\nfilter\
  \ forbids (\"what is REMOVED?\" — nothing; a permanent divergent copy is added).\
  \ A vendored copy\nalso silently detaches from upstream security/bug fixes. (A one-off\
  \ copy of a dead/unmaintained tiny\nsnippet is an explicit OWNER exception on its\
  \ own judgement — it is not this doctrine's mechanism and\nis not \"vendor-in as\
  \ a governed answer\".)\n\n### R5 — What this doctrine RETIRES / FORBIDS (retirements,\
  \ explicit)\n- The **silent in-place cross-territory edit** of a shared external\
  \ lib from a consumer session —\n  FORBIDDEN. Already implied by SPEC-0084 (external\
  \ territory is read-only); made explicit here for\n  the external-lib case, because\
  \ it was the drift-prone implicit fallback the incident exposed.\n- **vendor-into-consumer-repo\
  \ as a standing mechanism** — FORBIDDEN (R4).\n- The unspoken assumption that a\
  \ fix must be either \"edit it here\" or \"it's not my repo, ignore it\" —\n  RETIRED:\
  \ the governed answers are R2 (pin+upstream) and, on a trigger, R3 (register), never\
  \ a\n  silent edit and never neglect.\n\n### R6 — Adoption-completeness: the surface-coverage\
  \ leg (declare-or-waive)\nR2's pin proves CODE IDENTITY (the no-local-diff HEALTH\
  \ check — a consumer's pinned copy equals its\nupstream pin), but identity is NOT\
  \ SURFACE COVERAGE. A consumer can pin a library correctly and still\nadopt only\
  \ a FRACTION of the surface it ships — invisibly. R6 closes that blind spot.\n\n\
  - **(a) The consumer-integration MANIFEST (the library ships it).** A pinned dependency\
  \ SHOULD ship —\n  or point at — a consumer-integration manifest: the DECLARED surface\
  \ a consumer is expected to wire\n  up, across five surface kinds — **endpoints,\
  \ UI, ops checks, automation, per-release upgrade-steps**.\n  The manifest is authored\
  \ on the LIBRARY side (its release names what integrating it entails); the\n  library-side\
  \ asks already made of <project> (X-0537/X-0542) SHIP that manifest. R6 does NOT\n\
  \  duplicate that authoring (CHARTER §P5) — it defines only the manifest's CONTRACT\
  \ (the five surface\n  kinds, each surface a stable id) and the CONSUMER obligation\
  \ below. **The same manifest also\n  declares the library's NEUTRAL-MODULE surface**\
  \ (`neutral_modules:` — the package-qualified module\n  paths a consumer must resolve\
  \ FROM the pin rather than keep a copy of): one more declared field on\n  the one\
  \ library-shipped manifest, read by the identity leg's `no_local_diff` (see §TIMING\
  \ + the\n  HEALTH invariant). One manifest carries BOTH legs' declared surfaces\
  \ — coverage and identity — so\n  a consumer has one thing to point at and the kernel\
  \ has no second carrier to parse (CHARTER §P5).\n- **(b) The consumer conformance\
  \ check (report-only).** The consumer's verify/nightly runs a\n  CONFORMANCE check\
  \ against the manifest: for each declared surface, is it INTEGRATED (or explicitly\n\
  \  waived) here? A surface the manifest declares that the consumer neither integrated\
  \ nor waived is a\n  LOUD gap, named surface-by-surface — the exact X-0543 signal\
  \ that was invisible. The check is\n  REPORT-ONLY (it rides the existing conformance\
  \ sweep, adds no new land gate — CHARTER §P1); it\n  REUSES the R2/SPEC-0093 adoption\
  \ evidence surface rather than building a new store.\n- **(c) SHOULD-grade DECLARE-OR-WAIVE\
  \ (mirror SPEC-0093).** The leg is SHOULD, not MUST: a consumer\n  whose pinned\
  \ library ships no manifest YET records a bare waiver (a `reason`, loose per SPEC-0093\n\
  \  rule 6) with re-entry — a recorded, re-visitable waive, never a hard block. But\
  \ the obligation is\n  FAIL-CLOSED over the APPLICABLE dependency set: an applicable\
  \ pinned external-shared-library\n  dependency (R1 — code under external territory\
  \ the consumer depends on) that carries NO manifest\n  declaration and NO waiver\
  \ is itself a LOUD miss. Omitting the declaration cannot dodge the leg — that\n\
  \  is the difference between \"no applicable dependency\" (genuinely nothing to\
  \ answer) and \"applicable\n  dependency, unanswered\" (the declare-or-waive fail-closed\
  \ the X-0543 blind spot needs).\n\nThis is the identity->coverage completion of\
  \ R2: R2 keeps the pinned copy HONEST (no-local-diff); R6\nkeeps the ADOPTION honest\
  \ (no invisible partial surface). Both are read-only health signals, never a\nnew\
  \ gate cascade (CHARTER §P1) — the pin health check and the surface-coverage check\
  \ are siblings.\n\n### Worked case — <host-home>/lib/apify-client (the synthetic\
  \ adoption exercise, AC#3)\n- **Shape.** `<host-home>/lib/apify-client` is a standalone\
  \ git repo (its own `.git`, HEAD 976f2b6),\n  the `apify_parsing` package installed\
  \ via `pip install -e <host-home>/lib/apify-client/`,\n  bind-mounted read-only\
  \ into consumer containers. Its README self-describes as \"Cross-project\n  Apify\
  \ integration.\"\n- **Consumers.** THREE projects bind-mount it: `<project>`, `<project>`,\
  \ `<project>`\n  (proof: `grep -rl apify <host-home>/projects/*/docker-compose*.yml`).\n\
  - **Walk the tree.** DEFAULT (R2) would be pin-and-upstream. BUT trigger R3(a) fires\
  \ — the lib is\n  co-developed by >= 2 consumers (three). → **ESCALATE to register-as-own-project.**\
  \ apify-client\n  becomes a registered yitc project with its own territory/graph/lifecycle;\
  \ the <project> fix\n  (the 2026-07-01 incident that raised X-0146) routes as a\
  \ **cross request** into that project, is\n  executed there through the 9 stages,\
  \ released, and <project> / <project> / <project>\n  each move their pin. Until\
  \ registration lands, the fix stays a tracked cross/task, NEVER a silent\n  in-place\
  \ edit of `<host-home>/lib/apify-client`.\nThis is the escalation branch, not the\
  \ bare default — the case is exactly why R3 exists.\n\n## Reuse across projects\
  \ (the pattern / code / runtime ladder)\n\nR1–R5 govern the ONE case where the reusable\
  \ code lives OUTSIDE all yitc territory (an external\ndep). But the SAME `before-project-dimension-judgement`\
  \ moment also faces the broader question the\nexternal-lib case is a slice of: **a\
  \ capability is wanted in >= 2 projects — in what FORM is it\nreused?** This section\
  \ is the doctrine for that judgement. It carries no new trigger — it is read\nat\
  \ the existing `before-project-dimension-judgement` bundle, alongside R1–R5. (Cross-cutting\n\
  comparison of a would-be-shared concept across projects is a plan-gate lens — pointer:\n\
  the cross-project-comparison-lens trial-plan `cross-project-comparison-lens-at-plan-draft-and-re`\n\
  / <workshop-spec>; this section is the AUTHORING-time reuse-FORM chooser it feeds.)\n\
  \n### STEP-0 — the ownership filter (run FIRST, before choosing a reuse form)\n\
  Before asking \"which reuse form\", classify WHOSE capability this is:\n- **external\
  \ dependency** — the capability is someone else's product we consume (a third-party\n\
  \  service or library). It is external territory (R1); we do NOT reuse-share it,\
  \ we DEPEND on it.\n  If we consume it through code we own, that code is an **adapter**,\
  \ and the adapter's DEFAULT form\n  is a **library** (a pinned local artifact, per\
  \ the CODE rung) — reused as pattern-or-code like any\n  of our capability. Escalate\
  \ the adapter to a **RUNTIME gateway** ONLY when a shared credential /\n  quota\
  \ / rate-limit chokepoint forces one hosted instance to own that chokepoint (see\
  \ the CHOOSER).\n- **our capability** — code/behavior WE author and could reuse\
  \ across our projects. This is the\n  subject of the ladder + chooser below.\n-\
  \ **external-service-behind-our-adapter** — a hybrid: the external service is the\
  \ dependency, the\n  adapter around it is OUR capability. Judge the adapter with\
  \ the ladder; judge the service as the\n  external dep (R1–R5 when it is a shared\
  \ library).\n\n### The 3-form reuse ladder\nA capability reused across projects\
  \ takes exactly one of three forms per component:\n- **PATTERN** — each project\
  \ re-implements the capability INDEPENDENTLY from a shared idea/recipe.\n  No shared\
  \ artifact; divergence is allowed and cheap. Lightest coupling (CHARTER §P1).\n\
  - **CODE** — one PINNED local artifact (a library / SDK / snippet) is shared by-value:\
  \ each consumer\n  depends on a pinned version, reads it read-only locally, and\
  \ moves its pin to adopt a fix\n  (the R2 pinned-dependency-contract generalized\
  \ beyond the external-lib case).\n- **RUNTIME** — ONE hosted instance owns the capability's\
  \ execution + state, and every project calls\n  it over a contract (an API / service).\
  \ Heaviest coupling; justified only when a single\n  source-of-truth or chokepoint\
  \ must exist.\n\n### The code-vs-runtime CHOOSER\nClassify **per component**, not\
  \ per whole system (a system is usually a mix). Record a REASON for\neach; do NOT\
  \ force a single label onto the whole thing.\n- **Primary gate — where must execution\
  \ / source-of-truth-STATE / authority / a chokepoint live?**\n  If exactly one instance\
  \ MUST own the live state / be the single authority / hold a shared\n  credential-or-rate-limit\
  \ chokepoint → **RUNTIME**. If the capability is pure-enough that each\n  consumer\
  \ can run its own copy against its own state → **CODE** (or PATTERN, per TIMING).\n\
  - **Tie-break (when the primary gate does not force it) — contract-volatility +\
  \ who a change\n  serves.** A volatile contract whose changes serve ONE consumer\
  \ favors PATTERN/CODE (independent\n  movement); a stable contract whose changes\
  \ must serve ALL consumers at once favors RUNTIME.\n\n### TIMING + the HEALTH invariant\n\
  - **TIMING — shareable != extract-now.** That a capability COULD be shared does\
  \ not mean extract it\n  today (CHARTER §P1: what is removed? nothing, if premature).\
  \ Change-frequency decides\n  pattern-vs-code: a rarely-changing recipe stays PATTERN\
  \ until a second real consumer + a real\n  divergence-cost appears; only then extract\
  \ to CODE. Extract on the second incident, not the first\n  guess.\n- **HEALTH invariant\
  \ (for the CODE form).** A pinned copy is READ-ONLY locally: never edited in\n \
  \ place, fixed only upstream + re-pinned (R2 generalized). The health check is a\
  \ **no-local-diff**\n  check — the consumer's pinned copy must equal its upstream\
  \ pin. This REUSES the existing\n  Done=Adopted adoption evidence (SPEC-0093 adoption\
  \ probe) as the signal; it adds NO new storage,\n  event, or gate (CHARTER §P1 —\
  \ reuse the existing probe, do not build a new one).\n  - **CARRIED, not merely\
  \ described.** This invariant is now checked by\n    `init.no_local_diff` — the\
  \ report-only IDENTITY sibling of the R6 surface-coverage leg (never\n    raises,\
  \ never gates). Its first application is SPEC-0172 rule 3's spike bridge: for a\
  \ consumer\n    that DECLARED `spike_sandbox.bridge`, every neutral bridge symbol\
  \ must resolve FROM the pin.\n    It distinguishes THREE outcomes and treats the\
  \ first two alike: a byte-identical\n    `surviving-local-copy` and a divergent\
  \ `modified-local-copy` are BOTH violations — an in-place\n    patch is precisely\
  \ the drift the pin exists to prevent (R2c: fix UPSTREAM, then re-pin) — while\n\
  \    the copy REMOVED reads clean. Silence is never the fallback: a declared-but-unresolvable\
  \ pin is\n    a LOUD `pin-unresolved`, so deleting the pin record cannot quiet the\
  \ check while the copy\n    survives (the R6 anti-dodge, applied on the identity\
  \ axis).\n  - **The selector is DECLARED, never inferred — this is what bounds the\
  \ check.** The candidate set\n    is exactly the modules the LIBRARY declares neutral\
  \ (`neutral_modules:` on the consumer-\n    integration manifest of R6(a) — one\
  \ more declared field on the same library-shipped manifest,\n    no new carrier),\
  \ matched PACKAGE-QUALIFIED (`ticket_bridge/channels.py`, not a bare basename).\n\
  \    Which modules are neutral is a library MECHANIC, so the kernel READS that declaration\
  \ and\n    reports the MISSING DECLARATION rather than guessing from the release's\
  \ directory tree. That\n    report NAMES ITS OWNER, because the surface can fail\
  \ to be read for two causes whose owners are\n    OPPOSITE : `neutral-surface-unpointed`\
  \ — this CONSUMER declared no\n    `adoption_completeness.dependencies[].manifest`\
  \ pointer, so no library manifest was reached at\n    all; consumer-owned and consumer-REACHABLE\
  \ — versus `neutral-surface-undeclared` — the manifest\n    WAS reached and ships\
  \ no `neutral_modules:` list; LIBRARY-owned and unreachable from the\n    consumer,\
  \ clearable only by the library shipping the surface and the project re-pinning.\
  \ Both\n    stay LOUD: the split makes the report ADDRESSED, never quieter. Reporting\
  \ ONE kind for both (the\n    pre- shape) asserted the library cause unconditionally,\
  \ so a consumer that had merely not\n    declared its own pointer was told its library\
  \ was at fault — and a permanently loud line naming\n    no reachable action is\
  \ the check every project learns to ignore, which is exactly the scope\n    bound\
  \ this bullet goes on to state. Consequence, and the point: **ordinary product runtime\
  \ code living in the\n    consumer is normal and is NOT flagged** — a product `app/services/channels.py`\
  \ sharing only a\n    basename, and a package-qualified copy of a release module\
  \ the library did not declare neutral,\n    both read clean. A check that fired\
  \ on either would be one every project learns to ignore.\n\n### Worked examples\
  \ (per-component classification, with REASON)\n- **<project> = RUNTIME** — one hosted\
  \ instance must own the shared API credential + rate-limit\n  chokepoint (primary\
  \ gate: chokepoint authority must be singular).\n- **tickets = CODE** — a pinned\
  \ shared library; each project runs its own copy against its own\n  store, no shared\
  \ live-state authority (primary gate not triggered → CODE, stable-enough contract).\n\
  - **frontend-errors = CODE(SDK) + per-project** — the capture SDK is shared as pinned\
  \ CODE, but the\n  error STORE/state is per-project (each project owns its own errors;\
  \ no single source-of-truth\n  across projects → the stateful half is NOT runtime-shared).\n\
  - **auth = PATTERN** — each project re-implements auth from a shared recipe; contract\
  \ is volatile\n  and changes serve one consumer at a time (tie-break → independent\
  \ re-implementation).\n- **Google / GitHub = EXTERNAL + library-adapter** — the\
  \ service is an external dependency (STEP-0);\n  our adapter around it is CODE (a\
  \ pinned library), no shared-credential chokepoint forcing a\n  gateway → stays\
  \ a library, not a runtime gateway.\n\n### Route-check (carrier of a change to THIS\
  \ doctrine)\nThis doctrine is a standing rule. A change to it may need a PLAN escalation\
  \ (SPEC-0005) rather than a\nbare in-place edit — the EXECUTOR decides the carrier\
  \ at Analysis (an in-place amendment when the\nchange deepens the same judgement;\
  \ a PLAN when it opens a new standing-rule surface).\n\n## Rationale\n\nReal incident:\
  \ **X-0146** (<project> → yitc-v2, 2026-07-01) — a consumer needed to GOVERN a fix\n\
  to load-bearing code in a shared external library (`<host-home>/lib/apify-client`)\
  \ that has its own\ngit, is bind-mounted read-only, and is not a registered yitc\
  \ project. Editing it in place is a\ncross-territory write (SPEC-0084) AND is invisible\
  \ to the consumer graph/coherence (drift risk).\nOwner-approved direction 2026-07-02\
  \ (external-consulted, AGREE-with-change): default =\npinned-dependency-contract;\
  \ escalate to register-as-project on the two triggers in R3; vendor-in\nrejected.\
  \ This spec cites SPEC-0073 (the placement contract it extends), SPEC-0084 (the\
  \ territory\ncontract that forbids the in-place edit and provides the cross-request\
  \ routing on escalation), and\nCHARTER §Principle 1 (lightest-mechanism / name-the-retirement).\n\
  \n### History moved from the rule body\n\nEach entry is a passage moved word for\
  \ word out of the rule text of the section it names;\nthe rule it explains stays\
  \ there.\n\n- From «R6»: Incident **X-0543** (<project>, 2026-07-19): <project>'s\
  \ adoption ran 6/15\n  endpoints, ZERO UI, ZERO ops checks for weeks; the owner\
  \ discovered the partial adoption by eye,\n  after ~10 remediation tasks, 2 breaking\
  \ pin bumps, alembic chain breaks and an enum mismatch.\n  The green pin read as\
  \ \"adopted\" the whole time.\n\n## Verification\n\n- **Activation probe (AC#1):**\
  \ `bin/yitc-v2 graph query SPEC-0122` shows `status: active` after\n   `task close`.\n\
  - **Content probe (AC#2):** the shipped spec body weighs all three mechanisms (vendor-in\
  \ /\n  register-as-own-project / pinned-dependency-contract — R2/R3/R4) and names\
  \ the retirements (R5);\n  verifiable in the spec diff.\n- **Adoption-exercise probe\
  \ (AC#3):** the apify-client case (three consumers → R3(a) escalation to\n  register-as-project)\
  \ is recorded in the body; verifiable in the diff.\n- **Delivery probe:** `bin/yitc-v2\
  \ graph query --type view consumer-dimension-bundle` (and the\n  derived `graph/floor-trigger-map.md`)\
  \ surface SPEC-0122 at `before-project-dimension-judgement`\n  alongside SPEC-0073/0090/0093.\n\
  - **Reuse-doctrine content probe :** the shipped body carries the `## Reuse across\n\
  \  projects` section with all five doctrine parts (STEP-0 ownership filter; the\
  \ PATTERN/CODE/RUNTIME\n  ladder + the cross-project-comparison-lens plan pointer;\
  \ the code-vs-runtime CHOOSER; TIMING +\n  the HEALTH invariant; the Route-check\
  \ note) AND the five worked examples (<project>=runtime,\n  tickets=code, frontend-errors=code(SDK)+per-project,\
  \ auth=pattern,\n  Google/GitHub=external+library-adapter); verifiable in the spec\
  \ diff / `graph query SPEC-0122`.\n- **Identity-leg (no-local-diff) probe (R2 HEALTH\
  \ / SPEC-0172 rule 3):** the HEALTH invariant\n  is CARRIED, not described — `init.no_local_diff`\
  \ (`_bridge_declaration`, `_resolve_pinned_release`,\n  `_neutral_module_ids`, `_neutral_modules`,\
  \ `_local_copies`), differential-pinned by the arms\n  of `tests/test_t10694_adoption_completeness.py`\
  \ (the pin suite, EXTENDED per SPEC-0165 rule 5 — not a\n  standalone file), ALL\
  \ IN ONE RUN: a declared consumer with a surviving byte-identical local neutral\n\
  \  module is CAUGHT (L1); the SAME consumer with the copy REMOVED comes back CLEAN\
  \ (L0 — the\n  differential without which the check measures nothing); a LOCALLY\
  \ MODIFIED copy is ALSO caught (L2 —\n  an in-place patch is the drift the pin exists\
  \ to prevent); ordinary product runtime code is NOT\n  flagged, on both a basename-collision\
  \ control and an undeclared-release-module control (L3); an\n  undeclared consumer\
  \ is never examined (L4); an unresolvable pin (L5) and an undeclared neutral\n \
  \ surface (L7) report LOUD rather than clean. Failing inputs are named on each arm\
  \ — chiefly a\n  surviving copy reading clean, both states reading the same, a patched\
  \ copy tolerated as no-longer-a-\n  copy, or product code flagged. Verified MECHANICALLY\
  \ rather than by construction — a basename\n  selector turns L3 RED, tolerating\
  \ a divergent copy turns L2 RED, and inferring the candidate set from\n  the release\
  \ tree turns L7 RED. Like the probe below this is a BODY-ONLY verification pointer,\n\
  \  not an `implements:` anchor — SPEC-0122 is a distributed-enforcement empty-mode\
  \ governance spec, and\n  a code anchor would mis-mode its report-only delivery\
  \ code as consumed code.\n- **Adoption-completeness leg probe (SPEC-0122 R6 / X-0543):**\
  \ the shipped body carries the\n  `### R6 — Adoption-completeness` leg (manifest\
  \ CONTRACT: the five surface kinds endpoints/UI/ops/\n  automation/upgrade-steps;\
  \ the report-only consumer conformance obligation; SHOULD-grade\n  declare-or-waive\
  \ mirroring SPEC-0093, fail-closed over the applicable pinned-dep set), and the\
  \ leg\n  is DELIVERED by the report-only conformance code it governs: `init.adoption_completeness`\
  \ (the SoT\n  reader + `_detect_pinned_shared_libs` independent detector) surfaced\
  \ per-project by\n  `nightly._check_adoption_completeness`, differential-pinned\
  \ by\n  `tests/test_t10694_adoption_completeness.py` (a manifest of N surfaces integrated\
  \ N-1 → a LOUD\n  `surface-not-integrated` report naming the gap; full coverage\
  \ clean). Verifiable in the spec diff /\n  `graph query SPEC-0122` and the named\
  \ code/test. This BODY-ONLY probe (not an `implements:`\n  code anchor) is the INTENDED\
