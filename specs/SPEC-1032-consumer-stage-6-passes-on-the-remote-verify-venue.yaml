body: "## Scenario\n\nA consumer project whose Stage-6 run is heavy declares, in its\
  \ own `yitc-ops.yaml`, that its Stage-6\npasses may run on the remote verify venue\
  \ published on ITS machine. Its owner raises a box from a\nsnapshot that carries\
  \ the project's clone, its engine release and its declared environment, and\npublishes\
  \ the box for that project. From then on each `task test --run` of that project\
  \ runs on the\nbox: a pass alone there has the whole box, and how many passes share\
  \ it at once is the project's own\nmachine setting — the project measures what pays\
  \ and sets it. `land` credits a box verdict exactly as a local one. The project's\
  \ own queue may\nstill keep a pass on its own host by asking for that by name. A\
  \ project that declares nothing sees no\nchange, and the kernel's own venue works\
  \ exactly as before.\n\n## Internal\n\n> **EXTENDS SPEC-1029 to consumer passes.**\
  \ Every SPEC-1029 rule holds unless a rule below states\n> otherwise. This spec\
  \ adds NEW cases only — a declared consumer, a venue published for a consumer, a\n\
  > named per-pass placement — and changes nothing SPEC-1029 requires in a case it\
  \ already covers: an\n> undeclared consumer reads `consumer` and runs locally; a\
  \ kernel venue and every kernel pass behave as\n> SPEC-1029 says.\n\n### 1. The\
  \ declaration — `verify.venue` in the consumer's `yitc-ops.yaml`\nA consumer opts\
  \ in with a `verify.venue` mapping inside its existing `verify` section (the SPEC-0093\n\
  carrier; no new section, no new concern). **Absent mapping = SPEC-1029's `consumer`\
  \ branch,\nbyte-identical** — the pass runs locally and nothing below is read. The\
  \ mapping carries:\n  - `stage6: on` — the only pass class this spec routes. A routed\
  \ pass runs ALL its declared layers on\n    the box, in the order and with the dependencies\
  \ the layer runner already applies; one pass is\n    never split between box and\
  \ host. A consumer LAND leg stays local under the reason\n    `consumer-land-local`.\n\
  \  - `environment: [{name, cmd, expect}, …]` — the checks the box must pass: each\
  \ `cmd` runs on the box,\n    must exit 0, and its stdout must equal `expect` exactly.\
  \ The outputs of the declared checks are the\n    consumer part of the environment\
  \ fingerprint — what is not declared is not compared.\n  - `width: whole | per-live-pass`\
  \ — OPTIONAL: how wide a routed pass runs on the box (rule 3). Absent\n    reads\
  \ `whole`.\nA mapping that does not parse, lacks `stage6: on`, holds a malformed\
  \ check, or holds a `width` that is\nneither of the two is INVALID: the pass runs\
  \ locally under the reason `venue-declaration-invalid`,\nshown on the Stage-6 row\
  \ — never a silent local run.\n\n### 2. Routing — the consumer arm of `venue_decision`\n\
  For a consumer pass, in this order: undeclared → `consumer`; declaration invalid\
  \ →\n`venue-declaration-invalid`; no record → `no-venue`; a record not published\
  \ for a consumer →\n`consumer-needs-consumer-venue`; a record published for ANOTHER\
  \ repository → `venue-other-project`; a\nland leg → `consumer-land-local`; an explicit\
  \ `--placement local` → `placement-local` (rule 6); else →\n`venue`. Every reason\
  \ but `venue` runs the pass locally. SPEC-1029's `small-selection` cut and its\n\
  sandbox carve-out apply unchanged. The Stage-6 row names the reason (`verify_metrics.venue_routing`)\n\
  for every pass of a consumer that declares `verify.venue`, and for a kernel pass\
  \ that reads\n`venue-consumer-only`; an undeclared consumer's row and every other\
  \ kernel row carry none. **A consumer venue serves ONE consumer repository's Stage-6\
  \ passes\nonly:** a kernel pass on a machine whose record is published for a consumer\
  \ reads\n`venue-consumer-only` and runs locally.\n\n### 3. Sharing the box — the\
  \ project balances it\n- **A pass alone on the box has the whole box.** The width\
  \ written into its layer commands\n  (`YITC_VERIFY_LAYER_WORKERS`) is the box's\
  \ thread count; the project's own declared\n  `verify.layer_worker_shares` divide\
  \ it among layers exactly as on its host. SPEC-1029 rule 5's\n  suite-partition\
  \ derivation and its lower-priority arm do not apply to a consumer pass: no land\
  \ runs\n  on a consumer venue, so a consumer pass runs at normal priority.\n- **Under\
  \ `width: per-live-pass`** a pass runs at the box's thread count divided by the\
  \ consumer\n  passes live on the box at its admission, itself included, and at least\
  \ 1: alone it still has the\n  whole box, beside one live pass half of it. The pass\
  \ keeps that width to its end; its Stage-6 row\n  names the width, the policy and\
  \ the count (`venue_workers`, `venue_workers_bound`,\n  `venue_width_live`). Under\
  \ `whole`, or with no `width`, every pass has the box's thread count.\n- **How many\
  \ passes share the box is the project's machine setting:** the existing\n  `YITC_VENUE_STAGE6_MAX_CONCURRENT`\
  \ on the machine that publishes the venue — an UPPER bound. Unset, a\n  consumer\
  \ venue admits ONE pass at a time. SPEC-1029's load headroom (`YITC_VENUE_STAGE6_HEADROOM_LOAD1`,\n\
  \  the same machine settings) still applies: a pass waits while either bound holds\
  \ it, and the wait names\n  which one (`cap` or `headroom`). Passes admitted together\
  \ share the box's CPUs through the operating\n  system.\n- **The kernel never touches\
  \ a consumer pass's CPUs.** It assigns no CPU set, and\n  `_venue_core_split_apply`\
  \ does not run on a consumer venue: a mask the project's own commands set\n  (e.g.\
  \ `taskset`) stays as the project set it.\n- **Admission is SPEC-1029's box lease,\
  \ atomic only — at every admission.** A consumer venue requires the\n  atomic admission\
  \ primitive (`flock`) on the box: the readiness probe checks it and `venue publish`\n\
  \  refuses without it; and the box's admission prologue checks it again for EVERY\
  \ consumer pass, which\n  aborts INDETERMINATE with the class `atomic-admission-unavailable`\
  \ before any test starts when it is\n  missing. SPEC-1029's non-atomic admission\
  \ fallback never applies to a consumer pass.\n\n### 4. The executor of a consumer\
  \ pass\nA consumer tree carries no engine, so SPEC-1029 rule 3's «the runner of\
  \ the shipped tree» reads, for a\nconsumer pass: **the consumer's INSTALLED engine\
  \ release on the box** (rule 6) runs its own layer runner\nover the shipped consumer\
  \ tree — the declared layers and the mandatory test sweep, exactly as `task test\n\
  --run` runs them on the host. **The host resolves the pass's plan ONCE** — the SPEC-1030\
  \ selection and\ncredits per layer and the reading of a previous attempt — and ships\
  \ it with the request; the box\nexecutes that plan and never selects again. The\
  \ SPEC-0181 selection of its test sweep is resolved on\nthe host too and ships with\
  \ the plan. The pass ships only its candidate commit, to its own request\nref: no\
  \ `main`, no tags, and no mirror of the clone's `main`. The runner identity the\
  \ envelope binds (rule 5) is that\nengine release's identity.\n\n### 5. The consumer\
  \ envelope\nBeyond SPEC-1029 rule 4, the envelope of a consumer pass binds: the\
  \ consumer tree digest; the engine\nrelease identity on the box, which must equal\
  \ the consumer host's; the shipped plan; the outputs of the\ndeclared environment\
  \ checks; and the width the pass ran at. Any mismatch is INDETERMINATE with the\
  \ class\n`consumer-identity-mismatch`, never GREEN. The per-layer outcome export\
  \ is the local layer runner's\nown, so the Stage-6 row, the SPEC-1030 credit and\
  \ the SPEC-0065 land credit read a remote pass as they\nread a local one. One case\
  \ differs: a declared layer that the shipped plan lists units for (a layer\nwhose\
  \ selection or credit is deciding, so the host's `list` named its units) and whose\
  \ `list` answers\nwith no unit on the box verified none of those units there, whatever\
  \ its `command:` returned. It is\nnamed on the Stage-6 row (`verify_metrics.venue_empty_layers`,\
  \ its row's `adapter.listed_none`), and\nno land takes a verdict for that layer\
  \ from the pass.\n\n### 6. The box for a consumer — image, publish, placement\n\
  - **Image.** The snapshot (SPEC-1029 rules 3 and 6) carries a FULL-HISTORY bare\
  \ clone of the consumer\n  repository (never shallow); the consumer's engine release\
  \ at the SAME absolute path its host runs it\n  from, so a test that imports the\
  \ engine by its host path finds it unchanged; and the declared\n  environment. The\
  \ readiness probe runs every declared check; `venue publish` refuses on a failing\
  \ or\n  mismatching check, naming it. The image is built by `venue seed --build\
  \ -C <consumer> --provision <script>`.\n  The image and the engine release identity\
  \ (rule 5) are taken over the files the release carries:\n  the install's own files\
  \ — the venue binding at its default home, a root `events.jsonl`, `.yitc/` —\n \
  \ are part of neither, and any other file added, changed or removed (a byte cache\
  \ or a symlink aside)\n  still refuses the build and mismatches the identity.\n\
  - **Published for one repository.** `venue publish` run for a consumer (`-C <consumer>`)\
  \ writes into the\n  venue record (SPEC-1029 rule 1) `serves:` — the real path of\
  \ that repository's git common dir on the\n  publishing machine — which rule 2 compares;\
  \ one machine path is one repository. A kernel pass reads\n  `venue-consumer-only`\
  \ from the first moment such a record can exist.\n- **Named per-pass placement.**\
  \ `task test --run --placement local` runs a declared consumer's pass\n  locally\
  \ while a venue is published, under the reason `placement-local` on the Stage-6\
  \ row;\n  `--placement auto` (the default) is rule 2. On a kernel pass `--placement\
  \ local` is refused\n  (`placement-kernel-unsupported`); SPEC-1029 rule 7 is unchanged\
  \ for kernel passes. An unreachable or\n  faulting venue stays SPEC-1029 rule 7's\
  \ INDETERMINATE abort — never an implicit `placement-local`.\n- **The occupancy\
  \ view.** `venue show --leases` prints the admitted passes, the cap and the headroom.\n\
  \  It is read-only, does not wait, and decides nothing.\n- **Layer timeouts on the\
  \ box are uncalibrated** until the consumer measures them there under SPEC-0208\n\
  \  (its tuple, at the maximum admission it runs, n ≥ 20 over a closed window); an\
  \ estimate never stands in\n  for that measurement.\n\n## Parameters\n\n| Name |\
  \ Where | Default | consumed |\n|---|---|---|---|\n| `YITC_VENUE_STAGE6_MAX_CONCURRENT`\
  \ | machine settings (existing, SPEC-1029 / <workshop-spec>) | on a consumer venue:\
  \ 1 | false |\n| `YITC_VENUE_STAGE6_HEADROOM_LOAD1` | machine settings (existing,\
  \ SPEC-1029) | as SPEC-1029 | false |\n| `verify.venue.width` | the project's `yitc-ops.yaml`\
  \ (rule 1) | `whole` | false |\n\n## Rationale\n\nThe pilot consumer, cryptochart\
  \ (an external adopter on its own 32-core host), measured one full\nStage-6 run\
  \ of its 12–14 layers at about 425 s (median of 24 green runs) holding ~18 of 28\
  \ pinned\ncores, so its host admits one full run at a time (proposal 89 on the kernel's\
  \ public tracker; its own\nload queue, issues 93, 102 and 109 there). Owner direction\
  \ events.jsonl#ts=: step 1 routes a consumer's\nStage-6 passes to a rented box;\
  \ the place choice beside the host is the consumer's own trial. Its\nenvironment\
  \ answer (events.jsonl#ts=): every layer routable, no secrets, hermetic,\nwarm caches\
  \ and fonts needed, full history needed, the engine imported from its install path.\
  \ Owner\ndecision events.jsonl#ts=: no CPU slots — a pass alone takes the whole\
  \ box and the\nproject balances the sharing itself; the kernel's own venue already\
  \ runs concurrent Stage-6 passes on\none box this way; the owner left the number\
  \ of concurrent passes to the project\n(events.jsonl#ts=). The slot designs of the\
  \ gate-specs and plan-check passes are in the proposing plan's\naudit records. Proposing\
  \ plan: `plans/consumer-stage-6-passes-on-the-remote-verify-venue.md`.\n\n (2026-10-17)\
  \ amended rules 1, 3, 5 and 6 in place from the pilot's first routed passes\n(issues\
  \ 123, 125 and 131 on the kernel's public tracker; route: the on-demand consult\n\
  decisions/-audit-consult-on-demand.yaml).\nThe install's own binding failed the\
  \ image build and made every pass `consumer-identity-mismatch`;\ntwo passes admitted\
  \ together at the full width each gained no throughput on the pilot's box and\n\
  overloaded it, while a fixed half width slowed a lone pass 2.3 times (issue 125),\
  \ and the owner had left the\nsharing to the project (events.jsonl#ts=, #ts=), so\
  \ the\nwidth became a declared policy beside the machine's admission cap; a layer\
  \ that runs only under an\nenvironment variable of the host listed no unit on the\
  \ box and its pass read green. Forwarding a\nproject's environment variables to\
  \ the box was declined; such a card runs with `--placement local`.\nThe width policy\
  \ removes the overload only in part: a pass keeps the width of its own admission,\
  \ so\none admitted alone keeps the whole box when a second joins at half.\n\n##\
  \ Implementation notes\n\n- `venue_decision` gains the consumer inputs (declaration,\
  \ the record's `serves`, the placement) and the\n  reasons of rule 2; it stays pure\
  \ and box-free, as SPEC-1029 requires.\n- The venue record gains `serves`, written\
  \ only by `venue publish -C <consumer>`; a record without it is\n  a kernel venue.\n\
  - SPEC-1029 rule 2's paragraph «Consumers are OPT-IN ONLY and out of this slice\
  \ … » is replaced,\n  in place (`spec edit`, additive per SPEC-0005 rule 7), by\
  \ one line pointing at this spec; that edit\n  ships with the card that activates\
  \ this spec.\n- A routed consumer pass is composed in `remote_verify.consumer_route`\
  \ and never goes through\n  `execute_remote_verify`, which stays the kernel executor's\
  \ one call site.\n- `per-live-pass` : the box divides the request's width by the\
  \ admission prologue's own\n  count of the other live Stage-6 leases, taken under\
  \ its lock, plus one (`_CONSUMER_WIDTH_STEP`, right\n  after the admission), and\
  \ writes the derivation into the envelope; the host checks the width\n  against\
  \ it (`consumer_expected_width`). The empty-layer case travels as the plan's per-layer\n\
  \  `listed` count (`land_verify_legs._adapter_shipped_decision`) and the box follower's\
  \ `listed_none`\n  mark, read by both Stage-6 credit readers (`worktree._stage6_row_covers_land`,\n\
  \  `_stage6_layer_credit`). The install's own paths are `release.INSTALL_LOCAL_PATHS`,\
  \ the one carrier\n  both digests read past. The identity (`_engine_identity`) keeps\
  \ its `bin_digest` and adds a\n  `tree_digest`, the same fold over every regular\
  \ file of a root that holds a manifest, with the\n  build's own component exclusion\
  \ (`release.NON_ARTIFACT_COMPONENTS`); the box walks the tree the\n  image installed\
  \ and the host its own install (`release install` writes a plain directory), so\
  \ the\n  two read the same files. A git checkout used as the engine root is walked\
  \ whole too: an untracked\n  file there, which the image build does not read, mismatches\
  \ the identity. A layer whose selection\n  and credit are not deciding is not in\
  \ the plan, so no `listed` count travels for it and the box\n  marks nothing for\
  \ it; nor does a box `list` that fails for another reason (an exit, a timeout, a\n\
  \  malformed answer), whose layer verdict is its `command:` as on any host.\n\n\
  ## Verification\n\nProbe contracts, each observed failing first:\n- Rule 1: absent\
  \ mapping → `consumer`, byte-identical to SPEC-1029; each invalid form (no `stage6`,\
  \ a\n  malformed check) → `venue-declaration-invalid`; a check whose command fails\
  \ while its stdout equals\n  `expect` fails the readiness probe; a routed pass whose\
  \ declared layers depend on each other runs them\n  in the runner's order on the\
  \ box.\n- Rule 2: every reason of the order above, one probe each, including a pass\
  \ from a second repository on\n  the same machine → `venue-other-project` and a\
  \ kernel pass on a consumer venue → `venue-consumer-only`.\n- Rule 3: a pass alone\
  \ runs at the box's thread count; with the cap unset a second pass waits (`cap`)\n\
  \  until the first ends; with the cap 2 and the load under the headroom two passes\
  \ run at once; with the\n  cap 2 and the load over the headroom the second waits\
  \ (`headroom`); two clients racing for the last\n  admission → exactly one is admitted;\
  \ a box without `flock` refuses `venue publish`; `flock` removed\n  after publish\
  \ → the next consumer admission aborts `atomic-admission-unavailable` and no test\
  \ starts;\n  a mask a layer sets with `taskset` is unchanged after several admission\
  \ polls.\n- Rule 4: a consumer tree with no engine in it runs on the box through\
  \ the installed engine; a SPEC-1030\n  narrowed plan runs exactly the shipped units\
  \ and its row is a partial run; a retry after a failed\n  attempt runs the host-resolved\
  \ plan with its credits.\n- Rule 5: a corrupted shipped tree, a different engine\
  \ release, a changed shipped plan, a changed output\n  of a declared check (the\
  \ pilot declares one over its font set) and a different width each yield\n  `consumer-identity-mismatch`,\
  \ never GREEN.\n- Rule 6: a shallow clone, or a failing declared check, refuses\
  \ `venue publish` naming it;\n  `--placement local` → `placement-local` on the row;\
  \ on a kernel pass → refused; an unreachable venue\n  → INDETERMINATE, never `placement-local`;\
  \ `venue show --leases` changes no lease.\n- Rules 1, 3, 5 and 6 : an install holding\
  \ the binding, a root journal and `.yitc/` passes the\n  image pre-flight and its\
  \ identity equals the bare release's, while a changed or added release file\n  fails\
  \ both; `per-live-pass` alone runs at the thread count, beside a live pass at half\
  \ of it, floor\n  1, and `whole` or no `width` at the thread count; an unknown `width`\
  \ is `venue-declaration-invalid`;\n  a layer the plan lists units for whose `list`\
  \ names none on the box is named on the row and no land\n  takes its verdict from\
  \ the pass (tests/test_t13994_consumer_venue_pilot_fixes.py).\n- Live trigger (CHARTER\
  \ §P8): the pilot consumer's first routed Stage-6 passes on its own published box,\n\
  \  each with reason `venue` from the real `venue_decision` and credited by its `land`\
  \ — its journal rows,\n  reported through its public tracker issue.\n"
