id: SPEC-1054
title: Spike-sandbox data floor, mechanism only - the kernel ships the three-strand
  treatment, declare and prove mechanics; each project decides in its own decision
  file what it protects
status: active
created_at: 2026-10-27 14:54:27+00:00
travels: null
consumed: false
extension: null
implements: []
body: "## Scenario\n\nA spike sandbox is worth having because it holds REAL data —\
  \ real volumes, real edge cases, real\nforeign-key tangles. So the sanctioned way\
  \ to fill one is to take a static copy of production and\nrestore it into the sandbox.\
  \ That is permitted, and it is the point.\n\nA restored copy arrives carrying webhook\
  \ URLs that still route, tokens that still authenticate,\npeople's addresses that\
  \ are harmful the moment they are read, and outbox rows that will send the\nmoment\
  \ a worker starts. WHICH of that a project protects, and how strictly, is the PROJECT's\
  \ decision:\none project's sandbox is a caged stack only its owner reads, another's\
  \ is shared with contractors.\nThe kernel does not decide it for them. The kernel\
  \ ships the MECHANISM that makes any such decision\nexplicit, recorded and provable\
  \ — and a set of RECOMMENDED DEFAULTS a project keeps unless it records\notherwise.\n\
  \nSo the owner/AI answers five questions the same way every reader would:\n\n1.\
  \ May I restore a production copy into my spike sandbox? — **Yes. That is the sanctioned\
  \ source.**\n2. What does the kernel make me do? — **Decide every copied surface\
  \ explicitly in my own decision\n   file, and PROVE the copy against those decisions\
  \ by querying it, with a control per detector.**\n3. What does the kernel decide\
  \ for me? — **Nothing it does not let me change: the actor split, the\n   NEUTRALIZE-only\
  \ reachability stance, the untreated-artifact window and its destruction are\n \
  \  recommended DEFAULTS, born into my carrier, which I override only by a recorded\
  \ decision.**\n4. What may I ACCEPT? — **Any class on any strand — reachability\
  \ and operational state included —\n   by a recorded acceptance naming the class,\
  \ its purpose, who may read it, its scope and when it is\n   destroyed.**\n5. What\
  \ can the owner always ask? — *\"prove nothing is in your spike copy beyond what\
  \ you decided,\n   and name everything you accepted or overrode\"* — and get a machine\
  \ answer with controls, not a\n   reassurance.\n\n## Internal\n\n> **SANDBOX FAMILY\
  \ — navigation, not a rule.** `spike_data_safety` is ONE of three\n> separately\
  \ named concerns that together answer a project's sandbox questions: `sandbox_entry`\n\
  > (SPEC-0169 — WHERE a collaborator enters, OPT-IN), `spike_sandbox` (SPEC-0172\
  \ — WHETHER a caged\n> bridge exists and its pinned release) and `spike_data_safety`\
  \ (this spec — WHAT the restored copy\n> carries). They stay DISTINCT; a reader\
  \ who knows only one of the names sees all three via\n> `bin/yitc-v2 graph query\
  \ sandbox-family`. A navigational pointer (<workshop-spec> rule 8) — it changes\
  \ nothing here, and it creates NO\n> concern-to-concern dependency: declaring a\
  \ sandbox does not, by this pointer, make anything owed.\n\n### 0. MECHANISM vs\
  \ POLICY — what the kernel fixes and what the project decides\nEvery obligation\
  \ in this spec is one of two kinds, and §8a labels each row with its kind.\n\n**KERNEL\
  \ MECHANISM — mandatory for every project that restores a production copy.** A project\
  \ may\nnot opt out of these, because without them no decision of its own is visible\
  \ or provable:\n- **M1 — the vocabulary:** the live-system axis (rule 1), the three\
  \ strands and each strand's verbs,\n  classification many-to-many (rule 3).\n- **M2\
  \ — the declaration:** the `spike_data_safety` concern, declare-or-waive with its\
  \ REFUSABLE\n  waiver (rule 5), and the decision-file key shape (§5a).\n- **M3 —\
  \ every surface carries an explicit decision; silence is refused** (rule 6b): a\
  \ strand, a\n  verb per strand, or none-of-the-three with a reason.\n- **M4 — the\
  \ proof queries the copy against the project's OWN decisions**, with a control per\n\
  \  detector (rule 6a); a detector exclusion is keyed to proven provenance, never\
  \ to a bare value\n  (rule 3).\n- **M5 — the acceptance record:** an ACCEPT, on\
  \ any strand, and an override of a default (below)\n  each record the class or default\
  \ concerned, its PURPOSE, WHO may read it, its SCOPE (e.g. which\n  stack, which\
  \ environment) and WHEN it is destroyed — recorded BEFORE any accepted residual\
  \ is read,\n  emitted or exposed outside that scope, and in any case before the\
  \ proof can pass.\n- **M6 — every accepted or overridden item is reported by name**\
  \ in the proof output (rule 6c).\n\n**PROJECT POLICY — recommended defaults.** These\
  \ are what the kernel RECOMMENDS and what the born\ntemplate states; each binds\
  \ a project until that project overrides it:\n- **P1 — the actor split** (rule 2);\n\
  - **P2 — NEUTRALIZE as reachability's verb** (rule 3) — the born-template stance;\n\
  - **P3 — the untreated-artifact window:** who may touch it, the inert restore, the\
  \ probe emission\n  limbs, and destruction of the artifact chain (rule 4);\n- **P4\
  \ — the disposition of an unqueryable surface** (rule 6b).\n\n**THE OVERRIDE ROUTE\
  \ — one, and only one.** A project overrides a default only by a decision RECORDED\n\
  IN ITS OWN DECISION FILE (the §5a file, or the file its `data_safety:` declaration\
  \ names), carrying\nthe M5 record and naming the default it overrides. An override\
  \ recorded anywhere else — a chat, a\ncard, a commit message, an operator's memory\
  \ — does not exist, and the default binds. The kernel\nnames no key for the override\
  \ and validates none of its content: the record's form inside that file\nis the\
  \ project's, and its proof reads it (M4) and reports it by name (M6). A project\
  \ that records no\noverride is bound by every default exactly as stated.\n\n###\
  \ 1. The axis is the LIVE SYSTEM, not \"production data\"\nThe boundary this floor\
  \ draws is **live production system vs a static copy derived from it** — NOT\nproduction-data\
  \ vs not. A production-DERIVED static copy is the **sanctioned** data source of\
  \ a\nspike sandbox.\n**Why this rule exists as a rule and not as a wording preference:**\
  \ the production-data-vs-not axis\nputs the practice's own subject matter on the\
  \ forbidden side, so a restored copy reads as \"the\nsandbox's own data\" the moment\
  \ it lands and the floor reads satisfied while the copy carries live\nvalues. A\
  \ later surface MUST NOT restate the floor on the production-data axis.\n\n### 2.\
  \ THE ACTOR SPLIT — the recommended default, stated, never inferred\nTwo actors,\
  \ two different permissions. By default both halves bind, and neither may be left\
  \ to a\nreader's inference:\n\n- **The named refresh/export STEP MAY read the live\
  \ production system READ-ONLY**, for the sole\n  purpose of producing a static copy.\
  \ It writes nothing there, changes nothing there, and it is the\n  ONLY actor holding\
  \ this permission.\n- **The spike RUNTIME NEVER connects to the live production\
  \ system.** No process inside the spike\n  stack is pointed at it, tunnelled to\
  \ it, reading from it, or writing to it.\n\nA floor that states only \"a spike never\
  \ touches production\" collapses these two actors into one and\nis therefore defective\
  \ by this rule.\nThis is POLICY (§0 P1): a project relaxes either half only by a\
  \ recorded override (§0), which names\nthe actor, the live endpoint, the purpose\
  \ and the scope; until then the default binds.\n\n### 3. THREE STRANDS — three different\
  \ dangers, each with its OWN verbs\nA restored copy carries three kinds of danger.\
  \ They are not degrees of one danger, and a strand\nanswered with another strand's\
  \ verb is **not answered**.\n**Classification is MANY-TO-MANY, and this is the common\
  \ case, not an edge.** One surface may sit\nin two strands or all three, and EVERY\
  \ applicable strand must be decided and proven for it. A\ncustomer email address\
  \ is DISCLOSURE (it identifies a person) and REACHABILITY (mail sent to it\narrives\
  \ at a real inbox); a decision on one strand says nothing about the other. Filing\
  \ a surface\nunder one strand does not discharge the others.\n\n- **REACHABILITY\
  \ — can this value cause a LIVE side effect?**\n  The class is anything that can\
  \ **route, authenticate, identify, schedule or trigger**: webhook\n  URLs, tokens,\
  \ bot credentials, redirect targets, addressable contacts — **and** external resource\n\
  \  IDs and object keys, which route just as surely as a URL does.\n  Verbs: **NEUTRALIZE**\
  \ — replace the value with one that cannot reach — **or explicitly ACCEPT.**\n \
  \ **NEUTRALIZE is the recommended default** (§0 P2) and the born-template stance;\
  \ a project ACCEPTs\n  a reachability class only by a recorded acceptance (§0 M5),\
  \ whose scope says where the value may\n  still reach (e.g. \"the owner's own caged\
  \ stack only\").\n  **A row SEEDED AFTER the treatment is not a copied value.**\
  \ The decision applies to values that\n  ORIGINATED IN THE PRODUCTION COPY. A sandbox-owned\
  \ row written AFTER neutralization — the admin a\n  bring-up seeds so that anyone\
  \ can sign in at all, whose hash must be real because a hash nobody can\n  use is\
  \ the same as no account — was never in the copy, so it needs neither an acceptance\
  \ nor a\n  neutralization; its credential is a sandbox credential, not a production\
  \ one under another name.\n  **AND A DETECTOR EXCLUSION FOR SUCH A ROW IS KEYED\
  \ TO PROVEN POST-TREATMENT PROVENANCE, NEVER TO A\n  BARE ADDRESS** (§0 M4). A detector\
  \ exclusion keyed only on an identifying value says \"skip this\n  address\", which\
  \ is also what a SURVIVING PRODUCTION CREDENTIAL at that address looks like — so\
  \ an\n  address-keyed exclusion does NOT satisfy this rule, however carefully the\
  \ address is declared.\n  What must be proven, at a DECLARED uniqueness scope: the\
  \ excluded row is the post-treatment\n  seeded one and there is EXACTLY ONE of it;\
  \ no copied row holds the identifying value; and the\n  detector compares the identity\
  \ in the SAME NORMALIZED form the database stores it in. The\n  shapes that defeat\
  \ a careless exclusion are named so they can be checked for: a uniqueness\n  scope\
  \ narrower or wider than the one the identity is really unique at, a normalization\
  \ mismatch\n  between comparison and storage, bad ordering, and a LATER import re-introducing\
  \ a copied row at\n  that address after the proof passed.\n  **ORDERING is part\
  \ of the rule:** seed AFTER the treatment — earlier and the treatment\n  neutralizes\
  \ the hash — and BEFORE the proof, or the one row nothing inspected is the excluded\n\
  \  one.\n  **Two conditions that are commonly OVERSTATED, in their correct strength.**\
  \ Declaring the\n  seeded identity as a single value in the same carrier as the\
  \ sentinels (rule 5) is\n  TRACEABILITY — it keeps the value out of hard-coding\
  \ and out of naming-convention inference —\n  and is NOT itself a safety property;\
  \ it proves nothing about what the copy contains. And \"it is\n  structurally impossible\
  \ for a copied row to hold that identifying value\" holds ONLY where a\n  DATABASE\
  \ CONSTRAINT enforces it AND a proof runs over the NORMALIZED identity at the declared\n\
  \  uniqueness scope; asserted from the treatment's rewrite alone, the claim is stronger\
  \ than the\n  mechanism delivers.\n- **DISCLOSURE — is this content harmful merely\
  \ by being READABLE?**\n  Personal data, financial records, anything privacy-bearing\
  \ or regulated. Neutralizing a webhook\n  URL does not neutralize a person's address,\
  \ and no length of neutralize-list ever will: the\n  danger is not that the value\
  \ reaches something, it is that a reader sees it.\n  Verbs: **MASK, MINIMIZE, EXCLUDE,\
  \ or explicitly ACCEPT.**\n- **OPERATIONAL STATE — will this copied state make WORK\
  \ HAPPEN?**\n  Outbox rows, queued jobs and scheduler entries are the obvious members,\
  \ but the class is defined\n  by the EFFECT, not by the moment or the storage shape:\
  \ **any copied state that can cause work\n  when ANYTHING consumes it** — a worker,\
  \ a scheduler, a request handler, a database trigger, a\n  stored procedure, a replication\
  \ or change-data-capture subscription, an installed extension, or\n  an external\
  \ callback arriving later — **regardless of WHEN that happens.** A job that fires\n\
  \  tomorrow, or only after a user acts, is in this class; so is executable schema\
  \ that ships inside\n  the copy and calls out the moment it is restored.\n  Verbs:\
  \ **DEFUSE** — the state is drained, cancelled, disabled or marked terminal before\
  \ anything\n  can consume it — **or explicitly ACCEPT.**\n  *Two readings this wording\
  \ exists to refuse:* \"it does not fire at startup, so it is not\n  operational\
  \ state\", and \"a trigger is schema, not a row, so no strand covers it\".\n\n**ACCEPT\
  \ is a recorded decision, never a fourth free option, and it is available on EVERY\
  \ strand.**\nIt is the §0 M5 record: the class accepted, the STRAND(S) it accepts,\
  \ its PURPOSE, WHO may read it,\nits SCOPE and WHEN it is destroyed — recorded BEFORE\
  \ any accepted residual is read, emitted or\nexposed outside that scope, and in\
  \ any case before the proof can pass. (Never \"before the copy is\nworked with\"\
  \ — rule 4 forbids that phrasing by name.) An acceptance answers ONLY the strands\
  \ it\nnames: accepting a surface's disclosure leaves its reachability and its operational\
  \ state\nundecided until they are decided too (§0 M3). It is machine-visible as\
  \ a residual — the proof\nREPORTS every accepted class rather than passing silently\
  \ over it, so \"accepted\" never reads the\nsame as \"absent\" (§0 M6). Silence\
  \ is not acceptance, and a blanket acceptance of every class is not\nan answer to\
  \ any strand — it is the strand going unanswered with a signature on it.\n\n###\
  \ 4. THE UNTREATED ARTIFACT — the recommended default window, from the first exported\
  \ byte to destruction\nEverything in this rule is POLICY (§0 P3): it binds as stated\
  \ until the project records an\noverride naming the clause it relaxes, the M5 record,\
  \ and the scope the relaxed clause applies to.\nThe obligation attaches to the **production-derived\
  \ ARTIFACT**, not only to the restored database.\nIt begins at the FIRST EXPORTED\
  \ BYTE and ends when that artifact is treated-and-proven or\ndestroyed. **A STREAMED\
  \ export is the preferred shape, and the rule covers both.** Where the export\n\
  can be piped straight into the restore with no host-side dump file at all, there\
  \ is simply less\nuntreated artifact to govern, and that is the safer arrangement\
  \ rather than merely a permitted one.\nWhere a dump IS staged, everything below\
  \ applies to it. In scope for the whole of that interval: the\ndump or export itself\
  \ (when one exists), its temporary files, any CI artifact or object-store copy it\n\
  was staged through, every backup of it, the restored copy — **and the OUTPUTS of\
  \ every step that\nhandles it**: the logs, console output, traces, and the before/after\
  \ or redaction REPORTS produced by\nthe export, the restore, the treatment step\
  \ and the probes. A treatment step that writes the values\nit just removed into\
  \ its own report has moved the data, not removed it; those outputs are untreated\n\
  artifacts and carry the same emission limits and the same destruction obligation\
  \ as the dump.\n\n- **WHO may touch an untreated artifact:** only the **export step,\
  \ the restore, the treatment step\n  and the probes** — **plus a person holding\
  \ a recorded acceptance (§0 M5), strictly within the scope\n  that acceptance names.**\
  \ Application workers, schedulers, request handlers and networked processes\n  stay\
  \ OFF until the proof passes; during that window the environment holding the artifact\
  \ denies\n  outbound egress and keeps executable schema (triggers, stored procedures,\
  \ subscriptions,\n  extensions) disabled — otherwise the copy acts before anyone\
  \ has judged it.\n  **Executable schema is made inert AS PART OF the restore, never\
  \ disabled afterwards.** The\n  restore is INSIDE this window, and a naive restore\
  \ creates-and-ARMS the schema as it goes — a\n  copied trigger can enqueue a live-shaped\
  \ call on the very insert that populates the copy, with no\n  worker, no scheduler\
  \ and no application running. The copy must arrive inert.\n- **WHAT A PROBE MAY\
  \ EMIT — a PROPERTY, never a list of permitted shapes.** A probe is allowed\n  inside\
  \ the window precisely because it is supposed to be blind, and blindness is a property\
  \ of\n  the EFFECT of its output, not of the output's format. **The test has TWO\
  \ limbs, and an emission\n  must pass BOTH:** it may not (a) increase what its reader\
  \ learns about any identifiable person,\n  account or tenant in the copy, and it\
  \ may not (b) reveal, reconstruct or link any value that can\n  route, authenticate,\
  \ identify, schedule, trigger or reach an external resource. Limb (b) is not\n \
  \ redundant: a live webhook URL or an object key is about no person at all, so a\
  \ person-centric\n  test alone would wave it through. Anything that does not clearly\
  \ pass BOTH limbs is treated as\n  failing and needs a recorded acceptance first\
  \ — the permission to touch is not a permission to\n  look. **The acceptance must\
  \ cover the limb the emission fails:** limb (a) by an acceptance of\n  the DISCLOSURE\
  \ strand for that class, limb (b) by an acceptance of the REACHABILITY strand for\n\
  \  that class, each within its recorded readers and scope.\n  The following are\
  \ ILLUSTRATIONS of the test, not the rule, and no list here may be read as a\n \
  \ whitelist:\n  - *Passes:* the schema; a coarse detector total over the whole copy;\
  \ pass/fail; the hash of a\n    control value the probe itself planted.\n  - *Fails:*\
  \ a production value. A deterministic hash of one — where the value space is small\
  \ or\n    enumerable (an email, a phone number, a customer id) a hash is that value\
  \ in another encoding,\n    reversible by dictionary and linkable across runs even\
  \ when it is not. A count keyed by a\n    sensitive predicate, a tenant, a person\
  \ or a small cohort — `hiv_diagnosis_rows: 1` names a\n    person as surely as the\
  \ row does. Anything transmitted off the host, or written into logs,\n    transcripts,\
  \ an AI context, or test output.\n    **The PROOF'S OWN REPORT is a permitted emission\
  \ — and saying so is not an exception to the\n    property, it is the property applied.**\
  \ Rule 6 obliges the proof to report its controls, its\n    completeness disposition\
  \ and the NAMES of accepted and overridden items; each passes both limbs\n    by\
  \ construction (a pass/fail, a coarse total, a control outcome, a disposition, a\
  \ class name).\n    Where an accepted class is scoped so narrowly that naming it\
  \ would identify a person, the NAME is\n    bounded exactly as the acceptance is\
  \ — and a report naming a class whose acceptance restricts\n    its readers may\
  \ not be written to a channel that does not respect that restriction. A permitted\n\
  \    emission is still addressed to somebody.\n  **Build detectors to this property\
  \ by DEFAULT, not by memory.** A detector written the obvious\n  way — \"show me\
  \ what you found\" — echoes the live-shaped value it matched and breaks limb (b)\
  \ on\n  its first run. The default output of a detector is its COUNT.\n  *A whitelist\
  \ of shapes cannot bound disclosure. Do not convert this rule back into one.*\n\
  - **DESTRUCTION — by default part of the rule, not hygiene after it.** Every untreated\
  \ artifact\n  outside the sandbox is destroyed once the copy is restored; a surviving\
  \ raw dump, staging copy or\n  backup is a violation of this default, not an untidy\
  \ leftover, unless a recorded override names\n  that artifact, its scope and its\
  \ own destruction date.\n- **AND WHAT BECOMES PERMITTED WHEN THE PROOF PASSES.**\
  \ Once the proof passes, the treated copy is\n  ordinary sandbox data: the spike\
  \ stack may run against it, and it is governed from then on by the\n  ordinary spike\
  \ cage (SPEC-0172), not by this rule. Two things do NOT end at that moment: an\n\
  \  accepted residual or a recorded override stays bounded by the purpose, readers,\
  \ scope and\n  destruction date its record names, and — under the rule-2 default\
  \ — the copy is still never a\n  route to the live production system.\n\nPhrasings\
  \ that place the obligation \"before the copy is worked with\" are forbidden by\
  \ this rule:\nthey name no actor and no moment, so they hide exactly this interval.\n\
  \n### 5. DECLARE the classes — in the existing carrier, as a registered concern\n\
  **The CANDIDATES are DERIVED from the live schema; only the DECISION is declared.**\
  \ A project does\nnot hand-keep a list of its own tables and columns — that list\
  \ rots. It enumerates candidate\nsurfaces MECHANICALLY from the schema itself, and\
  \ declares, per candidate, the DECISION: which\nstrand(s) it carries and the verb\
  \ per strand, or none-of-the-three with a reason. A candidate is a\nguess, never\
  \ a finding. The travel boundary (rule 7) is UNCHANGED: the derivation MECHANISM\
  \ travels,\nthe resulting inventory stays local.\n\nA project DECLARES, per strand,\
  \ which of its own surfaces hold which class — **plus, as a FOURTH\nkey, the surfaces\
  \ it answers as NONE of the three, each with a reason.** That fourth key is what\n\
  makes the rule-6b fail-closed sweep usable instead of permanently failing: an honest\
  \ first pass over\na real schema leaves many surfaces (primary keys, numeric foreign\
  \ keys, a filename) in no strand at\nall. Fail-closed then refuses **silence**,\
  \ which is the thing worth refusing, rather than refusing\n**completeness**, which\
  \ is unreachable. The declaration lives\nin the ops-contract carrier as a registered\
  \ concern (SPEC-0128 rule 1), so the born template, the\ndeclare-or-waive sweep\
  \ and the debt lens are all GENERATED from one declaration. No parallel\nchecklist,\
  \ no per-project schema editing, no second store — the same shape SPEC-0172 rule\
  \ 2 uses,\nin its OWN carrier section: a section is owned by exactly one governing\
  \ spec, so this floor declares\n`spike_data_safety` beside the wiring contract's\
  \ `spike_sandbox` rather than reaching into it.\n**Presence policy: DECLARE-OR-WAIVE\
  \ — and the waiver is REFUSABLE, not a free pass.** Every project\nthat answers\
  \ the bridge question also answers this one; a project running no spike sandbox\
  \ waives in\none line, exactly as it waives the bridge. But a waiver ASSERTS a fact\
  \ — \"this project fills no\nsandbox from a production-derived copy\" — and that\
  \ assertion is checkable against what the project\nalready declares elsewhere: a\
  \ waiver standing beside an enabled bridge, a declared refresh/export\nstep, or\
  \ recorded evidence of a restored copy is REFUSED, not accepted. A waiver that cannot\
  \ be\ncontradicted by anything is a silence with a signature on it — which is the\
  \ state rule 5 exists to\nremove.\n**THAT REFUSAL IS PERFORMED — and here is exactly\
  \ what it reads, so no reader has to infer what\n\"contradicts\" means.** The concern\
  \ names a residual shape hook\n(`shape_hook: spike_data_safety_shape`, dispatched\
  \ by the same registry-driven declare-or-waive\nsweep every other concern rides\
  \ — SPEC-0128 rule 2, no second mechanism). When, and only when, this\nsection is\
  \ WAIVED, the sweep reads THREE signals off the project's own already-parsed carrier\
  \ and\nREFUSES the waiver on any one of them, naming the contradicting path:\n\n\
  | Signal | Read from | Contradiction when |\n|---|---|---|\n| (a) an enabled spike\
  \ bridge | `spike_sandbox.bridge.enabled` | truthy |\n| (b) a declared refresh/export\
  \ step | `spike_sandbox.bridge.refresh` · `spike_sandbox.bridge.export` · `spike_sandbox.refresh`\
  \ · `spike_sandbox.export` | declared non-empty |\n| (c) recorded evidence of a\
  \ restored copy | `spike_sandbox.restored_copy` · `spike_data_safety.restored_copy`\
  \ | declared non-empty |\n\nSignal (a) is boolean-shaped; (b) and (c) are read TYPE-GENERICALLY\
  \ (a command string, a list of\nsteps and a mapping all count; `~`, `\"\"`, `[]`\
  \ and `{}` do not), so a project cannot evade the\nrefusal by declaring its refresh\
  \ step in a different shape.\n\n**What this refusal is NOT, stated because the failure\
  \ mode here is over-refusing.** It judges the\nWAIVER, never the project: a section\
  \ that DECLARES `data_safety:` is not touched by this hook even\nbeside an enabled\
  \ bridge (that project answered the question), an ABSENT section is the generic\n\
  stance check's business, and a bridge declared `enabled: false` is a real answer\
  \ rather than a\ncontradiction. A check that refused every waiver would break the\
  \ declare-or-waive contract for\nevery project that legitimately runs no spike sandbox\
  \ — which is the honest answer this floor\nkeeps cheap (one line), exactly as the\
  \ bridge question does. The two asks are deliberately issued\nin ONE pass rather\
  \ than staged, so a project answers both keys in a single sitting instead of a\n\
  second round-trip.\n\n#### 5a. The decision FILE shape — keys the kernel names,\
  \ values the project owns\nA project that keeps its per-surface decisions in a file\
  \ beside the carrier (conventionally\n`bin/spike-data-classes.yaml`; the filename\
  \ is not the contract) holds them in this KEY shape, which\nthe rule-6 proof may\
  \ expect to read:\n- `surfaces` — a non-empty mapping keyed `schema.table.column`;\
  \ each entry carries EITHER\n  `none: <reason>` (the fourth key above) OR `strands`\
  \ + `verb` (its strand decision per rule 3 and\n  the treatment verb — `accept`\
  \ included on any strand), never both;\n- `detectors` — a list whose every entry\
  \ carries `id` (the pointer a proof names).\nThe SAME file holds the project's acceptance\
  \ records and its overrides of the §0 defaults (§0 M5):\nthe kernel names no key\
  \ for them, so their form is the project's own, and the proof reads them\nfrom there.\n\
  \nDetector bodies, treatments, the executable schema, any render script and the\
  \ inventory itself stay\nlocal (rule 7; SPEC-0073). The kernel surface is the same\
  \ report-only advisory as SPEC-0172 §2b\n(`spike declaration shape: …`, at the init\
  \ sweep and in the read-only `sandbox-family` view) when a\ndeclared bridge has\
  \ no `bin/*.yaml` file of this shape — never a refusal.\n\n**Declaring BY REFERENCE\
  \ to that file satisfies rule 5.** A project that keeps its per-surface\ndecisions\
  \ in the §5a file does NOT restate them in the carrier: rule 5's \"the declaration\
  \ lives in\nthe ops-contract carrier\" is met by a `data_safety:` mapping whose\
  \ strand keys name that file\ninstead of listing surfaces inline — e.g. `data_safety:\
  \ {decisions: bin/spike-data-classes.yaml,\nproof: <where the proof runs>}`. The\
  \ file stays the ONE authored source; **no in-carrier projection\nof it is required**,\
  \ and a generated copy of the file rendered into the carrier is a second store\n\
  this rule never asked for. Nothing kernel-side reads per-surface entries in the\
  \ carrier: the\ndeclare-or-waive sweep checks only that `data_safety` is a declared\
  \ mapping, and the rule-6 proof\nreads the §5a file. Silence stays refused — an\
  \ empty section is still unanswered.\n\n### 6. PROVE the decisions by querying the\
  \ copy — three obligations, all fail-closed\nA declaration is not a proof. The project's\
  \ decisions are proven by querying the treated copy\nagainst them, under three obligations\
  \ that are what keep the proof from being satisfied on paper:\n\n- **(a) A CONTROL\
  \ PER DETECTOR.** Each detector is demonstrated to catch a planted value **of its\n\
  \  own class**, on a copy seeded with that value, and to pass after treatment. One\
  \ generic planted\n  value proves ONE detector and says nothing about the others.\
  \ A class the project ACCEPTED is still\n  detected: the proof reports it as accepted\
  \ (c) instead of failing on it.\n- **(b) SCOPE COMPLETENESS, FAIL-CLOSED.** The\
  \ proof NAMES every copied surface — columns, JSON and\n  free-text payloads, attachments,\
  \ caches, encrypted blobs, executable schema, and any other copied\n  store — and\
  \ **fails closed on a surface that carries no explicit decision**, rather than passing\n\
  \  silently. Silence is a REFUSAL, never an omission.\n  **The enumeration covers\
  \ DERIVED surfaces and executable schema, not only base tables.** An\n  enumeration\
  \ keyed on tables silently misses views, materializations and triggers, so the\n\
  \  fail-closed half would be evaded by construction rather than by omission.\n \
  \ **An UNQUERYABLE surface still gets an explicit decision on every strand.** A\
  \ binary attachment or\n  an encrypted blob cannot be read by a text detector, and\
  \ it may carry tokens (reachability) or\n  queued work (operational state) that\
  \ nobody can see precisely BECAUSE it is unqueryable. The\n  recommended default\
  \ (§0 P4) is to **EXCLUDE it from the copy** unless every strand it could carry\n\
  \  is decided; a project may instead ACCEPT it on the strands its acceptance names\
  \ (§0 M5). Whatever\n  the project decides, a strand left undecided for that surface\
  \ fails the proof closed.\n  **The enumeration is taken over the SOURCE of the copy,\
  \ and a surface REMOVED by treatment is\n  RECORDED as disposed.** Enumerating the\
  \ TREATED copy instead lets treatment-by-deletion vanish: a\n  surface dropped to\
  \ satisfy the inert-on-restore default simply stops being a candidate, so the\n\
  \  sweep passes with no record that it ever existed, and the proof could not tell\
  \ TREATED from\n  NEVER-EXISTED. Same family as (c) below: the proof must distinguish\
  \ treated from absent, and\n  silence is not evidence of either.\n  **That source\
  \ enumeration is CAPTURED BY THE EXPORT STEP and TRAVELS WITH THE COPY.** The proof\n\
  \  runs inside the sandbox after the restore, and under the rule-2 default only\
  \ the named\n  refresh/export step may read the live system — so the proof does\
  \ not reach back to the live system\n  to build the enumeration itself. The export\
  \ step captures it as a manifest that travels with the\n  copy, and the proof reads\
  \ that.\n  **The manifest is DELIVERED AS ITS OWN OUTPUT of the export step, never\
  \ attached to a dump file** —\n  the preferred streamed shape has no host-side file\
  \ to attach anything to, so \"travels with the\n  copy\" means delivered alongside\
  \ it, not embedded in it.\n  **The manifest is SUBJECT TO THE SAME TWO-LIMB TEST\
  \ as any other emission — \"schema only\" is not a\n  safety class.** A surface\
  \ NAME can carry the payload: a per-tenant schema named after the customer,\n  or\
  \ a table whose name states a sensitive predicate about the people in it, discloses\
  \ without a\n  single value being read. Where a name does that, the manifest carries\
  \ a stable opaque alias and the\n  real name lives in an acceptance-bound annex.\n\
  \  **THAT ANNEX IS NOT A NEW ARTIFACT — it IS the acceptance record (§0 M5), and\
  \ it may not become a\n  side file.** A real name that discloses is disclosed CONTENT,\
  \ so the only thing permitted to hold it\n  is the acceptance that licenses it:\
  \ the annex is a field OF that record and inherits its terms\n  unchanged — the\
  \ PURPOSE the name is kept for, WHO may read it, its SCOPE, WHEN it is destroyed\
  \ — and\n  it dies WITH the acceptance rather than living the manifest's longer\
  \ life. Three consequences: the\n  annex NEVER travels with the copy and is never\
  \ an export output (only the aliased manifest is); a\n  manifest whose aliases resolve\
  \ for a reader the acceptance does not admit has failed limb (a)\n  exactly as a\
  \ clear name would; and a project with no channel able to respect those reader controls\n\
  \  does not get an annex — it EXCLUDES the surface instead. No new store, no new\
  \ parser, no second\n  record: if the acceptance cannot hold the name, the name\
  \ is not kept. **And, so qualified, the\n  manifest SURVIVES the destruction sweep.**\
  \ Destruction covers step outputs that carry VALUES; a\n  list of surface NAMES\
  \ carries none, passes both emission limbs, and is precisely what the proof\n  must\
  \ read AFTER the restore. Any export output that does carry values is destroyed\
  \ as before.\n  **The METADATA around an unqueryable surface is its own surface.**\
  \ `attachments.filename =\n  passport-scan.jpg` discloses without the blob ever\
  \ being read; classifying the blob and\n  forgetting its filename is a miss.\n-\
  \ **(c) ACCEPTED AND OVERRIDDEN ITEMS ARE REPORTED BY NAME, never absorbed.** A\
  \ pass that rests on a\n  recorded acceptance, on any strand, says so, naming each\
  \ accepted class and the strand it was\n  accepted on; a pass under a recorded override\
  \ of a §0 default names each default overridden. A\n  proof whose output cannot\
  \ tell \"this class was treated\" from \"this class was accepted\", or \"the\n \
  \ default held\" from \"the default was overridden\", is not a proof of this floor\
  \ — it is the\n  reassurance the floor exists to replace.\n\n### 7. What travels\
  \ and what does not\nThe **MECHANISM and the DEFAULTS travel** — the three strands,\
  \ the declare obligation, the\nprove-by-querying obligation, the acceptance and\
  \ override record, and the recommended defaults are\nkernel-realm methodology a\
  \ consumer pins.\nThe **CLASS INVENTORY and the PROJECT's DECISIONS do not travel**\
  \ — which tables, columns and stores\nhold which class, what a project accepted\
  \ and which defaults it overrode are per-schema and\nirreducibly local (project\
  \ realm, SPEC-0073). A kernel artifact that starts listing a project's\ncolumns\
  \ or recording a project's acceptance has crossed that line.\n\n### 8. Layer + status\
  \ honesty, and the scope bound\nThis floor inherits SPEC-0172 rule 4's standard\
  \ verbatim, and it is not decoration: **every rule\nhere NAMES the layer that carries\
  \ its check** (kernel CONTRACT · library MECHANICS · project\nPIN-AND-ENABLE), and\
  \ **where the named layer does not carry the check yet, the rule says so plainly\n\
  and is DISCIPLINE — recorded and taught, never presented as prevention.** A later\
  \ surface MUST NOT\nre-inflate a DISCIPLINE rule into a claimed refusal, and MUST\
  \ NOT delete this sentence to make the\nfloor read stronger. DISCIPLINE is a truthful\
  \ interim, never a resting place: each such rule\ncarries the work that would make\
  \ it CHECKED. **A PROJECT POLICY row never claims a KERNEL check:**\nthe kernel\
  \ does not decide what a project protects, so it cannot be the layer that checks\
  \ it.\n\n#### 8a. The per-obligation layer table — this floor's own declaration,\
  \ machine-read\n\nOne row per obligation. A rule without its row, or a row without\
  \ its rule, is a contract defect.\n\n**The conformance set this table is read under\
  \ — stated explicitly, because a partial import leaves\nthe rest dead-lettered.**\
  \ SPEC-0172 rule 4e's C1, C2, C3 and C5 are imported VERBATIM: one row per\nobligation;\
  \ the layer comes from the rule-1 vocabulary; the status is exactly CHECKED or DISCIPLINE\n\
  with **no third, softer word**; and a DISCIPLINE row claims NO anchor and names\
  \ the closing work.\n**C4 is imported in ADAPTED form and C6 is NOT imported** —\
  \ 4e's table is per-ATOM, with its own\nrefusal-condition and positive-control columns,\
  \ so C4 can demand an anchor PER NAMED LAYER and C6\ncan compare the row against\
  \ the kernel cage-check predicate. This table is per-OBLIGATION and\ncarries neither\
  \ column, because the refusal conditions and controls are the rule bodies above\
  \ and\nrestating them here would be a second home for them. So: **a CHECKED row\
  \ here names ONE resolvable\nevidence anchor** (C4 adapted), and **C6 has no subject\
  \ in this contract** — there is no cage-check\npredicate for a data obligation to\
  \ correspond to. Nothing is silently dropped.\n**The Kind column** says which side\
  \ of §0 the obligation is on: `KERNEL mechanism` (mandatory, M1-M6)\nor `PROJECT\
  \ policy` (a recommended default, P1-P4, overridden only through the §0 route).\
  \ A\n`PROJECT policy` row's check layer is PROJECT and its status DISCIPLINE.\n\n\
  | Obligation | Kind | Check layer | Status | Evidence anchor (CHECKED) / closing\
  \ work (DISCIPLINE) |\n|---|---|---|---|---|\n| 0 — the override route: a default\
  \ binds until a decision recorded in the project's own decision file overrides it\
  \ | KERNEL mechanism | PROJECT | DISCIPLINE | the adopting project's proof reads\
  \ its decision file and reports each override by name (row 6c); no kernel code reads\
  \ the file's content (§5a, rule 7) |\n| 1 — the axis is the live system, not \"\
  production data\" | KERNEL mechanism | KERNEL | DISCIPLINE | definitional; a wording-conformance\
  \ check over the floor text is the only thing that could carry it — cut at decomposition\
  \ or accept permanently as taught |\n| 2 — the actor split (refresh reads read-only;\
  \ runtime never connects) | PROJECT policy | PROJECT | DISCIPLINE | a detector proving\
  \ the spike stack's resolved config reaches no production endpoint, in a project\
  \ that keeps the default |\n| 3 — three strands, many-to-many, per-strand verbs\
  \ incl. ACCEPT on every strand; provenance-keyed exclusions | KERNEL mechanism |\
  \ PROJECT | DISCIPLINE | the adopting project's per-strand detectors, built in its\
  \ own realm (a detector queries that project's schema, so it is never a kernel artifact\
  \ — rule 7 / SPEC-0073) |\n| 3-reach — NEUTRALIZE as reachability's default verb\
  \ | PROJECT policy | PROJECT | DISCIPLINE | the adopting project's reachability\
  \ detector over the surfaces it did not accept |\n| 3-record — the acceptance /\
  \ override record: class, strand(s), purpose, readers, scope, destruction, recorded\
  \ before exposure | KERNEL mechanism | PROJECT | DISCIPLINE | the adopting project's\
  \ proof refusing to pass on an accepted class with no record in its decision file\
  \ |\n| 4 — the untreated artifact: window, who may touch, inert restore, emission\
  \ limbs, destruction | PROJECT policy | PROJECT + LIBRARY MECHANICS | DISCIPLINE\
  \ | egress-denied + executable-schema-disabled restore rails in the pinned library;\
  \ a destruction check over the artifact chain |\n| 5 — declare the classes in the\
  \ carrier | KERNEL mechanism | KERNEL | CHECKED | test:tests/test_t9389_ops_carrier_seed.py::test_unanswered_section_fails_closed\
  \ — `spike_data_safety` is a `presence_policy: mandatory` concern (SPEC-0128 rule\
  \ 2), so the generated declare-or-waive sweep REFUSES silence on it exactly as the\
  \ named test proves for the sweep's other mandatory sections. The REFUSABLE-waiver\
  \ half of rule 5 is a SEPARATE obligation with its own anchor — row 5b, so neither\
  \ half rides the other's evidence |\n| 5a — the decision-file key shape | KERNEL\
  \ mechanism | KERNEL | DISCIPLINE | report-only by design (the `spike declaration\
  \ shape` advisory never refuses); accept permanently as taught |\n| 5b — the waiver\
  \ is REFUSABLE: a waived section contradicted by the project's own declarations\
  \ is refused | KERNEL mechanism | KERNEL | CHECKED | test:tests/test_spec0175_waiver_contradiction.py::test_ac1_waiver_beside_an_enabled_bridge_is_refused\
  \ — the concern names `shape_hook: spike_data_safety_shape`, so the registry-driven\
  \ declare-or-waive sweep reads rule 5's three signal paths off the project's own\
  \ carrier and REFUSES a waiver standing beside any of them, naming the contradicting\
  \ path. `waiver_policy: loose` still accepts an UNcontradicted reasoned waiver —\
  \ the named test's own complement legs pin that, so the row claims a refusal that\
  \ discriminates rather than one that refuses everything |\n| 6a — a control per\
  \ detector | KERNEL mechanism | PROJECT | DISCIPLINE | the proof runner + its per-detector\
  \ controls |\n| 6b — every surface carries an explicit decision; silence refused\
  \ | KERNEL mechanism | PROJECT | DISCIPLINE | the proof runner's fail-closed enumeration\
  \ over the export-captured manifest |\n| 6b-unq — the unqueryable surface's default\
  \ disposition (EXCLUDE) | PROJECT policy | PROJECT | DISCIPLINE | the adopting project's\
  \ export step omitting the surfaces it did not decide on every strand |\n| 6c —\
  \ every accepted or overridden item reported by name | KERNEL mechanism | PROJECT\
  \ | DISCIPLINE | the proof runner's report naming each accepted class and each overridden\
  \ default |\n| 7 — mechanism and defaults travel, class inventory and decisions\
  \ do not | KERNEL mechanism | KERNEL | CHECKED | test:tests/test_t0888_placement_contract.py::test_matrix_exhaustive_over_corpus\
  \ — the placement contract refuses a kernel artifact carrying project data (SPEC-0073)\
  \ |\n| 8/8a — layer + status honesty | KERNEL mechanism | KERNEL | DISCIPLINE |\
  \ a conformance check over THIS table, the sibling of SPEC-0172's C1-C6 |\n\n*A\
  \ correction's explanation belongs here rather than in a cell: this table declares\
  \ itself\nmachine-read, and a cell quoting a forbidden token is a false positive\
  \ waiting for the first\nchecker that reads it.*\n\n**Read this table as the honest\
  \ state, not as a disappointment.** Most of this floor is DISCIPLINE\ntoday, and\
  \ saying so is the whole point of rule 8: a floor that claimed prevention it does\
  \ not have\nis precisely the defect that produced its predecessor.\n**Scope bound:**\
  \ no new store, no new FSM, no new journal, no new service, no new parser, no new\n\
  field family and no new verb. If an implementation appears to need one, that is\
  \ a dissonance to\nescalate (CHARTER §Principle 7).\n\n## Parameters\n\nNone consumed.\
  \ The per-strand class inventory and the project's decisions are PROJECT-realm data\n\
  (rule 7), never a kernel parameter.\n\n## Rationale\n\nSuccessor of <workshop-spec>\
  \ (`bin/yitc-v2 graph query <workshop-spec>` keeps its rationale and its two RED\n\
  wording consults readable); this section carries only this change.\n\nThe owner\
  \ directed that the kernel ship only the MECHANISM of data protection and leave\
  \ WHAT is\nprotected to each project (events.jsonl#ts=), applied uniformly to the\
  \ whole\nfloor rather than only to the reachability clause (option A, events.jsonl#ts=).\n\
  The trigger was cross item X-2084: a consumer's owner needed real reachability values\
  \ on his own\ncaged sandbox stack, and <workshop-spec> gave reachability one verb,\
  \ NEUTRALIZE, with no acceptance —\na kernel decision about what that project may\
  \ keep. The successor route follows SPEC-1037 rule 7:\nthe change alters what a\
  \ project must do in cases <workshop-spec> already covered (a reachability value,\n\
  an emission failing limb (b), an unqueryable surface, the ACCEPT record's fields).\n\
  \nAnti-complexity (CHARTER §P1): F1 — the existing ACCEPT record is extended (scope\
  \ listed, strands\nnamed) and reused as the override record; F2 — no new entity,\
  \ store, field family or verb, and the\noverride's form inside the decision file\
  \ is the project's; F3 — removed: reachability's\nno-accept clause, the disclosure-only\
  \ acceptance escape of rule 4 and the disclosure-only ACCEPT\nrestriction of rule\
  \ 6b; F4 — X-2084. The accept-caged route the consumer proposed (a cage re-proof\n\
  on bring-up, credentials always neutralized) is NOT added: those are that project's\
  \ own conditions,\nrecorded in its own decision file.\n\n## Verification\n\n- **VP1\
  \ (five-question reader agreement).** Two independent readers, given this floor\
  \ alone, answer\n  all five §Scenario questions identically.\n- **VP2 (the actor\
  \ split is stated, as a default).** Rule 2 states BOTH halves and names them the\n\
  \  recommended default. Probe: grep this body for `READ-ONLY`, `NEVER connects`\
  \ and `recorded\n  override`.\n- **VP3 (per-strand verbs are distinct).** Rule 3\
  \ gives disclosure its own verbs (mask / minimize /\n  exclude / accept) and does\
  \ NOT fold it into the neutralize list. Probe: grep for `MASK, MINIMIZE,\n  EXCLUDE`.\n\
  - **VP4 (control per detector — the differential).** Each detector catches a planted\
  \ value of its\n  OWN class and passes after treatment; a run where one detector's\
  \ control fails to catch its\n  planted value is NOT a pass.\n- **VP5 (scope completeness\
  \ fails closed).** A proof run over a copy carrying a surface the\n  declaration\
  \ does not decide REFUSES. Differential: if that run passes, the fail-closed half\
  \ is\n  not.\n- **VP6a (the artifact chain is governed under the default).** In\
  \ a project keeping the rule-4\n  default, a raw dump, staging copy or backup surviving\
  \ after the restore is a REFUSAL. Probe: grep\n  this body for `FIRST EXPORTED BYTE`\
  \ and `DESTRUCTION`.\n- **VP6b (a probe cannot disclose — the PROPERTY, not the\
  \ shape).** THREE differentials: (i) a\n  known personal value seeded in the copy\
  \ does not appear in any probe output; (ii) nor does a\n  deterministic hash of\
  \ it; (iii) nor does a count keyed to a sensitive predicate or a small cohort.\n\
  - **VP6c (accepted and overridden items are visible).** A proof run resting on an\
  \ acceptance names\n  the accepted class and strand; a run under an override names\
  \ the default overridden.\n  Differential: a run with an acceptance or an override\
  \ byte-identical to a run without one fails.\n- **VP6d (the source manifest is real,\
  \ aliased, and survives).** (i) a surface whose NAME carries\n  the payload appears\
  \ under a stable opaque alias; (ii) the manifest is still readable after the\n \
  \ destruction sweep, and a value-carrying export output does not survive it; (iii)\
  \ a surface removed\n  by treatment appears with its disposal recorded.\n- **VP7\
  \ (adoption, infra-class — CHARTER §P8).** Consumer-read or live-trigger evidence\
  \ from at\n  least one adopting project: a declared `spike_data_safety` block —\
  \ the registered carrier section\n  rule 5 names, a SIBLING of `spike_sandbox` and\
  \ never nested inside it — plus a recorded proof run.\n- **VP8 (named non-goal).**\
  \ Nothing here weakens SPEC-0172's CHECKED stack-identity atom or its\n  DISCIPLINE\
  \ dial-out half.\n- **VP9 (internal coherence).** No passage in this spec or in\
  \ `patterns/spike-mode.md` presupposes\n  an operation another forbids, and none\
  \ states a §0 default as a kernel mandate.\n- **VP10 (mechanism-only — the AC1 differential).**\
  \ This body states ACCEPT on all three strands with\n  the M5 record (class, purpose,\
  \ readers, scope, destruction) and carries none of <workshop-spec>'s three\n  forbid-a-choice\
  \ clauses, while <workshop-spec> at the pinned commit 7427de3484 carries them —\n\
  \  tests/test_t14284_spec1054_mechanism_only.py.\n- **VP11 (kind honesty).** Every\
  \ §8a row carries a Kind; no `PROJECT policy` row has check layer\n  KERNEL or status\
  \ CHECKED — tests/test_t14284_spec1054_mechanism_only.py.\n"
