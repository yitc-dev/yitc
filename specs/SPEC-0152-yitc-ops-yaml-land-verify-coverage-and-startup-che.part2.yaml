  \ the land, with the same\nfailing-assertion text; waivers, the `subject_globs`\
  \ skip, `independent_layers`, the any-author\nfloor and what a project declares\
  \ are all as they were. A nightly health run (`verify.health`,\nabove) executes\
  \ its named layers through its own runner, not this guard, and takes no re-run.\n\
  Reader: `bin/lib/worktree.py#_consumer_zero_probe_guard`.\n\n**The `verify.infra_globs:`\
  \ key — a project WIDENS the kernel verify-infrastructure floor, never\nnarrows\
  \ it (X-0938 / SPEC-0185 §3(a)).** The verify-infrastructure set that forces a FULL\n\
  run (the SPEC-0077 pinned set above) is a kernel constant of ROOT-relative globs,\
  \ so a project whose\nverify implementation sits elsewhere (tests at `backend/tests/`,\
  \ reached by a layer whose `command:`\nreveals no path) had NO way to place it under\
  \ the floor: the pinned re-run never armed and its\nabsence was invisible. A project\
  \ MAY therefore declare an OPTIONAL `verify.infra_globs:` — a flat\nlist of repo-relative\
  \ glob strings, beside the kernel-owned `verify.floor` sub-tree (rule 27 in\nSPEC-0093)\
  \ — and every declared glob is UNIONED with the kernel set wherever that set is\
  \ read (the\npinned TRIGGER and the `subject_globs` would-skip alike, through the\
  \ ONE declaration-aware reader\nSPEC-0077 §1 names). WIDEN-ONLY, by construction:\
  \ the kernel globs are ALWAYS applied and are never\nremovable; the declaration\
  \ can only ADD coverage, so it can only make MORE lands run full. Every\nsubtractive\
  \ or replacing SHAPE — a mapping under the key, a negation-prefixed entry naming\
  \ a glob for\nremoval, an absolute or upward-escaping entry — is REFUSED BY NAME\
  \ at the declaration read, on the\nsame seam as a `verify.floor` waiver, and the\
  \ kernel set stays applied whatever was declared. The\nnarrowing direction is NOT\
  \ a future extension of this key: it was refused on the merits (X-0884 —\nthe hardcoded\
  \ floor is what makes the pinned re-run fire on a verify-implementation touch, so\
  \ a\nconsumer must never hold the power to shrink the surface that guards it) and\
  \ the ask was retracted\n(X-0893). The kernel set this key widens is the set of\
  \ a PROJECT repository (the paragraph\n«Which members of that verify-infrastructure\
  \ set hold in which repository» above): it holds no\nroot `bin/` member, so a root\
  \ `bin/` helper a project wants on the full run is listed here.\nAbsent key → behaviour\
  \ unchanged. The reader is `bin/lib/land_verify_legs.py#_declared_verify_infra_globs`.\n"
