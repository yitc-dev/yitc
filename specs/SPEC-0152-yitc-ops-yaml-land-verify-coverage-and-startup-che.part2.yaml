body: "**The tests-sweep DELEGATION (X-0297; a SUB-rule of `verify.layers[]`).** The\
  \ kernel's own\nland-verify runs a BARE sweep of the repo-root `tests/` dir — each\
  \ `tests/test_*.py` executed as\n`python3 <file>`, exit 0 = pass (the ENGINE suite\
  \ convention). On a `-C` consumer that sweep ran IN\nADDITION to the declared layers,\
  \ making the root `tests/` a SECOND de-facto verify home — contradicting\nrule 5\
  \ (`verify.layers` is the authoritative land-verify home; never two live homes).\
  \ It also forced a\nreal cost: a pytest/venv consumer had to make EVERY test file\
  \ script-runnable under the SYSTEM\n`python3`, and its layer then re-ran the same\
  \ suite properly (a double run per land).\n\n**The rule.** When a consumer declares\
  \ an EXECUTABLE layer (a non-empty `command:`, not waived) whose\n`covers:` globs\
  \ name the ROOT tests dir (first path segment `tests`), that layer IS the verify\
  \ for that\nsurface — so the land RUN DELEGATES the bare sweep to it and SKIPS the\
  \ sweep as redundant. This makes\nrule 5 TRUE BY CONSTRUCTION for a covering consumer:\
  \ one home, the declared layer. It is the ONE case\nwhere `covers:` is load-bearing\
  \ at the land RUN rather than report-only.\n\n**NO verify hole — only the REDUNDANT\
  \ half is skipped.** The layer itself still runs (the land RUN over\n`verify.layers`\
  \ is unchanged), so the tests stay verified — by the layer that claims to cover\
  \ them.\n\n**§DELEGATION-IS-A-DECLARATION — the kernel never prints an unqualified\
  \ PASS over a surface it did\nnot run (X-0860).** The paragraph above is true about\
  \ the LAYER and says nothing about the\nFILES: `covers:` is the consumer's ASSERTION\
  \ that the layer verifies `tests/`, and the kernel\nverifies no execution behind\
  \ it. Where that gap became a lie: <project>'s layer was a hand-written\nscript\
  \ registering each suite EXPLICITLY, one test file had ZERO references in it, and\
  \ `task test\n--run` printed `PASS — full subprocess suite green` while that file\
  \ was executed by NOTHING — four\nmutation-verified tripwires shipped through `land`\
  \ believing they were gated. Two obligations follow,\nat EVERY delegating site (one\
  \ renderer, so they cannot drift):\n\n1. **STATE THE TRUST BOUNDARY, unconditionally.**\
  \ The delegation note says the kernel did NOT run the\n   files under `tests/` and\
  \ does NOT verify the layer executed them, and the `task test --run` PASS\n   line\
  \ is QUALIFIED accordingly — «the declared layer exited 0», never «the full subprocess\
  \ suite is\n   green» (which, on this branch, no longer describes anything that\
  \ happened). This half is NEVER\n   suppressed by a clean-looking check: an advisory\
  \ is cheap by construction, and buying quiet with a\n   suppression rule is the\
  \ failure mode.\n2. **NAME WHAT IS PROVABLY UNREGISTERED, and claim nothing more.**\
  \ There is no generic execution\n   ledger — a layer is an arbitrary command — so\
  \ the kernel asks the NARROW PROVABLE question, «does\n   the layer's execution\
  \ registry NAME this file?», reading the layer's `command:` plus the in-repo\n \
  \  script(s) it names, TRANSITIVELY to a small depth cap (bounded: repo-relative,\
  \ worktree-contained,\n   depth-, size- and count-capped, and cycle-safe). Depth\
  \ 1 — the scripts the command names — is not\n   enough once a layer splits into\
  \ a DRIVER plus per-surface scripts, the split this kernel asks\n   consumers to\
  \ perform: the suites are then named one level further down, and a depth-1 read\
  \ accuses\n   files that all execute (<project> measured 37 of 38, X-0883 / X-0886).\
  \ The cap is REQUIRED, not\n   optional — an unbounded follow is what the bound\
  \ exists to refuse; it is a safety bound, never a\n   tuning knob.\n   The registry\
  \ read is over the UNION of the declared layers, never the delegated one alone\n\
  \   (X-0894). `covers:` names THE single layer that answers for `tests/`, but real\
  \ coverage\n   in a consumer is per-UNION: a covered file is routinely executed\
  \ BY A DIFFERENT declared layer.\n   Read singly, the check CRIES WOLF — <project>\
  \ moved `covers: [tests/**]` onto their `stack` layer\n   and 8 of 39 covered files\
  \ were reported unnamed while `scripts/verify-static.sh`, a SIBLING\n   layer, executes\
  \ all 8 by name (the host-side tripwires the in-container pytest cannot run). So\
  \ a\n   covered file counts as named when ANY EXECUTABLE declared layer's registry\
  \ names it; each layer\n   is walked under its OWN caps (a shared cap would let\
  \ one layer starve the next, and a starved\n   read removes text, which ACCUSES\
  \ more) and the per-layer texts are joined on a newline so no\n   cross-layer adjacency\
  \ forges a match. A WAIVED layer never joins the union — it does not run, so\n \
  \  naming a file there absolves nothing. There is no layer-count cap: capping would\
  \ re-create the\n   same false accusation one layer further out.\n   This widening\
  \ is a FALSE-ALARM fix, NOT a verify hole being patched — the error direction was\n\
  \   OVER-reporting — and it must stay one: when that union registry names >=1 covered\
  \ file the\n   declared layers demonstrably ENUMERATE their suites, and every covered\
  \ file named NOWHERE IN ANY\n   OF THEM is still reported BY NAME. When it names\
  \ none (a `pytest tests/`-style discovery runner)\n   NO per-file claim is made\
  \ at all. A union that reported zero for everything would have REMOVED\n   the check\
  \ rather than fixed it.\n\n**Registry-based in BOTH directions.** A textual mention\
  \ is not proof of execution — a comment or a\ndead branch can name a file that never\
  \ runs — so the report says a file is NOT NAMED IN THE REGISTRY,\nand a named file\
  \ is never rendered or implied as kernel-verified-as-executed.\n\n**§STAGE-6 READS\
  \ A WORKING TREE, LAND READS A COMMIT (X-1209).** The sibling clause above\nbounds\
  \ what `covers:` proves about EXECUTION. This one bounds what the Stage-6 mirror\
  \ proves about the\nINPUT, and it is a different gap: `task test --run` runs the\
  \ SAME checks `land` runs (the\n / / parity invariant), but it runs them at Stage\
  \ 6 — BEFORE the Stage-7 commit.\nSo a declared layer whose command reads COMMITTED\
  \ state (a `git diff <merge-base>..HEAD`) judges a tree\nthat does not yet contain\
  \ this task's work, and its exit 0 says nothing about the branch that will land.\n\
  Measured (<project>, 2026-08-31): the `file-size-limit` layer's script collected\
  \ over\n`<base>..HEAD`, the task's new 312-line test file was still untracked, the\
  \ layer passed, and the\nIDENTICAL command after the commit failed the same branch\
  \ — costing a post-commit in-scope split plus a\nre-audit on an already-RED card,\
  \ on that card's third dispatch. The Stage-6 output over that input was\nBYTE-IDENTICAL\
  \ to the output over a branch with nothing wrong on it; that indistinguishability\
  \ is the\ndefect, not the block. One obligation follows:\n\n**NAME THE UNCOMMITTED\
  \ PATHS INSIDE A LAYER'S OWN DECLARED SURFACE, and claim nothing more.** Whether\
  \ a\ngiven command reads committed state is UNPROVABLE from the kernel — a layer\
  \ is an arbitrary command —\nso the kernel asks the narrow provable question, «are\
  \ there paths inside this layer's own declared\nsurface whose content is in NO commit?»,\
  \ and says only that this Stage-6 result does not cover them and\nthat it cannot\
  \ rule out that the layer did not see them. The surface is the CONSUMER'S OWN declaration\n\
  (`subject_globs:` ∪ `covers:`), read with the same fnmatch idiom that decides whether\
  \ the layer RUNS —\nso ordinary bookkeeping dirt is excluded by construction rather\
  \ than by a hand-maintained ignore list,\nand a consumer that declared those paths\
  \ meant to. The remedy the note names is the consumer's: commit\nfirst and re-run,\
  \ or make the layer read the WORKING TREE plus untracked files, which is what the\n\
  kernel's own `_task_diff_files` already does. NO new field, no new gate, no verdict\
  \ — this is the same\nreport-only family as the clause above, with the same inverted\
  \ fail-safe direction (any doubt yields\nFEWER rows, never a fabricated one), so\
  \ the parity invariant is stated honestly rather than weakened.\n\n**REPORT-ONLY,\
  \ and it fails toward not accusing.** Nothing here joins a `bad` list, changes a\
  \ verdict\nor moves an exit path — so the / / Stage-6==land parity invariant holds\
  \ BY\nCONSTRUCTION. Note the fail-safe direction is INVERTED relative to the delegation\
  \ predicate above:\nthat predicate GUARDS an action, so any doubt runs the sweep\
  \ (fail-CLOSED); this is a SIGNAL\nDESCRIBING what a layer did, so any doubt makes\
  \ NO per-file claim — one false accusation gets the\nwhole signal skimmed, while\
  \ a missed detection only leaves the silence that already existed.\n\n**Every bare-sweep\
  \ site delegates, or the rule is a half-rule.** ONE predicate decides it, keyed\
  \ off by\nevery path that would otherwise bare-sweep a consumer tree: the `land`\
  \ candidate verify, its SPEC-0077\npinned last-green re-run (which fires precisely\
  \ when the diff touches `tests/**` or `yitc-ops.yaml` —\nthe change a delegating\
  \ consumer makes most), and the Stage-6 `task test --run` self-check (so the\n /\
  \ / Stage-6==land parity holds BY CONSTRUCTION, never re-encoded). The skip is\n\
  REPORTED, never silent: a gate that stops running must say so, and name the layer\
  \ now covering it.\n\n**Fail-CLOSED — any doubt runs the sweep.** No delegation\
  \ on: the engine's OWN build (inert); an\nabsent / unreadable / malformed carrier;\
  \ a SECTION-level `verify.waiver` (the land RUN short-circuits on\nit, so the layers\
  \ would NOT run — delegating there would leave the tests verified by nothing); a\n\
  layer that is waived, carries no executable `command:`, or names no `covers:` glob\
  \ under `tests/`; or\na layer that names `tests/` but whose whole `command:` PROVABLY\
  \ COVERS NOTHING.\n\n**RUNNING IS NOT COVERING.** The executability test above proves\
  \ a layer RUNS. It proves\nnothing about the layer being able to COVER the surface\
  \ it claims — so a layer declaring `covers:\n[tests/**]` with `command: 'true'`\
  \ passed every axis, SILENTLY REPLACED the bare sweep, and the land\nread green\
  \ while the suite that would have caught a defect never ran. Silent by construction:\n\
  nothing failed and nothing warned. So a layer whose whole `command:` is one of the\
  \ shell's own\nDO-NOTHING ATOMS does not delegate, and — since a gate that keeps\
  \ running owes the same account as\none that stops — the refusal is REPORTED, naming\
  \ the layer, its command and the carrier. It is never\na bare fall-through to the\
  \ sweep, which would be indistinguishable from a project that declared no\nrouting\
  \ at all.\n\n**The discriminator is a CLOSED ENUMERATION, and that bound is the\
  \ rule, not a shortfall.** It asks\nonly «is this command one of the shell's do-nothing\
  \ atoms?» — never «does this command look weak».\nAn unrecognised command (a script,\
  \ a test-runner invocation, a compound, an unparseable string) is\nNOT provably\
  \ a no-op and is HONOURED exactly as before, which is what keeps this fence from\
  \ becoming\nrefuse-all-routing; a shape like `sh -c true` is deliberately out of\
  \ reach, because widening the test\ninto a shell parser would re-introduce the guessing\
  \ the enumeration exists to remove. The kernel\nstill checks STANCE + SHAPE only\
  \ (rule 3): it judges no command's correctness, only whether the\ncommand IS the\
  \ null one.\n\n**The pinned re-run reads its ROUTING from the CANDIDATE carrier\
  \ (X-0657).** On the SPEC-0077\npinned last-green path the predicate runs over a\
  \ worktree whose `yitc-ops.yaml` is the LAST-GREEN\noverlay — while the candidate's\
  \ NEW test files SURVIVE in its `tests/` (the overlay restores last-green's\nfiles,\
  \ it does not delete extra ones). Evaluated on the last-green carrier alone, that\
  \ is a BOOTSTRAP\nTRAP: a consumer ADOPTING delegation in the SAME land as the test\
  \ file that needs it gets a fully GREEN\ncandidate verify and a RED pinned bare\
  \ sweep → LAND: ABORT, with no one-land route to adoption (the\nX-0657 incident:\
  \ <project>, both layers OK + 49 domain-unit probes green in-container). So on that\n\
  path, when the last-green carrier does not itself delegate, the ROUTING — WHICH\
  \ layer answers for\n`tests/` — is read from the CANDIDATE carrier, and honoured\
  \ ONLY IF that layer is one the LAST-GREEN\ncarrier will actually RUN (present,\
  \ non-waived, executable `command:`, no section-level waiver) AND\nwhose command\
  \ in the LAST-GREEN carrier is not a provable no-op (the §RUNNING IS NOT COVERING\
  \ axis\nabove). That last qualifier is not decorative: matching the routed NAME\
  \ against\nexecutability alone let a candidate route `tests/` to a last-green layer\
  \ that does nothing — the\nrouting face of the same hole, reachable by an operator\
  \ who lands the route by itself.\n\n**Why that is NOT a self-approval hole.** The\
  \ pinned CHECKS still come from last-green on BOTH halves —\nthe overlaid last-green\
  \ `tests/` files and the last-green `verify.layers` commands the land RUN executes\n\
  over the candidate subject. Only the ROUTING among those already-last-green layers\
  \ is read from the\ncandidate; a candidate cannot conjure a verifier. A candidate\
  \ that DELEGATES AWAY to nothing — naming a\nlayer that is absent, waived or commandless\
  \ in last-green, or delegating under a last-green section\nwaiver — routes to a\
  \ layer that will not run, so the predicate REFUSES, the bare sweep fires, and the\n\
  ABORT survives. Same ONE predicate, one optional `routing_from` carrier argument:\
  \ no second predicate,\nand the candidate verify + Stage-6 `task test --run` paths\
  \ are unchanged (they read one carrier only).\n\n**The `prep:` sub-field — per-layer\
  \ dependency-prep (X-0140; a SUB-rule of `verify.layers[]`,\nnot a new section).**\
  \ A `land`-verify layer runs inside a short-lived git worktree, but a frontend\n\
  layer's `node_modules` is git-ignored and therefore ABSENT in a freshly-created\
  \ worktree — so that\nlayer cannot run there (the X-0140 incident: a frontend layer\
  \ left un-wired at land, or hand-symlinked\nby workers, ships untested by the gate).\
  \ The `prep:` sub-field is the kernel fix: a per-layer\ndependency-preparation step\
  \ the land runner runs in the worktree BEFORE the layer's `command:`. It is\nDECLARE-OR-WAIVE,\
  \ the SAME fail-closed discipline the carrier uses, and checked ONLY IF PRESENT\
  \ (a\nlayer with NO `prep:` prepares nothing — the backward-compat default; a Dockerized\
  \ backend layer that\nbakes its deps into an isolated image needs none). This is\
  \ a SUB-rule of the existing `verify.layers[]`\ncontract (gate-specs finding [4]\
  \ — keep `prep` inside `verify.layers[]`, no new section/file/parser),\nauthored\
  \ as an IN-PLACE amend of this active spec (<workshop-spec> §7 in-place amend /\
  \ one-home). The kernel\nchecks the declared STANCE + structural SHAPE, never the\
  \ command's/lockfile's correctness (rule 3).\n\n- **DECLARE — a `prep:` mapping\
  \ carrying a required non-empty `mode:`** naming the built-in prep mode.\n  The\
  \ kernel BUILT-IN mode in this slice is **`npm-ci`**: the runner runs the equivalent\
  \ of `npm ci`\n  INSIDE the worktree, installing the layer's deps from the project\
  \ LOCKFILE + the declared RUNTIME (a\n  CLEAN install from the lockfile — never\
  \ a mutate-in-place `npm install`). OPTIONAL keys pin the prep\n  inputs when they\
  \ are not at the repo/layer default (shape-only, never judged for value): `lockfile:`\n\
  \  (repo-relative path to the lockfile, e.g. `frontend/package-lock.json`), `manifest:`\
  \ (the\n  `package.json` path), `package_manager:` (e.g. `npm`), `runtime:` (e.g.\
  \ `node@20`), and `workdir:`\n  (the sub-directory the install + layer command run\
  \ in, e.g. `frontend`). OR\n- **WAIVE — a `waiver:` mapping with a non-empty `reason:`**\
  \ (a LOOSE per-layer-prep waiver — a layer\n  that legitimately needs no prep, e.g.\
  \ a Dockerized backend that bakes deps into its image).\n- A `prep:` carrying BOTH\
  \ a `mode:` and a `waiver:` is a contradiction → ERROR; a `prep:` carrying\n  NEITHER\
  \ is an UNANSWERED prep → ERROR (the per-layer fail-closed floor, rule 3). `prep:`\
  \ ABSENT\n  entirely = the layer prepares nothing (the checked-if-present backward-compat\
  \ default — NOT an error,\n  distinct from a present-but-empty `prep:`).\n\n**The\
  \ machine-checkable prep record `verify_layer_prep` (gate-specs finding [5] — the\
  \ stable contract\nfield name).** When the runner executes a layer's `prep`, it\
  \ records a **`verify_layer_prep`**\nstate/event carrying: the `layer:` key, the\
  \ RESOLVED `lockfile_hash:` (the content hash of the lockfile\nthe deps were installed\
  \ from), the `package_manager:` it used, and the `runtime:` it matched. SPEC-0093\n\
  fixes this record's NAME + fields HERE so the sibling land-runner code card has\
  \ a stable\ncontract to implement + emit, and the postcheck probe is machine-checkable.\
  \ No SPEC-0025 events-catalog\nedit is needed — the events catalog is code-derived\
  \ from emit call-sites, so `verify_layer_prep` enters\nthe catalog when emits it.\n\
  \n**Fail-closed contract (no silent best-effort → no false-green).** If ANY prep\
  \ input dimension cannot be\nmatched — the manifest, the lockfile, the package-manager,\
  \ or the declared runtime is\nmissing / un-resolvable / mismatched — the prep FAILS\
  \ the land (the layer is NOT run best-effort against\nthe wrong deps). Clean-install-from-lockfile\
  \ + fail-on-mismatch is exactly what covers the 7\nauditor-named failure modes:\
  \ native-addon rebuilds, platform-specific optional packages, Node-version\ndrift,\
  \ package-manager drift, postinstall side-effects, stale lockfiles, and tests that\
  \ mutate\n`node_modules`.\n\n**Deferred NON-scope (named — gate-specs finding [1],\
  \ later opt-in only).** Two optimizations are\nEXPLICITLY out of this slice and\
  \ NOT built pre-emptively (CHARTER §P1 F4 — add only when a real\nland-time-cost\
  \ incident pulls it): the shared **content-addressed dependency store** (approach\
  \ D — a\nwarm cache keyed by lockfile hash; needs locking + GC + hash validation)\
  \ and the **symlink / reuse-the-\nmain-checkout `node_modules`** cache (approach\
  \ A — cheapest but weakest: false-green under a lockfile /\nruntime / platform /\
  \ native-addon-ABI mismatch, unsafe under concurrent parallel lands mutating one\n\
  shared tree). Approach A is admissible LATER ONLY as an opt-in cache guarded by\
  \ an exact lockfile-hash +\nruntime match + read-only discipline + a fall-back to\
  \ `npm ci` on any mismatch — never the default. The\nslice-1 built-in is the conservative\
  \ per-worktree `npm ci` (approach C).\n\n**The `timeout:` sub-field — a project\
  \ DECLARES its land-verify bound (X-0204; a SUB-rule of\n`verify.layers[]` + one\
  \ OPTIONAL section scalar, not a new section).** `land` bounds every layer command\n\
  by a wall clock (the / SPEC-0071 hang guard — a verify must never hang the gate\
  \ forever). That\nbound was a GLOBAL default, overridable ONLY by the `YITC_VERIFY_TEST_TIMEOUT`\
  \ env var — so a\nconsumer whose verify is legitimately slower (a Docker bring-up\
  \ running ~251s, passing standalone but\nflaky-timing-out under land Docker-load)\
  \ could only be rescued by a REMEMBERED env override on every\nland: undurable,\
  \ forgettable, and invisible to the carrier (the X-0204 incident, filed by <project>).\n\
  A project may now declare that bound DURABLY, in the carrier that already owns its\
  \ verify policy:\n\n- **Per layer — an OPTIONAL `timeout:`** on a DECLARED layer\
  \ entry: positive seconds bounding THAT\n  layer's `command:` (and its `prep:`,\
  \ which shares the layer's budget). Shape-only: the kernel checks\n  it is a positive\
  \ number, never whether the number is big enough (rule 3).\n  **HOW THE NUMBER IS\
  \ CHOSEN is governed by SPEC-0208** (measured under the declared worker/slot/share\n\
  \  tuple · predefined statistic + margin BAND · an upper bound so it cannot be inflated\
  \ into inertness ·\n  provenance recorded beside the declaration · invalidation\
  \ when the tuple moves). The shape contract\n  here is UNCHANGED by it; this is\
  \ a pointer to the calibration home, not a second copy of it — read\n  `bin/yitc-v2\
  \ graph query SPEC-0208` before declaring or changing a bound.\n- **Per project\
  \ — an OPTIONAL section-level `timeout_seconds:`** on the `verify:` section: the\
  \ default\n  bound for every layer that declares no `timeout:` of its own.\n- **PRECEDENCE,\
  \ highest first:** the `YITC_VERIFY_TEST_TIMEOUT` env ESCAPE HATCH · the layer's\n\
  \  `timeout:` · the section's `timeout_seconds:` · this machine's own value of that\
  \ key · its built-in\n  default (the per-file BUDGET of SPEC-1031 rule 4, which\
  \ homes the last two). Env stays on top by\n  design: a per-host/CI operator override\
  \ a committed declaration could veto would not be an escape\n  hatch.\n- **BOTH\
  \ keys are OPTIONAL** — absent = the prior global-only behaviour, unchanged (the\
  \ checked-if-\n  present backward-compat default; a pre-`timeout:` carrier still\
  \ passes). Neither key participates in\n  the declare-or-waive stance: a timeout\
  \ is a BOUND, not a probe, so omitting it waives nothing.\n- **FAIL-CLOSED when\
  \ present-but-malformed** — a declared timeout is a positive UNQUOTED NUMBER: not\n\
  \  null, not a string (`timeout: \"900\"` is a typo, not a declaration), not a bool\
  \ (`timeout: true` is a\n  stance, not a bound), not non-positive. The land runner's\
  \ accepted set is EXACTLY the init shape\n  hook's: the land-time reader is never\
  \ LOOSER than the declare-time check, else a carrier `init`\n  rejects would still\
  \ run at land. A bad section `timeout_seconds:` fails the land BEFORE any layer\n\
  \  runs; a bad per-layer `timeout:` is that layer's `malformed` outcome and its\
  \ command does NOT run.\n  This is the OPPOSITE stance from the env override's fail-SAFE\
  \ fall-through (: an operator's\n  typo must never disable the bound) — and deliberately\
  \ so: a typo'd DECLARATION must never silently\n  revert to the global default it\
  \ was written to replace, silently resurrecting the flake it was\n  declared to\
  \ fix. A timed-out layer's abort NAMES the effective bound + how to raise it.\n\n\
  **WAIVE — the whole concern (section-level).** The section may instead carry a section-level\
  \ `waiver:`\nwith a non-empty `reason:` (a LOOSE bare reason — a project with no\
  \ land-verify layer declared yet).\n\n**Exclusivity (fail-closed, mirrors rule 8).**\
  \ A `verify:` section MUST NOT carry BOTH a `layers:`\ndeclaration AND a section-level\
  \ `waiver:` — a non-empty `layers:` XOR a section `waiver:`, never both →\nERROR.\
  \ A `verify:` section present but carrying NEITHER is also an ERROR (declare-or-waive\
  \ is\nfail-closed, rule 3).\n\nConcrete pinned shape (the kernel pins the SHAPE;\
  \ a section waiver OR a non-empty layers list):\n\n    verify:\n      timeout_seconds:\
  \ 600 # OPTIONAL — the default land-verify bound for layers with no `timeout:`\n\
  \      layers: # DECLARE: the AUTHORITATIVE land-layer universe — XOR a section\
  \ waiver:\n      - layer: backend # required — the layer id (a non-empty string)\n\
  \        command: \"pytest -q\" # DECLARE this layer (XOR a per-layer waiver:):\
  \ the hermetic land command\n        covers: [\"app/**/*.py\"] # OPTIONAL — globs\
  \ naming the code surface this layer verifies (coverage WARN)\n      - layer: frontend\n\
  \        command: \"npm run test -- --run\" # DECLARE this layer: the hermetic land\
  \ command\n        timeout: 900 # OPTIONAL — THIS layer's bound (positive seconds);\
  \ beats timeout_seconds\n        prep: # OPTIONAL dependency-prep run in the worktree\
  \ BEFORE command\n          mode: npm-ci # built-in: `npm ci` from the lockfile\
  \ + runtime (XOR a prep waiver:)\n          workdir: frontend # OPTIONAL — the sub-dir\
  \ the install + command run in\n          lockfile: frontend/package-lock.json #\
  \ OPTIONAL — pin the lockfile when not at the repo default\n        covers: [\"\
  frontend/**/*.ts\"] # OPTIONAL — globs naming this layer's code surface\n      #\
  \ a layer that needs no prep simply OMITS `prep:` (a Dockerized backend bakes deps\
  \ into its image)\n      # waiver: { reason: \"<why>\" } # section-level WAIVE (XOR\
  \ layers:): no land-verify layer declared yet\n\n**Declare-or-waive-THEN-GROW —\
  \ the layer-PRESENCE prompt (X-0140 finding §1).** The rules above\nmake every layer\
  \ IN the list answered. This sub-rule makes the LIST ITSELF answerable: a source\
  \ layer that\nexists in the repo but is named by NO `verify.layers` entry is a **SILENTLY-ABSENT\
  \ layer** — the state\nX-0140 filed (a frontend source tree, a backend-only verify,\
  \ a GREEN land). The policy:\n\n> **A task that changes a layer with no test harness\
  \ DECLARES-OR-WAIVES it, then GROWS the harness when\n> pulled. It never omits the\
  \ layer.** A layer with no harness yet is a WAIVED layer whose `reason:` records\n\
  > the GROW-TRIGGER that will pull one — never an absent one. Absence is not an answer.\n\
  \n`land`'s consumer verify guard detects a source layer by a kernel MARKER (a file\
