  \ anti-complexity check (CHARTER §P1) +\nReview approval first. **Admitted exceptions:**\
  \ `post_verification` — admitted by SPEC-0038 (the\npost-verification observation\
  \ instrument; its `amends:` names this guard explicitly — amended, not\nbypassed);\
  \ and `expected_touch` — the OPTIONAL filing-time dispatch-selection forecast,\n\
  defined in the Optional-fields block above (forecast-not-promise semantics; carve-out\
  \ picker input,\nplan `parallel-work-preparation-carve-out-picker` §C4/§DEFERRED);\
  \ and `decomposed_from` — the OPTIONAL\ncut-membership marker, the SPEC-0070 §5\
  \ claim-block carrier, written ONLY by the decomposition\ncut; and `effort_tier`\
  \ — the OPTIONAL filing-time STAKES tier (SPEC-0072), mapped to the dispatch worker's\
  \ (model, effort) via bin/effort-routing-config.yaml; and `resolves_cross` — the\
  \ OPTIONAL structured task→cross link, the receiver-side close-the-loop carrier\
  \ (auto cross-done at close + the `cross pick` intake-staleness signal, SPEC-0085\
  \ §3 / SPEC-0086); and `live_probe` — the OPTIONAL per-change deploy live-probe\
  \ declaration (SPEC-0094 §3/§4), the deploy-conditional close-gate carrier; and\
  \ `imported_from` / `premise` / `product_dispatch_owner_ack` — the OPTIONAL migration-provenance\
  \ fields (SPEC-0028 schema carrier; consumed by SPEC-0166 premise-verify + SPEC-0167\
  \ product-gate): a legacy-backlog import ref, a fail-closed premise-verify enum\
  \ {verified, already-done, stale, unclassifiable}, and a product-dispatch owner-ack\
  \ ref. All nine are additive + optional (absent = unchanged behaviour, no drift\
  \ #10).\n\n**Filename convention:** `tasks/<id>.yaml` is shorthand; canonical on-disk\
  \ form is\n`tasks/T-NNNN-<slug>.yaml`, `<slug>` = title kebab-cased (first 50 chars,\
  \ lowercase, non-alnum → `-`),\nallocated by `bin/yitc-v2 task file` per `_template.yaml`.\n\
  \n## Rationale\n\nSingle-source-of-truth (CHARTER §P5): one task format, one parser,\
  \ one directory (`tasks/`). The\nillustrative `tasks/_template.yaml` is DERIVED\
  \ from this schema — any schema change updates the\ntemplate too (the template's\
  \ own maintenance comment points here). Demoted to the retrieved tier\n(SPEC-0007\
  \ §5a query-only) because the full field catalog is situational reference consulted\
  \ only\nwhen authoring/parsing a task — not a rule held before a gated control-point\
  \ — so the always-loaded\nQUEUE core stays small (picker + state transitions only).\n\
  \n## Verification\n\n- **Fidelity (RED-GREEN):** a substantive field-comment phrase\
