id: SPEC-0028
title: Task YAML schema reference — the tasks/<id>.yaml field catalog
status: active
created_at: 2026-06-02 19:21:02+00:00
consumed: false
implements:
- tasks/_template.yaml
- bin/lib/vocab.py#TASK_CLASSES
- bin/lib/vocab.py#TASK_PRIORITIES
- bin/lib/task.py#TASK_CREATED_BY
- bin/lib/memory.py#resolve_actor
- bin/lib/vocab.py#TASK_FILING_STATUSES
- bin/lib/task.py#PREMISE_VALUES
binding:
- query-only
body: "## Scenario\n\nWhen the AI files or edits a task, it needs the exact field\
  \ catalog for `tasks/<id>.yaml`: which\nfields are required, which are optional,\
  \ what each means, and which are filled at which lifecycle\nstage. This is SITUATIONAL\
  \ reference prose — consulted WHEN authoring/parsing a task — not a rule\nheld before\
  \ a gated control-point. It is fetched on demand via `bin/yitc-v2 graph query SPEC-0028`\n\
  (the QUEUE.md pointer-stub names this spec); the always-loaded QUEUE core keeps\
  \ only the picker +\nstate transitions. `tasks/_template.yaml` is the illustrative\
  \ copy DERIVED from this schema.\nThis spec is the field CATALOG/schema only; the\
  \ task-AUTHORING doctrine — what a good card\nFRONT-LOADS (scope + acceptance-with-probe)\
  \ — is homed in SPEC-0060 (the SPEC-0043 analog), which\nPOINTS back here for the\
  \ field rules. (Fold pointer added; no schema rule moved.)\n\n## Internal\n\nTHE\
  \ TASK YAML SCHEMA (one task per file). Faithfully carried from QUEUE.md §YAML schema\
  \ (the\nalways-loaded copy until demoted it to this retrieved home). This spec is\
  \ now the NORMATIVE\nsource; `tasks/_template.yaml` is the derived illustrative\
  \ copy (drift between them = a bug, fix here).\n\n```yaml\nid: # sequential\ntitle:\
  \ Add metric for X # one line, imperative\nclass: feature # feature | fix | refactor\
  \ | docs | infra | hygiene. Keys the stage-FSM /\n                             \
  \  # Fast-Path eligibility (SPEC-0027). CHANGED ONLY via `task update --class`\n\
  \                               # (governed, emits task_reclassified) — the hand-edit\
  \ is retired;\n                               # the field-edit mode refuses a `class`\
  \ change, routing to the verb.\npriority: medium # high | medium | low\nstatus:\
  \ ready # see QUEUE.md §State transitions\ncreated_at: ''\ncreated_by: ai-agent\
  \ # ai-agent | owner | external | a PROVISIONED ACTOR NAME (e.g. <collaborator>)\n\
  \                             # WHO authored the card. DERIVED, never asked for\
  \ (owner\n                             # directive 2026-07-11 — attribution costs\
  \ the human ZERO added input):\n                             # `task file` stamps\
  \ it from the launch context via\n                             # `lib/memory.py#resolve_actor`\
  \ over the host registry `users:` block —\n                             # the OWNER-role\
  \ host user (the one the primary AI agent runs as) keeps\n                     \
  \        # the historical `ai-agent`; any OTHER provisioned user (<collaborator>,\
  \ role\n                             # developer) stamps THEIR OWN NAME. An unknown\
  \ user / empty identity /\n                             # unreadable registry falls\
  \ back to `ai-agent`. An EXPLICIT --created-by\n                             # always\
  \ WINS (`owner` / `external` stay hand-authorable).\n                          \
  \   # VOCABULARY IS FAIL-CLOSED: the enum ∪ the registry's provisioned users\n \
  \                            # — free text can never reach this field. Attribution\
  \ is a RECORD, not a\n                             # gate: a resolution failure\
  \ degrades to the default, never blocks the\n                             # write.\
  \ Surfaced by `task show` (always) and by `task list` (a BY column\n           \
  \                  # ONLY when a listed card carries a real person — suppressed-when-clean).\n\
  \                             # Sibling stamps on the other two authoring verbs:\
  \ the `followup_added`\n                             # (SPEC-0095) + `cross_requested`\
  \ (SPEC-0086) payload `actor` key.\nscope: # bulleted list, ≤ 5 items typically\n\
  \  - Add counter event_type to events.jsonl writer\n  - Wire counter to dashboard\
  \ view\nacceptance: # MUST include probe evidence per Principle 3\n  - AC1: events.jsonl\
  \ contains 'metric_x_emitted' event when X happens (probe: synthetic trigger fires\
  \ event)\n  - AC2: dashboard view shows counter (probe: curl /dashboard returns\
  \ updated count)\ncites: # task IDs / spec IDs / decision IDs — INFORMATIONAL refs\
  \ (non-blocking)\n  - SPEC-005\n  -\nrequires: [] # task IDs (T-XXXX) — the ONLY\
  \ BLOCKING deps\n                               # task target: blocks if status\
  \ != done\n                               # decision target (D-XXXX): NON-BLOCKING\
  \ — the decision-resolution\n                               # branch was retired\
  \ by (gated-safe by the sweep:\n                               # 0 non-terminal\
  \ tasks depended on decision-unblock semantics).\n                             \
  \  # A decision is a cites-only reference, never a lifecycle-blocking\n        \
  \                       # prerequisite — same as a spec. Use `cites:` for decision\
  \ deps.\n                               # specs NOT allowed here — use `cites:`\
  \ for spec refs (specs = reference artifacts, not lifecycle-blocking)\n        \
  \                       # Picker excludes this task only if a `requires:` TASK target\
  \ is not done.\n                               # Distinct from `cites:` (informational).\n\
  \                               # FILING refuses a T-XXXX entry with no card in\
  \ this checkout :\n                               # an edge on a task that does\
  \ not exist can never be satisfied. File the\n                               # dependency\
  \ first (a batch files in order). `cites:` stays unchecked.\nimplementation_plan:\
  \ | # Stage 3 — filled before Stage 4\n  1. Edit bin/lib/state.py — add emit_metric_event\n\
  \  2. Edit bin/lib/dashboard.py — read events.jsonl, count metric_x_emitted\n  3.\
  \ Test: tests/test_metric_x.bats\nclosed_at: null # filled at Stage 9\ncommit: null\
  \ # SHA, filled at Stage 9\nprobe_passed: null # THREE-STATE at Stage 9, filled\
  \ only after probe verification\n                             # : `true` when every\
  \ probe is `pass`; `deferred` when the\n                             # close gate\
  \ passed but at least one probe is still recorded\n                            \
  \ # `deferred`, so a done card never claims a proof it does not have.\n        \
  \                     # STRING-VALUED in that second case — a consumer holding the\
  \ older\n                             # boolean-only contract must widen (`deferred`\
  \ is TRUTHY, so a bare\n                             # bool silently reads it as\
  \ `true`). `task close --settle-probe`\n                             # flips it\
  \ to `true` when the LAST deferred probe is discharged.\n                      \
  \       # Rule home: SPEC-0015 §`probe_passed` is THREE-STATE; the done-card\n \
  \                            # required-field reading is QUEUE §Done log.\nprobe_moments:\
  \ {} # OPTIONAL sibling of `probes:` — the FIRING MOMENT of each\n             \
  \                  # probe recorded `deferred` at closure, so the SPEC-0119 rule-3\
  \ debt\n                               # echo can headline only the DUE ones. ONE\
  \ mapping, AC -> ONE of two\n                               # forms, both already\
  \ in the corpus (no third grammar):\n                               # probe_moments:\
  \ {AC2: {due_by: '2026-09-20'}}\n                               # an ISO date —\
  \ the post_ship_observation shape.\n                               # probe_moments:\
  \ {AC2: {awaits: ''}} # or X-0042\n                               # probe_moments:\
  \ {AC2: {awaits: 'events.jsonl#type=<t>@after=<ISO>'}}\n                       \
  \        # the SPEC-0095 §Armed shape; the ref is admitted by the SAME\n       \
  \                        # grammar the followup fire predicate reads (followup.awaits_kind\n\
  \                               # / arrived_ids / event_after_arrived), so a moment\
  \ the close door\n                               # accepts is one the read side\
  \ can decide, by construction.\n                               # probe_moments:\
  \ {AC2: {awaits: 'events.jsonl#type=<t>@after=land'}}\n                        \
  \       # the first row of <t> AFTER THIS CARD'S OWN land —\n                  \
  \             # its latest successful `land_completed` on `task/<id>`, resolved\n\
  \                               # from the journal at read time and ordered by (ts,\
  \ journal\n                               # position); unlanded -> pending. Probe\
  \ moments only (a followup\n                               # has no own land, so\
  \ `followup arm` still refuses it).\n                               # probe_moments:\
  \ {AC2: {awaits: 'events.jsonl#type=<t>&<key>=<value>@after=land'}}\n          \
  \                     # ONE row predicate: only a row of <t> that ALSO matches\n\
  \                               # arrives the moment. `task_id` is the row's envelope\
  \ task id; any\n                               # other snake_case key is a top-level\
  \ string `data` value. EXACT\n                               # equality, ONE predicate,\
  \ the KERNEL journal only, and only on the\n                               # event\
  \ classes the parse home (followup.py#split_event_awaits)\n                    \
  \           # declares. It rides either event form above (`@after=<ISO>` or\n  \
  \                             # `@after=land`). Rule home: SPEC-0095 §Armed.\n \
  \                              # Written by `task close --probe-deferred <AC>:<moment>`,\
  \ which\n                               # REFUSES a bare key at every close-time\
  \ door onto `probes:`. The\n                               # RESULT stays the authoritative\
  \ discriminator in `probes:` (where the\n                               # settle\
  \ writes it and views.py keys the discharge); this says only\n                 \
  \              # WHEN a deferral comes back. Absent / no entry for a deferred key\
  \ =\n                               # a LEGACY key-only deferral, which the lens\
  \ reads DUE.\nparked_reason: null # filled if status=parked (written by `task file\
  \ --status parked` / `task update --status parked`)\nreturn_trigger: null # optional,\
  \ when parked\nparked_awaits: null # — optional, verb-owned (`task update --status\
  \ parked --awaits <ref>`):\n                               # the DECLARED awaited\
  \ artifact of a park, in the same grammar as\n                               # paused_awaits\
  \ (followup.awaits_kind). Set or cleared on every park,\n                      \
  \         # cleared on unpark / wont-do. Session start lists the parked card\n \
  \                              # (UNPARKABLE) ONLY once the ref has arrived; prose\
  \ return_trigger is\n                               # never parsed for it (declared,\
  \ never inferred).\nunparked_note: null # optional — written at the parked→ready\
  \ unpark (`task update --status ready --note …`; prior-art / hand-edits). parked_reason/return_trigger\
  \ are RETAINED as history.\nwont_do_reason: null # rationale, written at any-active→wont-do\
  \ (`task update --status wont-do --reason …`; prior-art)\namend_notes: [] # optional\
  \ — timestamped amendment notes appended by `task update --note …` (no --status),\
  \ each emitting task_amended\n\n# Optional fields ( — fill if applicable):\npost_verification:\
  \ null # optional — authored at Stage 9 (Closure): {criterion, signal} mapping\n\
  \                               # OR explicit waive {none: <reason>} (mutually exclusive);\
  \ hygiene\n                               # auto-waives. Rule home: SPEC-0038 (admitted\
  \ exception, see guard below).\ndescription: null # multi-line context — why this\
  \ task, who interested. Distinct from title (one-line).\nsuccess_metric: null #\
  \ measurable improvement (distinct from acceptance which = test conditions)\nblockers:\
  \ [] # explicit blockers (vs cites which mixes context + blockers)\nestimate_tier:\
  \ null # small | medium | large (per quantitative-claim discipline)\nexpected_touch:\
  \ [] # OPTIONAL forecast — coarse touch units this task is expected to\n       \
  \                        # touch: a file path | a doc#section | a test-target bucket\
  \ | a\n                               # hand-NAMED function (e.g. bin/yitc-v2#_run_view).\
  \ A FILING-TIME\n                               # FORECAST consumed ONCE at queue-building\
  \ / dispatch-selection\n                               # (collision-screen on the\
  \ REAL surface — symbols, not output-file\n                               # names).\
  \ ADVISORY: NEVER updated after Analysis (implementation_plan\n                \
  \               # is the precise successor); a wrong forecast that caused a mis-dispatch\n\
  \                               # is a deviation_captured data point, NOT a field-maintenance\
  \ bug.\n                               # Absent = no forecast (selection stays conservative).\
  \ List of non-empty\n                               # strings; hand-NAMING a function\
  \ is allowed (a declaration, not analysis\n                               # — the\
  \ AST/auto-derivation prohibition stands).\ndecomposed_from: null # OPTIONAL cut-membership\
  \ marker (SPEC-0070 §5). The plan-slug\n                               # this card\
  \ was cut FROM by the decomposition cut. The NARROW structural\n               \
  \                # relation \"member of the audited cut\" — the SPEC-0070 §5 claim-block\
  \ reads\n                               # it (a card is refused while its plan is\
  \ pre-`executing`). The SOLE\n                               # authoritative writer\
  \ is the cut path (`task file --decomposed-from`);\n                           \
  \    # NON-SUBSTITUTABLE for `cites:`, which is BROAD informational linkage\n  \
  \                             # (the finalization corpus). A cut card carries BOTH\
  \ (it cites its\n                               # plan for the corpus AND is decomposed_from\
  \ it for membership). Absent =\n                               # not a cut card\
  \ (the common case). Additive + optional (no drift #10).\neffort_tier: normal #\
  \ OPTIONAL filing-time STAKES tier (SPEC-0072): normal (default)\n             \
  \                  # | critical. `dispatch` maps it to the worker (model, effort)\
  \ via\n                               # bin/effort-routing-config.yaml. Set ONLY\
  \ when != normal (omit-when-\n                               # default — absent\
  \ reads as normal everywhere, incl. dispatch routing;\n                        \
  \       # legacy cards stay valid). A TIER, never a model id (provider-neutral,\n\
  \                               # P4b). Additive + optional (no drift #10).\n\n\
  live_probe: # OPTIONAL per-change deploy live-probe declaration (SPEC-0094\n   \
  \                            # §3/§4). Present ONLY for a task whose project DEPLOYS\
  \ (a yitc-ops.yaml\n                               # `deploy:` section declares\
  \ a command, SPEC-0093); a DEPLOYING project's\n                               #\
  \ `task close` REFUSES unless this is DECLARED (fail-closed, STATIC — it\n     \
  \                          # does NOT call prod at close; the executable GET runs\
  \ at the DEPLOY seam,\n                               # SPEC-0094 §4). THREE mutually-exclusive\
  \ forms. `assertion` / `waiver` / `escalation`\n                               #\
  \ are FORM NAMES, not mapping keys: there is NO nesting level under `live_probe:`\
  \ —\n                               # every key below sits FLAT, one level down,\
  \ and the FLAT key named on each line is\n                               # what\
  \ SELECTS that form (`_live_probe_declaration_error` discriminates on it).\n   \
  \                            # FORM assertion — selected by the FLAT key `url`:\n\
  \                               # live_probe: {url: <path|abs>, expect_status: <int>,\
  \ body_contains: <str?>,\n                               # expect_location: <str?>}\n\
  \                               # — a read-only GET vs the carrier `live_base_url`\
  \ (SPEC-0093) at deploy.\n                               # `expect_location` is\
  \ the NO-FOLLOW dialect (SPEC-0094 §4): valid only with a\n                    \
  \           # redirect `expect_status` (301/302/303/307/308), it asserts the immediate\n\
  \                               # redirect's `Location` header instead of following\
  \ it (the X-0096 fix).\n                               # A SECURITY assertion (SPEC-0098\
  \ §1 dialect) ALSO carries property: <name>\n                               # (REQUIRED\
  \ label) + any of assert_header_present: <name|[name]> /\n                     \
  \          # assert_header_absent: <name|[name]> / assert_cookie_flags:\n      \
  \                         # {<cookie>: [Secure|HttpOnly|HostOnly]} — proves a named\
  \ security property\n                               # at the seam; emits security_live_probe_passed\
  \ (not live_probe_passed).\n                               # FORM waiver — selected\
  \ by the FLAT key `none`:\n                               # live_probe: {none: <reason>,\
  \ user_facing: <bool?>, recheck_by: <ISO-date?>}\n                             \
  \  # — an explicit reasoned waiver. `user_facing` defaults TRUE (fail-closed):\n\
  \                               # a user-facing waiver REQUIRES `recheck_by:` (a\
  \ dated, surfaced\n                               # non-adoption debt — the P3 honesty\
  \ floor); a NON-user-facing change\n                               # (no live surface)\
  \ sets `user_facing: false` and may omit recheck_by.\n                         \
  \      # FORM attested — selected by the FLAT key `attested` (SPEC-0094 §4b):\n\
  \                               # live_probe: {attested: <instrument>, runs_at:\
  \ <where gated>, asserts: <what>,\n                               # user_facing:\
  \ <bool?>, recheck_by: <ISO-date?>,\n                               # outcome: {result:\
  \ passing|failing, evidence: <journal locator>,\n                              \
  \ # probed_at: <ISO-date>, detail: <str?>}}\n                               # —\
  \ a live proof the PROJECT itself runs at its own gate (an authenticated probe,\
  \ a\n                               # headless-browser gate, a served-bundle marker).\
  \ The kernel GRADES the reported\n                               # reading and issues\
  \ NO outbound request of its own. The three naming fields are all\n            \
  \                   # REQUIRED. `outcome` is OPTIONAL at declaration (so the close-gate\
  \ stays a static\n                               # DECLARATION check) and is written\
  \ by `task close --live-probe-outcome-*` from the\n                            \
  \   # locator `liveprobe --report pass|fail` printed. ONLY `result: passing` discharges;\n\
  \                               # `failing` is a RECORDED negative reading — never\
  \ missing, never stale — and keeps\n                               # the card on\
  \ the overdue-recheck lens unconditionally. An UNGRADED user-facing\n          \
  \                     # declaration keeps the same fail-closed `recheck_by` floor\
  \ as a waiver.\n                               # FORM escalation — selected by the\
  \ FLAT key `unprobeable`:\n                               # live_probe: {property:\
  \ <name>, unprobeable: <reason>} — a security property\n                       \
  \        # the seam CANNOT assert read-only; emits security_live_probe_escalated\
  \ +\n                               # escalates to the owner, never silent-pass\
  \ (SPEC-0098 §2).\n                               # The per-CHANGE probe lives HERE;\
  \ the project-level base url/dialect live\n                               # on the\
  \ carrier (one SoT each, SPEC-0094 §4). Absent = no declaration (a\n           \
  \                    # non-deploying project's tasks never carry it). Additive +\
  \ optional.\n\npost_ship_observation: # OPTIONAL deferred-proof declaration (SPEC-0036\
  \ §POST-SHIP\n                               # OBSERVATION / X-0710) — the trust\
  \ anchor of the Stage-8 `audit post\n                               # --post-ship-observation`\
  \ carve-out, for an acceptance whose probe is a\n                              \
  \ # MULTI-DAY POST-SHIP PRODUCTION OBSERVATION (e.g. «the daily count is flat\n\
  \                               # or falling over 7 days»): the reading cannot exist\
  \ at the pre-land,\n                               # diff-only audit-post because\
  \ its window opens only AFTER the ship. ONE\n                               # form,\
  \ both keys REQUIRED (two OPTIONAL):\n                               # post_ship_observation:\
  \ {observation: <what will be read>, due_by: '2026-08-18'}\n                   \
  \            # post_ship_observation: {observation:..., due_by:..., settled_by:\
  \ 'events.jsonl#ts=<ISO>'}\n                               # post_ship_observation:\
  \ {observation:..., due_by:..., settled_by: {result: unreachable|falsified, reason:\
  \ <why>}}\n                               # post_ship_observation: {observation:...,\
  \ due_by:..., sensitivity: <evidence the predicate FIRES>}\n                   \
  \            # `observation` = the concrete reading that will prove the AC; `due_by`\
  \ = the\n                               # ISO date the window closes; `settled_by`\
  \ = the OPTIONAL discharge, in one of\n                               # TWO shapes\
  \ (the shape the `live_probe` waiver already has): a LOCATOR\n                 \
  \              # string naming where the RECORDED reading landed, or the TERMINAL\
  \ pair\n                               # {result: unreachable|falsified, reason:\
  \ <non-empty why>} recording that the\n                               # reading\
  \ can NEVER arrive (the specimen is gone, the baseline was never recorded,\n   \
  \                            # the attribution is pre-empted) or that it ARRIVED\
  \ and came back NEGATIVE. The\n                               # terminal vocabulary\
  \ is the kernel's ONE closed set (`_SETTLE_TERMINAL_RESULTS`,\n                \
  \               #), the reason is MANDATORY and refused empty before any write,\
  \ and NEITHER\n                               # terminal ever satisfies CHARTER\
  \ §Principle 8 adoption evidence — a discharged\n                              \
  \ # observation leaves the ACTIONABLE overdue counts for its own counted set on\
  \ the\n                               # `overdue-recheck` lens, which is a permanent\
  \ floor / a real finding, not a payment. Requiring the WHAT + the WHEN is\n    \
  \                           # what keeps the carve-out from being a blanket «my\
  \ proof is in the future»\n                               # excuse: the overlay\
  \ entry AND the `task close` seam both refuse a card that\n                    \
  \           # declares neither, and the `overdue-recheck` debt lens surfaces the\
  \ pending\n                               # observation from declaration until `settled_by`\
  \ is recorded — time passing\n                               # moves it pending→overdue\
  \ but never clears it. Absent = no deferred\n                               # observation\
  \ (the ordinary case). Additive + optional (no drift #10).\n                   \
  \            # SENSITIVITY — the DISCIPLINE this class was missing (X-1126). A declaration\n\
  \                               # states the READING **and names the historical\
  \ evidence that its predicate FIRES when\n                               # the defect\
  \ IS present** — carried in the OPTIONAL `sensitivity:` key. WHY: an\n         \
  \                      # observation is settled by READING A PREDICATE, and a predicate\
  \ that can never match\n                               # ANYTHING reads EMPTY —\
  \ which is byte-identical to «the defect is absent». So a vacuous\n            \
  \                   # predicate settles on the strength of having measured nothing,\
  \ and nothing anywhere\n                               # notices. Measured by <project>\
  \ 2026-08-26: TWO cards sat 8 days overdue and would have\n                    \
  \           # been settled on exactly that VACUOUS ZERO. This was the ONE acceptance-proof\
  \ class with\n                               # no sensitivity requirement — a SPEC-0165\
  \ tripwire must be shown to FAIL when its rule is\n                            \
  \   # broken, while an observation was held to no such bar. Name a PAST occurrence\
  \ the\n                               # predicate would have caught (a dated incident,\
  \ a journal locator, an earlier reading that\n                               # WAS\
  \ non-empty), never an argument that it ought to work.\n                       \
  \        # THE BOUND, as load-bearing as the requirement: this is a DISCIPLINE surfaced\
  \ as a PROMPT.\n                               # `sensitivity:` is OPTIONAL and\
  \ deliberately UNVALIDATED — the grammar above neither\n                       \
  \        # requires it nor checks its content, no seam REFUSES a declaration for\
  \ omitting it, and no\n                               # exit code moves. `audit\
  \ post --post-ship-observation` prints a report-only reminder when\n           \
  \                    # it is absent; the SPEC-0036 variant-(e) overlay names the\
  \ evidence to the auditor when it\n                               # is present and\
  \ states that its absence is an authoring prompt, NEVER a RED on its own. NO\n \
  \                              # gate and NO predicate analyser was added (CHARTER\
  \ non-goals #2/#7) — the reporter framed\n                               # the cheap\
  \ fix as a discipline and it stays one.\n\nanswers: # OPTIONAL SPEC-0197 rule-4\
  \ LINK-BACK — a YAML list of the outside\n                               # proposal\
  \ ids this card answers, no host literal. An ISSUE REFERENCE\n                 \
  \              # NAMES ITS TRACKER — `owner/repo#N`, never a bare `#N` or a number\
  \ alone\n                               #. THE HAZARD: an intake repo that is archived\
  \ and re-created\n                               # restarts its numbering at 1,\
  \ so a bare number stops naming the issue\n                               # the\
  \ card answered and starts naming whatever the new tracker filed\n             \
  \                  # under it, and two trackers' `#1` merge into one release-notes\
  \ entry.\n                               # An archived tracker is written under\
  \ its ARCHIVE name. A proposal slug\n                               # carrying no\
  \ `#` is not an issue number and stays admitted. Read by\n                     \
  \          # `release.collect_answered_proposals` at the release commit into the\n\
  \                               # published notes. Written by `task file --from-stdin`\
  \ or `task update\n                               # --set-field answers --from-file`;\
  \ those two writers AND the publish\n                               # read refuse\
  \ an id failing `release.ANSWER_ID_RE`, carrying a host path\n                 \
  \              # or naming no tracker (`release.unqualified_answer_id`), the publish\n\
  \                               # naming the card; the writers also refuse an explicit\
  \ null. Notes\n                               # signed before keep their bare ids\
  \ — a published release is\n                               # immutable — and are\
  \ still read as written.\n                               # The ONE terminal-card\
  \ carve-out of --set-field: answers is release\n                               #\
  \ metadata, not the card's shipped claim, and a fix card is normally done\n    \
  \                           # before the release that ships it is cut — so answers\
  \ (and no other\n                               # field) is settable on a done/wont-do\
  \ card; its task_amended row carries\n                               # `post_close:\
  \ true`.\n\nresolution_excludes: # OPTIONAL closure-honesty declaration (X-1179)\
  \ — what this\n                               # task's fix STRUCTURALLY CANNOT REACH,\
  \ in the resolver's own words.\n                               # Read by exactly\
  \ ONE consumer: the derived cross closure note\n                               #\
