id: SPEC-0077
title: Pinned last-green verify for verify-path-touching lands (REPO_ROOT-relative,
  consumer-aware)
status: active
created_at: 2026-06-16 13:06:14+00:00
consumed: false
implements:
- bin/lib/worktree.py#_land_integrate
- bin/lib/land_verify_legs.py#_pinned_recovery_hint
- bin/lib/worktree.py#_run_pinned_verify
- bin/lib/cli.py#_extract_failing_assertion
- bin/lib/verify_runner.py#_verify_failure_excerpt
- bin/lib/rebaseline_currency.py#_recorded_pinned_failure_assertions
- bin/lib/rebaseline_currency.py#_recorded_pinned_failure_row
- bin/lib/rebaseline_currency.py#_environmental_waive_bindings
- bin/lib/rebaseline_currency.py#_pinned_touched_weakened_keys
- bin/lib/rebaseline_currency.py#_first_attempt_preflight_refusal_text
- bin/lib/rebaseline_currency.py#_rebaseline_waive_stable_token
- bin/lib/rebaseline_currency.py#_rebaseline_waive_paste_lines
- bin/lib/rebaseline_currency.py#_environmental_broken_refusal_text
- bin/lib/rebaseline_currency.py#_offending_drift_is_merge_produced
body: "## Scenario\n\nWhen a session lands a change whose diff touches the **verify-path\
  \ of the checkout being landed**\n(its own `bin/yitc-v2`, its graph-build inputs,\
  \ or the test-runner the verify invokes), `land`\nverifies the change with the checkout's\
  \ **last-green `main` verifier** — the pre-change verifier —\nIN ADDITION to the\
  \ candidate (just-changed) verifier, and integrates ONLY if BOTH pass. So a\nverifier-weakening\
  \ change cannot self-approve: the old verifier still applies its checks to the new\n\
  tree. A land whose diff does NOT touch the verify-path is unaffected (verified once,\
  \ by the\ncandidate, as today). This holds REPO_ROOT-relative, so it protects the\
  \ engine's own lands and\nevery `-C` consumer's own lands by the same code path.\n\
  \n## Internal\n\nTHE PINNED LAST-GREEN VERIFY RULE. A standing contract on the `land`\
  \ verify step.\n\n**WHETHER this leg runs at all is additionally gated, per project,\
  \ by SPEC-0186** (the\n`verify_policy.pinned_last_green` declaration in a project's\
  \ `yitc-ops.yaml`: `all` — the default and\nthe born state — or `never`). This spec\
  \ remains the ONE normative home for WHEN the leg fires (the\ntrigger predicate\
  \ below) and WHAT it does; SPEC-0186 governs only the per-project ON/OFF gate in\
  \ front\nof it, is read PRE-MERGE from the base tree, and cannot reach the engine\
  \ (a kernel invariant — the\nengine has no `yitc-ops.yaml`). Navigational pointer,\
  \ not a second rule (SPEC-0005 rule 8).\n\n**WHICH tests this leg pins is additionally\
  \ NARROWED, per project, by what that project DECLARES\n(`tests.classes[].timing_lane`\
  \ in its `yitc-ops.yaml`).** The narrowing is DECLARED data — the\nproject names\
  \ the test files whose verdict is a function of wall clock — never a kernel judgement\n\
  about a named file. Its ONE home is SPEC-0160 rule 10 (`bin/yitc-v2 graph query\
  \ SPEC-0160`), which\nowns that rule in full; none of its rule-text is restated\
  \ here — read it there. Read beside the\nSPEC-0186 pointer above, the pair answers\
  \ two different\nquestions about this leg: SPEC-0186 gates WHETHER it runs, SPEC-0160\
  \ rule 10 narrows WHICH tests it\npins. Navigational pointer, not a second rule\
  \ (SPEC-0005 rule 8).\n\n### 1. Trigger — `verify-implementation-touch` (NARROW;\
  \ NOT the observable classifier)\nThe pinned re-run fires on a precise predicate:\
  \ the diff touches the VERIFIER'S OWN executable\nsurfaces — the verify code path\
  \ in `bin/yitc-v2`, the graph-build script, and the test files/runner\nthe verify\
  \ executes — evaluated relative to the current `REPO_ROOT`. This is DISTINCT from\
  \ SPEC-0064's\ninert/observable classifier, which answers \"could this diff change\
  \ the verify RESULT at all\" (true for\n`specs/`, `patterns/`, ordinary product\
  \ source). `observable-to-verify` and `touches-the-verifier` are\nNOT synonyms:\
  \ a `specs/`-only or product-source land is observable but does NOT change the verifier,\
  \ so\nthe circular-trust risk does not apply and the pinned re-run MUST NOT fire\
  \ there. This spec §1 + the\n`land` code are the ONE canonical home of the predicate;\
  \ the classifier's file-class knowledge may be a\nbuilding block but is not the\
  \ trigger. Consumer-aware by construction — the same narrow predicate runs\nagainst\
  \ each checkout's own `REPO_ROOT`.\n**File-membership source-of-truth (ONE code\
  \ constant + helper, PLUS the project's own declaration) —**\nthe predicate's STATIC\
  \ file set is owned by a single module-level constant + helper in `bin/yitc-v2`:\n\
  `_VERIFY_IMPLEMENTATION_GLOBS` (the verify-path globs) consumed by\n`_is_verify_implementation_touch(changed_files)`.\
  \ This prose POINTS at that constant and MUST NOT\nduplicate the file list (SPEC-0005\
  \ rule 3 content-boundary) — the list lives in code so it cannot drift\nbetween\
  \ spec and `land` (convergence target resolved, trial run #2).\n**AMENDED (X-0938)\
  \ — a constant alone CANNOT satisfy the coverage obligation below, because\nwhere\
  \ a project's checks LIVE is a property of that project, not of the kernel.** The\
  \ static globs are\nROOT-LEVEL ones (named conceptually here — the pattern list\
  \ stays code-only), so for a consumer whose checks sit elsewhere — <project> declares\n\
  `verify.layers[backend].command: bash backend/scripts/verify.sh` with its tests\
  \ at `backend/tests/` —\nneutering a check matched NOTHING and the pinned leg never\
  \ armed, while §3's overlay likewise pinned no\nold check: the leg RAN and REPORTED\
  \ `verify_mode=pinned+candidate` while applying the candidate's own\nchecks to the\
  \ candidate's own tree (a false green, not a coverage gap). So the file set is the\
  \ constant\nUNION the check surfaces resolved from the project's OWN `verify.layers`\
  \ DECLARATION\n(`_declared_check_surface_globs` / `_pinned_declared_check_paths`,\
  \ SPEC-0152 rule 16). The constant\nstays the single home of the KERNEL's static\
  \ list — this adds a second SOURCE, not a second list, and\nthe declaration is authored\
  \ by the project, never duplicated here.\n**AMENDED — a THIRD source, EXPLICIT and\
  \ widen-only.** The derived source above reads a\ncheck surface out of `verify.layers[].command`\
  \ operands, so a layer whose command reveals no path\nleft a non-root verify implementation\
  \ outside the trigger with no way to say otherwise. The optional\n`verify.infra_globs:`\
  \ declaration (shape + refusals: SPEC-0152 rule 16) joins the SAME union through\n\
  the SAME reader (`_declared_check_surface_globs`), read from BOTH carriers with\
  \ the trigger's\nfail-open bias. It can only ADD to the set — the constant is always\
  \ applied and a subtractive form is\nrefused by name at the declaration read — so\
  \ the coverage obligation below can only be met more\nwidely by it, never relaxed.\n\
  **The two surfaces read the carrier with OPPOSITE bias, deliberately.** The TRIGGER\
  \ unions BOTH\ncarriers (last-green and candidate) and fails OPEN toward arming:\
  \ it asks whether a diff COULD touch a\ncheck surface. The §3 OVERLAY reads the\
  \ LAST-GREEN carrier ONLY and fails CLOSED: it asks WHICH checks\napply, and reading\
  \ the candidate's carrier would let the same commit that weakens a check also choose\n\
  its own audit. Resolution is biased to UNDER-inclusion (a root-level command operand\
  \ is skipped — it is\nas likely to be the SUBJECT as a check) and is NEVER SILENT:\
  \ `land` names the overlaid surfaces, and\nnames any declared layer for which none\
  \ resolved, so a PARTIAL pin is auditable rather than read as\nprotection.\n**Coverage\
  \ obligation (closes the omitted-surface loophole — plan-check MEDIUM, run-accept):**\
  \ the\nconstant MUST cover the verifier's ENTIRE OWN executable/config surface —\
  \ not only the three named\nexamples (`bin/yitc-v2`, the graph-build script, the\
  \ test files/runner) but EVERY executable or config\ninput the verify path actually\
  \ reads to reach its verdict (an indirect helper module, a verify config\nfile,\
  \ a runner the harness shells out to). An input the verify consumes but the helper\
  \ OMITS is a\nself-approval hole. So a CONFIG/HELPER-ONLY change to the verify path\
  \ IS verify-implementation-touch and\nDOES fire the pinned re-run (realization probe:\
  \ a verifier-weakening confined to a config/helper surface\nstill FAILS the pinned\
  \ verify). Adding a NEW verify input obliges adding it to the constant in the SAME\
  \ change.\n\n### 2. The pinned source — committed `main` HEAD, \"last-green\" by\
  \ the land invariant\nThe pinned (pre-change) verifier is the verifier at the checkout's\
  \ CURRENT committed `main` basis,\nRE-EVALUATED ON EACH land attempt AFTER `land`'s\
  \ update-from-main step — NOT the stale `main` the\nworktree first branched from,\
  \ and NOT a new pinned-bootstrap store/cache/tag. **Retry / concurrency\n(plan-check\
  \ MEDIUM, run-accept):** because `land` updates-from-main before it verifies, the\
  \ pinned basis\non a retry is the freshly-merged `main` tip — a newer already-green\
  \ verifier landed by a concurrent\nsession is therefore ALWAYS the basis; the rule\
  \ never pins to an older `main` than the one being merged into.\nIts greenness is\
  \ the EXISTING `land` invariant: a NORMAL `land` advances `main` ONLY after running\
  \ the\nverify BEFORE its ff-only merge, so by construction every NORMALLY-landed\
  \ `main` HEAD already passed a\nland verify. There is therefore NO separate `green`\
  \ flag/state to track and NO new carrier — git already\nholds `main` (CHARTER §P1\
  \ F3). **The holes, named — the ACCEPTED-BASELINE class (plan-check HIGH,\nrun-accept;\
  \ second member added).** The qualifier **NORMALLY-landed** is load-bearing: it\
  \ is\nexactly TWO cases where `main` advances WITHOUT a full verify. Both are the\
  \ same **accepted-baseline\nclass** as the §5 carve-out (an owner-confirmed or born-by-construction\
  \ baseline — surfaced, never a\nsilent gap), and NEITHER is handled by a new green-tracking\
  \ store:\n- **(a) The owner-authorized emergency-bypass** (CHARTER §P2 — `--no-tests`\
  \ / the `emergency:` marker),\n  surfaced + retro'd by construction (code-enforced\
  \ by the §2a owner-gate). An emergency-bypass land of\n  the VERIFY-PATH is the\
  \ case where the pinned source could carry an unverified verifier — handled NOT\n\
  \  by a new store but by the EXISTING bypass accountability.\n- **(b) The CONSUMER-BOOTSTRAP\
  \ commit**. A NEWBORN consumer's `main` HEAD was never\n  landed at all: it is `bin/yitc-v2\
  \ -C <path> init`'s sanctioned **direct-to-`main` bootstrap commit**\n  (the AGENTS-SESSIONS\
  \ §Writes-happen-in-a-worktree EXCEPTION — a fresh consumer cannot `land` until\n\
  \  `init` delivers its verify contract, a chicken-and-egg the worktree→land path\
  \ cannot resolve), so by\n  construction it NEVER ran a land verify. Therefore a\
  \ newborn's FIRST pinned basis is the **born\n  (init-authored) verify config**\
  \ — last-**COMMITTED**, not last-**VERIFIED**. What makes this an\n  ACCEPTED baseline\
  \ rather than a gap is : `init` seeds the COVERING `verify.layers` into the\n  born\
  \ carrier at the birth seam (fail-closed — any doubt seeds nothing), so the born\
  \ config is a\n  **WORKING verifier BY CONSTRUCTION**, and the consumer's first\
  \ land is fully gated by a verify that\n  tells the truth about its tests. The baseline\
  \ then self-heals forward on the very next land (§5's\n  self-reinforcing property):\
  \ once ANY normal land advances that `main`, the invariant above governs.\nSo the\
  \ \"last-green\" property holds for every NORMALLY-landed `main`; for a newborn's\
  \ bootstrap HEAD (b) it\nis \"born-green by construction\" rather than \"verified-green\
  \ by a land\" — an honest distinction, not an\nequivalence. The rule does NOT derive\
  \ a separate last-verify-green pointer for EITHER case\n(anti-complexity — git +\
  \ the §P2 bypass record + `init`'s own bootstrap commit already carry it); neither\n\
  member adds a green-tracking store, flag, or tag, and neither grants any new bypass\
  \ or permission.\n\n### 2a. The owner-gate REALIZING §2's \"surfaced + retro'd by\
  \ construction\" (in-place additive)\n§2 above ASSUMES the one hole — the `--no-tests`\
  \ emergency-bypass — is \"surfaced + retro'd by\nconstruction.\" F-024 found it\
  \ was NOT: `land --no-tests` was a FREE, unsurfaced agent self-clear of the\ntests-green\
  \ gate. makes the assumption TRUE by code-enforcing the owner-gate (the mechanism\
  \ §2\nalready relied on; this clause REALIZES it, it adds no new rule):\n- **Two\
  \ distinct REQUIRED signals (the CHARTER §P2 emergency-marker model).** `land --no-tests`\
  \ is\n  REFUSED (exit nonzero, `main` untouched, `abort_class=no-tests-unauthorized`)\
  \ unless BOTH are given:\n  (i) `--owner-authorized` — the explicit, deliberate\
  \ \"the owner sanctioned skipping tests\" marker\n  (the analog of the `emergency:`\
  \ marker / `--ack-repeated-abort`); AND (ii) `--no-tests-reason\n  \"<text>\"` —\
  \ a recorded justification of `>=_NO_TESTS_MIN_REASON_CHARS` (30) chars, mirroring\
  \ the\n  emergency marker's `>=30 char` description. The marker is SEPARATE from\
  \ the reason so authorization is\n  a distinct deliberate act, not a single self-asserted\
  \ field.\n- **Surfaced + frequency-auditable (the accountability, not a crypto gate).**\
  \ An authorized skip is\n  RECORDED on the EXISTING `land_completed` event as additive\
  \ keys `no_tests: true`,\n  `owner_authorized: <bool>`, `no_tests_reason: <text>`\
  \ (registered in SPEC-0025; no new event type).\n  So every test-skip is loud, owner-attributed,\
  \ and queryable — `grep no_tests events.jsonl` is the\n  >1/30d frequency audit\
  \ (CHARTER §P2). **Honest bound:** a single-owner+AI CLI cannot\n  cryptographically\
  \ distinguish owner from agent — \"no agent self-clear\" means no SILENT/implicit\
  \ skip,\n  exactly the emergency-marker accountability model, NOT an unfakeable\
  \ token.\n- **Product-code WARN, NOT a hard refuse (coherence with §3).** When an\
  \ AUTHORIZED `--no-tests` land's\n  final merged-tree delta TOUCHES TESTED PRODUCT\
  \ CODE (the SPEC-0064 `observable` verdict, consumed —\n  never re-encoded; classifier-raise\
  \ → fail-closed observable), `land` prints a LOUD WARN naming the\n  offending class\
  \ + the graceful re-baseline route — then PROCEEDS. It is NOT a refuse: §3 RELIES\
  \ on the\n  owner-authorized `--no-tests` bypass being AVAILABLE for a legitimate\
  \ verifier-relaxation land (which\n  is ALWAYS a product-code delta), so a hard\
  \ product-code refuse would deadlock every relaxation — incl.\n  the activating\
  \ land of itself (its own old last-green `--no-tests` tests encode the pre-gate\n\
  \  FREE behaviour and trip the pinned re-run; F-026). The graceful re-baseline that\
  \ replaces the blunt\n  bypass for an AUDITED behaviour change is a separate follow-up.\n\
  \n### 3. Semantics — IN-ADDITION, both-must-pass\nFor a verify-path-touching land,\
  \ run the verify TWICE over the candidate tree: once with the\ncandidate (new) verifier\
  \ — so any LEGITIMATE new/stronger checks the change introduces still\nexecute —\
  \ and once with the pinned `main` verifier. The land integrates ONLY if BOTH are\
  \ green.\n**The pinned set is last-green's tests EXACTLY — a test absent at the\
  \ last-green ref is not a pinned\ncheck.** The overlay RESTORES last-green's files\
  \ but deletes none, so a test the candidate\nADDED survives into the pinned tree\
  \ and runs there against last-green's helpers; it is by definition\nnot an old check,\
  \ and what it produces is an ImportError, not a verdict. BOTH drivers therefore\n\
  exclude it — the local one by pruning candidate-added paths, the routed one by skipping\n\
  them at discovery off the request's own last-green ref listing — and neither uses\
  \ a manifest: the\nref's own tree IS the manifest. The narrowing is REPORTED, never\
  \ silent (each excluded file is named\nin `land_completed.data.verify_metrics.pinned_excluded_not_pinned`),\
  \ it is FAIL-SAFE (an underivable\nset excludes nothing, so it can only ever run\
  \ MORE tests), and the CANDIDATE leg is untouched — a\nbranch-only test still runs\
  \ there in full. A pinned test that EXISTS at last-green and fails refuses\nexactly\
  \ as before; the `unrunnable-here` rebaseline round for a branch-only test simply\
  \ becomes\nunreachable.\n**TWO FURTHER EXCLUSIONS, computed at verify time from\
  \ durable state, never from a hand list\n.** (i) A test file whose LAST-GREEN copy\
  \ DECLARES itself census/inventory-class — one\nopt-in marker line, `# yitc: pinned-leg:\
  \ census`, carried in the file — is not a pinned check. A\ncensus asserts «every\
  \ enumerated member carries a disposition», so ANY change that ADDS a member\nfails\
  \ the last-green copy BY DEFINITION rather than as a regression signal. The declaration\
  \ is read\nfrom the LAST-GREEN tree, never the candidate's, for the same self-approval\
  \ reason §3 reads every\nother pinned input there: otherwise the commit that weakens\
  \ a check could also declare it exempt.\nIt is OPT-IN and never inferred — an UNMARKED\
  \ census stays pinned exactly as before, and\n`graph conformance` gains no check\
  \ to hunt for unmarked ones. (ii) A test file THIS branch's own\ndiff TOUCHED is\
  \ not re-pinned — PROVIDED its candidate copy is not a WEAKENING of the last-green\n\
  one: the last-green copy would otherwise be asserting the behaviour the card deliberately\n\
  , while the CANDIDATE leg runs the NEW copy in full on that same land. This half\
  \ is read\nfrom the candidate DIFF, which is not a declaration but the fact itself\
  \ and lives nowhere else.\nThe WEAKENING GUARD is what keeps this exclusion from\
  \ swallowing §3's own self-approval fence: a\ncandidate that NEUTERS or DELETES\
  \ a registered check has, by that act, «touched» it, so an\nunconditional touched-exclusion\
  \ would let the commit that removes a check's teeth also remove the\nlast-green\
  \ copy that would have bitten it. The exclusion therefore applies only when the\
  \ candidate\ncopy still EXISTS on the branch AND carries no fewer `def test_` nodes\
  \ and no fewer `assert`\nstatements than the last-green copy — two counts over two\
  \ text blobs, with any read failure leaving\nthe file PINNED (fail-SAFE). A weakened\
  \ or removed touched file STAYS PINNED. The guard is\ndeliberately MECHANICAL, not\
  \ semantic: a rewrite that holds both counts while weakening what they\nassert still\
  \ narrows, and that shape is caught where it always was — audit-post's diff review,\n\
  which reads the edit directly, not a pin whose signal there is indistinguishable\
  \ from the intended\nchange.\n**BOTH DRIVERS APPLY THESE TWO EXCLUSIONS, and on\
  \ the ROUTED one the HOST is the SINGLE COMPUTER\n.** The sentence above already\
  \ holds for the exclusion; it now holds for these two\nas well, and the routed shape\
  \ is deliberately DIFFERENT from that sibling's. is derivable\nbox-side from the\
  \ request's own last-green ref listing, so the routed driver computes it there.\
  \ These\ntwo are NOT: the census marker must be read from the LAST-GREEN copy of\
  \ each swept file and the\ntouched fact from the candidate DIFF, and the REASON\
  \ each file was skipped (`census` | `touched`)\nhas no box-side source at all. So\
  \ the HOST computes the selection — the same\n`pinned_leg_narrowing` the local driver\
  \ calls, so there is exactly ONE computer and the two\ndrivers cannot drift — and\
  \ SHIPS the names to the leg, which only APPLIES them, bound to the PINNED\nleg\
  \ box-side rather than trusted of the caller (the mirror of the SPEC-0181 R1 selection\
  \ bound). The\nreported skip is assembled from BOTH ends: the APPLIED set from the\
  \ leg, which alone knows what it\nwas going to run, and the reason from the host's\
  \ own record — so the row and the log can never\ndescribe two different narrowings.\
  \ A shipped list that is absent, unreadable or malformed skips\nNOTHING (the leg\
  \ runs whole), the same fail-safe direction the local driver's inputs carry. Grounds:\n\
  the two exclusions were computed NOWHERE on a routed land before this — the local\
  \ driver that owned\nthem is never called there — so every venue land re-ran the\
  \ stale pinned copy and paid a full\nrebaseline round, 13 of them measured on 2026-09-10,\
  \ the exact cost exists to remove.\nBoth exclusions are REPORTED, never silent —\
  \ each skipped file is named with its reason\n(`census` | `touched`) in `land_completed.data.verify_metrics.pinned_skipped`\
  \ and printed as its own\n`land[pinned/last-green]:` line — both are FAIL-SAFE (an\
  \ unreadable file or an underivable diff\nexcludes nothing, so the leg can only\
  \ ever run MORE), both are DROPPED entirely rather than applied\nwhen they would\
  \ empty the selection (an empty selection reads GREEN, which would silently disable\n\
  this leg), the CANDIDATE leg is untouched, and `--rebaseline` semantics are unchanged\
  \ for everything\nstill pinned. Measured basis: over the journal segment 2026-09-02..09-09\
  \ (814 `land_completed` rows,\nfolded 2026-09-09) 95 of 208 verify aborts were pinned-only,\
  \ and 73 of those branches later landed\nvia `--rebaseline --rebaseline-kind broken`\
  \ — the pin was stale by construction.\nReliability-first: the old verifier's checks\
  \ cannot be silently removed by the same commit. A land\nthat LEGITIMATELY relaxes\
  \ a check (the pinned verifier then fails on purpose) is handled by the\nEXISTING\
  \ owner-authorized emergency-bypass (CHARTER §Principle 2), surfaced explicitly\
  \ — NOT a new\noverride mechanism, gate cascade, ledger, or FSM. Whether intentional\
  \ relaxation needs a STANDING\ngoverned path beyond emergency-bypass is a TRIAL-resolved\
  \ disposition, not pre-committed: if legit\nrelaxations run ≤1/30d (the emergency-bypass\
  \ frequency threshold) emergency-bypass suffices (no\nincident → no mechanism, §P1\
  \ F4); a higher observed rate is the incident that pulls a distinct\ngoverned `verify-relax`\
  \ disposition. Decided at trial exit.\n\n**Isolation mechanism — the pinned verifier\
  \ runs SUBPROCESS-ISOLATED against a MATERIALIZED merged_base\nbin/ tree.** \"Run\
  \ the pinned `main` verifier\" must run the merged_base verifier LOGIC + RUNNER,\n\
  not the candidate's. The runner now lives in the layered bin/lib package, so an\
  \ IN-PROCESS load of\nthe merged_base engine is INSUFFICIENT: its `from lib import...`\
  \ resolves from the live process's\n`sys.modules` cache (the land already imported\
  \ the candidate `lib.*`), silently running the LIVE\n(possibly weakened) runner\
  \ in both passes — defeating §3 for verify-path code resident in the bin/lib\npackage.\
  \ In-process isolation is impossible (the live land process is itself using `lib.*`).\
  \ So `land`\nMATERIALIZES the merged_base engine tree (the engine binary + its bin/lib\
  \ package) to a temp dir and runs\nthe pinned runner in a SUBPROCESS (fresh interpreter\
  \ → clean `sys.modules` → merged_base `lib.*`). The\nbad-list returns over a dedicated\
  \ result FILE (not stdout — the runner + its test subprocesses write to\nstdout/stderr\
  \ freely). FAIL-CLOSED: a subprocess / result-parse failure is a pinned-verify failure,\
  \ never\na silent skip. The §6b consumer/test-repo case (merged_base lacks the engine\
  \ binary) keeps the in-process\nrunner — there the engine binary is the already-pinned,\
  \ consumer-immutable engine, so no isolation gap\nexists. This is a MECHANISM realization\
  \ of §3's both-must-pass (the rule is unchanged); the §1\nfile-membership trigger\
  \ already fires for a bin/lib verify-path touch (the glob set lives only in the\n\
  code constant, §1).\n\n### 3a. The STANDING re-baseline path (in-place additive\
  \ — resolves §3's deferred disposition)\n§3 deferred \"whether intentional relaxation\
  \ needs a STANDING governed path beyond emergency-bypass.\"\nThe incident RESOLVED\
  \ it: a deliberate, AUDITED BEHAVIOUR change is structurally common (it is\nwhat\
  \ every spec/behaviour task does), and the only prior path — `--no-tests` (now owner-gated,\
  \ §2a) —\nis too BLUNT: it skips ALL verification, not just the superseded old-behaviour\
  \ check. So this spec adds\na STANDING, NARROWER governed path: the governed **re-baseline**.\n\
  - **Not-hygiene cross-ref.** A change that touches this pinned verify-path (or any\
  \ spec /\n  always-loaded seed) is by definition **fast-path INELIGIBLE — NOT hygiene**\
  \ (LIFECYCLE §Two flow\n  types → \"Fast-path eligibility\"), so it runs the substantive\
  \ path and its rebaseline carries a\n  fresh audit-post (the A-prime own-homework-close\
  \ below). The incidental-staleness carve-out there\n  is the same soft-edge this\
  \ §3a governs.\n- **When it fires.** A verify-path-touching land whose **CANDIDATE\
  \ verify is GREEN** (the new behaviour\n  is correct by its own tests) but whose\
  \ **pinned LAST-GREEN check FAILS** because the old behaviour-tests\n  it overlays\
  \ encode the behaviour the change deliberately revised (a real ASSERTION failure,\
  \ NOT the\n  §3 additive-layout `No module named` carve-out).\n- **WHEN to DECLARE\
  \ it — carry the declaration into the FIRST land attempt, do not discover it\n.**\
  \ The bullet above says when the leg ARMS; this says when the OPERATOR acts on that.\n\
  \  **Trigger:** the change's diff touches the verify path's OWN EXECUTABLE surface\
