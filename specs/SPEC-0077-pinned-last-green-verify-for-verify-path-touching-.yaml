            unchanged reasoning: a flat local-craft NOTE (SPEC-0090) is never executable or behavioural,
            so it cannot stale a CODE audit, while the verify still runs the full suite over HEAD — so
            nothing is skipped. What got wrong was only its SCOPE, and that asymmetry is retired
            here: the same note on a task branch used to refuse.
      (ii) EXACT DIFF SHAPE — ONE of the TWO shapes `task close` itself produces or prescribes, each
            measured over the ENTIRE change to the spec file against the audited commit:
              - the FLIP close WRITES: ONE `status:` line replaced by another, the pair in the CLOSED
                vocabulary {proposed→active, active→superseded, proposed→withdrawn} — every flip the SOLE
