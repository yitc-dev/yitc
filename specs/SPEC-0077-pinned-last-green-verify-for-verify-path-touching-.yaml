      (ii) RESOLVED BY THE ONE AUTHORITY to a TEXT payload — `_classify_land_merge_conflicts`, asked over
            that same stream through the index-free stage-read seam built. Two ways to fail: the
            authority leaves the path unresolved, or it returns a kind carrying NO text payload, which
            means "resolvable" to the merge path but "no content to compare" to THIS reader. That
            missing-value judgement is made at the use site, never pushed into the shared authority.
      (iii) CONTENT IDENTITY — HEAD's content for the path is BYTE-IDENTICAL to that re-derived text. THE
