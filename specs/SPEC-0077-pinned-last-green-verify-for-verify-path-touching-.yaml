    update-from-main merge commit" — and that read every resolution, HAND-made or MECHANICAL, as content
    the audit never saw. But `_classify_land_merge_conflicts` is the ONE admission authority for what
    `update-from-main` resolves WITHOUT a human, and its output is a DETERMINISTIC FUNCTION of the two
    sides. So the gate demanded that an external auditor review a string the tool itself produced and can
    re-derive — and the auditor is a system-wide single point of failure, so every avoidable re-audit is an
    avoidable dependency on it. On a hot file the chain does not converge at all: a fresh conflict
    re-authors content on every attempt (measured 2026-08-19 — task/ needed five land attempts over
    ~3h, task/ walked conflict → resolution → currency refusal → re-audit → land). The claim is the
    same SHAPE as the closure exemption's: the merge the lifecycle REQUIRES cannot be the thing that makes
    the lifecycle unauditable.

    PROVEN means a CONJUNCTION of three axes, each carrying positive evidence; no axis is sufficient alone
    and a failure on any axis leaves the path REFUSED:
      (i) CONFLICT-MARKED in `merge-tree --write-tree <audit_commit> <merged_base>` — the gate's OWN
