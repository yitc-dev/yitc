            is read. This axis is also what makes a separate hand-made EXCLUSION unnecessary and unsound to
            add — a hand-typed string byte-equal to the mechanical output IS the mechanical output, and any
            hand resolution differing by one byte fails here.

    THE DID-NOT-ANSWER VALUE IS A REFUSAL, STRUCTURALLY. The subtraction is computed as a SUBSET of the
    already-blocking set, so "did not answer" and "no" are the same value and there is no third value to
    route (`lessons/carving-an-exception-into-a-fail-closed-gate` §1). An un-runnable git, an unparsable
    merge-tree stream, an authority that raised, an absent injection, an unreadable HEAD blob — each leaves
    the path exactly where the pre-exemption code left it.

    WHAT THIS IS NOT. It does not change the gate's POLARITY, add any flag or waive, or touch
