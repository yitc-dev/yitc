  \ is the ONE admission authority for what\n  `update-from-main` resolves WITHOUT\
  \ a human, and its output is a DETERMINISTIC FUNCTION of the two\n  sides. So the\
  \ gate demanded that an external auditor review a string the tool itself produced\
  \ and can\n  re-derive — and the auditor is a system-wide single point of failure,\
  \ so every avoidable re-audit is an\n  avoidable dependency on it. On a hot file\
  \ the chain does not converge at all: a fresh conflict\n  re-authors content on\
  \ every attempt (measured 2026-08-19 — task/ needed five land attempts over\n  ~3h,\
  \ task/ walked conflict → resolution → currency refusal → re-audit → land). The\
  \ claim is the\n  same SHAPE as the closure exemption's: the merge the lifecycle\
  \ REQUIRES cannot be the thing that makes\n  the lifecycle unauditable.\n\n  PROVEN\
  \ means a CONJUNCTION of three axes, each carrying positive evidence; no axis is\
  \ sufficient alone\n  and a failure on any axis leaves the path REFUSED:\n    (i)\
  \ CONFLICT-MARKED in `merge-tree --write-tree <audit_commit> <merged_base>` — the\
  \ gate's OWN\n          comparison, so no second oracle is introduced. This is positive\
  \ evidence that a conflict\n          existed AT ALL: a path whose re-merge is CLEAN\
  \ and whose HEAD nevertheless differs is a\n          post-audit EDIT, never a resolution.\n\
  \    (ii) RESOLVED BY THE ONE AUTHORITY to a TEXT payload — `_classify_land_merge_conflicts`,\
  \ asked over\n          that same stream through the index-free stage-read seam\
  \ built. Two ways to fail: the\n          authority leaves the path unresolved,\
  \ or it returns a kind carrying NO text payload, which\n          means \"resolvable\"\
  \ to the merge path but \"no content to compare\" to THIS reader. That\n       \
  \   missing-value judgement is made at the use site, never pushed into the shared\
  \ authority.\n    (iii) CONTENT IDENTITY — HEAD's content for the path is BYTE-IDENTICAL\
  \ to that re-derived text. THE\n          LABEL IS NEVER TRUSTED: no marker, commit\
  \ subject or recorded claim that a resolution happened\n          is read. This\
  \ axis is also what makes a separate hand-made EXCLUSION unnecessary and unsound\
  \ to\n          add — a hand-typed string byte-equal to the mechanical output IS\
  \ the mechanical output, and any\n          hand resolution differing by one byte\
  \ fails here.\n\n  THE DID-NOT-ANSWER VALUE IS A REFUSAL, STRUCTURALLY. The subtraction\
  \ is computed as a SUBSET of the\n  already-blocking set, so \"did not answer\"\
  \ and \"no\" are the same value and there is no third value to\n  route (`lessons/carving-an-exception-into-a-fail-closed-gate`\
  \ §1). An un-runnable git, an unparsable\n  merge-tree stream, an authority that\
  \ raised, an absent injection, an unreadable HEAD blob — each leaves\n  the path\
  \ exactly where the pre-exemption code left it.\n\n  WHAT THIS IS NOT. It does not\
  \ change the gate's POLARITY, add any flag or waive, or touch\n  `merge_inherited`\
  \ or the reserved did-not-answer bucket, which must never be re-classified by a\
  \ helper\n  that also could not answer. A resolution whose re-derivation DIFFERS\
  \ from HEAD — because the branch\n  merged main more than once, or carries its own\
  \ post-audit edit to the same file — is a MISSED\n  exemption, never a false admission:\
  \ it stays refused, which is the pre-exemption outcome. And it widens\n  nothing\
  \ in SPEC-0064: the subtraction is LOCAL to the currency consumers, exactly as the\
  \ closure\n  exemption's is.\n- **NON-empty post-close delta — the re-audit-after-close\
  \ path (X-0040's other half).** The\n  empty-delta bullet above covers a post-close\
  \ re-baseline whose source is BYTE-IDENTICAL to an\n  ancestor audited tree. It\
  \ does NOT cover the SIBLING case: a worker makes LEGITIMATE post-audit-post\n \
  \ SOURCE changes (recovery test-fixes), so the current source is NO LONGER the audited\
  \ tree (a NON-empty\n  delta) — the empty-delta scan correctly refuses, and a DONE\
  \ task previously could not re-audit, so the\n  only escape was again the blunt\
  \ `--no-tests` (the deadlock live-hit on). RESOLVED WITHOUT a new\n  honoring path:\
  \ `audit post --reaudit-after-close --task T-XXXX` (SPEC-0036's in-progress-only\
  \ carve-out\n  — that rule is now TOUCHED, superseding this bullet's earlier \"\
  needs NO re-audit-after-close path\"\n  statement) records a FRESH GREEN/YELLOW\
  \ `audit_post_completed` at the CURRENT tree (HEAD). The\n  `_change_is_audited`\
  \ gate then honors it by the SAME inert-delta test already specified above (the\n\
  \  fresh audit's recorded commit IS HEAD, so its delta to HEAD is empty → audited);\
  \ on a `task/T-NNNN`\n  branch the task-path picks it as the LATEST audit, on a\
  \ `work/<slug>` branch the empty-delta scan\n  accepts it. So this is purely an\
  \ audit-INVOCATION extension (SPEC-0036) + read-gate carve-out\n  (SPEC-0050) —\
  \ the §3a honoring logic here is UNCHANGED. A non-empty delta with NO fresh re-audit\
  \ still\n  stays REFUSED (the real audit requirement is NOT loosened — the re-audit\
  \ is the way to satisfy it,\n  never to bypass it).\n- **Why it is NOT a self-approval\
  \ hole.** The candidate verify STILL runs green (the new checks gate),\n  and an\
  \ INDEPENDENT external audit reviewed the change — so a verifier-WEAKENING (candidate\
  \ green only\n  because the check was removed from code + new tests) is caught by\
  \ the auditor, not waved through. The\n  baseline RESETS by construction: the next\
  \ land's pinned source is THIS now-green `main` HEAD (§2) — no\n  new store/tag/FSM\
  \ (CHARTER §P1 F3).\n- **The waive is PER-ASSERTION, scoped to what the DECLARATION\
  \ names ( — in-place, the code\n  catching up to this §'s own \"waives ONLY the\
  \ superseded old-behaviour check\").** The eligibility\n  gate above (ack + `>=30-char`\
  \ reason + `_change_is_audited`) gates the PATH; it does NOT decide\n  WHICH assertions\
  \ the waive covers. Until the grant was ALL-OR-NOTHING — the whole failing\n  pinned\
  \ set was recorded as superseded, whatever was in it — so any unrelated flake or\
  \ regression\n  failing in the same run rode in on an authorization given for a\
  \ different check, and §2's\n  re-pinning then absorbed it into the new last-green\
  \ baseline (the REAL incident: the land,\n  2026-08-06, waived an unrelated `test_audit_consult.py`\
  \ UnicodeDecodeError alongside the named\n  layout guard; fingerprint `rebaseline-waives-pinned-failures-its-reason-never-named`).\
  \ So: the\n  authorizer DECLARES each waived assertion with the repeatable `--rebaseline-waive`\
  \ flag, and any\n  failing pinned assertion the declaration does NOT cover keeps\
  \ the land REFUSED on the EXISTING\n  `rebaseline-unauthorized` abort class (no\
  \ new abort taxonomy). The `--rebaseline-reason` stays\n  PROSE — coverage is never\
  \ derived from how a sentence happens to be worded, and there is NO\n  implicit,\
  \ derived, or fallback coverage source: the operator's token is the only positive\
  \ evidence.\n  **Assertion-SCOPED, over a closed three-class vocabulary** (the file\
  \ alone is not the unit — this\n  runner is not pytest, so no node id exists and\
  \ the surfaced assertion TEXT is the only sub-file\n  identity the pipeline has):\
  \ an ASSERTION-BEARING failure is covered only by a QUALIFIED token\n  `<key>::<substring\
  \ of the surfaced assertion>` — where `<key>` is the name the failing check is\n\
  \  REPORTED under, NOT necessarily a test file (X-0846: naming this slot `<test-file>`\
  \ here\n  and on the operator-facing surfaces made a reader compose a token from\
  \ a REAL test file and a REAL\n  assertion that the matcher then refused `no-match`,\
  \ because that consumer's failure is keyed by its\n  verify LAYER — see the two-runner\
  \ rule below, which this wording now matches instead of\n  contradicting); a bare\
  \ `<key>` token is accepted ONLY\n  for a provably FILE-LEVEL entry (the runner\
  \ captured no assertion text at all); an UNKEYED entry —\n  a pinned setup / pinned-engine-subprocess\
  \ / consumer-SETUP fault — is NEVER coverable, because an\n  infrastructure fault\
  \ is not a superseded old-behaviour check. **Two runners are KEYED, one per\n  sweep\
  \ (X-0634):** the kernel sweep keys on the test FILE (`test failed: <file>`), and\
  \ a\n  consumer that DELEGATES `tests/` to a declared verify layer (SPEC-0152 rule\
  \ 16) keys on the LAYER\n  NAME (`land(consumer): verify layer '<name>' FAILED (exit\
  \ N): …`) — the layer name is the only\n  identity that runner has, and without\
  \ it EVERY pinned failure in such a consumer was UNKEYED BY\n  CONSTRUCTION, so\
  \ `--rebaseline-waive` (REQUIRED with `--rebaseline` since) could never\n  bind\
  \ and the A-prime option-(B) Worker self-clear above had no reachable path. That\
  \ widening is\n  over what can be KEYED, NEVER over what counts as COVERED: a keyed\
  \ layer failure still needs its\n  QUALIFIED `<layer>::<substring>` token, and the\
  \ exact-shape parse leaves every neighbouring\n  consumer-guard entry (a `prep:`\
  \ fault, a layer TIMEOUT, a malformed `verify.layers[i]` contract)\n  UNKEYED. One\
  \ asymmetry is deliberate and belongs to the READER, not the parse: a keyed entry\
  \ with\n  NO captured text is a provably file-level failure for the ONE-file kernel\
  \ subprocess (C2, bare\n  token) but proves NOTHING for a whole layer harness, so\
  \ a consumer layer entry that captured\n  nothing stays UNKEYED-in-effect (C3) and\
  \ refuses. FAIL-CLOSED on every axis: a token\n  binding to nothing, binding ambiguously,\
  \ or bare against an assertion-bearing failure is REJECTED\n  (a declaration that\
  \ does not bind is not an ack, never a silent no-op). Realized by\n  `_rebaseline_waive_coverage`\
  \ / `_pinned_failure_test_file` in `bin/lib/worktree.py`.\n**THE DECLARATION TARGET\
  \ IS THE COMPLETE FAILING SET — no fail-fast on the pinned pass.**\nThe per-assertion\
  \ declaration above is matched ENTRY BY ENTRY and is fail-closed in BOTH directions:\n\
  an uncovered failure refuses, and a token that binds nothing refuses as `no-match`.\
  \ That is a usable\npath ONLY if the set it is declared against is the SAME set\
  \ on the next attempt. The pinned test\nrunner used to stop at the FIRST observed\
  \ failure, so over a real multi-failure state it reported a\nrun-varying SUBSET\
  \ and the required declaration MOVED between attempts — a coin flip no quiescence\n\
  settles (measured: 8 land aborts on across two sessions in one day; those same journal\
  \ rows\nwere first misread as on-disk CONTAMINATION of the pinned tree, a reading\
  \ an external auditor\nretired — derived artifacts are GENERATED from live sources,\
  \ so their presence proved nothing).\nSo the pinned pass RUNS EVERY CHECK AND REPORTS\
  \ EVERY FAILURE before any waive matching is applied:\nthe kernel sweep asks its\
  \ runner for the complete set (`fail_fast=False`), and the consumer leg\nalready\
  \ ran every declared layer. This is a REPORTING rule, not a gate change — the verdict\
  \ stays\npass-iff-empty, no check is skipped, reset or weakened, and SPEC-0071's\
  \ per-file timeout bound +\ngroup-kill are UNTOUCHED (only the whole-RUN early exit\
  \ is given up, and only on a FAILING pinned\nrun: a green run already ran every\
  \ file). **SCOPE of that sentence — it is a claim about THIS\nfail_fast reporting\
  \ change, not about the leg as a whole.** \"No check is skipped, reset or weakened\"\
  \nsays that giving up the early exit neither drops a check from the run nor softens\
  \ a verdict; it is\nNOT a claim that every test a project owns enters the pinned\
  \ set in the first place. Which tests\nENTER it is the separate, DECLARED question\
  \ answered by the `timing_lane` pointer above (home:\nSPEC-0160 rule 10) — so a\
  \ reader of this paragraph alone should not read it as a whole-spec\nguarantee that\
  \ the pinned set is never narrowed. The CANDIDATE verify keeps its fast abort —\
  \ it is judged\nas a verdict, never matched token-by-token. TRANSITIONAL BY §1's\
  \ OWN DESIGN: the pinned runner on an\nengine self-land IS merged_base code, so\
  \ the driver asks for the complete set only when the\nlast-green runner carries\
  \ the parameter (capability-probed, never blindly — an unknown kwarg would\nbe a\
  \ fail-closed pinned ABORT on every land), and the rule therefore takes effect from\
  \ the land\nAFTER the one that ships it. Realized by `_run_pinned_verify` / `_PINNED_VERIFY_DRIVER`\
  \ /\n`_run_verify_tests` in `bin/lib/worktree.py`.\n**THE SUGGESTED TOKEN IS THE\
  \ BOUND TOKEN — a round-trip INVARIANT (X-0685 / X-0683 /\nX-0660).** The refusal\
  \ above PASTES a ready `--rebaseline-waive` line per uncovered entry, and that\n\
  paste is normative, not decorative: the token the refusal suggests, copied VERBATIM\
  \ through a shell,\nMUST bind the entry it was suggested for. It did not — the paste\
  \ was composed inline in the refusal\nwhile the binding rule lived in the matcher,\
  \ so the two drifted, and a non-ASCII assertion (pasted\nbackslash-u escaped) or\
  \ a consumer verify-LAYER name containing `/` (path-mangled by the matcher)\nwas\
  \ rejected `no-match` by the very message that offered it. With `--rebaseline-waive`\
  \ REQUIRED\nsince, an operator who cannot form a binding token has NO sanctioned\
  \ path at all: <project>,\nafter 4 refused attempts on, neutralized the superseded\
  \ test directly on main — the\ngovernance bypass this § exists to make unnecessary.\
  \ So the token is built in ONE place\n(`_rebaseline_waive_suggested_token`) from\
  \ the SAME entry records the matcher judges, and is quoted\nfor a real shell paste\
  \ (literal text; `$` and backtick escaped). **And it is STABLE ACROSS RUNS of\n\
  the same failing state:** the qualifier is compared — on BOTH sides, and emitted\
  \ already-normalized\n— as its `_waive_qualifier_key`, which collapses an ENUMERATED\
  \ set of run-varying spans (ISO-8601\ntimestamps, wall clocks, `0x…` handles, durations,\
  \ temp paths, hex ids carrying both a letter and a\ndigit, and a `-`/`_`-delimited\
  \ digit run inside a word that CONTAINS a letter) to `*`. Without that,\na Docker-wrapped\
  \ verify layer whose captured tail names a per-run container pid + hash yields a\n\
  token that cannot be written before the run and differs on every retry — X-0683,\
  \ where a fully\nbuilt, tested and audited-GREEN consumer task could not integrate\
  \ at all. The normalization governs\nonly HOW a qualifier is COMPARED: the C1/C2/C3\
  \ vocabulary, the mandatory qualifier for an\nassertion-bearing entry, and every\
  \ fail-closed axis above are UNCHANGED, and the\nletter-bearing-word condition keeps\
  \ an assertion's own numeric VALUE (`assert '200-000' ==\n'200-000-000'`) exact\
  \ — a token naming a different number still does not bind.\n**THAT STABILITY IS\
  \ SCOPED TO RUN-VARYING SPANS, AND A SECOND AXIS EXISTS — MAIN-VARYING VALUES\n\
  .** The normalizer above stabilizes a token against what one RUN differs from the\
  \ next by.\nIt deliberately does NOT touch a plain number, because the letter-bearing-word\
  \ condition just named\nis what keeps an assertion's own numeric VALUE exact — and\
  \ that exactness must not be traded away.\nBut a pinned assertion can carry a value\
  \ that is MAIN-varying rather than run-varying: a count or\nroster the CORPUS itself\
  \ keeps moving (`expected 29 concern born blocks, got 30` read 29, then 30,\nthen\
  \ 31 within one day as concerns were added). A token minted on one `main` is then\
  \ `no-match` on\nthe next, and because the refusal instructs the operator to paste\
  \ it VERBATIM, the refusal pastes a\nFRESH count-bearing token and re-arms the identical\
  \ staleness — a re-mint-and-re-queue loop costing\none land attempt and one queue\
  \ position per turn (the measured incident: task/, whose single refusal shows both\
  \ halves — three rejected count-bearing tokens\nand three fresh count-bearing suggestions).\n\
  **The remedy is on the OFFER side, and the MATCHER IS UNCHANGED.** The waive matcher\
  \ already tests\nthe qualifier by SUBSTRING containment, so a digit-free span of\
  \ the assertion ALREADY binds across\nthe moving value; what was missing is that\
  \ no sanctioned surface ever OFFERED such a span, leaving\nthe volatile token as\
  \ the only one an operator could paste. So every refusal composed in\n`bin/lib/rebaseline_currency.py`\
  \ now pastes a SECOND, CLASS-SHAPED token BESIDE the exact one:\n`<key>::<the assertion's\
  \ STABLE IDENTIFYING SPAN>` — its FIRST digit-free run of at least 2\nwhitespace-delimited\
  \ words and 12 characters, derived from the exact token's own output so every\n\
  existing guard (C3 → no token, C2 → the bare key, the wrap repair, the 60-char truncation)\
  \ applies\nin ONE place and cannot drift. FIRST run, not longest: the leading run\
  \ is the assertion's identifying\nHEAD, whereas the longest is as likely to be its\
  \ moving data TAIL.\n**THE COARSENESS FLOOR IS PART OF THE RULE, not a tuning detail**,\
  \ and there is NO fallback to a\nshorter run — an entry that clears nothing is offered\
  \ NO stable token at all. Without the floor the\nspan for `FAIL test_ac2_...`, whose\
  \ first digit-bearing word is the TEST NAME, would be the bare word\n`FAIL` — as\
  \ coarse as the bare-key token this § already refuses for a C1 entry. For the same\
  \ reason\nthe span is NOT the exception TYPE: `<key>::AssertionError` matches EVERY\
  \ assertion in that file,\nwhich is precisely the over-broadening the span exists\
  \ to avoid (measured over the three real\n assertions, all `AssertionError:` — the\
  \ type token covers all three, each span token covers\nits own and refuses both\
  \ siblings).\n**BOUND — this widens only WHAT IS OFFERED.** The C1/C2/C3 vocabulary,\
  \ the mandatory qualifier for\nan assertion-bearing entry, the mechanical tie required\
  \ of `--rebaseline-reason`, the fresh\nGREEN/YELLOW audit-post condition, and every\
  \ fail-closed axis above are UNCHANGED: it narrows which\nTEXT identifies a failure,\
  \ never WHO may clear it or WHEN. Binding is guaranteed BY CONSTRUCTION\nrather\
  \ than by a second matcher — the exact qualifier is a prefix of the entry key, so\
  \ a stripped\ncontiguous run of it is a contiguous substring of that key.\n**NAMED\
  \ RESIDUAL, stated rather than papered over:** two DISTINCT numeric assertions in\
  \ the SAME file\ncould share an identifying head. The runner appends AT MOST ONE\
  \ entry per file per run, so at most one\ncan be present in the failing set a declaration\
  \ is judged against; were two ever present, the\nEXISTING `ambiguous` axis refuses\
  \ the token. No new fail-open path is introduced. Realized by\n`_rebaseline_waive_stable_token`\
  \ / `_rebaseline_waive_paste_lines` in `bin/lib/rebaseline_currency.py`;\nthe uncovered-entry\
  \ scope refusal in `bin/lib/worktree.py` still composes its own exact-only line\
  \ and\nis tracked as an open followup.\n- **Surfaced, never silent.** Records `land_completed.rebaselined:\
  \ true` + `rebaseline_kind`\n  ( — WHY, below) + `rebaseline_reason` +\n  `pinned_superseded`\
  \ (the waived old-behaviour assertions) + `rebaseline_waived` ( — each\n  waived\
  \ assertion PAIRED with the declaration that covered it, so the journal shows exactly\
  \ what\n  the ack bought, not only what was given up); `verify_mode=rebaselined+candidate`\n\
  \  (§Verification; registered in SPEC-0025). A `--rebaseline` ack without a current-state\
  \ audit is\n  REFUSED (the land aborts). The blunt `--no-tests` bypass remains for\
  \ the genuinely non-audited case\n  (a non-task branch with NO ancestor audit covering\
  \ the current source — the POST-CLOSE bullet above\n  now covers the empty-delta\
  \ non-task case that previously fell to `--no-tests`).\n- **The waive carries a\
  \ KIND — *broken* and *unrunnable-here* stop sharing one record (X-0739, <project>).**\
  \ Everything above records WHAT a re-baseline waived and WHO was entitled to\n \
  \ it; nothing recorded **WHY**. So a check waived because its failure is REAL here\
  \ and a check\n  waived because it is HEALTHY BUT CANNOT RUN here landed in the\
  \ identical `rebaselined: true`\n  shape, and the only carrier that could separate\
  \ them was `rebaseline_reason` — which this §\n  itself declares to be PROSE, never\
  \ load-bearing. The measured case: a consumer whose verify is a\n  heavy full-stack\
  \ script cannot satisfy the §3 two-leg verify AT ALL once its diff touches\n  `tests/`\
  \ or the verify script, so its only sanctioned recovery waives a demonstrably healthy\n\
  \  check and the record then says the same thing it says about a broken one. So\
  \ the AUTHORIZER\n  DECLARES the kind, alongside the per-assertion declaration it\
  \ already must pass:\n  - `--rebaseline-kind broken` — the pinned failure is REAL\
  \ in this checkout: the superseded\n    old-behaviour assertion the change obsoletes\
  \ (the ordinary §3a case), or a genuinely broken\n    check.\n  - `--rebaseline-kind\
  \ unrunnable-here` — the pinned check is HEALTHY but cannot RUN in this\n    checkout\
  \ at all. Waiving it asserts NOTHING about whether it would pass.\n  - `--rebaseline-kind\
  \ environmental` ( — the THIRD value, ADDITIVE) — the pinned check is\n    HEALTHY\
  \ and RUNNABLE here but FAILED under the FULL-run load. The waive attributes the\
  \ FULL-run\n    failure to LOAD, not to the check. This is the LOAD-FLAKE case,\
  \ and it is the one value that is\n    not purely a label — it selects a BINDING\
  \ MODE (the two-part conjunction below).\n  **THE ISOLATED RE-RUN NOW HAPPENS AUTOMATICALLY,\
  \ INSIDE THE FIRST ATTEMPT.** Part (i)\nbelow — every named file re-run alone in\
  \ a single subprocess OUTSIDE the contended pool — is no\nlonger reachable only\
  \ by declaring a SECOND land. When a leg the CURRENT runner executes stops on\n\
  failures and the failing set is within `YITC_VERIFY_RETRY_MAX_FILES`, the runner\
  \ re-runs each\nfailing file once in isolation on the SAME tree; ALL pass -> the\
  \ leg RESUMES over its not-yet-run\nfiles and the land reaches its own verdict,\
  \ ANY fails -> the abort is exactly as it was, and\neither way `land_completed.verify_metrics.flaky_retry`\
