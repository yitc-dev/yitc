  \ still refuses: a binding change to a spec this\n  close did not activate, one\
  \ riding with a body/rule edit, or one carrying any other content. The point\n \
  \ is not that binding tokens are harmless; it is that this exact edit is the one\
  \ closure ITSELF prescribes,\n  and a governed instruction must not be refused by\
  \ the governed verb that follows it. And it does NOT\n  touch `merge_inherited`,\
  \ which still never refuses\n  on its own (the position, preserved). Every other\
  \ observable post-audit path — bin / tests /\n  patterns / root-md, and any `specs/**`\
