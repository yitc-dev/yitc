    its traceback INLINE and KEEPS GOING, printing the remaining `PASS:` lines after it — so whenever the
    failing test is not the last one in its file, the failure sits in the ELIDED MIDDLE while head and
    tail are passing lines, and extraction correctly falls through to its last-non-empty-line fallback
    and names an assertion that PASSED. Live 2026-08-09 on the land: the block named
    `PASS: / — _terminal_detail splits the blocked-on-land detail by escalation target`
    while the real failure was `test_t10818_done_but_unlanded_task_can_escalate` (12 passed, 1 failed,
    and the block named one of the 12) — a confident, plausible, WRONG diagnosis that nothing fails
    closed on, and worse than a missing label because a missing one prompts a direct test run. So: the
    excerpt RESCUES the failure-identity lines out of the span it elides (POSITIVE discriminators homed
    once in `bin/lib/worktree.py` and read by both halves; budgeted, and a clip is STATED), and the
    extractor keys off the FAIL MARKER ahead of the positional rules, naming EVERY failure it finds.
    Naming ALL of them is load-bearing, not cosmetic: the waive COVERAGE vocabulary above scopes a C1
    ack to a qualified token whose substring occurs in THAT entry's surfaced assertion, so a failure this
    block does not name escapes the operator's ack and is absorbed into the next baseline by §2's
    re-pinning — the defect one layer up. Both of the excerpt's passthroughs (`<= bound` and
    near-bound) stay byte-identical and the extractor's rules 1/1b/2 keep their order, so nothing
    already-correct moves.
    **A SELF-REPORTED `FAILED` SUMMARY IS A BINDABLE IDENTITY (live,
    batch bat-610872eb3db6 — in place, additive).** Every discriminator above keys off a RAISED failure
    or a runner/pytest line, so a test that CATCHES its own failures and prints its OWN summary defeats
    all of them: its whole output carries no matchable marker, the block renders `(no assertion
    captured)`, and the SPEC-0184 red-isolation oracle correctly declines `entry-names-no-assertion` —
    the attribution machinery works and its INPUT is unreadable. Live: a three-member batch requeued
    every member with nobody evicted, because `tests/test_event_catalog_completeness.py` surfaced
    nothing while its own `FAILED (1): AC1 — …` sat in the captured tail. So a summary that NAMES the
    failing criteria — the `FAILED` verdict marker, a colon, a non-empty payload — is bound as the
    assertion identity, all of them, by the same name-them-ALL discipline the rules above carry.
    **The bound, which is the rule and not a caveat:** a COUNT-ONLY summary (`FAILED (3 check(s))`,
    `FAILED — 2 failure(s)`, `2 FAILED`, `3/5 FAILED`, or a colon with an empty payload) is NOT bound —
    it states THAT something failed and never WHICH, and promoting it into the assertion position is
    exactly the noise-as-assertion defect the paragraph below retired. Silence stays the honest
    answer there, and the oracle still declines. **Qualified by — the count-only header may
    OPEN AN ENUMERATED LIST, and the LIST is bound where it exists.** Several of this repo's own test
    files print such a banner and then one `- <criterion>` bullet per failure, so the criterion IS
    named one line below the header the rule above rightly refuses; the extractor's rule 2c reads that
    contiguous run of bullets and returns the ENTRIES. The bound above is UNWEAKENED, not carved into:
    the HEADER is still never bound, never returned, and a count-only summary with nothing enumerated
    beneath it still yields silence. What changed is that "the file surfaces nothing" no longer follows
    from "the header names nothing" — where the file enumerated its failures, they are now named, which
    moves such an entry from the file-scoped C2 waive class to the assertion-scoped C1 one. Contiguity
    is the discriminator: one non-bullet line closes the run, so this is not the retired last-non-empty
    fallback and a log line cannot reach the assertion position however the tail ends.
    The discriminator is POSITIVE and anchored at line
    start, homed once in `bin/lib/worktree.py` beside its three siblings and read by BOTH halves (the
    extractor's scans and the excerpt's rescue). It is placed LAST in the extractor's order,
    immediately before the no-assertion return, so it can fire ONLY where the answer was already
    none: no input that already extracted correctly changes answer, and a raised exception still binds
    by the traceback rule exactly as before.
    **What this does NOT cover — the honest bound (measured, not asserted).** Of the 197 test files
    that print a self-reported summary, 74 were already bindable by an existing rule, 52 become
    bindable here, and 71 remain bound by nothing: chiefly the bare `FAIL <label>` per-check dialect
    with no colon (the largest remaining shape, which belongs to the RUNNER discriminator, not to this
    rule) and the count-only shapes excluded above. And a NAME-ONLY identity carries LESS than an
    exception's text — it says WHICH criterion failed, not what broke inside it. For the SPEC-0184
    pair-match oracle that is sufficient: it asks whether two runs failed the SAME thing, and a
    criterion label answers that. For the §3a A-prime MECHANICAL TIE it is sufficient only when the
    criterion label is itself specific; where a file's labels are bare ordinals (`AC1`), the operator
    still has to read the test to know what broke. That residue is real and is not closed here.
    **THE BLOCK NAMES AN ASSERTION OR SAYS IT HAS NONE — the last-non-empty FALLBACK is RETIRED (X-0736/X-0732/X-0698, kupiclub).** Two measured gaps remained, and they compound. First, the pytest
    short-summary discriminator REQUIRED a ` - <msg>` half, but under `--tb=no` — an ordinary consumer
    harness setting — pytest prints the summary BARE (`FAILED <nodeid>`). A consumer layer records
    `(stdout + stderr)[-500:]` and alembic logs to STDERR, so the log lines land LAST: every scan missed
    the bare summary lines and the fallback promoted `INFO [alembic.runtime.migration] Running upgrade …`
    into the assertion position, while 9 real failures across 3 layers sat unnamed in the SAME tail
    (X-0736). The ` - <msg>` half is therefore OPTIONAL now, in the ONE homed discriminator both halves
    read. Second, and independently: where NO failure-identity marker occurs anywhere in the tail, the
    extractor returns NOTHING and the block STATES that it captured no assertion, rendering the tail's
    last line behind that marker as explicitly-labelled CONTEXT. It is never again presented AS the
    assertion. Silence is the honest answer here and a plausible wrong answer is the defect: this block is
    what the A-prime MECHANICAL TIE is made against, so a log line in the assertion position makes a tie
    to it clear the `>=30-char` reason check while meaning nothing (X-0698), and an excerpt of migration
    logs naming no failure at all costs a full land cycle to diagnose (X-0732). Nothing is lost from the
    record — a verify TIMEOUT entry's most informative line is exactly that last line, and it still
    prints, just not as an assertion.
    **What an UNNAMED entry is COVERABLE by splits by key kind — reader-judgement rule, applied
    to the honest marker rather than to bare absence.** A kernel `test failed: <file>` entry runs ONE file
    as ONE subprocess, so "no failure marker" is a PROVABLY file-level failure: it stays C2, covered by the
    BARE token, and a QUALIFIED token binds NOTHING against it — that is what refuses a reason tied to a
    line the block did not present as an assertion. A consumer verify LAYER is a whole harness behind one
    name, where file scope proves nothing and the captured line is the ONLY sub-layer identity the
    pipeline has; it keeps binding on that line (identity unchanged), because refusing it outright is
    exactly what re-opens X-0683/X-0685 — no bindable token at all, and the measured outcome was a check
    neutralized on main by hand. Captured NOTHING at all remains C3.
    **And the token BINDS AS PASTED (X-0753).** `_waive_qualifier_key` collapses a RUN of
    whitespace to one space — on both sides and in the emitted token. The operator copies the token off
    `land`'s contracted FINAL line, which `_land_terminal_signal` whitespace-collapses BY CONTRACT (the
    single-final-line parser contract owns that collapse and is not relaxed here), while the matcher
    compared it against the RAW assertion text: an alembic line's DOUBLE space made the verb's own
    suggestion bounce `no-match` on paste. The matcher is the side that yields; the key stays idempotent,
    so the token is still emitted already-normalized and binds either form. The C1/C2/C3 vocabulary and
    every fail-closed axis above are untouched.
    **BOTH runner dialects are recognised, or the failure has no name at all (the
    deadlock).** The `FAIL` marker above is written two ways in this suite: `FAIL: <msg>` by the
    collect-and-report `check` helper, and `FAIL <test_name>: <msg>` by a file's own `__main__` runner.
    Only the first was matched, so a file printing the second was invisible to BOTH halves at once — the
    excerpt rescued none of its FAIL lines out of the elided span, the extractor found no marker, and the
    entry surfaced as `(no assertion captured)`, i.e. C2. That is not merely a poorer diagnostic: it made
    a LEGAL re-baseline UNREACHABLE, because the qualified tokens the operator declared (both naming a
    real failing test) returned `no-match` while the bare file token is refused BY DESIGN for an
    assertion-bearing failure — measured on the land, 2026-08-11, journal
    `abort_class=rebaseline-unauthorized`. The single homed discriminator now carries a second, DISJOINT
    branch for the named dialect (identifier name token — no space, no colon — so it stays POSITIVE and
    does not degenerate into a `^FAIL` prefix scan; the message is optional there because the NAME is
    already the identity, while a bare `FAIL:` still requires text after it). The first branch is
    byte-identical, so no input that matched before changes answer. This widens only WHAT IS RECOGNISED
    as a failure line: the C1/C2/C3 vocabulary, the bare-file-token refusal, the A-prime authority, the
    `>=30-char` reason and the current-state audit-post requirement are all untouched — the fix is to the
    DATA the guard reads, never to the guard.
    **The controller-facing recovery line names them too.** `_land_abort_suffix` renders the ONE inline
    surface a controller reads for a pending abort and named only the failing TEST(S), though the row has
    carried `failing_assertions` since — so it said which FILE failed and never WHAT. It now names
    the assertion(s) as well, bounded (first 3, de-duplicated, clipped count STATED).
    **An OVER-BUDGET line in the ELIDED SPAN is QUOTED, never reported as no assertion at all (the reader half left undone).** When the elided span holds failure lines but NONE fits the
    rescue budget, `_verify_failure_excerpt` records the first one's clipped HEAD inside its `[......]`
    marker. That placement is deliberate and is NOT relaxed — marker recognition does not widen and the
    hint is still not a rescued line — but the extractor now READS THAT RECORD BACK (rule 2d) and returns
    the head as the entry's failing assertion. The distinction from the honest silence above is EVIDENCE,
    not preference: rule 3's silence is correct when nothing in the tail names a failure, whereas here the
    producer MATCHED a failure line and refused it for LENGTH alone, so `(no assertion captured)` is a
    claim it holds evidence against. Measured: the land was parked ~3h on a false "order/state
    interaction" diagnosis while `AssertionError: expected 36 concern born blocks, got 37` sat printed one
    line below the mute headline (fingerprint
    pinned-failure-record-elides-assertion-under-budget-misreads-as-no-assertion-captured). The head is
    returned as the producer clipped it — no second clip, no ranking by content — and the elided-span note
    STAYS in the tail as provenance, so a reader still learns how many lines were found and that none was
    quoted in full. This moves the entry from C2 to a NAMED, bindable identity; no verdict, gate, kind or
    waive vocabulary changes.
    **RECOVERY HINT — the born-concern INVENTORY shape is an ORDINARY `broken` re-baseline.** A branch
    that ADDS a concern to the registry supersedes the pinned copies of the tests that assert the
    inventory: `tests/test_t10038_born_generation.py`, `tests/test_t10175_concern_active_only.py`,
    `tests/test_t10041_concern_multiblock.py` and `tests/test_born_defaults_surface4.py`. Their pinned
    failure is the superseded old-behaviour assertion the change obsoletes — the ordinary §3a case — so
    the kind is `broken`, not `unrunnable-here` and not `environmental`, and nothing about the shape
    makes it special. **The bindable token is WHAT THE ABORT PRINTS, pasted as printed**: take it off
    `land`'s own recovery line rather than composing one from the file list here — some of these files
    surface a per-node identity and their token therefore carries a `::<node>` suffix, and a
    hand-composed bare file token is refused BY DESIGN for an assertion-bearing failure. The A-prime
    AUTHORITY is unchanged by this hint: naming the shape does not pre-authorize the waive.
  - **The printed recovery text yields to SPEC-0121, never the reverse (X-0658 — message-only).**
    The abort's `--rebaseline` RECOVERY hint read as an UNCONDITIONAL self-serve step, so a Worker standing
    under SPEC-0121's `default-under-uncertainty = STOP` saw the print tell it that the escalation the
    default compels was unnecessary. The DEFAULT is the correct side; the TEXT was wrong. The hint now
    names the A-prime AUTHORITY (owner ack, or the option-(B) self-clear under ALL of its conditions incl.
    the mechanical tie) AND states that escalating (`blocked-on-land`, worktree intact) is the CORRECT
    outcome when the tie cannot be made. No gate, flag, or abort-class changes — SPEC-0077 remains the
    canonical authority home and SPEC-0121 keeps only its route here.

  **Additive engine-LAYOUT carve-out ( — NOT a check-relaxation).** The pinned re-run overlays the
  last-green `tests/` over the candidate tree (§1). Those OLD tests carry deployment-shape FIXTURES (helpers
  that COPY the engine to simulate a deployment) coupled to the OLD layout. A purely-ADDITIVE engine-layout
  change — a NEW required module under `bin/` the candidate's own (green) verify already covers (the
  incident: extract `bin/lib/state.py`, CLI 1-file → file+lib) — makes the STALE last-green fixture fail with
  `No module named '<new-module>'`, because it cannot provision a module that did not exist when it was
  written. That is a fixture LAYOUT-MISMATCH, NOT a check-relaxation, so it MUST NOT force an
  emergency-bypass. The pinned re-run EXCUSES such a failure iff the excuse is DIRECTIONAL + ALL-OR-NOTHING:
  EVERY pinned failure's TERMINAL exception line is EXACTLY `ModuleNotFoundError: No module named '<X>'`
  (exact-shape, NOT a loose mention of the phrase anywhere in the failure text — a non-import failure that
  merely contains it is not excused) AND every `<X>` resolves to a module the candidate ADDS under `bin/`
  (present at HEAD, ABSENT at merged_base). The instant ANY pinned failure is a non-import
  failure (an ASSERTION — a genuine check-relaxation manifests here) OR names a REMOVED/renamed/non-bin
  surface (a deletion-weakening), nothing is excused and the land ABORTS as before. This preserves the §3
  circular-trust guard intact (reliability-first): a verifier-WEAKENING never presents only as
  `No module named '<candidate-added-bin-module>'`. The excusal is NEVER silent — it records
  `land_completed.pinned_layout_excused: [<modules>]` (§Verification) + an operator stdout note. It is NOT
  surfaced as a `deviation_captured`: an excusal is EXPECTED behaviour, not a friction (so the friction
  stream stays signal); recurrence is queried via `grep pinned_layout_excused events.jsonl`.

  ### 3b. A WALL-CLOCK TIMING INSTRUMENT IS NOT PINNED
  A pinned check may assert anything EXCEPT elapsed WALL TIME. An assertion whose SUBJECT is a
  wall-clock reading — "this took under N ms", "arm A separated from arm B by more than N ms" — does
  not belong on the per-land pinned path, and is not put there.

  The reason is a property of the path, not of any one instrument: the pinned path (§3) runs the
  verify TWICE, inside a parallel suite, on a host shared with concurrent lands. A wall-clock reading
  taken in that environment measures the HOST at that moment together with the subject, and the host
  term is not bounded by anything the branch controls. So the reading is not a loose measurement of
  the right quantity; it is a measurement of a different one. A branch that touches neither the
  instrument nor the code it guards can be REFUSED by it, and widening the bound does not repair that
  — it keeps the same load-coupled quantity and buys quiet by going blind (SPEC-0165).

  **THE INSTRUMENT IS SPLIT, NEVER REMOVED.** Every assertion of the instrument that is CLOCK-FREE —
  report parsing, structural shape, a registry naming its own subjects, a synthetic bite-proof whose
  verdict does not read a clock, a CPU-time or other load-invariant statistic — STAYS PINNED and is
  unchanged by this rule. What moves is the wall-clock leg alone, and it moves to a place where the
  reading can be taken honestly: the SPEC-0105 quiet lane, which runs registered timing instruments
  SERIALIZED with no concurrent verify and records each reading rather than gating on it. So the
  coverage the pinned path keeps is the coverage a pinned path can actually deliver, and the timing
  question is still asked — nightly, on a quiet host, with the answer recorded.

  **A REGRESSION IN A MOVED LEG IS A DEBT LINE, NOT A GATE.** Nothing about this rule converts a
  slow reading into a land refusal by another route. The lane reports; the reader decides.

  **ORDER (the de-pin is never the first commit).** A wall-clock leg is DE-PINNED only after its
  quiet-lane replacement has produced readings in PARALLEL with the still-pinned leg, and those
  readings are recorded on the card that de-pins it. Registering the instrument and removing the
  pinned assertion in one step would leave a window in which neither surface is watching, which is
  the one outcome this rule must not produce.

  ### 4. Scope guard (the negative contract)
  The pinned re-run fires ONLY for verify-path-touching diffs; a normal source/doc land is verified
  once, as today — no scope creep into a blanket double-verify gate.

  ### 5. Bootstrap cutover — the trusted starting base (forward-looking, probe-shaped)
  The rule is forward-looking. The activating land (which INTRODUCES the mode — itself a
  verify-implementation-touch) is NOT self-affirming: its pinned source is the PRE-MODE `main` verifier,
  which already carries every existing real check (it merely lacks the new pinned-re-run feature), so the
  old verifier still gates the activating change. The one-time bootstrap exception is explicit +
  probe-shaped: (i) verify the activating land with the pre-mode `main` verifier; (ii) an owner-authorized
  adoption probe — the deliberately-weakened-verifier test must FAIL that pre-mode verifier on the
  activating tree (the gate works from land #1); (iii) record the bootstrap evidence on an EXISTING
  carrier — the activating task's closure adoption-probe evidence (the journaled probe-(ii) run-ref: the
  pre-mode `main` verifier FAILS a deliberately-weakened activating tree), together with that land's
  standard `land_completed.verify_mode=pinned+candidate` field — NOT a new standalone note / store / tag
  (CHARTER §P1 F3 — git + the existing closure/event carriers already hold it; convergence target
  resolved, trial run #2). From there every subsequent `main` HEAD is trusted by the pinned+candidate
  gate (self-reinforcing forward). EXPLICITLY out of scope (the accepted-baseline class, §2): a verifier already weakened on `main`
  BEFORE the mode existed, OR a verifier change landed via an owner-authorized emergency-bypass (CHARTER
  §P2, `--no-tests`) — the rule cannot retroactively detect a pre-mode compromise or re-judge an
  owner-accepted bypass, and does not claim to. Both are owner-confirmed baselines (the bypass is surfaced +
  retro'd), not silent gaps.

  ### 6. Consumer surfaces (no hidden second mode)
  The pinned source is ALWAYS the committed `main` HEAD verify-path of the checkout being landed, under
  that checkout's `REPO_ROOT`: (a) engine self-build → the engine's own `main` HEAD verify-path; (b) a
  `-C` consumer land → the consumer's OWN `main` HEAD verify inputs, while the ENGINE binary running its
  `-C` verify is the consumer's PINNED engine version (a fixed, already-trusted reference the consumer
  does not edit per-land — kernel is pinned, not consumer-mutable); (c) a pre-extraction / kernel-provided
  consumer runs engine-resolved content it does not edit, so nothing consumer-side is
  pinned beyond the engine's already-pinned version. One rule, surfaces named.

  ## Rationale

  A self-modifying engine has a circular-trust gap: the same CLI/graph-build code being changed is
  also the code that decides whether the land is valid, so a wrong-but-passing verifier change can
  silently weaken the chokepoint. V2 dispatches autonomous workers that edit `bin/yitc-v2` + the
  graph-build, and real `-C` consumers arrive next — each consumer's `-C land` verifies its own code
  with its own (possibly-just-changed) verifier, the SAME risk at the project level. Source: the
  external consult `decisions/kernel-protection-recovery-set-audit-adhoc.yaml` (finding 2, HIGH,
  4-filter-passed). Classic bootstrap / verifier self-hosting risk (incident count zero;
  prior-art-grounded). EXTENDS the existing `land` chokepoint + the SPEC-0064/SPEC-0065
  re-verify machinery; adds no new subsystem.

  ## Verification

  - **observed:** a deliberately-weakened verifier change FAILS the pinned (last-green) verify even
    though it would pass its own candidate verify — on BOTH an engine land and a `-C` consumer land.
  - **observed (one authoritative adoption signal):** `land_completed.verify_mode` (registered in the
    events.jsonl schema home **SPEC-0025** — the new field is added there, not silently — plan-check MEDIUM) is the SOLE
    authoritative adoption signal — a NEW FIELD on the EXISTING `land_completed` event (not a new event):
    `verify_mode=pinned+candidate` on a verify-implementation-touch land, `verify_mode=candidate` on any
    other land (the negative probe — proves no blanket-gate scope creep). A terminal stdout marker MAY
    accompany it but is operator-facing CONVENIENCE only, never a second source of truth (Single-SoT).
  - **observed (additive-layout carve-out):** a purely-ADDITIVE engine-layout change (a new
    required `bin/` module the candidate's own verify covers) whose STALE last-green fixture fails with
    `No module named '<new-module>'` LANDS WITHOUT an emergency-bypass — `land_completed.pinned_layout_excused`
    lists the excused module(s) (never silent) + an operator stdout note. `pinned_layout_excused` is an
    ADDITIVE land_completed key (registered in **SPEC-0025**), PRESENT ONLY on an excused land. (No
    `deviation_captured` — an excusal is expected behaviour, not a friction.)
  - **observed (waive KIND):** two re-baseline lands granted with the SAME reason prose but
    DIFFERENT `--rebaseline-kind` values record DISTINGUISHABLE evidence — their `land_completed` rows
    differ on `rebaseline_kind` (`broken` vs `unrunnable-here` vs `environmental`), and with that key
    suppressed they are indistinguishable, which IS the defect X-0739 reported. A `--rebaseline` with
    NO kind is REFUSED (`abort_class=rebaseline-unauthorized`) and the refusal NAMES every kind —
    never defaulted. A row recorded before carries no kind and is unchanged: nothing
    backfills it.
  - **observed (the `environmental` binding):** an `environmental` grant records, per token,
    `land_completed.waive_binding{mode: prior-abort, locator, isolated, full_run}` — so the grant is
    reconstructible from the journal alone (WHICH recorded abort it bound to, that the file passed
    ISOLATED, and what the FULL run said about the file it still ran). Differential: with the
    `waive_binding` key suppressed, an environmental grant is indistinguishable from a `broken` one
    that happened to declare a different label, which is the whole thing this value exists to separate.
  - **failure-threshold (waive KIND, as amended):** a kindless `--rebaseline` LANDS
    (silently defaulted); OR `broken` / `unrunnable-here` change ANY eligibility outcome — who may
    authorize, the reason-length gate, the current-state audit requirement, or which pinned assertions
    the `--rebaseline-waive` declaration covers (those two ARE labels, so an eligibility difference
    between them, or between either and the pre- kindless grant, is a widened gate); OR
    `environmental` widens anything BEYOND its declared two-part binding — it changes who may
    authorize, or waives an assertion no declaration NAMES, or binds with only ONE conjunct proven, or
    clears a sibling token when a named file FAILED isolated (the all-or-nothing rule), or causes the
    waived file to be SKIPPED in the full verify, or grants without recording `waive_binding`; OR an
    existing kindless row is re-keyed; OR the record is claimed to make an unrunnable verify runnable
    (reachability is UNSOLVED).
  - **failure-threshold:** the pinned verify fires on a NON-verify-path land (scope creep); OR it is
    engine-only (consumer lands not covered); OR it adds a new gate cascade / ledger / FSM; OR the
    additive-layout carve-out excuses a NON-import (assertion) failure or an import error for a
    REMOVED/renamed/non-`bin/` module (a genuine check-relaxation self-approving — the carve-out is NOT
    directional + all-or-nothing).

