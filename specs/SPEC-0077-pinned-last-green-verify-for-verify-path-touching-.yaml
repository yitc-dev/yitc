  \ as\nit would any runner change. Nothing here moves the verdict gate, the A-prime\
  \ authority, or either\nconjunct below: a file is still cleared only by PASSING\
  \ alone, which is the same fact part (i)\nhas always required.\n**THE SERIALIZED\
  \ TAIL IS PART OF THE LEG'S VERDICT.** A file listed in the committed\n`tests/load-sensitive.txt`\
  \ runs AFTER the leg's concurrent pool, alone, on both legs, and its pass\nor fail\
  \ decides that leg exactly as a pool result does — the declared set moves WHERE\
  \ a file runs,\nnever WHETHER it counts, so neither conjunct above is weakened by\
  \ it.\n**THE `environmental` TWO-PART BINDING — fail-closed on EACH part.** Under\
  \ this kind,\n  and ONLY under it, a `--rebaseline-waive` token binds when BOTH\
  \ hold:\n  (i) the ISOLATED preflight run of EVERY named-and-runnable file PASSES,\
  \ AND (ii) the token's key\n  is named in the `failing_assertions` of THIS branch's\
