                declaration, optionally together with the same closure's `proposed → active` flip, and
                nothing else. This shape exists because closure does not only WRITE its side-effects — when
                the spec it just activated carries no valid `binding:` token, `task close` PRINTS a
                `spec edit` remedy plus a pre-land `work commit` route and calls that manual edit "part of
                the ACCEPTED closure contract". Refusing it here meant two governed rules issuing OPPOSITE
                instructions for one sequence, exitable only by a full re-audit for a residency token that
                changes no behaviour. Confinement is checked TWICE, independently, and BOTH must hold:
                TEXTUALLY (delete the `binding:` block and the `status:` line from each blob; the remainder
                must be byte-identical line for line) and SEMANTICALLY (parsed as YAML, the differing keys
                are a subset of {binding, status} and CONTAIN `binding`; a differing `status` must be
                exactly proposed→active — narrower than the vocabulary above, because a binding token is
                prescribed only for the spec the close ACTIVATED, never for a `supersedes:` target).
