body: |
  ## Scenario

  When a session lands a change whose diff touches the **verify-path of the checkout being landed**
  (its own `bin/yitc-v2`, its graph-build inputs, or the test-runner the verify invokes), `land`
  verifies the change with the checkout's **last-green `main` verifier** — the pre-change verifier —
  IN ADDITION to the candidate (just-changed) verifier, and integrates ONLY if BOTH pass. So a
  verifier-weakening change cannot self-approve: the old verifier still applies its checks to the new
  tree. A land whose diff does NOT touch the verify-path is unaffected (verified once, by the
  candidate, as today). This holds REPO_ROOT-relative, so it protects the engine's own lands and
  every `-C` consumer's own lands by the same code path.

  ## Internal

  THE PINNED LAST-GREEN VERIFY RULE. A standing contract on the `land` verify step.

  **WHETHER this leg runs at all is additionally gated, per project, by SPEC-0186** (the
  `verify_policy.pinned_last_green` declaration in a project's `yitc-ops.yaml`: `all` — the default and
  the born state — or `never`). This spec remains the ONE normative home for WHEN the leg fires (the
  trigger predicate below) and WHAT it does; SPEC-0186 governs only the per-project ON/OFF gate in front
  of it, is read PRE-MERGE from the base tree, and cannot reach the engine (a kernel invariant — the
  engine has no `yitc-ops.yaml`). Navigational pointer, not a second rule (SPEC-0005 rule 8).

  **WHICH tests this leg pins is additionally NARROWED, per project, by what that project DECLARES
  (`tests.classes[].timing_lane` in its `yitc-ops.yaml`).** The narrowing is DECLARED data — the
  project names the test files whose verdict is a function of wall clock — never a kernel judgement
  about a named file. Its ONE home is SPEC-0160 rule 10 (`bin/yitc-v2 graph query SPEC-0160`), which
  owns that rule in full; none of its rule-text is restated here — read it there. Read beside the
  SPEC-0186 pointer above, the pair answers two different
  questions about this leg: SPEC-0186 gates WHETHER it runs, SPEC-0160 rule 10 narrows WHICH tests it
  pins. Navigational pointer, not a second rule (SPEC-0005 rule 8).

  ### 1. Trigger — `verify-implementation-touch` (NARROW; NOT the observable classifier)
  The pinned re-run fires on a precise predicate: the diff touches the VERIFIER'S OWN executable
  surfaces — the verify code path in `bin/yitc-v2`, the graph-build script, and the test files/runner
  the verify executes — evaluated relative to the current `REPO_ROOT`. This is DISTINCT from SPEC-0064's
  inert/observable classifier, which answers "could this diff change the verify RESULT at all" (true for
  `specs/`, `patterns/`, ordinary product source). `observable-to-verify` and `touches-the-verifier` are
  NOT synonyms: a `specs/`-only or product-source land is observable but does NOT change the verifier, so
  the circular-trust risk does not apply and the pinned re-run MUST NOT fire there. This spec §1 + the
  `land` code are the ONE canonical home of the predicate; the classifier's file-class knowledge may be a
  building block but is not the trigger. Consumer-aware by construction — the same narrow predicate runs
  against each checkout's own `REPO_ROOT`.
  **File-membership source-of-truth (ONE code constant + helper, PLUS the project's own declaration) —**
  the predicate's STATIC file set is owned by a single module-level constant + helper in `bin/yitc-v2`:
  `_VERIFY_IMPLEMENTATION_GLOBS` (the verify-path globs) consumed by
  `_is_verify_implementation_touch(changed_files)`. This prose POINTS at that constant and MUST NOT
  duplicate the file list (SPEC-0005 rule 3 content-boundary) — the list lives in code so it cannot drift
  between spec and `land` (convergence target resolved, trial run #2).
  **AMENDED (X-0938) — a constant alone CANNOT satisfy the coverage obligation below, because
  where a project's checks LIVE is a property of that project, not of the kernel.** The static globs are
  ROOT-LEVEL ones (named conceptually here — the pattern list stays code-only), so for a consumer whose checks sit elsewhere — bc-community declares
  `verify.layers[backend].command: bash backend/scripts/verify.sh` with its tests at `backend/tests/` —
  neutering a check matched NOTHING and the pinned leg never armed, while §3's overlay likewise pinned no
  old check: the leg RAN and REPORTED `verify_mode=pinned+candidate` while applying the candidate's own
  checks to the candidate's own tree (a false green, not a coverage gap). So the file set is the constant
  UNION the check surfaces resolved from the project's OWN `verify.layers` DECLARATION
  (`_declared_check_surface_globs` / `_pinned_declared_check_paths`, SPEC-0152 rule 16). The constant
  stays the single home of the KERNEL's static list — this adds a second SOURCE, not a second list, and
  the declaration is authored by the project, never duplicated here.
  **The two surfaces read the carrier with OPPOSITE bias, deliberately.** The TRIGGER unions BOTH
  carriers (last-green and candidate) and fails OPEN toward arming: it asks whether a diff COULD touch a
  check surface. The §3 OVERLAY reads the LAST-GREEN carrier ONLY and fails CLOSED: it asks WHICH checks
  apply, and reading the candidate's carrier would let the same commit that weakens a check also choose
  its own audit. Resolution is biased to UNDER-inclusion (a root-level command operand is skipped — it is
  as likely to be the SUBJECT as a check) and is NEVER SILENT: `land` names the overlaid surfaces, and
  names any declared layer for which none resolved, so a PARTIAL pin is auditable rather than read as
  protection.
  **Coverage obligation (closes the omitted-surface loophole — plan-check MEDIUM, run-accept):** the
  constant MUST cover the verifier's ENTIRE OWN executable/config surface — not only the three named
  examples (`bin/yitc-v2`, the graph-build script, the test files/runner) but EVERY executable or config
  input the verify path actually reads to reach its verdict (an indirect helper module, a verify config
  file, a runner the harness shells out to). An input the verify consumes but the helper OMITS is a
  self-approval hole. So a CONFIG/HELPER-ONLY change to the verify path IS verify-implementation-touch and
  DOES fire the pinned re-run (realization probe: a verifier-weakening confined to a config/helper surface
  still FAILS the pinned verify). Adding a NEW verify input obliges adding it to the constant in the SAME change.

  ### 2. The pinned source — committed `main` HEAD, "last-green" by the land invariant
  The pinned (pre-change) verifier is the verifier at the checkout's CURRENT committed `main` basis,
  RE-EVALUATED ON EACH land attempt AFTER `land`'s update-from-main step — NOT the stale `main` the
  worktree first branched from, and NOT a new pinned-bootstrap store/cache/tag. **Retry / concurrency
  (plan-check MEDIUM, run-accept):** because `land` updates-from-main before it verifies, the pinned basis
  on a retry is the freshly-merged `main` tip — a newer already-green verifier landed by a concurrent
  session is therefore ALWAYS the basis; the rule never pins to an older `main` than the one being merged into.
  Its greenness is the EXISTING `land` invariant: a NORMAL `land` advances `main` ONLY after running the
  verify BEFORE its ff-only merge, so by construction every NORMALLY-landed `main` HEAD already passed a
  land verify. There is therefore NO separate `green` flag/state to track and NO new carrier — git already
  holds `main` (CHARTER §P1 F3). **The holes, named — the ACCEPTED-BASELINE class (plan-check HIGH,
  run-accept; second member added by).** The qualifier **NORMALLY-landed** is load-bearing: it is
  exactly TWO cases where `main` advances WITHOUT a full verify. Both are the same **accepted-baseline
  class** as the §5 carve-out (an owner-confirmed or born-by-construction baseline — surfaced, never a
  silent gap), and NEITHER is handled by a new green-tracking store:
  - **(a) The owner-authorized emergency-bypass** (CHARTER §P2 — `--no-tests` / the `emergency:` marker),
    surfaced + retro'd by construction (code-enforced by the §2a owner-gate). An emergency-bypass land of
    the VERIFY-PATH is the case where the pinned source could carry an unverified verifier — handled NOT
    by a new store but by the EXISTING bypass accountability.
  - **(b) The CONSUMER-BOOTSTRAP commit**. A NEWBORN consumer's `main` HEAD was never
    landed at all: it is `bin/yitc-v2 -C <path> init`'s sanctioned **direct-to-`main` bootstrap commit**
    (the AGENTS-SESSIONS §Writes-happen-in-a-worktree EXCEPTION — a fresh consumer cannot `land` until
    `init` delivers its verify contract, a chicken-and-egg the worktree→land path cannot resolve), so by
    construction it NEVER ran a land verify. Therefore a newborn's FIRST pinned basis is the **born
    (init-authored) verify config** — last-**COMMITTED**, not last-**VERIFIED**. What makes this an
    ACCEPTED baseline rather than a gap is ****: `init` seeds the COVERING `verify.layers` into the
    born carrier at the birth seam (fail-closed — any doubt seeds nothing), so the born config is a
    **WORKING verifier BY CONSTRUCTION**, and the consumer's first land is fully gated by a verify that
    tells the truth about its tests. The baseline then self-heals forward on the very next land (§5's
    self-reinforcing property): once ANY normal land advances that `main`, the invariant above governs.
  So the "last-green" property holds for every NORMALLY-landed `main`; for a newborn's bootstrap HEAD (b) it
  is "born-green by construction" rather than "verified-green by a land" — an honest distinction, not an
  equivalence. The rule does NOT derive a separate last-verify-green pointer for EITHER case
  (anti-complexity — git + the §P2 bypass record + `init`'s own bootstrap commit already carry it); neither
  member adds a green-tracking store, flag, or tag, and neither grants any new bypass or permission.

  ### 2a. The owner-gate REALIZING §2's "surfaced + retro'd by construction" (in-place additive)
  §2 above ASSUMES the one hole — the `--no-tests` emergency-bypass — is "surfaced + retro'd by
  construction." F-024 found it was NOT: `land --no-tests` was a FREE, unsurfaced agent self-clear of the
  tests-green gate. makes the assumption TRUE by code-enforcing the owner-gate (the mechanism §2
  already relied on; this clause REALIZES it, it adds no new rule):
  - **Two distinct REQUIRED signals (the CHARTER §P2 emergency-marker model).** `land --no-tests` is
    REFUSED (exit nonzero, `main` untouched, `abort_class=no-tests-unauthorized`) unless BOTH are given:
    (i) `--owner-authorized` — the explicit, deliberate "the owner sanctioned skipping tests" marker
    (the analog of the `emergency:` marker / `--ack-repeated-abort`); AND (ii) `--no-tests-reason
    "<text>"` — a recorded justification of `>=_NO_TESTS_MIN_REASON_CHARS` (30) chars, mirroring the
    emergency marker's `>=30 char` description. The marker is SEPARATE from the reason so authorization is
    a distinct deliberate act, not a single self-asserted field.
  - **Surfaced + frequency-auditable (the accountability, not a crypto gate).** An authorized skip is
    RECORDED on the EXISTING `land_completed` event as additive keys `no_tests: true`,
    `owner_authorized: <bool>`, `no_tests_reason: <text>` (registered in SPEC-0025; no new event type).
    So every test-skip is loud, owner-attributed, and queryable — `grep no_tests events.jsonl` is the
    >1/30d frequency audit (CHARTER §P2). **Honest bound:** a single-owner+AI CLI cannot
    cryptographically distinguish owner from agent — "no agent self-clear" means no SILENT/implicit skip,
    exactly the emergency-marker accountability model, NOT an unfakeable token.
  - **Product-code WARN, NOT a hard refuse (coherence with §3).** When an AUTHORIZED `--no-tests` land's
    final merged-tree delta TOUCHES TESTED PRODUCT CODE (the SPEC-0064 `observable` verdict, consumed —
    never re-encoded; classifier-raise → fail-closed observable), `land` prints a LOUD WARN naming the
    offending class + the graceful re-baseline route — then PROCEEDS. It is NOT a refuse: §3 RELIES on the
    owner-authorized `--no-tests` bypass being AVAILABLE for a legitimate verifier-relaxation land (which
    is ALWAYS a product-code delta), so a hard product-code refuse would deadlock every relaxation — incl.
    the activating land of itself (its own old last-green `--no-tests` tests encode the pre-gate
    FREE behaviour and trip the pinned re-run; F-026). The graceful re-baseline that replaces the blunt
    bypass for an AUDITED behaviour change is a separate follow-up.

  ### 3. Semantics — IN-ADDITION, both-must-pass
  For a verify-path-touching land, run the verify TWICE over the candidate tree: once with the
  candidate (new) verifier — so any LEGITIMATE new/stronger checks the change introduces still
  execute — and once with the pinned `main` verifier. The land integrates ONLY if BOTH are green.
  **The pinned set is last-green's tests EXACTLY — a test absent at the last-green ref is not a pinned
  check.** The overlay RESTORES last-green's files but deletes none, so a test the candidate
  ADDED survives into the pinned tree and runs there against last-green's helpers; it is by definition
  not an old check, and what it produces is an ImportError, not a verdict. BOTH drivers therefore
  exclude it — the local one by pruning candidate-added paths, the routed one by skipping
  them at discovery off the request's own last-green ref listing — and neither uses a manifest: the
  ref's own tree IS the manifest. The narrowing is REPORTED, never silent (each excluded file is named
  in `land_completed.data.verify_metrics.pinned_excluded_not_pinned`), it is FAIL-SAFE (an underivable
  set excludes nothing, so it can only ever run MORE tests), and the CANDIDATE leg is untouched — a
  branch-only test still runs there in full. A pinned test that EXISTS at last-green and fails refuses
  exactly as before; the `unrunnable-here` rebaseline round for a branch-only test simply becomes
  unreachable.
  **TWO FURTHER EXCLUSIONS, computed at verify time from durable state, never from a hand list
.** (i) A test file whose LAST-GREEN copy DECLARES itself census/inventory-class — one
  opt-in marker line, `# yitc: pinned-leg: census`, carried in the file — is not a pinned check. A
  census asserts «every enumerated member carries a disposition», so ANY change that ADDS a member
  fails the last-green copy BY DEFINITION rather than as a regression signal. The declaration is read
  from the LAST-GREEN tree, never the candidate's, for the same self-approval reason §3 reads every
  other pinned input there: otherwise the commit that weakens a check could also declare it exempt.
  It is OPT-IN and never inferred — an UNMARKED census stays pinned exactly as before, and
  `graph conformance` gains no check to hunt for unmarked ones. (ii) A test file THIS branch's own
  diff TOUCHED is not re-pinned — PROVIDED its candidate copy is not a WEAKENING of the last-green
  one: the last-green copy would otherwise be asserting the behaviour the card deliberately
, while the CANDIDATE leg runs the NEW copy in full on that same land. This half is read
  from the candidate DIFF, which is not a declaration but the fact itself and lives nowhere else.
  The WEAKENING GUARD is what keeps this exclusion from swallowing §3's own self-approval fence: a
  candidate that NEUTERS or DELETES a registered check has, by that act, «touched» it, so an
  unconditional touched-exclusion would let the commit that removes a check's teeth also remove the
  last-green copy that would have bitten it. The exclusion therefore applies only when the candidate
  copy still EXISTS on the branch AND carries no fewer `def test_` nodes and no fewer `assert`
  statements than the last-green copy — two counts over two text blobs, with any read failure leaving
  the file PINNED (fail-SAFE). A weakened or removed touched file STAYS PINNED. The guard is
  deliberately MECHANICAL, not semantic: a rewrite that holds both counts while weakening what they
  assert still narrows, and that shape is caught where it always was — audit-post's diff review,
  which reads the edit directly, not a pin whose signal there is indistinguishable from the intended
  change.
  **BOTH DRIVERS APPLY THESE TWO EXCLUSIONS, and on the ROUTED one the HOST is the SINGLE COMPUTER
.** The sentence above already holds for the exclusion; it now holds for these two
  as well, and the routed shape is deliberately DIFFERENT from that sibling's. is derivable
  box-side from the request's own last-green ref listing, so the routed driver computes it there. These
  two are NOT: the census marker must be read from the LAST-GREEN copy of each swept file and the
  touched fact from the candidate DIFF, and the REASON each file was skipped (`census` | `touched`)
  has no box-side source at all. So the HOST computes the selection — the same
  `pinned_leg_narrowing` the local driver calls, so there is exactly ONE computer and the two
  drivers cannot drift — and SHIPS the names to the leg, which only APPLIES them, bound to the PINNED
  leg box-side rather than trusted of the caller (the mirror of the SPEC-0181 R1 selection bound). The
  reported skip is assembled from BOTH ends: the APPLIED set from the leg, which alone knows what it
  was going to run, and the reason from the host's own record — so the row and the log can never
  describe two different narrowings. A shipped list that is absent, unreadable or malformed skips
  NOTHING (the leg runs whole), the same fail-safe direction the local driver's inputs carry. Grounds:
  the two exclusions were computed NOWHERE on a routed land before this — the local driver that owned
  them is never called there — so every venue land re-ran the stale pinned copy and paid a full
  rebaseline round, 13 of them measured on 2026-09-10, the exact cost exists to remove.
  Both exclusions are REPORTED, never silent — each skipped file is named with its reason
  (`census` | `touched`) in `land_completed.data.verify_metrics.pinned_skipped` and printed as its own
  `land[pinned/last-green]:` line — both are FAIL-SAFE (an unreadable file or an underivable diff
  excludes nothing, so the leg can only ever run MORE), both are DROPPED entirely rather than applied
  when they would empty the selection (an empty selection reads GREEN, which would silently disable
  this leg), the CANDIDATE leg is untouched, and `--rebaseline` semantics are unchanged for everything
  still pinned. Measured basis: over the journal segment 2026-09-02..09-09 (814 `land_completed` rows,
  folded 2026-09-09) 95 of 208 verify aborts were pinned-only, and 73 of those branches later landed
  via `--rebaseline --rebaseline-kind broken` — the pin was stale by construction.
  Reliability-first: the old verifier's checks cannot be silently removed by the same commit. A land
  that LEGITIMATELY relaxes a check (the pinned verifier then fails on purpose) is handled by the
  EXISTING owner-authorized emergency-bypass (CHARTER §Principle 2), surfaced explicitly — NOT a new
  override mechanism, gate cascade, ledger, or FSM. Whether intentional relaxation needs a STANDING
  governed path beyond emergency-bypass is a TRIAL-resolved disposition, not pre-committed: if legit
  relaxations run ≤1/30d (the emergency-bypass frequency threshold) emergency-bypass suffices (no
  incident → no mechanism, §P1 F4); a higher observed rate is the incident that pulls a distinct
  governed `verify-relax` disposition. Decided at trial exit.

  **Isolation mechanism — the pinned verifier runs SUBPROCESS-ISOLATED against a MATERIALIZED merged_base
  bin/ tree.** "Run the pinned `main` verifier" must run the merged_base verifier LOGIC + RUNNER,
  not the candidate's. The runner now lives in the layered bin/lib package, so an IN-PROCESS load of
  the merged_base engine is INSUFFICIENT: its `from lib import...` resolves from the live process's
  `sys.modules` cache (the land already imported the candidate `lib.*`), silently running the LIVE
  (possibly weakened) runner in both passes — defeating §3 for verify-path code resident in the bin/lib
  package. In-process isolation is impossible (the live land process is itself using `lib.*`). So `land`
  MATERIALIZES the merged_base engine tree (the engine binary + its bin/lib package) to a temp dir and runs
  the pinned runner in a SUBPROCESS (fresh interpreter → clean `sys.modules` → merged_base `lib.*`). The
  bad-list returns over a dedicated result FILE (not stdout — the runner + its test subprocesses write to
  stdout/stderr freely). FAIL-CLOSED: a subprocess / result-parse failure is a pinned-verify failure, never
  a silent skip. The §6b consumer/test-repo case (merged_base lacks the engine binary) keeps the in-process
  runner — there the engine binary is the already-pinned, consumer-immutable engine, so no isolation gap
  exists. This is a MECHANISM realization of §3's both-must-pass (the rule is unchanged); the §1
  file-membership trigger already fires for a bin/lib verify-path touch (the glob set lives only in the
  code constant, §1).

  ### 3a. The STANDING re-baseline path (in-place additive — resolves §3's deferred disposition)
  §3 deferred "whether intentional relaxation needs a STANDING governed path beyond emergency-bypass."
  The incident RESOLVED it: a deliberate, AUDITED BEHAVIOUR change is structurally common (it is
  what every spec/behaviour task does), and the only prior path — `--no-tests` (now owner-gated, §2a) —
  is too BLUNT: it skips ALL verification, not just the superseded old-behaviour check. So this spec adds
  a STANDING, NARROWER governed path: the governed **re-baseline**.
  - **Not-hygiene cross-ref.** A change that touches this pinned verify-path (or any spec /
    always-loaded seed) is by definition **fast-path INELIGIBLE — NOT hygiene** (LIFECYCLE §Two flow
    types → "Fast-path eligibility"), so it runs the substantive path and its rebaseline carries a
    fresh audit-post (the A-prime own-homework-close below). The incidental-staleness carve-out there
    is the same soft-edge this §3a governs.
  - **When it fires.** A verify-path-touching land whose **CANDIDATE verify is GREEN** (the new behaviour
    is correct by its own tests) but whose **pinned LAST-GREEN check FAILS** because the old behaviour-tests
    it overlays encode the behaviour the change deliberately revised (a real ASSERTION failure, NOT the
    §3 additive-layout `No module named` carve-out).
  - **WHEN to DECLARE it — carry the declaration into the FIRST land attempt, do not discover it
.** The bullet above says when the leg ARMS; this says when the OPERATOR acts on that.
    **Trigger:** the change's diff touches the verify path's OWN EXECUTABLE surface — the §1
    `verify-implementation-touch` set, read there and not restated here — so the pinned last-green
    leg WILL arm and WILL overlay old-behaviour assertions this change deliberately revised.
