  \ a pre-land `work commit` route and calls that manual edit \"part of\n        \
  \      the ACCEPTED closure contract\". Refusing it here meant two governed rules\
  \ issuing OPPOSITE\n              instructions for one sequence, exitable only by\
  \ a full re-audit for a residency token that\n              changes no behaviour.\
  \ Confinement is checked TWICE, independently, and BOTH must hold:\n           \
  \   TEXTUALLY (delete the `binding:` block and the `status:` line from each blob;\
  \ the remainder\n              must be byte-identical line for line) and SEMANTICALLY\
  \ (parsed as YAML, the differing keys\n              are a subset of {binding, status}\
  \ and CONTAIN `binding`; a differing `status` must be\n              exactly proposed→active\
  \ — narrower than the vocabulary above, because a binding token is\n           \
  \   prescribed only for the spec the close ACTIVATED, never for a `supersedes:`\
