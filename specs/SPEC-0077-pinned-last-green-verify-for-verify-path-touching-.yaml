  \ boundary is PRECISE (narrowing this sentence rather than deleting\n  it): admitted\
  \ is a binding declaration on a spec THIS close ACTIVATED — proven by the `spec_activated`\n\
  \  row in this task's id slot — whose whole file change is confined to the declaration\
