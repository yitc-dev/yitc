  \ a comment change outside the\n          declaration, or any failure to read or\
  \ parse either blob fails this axis.\n    (iii) GOVERNED-VERB PROVENANCE — a `spec_activated`\
  \ row (SPEC-0161) in THIS task's id slot naming\n          THIS spec. Provenance\
  \ is safer than path-only ONLY IF IT IS NOT A TRUST FLAG: it is applied\n      \
  \    LAST, as a necessary conjunct over a shape already proven mechanically. A hand-emitted\
  \ row\n          never admits a path whose shape failed (ii), and a genuine flip\
