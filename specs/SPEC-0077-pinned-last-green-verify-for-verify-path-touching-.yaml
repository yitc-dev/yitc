    the flag plus every element the requirements bullet below already demands of it — rather than
    letting the land tell you. **Cost of not doing it:** the land runs the FULL verify (minutes, plus
    any SPEC-0132 admission wait) and only THEN refuses on bookkeeping — `abort_class`
    `rebaseline-unauthorized`, on either the `authorization` or the `waive-coverage` arm — so the ship
    becomes a full-verify abort and the next attempt pays the verify again. Measured, not projected:
    in a 7-day window ending 2026-08-24 the session-start debt echo reported this as the LARGEST
    reclaimable abort class in the repo (waive-coverage 21x/327.1min, authorization 5x/55.0min, both
