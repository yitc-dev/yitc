    subtraction is LOCAL to the currency consumers, which then re-classify the REDUCED path set through
    the ONE classifier (the one-authority invariant holds). It adds NO closure mode, flag or waive
    to `land`. Its binding-token boundary is PRECISE (narrowing this sentence rather than deleting
    it): admitted is a binding declaration on a spec THIS close ACTIVATED — proven by the `spec_activated`
    row in this task's id slot — whose whole file change is confined to the declaration (plus at most that
    close's own proposed→active flip). Any OTHER binding edit still refuses: a binding change to a spec this
    close did not activate, one riding with a body/rule edit, or one carrying any other content. The point
    is not that binding tokens are harmless; it is that this exact edit is the one closure ITSELF prescribes,
    and a governed instruction must not be refused by the governed verb that follows it. And it does NOT
    touch `merge_inherited`, which still never refuses
    on its own (the position, preserved). Every other observable post-audit path — bin / tests /
    patterns / root-md, and any `specs/**` path failing (ii) or (iii) — stays observable → still REFUSED.

