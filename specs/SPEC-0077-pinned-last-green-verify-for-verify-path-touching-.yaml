    infrastructure fault is not a superseded old-behaviour check. **Two runners are KEYED, one per
    sweep (X-0634):** the kernel sweep keys on the test FILE (`test failed: <file>`), and a
    consumer that DELEGATES `tests/` to a declared verify layer (SPEC-0152 rule 16) keys on the LAYER
    NAME (`land(consumer): verify layer '<name>' FAILED (exit N): …`) — the layer name is the only
    identity that runner has, and without it EVERY pinned failure in such a consumer was UNKEYED BY
    CONSTRUCTION, so `--rebaseline-waive` (REQUIRED with `--rebaseline` since) could never
    bind and the A-prime option-(B) Worker self-clear above had no reachable path. That widening is
    over what can be KEYED, NEVER over what counts as COVERED: a keyed layer failure still needs its
    QUALIFIED `<layer>::<substring>` token, and the exact-shape parse leaves every neighbouring
    consumer-guard entry (a `prep:` fault, a layer TIMEOUT, a malformed `verify.layers[i]` contract)
    UNKEYED. One asymmetry is deliberate and belongs to the READER, not the parse: a keyed entry with
    NO captured text is a provably file-level failure for the ONE-file kernel subprocess (C2, bare
    token) but proves NOTHING for a whole layer harness, so a consumer layer entry that captured
    nothing stays UNKEYED-in-effect (C3) and refuses. FAIL-CLOSED on every axis: a token
    binding to nothing, binding ambiguously, or bare against an assertion-bearing failure is REJECTED
    (a declaration that does not bind is not an ack, never a silent no-op). Realized by
    `_rebaseline_waive_coverage` / `_pinned_failure_test_file` in `bin/lib/worktree.py`.
  **THE DECLARATION TARGET IS THE COMPLETE FAILING SET — no fail-fast on the pinned pass.**
  The per-assertion declaration above is matched ENTRY BY ENTRY and is fail-closed in BOTH directions:
  an uncovered failure refuses, and a token that binds nothing refuses as `no-match`. That is a usable
  path ONLY if the set it is declared against is the SAME set on the next attempt. The pinned test
  runner used to stop at the FIRST observed failure, so over a real multi-failure state it reported a
  run-varying SUBSET and the required declaration MOVED between attempts — a coin flip no quiescence
  settles (measured: 8 land aborts on across two sessions in one day; those same journal rows
  were first misread as on-disk CONTAMINATION of the pinned tree, a reading an external auditor
  retired — derived artifacts are GENERATED from live sources, so their presence proved nothing).
  So the pinned pass RUNS EVERY CHECK AND REPORTS EVERY FAILURE before any waive matching is applied:
  the kernel sweep asks its runner for the complete set (`fail_fast=False`), and the consumer leg
  already ran every declared layer. This is a REPORTING rule, not a gate change — the verdict stays
  pass-iff-empty, no check is skipped, reset or weakened, and SPEC-0071's per-file timeout bound +
  group-kill are UNTOUCHED (only the whole-RUN early exit is given up, and only on a FAILING pinned
  run: a green run already ran every file). **SCOPE of that sentence — it is a claim about THIS
  fail_fast reporting change, not about the leg as a whole.** "No check is skipped, reset or weakened"
  says that giving up the early exit neither drops a check from the run nor softens a verdict; it is
  NOT a claim that every test a project owns enters the pinned set in the first place. Which tests
  ENTER it is the separate, DECLARED question answered by the `timing_lane` pointer above (home:
  SPEC-0160 rule 10) — so a reader of this paragraph alone should not read it as a whole-spec
  guarantee that the pinned set is never narrowed. The CANDIDATE verify keeps its fast abort — it is judged
  as a verdict, never matched token-by-token. TRANSITIONAL BY §1's OWN DESIGN: the pinned runner on an
  engine self-land IS merged_base code, so the driver asks for the complete set only when the
  last-green runner carries the parameter (capability-probed, never blindly — an unknown kwarg would
  be a fail-closed pinned ABORT on every land), and the rule therefore takes effect from the land
  AFTER the one that ships it. Realized by `_run_pinned_verify` / `_PINNED_VERIFY_DRIVER` /
  `_run_verify_tests` in `bin/lib/worktree.py`.
  **THE SUGGESTED TOKEN IS THE BOUND TOKEN — a round-trip INVARIANT (X-0685 / X-0683 /
  X-0660).** The refusal above PASTES a ready `--rebaseline-waive` line per uncovered entry, and that
  paste is normative, not decorative: the token the refusal suggests, copied VERBATIM through a shell,
  MUST bind the entry it was suggested for. It did not — the paste was composed inline in the refusal
  while the binding rule lived in the matcher, so the two drifted, and a non-ASCII assertion (pasted
  backslash-u escaped) or a consumer verify-LAYER name containing `/` (path-mangled by the matcher)
  was rejected `no-match` by the very message that offered it. With `--rebaseline-waive` REQUIRED
  since, an operator who cannot form a binding token has NO sanctioned path at all: kupiclub,
  after 4 refused attempts on, neutralized the superseded test directly on main — the
  governance bypass this § exists to make unnecessary. So the token is built in ONE place
  (`_rebaseline_waive_suggested_token`) from the SAME entry records the matcher judges, and is quoted
  for a real shell paste (literal text; `$` and backtick escaped). **And it is STABLE ACROSS RUNS of
  the same failing state:** the qualifier is compared — on BOTH sides, and emitted already-normalized
  — as its `_waive_qualifier_key`, which collapses an ENUMERATED set of run-varying spans (ISO-8601
  timestamps, wall clocks, `0x…` handles, durations, temp paths, hex ids carrying both a letter and a
  digit, and a `-`/`_`-delimited digit run inside a word that CONTAINS a letter) to `*`. Without that,
  a Docker-wrapped verify layer whose captured tail names a per-run container pid + hash yields a
  token that cannot be written before the run and differs on every retry — X-0683, where a fully
  built, tested and audited-GREEN consumer task could not integrate at all. The normalization governs
  only HOW a qualifier is COMPARED: the C1/C2/C3 vocabulary, the mandatory qualifier for an
  assertion-bearing entry, and every fail-closed axis above are UNCHANGED, and the
  letter-bearing-word condition keeps an assertion's own numeric VALUE (`assert '200-000' ==
  '200-000-000'`) exact — a token naming a different number still does not bind.
  **THAT STABILITY IS SCOPED TO RUN-VARYING SPANS, AND A SECOND AXIS EXISTS — MAIN-VARYING VALUES
.** The normalizer above stabilizes a token against what one RUN differs from the next by.
  It deliberately does NOT touch a plain number, because the letter-bearing-word condition just named
  is what keeps an assertion's own numeric VALUE exact — and that exactness must not be traded away.
  But a pinned assertion can carry a value that is MAIN-varying rather than run-varying: a count or
  roster the CORPUS itself keeps moving (`expected 29 concern born blocks, got 30` read 29, then 30,
  then 31 within one day as concerns were added). A token minted on one `main` is then `no-match` on
  the next, and because the refusal instructs the operator to paste it VERBATIM, the refusal pastes a
  FRESH count-bearing token and re-arms the identical staleness — a re-mint-and-re-queue loop costing
  one land attempt and one queue position per turn (the measured incident: task/, whose single refusal shows both halves — three rejected count-bearing tokens
  and three fresh count-bearing suggestions).
  **The remedy is on the OFFER side, and the MATCHER IS UNCHANGED.** The waive matcher already tests
  the qualifier by SUBSTRING containment, so a digit-free span of the assertion ALREADY binds across
  the moving value; what was missing is that no sanctioned surface ever OFFERED such a span, leaving
  the volatile token as the only one an operator could paste. So every refusal composed in
  `bin/lib/rebaseline_currency.py` now pastes a SECOND, CLASS-SHAPED token BESIDE the exact one:
  `<key>::<the assertion's STABLE IDENTIFYING SPAN>` — its FIRST digit-free run of at least 2
  whitespace-delimited words and 12 characters, derived from the exact token's own output so every
  existing guard (C3 → no token, C2 → the bare key, the wrap repair, the 60-char truncation) applies
  in ONE place and cannot drift. FIRST run, not longest: the leading run is the assertion's identifying
  HEAD, whereas the longest is as likely to be its moving data TAIL.
  **THE COARSENESS FLOOR IS PART OF THE RULE, not a tuning detail**, and there is NO fallback to a
  shorter run — an entry that clears nothing is offered NO stable token at all. Without the floor the
  span for `FAIL test_ac2_...`, whose first digit-bearing word is the TEST NAME, would be the bare word
  `FAIL` — as coarse as the bare-key token this § already refuses for a C1 entry. For the same reason
  the span is NOT the exception TYPE: `<key>::AssertionError` matches EVERY assertion in that file,
  which is precisely the over-broadening the span exists to avoid (measured over the three real
   assertions, all `AssertionError:` — the type token covers all three, each span token covers
  its own and refuses both siblings).
  **BOUND — this widens only WHAT IS OFFERED.** The C1/C2/C3 vocabulary, the mandatory qualifier for
  an assertion-bearing entry, the mechanical tie required of `--rebaseline-reason`, the fresh
  GREEN/YELLOW audit-post condition, and every fail-closed axis above are UNCHANGED: it narrows which
  TEXT identifies a failure, never WHO may clear it or WHEN. Binding is guaranteed BY CONSTRUCTION
  rather than by a second matcher — the exact qualifier is a prefix of the entry key, so a stripped
  contiguous run of it is a contiguous substring of that key.
  **NAMED RESIDUAL, stated rather than papered over:** two DISTINCT numeric assertions in the SAME file
  could share an identifying head. The runner appends AT MOST ONE entry per file per run, so at most one
  can be present in the failing set a declaration is judged against; were two ever present, the
  EXISTING `ambiguous` axis refuses the token. No new fail-open path is introduced. Realized by
  `_rebaseline_waive_stable_token` / `_rebaseline_waive_paste_lines` in `bin/lib/rebaseline_currency.py`;
  the uncovered-entry scope refusal in `bin/lib/worktree.py` still composes its own exact-only line and
  is tracked as an open followup.
  - **Surfaced, never silent.** Records `land_completed.rebaselined: true` + `rebaseline_kind`
    ( — WHY, below) + `rebaseline_reason` +
    `pinned_superseded` (the waived old-behaviour assertions) + `rebaseline_waived` ( — each
    waived assertion PAIRED with the declaration that covered it, so the journal shows exactly what
    the ack bought, not only what was given up); `verify_mode=rebaselined+candidate`
    (§Verification; registered in SPEC-0025). A `--rebaseline` ack without a current-state audit is
    REFUSED (the land aborts). The blunt `--no-tests` bypass remains for the genuinely non-audited case
    (a non-task branch with NO ancestor audit covering the current source — the POST-CLOSE bullet above
    now covers the empty-delta non-task case that previously fell to `--no-tests`).
  - **The waive carries a KIND — *broken* and *unrunnable-here* stop sharing one record (X-0739, kupiclub).** Everything above records WHAT a re-baseline waived and WHO was entitled to
    it; nothing recorded **WHY**. So a check waived because its failure is REAL here and a check
    waived because it is HEALTHY BUT CANNOT RUN here landed in the identical `rebaselined: true`
    shape, and the only carrier that could separate them was `rebaseline_reason` — which this §
    itself declares to be PROSE, never load-bearing. The measured case: a consumer whose verify is a
    heavy full-stack script cannot satisfy the §3 two-leg verify AT ALL once its diff touches
    `tests/` or the verify script, so its only sanctioned recovery waives a demonstrably healthy
    check and the record then says the same thing it says about a broken one. So the AUTHORIZER
    DECLARES the kind, alongside the per-assertion declaration it already must pass:
    - `--rebaseline-kind broken` — the pinned failure is REAL in this checkout: the superseded
      old-behaviour assertion the change obsoletes (the ordinary §3a case), or a genuinely broken
      check.
    - `--rebaseline-kind unrunnable-here` — the pinned check is HEALTHY but cannot RUN in this
      checkout at all. Waiving it asserts NOTHING about whether it would pass.
    - `--rebaseline-kind environmental` ( — the THIRD value, ADDITIVE) — the pinned check is
      HEALTHY and RUNNABLE here but FAILED under the FULL-run load. The waive attributes the FULL-run
      failure to LOAD, not to the check. This is the LOAD-FLAKE case, and it is the one value that is
      not purely a label — it selects a BINDING MODE (the two-part conjunction below).
    **THE ISOLATED RE-RUN NOW HAPPENS AUTOMATICALLY, INSIDE THE FIRST ATTEMPT.** Part (i)
  below — every named file re-run alone in a single subprocess OUTSIDE the contended pool — is no
  longer reachable only by declaring a SECOND land. When a leg the CURRENT runner executes stops on
  failures and the failing set is within `YITC_VERIFY_RETRY_MAX_FILES`, the runner re-runs each
  failing file once in isolation on the SAME tree; ALL pass -> the leg RESUMES over its not-yet-run
  files and the land reaches its own verdict, ANY fails -> the abort is exactly as it was, and
  either way `land_completed.verify_metrics.flaky_retry` records what happened. `--rebaseline-kind
  environmental` is UNCHANGED and stays the remedy for what the automatic retry does not reach: an
  OVER-BOUND or TIMEOUT-CLASS failing set, and the LOCAL PINNED leg — which by this spec's own
  construction executes LAST-GREEN engine code, so it acquires the retry one green land later, as
  it would any runner change. Nothing here moves the verdict gate, the A-prime authority, or either
  conjunct below: a file is still cleared only by PASSING alone, which is the same fact part (i)
  has always required.
  **THE SERIALIZED TAIL IS PART OF THE LEG'S VERDICT.** A file listed in the committed
  `tests/load-sensitive.txt` runs AFTER the leg's concurrent pool, alone, on both legs, and its pass
  or fail decides that leg exactly as a pool result does — the declared set moves WHERE a file runs,
  never WHETHER it counts, so neither conjunct above is weakened by it.
  **THE `environmental` TWO-PART BINDING — fail-closed on EACH part.** Under this kind,
    and ONLY under it, a `--rebaseline-waive` token binds when BOTH hold:
    (i) the ISOLATED preflight run of EVERY named-and-runnable file PASSES, AND (ii) the token's key
    is named in the `failing_assertions` of THIS branch's most recent RECORDED land abort (the
    recorded full-run failure; read back through the SAME fail-closed
    `_recorded_pinned_waive_records` classifier the land backstop's admission pre-check uses, never
    a fresh string match) AND that row yields a LOCATOR. Neither part alone is evidence: (i) alone is
    just a green file, and (ii) alone is a failure with no proof it is environmental.
    **THE LOCATOR IS PART OF (ii), NOT DECORATION.** A recorded row carrying no timestamp yields no
    locator, and a grant made on it would record a `waive_binding` that cannot be traced back to the
    evidence justifying it — which is exactly the accountability this kind's record exists to
    provide. So an unlocatable row binds NOTHING and the token stays `no-match`: a locator is
    evidence, and an absent timestamp is not evidence of a row.
    **(i) IS EVALUATED FIRST AND IS ALL-OR-NOTHING.** A file that FAILS its isolated run is `broken`,
    not environmental, and it REFUTES THE KIND for the WHOLE declaration — the land is REFUSED naming
    `broken` as the honest kind, and NO sibling token is cleared either, not even one a recorded prior
    abort would otherwise have bound. A declaration is judged as a whole, so a multi-token ack can
    never smuggle a prior-abort clearance past a provably broken file. A token failing (ii) alone
    stays `no-match` and leaves its siblings unaffected — that asymmetry is deliberate: (i) refutes
    the KIND, (ii) merely fails to find evidence for ONE token. An acquisition that could not be
    ESTABLISHED clears nothing AND refuses nothing (the preflight's own fail-open rule,
    unchanged — this arm may make a refusal reachable or cheaper, never invent one from an
    unestablished fact).
    **THE WAIVED FILE IS STILL RUN, AND ITS RESULT RECORDED.** The waive moves the VERDICT gate only,
    never what runs: the full pinned verify's file set is untouched (the narrowed `only` selection
    belongs to the preflight alone). That is what keeps a flake COUNTED rather than hidden — the
    cross-branch debt echo and any de-flake card's post-ship observation both read those runs. The
    grant records `rebaseline_kind: environmental` plus, per token,
    `land_completed.waive_binding: {token, key, mode: prior-abort, locator, isolated, full_run}` —
    the locator of the recorded abort it bound to, the isolated verdict that proved the check healthy
    here, and what the full run actually said about that file. Accountability grep:
    `grep rebaseline_kind events.jsonl`, the shape the §2a `--no-tests` marker already uses.
    **It does NOT reintroduce the coin flip.** That rule requires a token not to "move between
    runs". Both conjuncts are STABLE facts about this branch — a recorded journal row that does not
    change, and an isolated verdict taken in a single subprocess OUTSIDE the contended pool. Neither
    is the re-rolled full-run outcome whose instability is the problem being solved. The
    / exact-both-directions matching for the other two kinds is UNTOUCHED.
    **REQUIRED at grant, NEVER inferred.** A `--rebaseline` with no kind is REFUSED on the EXISTING
    `rebaseline-unauthorized` abort class (no new taxonomy), and the refusal NAMES every kind and
    what each MEANS. There is deliberately no default: a defaulted kind would recreate the exact
    conflation the declaration removes, with a label on top. The vocabulary is CLOSED and
    kernel-owned — ONE code constant, `worktree_mod.REBASELINE_KINDS`, read by the flag's `choices`,
    by both required-at-grant refusals and by the record, so prose and code cannot drift (the §1
    file-membership idiom; this prose POINTS at the constant and does not duplicate it) — with
    NOT-DECLARED as the reserved state that routes to refuse
    (`lessons/carving-an-exception-into-a-fail-closed-gate` §1: a vocabulary narrower than its
    reality is how a silent default gets in).
    **THE KIND IS A LABEL, NOT A DISCRIMINATOR — it opens NOTHING. AMENDED IN SCOPE BY, and
    the amendment is stated here rather than left as a standing contradiction (CHARTER §P7).** This
    is the load-bearing negative clause, and it is UNCHANGED for the two values it was written about:
    no gate reads `broken` or `unrunnable-here`; `unrunnable-here` buys no eligibility that `broken`
    does not, and neither buys any that the pre- kindless grant did not.
    **What changes is the clause's SCOPE, not its force.** `environmental` (the third value)
    IS a discriminator: it selects a BINDING MODE, and it is the ONE value that changes what a token
    may bind to. Naming that plainly is the point — the clause forbade *reading* the old text as
    permitting such a value, and the sanctioned route for one is to AMEND, which this is.
    **The widening is real, and it is bounded — state both.** It is real: a token that today refuses
    `no-match` at the isolated preflight can now BIND. It is bounded by four things, each
    named above and none optional: the two-part fail-closed conjunction; the ALL-OR-NOTHING refutation
    that makes one isolated FAILURE refuse the whole declaration (so the value can also REFUSE where
    nothing refused before — it is not purely a relaxation); the still-runs rule, which leaves the
    verify's file set untouched so nothing is hidden; and the per-token `waive_binding` record, which
    makes every such grant reconstructible from the journal.
    **What NO kind may do, including this one — the surviving force of this clause.** WHO may
    authorize a re-baseline (the A-prime bullet), the `>=30-char` reason, the current-state audit
    requirement, the per-assertion `--rebaseline-waive` coverage requirement and every fail-closed
    axis of the C1/C2/C3 token vocabulary are UNCHANGED, and apply identically to ALL THREE values. A
    change that let a declared kind widen WHO MAY WAIVE, or that let one waive an assertion no
    declaration NAMES, remains the harm this clause exists to forbid and is not a permitted future
    reading of this §. A future value that widens the binding mode must, like this one, amend this
    clause explicitly and carry its own fail-closed conjunction — it may not arrive by reading the
    text as already permitting it.
    **NO RETRO RE-KEYING, and absence is not a value.** `rebaseline_kind` is written from the
    DECLARATION only, on the land that makes it. A row recorded before carries no kind and
    is left exactly as it was: absence means *nothing was declared*, and MUST NOT be read as
    `broken`, as `unrunnable-here`, as `environmental`, or as any default. Nothing backfills, re-keys
    or re-interprets an existing row (the shape — a fix must not reach backwards). The same
    holds one layer down for the `waive_binding` record: it is written only by the land that
    made the binding, and its ABSENCE on a row means no such binding was made — never a default mode.
    **What this does NOT do — the honest bound, carried in the rule itself.** It does NOT make an
    unrunnable verify runnable. A consumer whose diff touches `tests/` or its verify script still
    cannot satisfy the §3 two-leg verify and still needs the waiver; what changes is that the waiver
    stops being indistinguishable from *this check is broken*. Reachability is UNSOLVED and is
    recorded as unsolved (plan `give-a-healthy-but-unrunnable-consumer-verify-a-re` §Trial summary,
    four journaled cycles: no steady-state oracle can refuse a trivially-green declared verify, so a
    consumer-declared verify profile was REJECTED and nothing here touches SPEC-0152 profile fields
    or §1 leg selection). Any reading of this clause as reachability is a misreading.
  - **Diagnostic (the tail filter).** So the owner can SEE which old-behaviour assertion failed (and decide
    to re-baseline), the verify-fail abort LEADS with a `FAILING ASSERTION(S)` block extracted from the
    test-output tail (`_surface_failing_assertions`) instead of the blind last-N-chars that drowned it.
    **EVERY verify-layer SHAPE, not only a bare pytest invocation ( — X-0680/X-0687/X-0658; in-place,
    the extractor catching up to this bullet's own obligation).** This block is what the A-prime option-(B)
    MECHANICAL TIE above is defined AGAINST ("the reason names the EXACT surfaced pinned failure(s)"), so a
    block that renders log noise makes the sanctioned self-clear UNSATISFIABLE from the surfaced evidence
    even where staleness is provable by inspection — and the reachability of the whole §3a path depends on
    this rendering. The extraction therefore normalizes each tail line through pytest's failure GUTTER
    (`_degutter_verify_line`) before its scans and returns the de-guttered text: a BARE pytest run prints
    its traceback at column 0, but a SCRIPT/Docker-WRAPPED layer (SPEC-0152 rule 16 `tests/` delegation)
    renders the failure BODY in the `E ` gutter, so the pre- column-0 scans matched nothing there
    and fell through to the last-non-empty-line fallback — container/migration/teardown noise (the real
    incident: main tests pin `placeholder=200-000` while the candidate template serves `200-000-000`, the
    assertion sits in the captured blob, and the block showed `[docker] container exited with code 1`).
    Pytest's short-summary `FAILED <nodeid> - <msg>` line joins the priority order (after the traceback
    verdict, before the bare `assert` source line) for the truncated-tail case. The priority ORDER is
    UNCHANGED (the last-non-empty FALLBACK was RETIRED later — see the paragraph below), so
    extraction is never worse for any input; a gutter-free line
    normalizes to ITSELF, so the bare-pytest surfaced text is byte-for-byte as before. This governs only
    WHAT TEXT is surfaced — the KEYING of an entry (`_consumer_verify_layer_key`) and the waive
    COVERAGE vocabulary above are untouched.
    **The PRODUCER half — the excerpt preserves the failure through truncation, and the block names ALL
    failing assertions (the CANDIDATE-tree sibling of, same bullet, in place).** The
    extractor can only rescue what SURVIVES the recorded excerpt, and `_verify_failure_excerpt` truncated
