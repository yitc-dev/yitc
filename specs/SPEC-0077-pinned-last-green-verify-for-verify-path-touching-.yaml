  \ not `environmental`, and nothing about the shape\n  makes it special. **The bindable\
  \ token is WHAT THE ABORT PRINTS, pasted as printed**: take it off\n  `land`'s own\
  \ recovery line rather than composing one from the file list here — some of these\
  \ files\n  surface a per-node identity and their token therefore carries a `::<node>`\
  \ suffix, and a\n  hand-composed bare file token is refused BY DESIGN for an assertion-bearing\
  \ failure. The A-prime\n  AUTHORITY is unchanged by this hint: naming the shape\
  \ does not pre-authorize the waive.\n- **The printed recovery text yields to <workshop-spec>,\
  \ never the reverse (X-0658 — message-only).**\n  The abort's `--rebaseline` RECOVERY\
  \ hint read as an UNCONDITIONAL self-serve step, so a Worker standing\n  under <workshop-spec>'s\
  \ `default-under-uncertainty = STOP` saw the print tell it that the escalation the\n\
  \  default compels was unnecessary. The DEFAULT is the correct side; the TEXT was\
  \ wrong. The hint now\n  names the A-prime AUTHORITY (owner ack, or the option-(B)\
  \ self-clear under ALL of its conditions incl.\n  the mechanical tie) AND states\
  \ that escalating (`blocked-on-land`, worktree intact) is the CORRECT\n  outcome\
  \ when the tie cannot be made. No gate, flag, or abort-class changes — SPEC-0077\
  \ remains the\n  canonical authority home and <workshop-spec> keeps only its route\
  \ here.\n\n**Additive engine-LAYOUT carve-out ( — NOT a check-relaxation).** The\
  \ pinned re-run overlays the\nlast-green `tests/` over the candidate tree (§1).\
  \ Those OLD tests carry deployment-shape FIXTURES (helpers\nthat COPY the engine\
  \ to simulate a deployment) coupled to the OLD layout. A purely-ADDITIVE engine-layout\n\
  change — a NEW required module under `bin/` the candidate's own (green) verify already\
  \ covers (the\nincident: extract `bin/lib/state.py`, CLI 1-file → file+lib) — makes\
  \ the STALE last-green fixture fail with\n`No module named '<new-module>'`, because\
  \ it cannot provision a module that did not exist when it was\nwritten. That is\
  \ a fixture LAYOUT-MISMATCH, NOT a check-relaxation, so it MUST NOT force an\nemergency-bypass.\
  \ The pinned re-run EXCUSES such a failure iff the excuse is DIRECTIONAL + ALL-OR-NOTHING:\n\
  EVERY pinned failure's TERMINAL exception line is EXACTLY `ModuleNotFoundError:\
  \ No module named '<X>'`\n(exact-shape, NOT a loose mention of the phrase anywhere\
  \ in the failure text — a non-import failure that\nmerely contains it is not excused)\
  \ AND every `<X>` resolves to a module the candidate ADDS under `bin/`\n(present\
  \ at HEAD, ABSENT at merged_base). The instant ANY pinned failure is a non-import\n\
  failure (an ASSERTION — a genuine check-relaxation manifests here) OR names a REMOVED/renamed/non-bin\n\
  surface (a deletion-weakening), nothing is excused and the land ABORTS as before.\
  \ This preserves the §3\ncircular-trust guard intact (reliability-first): a verifier-WEAKENING\
  \ never presents only as\n`No module named '<candidate-added-bin-module>'`. The\
  \ excusal is NEVER silent — it records\n`land_completed.pinned_layout_excused: [<modules>]`\
  \ (§Verification) + an operator stdout note. It is NOT\nsurfaced as a `deviation_captured`:\
  \ an excusal is EXPECTED behaviour, not a friction (so the friction\nstream stays\
  \ signal); recurrence is queried via `grep pinned_layout_excused events.jsonl`.\n\
  \n### 3b. A WALL-CLOCK TIMING INSTRUMENT IS NOT PINNED\nA pinned check may assert\
  \ anything EXCEPT elapsed WALL TIME. An assertion whose SUBJECT is a\nwall-clock\
  \ reading — \"this took under N ms\", \"arm A separated from arm B by more than\
  \ N ms\" — does\nnot belong on the per-land pinned path, and is not put there.\n\
  \nThe reason is a property of the path, not of any one instrument: the pinned path\
  \ (§3) runs the\nverify TWICE, inside a parallel suite, on a host shared with concurrent\
  \ lands. A wall-clock reading\ntaken in that environment measures the HOST at that\
  \ moment together with the subject, and the host\nterm is not bounded by anything\
  \ the branch controls. So the reading is not a loose measurement of\nthe right quantity;\
  \ it is a measurement of a different one. A branch that touches neither the\ninstrument\
  \ nor the code it guards can be REFUSED by it, and widening the bound does not repair\
  \ that\n— it keeps the same load-coupled quantity and buys quiet by going blind\
  \ (SPEC-0165).\n\n**THE INSTRUMENT IS SPLIT, NEVER REMOVED.** Every assertion of\
  \ the instrument that is CLOCK-FREE —\nreport parsing, structural shape, a registry\
  \ naming its own subjects, a synthetic bite-proof whose\nverdict does not read a\
  \ clock, a CPU-time or other load-invariant statistic — STAYS PINNED and is\nunchanged\
  \ by this rule. What moves is the wall-clock leg alone, and it moves to a place\
  \ where the\nreading can be taken honestly: the SPEC-0105 quiet lane, which runs\
  \ registered timing instruments\nSERIALIZED with no concurrent verify and records\
  \ each reading rather than gating on it. So the\ncoverage the pinned path keeps\
  \ is the coverage a pinned path can actually deliver, and the timing\nquestion is\
  \ still asked — nightly, on a quiet host, with the answer recorded.\n\n**A REGRESSION\
  \ IN A MOVED LEG IS A DEBT LINE, NOT A GATE.** Nothing about this rule converts\
  \ a\nslow reading into a land refusal by another route. The lane reports; the reader\
  \ decides.\n\n**ORDER (the de-pin is never the first commit).** A wall-clock leg\
  \ is DE-PINNED only after its\nquiet-lane replacement has produced readings in PARALLEL\
  \ with the still-pinned leg, and those\nreadings are recorded on the card that de-pins\
  \ it. Registering the instrument and removing the\npinned assertion in one step\
  \ would leave a window in which neither surface is watching, which is\nthe one outcome\
  \ this rule must not produce.\n\n### 4. Scope guard (the negative contract)\nThe\
  \ pinned re-run fires ONLY for verify-path-touching diffs; a normal source/doc land\
  \ is verified\nonce, as today — no scope creep into a blanket double-verify gate.\n\
  \n### 5. Bootstrap cutover — the trusted starting base (forward-looking, probe-shaped)\n\
  The rule is forward-looking. The activating land (which INTRODUCES the mode — itself\
  \ a\nverify-implementation-touch) is NOT self-affirming: its pinned source is the\
  \ PRE-MODE `main` verifier,\nwhich already carries every existing real check (it\
  \ merely lacks the new pinned-re-run feature), so the\nold verifier still gates\
  \ the activating change. The one-time bootstrap exception is explicit +\nprobe-shaped:\
  \ (i) verify the activating land with the pre-mode `main` verifier; (ii) an owner-authorized\n\
  adoption probe — the deliberately-weakened-verifier test must FAIL that pre-mode\
  \ verifier on the\nactivating tree (the gate works from land #1); (iii) record the\
  \ bootstrap evidence on an EXISTING\ncarrier — the activating task's closure adoption-probe\
  \ evidence (the journaled probe-(ii) run-ref: the\npre-mode `main` verifier FAILS\
  \ a deliberately-weakened activating tree), together with that land's\nstandard\
  \ `land_completed.verify_mode=pinned+candidate` field — NOT a new standalone note\
  \ / store / tag\n(CHARTER §P1 F3 — git + the existing closure/event carriers already\
  \ hold it; convergence target\nresolved, trial run #2). From there every subsequent\
  \ `main` HEAD is trusted by the pinned+candidate\ngate (self-reinforcing forward).\
  \ EXPLICITLY out of scope (the accepted-baseline class, §2): a verifier already\
  \ weakened on `main`\nBEFORE the mode existed, OR a verifier change landed via an\
  \ owner-authorized emergency-bypass (CHARTER\n§P2, `--no-tests`) — the rule cannot\
  \ retroactively detect a pre-mode compromise or re-judge an\nowner-accepted bypass,\
  \ and does not claim to. Both are owner-confirmed baselines (the bypass is surfaced\
  \ +\nretro'd), not silent gaps.\n\n### 6. Consumer surfaces (no hidden second mode)\n\
  The pinned source is ALWAYS the committed `main` HEAD verify-path of the checkout\
  \ being landed, under\nthat checkout's `REPO_ROOT`: (a) engine self-build → the\
  \ engine's own `main` HEAD verify-path; (b) a\n`-C` consumer land → the consumer's\
  \ OWN `main` HEAD verify inputs, while the ENGINE binary running its\n`-C` verify\
  \ is the consumer's PINNED engine version (a fixed, already-trusted reference the\
  \ consumer\ndoes not edit per-land — kernel is pinned, not consumer-mutable); (c)\
  \ a pre-extraction / kernel-provided\nconsumer runs engine-resolved content it does\
  \ not edit, so nothing consumer-side is\npinned beyond the engine's already-pinned\
  \ version. One rule, surfaces named.\n\n## Rationale\n\nA self-modifying engine\
  \ has a circular-trust gap: the same CLI/graph-build code being changed is\nalso\
  \ the code that decides whether the land is valid, so a wrong-but-passing verifier\
  \ change can\nsilently weaken the chokepoint. V2 dispatches autonomous workers that\
  \ edit `bin/yitc-v2` + the\ngraph-build, and real `-C` consumers arrive next — each\
  \ consumer's `-C land` verifies its own code\nwith its own (possibly-just-changed)\
  \ verifier, the SAME risk at the project level. Source: the\nexternal consult `decisions/kernel-protection-recovery-set-audit-adhoc.yaml`\
  \ (finding 2, HIGH,\n4-filter-passed). Classic bootstrap / verifier self-hosting\
  \ risk (incident count zero;\nprior-art-grounded). EXTENDS the existing `land` chokepoint\
  \ + the SPEC-0064/SPEC-0065\nre-verify machinery; adds no new subsystem.\n\n## Verification\n\
  \n- **observed:** a deliberately-weakened verifier change FAILS the pinned (last-green)\
  \ verify even\n  though it would pass its own candidate verify — on BOTH an engine\
  \ land and a `-C` consumer land.\n- **observed (one authoritative adoption signal):**\
  \ `land_completed.verify_mode` (registered in the\n  events.jsonl schema home **SPEC-0025**\
  \ — the new field is added there, not silently — plan-check MEDIUM) is the SOLE\n\
  \  authoritative adoption signal — a NEW FIELD on the EXISTING `land_completed`\
  \ event (not a new event):\n  `verify_mode=pinned+candidate` on a verify-implementation-touch\
  \ land, `verify_mode=candidate` on any\n  other land (the negative probe — proves\
  \ no blanket-gate scope creep). A terminal stdout marker MAY\n  accompany it but\
  \ is operator-facing CONVENIENCE only, never a second source of truth (Single-SoT).\n\
  - **observed (additive-layout carve-out):** a purely-ADDITIVE engine-layout change\
  \ (a new\n  required `bin/` module the candidate's own verify covers) whose STALE\
  \ last-green fixture fails with\n  `No module named '<new-module>'` LANDS WITHOUT\
  \ an emergency-bypass — `land_completed.pinned_layout_excused`\n  lists the excused\
  \ module(s) (never silent) + an operator stdout note. `pinned_layout_excused` is\
  \ an\n  ADDITIVE land_completed key (registered in **SPEC-0025**), PRESENT ONLY\
  \ on an excused land. (No\n  `deviation_captured` — an excusal is expected behaviour,\
  \ not a friction.)\n- **observed (waive KIND):** two re-baseline lands granted with\
  \ the SAME reason prose but\n  DIFFERENT `--rebaseline-kind` values record DISTINGUISHABLE\
  \ evidence — their `land_completed` rows\n  differ on `rebaseline_kind` (`broken`\
  \ vs `unrunnable-here` vs `environmental`), and with that key\n  suppressed they\
  \ are indistinguishable, which IS the defect X-0739 reported. A `--rebaseline` with\n\
  \  NO kind is REFUSED (`abort_class=rebaseline-unauthorized`) and the refusal NAMES\
  \ every kind —\n  never defaulted. A row recorded before carries no kind and is\
  \ unchanged: nothing\n  backfills it.\n- **observed (the `environmental` binding):**\
  \ an `environmental` grant records, per token,\n  `land_completed.waive_binding{mode:\
  \ prior-abort, locator, isolated, full_run}` — so the grant is\n  reconstructible\
  \ from the journal alone (WHICH recorded abort it bound to, that the file passed\n\
  \  ISOLATED, and what the FULL run said about the file it still ran). Differential:\
  \ with the\n  `waive_binding` key suppressed, an environmental grant is indistinguishable\
  \ from a `broken` one\n  that happened to declare a different label, which is the\
  \ whole thing this value exists to separate.\n- **failure-threshold (waive KIND,\
  \ as amended):** a kindless `--rebaseline` LANDS\n  (silently defaulted); OR `broken`\
  \ / `unrunnable-here` change ANY eligibility outcome — who may\n  authorize, the\
  \ reason-length gate, the current-state audit requirement, or which pinned assertions\n\
  \  the `--rebaseline-waive` declaration covers (those two ARE labels, so an eligibility\
  \ difference\n  between them, or between either and the pre- kindless grant, is\
  \ a widened gate); OR\n  `environmental` widens anything BEYOND its declared two-part\
  \ binding — it changes who may\n  authorize, or waives an assertion no declaration\
  \ NAMES, or binds with only ONE conjunct proven, or\n  clears a sibling token when\
  \ a named file FAILED isolated (the all-or-nothing rule), or causes the\n  waived\
  \ file to be SKIPPED in the full verify, or grants without recording `waive_binding`;\
  \ OR an\n  existing kindless row is re-keyed; OR the record is claimed to make an\
  \ unrunnable verify runnable\n  (reachability is UNSOLVED).\n- **failure-threshold:**\
  \ the pinned verify fires on a NON-verify-path land (scope creep); OR it is\n  engine-only\
  \ (consumer lands not covered); OR it adds a new gate cascade / ledger / FSM; OR\
  \ the\n  additive-layout carve-out excuses a NON-import (assertion) failure or an\
  \ import error for a\n  REMOVED/renamed/non-`bin/` module (a genuine check-relaxation\
  \ self-approving — the carve-out is NOT\n  directional + all-or-nothing).\n\n**Pinned-suite-edit\
  \ guards — axis (d) deferred ONLY in the declaring card's Stage-6 run.**\n`tests/_pinned_suite_edit.py`\
  \ admits a DECLARED pinned-suite edit on four axes; axis (d)\nrequires a GREEN/YELLOW\
  \ audit-post whose commit carries the declared blob. No audit-post can exist\nbefore\
  \ Stage 8, so the declaring guards were RED in that card's own Stage-6 run and the\
  \ audit-post\nthen REDed the card for that evidence (twice, each broken by an owner\
  \ accept). `task test\n--run` therefore exports `YITC_PINNED_SUITE_EDIT_PREAUDIT=<card\
  \ id>`; with it the helper admits a\ndeclaration PENDING AUDIT-POST only when axes\
  \ (a)-(c) — exact suite, this guard named, exact\ncandidate blob — all hold AND\
  \ the declaring card IS the named id. `land` scrubs the marker at entry\nand the\
  \ routed land leg never exports it (SPEC-0203), so axis (d) stays strict at land\
  \ in BOTH the\ncandidate and pinned legs. Probe: `tests/test_t13226_pinned_edit_audit_post_ordering.py`.\n"
