  \ the SAME fail-closed\n  `_recorded_pinned_waive_records` classifier the land backstop's\
  \ admission pre-check uses, never\n  a fresh string match) AND that row yields a\
  \ LOCATOR. Neither part alone is evidence: (i) alone is\n  just a green file, and\
  \ (ii) alone is a failure with no proof it is environmental.\n  **THE LOCATOR IS\
  \ PART OF (ii), NOT DECORATION.** A recorded row carrying no timestamp yields no\n\
  \  locator, and a grant made on it would record a `waive_binding` that cannot be\
  \ traced back to the\n  evidence justifying it — which is exactly the accountability\
  \ this kind's record exists to\n  provide. So an unlocatable row binds NOTHING and\
  \ the token stays `no-match`: a locator is\n  evidence, and an absent timestamp\
  \ is not evidence of a row.\n  **(i) IS EVALUATED FIRST AND IS ALL-OR-NOTHING.**\
