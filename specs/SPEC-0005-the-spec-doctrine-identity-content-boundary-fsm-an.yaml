id: SPEC-0005
title: The spec doctrine — identity, content boundary, FSM, homing, and how to create/split/reshape
  a spec
status: active
created_at: null
consumed: false
implements: []
activation_owner_task: null
amends:
- D-0044: broadens spec identity to code-OR-process-OR-both (rule 1); re-homes the
    admission test + two-bound volume discipline here (rules 2, 6) unchanged; AMENDS
    §6 authority chain — "specs CITE decisions" becomes specs cite PLANS (the deliberation
    home), since the decision class retires (rule 8).
- D-0047: adds a `draft` stage below `proposed` in the spec FSM (rule 4) — staged
    pending adoption; reuses the existing proposed→active probe gate + atomic supersede
    flip unchanged.
- plan one-task rule: relaxes activation cardinality from "one task per spec" to "one
    activation OWNER per spec" (rule 5).
- D-0010 / D-0055: re-homes the retired decision class — standing rule-text → spec
    (this doctrine); deliberation + ratification act → the plan; the decision-finalize
    audit altitude → plan finalization (parent plan §2). Existing decisions stay frozen
    history (not converted here).
- NEW (not an amendment of an existing surface): the "one home incl. handbook/pattern
    prose" rule + the verification-contract-travels-with-the-rule rule (rule 8) —
    the spec/plan/task-field split was non-exhaustive; rule 8 names the third home.
body: "## Scenario\n\nThe owner/AI sees ONE durable design corpus. Whenever a STANDING\
  \ normative rule must be captured —\ngoverning CODE, a PROCESS, or both — it is\
  \ written as (or folded into) a SPEC, not a separate\n`decision` artifact — UNLESS\
  \ the rule is already canonically homed in handbook/pattern prose, where\nit stays\
  \ (rule 8). The \"why\" (deliberation, rejected alternatives, the ratification act)\
  \ lives in\nthe PLAN that produced the spec; a choice local to one task lives as\
  \ a field on that TASK. A\n`proposed` spec is a staged, non-binding design head;\
  \ it governs nothing until a task ACTIVATES it.\n\n## Internal\n\nThis spec is the\
  \ doctrine for the spec node-type itself (the meta-spec). It is NORMATIVE about\n\
  authoring discipline; it adds no tooling. Eight rules + two guards.\n\n### 1. Identity\
  \ (broadened)\nA spec is **a standing normative rule with implementation/adoption\
  \ links — code OR process OR\nboth**, not only a code-bound contract. A process/governance\
  \ rule is a legitimate spec.\n**Exclusion (admission floor for a process rule):**\
  \ spec-worthy ONLY if it is cross-task, durable,\nanalysis-shaping, AND behavior/probe-relevant.\
  \ One-off operating guidance, a temporary workflow\nchoice, and a local authoring\
  \ preference are NOT specs — they stay task fields or plan notes.\n(Amends identity.)\n\
  **Single identifier/storage form (one spec node-type — anti-recurrence, X-0195/X-0197):**\
  \ a spec\nid and filename are `SPEC-XXXX` (stored `specs/SPEC-XXXX.yaml`) ONLY —\
  \ the SOLE spec identifier\nshape. GRAPH §Schema and SPEC-0030 own the one-node-type\
  \ fact (the v1 analog `INVARIANT-*` was\nunified into the single `spec` node); do\
  \ not restate it here (rule 8). An invariant, a config\nparameter, or an FSM is\
  \ spec CONTENT — a `## Internal` rule, a `## Parameters` entry, or a body\nsection\
  \ — NEVER a parallel node-type or filename prefix. Do NOT author\n`INVARIANT-*`\
  \ / `CONFIG-*` / `FSM-*` `.yaml` files: `graph build` indexes only `SPEC-*.yaml`,\
  \ so an\nother-prefixed spec-shaped file is silently graph-invisible (its `implements:`\
  \ anchors never reach\nthe graph) — the <project>-migration incident (X-0195 / X-0197).\n\
  \n### 2. Admission test (re-homed from)\nWarranted if MOST hold: (1) states a rule/invariant/contract/design-boundary\
  \ OR a governing\nparameter an editor must know before safe change; (2) survives\
  \ an internal refactor; (3)\nimplementation-shape-independent; (4) a change to it\
  \ needs deliberate review; (5) affects ANALYSIS\nSCOPE (tells the AI what else to\
  \ inspect); (6) probeable; (7) non-local effect. **Probe breadth:**\n\"probeable\"\
  \ means at system-behavior level — and for a PROCESS spec that includes governance\
  \ /\nrepository-state / CLI-behavior / adoption-evidence probes, not only runtime\
  \ product behavior.\n**Delete-test:** if removing it would not materially worsen\
  \ change analysis, it wasn't a spec. NOT\na spec: paraphrases one function's control\
  \ flow; a behavior-preserving refactor would rewrite it;\nbetter as code/test/comment.\n\
  \n### 3. CONTENT BOUNDARY (the load-bearing discipline)\nA spec body carries ONLY:\
  \ (a) the standing RULE-TEXT, and (b) rationale STRICTLY in service of\nINTERPRETING\
  \ or APPLYING that rule. **ALLOWED:** concise provenance / change-origin notes that\
  \ help\ninterpret or prevent misapplication of the CURRENT rule (e.g. \"Amends identity\"\
  ; \"the\nbyte-cap counts pre-normalization\") — these explain the rule as it stands.\
  \ **FORBIDDEN** — these\nbelong in the PLAN: full rejected-alternatives narratives\
  \ / \"why X over Y\" debate; approval or\nratification history / who-signed-off\
  \ / dates of agreement; deliberation chronology. **Probe:** a\nbody sentence that\
  \ would have to CHANGE if a *different* option had been chosen — while the rule\n\
  itself stayed the same — is misplaced deliberation → move it to the plan. (The line:\
  \ a note that\ninterprets the rule may stay; the debate that produced the rule may\
  \ not.)\n\n### 4. FSM (adds `draft` below `proposed`)\n`draft → proposed → active\
  \ → superseded → retired` (terminal `withdrawn` / `rejected`).\n  - `draft` — exploratory,\
  \ lives in a plan-draft, in the graph for plan-local reasoning, governs\n    NOTHING,\
  \ triggers NO currency/staleness.\n  - `proposed` — committed staged direction;\
  \ currency/staleness tracks it; non-authoritative;\n    `consumed:` MUST be false;\
  \ has an `activation_owner_task` (rule 5).\n  - `active` — realized; the **ONLY**\
  \ normative status.\n  - `superseded` / `retired` / `withdrawn` / `rejected` — non-normative\
  \ history, kept + indexed.\n`proposed → active` is GATED by an adoption probe (CHARTER\
  \ §P3/§P8); on activation any `supersedes:`\ntarget flips atomically (`active` target\
  \ → `superseded`; a still-`proposed` target being replaced →\n`withdrawn`/`rejected`,\
  \ since it never governed).\n**Draft tooling — SHIPPED ( Part A).** The `draft`\
  \ stage is now live: `spec new --draft\n--proposed-by <plan>` births a plan-local\
  \ draft; `graph build` indexes drafts (status-agnostic\nwalk); default `graph query\
  \ --projected` EXCLUDES all drafts; `graph query --projected\n--include-draft=<plan>`\
  \ is the plan-scoped what-if. Draft→proposed is NOT a spec verb — that\npromotion\
  \ is Part B's `plan accept` (one promotion route only). **Currency/staleness is\
  \ NOT yet\nbuilt (Part G):** when it ships it MUST start at `proposed` and NEVER\
  \ fire on `draft` — until then\nthere simply is no currency mechanism, so a draft\
  \ triggers none.\n\n### 5. One activation OWNER per spec\nCarrier field: **`activation_owner_task:\
  \ T-XXXX`** — the SINGLE task that carries closure, the\nadoption probe, and supersession\
  \ responsibility. Lifecycle: forbidden while `draft`; REQUIRED for\n`proposed →\
  \ active` (a `proposed` spec may sit briefly without one, but cannot activate without\n\
  one); singular at all times; transferable only by explicit mutation. Other tasks\
  \ MAY implement\nportions of the same spec (multi-surface / infra+product / staged\
  \ rollout) — they `cite` the spec;\nthey do not own its activation.\n**Many-implementer\
  \ rule:** when a rule has several implementing tasks (the old decision\n`refs.follow_ups`\
  \ shape), exactly ONE becomes the `activation_owner_task`; the rest `cite` the spec.\n\
  **Grandfathering:** a pre-doctrine spec is VALID without `activation_owner_task`\
  \ / `proposed_by` —\nthese fields are required only for newly-created specs OR on\
  \ the next substantive reshape /\nsupersession of a legacy spec. No retroactive\
  \ backfill.\n\n### 6. Volume discipline — two bounds (re-homed from)\n  - **Lower\
  \ (anti-oversplit, HARD merge-default):** a new spec MUST prove separation materially\n\
  \    improves change analysis; else MERGE into an existing spec.\n  - **Upper (anti-oversize):**\
  \ when a spec grows too big to load cheaply → SPLIT, but **by stable\n    surface/boundary,\
  \ NEVER by perspective**.\nAnti-bloat is held by this discipline + retrieval precision\
  \ + currency — NOT a spec-count cap.\nMetric = load-cost + retrieval precision.\n\
  \n### 7. How to create / split / reshape\n  - **Create:** `bin/yitc-v2 spec new\
  \ --title …`; fill anchors + body sections + `proposed_by`.\n  - **Declare the binding\
  \ (MANDATORY when creating OR correcting a spec — closes the dangling door):**\n\
  \    every spec MUST declare HOW it reaches the AI as a non-empty `binding:` (the\
  \ binding contract\n    SPEC-0013): a gating verb/stage that FETCHES it before acting\
  \ (`commit` / `close` / `audit-pre` /\n    `audit-post` / `spec-new` / `plan-close`,\
  \ or a `stage-entry:` token), OR a reserved residency\n    token — `floor` (always-loaded,\
  \ not verb-fetched), `seed`, `query-only`, or `code-enforced` (a\n    code-enforced\
  \ contract: its `implements:` anchors ARE the enforcement). A non-empty\n    `implements:`\
  \ ALONE is NOT a delivery declaration: the implicit implements excuse was removed\n\
  \    from the dangling check, so a code-enforced contract declares `code-enforced`.\
  \ A spec\n    left ACTIVE with an EMPTY `binding:` — whatever its `implements:`\
  \ — is a **dangling spec** the AI\n    is never pointed to. This step is an AUTHORING\
  \ DISCIPLINE (the author declares the binding because\n    this doctrine requires\
  \ it — NOT a code gate on `spec new`; a gate is non-goal #2). The structural\n \
  \   backstop is the `graph build` bidirectional report (SPEC-0013), which CATCHES\
  \ any dangling spec\n    that slips — prevention by discipline, detection by the\
  \ report. ORDERING : the card\n    that authors or amends a spec declares its binding\
  \ on the proposed head before audit-post, so the\n    declaration is part of what\
  \ that card's audits judge; a declaration made only after audit-post is\n    the\
  \ accepted recovery for a missed step, never the ordering this rule asks for.\n\
  \  - **Split:** by stable surface/boundary (rule 6) — never to mirror a code-file\
  \ layout or a\n    narrative perspective.\n  - **Reshape (correct / supersede):**\
  \ author a NEW `proposed` spec with `supersedes:` the old; the\n    activation step\
  \ flips the old atomically (rule 4). During Execution a task may CONFIRM\n    (proposed→active)\
  \ / CORRECT (new proposed +) / CANCEL (withdraw) / BIRTH a spec.\n    Cross-refs\
  \ reuse EXISTING fields — `proposed_by` (provenance field, NOT a 7th edge), `cites`,\n\
  \    `supersedes`, `closed_into`; the 6-edge bound holds.\n  - **In-place amend\
  \ vs supersede — the boundary (the line is NORMATIVITY, not edit size):**\n    -\
  \ **IN-PLACE amend ALLOWED** — edit the ACTIVE spec body directly for a typo / clarification\
  \ /\n      non-normative editorial correction that does NOT change what the rule\
  \ REQUIRES or FORBIDS (a\n      concise interpreting note per rule 3, a cross-ref\
  \ fix, disambiguating prose the rule was silent\n      on). No new id, no `supersedes:`,\
  \ no FSM transition. A multi-line / full-section in-place\n      amend rides the\
  \ verb via `spec edit --from-file`/`--from-stdin` (a YAML mapping {old, new,\n \
  \     replace_all?}) — NOT a hand-edit of the YAML (which skips the `spec_edited`\
  \ emit).\n      Prior-art: docs / docs\n      corrected active spec bodies in-place;\
  \ added a binding field + an authoring sub-rule\n      in-place. PEP/ADR analog:\
  \ living docs take errata in-place.\n    - **SUPERSEDE via a NEW `proposed` spec\
  \ + `supersedes:` REQUIRED** — for a NORMATIVE reshape: any\n      change to what\
  \ the rule REQUIRES / FORBIDS / its behaviour or scope (the thing a consumer acts\n\
  \      on differently). Routed through the FSM (rule 4); never reshaped normatively\
  \ in place.\n    - **ADDITIVE EXTENSION to an ACTIVE spec is IN-PLACE (the recurring\
  \ fork):** ADDING a\n      NEW case to an active rule — a new exemption / carve-out\
  \ / permitted-state / ceiling-extension\n      — that leaves EVERY already-covered\
  \ case's required behaviour UNCHANGED is an in-place amend,\n      NOT a supersede:\
  \ it enlarges coverage without reshaping any existing obligation, so no\n      consumer's\
  \ PRIOR compliance changes; only a situation the rule did not previously address\
  \ gains\n      an explicit additive answer. Prior-art (in-place on the ACTIVE SPEC-0036\
  \ audit-loop ceiling):\n       (commit 965af137) added a new ceiling-EXEMPT case\
  \ — the plan-freshness re-audit\n      ledger-skip — directly in SPEC-0036's body;\
  \ (6c7e5021, a consult-reopened owner-reset\n      pass) and (66efb620, a uniform\
  \ ceiling-continuation carrier) likewise EXTENDED that\n      ceiling in-place.\
  \ Contrast a RESHAPE of an already-covered case (e.g. ceiling 2->3 for the\n   \
  \   existing absorption loop, or REMOVING an exemption) — that alters existing compliance\
  \ →\n      supersede.\n    - **The discriminating probe:** \"does the edit change\
  \ what a consumer must DO to comply IN AN\n      ALREADY-COVERED case?\" YES → supersede;\
  \ NO (it only clarifies / interprets / corrects, OR adds\n      a NEW case while\
  \ leaving every already-covered case's compliance unchanged) → in-place. (Mirror\n\
  \      of rule 3's content-boundary probe.) The \"already-covered\" qualifier is\
  \ what keeps a purely\n      ADDITIVE extension from reading as a spurious YES.\n\
  \    - **Internal-basis change under PRESERVED rule-text — text-preservation is\
  \ NOT the discriminator\n      (E-0025):** when a spec's internal BASIS / derivation\
  \ / mechanism changes while the rule's WORDS\n      stay identical, the boundary\
  \ is STILL consumer-observable normativity, NOT the unchanged text —\n      run\
  \ the discriminating probe on BEHAVIOUR, not the words. A basis change that alters\
  \ what a\n      consumer OBSERVES or relies on in an already-covered case → NORMATIVE\
  \ reshape → SUPERSEDE\n      (preserved wording is incidental, not exculpatory):\
  \ watermark basis change (`now →\n      window_through`) kept the rule-text (\"\
  closed boundary / routed exactly once\") intact YET changed\n      the reprocessing\
  \ window a consumer observes → routed via supersede (consult-blessed). A basis\n\
  \      change that is only a more-honest RESTATEMENT of the SAME obligation, with\
  \ NO consumer-observable\n      difference → IN-PLACE (e.g. correcting an interpreting/provenance\
  \ note per rule 3 — \"the byte-cap\n      counts pre-normalization\" — sharpens\
  \ the basis without changing what any consumer must DO). The\n      two E-0025 fingerprints\
  \ resolve thus: an ADDITIVE ceiling-extension → IN-PLACE (the ADDITIVE\n      EXTENSION\
  \ bullet above); an internal-basis edit → run the BEHAVIOUR probe (supersede iff\
  \ it shifts\n      observable behaviour, else in-place).\n  - **Floor coverage of\
  \ in-place edits (`before-rule-change`) — recorded decision, REVERSED by :**\n \
  \    recorded that the `before-rule-change` floor trigger keyed to the `spec-new`\
  \ ACTION ALONE was\n    \"correct by design\", relying on a structural backstop\
  \ (a normative change smuggled in-place leaves\n    NO `supersedes:` lineage / activation\
  \ carrier — a drift-#10 / P5 signal). (owner-authorized\n    2026-06-03) REVERSES\
  \ that: the backstop was shown UNRELIABLE (delivery-inspection finding-3\n    `rule-change-keyed-to-spec-new`,\
  \ reproduced N=2 — an ungated in-place edit left NO journal trace at\n    all, so\
  \ the bypass was invisible, not merely lineage-less). The `before-rule-change` trigger\
  \ now ALSO\n    covers the `spec edit` in-place chokepoint (binding: [spec-new,\
  \ spec-edit]); `spec edit` makes an\n    in-place edit journal-observable (a `spec_edited`\
  \ event carrying the binding-derived\n    `governing_contract`), so an off-path\
  \ raw edit is DETECTABLE as a spec-file diff with no `spec_edited`\n    event. The\
  \ in-place-vs-supersede NORMATIVITY boundary above is UNCHANGED — a normative reshape\
  \ still\n    routes through `spec new`; `spec edit` is the sanctioned path for the\
  \ non-normative in-place\n    clarifications rule 3 already allows, now gated +\
  \ observable. **Land enforcement :** an off-path raw spec body/implements edit reaching\
  \ `land` is BLOCKED (LAND: ABORT), not merely surfaced — the prior WARN-only was\
  \ silently skippable, which the owner directive closed. A legitimate bulk body-migration\
  \ that cannot ride `spec edit` per-occurrence declares an explicit `spec-hand-edit-waiver:\
  \ <reason>` commit-body trailer (>=30 chars, the CHARTER §P2 emergency-marker shape\
  \ — durable in git history, never silent), which downgrades the off-path edit to\
  \ an acknowledged non-blocking warn. **Commit-time SIGNAL :** the SAME land guard\
  \ is also read at `task commit` / `work commit` and its finding REPORTED there —\
  \ a WARN, never a refusal. The block stays at `land`, unmoved: a commit-time gate\
  \ would be STRICTER than land (which scans the whole branch and accepts a waiver\
  \ trailer declared on any commit in it), so refusing at commit would make the legal\
  \ multi-commit waiver flow illegal. One detector, two read points.\n\n    **THE\
  \ RECEIPT MUST RIDE THE SAME BRANCH AS THE DIFF (absorbing the external\n    auditor's\
  \ finding 2 on the corpus-guard-ordering consult, 2026-08-20).** A `spec_edited`\n\
  \    receipt clears an off-path body/implements diff ONLY when the SAME member branch\
  \ introduced\n    BOTH. This is stated because it is STRICTER than what a merged-tree\
  \ check can, and the\n    strictness must be normative BEFORE it is enforced, never\
  \ discovered from a land refusal.\n    WHY the two differ: the journal is append-only\
  \ and UNION-MERGED at `land`, so once branches A\n    and B are merged into one\
  \ candidate, A's receipt and B's body change sit in the same tree and\n    the guard\
  \ clears B — even though B, alone, changed a governing spec body with no receipt\
  \ of\n    its own. Union-merge therefore HIDES a provenance violation that per-branch\
  \ checking sees.\n    The same-branch reading is the rule because the receipt's\
  \ whole purpose is to record WHO\n    made THIS edit and under which governing contract;\
  \ a receipt authored by someone else's\n    branch records neither. The identical\
  \ rule governs the sibling rationale-bearing guards\n    (SPEC-0054 decision content-freeze,\
  \ SPEC-0165 card-shape rationale): the rationale must be\n    introduced by the\
  \ same member branch as the change it justifies. This clause is what a\n    pre-admission\
  \ per-branch check ENFORCES; the merged-tree check remains a backstop and is not\n\
  \    weakened by it.\n  - **Empty `implements:` has TWO legitimate modes — name\
  \ which, so empty ≠ omission:**\n    (a) *distributed/documentary* — an active cross-cutting\
  \ invariant enforced everywhere, no single\n    code site (e.g. SPEC-0001, this\
  \ spec); (b) *design-stage* — a `proposed` spec not yet wired to a\n    concrete\
  \ anchor. Always add a one-line note saying which.\n\n### 8. Homing a standing rule\
  \ — one home; verification travels with the rule\n  - **One home (P5):** a standing\
  \ rule lives in EXACTLY ONE canonical home — a SPEC, **OR existing\n    handbook/pattern\
  \ prose** when the rule is already canonical there (CHARTER / AGENTS / LIFECYCLE\n\
  \    / QUEUE / GRAPH, or a `patterns/*` file). Never both. A rule already homed\
  \ in the handbook/pattern\n    STAYS there — do NOT duplicate it into a spec. (This\
  \ is the THIRD home the spec/plan/task-field\n    split omitted.)\n  - **Verification\
  \ travels WITH the rule:** a rule's verification CONTRACT (what must be true for\
  \ it\n    to count as adopted — the probe definition) lives in the rule's `## Verification`\
  \ — it is part of\n    the rule, not deliberation. The one-time verification RESULT\
  \ (a probe's status / verified_at /\n    evidence list) is HISTORY, NEVER the live\
  \ spec body — and its home is precise: the\n    **activation-owner task** owns the\
  \ durable probe result, the **journal** records the activation\n    event, the **plan**\
  \ summarizes only migration-wide outcomes.\n  - **Migrating a legacy rule (when\
  \ the decision class retires) is NOT 1:1** — route each via one of\n    three verbs:\
  \ *fold-into-existing-spec* (the rule joins an existing spec) / *absorb-into-meta-spec*\n\
  \    (a foundational rule about the model joins a doctrine spec like this one) /\
  \ *freeze-history-only*\n    (a pure act / dead / handbook-duplicate stays frozen\
  \ + gets `migrated_to` or a prose historical-only disclaimer).\n    The one-time\
  \ field-by-field map for the existing legacy decisions is MIGRATION PROCEDURE —\
  \ it lives\n    in the parent plan (Part F) [[doc-model-rework-retire-decision-unify-on-spec-spe]],\
  \ not restated\n    here (rule 3 — migration narrative is plan material).\n  - **Build\
  \ it drift-PROOF — classify before you mention a homed rule (per SPEC-0067):** before\n\
  \    authoring or editing standing-rule documentation, apply the SPEC-0067 cross-surface\
  \ test to every\n    place you MENTION a rule homed elsewhere — *\"if the rule-text\
  \ at the home changed, would THIS\n    mention need a manual edit to stay correct?\"\
  * YES ⇒ drift-CAPABLE (pointerise / derive /\n    provenance-interpret instead);\
  \ NO ⇒ drift-PROOF. The classifier + criterion live in SPEC-0067\n    (`graph query\
  \ SPEC-0067`); this is a mandatory before-rule-change routing, not an optional aside.\n\
  \  - **Prompts, checklists, and cues carry a discipline CUE + a POINTER only — never\
  \ the corpus\n    content (the SPEC-0067 drift test applied to the highest-risk\
  \ MENTION surface):** an authoring\n    aid that MENTIONS a corpus rule — a floor-trigger\
  \ cue, a front-load checklist item (SPEC-0043 /\n    SPEC-0060), a skeleton prompt,\
  \ a stage next-hint — carries ONLY (a) a discipline-level CUE (name\n    the discipline\
  \ + why it matters) and (b) a POINTER to the ONE home of the rule; it MUST NOT\n\
  \    restate the concrete rule-text, parameters, or action steps. A cue that restates\
  \ concrete corpus\n    rule/action content DUPLICATES the spec/pattern that owns\
  \ it — a second home → drift (P5), the\n    exact failure that lets a stale aid\
  \ silently contradict its home. The aid names the discipline\n    and points (do\
  \ the X-discipline — see the home); it never carries the restated steps. (Incident:\n\
  \     — a planning sizing rule was directed into the decomposition DOCTRINE itself,\
  \ the SPEC-0043\n    front-load checklist POINTING to it, not restating it.)\n\n\
  ### Guard A — draft-check scope\nChecks over `draft` specs are STRICTLY plan-LOCAL\
  \ structural checks (one plan's what-if). A draft\ncheck may NOT emit a global contradiction\
  \ claim, backlog pressure, or a staleness event — global\ncurrency/staleness starts\
  \ at `proposed`. ONE contradiction system, not two (P5).\n\n### Guard B — anti-drift\
  \ on process specs\nThe risk of the broadened identity (rule 1) is normalizing \"\
  spec as governance container\" faster\nthan the admission discipline. So: NO process\
  \ spec is admitted unless BOTH the rule-2 delete-test\nAND the rule-3 content-boundary\
  \ check pass; and the first process specs are treated as SAMPLED\nPILOTS, not automatic\
  \ precedent for admitting the next one.\n\n## Parameters\n\nNone consumed. Governing\
  \ constants referenced (handbook cap = 2500, audit-loop ceiling = 2,\npromotion\
  \ threshold N≥2) live in their OWN specs/decisions — NOT duplicated or `consumed:`\
  \ here.\n\n## Rationale\n\nPrior-art (PEP / ADR / Specification-by-Example) keeps\
  \ rule + rationale in ONE artifact and runs no\nparallel decision+spec classes (research\
  \ [[spec-driven-prior-art-research-spec-kit-kiro-tessl]]).\nThe CONTENT BOUNDARY\
  \ (rule 3) is the load-bearing discipline: living-docs survive only with a clean\n\
  rule-vs-deliberation separation (Gojko Adzic's Specification-by-Example retrospective);\
  \ without it,\nunification looks simpler but rots into muddier semantics. The decision→spec\
  \ seam is field-level and\nfar from 1:1 — a standing rule may also already be homed\
  \ in handbook/pattern prose (rule 8). This\nmeta-spec is itself the PILOT proof:\
  \ a PROCESS rule (the spec doctrine) living in a spec WITHOUT\nrecreating a decision\
  \ — if this body stays free of forbidden content (rule 3 self-applied), the\nbroadened\
  \ identity (rule 1) is demonstrated on itself.\n\n## Verification\n\n- **VP1 (content\
  \ boundary, dogfood):** grep this body — no full rejected-alternatives narrative,\n\
  \  no approval/ratification chronology, no dated audit-finding refs; only concise\
  \ interpreting\n  provenance notes remain (rule 3 ALLOWED set).\n- **VP2 (one activation\
  \ owner):** a `proposed`/`active` (non-grandfathered) spec resolves to exactly\n\
  \  one `activation_owner_task`; other implementing tasks only `cite` it.\n- **VP3\
  \ (non-authoritative):** `status: proposed` + `consumed: false` — governs nothing;\
  \ removing\n  this pilot changes no live behavior.\n- **VP4 (amendment honesty,\
  \ P7):** the `amends:` block names every canonical surface this doctrine\n  changes\
