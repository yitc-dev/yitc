body: "## Scenario\n\nWhen an audit RED/YELLOWs, the AI absorbs findings and re-audits.\
  \ Without a bound this loops\nforever — the auditor re-surveys from scratch, a passable\
  \ cosmetic finding re-burns a pass, a\nbenign freshness re-pin looks like a fresh\
  \ defect — so sound work never converges. The\naudit-loop ceiling is the bound:\
  \ a fixed max number of absorption passes per target per stage,\nand a family of\
  \ ledger-SKIP exemptions for re-audits that are NOT real absorption loops (what\n\
  happens once the ceiling is reached is SPEC-1039's). This spec is the ONE home for\
  \ that machinery;\nSPEC-1040 keeps the invocation/verdict/lens/overlay contract\
  \ and points here.\n\n## Internal\n\n**SUPERSEDES <workshop-spec>.** This spec carries\
  \ <workshop-spec>'s rules unchanged except the trend grant's\nresidual-severity\
  \ condition (§Audit-loop ceiling, «Trend-aware grant»), which admits a `medium`\n\
  residual. What happens at the ceiling in every other case is unchanged (SPEC-1039).\n\
  \nTHE AUDIT-LOOP CEILING. It governs TASK audit-pre/post AND the ceiling-bearing\
  \ PLAN gates; the parent\ncontract (invocation, verdicts, lens, per-stage overlays,\
  \ saved-result schema) stays in SPEC-1040\n(`bin/yitc-v2 graph query SPEC-1040`).\n\
  \n**RARE CEILING CASES → SPEC-1018 (index).** This spec keeps what is needed to\
  \ recognise each\nledger-skip axis and the on-demand consult, and to decide whether\
  \ a pass or a pick is permitted: the\naxes table, and for the consult its entry\
  \ paragraph and its single-survivor clause. The detail of\nthe rare cases — the\
  \ FAIL-CLOSED clauses of the plan-freshness, plan lens-version,\nunchanged-fingerprint,\
  \ plan task-carrier, ship-custody re-pin and post-GREEN merge-integration axes;\n\
  the mechanics of the on-demand consult (how the fork is classified, where its record\
  \ is kept, the\nevent it writes, its scope); and the commit-side door for a late\
  \ finding whose fix is not yet\ncommitted when the audit-post budget is spent, which\
  \ the refusal of an absorption commit past the\nceiling announces — is the reference\
  \ SPEC-1018: read it when a re-audit under one of those axes, an\non-demand consult\
  \ or that refusal is at hand (`graph query SPEC-1018`), from its heading\n«Rare\
  \ ceiling cases».\n\n### Audit-loop ceiling (CHARTER §Principle 1 applied to audits)\n\
  Post-ceiling adjudication is governed by SPEC-1039.\n\nThe ceiling — 2 absorption\
  \ passes per TASK target per audit stage — and how the absorption mode\ndecides\
  \ a pass's charge are stated in SPEC-1040 §Audit-loop ceiling. Past the ceiling\
  \ the route is\n<workshop-spec>'s typed decisions and one bounded pass (never a\
  \ silent loop).\nPushing a passable finding through mode-a is the E-0008 false-ceiling\
  \ defect. (Fuller mode-a/b\ntreatment: LIFECYCLE §Stage 4.)\n\n**Mode-b is VERB-ONLY,\
  \ on all three targets (X-0928).** A mode-b absorption is\nrecorded ONLY through\
  \ the governed route — `audit pre --task T-XXXX --absorb \"<text>\"` for a task\n\
  verdict, `audit pre --plan <slug> --gate <id> --absorb \"<text>\"` for a ceiling-bearing\n\
  PLAN GATE's verdict (gate id per §Plan-target parity below — the SAME five tokens\
  \ `audit consult\n--plan --gate` takes), and `audit adhoc --slug <slug> --absorb\
  \ \"<text>\"` for a saved AD-HOC consult\nrecord. An ad-hoc consult carries no ceiling\
  \ of its own, so on that target the route is\npurely the RECORD: what a later audit\
  \ reads when the consult's findings were absorbed into the\nplan or card it reviewed;\
  \ the record is found in `decisions/` or, once its batch has landed, in the\narchive.\
  \ All three write `absorbed:`/`notes:` on the EXISTING verdict, run NO auditor,\
  \ leave\n`verdict:`/`passes:`/the recorded freshness signature untouched (so mode-b\
  \ burns NO pass — an absorb\nthat generated a re-audit pass would be a ceiling loophole),\
  \ refuse a non-YELLOW record NAMING the\nverdict, and emit `audit_finding_absorbed`\
  \ carrying the target identity. HAND-EDITING any of these\nverdict YAMLs to record\
  \ an absorption is FORBIDDEN (AGENTS §Verb-execution discipline): the hand edit\n\
  skips the deterministic emit, so the absorption is invisible to every later session.\n\
  \n**Trend-aware grant — a bounded +1 on a clearly-converging trend.** At the ceiling\
  \ the session earns\nONE extra pass AUTONOMOUSLY — no owner ask and no recorded\
  \ decision — when all three hold:\n- the per-pass finding-count trend is STRICTLY\
  \ DECREASING across every recorded pass (each pass has\n  fewer findings than the\
  \ one before it); a FLAT (2->2) or GROWING trend, or a trail that does not\n  record\
  \ a finding count for every pass, is not granted;\n- no residual finding is above\
  \ `medium`. The residual is the finding list of the most recent recorded\n  pass.\
  \ ZERO residual findings is the most-converged state and IS eligible; each present\
  \ residual\n  finding must be `low` or `medium` — a `high` residual, or one whose\
  \ severity is absent or unknown,\n  is not granted (FAIL-CLOSED);\n- at TASK audit-POST,\
  \ the commit under audit is not the commit the most recent recorded pass audited.\n\
  \  An audit-post absorption is a new commit, so on the same commit the extra pass\
  \ could only re-ask\n  about an unchanged diff; with no recorded commit for that\
  \ pass the grant is not given (FAIL-CLOSED).\n  At audit-pre the same plan never\
  \ reaches the grant: an unchanged plan is carried, not re-audited.\nThe grant is\
  \ a single +1: it raises the EFFECTIVE ceiling by exactly one, never two, and only\
  \ at the\npass the +1 unblocks. So a second still-decreasing step at the raised\
  \ cap is not granted, and a case\nthe grant does not admit is blocked exactly as\
  \ before (SPEC-1039). Journal-visible at the GRANT MOMENT via an\n`audit_ceiling_trend_grant`\
  \ event (emitted BEFORE the auditor runs) and durably in the completed\naudit YAML\
  \ + completion events (`trend_ceiling_grant: true`). A trend grant is authorized\
  \ by nobody,\nso its computed trend and residual severities ARE its reason: the\
  \ saved audit YAML records them as\n`trend_ceiling_grant_basis` beside that marker.\
  \ Scope: TASK audit-pre/post, the PLAN FINALIZATION\ngate and the early plan gates\
  \ (draft-specs/specs-trial/trial-accepted/decomposition-executing). The\nplan corpus/lens/task-carrier\
  \ freshness axes still pre-empt it (a stale re-pin is never read as a\nconverging\
  \ trend).\n\n**WHAT HAPPENS AT THE CEILING — homed in SPEC-1039, not here.** This\
  \ spec keeps the ceiling\nITSELF: the pass arithmetic, the ledger-skip axes, the\
  \ trend grant. What happens once the ceiling is\nREACHED is SPEC-1040 §Audit-loop\
  \ ceiling (the core) and **SPEC-1039** (the route). Read it:\n`bin/yitc-v2 graph\
  \ query SPEC-1039`.\n\nRETIRED by <workshop-spec> rule 6 and NOT described here\
  \ any more: the consult EPISODES that adjudicated\nthe ceiling (frozen finding ids,\
  \ retest rounds, the PROCEED/HOLD option pair, `--reopen`), the\n`--owner-reset`\
  \ continuation on `audit pre|post` and its consult-governed basis, the\ndispatched-worker\
  \ AUTO-CONSULT, the `WITHDRAWN`/`CUT` card markers, and the spent-budget commit\n\
  bypass. The dispatched worker's halt at the ceiling: SPEC-1040 §Audit-loop ceiling.\
  \ Every retired\nflag REFUSES with a pointer to that route.\n\nNOT retired, and\
  \ unchanged: `audit consult --on-demand` (the BELOW-ceiling technical-fork pick,\n\
  §On-demand technical-fork consult) and the trend grant above. The PLAN-gate consult\
  \ and\n`plan stage --owner-reset` ARE retired (<workshop-spec> rule 6) and refuse.\
  \ At a plan-gate\nceiling the route is `audit decide --plan <slug> --gate <id>`\
  \ per residual, then\n`plan stage <NEXT> --on-decisions` (<workshop-spec> rule 9).\n\
  \n**The ENGINE drives the continuation, not the worker.** The at-ceiling block fires\
  \ only when\n`audit pre|post` is invoked with prior_passes >= AUDIT_PASS_CEILING\
  \ — i.e. a 3rd invocation. When\n`cmd_audit` records, in a dispatched-worker context,\
  \ a RED that REACHES the ceiling (`prior_passes + 1\n== AUDIT_PASS_CEILING`) or\
  \ a RED on a trend-granted pass — at audit-pre or audit-post, with\n`YITC_EXPECTED_SESSION_REF`\
  \ set and no ledger-skip / carry-forward exemption — it fully persists that\nRED\
  \ (YAML + both completion events) — so the on-disk trail equals a real invocation\
  \ — then raises the\n`WorkerCeilingContinuation` sentinel; the host wrapper catches\
  \ it and RE-INVOKES `audit.cmd_audit`\nONCE in-process. The re-invoked call reads\
  \ the recorded passes from disk and enters the at-ceiling\nblock; no trend grant\
  \ is open to it (the same commit at audit-post, the same plan at audit-pre, or a\n\
  pass already past the +1). Structurally ONE-SHOT: the re-invoked call takes the\
  \ ceiling refusal and\nrecords no pass. SCOPE: audit-pre and audit-post — the Worker\
  \ owes no third call at either stage.\n\nThe re-entry reaches the ceiling refusal,\
  \ which is where the halt naming the\ncard's residual FINGERPRINTS is emitted (<workshop-spec>\
  \ rule 6). Without the continuation a worker's 2nd\nRED would yield with no halt\
  \ row at all, and the controller would read an orphan.\n\n**SCOPE — the ceiling\
  \ itself, not what follows it.** The auto-consult's journal\ncarriers — the event\
  \ `audit_worker_auto_consult_granted`, and `worker_auto_consult` /\n`owner_reset`\
  \ / `owner_reset_basis` / `consult_governed` on the completed record — are RETIRED\n\
  with it (<workshop-spec> rule 6): no route sets them, so no new record carries them,\
  \ and rows already\non disk keep theirs and stay readable. WHAT SURVIVES UNCHANGED,\
  \ and belongs to this spec: the ceiling is not an\nauthority transfer, and a worker's\
  \ dispatched context is read from the EXISTING signal\n`YITC_EXPECTED_SESSION_REF`\
  \ — never a new liveness / autonomy / state machine (CHARTER non-goals).\nThe EARLY\
  \ plan gates keep their own ceiling path in `_run_plan_gate_audit` (§Plan-target\
  \ parity),\nwhich this retirement does not touch; their L3 parity remains the tracked\
  \ deferral.\nSUPERSEDED IN PART by SPEC-1039 rule 9 (the plan-gate arm): what happens\
  \ AT a plan-gate ceiling is now\nthe typed-decision route homed there, and §Plan-target\
  \ parity's consult-governed-only continuation —\ntogether with the plan-gate auto-consult\
  \ deferral above — is retired by <workshop-spec> rule 6. This spec\nkeeps the ceiling\
  \ ITSELF (pass arithmetic, ledger-skips) for plan targets as for task targets.\n\
  TARGET-KIND SPLIT (amended): the 2-pass ceiling is where BOTH kinds reach the decision\
  \ route, but\nwhat follows differs. A TASK keeps 2 + 1 (one `--on-decisions` pass,\
  \ then terminal). A PLAN gate is\ndecision-bounded (`audit.PLAN_GATE_BUDGET`): every\
  \ further round past the ceiling is admitted by a fresh\n`ceiling_decision` on each\
  \ residual of the latest RED row, never by a count and never by silence — <workshop-spec>\n\
  rule 9(f).\n\n**Reject-as-wrong rationale.** Absorption (mode-a/mode-b) is for findings\
  \ the session\nACCEPTS. A THIRD disposition is REJECTING a YELLOW finding as WRONG\
  \ — the auditor was mistaken,\nso the session declines to absorb it AND files no\
  \ follow-up. A reject is neither mode-a nor mode-b\nand burns no pass, but left\
  \ silent it makes the decline UN-AUDITABLE (no trace of why a flagged\npoint was\
  \ overruled). So when a session rejects a YELLOW finding as wrong it MUST record\
  \ a\none-line rejection rationale in the verdict 'notes:' (e.g. \"rejected finding\
  \ N: <why the\nauditor is wrong>\"), making the override auditable. No route records\
  \ it: `audit pre --absorb` writes\na mode-b absorption, which a reject is not, and\
  \ no verb writes `notes:` on a saved audit-POST record —\nescalate to the owner\
  \ and capture a deviation.\nGuidance text only — no new mechanism (CHARTER\n§P1\
  \ F4); surfaced to the worker via the audit prompt's absorption clause.\n\n### Ledger-skip\
  \ axes — re-audits that are NOT absorption loops\n\nThe ceiling counts ABSORPTION\
  \ passes. A re-audit that merely re-verifies an UNCHANGED or benignly-\ndrifted\
  \ subject is not one, so it earns a LEDGER-SKIP. Each axis below is decided from\
  \ the saved\nrecord (plus, where the row names it, git history) — mostly BEFORE\
  \ the auditor runs. The PREDICATE\nand the FAIL-CLOSED clause in each row ARE the\
  \ rule; the `marker` column is the additive-optional\nfield the run records (§Saved-result\
  \ ledger-skip markers).\n\n| Axis | Trigger predicate | Pre-block exempt? | Advances\
  \ `passes`? | Marker | Scope |\n|---|---|---|---|---|---|\n| **Plan-freshness**\
  \ | prior recorded verdict GREEN AND recorded `corpus_signature` DIFFERS from the\
  \ current one (genuinely stale) | YES — allowed to RUN even at/past the pass cap\
  \ | NO, when it comes back a clean GREEN with no findings | `freshness_reaudit:\
  \ true` | `audit post --plan` only |\n| **Plan lens-version** | the saved plan verdict's\
  \ recorded `lens_version` (= `PLAN_FINALIZATION_LENS_VERSION`) DIFFERS from current.\
  \ Fires REGARDLESS of the prior verdict, because a STALE LENS can produce a STALE\
  \ RED | YES | NO, when it returns a clean GREEN | `freshness_reaudit: true` (the\
  \ same ledger-skip as the corpus axis) | `audit post --plan` only |\n| **Unchanged-fingerprint**\
  \ | a TASK audit-pre re-run whose freshly-computed `plan_fingerprint` EQUALS the\
  \ prior audit-pre record (the plan is UNCHANGED) | YES | NO — and the prior verdict\
  \ + findings are CARRIED FORWARD VERBATIM with NO auditor re-invocation, and the\
  \ prior record is judged THREE ways on its auditor root (owner decision 2026-09-19;\
  \ <workshop-spec> §Verdict producer — ABSENCE OF A STAMP IS NOT PROOF NO AUDITOR\
  \ RAN): **ROOTED** (its `verdict_producer` or the `auditor_model` stamp names one)\
  \ → carried, recorded `verdict_producer: {kind: carry-forward, from: <that record>,\
  \ auditor: <copied stamp>}`; **POSITIVELY DENIED** (the record ITSELF states no\
  \ auditor ran — `external_invoked: false`, or its own `verdict_producer.kind: none`)\
  \ → NOT carried, the re-run records ABORT (`verdict_producer.kind: none`, a no-data\
  \ ledger-skip) and a plan edit (mode-a) is the way to a real verdict; **UNKNOWN**\
  \ (a legacy record predating the stamp, which neither names a producer nor denies\
  \ one) → carried UNCHANGED with `verdict_producer: {kind: carry-forward, auditor_root:\
  \ unrecorded}` — it is unstamped because the stamp did not exist when it was written,\
  \ so overwriting it would wedge every benign pre- re-run | `unchanged_fp_reaudit:\
  \ true` | TASK `audit pre` only |\n| **Concurrent-merge-churn** (E-0041) | a post-close\
  \ `--reaudit-after-close` re-audit whose tree drifted ONLY by already-landed-and-audited\
  \ SIBLING commits: the prior audit-post verdict GREEN/YELLOW with a recorded commit\
  \ that is a proper ANCESTOR of HEAD, AND HEAD is exactly the clean RE-MERGE of the\
  \ audited commit with current `main`, with no new observable worker contribution\
  \ (`_concurrent_merge_churn_only`: re-derive `git merge-tree --write-tree <prior_commit>\
  \ main` and check the paths where HEAD's tree DIFFERS from that re-merge are ALL\
  \ inert bookkeeping) | YES — allowed to RUN even at/past the cap, else a passes:3\
  \ re-audit `_die`s before confirming the merged tree is still GREEN | NO — on ANY\
  \ verdict. The CHARGE keys on the TRIGGER, never on the VERDICT: the pass exists\
  \ because MAIN moved, not because the AUTHOR moved, so it is not this card's absorption\
  \ loop to pay for. The auditor STILL RE-RUNS over HEAD — SAFETY rests on a REAL\
  \ fresh verdict confirming the MERGED tree — and a non-GREEN one STILL STOPS the\
  \ land and STILL BLOCKS closure: what is withheld is the ceiling CHARGE, never the\
  \ refusal | `concurrent_merge_reaudit: true` | TASK `audit post --reaudit-after-close`\
  \ only |\n| **TASK lens-version** (X-0117) | a TASK pre/post verdict whose recorded\
  \ `lens_version` DIFFERS from current `TASK_AUDIT_LENS_VERSION` (the TASK-audit\
  \ LENS = the audit overlays PLUS the diff-invisible evidence surfacer `_ac_probe_evidence_events_for`\
  \ the prompt is built from). INDEPENDENT of the prior verdict, because a STALE LENS\
  \ can produce a STALE RED | YES | NO, when it comes back a clean GREEN. The auditor\
  \ STILL RE-RUNS under the corrected lens (SAFETY rests on a real fresh verdict),\
  \ so this takes PRECEDENCE over the unchanged-fingerprint carry-forward — a stale\
  \ lens forces a real re-audit, never a verbatim carry of the stale verdict | `task_lens_reaudit:\
  \ true` | TASK `audit pre` / `audit post` |\n| **Passable-absorption** (E-0008 regression)\
  \ | a TASK `audit post` RE-AUDIT (prior_passes >= 1) whose current verdict is YELLOW,\
  \ carries NO high-severity finding, whose PRIOR audit-post verdict was ALSO YELLOW,\
  \ AND whose audited COMMIT is UNCHANGED from the prior audit (current commit ==\
  \ prior recorded commit). The COMMIT-EQUALITY is the decisive diff-change signal:\
  \ a true mode-b re-run re-audits the SAME commit, whereas a GENUINE mode-a rework\
  \ — even one that stays YELLOW — re-commits via `task commit --absorb` → a DIFFERENT\
  \ commit → NOT passable | NO — deliberately (anti-cx F3): the pre-block contract\
  \ is UNCHANGED, so a prior-YELLOW audit-post AT the cap still `_die`s on a re-run\
  \ | NO. `ledger_skip` preserves the verdict-note record (findings / notes / absorbed\
  \ are written regardless — that IS the mode-b record); only the pass counter is\
  \ withheld, and the verb WARNs that mode-b (record-and-proceed) was the right route\
  \ | `passable_absorption_reaudit: true` | TASK `audit post` only |\n| **Consult-governed\
  \ carry** — RETIRED (<workshop-spec> rule 6) | none: no route admits such a pass\
  \ any more, because the `--owner-reset` grant and the consult basis that admitted\
  \ it refuse | n/a | NO — on an OLD record only; it reads as a pass that did not\
  \ advance `passes` | `consult_governed: true` on an old record (readable; no new\
  \ record carries it) | old TASK `audit pre` / `audit post` and plan finalization\
  \ records |\n| **Plan task-carrier** | the plan's recorded `tasks:` carrier (`_plan_task_carrier`,\
  \ the plan's cites-set recorded in the verdict's `tasks:`) DIFFERS from current\
  \ — a cited task filed/removed OR a status change (e.g. in-progress→done). INDEPENDENT\
  \ of the prior verdict (like the lens axis), because a stale carrier marks the verdict\
  \ STALE (`_require_plan_finalization_ready` clause (d)) | YES | NO, when it returns\
  \ a clean GREEN | `freshness_reaudit: true` (the same ledger-skip as the corpus/lens\
  \ axes) | `audit post --plan` only |\n\n| **Ship-custody re-pin** | `audit post\
  \ --repin-ship` on a TASK: the card's ship LANDED but a BOOKKEEPING self-commit\
  \ (pause/park/wont-do) displaced custody, and `_require_ship_custody_repin` has\
  \ ALREADY proven — fail-closed, before any auditor call — that custody is genuinely\
  \ bookkeeping-shifted, that the named sha IS the displaced ship, that every displacing\
  \ record is diff-limited to bookkeeping, and that the ship landed on `main`. AND\
  \ the saved audit-post record does NOT already pin that ship | YES — allowed to\
  \ RUN even at/past the cap. Grounds are : this re-audits the ALREADY-GREEN LANDED\
  \ SHIP DIFF, never the card's own absorption loop, and the ceiling bounds absorption\
  \ loops. Without it a converged card at the ceiling cannot close AT ITS OWN LANDED\
  \ SHIP — `task close` demands a verdict for the recorded commit and the pass producing\
  \ it is refused | YES — the pass COUNTS, deliberately. Unlike the currency route\
  \ (`status: done`-only) this runs on a LIVE card, so it pays; the charge is the\
  \ second bound | none new — the existing `custody_repin_from` provenance already\
  \ identifies the route | TASK `audit post --repin-ship` only |\n| **Post-GREEN merge\
  \ integration** | an ORDINARY TASK `audit post` at/past the cap whose only delta\
  \ since a GREEN is ONE governed merge with main: the latest recorded audit-post\
  \ verdict (journal order; the saved record agreeing) is GREEN at the custody commit\
  \ A; HEAD is a two-parent merge M whose FIRST parent is A exactly (no commit before\
  \ or after it); a `merge_resolved_by_hand` row of the card names M with `head_before`\
  \ = A, `main_sha` = M's second parent and `resolved_source: merge-msg` (git's conflict-time\
  \ `# Conflicts:` record); every path where M differs from `git merge-tree --write-tree\
  \ A <main parent>` is one of those recorded conflict paths, which must themselves\
  \ be conflicts git re-derives; and a `tests_passed` row postdates the sync (`audit_ceiling.merge_integration_admission`)\
  \ | YES — the ONE pass SPEC-0077 §3a demands for a hand resolution; a GREEN ceiling\
  \ row has no residual for `audit decide` to bind, so without this axis no governed\
  \ route re-audits it | YES — the pass COUNTS (the re-pin posture); ONE-SHOT is the\
  \ bound | `basis: merge-integration` + `merge_integration_reaudit: {merge_commit,\
  \ prior_commit, main_sha, conflict_paths, sync_evidence}` on the row and the saved\
  \ record, beside `sync_merge_ship: A` (closure custody moves onto M) — route provenance,\
  \ NOT a ledger-skip marker | TASK `audit post` ordinary leg only |\n\nThe post-GREEN\
  \ merge-integration row is one exit from a spent GREEN; every exit, with its guard,\
  \ is\none row of the table «Exits from a spent GREEN» in the rare-case reference\
  \ the index paragraph\nabove names.\n\n**FAIL-CLOSED clauses (per axis — these bound\
  \ every row above; when none matches, NORMAL pass\ncounting + the ceiling apply):**\n\
  - **Concurrent-merge-churn:** the skip is UNCONDITIONAL on the verdict — a surfaced\n\
  \  YELLOW/RED/finding does NOT advance `passes`, because the CAUSE of the re-audit\
  \ was main\n  moving, not the author moving, and the ceiling counts the CARD'S OWN\
  \ absorption passes. The\n  RED still STOPS the land and still blocks closure (`task\
  \ close` refuses a RED audit-post and admits\n  GREEN or YELLOW) — this axis\n \
  \ removes the CHARGE, never the refusal. TWO BOUNDS make this ONE-SHOT rather than\
  \ an open loop, and both\n  are properties of the trigger predicate, not added machinery:\
  \ (i) the predicate requires the\n  PRIOR record's verdict to be GREEN/YELLOW, so\
  \ an exempted RED becomes the next run's prior and\n  CLOSES its own exemption;\
  \ (ii) it requires the prior audited commit to DIFFER from the current\n  one, so\
  \ a re-audit at an UNMOVED HEAD is charged normally. An uncharged pass therefore\
  \ costs\n  main genuinely advancing again — real external progress, never a self-spun\
  \ loop — and\n  `_INLAND_REAUDIT_MAX_PER_LAND` bounds the in-land caller a second\
  \ time per land. What is\n  UNCHANGED: a worker's OWN post-audit SOURCE edit leaves\
  \ an observable\n  differing path -> NOT exempt -> a real counted re-audit, so the\
  \ genuine-recovery case is\n  PRESERVED. A merge-tree CONFLICT is likewise NOT exempt\
  \ -> EXCEPT when EVERY conflicting path is\n  INERT : a sync merge that regenerated\
  \ a DERIVED artifact both sides rebuilt conflicts on a path whose content the audit\
  \ never judged\n  and `land` rebuilds anyway. The conflict paths are classified\
  \ through the SAME\n  `_classify_inert_paths` authority the differing-path check\
  \ uses (SPEC-0064 §4 — no second inert\n  encoding, no new flag): ALL-INERT falls\
  \ through to that differing-path check, which still decides\n  (the conflicted blobs\
  \ carry markers, so those paths reappear in the diff); ANY OBSERVABLE\n  conflict\
  \ path -> NOT exempt, exactly as before. A NARROWING inside this axis's invariant\
  \ «only\n  pure concurrent-merge churn is exempt», never a conflict waiver — additionally\
  \ fail-closed on a\n  non-conflict rc, on rc==1 with no readable CONFLICT line,\
  \ and on any conflict KIND other than\n  `CONFLICT (content)`.\n- **TASK lens-version:**\
  \ its ONE-SHOT clause is in SPEC-1040 §Audit-loop ceiling.\n- **Passable-absorption:**\
  \ a prior RED/ABORT (a GENUINE blocker that forced this re-plan — mode-a\n  rework),\
  \ ANY high-severity finding (genuinely changes the plan/diff), OR a CHANGED / missing\n\
  \  audited commit (a genuine re-committed rework) falls through to NORMAL pass counting;\
  \ a first\n  audit-post (prior_passes==0) always counts. At the cap, mode-b is to\
  \ RECORD the passable finding on\n  the already-recorded YELLOW verdict: file its\
  \ follow-up (`followup add` or `task file`), then\n  `audit post --task T-XXXX --followup\
  \ <id>` (audit-post has no `--absorb`, so no verb writes its\n  `notes:`), and PROCEED\
  \ to `task close` (the existing Stage-8\n  YELLOW close route), NOT to re-run `audit\
  \ post`; a genuine re-audit past the ceiling takes the SPEC-1039\n  decision route.\
  \ Because a passable absorption never advances `passes`, a sequence\n  of passable\
  \ absorptions can NEVER push sound work to the ceiling — the E-0008 sub-cause-1\
  \ deadlock\n  is prevented at its source, not patched at the wall.\n\n- **Consult-governed\
  \ carry:** UNREACHABLE for a new pass — the `--owner-reset` grant and the consult\n\
  \  basis that admitted it are retired (<workshop-spec> rule 6). The row stays so\
  \ a record\n  already carrying `consult_governed: true` reads correctly; its clause\
  \ is cut.\n\nEvery axis extends the ONE ledger-skip mechanism in-place (`cmd_audit`\
  \ `ledger_skip`) — no parallel\ncounter, no new gate.\n\n**Ceiling-convergence triage\
  \ — RETIRED (<workshop-spec> rule 6).** Its convergence rules and the\nwithdrawn\
  \ full-verdict HOLD rule are cut from this spec; the route past the ceiling is SPEC-1039\
  \ rules 1-3.\n\n**On-demand technical-fork consult (lever #6) — a BELOW-ceiling\
  \ consult ENTRY for a design\nfork.** This is a separate, NARROW consult ENTRY for\
  \ a session standing at a\nTECHNICAL DESIGN FORK (a plan's specs, the decomposition\
  \ cut, or a task's Analysis) BEFORE any audit\nceiling: `audit consult --on-demand\
  \ --task T-XXXX --option … --option …` runs the SAME consult engine\n(`_consult_adjudicate`)\
  \ with the SAME strict survivors schema, but BYPASSES the ceiling-exhaust\nprecondition.\
  \ It is a 1:1 copy of how the owner manually consults the external on a fork — the\
  \ auditor\nRATIFIES technical merit, the owner keeps a lightweight ratify/veto;\
  \ it does NOT transfer value/draft\nauthority (the framing constraint #1 — reduce\
  \ owner LOAD, not owner AUTHORITY).\n- **FAIL-CLOSED on single-survivor.** >=2 variants\
  \ are required (a single variant REFUSES — the\n  existing >=2-options check). The\
  \ ONLY auto-proceed outcome is a GREEN/YELLOW with EXACTLY ONE\n  surviving variant\
  \ + a matching recommendation (the existing strict `_parse_consult_result` reading);\n\
  \  a disagreement, a multi-survivor, a value/draft escalation, or any ABORT does\
  \ NOT auto-pick — it\n  escalates to the owner. The owner still ratifies/vetoes\
  \ the single survivor (the lightweight gate).\n\n**Owner-authorized ceiling continuation\
  \ — `--owner-reset` — RETIRED (<workshop-spec> rule 6).** Its basis, freshness,\
  \ journal-carrier, re-open and escape rules, and the post-close\nrebaseline consult\
  \ basis, are cut from this spec: the flag\nrefuses on `audit pre|post` and on `plan\
  \ stage`, naming the <workshop-spec> route.\n\n**Owner-facing escalation-summary\
  \ honesty + overlay-first (X-).** When\nthe ceiling escalates — a DISPATCHED worker's\
  \ `bg_dispatch_halted` marker OR the INTERACTIVE ceiling\n`_die` — the summary the\
  \ owner reads MUST NAME each RESIDUAL finding's REAL\nseverity + governance class\
  \ (e.g. `high, P8-adoption`), taken VERBATIM from the recorded finding's\n`severity`\
  \ (absent → `unknown`), NEVER softened. Rendered by `residual_findings_summary`\
  \ /\n`finding_class` over the prior audit record's `findings` (the escalation carries\
  \ a\n`residual_findings_summary` field on the `bg_dispatch_halted` marker) — a keyword-sniff\
  \ class, no new\ntaxonomy store (anti-cx F1/F2). SECOND half — **prefer the deferred-adoption\
  \ overlay flag first:**\nfor a GENUINE deferred-adoption RED (a residual classed\
  \ `P8-adoption`), the\nescalation POINTS at the purpose-built overlay flag (`--event-emit-only`\
  \ / `--land-emitted-event` /\n`--host-config` / `--serve-deploy`, the <workshop-spec>\
  \ overlay family) as the non-owner path to try FIRST.\nGuidance only — no new gate;\
  \ the overlay flags are unchanged.\n\n### Saved-result ledger-skip markers (the\
  \ ceiling's YAML side-effects)\n\nEvery marker named in the §Ledger-skip axes `marker`\
  \ column is written on the saved audit-result\nYAML (canonical schema home: SPEC-1040\
  \ §Saved audit result + AGENTS §Saved audit result schema) as\nan ADDITIVE-OPTIONAL\
  \ field: present ONLY on the run its axis describes, ABSENT on every other run\n\
  (never `false`). It signals that `passes` was NOT advanced for that verdict. This\
  \ trail is what the\nceiling reads to enforce itself, and it enables post-hoc \"\
  which verdict governed which ship\" + drift\ndetection. ONE further marker rides\
  \ the identical additive-optional shape but is NOT a ledger-skip\naxis: `tooling_absence_abort:\
  \ true`, present ONLY on the transient no-read-tooling ABORT\n(rule home: SPEC-1040\
  \ §Verdict handling ABORT exception). `consult_governed: true` is an\nOLD-RECORD\
  \ field: only records written by the retired consult-governed `--owner-reset` continuation\n\
  carry it (<workshop-spec> rule 6 — no new record does), with `notes` holding the\
  \ consult artifact path +\nverdict + recommendation. On such a record it reads as\
  \ the ledger-skip marker of the retired\n§Ledger-skip axes Consult-governed-carry\
  \ row: that pass did not advance `passes`.\n`merge_integration_reaudit` rides the\
  \ same additive-optional shape but is NOT a ledger-skip\nmarker: it records the\
  \ post-GREEN merge-integration ROUTE, and that pass advances `passes`.\nRELATEDLY,\
  \ every TASK audit (pre/post) verdict records `lens_version:\n<TASK_AUDIT_LENS_VERSION>`\
  \ (the lens version it was rendered under; drives the TASK lens-version\naxis) —\
  \ additive-optional, task audits only, the task analog of the plan `lens_version`.\n\
  \n**ONE marker also rides the JOURNAL, not the YAML alone.**\n`concurrent_merge_reaudit:\
  \ true` is ALSO spread into the run's EXISTING `audit_post_completed`\nand `external_audit_completed`\
  \ rows, in the same additive-optional shape as `owner_reset` /\n`trend_ceiling_grant`\
  \ / `custody_repin` — present ONLY on a merge-triggered pass, ABSENT (never\n`false`)\
  \ on every other run. NO new event type: the SPEC-0025 catalog is untouched and\
  \ no new\nemit path is added. WHY the journal and not the YAML alone — after this\
  \ marker is the\ndiscriminator for whether a pass was charged at all, and the saved\
  \ YAML is OVERWRITTEN in place\nby the next pass, so a reader asking «was this pass\
  \ charged, and why not?» across a card's\nhistory has only the journal to ask. The\
  \ other markers in this section stay YAML-only; this one\nis named because it is\
  \ the one the ledger's own history is read from.\n\n## Rationale\n\nHistory of this\
  \ spec's rules is recorded in this section (placement rule: <workshop-spec> rule\
  \ 3).\n\n### History moved out of the rule body\n\nThe passages below stood in the\
  \ rule text and were moved here verbatim; the rule they\nsat in is unchanged.\n\n\
  - **Scenario:** (re-homed from the audit contract <workshop-spec> by — a stable-surface\
  \ split,\n  <workshop-spec> §7 / rule-6 anti-oversize)\n\n- **Internal:** Re-homed\
  \ VERBATIM from the parent contract <workshop-spec> (its former audit-loop-ceiling\n\
  \  section; stable-surface split, <workshop-spec> §7).\n\n- **Audit-loop ceiling\
  \ (CHARTER §Principle 1 applied to audits):** measured on the plan side by\n  X-0928,\
  \ where 5 absorbed gate-specs findings left no journal record at all, and on the\
  \ ad-hoc side\n  by a consult whose 16 absorbed findings the next gate auditor read\
  \ as contradicted by the record's\n  empty `absorbed:` list.\n\n- **Audit-loop ceiling\
  \ (CHARTER §Principle 1 applied to audits):** But a REAL dispatched worker, after\n\
  \  its 2nd audit-post RED (which RECORDS passes == cap), follows its SPEC-0103 preamble\
  \ and HALTS — it\n  never makes that 3rd call, so the path was STRUCTURALLY BYPASSED.\n\
  \n- **Audit-loop ceiling (CHARTER §Principle 1 applied to audits):** What the re-entry\
  \ used to reach was\n  the auto-consult grant\n\n- **Ledger-skip axes — re-audits\
  \ that are NOT absorption loops:** (measured 2026-09-12)\n\n- **Ledger-skip axes\
  \ — re-audits that are NOT absorption loops:** (: the GREEN build was\n  discarded\
  \ and re-claimed)\n\n- **Ledger-skip axes — re-audits that are NOT absorption loops:**\
  \ (graph/index.json is the measured\n  case)\n\n- **Ledger-skip axes — re-audits\
  \ that are NOT absorption loops:** so the bare rc!=0 short-circuit read\n  that\
  \ as new observable content and defeated an audited re-baseline forever.\n\n- **Saved-result\
  \ ledger-skip markers (the ceiling's YAML side-effects):** It was previously listed\n\
  \  here as a non-ledger-skip marker; that is superseded.\n\n- **Ledger-skip axes\
  \ — re-audits that are NOT absorption loops:** The retired ceiling-convergence\n\
  \  triage was the pass-3 step and refused below the ceiling.\n\n- **Post-close reaudit\
  \ exit — a done-but-UNLANDED task IS admitted (the circle):**\n  What USED to be\
  \ the exit — a HEAD-pinned consult on that target re-opening a spent `--owner-reset`\n\
  \   — is retired with both the consult basis and the reset.\n\n- **Ledger-skip axes\
  \ — re-audits that are NOT absorption loops:** (git history keeps it)\n\n- **Ledger-skip\
  \ axes — re-audits that are NOT absorption loops:** (git history keeps them)\n\n\
  - **Ledger-skip axes — re-audits that are NOT absorption loops:** (git history keeps\
  \ them)\n\n### Trend grant admits a medium residual\n\n- The grant was born with\
  \ (examples 3->1, 2->1) as the autonomous sibling of the since-retired\n  `--owner-reset`;\
  \ extended it to the plan finalization gate to the early plan gates\n  (the predecessor\
  \ still called that a tracked deferral after it), and added\n  `trend_ceiling_grant_basis`.\n\
  - Why a medium residual now qualifies: cross X-2028 item 4 (<project>, 2026-10-01..16)\
  \ — 24 of 140\n  cards reached the audit-loop ceiling, 47 of 54 ceiling decisions\
  \ were `fix`, and those cards took a\n  median 66 minutes against 39. The low-only\
  \ grant fired 11 times in that window. Owner decision\n  events.jsonl#ts= (item\
  \ 4, option A): widen the grant from all-remaining-low to\n  medium-or-lower when\
  \ the finding count strictly falls and no high finding remains. Kept by the\n  same\
  \ decision: strictly fewer findings than the previous pass, no `high` residual,\
  \ one extra pass.\n\n### Halt on every ceiling reach; no grant on an unchanged commit\n\
  \n- Cross X-2032 (<project>, 2026-10-17): an audit-pre pass-2 RED in a dispatched\
  \ worker wrote no\n  halt row, so the Controller saw no residual fingerprints —\
  \ the continuation was audit-post only.\n  Cross X-2035: an audit-post pass-2 RED\
  \ re-entered, took a trend grant and spent pass 3 at once on\n  the same commit\
  \ (identical RED), then wrote no halt row. The route (in place, not a successor\
  \ spec)\n  is the on-demand consult of : it restores what <workshop-spec> §Audit-loop\
  \ ceiling already states\n  — the audit verb itself writes the halt row at the ceiling,\
  \ and the worker owes no second row.\n\n## Implementation notes\n\n- The admission\
  \ predicate is `is_trend_convergence_grant` over `finding_count_trend` (both in\n\
  \  `bin/lib/audit.py`): a pure function of the prior saved record — its `passes_trail`\
  \ counts plus\n  its own `findings` — decided before the auditor runs. It is target-agnostic;\
  \ `cmd_audit` (task\n  pre/post, plan finalization) and `_run_plan_gate_audit` (early\
  \ plan gates) call it.\n\n## Verification\n\n- `tests/test_t9682_trend_aware_ceiling.py`,\
  \ the `test_t13986_*` arms: a ceiling pass whose\n  findings fell 3 -> 2 with severities\
  \ {medium, low} is granted the next pass (red on the low-only\n  predicate); a `high`\
  \ residual, an equal and a larger count are not granted; the grant stays one\n \
  \ pass, journaled by one `audit_ceiling_trend_grant` row.\n- `tests/test_t13997_ceiling_halt_on_every_reach.py`:\
  \ a worker's ceiling-reaching audit-pre RED writes\n  one halt row with residual\
  \ fingerprints; an audit-post re-entry on the same commit spends no grant\n  pass\
  \ and halts; a changed commit keeps the grant; a trend-granted RED also halts.\n\
