  - **VP21 (SPEC-0150 executable-key ownership) — an ACTIVATION precondition, like VP9:** every
    kernel-executed key this spec's `born:` template registers (`cases` and its `case` / `match` /
    `exempt` / `reason` / `declared_at` / `restore_after` / `window_days` members) carries a
    `kernel-executed reader=… effect=…` chain, and `bin/yitc-v2 graph conformance` stays GREEN once
    this concern goes active — i.e. no `_key_ownership_violations` and no `_ownership_chain_break`
    row names this section. Probe: run `graph conformance` at the activating close; a key registered
    without a reachable reader→effect chain FAILS it. The failure mode caught is SPEC-0150's own
    born-failing case (`classes.C1.restore_drill`: seeded as kernel-executed with zero readers), which
    is what a carrier declared before its reader ships looks like when nobody checks.
  - **VP22 (rule 5, the inoperative-brake honesty) — differential on whether the judgement is made:**
    in a project where NO case-linked post-close capture carries `kind: defect`, the automatic
    restoration does NOT fire and the case is surfaced to the rule 7 review as a `restore` candidate
    whose BASIS is labelled *absence of observation*; in a project where the judgement IS made, K
    attributions still restore automatically exactly as before. Probe: two fixtures differing ONLY in
    whether the linked captures carry `kind: defect`, with opposite carriers — automatic in one, the
    review in the other. A fixture where BOTH fire would prove the automatic path was widened to
    `kind`-less captures (the brake-that-fires-on-everything this rule rejects); a fixture where
    NEITHER fires would prove the honesty clause removed the safeguard instead of re-homing it. The
    failure mode caught is the measured one: three consumers with zero `defect` judgements in their
    whole history, each of which would otherwise be told it had an automatic brake.
  - **VP8 (rule 7):** a recorded review run carries at least one proposal with all four fields, and
    an absence-of-observation basis is labelled as such. Probe: read the recorded run.
  - **VP12 (rule 1, the widened match) — differential on each leg:** a `class: [a, b]` case matches a
    card of class b (the OR works) and not one of class c; a conjunction case `class: a` + `paths:
    [p/**]` matches a class-a card inside `p/**` and does NOT match a class-a card outside it (the
    conjunction narrows rather than widens). Probe: four fixtures, two matching and two not — a
    conjunction that matched on either leg alone would be the defect this catches.
  - **VP13 (rule 9, report-only + live):** a review run over a window in which a case exempted cards
    reports that case's ACTUAL share, and a wide share still ACCEPTS every close — the number informs,
    it never refuses. Probe: two review runs over windows with different exempted shares for the same
    case produce different reported shares (so it tracks the live population, not a stored estimate),
    and a case that exempted nothing in the window reports zero rather than being omitted.
    **Differential on WHICH window, added by trial cycle 19's correction:** over ONE fixed journal,
    (i) two review runs whose gap is the observed cadence — a second review run the SAME day as the
    first — report the SAME share, computed over the case's `window_days`; and (ii) the same journal
    read under a case declaring a SHORTER `window_days` reports a DIFFERENT share. Two comparisons,
    opposite sensitivities: the share must be INSENSITIVE to when the previous review ran and
    SENSITIVE to the case's own `W`. A probe passing (i) only by reporting zero, or one where the
    same-day second run yields an undefined/empty denominator, proves the share is still being
    computed since-last-review — which the measurement says is the usual case, not an edge one: the
    median inter-review gap is 0 days on all four projects and the kernel has zero closed cards in
    its most recent such window (cycle 19). Default `W` = 90 where the case declares none.
  - **VP10 (rule 5, attribution carrier) — BOTH ends of the join are catalogued:** SPEC-0025 documents
    `exempted_case` as an optional key on **both** the `deviation_captured` payload (the attribution
    end) and the `task_closed` payload (the closure end rule 4 records) before this spec is activated,
    and the restoration reader resolves attributions through those documented keys. Probe: read BOTH
    SPEC-0025 catalog entries, plus a fixture where an attribution naming a case is counted and one
    omitting the key is not. A catalog carrying only the capture end FAILS this probe: the regime is
    computed by joining the two, so a documented capture key and an undocumented closure key leave the
    computation resting on an uncatalogued field (plan-check F2, 2026-08-15).
