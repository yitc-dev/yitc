    audit_scrutiny:
      # SPEC-0178. OPT-IN. Absent ⇒ every substantive task takes audit-post — the fail-closed
      # default, and the state every project starts in. Declaring a case is an explicit acceptance
      # of risk by the project, recorded with its reason.
      #
      # EXECUTABLE-KEY OWNERSHIP (SPEC-0150). Every key below is kernel-executed — the kernel READS
