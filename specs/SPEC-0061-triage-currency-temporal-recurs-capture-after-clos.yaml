id: SPEC-0061
title: Triage currency — temporal recurs (capture-after-close) + fuzzy Section-A dedup
status: active
created_at: 2026-06-09 08:59:49+00:00
consumed: false
implements:
- bin/lib/triage.py#_currency_status
- bin/lib/triage.py#cmd_triage_run
- bin/lib/triage.py#cmd_triage_remedy
- bin/lib/triage.py#_remedy_sweep_index
body: "## Scenario\n\nAfter a fix-task closes a defect, a later triage run must NOT\
  \ re-offer that already-fixed problem\nas into-work — unless the problem genuinely\
  \ came back. The owner sees: \"we ran triage, fixed it,\nran triage again — and\
  \ the old item does not resurface as a duplicate\", while a real regression DOES\
  \ surface.\n\n## Internal\n\nExtends <workshop-spec> — the into-work currency classifier\
  \ (`_currency_status`; the route table + 5\ncurrency tokens + recurs, carved out\
  \ of SPEC-0056 §1(5)/§5). Three rules (R-A/R-D/R-C):\n\n### R-A. Temporal recurrence\
  \ (capture-after-close)\nFor a fingerprint OWNED by a `done`/`Final` fix-task (LINK-RULE\
  \ owner, SPEC-0055/<workshop-spec>),\n`recurs` is TRUE **only if at least one capture's\
  \ `ts` is strictly AFTER the owning fix-task's\n`closed_at`** (the recurrence post-dates\
  \ the fix). An all-time capture count ≥ 2 is **NOT** by\nitself recurrence: captures\
  \ at or before the owner's `closed_at` are the SAME incident (caught\nwhile the\
  \ fix was being built), not a regression.\n- done/Final owner + a post-`closed_at`\
  \ capture ⇒ **REGRESSED** (into-work).\n- done/Final owner + only pre/at-`closed_at`\
  \ captures ⇒ **ALREADY-FIXED** (NOT into-work).\n- NO done/Final owner (no `closed_at`\
  \ to compare) ⇒ the prior count-based signal is UNCHANGED\n  (a no-owner fp recurring\
  \ N≥2 stays a promotion candidate). Multiple owners: the LATEST\n  `closed_at` among\
  \ done/Final owners is the comparison boundary. **Case-id-cited fix-task (E-0036):**\
  \ when a `resolved` case-file records its fix via `resolution.fix_task` and that\
  \ done fix-task cites the CASE-ID (not the fingerprint), the fix-task is ABSENT\
  \ from the fingerprint's cites-owners; resolve it as a done LINK-RULE owner so its\
  \ `closed_at` IS the comparison boundary — else all-pre-fix captures read a false\
  \ REGRESSED instead of ALREADY-FIXED (realised in `_resolved_case_fix_owner`). **Landed-root-fix\
  \ case, no fix-task :** a case\n  resolved by `error resolve --root-fix` records\
  \ `resolution.kind: root_fix_landed` with its `root_fix`\n  as PROSE and NO `fix_task`\
  \ at all, so the E-0036 clause above can never resolve it and every capture —\n\
  \  including ones long predating the fix — fell through to a false REGRESSED (measured\
  \ 2026-08-30: half\n  of one run's 8 REGRESSED verdicts were false, all of this\
  \ one shape; E-0058 reported 83x REGRESSED\n  with its last capture 16 days BEFORE\
  \ its fix landed). Such a case carries no date anywhere in its\n  YAML, so its boundary\
  \ is the ts of its own `error_resolved` journal row — the datable instant the\n\
  \  landing was attested (the same carrier choice `_case_closure_index` makes: the\
  \ closure instant is the\n  event's own ts). That is an UPPER bound on the landing,\
  \ which is the same direction this rule already\n  takes for a task boundary. Resolve\
  \ it as a done LINK-RULE owner keyed by the CASE id so this same\n  comparison engages.\
  \ **And where NEITHER shape resolves, the verdict SAYS SO:** a `resolved` case with\n\
  \  no done fix-task and no datable landed root fix has no boundary at all, so `recurs`\
  \ has fallen back to\n  the bare all-time count and carries no information about\
  \ the fix — the row is rendered\n  `boundary-unresolvable` (NOT into-work, and explicitly\
  \ neither REGRESSED nor ALREADY-FIXED) naming the\n  missing fact, never silently\
  \ defaulted to either label. No sixth currency token: an unresolvable case\n  reads\
  \ OWNED-IN-FLIGHT, which is already this branch's non-recurring verdict. **Unlinked-mention\n\
  boundary — a SECOND, WEAKER, EXPLICITLY-LABELLED source, never a linkage source:**\
  \ the\ntwo clauses above both resolve a carrier that is off the `cites:` index but\
  \ still *asserted* by an\nauthor. A third shape is not asserted at all — an artifact\
  \ NAMES the fingerprint in BODY TEXT and\ndoes not carry it in `cites:`, so the\
  \ LINK RULE cannot see it (detected report-only,\nwhich read the mentioning cards\
  \ and confirmed the cites-EXCLUSIVE linkage rule of <workshop-spec>\nCORRECT as\
  \ written). Such a row therefore has no owner and no boundary, and falls to the\n\
  no-done-owner leg above: a bare TRULY-NEW, whatever the truth. Measured over all\
  \ 182 recurring\nrows of the 2026-08-30 read: 32 rows carried the advisory — 22\
  \ (54 occurrences) were — by TIMING only — presumed\nALREADY-FIXED and rendered\
  \ as brand-new work, and 6 (22 occurrences) were POST-CLOSURE\nrecurrences hidden\
  \ as fresh ideas; 4 had no done mentioning card, 0 were undetermined. So a\nmentioning\
  \ card that is `done` AND carries a datable boundary is resolved as a done LINK-RULE\n\
  owner, engaging this SAME comparison with no new comparator (realised in\n`_mention_derived_boundary_owners`)\
  \ — since the third narrowing below, to TIME the captures only,\nnever to decide\
  \ the verdict. **This does NOT redefine ownership and does NOT link\nanything**\
  \ — <workshop-spec> is untouched — and it is bounded by two FAIL-CLOSED gates: it\
  \ fires ONLY\nwhere there is no cites-owner and no case file (a cites-derived or\
  \ case-file verdict is never\ndisplaced, so a mention can fill a vacuum but never\
  \ overrule evidence), and ONLY a `done`\nmentioning card with a datable boundary\
  \ contributes (an OPEN one yields nothing — promoting prose\ninto an OWNED-IN-FLIGHT\
  \ verdict would assert live ownership off a body mention, exactly the claim\n<workshop-spec>\
  \ forbids). **The boundary is always SHOWN, never merged with a citation:** the\n\
  unlinked-mention advisory fires whenever a mention supplied a boundary, naming the\
  \ cards and\nstating the timing, so a mention-sourced reading stays distinguishable\
  \ from a cites-derived one\n( first did this with a MENTION-DERIVED verdict mark,\
  \ retired by the third narrowing). No\nsixth currency token. **And the LATEST-boundary\
  \ rule above is\nload-bearing HERE specifically, because it INVERTS the reading:**\
  \ measured on\n`worktree-sweep-permission-impossible-residue` (12 occurrences),\
  \ read against two of its three\nmentioning cards (closed 2026-08-10) its 2026-08-21\
  \ capture POST-DATES the boundary, while against\nall three — latest closed 2026-08-30\
  \ — the SAME capture PREDATES it (under that was\nREGRESSED vs ALREADY-FIXED; since\
  \ the narrowings below it is the timing note either way). The rule is therefore\n\
  held by REUSING the existing `max`-over-done-owners comparator, never by a second\
  \ expression\nthat could drift from it.\n**Two narrowings (shipped by its re-cut)\
  \ — a mention never ASSERTS a regression,\nand an emitter or subject dates nothing:**\
  \ (i) a mentioning card that is this fingerprint's EMITTER (its own commits\nintroduced\
  \ the fingerprint as a string literal under `bin/` — a whole string token, never\
  \ a comment\nor docstring) or its SUBJECT (a capture of the fingerprint names the\
  \ card in `relates_to` /\n`task_id`) contributes NO boundary in either direction:\
  \ it names the fingerprint because it emits\nit or is what the capture is about,\
  \ not because it fixed anything (`_mention_non_fixers`, fed by\n`_fingerprint_emitter_index`);\
  \ (ii) a recurrence past a remaining mention-derived boundary reads the\nNO-OWNER\
  \ verdict (TRULY-NEW, or ALREADY-BUILT via the remedy gate — still into-work) carrying\
  \ a\nNOT-REGRESSED note, never REGRESSED — only a `cites:` link says a card FIXED\
  \ a fingerprint, so only\na cites-derived boundary may assert a regression (`_currency_status`).\
  \ Measured 2026-09-23: all\nthree mention-derived REGRESSED rows of that window\
  \ were false (emitters and,\nsubject) — the `worktree-sweep-permission-impossible-residue`\
  \ REGRESSED reading above\nincluded, its earlier boundary being its emitter. The\
  \ LATEST-boundary rule is unchanged for every\nother mentioning card; the suppression\
  \ leg left open is closed by the third narrowing.\n**Third narrowing — a mention\
  \ decides NO verdict in either direction.** A card names a\nfingerprint because\
  \ it fixed it, emitted it, is its subject, discusses it, or scopes it OUT, and\n\
  only a `cites:` link says which — so a mention-derived boundary no longer SUPPRESSES\
  \ either: a row\nwhose captures all predate it reads the same NO-OWNER verdict as\
  \ (ii), carrying a NOT-ALREADY-FIXED\nnote. The boundary (still the LATEST `closed_at`,\
  \ still skipping emitters/subjects) survives only\nas a TIMING annotation on the\
  \ route and the unlinked-mention advisory. The independent evidence\nthat turns\
  \ such a row ALREADY-FIXED is a `cites:` link (`task close --closes-fp`, SPEC-0069);\
  \ a\nrecorded remedy naming the card turns it ALREADY-BUILT (R-D). Measured 2026-09-23:\
  \ 24 rows read\nmention-derived ALREADY-FIXED, and some rested on cards that DISCLAIM\
  \ the fingerprint (\nscopes two OUT; calls its one \"a SEPARATE defect... not this\
  \ one\"). The\nMENTION-DERIVED verdict mark added therefore no longer exists: no\
  \ verdict rests on a mention.\nThis REPLACES the bare-count `recurs = all-time count\
  \ ≥ 2` for the done-owner branch (the retired\nrule). The `closed_at` is read from\
  \ the owning task YAML (already present; no new field).\n\n### R-D. The remedy-existence\
  \ verdict has a TRIAGE-TIME carrier (X-1131)\nThe remedy-existence sub-check (<workshop-spec>\
  \ §1, the TRULY-NEW branch this spec extends) requires a\nrecorded verdict before\
  \ a TRULY-NEW candidate is promoted, and `triage run` flags every unswept row\n\
  `⚠ REMEDY-UNSWEPT`. That verdict is recorded in EITHER of TWO carriers, read together\
  \ as ONE\n3-state token:\n- **capture time** — the capture's own `data.remedy_ref`,\
  \ set when the deviation is emitted;\n- **triage time** — `bin/yitc-v2 triage remedy\
  \ --fp <fp> --remedy <ref> | --absent`, recorded\n  against an ALREADY-CAPTURED\
  \ fingerprint (a `remedy_swept` journal row).\n\nThe TRIAGE-TIME record **WINS**\
  \ when both exist: it is the deliberate later act, made with the\nbacklog in view.\
  \ A re-sweep likewise corrects an earlier one (latest wins). Absent a triage-time\n\
  record the capture-time field stands unchanged, so every pre- reading is preserved.\n\
  \n**Why the second carrier is REQUIRED for the rule to be satisfiable at all.**\
  \ The sweep is by\nnature a triage-time act over an ACCUMULATED BACKLOG, so the\
  \ capture-time field is unwritable\nexactly when the rule demands it. Measured:\
  \ since shipped this classifier, ZERO `remedy_ref`\nrows were ever written in the\
  \ kernel's OR <project>'s entire journal history — total non-adoption of\nthe write\
  \ side, in both repos, while <project>'s own backlog sweep had to record 252 verdicts\
  \ as\ntyped `remedy_swept` rows the classifier did not read.\n\n**Why a DISTINCT\
  \ event type, and this is the load-bearing constraint.** The only retroactive route\n\
  the capture-time field left was emitting a SECOND capture carrying the same fingerprint\
  \ — which\nbumps `counts[fp]` to 2 and flips `recurs` True, converting genuinely-new\
  \ singletons into\nFABRICATED recurring promote-candidates. So the sanctioned field\
  \ could not be filled without\nfalsifying the very recurrence signal R-A above refines.\
  \ `remedy_swept` is NOT a capture event, so\n`_scan_captures` never sees it and\
  \ `_capture_fingerprint_counts` never counts it: **recording a\nverdict changes\
  \ NO recurrence count, BY CONSTRUCTION** rather than by care.\n\nFail-closed on\
  \ both axes: the fingerprint MUST already be captured (this records a verdict ABOUT\
  \ a\ncapture, never a back door for inventing one), and EXACTLY one of `--remedy`\
  \ / `--absent` must be\ngiven. Posture is UNCHANGED — the sweep stays AI/owner-PERFORMED\
  \ (the verb records a verdict a\nhuman reached; it never greps for an analog itself),\
  \ and the recording clears the advisory flag\nwithout gating `promote` (CHARTER\
  \ non-goal #7). Realised in `_remedy_sweep_index` /\n`_resolve_remedy` / `cmd_triage_remedy`.\n\
  \n### R-E. A remedy REFERENCE is not a remedy VERDICT — the re-test direction\n\
  `--remedy <ref>` records that an ARTIFACT exists. Only re-running the **ORIGINAL\
  \ FAILING INPUT**\nrecords that the **BEHAVIOUR** changed. R-D's carrier could not\
  \ tell the two apart, and a recorded\nALREADY-BUILT read identically either way\
  \ — which misled in BOTH directions, three weeks apart:\nthe 2026-08-26 sweep marked\
  \ `owner-reset-unreachable-when-consult-survivor-is-hold-for-owner`\nalready-built\
  \ off, which is message-only and says so in its own docstring (a LIVE defect\nretired\
  \ on paper); on 2026-08-31 a reporter read that same artifact, did not re-test,\
  \ and filed\nX-1210 against a defect had already fixed (a DEAD defect resurrected).\n\
  \n**WRITE side — fail-closed on a third axis.** A `--remedy` MUST state its re-test\
  \ direction:\nexactly one of `--retested \"<the original failing input you re-ran,\
  \ and what it did>\"` (⇒\nALREADY-BUILT — a real clearance, `data.retested` recorded)\
  \ or `--no-retest \"<why that input\ncannot be re-run>\"` (⇒ **REMEDY-UNSWEPT**,\
  \ `data.{remedy_ref,retest_absent_reason}` recorded — the\nartifact IS recorded\
  \ and named, the candidate is NOT cleared). A `--remedy` with neither is\nREFUSED.\
  \ `--absent` is untouched: a sweep that found nothing has no behaviour to re-test.\n\
  \n**NO FOURTH REMEDY STATE IS INVENTED.** The inability reuses the EXISTING third\
  \ token, and it\nfails in the CONSERVATIVE direction — the candidate stays flagged\
  \ not-promotable rather than being\nsilently retired on an unverified artifact.\
  \ Likewise NO sixth currency token (SPEC-0056 §5\nenumerates exactly five) and no\
  \ change to into-work membership.\n\n**READ side — HISTORY IS NOT REWRITTEN.** `_remedy_sweep_index`\
  \ returns `(refs, retests)` from ONE\npass over the SAME rows (latest-wins in lockstep,\
  \ no second journal pass). Neutralization keys on\nthe row's OWN recorded `verdict`,\
  \ so every pre- row — verdict ALREADY-BUILT, no `retested`,\nincluding <project>'s\
  \ 252 backlogged verdicts — keeps reading exactly as it did, and R-D's AC3\nconsumer-shape\
  \ promise is intact. What makes those legacy verdicts legible is the MARK\n`_currency_status(retest_absent=)`,\
  \ which ANNOTATES the ALREADY-BUILT route and reclassifies\nnothing — the same annotate-never-merge\
  \ move R-A's `boundary_unresolvable` and\n`mention_derived` already make in this\
  \ classifier. A later `--no-retest` row WITHDRAWS an earlier\nclearance, so a correction\
  \ can actually correct.\n\n**What was NOT built, and why (CHARTER §P1 F1/F2/F3).**\
  \ No probe runner and no per-fingerprint\nrepro store: the sweep is by construction\
  \ an AI/owner-PERFORMED act whose only durable residue is\na reference string, and\
  \ a capture records no re-runnable input to re-run. Building one would be\nthe behavioural\
  \ detector CHARTER non-goal #7 forbids. What is added is one optional field on an\n\
  existing event, one refusal direction on an existing verb, and one mark on an existing\
  \ route\nstring. Realised in `cmd_triage_remedy` / `_remedy_sweep_index` / `_resolve_retest`\
  \ /\n`_currency_status`.\n\n**Verification (RED-GREEN, differential on PRE-FIX-COMPATIBLE\
  \ input — a differential whose pre-fix\nfailure is `unrecognized arguments` proves\
  \ nothing about semantics):**\n- R-E (AC2, read-side, pure data): a `remedy_swept`\
  \ ROW `{verdict: REMEDY-UNSWEPT, remedy_ref,\n  retest_absent_reason}` renders NO\
  \ built verdict and names the missing re-test. PRE-FIX the fold\n  took ANY non-empty\
  \ `remedy_ref` and mapped it to ALREADY-BUILT, so this FAILS on the old\n  semantics,\
  \ with no CLI shape involved.\n- R-E (AC2, write-side, pre-fix-VALID invocation):\
  \ `triage remedy --fp X --remedy <ref>` with no\n  re-test statement — a flag set\
  \ the PRE-FIX verb ACCEPTS — records no ALREADY-BUILT clearance.\n- R-E coverage\
  \ (explicitly NOT differential, the flags do not exist pre-fix): `--no-retest` records\n\
  \  REMEDY-UNSWEPT with the reason; `--retested` still records ALREADY-BUILT.\n-\
  \ R-E regression guards: a legacy no-`retested` ALREADY-BUILT row still reads ALREADY-BUILT\
  \ and\n  not-into-work, carrying the mark; every non-ALREADY-BUILT branch is byte-identical\
  \ under the\n  flag; recurrence counts and REMEDY-ABSENT rendering are untouched.\n\
  \n### R-C. Fuzzy Section-A currency (cited-rollup ONLY)\nSection A (the routing\
  \ window — the section that drives «file a task?») computes `currency_status`\n\
  using the **cited-rollup LINK-RULE cluster** that Section B already applies (`_capture_cluster_counts`,\n\
  the AUTHORITATIVE cite-based rollup). A routing-window capture whose fingerprint\
  \ is a **cited-alias\nmember** of an already-owned root is classified by the ROOT's\
  \ owner status — NOT as a standalone\nexact-string-miss `TRULY-NEW`. This REPLACES\
  \ Section A's exact-only `cites_idx.get(fp)` lookup for\ncurrency (the retired behaviour);\
  \ the cited-rollup function is reused, not duplicated.\n\n**Discovery stem-clustering\
  \ stays out (P5/P7 one-home):** the discovery stem-cluster\n(`_discovery_stem_clusters`)\
  \ is DISCOVERY-ONLY — «a hint, never an authority» (SPEC-0055 §Discovery\nstem-clustering,\
  \ UNCHANGED). R-C does NOT promote it to a routing/currency authority; that rule\
  \ keeps\nliving in SPEC-0055 and is not overturned from here. Only the CITED (authoritative)\
  \ rollup feeds\nSection-A currency.\n\n## Parameters\nNone consumed. `closed_at`\
  \ is read from task state, not a governing scalar.\n\n## Rationale\nReal incident:\
  \ duplicate fix-tasks for already-closed problems (owner-directive 2026-06-09).\n\
  Journal evidence at authoring: 13 of 15 cite-linked recurring fingerprints are owned\
  \ by a `done`\ntask yet read perpetual `REGRESSED` under the bare all-time count\
  \ (false into-work); Section A's\nexact-match misses near-synonym aliases of fixed\
  \ roots. Full deliberation + alternatives: the\nproposing plan `triage-dedup-against-closed-problems-temporal-deri`\
  \ (SPEC-0005 rule 3 — not here).\n\n## Verification\nRED-GREEN (RED on the current\
  \ bare-count / exact-match code):\n- R-A: fixture done-task `closed_at=T`; a capture\
  \ `ts<T` (and count≥2) ⇒ `ALREADY-FIXED`,\n  into-work=no; a capture `ts>T` ⇒ `REGRESSED`,\
  \ into-work=yes.\n- R-A regression-guard: a no-owner fingerprint recurring N≥2 still\
  \ surfaces as a promotion\n  candidate (unchanged).\n- R-D (AC1): a fixture journal\
  \ carrying ONE unswept capture reads `⚠ REMEDY-UNSWEPT`; after\n  `triage remedy\
  \ --fp <fp> --remedy <ref>` the flag is GONE and the row reads ALREADY-BUILT\n \
  \ (`--absent` ⇒ TRULY-NEW into-work, swept clean).\n- R-D (AC2, DIFFERENTIAL and\
  \ load-bearing): `counts[fp]` and `recurs` are IDENTICAL across the\n  recording,\
  \ and the fingerprint gains no Section-B row. This assertion FAILS if the carrier\
  \ is\n  ever re-implemented as a second capture — which is the falsification the\
  \ rule exists to prevent.\n- R-D (AC3): a `remedy_swept` row in the shape a consumer\
  \ already recorded\n  (`data.{fingerprint,verdict,remedy_ref,swept,found,sweep_of}`)\
  \ is consumed by the classifier\n  as-is, with nothing re-emitted.\n- R-C: a routing-window\
  \ capture that is a cited-alias of a `done`-owned root ⇒ shown `linked`\n  (owner\
  \ status), NOT `TRULY-NEW`.\n- real-data soak (trial): the ~13 false-`REGRESSED`\
  \ + the unlinked-alias fingerprints stop\n  reading into-work, while any genuine\
  \ post-close recurrence still does.\n"
