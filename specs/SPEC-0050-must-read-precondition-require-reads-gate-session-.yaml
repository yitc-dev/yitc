  \ SPEC-0036 (the in-progress-only carve-out); rebaseline-honoring sibling: SPEC-0077\
  \ §3a.\n\n### 7. What is removed alongside (P1 F3; ordering)\nThis spec SUPERSEDES\
  \ <workshop-spec> by **NET-REMOVAL of the worktree-attribution layer** and\nRESTORES\
