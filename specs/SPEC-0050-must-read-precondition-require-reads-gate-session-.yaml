  \ — P1\nF3; faithful to the pilot, which left the echo line as-is and moved the\
  \ obligation into the verb). <workshop-spec> → superseded on this\nspec's activation\
  \ ( close).\n\n### 8. The audience-seed read-gate (`_require_seed_read`) — the BROAD\
  \ anti-Forgetting floor\nA SECOND read-gate, a SIBLING of the `--help` verb-inventory\
  \ gate (§2), realizing the\nSPEC-0007 §5 audience-seed floor. It reuses this spec's\
  \ machinery; it adds no new store/hook/format.\n- **Receipt (producer — session\
  \ start OWNS the primitive).** `session start` emits the audience-seed\n  READ receipt\
  \ AFTER it delivers the seed: a `cli_invoked` row whose `data.node_id == SEED_READ_NODE_ID`\n\
  \  (`cli:seed`) — the emit analog of the `--help` fetch-receipt. It necessarily\
  \ post-dates the\n  `session_started` anchor emitted in the same verb, so it lands\
  \ in-window (§2). `session start` is the\n  PRIMARY producer. **One GOVERNED co-producer\
  \ — the dispatch bootstrap.** A dispatched\n  Worker never runs `session start`\
  \ before its FIRST governed verb (`worktree new` — the claim), and\n  its seed only\
  \ auto-injects on `cd` INTO the worktree that `worktree new` creates — the dispatch\n\
  \  chicken-and-egg. So `cmd_dispatch`, at the spawn chokepoint, emits the SAME primitive\
  \ for the\n  ASSIGNED worker session_ref into the MAIN journal BEFORE the spawn:\
  \ a `session_started` (build)\n  anchor + the `seed_read` receipt + the `--help`\
  \ verb-inventory receipt (session_ref override — the\n   diagnostic-emit path).\
  \ This is the SAME `cli:seed` sentinel row, in-window under the anchor it\n  emits\
  \ alongside — it adds NO new event/store/gate (P1 F1/F3), only a second CALL SITE\
  \ for the\n  existing receipt. The worker's `worktree new` then finds the receipts\
  \ present and passes; `seed_read`\n  precedes `worktree_created` by construction\
  \ (emitted pre-spawn).\n- **Gate (`_require_seed_read`) — MIRRORS `_require_help_read`.**\
  \ Same session_ref-anchored PER-JOURNAL\n  evidence windows (§2, no raw union),\
  \ same FAIL-CLOSED no-anchor refusal, same `read_gate_refused`\n  observability\
  \ emit, the same [current + main-checkout] candidate set — now on EVERY governed\
  \ verb, not\n  just `land` ( generalized the carve-out) so a receipt recorded only\
  \ on MAIN (a Controller's, or\n  the launcher's §Receipt co-producer) credits a\
  \ NON-land verb run from a worktree, removing the\n  per-worktree `session start`\
  \ for this gate — and the same single-snapshot + bounded-retry\n  read-consistency\
  \ belt (§2). Refusal `reason`: `no_session_started_anchor` (no valid window in any\n\
  \  candidate), `seed_read_unfetched` (window present, receipt absent), or `seed_read_stale_epoch`\
  \ (receipt\n  present but pre-compact — §epoch below). It proves FETCH of the seed\
  \ (the receipt), NEVER comprehension (§4).\n- **Summary-window lookback bound.**\
  \ The receipt gates' (seed + `--help`) evidence\n  window is anchored at the EARLIEST\
  \ `session_started` of THIS ref the preamble walk finds; the walk never\n  opens\
  \ an ARCHIVE segment wholly older than the SPEC-0190 summary window (`READ_SUMMARY_WINDOW_DAYS`),\
  \ for\n  a refusal and a credit alike, whatever the anchor's shape. The bound is\
  \ SEGMENT-level: the LIVE segment is\n  read whole (rotation keeps it <=7 days in\
  \ production); only an archive segment straddling the window\n  floor drops its\
  \ rows older than the floor instant. A session (or a reused ref's earlier run) older\
  \ than\n  the window is not credited — it re-anchors via `session start` / `--help`\
  \ (fail-closed, cheap). An\n  unreadable window value falls back to the whole-history\
  \ walk (fail-safe). Two runs of one reused ref\n  both inside the window still share\
  \ the earliest anchor (out of scope, fu_2c91525fccd1).\n- **Coverage — GATE-BY-DEFAULT\
  \ at ONE central chokepoint.** `main` calls the gate for EVERY resolved\n  verb,\
  \ AFTER `_auto_sync` and BEFORE the verb runs, UNLESS the verb is in the small SEMANTIC\
  \ allowlist:\n  (a) `session start` (PRODUCES the receipt — gating it would deadlock\
  \ the floor); (b) `event --type\n  deviation_captured` (the from-anywhere capture\
  \ reflex — unconditional by design); (c) pure\n  READ-ONLY verbs, identified by\
  \ the EXISTING `cli_invoked_verb` marker (no mutating verb sets it).\n  `--help`\
  \ exits pre-dispatch and never reaches the chokepoint. FAIL-SAFE DIRECTION: forgetting\
  \ to\n  allowlist a read-only verb only OVER-gates it (harmless friction — the seed\
  \ is one `session start`\n  away); a NEW/unlisted MUTATING verb is gated by default,\
  \ so coverage never silently regresses. This is\n  the BROAD floor the 3-verb `--help`\
  \ gate is NOT — it covers every governed/mutating verb + `dispatch`\n  + the `audit`\
  \ paths.\n- **Relation to `kind=seed` (§1).** This realizes the seed floor via a\
  \ standalone gate on the\n  `_require_help_read` precedent, so `_require_reads`\
  \ `kind=seed` stays RESERVED/unwired — no duplicate\n  mechanism (P1 F1/F3).\n-\
  \ **Epoch-scoping — post-`/compact` freshness.** The gate proves the seed was read\
  \ for the\n  CURRENT CONTEXT EPOCH, not merely once this session. A `/compact` evicts\
  \ the seed from context but\n  emits NO `session_started`, so a session-scoped receipt\
  \ would keep crediting after the compaction —\n  the receipt LIES (the seed-floor\
  \ consult's finding #2). The CONTEXT EPOCH is the count of `/compact`\n  boundaries\
  \ in the provider transcript (`session.session_epoch`, the `compact_boundary` records\
  \ the\n  SAME best-effort log `session context` reads): 0 at a fresh session, +1\
  \ per compaction — a monotonic\n  integer, NOT a timestamp. `session start` STAMPS\
  \ its seed receipt with the epoch at emit\n  (`data.epoch`); `_require_seed_read`\
  \ reads the CURRENT epoch and credits a receipt only when its\n  stamped epoch >=\
  \ current — else refuses `seed_read_stale_epoch` (distinct from the missing-receipt\n\
  \  `seed_read_unfetched`). This is a receipt-STAMP compare, ORTHOGONAL to the §2\
  \ window origin (it does\n  NOT shift the `session_started` lower-bound; the window\
  \ still selects same-session receipts, the\n  epoch check then rejects the pre-compact\
  \ ones). A receipt with NO epoch stamp normalizes to **0** —\n  so pre-change historical\
  \ receipts + test seeds credit while current_epoch==0 (a fresh session / a\n  hermetic-HOME\
  \ test with no transcript) but go stale once a compact advances it; NOT exempt-always\n\
  \  (which would re-open the hole). FAIL-SAFE: `session_epoch` best-efforts to 0\
  \ on any transcript\n  quirk (a log hiccup must never break a governed verb; 0 can\
  \ only under-count → fail toward crediting\n  a present receipt, never toward a\
  \ spurious refusal). **Producer / refresh:** the epoch-REFRESH producer stays `session\
  \ start` (the §Receipt dispatch\n  CO-PRODUCER emits an epoch-0 bootstrap receipt,\
  \ credited by the normalize-to-0 rule above and\n  going stale post-`/compact` like\
  \ any other); post-`/compact` the receipt goes stale and the AI re-runs `session\
  \ start` ONCE to\n  re-stamp the fresh epoch — SANCTIONED + SAFE (EARLIEST-anchor\
  \ keeps the window origin), the narrow\n  exception co-designed in SPEC-0007 §5b\
  \ (§At-session-start \"re-read seed CONTENT by re-reading files\"\n  is unchanged\
  \ — this refreshes the RECEIPT, a different act). The refusal message self-delivers\
  \ this.\n- **Scope bound.** Beyond epoch-scoping (above), the worker-records-before-worktree\
  \ ordering is now\n  RESOLVED : the GOVERNED dispatch bootstrap (the §Receipt co-producer)\
  \ records the worker's\n  receipts on MAIN before the claim, so `worktree new` is\
  \ never a chicken-and-egg deadlock. The\n  worker's LATER worktree stage-verbs (`task\
  \ analyze`/`audit`/`task commit`/`task close`) run\n  `_require_reads` (the STAGE-BUNDLE\
  \ read-gate), whose RECEIPTS are CURRENT-JOURNAL-ONLY (§2; since\n   its window\
  \ ANCHOR also reads the main checkout's `session_started`) — so the stage-bundle\n\
  \  FETCHES must be made in THAT checkout, but a session already anchored on MAIN\
  \ need NOT re-anchor it:\n  its main `session_started` opens the window for the\
  \ worktree-local receipts. A per-worktree\n  `session start` (surfaced in the dispatch\
  \ preamble) stays harmless — EARLIEST-anchor keeps the origin —\n  and is still\
  \ required where the session has no anchor on main. ** note:** the broadened\n \
  \ candidate set is scoped to the RECEIPT gates (`_require_seed_read` / `_require_help_read`)\
  \ — those\n  credit the worker's seed/help receipt from MAIN; `_require_reads` reads\
  \ its RECEIPTS from the current\n  journal only (its ANCHOR alone widens to main)\
  \ — no contradiction, different gate.\n\n### 8a. The BOUNDED read-tolerance exception\
  \ to the seed floor\n\nOwner-decided, externally consulted (`decisions/seedgate-read-tolerance-audit-adhoc.yaml`,\
  \ verdict\n**extend-with-bounds**; extended to a THIRD member by `decisions/-audit-consult-on-demand.yaml`\n\
  under the owner's standing authorization — see MEMBER 3 below). EXACTLY THREE\n\
  verbs — **`debt`**, **`followup list`** and **`profile`** — TOLERATE a\nstale/unbacked/absent\
  \ session ref instead of refusing: they resolve through the NON-DYING keyer twin\n\
  (`_try_resolve_session_ref_with_source`), and on ANY would-be refusal (`session_ref_unresolved`\
  \ /\n`no_session_started_anchor` / `seed_read_unfetched` / `seed_read_stale_epoch`)\
  \ they emit a visible\nfallback WARNING and PROCEED (exit 0) rather than `_die`.\
  \ All three are **pure durable-state folds** —\nread-only observers (`cmd_debt`\
  \ / `cmd_followup_list` / `cmd_profile`: no worktree, no mutation, no\nevent of\
  \ their own — `debt` and `profile` leave only the dispatch seam's `cli_invoked`\n\
  INVOCATION RECEIPT, the very row every clause-(c) read verb already emits past this\
  \ floor\nwith no gate at all, so it is not a write the floor guards) of state\n\
  the journal already owns — so waving them through grants no write the floor was\
  \ guarding, and they\nare the post-`/compact` re-fold surfaces the handbook itself\
  \ tells a starved session to run\n(AGENTS §After-`/compact`). This is an **explicit\
  \ bounded EXCEPTION, never a general weakening** of\nthe SEED-READ floor.\n\n**MEMBER\
  \ 3 — `profile`.** SPEC-0198 declares the verb READ-ONLY in exactly the terms this\n\
  set's membership criterion asks for — «no write, no event of its own, no worktree\
  \ (the `debt` posture)» — and\n`cmd_profile`'s own docstring holds THE SAME POSTURE\
  \ AS `cmd_debt`, deliberately. It is admitted\nbecause a byte-copied consumer's\
  \ SPEC-0145 producer (`bin/security-audit`) is fired by cron/systemd\nwith NO session\
  \ and NO anchor in its checkout, while the SPEC-0093 carrier it reads declares\n\
  `<engine>/bin/yitc-v2 -C <repo> profile --json` as its route to the ONE derivation\
  \ site\n(`bin/lib/profile.py#resolve_profile`). A read-only VIEW verb refusing that\
  \ real trigger on\n`no_session_started_anchor` starved the seam entirely — the gap\
  \ measured by audit-post. The\nextension was ratified on technical merit by the\
  \ external consult\n`decisions/-audit-consult-on-demand.yaml` (GREEN, single survivor:\
  \ «`profile` satisfies the\ntolerance set's existing pure-fold criterion, reuses\
  \ the bounded exception mechanism, and enables the\nrequired session-less consumer\
  \ seam») and decided under the owner's standing authorization. Every\nbound below\
  \ survives unchanged: still a CLOSED enumeration, still the stderr fallback WARNING,\
  \ still\nthe `selected_source=` / `fallback_reason=` telemetry — so the set grew\
  \ by one measured member, and\nits shape did not change.\n\n**Homing (why HERE and\
  \ nowhere else).** The consult said to home the exception in the\n«<workshop-spec>/SPEC-0050\
  \ seed-read floor» rather than in a detached new rule. That family is ONE lineage:\n\
  **<workshop-spec> → superseded by <workshop-spec> → superseded by SPEC-0050 (active)**.\
  \ Only `active` is normative\n(GRAPH §What a spec is FOR), and `superseded` specs\
  \ are frozen history — `spec edit` refuses them. So\nthe exception is homed in the\
  \ ACTIVE lineage head, THIS spec, and nowhere else: <workshop-spec> and <workshop-spec>\n\
  are deliberately left UNCHANGED and carry no pointer to it. Reading a rule off a\
  \ superseded ancestor is\nnever correct; resolve the lineage head instead.\n\n-\
  \ **BOUND 1 — scope (fail-closed elsewhere).** The allowlist is a CLOSED set of\
  \ exactly those three\n  verb labels. Every **mutating, stage, seed-delivery and\
  \ session-guidance** verb keeps the strict\n  fail-closed path VERBATIM — `followup\
  \ drop`, the adjacent mutating sibling of a tolerated verb, is\n  the standing differential\
  \ witness. The chokepoint's fail-safe direction is preserved: a NEW or\n  unlisted\
  \ verb is strict BY DEFAULT, and a tolerant verb whose non-dying twin is not injected\n\
  \  degrades to STRICT (never to open).\n- **BOUND 2 — the anti-Forgetting nudge\
  \ survives.** A tolerated read is NEVER silent: it prints a\n  visible fallback\
  \ WARNING to stderr naming the bypass and the remediation (`session start`).\n \
  \ Tolerated output is **OBSERVATIONAL ONLY** — it is not a governance surface, and\
  \ a starved\n  controller MUST NOT base an out-of-band decision on it before hitting\
  \ a strict verb.\n- **BOUND 3 — visibly auditable.** That warning carries the machine-readable\
  \ telemetry\n  `selected_source=` (the selector that produced the ref — `expected_contract`\
  \ / `env:<CARRIER>` /\n  `worktree_stamp` / `runtime_record`, or `unresolved`) and\
  \ `fallback_reason=` (which of the four\n  gate reasons WOULD have refused), reusing\
  \ the resolution-telemetry vocabulary.\n\n**No new event type.** A tolerated PASS\
  \ is deliberately NOT recorded as `read_gate_refused`: that\nevent is the refusal\
  \ umbrella whose `kind` enum is LOCKED (SPEC-0025 / SPEC-0059 §enforcement-split\n\
  splits the refusal numerator by it), so recording a pass there would poison the\
  \ metric and make the\nname lie. The warning line is the machine-readable carrier\
  \ — no new event, store, flag or classifier.\n\n**Freshness containment.** The allowlist\
  \ is defined INSIDE `bin/lib/gates.py#_require_seed_read` — a\nsigned `implements:`\
  \ anchor of this spec — not as a module-level constant. Widening the bound therefore\n\
  necessarily changes that anchor's content signature and trips spec-freshness; the\
  \ bound cannot drift\nsilently. (A module-level constant would sit outside every\
  \ signed anchor — the audit-pre finding that\nreshaped this design.) The PASS path\
  \ is untouched: a session with a fresh receipt sees no warning.\n\n## Rationale\n\
  \nThe worktree-attribution (`worktree_ref` discriminator) was added to stop a within-fleet\n\
  cross-credit between Agent-tool background siblings that SHARED one provider `session_ref`.\
  \ That\nshared-ref fleet mode is no longer the operating model: dispatch is now\
  \ SEPARATE provider\nsub-sessions, each with a DISTINCT `session_ref` (plan\n`dispatch-via-sub-sessions-only-subagents-forbidden`\
  \ §Findings H1 = PASS, live 2026-06-07 — 3\nconcurrent `the AI provider -p` sub-sessions\
  \ got 3 distinct session_ids natively; V2 carries no in-process\nshared-ref fleet\
  \ code). With distinct refs the discriminator is dead weight — and it actively\n\
  HARMED the solo-sequential case (Principle 1 F3 + a real defect fix): a `task/`-branch\n\
  discriminator over-rejected a fetch made earlier in the SAME session under a different\
  \ task, so a\nsession that legitimately fetched a contract was forced to re-fetch.\
  \ Removing it is net-removal\n(fewer lines, no new mechanism — P1 F3) AND a correctness\
  \ fix. Existing analog (P1 F1): the\n audit-pre freshness gate in `task execute`\
  \ (same verb-precondition class). The\nsession_ref-only model is the proven, previously-shipped\
  \ <workshop-spec> design.\n\n## Verification\n\n(1) UNIT — `_fetched_spec_ids(session_ref,\
  \ lower_bound)` is 2-arg; a `cli_invoked{node_id}` of\nTHIS session_ref with `ts\
  \ >= lower_bound` credits regardless of any prior task context (no\nworktree discriminator)\
  \ → `_require_reads(\"stage\", Closure)` does NOT raise (cross-task\nsame-session\
  \ credit, the over-reject fix). (2) STATE — `_credits_under_worktree` /\n`_worktree_ref_of`\
  \ no longer exist on the module; `grep bin/yitc-v2 worktree_ref` → 0 hits.\n(3)\
  \ REGRESSION — the <workshop-spec> properties hold: empty-session REFUSE with ready\
  \ commands;\nanother session's fetch does NOT satisfy THIS session's gate; ts lower-bound\
  \ excludes\npre-session reads; pre-worktree materialized read is credited in a fresh\
  \ checkout.\n(4) live-trigger (P8): `task close` / `task commit` REFUSE on an empty-session\
  \ journal in a\nsandbox checkout, then PASS after the fetch.\n(5) EARLIEST-anchor\
  \ — `_session_started_lower_bound(ref)` returns the EARLIEST `session_started`\n\
  of `ref`: with two anchors of the SAME ref (origin + a worktree-hop re-anchor) and\
  \ a fetch BETWEEN\nthem, the gate PASSES (the worktree-hop credit fix); a read before\
  \ the origin still REFUSES; and a\nDIFFERENT ref's earlier anchor neither lowers\
  \ this ref's bound nor credits this gate (cross-ref\nnegative — no cross-session\
  \ over-credit). Covered by `tests/test_require_reads_gate.py`\n(`test_t9243_earliest_anchor_credits_read_between_worktree_hop_anchors`,\n\
  `test_t9243_cross_ref_session_started_does_not_lower_bound_or_credit`).\n(6) DISCARDED-FETCH\
  \ exclusion (§4) — a DIFFERENTIAL over the receipt PRODUCER, not over\nhand-written\
  \ rows: a `graph query <SPEC>` receipt emitted with fd 1 bound to the real null\
  \ device\nrecords `stdout_delivered: False`, is NOT in `_fetched_spec_ids`, and\
  \ `_require_reads` REFUSES\nnaming that contract; the SAME emit over each ordinary\
  \ form (in-process capture, pipe, regular-file\nredirect) records delivered, IS\
  \ credited, and the gate PASSES. Both directions are required — a\ntest asserting\
  \ only the refusal would pass on a reader that credits nothing. Plus the two bounds:\n\
  a receipt with NO `stdout_delivered` key still credits (back-compat + the dispatch\
  \ bootstrap\nreceipts), and a not-delivered `session start` receipt is still read\
  \ by `_seed_receipt_epochs`\n(the seed floor was not widened). Covered by\n`tests/test_t11411_discarded_fetch_not_credited.py`.\n\
  (7) ONCE-PER-EPOCH delivery (§4) — a DIFFERENTIAL over the deliverer, both directions\n\
  required: after one delivery, a second delivery call in the SAME established epoch\
  \ prints a pointer\nper contract, no body and no second receipt, and the gate still\
  \ passes with no manual fetch; after\nthe epoch advances the same call prints full\
  \ bodies and writes receipts stamped with the new epoch.\nPlus the three fail-toward-delivering\
  \ bounds, each with its own failing input: an epoch that cannot\nbe established\
  \ (bodies on every call), a prior receipt carrying no fingerprint (body), and a\n\
  contract whose text changed to different text of IDENTICAL length (body). Covered\
  \ by\n`tests/test_session_start_delivers_stage_bundle.py` and `tests/test_stage_bundle_credits_read_gate.py`\n\
  (the `test_t13510_*` arms, incl. the real-subprocess session-start → stage → compact\
  \ run).\n\n## Drift review\n\n (2026-06-09): re-verified this body against `bin/yitc-v2#cmd_task_close`.\
  \ edited only\nthe spec-drift-attribution block of `cmd_task_close` (added `_task_diff_range`\
  \ scoping for the\nWARN) — it does NOT touch the `_require_reads` precondition /\
