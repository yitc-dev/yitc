  - bin/lib/task.py#cmd_task_close # §6 pilot wiring — Closure contracts (SPEC-0015 + SPEC-0038)
  - bin/lib/task.py#cmd_task_commit # §6 pilot wiring — Commit contract (SPEC-0014)
