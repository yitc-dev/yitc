body: "## Scenario\n\nWhen the AI invokes a work verb whose action is governed by\
  \ stage-entry contracts (pilot:\n`task close` — SPEC-0015/SPEC-0038; `task commit`\
  \ — SPEC-0014), the verb REFUSES to act unless\nthe journal of the CURRENT session\
  \ shows the governing contracts were actually fetched. The\nrefusal prints one ready\
  \ command per missing contract — READY meaning it actually SATISFIES the\ngate that\
  \ printed it, so the command is CORPUS-AWARE : engine self-build names\n`bin/yitc-v2\
  \ graph query <SPEC>`, a `-C` consumer names\n`<ENGINE_ROOT>/bin/yitc-v2 -C <REPO_ROOT>\
  \ graph query <SPEC>` (the X-0093 foreign-corpus refusal\nshape) plus a wrong-corpus\
  \ hint. The AI runs them and re-invokes — the retry passes. The pointer-only \"\
  read before acting\" advisory on\nthe piloted gates is RETIRED: delivery rides the\
  \ proven in-flow channel (refusal + ready\ncommand), not a skippable link.\n\n##\
  \ Internal\n\nONE shared precondition helper `require-reads(kind, ctx)` callable\
  \ by ANY verb (FSM-bound or\nnot). Rules:\n\n### 1. Doc-set derivation (no new map)\n\
  - `kind=stage` — NORMATIVE: the verb's stage-entry spec bundle on the RELEVANT axis\
  \ — the task\n  `stage-entry:<STAGE>` bundle (`_stage_bundle_specs`, default) OR\
  \ the plan `plan-stage-entry:<STAGE>`\n  bundle (`_plan_stage_bundle_specs`) when\
  \ `ctx.axis==\"plan\"` ( cross-axis graduation). BOTH are\n  the SAME `binding:`-derived\
  \ carrier as the floor trigger-map (P5) — just the task vs plan slice; the\n  axis\
  \ SELECTS the slice, it is NOT a new kind (the seed/action expansion stays).\n-\
  \ `kind=action` — RESERVED, non-normative (rule 6): the floor-map gated action set\n\
  \  (before-rule-change → SPEC-0005; the existing `_consumed_contract_for` derivation).\n\
  - `kind=seed` — RESERVED, non-normative (rule 6): the fixed SPEC-0007 §5 session\
  \ seed (handbook\n  5 + floor-trigger-map + MEMORY.md). When, seed-check covers\
  \ governed-DOCUMENT reads\n  ONLY — it does NOT assert the rest of the startup protocol\
  \ (`--help` rescan, type choice) and\n  is NOT a claim of full startup/post-compact\
  \ protocol equivalence. **STAYS RESERVED/unwired\n  :** the audience-seed floor\
  \ is instead realized by the STANDALONE `_require_seed_read`\n  gate (§8) on the\
  \ `_require_help_read` precedent, NOT by wiring this `kind` — so no duplicate\n\
  \  mechanism (P1 F1/F3).\n\n### 2. Evidence (journal-only; ONE pass-granting form;\
  \ SESSION_REF-SCOPED)\nEvidence for a doc = an event of the CURRENT `session_ref`\
  \ with `ts >= session_started`.\n**FAIL-CLOSED anchor :** the window is anchored\
  \ AT this session_ref's own `session_started`\n— a ref with NO `session_started`\
  \ has NO valid evidence window, so the gate REFUSES (it never falls\nback to an\
  \ unbounded admit-any window; the prior `\"\"` lower-bound was the external-audit\
  \ M4 fail-OPEN\n— a stale/shared `cli_invoked` under a reused/unanchored ref could\
  \ credit a later commit/close). The\nrefusal is deadlock-free (SPEC-0050 §3): `session\
  \ start` writes the anchor into THIS checkout, so the\nretry anchors. A compliant\
  \ worker always emits `session_started` (the dispatch contract).\n**EARLIEST-anchor\
  \ across worktree hops :** one logical session emits MULTIPLE `session_started`\n\
  rows under ONE stable `session_ref` (env:<provider-session-env> is stable across\
  \ a provider session's\nworktrees) — one per worktree, because per-worktree `session\
  \ start` (<workshop-spec>) re-anchors in\neach checkout. The window is therefore\
  \ anchored at the **EARLIEST** such `session_started` — the session\nORIGIN — NOT\
  \ the latest. Taking the latest advanced the window on every worktree hop, orphaning\
  \ a\n`graph query <SPEC>` fetched earlier in the SAME session (e.g. on `main` /\
  \ a decompose worktree) and\nforcing a redundant re-fetch — the SPEC-0050 §2 dissonance\
  \ «an earlier same-session fetch should still\ncredit» (live proof: ref 20fd8cbc\
  \ `session_started` 05:15 main + 07:03 worktree, SPEC-0046 fetched 05:37\nin between,\
  \ wrongly excluded). EARLIEST does NOT over-credit: the window stays per-`session_ref`\
  \ (a\nDIFFERENT ref's `session_started` never lowers this ref's bound — the cross-session\
  \ credit forbidden\nbelow / by the wrong-ref test), and a read before the origin\
  \ is still excluded. ORTHOGONAL to §4\npost-/compact: `/compact` emits no `session_started`,\
  \ so earliest-vs-latest does not touch the\nre-read obligation (no in-window evidence\
  \ still REFUSES); a future /compact marker composes with the\norigin bound (it raises\
  \ the floor, never lowers it).\n**PER-JOURNAL candidate windows for the receipt\
  \ gates (breadth generalized + read-consistency\nadded).** The evidence-window primitives\
  \ (`_session_started_lower_bound` / `_fetched_spec_ids` /\n`_seed_receipt_epochs`)\
  \ accept an ADDITIVE `events_path` selector naming WHICH journal to evaluate\n(defaults\
  \ to the current checkout's journal — the §2 RECEIPT behavior above is UNCHANGED\
  \ for `_require_reads`;\nits window ANCHOR alone is the earliest of this checkout's\
  \ and the main checkout's `session_started`)\nAND an ADDITIVE `events` selector:\
  \ a PRE-MATERIALIZED snapshot to iterate instead of\nre-reading. This lets the receipt\
  \ gates (`_require_help_read` / `_require_seed_read`) evaluate their\nreceipt across\
  \ a LIST of candidate journals = [current checkout, main checkout] for EVERY governed\
  \ verb.\n`land` runs FROM main but re-execs `-C <worktree>` so its receipt may be\
  \ in MAIN; symmetrically\na worker running a verb from a worktree may have its receipt\
  \ only in MAIN (the launcher records it there\n— §8 co-producer). first added the\
  \ main candidate for `land` ONLY; generalizes it to\nEVERY governed verb (the land-only\
  \ boundary was incident scope, not a principled limit — external GREEN)\n— so ONE\
  \ receipt (session_ref-scoped) credits that session's verbs run from any of its\
  \ worktrees,\nremoving the per-worktree `session start` for these gates. Each candidate\
  \ is a SEPARATE\nsession_ref-anchored window (its OWN `session_started` lower-bound)\
  \ — NEVER a raw union across journals\n(a union would let one journal's `session_started`\
  \ anchor another journal's receipt — the cross-checkout\nover-credit the external-consult\
  \ flagged, decisions/land-audit-gate-tangles-audit-adhoc.yaml). The\nselectors change\
  \ only WHICH journal is read / from WHICH snapshot; attribution stays session_ref-only\n\
  (NOT the reverted worktree_ref axis).\n**READ-CONSISTENCY under a concurrent in-place\
  \ rewrite.** The reconcile rewrites events.jsonl\nIN-PLACE (worktree.py `write_text`,\
  \ NOT an atomic temp+rename), so a concurrent reader can catch a\nTRUNCATED file\
  \ and torn-miss a durably-present receipt (the 2026-07-04 transient-miss — a READ\
  \ artifact,\nNOT a lost append; the append durability layer E-0021 / is unchanged\
  \ and NOT reopened). Two\nbelts on the receipt gates: (1) per candidate the anchor\
  \ scan and the receipt scan read ONE materialized\nsnapshot (via the `events` selector),\
  \ so a rewrite cannot interleave BETWEEN them and yield a false\n`seed_read_unfetched`/`help_inventory_unfetched`;\
  \ (2) a would-be refusal is re-read a BOUNDED number of\ntimes (`_READ_GATE_RETRY_ATTEMPTS`,\
  \ small backoff) before it is final — a transient torn read is\nrecovered, while\
  \ a GENUINE miss still refuses after the attempts (retry never waves through a real\n\
  absence). Return-on-first-credit keeps the pass path single-read; the bounded latency\
  \ lands only on the\nrare refusal path.\nPASS-GRANTING form (the only one in the\
  \ pilot): `cli_invoked` with `node_id` = the spec\n(verb-routed `graph query`) —\
  \ synchronous, deterministic, canonical identity = spec-id.\nThere is NO worktree_ref\
  \ / per-task discriminator: a session's fetch credits the gate regardless\nof which\
  \ `task/T-XXXX` worktree the fetch was recorded under — so a fetch made earlier\
  \ in the\nSAME session (e.g. while on a different task) still credits a later close/commit\
  \ (no\nsolo-sequential over-reject). `instruction_injection: commanded_read` (Read-tool\
  \ reads\nmaterialized by journal sync, SPEC-0004 §Expected-reads model — established;\
  \ file-path identity) is OBSERVED-ONLY in the pilot —\ncollected for a post-pilot\
  \ validation decision, never satisfying the gate (the file-path↔spec-id\nidentity\
  \ mismatch + materialization latency are unvalidated). The refusal text always advises\
  \ the\n`graph query` path. The primitive only READS the journal — freshness at verb\
  \ entry is guaranteed\nby the existing pre-verb auto-sync; no new sync, store, or\
  \ hook.\n\n**Realm-qualified credit (X-0865) — a KERNEL contract needs the KERNEL\
  \ receipt.**\nA `node_id` names the id ASKED FOR; it does NOT name the corpus that\
  \ ANSWERED. Under `-C` a bare\n`graph query SPEC-XXXX` resolves consumer-own-first\
  \ (SPEC-0092), so a consumer owning an UNRELATED\nspec at a gated KERNEL id satisfied\
  \ that kernel contract's gate by reading its own spec — silently,\nsince nothing\
  \ in the pass or the refusal named the realm (measured: <project> 2026-08-13). So\
  \ the\nreceipt ALSO carries `node_realm` (\"kernel\" | \"own\"), stamped by `cmd_graph_query`\
  \ off the branch\nthat actually resolved, and the credit is realm-qualified:\n-\
  \ The doc-set carries the realm each doc REQUIRES — the realm of the corpus whose\
  \ `binding:` put it\nin the bundle (`_stage_bundle_specs(..., with_realms=True)`,\
  \ which derives the own and kernel\ncorpora SEPARATELY so a consumer-owned id can\
  \ no longer SHADOW the kernel binding out of the set).\nAn id bound at that stage\
  \ by BOTH corpora requires the KERNEL realm: a handbook retrieved-tier\npointer\
  \ names the kernel contract.\n- A doc carrying a required realm is credited ONLY\
  \ by a receipt whose `node_realm` EQUALS it. A\nreceipt with NO realm stamp makes\
  \ no realm claim and credits NOTHING — fail-closed, with no\nown-vs-kernel exception,\
  \ and self-healing (re-issuing the fetch stamps it).\n- Realm qualification applies\
  \ ONLY on a `-C` consumer build — the only place an id collision can\nexist (the\
  \ positive discriminator). On the engine's own session own IS the kernel (SPEC-0092),\
  \ so\nno doc is realm-qualified and credit stays id-only, byte-unchanged. The PLAN\
  \ axis is own-only (no\nkernel doc can enter its doc-set) and is likewise never\
  \ realm-qualified.\n- The refusal names the `--kernel` form for a kernel-realm doc\
  \ — the bare form it would otherwise\nprint could not SATISFY the gate that printed\
  \ it (the X-0416 self-defeating-instruction class, on\nthe realm axis) — and carries\
  \ `missing_realms` in `read_gate_refused`. A SATISFIED gate prints ONE\nreport-only\
  \ stderr line naming each credited doc + the realm that satisfied it, so a future\n\
  mis-credit is not silent.\nThis EXTENDS the kernel-pin (which pinned the gate TEMPLATE\
  \ resolution) to the READ-CREDIT\nhalf; it adds no store, event, flag, or parallel\
  \ mechanism.\n\n### 3. Evidence locality (the authoritative source; explicit prerequisite)\n\
  The authoritative evidence source = the CURRENT checkout's `events.jsonl` after\
  \ FULL local\nmaterialization of the session transcript (per-checkout sync checkpoint)\
  \ — pre-worktree\nreads are therefore locally visible. NOT a union-read across checkouts\
  \ (single read-path, P5).\nPer-checkout materialization is an EXPLICIT PREREQUISITE\
  \ DELIVERABLE, with its own probe (\"a\npre-worktree read is visible in the worktree\
  \ journal\" — state-check) — RETAINED unchanged from\nthe <workshop-spec> model.\
  \ Deadlock-free by construction for the pilot scope: the printed fail-commands\n\
  execute IN the invoking checkout, so their evidence is local — the retry always\
  \ passes (worst\ncase: one redundant re-fetch; never a deadlock).\n\n### 4. Refusal\
  \ contract\nOn missing evidence the verb REFUSES (exit nonzero) and prints: one\
  \ ready fetch command per\nmissing doc + the boundary line \"the gate checks delivery\
  \ (fetch), not comprehension\". READY is\nload-bearing (X-0416): the printed command\
  \ must land its `cli_invoked` receipt on the\nSAME corpus this gate reads, so the\
  \ command form is corpus-aware — engine self-build prints the\nbare `bin/yitc-v2\
  \ graph query <SPEC>`; a `-C` consumer prints\n`<ENGINE_ROOT>/bin/yitc-v2 -C <REPO_ROOT>\
  \ graph query <SPEC>` (mirroring the X-0093\nforeign-corpus guard's refusal shape)\
  \ plus one hint that a fetch run from the engine cwd WITHOUT\n`-C` records on the\
  \ KERNEL journal and will not credit. A corpus-blind command cannot satisfy the\n\
  gate that printed it: the identical list re-prints and the natural retry repeats\
  \ the wrong-corpus\nfetch (a measured consumer loop — 3 duplicate calls per contract).\
  \ The gate\nproves FETCH at the action moment — never understanding, and never post-compact/restart\n\
  freshness (no /compact journal marker exists; the check is session-scoped; a future\
  \ marker\nshifts the ts lower-bound from `session_started` to the last marker).\n\
  \n**A DISCARDED FETCH DOES NOT GRANT A PASS (<project> X-1068).** The `cli_invoked`\
  \ receipt\nrecords whether the fetched output was DELIVERED or went to the null\
  \ device (the additive\n`stdout_delivered` field, `bin/lib/cli.py#_stdout_was_delivered`\
  \ / <project> X-0842), and a\nreceipt recorded NOT delivered — the form `graph query\
  \ <SPEC> >/dev/null 2>&1` — is EXCLUDED from\n§2's pass-granting evidence set by\
  \ `_fetched_spec_ids`. The gate still proves FETCH and NEVER\ncomprehension: this\
  \ narrows what counts as a fetch, and asserts nothing about whether the content\n\
  was read, understood, or acted on. A fetch whose bytes reached no reader is not\
  \ delivery either, so\ncrediting it missed the fetch-not-comprehension boundary\
  \ rather than honouring it.\n\n**THREE BOUNDS, and they are the whole rule — a surface\
  \ stating a different bound is a standing\ncontradiction (CHARTER §Principle 7),\
  \ not a wording variation:**\n1. **The discriminator is the null device SPECIFICALLY,\
  \ never `isatty`.** A pipe to a reader is\n   not a tty, so treating an ordinary\
  \ `graph query <SPEC> | less` as discarded would both refuse a\n   legitimate fetch\
  \ and make the recorded signal wrong. A terminal, a pipe, a regular file and an\n\
  \   in-process capture all count as DELIVERED and still credit.\n2. **FAIL-SAFE\
  \ TOWARD DELIVERED.** Only a receipt recorded exactly `False` is excluded; an ABSENT\n\
  \   field (every pre- row, and the dispatch launcher's pre-recorded seed/help bootstrap\n\
  \   receipts) or any value the producer could not determine still CREDITS. The unknown\
  \ never\n   accuses a real read.\n3. **This reader ONLY.** The exclusion reaches\
  \ `_require_reads` (contract gate) and\n   `_require_help_read` (verb-inventory\
  \ gate), which share `_fetched_spec_ids`. The §8 seed floor\n   reads its own receipts\
  \ (`_seed_receipt_epochs`) and is UNCHANGED; §2's window/anchor rules are\n   untouched.\n\
  \n**HONEST BOUND, recorded so no reader over-trusts this.** The kernel cannot verify\
  \ reading; it can\nonly decline to credit a fetch it can SEE was discarded. `> /tmp/x`\
  \ is just as unread while looking\ndelivered, and nothing here reaches it. That\
  \ residual is accepted deliberately — anything stronger\nis the comprehension check\
  \ this corpus refuses to build.\n\n**THE STAGE VERB DOES NOT DISCARD SILENTLY.**\
  \ `stage <NAME>` with fd 1 on the null device\nrecords the stage, renders NO bundle\
  \ body, writes ONE stderr line naming the ids left uncredited and\nthe crediting\
  \ form (the same command with stdout attached — terminal, pipe or file), and exits\
  \ the\ndocumented distinct code `STAGE_BUNDLE_DISCARDED_EXIT` (6) — the only channel\
  \ that survives\n`>/dev/null 2>&1`. Nothing above changes: no receipt is credited\
  \ that was not before, the three\nbounds stand, and the session-start delivery seam\
  \ is unaffected.\n\n**A STAGE CONTRACT IS DELIVERED ONCE PER CONTEXT EPOCH.** The\
  \ stage deliverer — ONE helper\nbehind both seams, `stage <NAME>` and the in-worktree\
  \ `session start` — renders a contract as ONE\nPOINTER LINE (its id, its title,\
  \ the command that re-reads it) instead of its body when ALL THREE\nhold, and in\
  \ full in every other state:\n(a) the current context epoch (§8's counter) can be\
  \ ESTABLISHED — the provider transcript was\n    actually read to the end. A session\
  \ with no provider transcript, or one whose transcript\n    exists but cannot be\
  \ read, reads epoch 0 before AND after a `/compact` (§8's fail-safe\n    floor),\
  \ so \"this epoch already holds it\" cannot be asserted of it — such a session is\
  \ never\n    shown a pointer;\n(b) this session holds a crediting receipt for that\
  \ contract, inside §2's own window, stamped with\n    an epoch not older than the\
  \ current one and carrying the FINGERPRINT of what was rendered (and,\n    under\
  \ `-C`, the realm the contract requires);\n(c) the contract rendered NOW has that\
  \ same fingerprint — a spec edited between two deliveries is\n    delivered again,\
  \ whatever its length.\nA pointer writes NO receipt: the earlier delivery is what\
  \ credits. To make (b) decidable, a\npoint-lookup receipt carries the epoch stamp\
  \ the seed receipt already has (an absent stamp reads as\nepoch 0), and a stage-delivered\
  \ one also carries the fingerprint; a hand `graph query` receipt has\nnone and therefore\
  \ never suppresses a body. NOTHING ABOVE CHANGES: §2's credit stays SESSION-scoped\n\
  and reads neither field — the epoch decides RE-RENDERING, never credit — and every\
  \ doubt (no anchor,\nan unreadable journal, a comparison that fails) falls toward\
  \ delivering the body. A `/compact`\nadvances the epoch, so the SPEC-0007 §5a re-run\
  \ of `stage <current_stage>` delivers in full again.\n\n### 5. Bypass\nEmergency\
  \ mode ONLY (`patterns/error-friction-tracking.md` analog — `patterns/emergency-mode.md`\n\
  entry). No dedicated `--force` flag.\n\n### 6. Pilot scope — NORMATIVE = kind=stage\
  \ only; seed/action RESERVED\nNORMATIVE: `kind=stage` — wired first as the pilot\
  \ on `task close` (Closure contracts) and `task\ncommit` (Commit contracts), then\
  \ GRADUATED (each its OWN first-connection step — never bulk)\nonto the remaining\
  \ stage work-verbs: `audit pre`/`audit post` (TASK Audit-pre/post, SPEC-0036), `spec\n\
  new --draft` (plan `specs`, SPEC-0034), and `plan check` (plan `accepted`, SPEC-0034)\
  \ — the latter two\non the cross-axis `axis==\"plan\"` derivation (§1). `kind=seed`\
  \ / `kind=action` are RESERVED API shape ONLY — non-normative,\ncarrying NO code\
  \ and NO obligation until a first-connection decision wires a consumer (each its\n\
  own decision — never wired in bulk). Prerequisite named for the future seed wiring:\n\
  `graph/floor-trigger-map.md` + `MEMORY.md` added to the materializer's GOVERNED\
  \ list.\n\n**Anchor-scope (co-anchor boundary).** This spec's `bin/yitc-v2#cmd_task_close`\
  \ anchor\ngoverns ONLY the must-read entry-gate PROLOGUE of that verb (the `_require_reads(\"\
  stage\", …)`\nprecondition + its refusal); the rest of the close-path body (probe\
  \ gating, spec activation, the\nclosure-record write, and the report-only WARN family)\
  \ is SPEC-0015 closure-contract behavior,\nNOT this spec's. A close-path symbol\
  \ change that leaves the read-gate prologue unchanged is\ntherefore OUTSIDE this\
  \ spec's governed behavior — the co-anchor `possibly-stale` flag is a false\npositive\
  \ cleared by a last-touch refresh (the collateral co-anchor class; SPEC-0005\nrule-7\
  \ in-place). Instance : the SPEC-0052 at-closure audit-YAML displacement is appended\n\
  to the END of `cmd_task_close` (after the closure-record commit), leaving the read-gate\
  \ prologue\nuntouched — no-drift for this spec; refreshed last-touch. Instance :\
  \ the read_gate_refused\nobservability emit is added to `_require_reads` BEFORE\
  \ each `_die` refusal path, leaving the\ndoc-set derivation, the cli_invoked evidence\
  \ window, and the stdout refusal text (this spec's\ngoverned behavior) UNCHANGED\
  \ — additive observability only; no-drift, refreshed last-touch.\nInstance : the\
  \ `task close --batch-close` preamble (the hygiene work-batch in-place close)\n\
  is inserted into `cmd_task_close` BEFORE the read-gate prologue and still routes\
  \ through the SAME\nunchanged `_require_reads(\"stage\", {\"stage\": \"Closure\"\
  ...})` precondition (doc-set, evidence\nwindow, refusal text all UNTOUCHED) — so\
  \ the batch-close path is governed by this gate exactly like\nthe normal close;\
  \ the co-anchor `possibly-stale` flag is a false positive, refreshed last-touch.\n\
  Instance : `_require_reads` now passes `kind=\"read-check\"` (the SPEC-0025/SPEC-0059\
  \ locked\nrefusal-category enum value, reconciled from the interim `\"stage\"`)\
  \ plus the already-resolved\n`session_ref` to the read_gate_refused emit; `cmd_task_close`\
  \ / `cmd_task_commit` additionally pass a\n`verb=` label to the shared stage-correspondence\
  \ guard. All additive observability/labelling — the\ndoc-set derivation, the cli_invoked\
  \ evidence window, and the stdout refusal text (this spec's governed\nbehavior)\
  \ are UNCHANGED. The co-anchor `possibly-stale` flag is a false positive, refreshed\
  \ last-touch.\nInstance ( — GRADUATION): the read-check graduated onto `cmd_audit`\
  \ (TASK Audit-pre/post),\n`cmd_spec_new` (--draft, plan `specs`), and `cmd_plan_check`\
  \ (plan `accepted`). Each new verb anchor\ngoverns ONLY its must-read entry-gate\
  \ PROLOGUE (the `_require_reads(\"stage\", …)` call + its refusal),\nexactly the\
  \ co-anchor boundary the pilot uses for `cmd_task_close`; the REST of each verb\
  \ (the\nauditor invocation, the spec scaffold/allocation, the plan-check audit body)\
  \ is its OWN spec's\nbehavior, NOT this spec's. `_require_reads` additionally gained\
  \ the cross-axis `ctx.axis` selector\n(§1) — additive: the evidence window, the\
  \ cli_invoked window, and the read_gate_refused emit are\nUNCHANGED. The verb-own\
  \ governing specs (SPEC-0030 / SPEC-0034 / SPEC-0046) are deliberately NOT edited\n\
  to mention the gate — the read-gate has ONE home (this spec); duplicating it into\
  \ each verb's spec is\nthe P5 violation the co-anchor model exists to avoid. The\
  \ `ctx.axis` selector FAILS CLOSED\n(audit-post F1): an unknown axis raises ValueError\
  \ (only an ABSENT axis defaults to \"task\"), so a\nmis-wired caller surfaces rather\
  \ than silently routing to the task bundle. Refreshed last-touch on\nthe four anchors.\n\
  Instance : the closure-time fingerprint linkage (`task close --closes-fp <fp>`,\
  \ SPEC-0069)\nadds an OPTIONAL cites-fold + an advisory candidate HINT to `cmd_task_close`\
  \ — the cites write, the\nlate-linkage done-re-run, and the report-only hint are\
  \ all SPEC-0069 LINK-RULE behavior, leaving the\n`_require_reads(\"stage\", {\"\
  stage\": \"Closure\"...})` read-gate prologue (doc-set, evidence window,\nrefusal\
  \ text — this spec's governed behavior) UNCHANGED. So the co-anchor `possibly-stale`\
  \ flag is a\nfalse positive (deliberate-non-update of this spec), refreshed last-touch.\n\
  Instance (re-verified): the at-the-moment spec-body-edit cue is appended to the\
  \ END of\n`cmd_spec_new` as a single stdout line — printed AFTER the id is allocated\
  \ and the scaffold written. It\nis operator-facing ergonomics, not gate behavior:\
  \ the `_require_reads(\"stage\", …)` draft read-gate\nPROLOGUE this spec governs\
  \ (its doc-set derivation, the cli_invoked evidence window, and the stdout\nrefusal\
  \ text) is UNCHANGED, and the NON-draft path still carries no read-check at all.\
  \ So the co-anchor\n`possibly-stale` flag is a false positive — reviewed against\
  \ the code, not re-baselined blind (the\n honesty clause), and re-signed with a\
