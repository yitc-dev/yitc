body: "## Scenario\n\nMid-work the owner/AI notices a small follow-up (dodelka) (a\
  \ one-line follow-up, a \"remember to X\") that is NOT\nworth the full task lifecycle\
  \ yet must not be lost. Capturing it must be ONE command with NO worktree —\nnot\
  \ the heavy path (a markdown followups-inbox entry needs a worktree + a work-commit\
  \ + a land per\nnote; trial-proven insufficient, X-0056). Later that captured item\
  \ is either PROMOTED into a real task\nor DROPPED — and the open set is listable.\
  \ The state is never a separate stored file: it is FOLDED from\nthe one journal,\
  \ exactly like the cross inbox/outbox view.\n\n## Internal\n\nTHE FOLLOWUP CAPTURE\
  \ CONTRACT. A `followup` is a lightweight capture recorded as APPEND-ONLY JOURNAL\n\
  EVENTS in `events.jsonl` — it adds NO new store / format / parser (CHARTER §P5:\
  \ the one journal\nmechanism; the derived-state view, not a second ledger).\n\n\
  ### Verbs (the contract)\n- **`followup add --text <t> [--relates-to <ref>] [--trigger\
  \ <phrase> --awaits <artifact>]`** — appends\n  `followup_added` and prints the\
  \ id. NO WORKTREE (the append-only-journal exception applies — a\n  followup append\
  \ is the same journal MECHANISM as `event` / a `deviation_captured`, in-bounds from\
  \ the\n  main checkout). `--trigger` captures it BORN-ARMED (§Armed); an empty/whitespace-only\
  \ value REFUSES\n  rather than silently capturing an actionable followup (passing\
  \ the flag is a claim that a trigger\n  exists). `--relates-to` is PROVENANCE; `--awaits`\
  \ names the AWAITED ARTIFACT (§Armed).\n  **`--trigger` and `--awaits` are REQUIRED\
  \ TOGETHER, in BOTH directions.** `--awaits`\n  without `--trigger` REFUSES — an\
  \ awaited artifact with no named moment would be armed-but-unnamed\n  (the X-0165\
  \ discipline). `--trigger` without `--awaits` REFUSES too — a named moment with\
  \ no\n  artifact to fire it is an UNFIREABLE WAITER (§Armed → why `awaits` is required).\
  \ Both refuse BEFORE\n  any append, so a rejected capture leaves NO event and nothing\
  \ to dispose. So the invariant the\n  partition branches on is `armed <=> trigger\
  \ AND awaits`, at this door and at `arm`'s alike; to\n  capture a bare future event\
  \ with no artifact to name, omit BOTH and capture it ACTIONABLE.\n  The `followup_added`\
  \ payload ALSO carries **`actor`** — WHO captured it. It is DERIVED\n  host-side\
  \ from the launch context (`lib/memory.py#resolve_actor`: the owner-role host user\
  \ records\n  the default `ai-agent`; a named provisioned user, e.g. <collaborator>,\
  \ records their own name), so attribution\n  costs the human ZERO added input —\
  \ there is no `--actor` flag to pass and none is wanted (owner\n  directive 2026-07-11).\
  \ It is BORN-ONLY meta: the fold reads it off `followup_added` alone, and no\n \
  \ later `followup_armed` / `promoted` / `dropped` re-writes it — the CAPTURER is\
  \ immutable, exactly as\n  `added_at` is. `followup list` renders `[by: <actor>]`\
  \ ONLY for a real person (suppressed-when-clean:\n  an `ai-agent` capture — the\
  \ overwhelming majority — prints nothing, so the view gains signal, not\n  noise).\
  \ Reuses the existing event; NO new store / field-store / verb (CHARTER §P1 F1-F2).\n\
  - **`followup promote <id> --into <T-XXXX | lessons|patterns/<note>.md | plan-slug>`**\
  \ — appends `followup_promoted`; the open→promoted leg. `--into` is REQUIRED (X-0165):\
  \ a bare promote would fold to promoted with `into=None`, stranding a promoted-but-carrierless\
  \ item; `promote` names the carrier the followup BECAME (file/author it first, then\
  \ promote --into it, or `drop`).\n**THREE CARRIERS, resolved by the target's own\
  \ SHAPE.** `T-NNNN` is the TASK leg,\nunchanged. A repo-relative `lessons/<name>.md`\
  \ or `patterns/<name>.md` is the **AUTHORED REFERENCE\nNOTE** leg — the carrier\
  \ SPEC-0140 names as the LIGHTEST for a captured followup, drained\nin ONE batched\
  \ `work/<slug>` land rather than a worktree cycle per note (the X-0148\nceremony-per-lesson\
  \ cost). That carrier is a FILE, and before this the vocabulary could not name a\n\
  file, so the sanctioned lightest path terminated in `drop`: on 2026-08-26 four DELIVERED\
  \ notes were\nrecorded `dropped`, the carrier surviving only as prose. The 2-state\
  \ fold is what later readers\ncount and `dropped` means DECIDED-NOT-TO, so a delivered\
  \ note recorded there is indistinguishable\nfrom an abandoned one, and the recommended\
  \ carrier was the only one whose outcome could not be\nrecorded truthfully. The\
  \ note leg is FAIL-CLOSED on the SAME terms as the plan leg: the file must\nEXIST\
  \ or the promote is REFUSED naming the path, before any append. Its shape is BOUNDED\
  \ to the two\nsanctioned directories, one slash, a `.md` leaf — a carrier that could\
  \ name any file would record\nnothing — and is disjoint from the other two legs\
  \ by construction. `drop` is UNCHANGED and stays\nthe honest terminal for a note\
  \ genuinely abandoned; nothing already recorded is rewritten (the\njournal is append-only,\
  \ so the four notes above keep their `dropped` status and their reasons).\nAnything\
  \ else is read as a **PLAN slug** — for the followups whose real carrier IS a\n\
  plan (their body authored verbatim into a plan draft, the plan disposing of them).\
  \ Before this\nthey had no honest target, so they were either mis-linked to a task\
  \ (`fu_cbb23cc25d01 --into\n`, recorded and IRREVERSIBLE — promote is terminal)\
  \ or left open forever. The plan leg is\n**FAIL-CLOSED and LOUD**: a slug that resolves\
  \ to no draft in `plans/` or `ideas/` is REFUSED\nnaming the slug, BEFORE any append,\
  \ so the followup stays `open` and disposable. A silent accept\nwould be strictly\
  \ worse than the pre- state — it would record a carrier that does not\nexist while\
  \ looking successful. This is a WIDENING of the one target validation plus a\nplan-existence\
  \ check: no second link store, no second event, no parallel promote path (§P1 F1\
  \ /\n§P5). The DECLARED `promotes:` filing leg is unaffected — its `into` is the\
  \ task id `task file`\nis minting, real by construction.\n- **`followup drop <id>\
  \ [--reason <r>]`** — appends `followup_dropped`; the open→drop leg.\n- **`followup\
  \ arm <id> --trigger <phrase> --awaits <artifact>`** — appends `followup_armed`;\
  \ marks an\n  OPEN followup as an ARMED WAITER (§Armed). `--trigger` is REQUIRED\
  \ and non-empty — the same discipline\n  `promote --into` learned from X-0165: an\
  \ armed followup is BY DEFINITION awaiting a NAMED trigger, so a\n  triggerless\
  \ `arm` would drop it out of the actionable headline with nothing able to bring\
  \ it back.\n  `--awaits` names the AWAITED ARTIFACT whose arrival fires it (the\
  \ SOLE fire key) and is **likewise\n  REQUIRED ** — an arm with no awaited artifact\
  \ writes a waiter that is out of the headline\n  AND unfireable, so it REFUSES BEFORE\
  \ any append, leaving the item open and disposable (§Armed → why\n  `awaits` is\
  \ required). It must ALSO be a **RESOLVABLE REFERENCE in one of the three named\
  \ grammars**\n  (§Armed → the awaits grammar); an unresolvable one — a repo path,\
  \ a spec id, a plan slug,\n  free prose — REFUSES on the same terms, at BOTH write\
  \ doors, naming what IS resolvable. A bare\n  future event with no machine-checkable\
  \ artifact is therefore LEFT ACTIONABLE (visible, awaiting an\n  explicit disposition)\
  \ or dropped — never armed. `arm` RE-STATES THE WHOLE AWAITED\n  CONDITION (both\
  \ attributes, last write wins), so it applies to a FIRED followup too and RETURNS\
  \ IT TO\n  `armed` — the operator saying \"that fire was wrong, here is the real\
  \ condition\" (§Armed → re-arming).\n  NO WORKTREE.\n- **`followup unarm <id>`**\
  \ — appends `followup_armed` with `trigger: null` AND `awaits: null`; clears\n \
  \ both and returns the item to the actionable set. Clearing the trigger while leaving\
  \ the awaited\n  artifact would strand an actionable item carrying a live fire key.\
  \ The explicit re-actionable path for\n  a waiter whose trigger went MOOT (a plan\
  \ abandoned, a gate dropped) and so will never fire. NO WORKTREE.\n- **`followup\
  \ list [--status open|actionable|armed|fired|promoted|dropped|all]`** — folds +\
  \ prints\n  (default `open`, which renders the three-way §Armed partition with per-group\
  \ counts). The three OPEN\n  lenses (`actionable` / `armed` / `fired`) are DERIVED\
  \ views over that partition, NOT stored statuses.\n  An actionable row whose provenance\
  \ task CLOSED after that row was captured, and which was not\n  captured inside\
  \ that card's own closure window, also renders the report-only provenance hint\n\
  \  (§Armed → the stale-provenance marker, whose condition is membership, ordering\
  \ AND provenance);\n  the summary reports that subset beside the headline count.\n\
  \n### 2-state FSM (folded, never stored)\n`open → promoted | dropped`. State is\
  \ DERIVED by folding the journal: an id is `open` once\n`followup_added`, and terminal\
  \ once a `followup_promoted` / `followup_dropped` for that id appears —\nNO `status:`\
  \ is stored anywhere (the cross-fold model; SPEC-0005 §single-carrier). A transition\
  \ verb\nREFUSES (die) an unknown id OR an already-terminal id (only an `open` followup\
  \ transitions).\n**`arm`/`unarm` do NOT extend this FSM** — they set/clear an ATTRIBUTE\
  \ and never write `status`; an\narmed followup promotes/drops by these same unchanged\
  \ legs (§Armed).\n\n### Armed waiters — the derived partition of the OPEN set (re-keyed)\n\
  An OPEN followup may carry an optional **`trigger` ATTRIBUTE**: the NAMED future\
  \ moment it waits for.\nAn ARMED WAITER is not stale and not yet actionable (a P8\
  \ adoption confirmation awaiting the next real\nfire, an owner-held plan finalization,\
  \ a postcheck-gated disposition), so it MUST NOT inflate the\nheadline \"awaiting\
  \ disposition\" count the owner reads to decide what needs a decision NOW.\n\n**AWAITED\
  \ vs PROVENANCE — two fields, never one (NORMATIVE).** A followup names TWO different\n\
  artifacts, and conflating them is a defect:\n- **`relates_to`** — **PROVENANCE**:\
  \ what the followup is ABOUT (the task it was noticed under).\n  Free-form, rendered\
  \ as `[relates: …]`. It is **NEVER read by the fire check.**\n- **`awaits`** — the\
  \ **AWAITED ARTIFACT**: the machine-resolvable artifact whose ARRIVAL *is* the\n\
  \  arrival of the awaited moment. It is the **SOLE fire key**. DECLARED (`add --awaits`\
  \ /\n  `arm --awaits`), never inferred from the trigger prose, **REQUIRED wherever\
  \ a `trigger` is\n  written** ( — §Armed → why `awaits` is required), and **RESOLVABLE**\
  \ — a reference in one of\n  the three named grammars below, never free text. It\
  \ is absent, or present-but-unresolvable,\n  only on LEGACY records captured before\
  \ those rules, which the readers still tolerate.\n\n**THE `awaits` GRAMMAR — three\
  \ named shapes, and nothing else (NORMATIVE).** closed\nthe case `awaits` ABSENT.\
  \ This closes the case `awaits` PRESENT but naming nothing whose arrival any\nreader\
  \ can decide — the same defect wearing a costume, and it was the DOMINANT one. Measured\
  \ on the\nkernel 2026-09-02: of 49 open armed records, 4 named a task id (all 4\
  \ already terminal, i.e. exactly\nthe 4 `armed_fired`), 4 a coordination id, 3 a\
  \ plan slug, 35 a REPO PATH and 3 free prose — **45 of 49\nunfireable, and the live\
  \ resolvable population EMPTY**. A further 74 of the same shape sit on an\nunlanded\
  \ disposal branch (39 paths, 32 spec ids). The records say WHY in their own trigger\
  \ prose\n(\"OWNER DECISION: bin/lib/debt.py:3268 …\", \"WAITING ON FLEET DATA: …\
  \ bin/lib/nightly.py:1187\"): the\npath is WHERE the subject lives, the awaited\
  \ moment is an owner decision or fleet data, and the\nauthor needed a value for\
  \ a REQUIRED flag. A required field with no grammar collects the nearest\nconcrete\
  \ token.\n- **`T-NNNN`** — a task reaching a terminal status (`done|wont-do`). UNCHANGED:\
  \ the shape the fire\n  check has always read.\n- **`X-NNNN`** — a SHARED-COORDINATION\
  \ item reaching a terminal status. The honest home for an\n  obligation whose proof\
  \ lives in ANOTHER repo, which is never an acceptance-probe target from a V2\n \
  \ write (`lessons/a-deferral-needs-a-named-carrier-before-it-reads-as-one`).\n-\
  \ **`events.jsonl#type=<event_type>`** — a journal row of that EVENT CLASS appearing.\
  \ This EXTENDS the\n  existing load-bearing citation address space (`task.py#_journal_locator`,\
  \ which already\n  resolves `events.jsonl#ts=` / `#source_ref=`), it does NOT open\
  \ a second one (CHARTER §P1 F1).\n  It arrives on **MEMBERSHIP** — the mere EXISTENCE\
  \ of a row of that type, with no ordering check —\n  so a class that already has\
  \ rows fires the moment it is armed. UNCHANGED by the fourth shape\n  below, byte-for-byte:\
  \ an awaits carrying no `@after=` reads exactly as it always has.\n- **`events.jsonl#type=<event_type>@after=<ISO\
  \ ts>`** — the SAME class, **ANCHORED IN TIME**: it\n  arrives iff a row of that\
  \ type carries an envelope `ts` **STRICTLY LATER** than `<ISO ts>`. A row\n  at\
  \ EXACTLY that instant does NOT fire. This is the shape a «wake me on the NEXT occurrence\
  \ of\n  `<type>`» wait needs, and without it that wait was **unarmable**: measured\
  \ on the kernel\n  2026-09-04, of the 212 followups left actionable after the owner's\
  \ sweep an estimated 40-60 wait\n  on the next occurrence of a class the journal\
  \ already carries thousands of\n  (`nightly_run_completed`, `inspection_completed`,\
  \ `bg_dispatch_halted`, `cross_done`) — every one\n  of them fires immediately under\
  \ the bare form, so every one of them stayed in the actionable\n  headline the owner\
  \ reads as spam. recorded that limit here rather than extending the\n  grammar;\
  \ extends it.\n  - **STRICTLY later, never `>=`, and the direction is deliberate.**\
  \ The operator anchors on a\n    moment that HAS happened (their own land, the sweep\
  \ they just ran), so a row bearing exactly\n    that timestamp is part of what they\
  \ anchored PAST, not the next occurrence they await.\n  - **The timestamp is the\
  \ journal's OWN spelling and nothing else** — `YYYY-MM-DDTHH:MM:SSZ`, the\n    fixed-width\
  \ UTC form every emitter in the corpus writes. That is what makes the comparison\
  \ a\n    plain lexicographic one (over that set, string order IS chronological),\
  \ and it is why any\n    other spelling — a local offset, a fractional second, a\
  \ bare date — is REFUSED at the write\n    door rather than silently compared: a\
  \ shape the ordering is not provably correct over would\n    fire on the wrong rows\
  \ and do it invisibly.\n  - **Malformed ⇒ refused, not degraded.** A non-conforming\
  \ or empty anchor, or a second `@`\n    anywhere, makes `awaits_kind` return None,\
  \ so `followup add` and `followup arm` REFUSE naming\n    the grammar (the fail-closed\
  \ posture, unchanged). The item stays ACTIONABLE — visible\n    — rather than becoming\
  \ a waiter no reader can fire.\n  - **ONE parse home, ONE predicate.** `followup.py#split_event_awaits`\
  \ is the sole parser of both\n    event shapes (`awaits_kind` delegates to it);\
  \ the fold carries the per-type latest `ts` in the\n    walk it was ALREADY making,\
  \ and the single fire branch gains ONE predicate\n    (`event_after_arrived`). The\
  \ ARRIVED set (`arrived_ids`) is untouched — a free timestamp\n    cannot be enumerated\
  \ into a set, so an anchor is expressed as the comparison it is. No new\n    event,\
  \ verb, store or knob (CHARTER §P1 F1/F2).\n  - **The bound: a kernel awaits reads\
  \ the KERNEL journal.** A wait on a CONSUMER-side event is\n    not reachable by\
  \ any suffix; that need routes as a `cross request` to the consumer plus a\n   \
  \ kernel followup armed on the resulting `X-NNNN`.\n- **`events.jsonl#type=<event_type>&<key>=<value>`**,\
  \ optionally followed by `@after=<ISO ts>` — the\n  SAME class, **NARROWED TO MATCHING\
  \ ROWS** : ONE row predicate, and only a row of that\n  type that satisfies it arrives.\
  \ Both event shapes above decide arrival by the CLASS alone, so\n  every row of\
  \ the class arrives the moment whoever emitted it and whatever it reports — measured\n\
  \  on the kernel 2026-10-03, 3,201 of the 3,240 `consumer_read_evidence` rows since\
  \ 2026-09-11 were\n  the dispatcher's own self-serve receipts, and waits naming\
  \ ONE card's evidence fired on them.\n  - **What the predicate compares.** `<key>`\
  \ `task_id` is the row's ENVELOPE task id; any other\n    snake_case `<key>` is\
  \ a TOP-LEVEL `data` value that is a STRING. The comparison is EXACT string\n  \
  \  equality — no pattern, no prefix, and no coercion of a non-string value.\n  -\
  \ **ONE predicate, and a malformed one is refused, not degraded.** A second `&<key>=<value>`,\n\
  \    an empty key or value, a key that is not snake_case, an `&` with no `=`, and\
  \ a predicate on a\n    `T-NNNN` / `X-NNNN` reference each make `awaits_kind` return\
  \ None, so every write door refuses\n    naming the grammar. `<value>` is 1-64 characters\
  \ of `[A-Za-z0-9._:/-]` beginning with a letter\n    or a digit.\n  - **A DECLARED\
  \ set of classes.** The predicate is admitted only on the classes the parse home\n\
  \    declares (`followup.py#split_event_awaits`; today `consumer_read_evidence`,\n\
  \    `live_trigger_evidence` and `release_tagged`), and on any other class it is\
  \ REFUSED naming\n    that set — never admitted and left unfireable. The set is\
  \ declared because the fold cannot be\n    told in advance which predicates are\
  \ awaited: it marks every matchable key of every row of a\n    declared class, in\
  \ the walk it was already making. Widening the set is an edit to that one\n    declaration.\n\
  \  - **It composes with the anchors and changes neither.** With `@after=<ISO ts>`\
  \ it arrives on a\n    MATCHING row strictly later than the anchor; with no anchor,\
  \ on the existence of a matching\n    row; and on a deferred-probe moment it may\
  \ carry `@after=land` (SPEC-0028). An awaits carrying\n    no predicate reads exactly\
  \ as it did, byte-for-byte.\n  - **ONE parse home, still.** `followup.py#split_event_awaits`\
  \ parses the predicate and returns it\n    inside the ARRIVAL KEY it already returned\
  \ — the class, or the class with its predicate. The\n    fold marks that same key\
  \ for a matching row, and the membership test, the `@after=` comparison\n    and\
  \ the land comparison each look it up unchanged, so no reader parses a predicate\
  \ for itself.\n  - **The same bound: the KERNEL journal only.** A predicate does\
  \ not reach a consumer's journal;\n    that wait still routes as a `cross request`\
  \ (below).\n\n**BORN ARMED IS THE DEFAULT WHEREVER THE AWAITED MOMENT IS A NAMEABLE\
  \ ARTIFACT (NORMATIVE).** A followup whose firing moment IS a reference the grammar\
  \ above resolves is CAPTURED\nborn-armed (`add --trigger … --awaits <ref>`); it\
  \ is not captured actionable with the wait written\nas PROSE. ACTIONABLE is the\
  \ honest state only for a wait no grammar can name. The mechanism alone\nnever delivered\
  \ this — measured on the kernel 2026-09-04 the headline read 246 actionable / 9\
  \ armed,\nand well over a hundred of the 246 named their waiting moment in prose\
  \ — so the CAPTURE DOOR says\nso: when no `--awaits` was given and the capture's\
  \ own text names a still-OPEN `T-NNNN` or a\nnon-terminal `X-NNNN` other than the\
  \ `relates_to` provenance ref, `followup add` prints ONE\nreport-only line naming\
  \ it and the exact `arm` command. It NEVER gates, emits, or changes the exit\ncode;\
  \ it names only references `awaits_kind` already resolves and never guesses a trigger\
  \ PHRASE\n(armedness stays a human judgement — §Why the trigger is DECLARED); and\
  \ it is fail-open to SILENCE,\nbecause a report-only signal about a reader fails\
  \ the opposite way to a guard. The EVENT grammar is\ndeliberately OUTSIDE the advisory:\
  \ an event class ARRIVES on MEMBERSHIP, so a class with rows\nalready in the journal\
  \ fires IMMEDIATELY — advising one would manufacture the false-armed\nstate that\
  \ grammar was narrowed to end. AMENDS the SECOND half of that reason without moving\n\
  the advisory: a «next occurrence of <type>» wait now HAS an artifact — the time-anchored\
  \ `@after=`\nshape above — so it is no longer INEXPRESSIBLE, merely UNDEDUCIBLE.\
  \ The advisory still declines to\npropose one, and the distinction is the point:\
  \ the anchor is a TIME THE OPERATOR CHOOSES, and no scan\ncan read a chosen moment\
  \ out of prose, so proposing one would be the guess this advisory exists not\nto\
  \ make. The remedy is delivered where the problem is OBSERVABLE instead — at `arm`'s\
  \ existing\nrow-count report, which now names the fourth shape and prints the exact\
  \ re-arm command whenever the\nclass it just armed on already has rows (report-only;\
  \ the operator's awaits is never rewritten).\n`cli.py#_arm_cross_re_entry` stays\
  \ actionable-by-design, unchanged (the consult: the\npeer's condition names no local\
  \ artifact).\n\n**WHERE THE MOMENT LANDS DECIDES THE CARRIER (owner ruling 2026-09-04,\
  \ NORMATIVE).** Every\nshape in the grammar above resolves against THE JOURNAL OF\
  \ THE REPO THE FOLLOWUP LIVES IN. So the\nfirst question about any wait is not WHICH\
  \ shape names it, but WHOSE journal its firing moment\nlands in — and when the answer\
  \ is ANOTHER PROJECT, no followup in this repo can carry it. Such a\nwait is carried\
  \ by a **`cross request --kind task --to <project>`** (SPEC-0085 §3) whose brief\
  \ asks\nthat project to (a) ARM ITS OWN followup on the moment, in its own repo,\
  \ with the grammar above\n(typically `events.jsonl#type=<type>@after=<ISO ts>`),\
  \ and (b) REPORT THE READING BACK with `cross\ndone <X-NNNN> --note '<the reading\
  \ + its locator>'` — plus **AT MOST ONE** followup on this side\nARMED on the resulting\
  \ `X-NNNN`. The kernel then wakes exactly when the peer answers, cites the\nanswer\
  \ as `coordination.jsonl#cross=X-NNNN` (the SPEC-0015 shared-store locator kind),\
  \ and\npolls nothing in between. Grounds: the owner ruling of 2026-09-04 — this\
  \ project does not monitor\nother projects — and the measurement that made it necessary:\
  \ of the 212 followups left actionable\nafter that day's sweep, an estimated 60-80\
  \ waited on a row in a CONSUMER's journal, every one of\nthem unfireable by construction\
  \ and permanently resident in the actionable headline.\n- **THE ASK MAY ONLY PRESCRIBE\
  \ AN AWAITS KEY THE ASKING SIDE HAS VERIFIED EXISTS.** The\n  asking side owns every\
  \ emitter the awaited moment could fire from and the receiver owns none of\n  them,\
  \ so the key is knowable at authoring time and guessable only at reading time: name\
  \ the\n  literal `events.jsonl#type=<t>`, checked against the SPEC-0025 / SPEC-0161\
  \ catalog, never a\n  placeholder for the peer to resolve — and when NO emitter\
  \ fires at that moment, the ask is\n  unanswerable as written and MUST NOT be filed\
  \ as one (file the emitter card first, or drop the\n  carrier / record it wont-hold).\
  \ This does not reinstate validation of a TYPE (§the event grammar\n  REPORTS rather\
  \ than validates, below — a class that has never fired is exactly what these records\n\
  \  wait for); a placeholder is not an uncatalogued type, it is the absence of a\
  \ type.\n  `cross.py#placeholder_awaits_key_warning` reports the literal placeholder\
  \ on a `--kind task`\n  request, report-only. Grounds: <project> X-1379 over the\
  \ X-1274..X-1291 family, 2026-09-11 —\n  three asks of one family prescribed an\
  \ awaits key on a moment that emits no event at all.\n- **The `X-NNNN` item STAYS\
  \ OPEN (`picked`) while the peer holds the obligation, and that is the\n  CARRIER.**\
  \ `picked` rows are outside the session-start outbox cut, so an item the peer\n\
  \  is working is not something THE AUTHOR is re-asked about. **That cut is the AUTHOR's\
  \ outbox, and\n  the brief must not offer it to the RECEIVER as a no-nag promise\
  \ :** on the receiving\n  side `session start` prints «N inbox item(s) ACCEPTED\
  \ (picked) but tracked by NO local task»\n  (`cross.inbox_picked_untracked_rows`)\
  \ at EVERY start until they declare a local carrier\n  — a card filed `--resolves-cross\
  \ <X-NNNN>`, or a non-terminal plan's frontmatter\n  `resolves_cross:`. So the ask\
  \ states that cost plainly and names the silencer, which is\n  also what tracks\
  \ the obligation the peer just accepted. **Shape (B) — CLOSING the coordination\n\
  \  item as soon as the peer arms — was considered and REJECTED by the same ruling:\
  \ it loses the\n  return channel, so the reading has nowhere governed to come back\
  \ to and this side keeps no\n  adoption record of its own.**\n- **This is the STANDARD\
  \ route for a consumer-side adoption/verification wait, not an owner-gated\n  ask.**\
  \ The `--kind task` owner-gate named in SPEC-0085 covers a project→kernel FEATURE\
  \ request\n  and is UNCHANGED; a wait asking a peer to read its own journal and\
  \ report back is ordinary\n  coordination.\n- **Nothing here changes a KERNEL-side\
  \ wait.** A moment that lands in THIS repo's journal is\n  carried exactly as the\
  \ grammar above already says — an armed followup, or ACTIONABLE when nothing\n \
  \ resolvable names it. What this paragraph adds is the answer for the case the grammar\
  \ could not\n  express at all.\n\n**What is deliberately NOT in the grammar, stated\
  \ so the omissions do not read as oversights.** A\nrepo PATH: a file has no arrival\
  \ — it exists from birth, so \"fires when this path closes\" is not a\nproposition,\
  \ and firing on its next EDIT would fire on unrelated churn. A SPEC id: `active`\
  \ is a\nspec's NORMAL state, not an awaited moment. A PLAN slug: 3 records name\
  \ one, which does not carry a\nnew resolver through CHARTER §P1 F4, and a plan-shaped\
  \ need is expressible as the task that closes\nit. Each stays REFUSED — and the\
  \ refusal NAMES THE ALTERNATIVE (leave it ACTIONABLE, route it as a\n`cross request`\
  \ and await the X-NNNN, or drop it), because an author refused here holds a real\n\
  obligation and a refusal with nowhere to put it only relocates the problem.\n\n\
  **The event grammar REPORTS rather than validates its referent, and the direction\
  \ is deliberate.** A\nmisspelled task or coordination id is visibly wrong; a misspelled\
  \ event type is not. Validating it\nagainst the classes OBSERVED in the journal\
  \ would refuse exactly the useful case — a class that has\nnever fired is precisely\
  \ what these records wait for. So `arm` PRINTS whether rows of that class\nexist\
  \ today: ABSENT is the ordinary armed case, PRESENT warns that this arm reads as\
  \ FIRED on the\nnext read. **THAT VERDICT IS THE BARE FORM'S, and since it is stated\
  \ as such.** Membership\nis what decides a bare awaits, so over a TIME-ANCHORED\
  \ one the same count answers a question nobody\nasked: the anchor decides arrival\
  \ there, and an arm on a class carrying thousands of rows still\nreads `armed_waiting`\
  \ while none of them is later than it. So for the suffixed shape `arm` reports\n\
  the count as CONTEXT and states the ANCHORED reading — it fires only on a row STRICTLY\
  \ LATER than\nthe anchor — never the FIRED verdict. suppressed the REMEDY for that\
  \ shape but left this\nverdict sentence unconditioned, so the door told the operator\
  \ their arm was useless at the exact\nmoment it was working (measured on all five\
  \ of that card's own AC5 arms; deviation fingerprint\n`arm-report-says-FIRED-over-a-time-anchored-awaits`).\
  \ An already-arrived moment firing immediately is the honest reading, not a defect:\
  \ the\n`armed_fired` group is surfaced UNFLOORED, so the outcome is LOUDER than\
  \ the `armed_waiting` it\nreplaces. AND SINCE IT ALSO CARRIES THE REMEDY, in the\
  \ same line: when the class\nalready has rows, `arm` names the `@after=` shape and\
  \ prints the exact re-arm command. Reporting the\nproblem without naming the fix\
  \ is what left the «next occurrence» class unarmable in practice — the\noperator\
  \ was told their arm was useless and not what to type instead. The line stays REPORT-ONLY:\
  \ the\narm they asked for is already appended, nothing is rewritten, and the exit\
  \ code does not move —\n`awaits` is DECLARED, never inferred (§Why the trigger is\
  \ DECLARED), and an immediate fire is\nsometimes exactly what was meant. It is suppressed\
  \ where it has nothing to add: an already-suffixed\nawaits has taken the remedy,\
  \ and an ABSENT class is the ordinary armed case with no problem to fix.\n\n**The\
  \ partition is DERIVED, never stored** (`_partition_open`), recomputed on every\
  \ read from the folded\nrecords plus the caller's **ARRIVED set** (`followup.arrived_ids`).\
  \ No new store, no new FSM state, no\nthird status:\n- **actionable** — open, no\
  \ trigger. The headline count.\n- **armed_fired** — open, triggered, and **`awaits`**\
  \ is a member of the ARRIVED set: the artifact it\n  WAITED FOR arrived, so the\
  \ awaited moment ARRIVED. It is DUE, and the SPEC-0119 debt echo surfaces it\n \
  \ **UNFLOORED**.\n- **armed_waiting** — open, triggered, arrival not yet provable.\
  \ Counted, reported beside the headline,\n  but never permitted to nag.\n\n**The\
  \ ARRIVED set is ONE set built from three INJECTED corpora ** — terminal task ids\
  \ (the\nhost's existing `_terminal_task_closures`), terminal coordination ids (`_terminal_cross_ids`,\
  \ folded\nfrom the kernel-owned shared store and **fail-open to EMPTY**, so an unreadable\
  \ store leaves a waiter\nVISIBLE rather than firing on an arrival it could not confirm),\
  \ and the event classes observed by the\nfold that same call already runs. The host\
  \ owns the paths and the stores; `followup.py` stays a\nstdlib-only leaf and never\
  \ learns where either lives. NOTHING is stored, and the fire branch is\nunchanged\
  \ — it is still `awaits in <a set>` (CHARTER §P1 F2: a wider view over reads that\
  \ were already\nhappening, not a new entity).\n\n**The fire set and the stale-marker\
  \ set are TWO PARAMETERS, and that separation is normative\n.** `_partition_open`\
  \ reads the terminal-task set TWICE today — for the fire check and for\nthe stale-provenance\
  \ marker below. They had to separate the moment the fire set widened past task\n\
  ids, not later: `relates_to` ALREADY carries `X-NNNN` refs (`cli.py#_arm_cross_re_entry`\
  \ writes\nthem), so one widened set would have changed the MARKER's population as\
  \ an invisible side effect of a\nchange to the FIRE key. That is the ADD-vs-SUBTRACT\
  \ blurring and separated three\ncards apart, and the marker's own \"NOT the fire\
  \ key returning\" argument below holds only while the\ntwo sets are genuinely distinct.\
  \ The marker keeps reading TERMINAL TASK IDS ALONE.\n\n**The STALE-PROVENANCE marker\
  \ — a REPORT, never a route (X-0486).** Each **actionable** row\nalso derives a\
  \ `stale_provenance` flag. The task it was noticed under has CLOSED, so the followup\
  \ may\nALREADY be fixed by that land. Unmarked, it is invisible: X-0486 saw later\
  \ sessions read the same\nactionable row, fail to notice the fix had, and re-promote\
  \ it — 3 wasted dispatch cycles + 3\nwont-do cards in ONE revizia (fingerprint `landed-fix-leaves-source-followup-open-stale-queue`).\n\
  `followup list` renders the hint on the row and `open_followup_counts` reports `actionable_stale`\n\
  BESIDE (never instead of) the actionable count.\n\n**The flag's condition is THREE-PART\
  \ — membership, ordering AND provenance.** It\nis True iff (i) its `relates_to`\
  \ names a task in `terminal_ids`, AND (ii) the closing land could\nPOSSIBLY have\
  \ fixed the row — suppressed only where BOTH timestamps are in hand AND the record's\n\
  `added_at` is strictly after that task's `closed_at` — AND (iii) the row was not\
  \ captured BY\nCONSTRUCTION at that closure: suppressed where the record's own `session_ref`\
  \ is a recorded\nclosure-window session of that card. Part (ii) asserts a NECESSARY\
  \ CONDITION on the marker's own\nclaim: for a land to have fixed a row, the row\
  \ must have EXISTED when the land ran, so a followup\ncaptured AFTER its provenance\
  \ reached terminal status provably cannot have been fixed by it.\n\n**Part (iii)\
  \ — the by-construction suppression (resolving X-1239 + X-1241).** Part (ii)\nsubtracts\
  \ only rows captured AFTER the closure; the dominant real shape is the opposite.\
  \ A followup\nFILED AT its card's closure — noticed while writing the closure, captured\
  \ minutes BEFORE the\n`task_closed` row — satisfied (i) and was never reached by\
  \ (ii), so the marker fired on essentially\nevery close-time filing. <project> measured\
  \ it twice: of 134 marked rows 125 were still LIVE against\nthe checkout (a reader\
  \ trusting the marker drops ~93% of rows wrongly), and of four rows judged by\n\
  measurement two WERE fixed but by later, unrelated cards — not by the closing land\
  \ the marker named.\nA closure reaches `main` through TWO sessions in the ordinary\
  \ shape — the one recording `task_closed`\nand the one running the `land` that folds\
  \ it — so the closure window is the SET of both session refs\nper card, and a capture\
  \ from either is by construction part of that closure rather than an\nindependent\
  \ observation about it. Membership is an EXACT match on RECORDED session refs; nothing\
  \ is\ninferred from timestamps or prose.\n\nPart (ii) exists because the one-part\
  \ condition carried no information. Measured on the kernel's live\nopen set 2026-08-26:\
  \ of 63 actionable rows, 52 named a terminal task and 52 of those 52 were flagged\
  \ —\nthe marker fired on 100% of the rows it was ELIGIBLE to fire on, so the \"\
  one glance\" cost\nargument budgeted was paid 52 times rather than once. It converged\
  \ there STRUCTURALLY: `relates_to`\nnames the card its author was working on when\
  \ they noticed the thing, and that card closes as a matter\nof course, so the flag\
  \ tracked TIME PASSING rather than fixed-ness.\n\n**FAIL-OPEN on the marker, and\
  \ this is load-bearing.** Any gap in the evidence — no closure timestamps\nsupplied,\
  \ no recorded `closed_at`, no `added_at`, no recorded `session_ref` on either side\
  \ (every\nrecord born before) — leaves the ordering or the provenance UNPROVEN and\
  \ the marker firing\nexactly as it did before parts (ii) and (iii) existed. The\
  \ rule only ever SUBTRACTS a proven impossibility, so it\ncan never re-open X-0486\
  \ by guessing a row safe.\n\n**Bound, stated rather than glossed:** part (ii) removes\
  \ the rows the closure PROVABLY could not have\nfixed (on that live set, 52 of 52\
  \ eligible down to 41 of 52). It does not remove a row whose closing\ndiff simply\
  \ never touched its subject — that is not derivable without parsing free-form prose,\
  \ which\nis the inferred-not-declared mistake `awaits` exists to end. Two richer\
  \ keys were considered and\nREJECTED: the card's `created_at` (it would unflag the\
  \ X-0486 shape itself — a capture made DURING its\nprovenance card), and the provenance's\
  \ last SHIP commit (measured WORSE, because `commit_landed` also\ncarries the Stage-9\
  \ closure record, and separating the two means classifying commit subjects).\n\n\
  **The rendered hint STATES A FACT, NOT A HYPOTHESIS.** It renders the two timestamps\
  \ and\nnothing else — \"provenance T-XXXX closed <ts>; this was captured <ts>\"\
  \ — so a reader can tell why\nthis row and not its unflagged neighbour, and forms\
  \ the verdict themselves. The former tail, \"the\nclosing land may already have\
  \ fixed it; verify before promoting\", is RETIRED: it named a MECHANISM,\nand X-1241\
  \ measured that mechanism wrong even where the conclusion was right (two of four\
  \ rows were\nfixed by later, unrelated cards). A stated reason a reader can go and\
  \ check, that does not hold, is\nworse than a plain miss — so whether the closure\
  \ touched THIS row's subject, which was never\nderivable here, is no longer implied.\n\
  \n**This is NOT the fire key returning — the boundary is ADD vs SUBTRACT, and it\
  \ is NORMATIVE.**\nFiring on `relates_to` asserted that an AWAITED MOMENT had ARRIVED;\
  \ that assertion RECLASSIFIED the row\nout of the headline, and its false positives\
  \ silenced 9 live captures. The marker asserts nothing about\narrival and MOVES\
  \ NO ROW: a flagged followup stays `actionable`, stays in the headline count, keeps\
  \ its\nstatus `open`, and merely gains a hint for the human who disposes it. `awaits`\
  \ therefore remains the\n**SOLE fire key**, and no verb may auto-promote/auto-drop\
  \ off this flag — a free-form provenance ref is\nambiguous evidence, and auto-mutating\
  \ on it is the CHARTER §6 surface-don't-auto-mutate fence. The\nasymmetry that makes\
  \ the prose key admissible HERE (and only here): a false marker costs one glance,\n\
  while a missed one costs nothing at all — the row keeps exactly the visibility it\
  \ already had.\nMembership is an **EXACT** match against the terminal ids: `relates_to`\
  \ is free-form, and a regex that\nguessed an id out of prose would be the inferred-not-declared\
  \ mistake `awaits` exists to end. Only\nACTIONABLE rows are marked — an armed row\
  \ already carries a DECLARED fire key, and a second\nprovenance-keyed hint beside\
  \ it would re-blur the two fields separated.\n\n**Why the fire key is `awaits` and\
  \ not `relates_to` (the incident).** Keying the fire on\nprovenance made a followup\
  \ fire the instant the task it was merely ABOUT closed — which is precisely NOT\n\
  what it waited for. On 2026-07-10 **all 9** live `fired` rows were false: each awaited\
  \ a FUTURE event\n(the next real revizia run, the next `-C` consumer init, <project>'s\
  \ next land, the next\nowner-invoked T7 run, a plan's revival) that had not occurred.\
  \ Fingerprint:\n`followup-fire-on-relates-to-not-awaited-condition`. The cost is\
  \ not noise — it is a debt echo that\ntrains its reader to ignore it.\n\n**Re-arming\
  \ is the CORRECTION path — `arm` on a FIRED followup returns it to `armed`.**\n\
  `arm` re-states the WHOLE awaited condition (`trigger` + `awaits` together, last\
  \ write wins), so it\napplies to a followup in ANY open group, `armed_fired` included:\
  \ the operator is saying \"the fire was\nwrong, here is the real condition\". Previously\
  \ `arm` was a silent NO-OP on a fired item — firing derived\nfrom the irreversible\
  \ fact that the provenance task was closed, and `arm` could not touch it, so a\n\
  wrongly-fired followup stayed fired forever (`followup-arm-noop-on-already-fired`).\
  \ This needs **no\nun-fire leg and no new state**: `fired` is a derived VIEW of\
  \ an `open` record, so re-arming simply\nchanges what the view reads. `relates_to`\
  \ is never rewritten by an arm — what a followup is ABOUT does\nnot change when\
  \ the operator re-states what it WAITS FOR.\n\n**Why the trigger is DECLARED and\
  \ never inferred from the capture text.** Armedness is a human judgement\nabout\
  \ a FUTURE event; a regex over free prose must guess, and the two misclassifications\
  \ are NOT\nsymmetric — a false-ARMED item silently drops OUT of the owner's headline\
  \ (strictly worse than noise),\nwhile a false-ACTIONABLE item merely stays visible.\
  \ So every unknown falls to **actionable**, and the\nfire check proves arrival only\
  \ for the artifact-named class. The SAME discipline governs `awaits`: it is\ndeclared,\
  \ never parsed out of the trigger prose — a regex that guessed an awaited artifact\
  \ would\nresurrect exactly the false-fire above. **Honest limit:** a trigger naming\
  \ a plan slug or a bare future\nevent (\"next real dispatch\") has no machine-resolvable\
  \ artifact — so, per the rule below, such an item\nis NOT ARMED AT ALL: it stays\
  \ ACTIONABLE and is disposed by an explicit act (promote/drop).\n\n**Why `awaits`\
  \ is REQUIRED wherever a trigger is written — the write door, not the read\nside.**\
  \ The honest limit above was, for two months, a permitted STATE rather than a refusal,\
  \ and it\nbecame the default one. MEASURED 2026-08-30 by folding the segment-aware\
  \ journal: of **207 open armed\nfollowups, 200 carried NO `awaits`** — only 7 carried\
  \ one. Oldest 2026-07-04; 35 in July, 164 in\nAugust, a rising rate.\n\nThat state\
  \ is the WORST the mechanism can produce, and worse than leaving an item actionable.\
  \ Arming\nREMOVES an item from the actionable headline, while `_partition_open`\
  \ fires on `awaits` ALONE — so an\narmed record with no `awaits` is invisible at\
  \ session start AND can never come back on its own. The\nactionable items at least\
  \ stay visible; these were silent. And it was the CHEAPEST state to reach:\nthe\
  \ shortest path to arming was the path that produced an unfireable waiter.\n\nSo\
  \ `--awaits` is REQUIRED beside `--trigger` at BOTH doors — `arm`, and `add`'s born-armed\
  \ path, which\nis the same claim reached by a second route — refusing BEFORE any\
  \ append, so a refused capture leaves\nthe item open, visible and disposable. A\
  \ bare future event with no artifact to name is kept ACTIONABLE\nrather than armed\
  \ into silence. This is the THIRD application of one discipline to this verb family,\n\
  not a new mechanism (CHARTER §P1 F1): `promote --into` was made REQUIRED for the\
  \ identical stranding\nshape (X-0165) and `arm --trigger` was made required for\
  \ it too; this closes the last optional field of\nthat form. No new validator layer,\
  \ no new event, no new store, no FSM leg.\n\n**The rule is asymmetric between WRITE\
  \ and READ, deliberately.** It forbids CREATING the shape; it does\nnot reinterpret,\
  \ silence or auto-dispose the ~200 that exist. Those still fold to `armed_waiting`\
  \ — open,\nvisible in `list --status armed`, disposed by hand — exactly as the migration\
  \ below promises. The two\nconcerns are separate: forbidding new ones is this rule,\
  \ and disposing of the existing population is its\nown work, which must run AFTER\
  \ this rule lands or it would re-create what it removes.\n\n**`unarm` is untouched**\
  \ — it writes `trigger: null` AND `awaits: null` together, which satisfies\n`armed\
  \ <=> trigger AND awaits` by clearing both, and remains the route back to the headline.\n\
  \n**MIGRATION of pre-`awaits` records (EXPLICIT — no silent reinterpretation).**\
  \ No event is\nrewritten and no capture text is touched. Every record captured before\
  \ `awaits` existed folds to\n`awaits: None`, hence reads **`armed_waiting`**. This\
  \ is the LOSSLESS direction and it is CORRECT for\nthe 9 live rows it moved (each\
  \ awaited a future event, none awaited a closed artifact): they stay OPEN,\nstay\
  \ visible in `list --status armed`, keep their text / trigger / `relates_to`, and\
  \ each returns to the\nheadline by an explicit act — `arm --awaits <artifact>` once\
  \ a machine-checkable artifact exists,\n`unarm`, or promote/drop. Nothing is dropped,\
  \ silenced, or auto-disposed. What is WITHDRAWN is a FALSE\nclaim (\"its awaited\
  \ moment arrived\"); withdrawing a false claim needs no migration event, and\nre-asserting\
  \ a TRUE one is the operator's explicit `arm --awaits`.\n\n**The closure guarantee.**\
  \ Arming DEFERS a followup out of the headline; the UNFLOORED `armed_fired`\nclause\
  \ guarantees it comes BACK. Arming can never make a followup disappear indefinitely\
  \ — and since\n the guarantee is structural rather than conventional at the write\
  \ door: a NEW armed record\nalways names the artifact whose closure fires it. A\
  \ LEGACY record with no `awaits` is one an operator\nmust dispose BY HAND, exactly\
  \ as an unresolvable plan-slug trigger already was, never one that hides.\n\n###\
  \ The link may be DECLARED AT FILING\n\nA task card MAY declare, in an optional\
  \ `promotes: [fu_...]` field, the OPEN followups it CARRIES.\nEach declared id is\
  \ promoted AT FILING — one ordinary `followup_promoted {followup_id, into}` per\n\
  id, appended by `task file` in the same command. There is no second promote mechanism,\
  \ no second\nevent shape and no second FSM: what this adds is the MOMENT, not a\
  \ new leg.\n\nWhy the moment matters. Before it, the only way to state the link\
  \ was a SECOND manual act after the\ncard existed, and the journal records what\
  \ that cost: of 221 `followup_promoted` rows, ZERO preceded\ntheir target card's\
  \ `task_filed`, and all 219 that have one came after it — 174 of those within ten\n\
  minutes (measured 2026-08-15 by joining the two event types on task id). Until someone\
  \ ran that\nsecond command, work that HAD been filed kept reading as open debt in\
  \ the actionable count the owner\nreads to size the backlog.\n\n**DECLARED, NEVER\
  \ INFERRED — the bound, restated because this is exactly where it would erode.**\
  \ The\nlink is what the FILER states. No overlap hit, title-keyword screen or heuristic\
  \ ever promotes\nanything: this spec settled that axis once, when keying the fire\
  \ on `relates_to` made all 9 live\nrows false. The filing-time overlap screen stays\
  \ ADVISORY and gains only the\nmirror of `_cites_cross_without_resolves` — it WARNs\
  \ when it names an open followup the card did NOT\ndeclare, and prints nothing when\
  \ every named one was declared. A screen may raise a question; only\na declaration\
  \ mutates state.\n\n**FAIL-CLOSED, AND ENTIRELY BEFORE THE WRITE.** Three refusal\
  \ shapes, each naming the offending id:\na malformed token (not the `fu_` + 12-hex\
  \ shape), an unknown id (absent from the fold), and an\nalready-terminal id (re-promoting\
  \ it would overwrite the carrier already on record). A silent skip\nis forbidden\
  \ — that is the X-0304 silent-drop class the stdin path already burned once. The\n\
  SPEC-0170 source-cluster provenance gate applies unchanged, sharing ONE implementation\
  \ and ONE\nwording with the standalone `promote` leg; at filing it reads the COMPOSED\
  \ card text, since the\ntarget card does not exist yet. Every check therefore precedes\
  \ the write, so a refused declaration\nleaves no card on disk, no id consumed and\
  \ no `task_filed` emitted — the filing happens whole or not\nat all. The emit leg\
  \ that follows validates nothing, by construction.\n\nThe field is the followup-axis\
  \ MIRROR of `resolves_cross` (SPEC-0085) — same additive-optional\nshape (absent\
  \ key = no declaration), same both-paths ingestion (argv flag + stdin mapping),\
  \ same\nmember validation before the write, same journal mirror in `task_filed`.\
  \ Reusing that shape is why\nthis adds no store, no verb and no gate that refuses\
  \ a filing over an overlap.\n\n### Read-path == write-path resolution (HARD)\nThe\
  \ fold read-path MUST resolve the SAME effective journal the append writes to: the\
  \ host residue\nhonors `YITC_EVENTS_SINK` (precedence over `EVENTS_PATH`) for BOTH\
  \ the append (via `_append_event`) and\nthe fold — otherwise a sink-quarantined\
  \ run cannot observe its own capture (the hermetic-test\ninvariant; also the correct\
  \ production invariant).\n\n**This is a MUST-INCLUDE, not a MUST-BE-ALONE (X-0952).**\
  \ One read-path — the DECLARED\n`--promotes` link resolved at `task file` — folds\
  \ the SPEC-0168 rule-1 instance PAIR: the effective\njournal above (always FIRST,\
  \ so keep-first de-dupe prefers the instance the promote event will\nitself be appended\
  \ to) PLUS the repo MAIN checkout's root `events.jsonl` when a distinct one exists.\n\
  The rule above is UNVIOLATED: the write side's instance is still resolved, still\
  \ first, still the\none a sink-quarantined run observes its own capture in. What\
  \ the pair adds is an instance the write\nside never claimed to be the only one.\n\
  **Why the pair is forced by THIS spec's own rules.** `followup add` is a no-worktree\
  \ capture from\nthe main checkout (§Capture, the append), while a card is filed\
  \ from a worktree (\nworktree-before-write) that may have branched BEFORE the capture.\
  \ So capture-on-main →\nfile-in-worktree is the order the rules ENDORSE, and a single-instance\
  \ lookup refused a real open\nfollowup as unknown — the filer then filed WITHOUT\
  \ the link and the followup kept reading as open\nactionable debt (measured: <project>\
  \ against fu_4fb0763233c9, captured ~20 min before the\nworktree existed).\n**Bounds.**\
  \ No second notion of \"the other journal\" is invented: the instance set and the\
  \ resolver\nare SPEC-0168 rule 1's, reused. Widening WHERE an id may be found does\
  \ NOT widen WHAT is accepted —\nevery refusal leg of `validate_promotes` is unchanged,\
  \ so an id in NEITHER instance still refuses\nfail-closed. And the union is replayed\
  \ in TIMESTAMP order, never concatenation order: `status` is a\nfold over the FSM\
  \ below, so a `followup_promoted` replayed before its own `followup_added` would\
  \ be\ndropped and the item would read `open` when it is terminal — journal LAYOUT\
  \ deciding FSM outcome.\nThe single-instance fold is unchanged and replays in file\
  \ order.\n\n### Id is collision-safe\nThe followup id is `fu_` + a hash of the text\
  \ + a UNIQUE nonce (`uuid4`), so two identical captures at\nthe same timestamp granularity\
  \ get DISTINCT ids — never merged into one logical followup.\n\n### Placement (leaf-up)\n\
  Per SPEC-0080 §P-A1 (net-new code authored in its own module): the body lives in\
  \ `bin/lib/followup.py`\n(stdlib-only, host deps injected), with only a thin residue\
  \ (argparse + dispatch) in the host.\n\n## Rationale\n\nReal incident / prior-art:\
  \ X-0056 (<project>) — the markdown followups-inbox is trial-proven\ninsufficient\
  \ (worktree+land per staging note). The cross verb family (SPEC-0085/0086) is the\
  \ direct\nstructural prior-art: a journal-append FSM verb family whose state is\
  \ a derived fold. Owner-approved\nnew mechanism (when-NOT-to-add ratified 2026-06-21).\
  \ Authored work-first.\n\n## Verification\n\n- Adoption (§P3/§P8): activates at\
  \ close; a live `followup add` records a real `followup_added`\n  (the live-trigger\
  \ probe).\n- State-check: a hermetic test drives `add → promote` and `add → drop`\
  \ (both legs) and asserts the fold\n  reports the right terminal state; an unknown-id\
  \ / double-transition is refused.\n- No-worktree: `followup add` succeeds from a\
  \ non-worktree checkout (the -class append).\n- Fire key (DIFFERENTIAL): a followup\
  \ whose `relates_to` is TERMINAL but whose `awaits` is not\n  reads `armed_waiting`;\
  \ its sibling whose `awaits` IS terminal still reads `armed_fired`. A fix that\n\
  \  merely suppressed the lens would fail the second half.\n- Re-arm : `arm` on a\
  \ FIRED followup returns it to `armed` with the new trigger recorded.\n- Migration\
  \ : a legacy record carrying no `awaits` never auto-fires; it stays open + visible.\n\
  - Required `awaits` (DIFFERENTIAL): `followup arm <id> --trigger X` with NO `--awaits`\
  \ is\n  REFUSED and appends NO `followup_armed`; `followup add --text X --trigger\
  \ Y` with no `--awaits` is\n  refused on the same terms (born-armed and later-armed\
  \ are one claim reached two ways). Both FAIL on\n  the pre-change code, where each\
  \ succeeds and folds to armed — the path that produced 200 of the 207\n  open armed\
  \ records. The refusal is FAIL-CLOSED, not lossy: after a refused arm the item is\
  \ still\n  OPEN and still listed by `followup list --status actionable`. The positive\
  \ halves are asserted too,\n  so a fix that merely refused everything cannot pass,\
  \ and the READ side is pinned unchanged: a legacy\n  awaits-less record still folds\
  \ to `armed_waiting`.\n  Probe: tests/test_t11863_followup_arm_requires_awaits.py.\n\
  - Declared-at-filing (DIFFERENTIAL): filing a card WITH `--promotes <id>` emits\n\
  \  `followup_promoted` with `into` naming that card and drops the followup out of\
  \ the actionable\n  lens; filing the SAME card WITHOUT the declaration leaves it\
  \ actionable and emits nothing. A\n  no-op would pass neither half.\n- Declared-at-filing\
  \ REFUSALS : each of the three bad shapes — malformed token, unknown\n  id, already-terminal\
  \ id — exits nonzero NAMING the id, and writes NO card (the pre-write\n  ordering\
  \ is asserted, not just the exit code: a silent skip, or a card left on disk beside\
  \ a\n  failed promote, FAILS).\n- Overlap WARN, both directions (COHORT COMPLEMENT):\
  \ a card that declares nothing while\n  the screen names an open followup WARNs;\
  \ the same card declaring all of them does not. The WARN\n  cannot go green by never\
  \ firing.\n- Stale provenance (DIFFERENTIAL): an actionable followup whose `relates_to`\
  \ is TERMINAL is\n  flagged + counted + rendered as possibly stale, while its twin\
  \ with an OPEN `relates_to` is\n  UNTOUCHED (a fix that flagged every row fails\
  \ the second half). ANTI-REGRESSION half: the flagged\n  row is STILL `actionable`,\
  \ still `open`, and still headline-counted — never fired, reclassified, or\n  auto-disposed\
  \ (a fix that routed on provenance would revive and fails here).\n- Stale-provenance\
  \ ORDERING (DIFFERENTIAL): a fixture PAIR identical except for the order of\n  `added_at`\
  \ and the provenance's `closed_at` — the later-captured row is UNFLAGGED and the\n\
  \  earlier-captured one STAYS FLAGGED, asserted together so the ordering cannot\
  \ be claimed without\n  being exercised (a fix that flagged both, or neither, fails\
  \ one half). FENCES, each its own leg: a\n  capture made DURING its provenance card\
  \ is STILL flagged (the X-0486 shape — the over-correction\n  that would re-open\
  \ the incident); an UNPROVEN ordering (no closure map / no `closed_at` / no\n  `added_at`)\
  \ leaves the marker firing (fail-open, asserted not assumed); rows whose `relates_to`\
  \ is\n  absent or is not a task id stay byte-identical. NO PREVALENCE NUMBER is\
  \ asserted anywhere — a\n  tripwire on today's flagged-over-eligible ratio would\
  \ go red when the corpus legitimately shifts\n  (SPEC-0165), so what is pinned is\
  \ the rule's behaviour on constructed fixtures.\n"
