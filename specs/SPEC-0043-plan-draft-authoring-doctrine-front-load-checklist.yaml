id: SPEC-0043
title: Plan-draft authoring doctrine — front-load checklist delivered at draft-entry
status: active
created_at: 2026-06-06 07:14:05+00:00
consumed: false
implements:
- bin/lib/plan.py#cmd_plan_file
binding:
- plan-stage-entry:draft
body: "## Scenario\n\nWhen the owner/AI starts a PLAN, the draft is FRONT-LOADED rather\
  \ than left vague: at `plan file`\nthe session receives this doctrine + a skeleton\
  \ whose sections prompt the same questions a good\ndraft answers UPFRONT — what\
  \ problem, what \"done\" looks like to the owner, how it will be verified,\nwhich\
  \ external checks apply, and what spec/task/decision outputs it expects. So a draft\
  \ is never a\nbare title that someone later has to reverse-engineer intent from;\
  \ the thinking that makes the\nlater stages cheap (specs → accepted → executing\
  \ → postcheck) is captured at the start. A session\nREOPENING an existing `status:\
  \ draft` plan rediscovers this doctrine the same way it finds any\nstage detail\
  \ — the always-loaded LIFECYCLE §Plan-lifecycle draft-row pointer → `graph query\n\
  SPEC-0043` (no new read verb).\n\n## Internal\n\nTHE PLAN-DRAFT AUTHORING DOCTRINE\
  \ — the retrieved home for WHAT a draft should front-load, delivered\nat draft-entry\
  \ (`plan file`) on the `plan-stage-entry:draft` axis alongside SPEC-0034. This is\
  \ a\nCHECKLIST, not a gate: it shapes authoring; it does NOT block any transition\
  \ (there is no draft-\ncompleteness validator — out of scope, and a CHARTER non-goal\
  \ #2/#7). **Draft check-carrier — SHIPPED by (R7), SPEC-0059 §First-stage-check-carrier-gap.**\
  \ The draft stage now has a dedicated END verb, `plan draft --finalize` (the plan-axis\
  \ mirror of `task analyze --finalize`): it read-checks the draft bundle [SPEC-0043,\
  \ SPEC-0034] and emits a body-hash-bound `plan_draft_finalized` journal proof (provenance\
  \ — only this verb emits it), and `plan stage specs` REQUIRES a fresh such proof\
  \ matching the current body + the recorded reads (non-skippable). The BLOCKING gate\
  \ is the doctrine READS + the recorded STATE — NOT section completeness: the front-load\
  \ section-fill stays a REPORT-ONLY advisory (the verb WARNs about unfilled sections,\
  \ it does not gate on them), so the «no draft-completeness validator / non-goal\
  \ #7» stance above is unchanged. The gate MECHANIC is normative in SPEC-0034 §draft\
  \ + SPEC-0059 (pointer, not restated here). It is POINTER-BASED: every\ngate MECHANIC\
  \ stays normative in its own home (cited inline) — this spec never restates a gate\
  \ rule\n(SPEC-0005 rule 3 content-boundary / P5 one-home / rule 8 prompts-checklists-cue+pointer\
  \ — a\nfront-load checklist item carries a discipline CUE + a POINTER, never a restated\
  \ corpus rule).\n\n### The front-load checklist (author any plan draft against these\
  \ — a checklist, NOT a gate)\n1. **Problem / intent + prior-art sweep.** State what\
  \ is wrong/missing and why now; do the\n   Principle-1 prior-art sweep FIRST (`graph\
  \ query <related-spec>` / `graph query --type view` /\n   grep — does an analog\
  \ already exist? extend over create). The sweep is the CHARTER §P1 F1 filter,\n\
  \   homed there — this is a pointer. ALSO surface relevant `lessons/` entries for\
  \ this topic — the\n   plan-draft lessons read-surface (<workshop-spec> Rule 1).\n\
  2. **Owner-visible done-criterion.** Name the result the OWNER would recognize as\
  \ \"done\" (the\n   plan's eventual `realized` proof reads back to it). Not \"code\
  \ shipped\" — an observable outcome\n   (CHARTER §P3 done=adopted, homed there).\n\
  3. **Verification plan UPFRONT.** Sketch the probe targets, the real-data soak expectation,\
  \ and a\n   `postcheck` probe-block STUB (observed / min-runs / failure-threshold\
  \ / evidence-home) — so the\n   plan declares HOW it will be proven before it is\
  \ built, not after. The postcheck probe-block\n   contract is normative in SPEC-0034\
  \ §postcheck — this is a pointer to fill the stub there.\n4. **External-checks map\
  \ + trial-eligibility question.** Note which external audits apply at which\n  \
  \ boundaries (gate templates: SPEC-0036 / SPEC-0034 §Audit-posture), and answer\
  \ the\n   trial-eligibility question (SPEC-0035) — does this plan need a real-data\
  \ trial?\n5. **Deferrals as tracked tasks, never prose.** Carry any \"do later\"\
  \ as a tracked task, never a\n   sentence in the draft (the deferral-as-prose trap)\
  \ — rule + check in <workshop-spec>.\n6. **Quantitative / foundational claims →\
  \ big-plan discipline.** If the draft makes\n   quantitative/foundational claims,\
  \ apply the big-plan discipline\n   (`patterns/big-plan-checklist.md` / SPEC-0034\
  \ §Mandatory-big-plan-check). If a claim is a SCOPE\n   SIZING of a refactor / rename\
  \ / relocation (a ref-count / blast-radius), it must be BACKED by the\n   SPEC-0046\
  \ §A Sizing rule, not estimated — pointer only, rule homed there (P5).\n7. **Planned\
  \ artifacts / corpus impact.** Name the expected spec/task/decision OUTPUTS the\
  \ plan\n   anticipates creating or changing — or explicitly say \"none yet\". This\
  \ keeps a draft from staying\n   vague about its corpus footprint (the F2 finding\
  \ of the motivating ad-hoc audit). And\n   declare the plan's SCENARIO INPUTS the\
  \ same way: if the plan shapes/touches a user-path, list\n   the scenario slug(s)\
  \ in the plan's `cites:` (reuse the any→any cites edge — NOT a new\n   `scenarios:`\
  \ field, CHARTER §P1 F2; the `cites(plan→scenario)` direction semantics are homed\
  \ in\n   SPEC-0076 §4 — pointer, not restated here).\n8. **Realization-exit criteria\
  \ UP FRONT.** Author the plan's realization-exit criteria — the\n   postcheck probe\
  \ block (observed-behaviour / min-runs / failure-threshold / evidence-home) — the\
  \ way a\n   TASK authors its `acceptance` at FILING, so the plan declares HOW it\
  \ will be proven `realized` BEFORE it\n   is built, not improvised at postcheck\
  \ entry. The skeleton seeds a `## Realization-exit criteria` prompt\n   for this\
  \ — the CANONICAL section name. FILLING that section IS the declaration the checks\
  \ read: the\n   `plan draft --finalize` advisory and the `plan stage accepted` /\
  \ `plan stage postcheck` REQUIRE-gates\n   share ONE predicate over it (`_postcheck_probe_block_declared`;\
  \ a legacy `## Postcheck probe block`\n   section still counts). So an author who\
  \ fills the seeded skeleton verbatim is never WARNed for content\n   they authored,\
  \ and an UNFILLED skeleton stub never satisfies the gate.\n   The criteria are CONFIRMED\
  \ into the plan at `accepted`; the normative contract (incl. that they\n   are author-declared\
  \ + owner-judged, no coded gate) is homed in SPEC-0034 §accepted/§postcheck — this\
  \ is a\n   pointer to fill them, not a second home (P5 / rule-3 content-boundary).\
  \ (Distinct from item 3's\n   verification-plan SKETCH: item 3 sketches probe targets;\
  \ this names the concrete EXIT criteria.)\n\n### Resume path for an existing `status:\
  \ draft` plan (no new read verb)\nSessions never scan `plans/` (the picker reads\
  \ `tasks/` only), and `plan stage draft` is unreachable\n(draft is the INITIAL status\
  \ — the bundle is delivered by `plan file`, not by a stage verb). So a\nsession\
  \ reopening a draft rediscovers this doctrine via the ALWAYS-LOADED LIFECYCLE §Plan-lifecycle\n\
  draft-row pointer → `graph query SPEC-0043`. That pointer IS the sole rediscovery\
  \ route by design;\nno read verb is added for resumed draft authoring (the F1 finding\
  \ of the motivating ad-hoc audit).\n\n### Delivery wiring (how this doctrine reaches\
  \ the author)\n`cmd_plan_file` delivers the `plan-stage-entry:draft` bundle (this\
  \ spec) through the SAME path every\nother plan stage uses — `_emit_plan_stage_entered(slug,\
  \ None, \"draft\")` + the shared delivery print\nhelper `_print_plan_stage_delivery`\
  \ (also called by `cmd_plan_stage`, so the delivery print format\nhas ONE source\
  \ — no mirror/copy). The generated plan skeleton carries the base sections (## Problem\
  \ /\nintent · ## Done criterion · ## Verification plan · ## External checks / audits\
  \ · ## Planned\nartifacts / corpus impact · ## Realization-exit criteria) as PROMPTS\
  \ + pointers. Ideas (`plan file --idea`) are flat holding pens —\nthey get NEITHER\
  \ the draft-stage delivery NOR the heavy skeleton (unchanged).\n( last-touch refresh:\
  \ `cmd_plan_file`'s trailing next-hint also carries the post-specs FORK\npointer\
  \ — trial-eligible → `plan stage trial`, else → `plan stage accepted` — but that\
  \ pointer is\ngoverned by SPEC-0034/SPEC-0035, NOT this front-load doctrine; this\
  \ spec's delivery rule + skeleton\nsections are unchanged. Note recorded to re-verify\
  \ the anchor and clear the drift warning.)\n\n### Anti-complexity note (SPEC-0005\
  \ §7 / CHARTER §P1 F3 — what is retired)\nNOTHING is retired by this spec. It is\
  \ admitted because it fills a real WIRING + CONTENT gap (the\ndraft bundle was never\
  \ delivered, and no doctrine said what a draft should front-load), NOT because\n\
  it accretes a parallel mechanism: it REUSES the existing plan-stage-entry axis,\
  \ the existing\n`_emit_plan_stage_entered` delivery helper, and the existing `cmd_plan_file`\
  \ verb — no new gate, no\nnew verb, no new store, no draft-completeness validator.\
  \ (The F3 finding of the motivating ad-hoc\naudit explicitly noted F3 needs no retirement\
  \ here.)\n\n## Parameters\n\nNone consumed. Every governing constant referenced\
  \ (the big-plan apply-when criteria; the audit\ntemplates; the trial-eligibility\
  \ rule; the decomposition discipline) lives in its OWN spec/pattern\n(SPEC-0034\
  \ / SPEC-0035 / <workshop-spec> / big-plan-checklist) — pointed at, NEVER duplicated\
  \ or\n`consumed:` here (SPEC-0005 rule 3 / P5).\n\n## Rationale\n\nThe TASK lifecycle\
  \ front-loads thinking (Stage-1 Analysis is a delivered, ordered procedure); the\n\
  PLAN draft stage had the delivery AXIS (SPEC-0034 binds `plan-stage-entry:draft`)\
  \ but the bundle was\nnever delivered — `draft` is the initial status, so `plan\
  \ stage draft` is never called. A session\nfiling a plan therefore got no front-load\
  \ guidance, and a draft could stay a bare title. The\nmotivating ad-hoc audit (decisions/plan-draft-authoring-spec-audit-adhoc.yaml,\
  \ YELLOW) confirmed\nOption A — keep doctrine in ONE normative home, reuse the existing\
  \ stage-entry axis, add no new\ngate/verb/store — and surfaced three refinements\
  \ absorbed here: F1 (state the resume path\nexplicitly), F2 (require a planned-artifacts/corpus-impact\
  \ section), F3 (stay pointer-based; note no\nretirement needed). Split-by-surface\
  \ from SPEC-0034 (SPEC-0005 rule 6): SPEC-0034 is the per-stage\nMECHANICS home\
  \ delivered at every plan-stage transition; this is the draft-authoring CONTENT\n\
  delivered at the distinct `plan file` moment — a stable surface boundary, materially\
  \ improving change\nanalysis (the mechanics spec stays lean; the authoring checklist\
  \ evolves independently). Prior-art:\nPEP-1 / ADR templates ship an authoring skeleton\
  \ with the artifact class, prompting the same\nquestions upfront.\n\n## Verification\n\
  \nProbe CONTRACTS (RED-GREEN — observe failing before trusting):\n- **VP1 (active\
  \ + bound, AC1 — POST-close):** after `task close `, SPEC-0043 is `status:\n  active`\
  \ with `binding: [plan-stage-entry:draft]`; `graph build` + `graph conformance`\
  \ exit GREEN\n  with it present (valid binding token, non-dangling — non-empty `implements:`\
  \ + a valid routing\n  binding). Remove the binding token → it reappears in `binding_report.dangling_specs`.\
  \ PRE-close it\n  is `proposed` (the activation gate has not fired) — do NOT assert\
  \ `active` before close.\n- **VP2 (delivery fires at draft-entry, AC2 — P8 live-trigger):**\
  \ `plan file` on a sandbox plan\n  emits `plan_stage_entered {from: null, to: draft,\
  \ delivered: [..SPEC-0043..]}` AND prints the\n  delivered bundle naming SPEC-0043.\
  \ Probe: tests/test_t0416_draft_doctrine_delivery.py.\n- **VP3 (skeleton base sections,\
  \ AC3):** the generated plan skeleton contains the six base\n  sections (## Problem\
  \ / intent, ## Done criterion, ## Verification plan, ## External checks /\n  audits,\
  \ ## Planned artifacts / corpus impact, ## Realization-exit criteria — the sixth\
  \ added). Probe: state-check the sandbox `plan file` output.\n- **VP4 (idea path\
  \ unchanged — regression):** `plan file --idea` still emits the FLAT idea skeleton\n\
  \  and NO draft-stage delivery (no `plan_stage_entered`, no bundle print). Probe:\
  \ same test.\n- **VP5 (LIFECYCLE pointer, AC4):** LIFECYCLE.md §Plan-lifecycle draft\
  \ row carries the SPEC-0043\n  pointer (grep); the full mandatory handbook seed\
  \ stays ≤ 2500 lines (wc -l check).\n- **VP6 (pointer-discipline, AC5):** this body\
  \ restates NO gate mechanic — every gate rule is a\n  pointer to its home (SPEC-0034\
  \ / SPEC-0035 / <workshop-spec> / big-plan-checklist). Probe:\n  audit-pre/post\
  \ pointer-discipline check + grep (no gate-rule restatement).\n"
