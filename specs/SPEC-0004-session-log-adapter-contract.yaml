body: |
  ## Internal

  A **session-log adapter** materializes chat-class governance events from a provider's
  session transcript into events.jsonl. The contract is provider-neutral (CHARTER
  §Principle 4b); each provider gets one concrete adapter. the AI provider Code is the first
  binding. No provider name appears in this normative statement — only in adapter code.

  ### INPUT (per-provider, opaque)

  A locally-persisted, append-only session transcript identified by a `session_ref`
  (resolved fail-closed per SPEC-0002). The adapter locates it without
  inference (the AI provider Code binding: glob `~/<provider-config>/projects/*/<session_ref>.jsonl` —
  the session may launch from any cwd, so cwd-encoding is NOT used).

  ### OUTPUT (normalized, provider-neutral)

  Three parser-captured event types appended via the single emission path
  (`_append_event`), each carrying provenance (`source_ref` populated, `agent=main`):

  - `owner_directive` — human input that is neither a command nor an injection
  - `instruction_injection` — context AUTO-LOADED into the AI's input (see capture shape below)
  - `slash_command` — a slash-command invocation

  Each materialized event's `ts` = the source entry's timestamp (UTTERANCE time, not
  the sync moment) — second-precision ISO-Z, falling back to sync-time if absent.

  `source_ref` = a stable per-entry locator. the AI provider Code binding: `<path>#uuid:<entry-uuid>`.

  **`instruction_injection` capture shape — POINTER, not body (owner directive
  2026-05-29).** Materialized from `attachment` entries that carry auto-loaded context — the AI provider
  Code: `nested_memory` (<vendor-adapter>.md / AGENTS.md + nested memory files) and `skill_listing` (the
  capabilities catalog). The row records **`target` + `size_lines` + `size_chars` + `form:
  link_only` + `source: auto`** — and **NEVER the document body** (storing it would duplicate the
  versioned doc into the journal; the text-of-the-moment is recovered via `graph query --as-of`).
  Parser-captured rows are **EXEMPT from the authoring-side `rationale` / `category` / `mandatory`
  fields** ( substantive tier) — an auto-load stores no «why» ON THE EVENT (importance is joined from the docs at query time — see §Expected-reads model, not a per-row field); deliberate
  authoring-side injections keep the full schema. **Boundary:** the provider's BASE system prompt
  is not a per-session-log entry; the adapter captures what the durable log contains.

  ### Expected-reads model (folded from — the historical decision that established it)

  All information the AI is EXPECTED to read is ONE class — "expected reads" — described by two
  INDEPENDENT attributes plus a fact:
  - **arrival (moment/how):** a per-read TAG — `auto` (the harness silently pre-loads a doc, e.g.
    <vendor-adapter>.md / AGENTS.md / the skill list — `_attachment_injection`) OR `commanded` (an instruction or
    CLI verb said "read X", e.g. a governed-doc Read materialized by `_journal_sync` as `commanded_read`).
    It is a TAG on the read, never a separate entity.
  - **importance (obligatory | by-task | optional | fyi):** a property of the DOCUMENTATION's own
    framing (the four categories), JOINED at QUERY time from doc rule-extraction — NOT stored on
    the event and NOT inferred from the arrival moment (P5 — avoids duplicating doc state into the
    journal). This REVERSES the earlier carve-out that exempted auto-loads from importance: the
    "why" IS derivable, but it lives in the docs, not on the event.
  - **fact:** did the AI actually read it (present in the journal) — yes/no.

  CAPTURE: per read, record `target` + `size` + `arrival` + presence; capture is EXTENDED to COMMANDED /
  actual governed-doc reads (`_governed_read_target` gate) that were previously dropped as tool-result
  noise. OWNER-DIRECTIVE channel: drop command-wrappers / stdout / slash-command bodies (harness
  machinery) and keep the owner's own text; best-effort `classification` (directive | question | stop |
  correction) — a LOOSE heuristic, never strict normalization (`_classify_cc_entry` /
  `_infer_directive_classification`).

  The expected↔actual COMPLIANCE VIEW (join expected reads ↔ actual reads → "obligatory but NOT read")
  is a PENDING forward capability (a query joining the journal's actual-reads with the docs'
  rule-extraction importance), NOT yet an active rule — tracked as a follow-up, not part of this
  contract's live surface.

  **Classification is loose/best-effort** ( rejected strict normalization): the
  injection-vs-directive boundary may mislabel; the governance value is durable capture
  with provenance, not exact subtyping. Runtime noise is filtered aggressively (the AI provider
  Code: mode / permission-mode / file-history-snapshot / last-prompt / ai-title /
  queue-operation / system / assistant / tool-result entries, plus non-context `attachment`
  subtypes — task_reminder / deferred_tools_delta / command_permissions / edited_text_file /
  queued_command — which are harness ephemera, not doc-injections).

  **NOT in this adapter's output set:** `external_audit_completed` + `audit_prompt_sent`
  are emitted by the parent CLI audit path (cmd_audit), not parser-captured.

  ### ERROR modes

  - **Fail-closed** (raises / non-zero exit): `session_ref` undetermined; an explicitly
    named session's log not found; the located log is unreadable; catastrophic parse.
    Gates every fail-closed CLI verb ( fail_closed_sync_contract).
  - **Lossy** (skip + continue): a single malformed JSONL line; an unrecognized entry
    type; an entry with no extractable text. Never aborts the batch.
  - **Current-session tolerance:** when syncing the current session (no explicit ref)
    and no log exists yet, sync is a no-op (0 events), not a failure.

  ### Idempotency + recovery

  - Per-session checkpoint (SPEC-0003) cursor (`last_processed_uuid`) → steady-state
    sync reads only entries after the cursor (no dedup needed — they are necessarily new).
  - **Stale cursor** (recorded `last_processed_uuid` absent from the log — rotated /
    truncated): treated as RECOVERY → full rescan from start, never skip-all-then-advance
    (the cursor is not lost-data-silently).
  - `source_ref` dedup on the RECOVERY path only (first-sync / stale-cursor rescan),
    against the FULL events.jsonl history → no duplicate rows for any replay size.
    (Full scan is acceptable because recovery is rare; steady-state pays nothing.)
  - Size cap: every emitted line ≤ 3500 bytes (SPEC-0002), enforced inside `_append_event`
    against the REAL serialized envelope (byte budget, not char count) — Unicode-safe.

  > **`_append_event` `events_path` param is IMMATERIAL to this contract (freshness
  > review).** `_append_event` later gained an optional `events_path: Path|None = None` arg, used by
  > `worktree new` to land `worktree_created` on the MAIN journal from inside a linked
  > worktree. It only parameterizes the TARGET journal file — it is *"still the single emission path"*
  > (function docstring). The three rules this spec pins on `_append_event` are unchanged: the **single
  > emission path**, the **≤3500-byte SPEC-0002 cap enforced inside it**, and the **envelope+provenance**.

  > **TEST-ONLY `YITC_EVENTS_SINK` is IMMATERIAL to this contract ( freshness review).**
  > `_append_event` diverts ALL appends to the named sink when the TEST-ONLY env `YITC_EVENTS_SINK`
  > is set, and `_journal_sync` is INERT under it (returns 0 — no materialization, NO checkpoint
  > advance; diverting materialized chat events while advancing the host checkpoint would silently
  > lose them — fail-closed). Child-process test scoping only; with the env unset — every production
  > invocation — the sync/idempotency/recovery contract here is unchanged.

  ### Auto-sync hook

  Every CLI verb runs the adapter sync for the current session BEFORE its own work
  (`_auto_sync` in `main`) — DEFAULT-ON. (Plus ONE mode-axis skip, not a verb exclusion:
  the sync is skipped entirely under the `-C <path> --read-only` evidence mode, because the sync
  WRITES into `REPO_ROOT` and that mode has promised not to write to the target — rule home
  SPEC-0078 §5, invariant amendment SPEC-0010.) The ONLY exclusions are `journal sync`
  (it IS the sync — no recursion; also serves manual orphan-tail recovery via
  `--session-ref <id>`) and `land` (does its own events reconcile), both marked
  `no_autosync=True`. Read-only verbs sync too — the resulting append-only allowlist dirt on
  the main checkout is folded by `land` (`_BOOKKEEPING_ALLOWLIST`), so it no
  longer blocks `land` (closes step_0).

  ### Violations

  - Hardcoding a provider name/shape in normative methodology text (use adapter code)
  - Emitting captured events without source_ref provenance
  - Silent inference of session_ref (process-tree walk / mtime) instead of fail-closed
  - Strict normalization that aborts on unrecognized provider entry shapes

  → anti-complexity filter applies; requires owner approval + a D-XXXX decision.

  ## Rationale

  The adapter is provider-neutral (CHARTER §Principle 4b) so each provider gets one
  concrete adapter without provider names leaking into normative text. Classification is
  loose/best-effort ( rejected strict normalization): the governance value is durable
  capture with provenance, not exact subtyping. Fail-closed resolution (no inference /
  process-tree walk / mtime fallback) is chosen because a silent fallback would attribute
  events to the wrong session and erode the journal's provenance guarantee.

  ## Verification

  - After a fail-closed verb, events.jsonl has ≥1 owner_directive with populated source_ref.
  - A per-session checkpoint file appears under journal-sync-state/ after first sync.
  - `journal sync --session-ref <prior-id>` materializes a named (orphan) session's tail.
  - events.jsonl contains zero runtime-noise entries (file-history-snapshot / mode).
  - tests/test_session_log_adapter.py exits 0 (synthetic deterministic fixture).

