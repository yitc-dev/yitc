    0 unmapped / 0 unknown. (tests/test_t0278_inventory_door.py + test_binding_inversion.test_exclusions.)
  - **Boundary — conformance certifies WIRING, not body-freshness :** `graph conformance`
    validates binding-COVERAGE (every active spec carries a valid binding — the dangling/unknown door
    above) + the one-source delivery invariant + handbook-routing match + floor-map sync (SPEC-0033).
    It does NOT validate spec-BODY freshness against the anchored code; body-staleness is surfaced
