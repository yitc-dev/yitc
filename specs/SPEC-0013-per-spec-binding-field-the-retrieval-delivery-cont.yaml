    `unknown_tokens`; remove the token -> it is dangling. (tests/test_t0263_query_only.py.)
  - **VP9 (delivery-observability doctrine):** the `## Internal` §Delivery-observability states,
    GENERICALLY against `FLOOR_TRIGGERS` (no restated per-verb list), that a floor-gated verb's consumed
    contract MUST be a journal-observable deterministic projection (not a fakeable self-reported fact, not
    a comprehension-proof); `bin/yitc-v2 graph query SPEC-0013` returns this rule. Doctrine probe — the
