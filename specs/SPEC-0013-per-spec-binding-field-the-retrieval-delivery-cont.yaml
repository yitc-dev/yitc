  stage-entry pointer stays as the delivery ECHO (SPEC-0042 §7). The binding field below remains the single
  canonical carrier the gate DERIVES its required doc-set from — the gate strengthens delivery, it does not
  replace this contract. The 2026-06-02 dry-run proved deriving the map from existing
  `implements:` anchors alone covers 0/6 of those gating verbs (anchors point at internal helpers, a
  different relation than verb->governing-rule) — so the explicit binding field fills a real void, it is not
  redundant. Prior-art: the declare-a-binding-then-derive-a-map shape IS the shipped `code_to_specs` /
