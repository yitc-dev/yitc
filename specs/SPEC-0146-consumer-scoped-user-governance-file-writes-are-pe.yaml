id: SPEC-0146
title: 'Consumer scoped-user governance-file writes are permitted — readonly is not FS-enforced, land does not guard governance-path writes by role'
# `class:` REMOVED — a spec carries both layers as body sections (Scenario + Internal).

status: active

created_at:

travels: ~ # kernel (class-default) — the rule governs consumer scoped-user
                               # behavior + the kernel land/FS posture, so it travels to every consumer.

consumed: false # documentary standing rule — no code reads a scalar param FROM it.

extension: ~

