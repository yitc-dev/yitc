  \  that omits the locus (it sends the reader asking for a wider grant), or one that\
  \ suggests seeking a\n  broader/different grant instead — the absence half, since\
  \ a message asserting the right thing while\n  also asserting the wrong one is not\
  \ a distinct diagnosis.\n- **V-AUTH-6 (lineage) — exactly one active head.** This\
  \ spec carries `supersedes: <workshop-spec>`, and\n  exactly ONE of the pair is\
  \ `active` at any time (this one `proposed` + <workshop-spec> `active` before\n\
  \  activation; the inverse after). Failing input: both active, or neither — either\
  \ of which means the\n  atomic flip at the activating `task close` did not happen.\n"
