id: SPEC-0191
title: Block-classification + push-vs-stop protocol — the AUTHORITY class is decided
  by the owner OR a `decide-authority` right-holder for that project
status: active
created_at: 2026-08-27 06:39:23+00:00
travels: null
consumed: false
extension: null
implements:
- bin/lib/worktree.py#cmd_land
- bin/lib/dispatch.py#DISPATCH_WORKER_PREAMBLE
- bin/lib/grants.py#decide_authority_class_cause
- bin/lib/grants.py#cmd_grants_authorize
- bin/lib/grants.py#_authorization_refusal_message
body: "## Scenario\n\nA session's verify gate BLOCKS — a failing or pinned test, an\
  \ external audit RED, a\nflaky/non-hermetic failure, or a deliberate guard/human-checkpoint\
  \ fires. The blocked session\n(most acutely a headless dispatched Worker under land\
  \ pressure) must decide: push through, or\nstop and escalate. This spec makes that\
  \ decision DETERMINISTIC and FAIL-CLOSED. A block is never\ncleared silently; it\
  \ is cleared only WITH journaled evidence that it is stale or false; when that\n\
  evidence cannot be produced, the session STOPS. The owner/AI sees a stop-and-escalate\
  \ as the\nCORRECT outcome, never as failure — the failure mode this rule exists\
  \ to prevent is the SILENT\npush past a real signal, which ships an invisible defect\
  \ (the V1 failure class V2 exists to end).\n\n## Internal\n\n> **SUPERSEDES <workshop-spec>.**\
  \ The one normative change is §5a (WHO may be THE AUTHORITY); the supersede\n> history\
  \ is in §Rationale.\n\nTHE BLOCK-CLASSIFICATION + PUSH-VS-STOP PROTOCOL. A process/governance\
  \ rule (SPEC-0005 rule 1):\na standing, provider-neutral (CHARTER §P4b) decision\
  \ procedure for any blocked verify gate. It\nADDS no new LEDGER, no new store, no\
  \ new event type and no new VERB, and §§1-5 add no mechanism at\nall — they REUSE\
  \ the existing machinery. §5a is the ONE exception and is declared here rather than\n\
  left for a reader to discover: it ships a GATE FUNCTION, `bin/lib/grants.py`\n#decide_authority_class_cause,\
  \ plus one OPTIONAL flag (`--cause`) on the EXISTING `grants authorize`\nverb. The\
  \ CHARTER §P1 filters, applied and recorded: F1 EXISTING ANALOG — admission is\n\
  delegated WHOLE to the existing `authorize`, so SPEC-0169's identity and fail-closed\
  \ rules govern\nunchanged and no second authority mechanism exists; F2 VIEW OVER\
  \ ENTITY — no new store, event type,\nverb or gated operation (the emits reuse `authorization_decided`\
  \ / `authorization_refused`, and\n`GATED_OPERATIONS` is untouched, so the decision\
  \ right stays non-executing); F3 WHAT IS REMOVED —\nthe DEAD END, an authority-class\
  \ cause on a project someone holds the right for no longer has the\nowner as its\
  \ only exit; F4 REAL INCIDENT — the twice-refused <project> card and the 2026-08-20\n\
  restriction record, both in §Rationale. The rest of this spec REUSES the existing\
  \ machinery: the governed\nrebaseline path and its recorded-reason gate (SPEC-0077\
  \ — the A-prime authority home for who may\nauthorize it: owner ack OR a qualifying-Worker\
  \ self-clear); the audit-loop ceiling\n(SPEC-0036); the dispatched-worker scope\
  \ boundary + escalation channels (SPEC-0103 — blocked-on-land\n/ bg_dispatch_halted\
  \ / graceful park); and the Worker→Controller→Owner ladder homed in\npatterns/background-session-operation.md.\n\
  \n### 1. CORE INVARIANT — never clear a block silently\nA block is CLEARED only\
  \ WITH journaled evidence that the check is stale or false; a block that\ncannot\
  \ be proven stale/false is NOT cleared — the session STOPS and escalates. The failure\
  \ is the\nSILENT push, NOT the push itself: a GOVERNED push — one that leaves durable,\
  \ journaled\nevidence of WHY the block was cleared — is legitimate. (The one governed\
  \ self-clear path a Worker\nmay take is the stale-by-design rebaseline of §2.1.\
  \ SPEC-0077 is the CANONICAL authority/flag home\nfor it — including the A-prime\
  \ conditions under which a Worker MAY self-clear vs must escalate. This\nspec only\
  \ ROUTES there; the concrete flag/verb spelling + authorization conditions live\
  \ in SPEC-0077\n+ the `land` code, not here.)\n\n### 2. BLOCK CLASSIFICATION — the\
  \ blocked session applies this FIRST\nFour classes; classify BEFORE acting. Any\
  \ class you cannot confidently assign is (4) UNCERTAIN.\n\n  1. **STALE-BY-DESIGN**\
  \ — the check asserts an OLD behaviour that THIS task's own declared scope\n   \
  \  intentionally changes, AND the check is NOT a marked deliberate/human-checkpoint\
  \ guard. The\n     Worker clears it via the GOVERNED rebaseline path with a RECORDED\
  \ reason — but ONLY under\n     SPEC-0077's A-prime conditions (candidate verify\
  \ GREEN + a FRESH GREEN audit-post + `--no-tests`\n     absent + a `>=30-char` recorded\
  \ reason MECHANICALLY tied to the exact surfaced pinned failure(s)\n     AND the\
  \ task/spec-declared behaviour/harness change that obsoletes them); free-form \"\
  looks stale\"\n     judgement is NOT enough → reclassify as (4) UNCERTAIN and ESCALATE.\
  \ SPEC-0077 is the authority\n     home for those conditions; this spec only ROUTES\
  \ there. This is the ONLY block a Worker may\n     self-clear.\n  2. **TRUE SIGNAL**\
  \ — the change is wrong / regressing / incomplete. FIX it, but ONLY within the\n\
  \     task's stated scope. If the fix would change scope or design, do NOT expand\
  \ the task to make\n     verify green — reclassify as (4) UNCERTAIN and escalate.\n\
  \  3. **FLAKE / NON-HERMETIC** — classifiable as a flake ONLY with INDEPENDENT evidence:\
  \ a\n     known/registered flake, a failure that reproduces on the UNCHANGED baseline,\
  \ or host-state\n     OUTSIDE the touched surface. A Worker does NOT self-quarantine\
  \ — quarantine is a Controller\n     decision or a named governed path; the Worker\
  \ records the evidence and escalates. Without\n     independent evidence a nondeterministic\
  \ failure may be a real intermittent bug in the changed\n     code → treat as (4)\
  \ UNCERTAIN, never assumed-flake.\n  4. **DELIBERATE GUARD or UNCERTAIN** — a guard\
  \ / allowlist / F5-class check / human-checkpoint,\n     OR any block you cannot\
  \ confidently place in 1–3 → HALT and escalate to the Controller. Never\n     self-authorize\
  \ past a deliberate guard.\n\n**AUDIT-class blocks additionally obey the SPEC-0036\
  \ audit-loop ceiling:** a passable residual\n(mode-b) needs no re-audit and burns\
  \ no pass; a plan/diff-changing finding (mode-a) consumes a pass\nand the ceiling\
  \ bounds it to ≤2 passes; at the ceiling the decision goes to the Controller (the\n\
  ceiling-convergence triage), never a silent re-run of the same gate (CHARTER §P7\
  \ re-run-vs-resolve).\n\n### 3. THREE-TIER FAIL-CLOSED LADDER\nThe classification\
  \ routes escalation up exactly one rung at a time.\n\n  - **Worker** — never clears\
  \ a block silently; classifies per §2; governed-self-clears ONLY the\n    provable\
  \ stale-by-design case (§2.1); fixes a true signal in-scope (§2.2); on a deliberate-guard\n\
  \    or uncertain block HALTS to the Controller (blocked-on-land, worktree intact\
  \ per SPEC-0103) —\n    never self-authorizes past a deliberate guard, and never\
  \ goes straight to the Owner.\n  - **Controller** — re-classifies with broader context\
  \ the Worker lacks (the whole batch, the plan,\n    sibling tasks, the journal,\
  \ the cross-log); resolves what it can (quarantine a known flake,\n    instruct\
  \ an in-scope fix, re-dispatch); escalates to the Owner ONLY a genuine design/scope\
  \ fork\n    (a CHARTER §P7 dissonance).\n  - **Owner** — decides only genuine forks\
  \ and AUTHORITY-class causes. Before a block reaches the\n    owner it climbs the\
  \ §5 RESOLUTION ladder (mechanical self-evidence → adversarial consult → owner):\n\
  \    the owner is the backstop, not a routing default. (For an AUTHORITY-class cause\
  \ this rung is the\n    AUTHORITY's, and the owner is not its only occupant — §5a\
  \ names who else may be one. The ROLE\n    ladder here is otherwise unchanged: a\
  \ Worker still never goes straight to this rung.)\n\n**DEFAULT UNDER UNCERTAINTY\
  \ = STOP.** The cost is asymmetric: a silent wrong-push ships an invisible\ndefect\
  \ (expensive, the V1 class); a wrong-stop is a cheap, visible round-trip. So when\
  \ unsure, stop.\n\n**GUARD PRECEDENCE.** A deliberate guard / allowlist / F5-class\
  \ check / human-checkpoint, OR any\ncheck OUTSIDE the task's declared scope, ESCALATES\
  \ — UNLESS the task card already carries an\nexplicit owner decision covering it.\
  \ A guard is not made stale merely because the task's scope\nhappens to touch its\
  \ surface; only THIS task's intentional behaviour-change (§2.1) makes a\nnon-guard\
  \ check stale.\n\n### 4. The pinned-vs-F5 fork — the NAMED specific instance\nThe\
  \ narrow \"pinned last-green verify vs F5 allowlist\" fork is ONE instance of this\
  \ general rule,\nnot a separate rule: correctly REBASELINED a pinned check that\
  \ its own scope had superseded\n(a §2.1 stale-by-design governed self-clear); correctly\
  \ ESCALATED an F5 allowlist-add (a §2.4\ndeliberate-guard block a Worker must not\
  \ self-clear). Both outcomes fall directly out of §2 + §3.\n\n### 5. THE THREE-RUNG\
  \ RESOLUTION LADDER — how a stuck question is ANSWERED before it reaches the human\n\
  §3 is the AGENT ladder (which ROLE decides — Worker→Controller→Owner). This §5 is\
  \ the orthogonal\nRESOLUTION ladder (which KIND OF EVIDENCE answers a stuck worker/plan/task\
  \ question) that a blocked\nsession climbs BEFORE the AUTHORITY is ever asked (the\
  \ owner, or a `decide-authority` holder for that project — §5a). This LADDER (§5\
  \ itself, as distinct from §5a — see the §Internal preamble for the one mechanism\
  \ §5a adds) ADDS NO new mechanism (SPEC-0005 rule 1): rung-1 is\nthe EXISTING §2.1\
  \ governed self-clear / diff inspection, rung-2 is the EXISTING SPEC-0124 adversarial\n\
  consult engine, rung-3 is the EXISTING escalation gate (blocked-on-land / `--ack-repeated-abort`\
  \ /\n`--owner-reset`) — an EXISTING gate, unchanged in code by this spec; §5a widens\
  \ only WHO may answer\nat that rung. It adds no VERB and no STORE of its own; what\
  \ it does add is named in full in the\n§Internal preamble above (one gate function,\
  \ plus one optional `--cause` flag on the existing\n`grants authorize`), with the\
  \ four anti-complexity filters recorded there.\n\n  - **Rung 1 — MECHANICAL SELF-EVIDENCE\
  \ (mandatory first; an auditor call costs minutes+tokens).** Valid ONLY for a NO-NEW-DECISION\
  \ case: the diff + the\n    named failing assertion + a PRE-EXISTING audited AUTHORIZING\
  \ ARTIFACT (task card / accepted plan /\n    active spec) together re-derive the\
  \ SAME conclusion. A behaviour change WITHOUT such an artifact is\n    NOT staleness\
  \ — it is a rung-2 (or authority-class rung-3) question, never a rung-1 self-clear.\n\
  \    Every rung-1 act records a compact EVIDENCE TUPLE — never prose — carrying:\
  \ (assertion id, old\n    pinned expectation, new intentional expectation, authorizing\
  \ artifact, journal ref). This IS the\n    §2.1 governed self-clear made explicit;\
  \ free-form \"looks stale\" remains a §2.4 UNCERTAIN → escalate.\n  - **Rung 2 —\
  \ EXTERNAL-AUDITOR ADVERSARIAL CONSULT (only after rung-1 fails).** Submit >=2\n\
  \    framed OPTIONS and let the auditor NAME which survives — NEVER a \"may I?\"\
  \ approval request\n    (else workers learn to phrase for approval — the false-consent\
  \ failure). An auditor verdict is EVIDENCE, not\n    command: verify each finding\
  \ MECHANICALLY before absorbing it; a contested finding under genuine\n    disagreement\
  \ is itself a CHARTER §P7 dissonance that goes to the owner. DEGRADE-CLOSED: auditor\
  \ unavailable / ABORT / no-survivor → rung-3 OWNER,\n    NEVER back to rung-1; a\
  \ consumer with NO configured auditor collapses rung-2 → for anything\n    ambiguous\
  \ the question goes straight rung-1→owner.\n    - **WHICH CONSULT.** For a BELOW-ceiling\
  \ technical fork this rung is the on-demand\n      variant-pick `audit consult --on-demand\
  \ --task <T-XXXX> --option... --option...`, which\n      SPEC-0204 rule 6 leaves\
  \ unchanged. The AT-CEILING consult it used to name is RETIRED: past the\n     \
  \ audit-loop ceiling a residual is not adjudicated by an auditor at all, it is settled\
  \ by\n      **Controller typed decisions (SPEC-0204)** — one recorded `ceiling_decision`\
  \ per residual\n      (`audit decide`, rule 2), then ONE bounded verifying pass\
  \ (`audit pre|post --on-decisions`,\n      rule 3). A dispatched Worker never records\
  \ one: it halts naming its residual fingerprints and\n      the Controller decides.\
  \ So at the ceiling the ladder's rung 2 IS that decision route, and the\n      adversarial-consult\
  \ shape above applies to the below-ceiling fork it still governs.\n  - **Rung 3\
  \ — THE AUTHORITY (the owner, or a `decide-authority` holder for that project —\
  \ §5a).**\n    Reached only for a genuine dead-end (rung-2 non-convergence / degrade)\
  \ OR an AUTHORITY-CLASS\n    cause (below). It is the backstop for AUTHORITY and\
  \ true forks, not a routing default for every\n    block. A genuine dead-end that\
  \ is NOT authority-class stays the OWNER's: the right admits the\n    authority\
  \ class, and nothing beyond it.\n\n**THE JUDGMENT-vs-AUTHORITY SPLIT — the hard\
  \ boundary (CHARTER §P4a / §P7).** Rungs 1–2 adjudicate\nTECHNICAL/JUDGMENT merit\
  \ only. An AUTHORITY-class cause NEVER delegates past THE AUTHORITY — the\nowner,\
  \ OR a holder of the `decide-authority` right for that project (SPEC-0169 rule 2)\
  \ — REGARDLESS\nof any auditor verdict; the auditor has different blind spots, not\
  \ responsibility. The\nauthority-class list: data deletion / destructive DB or FS\
  \ mutation ·\nproduction exposure · scope change · money · credentials/secrets ·\n\
  legal / compliance / privacy posture · irreversible EXTERNAL mutations ·\npublic\
  \ / user-facing commitments. A rung-2 GREEN does NOT clear any of these; they hold\n\
  the rung-3 AUTHORITY gate unconditionally. WHO may be that authority is §5a; THAT\
  \ one is required is\nunchanged here, and no auditor verdict has ever been, or becomes,\
  \ a substitute for one.\n\n### 5a. WHO MAY BE THE AUTHORITY — the gate is CONDITIONED,\
  \ never REMOVED\n§5's rung-3 admits, alongside the owner, a holder of the SPEC-0169\
  \ rule-2\nright `decide-authority` on THE PROJECT THE CAUSE BELONGS TO. This is\
  \ the ONLY thing that changes in\nthis spec; every other clause of §1–§5 is carried\
  \ forward unaltered, save the two pointers to\nthis section in §3's Owner rung and\
  \ §5's rung-3 bullet.\n\n**THE WHOLE CLASS, NARROWED BY THE GRANT ROW — not by a\
  \ carved subset.** The right admits the ENTIRE\nauthority-class list of §5. There\
  \ is deliberately NO delegable/reserved split of that list. The narrowing that makes\
  \ this safe is the GRANT — a (person, project, rights) triple written\nby the owner\
  \ — never a second classification of causes that would have to be kept in step with\
  \ §5's\nlist forever.\n\n**THE DIFFERENTIAL — three refusals that must survive,\
  \ or the gate was REMOVED rather than\nCONDITIONED.** All three fall out of SPEC-0169's\
  \ EXISTING decision — the gate function delegates\nadmission to it whole and re-implements\
  \ none of them:\n  1. **A person WITHOUT the right is STOPPED** on the same cause,\
  \ on the same project. Admission is\n     a positive fact about a grant row, never\
  \ an absence of objection.\n  2. **A right-holder is STOPPED on a project their\
  \ grant does not name.** The right is\n     (person × project) by SPEC-0169 rule\
  \ 1; holding it on project A says nothing about project B.\n     The rule-1a all-registry-projects\
  \ SCOPE CLASS may make a grant cover every registered project,\n     but it is a\
  \ DECLARATION resolved against the registry at read time, and it widens WHICH\n\
  \     PROJECTS only — never WHO is admitted.\n  3. **A missing, unreadable or empty\
  \ grant set REFUSES.** SPEC-0169 rule 4 fails closed in BOTH\n     directions, and\
  \ this clause inherits it unchanged: a misconfigured installation denies the\n \
  \    decision, it never opens it. Only a present, readable, matching row admits.\n\
  A surface that satisfies the admission without exhibiting all three has not implemented\
  \ this rule; it\nhas deleted §5's gate and left a permissive path behind.\n\n**DECIDING\
  \ IS NOT DOING — and this is the rung a right-holder lands on NEXT.** `decide-authority`\n\
  confers NO execution capability (SPEC-0169 rule 2, probe V12). An admitted holder\
  \ has become the\nAUTHORITY for the cause; they have gained nothing else. Every\
  \ execution gate still applies to them\nexactly as before — `deploy-code` and `apply-prod-data`\
  \ remain separately held or refused, and the\ncode gates this spec routes to (`land\
  \ --rebaseline` authorization per SPEC-0077, `--no-tests`,\n`--ack-repeated-abort`)\
  \ are UNCHANGED and unreachable through this right. Naming that next rung is\npart\
  \ of the rule: an admission read as capability is the misreading this paragraph\
  \ exists to prevent.\n\n**THE REFUSAL MUST NAME ITS REMEDY (`lessons/a-refusal-remedy-must-name-which-locus-it-repairs`).**\n\
  A refusal a non-holder meets on an authority-class cause MUST state (a) that the\
  \ cause is\nAUTHORITY-class, (b) that `decide-authority` ON THAT NAMED PROJECT is\
  \ the right that carries it, and\n(c) that granting it is an OWNER act (SPEC-0169\
  \ rule 5 — the gated component may never create or\nwiden its own grants; that is\
  \ a security boundary, not a convention). A refusal that omits this reads\nas a\
  \ bare \"not authorized\" and sends the reader off asking for a BROADER grant —\
  \ which is precisely\nthe unbounded-permission shape the 2026-08-20 restriction\
  \ record warns against. The message states\none composed diagnosis; it never prints\
  \ a specific finding above a generic tail that contradicts it\n(`lessons/carving-an-exception-into-a-fail-closed-gate`\
  \ §2).\n\n**WHAT DOES NOT MOVE (the P1 F3 honesty leg — named, so a reader cannot\
  \ infer a wider change).**\nRungs 1–2 still adjudicate TECHNICAL/JUDGMENT merit\
  \ ONLY. No auditor verdict clears an authority\ncause — for a holder or a non-holder,\
  \ a rung-2 GREEN is still evidence, never authority. An authority\ncause still REQUIRES\
  \ an authority: nothing here lets a session decide one for itself, and the\nDEFAULT-UNDER-UNCERTAINTY\
  \ = STOP of §3 is untouched. §§1–4 are carried forward\ncharacter-for-character\
  \ apart from the single pointer clause added to §3's Owner rung.\n\n**WHAT NARROWS\
  \ (CHARTER §P1 F3 — the removal).** What narrows is the DEAD-END, not the code gate.\n\
  The `--ack-repeated-abort` verb gate is UNCHANGED — no consult-clear branch is added\
  \ to the\nrepeated-abort backstop, and its pinning test still holds. NAME THE KIND,\
  \ or this sentence reads\nas contradicting SPEC-0077 §3a : what is forbidden here\
  \ is a CONSULT-CLEAR branch — one\nthat would let a rung-2 auditor VERDICT stand\
  \ in for the conscious continuation, which is the\ndelegation §5 refuses. The SPEC-0077\
  \ §3a re-baseline admission is NOT that kind and is\nNOT excluded by this paragraph:\
  \ it turns on no verdict at all, and its conditions are stated once,\nat its own\
  \ home — read them there (`graph query SPEC-0077` §3a), never from a copy here.\n\
  The repeated-abort gate is easily misread as owner-gated. It is NOT owner-gated,\
  \ and the\nland surfaces say so in as many words — established that the repeated-abort\
  \ backstop\nescalates to the CONTROLLER (SPEC-0103 §3), that `--ack-repeated-abort`\
  \ demands no\n`--owner-authorized` unlike `land --no-tests`, and that naming the\
  \ owner there sent controllers to\nescalate a decision the owner does not own. What\
  \ is genuinely UNCHANGED is\nthe gate's shape: this spec adds no path through it,\
  \ for anyone. The narrowing is UPSTREAM and by\nDISCIPLINE: a JUDGMENT-class cause\
  \ (a provable intentional-change pinned staleness backed by a\nrecorded rung-1 evidence\
  \ tuple, or a converged rung-2 consult) now has a LADDER path — rung-1 resolves\n\
  the underlying cause (§2.1 governed self-clear, so the abort streak stops recurring\
  \ before the backstop\nis hit) or rung-2 adjudicates it — instead of dead-ending\
  \ at the AUTHORITY as its ONLY exit. An\nAUTHORITY-class cause has no such path:\
  \ it keeps the rung-3 AUTHORITY gate unconditionally against\nany auditor verdict.\
  \ Read that clause with §5a, which is the ONLY thing this spec changed about it:\n\
  the gate is CONDITIONED on WHO may be the authority (the owner, or a `decide-authority`\
  \ holder for\nthat project), never REMOVED, and a rung-1 or rung-2 result still\
  \ clears NONE of it. The land\nrepeated-abort backstop's disposition + the worker\
  \ preamble now NAME this ladder (inspect first,\nconsult second, the authority third)\
  \ so the worker-self-ack ambiguity is resolved in\nTEXT, not left to per-worker\
  \ judgement.\n\n## Parameters\n\nNone consumed (consumed: false — a process spec;\
  \ no code reads a scalar param from it).\n\n## Rationale\n\nReal incident: the 2026-07-01\
  \ provider bench, where the block-classification judgment DETERMINED\ncompletion\
  \ outcomes and the two providers held OPPOSITE wrong defaults (silent-push vs halt-on-\n\
  everything) — neither correct. The externally-validated design (YELLOW→absorbed,\n\
  decisions/-audit-adhoc.yaml) tightened three points now baked into §2: flake needs\n\
  independent evidence, quarantine is not a Worker self-clear, and deliberate guards\
  \ take precedence.\nPrior-art the rule reuses (not duplicates): SPEC-0103 (worker\
  \ scope boundary + escalation), SPEC-0077\n(pinned/last-green + governed rebaseline\
  \ — the A-prime authority home: owner ack OR qualifying-Worker\nself-clear), SPEC-0036\
  \ (audit-loop ceiling), CHARTER §P7.\n\nWHY §5a EXISTS, and why the ONE mechanism\
  \ it adds is the minimum that could work (CHARTER §P1; the\nfour filters are recorded\
  \ in the §Internal preamble, and what it adds is named there). The measured cost\
  \ was a card that could\nnot move: <project> was dispatched twice, 2026-07-16 and\
  \ 2026-08-26, and refused pre-claim both\ntimes on the same cause — the question\
  \ is whether an owner decision still stands, and nothing but an\nowner decision\
  \ unparks it. The person who filed it already held `deploy-code`, `apply-prod-data`\
  \ and\n`dry-run-readonly` there: he could EXECUTE the change and could not DECIDE\
  \ it. So the gap was never\naccess, and building a second authority mechanism to\
  \ close it would have been the parallel path\nCHARTER §P5 forbids. Filter 1 (existing\
  \ analog) resolves it: SPEC-0169 ALREADY models\n(person, project, rights), already\
  \ splits rights BY BLAST RADIUS, already fails closed in both\ndirections, and already\
  \ forbids the gated component from writing its own grants — so the fourth right\n\
  \ is the carrier and this spec is only the doctrine admitting it. Filter 3 (what\
  \ is removed):\nthe DEAD END is removed — an authority-class cause on a project\
  \ someone holds the right for stops\nbeing a question with no exit but the owner.\
  \ Filter 4 (real incident): the twice-refused card above,\nplus the 2026-08-20 restriction\
  \ record — 67 test-bypass lands, 45 in a single day, whose recorded\ncause was the\
  \ FORM of a permission rather than the person. That record is why the admission\
  \ here is\nper-person, per-project, owner-written and attributable on every exercise,\
  \ and why §5a's differential\nis normative rather than advisory: an unbounded grant\
  \ is the ONE shape this change may not produce.\n\n### History moved out of the\
  \ rule body\n\nThe passages below stood in the rule text and were moved here verbatim;\
  \ the rule they\nsat in is unchanged.\n\n- **Internal:** ONE normative change, and\
  \ an exact list of every place the predecessor's text moved\n  with it — stated\
  \ in full because \"carried forward VERBATIM except §5\" was this spec's own first\n\
  \  wording and it was NOT true: four passages elsewhere still spoke the owner-only\
  \ doctrine §5a had\n  replaced, and the spec contradicted itself until the audit\
  \ found it. THE NORMATIVE CHANGE: §5's\n  judgment-vs-authority split now names\
  \ THE AUTHORITY rather than the owner alone, and the NEW §5a\n  says who may be\
  \ one and bounds it. EVERY OTHER EDIT IS RECONCILIATION — no obligation moves, the\n\
  \  wording simply stops contradicting §5a: §3's Owner rung and §5's rung-3 bullet\
  \ gain a pointer to\n  §5a; §5's intro and §WHAT NARROWS name the AUTHORITY where\
  \ they said the owner, and §5's own\n  no-new-mechanism claim is scoped to §5; the\
  \ §Internal preamble above declares the one mechanism §5a\n  ships (the predecessor\
  \ added none); and §Verification names this spec's five anchors instead of the\n\
  \  predecessor's two. §§1-4 and the §Scenario are otherwise character-for-character.\
  \ Routed as a\n  SUPERSEDE, not an in-place amend, because it changes what a consumer\
  \ must DO in an ALREADY-COVERED\n  case (SPEC-0005 rule 7's discriminating probe):\
  \ a session facing an authority-class cause must stop\n  at the owner today, and\
  \ must not when the deciding identity holds `decide-authority` on that\n  project.\n\
  \n- **Internal:** It had to: before it, the authority-class stop existed only as\
