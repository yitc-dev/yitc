  \ for a non-holder.\n- **V-AUTH-5 (§5a refusal remedy) — the refusal NAMES what\
  \ would repair it.** A non-holder's refusal\n  states that the cause is AUTHORITY-class,\
  \ names `decide-authority` on THAT project as the carrying\n  right, and names the\
