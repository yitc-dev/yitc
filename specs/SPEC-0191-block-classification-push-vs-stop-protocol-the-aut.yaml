  \ against fixture grant state, the cause and the project held constant:\n  a person\
  \ with NO `decide-authority` row is refused; the SAME right-holder is refused on\
  \ a project\n  their grant does not name; and an absent / unreadable / empty grant\
  \ set is refused. Failing input:\n  any of the three admitted — each of which is\
  \ exactly what deleting §5's gate would look like from\n  V-AUTH-1 alone.\n- **V-AUTH-3\
