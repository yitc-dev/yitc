  \n## Implementation notes\n\nCode detail moved verbatim out of the rule text — what\
  \ the code's maintainer reads.\n\n- **5. THE THREE-RUNG RESOLUTION LADDER — how\
  \ a stuck question is ANSWERED before it reaches the\n  human:** carried from the\
  \ predecessor unchanged and kept on UNBROKEN lines so a grep for any one\n  cause\
  \ still finds it\n\n## Verification\n\n- The land-refusal surface (bin/lib/worktree.py\
  \ cmd_land — the rebaseline / repeated-abort aborts),\n  the worker surface (bin/lib/dispatch.py\
  \ DISPATCH_WORKER_PREAMBLE) and the §5a authority gate\n  (bin/lib/grants.py decide_authority_class_cause,\
  \ its `--cause` entry point cmd_grants_authorize,\n  and _authorization_refusal_message)\
  \ each POINT at THIS spec (the `implements:` anchors;\n  graph-build resolves them,\
  \ non-dangling). The two ladder surfaces were retargeted from <workshop-spec>\n\
  \  to SPEC-0191 at : a read surface citing the SUPERSEDED head would route a blocked\
  \ worker to\n  retired history, which is the second-drifting-home this supersession\
  \ exists to remove. Pinned by\n  tests/test_t11684_authority_delegation.py AC6,\
  \ which asserts BOTH that the superseded owner-only\n  wording is GONE from those\
  \ surfaces and that the conditioned one is present — an absence check\n  alone is\
  \ satisfiable by deleting the claim everywhere.\n- Existing tests confirm the governed\
  \ paths this rule routes to: test_t9307_pinned_rebaseline (the\n  governed rebaseline\
  \ path RECORDS a reason / refuses without it); test_t9623_blocked_on_land_repeated_abort\n\
  \  + test_t9618_blocked_on_land (a deliberate-guard / uncertain / repeated-abort\
  \ block ESCALATES via\n  blocked-on-land rather than self-clearing); test_t9306_no_tests_owner_gate\
  \ (no silent gate self-clear).\n\n- **V-AUTH-1 (§5a admission) — a right-holder\
  \ IS admitted.** A session acting under an identity that\n  holds `decide-authority`\
  \ on project P is ADMITTED as the authority for an authority-class cause on\n  P.\
  \ Failing input: that same identity refused — without this leg the rule is green\
  \ by construction,\n  since a surface that refuses everyone satisfies every negative\
  \ probe below and delegates nothing.\n- **V-AUTH-2 (§5a differential, and the card\
