id: SPEC-0096
title: Activation baseline-concern checklist generator — declaration-driven init-walk
  + doc-checklist
status: active
created_at: 2026-06-22 06:31:13+00:00
travels: kernel
consumed: false
implements:
- bin/lib/graph.py#_activation_concern_rows
- bin/lib/graph.py#_render_activation_checklist
- bin/lib/graph.py#_activation_checklist_drift
- graph/activation-checklist.md#Activation
- bin/lib/init.py#_render_init_concern_sweep
body: "## Scenario\n\nWhen a project is activated onto the kernel, the kernel walks\
  \ it through a GENERATED checklist of\nbaseline concerns — one row per concern whose\
  \ instance has DECLARED an init-question — forcing\ndeclare-or-waive on each (opt-out\
  \ always available). The activation walk AND a human-readable\ndoc-checklist are\
  \ GENERATED from ONE canonical per-concern declaration, exactly as\n`graph/floor-trigger-map.md`\
  \ is generated from each spec's `binding:`. So when a new concern\ninstance is built\
  \ and declares its init-question, its row AUTO-APPEARS in both the walk and the\
  \ doc\nwith no hand edit — \"the questionnaire fills itself\". Each answer is a\
  \ POINTER to the concern's\ngoverned adoption-evidence, never a stored status. The\
  \ owner sees baseline concerns CONSIDERED at\nactivation by a list that maintains\
  \ itself — not a bespoke hand-written charter re-deriving each\nbaseline from scratch.\n\
  \n## Internal\n\nTHE ACTIVATION-CHECKLIST GENERATOR (generator-only scope). Seven\
  \ rules. It adds a declaration FIELD on\nthe concern SPEC (a SPEC-schema extension,\
  \ SPEC-0030) + a `graph build` DERIVED VIEW (the init-walk SET\n+ the doc-checklist)\
  \ — reusing the existing floor-trigger-map derived-view machinery, adding NO new\n\
  store / parser / journal / generator engine (CHARTER §P1). **Scope boundary (plan-check\
  \ finding #3 —\nthe plan was narrowed to generator-only):** the INTERACTIVE walk\
  \ at `init` (presenting the SET +\ncollecting the declare-or-waive ANSWERS into\
  \ `yitc-ops.yaml`) is NOT here — it is owned by the\nonboarding instance, a separate\
  \ scope. This spec produces the generated SET the walk would\npresent; it never\
  \ performs the walk or touches the carrier answer.\n\n### 1. ONE canonical per-concern\
  \ declaration is the single generation source — KERNEL-SIDE, ON THE SPEC\nThe declaration\
  \ is **KERNEL methodology, authored ONCE as a field on the concern's own SPEC (a\n\
  SPEC-schema extension — SPEC-0030; kernel realm, SPEC-0073)** — NEVER copied into\
  \ each project. Each\nconcern spec declares, in that one kernel place, its **`init_question`**\
  \ (the prompt the activation\nwalk shows) + its **waiver-contract** (what a waiver\
  \ may omit; any compensating-control/expiry\nrequirement — the per-section waiver\
  \ POLICY itself stays owned by SPEC-0093 rule 6) + its\n**adoption-evidence pointer**\
  \ (the spec/probe/live_probe that proves the concern handled) + its\n**tier marker**\
  \ (rule 7) + — on every `tier: universal` concern — its **`recommended`** answer:\
  \ the\ndefault the person is SHOWN beside the question and only confirms or changes,\
  \ so a newcomer never\nfaces a bare question. It is PRESENTED, never written on\
  \ the person's behalf —\ndeclare-or-waive is unchanged. That single kernel declaration\
  \ on the spec is the SOURCE from which the two\ngenerated views are derived — the\
  \ init-walk SET and the doc-checklist (rule 2) — no derived surface is\nhand-authored\
  \ in parallel (P5). One kernel source on the spec, derived views.\n**The declaration\
  \ is NOT the project's ANSWER (the P5 home — plan-check finding #1).** The declaration\n\
  lives on the concern SPEC (SPEC-0030 schema), NOT in the carrier; what lives per-project\
  \ in\n`yitc-ops.yaml` is the project's ANSWERED STATE (the declared command/contract\
  \ OR its `waiver:\n{reason}`) — collected by the walk, out of THIS scope. The kernel\
  \ declaration travels (one\nsource on the spec); the per-project carrier holds only\
  \ that project's answer. Copying declaration text\ninto each project is FORBIDDEN\
  \ (it would duplicate concern metadata across projects — the P5 violation\nthe finding\
  \ named).\n\n### 2. Generation REUSES the `graph build` derived-view pattern — no\
  \ new engine\nThe init-walk concern SET and the human-readable doc-checklist are\
  \ DERIVED at `graph build` from the\nper-concern declarations into a `DO NOT EDIT`\
  \ managed GEN region — the SAME `<!--GEN-->`\nderived-view machinery that generates\
  \ the floor-trigger-map. Regeneration is deterministic; a hand\nedit to a generated\
  \ surface is DRIFT, not an authoring path. No second generator engine / parser /\n\
  store / journal (CHARTER §P1 F1–F3 / §P5).\n**Ownership boundary (the hard split\
  \ — plan-check finding #2).** This spec owns the GENERATED VIEWS\n(the derived init-walk\
  \ SET + the doc-checklist) and the declaration SEMANTICS (rule 1) — and NOTHING\n\
  ELSE. It does NOT own: the carrier schema (SPEC-0093, rule 3) OR the INTERACTIVE\
  \ WALK — the verb that\npresents the SET to the project at `init` and collects the\
  \ declare-or-waive answers, which is owned by\nthe onboarding instance. SPEC-0096\
  \ GENERATES the set the walk presents; it never performs the\nwalk. No rule duplication,\
  \ no floating responsibility.\n\n### 3. The declaration FIELD extends the SPEC schema\
  \ (SPEC-0030) — the carrier (SPEC-0093) is separate\nThe declaration field (rule\
  \ 1) is an additive extension of the SPEC YAML schema (SPEC-0030 — the\nfield catalog)\
  \ on the concern's own spec. It is NOT a carrier (`yitc-ops.yaml`) field: ONE home,\
  \ ONE\nschema-owner (SPEC-0030 for the declaration; SPEC-0093 for the carrier answer).\
  \ The carrier (SPEC-0093)\nholds the project's per-project ANSWER, collected by\
  \ the walk — out of THIS scope; the\ngenerated doc-checklist merely POINTS at where\
  \ each concern's answer lives (a reference in the derived\nview), it does not author\
  \ the carrier section or collect the answer. This honours SPEC-0093 rule 4\n(\"\
  future concerns are tracked ids, extensible by construction\"): a concern joins\
  \ the generated SET only\nwhen its spec lands AND declares its `init_question`.\
  \ No parallel schema, no per-project declaration\ncopy (CHARTER §P5).\n\n### 4.\
  \ The walk surfaces ONLY declared instances — the tier is the target, the seed is\
  \ what ships\nThe generator surfaces a concern row ONLY once its instance has declared\
  \ an `init_question`. This\nreconciles \"universal-tier walk\" with \"only declared\
  \ instances surface\": the TIER names the target\nroster; the generated walk shows\
  \ the COMMITTED seed (the concerns whose instances declared); the\ntier FILLS as\
  \ instances land. No concern is a row before its instance + declaration exist —\n\
  reserving empty schema for an un-pulled concern is FORBIDDEN (the platform-creep\
  \ boundary, SPEC-0093\nrule 4 / CHARTER §P1 F4 — imagined necessity defers).\n\n\
  ### 5. Opt-out is always available — the checklist guarantees CONSIDERATION, never\
  \ adoption\nEvery generated row is WAIVABLE: a reasoned refusal is a first-class\
  \ answer, never a failure. The\nchecklist guarantees only that each surfaced concern\
  \ was CONSIDERED at activation; it NEVER mandates\nadoption (a frame to think, not\
  \ a gate that blocks). A row's waiver-contract MAY require a\ncompensating control\
  \ + an expiry where bare-waiving is genuinely unsafe (e.g. a security row) — but\n\
  a project is never forced to declare a concern it does not have. The per-section\
  \ waiver POLICY is\nowned by SPEC-0093 rule 6; this spec states only that a GENERATED\
  \ row inherits its concern's policy.\n\n### 6. Answers are POINTERS to governed\
  \ adoption-evidence — no stored computed status\nA declare-or-waive answer captures\
  \ CONSIDERATION. To avoid decaying into stale parallel truth (P5),\neach answer\
  \ is a POINTER to the concern's governed adoption-evidence (the spec / probe / live_probe\n\
  that proves it handled — e.g. deploy → `deploy_completed` + the live_probe soak).\
  \ The generated\nchecklist is an ENTRY-SURFACE + pointers; adherence / coverage\
  \ is DERIVED at read time over the\njournal + carrier, NEVER persisted (SPEC-0093\
  \ rule 7 — the carrier stores no computed status; no\ndashboard / CI-gate / coverage-report\
  \ layer).\n\n### 7. Tiering is MINIMAL first-ship policy on the committed seed —\
  \ the rest is deferred\nFirst ship carries only the MINIMAL tier marker on each\
  \ COMMITTED-seed concern: `universal` (kernel\nseeds it) vs not. The tier of a concern\
  \ is part of its declaration (rule 1), so even this minimal\nmarker is data-driven,\
  \ not a hand-listed gate. The richer taxonomy — **archetype packs** (UI /\nresponsive\
  \ / optimistic-vs-pessimistic, seeded only if the project declares an archetype)\
  \ and\n**project-added** product/domain concerns — is DESIGN POLICY, less directly\
  \ incident-backed, so it is\nDEFERRED to tracked follow-up work, pulled per real\
  \ incident (CHARTER §P1 F4), NOT shipped here. The\nload-bearing first-ship claim\
  \ is the GENERATOR MECHANISM (rules 1–6); the tier taxonomy beyond the\nuniversal/committed-seed\
  \ marker is not first-ship scope. This keeps the checklist an activation PROMPT\n\
  scoped to the mechanism, not a normative product framework (the v1 platform-posture\
  \ failure).\n**`universal` admission test (one line, plan-check residual #4):**\
  \ mark a concern `tier: universal`\nIFF it applies to EVERY project the kernel could\
  \ activate regardless of stack/archetype/domain (a\ncross-cutting baseline, e.g.\
  \ deploy-adoption) — if it needs a stack/archetype/product to be relevant,\nit is\
  \ NOT universal (it is archetype/project-tier, deferred per the taxonomy above).\n\
  \n**Walk norms are REFERENCED, not restated (plan-check residual #1).** Every NORM\
  \ of the interactive\nwalk itself — how the SET is PRESENTED at `init`, how the\
  \ declare-or-waive ANSWER is collected, the\nfail-closed-on-unanswered-seeded-row\
  \ policy — is owned by the onboarding instance and the\ncarrier (SPEC-0093 rule\
  \ 3); this spec POINTS at them, never re-specifies them. SPEC-0096's contract\n\
  ends at the generated SET (the walk's INPUT); it never describes the walk's behaviour.\n\
  \n### 8. The generated SET drives an OWNER-VISIBLE born-waiver/default sweep at\
  \ `init` — the generic close\nClosing the silent-born-waiver class GENERICALLY (X-0088,\
  \ external MED): `init` SURFACES the generated\nSET owner-visibly as a \"born-waiver/default\
  \ sweep\" — one line per declared concern (EVERY init-defaultable\nconcern, not\
  \ only deploy), each flagged to be EITHER explicitly declared on-plan OR explicitly\n\
  owner-waived (with a real reason), never an invisible default. So when a project\
  \ is bootstrapped, the\nowner SEES the whole roster of concerns whose init path\
  \ can default/waive owner-significant behaviour —\nnot just the one deploy concern\
  \ (the gap that let deploy-AUTONOMY (SPEC-0097) ship as a silent init\nborn-waiver\
  \ before). SPEC-0097 is the FIRST concrete concern in the sweep; the sweep generalises\n\
  it to the whole class. This is a NON-INTERACTIVE SURFACING (a report read off the\
  \ already-generated\ngraph/activation-checklist.md), distinct from and NOT the interactive\
  \ declare-or-waive COLLECTION owned\nby the onboarding walk (rule 2/4): the sweep\
  \ PRINTS the SET, it collects no answer and writes no\ncarrier section. It reuses\
  \ the existing generated surface — no new gate/detector/store/parser/journal\n(CHARTER\
  \ §P1 / non-goal #7); a missing engine artifact never crashes init and is never\
  \ SILENTLY skipped\n(a silent absence would itself be a silent default — the failure\
  \ this closes), so the absent case emits an\nEXPLICIT owner-visible \"unavailable\"\
  \ notice. Every concern still inherits its own waiver POLICY (rule 5) — the sweep\
  \ surfaces the\nchoice, it never forces adoption and never auto-seeds an active\
  \ policy (the SPEC-0097 §9 safety\ncorollary: surfacing the DECISION must not silently\
  \ GRANT autonomy).\n\n### 9. The activation checklist is ONE generated view of the\
  \ concern registry (SPEC-0128)\nThis generator is one CONSUMER of the single **concern\
  \ registry** (SPEC-0128, \"one declaration → all\nsurfaces generated\"): the per-concern\
  \ `init_concern` declaration this spec derives its two views from\n(the init-walk\
  \ SET + the doc-checklist) is a COMPANION field carried alongside the Rule-1 concern\n\
  registry metadata on the concern's own SPEC (SPEC-0030 schema), NOT a second parallel\
  \ declaration. So\nthe checklist row a concern gets, the carrier section that concern\
  \ owns (SPEC-0093), that concern's\nfloor-trigger row, and its review/debt lens\
  \ are all views of the ONE `concern:`-block declaration — a\nconcern can never be\
  \ half-registered (present on one surface, silently missing from another). Rules\
  \ 1–8\nare UNCHANGED: this spec still owns the generated VIEWS + the declaration\
  \ SEMANTICS; the cross-surface\ninvariant that binds this view to the same registry\
  \ as the carrier and the standing conformance/skew\nviews is owned by SPEC-0128,\
  \ which NAMES this spec as one of its surfaces (no rule duplication).\n\n**Guards.**\
  \ (a) No concern row is generated for a concern whose instance is not built + declared\n\
  (rule 4). (b) No generated surface (the walk set, the doc-checklist) is ever hand-edited\
  \ (rule 2) —\na divergent hand edit is a drift signal. (c) No computed status is\
  \ persisted (rule 6).\n\n## Parameters\n\nNone consumed. The per-concern declarations\
  \ (`init_question` text, waiver-contract, adoption-evidence\npointer) are KERNEL\
  \ METHODOLOGY authored once on the concern's instance/spec (rule 1) — NOT a\nkernel-read\
  \ governance SCALAR, and NOT per-project config. The per-project `yitc-ops.yaml`\
  \ carrier\nholds only the project's ANSWER (declared command/contract OR waiver)\
  \ — project-local answered state,\nnot a spec-read param. The carrier schema constants\
  \ live in SPEC-0093 / `bin/yitc-v2`, single-source —\nnot read from this spec.\n\
  \n## Rationale\n\nReal incidents (<project>, the motivating evidence): an off-style\
  \ UI control shipped through all gates\n(`ui-style-compliance-not-seeded-or-enforced`);\
  \ a destructive action fired with no confirm → <project>\nauthored <workshop-spec>\
  \ from scratch (`behavioral-baseline-not-seeded`) — both because baseline DEFAULTS\n\
  were not seeded at activation, and the one prior activation produced a bespoke hand-written\n\
  `CHARTER.md` re-deriving every baseline. Prior-art (extend, not create — CHARTER\
  \ §P1 F1): the\n`graph/floor-trigger-map.md` generated-from-`binding:` derived view\
  \ (the generation pattern reused in\nrule 2) + the SPEC-0093 `yitc-ops.yaml` carrier\
  \ (the declare-or-waive substrate the per-project ANSWER\nrides — rule 3) + the\
  \ SPEC-0030 spec schema (the home of the declaration field — rule 1/3). This spec\n\
  adds only the GENERATION layer (the declaration field + the derived views) — no\
  \ new store/parser/journal.\nGenerator-only scope: the interactive walk is separate.\
  \ Full deliberation + the gate-specs RED\n+ plan-check absorptions: plan `project-activation-baseline-concern-checklist-gene`\
  \ (a plan never\ngoverns — GRAPH §What-a-spec-is-FOR).\n\n## Verification\n\nProbe\
  \ CONTRACTS (RED-GREEN — observe failing before trusting):\n- **VP1 (auto-grow from\
  \ declarations — the load-bearing probe):** a fixture concern instance\n  declaring\
  \ an `init_question` makes its row appear in BOTH the generated init-walk AND the\
  \ generated\n  doc-checklist after `graph build`, with NO hand edit; removing the\
  \ declaration removes both rows.\n- **VP2 (the generated SET is the walk's input\
  \ — ownership boundary):** the generated universal-tier\n  SET this spec produces\
  \ equals what the onboarding walk presents at `init`, each row\n  carrying its declare-or-waive\
  \ contract; a reasoned waiver is accepted and an unanswered seeded row\n  fails\
  \ closed (the DECLARE-OR-WAIVE policy + the interactive collection are inherited\
  \ — SPEC-0093\n  rule 3 + the walk verb — NOT owned here). This spec's probe is\
  \ on the SET + its contracts;\n  the interactive walk behaviour is probed.\n- **VP3\
  \ (only declared instances surface):** a universal-tier concern with NO built instance\
  \ produces\n  NO row (rule 4 — no reserved empty schema).\n- **VP3a (active-only):**\
  \ the checklist derives from status:ACTIVE specs only — a\n  `draft`/`proposed`\
  \ spec's `init_concern` produces NO row (non-authoritative until activation, SPEC-0005\n\
  \  §4; the sibling of the concern-registry gate; a status-less synthetic fixture\
  \ is admitted so the\n  mechanics tests stay status-agnostic). Probe: `tests/test_t10176_activation_active_only.py`.\n\
  - **VP4 (deterministic regeneration / no hand-edit):** the generated doc-checklist\
  \ regenerates\n  byte-identically via `graph build`; a divergent hand edit to the\
  \ GEN region is flagged (the\n  drift-lock, like the floor-trigger-map).\n- **VP5\
  \ (pointer-only adoption):** each answer resolves to a governed adoption-evidence\
  \ pointer; no\n  computed adherence/coverage status is persisted in the carrier\
  \ (grep + state check — SPEC-0093 r7).\n- **VP6 (declaration home = SPEC schema,\
  \ NOT carrier):** the `init_question` declaration is a field on\n  the concern's\
  \ own SPEC (a SPEC-0030 schema extension), NOT a `yitc-ops.yaml` field; the carrier\
  \ holds\n  only the project's answer; no second config file / parallel schema is\
  \ introduced (grep — no parallel\n  SoT, one home / one schema-owner).\n- **VP8\
  \ (owner-visible init sweep — the generic close):** a `-C <synthetic> init` run\
  \ PRINTS a\n  born-waiver/default sweep block enumerating EVERY concern in the generated\
  \ SET (≥ the 4 declared:\n  SPEC-0094/0097/0099/0100), each line flagging explicit\
  \ declare-or-waive; the block reads the existing\n  graph/activation-checklist.md\
  \ (no new derivation) and emits an explicit owner-visible \"unavailable\"\n  notice\
  \ (never a silent skip) when that artifact is absent.\n- **VP7 (three-tier composition):**\
  \ the kernel-seeded roster contains UNIVERSAL concerns only;\n  archetype/project\
  \ concerns are not kernel-seeded (state check over the seed set).\n"
