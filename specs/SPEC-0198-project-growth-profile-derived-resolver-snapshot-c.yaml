concern:
  section: profile
  carrier_path: profile
  presence_policy: checked-if-present
  update_policy: init re-seed
  declare_key: override
  declare_type: mapping
  waiver_policy: loose
  born_order: 185
  born: "profile:\n  # SPEC-0198 (project growth profile). This section is DERIVED\
    \ by the kernel from what the\n  # checkout and journal show (routes, auth, payment\
    \ SDKs, PII fields, keys, migrations, deploy\n  # class) — you do NOT maintain\
    \ it. Read the current resolution with `__YITC_CLI__ profile`.\n  # Declare here\
    \ ONLY what the kernel cannot derive, or an OVERRIDE you want shown as yours:\n\
    \  # override:\n  # traffic_scale: \"<low | medium | high — the kernel cannot\
    \ read real traffic from a checkout>\"\n  # collaborator_rights: \"<solo | named-collaborators\
    \ — a commit-author count is not a proof>\"\n  # surface: \"<internal — ONLY if\
    \ you know this project is never publicly reachable>\"\n  # money: \"<present\
    \ — spend moved through a third-party API (ad bids, price writes, marketplace\
    \ calls) the kernel cannot derive>\"\n  # An absent override keeps the derived\
    \ value; an unknown dimension reads CONSERVATIVE\n  # (wider checks), never narrower.\
    \ Widening happens by itself at the next seam; NARROWING a\n  # latched high-risk\
    \ dimension (surface / money / data_sensitivity / users) is an explicit act HERE.\n\
    \  #\n  # BORN WAIVED, like `deploy.policy` and `security` — and here the waiver\
    \ is the literally true\n  # statement, not a placeholder: this section is DERIVED,\
    \ so a fresh project owes it nothing.\n  # It is seeded as a waiver rather than\
    \ as an empty `override: {}` because the SPEC-0093 rule-3\n  # stance reader reads\
    \ an empty declare-key as UNANSWERED, which made every born consumer carry\n \
    \ # a permanent conformance issue and failed a fresh `init` (caught by the land\
    \ verify).\n  waiver:\n    reason: \"Born with no override: the growth profile\
    \ is DERIVED by the kernel from this checkout and its journal, so nothing is owed\
    \ here. Replace this waiver with an `override:` mapping only to declare what the\
    \ kernel cannot derive (traffic_scale / collaborator_rights) or to narrow a latched\
    \ dimension deliberately.\"\n"
