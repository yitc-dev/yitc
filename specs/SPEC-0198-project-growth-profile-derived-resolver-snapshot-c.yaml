id: SPEC-0198
title: Project growth profile — derived resolver, snapshot + check-set hash, conservative
  defaults, owner override, and the seam-bound lens-activation contract
status: active
created_at: 2026-09-04 17:48:55+00:00
travels: null
consumed: false
extension: null
