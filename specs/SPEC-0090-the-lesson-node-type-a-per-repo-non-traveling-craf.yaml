binding:
  - query-only # reached on-demand via `graph query` (a node-type doctrine, like SPEC-0076);
                               # the behavioral read-surfaces are the sibling plan's job, not a verb-gate here.
  - before-project-dimension-judgement # — ALSO in the kernel↔consumer doctrine bundle: the
                               # patterns(travel)/lessons(local) boundary IS a project-dimension judgement.
                               # ORTHOGONAL to query-only (SPEC-0013 §Allowed-tokens: behavioral floor ⊥
                               # residency) — query-only stays the default on-demand delivery; the floor
                               # surface ALSO pulls it before the realm/travel decision. NOT a 2nd residency.

amends: # canonical surfaces this doctrine DELIBERATELY changes (named per P7,
                               # not silently diverged). Staged — takes effect only on activation (mint).
  - GRAPH.md#schema: the 7-node / 4-edge bound (post-SPEC-0076) GROWS to 8 node-types (`lesson`);
      edges UNCHANGED at 4 (`lesson` reuses `cites`). The 4-filter justification lands in GRAPH.md at
      the mint (SPEC-0005 §7). No further node/edge growth implied.
  - patterns/doc-conventions.md#artifact-taxonomy: ADDS a `lessons` row (the per-repo local-craft home,
      file-per-topic) + the patterns(travel)/lessons(local) boundary. ADDITIVE — retires NO routing
      surface (rule 7); all routing retirements + the route-by-purpose enforcement are the sibling plan's
      surface (SPEC-0091 — the single normative home of read-surfaces + route-by-purpose). No dissonance window.
  - SPEC-0073#class-default-matrix: ADDS the `lessons/` artifact class to the EXHAUSTIVE placement matrix
      — realm = PROJECT (born empty per repo, never travels, never enters the export slice); the lesson
      node-type DOCTRINE itself = kernel (travels); a consumer's distributed `patterns/` = the kernel
      read-only copy. Required because SPEC-0073's matrix is exhaustive + mandatory (plan-check F2).
      Applied as a spec-edit on SPEC-0073 at the mint.
