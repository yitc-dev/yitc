body: "## Scenario\n\nWhen the owner/AI files a decision or plan, or reasons about\
  \ an observed incident, they reach for a\nshared vocabulary of the ways an AI agent\
  \ characteristically fails — so risk can be discussed with\nprecise class IDs (\"\
  addresses #4 Accretion + #17 Adoption gap\") rather than vague worry. This is the\n\
  retrieved home of that vocabulary: a query-only reference pulled when a failure\
  \ class is referenced,\nnot an always-loaded mandatory rule. The CHARTER keeps a\
  \ pointer-stub; the taxonomy lives here.\n\n## Internal\n\nTHE AI-FAILURE-CLASS\
  \ TAXONOMY (faithfully moved from CHARTER §\"AI failure classes V2 anticipates\"\
  \ by\n — the handbook prose WAS the always-loaded copy until this query-only demote;\
  \ this spec is the\nretrieved home, reached via the CHARTER pointer-stub + `bin/yitc-v2\
  \ graph query SPEC-0023`).\n\nV2 **anticipates** these AI failure modes. Anticipation\
  \ ≠ uniform coverage:\n- Some classes have **codified mechanisms** (e.g., #4 Accretion\
  \ → Anti-complexity Filter 3; #17\n  Adoption gap → Principle 8)\n- Some are **monitored\
  \ via discipline** (e.g., #5 Re-invention → LIFECYCLE Stage 1 prior-art grep —\n\
  \  relies on AI to follow)\n- Some are **explicit gaps** awaiting incident-trigger\
  \ codification (4 classes per current coverage)\n\nThe list is **non-exhaustive**\
  \ — new classes emerge via observed cycles per growth-engine pattern.\nCoverage\
  \ matrix + per-phase watch list: `<v1-workspace>/yitc-v2-business-cycle-review-and-roadmap-2026-05-26.md`\
  \ §8.2-8.3.\n\n**Class-ID referencing usage** — calibrated to non-performative:\n\
  - **Required:** infra-class / process-class / foundation-class decisions (audit\
  \ prompt MUST include\n  relevant class refs in V2 evaluation lens)\n- **Recommended:**\
  \ substantive feature tasks when audit or planner flags elevated AI-risk\n- **Optional:**\
  \ ordinary product work, hygiene fast-path\n\nGoal — vocabulary for real risk discussion,\
  \ not ritual tagging.\n\n**The 20 anticipated classes (numbered for reference):**\n\
  \n| # | Class | Description |\n|---|---|---|\n| 1 | **Forgetting (context loss)**\
  \ | AI loses prior context across /compact, session boundaries, MEMORY drift |\n\
  | 2 | **Premature closure** | Claiming «done» without probe verification; abandoning\
  \ mid-stage |\n| 3 | **Over-engineering** | Pile-on mechanisms, gold-plating, «just\
  \ one more flag» |\n| 4 | **Accretion (layering)** | Adding layers without removing\
  \ equivalents — v1 archetype |\n| 5 | **Re-invention** | Designing greenfield mechanism\
  \ when analog exists; skip prior-art |\n| 6 | **Scope creep** | Fixing adjacent\
  \ issues mid-task without filing separate task |\n| 7 | **Hallucinated context**\
  \ | Using wrong file paths / API / assumptions without verifying |\n| 8 | **False\
  \ confidence** | Assertions without evidence; «tests passed» without visible output\
  \ |\n| 9 | **Drift doc ↔ code** | Documentation says X; code/hooks do Y; independent\
  \ evolution |\n| 10 | **Format drift** | Schema changes without consumer parser\
  \ updates — silent breakage |\n| 11 | **Silent skip / fail-open** | Hooks exit 0\
  \ without doing work |\n| 12 | **Audit-loop infinite** | Iterate absorption forever\
  \ not shipping |\n| 13 | **Pseudo-ask filing** | Filing N clarifications instead\
  \ of executing directive |\n| 14 | **Multi-variable change** | Changing model +\
  \ protocol + scope simultaneously — root cause non-isolable |\n| 15 | **Galloping\
  \ / runaway** | Parallel dispatches without observability |\n| 16 | **Bypass abuse**\
  \ | Emergency bypass used for non-emergencies |\n| 17 | **Adoption gap** | Building\
  \ infra without actually using it |\n| 18 | **Self-imposed stop** | AI pauses on\
  \ autonomous-mode directive |\n| 19 | **Summary-instead-of-action** | Generating\
  \ tally tables instead of continuing work |\n| 20 | **Drift over time** | Mechanism\
  \ slowly degrades; quarterly health declines |\n\n**Usage at planning time:** when\
  \ authoring a spec or plan, reference relevant class IDs\n(e.g., «addresses #4 Accretion\
  \ + #17 Adoption gap»). External auditor prompts include relevant class\nreferences\
  \ in V2 evaluation lens.\n\n**Growth (incident-driven):** new classes added via\
  \ growth-engine cycle (observed incident → author a spec\ncodifying class + counter-mechanism\
  \ → ship). List updated at each addition.\n\n## Rationale\n\nThe taxonomy is the\
  \ anti-recurrence vocabulary distilled from V1 production (the 20 classes were\n\
  observed across months of v1 cycles, not speculated). It is SITUATIONAL reference\
  \ — consulted when\nauthoring a spec/plan or reasoning about an incident — so it\
  \ belongs in the `retrieved` tier\n(SPEC-0007 §5a query-only default), not the always-loaded\
  \ mandatory floor: keeping it mandatory would\nbloat the floor against its token\
  \ budget (CHARTER §P2) for prose that is not needed to act safely at\nall. Demoting\
  \ it keeps the taxonomy authoritative (this spec is `active` post-close) while shrinking\n\
  the always-loaded core — the in-scope Part I-B payoff.\n\n## Verification\n\nProbe\
  \ CONTRACTS (RED-GREEN — observed failing before the fix is trusted Slip 4):\n-\
  \ **VP1 (fidelity, moved-not-lost):** the taxonomy's key phrases — \"The 20 anticipated\
  \ classes\",\n  \"Forgetting (context loss)\", \"Adoption gap\", \"anticipation\
  \ ≠ uniform coverage\" — resolve in THIS\n  spec body and are ABSENT from CHARTER.md\
  \ (CHARTER keeps a pointer-stub only). Probe:\n  `grep \"The 20 anticipated classes\"\
  \ specs/SPEC-0023-*.yaml` matches; `grep` of the same in CHARTER.md\n  does not.\n\
  - **VP2 (delivery / ratification, query-only — SPEC-0007 §5a):** the rule reaches\
  \ its moment-of-use via\n  (a) the surviving CHARTER pointer-stub naming `SPEC-0023`\
  \ + the lookup path, AND (b)\n  `bin/yitc-v2 graph query SPEC-0023` resolving this\
  \ node. BOTH named ⇒ delivered.\n- **VP3 (query-only, no floor-trigger):** this\
  \ spec's `binding:` is `[query-only]` — the reserved\n  residency token (NO verb\
  \ token, NOT `floor`), so it is query-only reference, not floor-triggered (a\n \
  \ failure-class reference is not a gated control-point). Probe: `binding: [query-only]`;\
  \ the spec is\n  absent from `graph/floor-trigger-map.md`; AND it is NOT in `binding_report.dangling_specs`.\n\
  - **VP4 (graph-indexed + active):** `graph build` indexes SPEC-0023 as a `spec`\
  \ node; post--close\n  `status: active`. Probe: `graph query SPEC-0023` resolves;\
  \ status active.\n"
