id: SPEC-0169
title: Collaborator grant contract — named separable rights, server-issued identity,
  owner-held write
status: active
created_at: 2026-08-06 07:36:21+00:00
travels: null
consumed: false
extension: null
implements:
- bin/lib/grants.py#policy_enabled
- bin/lib/grants.py#foreign_worktree_trust
- bin/lib/cli.py#_run_git_cap
- bin/lib/init.py#_hook_sandbox_entry
body: "## Scenario\n\nThe owner names WHO may do WHAT on WHICH project — for example,\
  \ that both the owner and a\ncollaborator may deploy code, while only the owner\
  \ may write production data. Each named person\nthen works under the identity they\
  \ actually logged in with; nobody states who they are. An\noperation attempted by\
  \ someone not named, or under an identity the server did not issue, is\nrefused\
  \ rather than performed. When a name is removed, the removal is demonstrably in\
  \ force.\n\n## Internal\n\n> **SANDBOX FAMILY — navigation, not a rule.** `sandbox_entry`\
  \ is ONE of three separately\n> named concerns that together answer a project's\
  \ sandbox questions: `sandbox_entry` (this spec — WHERE\n> a collaborator enters,\
  \ OPT-IN), `spike_sandbox` (SPEC-0172 — WHETHER a caged bridge exists and its\n\
  > pinned release) and `spike_data_safety` (SPEC-0175 — WHAT the restored copy carries).\
  \ They stay\n> DISTINCT; a reader who knows only one of the names sees all three\
  \ via\n> `bin/yitc-v2 graph query sandbox-family`. Grounds: on 2026-08-13 a reader\
  \ grepped `spike_sandbox`,\n> found none in a project that declares its sandbox\
  \ under THIS key, and concluded it had none (X-0852).\n> A navigational pointer\
  \ (SPEC-0005 rule 8) — it changes nothing here, and this concern stays OPT-IN.\n\
  \n### 1. A grant is (person, project, rights) — never a role, never a convention\n\
  A GRANT is an explicit triple: a named PERSON, a named PROJECT, and one or more\
  \ RIGHTS from the\nclosed set in rule 2. \"The owner only\" is NOT expressible as\
  \ a rule and MUST NOT be assumed as a\ndefault: the requirement this contract serves\
  \ is that SEVERAL named people ship. A grant carrier\nthat can express only a single\
  \ privileged identity does not satisfy this spec.\n\n#### 1a. The PROJECT leg may\
  \ be a NAMED project or the ALL-REGISTRY-PROJECTS SCOPE CLASS\nA grant's PROJECT\
  \ may be written either as one named project or as the single reserved scope\nclass\
  \ **all projects present in the registry at authorization read time**. The scope\
  \ class is a\nDECLARATION, and its MEMBERSHIP is RESOLVED against the registry on\
  \ EVERY authorization read. It\nis NOT sugar that expands into a project list when\
  \ the grant is written.\n\nOWNER-AUTHORIZED MEANING (recorded 2026-08-08, and the\
  \ reason this clause exists). \"All projects\"\nmeans ALL PROJECTS IN THE REGISTRY,\
  \ **INCLUDING PROJECTS REGISTERED LATER**. The alternative\nreading — only the projects\
  \ existing on the day the grant was written — needs no scope class at\nall, just\
  \ that many written rows. The owner settled this after being shown the distinction\n\
  explicitly; it is a value/authority decision, not a technical one, which is why\
  \ it is recorded\nHERE, where the rule lives, and not only in the task that implemented\
  \ it.\n\nWHY THIS DOES NOT BREACH RULE 8 (declared, never implied). What is DECLARED\
  \ is the RULE; the list\nis merely its resolution. Read-time registry resolution\
  \ would breach rule 8 only if the carrier\nleft the reach to be INFERRED — a wildcard,\
  \ an inheritance, an \"unless listed\" default. A carrier\nthat names the scope\
  \ class states its reach exactly as explicitly as one that names a project.\nBasis:\
  \ the external FULL consult of 2026-08-08, verdict GREEN, recorded at\n`decisions/grants-all-projects-carrier-audit-adhoc.yaml`,\
  \ which adjudicated this as the only\nsurviving option — a drift detector over enumerations\
  \ needs a declared all-intent marker and then\nIS a weaker version of this with\
  \ a second surface, and accepting the decay removes nothing.\n\nWHY A CLASS AND\
  \ NOT AN EXPANSION AT WRITE TIME. An enumeration written to MEAN all silently STOPS\n\
  meaning all the moment one more project is registered. Nothing flags it — the grant\
  \ carrier and\nthe registry both stay well-formed — and the only symptom is a person\
  \ REFUSED on a project the\nowner believes they hold, surfacing as a complaint if\
  \ at all. An implementation that expanded the\nclass on write would look correct\
  \ on the headline behaviour on the day it shipped and would carry\nthat same decay\
  \ from the next registration onward. So the STORED carrier must keep the\ndeclaration,\
  \ and a reader must not substitute an enumeration for it.\n\nWHAT THE SCOPE CLASS\
  \ DOES NOT DO — the boundary, which does not move. It widens WHICH PROJECTS a\n\
  KNOWN grant covers. It NEVER widens WHO is admitted: rules 3-4 stay fail-closed,\
  \ and a missing,\nunmapped or unissued identity is still a REFUSAL, exactly as it\
  \ is for an enumerated grant. It\nreaches no further than the registry either —\
  \ a project the registry does not declare is not\ncovered, so the registry BOUNDS\
  \ the class rather than the class escaping it. And it is written by\nthe OWNER like\
  \ every other grant (rule 5): no path may let a non-owner set or widen this scope\
  \ for\nthemselves, and a refusal of such an attempt must name the applicable route\
  \ rather than strand the\nrefused party. Two carrier states grant NOTHING rather\
  \ than resolving to a guess: a real project\nbearing the reserved name (the declaration\
  \ could mean two things, so it declares neither), and a\nperson holding the class\
  \ while scoped to only some projects (a rule-1 contradiction).\n\n### 2. Four rights,\
  \ separately grantable (closed set)\n- `deploy-code` — build and replace the running\
  \ application.\n- `apply-prod-data` — turn a staged/sandbox change into writes against\
  \ live production rows.\n- `dry-run-readonly` — execute the same path with no writes\
  \ and no production row touched.\n- `decide-authority` — DECIDE a cause that is\
  \ otherwise reserved to the owner, on the project the\n  grant names. It confers\
  \ NO execution capability of its own.\nThey are SEPARATE because their blast radius\
  \ differs: a person may hold `deploy-code` without\n`apply-prod-data`. An implementation\
  \ that collapses them into one privilege violates this rule\neven if every individual\
  \ grant happens to be correct today. Adding a fifth right is a spec change.\n\n\
  THE DECIDING AND THE DOING ARE DIFFERENT RIGHTS, and this is the separability rule\
  \ applied to the\nfourth member rather than a new principle. Holding `decide-authority`\
  \ ALONE leaves `deploy-code`\nand `apply-prod-data` REFUSED on that same project:\
  \ their blast radius differs from a decision's,\nwhich is precisely why this set\
  \ is separately grantable. An implementation in which the decision\nright carries\
  \ an execution path — by gating a verb on it, or by making it exercisable — collapses\n\
  two privileges into one and violates this rule exactly as a merged execution right\
  \ would.\n\nWHAT THE FOURTH RIGHT DOES NOT DO — the boundary, which does not move.\
  \ It widens WHICH CAUSES a\nnamed person may decide on a named project. It NEVER\
  \ widens WHO is admitted: rules 3-4 stay\nfail-closed, so a missing, unmapped or\
  \ unissued identity is still a REFUSAL. It grants no\nexecution. It is written by\
  \ the OWNER like every other grant (rule 5) — no path may let a\nnon-owner grant\
  \ or widen it for themselves. And WHICH causes it clears is settled by the doctrine\n\
  that reserves them, not by this rule: this rule establishes that the right EXISTS\
  \ and is\nseparately grantable, nothing more.\n\n### 3. Identity is SERVER-ISSUED;\
  \ caller-supplied actor input is REFUSED\nFor any operation gated by rule 2, the\
  \ acting identity is derived EXCLUSIVELY from the\nserver-issued session / OS identity.\
  \ A caller-supplied actor argument or environment fallback is\n**refused**, not\
  \ merely overridden or logged. This is the load-bearing clause: while any\ncaller-assertable\
  \ source remains an ACCEPTED authority, the authenticated path is decoration and\n\
  an authorization check runs over an unverified name.\n\n### 4. Fail closed, in both\
  \ directions\nA missing, unmapped, or unissued identity is a REFUSAL. An empty or\
  \ unreadable grant set is a\nREFUSAL, never an open door. A misconfigured installation\
  \ therefore denies work; it never grants it.\n\n### 5. Separation of duties — the\
  \ gated component MUST NOT write its own grants\nThe component whose behaviour is\
  \ gated by grants MUST NOT be able to create, widen, or restore\nthem. Grant WRITES\
  \ are performed by the owner (or an authority outside the gated component); the\n\
  governed system's role is to VALIDATE, ENFORCE, and REPORT. This is a security boundary,\
  \ not a\npackaging convenience: any change that makes the gated component able to\
  \ write grant state\ninvalidates this spec rather than extending it.\n\n### 6. What\
  \ the governed system MUST be able to do (or the contract is advisory)\nRule 5 removes\
  \ the write; it does not remove the obligation. The system MUST provide, in its\
  \ own\ncode: schema and semantic VALIDATION of grant state · fail-closed AUTHORIZATION\
  \ · IDENTITY BINDING\nper rule 3 · REFUSAL on an unissued identity · fixture-based\
  \ grant/revoke PROBES · READ-ONLY\ninspection and reporting of live grant state.\
  \ A contract whose only artifact is documentation\ntelling the owner to edit the\
  \ carrier correctly does NOT satisfy this spec.\n\n### 7. Revocation is provable,\
  \ not merely performed\nRemoving a name from a grant MUST be demonstrable: the same\
  \ request that was permitted before the\nremoval is refused after it. A grant mechanism\
  \ that can add but cannot prove removal is incomplete.\n\n### 8. REACH IS DECLARED,\
  \ NEVER IMPLIED — enforcement where identity cannot be escalated\nThis contract's\
  \ reach is bounded by a fact about the HOST, not by its own design: a grant list\
  \ can\nonly refuse an actor who cannot ASSUME another identity. Where an actor CAN\
  \ escalate — holding\nunrestricted sudo, or container control equivalent to it —\
  \ every refusal aimed at that actor is\nbypassable by the actor it names, whatever\
  \ rules 1-7 say. So an installation MUST classify each\nactor, and the contract\
  \ MUST state which reach applies:\nENFORCEMENT — for an actor who cannot escalate\
  \ to another identity; a refusal genuinely refuses.\nThis is the reach for the scope-limited\
  \ collaborator class.\nADVISORY + AUDIT — for an actor who can escalate (a trusted\
  \ developer holding sudo). The grant\nstill expresses intent and still prevents\
  \ ACCIDENT, but it is not a barrier, and this contract MUST\nNOT be written or read\
  \ as though it were.\nThe reach is PER-ACTOR, never per-class-by-assumption. Deriving\
  \ it from a registry label (a role\nname, a restrictions entry) rather than from\
  \ the actor's ACTUAL escalation capability is a false\nclaim: the label states INTENT,\
  \ the host states FACT, and only the fact bounds the reach. Where the\ntwo disagree\
  \ the fact wins, and the disagreement is itself reportable.\nInterpretation note,\
  \ what this does NOT weaken. The fail-closed defaults of rules 3-4 keep their\n\
  FULL value under BOTH reaches. They prevent the accident and the mistake — a wrong\
  \ flag, an\nunconfigured actor set, an unmapped identity — which is the larger part\
  \ of the real risk surface.\nRule 8 settles only what those defaults may CLAIM:\
  \ they do not stop a determined\nescalation-capable actor, so no surface may present\
  \ them as preventing one. A later reader must not\nre-inflate the claim by deleting\
  \ this note.\n\n### 9. Non-repudiable audit trail — the half that survives every\
  \ reach\nEvery exercise of a right in rule 2 is RECORDED: which identity acted,\
  \ which right, on which\nproject, when, under which grant, and against which registry\
  \ CARRIER the decision was read (its\npath plus whether it was an explicit per-call\
  \ override or the installation default), so a\nprobe against a scratch registry\
  \ is never mistaken for a production grant. The record is append-only; the acting\
  \ component may append\nits own entry but never rewrite the trail (rule 5 applies\
  \ to the trail as to the grants).\nThis is NOT a fallback for the advisory case;\
  \ it is unconditional. Under ENFORCEMENT reach it\nexplains a refusal; under ADVISORY\
  \ reach it is the ONLY property that survives, and it is what\nmakes a trusted-developer\
  \ lane ACCOUNTABLE rather than merely trusted. A contract satisfying rules\n1-8\
  \ that recorded nothing would leave the escalation-capable actor entirely unobserved.\n\
  Interpretation note, what \"NON-REPUDIABLE\" does and does not claim (added at `accepted`,\
  \ from the\ntrial cycle-2 exit convergence read). The property delivered is TAMPER-EVIDENCE\
  \ against a named\nthreat model, plus an ANCHOR held outside the trail it anchors\
  \ — a digest of the trail head\njournalled with the observation. Non-repudiation\
  \ holds SO LONG AS that external anchor is trusted.\nIt must NEVER be read as tamper-PROOFNESS\
  \ against privileged host control: an actor able to rewrite\na record, recompute\
  \ its digest and every following link — or simply to truncate — leaves a\nconsistent\
  \ file, and nothing inside a single file closes that. This is rule 8's discipline\
  \ applied\nto a second axis: state what the mechanism may CLAIM, so no later surface\
  \ can quietly inflate it.\nThe two notes fail the same way if deleted, and neither\
  \ is decorative.\n\nCONCURRENT APPENDERS ARE SERIALIZED (X-1437). Appending a trail\
  \ record is a\nREAD-MODIFY-WRITE: the writer reads the current head, chains its\
  \ `prev` off that head, appends,\nand then asserts its own record is the tail. Two\
  \ concurrent appenders therefore chain off the SAME\nhead — forking the chain —\
  \ and the loser's tail assertion fails, refusing an exercise that nothing\nwas wrong\
  \ with. So the writer holds a mutual exclusion over the LOGICAL journal across that\
  \ whole\ncritical section (head read, record construction, append, read-back). This\
  \ is a property of the\nTRAIL WRITER and applies to EVERY caller that exercises\
  \ a right, not to any one gated verb; the\npopulation it serializes is exactly the\
  \ trail appenders, which is the only population that can\nchange what a read of\
  \ the trail returns. Measured: unserialised, eight concurrent appends fork the\n\
  chain; serialized, all eight land with it intact. It changes no verdict and no record\
  \ content — a\nrefusal that was correct before is still correct — it removes only\
  \ the refusal that concurrency\nalone produced. (SPEC-0094 §8 cites this rule for\
  \ the deploy seam where X-1437 was measured; the\nrule is stated here because it\
  \ is not deploy's.)\n\n### 10. The carrier is a PARAMETER; the rule is not carrier-specific\n\
  Rules 1-7 are independent of WHERE grant state lives. The carrier is an installation\
  \ parameter\n(§Parameters). Interpretation note: the carrier may sit outside the\
  \ governed system's own write\nterritory — that is compatible with, and in this\
  \ installation is the mechanism of, rule 5.\n\n### 11. A checkout owned by another\
  \ OS user — trust is ADDED only by the project's own declaration\nThe governed system\
  \ runs the version-control tool inside a project's checkouts. Where a checkout is\n\
  owned by another OS user, the tool may refuse it under its own ownership guard.\
  \ This rule settles\nwhen the system may pass the tool trust for such a checkout,\
  \ and what a verb says when it may not.\n\n(a) AUTHORITY FOR ADDED TRUST. The system\
  \ ADDS trust for a checkout owned by another OS user only\nunder the PROJECT's OWN\
  \ declaration of that checkout in its ops contract, and each declaration names\n\
  who accepted the risk and why. It never adds trust on any other basis. Whether the\
  \ tool admits a\ncheckout on its OWN authority is not this rule's to grant or deny\
  \ (clause c).\n\n(b) ABSENCE, TOOL REFUSES. Undeclared, the system adds no trust.\
  \ Where the tool refuses the checkout,\nthe verb refuses BY NAME: what happened,\
  \ that nothing was changed, and the two routes — declare the\ncheckout, or grant\
  \ it in one's own user configuration. It never prints a destructive hand command.\n\
  \n(c) ABSENCE, TOOL ADMITS. Undeclared and admitted by the tool on its own authority,\
  \ the verb proceeds\nexactly as it would without this rule: the system adds, removes,\
  \ gates, refuses and reports nothing.\n\n(d) SCOPE. A declaration names exactly\
  \ one checkout root by an ABSOLUTE location — resolved the same\nway whatever directory\
  \ the system runs from, never relative, never empty — or every root owned by one\n\
  named user. It trusts exactly that resolved root, never a subtree, parent or sibling,\
  \ and the trust\npassed to the tool always names that one root in a form the tool\
  \ reads as that root ONLY. A root\nwhose location the tool would read as a pattern\
  \ or an expansion receives no trust and is named.\n\n(e) ACKNOWLEDGEMENT. A declaration\
  \ without an acceptor and a reason, or with a malformed selector, is\ninvalid and\
  \ trusts nothing. It is named by the project's ops-contract conformance check and\
  \ by the\nrefusal of clause (b) — never silently dropped.\n\n(f) REVOCATION. Removing\
  \ a declaration revokes at the next governed invocation, never from a stale\ncache.\n\
  \nThe system never writes any user's configuration to grant or remove such trust\
  \ (SPEC-0111 §1): the\ndeclaration lives in the project's own contract, and a per-user\
  \ grant stays that user's own act.\nGrounds: a consumer's park, sync and land paths\
  \ met a collaborator-owned checkout, got the tool's\nownership failure and mis-refused\
  \ on an unrelated cause, leaving a destructive hand recovery as the\nonly visible\
  \ exit (X-1392, X-1395, 2026-09-14).\n\n## Parameters\n\n| Parameter | Meaning |\
  \ `consumed` |\n|---|---|---|\n| grant carrier | WHERE grant state lives for this\
  \ installation. Read-only to the governed system per rule 5. | no — a path, never\
  \ a consumed governance scalar |\n| identity source | The server-issued session/OS\
  \ identity rule 3 derives from. | no |\n\nNeither is `consumed`: both are per-installation\
  \ paths/handles, which the `consumed` whitelist\nexcludes by construction.\n\n##\
  \ Rationale\n\nThe mechanism this contract governs already separates the two questions:\
  \ an actor-authority port\nanswers only «IS this actor authorized», never «is this\
  \ really them», and warns that a consumer\nskipping the second half runs an authorization\
  \ check over an unverified name. That consumer state\nwas real — an operation took\
  \ its actor from a command-line flag defaulting to the local user, so\nthe person\
  \ performing it supplied their own name — while a collaborator held production deploy\n\
  rights. Rule 3 exists to remove that input, not to supplement it.\n\nRule 1's insistence\
  \ on NAMED people is likewise incident-grounded: an \"owner-only\" label travelled\n\
  three coordination carriers unchecked before anyone tested it against the requirement,\
  \ and the\nmechanism underneath it had contradicted that label in writing the whole\
  \ time. A restated label is\nnot a checked claim.\n\nRule 5 is separation of duties.\
  \ Rule 6 exists because rule 5, alone, is the failure mode a reviewer\nshould expect:\
  \ a boundary that removes an ability and forgets to keep the obligation degrades\
  \ into\na document.\n\n## Verification\n\nEvery probe is DIFFERENTIAL — it names\
  \ the input that must make it FAIL. Probes run against\nKERNEL-OWNED enforcement\
  \ behaviour and FIXTURE grant sets; a change to live grant state is\nowner-controlled\
  \ operational evidence, NEVER a probe of this spec (rule 5).\n\n- **V1 (rule 3)\
  \ — forged identity refused.** An operation carrying an actor identity the server\
  \ did\n  not issue is refused. Failing input: that same call succeeding.\n- **V2\
  \ (rule 3) — caller input is REFUSED, not overridden.** A protected operation invoked\
  \ WITH a\n  caller-supplied actor argument or env fallback is refused outright.\
  \ Failing input: it proceeding\n  on the server-issued identity while silently ignoring\
  \ the flag — that passes an\n  \"identity is correct\" check while leaving the accepted-authority\
  \ surface alive.\n- **V2-ENV (rule 3) — the DERIVATION itself does not follow the\
  \ environment.** V2 above proves the\n  ENUMERATED actor channels are refused; this\
  \ proves the identity the refusal exists to protect is\n  not movable by an environment\
  \ value NOBODY enumerated. A protected operation run with\n  LOGNAME/USER/LNAME/USERNAME\
  \ set to a different **provisioned** user derives the OS uid's passwd\n  name, not\
  \ the environment value. Failing input: the derived identity following the environment.\n\
  \  Two bounds, both load-bearing, or this probe passes against the broken code:\n\
  \  (a) the forged name MUST be PROVISIONED — forging to garbage exercises rule 4's\
  \ vocabulary check\n  instead of the derivation, and the vocabulary check was never\
  \ the thing that was broken;\n  (b) the probe MUST run the SHIPPED call site end-to-end,\
  \ not a test-injected identity seam —\n  V1/V2 inject theirs and therefore cannot\
  \ see a real producer at all, which is precisely why this\n  contract read green\
  \ for the whole period the channel was open.\n  Grounds : every shipped gate site\
  \ bound `getpass.getuser`, which consults\n  LOGNAME/USER/LNAME/USERNAME before\
  \ the passwd database. Measured with `USER=<collaborator> LOGNAME=<collaborator>`\n\
  \  against the real uid name `dev`, the gate derived `<collaborator>` — a provisioned\
  \ user, so rule 4 admitted\n  it and the operation proceeded under a name its caller\
  \ chose, while the rule-3 refusal correctly\n  reported nothing to refuse. The remedy\
  \ is to REMOVE the channel (derive from\n  `pwd.getpwuid(os.getuid).pw_name`), never\
  \ to add those four to the refused-variable list: every\n  login shell sets them,\
  \ so refusing on their presence would refuse every legitimate invocation.\n- **V2-CALLSITE\
  \ (rule 3) — the property is checked where it lives.** Rule 3 is a property of the\n\
  \  COMPOSITION, not of any one function: the identity boundary reads no environment\
  \ in its own body\n  yet derives from the callable each call site binds. So EVERY\
  \ shipped `session_identity=` binding\n  must name a producer that reads no environment,\
  \ verified by reading that producer's code — not\n  its name and not a docstring.\
  \ Failing input: any call site bound to an environment-reading\n  producer. Without\
  \ this leg the contract's central claim rests on prose that was, for its whole\n\
  \  life, true of a function body and false of every call site.\n- **V3 (rule 4)\
  \ — fail closed both ways.** An unmapped identity is refused; an empty/unreadable\n\
  \  grant set is refused. Failing input: either case permitting the operation.\n\
  - **V4 (rule 7) — revoke is provable.** Against a fixture grant set, removing a\
  \ name flips the same\n  request from permitted to refused. Failing input: the post-removal\
  \ request still permitted.\n- **V5 (rule 1) — a granted NON-OWNER can act.** A named\
  \ non-owner holding `deploy-code` is\n  PERMITTED to deploy. Failing input: that\
  \ person refused. Without this probe the contract is green\n  by construction: an\
  \ implementation refusing everyone passes V1-V4 perfectly and satisfies no\n  requirement.\n\
  - **V6 (rule 2) — rights are separable.** A person holding `deploy-code` but not\
  \ `apply-prod-data`\n  is refused on a production-data apply while their deploy\
  \ still succeeds. Failing input: the same\n  person permitted to apply production\
  \ data.\n- **V7 (rule 6) — read-only validation of live state exists.** The system\
  \ reports whether live grant\n  state is well-formed against rules 1-2 WITHOUT writing\
  \ it. Failing input: a malformed live grant\n  reading clean.\n- **V8 (rule 5) —\
  \ the gated component cannot write grants.** A write attempt against the grant\n\
  \  carrier from the governed system's own path fails. Failing input: any such write\
  \ succeeding.\n- **V9 (rule 8) — declared reach matches measured capability.** For\
  \ each actor the installation\n  declares a reach, and the declaration matches that\
  \ actor's ACTUAL escalation capability as\n  measured on the host. Failing input:\
  \ an actor declared under ENFORCEMENT reach who in fact holds\n  unrestricted `sudo`\
  \ or equivalent container control — the declaration must be reported wrong,\n  not\
  \ quietly honoured. A registry label alone never satisfies this probe.\n- **V10\
  \ (rule 9) — the trail is complete and attributable.** Every exercise of a right\
  \ produces a\n  record naming identity, right, project, time, grant and registry\
  \ carrier. Failing input: a successful exercise\n  that leaves no record, or a record\
  \ that cannot distinguish WHICH identity acted — either makes\n  the trail non-probative\
  \ exactly where the advisory reach depends on it.\n- **V12 (rule 2) — the DECISION\
  \ right confers no EXECUTION.** A person holding ONLY\n  `decide-authority` on a\
  \ project is REFUSED there on `deploy-code` AND on `apply-prod-data`, while\n  a\
  \ control person holding those two IS permitted on them — the control is what proves\
  \ the refusal\n  is about the right rather than about a broken fixture. Failing\
  \ input: either execution path\n  permitted off the decision right alone, which\
  \ would collapse deciding and doing into one\n  privilege — the exact merge rule\
  \ 2 forbids. Structural arm, because a single fixture cannot see\n  it: no gated\
  \ operation maps to `decide-authority` and it is not the exercisable right, so the\n\
  \  separation is a property of the code and not only of today's grant set.\n- **V11\
  \ (rule 1a) — the all-projects scope class is a CLASS, resolved at read time.**\
  \ Against two\n  carrier states whose grant declarations are BYTE-IDENTICAL and\
  \ whose registry differs by one\n  newly-registered project, a grant declaring the\
  \ scope class authorizes that new project while an\n  ENUMERATED grant naming the\
  \ same projects refuses it — the enumerated leg being the control that\n  proves\
  \ the class is doing the work. The STORED carrier still carries the declaration,\
  \ not an\n  expanded list, and the same declaration re-resolved against a different\
  \ registry yields a\n  different covered set. Failing inputs, each of which this\
  \ probe must catch: the class expanded\n  into an enumeration at write time (green\
  \ on the first leg today, decayed at the next\n  registration); the class honoured\
  \ as an unconditional yes, so a project the registry does not\n  declare is covered;\
  \ or the class admitting a subject rules 3-4 refuse — a scope class widens\n  projects,\
  \ never subjects.\n- **V13 (rule 11) — trust is added only where the project declared\
  \ it.** In one fixture project\n  whose checkouts the tool treats as owned by another\
  \ user: a declared root gets trust naming that\n  root and the tool proceeds; an\
  \ undeclared sibling gets none; a relative, empty or non-string\n  selector and\
  \ a pattern-shaped root get none and are named; an undeclared root the tool refuses\n\
  \  yields the named refusal with no destructive command; an undeclared root the\
  \ tool admits on a\n  per-user grant runs with an unchanged invocation and no refusal;\
  \ removing the declaration removes\n  the trust on the next call. Failing inputs:\
  \ trust added to an undeclared or sibling root; the\n  tool's raw failure or a destructive\
  \ command reaching the operator; any flag, refusal or report\n  added on the tool-admitted\
  \ root.\n"
