requires: []
supersedes: ~ # ADDS a stage; does NOT supersede SPEC-0034 (which stays the per-stage
                               # mechanics home, edited to insert + delegate this stage — §9).
activation_owner_task: # forbidden while draft (SPEC-0005 §5); SET at the plan's `executing`
                               # decomposition to the ONE task that is the CAPSTONE verifier (done=adopted: activates when the mechanism is PROVEN, not step-1; this
                               # spec's binding) — the others `cite` this spec.
proposed_by: mandatory-external-decomposition-fidelity-audit-of
binding: # SET by together with the step-1 code edit (§9.1): the token
  - plan-stage-entry:decomposition # is now VALID — `PLAN_STAGE_SEQUENCE` gained `decomposition`
                               # (`_is_valid_plan_stage_entry` accepts it; no `unknown_tokens` →
                               # conformance stays GREEN). This is the cut-rules delivery binding —
                               # the `plan-stage-entry:decomposition` bundle ships THIS spec at the
                               # new stage (§8). Build-order constraint (binding set WITH the constant
                               # insert, never before) satisfied in this one change-set.
