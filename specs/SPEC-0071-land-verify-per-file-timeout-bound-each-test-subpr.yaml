id: SPEC-0071
title: 'Land-verify per-file timeout — bound each test subprocess, group-kill on hang, never hang the land'
# `class:` REMOVED — a spec carries both layers as body sections (Scenario + Internal).

status: active

created_at:

consumed: false # no code reads a governing SCALAR param FROM this spec. The timeout
                               # CONSTANT lives in code (_VERIFY_TEST_TIMEOUT_DEFAULT) with an env
