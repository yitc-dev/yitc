  - bin/lib/verify_runner.py#_run_verify_tests
  - bin/lib/verify_runner.py#_reap_own_sandbox_residents # — run-level teardown reap (§5)
  - bin/lib/verify_runner.py#_sandbox_run_residents # — the residency selection (§5)
