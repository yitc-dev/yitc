body: |
  ## Scenario

  `land` verifies a writing worktree by running the whole `tests/` suite before fast-forwarding main.
  Before, each `tests/test_*.py` was launched in PARALLEL with NO wall-clock bound, so a single
  hanging or resource-leaking test hung `land` FOREVER — and because every concurrent session runs its
  own verify, one leaking test under concurrent load hung land for ALL sessions at once (the real prod
  incident of 2026-06-10). The owner sees: a `land` that never returns and never emits its `LAND:`
  terminal token, with no named culprit.

  After : a hung test is KILLED within ~its timeout, `land` ABORTS LOUDLY naming the offending
  test file, and the recurrence is recorded durably — so the leaking test gets root-fixed instead of
  silently timing out forever. A healthy suite is unaffected (the bound is ~100x the slowest real test).

  ## Internal

  THE CONTRACT (every land-verify subprocess MUST honor it):

  1. PER-FILE (not whole-suite) wall-clock bound. Each `tests/test_*.py` (in `_run_verify_tests`) and the
     dedicated host-leak canary suite (`_run_host_leak_canary`) is bounded by `_verify_test_timeout_seconds`
     — `_VERIFY_TEST_TIMEOUT_DEFAULT` (300s), overridable by the `YITC_VERIFY_TEST_TIMEOUT` env var
     (positive float; a blank/invalid/non-positive value fails safe to the default — the bound is never
     disabled). Per-file, not whole-suite, so the hung test is NAMED.

     **Resolution order ( additive extension — the bound's SOURCE, never its absence).**
     `_verify_test_timeout_seconds(declared=None)` resolves, highest precedence first: the
     `YITC_VERIFY_TEST_TIMEOUT` env ESCAPE HATCH · an OPTIONAL `declared` bound passed by the caller ·
     the 300s default. The `declared` rung serves a CONSUMER's durable per-layer / per-project
     land-verify declaration (`yitc-ops.yaml verify.layers[].timeout` / `verify.timeout_seconds` —
     SPEC-0152 rule 16), so a legitimately slow-but-passing verify no longer needs a remembered env
     override at every land (X-0204). A zero-arg call is unchanged (env-or-default), and every rung
     falls SAFE: a blank/invalid/non-positive value at ANY rung drops to the next, so the bound is
     NEVER disabled — the per-file hang guard above is untouched. Additive only: this rule's default
     VALUE, its process-group kill, its marker, and its abort classification are all unchanged.

     **CPU-STARVATION GRACE ( — the bound is charged for HANGING, not for CONTENTION).** At the
     deadline, and BEFORE the kill, the runner consults `_verify_timeout_grace_seconds` on the wall+CPU
     sample §3 already takes. It returns extra seconds, or 0.0 meaning KILL NOW (the pre-
     decision, unchanged). Grace is granted ONLY when ALL hold: (a) §3's class is `starved` — so the
     group HAS burned real CPU (it is not a deadlock) yet spent most of its life waiting for a core;
     (b) fewer than `_VERIFY_TIMEOUT_GRACE_MAX` (=2) windows have already been granted — a HARD ceiling
     putting total wall at (1+MAX)x the bound, so every file is still killed in bounded time; (c) CPU is
     still ACCUMULATING — it grew over the last window by at least the stalled band's share of one
     window, so a file that starts starved and then deadlocks loses its grace at the NEXT deadline
     rather than riding the ceiling out. An unusable input (cpu unavailable → no class; a non-positive
     bound) returns 0.0: an unavailable measurement fails SAFE to the kill and never buys time.
     THE HANG GUARD IS INTACT BY CONSTRUCTION, not by promise: the two ENDS of the band are exactly the
     two hang shapes — `stalled` (cpu≈0: a deadlock or a blocking wait) and `long` (cpu≈wall: a runaway
     busy loop) — and both fall through to the UNCHANGED first-deadline kill. Only the middle band can
     buy time, at most twice, and only while it keeps proving progress. Grace DEFERS a kill; it never
     cancels one and it can NEVER turn a verdict into a pass — the file runs on to its OWN real verdict
     (pass or fail) or to a later kill.
     WIDENED REACHABILITY IS NOT A WIDENED DIRECTION (named here because the 2026-08-27
     external consult required it be named). Making §3's denominator explicit makes `starved`
     REACHABLE for a single-process file that the old one-core reading always called `long`, and since
     `starved` is the only band that can defer, that WIDENS WHAT MAY BE DEFERRED. It does NOT widen
     the DIRECTION in which this classification gates, and no part of this rule may be read as doing
     so: grace still only ever DEFERS a kill, never cancels one, never raises the bound and never
     turns a verdict into a pass; conditions (a)/(b)/(c) above are unchanged; `_VERIFY_TIMEOUT_GRACE_MAX`
     stays 2 so total wall stays bounded at (1+MAX)x the bound; and BOTH ENDS of the band still fall
     through to the unchanged first-deadline kill AT ANY MEMBER COUNT. Reachability and direction are
     separate properties of this gate — changed only the first, deliberately, and a future
     change that touches the second is a different decision needing its own consult.
     THE MIDDLE BAND'S RESIDUAL, STATED RATHER THAN HIDDEN: a hang
     that BURNS starved-band CPU (a polling livelock, a spin-with-sleep retry loop, a waiter that
     wakes to re-check) is indistinguishable from real starvation to any bound, because CPU is the
     ONLY progress evidence available from outside the process. Such a file IS granted its windows —
     and it is still KILLED and still ABORTS the land, in total wall bounded by (1+MAX)x the bound
     rather than by infinity. So the guarantee for the two ENDS of the band is `killed at the first
     deadline` and for the MIDDLE it is the CEILING; the hard constraint (a genuine hang is still
     killed and still aborts, whatever its cpu profile) holds for all three, and the price of the
     middle case is one land delayed by at most two extra windows.
     WHY: the timeout class is a POPULATION, not a list. A fixed wall
     bound + a growing suite + a host SPEC-0132 admission deliberately OVERSUBSCRIBES guarantees a fresh
     cohort of starved files whenever load rises (88 dated fingerprints in the week to 2026-08-10,
     refilling from the next-slowest files after each round of per-file remediation), so the remedy is
     to give a starved file the CPU time it was never given rather than to keep draining the cohort or
     to stretch the bound blindly for everyone. Every kill — first-deadline or grace-exhausted — records
     the windows it spent, in the abort reason (`grace=N`) and in the §4 payload (`grace_extensions`).

     **MEASURED LAND OVERLAP IS SUBTRACTED BEFORE ANY OF THE ABOVE.** On the SPEC-0203
     venue a Stage-6 leg runs at nice 19 beside a nice-0 land and receives ~1% of contended CPU, so
     it is effectively PAUSED while this wall bound keeps ticking; the leg therefore records the
     intervals during which a foreign `land`-class lease was live on the box, and at each deadline
     the runner pushes the deadline out by the part of THIS FILE'S OWN window that overlapped one —
     before the grace consult above, which is unchanged. This is a DEFERRAL denominated in
     MEASUREMENT rather than a raised bound: it is 0.0 whenever the sidecar is absent, unreadable or
     names no land (so every local land is byte-identical to before this card), it can never exceed
     the file's own elapsed window, and a file nothing starved is still killed on exactly the
     deadline it always was — at BOTH ends of the §3 band.

  2. OWN PROCESS GROUP + GROUP-KILL. Every verify subprocess is launched with `start_new_session=True`
     (its PID == its process-group id). On expiry `_terminate_process_group` `os.killpg(pid, SIGKILL)`s
     the WHOLE group — the test AND every child it forked — then reaps, so a leaked grandchild
     (tempdir-holder, server, sub-subprocess) cannot orphan and survive the kill. The same helper is
     reused on the existing fail-fast kill, so fail-fast kills also group-reap.
   THE BOUND IS CHARGED ONLY WHILE THE DIRECT CHILD IS ALIVE. A file's verdict is decided
   by its DIRECT CHILD's EXIT STATUS, never by whether some descendant still holds the inherited
   stdout pipe. So the runner WAITS ON THE CHILD (`proc.wait`) and drains stdout concurrently in a
   reader thread; it must NOT wait for EOF on the pipe (`communicate`), which every grandchild
   inherits. Pre- a test that spawned a background child and exited 0 left that pipe open, so
   the deadline kept being charged against an already-reaped, already-PASSING child until the bound
   tripped and killed it — aborting a land whose diff was innocent, with the cpu much-less-than-wall
   signature that §3's renderer reports as a starved host, hiding the cause in the message meant to
   explain it. Once the direct child exits, the runner group-kills whatever it leaked (so reaping
   here is strictly INCREASED — it now covers the clean-exit path too, not only timeout/fail-fast)
   and collects the drained output under a SHORT bounded join, so a descendant that escaped the
   group via its own `setsid` cannot extend the file either. This does NOT loosen §1: a file whose
   direct child never exits is still bounded by the SAME per-file wall clock and still takes §3.
   Incident: was complete (both audits GREEN, probes 3/3) and self-halted BLOCKED-ON-LAND
   after two consecutive aborts of this class under 20 live worktrees (2026-08-07).

  3. LOUD, ACTIONABLE, NON-RETRIABLE failure — and it MEASURES rather than DIAGNOSES. The
     timeout appends to the existing `[reason...]` return shape a message carrying the stable
     `_VERIFY_TIMEOUT_MARKER` token plus a human-actionable reason: the named file, the bound, the
     override env var, and — the amendment — the MEASURED wall AND the MEASURED CPU at the
     kill. The message MUST NOT assert that the killed test hangs or leaks a child. That assertion was
     the pre- wording, and it is a DIAGNOSIS the mechanism cannot make: this rule's own trigger
     (a wall-clock bound) cannot distinguish a test doing genuine work from a starved host doing none.
     Stating it anyway sent an operator to debug tests that PASS at the same tree state, twice in one
     session (2026-08-07). The two numbers let the reader draw the conclusion the evidence supports, and
     since the message NAMES that conclusion as one of THREE classes rather than leaving the
     two waiting cases collapsed — the class is a pure function of the already-sampled ratio
     `cpu/wall` (`_timeout_class`, bands 0.6 and 0.05, cut from the measured profiles 300.1/292.3,
     300.3/83.8 and a deadlocked file at cpu≈0):
       * `long` (cpu ≈ wall) — real work: a genuinely long test, or a busy loop;
       * `starved` (cpu ≪ wall) — mostly WAITING FOR CPU on a host SPEC-0132 admission deliberately
                                   oversubscribes; the landing diff is probably innocent;
       * `stalled` (cpu ≈ 0) — no work at all for the whole bound: a deadlock or a blocking wait.
     THE DENOMINATOR THE BANDS ARE READ AGAINST IS EXPLICIT — and it is NOT the same for
     every band. The numerator is summed over the WHOLE process group (§2's kill unit), so reading it
     against wall alone reads it against ONE core while the group's parallelism is unknown. One fixed
     pair of bands then cannot separate a single-process file denied 39 percent of one core from a
     multi-process group doing real work on several cores — measured over every land-verify timeout
     kill in this repo's live journal segment (n=82, 2026-08-27): 77 `long`, 5 `stalled`, and ZERO
     `starved`, with `grace_extensions` 0 on all 82, i.e. §1's starvation grace had never once fired.
     The most-killed file walked its ratio DOWN across dates (1.00, 0.77, 0.64, 0.70, 0.69, 0.61)
     toward the 0.6 edge while classified `long` throughout, and so was handed the `long` advice for a
     condition neither of its remedies addresses. So:
       * the LONG band is read against `cpu / (wall x MEMBERS)`, where MEMBERS is the group's OBSERVED
         member count — `_process_group_cpu_seconds` returns it alongside the CPU total, counted on
         the /proc walk it already performs. Per observed member the band is
         `_TIMEOUT_CLASS_LONG_RATIO_PER_MEMBER` (0.75).
       * the STALLED band is read against the RAW `cpu / wall` and is NEVER normalised. "Did
         essentially no work at all" is an ABSOLUTE property of the group; dividing it by concurrency
         would relabel a large, mostly-idle group as a deadlock and weaken the hang guard at the very
         end where it is least ambiguous today.
       * when the member count could NOT be observed, the LONG band falls back to the raw
         `_TIMEOUT_CLASS_LONG_RATIO` (0.6) — the pre- single-core reading, unchanged. An
         observed count and an absent one are different EVIDENCE and must not be collapsed: nothing
         widens on a denominator nobody measured, so a pinned/older injected sampler returning a bare
         CPU float classifies exactly as it did before and cannot newly buy §1's grace.
     The payload (§4) carries `members` beside `timeout_class`, so a later fold can RE-DERIVE the
     classification rather than having to trust a label whose denominator it cannot.
     Each class carries the RECOVERY ADVICE ITS OWN evidence supports, and the pre- blanket
     tail — "if the work is genuinely this long, raise the bound" appended by EVERY call site — is
     REMOVED: it is right only for `long`, and for the other two it is the blind stretch SPEC-0103
     forbids (six aborts on one file inside two days were read through it, four of them consecutive
     with the CPU figure FALLING run over run as the retry loop deepened its own contention).
     THE CLASSIFICATION IS A DIAGNOSIS FIRST, AND A GATE IN EXACTLY ONE DIRECTION (amended by;
     as shipped it, it was a diagnosis and nothing more). The ONE place a band feeds back into
     the bound is §1's starvation grace: a `starved` verdict can DEFER a kill by up to
     `_VERIFY_TIMEOUT_GRACE_MAX` ceilinged, progress-conditional windows. It can never cancel a kill,
     never raise the bound, and never turn a verdict into a pass. Everything else is as before: a
     `long` kill and a `stalled` (deadlocked) kill both still happen on the SAME unchanged 300s WALL
     deadline — which is why no above-300s wall backstop is needed to tell a deadlock from a merely
     slow test — and a file whose grace is spent is killed and ABORTS the land exactly as it always did.
     The grace decision CALLS `_timeout_class` rather than re-deriving a second cpu/wall discriminator,
     so the label an operator reads and the behaviour the land takes can never disagree.
     An unmeasured kill (`cpu=unavailable`) is left UNCLASSIFIED rather than guessed.
     CPU is summed over the WHOLE process GROUP that §2 kills, never
     the leader alone: `cutime`/`cstime` account only for REAPED children, so a leader-only read
     undercounts exactly the live-child leak shape this rule exists to catch and would mislabel it
     "starved" — re-introducing the false diagnosis through the number instead of the prose. The
     measurement is BEST-EFFORT and renders `cpu=unavailable` when it fails: it must never mask,
     delay, or replace the abort it describes. `_land_integrate` greps the marker
     and `_die`s with the DISTINCT `abort_class="verify-timeout"`. This is categorically NOT the soft
     ff-race retry: a verify failure `_die`s (SystemExit) BEFORE the in-lock `continue` paths, so a
     timeout is NEVER consumed by `_LAND_MAX_RETRIES`; the distinct abort_class also lets the
     repeated-abort backstop streak a recurring hang separately from generic verify failures.

  4. DURABLE CROSS-SESSION TRACE. On a timeout-kill `_emit_verify_timeout_deviation` appends a
     `deviation_captured` (the EXISTING capture event — no new type; `kind: defect`,
     `fingerprint: land-verify-timeout:<test>`) to MAIN's `events.jsonl` (`journal_path` passed by
     `_land_integrate`). Durable on main even though THIS land aborts — the next land folds
     the append. The emit is HARDENED best-effort: session_ref is resolved defensively and passed
     explicitly (the normal resolver may itself `_die`), and the body is wrapped so NOTHING — not even a
     SystemExit — can escape to mask or replace the timeout abort. The fingerprint collapses repeat hangs
     of one test into a single queryable signal.

  5. RUN-LEVEL TEARDOWN REAPS THE RUN'S OWN SANDBOX, AND REPORTS WHAT IT CANNOT REAP (X-0950). Rules 1-4 above reap PROCESS GROUPS, one test file at a time. That leaves a residual the
     group is structurally blind to: a descendant that starts its OWN session (`setsid` /
     `start_new_session=True`) is no longer in the file's group, so NO `killpg` the runner issues — not
     the timeout kill, not the fail-fast kill, not `_reap_leaked_descendants` on the clean-exit path —
     can ever reach it. It survives the run, and until this rule nothing looked for it and nothing said
     so. MEASURED on the shared host 2026-08-17: two leader+child pairs, `ppid=1 pgid=self`, elapsed
     19h11m and 20h21m, each pinning one of 32 cores at ~99% — ~4 cores burned for most of a working
     day on a host four projects share, plus a second cost: the phantom load inflates every readiness
     reading a controller uses to size a dispatch wave.
     So `_run_verify_tests`'s teardown, BEFORE it `rmtree`s the per-run sandbox:
     - SELECTS the processes still resident in THIS run's OWN `_sandbox_root`, by POSITIVELY resolving
       a REAL path of the process's own — its cwd OR an argv element — to a location AT OR UNDER that root
       (`_sandbox_run_residents` / `_path_at_or_under`). CONTAINMENT, asked directly, NOT the shared
       `_sandbox_resident_root`: that helper answers "which sandbox root, of all of them" and answers it
       SHALLOWEST-FIRST for its own callers, so under NESTED verifies (a test in land's suite running a
       verify of its own) it returns the OUTER root and a comparison against the inner root matches
       nothing — the reaper would reap silently nothing under exactly the shape land produces. Lexical
       component containment also removes the glob, so a `mkdtemp` suffix carrying a metacharacter
       cannot change the answer, and a sibling root sharing a string prefix is never matched. A
       candidate must additionally EXIST on disk: a cwd is a kernel-maintained link and is a path by
       construction, but argv is arbitrary TEXT, so without that requirement any string merely READING
       like a sandbox path — a `-c` program body, a log line quoting a filename — would nominate the
       process carrying it (audit-post finding 2). Checkable precisely because the reap precedes the
       rmtree; unresolvable or absent selects NOTHING. BOTH
       channels are read because the measured
       population needs both: the leader carries the path in argv, its `python3 -c` burner only in cwd.
       Never a process name, never "not recognised"; an unprovable `/proc` entry selects nothing.
       A CANDIDATE IS ALSO EACH WHITESPACE TOKEN OF AN ARGV ELEMENT THAT HAS ANY. An element
       is not always one argument: a process that rewrites its argv AREA with a status title presents
       `/proc/<pid>/cmdline` as ONE NUL-free blob, and nginx — which the verify sandbox starts — presents
       exactly that: `nginx: master process /usr/sbin/nginx -p <root>/box<N>/tmp/tmp<X>/sb -c …`. That
       whole element is not a path, and such a master does not chdir into the sandbox either (measured
       cwd: the inherited task worktree), so BOTH channels above read nothing and teardown selected ZERO
       of them. Measured 2026-08-17, after this rule already shipped: four masters alive on the shared
       host, 14h24m–18h26m, every one naming a sandbox root already gone — a 100% orphan rate — and one
       holding a task worktree as its cwd, which made `worktree adopt --confirm-dead` refuse a
       legitimate recovery. So `_sandbox_residency_candidates` offers the cwd, each argv element, AND
       the whitespace tokens of any element that has them. This is the same lesson `_sandbox_prefix_arg`
        already learned on the `-p` axis, applied here on the containment axis. It WIDENS ONLY
       THE CANDIDATE STRINGS: every fence above — the must-EXIST requirement, the lexical component
       containment against this run's OWN mkdtemp root, the uid / self-pid / self-pgid exclusions, the
       fail-closed unreadable case — is unchanged and still applied to each candidate, so the widening
       can only ever offer the predicate more strings to REJECT. It is NOT a widened kill discriminator:
       the host-wide reaper's rule that a sandbox-resident process carrying no `-p` identity is
       REPORTED and never killed on a guess lives in `select_orphan_sandbox_procs` and is untouched.
     - KILLS each resident (`SIGKILL`), re-validating residency immediately before the signal (the
       `_reap_proc` PID-reuse discipline). The GROUP is killed ONLY when the resident IS its own group
       leader (`pid == pgid`) — the escape shape, where the group holds exactly this leaker and what it
       forked, so leader and burner die together instead of the burner being re-orphaned onto init. A
       NON-leader resident belongs to somebody else's group, which may hold processes this teardown has
       no claim on, so only its OWN pid is signalled; its children are not lost, because a child inside
       the sandbox is itself a resident and is killed on its own merits, never as collateral of a group
       it merely belongs to. (Audit-post finding 1: the first draft called `killpg` unconditionally.)
       A process SIGKILLed while its parent is still alive becomes a ZOMBIE — empty cmdline, no readable
       cwd — so it re-proves as NOT resident and is correctly counted REAPED, never a survivor.
     - REPORTS every survivor. A process still resident after a SIGKILL is one teardown CANNOT reap, and
       that is exactly the case a human must be told about: `_emit_sandbox_survivor_deviation` appends a
       durable `deviation_captured` (the EXISTING event — no new type; `kind: defect`,
       `fingerprint: verify-sandbox-survivor-unreaped`, constant rather than per-pid so recurrences
       COLLAPSE into one signal instead of each pid minting a fresh one) carrying each survivor's pid,
       pgid, age, cwd and argv, and prints a stderr line naming them.
     ORDERING IS NORMATIVE: the reap runs BEFORE the `rmtree`. Residency is read off paths that stop
     resolving once the tree is deleted, so deleting first destroys the only evidence tying a survivor
     to the run that produced it — which is precisely how the measured leakers became untraceable.
     REPORT-ONLY, NEVER A VERDICT: this step cannot fail a run, and a leak can never turn a green verify
     red. A reporting surface that could abort a land is a surface someone eventually silences.
     WHY THE KILL IS SAFE HERE AND ONLY HERE. `cmd_worktree_sweep` Category C sees this same population
     and deliberately only REPORTS it (`select_orphan_sandbox_procs` -> `residents`), because from
     outside nothing distinguishes a survivor of a FINISHED run from a legitimate child of a RUNNING
     one. That fence is correct and is UNCHANGED by this rule. Teardown does not face that question:
     `_sandbox_root` is a `mkdtemp` root belonging to exactly ONE run, and the selection is made only
     after that run has ended, so residency IS survival. No age fence is used — an age fence would be a
     proxy for a fact already known. Host-wide process policing beyond this run's own sandbox stays OUT
     OF SCOPE.
     NOT THE "31-YEAR TIMER". X-0950's origin fingerprint named one. The number is real — a fixture burn
     loop bounded at 1e9 s = 31.7 years — and it was already capped to 600 s by /E-0059, yet the
     leak class stayed open. A bound on the loop decides how LONG a survivor burns, never WHETHER it
     survives; a 600 s-capped survivor is still unreaped and unreported. The cause is the group-scoped
     reaping above, not any timer.

  ### Incident procedure (DURING + AFTER) — owner-directive 2026-06-10

  DURING a hang (executed by the verb, automatically):
  - Per-file bound trips → the hung test is NAMED in the abort reason.
  - The whole process GROUP is SIGKILLed (leaked children released, not orphaned).
  - `land` ABORTS loudly with `abort_class="verify-timeout"` and the `LAND: ABORT` terminal token; it
    does NOT hang and does NOT retry the hang.
  - Concurrent landers DO NOT pile up: each runs its own isolated verify in its own worktree (no shared
    lock during verify), so each independently aborts within ~timeout — bounded fast-fail, never an
    indefinite shared pile-up. On the FIRST timeout in a run `stop` is set, so in-flight siblings
    self-terminate (group-reaped) on their next ≤1s poll and not-yet-started tests skip; the executor
    barrier reaps every worker before return → the whole abort is bounded to ~timeout (~1s), never ∞.

  AFTER a timeout-kill (for the session/owner that sees the abort):
  - Orphan/resource cleanup is automatic: the process-group SIGKILL releases the leaked test's children;
    file/tempdir/port/lock holders die with the group. (Test sandboxes are per-test `tempfile.mkdtemp`.)
    CORRECTED by — this section used to end "once their holders die nothing on the host is left
    running", and that was measurably FALSE: the group kill cannot reach a descendant that started its
    own session, and two such pairs were found alive at 19-20 hours burning ~4 cores. What now makes the
    sentence true is §5's run-level teardown reap, not the group kill alone; and what §5 cannot kill it
    REPORTS (`fingerprint: verify-sandbox-survivor-unreaped`) rather than leaving the reader with a
    reassurance the host contradicts.
  - A durable `deviation_captured` is on main's journal — so the recurring over-bound test is VISIBLE
    across sessions. Query it: `grep land-verify-timeout: events.jsonl` (or `journal query`). It carries
    the §3 measurement as machine-readable `wall_s` / `cpu_s` keys PLUS the `timeout_class`
    key (: `long` / `starved` / `stalled`, or null when unmeasured), so a recurrence is
    triageable as starvation-vs-genuine-work-vs-deadlock by GREP, WITHOUT re-running anything and
    without hand-diagnosis. The key and the impact text render from the SAME `_timeout_class` call,
    so the payload and the prose can never give two answers for one kill. It is a real deviation: it
    must flow through normal triage, NOT be silently timed out forever. READ THE NUMBERS FIRST — the
    right remedy differs by what they say, and assuming a hang is what cost two operator sessions on
    2026-08-07: cpu ≪ wall points at host load or a blocking wait (look at fleet size and at what the
    test READS, cf. / /, where the cost scaled with real repo+fleet state and
    the fix was hermeticity — not a bigger bound); cpu ≈ wall points at genuine work, so either the
    test is honestly that long or it is spinning. A bare timeout-override
    (`YITC_VERIFY_TEST_TIMEOUT`) is a per-land stopgap, never the fix: it hides a growth trend, which
    on 2026-08-07 cost four dispatched workers their finished builds.
  - `_LAND_MAX_RETRIES` interaction: a hard timeout-fail is `abort_class="verify-timeout"`, distinct from
    the soft ff-race retry; it is never blindly retried 5x (it `_die`s before any `continue`).

  ## Parameters

  | name | value | consumed | note |
  |------|-------|----------|------|
  | `_VERIFY_TEST_TIMEOUT_DEFAULT` | 300.0 s/file | no | per-file wall clock; ~100x the slowest real test (3s) |
  | `YITC_VERIFY_TEST_TIMEOUT` | env, positive float | no | per-host/CI override (top precedence); invalid → next rung (fail-safe) |
  | `declared` (arg) | positive float or None | no | a consumer's declared land-verify bound (SPEC-0152 rule 16); below env, above the default |
  | `_VERIFY_TIMEOUT_MARKER` | `[land-verify-timeout]` | no | machine key classifying the abort as `verify-timeout` |
  | `_VERIFY_TIMEOUT_GRACE_MAX` | 2 windows | no | ceiling on starvation-grace extensions; total wall <= (1+MAX)x the bound |
  | `_TIMEOUT_CLASS_LONG_RATIO` / `_TIMEOUT_CLASS_STALLED_RATIO` | 0.6 / 0.05 | no | the §3 cpu/wall bands; also gate §1's grace (starved band only) |

  ## Rationale

  Real incident (CHARTER §Principle-1 filter 4): land hung indefinitely on a leaking/hanging test on
  2026-06-10, and under concurrent load hung land for all sessions. Surfaced by the benchmarking trial
  (plan `ai-configuration-benchmarking-same-task-different-` §6). Anti-complexity (all 4 filters pass):
  (1) EXISTING analogs extended — `_run_verify_tests`/`_run_host_leak_canary` get a `timeout=` param;
  `deviation_captured` reused for the trace (no new event type); `_die`/`abort_class` reused for the
  abort. (2) New VIEW over existing data, not a new entity — no new store/ledger/hook/parser. (3) What
  is removed: the unbounded `while True` hang path (the failure mode itself). (4) Real incident, above.
  Constant choice: 300s/file is generous (slowest real test sleeps 3s → ~100x headroom) so a legit test
  never false-trips, yet bounds a true hang to ~5min/file instead of infinity; env override covers a
  legitimately long integration test without weakening the default.

  Re-verified (2026-06-10): refined the NON-timeout post-run verdict of
  `_run_host_leak_canary` (re-derive from `_canary_watched_leaks`/`_leak_lines` over post-run git
  status, not the raw subprocess exit). This is ORTHOGONAL to SPEC-0071's contract — the per-file
  timeout bound, group-kill, `_VERIFY_TIMEOUT_MARKER` non-retriable abort, and the durable
  `deviation_captured` trace are all preserved verbatim. The timeout contract holds; last-touch
  refreshed to clear the symbol-region possibly-stale heuristic.

  ## Verification

  - tests/test_t0678_land_verify_timeout.py: AC1 a hung test is killed within ~timeout + an actionable
    marker reason + the call returns (non-hang); AC2 the killed test's spawned grandchild is reaped (no
    orphan survives); AC3 structural — a verify-failure (incl. timeout) routes to `_die`, never a
    `continue`, and the timeout marker yields `abort_class="verify-timeout"`; AC4 a `deviation_captured`
    is emitted to the passed journal path; plus the constant + env-override resolver. adds the
  §3 classification tripwires: the three measured profiles yield three DISTINCT classes; a
  DEADLOCKED file is still killed end-to-end and classified `stalled`; the PAIRED probe that the
  kill is still a FAILURE with `_VERIFY_TEST_TIMEOUT_DEFAULT` still 300.0 and the raise-the-bound
  advice absent from `starved`/`stalled`; and payload-vs-message class agreement (ledger I9h–I9j).
  - tests/test_t10875_verify_starvation_grace.py: the §1 GRACE tripwires. The ANTI-PROBE — a genuinely
    hanging file is still killed on the FIRST deadline (asserted as measured elapsed < 2x the bound,
    i.e. not even one grace window), still marked, still non-empty, granted ZERO grace — plus the same
    for the busy-loop end of the band and for an unmeasurable cpu, and — end-to-end on the real clock —
    a MID-BAND hang (a livelock burning starved-band CPU, indistinguishable from real starvation to any
    bound) is granted its windows and is still killed, still aborting, inside the ceiling. The DIFFERENTIAL — a file that only
    exceeds the bound because it is starved (simulated at the runner's own two inputs: the injectable
    clock and the group-CPU reader) reaches its OWN real verdict and emits no timeout deviation. The
    CEILING — a permanently starved file is still killed once its `_VERIFY_TIMEOUT_GRACE_MAX` windows
    are spent, and both the reason (`grace=N`) and the payload (`grace_extensions`) record it. The
    PAIRED probe that the 300s default, the marker, the resolver and the ordinary pass/fail verdicts
    are unmoved. Mutation-checked: making the grace unconditional turns the anti-probes RED.
  - Adoption (Principle 8): `_land_integrate` passes `journal_path=main_wt/"events.jsonl"` to both verify
    helpers on every land — the live land-verify path is the consumer (graph `implements:` edge).

