id: SPEC-1059
title: Consumer Stage-6 passes on the remote verify venue - the verify.venue opt-in,
  the engine the host runs shipped with each pass, a box published for one consumer
  and shared as the project balances it, consumer envelope identity, named per-pass
  placement
