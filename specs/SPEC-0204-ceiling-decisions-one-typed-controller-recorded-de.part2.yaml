  \ IDENTICAL fingerprint and a different locator a different one; a finding lacking\
  \ locator /\n  criterion / class gets a marked `fp1d:` key; the auditor-supplied\
  \ payload carries none (an\n  auditor-written `finding_fingerprint` key is dropped\
  \ and the engine's written); a hand-edited YAML value\n  changes what no reader\
