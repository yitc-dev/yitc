body: "### 3. The one bounded re-audit — `audit pre|post --on-decisions`\nAdmitted\
  \ iff EVERY residual of the ceiling row has a `ceiling_decision` bound to that `ceiling_ref`\n\
  AND the subject being audited is the ONE revision the decisions collectively name:\
  \ the ceiling row's\nown `subject_revision` when no decision is `fix`, else the\
  \ single `evidence_revision` every `fix`\ndecision names (all `fix` decisions on\
  \ one ceiling row MUST name the same revision, which for\naudit-post MUST be a descendant\
  \ of the audited commit — or, at audit-POST, a NESTED chain of\nrevisions, named\
  \ by its unique newest one). Any other subject → refused (`decisions-not-\nfor-this-revision`);\
  \ any undecided residual → refused (`residual-undecided`), naming it.\nA `worktree\
  \ sync` MERGE IS AN ADMISSIBLE AUDIT-POST SUBJECT. When the ONE revision the `fix`\n\
  decisions name is a merge `worktree sync` recorded on the card's branch (its `worktree_synced`\
  \ row's\n`head_after`) and it STRICTLY descends from the recorded commit, the `--on-decisions`\
  \ pass is audited\nAT that merge: the packet grades the cumulative `merge-base(merge,\
  \ main)..merge` range (ship +\nmerge), the record pins `commit:` to the merge and\
  \ names the recorded commit as `sync_merge_ship`,\nand `task close` moves custody\
  \ onto the merge only when git re-proves both. The merge carries no\nauthored content\
  \ of its own, so the guard judges the recorded commit and the rule-3\nauthored-content\
  \ arm skips the recorded merge; arms 1-2, the split and every other refusal are\n\
  unchanged, and a non-descendant subject is still refused. `audit decide` refuses\
  \ UP FRONT\n(`evidence-unreachable`, after every other write-time refusal so none\
  \ changes its kind) a post\n`fix` evidence that is neither a recorded commit of\
  \ the card (`commit_landed`) nor a recorded sync\nmerge — no pass could be audited\
  \ at it.\nA DECISION PER RESIDUAL, NOT PER KEY (amended, <project> X-1489). «Every\
  \ residual carries a\ndecision» is counted over DISTINCT RESIDUALS: a residual set\
  \ in which ONE key stands for MORE THAN\nONE finding of the ceiling row is COLLAPSED\
  \ and is refused `residual-undecided` (cause\n`residual_keys_collapsed`, naming\
  \ each such key and how many findings it carries) — a decision binds\nto a key,\
  \ so a decision per key over a collapsed set would let one recorded decision discharge\
  \ N\nfindings the Controller never read as separate. Same kind, a THIRD cause of\
  \ the same fact (this pass\ncannot prove every residual is decided); the ladder\
  \ stays closed at three kinds. How such a row READS after is rule 9(b)'s.\nDONE-BUT-UNLANDED\n\
  cards (`--reaudit-after-close`): the subject is HEAD of the branch by that route's\
  \ own contract, for an\nall-`accept`/`defer` set too — the decisions bind to the\
  \ ceiling row, the pass audits HEAD (rule 4\ngoverns; «the ceiling row's own `subject_revision`»\
  \ is the ORDINARY-route reading). A MIXED set\n(`fix` + `accept`/`defer`) is admitted\
  \ and audited at the evidence revision — the `accept`/`defer`\ndecisions stay bound\
  \ to their (`ceiling_ref`, fingerprint) and a recurrence of that fingerprint there\
  \ is\nmatched to the decision (`overruled_by_decision`), never re-raised. AUDIT-PRE:\
  \ `subject_revision` and\n`evidence_revision` are PLAN fingerprints (SPEC-0036's\
  \ recorded `plan_fingerprint`); a `fix` at pre is an\n`implementation_plan` edit\
  \ and admission requires the CURRENT plan fingerprint to EQUAL the named\nevidence\
  \ revision — the descendant clause is post-only. **AN ALL-`accept`/`defer` SET AT\
  \ AUDIT-PRE IS\nPLAN-FINGERPRINT-AGNOSTIC.** Such a set names no\nrevision of its\
  \ own — no `fix`, so no `evidence_revision` — and the residual it decides stands\
  \ whatever\nthe plan text now says; so when the plan was edited AFTER the ceiling\
  \ pass, the pass is admitted at\nthe CURRENT plan fingerprint (and names it), and\
  \ anything the edit introduced counts NEW at its own\nseverity. BOUNDED: task audit-pre\
  \ only\n(plan gates and audit-post unchanged), a NON-EMPTY decision set only, and\
  \ ANY `fix` — alone or mixed —\nkeeps the current-plan-fingerprint EQUALITY above\
  \ verbatim. Nothing is re-recorded or edited (rule 4).\n**THE SUBJECT PIN IS CHECKED\
  \ BY ANCESTRY AT\nAUDIT-POST:** the subject is the named revision **or any STRICT\
  \ DESCENDANT of\nit**, because the descendant CONTAINS the evidence the decisions\
  \ name and anything authored on top is\nput before the auditor as THIS pass's own\
  \ diff and counts NEW at its own severity — so auditing a\ndescendant is never less\
  \ safe than auditing the named revision. This is what lets a binding survive\nthe\
  \ commits the LIFECYCLE ITSELF mandates after the decisions were recorded: the merge-fallout\
  \ round and the `task commit --fix-red --card-repair` custody move\n. A NON-descendant\
  \ is still refused `subject_not_named_revision`, fail-closed on any ancestry\ngit\
  \ cannot answer; at AUDIT-PRE the subject is a plan fingerprint with no ancestry,\
  \ so equality is\nkept verbatim.\nThe pass is\nexactly ONE beyond the ceiling; the\
  \ auditor receives the ceiling row's findings with their decisions\nrendered beside\
  \ them and is asked to VERIFY `fix` residuals against the evidence revision, to\
  \ treat\n`accept` residuals as authority-accepted (recorded, not re-argued — `accept`\
  \ is TERMINAL for that\nfinding), and to treat `defer` residuals as out of this\
  \ subject (their receiving card is named). ECHO MATCHING: the packet prints every\
  \ residual WITH its fingerprint AND the fields its record carries, and the auditor\
  \ MUST put\n`echo_of: <fingerprint>` on each finding that re-raises one; the engine\
  \ VERIFIES the reference (it must\nbe a fingerprint of the ceiling row — otherwise\
  \ the field is dropped). A finding without a valid\n`echo_of` whose ENGINE-recomputed\
  \ rule-1 key EQUALS a residual's key is that residual's echo, bound on\nthe same\
  \ arms and recorded with `echo_of` set to that key — rule 1's own identity, since\
  \ only reworded\n`what`/`where` prose lies outside the key; the key is recomputed\
  \ from\nthe structured fields, never read from a carried `finding_fingerprint`.\
  \ Any other finding is new and\nfingerprinted: a differing criterion, `locator`\
  \ or `failing_input` is a different key and stays NEW.\nNeither the revision-free\
  \ key nor a coarser\n{criterion|class, file} key can match alone on real auditor\
  \ output; identity stays the engine fingerprint and text\nsimilarity stays forbidden.\
  \ **A SUSPECTED ECHO IS REPORTED, NEVER MATCHED.** The closed matrix binds a decision\
  \ only by its exact fingerprint, so an auditor that\nre-describes a decided residual\
  \ (the same criterion, a drifted `locator` or `failing_input`) raises it\nNEW and\
  \ it drives a fresh RED. To make that visible without matching on the coarser key\
  \ this rule\nforbids: on a TASK audit-pre/post whose RECORDED verdict is RED, every\
  \ finding that carries no decided\nfingerprint and no decided `echo_of`, and whose\
  \ rule-1 criterion key (the upper-cased `AC<n>` token of\n`criterion_ref`) equals\
  \ that of a finding a `ceiling_decision` decided on the SAME (task, stage), is\n\
  NAMED in the saved record's `notes` and on stderr, beside the prior decision (its\
  \ fingerprint,\ndisposition, `ceiling_ref` and receiving card). The note is REPORT-ONLY.\
  \ It binds, overrules and drops\nnothing, and it changes no verdict, `passes`, row\
  \ or finding. The Controller judges whether it is the\nsame defect (an ordinary\
  \ `audit decide` on the new fingerprint) or a new one. A class_id-only key never\n\
  matches, because a class spans many defects. Any read failure yields no note.\n\
  The result is computed by the ENGINE from the auditor's response under a CLOSED\
  \ matrix: a residual decided\n`accept` or `defer` that the auditor re-argues is\
  \ NOT a finding — recorded `overruled_by_decision`, never a\nverdict driver (an\
  \ all-`accept`/`defer` set with nothing new is GREEN with no code change); a `fix`\
  \ residual\nechoed as still open → RED; a NEW finding (a fingerprint not on the\
  \ ceiling row) is judged by its SEVERITY\n(amended): **a NEW finding of severity\
  \ `medium` or `low` is ABSORBED\nlike a YELLOW, not terminal** — when NO `fix` residual\
  \ is echoed open AND the new set is NON-EMPTY AND\nEVERY new finding's severity\
  \ is in the closed set {medium, low} (an absent or unknown severity is NOT in\n\
  it — fail-closed), the engine folds a RED to YELLOW and records the pass YELLOW-ABSORBABLE;\
  \ the card then\ntakes the EXISTING absorption exactly as below the ceiling (LIFECYCLE\
  \ §Stage 4 / §Stage 8): mode-a — the\nfix + `task commit --absorb` (admitted past\
  \ the ceiling ONLY on that absorbable record; `work commit` on\na done-but-unlanded\
  \ card) + ONE bounded re-audit `audit pre|post` (no flag) under the SAME `ceiling_ref`,\n\
  recorded `basis: on-decisions-absorption` and journaled at the grant moment\n(`audit_absorption_reaudit_granted`)\
  \ — or mode-b / a filed followup. The absorption re-audit is admitted\nEXACTLY ONCE\
  \ per ceiling row, DERIVED from the rows (a `basis: on-decisions-absorption` row\
  \ naming that\n`ceiling_ref` spends it — no counter): on it the absorbable arm is\
  \ OFF, so a SECOND new finding there\ncounts at its own severity and a RED there\
  \ is TERMINAL exactly as a rule-3 RED is. A NEW `high` finding on\nthe rule-3 pass\
  \ → RED (terminal, unchanged); the ceiling counting of SPEC-0124 is unchanged (the\
  \ absorption\nre-audit is the mode-a pass the ceiling already counts, `passes` =\
  \ ceiling + 2).\nThe verdict is recorded on `external_audit_completed` with `basis:\
  \ on-decisions` (or\n`on-decisions-absorption` on the absorption re-audit), `ceiling_ref`,\
  \ `decisions_applied`,\n`overruled_by_decision`, `new_findings` — the NEW findings\
  \ by identity, each `{finding_fingerprint,\nseverity, absorbable}` (no longer a\
  \ bare count) — and the saved YAML projects `basis`, `ceiling_ref`,\n`new_findings`,\
  \ `absorbable`. GREEN / YELLOW-absorbed → the ordinary\nStage-9 / land path. **RED\
  \ → TERMINAL for this (task, stage)** — a rule-3 RED, or an absorption\nre-audit\
  \ RED, or (task audit-post) a RED on the ONE post-GREEN merge-integration pass\n\
  (SPEC-0124 §Ledger-skip axes — which also admits no `--on-decisions` pass and no\
  \ decision\nafter it on any verdict): no further\npass is ever admitted at that\
  \ stage for that card — the ONLY exits are the EXISTING owner terminal\ndispositions,\
  \ cited to a directive: `task update --status parked|wont-do` for a card that is\
  \ not yet\ndone; `worktree park` (discard the branch; the card stays `ready` on\
  \ main — QUEUE §Prematurely-\nclosed-unlanded) for a done-but-unlanded card; or\
  \ a NEW card. RED audit status is DISTINCT from land\neligibility: `land` keeps\
  \ its SPEC-0077 audit-currency gate unchanged and reads nothing here.\n\n**THE ADMISSION\
  \ PRECONDITION ON A TERMINAL-BEARING PASS.** A terminal-bearing pass — the\nrule-3\
  \ `--on-decisions` pass, or the ONE bounded absorption re-audit, and ONLY those\
  \ — is NOT\nADMITTED while the engine's OWN Stage-6 ledger PROVABLY DOES NOT COVER\
  \ the commit it would audit.\nThe refusal emits `read_gate_refused` kind `stage6-evidence-stale`,\
  \ invokes no auditor, records no\nverdict and spends no pass; the session closes\
  \ the gap with the one command it names\n(`task test --run` at that head), re-enters\
  \ the stage and re-runs the same pass at no cost.\n(a) THE ONE DECIDING INPUT is\
  \ the ledger — this task's `tests_passed` rows (`ts`) and its\n`commit_landed` rows\
  \ (`ts`, `commit`) — and NO finding field is read, because at the moment of\ndecision\
  \ NO FINDING EXISTS: the decision precedes the auditor. Coverage holds on EITHER\
  \ disjunct —\n(A) a `tests_passed` row POSTDATING the audited commit's own `commit_landed`\
  \ row (the corrective\nrun the refusal prescribes, which is what makes a refused\
  \ pass admissible again), or (B) the\naudited commit is the FIRST `commit_landed`\
  \ at-or-after the LATEST `tests_passed` preceding it\n(the ordinary Stage-6-then-Stage-7\
  \ flow). Commit identity is RESOLVED, never string-compared.\n(b) FAIL-OPEN on every\
  \ unprovable shape (no run recorded, no land naming the subject, an\nunresolvable\
  \ sha, an unparseable `ts`): the pass is admitted exactly as before, so the engine\
  \ can\nnever refuse a pass it has not earned the right to refuse.\n(c) TERMINALITY\
  \ ITSELF IS UNCHANGED. Nothing that reaches a verdict is spared — a substantive\
  \ RED\nterminalizes exactly as it does today, which is what keeps CHARTER §Principle\
  \ 7's\nre-run-vs-resolve fork intact. Only the ORDER changes: supply the proof the\
  \ lifecycle already\nrequires, then take the pass. An ordinary pass-1/pass-2 audit\
  \ and an audit-currency check are\nnever refused by this axis (neither is terminal-bearing),\
  \ and an ALREADY-terminal stage keeps\nsaying TERMINAL — this precondition is read\
  \ AFTER rule 4's terminal refusal, never instead of it.\n(d) THE HONEST LIMIT: this\
  \ closes the class where the gap is ENGINE-PROVABLE BEFORE the pass. A\nresidual\
  \ asserting missing proof of some OTHER kind — one the engine cannot itself compute\
  \ — can\nstill reach a verdict and still terminalize.\nDecisions from `main`'s journal\
  \ are visible to an audit running in the card's worktree through the\nEXISTING SPEC-0168\
  \ folded corpus (`_folded_journal_events`: worktree journal ∪ main journal); the\
  \ packet ADMITS a folded row by type CLASS (SPEC-0168 rule 2),\nso `ceiling_decision`\
  \ is REGISTERED as a task-subject evidence class in that reader and the\n`--on-decisions`\
  \ admission reads the same corpus — no new transport, one explicit registration.\n\
  \n### 4. Custody — a decision binds to its ceiling row and is SPENT by the pass\n\
  A `ceiling_decision` binds to ONE `ceiling_ref` + fingerprint (computed at the ceiling\
  \ row's\n`subject_revision`) and STAYS bound there while a `fix`'s new revision\
  \ is audited — the new revision is\nexactly what the decision names, so it never\
  \ invalidates the decision that admits the pass. The\n`--on-decisions` pass consumes\
  \ the decisions: a later RED\nat the same stage is a NEW ceiling row (new fingerprints,\
  \ no inherited decisions) — and by rule 3 it\nis terminal, so it is reached only\
  \ through the one admitted pass — and only once the rule-3 ADMISSION PRECONDITION\
  \ above is met, since a pass the engine refuses to spend on a stale-evidence subject\
  \ consumes no decision. A `fix` never makes any revision\nother than its named `evidence_revision`\
  \ auditable; `accept` never carries across revisions at\naudit-POST — at audit-PRE\
  \ an all-`accept`/`defer` set is plan-fingerprint-agnostic (rule 3),\nso a plan\
  \ edited after the ceiling pass is answered at ADMISSION, never by a re-recorded\
  \ decision. Done-but-\nunlanded cards take rules 2-3 under `--reaudit-after-close`\
  \ exactly as the rework-in-place route does\ntoday (QUEUE §Prematurely-closed-unlanded);\
  \ the subject is HEAD of the branch, by that route's own\ncontract.\n**APPEND-ONLY\
  \ HOLDS, AND RULE 3's ANCESTRY CLAUSE IS WHY IT COSTS NOTHING.** The continued\n\
  validity of a decision across the commits the lifecycle mandates after it is DERIVED\
  \ at ADMISSION, by\nancestry (rule 3) — NEVER by re-recording the decision. A recorded\
  \ `ceiling_decision` is never edited,\nre-issued or superseded to track a moved\
  \ subject, by the Controller or by anyone else; the row stays\nexactly as written\
  \ and the admission asks git whether the CURRENT subject CONTAINS the revision that\n\
  row names.\n\n### 5. No-answer\nAn auditor response with no payload (timeout, transport\
  \ failure, empty stdout) on the `--on-decisions`\npass is the EXISTING no-outcome\
  \ class (SPEC-0036 `is_no_data_verdict`): ABORT/environmental, never\nGREEN, never\
  \ a spent pass, the decisions untouched. ONE attempt per trigger; a retry is an\
  \ explicit\nController re-invocation of the same verb, never automatic.\n\n### 6.\
  \ Retirements (CHARTER §P1 F3 — a POSITIVE list; nothing outside it changes)\nThe\
  \ retired list and its refusals are homed in SPEC-0036 §Audit-loop ceiling. `audit\
  \ consult\n--on-demand` (the BELOW-ceiling technical-fork pick, SPEC-0124) is not\
  \ on the list and is unchanged. Retired flags survive only as refusal\nshims (print\
  \ the pointer, exit nonzero) until this contract's plan is `realized`, then are\
  \ deleted.\nALSO RETIRED, on the PLAN-GATE axis (rule 9): the plan-gate ceiling-adjudication\
  \ consult and with it\nevery episode a plan gate could open — so the `malformed-exhausted`\
  \ episode terminal is UNREACHABLE\nfor a plan gate, asserted by a `graph conformance`\
  \ probe that reads the SAME retirement carrier the\nrefusal shim reads; the plan-gate\
  \ `--owner-reset` continuation on the FSM-advancing gate verb, whose\nbasis WAS\
  \ that consult (its consult-governed carry is DELETED, not shimmed — a verdict path\
  \ that can\nnever be admitted again is worse dead than live); and the dispatched-worker\
  \ AUTO-consult at a\nplan-gate ceiling, the plan-axis twin of the task auto-consult\
  \ already on this list. Each retired\nplan-gate surface REFUSES with a pointer to\
  \ the rule-9 route (no silent no-op), and the retired flag\nstays REGISTERED for\
  \ exactly that reason. SPEC-0124 §Plan-target parity's post-ceiling paragraphs and\n\
  SPEC-0083's gate policy point HERE for what happens at a plan-gate ceiling. <workshop-spec>\
  \ is SUPERSEDED by this spec\non activation; SPEC-0124's post-ceiling paragraphs\
  \ (ceiling-convergence triage, dispatched-worker\nauto-consult, owner-authorized\
  \ continuation) are replaced by a pointer here; SPEC-0191 §5 rung 2\n(«adversarial\
  \ consult») becomes «Controller typed decisions (this spec)»; SPEC-0036's overlay\
  \ table\ndrops the consult-governed short-circuit and its saved-result schema gains\
  \ `finding_fingerprint` +\n`basis: on-decisions`; SPEC-0161 gains the `ceiling_decision`\
  \ payload keys; SPEC-0103 §3's worker\nceiling route halts with the fingerprints\
  \ (no auto-consult). The dispatched Worker at the ceiling\ntherefore HALTS (`bg_dispatch_halted`,\
  \ the existing SPEC-0103 §3 escalation) naming its residual\nfingerprints; the Controller\
  \ decides; the worker resumes with `--on-decisions`.\nHOW THE WORKER HALTS — one\
  \ named verb, and it is not `blocked-on-land`.\nThe halt row and the worker's covering\
  \ verb, `task pause --reason audit-ceiling`, are homed in\nSPEC-0036 §Audit-loop\
  \ ceiling. It is the ONLY verb reachable in the PRE-COMMIT window: a Stage-4\nceiling\
  \ precedes every commit route, so the claim `worktree new --task` wrote is still\
  \ uncommitted, and\n`blocked-on-land` — which admits on a COMMITTED branch claim\
  \ — REFUSES there by design;\nits refusal names this verb for that window and reserves\
  \ `task refuse` for the genuinely unclaimed\ncard (SPEC-0133). The pause's self-commit\
  \ carries the claim onto the branch, after which\n`blocked-on-land` is admitted\
  \ should a separate out-of-scope escalation still be owed. The dispatch\npreamble\
  \ and `patterns/background-session-dispatch.md` state the same verb.\nAT A TERMINAL\
  \ RED THE HALT NAMES THE EXITS, NOT A DECISION.\nThe halt above is for REACHING\
  \ the ceiling. When the rule-3 pass, its one absorption re-audit or\nthe post-GREEN\
  \ merge-integration pass itself records RED, rule 4 has ended the stage and nothing\n\
  is left to decide — yet a halt row naming the exits is still needed. So the audit\
  \ verb, at that\nverdict and in a\ndispatched-worker context, emits ONE `bg_dispatch_halted`\
  \ in the EXISTING SPEC-0103 §3\nblocked-on-land shape, naming rule 3's terminal\
  \ exits and carrying NO residual fingerprints; an\ninteractive session gets the\
  \ same exits on stderr and no row. The Worker's verb is unchanged —\n`task pause\
  \ --reason audit-ceiling` — and on such a stage its default `next_action` and the\n\
  dispatch recovery hint both name those exits instead of `audit decide`, read through\
  \ the one\nrule-4 predicate. No halt kind, pause reason or payload key is added,\n\
  and rules 3-4 are unchanged: the exits remain the owner's dispositions, cited to\
  \ a directive.\n\n### 9. Plan-gate arm — the same route for a PLAN GATE at its ceiling\n\
  Its text, (a) to (h), is in the edge-case reference that the index paragraph at\
  \ the head of §Internal\nnames, under its heading `### Rule 9 — the plan-gate arm\
  \ (text)` (moved verbatim).\n\n### 7. Kept — the safety properties, and where each\
  \ now lives\nThe ceiling itself (SPEC-0124, 2 passes) — unchanged. No self-grant\
  \ past the ceiling — rule 2's writer\nauthority + the mandatory directive locator.\
  \ No silent loop — rule 3: one pass, then terminal on a TASK target; a PLAN gate\
  \ is decision-bounded, each round admitted only by fresh decisions (rule 9(f)) (amended\n\
  : a YELLOW-absorbable pass admits ONE further absorption re-audit, derived from\
  \ the rows and spent\nby its own record — still bounded, still no loop).\nAudited-commit\
  \ custody — rules 1 + 4: fingerprints and decisions are revision-bound; nothing\n\
  inherits. Record integrity — a verdict never reads GREEN with an undecided residual:\
  \ rule 3\nrefuses the pass before an auditor runs. Loud failure (SPEC-0165) — every\
  \ refusal axis in rules 2-3 is\na distinct `read_gate_refused` kind with a pinned\
  \ test.\n\n### 8. First-round delta discipline (below the ceiling)\nPass 1 of audit-pre/post\
  \ asks for the full survey; the auditor's completeness declaration is RECORDED,\n\
  never a gate. Every later pass — including the rule-3 pass — receives the DELTA\
  \ overlay in place of the\nwhole-subject survey directive: the prior pass's findings\
  \ with their fingerprints, «judge their closure\nand any regression the change introduced;\
  \ nothing else». The engine fingerprints the response and matches\nit (rule 1):\
  \ an echo → closed/open; a NEW finding the change INTRODUCED (`causality:\nintroduced-by-subject`)\
  \ → an ordinary finding at its severity; a NEW finding the auditor COULD have raised\n\
  on pass 1 (`pre-existing-in-subject`) → recorded `late_finding` and never a verdict\
  \ driver on its own —\nthe pass's verdict is computed from the non-late findings.\
  \ The engine DERIVES that classification when the\nauditor is SILENT and it can\
  \ decide the question itself: a NEW finding carrying NO `causality`, whose\n`locator`\
  \ RESOLVES (file, file:symbol or file:line-range) and whose located content is BYTE-IDENTICAL\n\
  between the pass-1 subject revision (the ceiling row's first `passes_trail` commit)\
  \ and the audited\nsubject, is recorded `late_finding` with `causality_derived:\
  \ unchanged-locator` — it was raisable on\npass 1 by construction. BOUND, both halves\
  \ fail-closed: an EXPLICIT `introduced-by-subject` is HONORED\neven on an unchanged\
  \ locator (the auditor may be naming an interaction with changed code — the\nderivation\
  \ fills silence, it never overrides a stated cause), and a locator that does not\
  \ resolve, whose\ncontent moved, or that carries an out-of-vocabulary value counts\
  \ at its severity exactly as before.\nHow a late finding is decided is homed in\
  \ SPEC-0036 §Audit-loop ceiling. Late findings per pass are\ncounted (a debt-view\
  \ line).\n\n## Parameters\n\nNone consumed. `AUDIT_PASS_CEILING` (2) stays homed\
  \ in SPEC-0124 / `bin/lib/audit.py` (stated in the\nSPEC-0036 §Audit-loop ceiling\
  \ core); the fingerprint\nversion prefix (`fp1:`) is a code constant beside the\
  \ hash, bumped on any change to the canonical\ntuple (a bump invalidates nothing\
  \ retroactively — an old-version fingerprint simply matches no current\nresidual,\
  \ so it can never be decided).\n\n## Rationale\n\nThe contract satisfies three constraints:\
  \ an immutable decision record bound to task + stage +\nrevision + ceiling row +\
  \ fingerprint; typed dispositions with `accept` terminal and a post-decision\nRED\
  \ needing an explicit terminal owner disposition; a directive locator on every decision\
  \ and the\njournal as the single store. Prior-art it EXTENDS rather than re-invents:\
  \ SPEC-0036's per-finding\nfields (the fingerprint inputs already exist); no-worktree\
  \ journal append; SPEC-0168's\ncross-instance fold; the existing `task update --status`\
  \ / `worktree park` terminals.\n\n### History moved out of the rule body\n\nThe\
  \ passages below stood in the rule text and were moved here verbatim; the rule they\n\
  sat in is unchanged.\n\n- **1. The residual list IS the last RED's findings — fingerprinted\
  \ by the engine:** (`green`\n  joined the set when admitted RED/YELLOW/GREEN as\
  \ severity words)\n\n- **1. The residual list IS the last RED's findings — fingerprinted\
  \ by the engine:**\n  (`read_gate_refused` kind `finding-locator-unresolvable` and\
  \ its `findings_all` key are RETIRED:\n  nothing is refused, and a refusal row on\
  \ a recorded verdict would misreport it to every later\n  reader)\n\n- **1. The\
  \ residual list IS the last RED's findings — fingerprinted by the engine:** (the\
  \ same\n  fingerprinted projection, so a YELLOW pass is journaled like a RED; residual\
  \ identity is unchanged,\n  since a YELLOW ceiling row resolved the same findings\
  \ from its saved record before)\n\n- **2. `ceiling_decision` — one append-only journal\
