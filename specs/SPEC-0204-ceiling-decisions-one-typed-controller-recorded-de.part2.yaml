  \ receiving CARD, append-only uniqueness) applies unchanged.\n\n### 7. Kept — the\
  \ safety properties, and where each now lives\nThe ceiling itself (SPEC-0124, 2\
  \ passes) — unchanged. No self-grant past the ceiling — rule 2's writer\nauthority\
  \ + the mandatory directive locator. No silent loop — rule 3: one pass, then terminal\
  \ on a TASK target; a PLAN gate is decision-bounded, each round admitted only by\
  \ fresh decisions (rule 9(f)) (amended\n: a YELLOW-absorbable pass admits ONE further\
  \ absorption re-audit, derived from the rows and spent\nby its own record — still\
  \ bounded, still no loop).\nAudited-commit custody — rules 1 + 4: fingerprints and\
  \ decisions are revision-bound; nothing\ninherits. Record integrity — a verdict\
  \ never reads GREEN with an undecided residual: rule 3\nrefuses the pass before\
  \ an auditor runs. Loud failure (SPEC-0165) — every refusal axis in rules 2-3 is\n\
  a distinct `read_gate_refused` kind with a pinned test.\n\n### 8. First-round delta\
  \ discipline (below the ceiling)\nPass 1 of audit-pre/post asks for the full survey;\
  \ the auditor's completeness declaration is RECORDED,\nnever a gate. Every later\
  \ pass — including the rule-3 pass — receives the DELTA overlay in place of the\n\
  whole-subject survey directive: the prior pass's findings with their fingerprints,\
  \ «judge their closure\nand any regression the change introduced; nothing else».\
  \ The engine fingerprints the response and matches\nit (rule 1): an echo → closed/open;\
  \ a NEW finding the change INTRODUCED (`causality:\nintroduced-by-subject`) → an\
  \ ordinary finding at its severity; a NEW finding the auditor COULD have raised\n\
  on pass 1 (`pre-existing-in-subject`) → recorded `late_finding` and never a verdict\
  \ driver on its own —\nthe pass's verdict is computed from the non-late findings.\
  \ The engine DERIVES that classification when the\nauditor is SILENT and it can\
  \ decide the question itself: a NEW finding carrying NO `causality`, whose\n`locator`\
  \ RESOLVES (file, file:symbol or file:line-range) and whose located content is BYTE-IDENTICAL\n\
  between the pass-1 subject revision (the ceiling row's first `passes_trail` commit)\
  \ and the audited\nsubject, is recorded `late_finding` with `causality_derived:\
  \ unchanged-locator` — it was raisable on\npass 1 by construction. BOUND, both halves\
  \ fail-closed: an EXPLICIT `introduced-by-subject` is HONORED\neven on an unchanged\
  \ locator (the auditor may be naming an interaction with changed code — the\nderivation\
  \ fills silence, it never overrides a stated cause), and a locator that does not\
  \ resolve, whose\ncontent moved, or that carries an out-of-vocabulary value counts\
  \ at its severity exactly as before.\nEach late finding still needs a typed decision\n\
  (rule 2 admits it at any pass) before Closure; a `fix` of a late finding is verified\
  \ only on the ONE\nrule-3 pass (no additional audit exists); a late finding recorded\
  \ ON the rule-3 pass admits `accept` or\n`defer` only. Late findings per pass are\
  \ counted (a debt-view line). Reuse: the round-aware overlay and the\nround-0-only\
  \ survey directive of the <workshop-spec> engine move below the ceiling; no new\
  \ mechanism.\n\n## Parameters\n\nNone consumed. `AUDIT_PASS_CEILING` (2) stays homed\
  \ in SPEC-0124 / `bin/lib/audit.py`; the fingerprint\nversion prefix (`fp1:`) is\
  \ a code constant beside the hash, bumped on any change to the canonical\ntuple\
  \ (a bump invalidates nothing retroactively — an old-version fingerprint simply\
  \ matches no current\nresidual, so it can never be decided).\n\n## Rationale\n\n\
  The contract satisfies three constraints: an immutable decision record bound to\
  \ task + stage +\nrevision + ceiling row + fingerprint; typed dispositions with\
  \ `accept` terminal and a post-decision\nRED needing an explicit terminal owner\
  \ disposition; a directive locator on every decision and the\njournal as the single\
  \ store. Prior-art it EXTENDS rather than re-invents: SPEC-0036's per-finding\n\
  fields (the fingerprint inputs already exist); no-worktree journal append; SPEC-0168's\n\
  cross-instance fold; the existing `task update --status` / `worktree park` terminals.\n\
  \n## Verification\n\nProbe CONTRACTS (RED-GREEN — each names its differential failing\
