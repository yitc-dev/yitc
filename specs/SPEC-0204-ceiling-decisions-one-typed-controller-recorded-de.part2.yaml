body: "### 3. The one bounded re-audit — `audit pre|post --on-decisions`\nAdmitted\
  \ iff EVERY residual of the ceiling row has a `ceiling_decision` bound to that `ceiling_ref`\n\
  AND the subject being audited is the ONE revision the decisions collectively name:\
  \ the ceiling row's\nown `subject_revision` when no decision is `fix`, else the\
  \ single `evidence_revision` every `fix`\ndecision names (all `fix` decisions on\
  \ one ceiling row MUST name the same revision, which for\naudit-post MUST be a descendant\
  \ of the audited commit — or, at audit-POST, a NESTED chain of\nrevisions, named\
  \ by its unique newest one, below). Any other subject → refused (`decisions-not-\n\
  for-this-revision`); any undecided residual → refused (`residual-undecided`), naming\
  \ it.\nNESTED `fix` REVISIONS NAME THEIR UNIQUE NEWEST ONE (ADDITIVE; measured on\n\
  2026-09-29, deviation `ceiling-decide-refuses-nested-fix-revisions`; route check\n\
  decisions/nested-fix-consult-audit-adhoc.yaml). A `fix` recorded after a later re-audit\
  \ of the same\ncard names a NEWER revision than an earlier `fix` on the same row,\
  \ and rule 4 forbids re-pointing\nthe earlier one — so equality alone left such\
  \ a card with no admissible route. At AUDIT-POST, when\nthe `fix` decisions name\
  \ more than one revision, the ONE revision they collectively name is their\nUNIQUE\
  \ MAXIMAL revision E: the named revision every other named revision is a STRICT\
  \ ANCESTOR of,\nDERIVED by commit ancestry at admission (no stored field — the decisions\
  \ stay exactly as written).\nThe set is admitted only when (a) every named revision\
  \ resolves to a commit, (b) every named\nrevision is an ancestor of or equal to\
  \ E, (c) every named revision is itself a valid `fix` evidence\n(a STRICT DESCENDANT\
  \ of the ceiling row's subject, rule 2), and (d) the current subject CONTAINS E\n\
  (the containment clause below). The ONE bounded pass is then audited at E, which\
  \ carries every\nearlier fix. DIVERGENT revisions (siblings, an unrelated branch),\
  \ a revision that does not\nresolve, an object that is not a commit, or an ancestry\
  \ git cannot answer leave no E and are still\nrefused `evidence-revision-split`\
  \ — and `audit decide` refuses the row that would make them, BEFORE\nany append\
  \ (the writer runs this ladder, rule 2). AUDIT-PRE is unchanged: plan fingerprints\
  \ have no\nancestry, so two distinct ones still refuse. An earlier pass's GREEN\
  \ covers ITS subject only and\nnever stands in for the pass at E; any subject change\
  \ after that pass stays under SPEC-0077 §3a.\nEqual revisions are unchanged. The\
  \ in-land §3a re-audit reads the same ladder, so it admits such a\nset on the same\
  \ terms.\nA `worktree sync` MERGE IS AN ADMISSIBLE AUDIT-POST SUBJECT (ADDITIVE;\
  \ measured on\n2026-09-29, deviation events.jsonl#ts=). When the ONE revision the\
  \ `fix`\ndecisions name is a merge `worktree sync` recorded on the card's branch\
  \ (its `worktree_synced` row's\n`head_after`) and it STRICTLY descends from the\
  \ recorded commit, the `--on-decisions` pass is audited\nAT that merge: the packet\
  \ grades the cumulative `merge-base(merge, main)..merge` range (ship +\nmerge),\
  \ the record pins `commit:` to the merge and names the recorded commit as `sync_merge_ship`,\n\
  and `task close` moves custody onto the merge only when git re-proves both. The\
  \ merge carries no\nauthored content of its own, so the guard judges the recorded\
  \ commit and the rule-3\nauthored-content arm skips the recorded merge; arms 1-2,\
  \ the split and every other refusal are\nunchanged, and a non-descendant subject\
  \ is still refused. `audit decide` refuses UP FRONT\n(`evidence-unreachable`, after\
  \ every other write-time refusal so none changes its kind) a post\n`fix` evidence\
  \ that is neither a recorded commit of the card (`commit_landed`) nor a recorded\
  \ sync\nmerge — no pass could be audited at it.\nA DECISION PER RESIDUAL, NOT PER\
  \ KEY (amended, <project> X-1489). «Every residual carries a\ndecision» is counted\
  \ over DISTINCT RESIDUALS: a residual set in which ONE key stands for MORE THAN\n\
  ONE finding of the ceiling row is COLLAPSED and is refused `residual-undecided`\
  \ (cause\n`residual_keys_collapsed`, naming each such key and how many findings\
  \ it carries) — a decision binds\nto a key, so a decision per key over a collapsed\
  \ set would let one recorded decision discharge N\nfindings the Controller never\
  \ read as separate. Same kind, a THIRD cause of the same fact (this pass\ncannot\
  \ prove every residual is decided); the ladder stays closed at three kinds. How\
  \ such a row READS after is rule 9(b)'s.\nTHE EMPTY RESIDUAL SET IS ADMITTED BY\
  \ ARM 1'S OWN CONTAINMENT CLAUSE, AND WHAT THIS CARD ADDS IS THE\nSUBJECT (amended,\
  \ measured on 2026-09-12; the containment clause itself is,\njust above). At AUDIT-POST,\
  \ over a residual set that is EMPTY *and* RESOLVED with no `fix`\ndecision, «the\
  \ ceiling row's own `subject_revision`» is not the ONLY admissible subject: `revisions`\n\
  is empty, the named revision falls back to that subject, the ancestry arm is silent\
  \ by construction,\nand a current subject that STRICTLY DESCENDS from it is therefore\
  \ admitted by the SAME containment\nclause every other post-stage subject rides.\
  \ THIS IS NOT A SECOND ARM — writing it as one would\ncontradict this rule's own\
  \ closed-at-three refusal ladder. Without the admission the empty set would\nbe\
  \ a DEAD END rather than a bound: a card whose absorption loop CONVERGED (a GREEN\
  \ ceiling row) and\nwhich then has a further IN-SCOPE ship could neither re-audit\
  \ nor close, whatever it did. The\nemptiness IS the «loop ended» proof and needs\
  \ no separate test: a RED or ABORT row carrying no\nfindings is UNRESOLVABLE, not\
  \ empty, so it is still refused `residual-undecided` upstream — a card\nstill absorbing\
  \ never reaches it. Descent stays REQUIRED, STRICT and fail-closed (an unanswerable\
  \ OR\nRAISING ancestry reader refuses), and nothing else moves: still the ONE bounded\
  \ pass, it still\ncounts, a second `--on-decisions` is still terminal, RED is still\
  \ terminal, and the writer authority\nfor a `ceiling_decision` is untouched.\nTWO\
  \ THINGS THIS CARD ADDS, both about WHICH REVISION. (a) THE SUBJECT IS RESOLVED\
  \ FROM THE CEILING\nROW ITSELF WHEN THE DECISION SET IS EMPTY: rule 2's `subject_revision`\
  \ read-back is the ordinary\nsource, but over an empty residual set there are no\
  \ decisions BY CONSTRUCTION, so the read yields\nnothing, the ancestry question\
  \ is asked against an unresolvable subject and fails closed — i.e. the\nadmission\
  \ above would be unreachable THROUGH THE VERB. On an EMPTY decision set only, the\
  \ ceiling\nROW's own `commit` is the source (exactly what `audit decide` would have\
  \ written as\n`subject_revision` had there been anything to decide, so the two agree\
  \ by construction). A\nNON-empty set keeps rule 2's read-back verbatim, including\
  \ its deliberate refusal when the set does\nnot agree on one value; the row's short\
  \ `commit` is resolved full before any comparison, and descent\nstays STRICT, so\
  \ the audited commit re-offered as the current subject is still refused. (b) THE\n\
  REVISION THE ADMISSION NAMES is the CURRENT subject, not the already-audited one\
  \ — over that same\nempty shape the fallback would otherwise report the ceiling\
  \ row's commit, so the admission line and\nthe projection would name a revision\
  \ the pass is not about. This is REPORTING only: the audited\nsubject is unchanged.\n\
  The SIBLING half of the same claim — so a converged card can also CLOSE at its landed\
  \ ship — is the\nship-custody re-pin's ceiling exemption, homed in SPEC-0124 §Ledger-skip\
  \ axes, not here. DONE-BUT-UNLANDED\ncards (`--reaudit-after-close`): the subject\
  \ is HEAD of the branch by that route's own contract, for an\nall-`accept`/`defer`\
  \ set too — the decisions bind to the ceiling row, the pass audits HEAD (rule 4\n\
  governs; «the ceiling row's own `subject_revision`» is the ORDINARY-route reading).\
  \ A MIXED set\n(`fix` + `accept`/`defer`) is admitted and audited at the evidence\
  \ revision — the `accept`/`defer`\ndecisions stay bound to their (`ceiling_ref`,\
  \ fingerprint) and a recurrence of that fingerprint there is\nmatched to the decision\
  \ (`overruled_by_decision`), never re-raised. AUDIT-PRE: `subject_revision` and\n\
  `evidence_revision` are PLAN fingerprints (SPEC-0036's recorded `plan_fingerprint`);\
  \ a `fix` at pre is an\n`implementation_plan` edit and admission requires the CURRENT\
  \ plan fingerprint to EQUAL the named\nevidence revision — the descendant clause\
  \ is post-only. **AN ALL-`accept`/`defer` SET AT AUDIT-PRE IS\nPLAN-FINGERPRINT-AGNOSTIC\
  \ (ADDITIVE).** Such a set names no\nrevision of its own — no `fix`, so no `evidence_revision`\
  \ — and the residual it decides stands whatever\nthe plan text now says; so when\
  \ the plan was edited AFTER the ceiling pass, the pass is admitted at\nthe CURRENT\
  \ plan fingerprint (and names it), and anything the edit introduced counts NEW at\
  \ its own\nseverity. BOUNDED: task audit-pre only\n(plan gates and audit-post unchanged),\
  \ a NON-EMPTY decision set only, and ANY `fix` — alone or mixed —\nkeeps the current-plan-fingerprint\
  \ EQUALITY above verbatim. Nothing is re-recorded or edited (rule 4).\n**THE EMPTY\
  \ RESIDUAL SET AT AUDIT-PRE ADMITS AN AMENDED PLAN ONCE (ADDITIVE; measured on\n\
  <project> 2026-10-02, X-1849/X-1850).** The pre mirror of the post-side admission:\
  \ a\nGREEN pre ceiling row has no residual, so no decision can be recorded, and\
  \ a plan fingerprint has no\nancestry to ride — so a plan amended after that row\
  \ was a dead end. Over an EMPTY *and* RESOLVED\nresidual set with NO decision, the\
  \ subject is resolved from the ceiling ROW's own `plan_fingerprint`\n(the pre sibling\
  \ of (a) above), and the pass is ADMITTED at the CURRENT plan fingerprint (and names\n\
  it) when the two DIFFER; when they are EQUAL the plan is unchanged, there is nothing\
  \ new to judge,\nand the pass is REFUSED `decisions-not-for-this-revision` (`plan_unchanged_since_ceiling`)\
  \ — no free\npass. An unknown fingerprint on either side refuses as before. BOUNDED:\
  \ task audit-pre only (plan\ngates and audit-post unchanged), still the ONE bounded\
  \ pass — it writes the next ceiling row, so a\nre-run at that same plan meets the\
  \ equal-fingerprint refusal — and anything the amendment introduced\ncounts NEW\
  \ at its own severity.\n**THE SUBJECT PIN IS CHECKED BY ANCESTRY AT\nAUDIT-POST\
  \ (ADDITIVE):** the subject is the named revision **or any STRICT DESCENDANT of\n\
  it**, because the descendant CONTAINS the evidence the decisions name and anything\
  \ authored on top is\nput before the auditor as THIS pass's own diff and counts\
  \ NEW at its own severity — so auditing a\ndescendant is never less safe than auditing\
  \ the named revision. This is what lets a binding survive\nthe commits the LIFECYCLE\
  \ ITSELF mandates after the decisions were recorded: the merge-fallout round and\
  \ the `task commit --fix-red --card-repair` custody move\n. A NON-descendant is\
  \ still refused `subject_not_named_revision`, fail-closed on any ancestry\ngit cannot\
  \ answer; at AUDIT-PRE the subject is a plan fingerprint with no ancestry, so equality\
  \ is\nkept verbatim.\n**THE CEILING ROW'S OWN SUBJECT MAY BE A `--card-repair` COMMIT,\
  \ AND THAT SUBJECT IS ADMITTED\n(ADDITIVE).** When the pass that REACHED the ceiling\n\
  audited a `task commit --fix-red --card-repair` commit — bookkeeping-only, admitted\
  \ at pass N by the\n card-repair door on proof the ship it rides on exists — and\
  \ RED-ed on a NON-card cause, the\nrow's `subject_revision` IS that repair and an\
  \ all-`accept`/`defer` set names it as this pass's\nsubject (arm 1 EQUALITY holds\
  \ by construction). The no-authored-content guard then judges\nthat subject through\
  \ the SAME card-repair admission it passed at pass N, and that admission's\nship-facing\
  \ conjuncts — (c) the prior RED's cause derives to the card record, (d) the covered\
  \ ship\ncarries authored content, (e) the repair reaches that ship along a transparent\
  \ first-parent chain —\nread the record the repair ANSWERED: whenever the LIVE `decisions/<tid>-audit-post.yaml`\
  \ is pinned\nto the subject itself (it is the pass ON the repair, carrying that\
  \ pass's cause), the conjuncts read\nthe superseded verdict the repair commit FOLDED\
  \ (`<sha>:decisions/<tid>-audit-post.yaml`, a\ngoverned record read from git — the\
  \ same trust boundary every other conjunct sits behind;\n`bin/lib/audit_packet.py#_folded_audit_post_record`).\
  \ The packet is UNCHANGED: `merge-base..sha`\nalready renders the ship the repair\
  \ rides on plus the repair, exactly what pass N saw. BOUNDED, so nothing else moves:\
  \ the guard is not widened — a\npause / park / closure record carries no `card_repair`\
  \ (or `absorption`) marker and folds no verdict,\nso it stays refused BY NAME at\
  \ conjunct (a); a live record pinned ELSEWHERE than the subject is read\nexactly\
  \ as before (the folded read is gated on that identity); still ONE bounded pass,\
  \ `passes` =\nceiling + 1, GREEN advances, RED is TERMINAL (rule 4), and the writer\
  \ authority is untouched.\n**A FINDING RECORDED ON A `basis: currency` ROW IS DECIDABLE,\
  \ WITHOUT BEING A RESIDUAL THIS PASS MUST\nHAVE DECIDED (ADDITIVE).** A currency\
  \ check is not one of the card's counted passes, so its\nfindings are neither residuals\
  \ of the ceiling row nor rule-8 late findings — and before this extension\nNO verb\
  \ could dispose of one. `audit decide` therefore admits such a fingerprint as a\
  \ THIRD named source, binding it at\nthe `ceiling_ref` derived from the COUNTED\
  \ ceiling row, and an `echo_of` naming a decided currency\nfinding is HONOURED (recorded\
  \ `overruled_by_decision`). The ADMISSION set is UNCHANGED — a currency\nfinding\
  \ is not something this pass must have decided, so no card admitted today starts\
  \ being refused.\nNothing here MATCHES CAUSES or forgives a re-raise automatically:\
  \ the authority records an explicit\ntyped decision, which is strictly more governance,\
  \ never the silent overrule this rule forbids. A\nCURRENCY ROW STATES NO PASS NUMBER\
  \ (it would otherwise tie the counted ceiling row on the counter\n`_ceiling_row_of`\
  \ ranks by), so a late finding sitting on one derives its `ceiling_ref` from that\n\
  ceiling row — the two sides agree BY CONSTRUCTION rather than by the coincidence\
  \ that the currency row\ncopied the number; with no ceiling row at all the ref stays\
  \ unresolved and the finding stays\nundecided, fail-closed. WHEN THE CEILING ROW\
  \ STATES NO COUNTER EITHER (ADDITIVE — a GREEN\ncounted row carries none), the pass\
  \ is named by the saved record's EXPLICIT counter — rule 2's\nsecond carrier of\
  \ the same number — on the WRITE side (`audit decide`) and the READ side (Closure's\n\
  late-finding gate and this rule's admission) alike, so the ref a decision is bound\
  \ at is the ref\nClosure requires. A record that states no counter names no pass:\
  \ with none on the row, the ceiling\nrow or the record, the write is refused and\
  \ the finding stays undecided, fail-closed. The pass is\nexactly ONE beyond the\
  \ ceiling; the auditor receives the ceiling row's findings with their decisions\n\
  rendered beside them and is asked to VERIFY `fix` residuals against the evidence\
  \ revision, to treat\n`accept` residuals as authority-accepted (recorded, not re-argued\
  \ — `accept` is TERMINAL for that\nfinding), and to treat `defer` residuals as out\
  \ of this subject (their receiving card is named). ECHO MATCHING: the packet prints\
  \ every residual WITH its fingerprint AND the fields its record carries, and the\
  \ auditor MUST put\n`echo_of: <fingerprint>` on each finding that re-raises one;\
  \ the engine VERIFIES the reference (it must\nbe a fingerprint of the ceiling row\
  \ — otherwise the field is dropped). A finding without a valid\n`echo_of` whose\
  \ ENGINE-recomputed rule-1 key EQUALS a residual's key is that residual's echo,\
  \ bound on\nthe same arms and recorded with `echo_of` set to that key — rule 1's\
  \ own identity, since only reworded\n`what`/`where` prose lies outside the key (CORRECTION\
  \ — <project> X-1571: the matrix had\nhonoured `echo_of` alone, contradicting rule\
  \ 1's «a match … is an ECHO»); the key is recomputed from\nthe structured fields,\
  \ never read from a carried `finding_fingerprint`. Any other finding is new and\n\
  fingerprinted: a differing criterion, `locator` or `failing_input` is a different\
  \ key and stays NEW.\nNeither the revision-free key nor a coarser\n{criterion|class,\
  \ file} key can match alone on real auditor output (trial cycle 1: re-descriptions\n\
  missed on three cards; distinct findings merged on two); identity stays the engine\
  \ fingerprint and text\nsimilarity stays forbidden. **A SUSPECTED ECHO IS REPORTED,\
  \ NEVER MATCHED (ADDITIVE — <project>\n / X-1549).** The closed matrix binds a decision\
  \ only by its exact fingerprint, so an auditor that\nre-describes a decided residual\
  \ (the same criterion, a drifted `locator` or `failing_input`) raises it\nNEW and\
  \ it drives a fresh RED. To make that visible without matching on the coarser key\
  \ this rule\nforbids: on a TASK audit-pre/post whose RECORDED verdict is RED, every\
  \ finding that carries no decided\nfingerprint and no decided `echo_of`, and whose\
  \ rule-1 criterion key (the upper-cased `AC<n>` token of\n`criterion_ref`) equals\
  \ that of a finding a `ceiling_decision` decided on the SAME (task, stage), is\n\
  NAMED in the saved record's `notes` and on stderr, beside the prior decision (its\
  \ fingerprint,\ndisposition, `ceiling_ref` and receiving card). The note is REPORT-ONLY.\
  \ It binds, overrules and drops\nnothing, and it changes no verdict, `passes`, row\
  \ or finding. The Controller judges whether it is the\nsame defect (an ordinary\
  \ `audit decide` on the new fingerprint) or a new one. A class_id-only key never\n\
  matches, because a class spans many defects. Any read failure yields no note\n(`bin/lib/audit.py#suspected_echo_findings`).\
  \ **THE REPORT ALSO CATCHES AN UNBOUND ECHO THE AUDITOR\nNAMED IN WORDS, AND IT\
  \ IS DURABLE (ADDITIVE — <project> X-1549, owner option A).** Binding\nstays STRICT:\
  \ only an exact rule-1 key or an engine-verified `echo_of` binds, never a resemblance.\n\
  What changes is that the failure of that contract is LOUD. Beside the criterion\
  \ key, the same\nreport-only rule also names a finding that (i) names, in its own\
  \ text, a decided residual's\nreceiving card or fingerprint as a whole token, or\
  \ (ii) carries the same criterion (as written, or\nits rule-1 reduction — the AC\
  \ token, else the class) AND the same locator as a decided residual —\neach prior\
  \ stating which of\nthese raised it. The report is carried on the canonical completion\
  \ record of the pass, not only in\nprose, so a Controller reading the journal after\
  \ a halt sees «looks like a decided residual under a\nnew key» beside the RED. The\
  \ rule-3 packet tells the auditor that such a finding is flagged and asks\nit to\
  \ carry `echo_of` or say why the finding is new. A flagged finding still counts\
  \ NEW at its own\nseverity; nothing is bound, overruled or dropped by the report.\
  \ **THE AUDITOR IS SHOWN WHAT WAS DECIDED, AND AN\nAUDIT-CURRENCY RE-AUDIT IS GOVERNED\
  \ BY THE DECISIONS (ADDITIVE — <project> / X-1549\ndisputed).** The report above\
  \ left the measured cost unchanged, for two reasons this closes. (a) The\npacket\
  \ listed each decided residual by fingerprint ALONE, so the auditor was told to\
  \ keep a prior\nfinding's fields «exactly as recorded» without being shown them;\
  \ it now renders each residual's\nRECORDED `severity`, `criterion_ref`, `locator`,\
  \ `failing_input` and `what` verbatim beside its\ndecision (`bin/lib/audit_ceiling.py#residual_finding_records`,\
  \ keyed by the residual readers' own\nkey function), and a residual whose record\
  \ does not resolve is SAID to have none, never given an\ninvented field. (b) An\
  \ ORDINARY audit-currency re-audit (`--reaudit-after-close`, no\n`--on-decisions`,\
  \ not the absorption re-audit) — the route of the 11:59Z RED — showed no\ndecision\
  \ and ran no matrix, so even a verbatim echo of a decided residual counted NEW.\
  \ Where the\nceiling row resolves and the SPEC-0168 fold binds at least one `ceiling_decision`\
  \ to its\n`ceiling_ref`, that re-audit now renders the same section (introduced\
  \ as a currency check, not a\ncounted pass) and the record seam runs THE SAME closed\
  \ matrix over the decidable set: a verified\n`echo_of` or an equal rule-1 key on\
  \ an `accept`/`defer` residual is `overruled_by_decision`, a\n`fix` echoed open\
  \ is RED, and every NEW finding counts under the unchanged currency bound.\nNO admission\
  \ ladder and NO refusal are added — a currency check spends no pass and never\n\
  terminalizes — so nothing that runs today is refused, and with no bound decision\
  \ the route is\nexactly what it was. IDENTITY IS UNCHANGED: the discriminator for\
  \ a re-worded re-raise is the\nauditor's own `echo_of`, made with the record in\
  \ view and verified by the engine; no coarser key,\nno prose similarity and no fingerprint\
  \ change is introduced (a first draft that bound on\n{criterion, locator} alone\
  \ was refused at audit-pre: the record itself holds two DISTINCT\nfindings at one\
  \ such pair). The suspected-echo report above still fires for any re-raise the\n\
  auditor does not declare. The result is computed by the ENGINE from the auditor's\
  \ response under a CLOSED matrix: a residual decided\n`accept` or `defer` that the\
  \ auditor re-argues is NOT a finding — recorded `overruled_by_decision`, never a\n\
  verdict driver (an all-`accept`/`defer` set with nothing new is GREEN with no code\
  \ change); a `fix` residual\nechoed as still open → RED; a NEW finding (a fingerprint\
  \ not on the ceiling row) is judged by its SEVERITY\n(amended): **a NEW finding\
  \ of severity `medium` or `low` is ABSORBED\nlike a YELLOW, not terminal** — when\
  \ NO `fix` residual is echoed open AND the new set is NON-EMPTY AND\nEVERY new finding's\
  \ severity is in the closed set {medium, low} (an absent or unknown severity is\
  \ NOT in\nit — fail-closed), the engine folds a RED to YELLOW and records the pass\
  \ YELLOW-ABSORBABLE; the card then\ntakes the EXISTING absorption exactly as below\
  \ the ceiling (LIFECYCLE §Stage 4 / §Stage 8): mode-a — the\nfix + `task commit\
  \ --absorb` (admitted past the ceiling ONLY on that absorbable record; `work commit`\
  \ on\na done-but-unlanded card) + ONE bounded re-audit `audit pre|post` (no flag)\
  \ under the SAME `ceiling_ref`,\nrecorded `basis: on-decisions-absorption` and journaled\
  \ at the grant moment\n(`audit_absorption_reaudit_granted`) — or mode-b / a filed\
  \ followup. The absorption re-audit is admitted\nEXACTLY ONCE per ceiling row, DERIVED\
  \ from the rows (a `basis: on-decisions-absorption` row naming that\n`ceiling_ref`\
  \ spends it — no counter): on it the absorbable arm is OFF, so a SECOND new finding\
  \ there\ncounts at its own severity and a RED there is TERMINAL exactly as a rule-3\
  \ RED is. A NEW `high` finding on\nthe rule-3 pass → RED (terminal, unchanged);\
  \ the ceiling counting of SPEC-0124 is unchanged (the absorption\nre-audit is the\
  \ mode-a pass the ceiling already counts, `passes` = ceiling + 2).\nThe verdict\
  \ is recorded on `external_audit_completed` with `basis: on-decisions` (or\n`on-decisions-absorption`\
  \ on the absorption re-audit), `ceiling_ref`, `decisions_applied`,\n`overruled_by_decision`,\
  \ `new_findings` — the NEW findings by identity, each `{finding_fingerprint,\nseverity,\
  \ absorbable}` (no longer a bare count) — and the saved YAML projects `basis`, `ceiling_ref`,\n\
  `new_findings`, `absorbable`. GREEN / YELLOW-absorbed → the ordinary\nStage-9 /\
  \ land path. **RED → TERMINAL for this (task, stage)** — a rule-3 RED, or an absorption\n\
  re-audit RED, or (task audit-post) a RED on the ONE post-GREEN merge-integration\
  \ pass\n(SPEC-0124 §Ledger-skip axes — which also admits no `--on-decisions` pass\
  \ and no decision\nafter it on any verdict): no further\npass is ever admitted at\
  \ that stage for that card — the ONLY exits are the EXISTING owner terminal\ndispositions,\
  \ cited to a directive: `task update --status parked|wont-do` for a card that is\
  \ not yet\ndone; `worktree park` (discard the branch; the card stays `ready` on\
  \ main — QUEUE §Prematurely-\nclosed-unlanded) for a done-but-unlanded card; or\
  \ a NEW card. RED audit status is DISTINCT from land\neligibility: `land` keeps\
  \ its SPEC-0077 audit-currency gate unchanged and reads nothing here.\n\n**THE ADMISSION\
  \ PRECONDITION ON A TERMINAL-BEARING PASS.** A terminal-bearing pass — the\nrule-3\
  \ `--on-decisions` pass, or the ONE bounded absorption re-audit, and ONLY those\
  \ — is NOT\nADMITTED while the engine's OWN Stage-6 ledger PROVABLY DOES NOT COVER\
  \ the commit it would audit.\nThe refusal emits `read_gate_refused` kind `stage6-evidence-stale`,\
  \ invokes no auditor, records no\nverdict and spends no pass; the session closes\
  \ the gap with the one command it names\n(`task test --run` at that head), re-enters\
