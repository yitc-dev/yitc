id: SPEC-0041
title: Test-authoring host-isolation contract — an engine self-tooling test sandboxes every host-mutable surface
# `class:` REMOVED — a spec carries both layers as body sections (Scenario + Internal).

status: active
                               # `active` is the ONLY normative status. proposed ⇒ consumed:false.

