id: SPEC-0041
title: Test-authoring host-isolation contract — an engine self-tooling test sandboxes
  every host-mutable surface
status: active
created_at: 2026-06-06 06:16:12+00:00
consumed: false
implements: []
binding:
- stage-entry:Execution
- stage-entry:Tests
body: "## Scenario\n\nA worker (the AI in a Build session) is at the Execution / Tests\
  \ stage of a task that touches\nthe methodology engine (`bin/yitc-v2`) or any of\
  \ its self-tooling code, and must WRITE or CHANGE a\ntest under `tests/`. Entering\
  \ the stage, `stage Execution` / `stage Tests` delivers this contract, so\nthe worker\
  \ knows — BEFORE writing the test — that an engine self-tooling test must run entirely\n\
  against a SANDBOX, never the live checkout it is running inside. The result: the\
  \ test asserts on\nisolated state and leaves the host checkout byte-clean; the post-suite\
  \ leak canary stays GREEN;\n`land`'s parallel verify is not poisoned by a sibling\
  \ test rewriting shared state.\n\nThis contract is IDENTITY-AGNOSTIC kernel methodology\
  \ (placement: kernel, the spec class-default —\nunmarked): host-isolation is a portable\
  \ test-authoring discipline that travels with the engine, so a\nconsumer authoring\
  \ tests against the engine's CLI follows the same rule. The concrete enforcement\n\
  artifacts named below (the leak-canary file, the `YITC_*` env overrides) are THIS\
  \ engine's instances\nof the rule — dev-provenance the release-view strip rebases\
  \ (SPEC-0073 §4), not a reason to scope the\ndiscipline to one repo.\n\n## Internal\n\
  \nTHE HOST-ISOLATION CONTRACT for ENGINE SELF-TOOLING TESTS (`tests/test_*.py` exercising\
  \ `bin/yitc-v2`\n/ the engine's parser / audit / event / task / graph code).\n\n\
  ### 1. The rule (the invariant)\nThe portable, identity-agnostic INVARIANT: **a\
  \ self-tooling test MUST sandbox EVERY host-mutable\nsurface it reads or writes,\
  \ and must NEVER commit, emit events, build the graph, or write any\nartifact against\
  \ the live checkout it runs in.** This is the normative rule and it travels unchanged\n\
  to any consumer of the engine; the surface TABLE below enumerates THIS engine's\
  \ instances of the\nrule's \"host-mutable surface\" set (a consumer pins the same\
  \ engine, so it inherits the same surfaces).\n\n**The surface set is a DERIVATION\
  \ rule, not a closed list:** \"host-mutable surface\" = the checkout's\n`git` state\
  \ (working tree / index / HEAD) PLUS **every repo-rooted path global** in `bin/yitc-v2`\n\
  (each `<GLOBAL> = REPO_ROOT / …` assignment — the same set `YITC_REPO_ROOT` redirects,\
  \ per the\n`cmd_repo_root_override` invariant). So a NEW writable global added later\
  \ is covered automatically;\ndo not enumerate-and-forget. The set at minimum includes:\n\
  \n| surface | what it is |\n|---|---|\n| `REPO_ROOT` | the checkout root; ALL other\
  \ path globals derive from it |\n| `TASKS_DIR` | `tasks/` — task YAMLs |\n| `DECISIONS_DIR`\
  \ | `decisions/` — decision + audit-verdict YAMLs |\n| `SPECS_DIR` | `specs/` —\
  \ spec YAMLs |\n| `PLANS_DIR` / `IDEAS_DIR` / `ERRORS_DIR` | `plans/` `ideas/` `errors/`\
  \ — planning + case-file artifacts |\n| `PATTERNS_DIR` / `VIEWS_DIR` | `patterns/`\
  \ `views/` — pattern docs + saved query-lenses |\n| `EVENTS_PATH` | `events.jsonl`\
  \ — the append-only journal |\n| `GRAPH_PATH` | `graph/index.json` — the derived\
  \ graph index |\n| `FLOOR_MAP_PATH` | `graph/floor-trigger-map.md` — the derived\
  \ always-loaded floor trigger-map |\n| `ID_RESERVATION_DIR` + any future `REPO_ROOT\
  \ /` global | id-reservation dir; the derivation rule covers later additions |\n\
  | `git` | the working tree / index / HEAD of the checkout (status, add, commit)\
  \ |\n\n\"Sandbox EVERY surface\" is not optional per-surface: a test that redirects\
  \ `TASKS_DIR` but lets a\nsubprocess `graph build` rewrite the real `GRAPH_PATH`\
  \ still leaks (the root). Redirect ALL\nof them, or run the whole operation in a\
  \ tmp repo.\n\n### 1b. Shared mutable state OBSERVED under concurrency (the cross-test\
  \ contamination vector)\n§1 forbids a test MUTATING the host. This is its mirror:\
  \ an engine self-tooling test MUST NOT **assert on\nshared mutable HOST state that\
  \ CONCURRENT sessions legitimately mutate** — chiefly (a) the append-only\n`events.jsonl`,\
  \ and (b) the worktree's `git status` cleanliness. The two are distinct failure\
  \ modes:\n§1 is \"THIS test pollutes the host\"; §1b is \"THIS test is CONTAMINATED\
  \ by OTHER tests' sanctioned\nactivity\". Under the EXPECTED concurrency (CHARTER\
  \ §P6 / — `land`'s verify runs the suite\n≤8-way parallel, and parallel sessions\
  \ land at once), a sibling test's PERMITTED in-REPO sandbox\n(e.g. the convention-blessed\
  \ `tempfile.TemporaryDirectory(dir=str(REPO_ROOT))`, used by ~80 tests)\nappends\
  \ to `events.jsonl` and shows as `new_dirty` in the shared worktree's `git status`.\
  \ A test that\nasserts on the LIVE shared surface is therefore **flaky-by-construction**:\
  \ it false-FAILs the moment a\nsibling runs concurrently, and in `land` that false-FAIL\
  \ aborts the land.\n\n**Isolation (reuse §2's already-shipped vectors — no new mechanism):**\n\
  - **`events.jsonl`** — assert against a PRIVATE snapshot/temp fixture, OR sink the\
  \ child's appends\n  with `YITC_EVENTS_SINK=os.devnull`; never assert on the live\
  \ shared journal.\n- **worktree `git status` cleanliness** — run the observation\
  \ in an ISOLATED `/tmp` git repo bound via\n  `YITC_REPO_ROOT` and `git status`\
  \ THAT repo, never the shared checkout the suite runs in.\n- **General rule:** if\
  \ an assertion's truth depends on state a concurrent sibling may touch, move the\n\
  \  observation into a private sandbox. The leak canary (§3) does not catch §1b (the\
  \ test stays\n  host-clean — it READS, it does not write); the discipline is the\
  \ guard.\n\n### 1c. A mutable resource a test OWNS takes a run-unique name (the\
  \ concurrency-readiness facet)\nSCOPE. This facet binds ANY test or verify layer\
  \ — an engine self-tooling test AND a consumer's\ndeclared verify layers alike —\
  \ because the resources it governs are HOST-GLOBAL, not\ncheckout-local: two runs\
  \ in two different checkouts still collide on them.\n\nTHE RULE. A test or verify\
  \ layer that OWNS a mutable resource takes a name that is UNIQUE AMONG\nEVERY RUN\
  \ THAT COULD BE CONCURRENT WITH IT, never a fixed one. A RESOURCE here is any name\
  \ two\nconcurrent runs could resolve to the same thing: a filesystem path, a cache\
  \ or build directory, a\nshared output sink, a container or compose project name,\
  \ a host port, a database name.\n\nTHE FALSIFIER (mechanical — read off the name\
  \ AS WRITTEN in the source, no case-by-case judgement).\nA name is a VIOLATION iff\
  \ BOTH hold:\n  (i) OWNERSHIP — the test or layer CREATES, WRITES or DELETES what\
  \ the name denotes; AND\n  (ii) NO UNIQUENESS GUARANTEE — no component of the name\
  \ is guaranteed distinct across runs that\n       may overlap in time.\nClause (ii)\
  \ is a question about WHAT PROVIDES THE GUARANTEE, and exactly two sources are admissible:\n\
  \  GUARANTEE SOURCE (A) — OS-ALLOCATED. The name is handed out by an allocator that\
  \ cannot hand the\n    same one to two live holders: a process identifier, a freshly-created\
  \ temporary directory, a\n    kernel-assigned ephemeral port.\n  GUARANTEE SOURCE\
  \ (B) — RUN-ISSUED. The name carries an identifier minted per run by whatever\n\
  \    launched it, unique by construction across the runs in flight.\n  NOT A GUARANTEE\
  \ — DERIVED. A name COMPUTED from inputs the runs SHARE — a content hash, a\n  \
  \  repository-plus-task key — is NOT a uniqueness guarantee, and saying so by name\
  \ is the point:\n    two concurrent runs over the same inputs compute the SAME name.\n\
  \nADMISSIBLE BY INTERCHANGEABLE WRITERS — a second, independent safety argument.\
  \ It is NOT clause\n(ii) and must be made explicitly rather than smuggled in as\
  \ a discriminated name: a FIXED name is\nadmissible when its concurrent writers\
  \ are INTERCHANGEABLE — every concurrent writer produces the\nsame bytes, each write\
  \ is atomic, and no reader depends on which one won.\n\nEXCLUSION (a) — NOT OWNED,\
  \ NOT IN SCOPE. A path another process writes and this test only READS is\n  §1b's\
  \ subject, not this rule's; clause (i) is what keeps the falsifier from firing on\
  \ it.\nEXCLUSION (b) — OPERATIONAL, NOT TEST. A stack a human operates BY NAME —\
  \ a long-lived container or\n  compose project — is not a test resource; there a\
  \ stable name is what makes it operable, and is\n  correct rather than defective.\n\
  Without both exclusions the falsifier OVER-fires.\n\nMEASUREMENT METHOD. A measurement\
  \ of what a layer writes is trustworthy only inside a directory no\nother process\
  \ can write; a capture taken over a host-global directory attributes every concurrent\n\
  writer on the machine to the layer under measurement.\n\nTHE FOUR FILTERS, answered\
  \ (CHARTER §Principle 1) — the home decision RECORDED, not asserted:\n  F1 EXISTING\
  \ ANALOG — YES, and it is this section's own parent. The rule already existed in\
  \ ONE\n    narrow instance: a dispatch scratch log carries a run discriminator,\
  \ never a bare host-global\n    path (`patterns/background-session-dispatch.md`,\
  \ pinned by\n    `tests/test_t12431_over_cap_test_run.py`). This section GENERALIZES\
  \ that instance instead of\n    creating a parallel rule, and the pattern keeps\
  \ stating only its dispatch-specific instance.\n  F2 VIEW OVER NEW ENTITY — a rule,\
  \ inside an existing spec body. NO new spec, no new field, no new\n    node, no\
  \ new edge, no new binding token, no new verb, no new event type, and no gate.\n\
  \  F3 WHAT IS REMOVED — the state in which a project's layer-independence claim\
  \ is UNFALSIFIABLE.\n    Before this section a bare assertion of independence had\
  \ nothing to be checked against; the\n    falsifier above is what a project, or\
  \ a reviewer, now checks it with.\n  F4 NOT AN INCIDENT, and this section does not\
  \ pretend one. It stands on the other two arms of\n    CHARTER §Principle 1 filter\
  \ 4: a SETTLED EXTERNAL ANALOG — every major test runner encodes this\n    same\
  \ rule, giving a test its own temporary directory and its own port rather than letting\
  \ it own\n    a fixed one — and the SCALE-AWARE REFINEMENT, since a retrofit lands\
  \ inside the tests, which only\n    grow, so the migration cost is asymmetric across\
  \ a growing consumer set: cheap now, painful later.\n  WHY HERE AND NOT THE ORIGIN\
  \ PATTERN DOC — the discriminator is DELIVERY. This spec already binds\n    the\
  \ two stages at which a test is written (its `binding:` — Execution and Tests),\
  \ so the rule\n    reaches its reader at the authoring moment BY CONSTRUCTION, adding\
  \ no binding or trigger class.\n    The pattern doc carries no such delivery: a\
  \ test-authoring rule placed there would be reachable\n    only by grep, which is\
  \ the state this section exists to end.\n\nBOUNDARY — this section owns how a TEST\
  \ IS WRITTEN so that a layer-independence claim can be true.\nWhat a PROJECT DECLARES\
  \ in order to make that claim is SPEC-1007's contract, not this section's, and\n\
  no declaration schema is defined here.\n\n### 2. The two sanctioned isolation techniques\
  \ (pick one; both already)\n- **(a) In-process monkeypatch of the path globals.**\
  \ For an in-process test, reassign the CLI module\n  globals to tmp paths BEFORE\
  \ the code under test reads them — e.g. `yitc.TASKS_DIR`,\n  `yitc.DECISIONS_DIR`,\
  \ `yitc.GRAPH_PATH`, `yitc.EVENTS_PATH`. Restore them in a `finally`\n  if the same\
  \ process runs other tests.\n- **(b) Build / run in a tmp repo (subprocess via `YITC_REPO_ROOT`).**\
  \ For anything that shells out\n  to the real CLI (`graph build`, `audit`, `task`\
  \ verbs) use the **`YITC_REPO_ROOT`** opt-in env\n  override : it redirects ALL\
  \ of the CLI's path globals to a temp copy, so a subprocess\n  targets tmp, never\
  \ the host. Pair it with **`YITC_EVENTS_SINK=os.devnull`** to quarantine\n  the\
  \ child's journal writes. The CANONICAL HELPER for the common case — building the\
  \ derived graph\n  artifacts off a temp copy — is **`tests/_graph_build_sandbox.build_index_in_temp_copy(repo)`**\n\
  \  : it copytrees the build inputs into a fresh tmp dir, runs `graph build` there\
  \ under\n  `YITC_REPO_ROOT` + `YITC_EVENTS_SINK`, caches per process, and returns\
  \ the tmp root; read\n  `binding_report` / the index from the tmp build, never the\
  \ live one.\n\n### 3. The enforcement probe (the leak canary)\nThe post-suite **host-leak\
  \ canary** — `tests/test_t0402_host_leak_canary.py`, invoked\n`YITC_CANARY_RUN=1\
  \ python3 tests/test_t0402_host_leak_canary.py` — is the standing regression guard:\n\
  it runs the full suite in `land`'s parallel per-file shape and FAILS if the host\
  \ checkout is not\nbyte-clean afterward (no `graph/index.json` rewrite or mtime\
  \ touch, no `decisions/T-99*` debris, no\norphan `graph/.index.json.*.tmp`), AND\
  \ that the production journal `events.jsonl` took no leak\n. A test that violates\
  \ §1 trips this canary. (Wiring it as a\ndedicated `land`/CI step is — out of this\
  \ spec's scope; the canary itself is the probe.)\n\nThe JOURNAL watch is DIFFERENTIAL,\
  \ not a `git status` entry, and that shape is load-bearing :\nthe journal is append-only\
  \ and ordinarily dirty on the host checkout, so listing it beside the three\npaths\
  \ above would make the canary's already-dirty ENTRY GUARD skip nearly every run\
  \ — disabling the\nguard instead of widening it. The canary therefore snapshots\
  \ `events.jsonl` before the suite and\nclassifies what changed, where exactly two\
  \ outcomes are leaks: (a) a NON-APPEND mutation (the pre-run\nbytes are no longer\
  \ the file's prefix, or it shrank), and (b) appended rows carrying a RESERVED\n\
  SYNTHETIC TEST ID — the 9000-series `T-9NNN` fixture range, NAMED rather than counted.\
  \ An ordinary\nappend carrying no synthetic id is never flagged: concurrent sessions\
  \ land while the suite runs\n, and a canary that tripped on ordinary journal growth\
  \ would be worse than none.\n\n### 4. NOT this — the adjacent-but-different concern\n\
  `patterns/test-isolation-strategies.md` is a DIFFERENT concern: it governs async-DB\
  \ PRODUCT tests\n(rollback / recreate / savepoint fixtures), v1-migrated. It is\
  \ NOT this contract and is NOT\nconflated here — this spec governs ENGINE SELF-TOOLING\
  \ tests not touching the host checkout. Cited for\ndisambiguation, not as a dependency.\n\
  \n## Parameters\n\nNone consumed.\n\n## Rationale\n\nA DESIGN/teaching spec : it\
  \ tells the AI what to inspect and how to isolate before writing a\nself-tooling\
  \ test, and a spec is its right home (SPEC-0005 rule 1/2 — a standing, cross-task,\n\
  analysis-shaping, probeable PROCESS rule). It codifies an ALREADY-shipped idiom\
  \ rather than inventing behaviour, and is\ncarried by the sandbox-leak incident\
  \ family — repeated one-test-at-a-time fixes sharing one root:\nan engine self-tooling\
  \ test touched the host checkout, with no governing spec on how to write a test\n\
  and nothing test-discipline delivered when a worker writes one.\n\n### History moved\
  \ from the rule body\n\nEach entry is a passage moved word for word out of the rule\
  \ text of the section it names;\nthe rule it explains stays there.\n\n- From «1c.\
  \ A mutable resource a test OWNS takes a run-unique name»: Evidence from this engine's\n\
  \  own history — its detached-land log is keyed by repository and task, which is\
  \ exactly why that\n  log is append-only ACROSS ATTEMPTS and why a poll of it had\
  \ to be anchored to the current\n  attempt's bytes.\n\n## Implementation notes\n\
  \nNotes for the maintainer of the code, moved word for word out of the rule text\
  \ of the section\neach names.\n\n- From «2. The two sanctioned isolation techniques»:\
  \ (prior-art: `tests/test_graph_freshness.py`,\n  `tests/test_audit_degeneration.py`)\n\
  \n### Moved from the rule body\n\n- From «Internal»: This is AUTHORING DISCIPLINE,\
  \ not a new gate or mechanism — it codifies the\n  ALREADY-SHIPPED sandbox idiom\
  \ so it is followed once, not rediscovered per incident.\n- From «5. Anti-complexity\
  \ posture»: No new node, edge, parser, verb, or gate. This codifies the\n  ALREADY-shipped\
  \ idiom (the two techniques above + the canary, all live) and EXTENDS the existing\n\
  \  SPEC-0013 stage-entry delivery axis (`binding: [stage-entry:Execution, stage-entry:Tests]`)\
  \ so\n  the contract reaches the worker at the authoring moment. What it RETIRES:\
  \ the reactive\n  whack-a-mole class — one-test-at-a-time sandbox fixes with no\
  \ governing rule and nothing\n  delivered when a test is written. Codify once +\
  \ deliver → the recurrence has a home and a\n  delivery.\n- From «Parameters»: The\
  \ host-mutable surfaces in §1 are the CLI path globals (`bin/yitc-v2`\n  REPO_ROOT\
  \ block); the env overrides `YITC_REPO_ROOT` / `YITC_EVENTS_SINK` / `YITC_CANARY_RUN`\n\
  \  are referenced, not duplicated — they live in `bin/yitc-v2` + the canary, the\
  \ single source.\n\n## Verification\n\nProbe CONTRACTS (the rule's `## Verification`\
  \ per SPEC-0005 §8 — contracts, not one-time results):\n- **VP1 (body carries the\
  \ contract):** this `## Internal` names ALL seven host-mutable surfaces\n  (REPO_ROOT\
  \ / TASKS_DIR / DECISIONS_DIR / EVENTS_PATH / GRAPH_PATH / FLOOR_MAP_PATH / git),\
  \ BOTH\n  isolation techniques (monkeypatch the path globals OR a tmp repo), the\
  \ canonical helper\n  (`tests/_graph_build_sandbox.build_index_in_temp_copy` + `YITC_REPO_ROOT`\
  \ + `YITC_EVENTS_SINK`),\n  and the leak canary as the enforcement probe — `bin/yitc-v2\
  \ graph query SPEC-0041` returns them.\n  It ALSO carries the **§1b shared-mutable-state-under-concurrency\
  \ rule** : a test MUST NOT\n  assert on shared mutable host state concurrent sessions\
  \ mutate (the live `events.jsonl`; the worktree\n  `git status` cleanliness) — isolate\
  \ via a private snapshot / `YITC_EVENTS_SINK` / a `/tmp` repo bound\n  by `YITC_REPO_ROOT`.\
  \ (state-check on the spec body — AC1.)\n- **VP2 (delivered at the authoring moment):**\
  \ the binding-report state-check — `graph build`'s\n  `binding_report.stage_to_specs`\
  \ lists active SPEC-0041 under BOTH `Execution` and `Tests`. The\n  live-trigger\
  \ is a `stage Execution` / `stage Tests` delivery observed on ANY active task currently\n\
  \  at that stage (NOT a re-entry on the just-closed, which is no longer at those\
  \ stages) — the\n  `stage_entered` event carries SPEC-0041 in `delivered`. (binding-report\
  \ state-check + live-trigger\n  on a live stage entry — AC2.)\n- **VP3 (non-dangling,\
  \ honest):** active SPEC-0041 carries a `stage-entry:` routing binding ⇒\n  excluded\
  \ from `binding_report.dangling_specs` and from `unknown_tokens`; `graph conformance`\
  \ is\n  GREEN. (RED-GREEN: drop the binding → it reappears as dangling.)\n- **VP4\
  \ (not conflated):** the body cross-references `patterns/test-isolation-strategies.md`\
  \ as a\n  DIFFERENT concern (async-DB product tests), not as a dependency — §4.\n\
  - **VP5 (work-first activation):** `activation_owner_task: `; `task close ` flips\
  \ this\n  spec proposed→active ( deterministic side-effect).\n"
