  gated_capabilities:
  - key: combined_candidate_safe
    example: 'true'
    spec: SPEC-0152
    summary: 'land-verify BATCHING — several queued lands verified TOGETHER, in ONE
      pass over a combined candidate, instead of a full verify per land. Declare it
      only if your layers isolate one change from another: a shared fixture, port,
      database or build cache can make one member''s failure indistinguishable from
      a peer''s, which is why the kernel cannot infer this.'
    absent: every land is verified alone — batches of one, whatever the queue depth.
  - key: independent_layers
    example: '[static, frontend-unit]'
    spec: SPEC-0152
    summary: 'CONCURRENT land-verify layers — the layers named here run OVERLAPPED
      in one land instead of one after another (the wall drops from their sum towards
      their longest). Name only layers that share nothing with EACH OTHER: no host
      port, compose project, database, build cache or tree write, their `prep:` included
      — a pairwise claim the kernel cannot infer. Fail-fast, per-layer timeouts and
      the per-layer rows are unchanged; a name matching no declared layer fails the
      land closed.'
    absent: every declared layer runs serially, in declaration order — the verify
      wall is their sum.
  - key: layer_worker_shares
    example: '{static: 0.1, frontend-unit: 0.6, stack: 0.2, sandbox: 0.1}'
    spec: SPEC-0152
    summary: 'HOW YOU SPLIT the land''s worker allotment across your layers — a mapping
      of layer name to that layer''s FRACTION (a number in (0, 1], never a core count,
      so a change to the kernel''s allotment re-splits automatically and nothing here
      is rewritten). The kernel declares the form, validates it, records each share
      beside the CPU that layer actually consumed, and keeps publishing the WHOLE
      allotment in YITC_VERIFY_LAYER_WORKERS; it computes nothing and publishes no
      per-layer number. YOU split it and scale your own runners — only you know what
      your layers do. The sum is deliberately unchecked: there is no over-allocation
      guard, and a share that floors at one worker is your arithmetic.'
    absent: every layer reads the whole allotment — unsplit, as today.
