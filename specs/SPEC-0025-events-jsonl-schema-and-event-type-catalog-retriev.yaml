  \ it hits a hard\ngovernance boundary mid-task (audit-loop ceiling / genuine architectural\
  \ fork / auditor ABORT) instead of\nclosing. It is the \"stop-and-look\" trigger\
  \ for the controller. Counterpart of `task_closed`: BOTH are the\ntwo terminal events\
  \ of a dispatched session (done vs halt).\n```jsonc\n{\"ts\": \"...\", \"type\"\
  : \"bg_dispatch_halted\", \"task_id\": \"T-XXXX\",\n \"data\": {\"dispatch\": \"\
  <dispatch-tag>\", \"reason\": \"audit-ceiling|owner-wait|auditor-abort: <detail>\"\
  ,\n          \"passes\": <n>, \"stage\": \"<current_stage>\"}}\n```\nAs the BLOCK-side\
  \ wait carrier it MAY additionally carry the OPTIONAL normalized `wait_reason` (per\n\
  SPEC-0135 §5 — the shared pause/block reason vocabulary at §Normalized provider×model×effort\n\
  vocabulary), ALONGSIDE the free `reason` detail string; additive / P5-safe.\n\n\
  **timing_instrument_reading** ( — the SPEC-0105 §2c quiet lane; SPEC-0077 §3b):\n\
  ONE row per REGISTERED timing instrument per quiet-lane run, whatever happened.\
  \ It is a NEW event\nTYPE, disjoint from the `reads` keys added to the existing\
  \ `cli_invoked` row: those are new\nKEYS on an existing type carrying a read-cost\
  \ counter, this is a new TYPE carrying a wall-clock\nREADING. The two never share\
  \ a row and neither is derivable from the other.\n```jsonc\n{\"ts\": \"...\", \"\
  type\": \"timing_instrument_reading\",\n \"data\": {\"instrument\": \"<registry\
  \ id>\", \"verdict\": \"ok|failed|skipped\",\n          \"duration_ms\": <int|null>,\
  \ \"exit_code\": <int|null>, \"serialized\": true,\n          \"baseline_median_ms\"\
  : <number|null>, \"delta_pct\": <number|null>,\n          \"regression\": <bool>,\
  \ \"readings_considered\": <int>, \"reason\": \"<str|null>\"}}\n```\n- `verdict`\
  \ — `ok` (the instrument ran and exited 0) / `failed` (it ran and exited non-zero,\
  \ was\n  killed by the lane's timeout, or its REGISTERED file/leg did not resolve)\
  \ / `skipped` (the host\n  was not quiet — a verify held an admission slot past\
  \ the ones this lane holds, on either side of\n  the run). The split is by WHOSE\
  \ fault the missing number is, not by whether a process started:\n  `skipped` is\
  \ the TRANSIENT, blameless case that will simply be measured again tomorrow, and\
  \ it is\n  silent by design; an unresolvable registration is a PERMANENT defect\
  \ that would otherwise let an\n  instrument quietly stop being measured for weeks\
  \ under a verdict that reads as normal, so it is\n  `failed` and raises the lane's\
  \ `alert` (this matches SPEC-0105 §2c, whose `skipped` clause is the\n  lane-could-not-run-at-all\
  \ case). A run that produced no row at all is a DEFECT, not a state: the\n  lane\
  \ emits one row per registered instrument unconditionally, so an absent row means\
  \ the lane\n  itself did not run.\n- `duration_ms` — the measured wall-clock, and\
  \ the WHOLE POINT of the row. NULL, never 0, for a\n  `skipped` reading: a fabricated\
  \ 0 would enter the baseline and pull every later comparison down\n  (the no-fabricated-zeros\
  \ discipline).\n- `baseline_median_ms` / `delta_pct` / `regression` / `readings_considered`\
  \ — the report-only\n  regression signal, computed against the TRIMMED median of\
  \ that instrument's last 7 prior readings\n  folded from this same type. With fewer\
  \ than two priors there is no baseline: `baseline_median_ms`\n  and `delta_pct`\
  \ are null, `regression` is false, and `readings_considered` says how few were\n\
  \  found. `regression: true` moves NO verdict and NO exit code (SPEC-0105 §2c).\n\
  - `serialized` — records that this reading was taken with the instruments run one\
  \ at a time and the\n  verify-admission pool held, i.e. that the reading's own precondition\
  \ held when it was taken. A\n  reading is interpretable only against the conditions\
  \ it was taken under.\n\n### Terminal-marker contract + Per-dispatch correlation\
  \ (dispatched sessions) → SPEC-0153\nThe dispatched-session **terminal-marker contract**\
  \ and the **per-dispatch correlation**\nfields were SPLIT VERBATIM into **SPEC-0153**\
  \ under the SPEC-0120 §3 must-split ceiling\n(SPLIT-never-delete). Fetch them via\
  \ `bin/yitc-v2 graph query SPEC-0153`.\n### Event-type catalog extension → SPEC-0161\n\
  The **event-type catalog extension** — the maximalist-capture event types: the\n\
  fundamental-gap events (`dissonance_detected`, `consumer_read_evidence`, `live_trigger_evidence`,\n\
  `task_paused`, `task_resumed`), the general maximalist-capture events (`owner_directive`,\n\
  `ai_reasoning_note`, `failed_attempt`), the retired stage-timing events (`stage_entry`\
  \ / `stage_exit`,\n`task_picked`), the LIVE `stage_entered` content-delivery event,\
  \ `check_admission_demonstrated`,\n`spec_activated`, `test_class_executed`, and\
  \ the followup-capture events — was SPLIT VERBATIM into\n**SPEC-0161** under the\
  \ SPEC-0120 §3 must-split ceiling (SPLIT-never-delete). This parent keeps\nthe universal\
  \ schema, the required event types, and the §Normalized provider×model×effort vocabulary.\n\
  Fetch the extension catalog via `bin/yitc-v2 graph query SPEC-0161`.\n\n## Rationale\n\
  \nSource: AGENTS §events.jsonl schema + §Event types catalog extension (the always-loaded\
  \ handbook prose,\nkept in place until, which stripped it to pointer-stubs). This\
  \ spec is the `retrieved` tier home\n(Part I-B bulk demote, plan `part-i-b-tier-split-carving-floor-wiring-first-the`\
  \ §Phase-2): situational\nreference prose consulted WHEN authoring/validating an\
  \ event surface moves out of the always-loaded\nbudget into a query-only retrieved\
  \ spec (SPEC-0007 §5a), reached via the AGENTS pointer-stub + `graph\nquery`. It\
  \ is NOT floor-triggered: emitting an event is an append-only, non-gated action\
  \ ( — a\n`before-event` trigger would be obligation-set creep, anti-cx F4). Prior-art:\
  \ the same query-only demote\nshape SPEC-0007 §5a names the DEFAULT for situational\
  \ reference catalogs; SPEC-0014/0015/0016 are the\nfloor-triggered control-point\
  \ analogues (Part I-A).\n\n## Verification\n\nProbe CONTRACTS (not one-time results):\n\
  - **VP1 (fidelity, moved-not-lost):** the key phrases of each demoted section resolve\
  \ in THIS spec and\n  are ABSENT from AGENTS.md (probe: `grep \"Universal schema\"\
  ` / `grep \"Event-type catalog extension\"` /\n  `grep \"Fundamental-gap-related\"\
  ` present here, the bodies gone from AGENTS.md — only the pointer-stubs\n  remain).\
  \ RED-GREEN: the grep-absent assertion fails BEFORE the AGENTS strip.\n- **VP2 (delivery,\
  \ query-only):** `bin/yitc-v2 graph query SPEC-0025` resolves this node; the\n \
  \ always-loaded AGENTS §events.jsonl-schema + §Event types catalog stubs name this\
  \ spec id + the lookup\n  command. Both halves of the ratification probe (pointer\
  \ surface + lookup command) are nameable.\n- **VP3 (query-only, no floor-trigger):**\
  \ `graph/floor-trigger-map.md` gains NO `before-event` trigger\n  (negative probe\
  \ — this spec's `binding:` is `[query-only]`, a residency token with no verb surface;\n\
  \  the four triggers stay commit/audit/closure/rule-change). AND it is NOT in\n\
  \  `binding_report.dangling_specs` ( query-only token).\n- **VP4 (graph-indexed):**\
  \ `bin/yitc-v2 graph build` indexes SPEC-0025 as a `spec` node.\n- **VP5 (stage_entered\
  \ discoverable + P5-safe, /AU-2):** a synthetic\n  `event stage_entered --data '{\"\
  stage\":...,\"delivered\":[...],\"delivered_verbs\":[...]}'` append is\n  returned\
  \ by `journal query --type stage_entered` with the bundle rendered in the summary\
  \ column, AND\n  a mixed journal with other event types still queries green (no\
  \ reader breaks). Committed regression\n  coverage: `tests/test_journal_query.py::test_stage_entered_discoverable_and_p5_safe`.\n\
  - **VP6 (terminal-marker contract):** a synthetic dispatch emits BOTH a `task_closed`\
  \ and a\n  `bg_dispatch_halted` keyed by the SAME top-level `task_id` AND the same\
  \ `data.dispatch` tag into a\n  worktree journal; ONE scoped query (`type in {task_closed,bg_dispatch_halted}`\
  \ AND `task_id==<id>` AND\n  `data.dispatch==<tag>`) returns BOTH terminals — exercising\
  \ key (task_id) + tag (data.dispatch) +\n  one-location. RED-GREEN: a halt keyed\
  \ only by `data.task` (the run-9 form) is MISSED by the\n  `task_id`-scoped query.\
  \ Committed regression coverage:\n  `tests/test_dispatch_terminal_marker.py::test_one_query_finds_both_terminals`.\n\
  - **VP7 (per-dispatch correlation):** a synthetic dispatch emits its full chain\n\
  \  (`startup_protocol_completed -> task_picked -> tests_passed -> task_closed`)\
  \ under ONE `session_ref`;\n  ONE filter `journal query --session <session_ref>`\
  \ returns the EXACT ordered happy-path chain\n  INCLUDING the recognized terminal\
  \ (`task_closed`), proving the whole lifecycle is filterable as one\n  unit by the\
  \ envelope key. RED-GREEN: an event emitted under a DIFFERENT session_ref is absent\
  \ from\n  the chain. Committed regression coverage:\n  `tests/test_dispatch_correlation.py::test_one_session_filter_returns_full_ordered_chain`.\n\
  - **VP8 (observation-loop raw fields + vocab present, / SPEC-0135):** the amended\
  \ body\n  LISTS every added raw observation field — `session_started` {provider,model,effort,cores,mem_gb,\n\
  \  host_label}, `external_audit_completed` {provider,model,effort,duration_ms},\
  \ `stage_entered`\n  {ctx_pct}, `land_completed` {load1,peak_mem}, `task_closed`\
  \ {class,audited,audit_passes},\n  `task_paused`/`bg_dispatch_halted` {wait_reason}\
  \ — AND carries the §Normalized provider×model×effort\n  vocabulary (allowed keys\
  \ + `\"unknown\"`/null fallback + opaque `session_config`→triple mapping + the\n\
  \  `wait_reason` enum). State-check (documentary spec, no code probe): `bin/yitc-v2\
  \ graph query SPEC-0025`\n  renders the fields + the vocabulary subsection; grep-absent\
  \ of any usage/cost source-fact confirms the\n  SPEC-0135 §3 read-time-derived-cost\
  \ fence holds (identity/join-keys only).\n"
