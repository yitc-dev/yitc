body: "## Scenario\n\nWhen the AI emits a journal event — or reasons about what an\
  \ event MEANS — it needs the events.jsonl\nschema: the one-line-per-object shape,\
  \ the universal `{ts,type,task_id,data}` triple, and the catalog\nof event types\
  \ with their payloads. The owner/AI does not hold this from memory: this spec is\
  \ the\n`retrieved` home, pulled on demand via `bin/yitc-v2 graph query SPEC-0025`\
  \ when authoring/validating an\nevent surface (the always-loaded AGENTS.md §events.jsonl-schema\
  \ / §Event types catalog stubs point\nhere). It is reference, not a control-point\
  \ — emitting an event is an append-only, non-gated action.\n\n## Internal\n\nTHE\
  \ events.jsonl SCHEMA + EVENT-TYPE CATALOG (faithfully moved from AGENTS §events.jsonl\
  \ schema +\n§Event types catalog extension by the demote task — the rule MOVED to\
  \ this spec, it was not\ndeleted; the always-loaded handbook now carries a pointer-stub).\
  \ Append-only, P5-safe: consumers parse\nunknown event types as an opaque `{ts,type,data}`\
  \ triple, never fail. No upfront closed enum.\n\n`events.jsonl` lives at `<project-root>/events.jsonl`.\
  \ JSON Lines format — one JSON object per line,\nappend-only. Manual writes during\
  \ Day 1-2 used `cat >> events.jsonl`; Day 3+ the CLI emits structured.\n\n### Universal\
  \ schema\n```jsonc\n{\"ts\": \"\", \"type\": \"<event_type>\", \"task_id\": \"T-XXXX\"\
  , \"data\": {...}}\n```\n- `ts` — ISO 8601 UTC, microsecond optional\n- `type` —\
  \ snake_case event name\n- `task_id` — optional, present when the event ties to\
  \ a specific task\n- `data` — type-specific payload. May include `commit: <sha>`\
  \ (for commit-related events:\n  `commit_landed`, `audit_post_completed`) or `audit_id:\
  \ <task-audit-stage>` (for audit-related\n  events: `external_audit_completed`)\n\
  \n#### `unresolved_locators` — the cross-type governed-citation mark (X-1465)\n\n\
  An ADDITIVE-OPTIONAL `data` key that may appear on a row of **ANY** type — which\
  \ is why it is homed\nhere in the universal schema rather than in one type's catalog\
  \ entry. Shape:\n\n```jsonc\n\"unresolved_locators\": [{\"field\": \"<the governed\
  \ field>\", \"locator\": \"<the ts as written>\",\n                         \"why\"\
  : \"malformed | no-row\"}]\n```\n\n**What it records.** SPEC-0204 rule 2 holds that\
  \ authority is proven by RESOLUTION, never by a\nnon-empty string — but it enforced\
  \ that for one TYPED argument only, so a governed FREE-TEXT reason\ncould cite a\
  \ locator that resolves to nothing. It did: `task update --status wont-do` accepted\n\
  \ placeholder `events.jsonl#ts=2026-09-16T12:5x` (the real row is at 14:58:18Z)\
  \ and LANDED\nit unchecked (deviation events.jsonl#ts=). `bin/lib/cli.py#_check_reason_locators`\n\
  now scans the governed reason fields once per invocation and stamps this key onto\
  \ the row in flight.\n\n**PRESENT ONLY ON AN OFFENDING ROW — never `false`, never\
  \ an empty list.** `why` distinguishes the\ntwo failures that both had to be caught:\
  \ `malformed` (the token is not a well-formed timestamp — the\n shape, which a resolve-only\
  \ check would have skipped entirely) and `no-row` (well-formed, but\nno journal\
  \ row carries that ts). A locator that RESOLVES, and one whose lookup could not\
  \ be decided\n(I/O failure), are both silent — the fail-SAFE direction, since a\
  \ governance mark must never assert\nan offence it cannot prove.\n\n**Report-only\
  \ by design.** The mark is paired with a stderr WARN and refuses nothing: the class\
  \ it\naddresses is a defect that LANDED unnoticed, and a stderr line in a background\
  \ worker is gone the\nmoment the process exits — so the ROW is the durable half,\
  \ making the record self-describing and\ngreppable (`journal query --grep unresolved_locators`).\
  \ The key is derived at the write path, never\ncaller-supplied.\n\n### Required\
  \ `duration_ms` field set ( — the machine-readable roster)\n\nThe event types on\
  \ which `duration_ms` is a REQUIRED `data` field. This roster is the SINGLE source\n\
  the schema self-test reads (`tests/test_test_and_audit_rows_carry_duration.py`),\
  \ so the catalog and\nthe check cannot drift apart — a type is required-by-being-listed\
  \ here, nowhere else:\n\n```yaml\nduration_ms_required_on:\n  - tests_passed\n \
  \ - tests_failed\n  - audit_pre_completed\n  - audit_post_completed\n  - external_audit_completed\n\
  ```\n\nA row of one of these types with no `duration_ms` FAILS the check. Rows emitted\
  \ BEFORE\nlanded are grandfathered — the check reads fixture rows and the emitters,\
  \ not the historical\njournal (an append-only log cannot be retro-fixed, and the\
  \ recovery-by-pairing fallback above is\nwhat reads those). The ONE exempt live\
  \ shape is named at §tests_passed: a hand-authored\n`--evidence` with no run attached,\
  \ which measured nothing and must not fabricate a 0.\n\n### Required event types\
  \ (LIFECYCLE references)\n\n**audit_pre_completed** (Stage 4):\n```jsonc\n{\"ts\"\
  : \"\", \"type\": \"audit_pre_completed\", \"task_id\": \"\",\n \"data\": {\"verdict\"\
  : \"GREEN\", \"findings_count\": 0, \"duration_ms\": 61234,\n          \"saved_to\"\
  : \"decisions/-audit-pre.yaml\"}}\n```\n\n**external_audit_completed** (Stages 4\
  \ + 8 + ad-hoc):\n```jsonc\n{\"ts\": \"\", \"type\": \"external_audit_completed\"\
  , \"task_id\": \"\",\n \"data\": {\"stage\": \"pre\", \"verdict\": \"GREEN\", \"\
  absorbed\": 0, \"followups_filed\": [],\n          \"duration_ms\": 61234}}\n```\n\
  \n**audit_self_provider_used** (Stages 4 + 8 + ad-hoc + consult — every gate, per\
  \ SPEC-0201 rule 2):\n```jsonc\n{\"ts\": \"\", \"type\": \"audit_self_provider_used\"\
  , \"task_id\": \"\",\n \"data\": {\"target_kind\": \"task\", \"target_id\": \"\"\
  , \"stage\": \"pre\", \"tier\": \"routine\",\n          \"provider\": \"<the auditor's\
  \ resolved provider>\", \"model\": \"<the model the adapter ran>\",\n          \"\
  primary_provider\": \"<the primary AI's provider for this session>\"}}\n```\nONE\
  \ row per SAME-PROVIDER audit — the audit ran on the primary AI's own provider because\
  \ NO external\nprovider resolved for the tier. It is the journal counterpart of\
  \ the verdict's\n`auditor_independence: same-provider` stamp (SPEC-0036 §Saved audit\
  \ result), emitted at the SAME\nsingle invocation chokepoint; an `external` audit\
  \ emits NOTHING. The payload is exactly these SEVEN\nkeys: `target_kind` (task |\
  \ plan | ad-hoc) · `target_id` (the audited node id) · `stage`\n(pre | post | ad-hoc\
  \ | consult-*) · `tier` (the audit tier resolved for this invocation) ·\n`provider`\
  \ (the auditor's resolved provider) · `model` (the model the adapter actually ran)\
  \ ·\n`primary_provider` (the primary AI's provider for this session; the value the\
  \ stamp compared\n`provider` against). Provider-neutral by construction — the values\
  \ are resolved identifiers, and no\nbrand name is named in this catalog. The row\
  \ is what makes «how often did this install audit itself?»\nanswerable from the\
  \ durable journal rather than from a count of verdict files. Rule home:\n`bin/yitc-v2\
  \ graph query SPEC-0201`.\n\n**CATALOGUED BEFORE ITS EMITTER, deliberately** — the\
  \ emitter is (`bin/lib/audit.py`), and\nthis row is the definition that emitter\
  \ writes against. Same discipline, and the same reason, as\n`ceiling_decision` (SPEC-0161\
  \ §Roster): the card that BIRTHS a shared payload owns its definition\nfirst, so\
  \ the writers that follow cannot each agree with one another and disagree with the\
  \ catalog.\nUntil that emitter lands, no live row carries this type — additive and\
  \ P5-safe.\n\n**external_audit_completed — the ELEVEN CEILING-CONSULT EPISODE FIELDS\
  \ (<workshop-spec> rule 9, added\nINERT by / plan card C4).** An EXTENSION of THIS\
  \ event, never a new event type (CHARTER §P1\nF1/F2). They ride a `stage: consult-*`\
  \ row and make the post-ceiling consult's quality measurable\nfrom the DURABLE journal:\
  \ the consult RECORD at `saved_to` is rewritten in place by every round, so\na fold\
  \ built on it would see only each episode's last round — the row is where the per-round\
  \ truth\nhas to live (rule 9's B13), and `saved_to` stays provenance only.\n\nADDED\
  \ INERT, AND THAT IS PART OF THE CONTRACT (rule 9's B11): as of the fields are DEFINED,\n\
  formatted (`bin/lib/audit_consult.py#consult_episode_row_fields`) and read by the\
  \ `consult-postcheck` saved\nview, and NO live row carries any of them — a live\
  \ `audit consult` / auto-consult emits the legacy\nrow unchanged. The FIRST live\
  \ emission is card C3's, which wires the emit together with\nthe prompt and the\
  \ predicates, because <workshop-spec> rule 7 holds that a partially-landed state\
  \ is not a\nvalid state of that contract. Every field below is therefore additive-optional\
  \ and P5-safe: a\nconsumer that does not know them ignores them, and a legacy row\
  \ carries none.\n\n- `episode_id` — rule 1's `<target>/<stage|gate>/<attempt n>`;\
  \ the fold groups by this id MINUS its\n  attempt ordinal, i.e. by `(target, stage|gate)`.\n\
  - `baseline_revision` — the basis fingerprint the frozen baseline was established\
  \ at. Carried as its\n  OWN field, never as part of `episode_id`, so two episodes\
  \ on the same basis never collide.\n- `round_kind`: baseline | retest — FIXED by\
  \ the state BEFORE the call (rule 4), never by its\n  outcome. R counts rounds of\
  \ kind `retest` ONLY, malformed or not.\n- `malformed` — true | false. A SEPARATE\
  \ flag, never a kind: a malformed retest is still a retest\n  and still consumes\
  \ R.\n- `r_after` — R after this round.\n- `malformed_count` — the episode-scoped\
  \ malformed tally (rule 2: ONE re-run per EPISODE, not per\n  basis).\n- `no_answer`\
  \ — true | false (rule 4 row 0a). TRUE when the round returned NO PAYLOAD at\n \
  \ all — an rc-124 wall-clock timeout, a normalized launch/transport failure, or\
  \ an empty payload at\n  any rc. Distinct from `malformed`, which is a payload that\
  \ CAME BACK and could not be read: a\n  no-answer freezes nothing, consumes NO round\
  \ (`r_after` unchanged), leaves `malformed_count`\n  untouched, and is NOT terminal,\
  \ so the episode stays OPEN and the next call joins it.\n- `no_answer_count` — consecutive\
  \ no-answers, per ROUND: reset to 0 by any round that ANSWERS, so\n  the budget\
  \ cannot accumulate across a healthy round.\n- `no_answer_route`: auditor-unavailable\
  \ — present ONLY on the SECOND consecutive no-answer. It is\n  the SPEC-0103 §3a\
  \ auditor-OUTAGE route, explicitly NOT `malformed-exhausted` and NOT an episode\n\
  \  terminal: an outage is a fact about the AUDITOR, never about the subject.\n-\
  \ `contract_violations` — THIS round's violations as `[{id, kind}]` (the row's measurement\
  \ shape;\n  the record keeps the richer `{id, field, reason}`).\n- `completeness_failures_delta`\
  \ — the escapes counted THIS ROUND (rule 8's row-10 pre-existing NEW\n  blocking\
  \ findings), never the running total: the total is the record's, and a row carrying\
  \ it\n  would double-count under the fold's own summation.\n- `outcome`: proceed\
  \ | hold | owner-held | terminal | malformed | no-answer — the round's single\n\
  \  per-round outcome row (rule 4's precedence). `malformed` only for the FIRST,\
  \ re-run malformed\n  round; `no-answer` is NOT in the terminal set, so an episode\
  \ folding it stays OPEN.\n- `terminal_reason`: open-ids-at-r2 | malformed-exhausted\
  \ | non-admissible-verdict | target-closed —\n  present iff `outcome: terminal`.\
  \ `target-closed` is the one member NO round ever emits: it is\n  DERIVED by the\
  \ fold from the target's own closure (a task's `closed_at`, a plan's FSM terminal),\n\
  \  because a round cannot know its subject will later close.\n- `non_admissible`:\
  \ red-proceed | zero-survivors | multiple-survivors | survivor-not-offered — names\n\
  \  the shape of a rule-4 pre-matrix non-admissible response.\n\nThe three PRE-AUDITOR\
  \ refusals (`hand-framed-options`, `episode-busy`, `episode-ended`) are NEVER\n\
  rounds: they are journaled by the verb's existing refusal emit and produce no\n\
  `external_audit_completed` row at all (rule 9 / C4.2).\n\n**`duration_ms` — REQUIRED\
  \ on EVERY audit completion row.** It is present on\n`audit_pre_completed`, `audit_post_completed`\
  \ and `external_audit_completed` alike, on every emit\npath — the pre/post gate,\
  \ the ad-hoc consult, the ceiling-convergence consult, the aspect audit and\nthe\
  \ plan gate — and it has exactly ONE definition across all of them: **the monotonic\
  \ wall in ms\nsince that path's own `audit_prompt_sent`**, or since the invocation's\
  \ monotonic start on a path\nthat sends no prompt (a consult-governed or unchanged-fingerprint\
  \ carry-forward invokes no auditor).\nSource: the single `_audit_duration_ms(started)`\
  \ helper in `bin/lib/audit.py`, called at each\ncompletion emit.\n\n**The plan gate's\
  \ anchor.** A plan-gate audit — a plan check, or a gate a plan-stage\nadvance asks\
  \ — journals no prompt row of its own, so neither arm above names it. Its anchor\
  \ is the\nmoment the prompt is handed to the auditor, the same moment the task paths\
  \ journal theirs; the wall\ntherefore covers the reserve's run as well where the\
  \ primary did not answer. A plan-gate save that\ninvokes no auditor reads from the\
  \ invocation's start, as above. The plan lifecycle's own gate row,\n`draft_checked`,\
  \ carries the same reading as an ADDITIVE key — where one run writes both rows they\n\
  state one value. That type is not on the required roster above: a row written before\
  \ this clause\ncarries none and is not a violation.\n\n**The plan gate's prompt\
  \ size.** A plan-gate audit also records how large the prompt it\nhanded the auditor\
  \ was, as two ADDITIVE, REPORT-ONLY keys: `prompt_bytes` (the total UTF-8 size)\n\
  and `prompt_parts_bytes`, which splits that total into `plan_body` (the plan body),\
  \ `cut_cards`\n(the filed card set a decomposition gate audits), `corpus` (the accept-gate\
  \ block of draft specs\nand their comparands) and `lens_template` (everything else\
  \ — the lens, the FSM line, the gate\ntemplate, headings and engine context). `lens_template`\
  \ is the remainder, so the four parts always\nsum to the total. A plan check writes\
  \ them on its gate row, `draft_checked` — it writes no\ncompletion row; a plan-stage\
  \ gate writes the same values on both its `draft_checked` and its\n`external_audit_completed`\
  \ row. No reader decides anything on them. They are absent on a save that\ninvoked\
  \ no auditor and on rows written before this clause.\n\n**This SUPERSEDES the narrower\
  \ pre- reading** (§Auditor-side observation fields, where the\nkey meant the `_invoke_auditor`\
  \ call wall alone). That reading held on ONE path: 0 of 558\nad-hoc and 0 of 752\
  \ consult rows carried the key at all, so an audit stage's wall could not be split\n\
  into machine time and worker time (deviation `audit-duration-ms-absent-on-adhoc-and-consult-paths`,\n\
  retired). The call wall survives as an internal measurement and is no longer journaled;\n\
  one field defined one way beats a per-path reading. **Recovering a duration by pairing\n\
  `audit_prompt_sent` → completion rows is now a READ-ONLY FALLBACK for PRE- rows\
  \ only** — for\nrows emitted since, read the field.\nPer, when the audit targets\
  \ a DECISION the payload carries `target_kind: \"decision\"` +\n`target_id: \"D-XXXX\"\
  ` as the AUTHORITATIVE carrier; `task_id` is legacy/optional but STILL active\n\
  : `bin/yitc-v2` emits top-level `task_id` and the journal/graph still index by it,\
  \ so it\nmirrors the id for current readers; `target_id` is the source of truth\
  \ and `task_id` goes nullable only\nonce consumers read `target_id` — not yet. For\
  \ a task audit `target_kind` defaults to `task` (additive —\nconsumers ignore unknown\
  \ keys P5-safe).\n**Auditor-side observation fields (per SPEC-0135 §4 — additive,\
  \ OPTIONAL, P5-safe).** On an AUDITED\ntask this event ALSO carries — WHEN available\
  \ — the normalized AUDITOR identity, so the observation\nloop can roll the worker\
  \ (`session_started`) and auditor up to the **worker×auditor PAIR** the CHARTER\n\
  §P4 different-providers rule already establishes: `provider` / `model` / `effort`\
  \ (the same normalized\ntriple defined in §Normalized provider×model×effort vocabulary,\
  \ resolved for the auditor). The\n`duration_ms` key rides the same row but is NO\
  \ LONGER one of these optional observation fields: it is REQUIRED on every audit\
  \ completion row and means the prompt-sent-anchored PATH wall,\nnot the auditor\
  \ call's wall-clock (read that definition in §Required event types, not this one;\
  \ the\n never-a-fabricated-0 discipline still governs every OTHER optional timing\
  \ key).\nIdentity + timing raw facts ONLY — no usage/cost is journaled (SPEC-0135\
  \ §3;\ncost is the read-time `token-rollup` × `pricing-config` derived view). Each\
  \ key OMITTED when the\nauditor config yields no signal (or `\"unknown\"` per the\
  \ vocab fallback). Additive / P5-safe.\n\n**plan_draft_finalized** (plan DRAFT-stage\
  \ END verb `plan draft --finalize`):\n`data: {slug, body_hash, reads_verified, sections_filled,\
  \ sections_missing}` — records that the\ndraft END verb ran with its doctrine read-gate\
  \ satisfied. `reads_verified` is the CREDITED FETCH\nSET the <workshop-spec> read-gate\
  \ actually credited for this session — derived from the LIVE\n`plan-stage-entry:draft`\
  \ bundle, never an enumerated fixed pair (the bundle's membership is\nwhatever binds\
  \ that axis at the time, so it grows/shrinks with the corpus). It is EMPTY when\
  \ the\ngate credited nothing — the vacuous-gate case a `-C` consumer with NO `plan-stage-entry`\
  \ bindings\nhits, where the gate returns on its graceful-empty branch: an empty\
  \ list is the HONEST record of\nthat run, NOT breakage or a lost read. THIS EVENT\
  \ IS the\nbody-bound worked-through proof (provenance — only `plan draft --finalize`\
  \ emits it): `plan stage\nspecs` REQUIRES a fresh one whose `body_hash` matches\
  \ the current draft body (SPEC-0034 §draft/§specs,\nSPEC-0059 §First-stage-check-carrier-gap).\
  \ Append-only + P5-safe\n(consumers ignore unknown keys).\n\n**task_closed** (Stage\
  \ 9):\n```jsonc\n{\"ts\": \"\", \"type\": \"task_closed\", \"task_id\": \"\",\n\
  \ \"data\": {\"commit\": \"<sha>\", \"probe_passed\": true, \"probes\": [{\"ac\"\
  : \"AC1\", \"result\": \"pass\"}]}}\n```\n**Outcome observation fields (per SPEC-0135\
  \ §3/§5 — additive, OPTIONAL, P5-safe).** `task_closed` MAY\nadditionally carry\
  \ raw OUTCOME facts the observation loop counts (never a composite score — SPEC-0135\n\
  §5 fence): `class` (str — the task's `class:`, e.g. `infra` | `product` | …, so\
  \ outcomes slice by kind),\n`audited` (bool — whether the task ran the external-audit\
  \ stages), `audit_passes` (int — the audit-loop\npass count reached, the discipline-friction\
  \ proxy). All OPTIONAL raw facts / join keys only — no derived\nscore, no usage/cost\
  \ (SPEC-0135 §3). Each OMITTED when unavailable; additive / P5-safe.\n\n**`exempted_case`\
  \ — the CLOSURE end of the SPEC-0178 restoration join (additive, OPTIONAL).** A\
  \ card\nclosed under a project-declared `audit_scrutiny` exemption case carries\
  \ `exempted_case: <case name>`\n— the name of the case whose declaration let it\
  \ close without audit-post (SPEC-0178 rule 4). OMITTED\nwhen the card closed under\
  \ no case, so the key's presence is itself the honest signal.\n**The exact NAME\
  \ is load-bearing, not cosmetic:** SPEC-0178 rule 5 computes a case's RESTORED/ACTIVE\n\
  regime by joining an attribution to this field, so a closure record spelling it\
  \ anything else\n(`case`, `audit_exemption`) is INVISIBLE to that join even though\
  \ a human reading the row would see\nthe case perfectly well. **This is also why\
  \ the ordinary unknown-key tolerance ( — consumers\nignore unknown keys) does NOT\
  \ excuse leaving it uncatalogued:** tolerance is the right rule for a key\na reader\
  \ may safely IGNORE, and this one is the opposite — a reader that treats it as an\
  \ unknown\nextra computes the wrong regime, and a case that should have been restored\
  \ keeps running.\n**Provenance discipline, inherited from the sibling keys:** `exempted_case`\
  \ is ATTRIBUTION, so —\nexactly like `captured_via` and `actor` on the capture event\
  \ below — it MUST NOT enter any\n`fingerprint`. A fingerprint absorbing the case\
  \ name would fragment one recurrence class across\ncases and blind the very feedback\
  \ rule 5 depends on.\n\n**deviation_captured** (capture model AGENTS.md; established,\
  \ renaming `friction_captured` — the ONE capture event for any\nnonconformity; CLI-emitted\
  \ by `event` + `audit run`):\n```jsonc\n{\"ts\": \"...\", \"type\": \"deviation_captured\"\
  , \"task_id\": \"T-XXXX | E-XXXX | null\",\n \"data\": {\"kind\": \"defect|friction|improvement\
  \ (OPTIONAL at capture — decided in triage, SPEC-0056; established by §2)\",\n \
  \         \"relates_to\": \"<failure-class id and/or aspect>\",\n          \"impact\"\
  : \"<WHAT is not as it should be — the deviation itself, in one subject-bearing\
  \ line>\", \"fingerprint\": \"<source-INDEPENDENT recurrence key>\",\n         \
  \ \"finding\": \"<one-line, present when via audit run>\", \"refs\": [\"events.jsonl#ts=...\"\
  , \"<git-sha>\"],\n          \"captured_via\": \"manual | cli | audit-run | inspection\"\
  ,\n          \"class\": \"<OPTIONAL CHARTER §AI failure class id 1..20 (SPEC-0023)\
  \ — int, \\\"N\\\" or \\\"#N\\\"; stored as the int >\",\n          \"actor\": \"\
  <WHO captured it — DERIVED at emit, never asked for + never caller-supplied >\"\
  ,\n          \"inspection_theme\": \"<T1..T8 — present WHEN captured_via:inspection,\
  \ per SPEC-0057 (established)>\",\n          \"inspection_run_ref\": \"<the inspection\
  \ run's inspection_completed ts/ref — present WHEN captured_via:inspection>\"}}\n\
  ```\n**`class` is the OPTIONAL failure-class instrument.** When present it MUST\
  \ be a CHARTER §AI\nfailure class id — the SPEC-0023 table, ids 1..20, given as\
  \ an int, \"N\" or \"#N\" and stored as the int;\nfree text, 0, 21 or any other\
  \ token is REFUSED at the `event` write naming the valid set (the realm\ncheck's\
  \ fail-closed family). ABSENT stays legal and is never a gate — capture is a reflex\n\
  ( §2); nothing guesses a class and old captures are not back-filled. It is a classification\
  \ of\nthe capture, not its identity, so it MUST NOT enter the `fingerprint`. `triage\
  \ run` Section A prints a\n`class histogram:` over the window (ids ascending, then\
  \ `unclassed`) and a `class:` label on each row\nthat carries one — the T3 slip-tally\
  \ instrument; a legacy non-id value reads as unclassed.\nAppend-only + P5-safe (consumers\
  \ ignore unknown keys). Event-only by default; a recurring\nfingerprint (N>=2) or\
  \ a hard defect promotes to an `errors/E-XXXX.yaml` case file. `captured_via` is\n\
  provenance ONLY — it MUST NOT enter the `fingerprint` (else recurrence fragments\
  \ across sources).\n**`impact` is the CONTENT key — WHAT is not as it should be,\
  \ not how bad it is (reconciling\nthis line with the code that has governed it since).**\
  \ Until this amend the placeholder above\nread as a SEVERITY ENUM — the three severity\
  \ words, or a time-cost bucket (the verbatim string is in\ngit history at this line,\
  \ deliberately not reproduced here so the AC1 probe grep stays clean). That\nwas\
  \ never what the field carried, and it contradicted this spec's OWN body — the `fingerprint`\n\
  derivation paragraph just below already said «a bare severity word is not a recurrence\
  \ key, but a\nDESCRIPTIVE impact is often a capture's only subject». Reconciled\
  \ here so the\nschema stops teaching the opposite of what the readers do. THE CODE,\
  \ which is the reconciliation\ntarget — prose preference is not: `bin/lib/journal.py#untriageable_impact`\
  \ treats an\n`impact` that is PRESENT but subjectless — blank, or a bare token from\
  \ `error.ERROR_SEVERITIES`,\nwhich is exactly the `(\"low\", \"medium\", \"high\"\
  )` tuple the old placeholder prescribed — as\nUNTRIAGEABLE: callers WARN on it and\
  \ `#derived_fingerprint` excludes it, so the prescribed literal\nwas the one value\
  \ the code\nrefuses to act on. An ABSENT `impact` is NOT flagged (fingerprint-only\
  \ captures stay acceptable by\ndesign), and the WARN never gates — capture is a\
  \ reflex. And\n`bin/lib/journal.py#CAPTURE_CONTENT_KEYS` makes `impact` the canonical\
  \ WRITE key of the\ncapture-content vocabulary, ordered second only behind the accessor's\
  \ own output key. THE CORPUS\nagrees, measured twice: folded 5538 of 5967 rows carrying\
  \ `impact` (92.8%); re-folded\n2026-09-04 over the segment-aware `journal query`\
  \ reader and classified by importing\n`untriageable_impact` itself rather than re-typing\
  \ its vocabulary, n=6443 — 6003 carry `impact`\n(93.2%), 5763 are subject-bearing\
  \ (89.4%), and only 240 are blank-or-bare-severity. The enum this\nline prescribed\
  \ described under 4% of what authors actually write. **Severity did not move to\
  \ another\nkey — it is simply not part of this payload:** where a severity IS wanted\
  \ it is the promoted\n`errors/E-XXXX.yaml` case file's `severity:` (the `ERROR_SEVERITIES`\
  \ vocabulary's real home), decided\nat triage like `kind`, never asserted at capture.\
  \ IN-PLACE amend, not a supersede (SPEC-0005 rule 7):\nno already-covered case's\
  \ required behaviour changes — this restates the obligation the code has\nenforced\
  \ all along.\n**`fingerprint` is ALWAYS PRESENT on a capture emitted since — DERIVED\
  \ when the author\nsupplied none, never absent and never refused.** An author-supplied\
  \ fingerprint is stored\nbyte-for-byte and nothing below applies to it; this covers\
  \ only the case the schema previously left\nopen, where the key was simply missing.\
  \ It was left open because the fingerprint is OPTIONAL at\ncapture by design — capture\
  \ is a one-command reflex — but every routing carrier is\nkeyed BY fingerprint (a\
  \ task `cites:`, a cross `origin_fp`, an `errors/E-XXXX.yaml` file), so a row\n\
  without one could never be routed: `triage run` counted it, showed it, WITHHELD\
  \ it from the\n`--complete` route set, and advanced the watermark past it regardless\
  \ (SPEC-0055 §Triage run). The\nloss was ROUTING, not data — such rows persist and\
  \ `journal query --grep` finds them — but it was\nsilent, and 92 rows had accrued\
  \ in the 2026-08-30 window, all through the sanctioned CLI path.\nThe emit therefore\
  \ DERIVES one (`bin/lib/journal.py#derived_fingerprint`, pure + total): from the\n\
  caller's substantive payload where there is any — so two captures of ONE deviation\
  \ derive ONE key\nand recurrence-matching still works — else from the row's own\
  \ envelope (ts + task_id + actor),\nwhich is unique per row rather than a shared\
  \ constant that would fabricate a recurrence class. A\nderived row carries **`fingerprint_derived:\
  \ true`**, so a reader can tell a key the author CHOSE\nfrom one the verb COMPUTED.\
  \ The provenance/attribution exclusions above are OBSERVED by the\nderivation (`captured_via`\
  \ / `actor` / `exempted_case` never enter it), as is `kind` — a closed\nvocabulary\
  \ decided at TRIAGE (SPEC-0056 §1), which would otherwise let one deviation derive\
  \ two\nkeys depending on a later judgement. `impact` enters only when it carries\
  \ a subject\n(`journal.untriageable_impact`): a bare severity word is not a recurrence\
  \ key, but a DESCRIPTIVE\nimpact is often a capture's only subject and excluding\
  \ it would strand exactly those rows in the\nenvelope arm. DERIVE rather than REFUSE\
  \ is the deliberate choice: refusing would trade an\nunroutable capture for a LOST\
  \ one, and gating the reflex is the worse defect (the posture).\nThis is ADDITIVE\
  \ — a case the schema did not previously answer gains an answer; no already-covered\n\
  case's compliance changes (SPEC-0005 in-place amend).\n**`exempted_case` — the ATTRIBUTION\
  \ end of the SPEC-0178 restoration join (additive, OPTIONAL).** A\ncapture MAY carry\
  \ `exempted_case: <case name>`, naming the project-declared `audit_scrutiny` case\n\
  this deviation is attributed to (SPEC-0178 rule 5). It is the BELT for a capture\
  \ the derived join\ncannot compute — one with no `task_id`, or one naming a card\
  \ that closed under no case; where a\nderived case exists it is canonical, and where\
  \ the two disagree neither wins and the capture\nsurfaces at triage carrying both.\
  \ This is the SAME key name the closure end carries above\n(`task_closed.data.exempted_case`),\
  \ deliberately: the regime is computed by joining the two, so ONE\ncanonical name\
  \ on both ends is what makes the join computable at all, and a documented capture\
  \ key\nbeside an undocumented closure key would leave its load-bearing half unreadable.\
  \ Like\n`captured_via` and `actor` it is provenance/attribution ONLY and MUST NOT\
  \ enter the `fingerprint`,\nor one recurrence class fragments per case.\n**`actor`\
  \ — WHO captured it (extending to this last emit site).** DERIVED host-side\nat\
  \ the emit from the launch context (`bin/lib/memory.py#resolve_actor` over the host\
  \ registry `users:`\nblock) — the SAME seam behind `task file`'s `created_by` (SPEC-0028),\
  \ `followup add` (SPEC-0095) and\n`cross request` (SPEC-0086). Attribution costs\
  \ the human ZERO added input, so it is never asked for;\nand it is never CALLER-supplied\
  \ — `actor` is a RESERVED `--data` key (`bin/yitc-v2#RESERVED_DATA_KEYS`),\nso a\
  \ forged identity is REFUSED, not silently overwritten (fail-CLOSED on vocabulary:\
  \ only a\nregistry-provisioned name is ever stamped, free text never reaches the\
  \ field). It is a RECORD, NEVER a\ngate: an unknown user / empty identity / unreadable\
  \ registry degrades to `ai-agent` (the historical\ndefault — the ~1000 existing\
  \ kernel captures keep their meaning), so attribution can never block the\ncapture\
  \ reflex. Like `captured_via` it is provenance ONLY and MUST NOT enter the\n`fingerprint`\
  \ — two capturers of one class share one recurrence key. Surfaced suppressed-when-clean\n\
  (a real PERSON only, per `memory.py#is_named_actor`) in the triage routing window\
  \ — SPEC-0056 §1.\n**Inspection findings (per SPEC-0057 §7; established by §7):**\
  \ an inspection finding is captured here like\nany other nonconformity — `captured_via:\
  \ inspection` + the two provenance keys above — and routes\nthrough the SAME SPEC-0056\
  \ triage pipeline (no special-casing). **Metric split:** a `deviation_captured`\n\
  counts a **FINDING**; an `inspection_completed` counts a **RUN** — they are different\
  \ event types read\nby different counters and are **NEVER summed** (there is no\
  \ aggregation that adds them; the recurring/\nfinding counter filters to capture\
  \ events only, so it cannot see a run-event).\n**`friction_captured` is the RETIRED\
  \ legacy name** — read-only: readers (e.g. the recurring-fingerprint\nreport) parse\
  \ BOTH so historical lines keep counting; new captures write `deviation_captured`\
  \ only.\n\n**error_filed / error_promoted** ( — emitted by `bin/yitc-v2 error file|promote`):\
  \ a case\nfile opened / resolved (file-or-waive). `data` carries `kind|severity|fingerprint`\
  \ (filed) or\n`resolution|status` (promoted).\n\n**triage_run_completed** (per SPEC-0055;\
  \ established by §3 — the slow-lane **watermark**; emitted by the triage verb) —\
  \ marks the boundary of a triage run over un-routed `deviation_captured` captures.\
  \ The NEXT\nrun's routing depth = the window SINCE this watermark; **no watermark\
  \ yet → scan from the journal\nstart**; the watermark is a **closed boundary** (excluded\
  \ from the next window) so each capture routes\nexactly once (QUEUE.md §Triage-run\
  \ window). `task_id` null.\n```jsonc\n{\"ts\": \"...\", \"type\": \"triage_run_completed\"\
  ,\n \"data\": {\"routed\": 7, \"linked\": 3, \"promoted\": 1, \"window_since\":\
  \ \"<ts of prior watermark | null>\",\n          \"window_through\": \"<routed-boundary\
  \ max ts | null>\", //\n          \"routes\": [{\"ts\": \"...\", \"fingerprint\"\
  : \"<fp>\", // — per-capture\n                      \"target_kind\": \"task|decision|cross\"\
  , \"target_id\": \"T-…|D-…|X-…\"}]}}\n```\n`routed`/`linked` are DERIVED from `routes`\
  \ (the per-capture capture->target audit-trail):\n`routed` = #routed capture events,\
  \ `linked` = the cites-owned (task/decision) subset; `promoted`\nstays operator-supplied.\
  \ `routes` is OMITTED when the window routed nothing (additive, P5-safe unknown-key\
  \ tolerance). The capture->target link is READ from the already-persisted carriers\n\
  (a task `cites:` the fp, a cross carries it as `cross_requested.origin_fp`), not\
  \ a new store.\nAppend-only, P5-safe. Until ships the verb, it is emittable via\
  \ the generic `event` verb. A\n`data.probe: true` watermark is a **schema-probe,\
  \ NOT a real routing boundary** — the triage window\ncomputation MUST exclude `probe:\
  \ true` watermarks when finding the last boundary.\n\n**inspection_completed** (per\
  \ SPEC-0057 §6; established by §6 — RUN-accounting for a periodic **inspection**;\n\
  \ defines it emits the first real one). Emitted **exactly once per inspection run,\
  \ even on\nzero findings** (proof-of-performance). It counts **RUNS** — never summed\
  \ with the `deviation_captured`\nFINDINGS the run routes into the SPEC-0056 sink\
  \ (the two metrics stay split, SPEC-0057 §7). `task_id` null.\n```jsonc\n{\"ts\"\
  : \"...\", \"type\": \"inspection_completed\",\n \"data\": {\"theme\": \"T1\", \"\
  findings_count\": 4, \"high_count\": 1,\n          \"lenses_covered\": [\"doc-anchor-resolve\"\
  , \"rule-extraction\"],\n          \"criteria_ref\": \"patterns/inspection-criteria-roster.md#T1@<sha256[:12]>\"\
  , // — checklist-hash\n          \"no_data\": false, // <workshop-spec> rule 1 —\
  \ did the run produce a verdict at all\n          \"tracks_covered\": [\"primary\"\
  , \"external\"], // — WHICH tracks ran (see below)\n          \"notes\": \"<free-text\
  \ findings>\"}} // — `inspect record --notes`; absent when not given\n```\n**`tracks_covered`**\
  \ (per SPEC-0057 §Run-mode) records **which of the declared tracks actually\nran**\
  \ for that subject — the vocabulary is the two names the run-mode fixes, `primary`\
  \ and `external`, in\nthat order. It is written on EVERY run, and an empty list\
  \ means the run did NOT SAY what its coverage was;\na READER treats an empty list\
  \ AND an ABSENT field (every record predating this) as **UNRECORDED — never\nas\
  \ a claim that both tracks ran**, since inventing coverage for a run nobody described\
  \ would put a\nstronger claim in the journal than was ever made. It exists because\
  \ the dual-track discipline is the\nload-bearing half of the inspection method while\
  \ its ABSENCE previously left no trace: on the 2026-08-13\ncycle `inspect record`\
  \ was emitted for T1 through T10 while only T5 and T7 had a second track, and those\n\
  eight events were indistinguishable here from converged ones.\n**It is COVERAGE,\
  \ not a grade** — not a colour, score or band, and deliberately NOT a record of\
  \ whether\nthe tracks CONVERGED (whether the two finding sets agreed is the operator's\
  \ compare-after-both-finish\njudgement, and storing it would be the per-theme verdict\
  \ SPEC-0057 §4 forbids). Consistently, a\nsingle-track run is suppressed NOWHERE:\
  \ unlike `no_data` it still anchors its subject's review-due clock,\nbecause gating\
  \ on a track count would derive exactly that forbidden judgement.\nThere is **NO\
  \ color/verdict field** — an inspection's evaluation IS its findings list, not a\n\
  GREEN/YELLOW/RED (SPEC-0057 §4 — a color floods RED and pushes toward scoring/bands);\
  \ the only per-theme\nsignal is the derived binary `open HIGH?`. Additive, P5-safe\
  \ (consumers ignore unknown keys).\nThe `inspect record` verb (SPEC-0057 §6) now\
  \ emits this event with a REAL **checklist-hash**\n`criteria_ref` — `<roster>#<theme>@<sha256[:12]>`\
  \ over the theme's living lens-checklist section in\n`patterns/inspection-criteria-roster.md`,\
  \ so editing the checklist changes the hash and a stale theme\nrun is detectable.\
  \ It stays MANUAL-FIRST (owner-invoked, no cron — SPEC-0057 §2); the generic `event`\n\
  emit path remains valid (P5). A `data.probe: true` inspection_completed is a **schema-probe,\
  \ NOT a real run** (mirror of\ntriage_run_completed) — would be excluded from a\
  \ future run-register view (a saved-view over\nthese events), which is DEFERRED\
  \ until a real pull (SPEC-0057 §6 — no such view exists in views/ yet; established\
  \ by §9).\n\n**`spec_reverified`** (E-0019 kind-B) — emitted by `bin/yitc-v2 spec\
  \ reverify <SPEC>`\nafter it records the durable content-signature freshness baseline.\
  \ `task_id` = the reverified SPEC\nid; `data` = `{path, status, signed: [<anchor>...],\
  \ unsignable: [<anchor>...]}`. Append-only,\nnon-gated. The blessed signatures live\
  \ on the spec's `implements_signature:` field (SPEC-0006).\n\n**commit_landed**\
  \ — emitted by BOTH commit verbs so every real git commit leaves a journal event\n\
  : `task commit` emits it WITH `task_id` set; `work commit` emits it with NO `task_id`\
  \ (the\ncommit is not task-tied) + `data.kind: \"work\"` to disambiguate. `data.commit`\
  \ = short sha, recorded through the ONE\ncustody-sha helper `audit.recorded_sha`\
  \ : `git rev-parse --short=7` — 7 characters, WIDENED\nby git where 7 would be ambiguous\
  \ in that repo, and the full sha where git cannot answer — never a\nblind 7-character\
  \ slice. Every custody row's `commit` takes the same value: `audit_<stage>_completed`,\n\
  `external_audit_completed`, `task_closed` (and the card's `commit:`), the `custody_repin_*`\
  \ keys, and\n`live_trigger_evidence --commit`, which alone refuses before append\
  \ a value that is no commit of the\nrepo or is ambiguous. A row written before may\
  \ still carry an ambiguous 7-character prefix;\nits readers resolve it per SPEC-0015\
  \ §Internal (the ambiguous-recorded-prefix rule).\n\n**deploy_completed** (per SPEC-0094\
  \ §1; emitted by `bin/yitc-v2 deploy`) — the governed\ndeploy-adoption record. Emitted\
  \ ONLY after the project-declared `deploy:` / `rollback:` command (the\nexecutable\
  \ smoke/health gate, from `yitc-ops.yaml` / SPEC-0093) exits 0 — a non-zero gate\
  \ leaves NO\n`deploy_completed` (the broken revision is never recorded live). A\
  \ deploy whose command STARTED leaves\nexactly ONE terminal row: where it then failed\
  \ or was interrupted and no other terminal row\n(`deploy_convergence_failed` / `deploy_security_probe_post_failed`,\
  \ SPEC-0097) records how it ended, that\nrow is a **deploy_failed** (revision, project,\
  \ kind, the last step reached, and the exit code or caught\nsignal; `task_id` null)\
  \ — never adoption evidence; its record contract is homed in SPEC-0094 §1\n. Emitted\
  \ on EVERY deploy AND every rollback, so the\njournal names the current-live revision\
  \ — WHICH record that is (the latest PRODUCTION one) is the\nrule of SPEC-0094 §1,\
  \ pointed at here and not restated. `task_id` null (a\ndeploy is project-level,\
  \ not task-tied).\n```jsonc\n{\"ts\": \"...\", \"type\": \"deploy_completed\",\n\
  \ \"data\": {\"revision\": \"<git-sha left live + gate-verified>\", \"project\"\
  : \"<slug>\",\n          \"kind\": \"deploy\" | \"rollback\"}}\n```\nAppend-only,\
  \ P5-safe (consumers ignore unknown keys). The presence of this event is what\n\
  distinguishes a GOVERNED deploy-via-verb from an off-path direct script run (which\
  \ leaves no\n`deploy_completed`) — AGENTS §Verb-execution discipline.\n\n**security_audit_scope_stale**\
  \ (per SPEC-0145 §5; emitted by `bin/yitc-v2 deploy` at the security\nseam — `bin/lib/deploy.py#_run_security_audit_seam`)\
  \ — the record of a CLASS-A deploy that\nPROCEEDED over a security report whose\
  \ profile check-set is a strict SUBSET of the CURRENT required\nset. The gate PASSED\
  \ (class A is code-only and trivially reversible — SPEC-0097 §2), so there is no\n\
  refusal to read anywhere else; THE ROW'S PRESENCE IS THE SIGNAL, and it is the only\
  \ durable trace\nthat the ship was judged against a narrower profile than the project\
  \ now carries. Emitted at most\nonce per deploy, AFTER `deploy_security_gate_passed`,\
  \ and ONLY for class A — every other class, and\nthe cadence path, is REFUSED by\
  \ the gate and emits nothing. `task_id` null (a deploy is\nproject-level, not task-tied).\n\
  ```jsonc\n{\"ts\": \"...\", \"type\": \"security_audit_scope_stale\",\n \"data\"\
  : {\"class\": \"A\", \"report_hash\": \"<the report's own content-hash>\",\n   \
  \       \"current_check_set_hash\": \"<the check_set_hash of the CURRENT resolution>\"\
  }}\n```\nThe two hashes are what make the row answerable rather than merely alarming:\
  \ `report_hash` names the\nexact evidence that was accepted and `current_check_set_hash`\
  \ names the profile it fell short of, so\na reader can tell WHICH report and HOW\
  \ MUCH later without re-deriving anything. Catalogued here\nbecause a reader that\
  \ treats the row as an unknown extra cannot answer the one question it exists\n\
  for. Read off the gate's OWN published verdict (`SECURITY_GATE_VERDICT_FILE`), never\
  \ re-derived at\nthe seam.\n\n**born_permissive_ratified** (per SPEC-0189 rule 8;\
  \ emitted by `bin/yitc-v2 -C <repo> init` —\n/, key corrected) — the RATIFICATION\
  \ record for a born declaration that RELAXES\na control. Rule 8 writes such a declaration\
  \ ONLY against an explicit human confirmation, and this row\nis that act's journal\
  \ face: one row per confirmed concern section, emitted on BOTH born-declaration\n\
  write paths (the fresh-birth body and the SPEC-0093 rule-11 carrier update). `task_id`\
  \ null (a birth\nis project-level). Emitted only AFTER the init sweeps pass, so\
  \ a refused init leaves no row.\n```jsonc\n{\"ts\": \"...\", \"type\": \"born_permissive_ratified\"\
  ,\n \"data\": {\"concern\": \"<carrier section, e.g. audit_scrutiny>\", \"owner\"\
  : \"<the confirming handle>\",\n          \"confirmation_source\": \"flag\" | \"\
  prompt\", \"spec\": \"<the concern's declaring spec id>\"}}\n```\n**The route key\
  \ is `confirmation_source`, NOT `source`** — the envelope writer stamps `data.source`\n\
  with the WRITER tag on every row (`append_event`), so a payload key of that name\
  \ is clobbered before\nany reader sees it; the two are different questions (which\
  \ ROUTE ratified vs which PROGRAM wrote the\nrow) and the row carries both. The\
  \ ratification RECORD itself lives in the consumer's\n`yitc-ops.yaml` `adoption:`\
  \ entry under the confirming handle — this row is the journal witness of\nit, never\
  \ its source of truth.\n\n**release_tagged** (per SPEC-0122 release act; emitted\
  \ by `bin/yitc-v2 work tag`) — the\ngoverned release-tag record. Emitted when the\
  \ verb creates an annotated git tag on a LANDED main\ncommit, so a release (a registered\
  \ shared-lib project releases → consumers move their pin, SPEC-0122)\nis journal-visible.\
  \ `task_id` null (a release is project-level, not task-tied). Create+emit are\n\
  failure-atomic: a tag never exists without this event.\n```jsonc\n{\"ts\": \"...\"\
  , \"type\": \"release_tagged\",\n \"data\": {\"tag\": \"<annotated tag name, e.g.\
  \ v1.2.0>\", \"sha\": \"<full sha of the tagged main commit>\",\n          \"project\"\
  : \"<slug>\"}}\n```\nAppend-only, P5-safe (consumers ignore unknown keys). Its presence\
  \ is what distinguishes a\nGOVERNED release-via-verb from an off-path raw `git tag\
  \ -a` (which leaves no `release_tagged` — the\nX-0354 untracked-release gap) — AGENTS\
  \ §Verb-execution discipline.\n\n**release_published** (per SPEC-0195 rule 5; emitted\
  \ by `bin/yitc-v2 work publish`) — the\nrelease PUBLISH record: the SPEC-0073 kernel-realm\
  \ slice was cut at a governed tag's peeled commit and\nwritten, with its manifest,\
  \ into a destination checkout as one history-free commit. `task_id` null (a\nrelease\
  \ is project-level, not task-tied), so a P8 reference to it takes the\n`release_published@<iso-ts>`\
  \ pinned form.\n```jsonc\n{\"ts\": \"...\", \"type\": \"release_published\",\n \"\
  data\": {\"tag\": \"<the source release tag>\", \"source_sha\": \"<full sha of the\
  \ peeled commit>\",\n          \"tree_digest\": \"<sha256 of the artifact tree,\
  \ EXCLUDING the manifest>\",\n          \"destination\": \"<absolute path of the\
  \ destination checkout>\",\n          \"file_count\": <files in the cut>}}\n```\n\
  The pair `release_tagged` -> `release_published` is a release's journal-visible\
  \ provenance: the first\nsays WHICH commit was blessed, the second says what was\
  \ actually cut from it and to what digest.\nBecause the cut is a pure function of\
  \ the peeled commit, re-publishing the same tag emits a row\ncarrying the SAME `tree_digest`\
  \ — so a differing digest for one tag is a real signal, not noise.\n\n**release_verified**\
  \ / **release_installed** (per SPEC-0195 rules 6+7; emitted by `bin/yitc-v2\nrelease\
  \ verify` and `release install`) — the CONSUMER-side half of the same provenance:\n\
  where the two rows above record what the publisher CUT, these record what an installation\
  \ actually\nCHECKED, and against which out-of-band anchor. `task_id` null (an install\
  \ is project-level), so a\nP8 reference takes the `release_verified@<iso-ts>` pinned\
  \ form.\n```jsonc\n{\"ts\": \"...\", \"type\": \"release_verified\",\n \"data\"\
  : {\"destination\": \"<the published release directory>\",\n          \"anchor\"\
  : \"<the OUT-OF-BAND trust-root fingerprint the adopter pinned>\",\n          \"\
  ok\": <true|false>, \"signing_key\": \"<SHA256:... or null>\",\n          \"tag\"\
  : \"<the manifest's source_ref, or null>\",\n          \"reasons\": [\"<refusal\
  \ reason>\", \"...\"]}}\n```\n`release_installed` carries the same keys plus `into`\
  \ (the directory the verified release was\ninstalled into).\n\n**release_updated**\
  \ (per SPEC-0195 rule 8; emitted by `bin/yitc-v2 release update` — the emit\nshipped\
  \ with, the verb reached the CLI with) — the THIRD adopter-side entrypoint's\nrow,\
  \ on the same terms as the two above: `task_id` null, emitted on refusal as well\
  \ as on success.\nIt carries the `release_installed` keys (`destination` / `into`\
  \ / `anchor` / `ok` / `signing_key` /\n`tag` / `reasons`) and adds the update's\
  \ OWN outcome — `from_ref` / `to_ref` (the release moved\nFROM and TO), the per-class\
  \ counts `replaced` / `merged` / `preserved` / `skipped` / `conflicts`\n(rule 8's\
  \ four classes plus the undecidable ones), the dropped-path counts `removed` / `kept`\n\
  (paths the previous release shipped and the new one no longer carries — deleted,\
  \ or left in place\nand named), and the SPEC-0196 override-ledger reading\n`ledger_status`\
  \ / `ledger_findings`. Those last two RIDE THIS ROW rather than emitting a second\n\
  one (CHARTER §P1 F2): \"did this update happen, and what did it find\" has one answer\
  \ and one row.\n```jsonc\n{\"ts\": \"...\", \"type\": \"release_updated\",\n \"\
  data\": {\"destination\": \"<the published release N+1 directory>\",\n         \
  \ \"into\": \"<the existing install being moved forward>\",\n          \"anchor\"\
  : \"<the OUT-OF-BAND trust-root fingerprint>\", \"ok\": <true|false>,\n        \
  \  \"from_ref\": \"<the release moved FROM, or null when no base was supplied>\"\
  ,\n          \"to_ref\": \"<the release moved TO>\",\n          \"replaced\": <upstream-owned>,\
  \ \"merged\": <template-owned>, \"preserved\": <n>,\n          \"skipped\": <consumer-owned,\
  \ never written>, \"conflicts\": <n>,\n          \"removed\": <dropped by the new\
  \ release, deleted>, \"kept\": <dropped, left in place>,\n          \"ledger_status\"\
  : \"<the SPEC-0196 override-ledger reading>\",\n          \"ledger_findings\": <n>,\n\
  \          \"reasons\": [\"<refusal reason>\", \"...\"]}}\n```\n\nALL THREE ROWS\
  \ ARE EMITTED ON REFUSAL AS WELL AS ON SUCCESS, and that is the point: a\nrefused\
  \ verification is the security-relevant event, so a journal that recorded only successes\n\
  would be silent about exactly the attempts worth reading. `ok: false` rows carry\
  \ the `reasons` the\noperator saw — a tampered artifact, a trust root that failed\
  \ against the anchor, a revoked signing\nkey named with its revocation.\n\n**live_probe_passed**\
  \ (per SPEC-0094 §4; emitted by `bin/yitc-v2 liveprobe`) — the\nper-change live-adoption\
  \ PROOF. Emitted ONLY when a task's declarative read-only `live_probe` GET\n(the\
  \ SPEC-0028 task-YAML assertion) returns the expected status (optional body-contains)\
  \ against\nproduction, run at the DEPLOY seam. A FAILING probe leaves NO event (the\
  \ change is NOT confirmed\nlive). `task_id` = the probed task (the proof is per-change,\
  \ unlike the project-level\n`deploy_completed`). The no-follow/redirect dialect\
  \ (SPEC-0094 §4) adds an OPTIONAL\n`location` field recording the matched immediate-redirect\
  \ `Location` (present only for an\n`expect_location` assertion against a redirect\
  \ status).\n```jsonc\n{\"ts\": \"...\", \"type\": \"live_probe_passed\", \"task_id\"\
  : \"T-XXXX\",\n \"data\": {\"task\": \"T-XXXX\", \"revision\": \"<git-sha at probe\
  \ time>\", \"project\": \"<slug>\",\n          \"url\": \"<resolved GET target>\"\
  , \"expect_status\": <int>, \"actual_status\": <int>,\n          \"location\": \"\
  <matched Location — OPTIONAL, no-follow redirect dialect only>\"}}\n```\nAppend-only,\
  \ P5-safe (consumers ignore unknown keys).\n\nThe SAME event type is emitted on\
  \ the ATTESTED REPORT path (per SPEC-0094 §4b) — a live\nproof the PROJECT itself\
  \ ran at its own gate, GRADED by the kernel, which issues no request of its\nown\
  \ on that path. Such a row is distinguished by `reported: true` + `attested` / `runs_at`\
  \ /\n`asserts` and carries NO `url` / `expect_status` / `actual_status` (there was\
  \ no kernel GET). Read\nthe flag, never the presence of a key, when telling the\
  \ two paths apart.\n\n**live_probe_failed** (per SPEC-0094 §4b; emitted by `bin/yitc-v2\
  \ liveprobe --report fail` —\n) — a RECORDED NEGATIVE READING of an attested project-run\
  \ proof. It exists because the\nalternative is worse than the gap it closes: without\
  \ it, a proof that ran and did NOT pass could\nonly be filed as absence, and permanent\
  \ silence would then read as health. It is NOT an adoption\nproof and never satisfies\
  \ one — it is the opposite — so it is deliberately absent from every\nprobe-evidence\
  \ set that discharges a debt, and a card recording it STAYS on the overdue-recheck\n\
  lens marked `failing`, with no date test. (Distinct from a failing kernel GET, which\
  \ still emits\nnothing at all: that path has no reported reading to record.)\n```jsonc\n\
  {\"ts\": \"...\", \"type\": \"live_probe_failed\", \"task_id\": \"T-XXXX\",\n \"\
  data\": {\"task\": \"T-XXXX\", \"revision\": \"<git-sha at report time>\", \"project\"\
  : \"<slug>\",\n          \"attested\": \"<the instrument the project ran>\", \"\
  runs_at\": \"<where it is gated>\",\n          \"asserts\": \"<what it proves>\"\
  , \"reported\": true,\n          \"detail\": \"<what the reading said — OPTIONAL>\"\
  }}\n```\nAppend-only, P5-safe (consumers ignore unknown keys).\n\n**task_live_probe_declared**\
  \ (per SPEC-0094 §3/§4b; the card field is the SPEC-0028 `live_probe`) —\nONE row\
  \ per GOVERNED write of a card's `live_probe` declaration, by the task verbs that\
  \ own it\n(`task update` sets an assertion or a waiver; `task close` settles a waiver,\
  \ declares or grades an\nattested proof). It is the record of the DECLARATION, never\
  \ of a reading — the proof itself is\n`live_probe_passed` / `live_probe_failed`\
  \ above, and this row discharges no debt. `form` names\nwhich act the row records:\
  \ `assertion` (a read-only GET the deploy seam will run) · `waiver`\n(no live probe,\
  \ with its `reason`) · `waiver-settled` / `waiver-unreachable` /\n`waiver-falsified`\
  \ (the waiver's recorded discharge, carried in `settled_by`) ·\n`attested-declared`\
  \ / `attested-graded` (a project-run proof declared, then graded with its\n`outcome`).\
  \ `replaced` is true when the write overwrote an earlier declaration.\n```jsonc\n\
  {\"ts\": \"...\", \"type\": \"task_live_probe_declared\", \"task_id\": \"T-XXXX\"\
  ,\n \"data\": {\"form\": \"assertion\", \"url\": \"<path or URL>\", \"expect_status\"\
  : <int>, \"replaced\": false}}\n{\"ts\": \"...\", \"type\": \"task_live_probe_declared\"\
  , \"task_id\": \"T-XXXX\",\n \"data\": {\"form\": \"waiver\", \"reason\": \"<why\
  \ no live probe>\", \"user_facing\": <bool>,\n          \"recheck_by\": \"<ISO-date\
  \ or null>\", \"replaced\": false, \"settled_by\": null}}\n```\nThe settle / attested\
  \ forms add `settled_by` / `attested` / `runs_at` / `asserts` / `outcome` as\nthe\
  \ form requires, plus `governing_contract`. Append-only, P5-safe (consumers ignore\
  \ unknown keys).\n\n**deploy_recheck_completed** (per SPEC-0149 §1) — the PROVEN\
  \ discharge of a post-deploy proof\nobligation: the delayed re-check a deploy owed\
  \ was performed. It matches its obligation on\n`(project, revision)` EXACTLY, and\
  \ discharges it only when it is not older than the deploy it\nproves (a re-deploy\
  \ of the same revision owes a fresh one). Recorded with the generic\n`bin/yitc-v2\
  \ event` verb — no dedicated verb; an abbreviated `revision` of a deployed revision\
  \ is\nREFUSED rather than appended, because it would discharge nothing. Its sibling\n\
  `deploy_recheck_missed` is the honest-miss discharge (SPEC-0149 §1a).\n```jsonc\n\
  {\"ts\": \"...\", \"type\": \"deploy_recheck_completed\", \"task_id\": null,\n \"\
  data\": {\"project\": \"<slug>\", \"revision\": \"<the full revision as deployed>\"\
  }}\n```\nAppend-only, P5-safe (consumers ignore unknown keys).\n\n**adapter_restamped**\
  \ (per SPEC-0125) — `init` re-stamped one or more consumer vendor-adapter /\nproject-context\
  \ homes whose title still carried the unfilled `<project>` placeholder with the\n\
  real project name. Project-level (no `task_id`); emitted only for a re-stamp actually\
  \ applied in\nthat run, riding init's own bootstrap commit.\n```jsonc\n{\"ts\":\
  \ \"...\", \"type\": \"adapter_restamped\", \"task_id\": null,\n \"data\": {\"path\"\
  : \"<consumer repo root>\", \"scaffolds\": [\"<vendor-adapter>.md\", \"...\"],\n\
  \          \"project_name\": \"<repo name>\"}}\n```\nAppend-only, P5-safe (consumers\
  \ ignore unknown keys).\n\n**security_live_probe_passed** (per SPEC-0098 §3; emitted\
  \ by `bin/yitc-v2 liveprobe` for a SECURITY\nlive-probe — the SPEC-0098 §1 header/cookie\
  \ dialect) — the Class-S adoption PROOF: a named security\nPROPERTY was asserted\
  \ read-only at the deploy seam and HOLDS (auth still required / no CORS header leaked\
  \ /\na required security header present / a session cookie host-only+Secure+HttpOnly).\
  \ Emitted ONLY on a PASS;\na probeable property that does NOT hold leaves NO event\
  \ (the security violation blocks adoption). The\n`data` payload is fixed by the\
  \ SPEC-0098 §3 contract — `{property, url, project, expect, actual}` — with\nNO\
  \ `task` key inside `data`; task identity rides the universal TOP-LEVEL `task_id`\
  \ (same as every\nlifecycle event), so attribution is not lost despite the contract-fixed\
  \ `data` shape.\n```jsonc\n{\"ts\": \"...\", \"type\": \"security_live_probe_passed\"\
  , \"task_id\": \"T-XXXX\",\n \"data\": {\"property\": \"<security-property name>\"\
  , \"url\": \"<resolved GET target>\", \"project\": \"<slug>\",\n          \"expect\"\
  : \"<asserted summary>\", \"actual\": \"<observed summary>\"}}\n```\n**security_live_probe_escalated**\
  \ (per SPEC-0098 §2/§3; emitted by `bin/yitc-v2 liveprobe`) — fail-closed\nowner-escalation\
  \ evidence: a declared security property CANNOT be asserted by a read-only GET (an\n\
  un-probeable `{property, unprobeable: <reason>}` live_probe form), so the deploy\
  \ escalates to the owner\nrather than silently passing. The runner emits this event\
  \ and exits non-zero — un-probeable is NEVER\ntreated as passed. `data` is fixed\
  \ by SPEC-0098 §3 — `{property, project, reason}`; task identity rides\nthe top-level\
  \ `task_id`.\n```jsonc\n{\"ts\": \"...\", \"type\": \"security_live_probe_escalated\"\
  , \"task_id\": \"T-XXXX\",\n \"data\": {\"property\": \"<security-property name>\"\
  , \"project\": \"<slug>\", \"reason\": \"<why un-probeable>\"}}\n```\nBoth are additive\
  \ + P5-safe (no existing event changes; consumers ignore unknown types/keys).\n\n\
  **host-config apply evidences** (per SPEC-0111 / SPEC-0094 §3; emitted by `bin/yitc-v2\
  \ hostapply` —\n) — the THREE task-scoped evidences the host-config three-evidence\
  \ close-gate requires. Each is\ncarry the PROVENANCE TAG `emitter: \"hostapply\"\
  ` in `data`; in normal governed operation ONLY the\nSPEC-0111 helper emits these\
  \ three types. The tag blocks ABSENT/INCIDENTAL evidence at the close-gate; it\n\
  is a provenance marker on the operator-trusted journal, NOT an unforgeable signature\
  \ (per-event\nanti-forgery is deliberately not added — CHARTER §P1, no incident;\
  \ the whole journal is operator-trusted).\nAll three carry the top-level `task_id`;\
  \ `data` always includes `{emitter: \"hostapply\", task, project}`.\n- **apply_confirmed**\
  \ — the OWNER human-apply confirmation (the manual-path form of evidence (1),\n\
  \  SPEC-0111 §1/§5); emitted only with `--confirm`. `data` adds `{targets: [<vhost\
  \ paths>]}`.\n- **host_health_sweep_passed** — the server-wide post-apply health\
  \ sweep passed (no baseline-healthy\n  domain regressed, SPEC-0111 §3). `data` adds\
  \ `{domains_checked: <int>, healthy: <int>}`.\n- **host_reconciliation_recorded**\
  \ — the live effective config reflects the shipped conf (repo-conf ==\n  live-conf\
  \ via `nginx -T`, no shared-resource clobber, SPEC-0111 §4). `data` adds\n  `{server_names:\
  \ [...], clobbered: false}`.\n```jsonc\n{\"ts\": \"...\", \"type\": \"host_health_sweep_passed\"\
  , \"task_id\": \"T-XXXX\",\n \"data\": {\"emitter\": \"hostapply\", \"task\": \"\
  T-XXXX\", \"project\": \"<slug>\", \"domains_checked\": 7, \"healthy\": 7}}\n```\n\
  Additive + P5-safe (no existing event changes; consumers ignore unknown types/keys).\n\
  \n**`governing_contract`** (delivery-observability field, per SPEC-0013 §Delivery-observability)\
  \ — carried in `data` by the floor-gated lifecycle events (`spec_filed`, `spec_edited`,\n\
  `task_picked` claim-marker, `commit_landed`, `task_closed`, `audit_{stage}_completed`,\n\
  `scenario_filed`). A\ndeterministic binding-derived PROJECTION of WHICH contract\
  \ governs that gate — fixed shape\n`{specs: [...], status: resolved|derivation-failed}`\
  \ (`_governing_contract_for`). It records the\nGOVERNING contract, NOT read-evidence\
  \ that the AI consumed/read it (the honest name).\nRENAMED from `consumed_contract`\
  \ on 2026-06-05; historical journal lines KEEP\n`consumed_contract` (append-only)\
  \ — a reader handles BOTH keys by `ts` (additive / P5-safe).\nThe `{specs, status}`\
  \ dict is the ONE documented shape EVERY emitter now writes ( normalized the\n`spec_edited`\
  \ + `scenario_filed` emitters that historically wrote a BARE `[SPEC-NNNN]` list);\
  \ historical\npre- lines keep that bare-list form (append-only) — a reader stays\
  \ tolerant, treating a bare list\nas `{specs: <list>, status: resolved}` (additive\
  \ / P5-safe).\n\n**worktree_created** (amending) — emitted by `bin/yitc-v2 worktree\
  \ new` after the\nworktree is created, bound to the MAIN checkout's journal. `data:\
  \ {branch, path, leaf, session_ref, started_at}`;\nNO `task_id`. **Spike exception\
  \ (SPEC-0205 rules 1-2):** for a declared `--spike` batch the row\ncarries `spike:\
  \ true` and is published BEFORE `git worktree add` (so without `started_at`); the\
  \ worktree\nstamp's `declared_row` is its projection, and a failed add is retired\
  \ by `worktree_create_failed`\n(same ts ref). Payload keys + the compensating type:\
  \ SPEC-0161.\nMakes verb-vs-raw-git worktree creation observable: a worktree WITHOUT\
  \ a matching `worktree_created`\nevent = **missing control-point evidence** (it\
  \ was likely made with raw `git worktree`), a SOFT signal\nfor human/AI judgement\
  \ — NOT a definitive bypass (the raw `git worktree` recovery path stays legitimate).\n\
  No checker/gate is wired (deferred — Principle 1 F4).\n\n**merge_resolved_by_hand**\
  \ — emitted by `bin/yitc-v2 worktree sync --resolved`, ONCE,\nimmediately after\
  \ it commits an update-from-main merge whose non-union conflicts a HUMAN resolved.\n\
  Bound to the journal of the WORKTREE it ran in (the merge is on that branch, and\
  \ the row rides the\nsame land fold as every other worktree-side append). `task_id`\
  \ = the task for a `task/` branch, else\nnull. `data: {branch, main_sha, merge_commit,\
  \ head_before, resolved, resolved_source, worktree}` —\n`main_sha` is the `MERGE_HEAD`\
  \ actually merged (not a re-read of the moving ref), `resolved` is the\nlist of\
  \ paths that conflicted, and `resolved_source` names WHERE that list came from:\
  \ `merge-msg`\n(git's own `# Conflicts:` record for this merge — the exact set)\
  \ or `staged-delta` (the fallback\nsuperset, every path the merge staged). A reader\
  \ MUST honour that distinction rather than treating\nevery list as exact.\nWHY IT\
  \ EXISTS: `land` refuses before the queue on a non-union conflict and `worktree\
  \ sync` stops on\nthe same class, but the RESOLUTION was raw git — three hand merges\
  \ on 2026-09-10 alone, each\nleaving the journal no record of what a human changed.\
  \ AGENTS §Verb-execution discipline forbids\nhand-doing what a verb covers; this\
  \ row is what makes the covering verb's work visible.\nWHAT A READER MAY CONCLUDE:\
  \ that these paths were resolved by a human, in that merge, by that\nsession. **What\
  \ it is NOT:** it is NOT evidence the resolution is CORRECT (no verb judges that),\
  \ and\nit is explicitly NOT an audit-currency exemption — a hand resolution is authored\
  \ content, so\nSPEC-0077 §3a demands the re-audit exactly as before (`_offending_drift_is_merge_produced`\
  \ names\nthis case as precisely what the rule exists to refuse). The row makes the\
  \ shift ATTRIBUTABLE, and\n`_land_audited_footprint_split` CITES it report-only\
  \ for that reason; a consumer that read it to\nADMIT such a path would invert the\
  \ rule. No checker/gate is wired (Principle 1 F4). Append-only,\nP5-safe (consumers\
  \ ignore unknown keys).\n**worktree_children_reaped** — emitted by `bin/yitc-v2\
  \ worktree park --confirm-dead`\n(the shared `_assert_no_live_holder` gate), bound\
  \ to the MAIN checkout's journal; `task_id` = the\nparked task where there is one.\
  \ Records the teardown of a DEAD holder session's ORPHAN processes: the\nlive-cwd\
  \ guard refuses while ANYTHING holds the worktree as its working directory, which\
  \ is\nright for a mid-Stage-6 holder and wrong for an orphan — X-1350 (<project>,\
  \ 2026-09-09) left two\n`docker run` land-verify containers on a confirmed-dead\
  \ worker's worktree and X-1346 (<project>)\ntwo leaked node processes, and in BOTH\
  \ the only lever was a hand kill. `data: {path, kind,\ndead_session_ref, holder_verdict,\
  \ reap_complete, pids: [{pid, cwd, signals, outcome}], containers:\n[{container,\
  \ name, outcome}], stop_failures, reap_failures, term_wait_s}` — the per-target\
  \ outcome\nis recorded INCLUDING failures (`stop-failed` / `survived-SIGKILL` /\
  \ `SIG*-failed` /\n`already-gone`), so the row names what did NOT die rather than\
  \ implying a clean sweep.\n`reap_complete` is the DISCRIMINATOR and the reason the\
  \ row is emitted on BOTH legs, and it is\ncomputed from TWO failure lists because\
  \ a holder survives the teardown by two different routes: a\n`docker stop` that\
  \ fails ABORTS the reap before any pid is signalled (`stop_failures`), while a pid\n\
  that outlived SIGKILL or could not be signalled at all is reported after the escalation\
  \ has run\n(`reap_failures`) — for the purpose of removing a worktree around it,\
  \ an unkillable process is\nindistinguishable from a container that would not stop.\
  \ EITHER list non-empty REFUSES the teardown\nand journals `reap_complete: false`;\
  \ a half-run reap is exactly what a later reader must be able to\n. `reap_failures`\
  \ is classified against a POSITIVE success set (`terminated` / `killed` /\n`already-gone`),\
  \ so an outcome added later counts as a failure by default rather than failing open.\n\
  `holder_verdict` is always `dead`, which requires a negative `_session_proc_alive`\
  \ probe, a takeable\nscan (`_proc_scan_is_takeable`) AND a terminal dispatch marker\
  \ as the journal's last row for\nthat ref — a LIVE holder is refused unchanged (the\
  \ 2026-08-10 fence) and an unanswerable\nliveness or container read refuses fail-closed.\
  \ Container holders are judged by their RUNTIME working\ndirectory (`/proc/<State.Pid>/cwd`,\
  \ the same evidence class every other holder is answered by), never\nby `Config.WorkingDir`\
  \ and never by a mount scan. No checker/gate is wired (Principle 1 F4).\nAppend-only,\
  \ P5-safe (consumers ignore unknown keys).\n\n**worktree_adopted** — emitted by\
  \ `bin/yitc-v2 worktree adopt --task T-XXXX\n--confirm-dead`, bound to the MAIN\
  \ checkout's journal; `task_id` = the adopted task. The\nVERB-ASSISTED controller\
  \ takeover of a CONFIRMED-DEAD worker's orphan `task/T-XXXX` worktree\n(the §Controller-takeover\
  \ re-stamp), replacing the prior ad-hoc HAND overwrite of the stamp file.\n`data:\
  \ {branch, path, prior_session_ref, session_ref, started_at}` — `prior_session_ref`\
  \ is the\ndead holder's stamp (or null/UNKNOWN), `session_ref`/`started_at` are\
  \ the adopting session's NEW\nstamp (the adoption RECORD). Makes the takeover cross-session\
  \ visible. The\nverb does NO process walk / NO auto-death decision (detect+surface,\
  \ CHARTER L59/148): `--confirm-dead`\nis the controller's ASSERTION that the §Abnormal\
  \ «Confirmed-dead GATE» held first. No checker/gate\nis wired (Principle 1 F4).\
  \ Append-only, P5-safe (consumers ignore unknown keys).\n\n**yield_offer_cleared**\
  \ — emitted by `bin/yitc-v2 worktree clear-yield-offer\n--reason <why>`, bound to\
  \ the MAIN checkout's journal; `task_id: null` (the offer is keyed to the\nrepo,\
  \ not to any one card). The GOVERNED removal of a STALE land-reservation yield offer\n\
  (SPEC-0184 rule 9) — the record the 2026-09-11 14:50Z hand `mv` could not leave\
  \ behind. `data:\n{addressee, writer_pid, addressee_pid, reason, age_s}` — `addressee`\
  \ is the branch the offer named,\n`writer_pid` the yielding land that published\
  \ it, `addressee_pid` the recorded addressee land pid\n(null for a pre- two-line\
  \ offer, which is precisely the measured stall: an offer for a land\nthat had never\
  \ started, unconsumable by anyone), `reason` the operator's free-form justification\n\
  (REQUIRED by the verb), and `age_s` the offer file's whole-second age at removal\
  \ — REPORTED, never\na threshold: nothing branches on it, this card adds no TTL\
  \ or timeout. The verb is idempotent and\nrecords NOTHING when no offer is on disk\
  \ (one removal never yields two rows), and it REFUSES while\nthe recorded addressee\
  \ land pid is alive, so a row here always means «no live land was coming for\nit».\
  \ No checker/gate is wired (Principle 1 F4). Append-only, P5-safe (consumers ignore\
  \ unknown\nkeys).\n\n**cli_invoked** — emitted by the CLI dispatch control-point\
  \ AFTER one of the **6\nread/query verbs** runs (`task list` / `graph query` / `journal\
  \ query` / `error list` / `error show` /\n`plan list`), so the `resource` aspect-audit\
  \ has a durable signal for «how much context did\nqueries pour in» / «duplicate\
  \ queries» (these otherwise leave zero journal footprint). `task_id` null.\n`data:\
  \ {verb, shape, arg_fingerprint, stdout_bytes, stdout_lines, exit_code, duration_ms,\
  \ reads}` —\n`duration_ms` is the verbs own wall-clock in milliseconds (speed observability;\
  \ additive,\nconsumers ignore unknown keys); `reads` is the additive READ-AMPLIFICATION\n\
  block described just below; `shape` is a\n**normalized** arg signature (flags kept,\
  \ every value → `<val>`) and `arg_fingerprint` its short hash,\nso the journal records\
  \ query SIZE + SHAPE, never a free-form body (no shadow transcript). Mutating verbs\n\
  are EXCLUDED (they already emit a semantic effect-event — no double-emit); `event`\
  \ + `journal sync` are\nexcluded (recursion / self-observation). Append-only-safe.\n\
  **`reads` — the READ-AMPLIFICATION block (additive).** `data.reads = {folds, segments,\n\
  artifacts, rows_parsed, rows, cards_parsed, cards, project, realm, wall_ms}` records\
  \ what the WORK\nTHE ROW NAMES physically read ( — interpreting note; it was worded\
  \ \"this process\", which\nheld only while one process emitted one row). The span\
  \ is resolved at the one producer,\n`events.py#_emit_cli_invoked`, most specific\
  \ first: an explicit baseline (`main` passes its verb\nBODY's, so the envelope —\
  \ `_auto_sync`, the identity gate's bounded retry — is outside the row);\nelse,\
  \ inside a verb body, the span the seam's own ReadScope recorded for this verb label\
  \ (an\nIN-PROCESS render, e.g. the stage-bundle delivery receipts, reads its own\
  \ render and never its\nhost's); else the whole body so far (fail-LOUD — an unspanned\
  \ nested emit over-reports, it is never\nomitted); else, outside any body, the whole\
  \ process. `artifacts` = the DISTINCT physical files\nfolded in that span — the\
  \ \"per artifact in scope\" denominator SPEC-0190 rule 10 states its bound\nover.\
  \ NUMERATORS are incremented at the LOWEST PHYSICAL READ PRIMITIVES ONLY —\n`journal.py#_fold_lines_uncached`\
  \ (the one physical byte read), `#_rows_from_lines` (the one\nevent-line parser),\
  \ `#segment_lines` + `#segment_text` (the two folds that open segments\nthemselves),\
  \ `#_tail_window_start` (the read-gate's backward byte scan), `cli.py#_iter_events_tail`\n\
  (its own tail read; it parses through `_rows_from_lines`), and `state.py#load_path`\
  \ for\n`cards_parsed`, which counts a PHYSICAL parse of a `tasks/T-*.yaml` and deliberately\
  \ NOT a\n memo hit. A composer over those primitives (`fold_rows` / `segment_rows`\
  \ /\n`cli._iter_events`) is never counted — that would double-count one physical\
  \ read — and NO VIEW\nSELF-REPORTS: a reader that wants to be counted routes through\
  \ a primitive. DENOMINATORS are\n`segments` = `len(events.segment_paths(EVENTS_PATH))`,\
  \ `rows` = the folds' OWN recorded line\ncounts (so it costs no extra read), `cards`\
  \ = the count of `tasks/T-*.yaml`; `project` / `realm`\n(`kernel` | `consumer`)\
  \ make a row foldable per project, since the SAME kernel code emits onto a\n`-C`\
  \ consumer's own journal. `wall_ms` is milliseconds inside the read primitives —\
  \ RECORDED,\nnever a target (a shared host under load; the governing figures are\
  \ the ratios). WHY IT IS ON\nTHIS ROW rather than in a store of its own: this event\
  \ already exists once per verb and already\ngrows by additive keys, and a second\
  \ telemetry file would be a second journal for a number the\njournal can carry.\
  \ The block is OMITTED (never zero-filled) if it cannot be computed, so an\nabsent\
  \ `reads` reads as \"not measured\", never as \"measured nothing\". Uncounted raw\
  \ scans are not\nsilent either: `dev-utilities/read-instrumentation-allowlist-.json`\
  \ names each with a\nreason, and `tests/test_t12034_reads_counters.py` fails on\
  \ a new one.\n\n**READ-GATE SENTINEL RECEIPTS (a second producer of this event).**\
  \ Two\nsession-entry gates reuse this SAME event as their pass-granting evidence,\
  \ each emitting a `cli_invoked`\nrow whose `data.node_id` is a fixed `cli:`-prefixed\
  \ SENTINEL (deliberately not a `SPEC-XXXX`, so it never\ncollides with a `graph\
  \ query` node_id): (a) `--help` emits `node_id: cli:help` (`HELP_INVENTORY_NODE_ID`)\
  \ — the verb-inventory scan receipt read by `_require_help_read`; (b) `session start`\
  \ emits\n`node_id: cli:seed` (`SEED_READ_NODE_ID`) AFTER it delivers the audience\
  \ seed — the seed READ\nreceipt read by `_require_seed_read` (the BROAD anti-Forgetting\
  \ floor, SPEC-0050 §8). The `cli:seed`\nreceipt ALSO carries an ADDITIVE `data.epoch`\
  \ (int) = the CONTEXT EPOCH at emit (the provider\ntranscript's `/compact` count;\
  \ `session.session_epoch`) — the gate credits it only when epoch >= the\ncurrent\
  \ epoch, so a pre-compact receipt goes stale (a missing/pre-change `epoch` normalizes\
  \ to 0).\n`session start`\nOWNS the `cli:seed` primitive (producer-owns-primitive),\
  \ so downstream probes may reference it. These\nsentinel receipts are the gates'\
  \ evidence, NOT read-verb observability rows — a consumer counting the\n6-read-verb\
  \ footprint filters them out by their sentinel `node_id`.\n\n**session_started**\
  \ (emitted by `session start` — `--type` is optional: omit => interactive\nController,\
  \ `--type build` => dispatched Worker, so the payload `type` value is `controller|build`,\
  \ NOT\nthe retired `build|review` choice, retired) — the durable\nsession-activation\
  \ marker. `data: {type, project, session_config, resolved_session_ref, source_kind}`\
  \ — `resolved_session_ref` + `source_kind` (collapse-forensic) are the resolved\
  \ session identifier and the registry-MODELED class it was resolved FROM (`env:<NAME>`\
  \ | `arg`), produced together by the `_resolve_session_ref_with_source` so the pair\
  \ is coherent; fail-closed — no `unknown` class. `session_config` is\nONE opaque,\
  \ comparable descriptor of the primary-AI configuration, recorded VERBATIM from\
  \ what the\nharness reports (env keys per the `SESSION_CONFIG_ENV_KEYS` binding\
  \ in `bin/yitc-v2` — P4b, the\nsingle normative carrier — plus a best-effort `model=<verbatim>`\
  \ from the provider transcript tail).\n**Opaque-key contract: consumers compare\
  \ the descriptor for EQUALITY only — never parse, never\nnormalize, no semantic\
  \ fields.** Zero harness signals → the explicit marker `\"unknown\"` (never\ninferred).\
  \ The value is a session-START snapshot (a mid-session knob toggle is not re-captured);\n\
  the PART-3 benchmark protocol reads this snapshot as its configuration axis.\n**Raw\
  \ observation-loop fields (per SPEC-0135 — additive, all OPTIONAL, P5-safe).** `session_started`\n\
  additionally carries — WHEN available — the NORMALIZED worker-side identity triple\
  \ + host facts, the\ncheap always-on capture the observation loop rolls up (SPEC-0135\
  \ §1/§3, raw source-facts / join keys):\n- `provider` / `model` / `effort` — the\
  \ normalized `provider×model×effort` triple (the §Normalized\n  provider×model×effort\
  \ vocabulary below), DERIVED from the opaque `session_config`. This triple — NOT\n\
  \  the `session_config` string — is the SOLE slice key for cross-session rollup\
  \ (SPEC-0135 §6): the\n  verbatim `session_config` STAYS as raw provenance only\
  \ (NON-slice-source). Each key OMITTED (or the\n  triple = `\"unknown\"` per the\
  \ vocab fallback) when the descriptor yields no signal — never fabricated.\n- `cores`\
  \ (int, logical CPUs) / `mem_gb` (number, total RAM GB) / `host_label` (str, a stable\
  \ host\n  identifier — hostname or a configured label) — the host facts that let\
  \ the loop size minimum\n  hardware per project class (SPEC-0135 §Scenario). Best-effort;\
  \ each OMITTED when unavailable (the\n   no-fabricated-0s discipline). NO usage/cost\
  \ field is journaled here — cost is a READ-TIME\n  DERIVED view, never a source-fact\
  \ (SPEC-0135 §3, the Single-SoT fence).\nAdditive + P5-safe : every field is OPTIONAL,\
  \ so an emitter that supplies none writes the\nbyte-unchanged legacy payload and\
  \ a consumer that doesn't know them parses the opaque triple.\n\n### Normalized\
  \ provider×model×effort vocabulary (per SPEC-0135)\nThe **normalized `provider×model×effort`\
  \ triple** is the observation loop's SOLE cross-session slice\nkey (SPEC-0135 §6).\
  \ It is DERIVED at read/emit time from the opaque `session_config` descriptor; the\n\
  descriptor itself stays raw provenance and is compared for EQUALITY only (never\
  \ a slice source). The\ntriple rides `session_started` (worker side) and `external_audit_completed`\
  \ (auditor side) so a\nrollup can compare the **worker×auditor pair** (SPEC-0135\
  \ §4). Fields (all snake_case strings):\n- `provider` — the AI vendor/system (e.g.\
  \ `the provider`, `openai`, `google`). ALIGNS to the\n  OpenTelemetry GenAI `gen_ai.system`\
  \ attribute (SPEC-0135 §7 — a naming/export aid ONLY; the SoT\n  stays the journal\
  \ event, this is not an OTel dependency).\n- `model` — the model id/family, VERBATIM\
  \ as reported (e.g. `<provider-model>`, `gpt-5.5`). ALIGNS to\n  `gen_ai.request.model`.\n\
  - `effort` — the reasoning/effort tier when the provider exposes one (e.g. `low`\
  \ | `medium` | `high`\n  | `xhigh` | `max`), else the marker `none` (provider has\
  \ no effort axis). A provider-specific\n  naming aid; no OTel canonical attribute.\n\
  \n**Allowed keys / unknown / null fallback.** The three keys above are the ONLY\
  \ normalized slice keys —\nno other semantic field is parsed out of `session_config`.\
  \ Each axis is an EXTENSIBLE vocabulary, NOT\na closed enum (the spec-wide append-only\
  \ stance): a new provider/model/effort value is added\nby simply appearing, and\
  \ unknown consumers ignore it. When an axis CANNOT be resolved from the\ndescriptor,\
  \ the fallback is the explicit literal **`\"unknown\"`** (never inferred, never\
  \ guessed —\nmirrors the `session_config` zero-signal rule); a WHOLE-triple resolution\
  \ failure sets all three to\n`\"unknown\"`. A missing (absent) key is read as `\"\
  unknown\"` (null-equivalent), so absent and\n`\"unknown\"` collapse to the same\
  \ slice — a rollup counts them as one `unknown` bucket, never as a\ndistinct real\
  \ value.\n\n**Opaque `session_config` → triple mapping (absorbs plan-check finding\
  \ #3).** The mapping is a\nREAD-TIME derivation, NOT a stored second copy (Single-SoT\
  \ — the descriptor is the raw source, the\ntriple is its derived view): parse the\
  \ verbatim `session_config` descriptor for the `model=<verbatim>`\ntail + the `SESSION_CONFIG_ENV_KEYS`\
  \ signals, map the vendor to `provider`, the model tail to `model`,\nand the effort/tier\
  \ signal (when present) to `effort`; any axis with no signal → `\"unknown\"` (never\n\
  `null` in the triple). Because the derivation is read-time, a later mapping refinement\
  \ re-derives the\ntriple from the UNCHANGED descriptor — no migration, no re-emit\
  \ (SPEC-0135 §3/§6). Usage + cost are\nSTILL never journaled here — they resolve\
  \ only via the read-time `token-rollup` × `pricing-config`\nview (SPEC-0135 §3),\
  \ so the triple is identity/join-key ONLY.\n\n**`wait_reason` — the normalized pause/block\
  \ reason (per SPEC-0135 §5).** An OPTIONAL normalized field\ncarried by BOTH wait/block\
  \ carriers — `task_paused` (pause) and `bg_dispatch_halted` (block) — ALONGSIDE\n\
  each event's existing free reason string (`paused_reason` / `reason`), which STAYS\
  \ as detail (additive,\nno rename, P5-safe). It categorizes WHY a session waited\
  \ so the loop can find where time is lost /\ndiscipline breaks. EXTENSIBLE vocabulary\
  \ (not closed); named canonical values:\n`owner-wait` (waiting on an owner decision)\
  \ · `auditor-abort` (external auditor could not run) ·\n`audit-ceiling` (audit-loop\
  \ ceiling reached) · `env-fault` (environmental/tooling fault) · `dep-wait`\n(blocked\
  \ on an unsatisfied `requires:` dependency) · `session-end` (clean session close).\
  \ Any value\noutside the list → the explicit fallback **`\"other\"`** (the free\
  \ reason string carries the specifics).\n\n**graph_built** — emitted by `graph build`\
  \ + every `_auto_rebuild_graph` side-effect rebuild.\n`data: {counts, trigger?,\
  \ had_errors?, errors_count?, duration_ms?}` — `duration_ms` is the\nbuild wall\
  \ (index build + write); additive, present only when measured (no fabricated 0s\
  \ — the\n discipline).\n\n**tests_passed** — Stage-6 evidence capture emitted by\
  \ `task test --evidence` (`--evidence`\nalone does not run tests). `--run --evidence`\
  \ does NOT emit it when zero verify layers\nexecuted ( — that run prints `TEST:\
  \ NONE`; a row there would attest a pass nothing produced). `data: {current_stage,\
  \ evidence, acceptance, duration_ms}` +\nOPTIONAL author-reported run numbers :\
  \ `duration_ms` + `passed` + `failed` — an\nALL-OR-NOTHING flag group (a partial\
  \ set is refused, never written), always accompanied by\n`counts_source: \"author_reported\"\
  `.\n\n**`consumer_verify` + `consumer_verify_layers` — which declared layers a consumer's\
  \ run executed\n.** OPTIONAL, and present ONLY on a `--run --evidence` row whose\
  \ run engaged the consumer\nverify: ABSENT on the engine's own build and on a hand-authored\
  \ `--evidence`, which ran nothing\n(never a fabricated value — the discipline).\
  \ `consumer_verify` is the verify mode;\n`consumer_verify_layers` is the per-layer\
  \ outcome trail — the SAME rows, in the SAME shape, that\n`land_completed.consumer_verify_layers`\
  \ carries for the land's candidate leg (described under\n`land_completed` below;\
  \ not restated here). They ride this row because a consumer's Stage-6 run\nmay skip\
  \ a subject-disjoint layer (rule home: SPEC-0152 rule 16 `subject_globs`), so a\
  \ green row\nhas to say WHICH layers it is green over, and a reader setting a Stage-6\
  \ pass beside a land\ncompares like with like.\n**`verify_metrics.flaky_retry` on\
  \ this row — a layer the run had to re-run.** OPTIONAL,\npresent ONLY when THIS\
  \ run's layer guard re-ran (or declined to re-run) a failed verify layer: the\n\
  SAME record, in the SAME shape, as `land_completed.verify_metrics.flaky_retry` (its\
  \ LAYER ROWS\nparagraph below; not restated here), so a green row that needed a\
  \ re-run names the layer and keeps\nthe first-run failure excerpt. ABSENT on a first-try\
  \ green and on a hand-authored `--evidence`.\n**`layer_duration_step` — a layer\
  \ step this run printed.** OPTIONAL, present ONLY on a\n`--run --evidence` row whose\
  \ run printed a SPEC-0132 Rule 7 layer step line: those lines, verbatim,\nas a list\
  \ of strings. ABSENT when no line printed and on a hand-authored `--evidence`. Report-only:\n\
  nothing reads it to decide.\n\n**`stage6_run` — the RUNNER's mark: which tree this\
  \ green run tested.** OPTIONAL, and\npresent ONLY on a `--run --evidence` row: `{tree,\
  \ base}` — the tree the run tested (the files on\ndisk when it started, which the\
  \ run left unchanged apart from the journal) and the `main` commit that\ntree sat\
  \ on. ABSENT on a hand-authored `--evidence`, which ran nothing, and whenever the\
  \ runner\ncould not establish the tree (never a fabricated value — the discipline).\
  \ It is RESERVED at\nthe hand route: `event --data` refuses it, so only the runner\
  \ writes it. Its one reader is `land`,\nwhich MAY credit a row carrying it as its\
  \ candidate-leg verdict (rule home: SPEC-0065 §Bound).\n\n**`duration_ms` is REQUIRED\
  \ on this row ** — `task test --run` TIMES ITS OWN SUBPROCESS\nRUN (the delegated-layer\
  \ leg and the tests/ sweep alike) and writes the measured wall in ms, so the\nTests-stage\
  \ wall splits into machine time and worker time without inference. An explicitly\
  \ passed\n`--duration-ms` still WINS (and still stamps `counts_source: \"author_reported\"\
  `). THE ONE EXEMPT\nSHAPE, stated so the requirement is honest rather than aspirational:\
  \ a hand-authored `--evidence`\nwith NO run attached measured nothing, so it carries\
  \ the field only via the author-reported group —\nnever a fabricated 0 (the discipline).\
  \ Before the field was author-reported-only and\n25 of 511 kernel rows in 2026-08-19..09-02\
  \ carried one.\n\n**tests_failed** — the RED half of `tests_passed`, emitted by\
  \ `task test --run` when the Stage-6\nself-check FAILS. It exists because a green\
  \ run had a home and a red one had none: the run\nhappened, cost its minutes, and\
  \ left no row, so a later session could not see that a suite had\nalready failed\
  \ here or why (<project> X-1112; measured on <project>, where the only surviving\n\
  trace of a full failing run was prose in an unrelated message an hour later). `data:\
  \ {current_stage,\nfailed, layers, evidence, duration_ms, counts_source: \"harness_measured\"\
  , leg: \"candidate\"}` —\n* `duration_ms` — **REQUIRED **: the same measured subprocess\
  \ wall `tests_passed` carries,\n  written on the SAME rule (an explicit `--duration-ms`\
  \ wins, else the measurement), because a red\n  run costs exactly the minutes a\
  \ green one does and the row exists to say what the run cost;\n* `failed` = the\
  \ failing-entry COUNT; `evidence` = the runner's own failure messages, bounded,\
  \ so the\n  row answers *what failed* without a re-run;\n* `layers` = an ordered\
  \ list of `{name, attribution}`, one per failing test file or consumer verify\n\
  \  layer (SPEC-0152). `attribution` is a CLOSED set: **`in-diff`** (this card's\
  \ changed-path set — its\n  working tree plus untracked files versus `merge-base(HEAD,\
  \ main)` — contains that layer's own file)\n  · **`not-in-diff`** (it does not)\
  \ · **`undetermined`** (the relation could not be established;\n  recorded explicitly,\
  \ never guessed). MATCHING IS EXACT: a failing TEST-FILE name is a basename and\n\
  \  is resolved only by joining it to the tests directory it came from, never by\
  \ suffix — a changed\n  `docs/test_X.py` does NOT make a failing `tests/test_X.py`\
  \ read `in-diff`, because a basename is\n  not an address. A name that addresses\
  \ no file at all (a consumer verify LAYER label) is\n  `undetermined`, since a diff-touch\
  \ relation is undefined for it; a confident wrong attribution is\n  worse than an\
  \ absent one, because a reader acts on it.\n* `counts_source: \"harness_measured\"\
  ` — the deliberate CONTRAST with `tests_passed`'s\n  `author_reported`: these numbers\
  \ come from the runner this verb just executed, not from an author.\n* `leg: \"\
  candidate\"` — the row is scoped to the CANDIDATE leg this verb runs. `land` verifies\
  \ TWO\n  legs (SPEC-0077); the pinned last-green leg is NOT run here and is NOT\
  \ described by this row.\n\n**READ `attribution` AS THE RELATION IT MEASURES, NOT\
  \ AS A VERDICT.** It is a diff-TOUCH relation, not\na proof of causation: `not-in-diff`\
  \ does NOT assert the failure is pre-existing on `main` (a card can\nbreak a file\
  \ it never opened), and `in-diff` does not assert the card caused it. It is the\
  \ strongest\nattribution computable without materializing and re-running main's\
  \ tree, and it is what the incident\nneeded — establishing that a red sat in a layer\
  \ the card had not written.\n\n**NOT A GATE, and not blocklisted for P8.** The emit\
  \ changes no verdict and no exit code: a failing\nrun refuses exactly what it refused\
  \ before it existed. And unlike `tests_passed`, this type is\ndeliberately ABSENT\
  \ from `_NON_EVIDENTIAL_EVIDENCE_TYPES` — the green row is blocklisted because\n\
  CHARTER §P8 says tests green BY ITSELF proves nothing (every task earns one for\
  \ free, zero\ndifferential), whereas this row exists ONLY when a run actually failed,\
  \ so its presence IS a\ndifferential. Same reasoning as the three named `land_completed`\
  \ row-ref exceptions.\n\n**land_completed** — emitted on BOTH outcomes of a `land`\
  \ attempt ( — the journal mirror of\nthe `LAND: OK|ABORT` stdout token contract).\
  \ **Consumers MUST key off `data.status` — NEVER\nread land_completed as success-only**\
  \ (duration trend views filter `status: ok`). Pre- rows\ncarry no `status` key —\
  \ readers treat an ABSENT status as ok (those rows were emitted only on\nsuccessful\
  \ lands). **Where the ok row is COMMITTED :** it is appended post-ff to main's\n\
  WORKING journal and reaches main's COMMITTED journal inside the NEXT land's single\
  \ bookkeeping\ncommit — the path the abort row already takes — unless this land\
  \ wrote a non-journal post-ff\ncarrier (the verify-durations table, a load-sensitive\
  \ carrier line, an auto-filed card), whose\nfresh commit carries it at once. So\
  \ a reader reads the on-disk / unioned journal, never\n`git show <rev>:events.jsonl`.\
  \ Ok path (post-ff, on main): `data: {branch, sha, worktree, status: \"ok\",\nverify_duration_ms,\
  \ admission_wait_ms, reservation_wait_ms, duration_ms?, reverify_skipped, reverify_skip_reason?,\
  \ verify_mode}` —\n`verify_duration_ms` = the landing attempt's step-4 verify wall,\
  \ and it is QUEUE-INCLUSIVE :\nthe wall starts BEFORE the SPEC-0132 verify-admission\
  \ slot is requested, so it charges both waiting\nfor a slot and running the checks.\
  \ `admission_wait_ms` (int ms) = the QUEUE half of it —\ntotal time that attempt\
  \ spent ACQUIRING admission slots (the candidate verify, plus the pinned\nlast-green\
  \ re-run when it fires), so RUN time is `verify_duration_ms - admission_wait_ms`\
  \ with no\ninference. ALWAYS present on an ok land; `0` on an uncontended land (a\
  \ truthful measurement, not a\nfabricated zero — the sub-ms non-blocking slot scan)\
  \ and on a land that never reached a verify.\n`reservation_wait_ms` (int ms) = the\
  \ OTHER queue, and it is NOT inside `verify_duration_ms`\nat all: the land-fairness\
  \ RESERVATION ( — the serialized merge->verify->ff window) is taken at\nthe TOP\
  \ of the attempt, before the merge and before step 4, so no subtraction over the\
  \ verify wall can\nrecover it. It is the SUM of every reservation acquisition this\
  \ LAND made, not one attempt's — the\nreservation fd is held across attempts, so\
  \ the wait is a property of the land. ALWAYS present on an ok\nland; `0` when the\
  \ reservation was taken without waiting (again a measurement, not a fabricated zero).\n\
  **THE TWO QUEUE FIELDS ARE NEVER SUMMED INTO ONE**, and that is a contract rather\
  \ than a formatting\nchoice: they ask for DIFFERENT remedies — an admission wait\
  \ says the verify SLOT POOL is the\nconstraint, a reservation wait says a PEER LAND\
  \ is holding the window — so a single collapsed field\nwould name neither. Before\
  \ the reservation wait appeared in NO summary field on any row and\nwas recoverable\
  \ only by hand-folding `waiting_for_land_reservation` heartbeats per (session, branch);\n\
  one measured group land (task/, sha cc5fcfa, 2026-08-27) reported 65 min total,\
  \ 9 min verify\nand 0 admission wait, with the missing 56 min sitting in 195 such\
  \ heartbeats.\nBefore it, 3892 samples carried a total and no wait, so a 0.1-to-18.2-minute\
  \ spread could not be\nattributed and each remedy (slot count / cores per verify\
  \ / the worker command cap) was a guess;\nthe only estimate available was counting\
  \ `waiting_for_verify_admission_slot` heartbeats. REPORT-ONLY.\n`duration_ms` =\
  \ whole-land wall; `reverify_skipped` (bool) = re-verify skip telemetry — True iff\
  \ this ok land's ff'ing attempt skipped the code/test\nre-verify. It has FOUR producers,\
  \ and the discriminator is `reverify_skip_reason` (str), which rides\nonly when\
  \ True: `inert-retry-delta` = lever B (SPEC-0065 §Verification), a concurrency retry\
  \ whose\ninert merged-tree delta made re-verifying redundant; `superseded-nothing-to-integrate`\
  \ = lever C\n(SPEC-0184 rule 8), a land carrying nothing not already in `main` —\
  \ typically a batch member\nwhose content the head already fast-forwarded; `inert-first-attempt-delta`\
  \ = the inert first-attempt\nskip (SPEC-0065 §Bound), a land none of whose attempts\
  \ verified whose tree differs from the\nvenue-GREEN tested tree of main's newest\
  \ verified land only by inert paths no test names; `stage6-credit` = the\nStage-6\
  \ credit (SPEC-0065 §Bound), a land whose CANDIDATE leg was not run because the\
  \ land\nproved the task's own runner-recorded green Stage-6 run tested this tree\
  \ on this `main` (or on a\n`main` it advanced from only by inert paths no test names)\
  \ — the one\nproducer that applies to an OBSERVABLE delta, and the one under which\
  \ a verify leg may still have\nrun (the SPEC-0077 pinned leg, when due: the row\
  \ then carries `verify_mode: pinned+candidate`, whose\ncandidate half is the credited\
  \ run). Such a land additionally carries `stage6_credit: {task, ts, tree,\nbase}`\
  \ — WHICH Stage-6 row it credited, resolvable as that task's `tests_passed` row\
  \ at\n`events.jsonl#ts=<ts>`; ADDITIVE, present only on a credited land. When `main`\
  \ advanced since that\nrun, the same record also states the inert advance the credit\
  \ accepted — its class and path count\n — so the journal counts how often that arm\
  \ fires. Its counterpart is\n`stage6_credit_refused` (str) = WHY the credit was\
  \ REFUSED to a runner-marked green newest\nStage-6 row of the task — the one reason\
  \ of the SPEC-0065 §Bound condition that failed (`main-moved`,\n`tree-differs:<class>`,\
  \ `read-by:<test>`, `run-narrowed`, `layer-not-covered:<layer>`,\n`row-tree-unrecorded`,\
  \ `row-tree-unresolvable`, …), so what each condition costs is foldable from\nthe\
  \ journal. Present ONLY on an ok land that asked for the credit and refused such\
  \ a row; ABSENT on a\ncredited land and wherever no credit was possible (no Stage-6\
  \ row, a red or an unmarked newest row,\nan opted-out project, a non-task branch,\
  \ an error inside the proof, a land step 4d is not asked on) —\nit never reads as\
  \ «no credit». It is the LAND's, not one attempt's: a retry that is not asked again\n\
  keeps it. ADDITIVE, REPORT-ONLY. Beside `main-moved` ONLY it is joined by `stage6_credit_main_delta`\n\
  \ = main's OWN advance between the run's recorded base and this land's merge base,\n\
  classified by the one SPEC-0064 authority as inert, observable or unknown, with\
  \ its path count —\nunknown (no count) whenever that delta cannot be read, never\
  \ inert — and, when an inert advance was\nrefused because a test names it, the first\
  \ such test. Reading the bool as \"an inert\nretry\" is therefore\nwrong; key off\
  \ the reason. An extinguished (lever-C) land additionally carries\n`superseded_extinguished:\
  \ true` + `verify_slot_taken: false` + `land_reservation_taken` (bool) —\nthree\
  \ keys rather than one because the boundaries saved are separate, and a land that\
  \ skipped its\nverify but had already taken the land reservation saved one of them,\
  \ not both. All ADDITIVE, present\nonly on that path, REPORT-ONLY. The OPPOSITE\
  \ case has its own key (SPEC-0184 rule 9):\n`rung0_paid: <reason>` rides the terminal\
  \ row — `ok` or `abort` — of a land that RAN its test\nverify although the land-admission\
  \ rank answered it as free: a kernel-suite land whose own delta\nwas all-inert.\
  \ The value says why it paid — the inert first-attempt proof's own refusal (e.g.\n\
  `observable-since-anchor:tests`), or `first-attempt-proof-not-open` where that proof\
  \ was not open\nto the attempt (a declared rebaseline). It is a fact about the LAND,\
  \ recorded once a candidate\nverify of it has run and kept across attempts, so it\
  \ can sit beside a skip reason on a row whose\nlanding attempt skipped, and it rides\
  \ an abort row only when the suite ran before the abort.\nWithout it such a row\
  \ is indistinguishable from an ordinary paying land. ADDITIVE, present only\non\
  \ that land, REPORT-ONLY.\n`verify_mode` (str) = the pinned LAST-GREEN both-must-pass\
  \ verify signal (SPEC-0077 §Verification,\nthe SOLE authoritative adoption signal):\
  \ `\"pinned+candidate\"` iff this land touched the verifier surface\n(the verify-implementation-touch\
  \ predicate fired) so the pinned last-green verifier re-ran IN ADDITION to\nthe\
  \ candidate; `\"candidate\"` otherwise (the negative/scope probe — no blanket-gate\
  \ creep);\n`\"candidate_policy_off\"` (SPEC-0186 rule 7) iff the land DID touch\
  \ the verifier surface but the\nproject declares `verify_policy.pinned_last_green:\
  \ never` in its `yitc-ops.yaml`, so the leg was SKIPPED\nBY POLICY rather than run.\
  \ A THIRD value in this one set, never a reuse of `\"candidate\"`: \"did not run\"\
  \nand \"ran and passed\" are different facts, and conflating them already misread\
  \ 15 of 30 decisive cases in\nthe 2026-08-18 analysis of this very layer, so a shared\
  \ value would poison every future measurement at\nsource. Scoped to the SKIP: a\
  \ land with no verifier-surface touch is plain `\"candidate\"` under either\npolicy,\
  \ because nothing was skipped by policy there. (`\"rebaselined+candidate\"` remains\
  \ the fourth.) ALWAYS present\non an ok land; a `land: verify_mode=<m>` stdout marker\
  \ is operator convenience only (Single-SoT).\n`pinned_layout_excused` (list[str])\
  \ = the SPEC-0077 §3 additive engine-LAYOUT carve-out signal —\nPRESENT ONLY when\
  \ the pinned re-run's failures were ALL excused as `No module named '<X>'` for\n\
  candidate-added `bin/` module(s) (a purely-additive layout change the stale last-green\
  \ fixture could not\nprovision); ABSENT on every normal land (additive / P5-safe).\
  \ It is the durable never-silent record (§P8)\n+ an operator stdout note; it is\
