  its counts already answer the question. Measured on this repo's journal at filing:\
  \ of 505 rows\ncarrying `selection_discovered_count`, 246 ran narrowed at 79/138/732\
  \ files (min/median/max) and\ntest filenames average 35.7 chars, so the key costs\
  \ ~5.4KB median (~28KB worst) per narrowed land\nand ~1.0% of a ~136MB log — the\
  \ same order as `per_file_durations` (~1.1%). Report-only: it gates\nnothing and,\
  \ like every selection field here, is written AFTER the executor ran so it cannot\n\
  influence what ran.\nTWO DELEGATION FIELDS RIDE CONDITIONALLY, AS A PAIR :\n`consumer_tests_delegated_layer`\
  \ (str) and `consumer_tests_delegated_files` (list of str) — the\nNAME of the declared\
