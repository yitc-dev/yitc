  REFUSED because of one already recorded.
  `{branch, pairs: [{pair, file, since, established_by, establishing_sha}], main, merge_base}` —
  `establishing_sha` is `null`, never a fabricated value, when main's history does not reach the
  establishing instant (the discipline). PRESENT ONLY on an abort raised by
  `_land_prequeue_known_broken_refusal`, guarded on presence exactly as `verify_metrics` is, so every
  other abort row is byte-unchanged (additive / P5-safe). It rides the EXISTING `corpus-integrity`
  abort_class and the EXISTING `abort_preflight` shape: **no new event type enters this catalog** —
  which is the point of the choice, since a dedicated type would first have to be catalogued here
  before any branch emitting it could land at all (the pre-queue uncatalogued-type refusal),
  and would create a SECOND land-outcome carrier beside `land_completed` that every existing reader
  of land outcomes would have to learn or silently under-count.
  WHY IT EXISTS AT ALL: this refusal is CHEAP — it fires above the attempt loop and takes nothing —
  so it never reaches the seam that publishes to main, and its abort row is written to the LANDING
  CHECKOUT's journal, which reaches main only if the refused branch eventually LANDS. A refused
  branch very often never lands (discarded, parked, re-cut), so the record died with the worktree:
  measured 2026-08-28, main's journal named this refusal ZERO times in its whole history, and the
  refused work/red-main-guard-and-repair-path's entire footprint was three rows, none of them the
  refusal. The row is therefore additionally delivered to MAIN at the refusal, as a `ts`-pinned
  byte-identical copy through the SAME / `clearing_copy_events_path` seam — so nothing
  double-records and the land-time dedup collapses the pair.
  REPORT-ONLY, and the fence is load-bearing: nothing gates on it, it waives no gate and excuses no
  red, and it is deliberately NOT shaped as a queue entry — no position, no ordering key, no retry
  hook. It makes a refusal VISIBLE; it makes nothing RESUME.
  **THE MAIN-SIDE COPY IS NOW GENERAL, and the three reasons above are each a special case of it
.** An abort `land_completed` for ANY class outside the never-landing set
  (`worktree._LAND_NEVER_LANDING_ABORT_CLASSES`, whose members are RE-ROUTED to main instead) is
  additionally delivered to MAIN through the SAME `clearing_copy_events_path` seam, as the same
  `ts`-pinned byte-identical copy — so nothing double-records, the land-time `_dedup_events`
  collapses the pair, and the LANDING CHECKOUT keeps its own row (a copy, never a re-route: the
   repeated-abort backstop reads that checkout's journal before the land folds main in).
  WHY GENERAL RATHER THAN A FOURTH REASON: the row's TARGET and the LAND QUEUE's oracle had drifted
  apart. The `waiting_for_*` heartbeats and the liveness fold
  (`_land_queue_terminal_epochs`, for which a `land_completed` IS a terminal row) both read MAIN's
  journal, while an aborted land wrote its terminal row to the landing checkout — so a branch whose
  land had already died stayed ADMITTED to the queue until its heartbeats aged out of the 90 s
  freshness window, holding a verify slot nobody was waiting in. Publishing per-reason could only
  ever fix the reasons someone had already measured.
  BOUND (not a promise the seam can keep): the copy target exists only once `cmd_land` has resolved
  the main worktree, so an abort raised above that point keeps the landing-checkout-only behaviour;
  it is below every admission wait, so no admitted land is affected. The copy stays BEST-EFFORT — a
  copy whose append fails, or an emit yielding no witness `ts` to pin, is skipped rather than
  written unpinned.
  **Resource-summary observation fields (per SPEC-0135 §3 — additive, OPTIONAL, P5-safe).** An ok
  `land_completed` MAY additionally carry a host-load raw summary the observation loop uses to size
  minimum hardware per project class: `load1` (number — the 1-minute load average at land time) and
  `peak_mem` (int — peak memory in KB during the land's verify, best-effort via
  `getrusage(RUSAGE_CHILDREN)`, aligned with the existing `verify_metrics.mem_peak_kb`). Raw host facts
  ONLY — no usage/cost (SPEC-0135 §3). Each OMITTED when the platform can't measure it (the
  no-fabricated-0s discipline); PRESENT only on an ok land that ran the suite, so `--no-tests`/inert-retry
  payloads stay byte-unchanged. Additive / P5-safe.

  **land_member_verdict** (SPEC-0184 rule 5) — ONE row per BATCH MEMBER of a land, carrying
  that member's own outcome so it is readable from the journal ALONE, without reconstructing the
  batch. `data: {branch, verdict, batch_size, task?, batch_id?}`. `verdict` is a CLOSED vocabulary of
  exactly four values — `landed` | `evicted-for-conflict` | `requeued-after-red-batch` |
  `dropped-dead-member` — and an emitter passing anything else RAISES rather than writing the row
  (`_emit_land_member_verdicts`, bin/lib/worktree.py). The closed-vocabulary rule is deliberate and is
  the one place unknown-key tolerance does NOT reach: tolerance is right for a key a reader
  may safely IGNORE, and this is the opposite — a reader that cannot interpret the verdict computes
  the wrong fate for a change. `evicted-as-culprit` is ABSENT BY DESIGN, not pending: naming a culprit
  requires the red-batch bisection SPEC-0184 explicitly puts out of scope, and a catalogued value
  nothing can produce is a promise the mechanism cannot keep.
  **EMITTED ONLY WHEN `batch_size` > 1 — a singleton land emits NO row of this type at all.** That is
  SPEC-0184 rule 5's N=1 clause, and it is a presence rule with teeth rather than an optimisation: a
  singleton's `land_completed` row and its `^LAND: (OK|ABORT)` token ALREADY ARE that member's
  individual verdict in full, because the member IS the land. Adding a row there would break the
  byte-identity rule 1 promises a quiet repo at three levels (events, commits, terminal token). So
  the presence of this event type is itself the signal that a land carried more than one change, and
  its ABSENCE must never be read as a missing verdict.
  `batch_id` (str) rides only once batch FORMATION exists — it is the join key that lets a
  member's row be read without the batch; OMITTED, never a fabricated placeholder, while nothing
  mints one (the no-fabricated-values discipline). `task` (str) rides when the member's branch
  carries a task id. Emitted post-ff INSIDE the land's repo lock, immediately after `land_completed`,
  and folded into the SAME `land: bookkeeping` commit — so an N>1 land adds rows, never a commit.

  **load_sensitive_entered** — ONE row per test file the land tail ENTERED into the declared
  load-sensitive set `tests/load-sensitive.txt`. `data: {file, count, threshold, window_days,
  locators[], carrier}`. Emitted by `land` post-ff, in-lock, immediately after `land_completed` and
  folded into the SAME fresh bookkeeping commit as the appended carrier line, so an entry can never
  arrive without the land that decided it. `count` is the number of ISOLATED-PASS `flaky_retry` rows
  the file accumulated inside the window (>= `threshold`, the `YITC_FLAKY_SENSITIVE_ENTER` tunable;
  `window_days` the `YITC_FLAKY_SENSITIVE_WINDOW_DAYS` one — both `config`-class, SPEC-0193) and
  `locators` names every one of those retries by its `land_completed` row (`events.jsonl#ts=<ts>`,
  leg-suffixed on a routed land), so the entry is reconstructible from the journal alone. THE
  DIFFERENTIAL A READER MUST HOLD: a carrier line WITHOUT a matching row was hand-added, and a row
  is never emitted for a REMOVAL — there is no automatic exit and no event for one, because a file in
  the serialized lane cannot prove pool-robustness; the line leaves only in a card's ship diff.
  `card` is the id of the ready card the entry auto-filed for this file; `card_preexisting`
  (bool — named 2026-09-11 after its first row at 17:02:16Z reddened the SPEC-0161 refresh
  corpus-wide) is present and true ONLY when a card for the same fingerprint already existed, i.e.
  the file RE-ENTERED the carrier (the class: a re-entry on pre-removal evidence); absent on
  a first entry.

  **land_tail_write_withheld** (SPEC-0188 rule 7) — ONE row per post-ff bookkeeping WRITE
  the land DECLINED to commit because the tests that READ what it wrote were not proven green on the
  written tree. `data: {writer, paths[], reason, test, failing[], readers[], wall_ms,
  restore_errors[]?}`. `writer` names the tail writer as a stable token (`verify_duration_table` /
  `load_sensitive_entry`), `paths` is the writer's WHOLE transaction — restored together, never
  partially (a green path may not ride past the gate beside an unproven sibling) — `readers` is the
  DERIVED set of test files that read those paths and `failing` each one's `{test, why}`, where `why`
  is `exit:<n>` / `timeout` / `over-budget` / `error:<Type>`. `reason` is the verdict class
  (`reader-failed` / `timeout` / `over-budget` / `error:<Type>`); it is NEVER `green`, since a green
  verdict emits no row at all. Emitted by `land` post-ff, in-lock, before the `git add` that would
  have staged the write, and folded into the SAME fresh bookkeeping commit — so the record of the
  refusal lands even though the write did not. THE DIFFERENTIAL A READER MUST HOLD: this row is NOT
  a failed land and NOT a failing test on `main` — the land is GREEN and `main` carries exactly the
  verified tree; what the row says is that a re-derivable bookkeeping write was DEFERRED to the next
  land. One row is a deferral; a run of them for one `writer` means that writer and its readers
  genuinely disagree (the SPEC-0119 rule-42 debt line reports exactly that shape).

  **land_batch_formed** (SPEC-0184 rules 1-2 + the realization exit criterion) — ONE row per
  FORMED batch, recording what the batch was and what it actually SAVED.
  `data: {members, paying_members, batch_max, branches[], batch_id?, engagement?}`.
  `members` is the member COUNT and `paying_members` is how many of them would have run a full suite
  pass ALONE (an OBSERVABLE change under `_classify_inert_paths`; an inert one pays nothing). The two
  are SEPARATE keys and MUST NOT be collapsed into one number: a batch of 4 carrying 1 paying member
  reads as «4.0 lands per pass» on the member count alone while it actually saved ONE pass, and
  exposing exactly that gap — a repo assumed to benefit while saving nothing — is why the metric
  exists. `paying_members` UNDER-counts by design (a member whose changed-path set cannot be read is
  not counted), so the recorded saving is never larger than the proven one.
  `engagement` (str, optional) names WHY the batch was or was not engaged
  (`kernel-authored-verify` | `project-declared-combined-candidate-safe` | the
  `project-authored-verify-*` refusals) — diagnostic only; nothing branches on it.
  `queue_excluded` (list, optional) names each branch the formation SAW and did not admit, with its
  reason. Two families, and the split is what `queue_depth` below is derived from. The CLOSED one —
  written by the queue read itself for a candidate it judged NOT a live waiting peer at that instant:
  `stopped-waiting` | `terminal-row-undatable` | `liveness-unreadable` | `stale-wait-row` |
  `clock-skewed-wait-row` | `undatable-wait-row` | `landed-member-still-parked` |
  `landed-member-wait-undatable`. The OPEN one — written by a filter DOWNSTREAM of that read, for a
  candidate that WAS waiting and that this formation declined to carry (the batch cap, a cost class,
  a rebaseline or supersession, an incompatibility, and whatever a later filter adds). A reader must
  not treat the enumeration as closed in the second direction: the family grows with the filters.
  `queue_depth` (int) is the LIVE candidates that formation saw — the admitted peers plus the
  branches a filter downstream of the queue read declined to carry. It rides EVERY row;
  a candidate the queue read itself judged no longer waiting is not queue load and does not count,
  though its reason still appears in `queue_excluded` above. Before it was written only at
  `members: 1` and counted the whole sink, so it read backwards — absent whenever peers existed,
  8-10 stale ghosts whenever they did not.
  **A ROW ALSO APPEARS AT `members: 1` WHEN — AND ONLY WHEN — `queue_excluded` IS NON-EMPTY**
, carrying the additive `solo: true` (the mark describes the BATCH, not the queue —
  `queue_depth` is on every row). Rule 1 scopes its byte-identity promise to a QUIET repo, so a solo land whose queue was
  genuinely EMPTY still emits NO row at all — that half is unchanged — while a solo land that
  DROPPED candidates is no longer indistinguishable from it (two 2026-08-17 solo lands were
  unclassifiable for exactly that reason). A reader counting real FORMATIONS must therefore filter
  on `members > 1` (equivalently, exclude `solo: true`) rather than counting rows.

  **land_batch_head_restored** (SPEC-0184 rule 4) — ONE row per attempt to take a batch's
  peer merges back OFF the head member's own branch, emitted on every end where the batch did not
  land. `data: {branch, pre_sha, outcome, reason, batch_size, peers[], error?}`.
  `outcome` is `restored` | `failed`; `reason` names the end that triggered it
  (`red-batch-dissolve` | `land-ended-without-landing`). `peers` is the MERGED set whose commits were
  on that branch, so the row states WHOSE work was involved rather than only that something happened.
  **A `failed` row is the point of the event type, not its error case.** The restoration this records
  was previously wrapped in a bare `except: pass`, which made an unperformable undo indistinguishable
  from an unnecessary one — and left another card's commits in a branch's history with nothing
  anywhere saying so. A `failed` row carries `error` (the git message or the reason the reset could
  not be attempted) and is accompanied by an explicit stderr block naming the remedy; it is what makes
  the residue discoverable by a later session.
  **NO ROW IS EMITTED WHEN NO PEER WAS MERGED** — the `not-needed` outcome is not journaled, because
  a land that merged nothing has nothing to undo and rule 1's N=1 identity forbids adding a row to a
  singleton land. Note the asymmetry that is deliberate: absence of a `pre_sha` is NOT what decides
  this. Silence means the batch state proved no peer merge happened; a merged batch with no recorded
  undo target emits `failed`, never silence.
  **EMITTED ONLY WHEN `members` > 1** — the same SPEC-0184 rule 1 N=1 clause `land_member_verdict`
  carries, and enforced in the same place (inside the emitter, so every later call site inherits it):
  a singleton land is byte-identical to the pre-spec path at the event level, so it emits no row of
  this type at all, and that absence is never a missing metric.

  **bg_dispatch_halted** (per the dispatch contract — `plans/fresh-session-task-dispatch-context-economics-hand.md`,
  filed) — the terminal STOP marker a dispatched background Build session emits when it hits a hard
  governance boundary mid-task (audit-loop ceiling / genuine architectural fork / auditor ABORT) instead of
  closing. It is the "stop-and-look" trigger for the controller. Counterpart of `task_closed`: BOTH are the
  two terminal events of a dispatched session (done vs halt).
  ```jsonc
  {"ts": "...", "type": "bg_dispatch_halted", "task_id": "T-XXXX",
   "data": {"dispatch": "<dispatch-tag>", "reason": "audit-ceiling|owner-wait|auditor-abort: <detail>",
            "passes": <n>, "stage": "<current_stage>"}}
  ```
  As the BLOCK-side wait carrier it MAY additionally carry the OPTIONAL normalized `wait_reason` (per
  SPEC-0135 §5 — the shared pause/block reason vocabulary at §Normalized provider×model×effort
  vocabulary), ALONGSIDE the free `reason` detail string; additive / P5-safe.

  **timing_instrument_reading** ( — the SPEC-0105 §2c quiet lane; SPEC-0077 §3b):
  ONE row per REGISTERED timing instrument per quiet-lane run, whatever happened. It is a NEW event
  TYPE, disjoint from the `reads` keys added to the existing `cli_invoked` row: those are new
  KEYS on an existing type carrying a read-cost counter, this is a new TYPE carrying a wall-clock
  READING. The two never share a row and neither is derivable from the other.
  ```jsonc
  {"ts": "...", "type": "timing_instrument_reading",
   "data": {"instrument": "<registry id>", "verdict": "ok|failed|skipped",
            "duration_ms": <int|null>, "exit_code": <int|null>, "serialized": true,
            "baseline_median_ms": <number|null>, "delta_pct": <number|null>,
            "regression": <bool>, "readings_considered": <int>, "reason": "<str|null>"}}
  ```
  - `verdict` — `ok` (the instrument ran and exited 0) / `failed` (it ran and exited non-zero, was
    killed by the lane's timeout, or its REGISTERED file/leg did not resolve) / `skipped` (the host
    was not quiet — a verify held an admission slot past the ones this lane holds, on either side of
    the run). The split is by WHOSE fault the missing number is, not by whether a process started:
    `skipped` is the TRANSIENT, blameless case that will simply be measured again tomorrow, and it is
    silent by design; an unresolvable registration is a PERMANENT defect that would otherwise let an
    instrument quietly stop being measured for weeks under a verdict that reads as normal, so it is
    `failed` and raises the lane's `alert` (this matches SPEC-0105 §2c, whose `skipped` clause is the
    lane-could-not-run-at-all case). A run that produced no row at all is a DEFECT, not a state: the
    lane emits one row per registered instrument unconditionally, so an absent row means the lane
    itself did not run.
  - `duration_ms` — the measured wall-clock, and the WHOLE POINT of the row. NULL, never 0, for a
    `skipped` reading: a fabricated 0 would enter the baseline and pull every later comparison down
    (the no-fabricated-zeros discipline).
  - `baseline_median_ms` / `delta_pct` / `regression` / `readings_considered` — the report-only
    regression signal, computed against the TRIMMED median of that instrument's last 7 prior readings
    folded from this same type. With fewer than two priors there is no baseline: `baseline_median_ms`
    and `delta_pct` are null, `regression` is false, and `readings_considered` says how few were
    found. `regression: true` moves NO verdict and NO exit code (SPEC-0105 §2c).
  - `serialized` — records that this reading was taken with the instruments run one at a time and the
    verify-admission pool held, i.e. that the reading's own precondition held when it was taken. A
    reading is interpretable only against the conditions it was taken under.

  ### Terminal-marker contract + Per-dispatch correlation (dispatched sessions) → SPEC-0153
  The dispatched-session **terminal-marker contract** and the **per-dispatch correlation**
  fields were SPLIT VERBATIM into **SPEC-0153** under the SPEC-0120 §3 must-split ceiling
  (SPLIT-never-delete). Fetch them via `bin/yitc-v2 graph query SPEC-0153`.
  ### Event-type catalog extension → SPEC-0161
  The **event-type catalog extension** — the maximalist-capture event types: the
  fundamental-gap events (`dissonance_detected`, `consumer_read_evidence`, `live_trigger_evidence`,
  `task_paused`, `task_resumed`), the general maximalist-capture events (`owner_directive`,
  `ai_reasoning_note`, `failed_attempt`), the retired stage-timing events (`stage_entry` / `stage_exit`,
  `task_picked`), the LIVE `stage_entered` content-delivery event, `check_admission_demonstrated`,
  `spec_activated`, `test_class_executed`, and the followup-capture events — was SPLIT VERBATIM into
  **SPEC-0161** under the SPEC-0120 §3 must-split ceiling (SPLIT-never-delete). This parent keeps
  the universal schema, the required event types, and the §Normalized provider×model×effort vocabulary.
  Fetch the extension catalog via `bin/yitc-v2 graph query SPEC-0161`.

  ## Rationale

  Source: AGENTS §events.jsonl schema + §Event types catalog extension (the always-loaded handbook prose,
  kept in place until, which stripped it to pointer-stubs). This spec is the `retrieved` tier home
  (Part I-B bulk demote, plan `part-i-b-tier-split-carving-floor-wiring-first-the` §Phase-2): situational
  reference prose consulted WHEN authoring/validating an event surface moves out of the always-loaded
  budget into a query-only retrieved spec (SPEC-0007 §5a), reached via the AGENTS pointer-stub + `graph
  query`. It is NOT floor-triggered: emitting an event is an append-only, non-gated action ( — a
  `before-event` trigger would be obligation-set creep, anti-cx F4). Prior-art: the same query-only demote
  shape SPEC-0007 §5a names the DEFAULT for situational reference catalogs; SPEC-0014/0015/0016 are the
  floor-triggered control-point analogues (Part I-A).

  ## Verification

  Probe CONTRACTS (not one-time results):
  - **VP1 (fidelity, moved-not-lost):** the key phrases of each demoted section resolve in THIS spec and
    are ABSENT from AGENTS.md (probe: `grep "Universal schema"` / `grep "Event-type catalog extension"` /
    `grep "Fundamental-gap-related"` present here, the bodies gone from AGENTS.md — only the pointer-stubs
    remain). RED-GREEN: the grep-absent assertion fails BEFORE the AGENTS strip.
  - **VP2 (delivery, query-only):** `bin/yitc-v2 graph query SPEC-0025` resolves this node; the
    always-loaded AGENTS §events.jsonl-schema + §Event types catalog stubs name this spec id + the lookup
    command. Both halves of the ratification probe (pointer surface + lookup command) are nameable.
  - **VP3 (query-only, no floor-trigger):** `graph/floor-trigger-map.md` gains NO `before-event` trigger
    (negative probe — this spec's `binding:` is `[query-only]`, a residency token with no verb surface;
    the four triggers stay commit/audit/closure/rule-change). AND it is NOT in
    `binding_report.dangling_specs` ( query-only token).
  - **VP4 (graph-indexed):** `bin/yitc-v2 graph build` indexes SPEC-0025 as a `spec` node.
  - **VP5 (stage_entered discoverable + P5-safe, /AU-2):** a synthetic
    `event stage_entered --data '{"stage":...,"delivered":[...],"delivered_verbs":[...]}'` append is
    returned by `journal query --type stage_entered` with the bundle rendered in the summary column, AND
    a mixed journal with other event types still queries green (no reader breaks). Committed regression
    coverage: `tests/test_journal_query.py::test_stage_entered_discoverable_and_p5_safe`.
  - **VP6 (terminal-marker contract):** a synthetic dispatch emits BOTH a `task_closed` and a
    `bg_dispatch_halted` keyed by the SAME top-level `task_id` AND the same `data.dispatch` tag into a
    worktree journal; ONE scoped query (`type in {task_closed,bg_dispatch_halted}` AND `task_id==<id>` AND
    `data.dispatch==<tag>`) returns BOTH terminals — exercising key (task_id) + tag (data.dispatch) +
    one-location. RED-GREEN: a halt keyed only by `data.task` (the run-9 form) is MISSED by the
    `task_id`-scoped query. Committed regression coverage:
    `tests/test_dispatch_terminal_marker.py::test_one_query_finds_both_terminals`.
  - **VP7 (per-dispatch correlation):** a synthetic dispatch emits its full chain
    (`startup_protocol_completed -> task_picked -> tests_passed -> task_closed`) under ONE `session_ref`;
    ONE filter `journal query --session <session_ref>` returns the EXACT ordered happy-path chain
    INCLUDING the recognized terminal (`task_closed`), proving the whole lifecycle is filterable as one
    unit by the envelope key. RED-GREEN: an event emitted under a DIFFERENT session_ref is absent from
    the chain. Committed regression coverage:
    `tests/test_dispatch_correlation.py::test_one_session_filter_returns_full_ordered_chain`.
  - **VP8 (observation-loop raw fields + vocab present, / SPEC-0135):** the amended body
    LISTS every added raw observation field — `session_started` {provider,model,effort,cores,mem_gb,
    host_label}, `external_audit_completed` {provider,model,effort,duration_ms}, `stage_entered`
    {ctx_pct}, `land_completed` {load1,peak_mem}, `task_closed` {class,audited,audit_passes},
    `task_paused`/`bg_dispatch_halted` {wait_reason} — AND carries the §Normalized provider×model×effort
    vocabulary (allowed keys + `"unknown"`/null fallback + opaque `session_config`→triple mapping + the
    `wait_reason` enum). State-check (documentary spec, no code probe): `bin/yitc-v2 graph query SPEC-0025`
    renders the fields + the vocabulary subsection; grep-absent of any usage/cost source-fact confirms the
    SPEC-0135 §3 read-time-derived-cost fence holds (identity/join-keys only).

