  `bin/lib/memory.py#resolve_server_actor`, stamped in the single host append wrapper
  (`_append_event`) so all three emit sites — the ok emit, `_emit_land_abort`, and its
  clearing copy — are covered by one home. SERVER-ISSUED and NOT CALLER-ASSERTABLE (SPEC-0169 rule 3
  applied to a record): the identity is the passwd name of the uid the process runs as
  (`memory.os_identity`, deliberately NOT `getpass.getuser`, which an exported `USER`/`LOGNAME` can
  move), no argument or environment variable reaches it, and the stamp OVERWRITES any `actor` a
  caller pre-seeded into the payload (`actor` is additionally a RESERVED `--data` key).
  VALUES: a provisioned registry user's NAME when a non-owner acted; `ai-agent` when the owner-role
  host user did (unchanged corpus meaning); and the literal `"unresolved"` when the identity could not
  be resolved at all — never a null and never an absent key, so "nobody was distinguishable" stays
  distinguishable from both "not recorded" and "the agent acted" (the non-fabrication line).
  Unlike the SPEC-0169 gate it borrows its derivation from, this NEVER refuses: a land must not fail
  because a passwd lookup did.
  `no_tests` (bool), `owner_authorized` (bool), `no_tests_reason` (str, present only when set)
