  \ rows whose `rescued` is true\nand that carry no `lane`. Shape and semantics are\
  \ homed at the writers (`bin/lib/land_verify_legs.py#_layer_unit_reruns`,\n`bin/lib/worktree.py#_consumer_zero_probe_guard`)\
  \ and not restated. Report-only: a unit is cleared\nonly by passing alone on a usable\
  \ report, and this key records that it did.\n`failed_output_tail` (dict) = THE LAST\
  \ OUTPUT OF EVERY FILE THE RUN STILL FAILS ON. For\neach file named by the run's\
  \ returned failures: the last <=40 lines of that file's raw combined\nstdout+stderr,\
  \ each line clipped to 200 chars — a failure with EMPTY output records `[]`, never\
  \ an\nabsent entry, and a timeout kill records the partial output drained before\
  \ it. A file its isolated\nretry cleared records nothing. ONE aggregate bound: at\
  \ most 20 entries — past 20 failing files the\nfirst 19 by name keep their tails\
  \ and the 20th entry is `(overflow)`, naming how many were not\nrecorded. ABSENT\
  \ — never `{}` — on a run with no failure. A ROUTED land carries it per leg\nin\
  \ the venue envelope and folds it onto `venue_failed_output_tail`: ONE `{file: [...]}`\
  \ map,\ncandidate-leg keys bare, pinned-leg keys `[pinned/last-green] <file>` (the\
  \ `failing_assertions`\nprefix), under the same 20-entry bound, ABSENT when no leg\
  \ recorded one. It exists because the\nrunner's 400-char failure excerpt and the\
  \ leg's first-line-per-file record left a venue failure\nreadable only as «(no assertion\
  \ captured)». Report-only, on the `flaky_retry` precedent: no new\nevent type, no\
  \ second metrics path, no new store, and it gates nothing.\n`load_sensitive` (dict|str)\
  \ = WHAT THE SERIALIZED TAIL DID on this land. The runner reads\nthe committed carrier\
  \ `tests/load-sensitive.txt` (the declared load-sensitive set: one test file\nper\
  \ line, comment-tolerant, ENTERED automatically at the land tail and REMOVED only\
  \ by a card) and\nruns every listed file AFTER the concurrent pool, one at a time,\
  \ on both legs; a pass or fail there\ndecides the verdict exactly as a pool result\
  \ does — the set moves WHERE a file runs, never WHETHER.\n`{tail: [{file, outcome}],\
  \ unresolved?}` — `outcome` is the file's real verdict in the same closed\nvocabulary\
  \ as `per_file_outcomes` (`not-started` when a tripped fail-fast gate skipped the\
  \ tail),\n`unresolved` (present only when non-empty) names listed files this run\
  \ did not discover. A ROUTED\nland folds the per-leg record onto this SAME unprefixed\
  \ key from the envelope (`venue_load_sensitive`\nper leg), and an envelope that\
  \ never carried the key folds the STRING `\"unknown\"` — never `{}` and\nnever absence,\
  \ both of which would read as \"every listed file passed\" (SPEC-0165 item 11).\
  \ ABSENT\n— never an empty dict — when the carrier lists nothing, so a repo without\
  \ a set reports\nnothing it did not do and its payload is byte-unchanged (additive\
  \ / P5-safe). Report-only, on the\n`flaky_retry` precedent: no new event type, no\
  \ second metrics path, no new store.\n`cost_zone` (dict) is RETIRED by (2026-10-04)\
  \ and is NEVER WRITTEN AGAIN. It was the\nrecord-only shadow of a cost-zone verify\
  \ policy that was cancelled before it governed anything\n(draft <workshop-spec>,\
  \ withdrawn): what that policy WOULD have decided for the land, written\nbeside\
  \ a verify that ran exactly as it does without the key. It stays READ-TOLERATED\
  \ on the rows\nthat carry it — the lands of 2026-10-04, plus any land that had already\
  \ loaded the pre-removal\nengine when the removal reached `main` — so a reader folding\
  \ that window still resolves it; no\nreader may require it, no writer may emit it,\
  \ and no sub-key schema is registered for it any\nlonger.\n\n`per_file_durations`\
  \ (dict) = the BOUNDED PER-FILE duration record — the sub-payload that\nmakes test-duration\
  \ GROWTH observable at all. Before it, `verify_metrics` carried AGGREGATES ONLY\n\
  (measured: 1527 rows, the complete key union being worker_count / test_file_count\
  \ / verify_wall_ms /\nqueue_wait_ms / mem_peak_kb / fail_class + the four selection_*\
  \ keys) — not one per-file duration in\nthe journal's whole history, so nothing\
  \ downstream could watch duration creep: there was no SERIES,\nonly one-off measurement\
  \ campaigns. The runner necessarily HAS the datum (each test file is its own\nsubprocess\
  \ under the SPEC-0071 per-file wall clock) and simply discarded it. PRESENT whenever\
  \ at\nleast one test file STARTED; ABSENT — never an empty dict, never a fabricated\
  \ 0 — on a run\nthat measured nothing (a no-test-files verify), so the pre- payload\
  \ of such a run is\nbyte-unchanged (additive / P5-safe). Four keys — three from,\
  \ plus `duration_series`\n(described below): `slowest_files` (list[dict] —\n`{file:str,\
  \ wall_ms:int, outcome:str}`, DESCENDING by wall, AT MOST `_VERIFY_SLOWEST_FILES_N`\
  \ = 10\nentries) and `wall_ms_pct` (dict — `p50`/`p75`/`p90`/`p99`/`max`, integer\
  \ ms, NEAREST-RANK over the\nwhole sample so every reported value is a real measured\
  \ file's wall, never an interpolated midpoint)\nand `sample_count` (int — the percentile\
  \ BASE; read beside `test_file_count` it STATES how many files\nnever started under\
  \ a fail-fast abort, instead of leaving that gap implicit).\nTHE BOUND IS THE DESIGN,\
  \ not a tuning knob: recording all ~800 files per land is EXPLICITLY REJECTED\n\
  — at ~55-85 bytes/entry that is ~45KB per land, which across the 1527 metric-bearing\
  \ lands already\njournaled would have added ~68MB to a ~136MB events.jsonl (≈50%\
  \ growth of the entire log) for a\npayload no reader consumes per-row; the bounded\
  \ record is ~980B/land (~1.1% over the same series).\n`slowest_files` and `wall_ms_pct`\
  \ are COMPLEMENTARY and both load-bearing: the top-N is the TAIL\n(where one newly-pathological\
  \ file surfaces first), the percentiles are the SHAPE (a broad uniform\ncreep moves\
  \ p50 while leaving top-N membership byte-identical — the growth mode a slowest-only\n\
  record is blind to). N=10 is derived, not round: on an 802-file suite the p99 is\
  \ the 8th-slowest\nfile, so 10 covers the whole ≥p99 band by construction.\n`duration_series`\
  \ (dict inside `per_file_durations`) = the WHOLE distribution, compactly.\nThe two\
  \ keys above are a TAIL and a SHAPE, and neither can be re-simulated: with 10 of\
  \ ~877 files\nnamed, no question about a run's shape can be ANSWERED, only bounded\
  \ — the union of the recorded\ntop-tens over 416 historical runs yields 45 distinct\
  \ files, and every estimate about the other 830\nhad to assume them flat, which\
  \ erases the mid-tail and understates whatever it computes. So this\nthird key represents\
  \ EVERY file that STARTED — that is its atomic rule — inside a stated byte\nceiling.\
  \ Four keys: `walls_ds` (str — one quantised wall per started file, comma-joined,\
  \ in the\nrunner's DISPATCH order), `unit_ms` (int — the quantum those values are\
  \ expressed in; a reader\nmultiplies), `count` (int — how many values `walls_ds`\
  \ carries, so completeness is ASSERTABLE\nagainst `sample_count` rather than inferred\
  \ from a parsed string) and `order` (str — the recorded\norder, NAMED rather than\
  \ implied, so a later change of dispatch order cannot silently invalidate\narchived\
  \ rows: a reader that does not recognise the value stops).\nDURATIONS IN DISPATCH\
  \ ORDER, NOT NAMES — and that is the whole reason a compact form suffices. The\n\
  two questions this record exists to settle offline, from ONE recorded run and with\
  \ no extra verify,\nare (a) longest-first vs the current alphabetical dispatch and\
  \ (b) the skip-top-N curve. Both are\nlist-schedule simulations over a worker pool,\
  \ and both need exactly the duration MULTISET (any\nreordering) plus the DISPATCH\
  \ ORDER (to reproduce the current alphabetical baseline). Neither needs\na file\
  \ NAME — and names are what the rejected raw dump spends its bytes on. The runner\
  \ enumerates\nthe emitter sorts by file name, so the values are laid out in NAME\
  \ order; recording COMPLETION\norder instead would leave the payload well-formed\
  \ and make the baseline arm of every simulation\nwrong. ** amends what that order\
  \ MEANS, not what it IS:** name order WAS the runner's\ndispatch order when this\
  \ key was defined. The runner now dispatches longest-recorded-first\n(SPEC-0132\
  \ §6), so `order: \"alphabetical\"` stays exactly true as a statement about this\
  \ key's\nLAYOUT — which is all a simulation reconstructing the alphabetical baseline\
  \ needs — and is no\nlonger a description of the schedule that ran. The schedule\
  \ that ran is recorded separately, by\n`dispatch` below.\nQUANTUM: 100 ms, round-to-NEAREST,\
  \ CLAMPED to >= 1 unit (a started file always cost something; a\nzero would be a\
  \ free job that flatters every schedule it appears in). Measured tolerance: a\n\
  13-worker makespan recomputed from the series lands within 1% of the same computation\
  \ over raw\nper-file walls, on both arms (0.05% / 0.02% on the 800-file probe) —\
  \ the compaction is lossy in\nbytes and not in the answer.\nSIZE, the fence AC1\
  \ alone would not hold: ~4 bytes per file, so the WHOLE `per_file_durations`\nblock\
  \ measures 3193B on an 800-file run against a stated 8192B ceiling\n(`_VERIFY_DURATION_SERIES_MAX_BYTES`),\
  \ versus ~46KB for the 800 raw named entries. The ceiling is\nheld BY CONSTRUCTION,\
  \ never by truncation — a series that had to be cut would stop representing\nevery\
  \ file, which is the one property the key exists for.\nPER-REPOSITORY BY CONSTRUCTION:\
  \ the record rides `land_completed` on the journal of the repo whose\nsuite ran\
  \ (`-C <consumer> land` writes THAT consumer's events.jsonl), so the kernel's 877\
  \ files and\na consumer's entirely different suite never share a table. There is\
  \ deliberately no cross-repo\nduration store; a reader must take the table belonging\
  \ to the repo it is scheduling, and a fresh\nconsumer with no history is the normal\
  \ first case.\nREPORT-ONLY, and this is a fence rather than an omission: nothing\
  \ consumes the series to order,\nskip, or gate anything. Recording the number is\
  \ this record; ACTING on it (the dispatch reorder) is\na separate decision, to be\
  \ made ON this number rather than on the estimate that preceded it.\n`dispatch`\
  \ (dict, SPEC-0132 §6) = WHAT SCHEDULE ACTUALLY RAN. The runner hands its files\n\
  to the pool in DESCENDING recorded duration against the fixed per-repo table\n(`<test_dir>/verify-durations.json`),\
  \ and that order is otherwise unobservable after the fact:\n`duration_series` is\
  \ published in NAME order by design, so a reader could only RE-DERIVE the\nschedule\
  \ by re-sorting against the table, which evidences nothing about what the runner\
  \ did. Four\nkeys: `order` (\"duration-desc\" when a table was read, \"name\" when\
  \ none was — so the degraded case\nSAYS so rather than being inferred from a missing\
  \ key), `table_files` (how many files the table\nnamed), `unrecorded` (how many\
  \ dispatched files the table did NOT name, and were therefore\nscheduled at the\
  \ imputed median — the DIVERGENCE, visible per land rather than only on demand),\n\
  and `head` (the first three files actually handed to the pool — the evidence: on\
  \ a name-ordered\ntree these are the alphabetically-first files, here they are the\
  \ heaviest). Additive single key on\nthe existing payload: no new event, no second\
  \ metrics path, and every reader was checked for\nwhole-dict equality before it\
  \ was added (the additive-payload lesson). PRESENT whenever\n`verify_metrics` is,\
  \ including on a run with no table — an absent table is a normal state, not a\n\
  reason to omit the record of how it was scheduled.\n`verify_table_refresh` (dict,\
  \ SPEC-0132 §6) = THE DURATION TABLE'S OWN REFRESH RECORD, and\nthe only surface\
  \ on which a table that stopped tracking the suite is visible. A green land now\n\
  derives the table from the measurement it already took and rewrites it under a stated\
  \ write policy;\nthis key records what that decision WAS. Keys: `written` (bool\
  \ — always present), `reason` (one of\n`coverage` / `order-gain` / `below-threshold`\
  \ / `no-measurement` / `no-test-dir` / `no-test-files` /\n`delegated` / `error:<Type>`),\
  \ `samples` (how many green lands the median folded), plus the decision\narithmetic\
  \ (`recorded` / `derived` / `discovered`, and on the value arm `makespan_before_ms`\
  \ /\n`makespan_after_ms` / `gain_ms` / `workers`). A NOT-WRITTEN land is recorded\
  \ just as loudly as a\nwritten one — `below-threshold` is the EXPECTED steady state\
  \ (the order is deliberately immobile) and a reader must be able to tell it apart\
  \ from a refresh that silently never ran, which is\nprecisely the three-day blind\
  \ spot this card closed. `delegated` is the refusal inherited\nverbatim: where a\
  \ project delegates its root `tests/` to a declared verify layer, the numbers would\n\
  measure the suite failing to START and nothing would read them, so the land REFUSES\
  \ to write and\nsays so. ABSENT — not empty — on a land that measured nothing (`--no-tests`,\
  \ an inert retry), so\nthose payloads stay byte-identical. Additive single key on\
  \ the existing payload: no new event, no\nnew store, no second metrics path.\n`per_layer_durations`\
  \ (dict, resolves X-0945) = the PER-LAYER duration record — the\ndecomposition of\
  \ the verify total by DECLARED VERIFY LAYER (`yitc-ops.yaml` `verify.layers`,\n\
  SPEC-0152 rule 16). Before it the journal recorded only the queue-inclusive TOTAL\n\
  `verify_duration_ms` plus per-ATTEMPT rows, so no project could see WHERE its verify\
  \ time went\nfrom its own journal: it could see THAT verify was slow and never WHICH\
  \ layer, could not tell a\nslow layer from a slow phase, and could not show a before-and-after\
  \ when it fixed one. The\nreporting consumer obtained every number of a 197s layer\
  \ by hand-instrumenting a run — the datum\nthe engine already brackets was simply\
  \ discarded. Two keys: `layers` (list[dict] —\n`{layer:str, duration_ms:int}`, in\
  \ DECLARATION order; a LIST rather than a name→ms mapping so two\nsame-named layers\
  \ cannot silently collapse to one measurement) and `attributed_ms` (int — the sum\n\
  those layers account for). RECONCILIATION, not a sum alone: the verify wall COVERS\
  \ the consumer\nlayers, so the unattributed remainder is `verify_wall_ms - attributed_ms`\
  \ (the engine\nsweep, the admission wait, setup) — parts and total sit in the SAME\
  \ dict so that subtraction needs\nno inference. UNBOUNDED, deliberately unlike `per_file_durations`'\
  \ top-N: the declared layer count\nis hand-written and a handful, so the whole record\
  \ is tens of bytes, and a top-N here would drop\nexactly the layer a project is\
  \ trying to. PRESENT only when at least one declared layer\nEXECUTED; ABSENT — never\
  \ an empty dict, never a fabricated 0 — on a land whose layers did\nnot run (a default-only\
  \ / probes / section-waiver consumer, or the engine's own build), so those\npayloads\
  \ are byte-unchanged (additive / P5-safe). The peer row on `consumer_verify_layers`\
  \ carries\nthe same `duration_ms` per layer; a row for a layer that executed NOTHING\
  \ (waived / malformed /\nskipped-disjoint-subject) carries no such field at all.\
  \ That SAME executed-layer row also carries\nTWO BOUND fields — the per-layer peers\
  \ of the kernel tests leg's\n`verify_test_timeout_s` / `verify_test_timeout_source`\
  \ above: `timeout_s` (float) = the wall bound\nthe layer's prep and command ran\
  \ under, and `timeout_source` (str, one of `env` | `layer` |\n`section` | `default`)\
  \ = which rung of the SPEC-0152 rule-16 chain supplied it — the\nYITC_VERIFY_TEST_TIMEOUT\
  \ escape hatch, the layer's own `timeout:`, the section's\n`timeout_seconds:`, or\
  \ the global default. Report-only and additive, on the `duration_ms` terms:\nnothing\
  \ gates on them, they are ABSENT on a row whose layer executed nothing, and `timeout_source`\n\
  alone is absent when the injected resolver reports no rung (never a guessed one).\
  \ The row's\n`definition_changed` is true when THIS ship's diff changed the layer's\
  \ command or its\nDECLARED bound (the layer's own, else the section's —; rule home\
  \ SPEC-0015). REPORT-ONLY, and this is a fence rather\nthan an omission: no exit\
  \ code, verdict, outcome, or admission decision reads any recorded\nduration — what,\
  \ if anything, the fleet should DO about verify shape is a separate question\n and\
  \ is explicitly not derivable from one project's measurement.\n\n`adapter` on a\
  \ `consumer_verify_layers[]` row (dict — SPEC-1006 rules 3, 4, 5,\n13) = THE PER-UNIT\
  \ REPORT OF AN ADAPTER-BACKED LAYER. `mode` says what the record was to its\nlayer:\
  \ `verdict` — the adapter's `run` was the layer's first attempt and the `outcome`\
  \ was read\noff this record (`bin/lib/land_verify_legs.py#_adapter_first_attempt`);\
  \ `report-only` — the\nlayer's `command:` exit code decided and nothing reads this\
  \ record to decide. Present ONLY on the\nrow of a layer that declares `adapter:`\
  \ and whose `prep:`, adapter or command ran; every other row\nis byte-unchanged.\
  \ Shape and\nsemantics are homed at the writer (`bin/lib/land_verify_legs.py#_layer_adapter_report_pass`,\
  \ rows\nby `#_classify_adapter_report`) and not restated; the registered keys are\
  \ `schema`, `mode`,\n`profile`, `usable`, `list`, `list_reason`, `required` (the\
  \ first attempt's `required:` checks —\nhow many ran, and the one that failed with\
  \ its exit code), `outer`, `outer_at`, `exit`, `void`,\n`load1`, `duration_ms`,\
  \ `error`, `identity`, `identity_unavailable`, `versions`, `selection`,\n`attempt`,\
  \ `attempt_unavailable`, `credit`, `lane` and `units` — a unit row carrying `project`,\
  \ `file`, `group`, `status`,\n`duration_ms`, `cases`, `skipped`, `failed_cases`,\
  \ `failed_cases_more`, `excerpt`, `lane` and\n`unrequested`. `void` lists the reasons\
  \ a report cannot be relied on: `report-missing`,\n`report-malformed`, `report-stale`,\
  \ `second-report-missing`, `second-report-malformed`,\n`unit-missing`, `unit-only-skipped`,\
  \ `unit-unrequested`, `unit-duplicate`, `non-test-failure`,\n`error-outside-units`,\
  \ `native-retry`, `nonzero-exit-all-passed`. A case identity is recorded for a\n\
  FAILED case only (passing cases are counted), so the row is bounded by the unit\
  \ count. The same\nrows ride `tests_passed.consumer_verify_layers`; a FAILED Stage-6\
  \ run on which a layer carries\nthis record also writes `consumer_verify` + `consumer_verify_layers`\
  \ on `tests_failed` (ABSENT\nthere otherwise — a failed run with no adapter-backed\
  \ layer is byte-unchanged). `identity`\n( — SPEC-1006 rule 8) is the layer's identity,\
  \ a hash over the inputs that shape this\nevidence, issued only when every one of\
  \ them is known for the run; otherwise the record carries\n`identity_unavailable`\
  \ naming what was not (`no-inventory`, `pass-incomplete`,\n`versions-unreported`,\
  \ `source-unreadable`, `source-changed`) and no hash. `versions` is what\nthat run's\
  \ `list` reported for the runner, when it reported any. Nothing reads any of them\
  \ to\ndecide. `attempt` ( — SPEC-1006 rules 13, 14), written on a layer declaring\
  \ `credit:\nshadow`, names the run that produced the record so that a later run\
  \ can read it as its previous\nattempt: `tree` — the tree git would commit from\
  \ the files on disk, the same notion and the\nsame reader as `stage6_run.tree` (`bin/lib/worktree.py#_worktree_disk_tree`),\
  \ recorded only when\nthe run left that tree as it was apart from the journal —\
  \ with its `base` and its `branch`.\nWhere the run cannot be named the record carries\
  \ `attempt_unavailable` instead: `no-base`,\n`tree-unreadable` or `tree-changed`\
  \ (`bin/lib/worktree.py#_adapter_attempt_stamp`).\n`lane` ( — SPEC-1006 rule 11)\
  \ is present only on a pass with an inventory whose\nlayer has entries on the project's\
  \ per-unit load-sensitive list: it counts the `units` that left\nthe batch and ran\
  \ after it, one at a time, and the listed entries `unmatched` by any unit of that\n\
  inventory; a unit row that ran there carries `lane: true`. Such a row decides as\
  \ every unit row\ndoes, and nothing reads the count to decide. The list's reader\
  \ is\n`bin/lib/land_verify_legs.py#_unit_lane_set`.\n\n`selection` on that `adapter`\
  \ record (dict — SPEC-1006 rules 3, 6-9) = THE SHADOW\nSELECTION DECISION, RECORDED\
  \ AND NEVER ACTED ON. Present only on a layer declaring `selection:\nshadow` whose\
  \ adapter pass ran to its end; the full layer ran whatever the record says, and\
  \ no\noutcome, exit code or admission decision reads it. Shape and semantics are\
  \ homed at the writer\n(`bin/lib/land_verify_legs.py#_adapter_shadow_decision`;\
  \ the comparison with the full run by\n`#_layer_adapter_report_pass`) and not restated;\
  \ the registered keys are `schema`, `mode`,\n`decision`, `rung`, `reason`, `related`,\
  \ `related_reason`, `base`, `changed`, `eligible`,\n`units_total`, `unknown`, `unknown_more`,\
  \ `would_run`, `would_omit`, `would_credit`, `compared`,\n`disagreements` and `error`\
  \ — an `unknown` entry carrying `path` and `why`; a `would_run` or `would_omit`\n\
  entry `file` and `project`; a `disagreements` entry `file`, `project`, `would` and\
  \ `status`.\n`reason` says what decided: `adapter-sources`, `dependency-manifest`,\
  \ `trigger-full`,\n`trigger-unit-not-listed`, `no-inventory`, `unrevealable-void`,\
  \ `related-absent`, `unknown-path`,\n`related-failed`, `related-timed-out`, `browser-layer-change`,\
  \ `related-and-triggers`,\n`selection-error`, or the reason the SPEC-0152 rule-16\
  \ skip decision ran every layer (its own\ntoken, recorded as given).\n`why` says\
  \ what made a path unknown: `deleted-or-renamed`, `outside-modelled`,\n`not-in-runner-diff`,\
  \ `runner-diff-unreadable`. The same record rides\n`tests_passed.consumer_verify_layers`\
  \ and the failed Stage-6 row, on the `adapter` terms above.\nOn a layer that also\
  \ declares `credit: shadow`, `would_credit` holds the would-credit units of\nthe\
  \ `credit` record below; otherwise it is empty.\n\n`credit` on that `adapter` record\
  \ (dict — SPEC-1006 rule 14) = THE WOULD-BE CREDIT OF A\nFIX ATTEMPT, RECORDED AND\
  \ NEVER ACTED ON. Present only on a layer declaring `credit: shadow`\nwhose adapter\
  \ pass ran to its end; the full layer ran whatever the record says, and no outcome,\n\
  exit code or admission decision reads it. Shape and semantics are homed at the writers\n\
  (`bin/lib/land_verify_legs.py#_adapter_credit_basis` and `#_adapter_credit_decision`;\
  \ the\nprevious attempt is read from its journal row by `#_adapter_previous_attempt`\
  \ through\n`bin/lib/worktree.py#_adapter_credit_bases`; the comparison with the\
  \ full run by\n`#_layer_adapter_report_pass`) and not restated; the registered keys\
  \ are `schema`, `mode`,\n`decision`, `reason`, `previous`, `changed`, `tree`, `units_total`,\
  \ `rung`, `ladder_reason`,\n`related`, `related_reason`, `eligible`, `unknown`,\
  \ `unknown_more`, `would_rerun`,\n`would_credit`, `compared`, `disagreements` and\
  \ `error` — `previous` carrying `type`, `ts`,\n`outcome`, `tree` and `base`; a `would_rerun`\
  \ entry `file`, `project` and `why`; a\n`would_credit` entry `file` and `project`;\
  \ a `disagreements` entry `file`, `project`, `would`\nand `status`; an `unknown`\
  \ entry `path` and `why`. `decision` is one of three. `units`\n(`reason` `failed-and-reached`):\
  \ the units the run would re-run — each with `why` it would:\n`failed`, `not-recorded`,\
  \ `reached` or `group` — and the units it would credit with their pass\nfrom the\
  \ previous attempt. `none`: the run is no fix attempt (`no-previous-attempt` — the\
  \ journal tail\nthat was read holds no earlier run of this layer on this branch\
  \ — or `previous-attempt-passed`). `void`: nothing would be credited, `reason` saying\
  \ why —\n`base-moved`, `previous-report-void`, `record-missing`, `record-incomplete`,\
  \ `record-ambiguous`,\n`record-tree-unresolvable`, `full-layer` (the selection ladder\
  \ answered the full layer for the\nfix's own changed paths; `rung` and `ladder_reason`\
  \ are its answer), `no-base`,\n`candidate-tree-unreadable`, `diff-unreadable` or\
  \ `credit-error`. `disagreements` lists every\nwould-credit unit that failed in\
  \ this full run. The same record rides\n`tests_passed.consumer_verify_layers` and\
  \ the failed Stage-6 row, on the `adapter` terms above.\n\n`verify_cache` (dict\
  \ / <workshop-spec>) = the CONTENT-KEYED PER-TEST result cache's own record\nfor\
  \ this run — `hit` / `miss` / `non_keyable` / `unkeyed` (ints, the four ways a test\
