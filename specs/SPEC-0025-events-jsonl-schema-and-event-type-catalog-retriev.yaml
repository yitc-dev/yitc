  \ populated\nit) — ABSENT on a `--no-tests` / inert-retry ok land, so those payloads\
  \ are byte-unchanged (additive /\nP5-safe). The LOAD-BEARING minimal subset (SPEC-0132\
  \ §2 \"the minimal subset MUST emit before final\ngovernor adoption\") is ALWAYS\
  \ present: `verify_wall_ms` (int ms — the attempt's verify wall, re-pinned\nto the\
  \ same value as the top-level `verify_duration_ms` so the nested metric never disagrees),\n\
  `worker_count` (int — the verify worker cap in effect), `fail_class` (`\"ok\"` on\
  \ the ok land emit — the\ndistinct `\"failed\"` / `\"timeout\"` classes are the\
