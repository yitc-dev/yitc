  \ until a real capture site exists,\nnever written as a fabricated 0 (the no-fabricated-0s\
  \ discipline).\nA ROUTED land (SPEC-0203) FOLDS the venue pass + local-probe leg\
  \ onto these SAME base keys\nwith the SAME meaning, from measured facts only (`bin/lib/remote_verify.py#fold_venue_base_metrics`);\n\
  a base key the routed pass does not measure is ABSENT there, never a placeholder\
