  \ row it is ABSENT, because there the rendered\nlist already IS the count. Without\
  \ it a clipped row reads 20 whatever the real figure was, which\nmeasured at roughly\
  \ a third of all firings on this journal.\nA SIXTH selection field rides CONDITIONALLY\
  \ : `selection_ran_tests` (list of str) — the\ntest-file BASENAMES this verify actually\
