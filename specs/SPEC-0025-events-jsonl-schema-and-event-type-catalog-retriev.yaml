  FOUR PRESMOKE FIELDS are RETIRED by (2026-09-12) and are NEVER WRITTEN AGAIN:\n\
  `presmoke_selected` (int), `presmoke_s` (float), `presmoke_failed` (list of str)\
  \ and\n`presmoke_skipped` (str). They recorded the POST-SYNC SMOKE — the SPEC-0181\
  \ affected\nselection run locally on the MERGED candidate tree after update-from-main\
  \ and BEFORE the\nverify-admission slot. They remain READ-TOLERATED on the 2026-09-11..12\
  \ rows that carry them, so a\nreader folding that window still resolves them; no\
  \ reader may require them, and no writer may\nemit them.\nMEASURED GROUNDS for the\
  \ retirement, folded off this repo's own journal for that window: EIGHT\nlands ran\
  \ the smoke, each costing 210.2-540.5 s against a `venue_all_in_wall_s` of 226.2-666.0\
  \ s —\nthe SAME order of magnitude, not the «seconds» premised — selecting 511-1440\
  \ of ~1530\ndiscovered test files, with ZERO `presmoke_failed` rows in the entire\
