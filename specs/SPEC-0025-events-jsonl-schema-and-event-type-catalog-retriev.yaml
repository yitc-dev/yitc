  \ value — on a full-enumeration or unmeasurable run. `len(selection_ran_tests) ==\n\
  test_file_count` BY CONSTRUCTION: both are taken from the same enumeration, which\
  \ is what lets a\nreader treat a disagreement as a corrupt row rather than as coverage.\n\
  It exists because the counts state HOW MANY files ran and never WHICH, so the known-broken-on-main\n\
  fold (SPEC-0181 §Known-broken-on-main) could clear a record only by asking \"did\
