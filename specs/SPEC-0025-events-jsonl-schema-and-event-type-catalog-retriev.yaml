  \ reservation, so every queued peer paid the duplicate minutes too. The duplicate\
  \ run\nIS the defect — a narrower bound would still be a duplicate — and the candidate\
  \ leg keeps the\nIDENTICAL check, so no coverage is lost. Per patterns/retirement-procedure.md\
  \ this took the\nmeasured-then-removed-in-one-ship arm: the mechanism had no adopter\
  \ and no consumer land ever ran it.\nTWO MORE ride CONDITIONALLY, and only when\
  \ the AC2 tripwire FIRED: `selection_tripwire_recovered`\n(int) and `selection_tripwire_tests`\
  \ (list of str) — the omitted tests whose source named a changed\npath, which the\
  \ independent oracle put BACK into the run. ABSENT — never a zero, never an empty\n\
  list — when it did not fire, because a firing is a coverage-map DEFECT and a key\
  \ that\nreported one every land would report nothing. A firing ALSO emits a durable\
  \ `deviation_captured`\n(fingerprint `selection-omitted-a-test-naming-a-changed-path`).\n\
  THAT DEVIATION ROW IS SELF-SUFFICIENT. Beside its `tests` list (the recovered names,\n\
  RENDERED clipped at 20) it carries two further CONDITIONALLY-present keys, ABSENT\
  \ rather than\nempty or fabricated whenever they would say nothing (the same discipline\
  \ the two keys\nabove follow):\n`matched_changed_paths` (map of test BASENAME ->\
  \ sorted changed paths) — the changed path that\nRECOVERED each test, so a reader\
