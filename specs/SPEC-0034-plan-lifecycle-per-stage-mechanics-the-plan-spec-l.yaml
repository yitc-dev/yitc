  \ a legitimately-abandoned retire-on-proof task carrying a wont_do_reason is as\
  \ resolved as a done one — the old mechanism is retired either way) (`_require_plan_retire_on_proof_resolved`)\
  \ — keyed on the retire-on-proof set\n    being TERMINAL (done|wont-do), NOT merely\
  \ no-longer-parked, so a task moved off `parked` but unfinished cannot slip.\n \
  \   A non-terminal (parked/ready/blocked/in-progress) retire-on-proof task means\
  \ the old is not retired → not `realized`. This is the EXIT half\n    of the entry-vs-exit\
  \ postcheck task model (the postcheck ENTRY gate deliberately allows such tasks\n\
  \    open while parked; they complete at EXIT, not at entry).\n  - **`realized`\
  \ ALSO ADVISES (non-blocking WARN — DEMOTED from a hard requirement by / Option\
  \ B) routing the postcheck retrospective's captures.** A plan's\n    `realized`\
  \ close is the corpus-altitude retrospective of the block it bounded (the owner\
