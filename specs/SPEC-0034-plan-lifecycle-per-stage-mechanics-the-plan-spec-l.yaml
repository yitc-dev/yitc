  ); so this gate ALSO WARNs (advisory — does NOT block / Option B) while\n    un-routed\
  \ `deviation_captured` events exist since the last triage watermark — the GLOBAL\
  \ backlog,\n    the SAME since-last-watermark sweep `triage run` reports (`_require_captures_routed`,\
  \ which READS\n    the EXISTING watermark + deviation journal ONLY — `_last_triage_watermark`\
