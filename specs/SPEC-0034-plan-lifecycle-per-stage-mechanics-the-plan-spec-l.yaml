                               # no code reads a scalar PARAM from it. Stays false at `active` too:
                               # the plan stages are enforced by the `plan stage` verb + the existing
                               # gates, not a code-read scalar.

implements: # durable anchors — the plan-lifecycle VERBS that REALISE these
                               # stages (NON-empty ⇒ honest exclusion from the SPEC-0013 dangling check,
