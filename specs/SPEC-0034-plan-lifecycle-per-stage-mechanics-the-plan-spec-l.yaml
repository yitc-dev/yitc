  \  - Work = PURE BUILD: the cut already happened in `decomposition`; here each filed\
  \ task runs its OWN\n    9-stage lifecycle. No \"incidental\" cutting at this stage.\
  \ The delivered bundle narrows to \"how to\n    build\" (SPEC-0027 / SPEC-0041 /\
