  \ a read-only detection, NOT a second enforcement path\n    (CHARTER non-goal #7;\
  \ the same surface-not-gate posture as the captures-routed advisory above).\n\n\
  - **realized** *(plan-stage-entry:realized — task analog: Closure; TERMINAL)*\n\
  \  - Entry gate: the real-data soak CONFIRMS works-as-intended. For a spec-bearing\
