  \    or any unknown status still BLOCKS (fail-closed whitelist). A `superseded`-after-active\n\
  \    spec subsumed by lineage evolution (its content carried forward into the active\
  \ head) thus no\n    longer false-refuses a plan whose intent IS realized. EXCEPTION\
  \ : a DELIBERATE never-active\n    terminal (`withdrawn`/`rejected`) is EXEMPT —\
  \ a deliberately-abandoned plan-born spec (a scope-cut\n    tracked as a follow-up)\
  \ is not an unfinished promise, so it does not block `realized`; the\n    fail-closed\
  \ property is unchanged for an unknown status (it is in neither the reached-active\n\
  \    whitelist nor the deliberate-terminal exemption, so it still blocks).\n  -\
  \ **`realized` = the NEW mechanism PROVEN (real-data soak) AND the OLD mechanism\
  \ RETIRED.**\n    So this gate ALSO requires every RETIRE-ON-PROOF task (a task\
