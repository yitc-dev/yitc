id: SPEC-0034
title: 'Plan lifecycle — per-stage mechanics, the plan-spec linkage chain, and the mandatory big-plan check at the decomposition-gate'
# `class:` REMOVED — a spec carries both layers as body sections (Scenario + Internal).

status: active
                               # (activation_owner_task:). `active` is the ONLY normative status
