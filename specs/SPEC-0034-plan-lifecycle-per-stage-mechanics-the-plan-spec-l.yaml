  \ Living/WIP content in an ACTIVE plan is legitimate; but a\n    `realized` plan\
  \ is TERMINAL (historical record + pointer only), so BEFORE this transition any\n\
  \    durable/living content the plan HOSTS — criteria, rosters, checklists, standing\
  \ rules, living\n    tables — MUST be relocated to a STABLE home (a spec or a non-FSM\
  \ pattern), the terminal plan\n    retaining only a historical record + a pointer\
  \ to that home. This EXTENDS the drain-doctrine\n    (SPEC-0039 buffer-drain / SPEC-0035\
  \ trial carrier-boundary) to the plan-realize boundary: no\n    durable content\
  \ is orphaned in a terminal carrier (P5 one-home / P7). The framing is\n    drain-AT-realize,\
  \ NOT \"plans never hold durable content\". The `audit post --plan` finalization\n\
  \    overlay checks drain-correctness (SPEC-0036 `PLAN_FINALIZATION_LENS`); discipline\
  \ + auditor-checked,\n    no new code-gate (CHARTER non-goal #7).\n  - **Standing\
  \ realize-trigger (owner-light cadence) — DETECT in Review, EXECUTE in a worktree.**\n\
  \    Finished postcheck plans must not pile up unfinalized. The weekly Review-cadence\
  \ sweep (QUEUE §Re-review)\n    is the read-only DETECTOR: `plan list --status postcheck`\
  \ (a read on main — within the Review boundary)\n    surfaces realize-ready plans\
  \ (cross-check the `postcheck-plans-readiness` view). RUNNING\n    `plan stage realized`\
  \ is a WRITE to `plans/`, so it is NOT done from a bare Review session — like ANY\n\
  \    Review filing it takes a `work/<slug>` worktree (AGENTS §Writes-happen-in-a-worktree),\
  \ owner-cued, and\n    passes the existing `plan stage realized` finalize-gate (above).\
  \ No new daemon/timer/verb — the cadence\n    and the gate already exist; this only\
  \ NAMES the standing trigger and routes the write correctly.\n  - If the real-data\
  \ runs DISPROVE the intent → the exit is `partial`/`rejected`, never `realized`.\n\
  \n- **Terminals** *(NOT bound on the plan-stage-entry axis — `_is_valid_plan_stage_entry`\
  \ accepts only\n  the 8 LINEAR stages, so `partial`/`rejected`/`cancelled` carry\
  \ no delivery slice; they are reachable\n  from any active stage)*:\n  - `partial`\
  \ — partly decomposed; the remainder lives on as a NEW plan (`--deferred`), never\
  \ as prose\n    (the deferral-as-prose anti-pattern — a deferral MUST be a tracked\
  \ task).\n  - `rejected` / `cancelled` — abandoned (`--reason` required); the file\
  \ STAYS in `plans/` (status-filtered),\n    so `from:` / `closed_into` path citations\
  \ stay valid. **Live-state read :** `cancelled`\n    REFUSES a plan that is still\
  \ LIVE — in `postcheck` (a soak is running) or with an UNRESOLVED\n    retire-on-proof\
  \ member (a linked task carrying a `return_trigger`, `_retire_on_proof_unresolved`)\n\
  \    — because an age-only sweep («older than 2 days», 2026-09-13T03: 22 postcheck\
  \ soaks cancelled) is\n    not a reason to end a live plan. The override is explicit\
  \ and journaled: `--despite-live-state`\n    records the live facts as `despite_live_state`\
  \ on `plan_stage_entered`. Tripwire:\n    `tests/test_plan_stage.py::test_t12845_age_cancel_reads_postcheck_and_live_trigger_state`.\n\
  \  - **Never-executed-plan close (NO standing replacement route — owner-resolved\
  \ 2026-06-06).** A\n    plan that never entered `executing` (it was absorbed by\
  \ another artifact before its own stage chain\n    ran) closes ONLY as `cancelled`/`rejected`\
  \ with `--reason` naming the absorbing artifact — NOT\n    `realized`. `realized`\
  \ is reserved for a plan that ran its OWN stage chain to `postcheck` (the FSM\n\
  \    already enforces this: `realized` is reachable only from `postcheck`). This\
  \ retires the old draft→\n    realized jump the `plan close` shim allowed (the `plan-close-shim-ungated-terminal-jump-draft-to-realized`\n\
  \    deviation); with the shim removed there is no longer any path to a never-executed\
  \ `realized`.\n\n### Realized-by-record — the soak-OUTSIDE-the-FSM terminal (X-0048)\n\
  A `trial`/record plan whose prototype was BUILT + soaked + handed-off **OUTSIDE\
  \ its own\ndecomposition** (the productization shipped elsewhere — e.g. the kernel\
  \ side via a cross-task) has\nNO clean FSM terminal: driving it `draft → … → realized`\
  \ is retroactive ceremony over already-shipped\nwork, and the build-oriented gates\
  \ (the `gate-specs` MANDATORY-BLOCKING audit, the decomposition cut)\nREFUSE — they\
  \ RED on «nothing left to build project-side». The pre- workaround was to close\
  \ such\na plan with a closure-record blockquote AT `status: draft` (<project>, N≥2:\
  \ ui-enhancement-procedure +\ndeploy) — an UNGOVERNED terminal invisible to the\
  \ FSM. **That draft-blockquote workaround is RETIRED.**\n\nThe governed terminal:\
  \ **`plan stage realized --by-record --into <IDs> --soak-evidence <ref>\n--handoff\
  \ <ref>`** — reachable from ANY active stage (like the wont-do terminals), it closes\
  \ the plan\nto `realized` with a `realized_by: record` marker, BYPASSING the build-oriented\
  \ finalization gate (the\naggregate `audit post --plan`) and substituting it with\
  \ TWO requirements: (i) an EXPLICIT\neligibility declaration, and (ii) EXISTING\
  \ soak-proof + handoff evidence:\n  - **Eligibility declaration (the predicate —\
  \ NOT «any plan with two refs»):** the plan body MUST\n    declare a `## Realized-by-record`\
  \ section (owner-authored: WHICH soak-proof + WHICH handoff\n    happened OUTSIDE\
  \ this plan's decomposition, and why it is record-class). It is PRESENCE-checked\n\
  \    (the same heuristic model as the `## Postcheck probe block` / `## Trial protocol`\
  \ declarations —\n    no content parser, no detector, CHARTER §P1). A plan that\
  \ does NOT declare it is REFUSED the\n    shortcut (`read_gate_refused` kind=verification-exists).\
  \ This is the owner-judgement eligibility\n    gate, mirroring `trial` entry (SPEC-0035\
  \ rule 2) — persisted + auditable, not a stored boolean.\n  - `--into` — the artifact\
  \ ID(s) the plan became (where the work), reverse-linked like any close.\n  - `--soak-evidence`\
  \ — a ref to the EXISTING soak/real-data proof (a journal ref, a cross-task ID,\
  \ an\n    external artifact). Recorded in `soak_evidence:` for the trail.\n  - `--handoff`\
  \ — a ref to the EXISTING handoff (the productization that took the prototype outside\
  \ this\n    plan's decomposition). Recorded in `handoff:`.\nBOTH evidence refs are\
  \ REQUIRED + non-empty; a plan that CANNOT supply them is REFUSED the shortcut and\n\
  must take the normal FSM path (the gates are NOT loosened for an unproven plan —\
  \ the evidence\nrequirement IS the gate, mirroring the owner-judgement model of\
  \ `trial → accepted`, SPEC-0035 rule 5).\nThe terminal is journaled (`plan_stage_entered\
  \ {to: realized, realized_by: record}` + the legacy\n`draft_closed` carrying `realized_by`/`soak_evidence`/`handoff`).\n\
  \n**FSM edge + recorded state (the governed surface).** EDGE: under `--by-record`,\
  \ `realized` is an\nedge from ANY active stage (`draft|specs|trial|accepted|decomposition|executing|postcheck`);\
  \ WITHOUT\n`--by-record`, `realized` stays the strict linear successor of `postcheck`\
  \ (unchanged). CLI: `plan\nstage realized --by-record --into <IDs> --soak-evidence\
  \ <ref> --handoff <ref> [--note …]` (`--into`,\n`--soak-evidence`, `--handoff` all\
  \ REQUIRED + non-empty under `--by-record`). RECORDED frontmatter\nfields (the persisted\
  \ state schema this terminal writes): `status: realized`, `realized_by: record`,\n\
  `soak_evidence: <ref>`, `handoff: <ref>`, `closed_into: [<IDs>]` (the standard `close_note`).\
  \ These\nfields are additive (absent on a normally-finalized `realized` plan → the\
  \ standard finalization-gate\npath).\n\n**Coherence with §Terminals «never-executed-plan\
  \ close».** That clause forbids a\n`realized` for a plan that NEVER had its real-data\
  \ soak — the retired ungated draft→realized jump was a\nnever-PROVEN realize. `--by-record`\
  \ is NOT that jump: it is gated on EXISTING soak-proof, so the soak\nWAS done (outside\
  \ the FSM, with evidence), not skipped. `realized` still means «the new mechanism\n\
  proven» (§realized) — `--by-record` only relocates WHERE the proof lives (external\
  \ evidence vs the\nplan's own `postcheck` run), never waives it. A plan lacking\
  \ the evidence still closes only as\n`cancelled`/`rejected` per the clause.\n\n\
  **Coherence with SPEC-0035 (trial) + SPEC-0083 (gate policy) — intentionally UNAFFECTED.**\
  \ SPEC-0035\n`trial` semantics are unchanged: `--by-record` does NOT enter or alter\
  \ the `trial` stage — it is a\nterminal close reachable from any active stage, and\
  \ a plan MAY take it whether or not it ever entered\n`trial` (the <project> instances\
  \ RED'd at `gate-specs` BEFORE `trial`, so requiring trial-status would\ndefeat\
  \ the purpose). SPEC-0083 gate-policy is unchanged: the MANDATORY-BLOCKING `gate-specs`\
  \ /\n`gate-trial` / decomposition-fidelity gates still govern the LINEAR build path\
  \ — `--by-record` does\nnot run them (that is the point: the soak happened outside\
  \ the FSM), so it neither weakens nor\nre-defines them. The bypass is SCOPED to\
  \ the evidence-gated record terminal; the build path keeps its\nfull gate posture.\n\
  \n### The retrospective routing table (where each postcheck output goes) — NORMATIVE\n\
  The `realized` \"captures routed\" clause (§realized) drains the postcheck retrospective's\
  \ outputs\nthrough EXISTING homes — it adds NO new store. `triage run` reports the\
  \ un-routed captures; each is\nrouted to exactly ONE home, then `triage run --complete`\
  \ records the watermark the gate reads:\n\n| retrospective output | route (an EXISTING\
  \ home — no new store) |\n|---|---|\n| a nonconformity / a recurrence (N≥2) | `errors/E-XXXX.yaml`\
  \ via `error file` / `error promote` |\n| an actionable rule / gate change | a TASK\
  \ amending the target spec (runs its own 9 stages) |\n| a finished rule (nothing\
  \ left to ship) | a `spec edit` in-place on the governing spec (SPEC-0005 rule 7)\
  \ |\n| a not-yet-actionable forward seed | `ideas/<slug>.md` — held with no FSM\
  \ until an incident pulls it |\n| session scratch / continuity lead | the project-local\
  \ `MEMORY.md` (SPEC-0007 §6), DRAINED via a full-Analysis task |\n\nA synthesis\
  \ NARRATIVE of the retrospective is NOT itself a durable output — it is optional\
  \ scaffolding\nthat MUST drain into the rows above (the deferral-as-prose anti-pattern:\
  \ a retrospective lead with no\ntracked home is invisible and costs again). The\
  \ watermark (`triage run --complete`) is the durable\nrecord that the routing happened;\
  \ the `realized` gate reads it (it does NOT re-derive per-capture\nrouting — routing\
  \ is the AI/owner's judgement, the verb only reports + watermarks §3/§5).\n\n###\
  \ The plan↔spec linkage chain (born → activate → finalize) — ONE consolidated view\n\
  The authoritative CONSOLIDATED VIEW of how a plan and its specs chain together —\
  \ the picture that\npreviously required reading 4 surfaces (GRAPH §spec-schema +\
  \ §Spec-lifecycle + `patterns/plan-lifecycle.md`\n+ SPEC-0005 §5). This is a VIEW\
  \ for navigation + comprehension; each EDGE's normative rule stays homed\nwhere\
  \ it already lives (cited inline) — NOT a second normative home (CHARTER §P5 / SPEC-0005\
  \ rule 8).\n\n    plan(draft/specs) ──births──▶ spec(draft) authored during draft/specs\n\
  \       │ plan stage accepted proposed_by = <plan slug> (provenance/corpus)\n  \
  \     ▼ (accept-gate: fresh plan check)\n    spec(proposed) ──activation_owner_task\
  \ = T-XXXX──▶ task close ──▶ spec(active)\n       │ one activating task per proposed\
  \ spec (HARD invariant B6);\n       │ supersedes/requires order between sibling\
  \ proposers ( B6)\n       ▼\n    plan stage <terminal> --into … ──writes reverse\
  \ cites:──▶ tasks / decisions\n    plan stage realized ⇐ aggregate `audit post --plan`\
  \ over { born proposed_by==slug ∪ task-activated }\n\n- **born** (`plan stage accepted`):\
  \ the plan's `draft` specs → `proposed`; `proposed_by` = the plan slug\n  (provenance/corpus\
  \ carrier, so the plan's finalization gate keeps seeing them) — GRAPH §Spec-lifecycle.\n\
  \  The birth is GATED by the accept-gate audit covering EACH draft spec's content\
  \ vs the active+proposed\n  corpus (§accepted) — so a plan-born spec's OWN content\
  \ is externally audited at the BIRTH\n  boundary, not only at the late `audit post\
  \ --plan` finalize. This closes the activation-before-finalize\n  hole: a draft\
  \ spec that conflicts/duplicates the corpus is never born `proposed` (rework first).\n\
  - **activate** (`task close`): closing a spec's `activation_owner_task` flips it\
  \ `proposed → active` and\n  atomically flips any `supersedes:` target — the SOLE\
  \ writer of `proposed → active`; there is NO manual\n  `status:` edit and NO ad-hoc\
  \ activation verb (SPEC-0005 §5, the authority). Work-first : the\n  authoring task\
  \ owns activation; plan-born: decomposition SETS the owner explicitly (never derived).\n\
  - **finalize** (`plan stage realized`): for a SPEC-BEARING plan,\n  GATED by a fresh\
  \ aggregate `audit post --plan` over the realized-spec corpus = specs born by the\
  \ plan\n  (`proposed_by==slug`) OR activated by an implementing task (`activation_owner_task`\
  \ ∈ the plan's\n  implementing tasks). The standing successor of the retired `decision\
  \ finalize`, at\n  corpus altitude. A plan that realized NO specs stays decompose-only\
  \ (no plan audit-post — backward-compat).\n  - **The finalization corpus vs the\
  \ cut member-set are NON-SUBSTITUTABLE (corpus union).**\n    The finalization corpus\
  \ / `_plan_task_carrier` (`_plan_tasks`) reads the BROAD relation \"tasks that\n\
  \    implement the plan\" — deliberately broad (it must catch every implementing/activating\
  \ task). A task is\n    an implementing task iff it carries `decomposed_from:<plan>`\
  \ OR `cites:<plan>` (the union —\n    `decomposed_from` is the PRIMARY carrier;\
  \ `cites` is the legacy/informational one). This corpus is a\n    SUPERSET of the\
  \ NARROW cut-fidelity member-set (the SPEC-0070 §5 `decomposed_from`-only relation):\
  \ a\n    decomposed cut card is in BOTH; an informational `cites`-only citer is\
  \ in the corpus but is NOT a cut\n    member. Do NOT collapse the two: keying cut-MEMBERSHIP\
  \ on `cites:` was the defect (SPEC-0070 §5);\n    keying the CORPUS on `cites` alone\
  \ wrongly excluded decomposed-only cards (`task file --decomposed-from`\n    writes\
  \ no `cites:<plan>`) — the fix.\n\n### Mandatory big-plan check at the `accepted\
  \ → decomposition`-gate (LARGE plans) — NORMATIVE\nThe `plan check` that GATES entry\
  \ to `decomposition` (= the check at the end of acceptance, RELOCATED\none stage\
  \ earlier with the rest of the readiness body — SPEC-0070 §9.3/§9.6 — because it\
  \ audits the plan\nTEXT + the `implementation_plan` decomposition MAP, the TEXT\
  \ boundary that sits BEFORE the cut) is **NOT\noptional for a LARGE plan** — it\
  \ MUST apply the big-plan discipline. For a plan meeting the\n`patterns/big-plan-checklist.md`\
  \ apply-when criteria (foundational · ≥3 canonical files · quantitative\nclaims\
  \ · a new principle/mechanism · ≥3 commits), ALL THREE hold before the gate passes:\n\
  \n1. the 7-probe **`checklist_pass` block MUST be filled** in the plan (the self-traversal),\
  \ AND\n2. the external **`plan check --full` MUST run** — it auto-applies the big-plan-checklist\
  \ for large\n   plans (records `big_plan_checklist: true`) + a structural pre-pass\
  \ that mechanizes P7, AND\n3. a **dry-run rehearsal** is required when the plan's\
  \ RULES (not just its steps) are novel — a model /\n   governance change.\n\nA LARGE\
  \ plan WITHOUT a filled `checklist_pass` + a fresh `plan check --full` does NOT\
  \ pass this gate —\nso `plan stage decomposition` (entry to the cut) is REFUSED.\
  \ For a SMALL plan this gate is the ordinary `plan check`.\n(This makes explicit\
  \ and stage-binds what `patterns/big-plan-checklist.md` left as optional reference\
  \ —\nthe owner-directed empirical pull, 2026-06-04. It reuses the EXISTING checklist\
  \ + the EXISTING `plan\ncheck` large-detection; it adds no new gate engine — CHARTER\
  \ §P1.)\n\n### Planning-artifact handling — idea sibling, file shape, anti-patterns\n\
  The plan-lifecycle home ALSO governs the sibling `idea` class, the on-disk file\
  \ shape, and the\nplanning-hygiene anti-patterns (consolidated here from the retired\
  \ `patterns/plan-lifecycle.md` — single normative home, P5). The plan FSM, the verbs,\
  \ the accept-gate, the audit-post\nfinalization, and the decomposition procedure\
  \ are NOT restated here — they ARE the per-stage\nmechanics + linkage chain above\
  \ (consolidate, do NOT duplicate).\n\n- **`idea` sibling class (flat — NO FSM).**\
  \ `ideas/<slug>.md` is a forward-looking holding pen: no\n  FSM, no checks, no accept/finalize\
  \ gates; sessions NEVER scan / pick / analyze it (the picker reads\n  `tasks/` ONLY)\
  \ unless the owner explicitly asks. `plan file --idea` creates one; `plan to-idea\
  \ <slug>`\n  moves a plan that turns out to be «not now, maybe later» into `ideas/`.\
  \ An idea becomes actionable\n  only when an incident pulls it — re-file it as a\
  \ plan (manual) then. Holding it here is the\n  anti-accretion default; promoting\
  \ it prematurely is scope-creep (anti-pattern below).\n\n- **File shape (markdown\
  \ + frontmatter).** A plan/idea is a small `---` frontmatter block (machine-read\n\
  \  for accounting + the `plan` graph node) over prose (human-read); `id` = the slug\
  \ (no numeric id —\n  patterns precedent). The terminal frontmatter CARRIERS: `realized`/`partial`\
  \ → `closed_into: [D-/T-…]`\n  (what it became); `partial` additionally → `deferred:\
  \ <new-plan-slug>` (the remainder — a tracked\n  plan, never prose); `rejected`\
  \ → `rejected_reason: <one line>`. (Terminal plans stay in\n  `plans/`, status-filtered\
  \ — §Terminals.)\n\n- **Anti-patterns (planning hygiene).**\n  - Treating a STALE\
  \ `accepted` plan as still-valid WITHOUT the take-into-work currency re-check —\n\
  \    verification DECAYS (there is no `verified` status; the re-check is the §accepted\
  \ / §executing entry-gate).\n  - Filing a forward-looking idea as a task/decision\
  \ PREMATURELY (accretion) — keep it in `ideas/`\n    until an incident pulls it.\n\
  \  - Leaving a decomposed plan as «just a note» — close it (`realized`/`partial`)\
  \ so it stops cluttering\n    the active view (silent-skip otherwise).\n  - Deferring\
  \ a plan part / spec-body half as PROSE with no tracked task (the deferral-as-prose\
  \ trap):\n    any such deferral MUST be a tracked task (parked/blocked, with a `return_trigger`),\
  \ never prose.\n    The standing rule + its mechanized `plan check` structural pre-pass\
  \ are homed in **<workshop-spec>** (P5);\n    this is a pointer there, not a second\
  \ home.\n  - **Piecemeal-from-draft (build off an un-frozen draft).** Cutting cards\
  \ / dispatching Workers off a\n    plan whose `draft`/`specs` body is STILL MOVING\
  \ — scope lines being added, carve-outs still\n    shifting — so different cards\
  \ are cut against different snapshots and the cut de-syncs from the\n    plan. A\
  \ plan must be FROZEN (its `accepted`/`decomposition` snapshot the fidelity gate\
  \ fingerprints,\n    SPEC-0070 §4) before any card is claimed; the claim-block (SPEC-0070\
  \ §5) enforces this for\n    decomposed cards. Do NOT build from a draft that is\
  \ still growing — see discovery-grown handling next.\n\n- **Discovery-grown plan\
  \ handling (a plan that grows scope AFTER the owner takes it into work).**\n  Real\
  \ work surfaces items the plan did not foresee. That growth is legitimate — but\
  \ it must be\n  RECORDED, not absorbed silently, and it must not de-sync the cut:\n\
  \  - **Record the growth in the plan body** (a dated growth note / an added scope\
  \ line), so the plan\n    stays the single truth of what it now covers — never grow\
  \ scope only in a Worker's head or a\n    commit body.\n  - **Out-of-band work is\
  \ captured, not hidden.** When an item is discovered mid-drive that belongs\n  \
  \  OUTSIDE this plan's cut (a different territory, a separable concern), route it\
  \ by the Filing rule\n    (a `followup` / a new task / a `cross request`) — do NOT\
  \ bolt it onto an in-flight card.\n  - **FREEZE before you build.** New scope is\
  \ folded into the plan while it is still `draft`/`specs`;\n    once the plan is\
  \ frozen for the cut, further growth is a NEW take-into-work pass (below), not an\n\
  \    edit under the running cut — else the fidelity fingerprint (SPEC-0070 §4) goes\
  \ stale mid-build.\n- **Bring-order — the take-into-work reconciliation pass (re-cut\
  \ a re-grown / stale plan against\n  shipped reality).** When a plan that grew (or\
  \ sat `accepted` while the world moved) is taken back\n  into work, run a RECONCILIATION\
  \ pass BEFORE re-cutting: re-read the plan against what has actually\n  shipped\
  \ since, drop cards already done out-of-band, re-derive the task graph from the\
  \ CURRENT body\n  (a plan STAGE is INPUT — the graph is re-derived at decompose,\
  \ SPEC-0046 §A), and re-fingerprint the\n  cut. A stale `accepted` plan is NOT still-valid\
  \ without this currency re-check (the anti-pattern\n  above) — the re-check IS the\
  \ §accepted / §decomposition entry-gate. Bring-order is that gate applied\n  to\
  \ a plan whose scope moved, not a new mechanism.\n"
