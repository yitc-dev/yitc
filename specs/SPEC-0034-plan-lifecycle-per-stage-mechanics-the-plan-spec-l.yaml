id: SPEC-0034
title: Plan lifecycle — per-stage mechanics, the plan-spec linkage chain, and the
  mandatory big-plan check at the decomposition-gate
status: active
created_at: 2026-06-05 03:23:20+00:00
consumed: false
implements:
- bin/lib/plan.py#cmd_plan_stage
- bin/lib/plan.py#cmd_plan_check
- bin/lib/plan.py#cmd_plan_file
binding:
- plan-stage-entry:draft
- plan-stage-entry:specs
- plan-stage-entry:trial
- plan-stage-entry:accepted
- plan-stage-entry:decomposition
- plan-stage-entry:executing
- plan-stage-entry:postcheck
- plan-stage-entry:realized
body: "## Scenario\n\nThe owner/AI sees the PLAN lifecycle at the SAME altitude as\
  \ the task lifecycle: a skeleton in the\nalways-loaded handbook (LIFECYCLE §Plan\
  \ lifecycle) and the per-stage normative DETAIL delivered\non-demand at the moment\
  \ of use. A plan advances through a single linear FSM field (`status`); the one\n\
  gated verb `plan stage <NAME>` advances it, GATES the prior stage's completion,\
  \ runs that stage's\nside-effects, and DELIVERS this spec's matching slice at stage-ENTRY\
  \ (the `plan-stage-entry:<NAME>`\naxis) — exactly as `task stage <NAME>` delivers\
  \ a task stage bundle since. So when a\nsession enters `decomposition`, it receives\
  \ the cut + fidelity-gate + big-plan-check rules; when it\nenters `postcheck`, the\
  \ real-data-soak proof rules; and so on. This is the PLAN-axis mirror of SPEC-0027.\n\
  \n## Internal\n\nTHE PLAN-LIFECYCLE STAGE DETAIL — the retrieved home for the per-stage\
  \ mechanics, the plan↔spec\nlinkage chain, and the mandatory big-plan check. This\
  \ is a RULE home (no new store/parser/schema):\nit documents behaviour the shipped\
  \ `plan stage` verb + the existing spec-FSM + the existing\n`plan check` / `audit\
  \ post --plan` gates ALREADY provide. The authoritative stage table is the parent\n\
  plan's §Stage model [[plan-lifecycle-delivery-parity-redesign-lifecycle-]]; this\
  \ spec is its\nstage-ENTRY-delivered normative home. One delivery axis (plan-stage-entry),\
  \ no floor-trigger for plans.\n\n### The FSM (one field — `status` — whose values\
  \ ARE the stages)\n`draft → specs → trial → accepted → decomposition → executing\
  \ → postcheck → realized` (terminal `partial | rejected | cancelled`).\nUnlike a\
  \ task (which carries BOTH `status` and `current_stage`), a plan has **no picker**\
  \ (sessions\nnever scan `plans/`), so it keeps a SINGLE FSM field — `status` — whose\
  \ values are the stages (parent\nplan Decision 1; NOT renamed to `stage`, which\
  \ would break the one-parser invariant, CHARTER §P5). The\nverb `plan stage <NAME>`\
  \ is the SOLE writer and advances exactly ONE linear step; the wont-do terminals\n\
  are reachable from any active stage. (`trial` between `specs` and `accepted` is\
  \ an AUTHORITATIVE FSM\nstage — a controlled real-data design-convergence stage\
  \ (SPEC-0035) whose entry is OWNER-INVOKED and\nonly for trial-ELIGIBLE plans (mechanism/behavioral,\
  \ not text-audit-verifiable); a non-eligible\nprose/docs plan takes the two-branch\
  \ `accepted` SKIP path `specs → accepted` directly.)\n\n### Plan TYPES — the axes\
  \ that change a plan's FSM path / gate weight (a VIEW, not a taxonomy)\nA plan is\
  \ not one shape. FOUR orthogonal axes each change WHAT path a plan takes through\
  \ the FSM\nor HOW heavy a gate it pays — and they are INDEPENDENT (a plan is one\
  \ value on each). This is a\nnavigation VIEW over rules that already live in their\
  \ own homes (cited inline, P5 / SPEC-0005\nrule 8); it invents NO new plan-class,\
  \ status, or gate. Read it to answer \"which path does THIS\nplan take?\" — then\
  \ follow the cited home for the rule.\n\n| axis | the two values | what it CHANGES\
  \ | home |\n|---|---|---|---|\n| **spec-bearing vs spec-free** | births ≥1 draft\
  \ spec · vs · task-cards only (no spec) | ONLY the `realized` finalization: a spec-bearing\
  \ plan's `realized` runs the aggregate `audit post --plan` over its realized-spec\
  \ corpus; a spec-free plan is decompose-only (no plan audit-post). It changes NOTHING\
  \ at `specs`: BOTH types transit the mandatory gate-specs CHECK (see §specs — spec-free\
  \ does NOT skip it). | §specs · §realized · §linkage chain |\n| **trial-eligible\
  \ vs not** | mechanism/behavioral AND text-audit-insufficient · vs · prose/docs\
  \ | eligible MAY enter `trial` (owner-invoked by default; autonomous only when provably\
  \ non-destructive — SPEC-0035 rule 9 / SPEC-0126 §5); non-eligible SKIPS trial (the\
  \ two-branch `specs → accepted` path). Skip is the DEFAULT — no owner decision (SPEC-0035\
  \ rule 10). | SPEC-0035 rules 2 / 9 / 10 |\n| **plan vs bare-cards (S1 / S2)** |\
  \ needs a standing-rule SPEC corpus / a fidelity-audited multi-task cut / a real-data\
  \ trial (S1) · vs · one-or-a-few bare tasks (S2) | whether the change earns the\
  \ WHOLE plan FSM at all, or drops to bare `task file` cards. This is the CARRIER\
  \ sieve, self-applied BEFORE the FSM — a heavier carrier is not \"safer\", it just\
  \ pays audits the change does not need. | SPEC-0140 (carrier sieve) · LIFECYCLE\
  \ §Routing |\n| **big vs small** | foundational / ≥3 canonical files / quantitative\
  \ claims / a new principle-or-mechanism / ≥3 commits (LARGE) · vs · not (SMALL)\
  \ | the WEIGHT of the `accepted → decomposition` gate: a LARGE plan needs a filled\
  \ `checklist_pass` + `plan check --full` + a dry-run when its RULES are novel; a\
  \ SMALL plan pays the ordinary `plan check`. Set by blast-radius, not line count.\
  \ | §Mandatory big-plan check · `patterns/big-plan-checklist.md` |\n\n### Per-stage\
  \ mechanics (one rule per linear stage — entry-gate, work, side-effects, task analog)\n\
  EVERY transition obeys ONE rule: the verb gates the **PRIOR stage's completion**\
  \ (so a check \"at the\nend of stage N\" is expressed as the ENTRY gate of stage\
  \ N+1).\n\n**Audit posture (owner-settled 2026-06-05): FULL, not light.** Any external\
  \ audit on a\nplan-lifecycle transition (e.g. `plan check`, the aggregate `audit\
  \ post --plan`) uses the\nFULL-capability auditor, never the lighter routine mode\
  \ — plans are high-stakes and audit quality\nis not economized. This OVERRIDES the\
  \ AGENTS §External-auditor routine→light default for PLAN-level\naudits. (WHICH\
  \ early transitions block was the former open question — SETTLED by :\nevery forward\
  \ plan gate is mandatory-blocking, including draft→specs (P2). The one-table gate\n\
  POLICY is homed in SPEC-0083 — `graph query SPEC-0083`; this section settles audit\
  \ QUALITY.)\n\n- **draft** *(plan-stage-entry:draft — task analog: Analysis)*\n\
  \  - Entry gate: — (start; `plan file` creates a plan at `status: draft`).\n  -\
  \ Work: author the draft (WIP planning); sessions don't touch it (the picker reads\
  \ `tasks/` only).\n  - Result: a thought-through draft, finalized by its END verb.\
  \ **Draft END verb (R7):** `plan draft --finalize` is the draft check-carrier (SPEC-0059\
  \ §First-stage-check-carrier-gap; plan-axis mirror of `task analyze --finalize`)\
  \ — it read-checks the draft bundle [SPEC-0043, SPEC-0034], reports front-load section-fill\
  \ (advisory / report-only structural pre-pass), and emits a `plan_draft_finalized`\
  \ journal event carrying `body_hash` (the body-bound worked-through PROOF — provenance,\
  \ not a forgeable field; only this verb emits it). The `specs` entry-gate REQUIRES\
  \ a FRESH such proof matching the current body (§specs). Side-effect : `plan file`\
  \ (the draft is the INITIAL\n    status, so `plan stage draft` is unreachable —\
  \ `plan file` IS the draft-entry delivery point) ALSO\n    delivers the `plan-stage-entry:draft`\
  \ bundle (the draft-authoring doctrine SPEC-0043) + seeds the\n    front-load skeleton\
  \ sections in the new plan body, and journals `plan_stage_entered` (from=null→draft).\n\
  \n- **specs** *(plan-stage-entry:specs — task analog: Filing/Plan)*\n  - Entry gate:\
  \ the draft is thought-through — ENFORCED (R7): `plan stage specs` REQUIRES a FRESH\
  \ `plan_draft_finalized` proof (the body-hash-bound journal event emitted by `plan\
  \ draft --finalize`, matching the current body) + the recorded SPEC-0043/SPEC-0034\
  \ reads — NON-SKIPPABLE; an absent/stale proof or an unread bundle → REFUSE (`read_gate_refused`\
  \ kind=verification-exists / read-check). Closes the draft-had-a-START-but-no-END-verb\
  \ gap (SPEC-0059 §First-stage-check-carrier-gap). ALSO : draft→specs is a MANDATORY-BLOCKING\
  \ external gate — `plan stage specs` asks the gate-specs FULL audit and a RED/ABORT\
  \ verdict HOLDS the transition (gate policy home: SPEC-0083).\n  - Work: compose\
  \ + check the draft specs (the status now says WHAT we work with — already the spec-set,\n\
  \    not just the bare draft; the `draft`-vs-`specs` split is deliberate, owner-from-experience).\n\
  \  - **The `specs` stage IS the mandatory gate-specs CHECK every plan transits —\
  \ NOT \"compose draft\n    specs\" (reframe).** The stage NAME reads as \"author\
  \ specs\", so a SPEC-FREE plan (one that births\n    no specs) looks like it can\
  \ SKIP the stage. It CANNOT. `draft → specs` is a MANDATORY-BLOCKING\n    external\
  \ gate (`gate-specs`, SPEC-0083) whose real subject is the PLAN itself — its scope\n\
  \    stability, carve-out tracking, trial-path coherence, anti-complexity, provider-neutral\
  \ wording —\n    NOT only any draft specs it happens to carry. So a spec-free plan\
  \ STILL transits `specs` and STILL\n    pays the gate-specs audit; \"spec-free\"\
  \ only means the `specs`-stage WORK bullet (compose draft\n    specs) is vacuous,\
  \ never that the CHECK is. **Live proof (real incident):** the SPEC-FREE\n    correct-verify\
  \ plan (`correct-verify-the-full-project-user-collaboration`, no draft specs) ran\n\
  \    `gate-specs` and drew SIX findings — W2 under-specification, an ambiguous trial\
  \ path, an untracked\n    W4 carve-out, provider-name leakage in normative-looking\
  \ criteria, plus the two gate answers\n    (`decisions/correct-verify-the-full-project-user-collaboration-audit-gate-specs.yaml`,\
  \ YELLOW).\n    A skip would have shipped all six unexamined.\n  - The draft specs\
  \ are authored `status: draft`, plan-local (`spec new --draft --proposed-by <slug>`),\n\
  \    governing nothing (SPEC-0005 §4).\n  - **Corpus-conflict survey (owner-settled\
  \ 2026-06-05).** Before AUTHORING or CORRECTING a draft\n    spec, SURVEY the active\
  \ + proposed corpus (`graph query <related-spec>` / `graph query --type\n    view`\
  \ / grep) for overlap or contradiction, and apply the SPEC-0005 admission test (delete-test\
  \ /\n    one-home — does this belong inside an existing spec instead?). A genuine\
  \ RELATIONSHIP → encode it\n    via `requires:` / `supersedes:` on the spec. A genuine\
  \ CONTRADICTION → a Principle-7 dissonance:\n    surface/resolve it, never silently\
  \ choose. The FULL audit at the convergence boundary\n    (→ `accepted`) is the\
  \ corpus-coherence BACKSTOP. Do NOT add an automated semantic-conflict\n    detector\
  \ to `spec new` — anti-complexity: semantic conflict is judgement + the audit's\
  \ job; no\n    incident yet justifies a detector.\n\n- **trial** *(plan-stage-entry:trial\
  \ — task analog: a pre-accept design-convergence soak; SPEC-0035)*\n  - Entry gate:\
  \ the draft specs are composed + checked AND the plan is trial-ELIGIBLE (BOTH, owner-judged\n\
  \    at entry — SPEC-0035 rule 2: (a) mechanism/behavioral — births a spec/verb/flow;\
  \ (b) convergence\n    cannot honestly come from text-audit alone). A non-eligible\
  \ prose/docs plan SKIPS trial (→ `accepted`).\n  - Work: bake a `## Trial protocol`\
  \ into the plan (mode + why, probe targets, exit criteria, safety\n    envelope,\
  \ eligibility rationale — `patterns/trial-methods.md`), then run the planned mechanism\
  \ in a\n    controlled way on real(-ish) data until the design stops changing; co-evolve\
  \ the plan + its draft\n    specs in place. A trial NEVER mutates production data\
  \ (emulation / reviewable+rollbackable manual\n    runs only — SPEC-0035 rules 3-4).\
  \ Long-running, multi-session: fresh sessions read the PLAN.\n  - Side-effect: `plan_stage_entered`\
  \ (trial) + journaled trial runs; the exit (`trial → accepted`) is\n    OWNER judgment\
  \ citing the run-refs against the baked criteria — no automated convergence detector\n\
  \    (CHARTER non-goals #1/#7; exit floor: ≥1 journaled run + a trial-summary +\
  \ plan/specs unchanged across\n    the last 2 cycles — SPEC-0035 rule 5).\n\n- **accepted**\
  \ *(plan-stage-entry:accepted — task analog: Plan)*\n  - Entry gate: the draft specs\
  \ are composed + checked (for the trial-bearing path: trial converged on\n    real\
  \ data — proposed-not-yet-built). The direct `specs → accepted` entry (this gate\
  \ reached\n    from `specs`, not `trial`) is the NON-eligible SKIP path — a prose/docs\
  \ plan, SPEC-0035 rules 1-2.\n    This fork is now SURFACED at the post-specs decision\
  \ point by the `plan stage specs` + `plan file`\n    verb next-hints, so a trial-eligible\
  \ plan is not silently routed past `trial`.\n  - Work: confirm the plan + specs;\
  \ compose the `implementation_plan` (the decomposition map — a plan\n    field mirroring\
  \ the task field of the same name).\n  - **Work — ORDER (do the accepted-stage work\
  \ BEFORE the accept-gate check):** the sequence\n    is **compose `implementation_plan`\
  \ + the REALIZATION-EXIT block FIRST → `plan check` → `plan stage\n    accepted`\
  \ → `plan stage decomposition`**. BASIS: the accept-gate freshness hash (`content_hash`)\n\
  \    covers the plan **BODY** only, and the realization-exit block IS a body section\
  \ — so composing it\n    AFTER the check stales the verdict and costs a full re-`plan\
  \ check` before `decomposition` (which\n    re-checks the SAME hash), for no design\
  \ change. `implementation_plan` is a FRONTMATTER field and\n    does NOT stale the\
  \ check, so the cost is the body half. Ordering GUIDANCE, not a new gate — no\n\
  \    mechanical refusal moves. And a fresh `plan check` does **NOT** preserve mode-b\
  \ `absorbed:`\n    entries: a fresh verdict is a fresh record, by design — one more\
  \ reason to compose the body\n    BEFORE the check rather than re-checking after\
  \ it.\n  - Work (REALIZATION-EXIT criteria, UP FRONT — owner directive 2026-06-06):\
  \ ALSO compose the\n    plan's REALIZATION-EXIT criteria here — the postcheck probe\
  \ block (observed-behaviour / min-runs /\n    failure-threshold / evidence-home)\
  \ — the way a TASK authors its `acceptance` at FILING, not reactively\n    at postcheck\
  \ entry. The plan declares HOW it will be proven realized BEFORE it is built. (The\
  \ front-load\n    prompt is seeded even earlier, at `plan file` — SPEC-0043 §front-load;\
  \ this is where the criteria are\n    CONFIRMED into the accepted plan.) This is\
  \ authoring GUIDANCE, NOT a new gate: the obligation to declare\n    the probe block\
  \ already lives at §postcheck (confirmed/refreshed at postcheck entry), so composing\
  \ it at\n    `accepted` moves no mechanical REFUSAL earlier in the FSM — compliance\
  \ is unchanged (in-place amend, not\n    a supersede — SPEC-0005 §7). The criteria\
  \ stay author-declared + owner-judged; no parser/gate enforces them.\n  - Side-effect\
  \ (`plan stage accepted`): the plan's `draft` specs are BORN\n    `proposed` (`_plan_accept_core`);\
  \ GATED on a FRESH GREEN/YELLOW `plan check` (the accept-gate,\n    freshness =\
  \ a content hash — the mirror of `decision accept`).\n  - **Accept-gate covers the\
  \ draft specs vs the corpus ( — closes the activation-before-finalize\n    content-audit\
  \ hole).** A PLAN-BORN spec governs only when `active`, but it reaches `active`\
  \ via its\n    activation_owner_task close (an ADOPTION probe, NOT a content audit)\
  \ — so without this, its OWN\n    content first gets a dedicated external audit\
  \ only at `plan stage realized` (`audit post --plan`),\n    LATE. The accept-gate\
  \ `plan check` therefore AUDITS the plan's PLAN-BORN draft specs\n    (`proposed_by==slug\
  \ AND status==draft` — the SAME set `_birth_plan_draft_specs` births) against the\n\
  \    active+proposed corpus for overlap / duplication / contradiction (P7 / one-active-lineage),\n\
  \    and the draft→proposed BIRTH is GATED on it: a draft spec that conflicts/duplicates\
  \ the corpus is\n    NOT born — rework first. Freshness reflects the draft specs\
  \ + the corpus CONTENT too\n    (`_plan_accept_freshness_hash`): editing a draft\
  \ spec OR a corpus spec after the check invalidates\n    the accept gate (re-run\
  \ `plan check`). SCOPE = the PLAN-BORN path ONLY — a WORK-FIRST spec\n    (`proposed_by==<task>`)\
  \ is content-audited by its own task's audit-pre/post and is NOT\n    double-audited\
  \ here.\n  - **A partial corpus read never renders as a full pass (X-0706).** The\
  \ accept-gate corpus\n    block is byte-bounded (`_CORPUS_BLOCK_BUDGET`) so it can\
  \ never overflow the auditor — that ceiling\n    STAYS. What must not stay silent\
  \ is CROSSING it: a gate whose reach is shorter than its declared\n    scope is\
  \ worse than a gate that refuses. So whenever the gate's reach falls short of the\
  \ corpus it\n    claims to judge — either MECHANICALLY (draft bodies / corpus rows\
  \ dropped at the ceiling) or by the\n    auditor's OWN SELF-REPORT that it could\
  \ not fully read or verify the corpus — `plan check` records\n    the shortfall\
  \ STRUCTURALLY in the verdict (`corpus_coverage`, naming what was not reached) and\n\
  \    escalates a GREEN to YELLOW. Never RED: a partial read is a statement about\
  \ CONFIDENCE, not a\n    proven defect (the posture SPEC-0082 settled for baseline-not-live).\
  \ The shortfall may NOT live\n    only in auditor prose, where it reads as a normal\
  \ pass. STRICTLY CONDITIONAL — a gate that reached\n    the whole corpus (the ordinary\
  \ small-plan path) records no key, gains no finding and keeps its\n    verdict byte-for-byte,\
  \ so the honest floor taxes only the runs that actually fell short.\n    **Separate\
  \ reservations, refuse rather than audit a partial subject (X-1529).** Draft\n \
  \   bodies and the corpus index do not share one first-fit pool: the index keeps\
  \ a reserved share,\n    the drafts fill the rest, and the drafts' RELATED comparands\
  \ may use whatever remains. When the\n    drafts exceed their pool, or a related\
  \ comparand no longer fits, `plan check` REFUSES BEFORE the\n    auditor — naming\
  \ the budget and each draft's size, spending no pass — instead of letting the\n\
  \    auditor judge a plan whose drafts it never saw. Every shortfall reason names\
  \ the budget and the\n    measured sizes, and the block's fetch pointers carry the\
  \ session's `-C <repo>` prefix so a\n    consumer's own spec ids resolve against\
  \ the consumer corpus.\n  - **A YELLOW residual is absorbed ONTO the verdict, not\
  \ by editing the plan.** LIFECYCLE\n  Stage 4's two ways to absorb a YELLOW finding\
  \ govern this gate too: (a) EDIT the plan — which\n  re-hashes the body, stales\
  \ `content_hash` and forces a whole fresh FULL `plan check` — or (b)\n  RECORD the\
  \ residual on the EXISTING accept-gate verdict without changing the plan. Mode (b)'s\n\
  \  governed route here is **`bin/yitc-v2 plan check --absorb \"<text>\" <slug>`**:\
  \ it runs NO auditor,\n  appends `absorbed:`/`notes:` on `decisions/<slug>-audit.yaml`,\
  \ emits `audit_finding_absorbed`, and\n  leaves `verdict:` / `content_hash:` / `accept_freshness_hash:`\
  \ / `passes:` byte-identical — so\n  `plan stage accepted` still accepts that record\
  \ and NO ceiling pass is burned (SPEC-0124\n  §Audit-loop ceiling; mode (a) is the\
  \ only mode that generates a pass, unchanged). It is the SAME\n  writer, on the\
  \ SAME record, as `audit pre --plan <slug> --gate trial-accepted --absorb`\n  —\
  \ a plan-check-shaped spelling of an existing route, not a second one. TWO REFUSALS,\
  \ neither\n  loosened: a NON-YELLOW record (RED/ABORT = STOP: re-plan or escalate;\
  \ GREEN carries no accepted\n  finding), and a plan body that no longer matches\
  \ the recorded `content_hash` — absorption after\n  body drift is REFUSED, because\
  \ the cheap path is cheap only while the recorded verdict still\n  judges the CURRENT\
  \ body. **A body edit therefore still forces a fresh `plan check`**, exactly as\n\
  \  before; what this removes is the extra FULL check paid when nothing about the\
  \ plan changed\n  (measured 2026-09-02; the 3-plan-check incident is the same class).\
  \ Additive extension\n  per SPEC-0005 §7: every already-covered case's compliance\
  \ is unchanged.\n- **Plan check role (narrowed — SPEC-0035 rule 7).** For a trial-ELIGIBLE\
  \ plan, `plan check` is NOT\n    the design-convergence gate: convergence evidence\
  \ is produced in `trial` against the baked criteria,\n    and `plan check` at this\
  \ accept-gate is the audit of the ASSEMBLED package (the plan + its composed\n \
  \   draft specs — incl. the corpus content-audit above), NOT the source of design-convergence.\n\
  \    Post-accept spec-rework driven by reality-vs-paper divergence is no longer\
  \ a normal path — the cheap\n    pre-accept `trial` loop replaces it. (A non-eligible\
  \ plan skipped trial, so its accept-gate `plan\n    check` is its only pre-accept\
  \ verification, as before.)\n\n- **decomposition** *(plan-stage-entry:decomposition\
  \ — task analog: the pre-build CUT + its fidelity gate; SPEC-0070)*\n  - Entry gate\
  \ (`accepted → decomposition`) = the plan is verified — `_require_plan_decomposition_ready`\n\
  \    (the readiness body RELOCATED here from the old `executing`-gate, SPEC-0070\
  \ §9.3): `plan check`\n    GREEN/YELLOW **+** the `implementation_plan` composed\
  \ **+** the specs `proposed`. A corpus spec in a\n    DELIBERATE never-active terminal\
  \ (`withdrawn`/`rejected`) is EXEMPT from this `proposed`/`active`\n    demand (\
  \ — a plan-born spec deliberately abandoned as a scope-cut must not block the plan;\n\
  \    symmetric with the postcheck `_plan_postcheck_exempt_specs`); a `draft`/`superseded`/`retired`\n\
  \    corpus spec still blocks. For a LARGE plan this gate carries the MANDATORY\
  \ big-plan check — it\n    audits the plan TEXT + the `implementation_plan` decomposition\
  \ MAP (the TEXT boundary, which sits\n    BEFORE the cut; SPEC-0070 §7), so it belongs\
  \ at the entry to the cut (see the dedicated subsection below).\n  - Work = the\
  \ CUT (relocated from `executing`): cut the plan into tasks (SPEC-0046 decomposition\n\
  \    discipline — ONE provable claim per accept-unit; order via `requires:`; the\
  \ verifier-after-settled\n    rule); each task then runs its OWN 9-stage lifecycle.\
  \ The cut is a Build act via EXISTING verbs\n    (`task file` + `worktree new --task`)\
  \ — no orchestrator/dispatcher (CHARTER non-goals #1/#7); that\n    \"no orchestrator/dispatcher\"\
  \ disclaimer is about the CUT itself not being a stateful orchestrator,\n    it\
  \ does NOT bear on HOW the cut cards are then BUILT (which is dispatch-default —\
  \ see §executing Work). It SETS\n    `activation_owner_task` on each `proposed`\
  \ spec (one activating task per spec — the HARD invariant;\n    the others `cite`\
  \ it). Full procedure: the linkage chain below + the §\"Planning-artifact handling\"\
  \ subsection.\n  - Exit gate (`decomposition → executing`) = the cut is verified\
  \ — `_require_plan_decomposition_fidelity`:\n    a FRESH GREEN/YELLOW external decomposition-fidelity\
  \ verdict over the task SET (the SPEC-0036\n    `gate-executing` mandatory-blocking\
  \ template — RED/ABORT HOLDS the transition; the 2-pass audit-loop\n    ceiling\
  \ applies) whose canonical CARD-SET FINGERPRINT matches (REFUSE → re-audit on mismatch).\
  \ WHAT it\n    audits (set-level coverage / cross-task `requires:` ordering / a\
  \ singular `activation_owner_task` /\n    probe quality / no reopened-settled card\
  \ — the blind-spot a per-task audit-pre cannot reach), the\n    fingerprint inputs,\
  \ the claim-block (a card of a pre-`executing` plan is unclaimable), and the uniform\n\
  \    applicability (every plan transits — no skip path) are HOMED in SPEC-0070 §3-§6\
  \ — POINT here, not\n    restated (P5 / SPEC-0005 rule 8).\n\n- **executing** *(plan-stage-entry:executing\
  \ — task analog: Execution + Tests)*\n  - Entry gate (`decomposition → executing`):\
  \ the decomposition-fidelity verdict is fresh +\n    fingerprint-matched (`_require_plan_decomposition_fidelity`,\
  \ the §decomposition Exit gate above) **+**\n    the `plan-stage-entry:decomposition`\
  \ cut bundle was FETCHED this session (the read-gate on the\n    executing leg,\
  \ SPEC-0070 §8). The old readiness body (`plan check` / `implementation_plan` /\
