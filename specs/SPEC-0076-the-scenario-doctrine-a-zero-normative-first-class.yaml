id: SPEC-0076
title: The scenario doctrine — a zero-normative first-class user-path entity (graph
  node + covers edge), status FSM, enforcement split
status: active
created_at: 2026-06-16 09:09:13+00:00
travels: null
consumed: false
implements:
- bin/lib/scenario.py#scenario_step_proof_lines
amends:
- D-0047: B3 "a scenario folds into a `## Scenario` spec-SECTION OR a scenario-PARENT
    spec" is AMENDED for the CROSS-SPEC user-journey case — that journey is now the
    first-class scenario ARTIFACT/node (rule 1/4), NOT a scenario-parent spec. The
    single-rule `## Scenario` spec SECTION (one rule's external-behaviour face) is
    UNCHANGED — different altitude (rule 1).
- GRAPH.md#schema: the 6-node / 3-edge bound (post- slim) GROWS to 7 nodes (`scenario`)
    + 4 edges (`covers`) — the only schema change; the 4-filter justification for
    reversing the slim lands in GRAPH.md at the mint (rule 4). No further node/edge
    growth implied (`FSM-state` deferred).
- scenario-section vocabulary (D-0047 §`## Scenario`/`## Internal`/`## Verification` model): the
    term "scenario" now ALSO names the artifact/node; the spec-SECTION keeps its name
    (the collision is acknowledged — a rename is an OPEN question carried in the plan,
    NOT decided by this spec).
body: "## Scenario\n\nThe owner sees a **scenario** as the primary HUMAN-facing instrument\
  \ for a project: a human-legible\ndescription of a user-path (how the product works\
  \ from the user's point of view), authored in human\nterms — distinct from a spec,\
  \ which is the primary teaching layer for the AI (rules → code). A\nnon-technical\
  \ owner does not read specs but DOES hold the user-path model; the scenario answers\n\
  exactly that. It is also the owner's **bidirectional control surface**: FORWARD\
  \ — authoring/correcting\na scenario steers the system (its normative content is\
  \ extracted into specs + the FSM, all linked back\nto the scenario); BACKWARD —\
  \ any later change to a linked spec/FSM/code re-surfaces the scenarios it\ntouches,\
  \ so a debugged user-path is not silently broken by further development.\n\n## Internal\n\
  \nTHE SCENARIO DOCTRINE. A scenario is a FIRST-CLASS artifact (`scenarios/<slug>.md`)\
  \ + a MINIMAL 7th\ngraph node-type. Eight rules. The 4 anti-complexity filters +\
  \ the node-vs-edge / round-1..3\ndeliberation live in the proposing plan [[scenario-as-a-first-class-graph-entity-dogfood-on-]]\
  \ (SPEC-0005\n§3 content boundary — debate is plan material, not spec body); this\
  \ spec carries only the standing rule.\n\n### 1. Identity & purpose\nA scenario\
  \ is a **zero-normative composition of specs into a user-path** + human narration.\
  \ It is the\nhuman's primary teaching/control instrument (the daily working entity),\
  \ NOT a reference doc — which is\nwhy it is a distinct node-type, not folded under\
  \ `pattern` (a rarely-touched practice). It composes\nspecs; it never re-narrates\
  \ the handbook or a spec's rule (a scenario that restates a rule is a drift\nDEFECT,\
  \ rule 7).\n\n### 2. Zero-normative boundary (OPERATIONAL — the absolute line)\n\
  A scenario may contain **narration + references (`cites`) + observed-path intent\
  \ ONLY**. EVERY\nenforceable rule / acceptance criterion / forbidden transition\
  \ / binding ordering lives in the cited\nspec / FSM / test — NOT in the scenario.\
  \ Even a binding ORDER (\"B requires A done first\") is its own\nordering-spec the\
  \ scenario `cites`; the order SHOWN in the scenario is purely descriptive assembly.\n\
  **Review REJECTS scenario-resident normative language** (a \"must/always/never\"\
  \ that is an enforceable\nconstraint → extract to a spec + `cite` it). \"Control\
  \ surface\" is a ROLE/workflow property (the human\ndrives THROUGH the scenario),\
  \ never a STORAGE property — the scenario is never a second rules-home.\n\n### 3.\
  \ Status FSM (minimal) — `draft → building → retired`, DERIVED from the cited specs\n\
  A scenario governs nothing, so it needs NO `proposed→active` activation gate and\
  \ NO per-status verb.\nThe status is **DERIVED from the statuses of the specs the\
  \ scenario `cites`** (a read-only view over\nthe graph the scenario already carries\
  \ — NOT a hand-set label, NOT a cross-check against tasks). One\nsource of truth\
  \ (the cited specs' FSM), so there is no second progress-language to diverge:\n\
  \  - `draft` — the scenario cites NO spec yet (only narration / un-authored rules):\
  \ still being thought through.\n  - `building` — the scenario cites at least one\
  \ spec: the path is the agreed target, being built.\n  - `live` — **RETIRED; do\
  \ NOT re-add it.** It read \"ALL cited specs are `active` AND the\n    scenario's\
  \ binding regression test (rule 6a) is green\", with the green test as the\n   \
  \ `building → live` transition mechanism. That test signal had NO producer in ANY\
  \ repository — the\n    graph build hardcoded it False — so `live` was UNREACHABLE\
  \ everywhere and every finished path read\n    `building` forever: a false negative\
  \ indistinguishable from a genuinely unfinished path, and the\n    state said nothing\
  \ anyone could act on. The retirement was settled by an external consult\n    (`decisions/four-forks-consult-audit-adhoc.yaml`,\
  \ GREEN) against a two-arm reversal test — a CURRENT\n    caller needing `live`\
  \ distinct from `building`, AND a cheap producer on an already-adopted signal —\n\
  \    of which only the first arm held (SPEC-0082's baseline-fidelity leg), so the\
  \ state went and that leg\n    was retargeted onto the predicate that SURVIVED:\
  \ \"every spec the scenario cites is `active`\"\n    (`_scenario_cites_all_active`,\
  \ exposed as `cites_all_active` on the scenario node). Rule 6a's\n    regression-test\
  \ obligation is UNCHANGED — a stabilized path is still captured as a test — it simply\n\
  \    no longer feeds a status. Re-introducing `live` needs BOTH arms, not just a\
  \ producer.\n  - `retired` — human-set: the path is abandoned; stays in `scenarios/`,\
  \ still referenced (mirrors spec `retired`).\nSo `draft → building` is a DERIVED\
  \ read-only view; only `retired` is human-set. No new field beyond\n`cites` + `status`;\
  \ this REUSES the existing spec FSM + the rule-7 staleness-view machinery (no separate\n\
  detector). A stored `draft`/`building`/`live` in frontmatter stays ILLEGAL — the\
  \ retired name included,\nit was never legal to store. **The derived status carries\
  \ WHICH rule-6 enforcement applies** (see rule\n6): `draft` → none; `building` →\
  \ structural hard-error (6b) once concrete anchors are declared +\nstaleness-WARN.\n\
  \n### 4. Graph integration — +1 node, +1 edge, bounded\nReverses the deliberate\
  \ v2 graph-slim cut (6 node-types) to **7 node-types (`scenario`)** and\n**4 edge-types\
  \ (`covers`)** — the only schema growth. (The 4-filter justification for reversing\
  \ the cut\nis homed in SPEC-0031 §Graph schema bounds, where GRAPH.md points, +\
  \ the proposing plan §Approach.)\n  - `scenario` node — a thin node (`scenarios/<slug>.md`\
  \ frontmatter: `scenario`/`actor`/`status`/`cites`),\n    carrying `cites` like\
  \ the `pattern` node (prior-art for node-reuses-`cites`: the `error` node).\n  -\
  \ `covers` edge — `scenario → an anchor the graph ALREADY resolves TODAY` (the existing\n\
  \    `<file>#<symbol>` / `defined_in`-style anchor address space). **Scope guard\
  \ (audit F1):** `covers`\n    targets ONLY anchors resolvable with the CURRENT graph\
  \ anchor-space — it adds NO new\n    symbol-addressing/indexing substrate. A richer\
  \ scenario↔FSM-state coverage (an addressable\n    state/transition symbol like\
  \ `SPEC-XXXX#state:paid` that the graph CANNOT resolve today) is\n    therefore\
  \ **OUT OF SCOPE for SPEC-0076** and requires its OWN spec to build the symbol-indexer\
  \ — it\n    is NOT smuggled in here. A dedicated `FSM-state` node-type is likewise\
  \ DEFERRED. So this spec's\n    schema change stays an HONEST EXACTLY +1 node +\
  \ 1 edge (no hidden FSM-state layer).\n  - `cites` (reused, any→any) edge meaning\
  \ is DERIVED from the typed endpoints — no new edge per relation:\n    `cites(scenario→spec)`\
  \ = BINDS (a load-bearing rule the path passes through — binding by construction);\n\
  \    `cites(scenario→plan)` = design-input (the scenario→plan seam); `cites(scenario→scenario|pattern|doc)`\n\
  \    = composition/coherence link; `cites(plan→scenario)` = the plan's declared\
  \ scenario INPUTS\n    (the scenario→plan seam from the plan side — a plan declares\
  \ the user-path(s) it shapes by listing\n    scenario slug(s) in its own `cites:`,\
  \ reusing the any→any edge; no new `scenarios:` field). The\n    coverage/coherence\
  \ queries are VIEWS over the typed-cites graph.\n\n### 5. Authoring format — step-annotated\
  \ cites + error branches\n**The obligation is per-AUTHORED-item, NOT a coverage/completeness\
  \ mandate (audit F3).** It constrains\nonly what IS written; the ABSENCE of a step\
  \ or an error-branch is NOT itself a defect or a review-fail\n(a scenario is descriptive\
  \ composition, never a completeness/acceptance carrier — that would re-import\n\
  a normative-completeness criterion the rule-2 boundary forbids).\n  - Each AUTHORED\
  \ step annotates its ONE governing anchor inline + a one-line role gloss\n    (`→\
  \ SPEC-XXXX — <gloss>`), OR is marked `(ungoverned)` for a deliberately ungoverned\
  \ step (a\n    recognized non-goal). The gloss POINTS at the rule; it never RESTATES\
  \ it (rule 2 / P5).\n  - **Error / negative branches, WHEN authored,** narrate the\
  \ failure path descriptively and each\n    `cites` the spec whose `## Verification`\
  \ carries the enforceable negative check (the test ORACLE).\n    Narration (scenario)\
  \ + the enforceable check (spec `## Verification`) are complementary,\n    non-duplicating\
  \ homes for \"how it must NOT work\" — the spec side stays the canonical oracle\
  \ (rule 2\n    holds). Whether a given error-branch is worth authoring is a descriptive-completeness\
  \ judgement, not\n    a rule the scenario must satisfy.\n  - Reusable blocks are\
  \ factored out so scenarios compose shared sub-paths.\n  - **A step MAY name an\
  \ exact TEST anchor in `covers`, ADDITIVELY beside its production anchor(s)\n  \
  \  ( — the converged binding shape of plan scenarios-as-executable-specs-bind-scenario-steps-).**\n\
  \    The test anchor uses the grammar the graph already resolves (rule 4): `tests/<file>.py#<fn>`\
  \ (a\n    test function) or `<file>.test.jsx#<it label>` (a describe/it/test label).\
  \ The production anchor\n    STAYS — impact discovery keys on it, execution on the\
  \ test anchor; a test anchor never replaces\n    it. **Point-first:** the test is\
  \ FOUND first (grep for an existing test asserting the step's\n    user-visible\
  \ outcome) and written ONLY where none does. It sits at the step's OWN observable\n\
  \    boundary (render wiring for a screen, a domain invariant for a figure) and\
  \ is shown to redden on\n    a STEP-SPECIFIC fault input before it counts. Like\
  \ every anchor it resolves or is refused (6b).\n    The anchor names the function\
  \ or the label IN FULL, as written in the test file; resolution checks\n    only\
  \ the FACT that the file carries it (a label is found by its text, so a truncated\
  \ label may still\n    resolve) — writing it in full is the author's part, not something\
  \ the graph proves.\n    Binding a test is per-authored-step, never a coverage mandate\
  \ (the audit-F3 line above holds).\n\n### 6. Enforcement split — BLOCK ON FACT,\
  \ never on suspicion (3 mechanisms on EXISTING stages)\nA debugged user-path must\
  \ not be silently broken by later development — but \"block\" is placed only where\n\
  the check can be RIGHT (so the graph never becomes a v1-style suspicion-gate):\n\
  \  - **(a) Regression of a debugged path → BLOCK via the TEST** (the one sanctioned\
  \ V2 gate: tests green =\n    commit). A stabilized path is captured as a test (scenario\
  \ path + the cited specs' negative checks =\n    oracle); later work that breaks\
  \ it FAILS the suite. The scenario↔test binding makes a stabilized\n    path un-silently-breakable.\
  \ (This obligation is unchanged by retirement of the `live`\n    STATUS — the test\
  \ still gates regressions; it no longer feeds a status.) (Runs inside the existing\
  \ Tests stage.)\n    **The §5 test anchor IS this obligation's producer :** \"a\
  \ stabilized path is captured as\n    a test\" is met by naming that test on the\
  \ step's `covers`, so the step↔proof binding is written\n    down and graph-resolved\
  \ rather than remembered.\n\n    **A RED bound test NAMES ITS STEP (report-only).**\
  \ When a test that a STEP names in\n    `covers` fails at the Tests stage (`task\
  \ test --run`) or at the land verify, the failure report\n    carries one derived\
  \ line per such test — `FAILS the proof of <scenario>#<step> — <anchor>` —\n   \
  \ resolved from the scenario files at print time (`bin/lib/scenario.py#scenario_step_proof_lines`).\n\
  \    Bound = a TEST anchor (`tests/<file>#<fn>` / `<file>.test.jsx#<it label>`,\
  \ the binding shape of\n    plan scenarios-as-executable-specs-bind-scenario-steps-)\
  \ that a numbered `**<step>**` line names\n    in backticks; a production anchor\
  \ or an anchor no step annotates is no proof and prints nothing.\n    Identity is\
  \ per failure RECORD of the runner output (file + symbol on the same record), never\n\
  \    correlated across lines. It is a VIEW: no store, no scenario status (rule 3\
  \ — `live` stays\n    retired), no change to which tests run, no gate change — the\
  \ test already fails the run; nothing\n    checks a scenario on a schedule (SPEC-0142).\n\
  \  - **(b) Broken REFERENCE → HARD ERROR, deterministic, SCOPED — FACT-only, not\
  \ a legality validator\n    (audit F2)** — a scenario whose `covers`/`cites` target\
  \ does NOT RESOLVE (a dangling anchor: the\n    referenced state/transition symbol\
  \ or spec does not exist) fails like a broken reference / type\n    error (zero\
  \ false-positive). The check is the FACT of non-resolution ONLY. It does **NOT**\
  \ judge\n    transition LEGALITY (\"the FSM forbids this transition\") — that is\
  \ semantic validation, which\n    contradicts \"graph is not a validation layer\"\
  \ (GRAPH §What graph is NOT) and would re-open v1-style\n    gate creep; legality\
  \ is left to TESTS or a read-only view, UNLESS a separate normative spec later\n\
  \    supplies a machine-checkable legality model. **Scoped to scenarios that declare\
  \ concrete anchors**\n    (`building`); exploratory/pre-binding `draft` stays OUTSIDE.\
  \ (At scenario/FSM-spec write-time.)\n  - **(c) Staleness / \"zone touched\" → read-only\
  \ WARN** — the graph sees only STRUCTURAL overlap (\"you\n    touched a spec scenario\
  \ X cites\"), not actual breakage, so it points at what to re-verify; the TEST\n\
  \    (a) decides. TWO DISTINCT LENSES, each keyed on its own question (X-1077 —\
  \ keying both on\n    the TASK's cites made the staleness label name a defect it\
  \ did not detect):\n    the IMPACT lens keys on the TASK's `cites` (\"you are about\
  \ to edit a spec these user-paths pass\n    through — re-verify them\") and is delivered\
  \ at Analysis; the STALENESS lens keys on the SCENARIO's\n    OWN `cites` — a scenario\
  \ citing a spec that is no longer `active`, exactly the §7(2) signal — and is\n\
  \    TASK-INDEPENDENT: a stale file is named whether or not the task in hand cites\
  \ it, and a re-pointed\n    one stops being named.\n  **The STALENESS lens carries\
  \ a SECOND key at Audit-post + Closure — the BOUND TEST :** when\n  the task's diff\
  \ CHANGES a test anchor a scenario step names in `covers` (a test anchor named ADDITIVELY\
  \ beside the step's production anchor — the §5 binding —\n  `tests/<file>#<fn|label>`\
  \ — the symbol's own region, or the whole file for a path-only anchor), the\n  lens\
  \ names `<scenario>#<step>`: the step's PROOF changed, so the step text must be\
  \ re-read — update\n  the scenario or state why not. Keyed on the TEST anchor ONLY,\
  \ never the production anchor: the trial\n  (plan scenarios-as-executable-specs-bind-scenario-steps-\
  \ Run 3) measured a production-anchor key at\n  163/205 = 79.5% of UI tasks — noise\
  \ that would be ignored within a week. A changed bound test is rare\n  and always\
  \ meaningful. Derived from the graph + the diff each time; read-only WARN, no gate,\
  \ no store.\n**Selecting the bound tests for a diff is the TEST-granularity sibling\
  \ of verify-layer\n`subject_globs` (SPEC-0152 rule 16), not a new mechanism.** `subject_globs`\
  \ already\nchooses what to run from the diff at LAYER granularity, at `land`; a\
  \ scenario's `covers` offers the\nsame idea one level finer, during work: intersect\
  \ the diff with the steps' production anchors, take\nthose steps' test anchors,\
  \ and those node ids are the check. The selection is derived from the tree\neach\
  \ time and changes nothing at `land` (layer skipping already does that). Execution\
  \ is\nCONSUMER-LOCAL — each project invokes its own harness on the selected node\
  \ ids (a compose stack in\none, a hermetic node-id run in another); the kernel owns\
  \ only the anchor grammar (§5) and this\nselection rule, executes nothing, persists\
  \ nothing, and derives no scenario state from the result\n(`live` stays retired,\
  \ rule 3).\n**A THIRD lens, the CODE→SCENARIO direction — the UNCOVERED USER SURFACE\
  \ :** the two lenses\nabove run spec→scenario; this one asks the inverse — \"this\
  \ task touches a user surface NO scenario\ncovers\". When the project DECLARES its\
  \ user surfaces (`ui.surfaces:` path prefixes, SPEC-0093 rule 29\n— absent = silent,\
  \ never a guess), a task whose paths touch a non-test file under a prefix that no\n\
  non-retired scenario's `covers` names gets ONE line per surface: `diff touches <surface>\
  \ no scenario\ncovers (<files>) → author one (scenario new) or state why not`. Delivered\
  \ at Analysis (claim + `stage\nAnalysis`) from the SAME touch forecast audit-pre\
  \ reads (`expected_touch` ∪ the plan's path tokens).\nIt is NOT delivered at Closure:\
  \ that leg (the same line, off the task's real recorded diff) was\nRETIRED by on\
  \ a measured reading — AC4 («does the Closure line make people author\nscenarios?»)\
  \ was settled FALSIFIED on 2026-10-03: the line printed at Closure in at least 33\
  \ real\nconsumer sessions (2026-09-28..10-03) and none authored a covering scenario\
  \ or recorded why not\n(owner decision `events.jsonl#ts=`). Do not re-add a Closure\
  \ print without a new\nreading. Report-only, same rule as (c): no gate at close\n\
  or land, no store, no validator on the graph. It keys on the CREATE question only\
  \ — a touched\nCOVERED file is not a key (the \"update\" reading fired on 79.5%\
  \ of UI tasks). Its precision was\nmeasured before it shipped (strict false-positive\
  \ rate 0.200 <project> / 0.144 <project>,\n`dev-utilities/uncovered-surface-precision-.md`)\
  \ and owner-accepted. **Retires (P1 F3):** the\nmanual \"name the scenario you touched/created\"\
  \ Worker-brief line — the lens now says it at the seam.\nIts standing count is the\
  \ SPEC-0119 rule-43 debt row; both read one derivation.\n**Placed on EXISTING lifecycle\
  \ stages, no new FSM state / gate / parallel lifecycle (B-0 bound):**\nAnalysis\
  \ = impact-WARN, write-time = structural hard-error (b), Tests = regression-block\
  \ (a),\nclaim + Analysis + Audit-post + Closure = staleness-WARN (c) — delivered\
  \ EARLY as well as late,\nbecause a stale citation surfaced only after the editing\
  \ is done is a finding nobody can act on in\nthe pass that raised it. At PLAN altitude\
  \ the `draft→specs` / `accepted→decomposition`\ncoherence check is transition-VALIDATION\
  \ folded into the existing `plan stage` transition — NOT a new\nverb/review-loop/approval\
  \ gate.\n\n### 7. Drift-resistance (the design is sound only if all three hold)\n\
  A scenario is drift-RESISTANT iff: (1) zero-normatives (rule 2) — it restates no\
  \ rule, so it can only go\nstale on the STATUS of what it cites; (2) machine-checkable\
  \ `cites` (rule 4) — \"cites a superseded/retired\nspec\" is a QUERYABLE staleness\
  \ signal, never silent; (3) a read-only staleness VIEW for human/AI\nadjudication\
  \ (NOT auto-fix — graph = visibility, not a validation layer). Distinguish COSMETIC\
  \ drift (cite\ntarget renamed/superseded, rule unchanged → cheap machine re-point)\
  \ from a GENUINE path-change (the rule\nchanged how the path behaves → update the\
  \ scenario; that is correctness, not drift).\n\n### 8. Anti-complexity bound (what\
  \ this is NOT)\nThe whole footprint is **one artifact + one node + one edge + checks\
  \ on existing stages**. NO new\nlifecycle FSM state, NO parallel scenario-lifecycle,\
  \ NO new gate cascade, NO automatic semantic\nconflict-detector (the graph surfaces;\
  \ human/AI adjudicates under P7), NO `FSM-state` node-type (deferred).\nMinting\
  \ the node-type requires the 4 filters + owner approval at authoring (the negative\
  \ probe, rule below).\n\n## Rationale\n\nPrior-art (CHARTER §P1 F4): v1 first-class\
  \ `SCN-*` graph nodes; external BDD feature-files / UML\nuse-cases / user-story\
  \ maps; production yitc-consumers — <project> (`SCN ↔ FSM ↔ code`, 67 YAML,\n`error_class`\
  \ branches), <project> + <project> `scenarios/` dirs; the live v2-self recurrence\
  \ (Review/Build\nmicro-scenarios). The distinct node-type (not `pattern` reuse)\
  \ is settled on the **primary-instrument**\nargument (the scenario is the owner's\
  \ daily control surface, managed/dashboarded AS A CLASS) + the\nasymmetric multi-project\
  \ retrofit cost (CHARTER §P1 scale-aware refinement) — full deliberation in the\n\
  proposing plan (3 external-audit rounds, all YELLOW-absorbed).\n\n## Verification\n\
  \nAdoption probes (verified at the mint, not while draft):\n- graph indexes a `scenario`\
  \ node; a `covers` edge resolves to an anchor the graph ALREADY resolves\n  today\
  \ (a dangling `covers`/`cites` target → the rule-6b broken-reference hard-error;\
  \ legality is NOT\n  checked); a target needing a new symbol-indexer is out of scope\
  \ (rule 4).\n- status is DERIVED, not hand-set: a scenario citing a spec reads `building`,\
  \ one citing none reads\n  `draft` (rule 3); whether every cited spec is `active`\
  \ is carried by the node's `cites_all_active`.\n- the α (type-vs-cited-territory)\
  \ + β (ungoverned-step) integrity queries surface on real scenarios\n  (already\
  \ demonstrated on the v2-self dogfood under the existing carrier, no schema change\
  \ — the\n  proposing plan's §Amendment 2026-06-16 session-3 + `scenarios/_dogfood-integrity-output.txt`).\n\
  - the scenario-staleness VIEW surfaces a scenario whose cited spec changed status\
  \ (read-only, never a gate).\n- NEGATIVE probes (the anti-complexity guard): a scenario\
  \ that RESTATES a spec's rule FAILS review\n  (rule 2); the node-type is NOT minted\
  \ without the 4-filter justification + owner approval; NO automatic\n  semantic\
  \ conflict-detector is.\n"
