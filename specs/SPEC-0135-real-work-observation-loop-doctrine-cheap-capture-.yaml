init_concern:
  init_question: 'Does this project POPULATE its.yitc/transcript-archive (the kernel
    Duty-1 recipe: rsync -a ~/<provider-config>/projects/ <repo>/.yitc/transcript-archive)
    so the read-time token-rollup COST dimension (baseline $/task) is measurable?
    Declare the population duty, or waive the cost dimension.'
  waiver: A project that does not want per-task cost measurement may bare-waive —
    the token-rollup then DEGRADES to the named 'archive absent' outcome (a fail-closed
    named unavailability, never a silent zero-cost reading), and the cost dimension
    stays n/a on that project.
  evidence: a populated.yitc/transcript-archive feeding a non-abort `graph query token-rollup`
    (the cost dimension resolves), or the named waiver recorded for the concern.
  recommended: Waive for now — per-task cost then reads the named 'archive absent'
    outcome instead of a number. Declare the population duty (the rsync recipe) later
    if you want to measure what each task costs.
  record_at: 'Declare: a scheduled `rsync -a ~/<provider-config>/projects/ <repo>/.yitc/transcript-archive/`.
    Waive: nothing is written — the cost reading then shows ''archive absent''.'
  tier: universal
