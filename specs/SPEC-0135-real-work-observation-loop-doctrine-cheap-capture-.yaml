body: "## Scenario\n\nThe owner/AI wants to know how the methodology, the AI (worker\
  \ + external-auditor PAIR), the\nhardware, and the human actually perform in REAL\
  \ work across ALL projects — to steer methodology\nevolution (\"which way to move\"\
  ), recommend a provider×model×effort PAIR to users, find where discipline\nbreaks,\
  \ and size minimum hardware per project class. Each PROJECT measures ITSELF cheaply\
  \ and\ncontinuously (on events that already fire); the KERNEL aggregates across\
  \ all projects rarely, at\nread-time, at revizia cadence — the 10th inspection theme.\
  \ The result is decision-useful NUMBERS,\nnever a scoring engine; the AI-usage data\
  \ is a reusable byproduct (incl. marketing). This closes a\nmeasurement gap: V2's\
  \ success was defined in measured terms that nothing yet computes.\n\n## Internal\n\
  \nTHE REAL-WORK OBSERVATION-LOOP DOCTRINE. Seven rules. It adds NO new store / parser\
  \ / journal /\nevent-type / daemon (CHARTER §P1): it rides the EXISTING event-emit\
  \ path + `graph`-as-derived-view.\n\n### 1. Two modes — capture CHEAP+continuous,\
  \ analysis RARE+read-time\nCapture rides existing emit points (a few extra raw FIELDS\
  \ on anchor events the verbs already emit);\nit is near-zero cost and always-on.\
  \ Unification/analysis is READ-TIME and RARE (revizia cadence) —\nits parse/aggregate\
  \ cost is non-critical because it is paid only then.\n\n### 2. Realm — project measures\
  \ ONLY itself; the KERNEL aggregates across ALL\nA project's own numbers are LOCAL\
  \ to it. Cross-project rollup is KERNEL-ONLY, carried by the existing\nregistry-enumeration\
  \ seam (SPEC-0105 nightly). A project never reads another project's numbers.\n\n\
  **Per-project view project resolution.** `graph query observation [project]` resolves\n\
  every `session_started` row of ONE journal to that journal's OWNER project (the\
  \ CLI passes the\nself-project; the same resolution the kernel rollup uses) BEFORE\
  \ the `project` filter — the stamped\n`data.project` is the worktree leaf (a task\
  \ id / slug) inside a worktree, so keying on it dropped\nthose sessions. Legacy:\
  \ a direct caller that passes no self-project keeps the stamped value\n(multi-project\
  \ fixtures). Output contract: `project_resolution` names which rule ran\n(`journal\
  \ owner ` | `stamped session_started.project`), and `attribution[project]` carries\n\
  `sessions`, `attributed_sessions` (worker triple with no `unknown` axis) and `attributed_share`\n\
  (3-dp, null on zero) — a count + share, report-only, never a score.\n\n### 3. Source-fact\
  \ vs derived-view (Single-SoT, CHARTER §P5 / §P7)\nThe journal stores ONLY **raw\
  \ facts / join keys**: identity (provider×model×effort), timing\n(`duration_ms`),\
  \ status/outcome, host, counts. **Usage + cost are NEVER journaled** — they are\
  \ a\nREAD-TIME DERIVED view (`token-rollup` × `pricing-config` over the archived\
  \ transcript / audit-call\nevidence — the settled owner reroute, prior-art `observability-metrics-ai-benchmarking-data-model`).\n\
  The kernel aggregates the DERIVED numbers, NEVER raw transcript text (privacy +\
  \ no second truth).\n\n### 4. OBSERVE the roles that already exist — do NOT create\
  \ a pipeline\nV2 already has a worker (executes) and, on AUDITED tasks, an external\
  \ auditor (CHARTER §P4 — different\nproviders). This doctrine only OBSERVES those\
  \ roles when present: it captures worker-side identity\n(`session_started`) and,\
  \ for audited tasks, auditor-side identity (the audit events), and rolls them\n\
  up to the **pair** for comparison. It introduces NO mandatory two-role pipeline\
  \ / role taxonomy /\nrole for un-audited work (CHARTER §6).\n\n### 5. Every indicator\
  \ ties to a DECISION; output is FINDINGS, not a score\nAn indicator that changes\
  \ no decision is not captured (CHARTER §P1 F4 — no imagined-necessity\nmetrics).\
  \ The analysis output is findings-by-severity + counts + trend + the derived binary\n\
  `open HIGH? yes/no` — NEVER a composite quality SCORE / colour band (SPEC-0057 §4\
  \ fence held).\n\n### 6. Additive-only + explicit NEGATIVE scope\nJustified additive\
  \ (the CHARTER measurement gap + the realized observability program it EXTENDS).\
  \ ONE\nreplacement: the verbatim `session_config` descriptor becomes NON-slice-source\
  \ once the normalized\n`provider×model×effort` triple lands (the triple is the sole\
  \ slice key; the string stays raw\nprovenance). This doctrine will NOT add: a standalone\
  \ telemetry schema / export store; journaled\nusage/cost; a per-task token splitter;\
  \ a composite score; a new audit-result store; a daemon/cron; a\nnew event TYPE\
  \ (`SPEC-0025` is AMENDED, not forked).\n\n### 7. Portable vocabulary\nThe field/view\
  \ vocabulary ALIGNS to OpenTelemetry GenAI semantic conventions for fork/tool\n\
  portability — as an export/naming aid ONLY; the SoT stays the journal events + the\
  \ added fields.\n\n## Rationale\n\nThe CHARTER formerly defined success in measured\
  \ terms (a production-project task with measurably\nlower session friction than\
  \ its v1 equivalent) but nothing computed it; anti-recurrence (CHARTER §P1\nF4)\
  \ needs real data on WHERE discipline breaks. History note: that definition stood\
  \ in the CHARTER's\n«Success criteria» section, which retired from the CHARTER as\
  \ history.\nPrior-art reused (extend, not create): `token-rollup` / `task-scorecard`\
  \ / `trend-report` views, the\n`nightly` registry enumeration (SPEC-0105), the `inspection`\
  \ construct (SPEC-0057), the bench\nworker×auditor pair benchmark (<workshop-spec>),\
  \ the `debt` views (SPEC-0119). Gate-specs convergence\nconsult confirmed rule 3\
  \ (read-time-derived cost) as the sole coherent Single-SoT resolution.\n\n## Verification\n\
  \n- Capture: each added field emits on the next real session/land/audit (state-check\
  \ on `events.jsonl`).\n- SoT probe: `events.jsonl` carries NO journaled usage/cost\
  \ field (grep-absent); cost resolves only\n  via `token-rollup` × `pricing-config`.\n\
  - Aggregation: the kernel view returns real provider×model×effort PAIR slices over\
  \ ≥ 2 real\n  project-weeks, with sample-size/confidence shown.\n- Theme-10: an\
  \ `inspection_completed` (theme-10) event exists AND ≥ 1 `owner_action_linked`\n\
  \  (task/followup id) cites its findings.\n- Adoption: ≥ 1 decision links a deviation-fingerprint\
  \ → fix → before/after recurrence → owner action.\n"
