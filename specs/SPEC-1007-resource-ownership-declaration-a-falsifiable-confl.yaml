id: SPEC-1007
title: Resource-ownership declaration — a falsifiable conflict-domain contract; independent_layers
  stands as the project's own declared risk judgement
status: active
created_at: 2026-10-04 20:55:03+00:00
travels: null
consumed: false
extension: null
implements: []
body: "## Scenario\n\nA project that wants its land-verify layers to run concurrently\
  \ has two standings open to it, and they\ndiffer in kind. It may state the conclusion\
  \ ITSELF — name the layers in `verify.independent_layers:` —\non its own judgement\
  \ and at its own risk. Or it may declare what each layer OWNS, so that independence\n\
  becomes something a reader DERIVES from declarations that can each be individually\
  \ falsified. The first\nis the project's own decision, and the kernel does not second-guess\
  \ it. The second is the only route by\nwhich the KERNEL could ever conclude that\
  \ layers are independent, and no bare assertion substitutes\nfor it.\n\nUnder the\
  \ ownership route a layer DECLARES its conflict domains: for each resource class,\
  \ which\ndomains it owns, on what terms, and — for every one of them — the probe\
  \ that would DISPROVE the claim.\nWhat a layer does not declare, it does not own,\
  \ and a resource nobody owns is not evidence of safety —\nit is the reason the kernel\
  \ derives no eligibility for that layer. A project about to name layers in\n`independent_layers:`\
  \ is best served by walking the same resource classes first: the ownership\ndeclaration\
  \ is the instrument for making that judgement well, never a precondition for making\
  \ it.\n\n## Internal\n\nTHE RESOURCE-OWNERSHIP DECLARATION CONTRACT — the sole normative\
  \ home of what a verify layer declares\nabout the resources it owns, of the fail-closed\
  \ default for everything it does not, and of the STANDING\nof the one key by which\
  \ a project declares layer independence on its own judgement. Eight rules.\n\nexecution:\
  \ documentary — the contract states what a project declares and what standing each\
  \ declaration has; no kernel code reads `owns:` (rule 8), and the one runtime reader\
  \ of `independent_layers:` is anchored by SPEC-0152 rule 16, the field's own home.\n\
  \n> **SUPERSEDES <workshop-spec>.** ONE normative change, and an exact list of every\
  \ passage the\n> predecessor's text moved with it.\n> THE NORMATIVE CHANGE: rule\
  \ 1 admits `verify.independent_layers:` — WITHOUT `owns:` — as the project's\n>\
  \ own declared risk judgement, which the kernel checks for SHAPE only. The predecessor's\
  \ rule 1 forbade\n> every assertion carrier («no key by which a project states the\
  \ conclusion directly») and its rule 3\n> made a layer with no `owns:` ineligible,\
  \ so the same declaration that SPEC-0152 rule 16 offered and\n> the land runner\
  \ honoured was, under <workshop-spec>, not admissible at all.\n> EVERY OTHER EDIT\
  \ IS RECONCILIATION — no further obligation moves, the wording stops contradicting\n\
  > rule 1: the §Scenario names both standings; rule 3's ineligibility and its scope\
  \ bound are scoped\n> to KERNEL-DERIVED admission and name the exception; rule 6's\
  \ «no fourth disposition» is scoped to a\n> boundary INSIDE `owns:` and names the\
  \ one section-level carrier of an accepted risk; rule 7's\n> anti-example no longer\
  \ says the pair «was admissible under rule 1» and says what the project may\n> still\
  \ declare; rule 8 states that nothing reads `owns:` and where today's concurrency\
  \ comes from;\n> §Rationale and §Verification gain the change's ground and probes.\
  \ Rules 2, 4 and 5, and rule 7's\n> worked declaration, are carried character-for-character.\n\
  > Routed as a SUPERSEDE, not an in-place amend, because it changes what the contract\
  \ FORBIDS in an\n> ALREADY-COVERED case (SPEC-0005 rule 7's discriminating probe):\
  \ a project declaring\n> `independent_layers: [a, b]` with no `owns:` was covered\
  \ by the predecessor's rules 1 and 3, and\n> refused there.\n\nThe CARRIER SHAPE\
  \ lines are single-homed in SPEC-0152 rule 16: that `owns:` is an optional sub-field\n\
  of a `verify.layers[]` entry (with the sibling sub-fields `covers:` / `boundary:`\
  \ / `subject_globs:`),\nand the NAME, SHAPE and SEMANTICS of the section-level `independent_layers:`.\
  \ That spec points HERE\nfor the ownership contract and for the standing of `independent_layers:`,\
  \ and this spec does not\nrestate the carrier's own rules (SPEC-0005 rule 8; SPEC-0093\
  \ rule 3's stance-and-shape-never-value\ndiscipline governs both fields exactly\
  \ as it governs their siblings).\nThe TEST-AUTHORING sibling of this contract is\
  \ **SPEC-0041 §1c** (a mutable resource a test OWNS\ntakes a run-unique name): §1c\
  \ owns how a TEST IS WRITTEN so that a layer-independence claim can be\ntrue, this\
  \ spec owns what a PROJECT DECLARES in order to make that claim. The two are one\
  \ pair read\nfrom two ends — §1c points here for the declaration, this points there\
  \ for the authoring — and\nneither restates the other's rules.\n\n### 1. A bare\
  \ independence claim carries no kernel-derived eligibility — and the ONE key a project\
  \ declares on its own judgement\nA declaration that ASSERTS independence — a boolean,\
  \ a flag, a named set, or prose to the effect that\nlayers do not conflict — states\
  \ a conclusion while carrying nothing that could contradict it, so it\nreads identically\
  \ whether it is true or false. Such a claim is therefore **never EVIDENCE of\nindependence,\
  \ and the kernel DERIVES no concurrency eligibility from it**; offered as proof\
  \ it is a\n**false attestation**. Concretely RETIRED-IN-ROLE by this rule:\n  -\
  \ an `independent: true`-shaped per-layer or section-level key. It is refused by\
  \ name, and the\n    narrowing-to-a-boolean direction is not a future extension\
  \ of this contract;\n  - the standing of **ports, compose-project names and databases\
  \ as \"the evidence for independence\"**.\n    Those three are DEMOTED to what they\
  \ are: examples falling inside two of the seven classes of\n    rule 2 (`services`,\
  \ `processes`). They remain perfectly good declarations; what they cease to be is\n\
  \    a sufficient answer, because a layer pair may differ on all three and still\
  \ both rewrite one build\n    cache, one coverage file, one generated artifact or\
  \ one temporary path.\nKernel-derived eligibility is **DERIVED from declared ownership,\
  \ never asserted**.\n\n**THE ONE NAMED EXCEPTION — `verify.independent_layers:`\
  \ IS ADMISSIBLE AS THE PROJECT'S OWN DECLARED\nRISK JUDGEMENT.** The section-level\
  \ `verify.independent_layers:` list (its name, shape and semantics\nare SPEC-0152\
  \ rule 16's) is the ONE key by which a project states the conclusion directly, and\
  \ it is\nadmissible WITHOUT `owns:`. Its standing is neither evidence nor a kernel-derived\
  \ eligibility: it is\nthe project's own decision to run the named layers overlapped,\
  \ taken at the project's own risk, on\nthe same terms as the project-declared exemption\
  \ of CHARTER §Project-declared audit-post exemption\n(SPEC-0178):\n  - **attributable**\
  \ — it sits in the project's own `yitc-ops.yaml`, whose history names who wrote\
  \ it;\n  - **reviewable** — it is one line a review can read, beside the layers\
  \ it names;\n  - **reversible** — the project removes it by deleting the line, and\
  \ the layers run serially again.\n**The kernel checks its SHAPE ONLY and does not\
  \ police independence**: it neither verifies that the\nnamed layers share nothing\
  \ nor requires any declaration that they do not. A wrong declaration costs\nonly\
  \ the declaring project's own verify; it reaches no other project and removes no\
  \ kernel gate.\n**`owns:` is an OPTIONAL AID, not an admission gate.** The declaration\
  \ of rules 2-6 is how a project\nthat wants to make this judgement WELL makes it\
  \ checkable — walking the seven classes of rule 2 over\neach named pair, `prep:`\
  \ included, is the recommended preparation — but its presence, its absence and\n\
  its content neither admit nor refuse a layer named in `independent_layers:`.\nThe\
  \ exception is CLOSED at this one key. No other assertion carrier is admitted, the\n\
  `independent: true` boolean stays refused, and admitting a second key is a normative\
  \ reshape of this\nrule (SPEC-0005 rule 7 supersede), never a local carrier extension.\n\
  \n### 2. The declaration — `owns:`, over seven resource classes\nA `verify.layers[]`\
  \ entry MAY carry an OPTIONAL `owns:` mapping. Its keys are drawn from exactly these\n\
  **seven resource classes**, which are the CLOSED set this contract addresses:\n\n\
  | class | what it covers |\n|---|---|\n| `mutable_files` | any path in the tree\
  \ or on the host this layer WRITES (build outputs, generated artifacts, coverage\
  \ files, fixtures, lockfiles) |\n| `caches` | any store kept ACROSS runs to make\
  \ a later run cheaper (package caches, build caches, image layers, compiled-artifact\
  \ dirs) |\n| `temp_paths` | any scratch location created for the run (`/tmp` entries,\
  \ scratch dirs, mount points, download staging) |\n| `services` | anything reached\
  \ over an address (host ports, containers, databases, message brokers, HTTP endpoints,\
  \ external APIs) |\n| `locks` | any mutual-exclusion primitive (lockfiles, flocks,\
  \ advisory DB locks, semaphores, named mutexes) |\n| `processes` | process- and\
  \ container-namespace identity (compose project names, container names, process\
  \ groups, PID-keyed identifiers) |\n| `shared_sinks` | any destination MORE THAN\
  \ ONE writer appends to by design (the journal, an aggregated report, a metrics\
  \ endpoint, a shared log) |\n\nEach class holds a LIST of **boundary entries**.\
  \ A boundary entry is a mapping:\n\n    owns:\n      <class>:\n      - domain: <the\
  \ conflict domain this layer owns> # required, non-empty\n        mode: exclusive\
  \ | shared-synchronized | serial # required (rule 6)\n        probe: <the check\
  \ that FAILS when this boundary is violated> # required (rule 4)\n        sync:\
  \ <the one synchronized write path> # required IFF mode is shared-synchronized (rule\
  \ 5)\n\n`domain:` is the conflict-domain identifier in the class's own address space\
  \ — a repo-relative glob for\nthe path-shaped classes, a name or name-pattern for\
  \ `services` / `locks` / `processes`, an individually\nnamed sink for `shared_sinks`\
  \ (rule 5). It is read as a **conflict domain**, not as a path list: two\nlayers\
  \ conflict when their domains can resolve to the same underlying resource, which\
  \ is why a\nPID-keyed or run-keyed domain (`<project>-verify-$$`) is a legitimate\
  \ exclusive domain while the fixed\nname it replaces is not.\n\n**DECLARING THAT\
  \ A CLASS IS UNUSED IS ITSELF A FALSIFIABLE CLAIM — a bare empty list is REFUSED.**\n\
  \"This layer touches no resource of this class\" is a strong claim about a whole\
  \ class, and rule 4 binds\nit exactly as it binds any other boundary: it MUST carry\
  \ the probe that would disprove it. A bare\n`caches: []` carries none, so it would\
  \ be the one shape in this contract that asserts something\nnothing can contradict\
  \ — rule 1's defect, re-entering through the class that is easiest to leave out.\n\
  A class the layer genuinely does not use is therefore declared with the **unused-class\
  \ boundary**:\n\n      caches:\n      - domain: none # the reserved domain naming\
  \ \"no resource of this class\"\n        mode: exclusive\n        probe: \"! find.\
  \ -name '.build-cache' -newer.verify-start -print -quit | grep -q.\"\n\nThe probe\
  \ of an unused-class boundary is the check that **FINDS such a resource**, and it\
  \ fails when\none appears. An EMPTY LIST is REFUSED (rule 3) — it is not a shorthand\
  \ for this shape.\n\n**Every class is addressable, and the seven are the closed\
  \ set.** A resource that does not fall in any\nof the seven classes is by rule 3\
  \ undeclared, and therefore refused — it never falls through as\npermitted. Adding\
  \ an eighth class is a normative reshape of this rule (SPEC-0005 rule 7 supersede),\n\
  never a local carrier extension.\n\n### 3. Fail-closed default — undeclared means\
  \ REFUSED, never permitted\n**For KERNEL-DERIVED admission, the default for an undeclared\
  \ resource is refusal, not permission.**\nEach of the following makes a layer INELIGIBLE\
  \ for kernel-derived concurrent admission:\n  - the layer carries no `owns:` at\
  \ all;\n  - `owns:` is present but OMITS a class — an omitted class declares nothing\
  \ about that class, and\n    \"nothing declared\" reads as CONFLICT, never as \"\
  no conflict exists\";\n  - a class is present as a BARE EMPTY LIST — an unfalsifiable\
  \ class-wide claim; a genuinely unused\n    class takes the probe-carrying unused-class\
  \ boundary of rule 2 (`domain: none`) instead;\n  - any boundary carries `mode:\
  \ serial` — a correct declaration that ROUTES the layer to the serial\n    lane\
  \ (rule 6), so it is not admitted concurrently;\n  - a boundary entry is malformed\
  \ — a missing or empty `domain:`, an unknown `mode:`, a missing\n    `probe:` (rule\
  \ 4), a `shared-synchronized` entry missing `sync:` (rule 5). A malformed entry\
  \ is\n    treated as ABSENT, so a typo can never read as a declaration;\n  - two\
  \ admitted layers declare domains that can resolve to the same resource under any\
  \ mode other\n    than the ones rule 6 permits for sharing.\n**NONE OF THIS REACHES\
  \ A LAYER THE PROJECT NAMES IN `independent_layers:`.** That layer runs\noverlapped\
  \ on the project's own declared risk judgement (rule 1) whatever its `owns:` says\
  \ or omits.\nIneligibility here means only that the KERNEL has derived nothing for\
  \ the layer; it is never a refusal\nof the project's own declaration.\n**SCOPE BOUND,\
  \ stated so the rule is not read wider than it is.** What is refused is **KERNEL-DERIVED\n\
  CONCURRENT ADMISSION** — the layer runs, as it runs today: in the existing serial\
  \ order, or overlapped\nwhere the project itself names it in `independent_layers:`.\
  \ This contract therefore adds NO gate to\nany land as it stands: a project that\
  \ declares nothing keeps exactly its current behaviour, and the\nonly thing it cannot\
  \ do is have the KERNEL conclude an independence it has not shown. Consistent with\n\
  CHARTER §Project-declared audit-post exemption — automation may only RESTORE a gate,\
  \ never remove one.\n\n### 4. FALSIFIABILITY — every boundary names the probe that\
  \ would disprove it\nNORMATIVE: **every boundary entry MUST carry a `probe:`, the\
  \ named check that FAILS when that boundary\nis violated — including the rule-2\
  \ unused-class boundary.** There is no boundary shape exempt from it. This is what\
  \ separates a declaration from a claim: the declaration states what is owned AND\n\
  hands the reader the instrument that would catch it being wrong.\n  - A boundary\
  \ entry with no `probe:` is **undeclared** (rule 3), not a weaker declaration.\n\
  \  - The probe must be able to FAIL. A probe that passes under every state — including\
  \ the violation it\n    names — proves nothing and is not a probe. (The differential\
  \ discipline is homed in SPEC-0156 and\n    is cited, not restated: a check never\
  \ seen to fail proves nothing.)\n  - The probe is stated as a concrete check a reader\
  \ can run — a command, or a named script in the\n    project's tree. Like every\
  \ other value on this carrier, the kernel reads it as SHAPE and never\n    judges\
  \ its content (SPEC-0093 rule 3).\n  - The probe belongs to the BOUNDARY, not to\
  \ the layer: a layer declaring six boundaries names six\n    probes. A single per-layer\
  \ probe cannot discriminate which boundary broke, which is the property\n    that\
  \ makes a violated declaration diagnosable instead of merely red.\n\n### 5. The\
  \ shared-synchronized allowlist is BOUNDED — individually named, mechanism named,\
  \ probe carried\nSome sinks are shared by design and are safe because every writer\
  \ reaches them through one synchronized\npath. Such a sink MAY be allowlisted with\
  \ `mode: shared-synchronized`, under three conditions, ALL\nrequired:\n  1. **Named\
  \ INDIVIDUALLY.** `domain:` must be a LITERAL name of ONE sink. A **blanket allowlist\
  \ is\n     REFUSED BY NAME**: a glob, a wildcard, a prefix-with-`*`, a bare `all`\
  \ / `any` / `*`, an empty\n     name, or a directory standing in for its contents.\
  \ The refusal is structural, at the declaration\n     read — there is no reason\
  \ string that admits a blanket entry, because a blanket allowlist would\n     re-create\
  \ precisely the unfalsifiable claim rule 1 removes, one level down.\n  2. **The\
  \ SYNCHRONIZATION MECHANISM is named** in `sync:` — the ONE write path every concurrent\
  \ writer\n     goes through, and every writer to that sink MUST name the SAME one.\
  \ Naming the mechanism is the\n     substance of the exemption; a sink asserted\
  \ to be \"synchronized\" without naming what synchronizes\n     it is a rule-1 claim\
  \ and is refused, and two writers naming DIFFERENT paths for one sink conflict.\n\
  \  3. **It carries its own `probe:`** like any other boundary (rule 4) — the check\
  \ that fails when a\n     writer reaches the sink OUTSIDE the named path.\nA sink\
  \ QUALIFIES only when every concurrent writer reaches it through that one path;\
  \ if any writer can\nreach it directly, it does not qualify however well-behaved\
  \ the others are. Worked instance: the\nengine's `events.jsonl`, written by every\
  \ session through the governed `event` append (append-only +\nunion-merge), which\
  \ is the shape <project>'s green-exit test-class record already uses.\n\n**THE ONE\
  \ PATH MUST BE THE SAME ONE: layers naming DIFFERENT `sync:` values for the SAME\
  \ sink CONFLICT.**\nThe exemption rests on there being a single serializing path,\
  \ so two writers to one sink that name two\ndifferent paths have not described a\
  \ synchronized sink at all — they have described an unsynchronized\none twice. This\
  \ is a CONFLICT (rule 3's last clause), not a pair of valid declarations, and it\
  \ is the\nfailure mode an allowlist is likeliest to hide: each declaration is individually\
  \ well-formed and only\ntheir COMPARISON is wrong.\n\n### 6. Three dispositions,\
  \ and there is no fourth\nEvery resource a layer touches resolves to exactly one\
  \ of:\n  - **ISOLATE** (`mode: exclusive`) — the layer owns the domain alone; no\
  \ other admitted layer's domain\n    can resolve to it. The ordinary answer, and\
  \ the one a per-run key (a PID-keyed compose project, an\n    ephemeral port, a\
  \ run-scoped scratch dir) is for.\n  - **ALLOWLIST** (`mode: shared-synchronized`)\
  \ — a shared sink meeting all three conditions of rule 5.\n  - **SERIAL** (`mode:\
  \ serial`) — the resource cannot be isolated and does not qualify for the\n    allowlist,\
  \ so the subject runs in the **existing serial lane** rather than concurrently.\
  \ That lane\n    is `tests/load-sensitive.txt` and its two bounds are SPEC-0132\
  \ §3's watch-point; this rule\n    ROUTES to that existing lane and creates no second\
  \ serialization mechanism.\n    **A `serial` boundary is a ROUTING answer, never\
  \ a concurrency one: a layer carrying ANY `serial`\n    boundary is NOT admitted\
  \ to a concurrent lane** by kernel derivation — it is declared correctly and\n \
  \   routed to the serial lane. Reading `serial` as an admissible mode would let\
  \ a layer be concurrently\n    admitted on the strength of a declaration whose own\
  \ content says it must not run concurrently.\nAnything that resolves to none of\
  \ the three stays INELIGIBLE under rule 3. A fourth disposition INSIDE\n`owns:`\
  \ — an override, an accepted-risk marker on a boundary, a \"shared but we checked\"\
  \ — is\ndeliberately absent: it would be rule 1's unfalsifiable claim dressed as\
  \ a declaration. An accepted\nrisk has exactly ONE carrier and it is not a boundary\
  \ mode: the section-level `independent_layers:`\nof rule 1, the project's own declared\
  \ risk judgement. A layer that carries a `serial` boundary AND is\nnamed in `independent_layers:`\
  \ has declared two things that disagree; the runner honours\n`independent_layers:`\
  \ (nothing reads `owns:` — rule 8), and the disagreement is the project's own to\n\
  resolve.\n\n### 7. Worked example — <project>'s four layers, filled in\nThe four\
  \ declared layers (`static`, `sandbox`, `frontend-unit`, `stack`) were the corpus's\
  \ only\nindependence evidence, offered as prose. Filled into this contract, that\
  \ prose becomes checkable —\nand the filling is what shows the prose was incomplete:\n\
  \n    - layer: stack\n      command: bash scripts/verify-stack.sh\n      owns:\n\
  \        processes:\n        - domain: \"<project>-verify-$$\" # compose project\
  \ keyed to this shell's pid\n          mode: exclusive\n          probe: \"docker\
  \ compose ls --format json | jq -e '[.[]|select(.Name==\\\"<project>-verify-\\\"\
  +env.TESTPID)]|length==1'\"\n        services:\n        - domain: \"APP_PORT=0 DB_PORT=0\"\
  \ # ephemeral ports; the fixed 5434 is what this replaces\n          mode: exclusive\n\
  \          probe: \"grep -q 'APP_PORT=0' scripts/verify-stack.sh && ! ss -ltn |\
  \ grep -q ':5434 '\"\n        temp_paths:\n        - domain: \"/tmp/<project>-verify-$$/**\"\
  \n          mode: exclusive\n          probe: \"test -z \\\"$(find /tmp -maxdepth\
  \ 1 -name '<project>-verify-*' -not -name \\\"*-$$\\\")\\\"\"\n        mutable_files:\
  \ # DECLARED-UNUSED, and falsifiable: the mount is read-only\n        - domain:\
  \ none\n          mode: exclusive\n          probe: \"! docker inspect <project>-verify-$$\
  \ -f '{{range.Mounts}}{{.RW}}{{end}}' | grep -q true\"\n        caches: # the unused-class\
  \ probe is the one that FINDS such a resource\n        - domain: none\n        \
  \  mode: exclusive\n          probe: \"test -z \\\"$(find. -name '.cache' -o -name\
  \ 'node_modules/.cache' -print -quit)\\\"\"\n        locks:\n        - domain: none\n\
  \          mode: exclusive\n          probe: \"test -z \\\"$(find /tmp -maxdepth\
  \ 1 -name '<project>-*.lock' -print -quit)\\\"\"\n        shared_sinks:\n      \
  \  - domain: \"events.jsonl\" # named INDIVIDUALLY (rule 5.1)\n          mode: shared-synchronized\n\
  \          sync: \"bin/yitc-v2 event — the governed append-only + union-merged write\
  \ path\"\n          probe: \"! git log -p --since=30.days -- events.jsonl | grep\
  \ -q '^+.*\\\"hand_appended\\\"'\"\n\n**THE ANTI-EXAMPLE — the failing input this\
  \ contract exists for.** Two layers declare independence\nbecause their ports, compose\
  \ projects and databases all differ, and both rewrite one build cache. Read\nas\
  \ EVIDENCE — the bare-assertion reading rule 1 removes — that pair looked safe:\
  \ every stated fact was\ntrue. Under this contract the kernel derives NO eligibility\
  \ for it, and the refusal is locatable —\n`caches` is either OMITTED by both (rule\
  \ 3: an omitted class reads as conflict) or DECLARED by both\nwith domains resolving\
  \ to the same cache (rule 3's last clause). The class that catches it, `caches`,\n\
  is one neither of the three demoted evidence examples reaches. The declaration does\
  \ not have to be\nclever to catch this; it only has to be complete, which is what\
  \ rule 3 enforces. The project may still\nname that pair in `independent_layers:`\
  \ on its own judgement (rule 1), and the shared cache is then a\ncost its own verify\
  \ bears; what this contract contributes is that walking `caches` FIRST would have\n\
  shown it.\n\n### 8. What this contract does NOT do\nIt does not run any layer concurrently,\
  \ does not admit anything to a concurrent lane, and adds no\nkernel reader, gate,\
  \ event, store, section or concern. **Nothing reads `owns:`.** The concurrency that\n\
  exists today is SPEC-0152 rule 16's `independent_layers:`, honoured on the project's\
  \ own declared risk\njudgement (rule 1) and on nothing derived from this contract.\
  \ A kernel admission mechanism that\nCONSUMES `owns:` declarations is not built,\
  \ and no part of one is authorized here. A project changes\nnothing today: `owns:`\
  \ is optional and its absence is the current behaviour, and a project already\n\
  declaring `independent_layers:` is compliant and unaffected.\n\n## Parameters\n\n\
  None consumed. The serial lane's two bounds (`YITC_LOAD_SENSITIVE_SHARE_PCT`,\n\
  `YITC_LOAD_SENSITIVE_MAX_FILES`) are SPEC-0132 §3's and are referenced, never duplicated\
  \ here.\n\n## Rationale\n\nThe real incident behind the ownership contract is the\
  \ external consult recorded at\n`decisions/parallel-layer-timeout-consult-audit-adhoc.yaml`\
  \ (RED, 2026-09-14), whose finding 3\n(`false-attestation`, high) named the defect\
  \ precisely — \"a bare independence declaration is a false\nattestation because\
  \ ports, Compose names, and databases are evidence examples rather than a closed\n\
  resource contract\" — with the failing input rule 7's anti-example reproduces, and\
  \ whose Q3 named the\nremedy rules 2-6 implement: a falsifiable resource-ownership\
  \ and conflict declaration with probes,\nsynchronized sinks allowlisted, everything\
  \ else isolated or placed in the existing serial lane.\n\nThe seven classes are\
  \ that finding's own enumeration, adopted as a closed set rather than re-derived.\n\
  The per-layer sub-field shape is the established idiom of SPEC-0152 rule 16's `covers:`\
  \ / `boundary:` /\n`subject_globs:` — optional, opt-in, shape-checked, value-blind,\
  \ fail-closed on malformation — extended\nrather than paralleled (CHARTER §P1 F1/F2).\
  \ What the contract REMOVES is named in rule 1 (F3): the bare\nindependence claim\
  \ ceases to be EVIDENCE, and three pieces of evidence prose lose their standing\
  \ as a\nsufficient answer.\n\nWHY THE STANDING OF `independent_layers:` IS THE PROJECT'S\
  \ — the one change this spec makes to its\npredecessor. SPEC-0152 rule 16 offered\
  \ the key and the land runner honoured it, while <workshop-spec> rule 1\nforbade\
  \ every assertion carrier and rule 3 made a layer without `owns:` ineligible: two\
  \ active specs\nanswering one question differently (CHARTER §P7), and a consumer\
  \ could not tell which one held.\n**Recorded: the external consult (`decisions/independent-layers-vs-spec0207-audit-adhoc.yaml`,\
  \ RED,\n2026-10-04) advised retiring the key and running every layer serially until\
  \ an ownership-based\nadmission reader exists, and the owner DECLINED (2026-10-04).**\
  \ The owner declined on the grounds that\nthe project decides and bears the risk:\
  \ a wrong declaration costs only the declaring project's own\nverify; the declaration\
  \ is attributable, reviewable and reversible in the project's own contract; and\n\
  suspending it would take a measured wall-clock saving from projects already declaring\
  \ the key on the\nstrength of a failure nobody has measured. The kernel validating\
  \ shape while the project owns the\njudgement is the division of responsibility\
  \ SPEC-0152 rule 16 already states for\n`combined_candidate_safe` and `layer_worker_shares:`,\
  \ applied to this key rather than invented for it.\n\n## Verification\n\n- **VP1\
  \ (shape + fail-closed default):** `tests/test_spec0207_resource_ownership.py` asserts\
  \ all\n  SEVEN classes of rule 2 are addressable in this body, and that the reference\
  \ admissibility predicate\n  returns REFUSE for an absent `owns:`, for an omitted\
  \ class, and for a malformed entry — i.e. that the\n  default for an undeclared\
  \ resource, under kernel derivation, is refusal, not permission.\n- **VP2 (falsifiability):**\
  \ the same self-test asserts a probe-less boundary entry is refused, and\n  EXECUTES\
  \ rule 7's worked-example probe against a compliant fixture (passes) and a violating\
  \ fixture\n  (FAILS) — the probe is demonstrated to fail when the boundary is violated,\
  \ not merely required in prose.\n- **VP3 (bounded allowlist):** the self-test asserts\
  \ an individually-named synchronized sink with\n  a named `sync:` is admitted, while\
  \ a glob / wildcard / bare `all` / empty sink name is REFUSED, and a\n  shared sink\
  \ with no `sync:` is refused.\n- **VP4 (delivery, not dangling):** SPEC-0152 rule\
  \ 16's body names the `owns:` sub-field and the\n  `independent_layers:` standing\
  \ and resolves both to THIS spec's id, so a reader of the authoritative\n  `verify:`\
  \ schema surface is routed to this contract; asserted by the self-test so the pointer\
  \ cannot\n  silently rot.\n- **VP5 (the standing of `independent_layers:`, rule\
  \ 1):** the self-test asserts that rule 1's OWN\n  section names the key and states\
  \ that it is the project's own declared risk judgement, that the\n  kernel checks\
  \ its SHAPE ONLY, and that `owns:` is an OPTIONAL AID, not an admission gate; and\
  \ that\n  every rule section speaking of eligibility, admissibility or an accepted\
  \ risk names the exception.\n  DIFFERENTIAL: the same predicate over the superseded\
  \ predecessor's body reports its rules 1 and 3 —\n  the text this spec replaces\
  \ is the input that fails.\n- **VP6 (the standing reaches the project):** the generated\
  \ born stanza for `independent_layers`\n  says that the project decides and names\
  \ every resource class of rule 2 — the class set DERIVED from\n  rule 2's table,\
  \ so a class added or renamed there fails the check until the stanza follows.\n\
  - **VP7 (lineage — exactly one active head):** this spec carries `supersedes: <workshop-spec>`,\
  \ and exactly\n  ONE of the pair is `active` at any time (this one `proposed` +\
  \ <workshop-spec> `active` before activation;\n  this one `active` + <workshop-spec>\
