body: "## Implementation notes\n\nNotes for the maintainer of the code, moved word\
  \ for word out of the rule text of the section\neach names.\n\n- From «Delivery\
  \ wiring»: (availability — `bin/yitc-v2#_filing_reference_howto`, printed by\n \
  \ `cmd_session_start`, generated from the Filing stage bundle)\n- From «Delivery\
  \ wiring»: (`cmd_task_file` calls `_require_reads(\"stage\", {stage: Filing})`)\n\
  - From «Registry line 1»: `_declared_surface_preview` PROJECTS that rule at filing\
  \ time by injecting\n  the not-yet-indexed card's declared surface into an index\
  \ copy.\n- From «Under-citation preview»: (`_print_undercitation_preview`, one member\
  \ of the registry above)\n- From «Triage delivery»: The read-gate's credit path\
  \ `_fetched_spec_ids` keys ONLY on\n  `data.node_id` (verb-agnostic — bin/lib/gates.py),\
  \ so the receipt credits the gate through the\n  EXISTING path with no reducer change,\
  \ no new event type, no new gate (CHARTER §P1; the same\n  delivery-credit idiom\
  \ the journal recovery-rescan already uses).\n\n### Moved from the rule text\n\n\
  Reference and maintainer passages moved word for word out of the rule text of the\
  \ section\neach names; no rule an acting reader applies moved with them.\n\nFrom\
  \ «Replacement map»:\n\n### Replacement map (what this spec owns vs what it must\
  \ NOT duplicate — D2, P5 one-home)\n- **OWNS:** the authoring DOCTRINE (what a good\
  \ card front-loads) + the skeleton-prompt intent.\n- **Does NOT own (pointers only):**\
  \ SPEC-0028 stays the field-catalog/schema; SPEC-0046 stays\n  decomposition/cutting;\
  \ CHARTER §P3/§P8 stays done=adopted + infra-adoption. Any overlapping\n  AUTHORING\
  \ prose in those homes is deleted/pointerized into this one on activation.\n\nFrom\
  \ «Delivery wiring»:\n\nPer SPEC-0059's Filing carve-out: the doctrine is delivered\
  \ as a session-start REFERENCE pointer, and the `task file` work-verb CHECKS it\
  \ was read before writing the\ncard. `task file --skeleton`\nemits the fillable\
  \ skeleton (`_emit_task_skeleton`, reusing `tasks/_template.yaml`). `binding:`\n\
  (stage-entry:Filing) / `implements:` are finalized above. No new read verb is added\
  \ (the existing\n`_require_reads` lever, SPEC-0050).\n\nFrom «Delivery wiring —\
  \ the advisory line registry»:\n\n**The task-file advisory line REGISTRY — what\
  \ `task file` prints, and who owns each line.**\nA DELIVERY REGISTRY, not a rule\
  \ family: it records WHICH advisory lines `cmd_task_file` prints and\nWHERE each\
  \ line's semantics are homed. It deliberately does NOT claim this spec owns all\
  \ of them —\nthe thirteen lines answer different questions and keep different homes.\
  \ The blanket reading\n\"filing previews → SPEC-0044\" is contradicted by this split,\
  \ as is any reading that SPEC-0060 owns\nthe whole family.\n\n| # | enumerated key\
  \ (line prefix) | anchor (`bin/lib/task.py`) | shipped | semantics homed in |\n\
  |---|---|---|---|---|\n| 1 | `preview (advisory — claim-moment screen re-checks):\
  \ <SAFE\\|WAIT\\|CLASH\\|CLAIMED>` | `_declared_surface_preview` | | **SPEC-0044\
  \ §2.2** (pointer — see below) |\n| 2 | `sibling-task overlap (advisory — filing\
  \ not blocked)` | `_print_sibling_task_overlap` | | this spec |\n| 3 | `followup\
  \ overlap (advisory — filing not blocked)` | `_print_followup_overlap` | | this\
  \ spec |\n| 4 | `deviation overlap (advisory — filing not blocked)` | `_print_capture_overlap`\
  \ | | this spec |\n| 5 | `cross-item overlap (advisory — filing not blocked)` |\
  \ `_print_cross_overlap` | | this spec |\n| 6 | `under-citation preview (advisory\
  \ — filing not blocked)` | `_print_undercitation_preview` | | this spec (detailed\
  \ below) |\n| 7 | `in-flight intent overlap (advisory — not blocked)` | `_print_inflight_intent_overlap`\
  \ | | this spec |\n| 8 | `already-linked (advisory — filing not blocked)` | the\
  \ `_auto_cross_pick_for_file` call-site | | **SPEC-0086** (the intake-hygiene rule\
  \ — pointer) |\n| 9 | `AC test/waive status (advisory — filing not blocked)` | `_print_ac_test_waive_status`\
  \ (its `AC waive fields (advisory — filing not blocked)` block) | | this spec (item\
  \ 4 — each AC names a test or an explicit waive); the waive form is **SPEC-0165\
  \ item 4** (pointer) |\n| 10 | `stranded-filing (advisory — filing NOT blocked)`\
  \ | `_print_stranded_filing_advisory` | | **AGENTS-SESSIONS §Writes happen in a\
  \ worktree** (pointer — the filing-is-not-executing hand-off) |\n| 11 | `AC measured-bound\
  \ status (advisory — filing not blocked)` | `_print_ac_measured_bound_status` —\
  \ fired at BOTH authoring seams: `task file` (via `_print_ac_test_waive_status`)\
  \ and the `task update --old/--new` field-edit that changes `acceptance` | | this\
  \ spec (item 4 — the Measured-bound cue: a missing-named-reference heuristic serving\
  \ the qualitative-outcome rule; a named measurement legalizes no bound) |\n| 12\
  \ | `non-active spec cited (advisory — filing not blocked)` | `_print_premise_advisory`\
  \ — fired at BOTH authoring seams: `task file` (off the grafted index) and the `task\
  \ update --old/--new` field-edit that changes `scope` or `acceptance` (off the committed\
  \ `graph/index.json`) | | this spec (item 3 — the premise-verify cue's mechanical\
  \ floor: a cited or scope/acceptance-named spec whose index status is `retired\\\
  |withdrawn\\|rejected` is a premise fault, only `active` governs — <workshop-spec>;\
  \ a `superseded` one is reported as information naming its superseder and pointing\
  \ at the point-lookup for the active head, a reference to it may stay) |\n| 13 |\
  \ `retired flag named (advisory — filing not blocked)` | `_print_premise_advisory`\
  \ (same printer, same two seams as row 12) | | **SPEC-1039 rule 6** (pointer — the\
  \ retirement authority); the flag SET is read in place off the ONE carrier `bin/lib/audit.py#RETIRED_AUDIT_FLAGS`\
  \ that the pre-parse shim and graph conformance's `retired-audit-flags` probe read,\
  \ matched by that probe's own whole-token matcher — never a second list |\n\nFrom\
  \ «Registry line 1»:\n\n**Line 1 is a POINTER, never restated here (P5).** Its collision/lineage\
  \ semantics — the spec-lineage\nand code-surface altitudes, the SAFE/WAIT/CLASH/CLAIMED\
  \ verdicts, the release predicate — are\n**SPEC-0044 §2.2's** (parallel dispatch\
  \ selection); This spec\nrecords only that the line is DELIVERED at filing. To change\
  \ what the verdict MEANS, edit SPEC-0044,\nnot this registry. Lines 2-7 and 9 are\
  \ this spec's own concern (line 10 is a POINTER, like 1 and 8 — its hand-off rule\
  \ is the handbook's): they answer \"does this work already\nexist somewhere?\" (2-5,\
  \ 7), \"does the card cite the rules governing what it declares?\" (6), and \"does\n\
  each AC name a test or an explicit waive?\" (9) — authoring questions, not dispatch-collision\n\
  questions. Within the related-input family, 2-5 read only LANDED /\nindex / journal\
  \ state; **line 7 alone reads OTHER LIVE SESSIONS' un-landed worktree intents**\
  \ — the\ngap that let two controllers build duplicates of one owner concern in a\
  \ day.\n\nFrom «Registry line 2 — the shipped group's bounds»:\n\n**The shipped\
  \ group's two bounds ARE the rule, and they are stated so a reader knows what the\n\
  silence means.** The done log grows with the work, so an unbounded widening would\
  \ flood every filing\nand train the reader to skim. The bounds, each sized against\
  \ the live corpus:\n- **RECENCY** — closed within `SHIPPED_OVERLAP_WINDOW_DAYS`.\n\
  - **TITLE ONLY** — the PATH signal is deliberately NOT applied to shipped work (nor\
  \ is the shipped\n  card's `expected_touch` folded into the match text), unlike\
  \ the live group where it is sound over\n  a small pool. Against the done log the\
  \ path signal alone matches every card that touches a hot\n  file, in the hundreds.\
  \ This is the decisive precision lever, and it is why the quorum stays at\n  `FOLLOWUP_OVERLAP_SHARED_MIN`\
  \ — raising the quorum instead would have silenced BOTH recorded\n  duplicate-filing\
  \ incidents (2 shared tokens each).\nSo **work shipped longer ago than the window,\
  \ or overlapping only on a file surface, is OUTSIDE this\nline BY DESIGN** — the\
  \ emitter prints that bound beneath the group rather than letting silence read\n\
  as \"nothing like this has ever shipped\". A terminal card carrying no parseable\
  \ `closed_at` is\nlikewise out of the window (fail-quiet on the noise side, the\
  \ registry's shared posture).\n\nFrom «Registry line 2»:\n\n**This line detects,\
  \ it never decides, and it never blocks** — the registry's shared character below\n\
  applies unchanged. NOT added alongside it: any rule obliging the reader to read\
  \ these lines.\n\nFrom «Registry — shared character»:\n\n**Shared character of every\
  \ line in the registry (stated once).** Each is printed AFTER the id is\nallocated\
  \ and the YAML written, so **none can alter a filing**; each is report-not-block\
  \ (CHARTER\nnon-goal #2/#7), fail-open inside its own `try` (an index/journal/cross-fold\
  \ error suppresses the\nadvisory, never breaks a completed filing), emits **no event**,\
  \ and leaves the exit code unchanged.\nTogether they add **no gate, no card-completeness\
  \ validator, and no new store**, and they ride the\nONE grafted index the surface\
  \ preview already builds (no second build). The registry is NOT a\nsecond home for\
  \ SPEC-0044's selection rule and NOT a filing gate.\n\nFrom «Registry — prose by\
  \ decision»:\n\n**The registry table is PROSE by decision — do NOT \"fix\" the missing\
  \ anchors.** The listed\nhelpers above are deliberately absent from every spec's\
  \ `implements:` (this spec's and SPEC-0044's).\nRead that as INTENDED, not as an\
  \ oversight to tidy: region-drift on a helper is a poor proxy for what\nthis table\
  \ records (each line's KEY), so it would fire on every internal refactor while the\
  \ key is\nuntouched — the E-0019 broad-anchor false-positive class (SPEC-0006).\
  \ **Re-open only on the named\nreturn trigger:** an OBSERVED divergence between\
  \ this table and what `cmd_task_file` actually prints — EITHER a row's enumerated\
  \ key no longer matching the printed\nstring, OR a printed advisory line having\
  \ NO row here at all. Fix is a key-string assertion in the pinned suite, not eight\
  \ signature\nbaselines.\n\nFrom «Under-citation preview»:\n\n**Under-citation filing\
  \ preview — line 6, a report-only DELIVERY surface for item-6's cite\ndiscipline.**\
  \ `cmd_task_file`, after allocating the id and writing the card, prints a filing-preview\n\
  advisory: for each CONCRETE\n`expected_touch` anchor (an existing regular repo file,\n\
  never a broad directory or a generated/derived `graph/`·`release-view/` path — the\
  \ noise bound), it\nresolves via the graph's `code_to_specs` reverse index to the\
  \ ACTIVE specs whose own `implements`\nanchor GOVERNS that surface (symbol-aware,\
  \ so a spec on an unrelated symbol in the same file is not\nnamed) and names any\
  \ such spec the card does NOT `cite`. It surfaces the unread-governing-rule gap\
  \ at\nFILING, one dispatch cycle before an Analysis/audit would. HONEST FRAMING:\
  \ the WARN states it\ndetects UNDER-CITATION, NOT a\ncontradiction, and does NOT\
  \ prove the card conflicts with the named specs — citing a named spec\nsilences\
  \ the line, and a deliberate non-cite is acked via `task update --note`. It carries\
  \ the\nregistry's shared character stated above (report-not-block, fail-open, no\
  \ event, exit unchanged —\nCHARTER non-goal #2/#7; no gate, no card-completeness\
  \ validator, no new store; it rides the ONE\ngrafted index the line-1 surface preview\
  \ already builds, no second build). Additive extension of the\nFiling delivery (<workshop-spec>\
  \ rule 7); the cite discipline itself stays normative in item 6 above\n(cue+pointer).\n\
  \nFrom «Triage delivery»:\n\n**Triage/revizia-entry delivery — a SECOND delivery\
  \ surface for the SAME doctrine.**\nA revizia/triage scan (`bin/lib/triage.py#cmd_triage_run`)\
  \ is the moment whose expected OUTPUT is\nfiling (the promote-to-fix-task route),\
  \ but it enters NO task Filing stage — so a `task file`\nmid-batch would surprise-refuse\
  \ on the `_require_reads(stage=Filing)` gate even after the handbook\nseed was read.\
  \ So the triage SCAN entry DELIVERS this doctrine, symmetric with the Filing\nstage-entry,\
  \ by emitting an HONEST node_id-bearing delivery-RECEIPT: a `cli_invoked` event\
  \ carrying\n`verb: \"triage run\"` (deliberately NOT `\"graph query\"`, so a journal\
  \ consumer never mistakes it for\na real interactive fetch) + `node_id: SPEC-0060`\
  \ + an explicit `delivery` marker.\n\nFrom «Anti-complexity note»:\n\n### Anti-complexity\
  \ note (<workshop-spec> §7 / CHARTER §P1)\nReuses the existing `task file` verb\
  \ + the `_template.yaml` skeleton + the `_require_reads` lever\n(SPEC-0050) — no\
  \ new gate, no new store, no card-completeness validator.\n\n## Verification\n\n\
  Behavioral (primary):\n- `task file` checks the task-authoring doctrine was read\
  \ (current session) before writing the card,\n  and REFUSES when unread (the SPEC-0059\
  \ Filing CHECK leg; emits `read_gate_refused`);\n- a card filed via `task file`\
  \ carries the front-loaded fields (scope + acceptance-with-probe), seeded\n  by\
  \ the skeleton prompts.\nStructural (secondary): no schema rule or decomposition\
  \ rule is restated here — each resolves to its\nowner (SPEC-0028 / SPEC-0046) by\
  \ pointer.\n\n## Drift review\n\nThis body has been AMENDED in place nine times\
  \ (each an <workshop-spec> rule 7 additive extension, none a\nsupersession): the\
  \ item-4 audit-post-verifiability sub-clause; the X-0419 cohort-complement and\n\
  cited-desired-exclusion cues; the evidence-availability cue and its two limbs; the\
  \ durable-field\ncue; the born-armed-carrier cue; the qualitative-outcome rule with\
  \ the Measured-bound cue re-scoped\nbeneath it; plus two re-verifications of the\
  \ `implements:` anchors after unrelated drift. Every\namendment was an AUTHORING\
  \ PROMPT: none added a gate, an event, a store or a card-completeness\nvalidator,\
  \ and none changed what an already-compliant criterion had to do. The dated entries,\
  \ their\nmeasured grounds and the per-amendment CHARTER §P1 weighing are in git\
  \ history for this file and in\nthe cited proposing plan — not restated here (<workshop-spec>\
  \ rule 3 / rule 8).\n\nONE amendment ships a test, and it is the only one that could:\
  \ the limb-(a) example land-tie\nphrasings are literal strings a live matcher must\
  \ keep accepting, so\n`tests/test_land_emitted_cue_examples_match_the_matcher.py`\
  \ asserts each of them against\n`bin/lib/audit.py#land_emitted_named_evidence` —\
  \ RED if an example is edited to a non-matching\nphrasing, RED if the matcher is\
  \ narrowed away from an example. Every other cue quotes no\nmatcher-bound string,\
  \ so a test there would assert prose against itself.\n"
