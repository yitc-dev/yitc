id: SPEC-1012
title: Triage currency — temporal recurs on the fix's land time (capture-after-land)
  + remedy verdict carriers + fuzzy Section-A dedup
status: active
created_at: 2026-10-07 21:43:21+00:00
travels: null
consumed: false
implements:
- bin/lib/triage.py#_currency_status
- bin/lib/triage.py#cmd_triage_run
- bin/lib/triage.py#_owner_landed_at
- bin/lib/triage.py#cmd_triage_remedy
- bin/lib/triage.py#_remedy_sweep_index
body: "## Scenario\n\nAfter a fix-task closes a defect, a later triage run must NOT\
  \ re-offer that already-fixed problem\nas into-work — unless the problem genuinely\
  \ came back. The owner sees: \"we ran triage, fixed it,\nran triage again — and\
  \ the old item does not resurface as a duplicate\", while a real regression DOES\
  \ surface.\nA capture made after the fix-task was closed but before its fix reached\
  \ the integration branch is\nstill the old problem, not a regression.\n\n## Internal\n\
  \nSupersedes <workshop-spec>: R-A's comparison boundary is restated on the fix's\
  \ land time;\nR-D, R-E and R-C are carried over with their meaning unchanged. Where\
  \ the predecessor spelled\nout a command line or a record layout, this text states\
  \ the rule only: the concrete forms live\nwith the code the `implements:` anchors\
  \ name.\nExtends <workshop-spec> — the into-work currency classifier (`_currency_status`;\
  \ the route table + 5\ncurrency tokens + recurs, carved out of SPEC-0056 §1(5)/§5).\
  \ Four rules (R-A/R-D/R-E/R-C):\n\n### R-A. Temporal recurrence (capture-after-land)\n\
  For a fingerprint OWNED by a `done`/`Final` fix-task (LINK-RULE owner, SPEC-0055/<workshop-spec>),\n\
  `recurs` is TRUE **only if at least one capture's timestamp is strictly AFTER the\
  \ owning fix-task's\nFIX BOUNDARY** (the recurrence post-dates the fix). An all-time\
  \ capture count ≥ 2 is **NOT** by\nitself recurrence: captures at or before the\
  \ owner's fix boundary are the SAME incident (caught\nwhile the fix was being built\
  \ or was waiting to land), not a regression.\n\n**The fix boundary of a done fix-task\
  \ is the time its fix reached the integration branch: the\nlatest successful land\
  \ of the task's own branch.** A task's `closed_at` is written in its\nworktree BEFORE\
  \ that land, and the land can follow hours later; until it does, every other\nsession\
  \ still runs the code without the fix, so a capture made in that interval is the\
  \ same\nincident. `closed_at` remains the boundary wherever that land time does\
  \ not apply: the journal\nholds no readable record of a successful land of the task's\
  \ own branch (an aborted land landed\nnothing; a record that states no outcome is\
  \ not a success; a card closed inside a work batch\nreaches the integration branch\
  \ on the batch's branch, not its own; and a record or a `closed_at`\nwhose time\
  \ is not a well-formed whole-second UTC instant is never compared), or the latest\
  \ such\nland is not later than `closed_at` (a land that precedes the closure carried\
  \ bookkeeping, not the\nfix). Like the landed-root-fix date below, the land time\
  \ is an UPPER bound on when the fix took\neffect.\n- done/Final owner + a capture\
  \ after its fix boundary ⇒ **REGRESSED** (into-work).\n- done/Final owner + only\
  \ captures at or before its fix boundary ⇒ **ALREADY-FIXED** (NOT\n  into-work)\
  \ — a capture after `closed_at` and before the land included.\n- NO done/Final owner\
  \ (no boundary to compare) ⇒ the prior count-based signal is UNCHANGED\n  (a no-owner\
  \ fp recurring N≥2 stays a promotion candidate). Multiple owners: the LATEST\n \
  \ fix boundary among done/Final owners is the comparison boundary. **Case-id-cited\
  \ fix-task (E-0036):** when a `resolved` case-file names the task that fixed it\
  \ and that done fix-task cites the CASE-ID (not the fingerprint), the fix-task is\
  \ ABSENT from the fingerprint's cites-owners; resolve it as a done LINK-RULE owner\
  \ so its fix boundary IS the comparison boundary — else all-pre-fix captures read\
  \ a false REGRESSED instead of ALREADY-FIXED (realised in `_resolved_case_fix_owner`).\
  \ **Landed-root-fix case, no fix-task :** a case\n  resolved as a landed root fix\
  \ records that kind of resolution, with the root fix described\n  as PROSE and NO\
  \ fix-task at all, so the E-0036 clause above can never resolve it and every capture\
  \ —\n  including ones long predating the fix — fell through to a false REGRESSED\
  \ (measured 2026-08-30: half\n  of one run's 8 REGRESSED verdicts were false, all\
  \ of this one shape; E-0058 reported 83x REGRESSED\n  with its last capture 16 days\
  \ BEFORE its fix landed). Such a case carries no date anywhere in its\n  YAML, so\
  \ its boundary is the timestamp of its own `error_resolved` journal row — the datable\
  \ instant the\n  landing was attested (the same carrier choice `_case_closure_index`\
  \ makes: the closure instant is the\n  event's own ts). That is an UPPER bound on\
  \ the landing, which is the same direction this rule already\n  takes for a task\
  \ boundary. Resolve it as a done LINK-RULE owner keyed by the CASE id so this same\n\
  \  comparison engages. **And where NEITHER shape resolves, the verdict SAYS SO:**\
  \ a `resolved` case with\n  no done fix-task and no datable landed root fix has\
  \ no boundary at all, so `recurs` has fallen back to\n  the bare all-time count\
  \ and carries no information about the fix — the row is rendered\n  `boundary-unresolvable`\
  \ (NOT into-work, and explicitly neither REGRESSED nor ALREADY-FIXED) naming the\n\
  \  missing fact, never silently defaulted to either label. No sixth currency token:\
  \ an unresolvable case\n  reads OWNED-IN-FLIGHT, which is already this branch's\
  \ non-recurring verdict. **Unlinked-mention\nboundary — a SECOND, WEAKER, EXPLICITLY-LABELLED\
  \ source, never a linkage source:** the\ntwo clauses above both resolve a carrier\
  \ that is off the `cites:` index but still *asserted* by an\nauthor. A third shape\
  \ is not asserted at all — an artifact NAMES the fingerprint in BODY TEXT and\n\
  does not carry it in `cites:`, so the LINK RULE cannot see it (detected report-only,\n\
  which read the mentioning cards and confirmed the cites-EXCLUSIVE linkage rule of\
  \ <workshop-spec>\nCORRECT as written). Such a row therefore has no owner and no\
  \ boundary, and falls to the\nno-done-owner leg above: a bare TRULY-NEW, whatever\
  \ the truth. Measured over all 182 recurring\nrows of the 2026-08-30 read: 32 rows\
  \ carried the advisory — 22 (54 occurrences) were — by TIMING only — presumed\n\
  ALREADY-FIXED and rendered as brand-new work, and 6 (22 occurrences) were POST-CLOSURE\n\
  recurrences hidden as fresh ideas; 4 had no done mentioning card, 0 were undetermined.\
  \ So a\nmentioning card that is `done` AND carries a datable boundary is resolved\
  \ as a done LINK-RULE\nowner, engaging this SAME comparison with no new comparator\
  \ (realised in\n`_mention_derived_boundary_owners`) — since the third narrowing\
  \ below, to TIME the captures only,\nnever to decide the verdict. **This does NOT\
  \ redefine ownership and does NOT link\nanything** — <workshop-spec> is untouched\
  \ — and it is bounded by two FAIL-CLOSED gates: it fires ONLY\nwhere there is no\
  \ cites-owner and no case file (a cites-derived or case-file verdict is never\n\
  displaced, so a mention can fill a vacuum but never overrule evidence), and ONLY\
  \ a `done`\nmentioning card with a datable boundary contributes (an OPEN one yields\
  \ nothing — promoting prose\ninto an OWNED-IN-FLIGHT verdict would assert live ownership\
  \ off a body mention, exactly the claim\n<workshop-spec> forbids). **The boundary\
  \ is always SHOWN, never merged with a citation:** the\nunlinked-mention advisory\
  \ fires whenever a mention supplied a boundary, naming the cards and\nstating the\
  \ timing, so a mention-sourced reading stays distinguishable from a cites-derived\
  \ one\n( first did this with a MENTION-DERIVED verdict mark, retired by the third\
  \ narrowing). No\nsixth currency token. **And the LATEST-boundary rule above is\n\
  load-bearing HERE specifically, because it INVERTS the reading:** measured on\n\
  `worktree-sweep-permission-impossible-residue` (12 occurrences), read against two\
  \ of its three\nmentioning cards (closed 2026-08-10) its 2026-08-21 capture POST-DATES\
  \ the boundary, while against\nall three — latest closed 2026-08-30 — the SAME capture\
  \ PREDATES it (under that was\nREGRESSED vs ALREADY-FIXED; since the narrowings\
  \ below it is the timing note either way). The rule is therefore\nheld by REUSING\
  \ the existing latest-over-done-owners comparator, never by a second expression\n\
  that could drift from it.\n**Two narrowings (shipped by its re-cut) — a mention\
  \ never ASSERTS a regression,\nand an emitter or subject dates nothing:** (i) a\
  \ mentioning card that is this fingerprint's EMITTER (its own commits\nintroduced\
  \ the fingerprint as a string literal in the engine's code — a whole string token,\
  \ never a\ncomment or docstring) or its SUBJECT (a capture of the fingerprint names\
  \ the card as what it\nrelates to, or as its task) contributes NO boundary in either\
  \ direction: it names the fingerprint because it emits\nit or is what the capture\
  \ is about, not because it fixed anything (`_mention_non_fixers`, fed by\n`_fingerprint_emitter_index`);\
  \ (ii) a recurrence past a remaining mention-derived boundary reads the\nNO-OWNER\
  \ verdict (TRULY-NEW, or ALREADY-BUILT via the remedy gate — still into-work) carrying\
  \ a\nNOT-REGRESSED note, never REGRESSED — only a `cites:` link says a card FIXED\
  \ a fingerprint, so only\na cites-derived boundary may assert a regression (`_currency_status`).\
  \ Measured 2026-09-23: all\nthree mention-derived REGRESSED rows of that window\
  \ were false (emitters and,\nsubject) — the `worktree-sweep-permission-impossible-residue`\
  \ REGRESSED reading above\nincluded, its earlier boundary being its emitter. The\
  \ LATEST-boundary rule is unchanged for every\nother mentioning card; the suppression\
  \ leg left open is closed by the third narrowing.\n**Third narrowing — a mention\
  \ decides NO verdict in either direction.** A card names a\nfingerprint because\
  \ it fixed it, emitted it, is its subject, discusses it, or scopes it OUT, and\n\
  only a `cites:` link says which — so a mention-derived boundary no longer SUPPRESSES\
  \ either: a row\nwhose captures all predate it reads the same NO-OWNER verdict as\
  \ (ii), carrying a NOT-ALREADY-FIXED\nnote. The boundary (still the LATEST `closed_at`,\
  \ still skipping emitters/subjects) survives only\nas a TIMING annotation on the\
  \ route and the unlinked-mention advisory. The independent evidence\nthat turns\
  \ such a row ALREADY-FIXED is a `cites:` link (the closure-time fingerprint linkage\
  \ of SPEC-0069); a\nrecorded remedy naming the card turns it ALREADY-BUILT (R-D).\
  \ Measured 2026-09-23: 24 rows read\nmention-derived ALREADY-FIXED, and some rested\
  \ on cards that DISCLAIM the fingerprint (\nscopes two OUT; calls its one \"a SEPARATE\
  \ defect... not this one\"). The\nMENTION-DERIVED verdict mark added therefore no\
  \ longer exists: no verdict rests on a mention.\nThe land-time boundary above dates\
  \ a cites-derived or case-file fix-task owner only: a\nmention-derived timing boundary\
  \ stays the mentioning card's `closed_at`, as this paragraph states.\nThis REPLACES\
  \ the bare-count `recurs = all-time count ≥ 2` for the done-owner branch (the retired\n\
  rule). The land time is read from the journal's own record of the successful land\
  \ of the task's\nbranch, and `closed_at` from the owning task YAML; both already\
  \ exist, so there is no new field,\nevent or store. The concrete form of that record\
  \ lives with its one reader (`_owner_landed_at`).\n\n### R-D. The remedy-existence\
  \ verdict has a TRIAGE-TIME carrier (X-1131)\nThe remedy-existence sub-check (<workshop-spec>\
  \ §1, the TRULY-NEW branch this spec extends) requires a\nrecorded verdict before\
  \ a TRULY-NEW candidate is promoted, and `triage run` flags every unswept row\n\
  `⚠ REMEDY-UNSWEPT`. That verdict is recorded in EITHER of TWO carriers, read together\
  \ as ONE\n3-state token:\n- **capture time** — the remedy reference the capture\
  \ itself carries, set when the deviation is\n  emitted;\n- **triage time** — the\
  \ `triage remedy` verb, which records an analog-found or a nothing-found\n  verdict\
  \ against an ALREADY-CAPTURED fingerprint (a `remedy_swept` journal row).\n\nThe\
  \ TRIAGE-TIME record **WINS** when both exist: it is the deliberate later act, made\
  \ with the\nbacklog in view. A re-sweep likewise corrects an earlier one (latest\
  \ wins). Absent a triage-time\nrecord the capture-time field stands unchanged, so\
  \ every pre- reading is preserved.\n\n**Why the second carrier is REQUIRED for the\
  \ rule to be satisfiable at all.** The sweep is by\nnature a triage-time act over\
  \ an ACCUMULATED BACKLOG, so the capture-time field is unwritable\nexactly when\
  \ the rule demands it. Measured: since shipped this classifier, ZERO capture-time\n\
  remedy references were ever written in the kernel's OR <project>'s entire journal\
  \ history — total non-adoption of\nthe write side, in both repos, while <project>'s\
  \ own backlog sweep had to record 252 verdicts as\ntyped `remedy_swept` rows the\
  \ classifier did not read.\n\n**Why a DISTINCT event type, and this is the load-bearing\
  \ constraint.** The only retroactive route\nthe capture-time field left was emitting\
  \ a SECOND capture carrying the same fingerprint — which\nbumps that fingerprint's\
  \ capture count to 2 and flips `recurs` true, converting genuinely-new singletons\
  \ into\nFABRICATED recurring promote-candidates. So the sanctioned field could not\
  \ be filled without\nfalsifying the very recurrence signal R-A above refines. `remedy_swept`\
  \ is NOT a capture event, so\nthe capture scan never sees it and the per-fingerprint\
  \ count never counts it: **recording a\nverdict changes NO recurrence count, BY\
  \ CONSTRUCTION** rather than by care.\n\nFail-closed on both axes: the fingerprint\
  \ MUST already be captured (this records a verdict ABOUT a\ncapture, never a back\
  \ door for inventing one), and EXACTLY one of the two verdicts — an analog was found,\n\
  or none was — must be given. Posture is UNCHANGED — the sweep stays AI/owner-PERFORMED\
  \ (the verb records a verdict a\nhuman reached; it never greps for an analog itself),\
  \ and the recording clears the advisory flag\nwithout gating `promote` (CHARTER\
  \ non-goal #7). Realised in `_remedy_sweep_index` /\n`_resolve_remedy` / `cmd_triage_remedy`.\n\
  \n### R-E. A remedy REFERENCE is not a remedy VERDICT — the re-test direction\n\
  An analog-found verdict records that an ARTIFACT exists. Only re-running the **ORIGINAL\
  \ FAILING INPUT**\nrecords that the **BEHAVIOUR** changed. R-D's carrier could not\
  \ tell the two apart, and a recorded\nALREADY-BUILT read identically either way\
  \ — which misled in BOTH directions, three weeks apart:\nthe 2026-08-26 sweep marked\
  \ `owner-reset-unreachable-when-consult-survivor-is-hold-for-owner`\nalready-built\
  \ off, which is message-only and says so in its own docstring (a LIVE defect\nretired\
  \ on paper); on 2026-08-31 a reporter read that same artifact, did not re-test,\
  \ and filed\nX-1210 against a defect had already fixed (a DEAD defect resurrected).\n\
  \n**WRITE side — fail-closed on a third axis.** An analog-found verdict MUST state\
  \ its re-test\ndirection, exactly one of: RE-TESTED — naming the original failing\
  \ input that was re-run and what\nit did (⇒ ALREADY-BUILT — a real clearance, with\
  \ that statement recorded) — or NOT RE-TESTED —\nnaming why that input cannot be\
  \ re-run (⇒ **REMEDY-UNSWEPT**, with the reference and the reason\nrecorded — the\
  \ artifact IS recorded and named, the candidate is NOT cleared). An analog-found\n\
  verdict stating neither is REFUSED. A nothing-found verdict is untouched: a sweep\
  \ that found\nnothing has no behaviour to re-test.\n\n**NO FOURTH REMEDY STATE IS\
  \ INVENTED.** The inability reuses the EXISTING third token, and it\nfails in the\
  \ CONSERVATIVE direction — the candidate stays flagged not-promotable rather than\
  \ being\nsilently retired on an unverified artifact. Likewise NO sixth currency\
  \ token (SPEC-0056 §5\nenumerates exactly five) and no change to into-work membership.\n\
  \n**READ side — HISTORY IS NOT REWRITTEN.** The sweep fold reads the references\
  \ and the re-test\nstatements in ONE pass over the SAME rows (latest-wins in lockstep,\
  \ no second journal pass).\nNeutralization keys on the row's OWN recorded verdict,\
  \ so every pre- row — verdict\nALREADY-BUILT, no re-test statement,\nincluding <project>'s\
  \ 252 backlogged verdicts — keeps reading exactly as it did, and R-D's AC3\nconsumer-shape\
  \ promise is intact. What makes those legacy verdicts legible is a MARK the\nclassifier\
  \ puts on the route, which ANNOTATES the ALREADY-BUILT route and reclassifies\n\
  nothing — the same annotate-never-merge move R-A's unresolvable-boundary note and\n\
  mention note already make in this classifier. A later NOT RE-TESTED row WITHDRAWS\
  \ an earlier\nclearance, so a correction can actually correct.\n\n**What was NOT\
  \ built, and why (CHARTER §P1 F1/F2/F3).** No probe runner and no per-fingerprint\n\
  repro store: the sweep is by construction an AI/owner-PERFORMED act whose only durable\
  \ residue is\na reference string, and a capture records no re-runnable input to\
  \ re-run. Building one would be\nthe behavioural detector CHARTER non-goal #7 forbids.\
  \ What is added is one optional field on an\nexisting event, one refusal direction\
  \ on an existing verb, and one mark on an existing route\nstring. Realised in `cmd_triage_remedy`\
  \ / `_remedy_sweep_index` / `_resolve_retest` /\n`_currency_status`.\n\n**Verification\
  \ (RED-GREEN, differential on PRE-FIX-COMPATIBLE input — a differential whose pre-fix\n\
  failure is the verb rejecting an option it does not know proves nothing about semantics):**\n\
  - R-E (AC2, read-side, pure data): a `remedy_swept` row whose verdict is REMEDY-UNSWEPT\
  \ and which\n  carries a reference and the reason no re-test was run renders NO\
  \ built verdict and names the\n  missing re-test. PRE-FIX the fold took ANY non-empty\
  \ reference and mapped it to ALREADY-BUILT,\n  so this FAILS on the old semantics,\
  \ with no command form involved.\n- R-E (AC2, write-side, pre-fix-VALID invocation):\
  \ an analog-found verdict given to `triage remedy`\n  with no re-test statement\
  \ — an invocation the PRE-FIX verb ACCEPTS — records no ALREADY-BUILT\n  clearance.\n\
  - R-E coverage (explicitly NOT differential, the two statements do not exist pre-fix):\
  \ NOT\n  RE-TESTED records REMEDY-UNSWEPT with the reason; RE-TESTED still records\
  \ ALREADY-BUILT.\n- R-E regression guards: a legacy ALREADY-BUILT row with no re-test\
  \ statement still reads\n  ALREADY-BUILT and not-into-work, carrying the mark; every\
  \ non-ALREADY-BUILT branch is\n  byte-identical with the mark set or unset; recurrence\
  \ counts and REMEDY-ABSENT rendering are\n  untouched.\n\n### R-C. Fuzzy Section-A\
  \ currency (cited-rollup ONLY)\nSection A (the routing window — the section that\
  \ drives «file a task?») computes `currency_status`\nusing the **cited-rollup LINK-RULE\
  \ cluster** that Section B already applies (`_capture_cluster_counts`,\nthe AUTHORITATIVE\
  \ cite-based rollup). A routing-window capture whose fingerprint is a **cited-alias\n\
  member** of an already-owned root is classified by the ROOT's owner status — NOT\
  \ as a standalone\nexact-string-miss `TRULY-NEW`. This REPLACES Section A's exact-only\
  \ fingerprint lookup for\ncurrency (the retired behaviour); the cited-rollup function\
  \ is reused, not duplicated.\n\n**Discovery stem-clustering stays out (P5/P7 one-home):**\
  \ the discovery stem-cluster\n(`_discovery_stem_clusters`) is DISCOVERY-ONLY — «a\
  \ hint, never an authority» (SPEC-0055 §Discovery\nstem-clustering, UNCHANGED).\
  \ R-C does NOT promote it to a routing/currency authority; that rule keeps\nliving\
  \ in SPEC-0055 and is not overturned from here. Only the CITED (authoritative) rollup\
  \ feeds\nSection-A currency.\n\n## Parameters\nNone consumed. The land time is read\
  \ from the journal and `closed_at` from task state; neither\nis a governing scalar.\n\
  \n## Rationale\nReal incident: duplicate fix-tasks for already-closed problems (owner-directive\
  \ 2026-06-09).\nJournal evidence at authoring: 13 of 15 cite-linked recurring fingerprints\
  \ are owned by a `done`\ntask yet read perpetual `REGRESSED` under the bare all-time\
  \ count (false into-work); Section A's\nexact-match misses near-synonym aliases\
  \ of fixed roots. Full deliberation + alternatives: the\nproposing plan `triage-dedup-against-closed-problems-temporal-deri`\
  \ (SPEC-0005 rule 3 — not here).\nThe land-time boundary answers one measured false-REGRESSED\
  \ shape: a fix-task closed\nabout two hours before its land (one aborted land in\
  \ between) dated a capture made in\nthat interval — against code that did not carry\
  \ the fix yet — as a regression.\n\n## Verification\nRED-GREEN (RED on the current\
  \ bare-count / exact-match code):\n- R-A (`tests/test_t13668_triage_land_time_boundary.py`):\
  \ fixture done-task closed at T whose own\n  branch landed successfully at L>T;\
  \ a capture at or before L — one between T and L included —\n  (and count≥2) ⇒ `ALREADY-FIXED`,\
  \ into-work=no; a capture after L ⇒ `REGRESSED`, into-work=yes.\n  The same fixture\
  \ with no successful land of its own branch, or with its latest successful land\n\
  \  not later than T, compares against T instead. DIFFERENTIAL: with the land read\
  \ withheld, the\n  capture between T and L reads `REGRESSED`.\n- R-A regression-guard:\
  \ a no-owner fingerprint recurring N≥2 still surfaces as a promotion\n  candidate\
  \ (unchanged).\n- R-D (AC1): a fixture journal carrying ONE unswept capture reads\
  \ `⚠ REMEDY-UNSWEPT`; after an\n  analog-found verdict is recorded at triage time\
  \ the flag is GONE and the row reads\n  ALREADY-BUILT (a nothing-found verdict ⇒\
  \ TRULY-NEW into-work, swept clean).\n- R-D (AC2, DIFFERENTIAL and load-bearing):\
  \ the fingerprint's capture count and `recurs` are\n  IDENTICAL across the recording,\
  \ and the fingerprint gains no Section-B row. This assertion FAILS if the carrier\
  \ is\n  ever re-implemented as a second capture — which is the falsification the\
  \ rule exists to prevent.\n- R-D (AC3): a `remedy_swept` row exactly as a consumer\
  \ had recorded it before this carrier was\n  read is consumed by the classifier\
  \ as-is, with nothing re-emitted.\n- R-C: a routing-window capture that is a cited-alias\
  \ of a `done`-owned root ⇒ shown `linked`\n  (owner status), NOT `TRULY-NEW`.\n\
  - real-data soak (trial): the ~13 false-`REGRESSED` + the unlinked-alias fingerprints\
  \ stop\n  reading into-work, while any genuine recurrence after the fix boundary\
  \ still does.\n"
