id: SPEC-0003
title: Per-session sync checkpoint files — schema, atomic write, gitignored cache
status: active
created_at: '2026-05-28'
consumed: false
implements:
- bin/lib/cli.py#SYNC_STATE_DIR
- bin/lib/journal.py#_checkpoint_path
binding:
- code-enforced
body: "## Internal\n\nJournal sync (parser/adapter materializing chat-class events\
  \ from the provider\nsession log into events.jsonl) tracks per-session progress\
  \ in a checkpoint\nfile:\n\n    journal-sync-state/<session_ref_hash>.yaml\n\nONE\
  \ writer per file: each session reads and writes ONLY its own checkpoint\n(`<session_ref_hash>`\
  \ derived from the resolved session_ref). No shared state, no\ncross-session writes\
  \ → no race condition by construction (CHARTER §Principle 5 —\nsingle writer, not\
  \ a lock).\n\nCheckpoint fields (cursor for incremental sync; exact shape finalized\
  \ by the\nadapter, kept minimal):\n- `session_ref` — the session this checkpoint\
  \ belongs to\n- `last_processed_uuid`— last source-log entry locator materialized\
  \ (monotonic cursor)\n- `updated_at` — ISO 8601 UTC of last successful sync batch\n\
  \n### Atomic write contract\n\nCheckpoint files are full-file rewrite targets (unlike\
  \ append-only events.jsonl), so\nthey are written via `write_text_atomic` (tempfile\
  \ + fsync + `os.replace`) per\npatterns/atomic-state-file-writes.md. A partial write\
  \ would corrupt the cursor for\nthe next sync; atomic rename guarantees the reader\
  \ sees either the old or the new\ncheckpoint, never a torn one.\n\n### Gitignored\
  \ cache semantics\n\n`journal-sync-state/` is machine-local cache, NOT source of\
  \ truth, and is gitignored.\nTruth = events.jsonl (governance SoT after sync) +\
  \ the source session logs. If the\ncache is lost, recovery is: re-sync from the\
  \ start + `source_ref` dedup against\nevents.jsonl skips already-materialized rows\
  \ (no duplication, no loss).\n\nThis is the ONE exception to CHARTER §Principle\
  \ 5 \"derived artifacts are committed\":\nthe checkpoint is a per-machine sync cursor,\
  \ fully reconstructible, with no\ncross-machine meaning — committing it would create\
  \ spurious diffs and merge noise.\n\n### Violations\n\nAny of:\n- Committing `journal-sync-state/`\
  \ to the repo (it is machine-local cache)\n- Treating a checkpoint as source of\
  \ truth (truth = events.jsonl + source logs)\n- Sharing one checkpoint file across\
  \ multiple sessions (breaks single-writer invariant)\n- Non-atomic checkpoint writes\
  \ (`open(\"w\")` instead of `write_text_atomic`)\n\n→ anti-complexity filter applies;\
  \ requires owner approval + a D-XXXX decision.\n\n## Rationale\n\nSingle-writer-per-file\
  \ (each session owns only its `<session_ref_hash>` checkpoint)\neliminates the cross-session\
  \ race by construction — no lock needed (CHARTER §Principle 5).\nAtomic rewrite\
  \ is required because a torn cursor write would corrupt the next sync; the\nreader\
  \ must see old-or-new, never partial. The cache is gitignored — the ONE exception\
  \ to\n«derived artifacts are committed» — because it is a per-machine sync cursor\
  \ with no\ncross-machine meaning, fully reconstructible by re-sync + source_ref\
  \ dedup; committing it\nwould create spurious diffs and merge noise.\n\n## Verification\n\
  \n- `journal-sync-state/` is listed in `.gitignore` (probe: grep).\n- Each checkpoint\
  \ file parses as strict-valid YAML.\n- Deleting the cache + re-running sync produces\
  \ no duplicate rows in events.jsonl\n  (source_ref dedup — exercised by tests).\n"
