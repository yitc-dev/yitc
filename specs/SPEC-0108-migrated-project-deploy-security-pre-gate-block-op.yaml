id: SPEC-0108
title: Migrated-project deploy security pre-gate — block open-critical, governed expiring
  waiver, fail-closed freshness
status: active
created_at: 2026-06-26 10:17:59+00:00
travels: null
consumed: false
extension: null
implements: []
body: "## Scenario\n\nA project migrated from v1 to v2 still deploys via its own `deploy.sh`,\
  \ which historically called the\nv1 platform Release Gate. That gate aborts a v2\
  \ deploy on RETIRED v1-governance (the v1 Build Gate +\nDECISIONS.md blockers) that\
  \ no longer applies — while also carrying the one check that DOES still\nmatter:\
  \ a block on open critical security findings. After migration the deploy must gate\
  \ on REAL\nsecurity, not v1 governance: the owner runs a validation deploy, the\
  \ governance noise is gone, but a\ngenuine open critical still stops the deploy,\
  \ and a known, owner-accepted risk passes only through a\nrecorded, expiring waiver\
  \ — never a silent bypass.\n\n## Internal\n\nThe deploy SECURITY pre-gate contract\
  \ for a MIGRATED (v1→v2) project whose deploy is owner-gated (not\nyet in the SPEC-0097\
  \ autonomous A/S/C1/C2 regime). It is the pre-gate the project's OWN deploy command\n\
  runs — SPEC-0094 §1 delegates the executable deploy-seam gate to the project; this\
  \ spec fixes the\nSECURITY contract that gate must honor. It does NOT replace SPEC-0098's\
  \ Class-S autonomous security\nlive-probe (a different, autonomous deploy posture).\
  \ Six rules:\n\n1. **Drop v1 governance from the v2 deploy path.** The migrated\
  \ project's deploy pre-gate MUST NOT run\n   v1-platform governance checks (the\
  \ v1 Build Gate, DECISIONS.md blockers). Those are retired v1\n   governance and\
  \ do not gate a v2 project. (Retirement — what this contract removes.)\n\n2. **Preserve\
  \ a blocking security check.** Dropping governance MUST NOT silently drop the real\
  \ security\n   check: the pre-gate MUST still BLOCK (non-zero exit) the deploy on\
  \ any OPEN critical/high security\n   finding from the project's governed security\
  \ audit.\n\n3. **Governed, expiring acceptance — NO in-code exception list.** A\
  \ specific critical finding may be\n   accepted (non-blocking) ONLY via a governed,\
  \ durable, git-TRACKED waiver source that records, per\n   finding: fingerprint\
  \ + reason + a real-date EXPIRY + a tracking task. An EXPIRED waiver no longer\n\
  \   accepts. The acceptance MUST NOT be a fingerprint list embedded in the gate\
  \ code (a second policy\n   store that drifts from the security process — CHARTER\
  \ §P5 single-source / §P1). Any open critical\n   that is neither governed-accepted\
  \ (status resolved/accepted_risk) nor an unexpired waiver — i.e. a\n   NEW finding\
  \ — still BLOCKS. The waiver source MUST NOT live in a regenerated/gitignored artifact\n\
  \   (e.g. the nightly findings report), so acceptance is durable and auditable.\n\
  \n4. **Fail-closed freshness + deterministic selection.** The gate selects its findings\
  \ report\n   DETERMINISTICALLY — an explicit input, or the newest by a stable date-contract\
  \ (the report `date:`\n   / filename `YYYY-MM-DD`), NEVER ambiguous mtime — and\
  \ FAILS CLOSED (blocks) if the report is\n   missing, unparseable, or older than\
  \ a freshness threshold. A stale or absent security report never\n   silently passes.\n\
  \n5. **Deploy-time coupling via a SHARED release token.** Where a deploy rebuilds\
  \ coupled services that\n   share one image (e.g. a backend image shared by celery\
  \ worker/beat), the post-deploy gate MUST\n   assert co-deployment via a SHARED\
  \ release label/version stamped on every coupled image AT BUILD and\n   verify the\
  \ running containers carry the SAME token — NOT a brittle build-timestamp proximity\
  \ proxy\n   (which can both false-pass and false-fail).\n\n6. **The pre-gate must\
  \ be invoked by the deploy path it guards.** The project's deploy command MUST\n\
  \   route its pre-deploy gate to THIS security gate (not the retired v1 gate); the\
  \ wiring is verifiable\n   repo-locally (the resolved pre-gate command), without\
  \ depending on any external absolute path.\n\n## Rationale\n\nReal incident: the\
  \ validation deploy of <project> was BLOCKED by the v1 Release Gate's\nBuild-Gate\
  \ + DECISIONS governance branches (23 retired blockers) plus 2 open criticals —\
  \ governance\nnoise on a v2 project. Audit-pre flagged THREE times (incl. an owner-reset\
  \ pass) that wiring a v2\nsecurity gate + a finding-acceptance store without a governing\
  \ contract is an ungoverned new mechanism\n(CHARTER §P1 «when NOT to add a mechanism»).\
  \ This spec is that governing contract.\nAnti-complexity 4 filters: (1) existing\
  \ analog — SPEC-0094 (deploy-seam gate, §1 delegates the\nexecutable gate to the\
  \ project) + SPEC-0098 (Class-S autonomous security live-probe) are CITED; this\n\
  is a DISTINCT concern (the owner-gated pre-deploy security blocker for a migrated\
  \ project), so a new\nspec, not a parallel re-statement; (2) a standing rule that\
  \ is cited+queried needs a spec node, not a\nview; (3) RETIRES the v1 Release Gate\
  \ (Build Gate + DECISIONS) from the v2 deploy path — a named\nremoval, not pure\
  \ accretion; (4) real incident + 3× independent-auditor finding. Prior-art:\nevery\
  \ surveyed project gates the executable check at its own deploy (<project> `scripts/deploy.sh`,\n\
  <project>'s blocking gates, <project>'s post-deploy gate).\n\n## Verification\n\n\
  - A migrated project's v2 deploy over a findings report whose only open criticals\
  \ are governed-accepted\n  or unexpired-waived PASSES the pre-gate (exit 0); a report\
  \ carrying a non-accepted open critical\n  BLOCKS it (exit ≠ 0).\n- A missing /\
  \ unparseable / stale (> threshold) findings report → pre-gate FAILS CLOSED.\n-\
  \ An EXPIRED waiver → its finding blocks again.\n- The post-deploy coupling gate\
  \ PASSES when all coupled images share the release token, FAILS when one\n  is stale/empty.\n\
  - Repo-local check: the project's deploy command resolves its pre-deploy gate to\
  \ the v2 security gate,\n  not the v1 Release Gate.\n- First adoption (<project>):\
  \ bin/v2-security-gate.sh + bin/v2-security-waivers.yaml +\n  bin/smoke-test.sh\
  \ (release-label) + deploy.sh PRE_DEPLOY_GATE repoint; probed by bin/tests/test-deploy-gates.sh.\n"
