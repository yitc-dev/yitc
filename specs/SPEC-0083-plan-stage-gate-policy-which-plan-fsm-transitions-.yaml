id: SPEC-0083
title: Plan-stage gate policy — which plan-FSM transitions block on the external audit
  verdict
status: active
created_at: 2026-06-18 06:54:25+00:00
travels: null
consumed: false
implements:
- bin/lib/plan.py#cmd_plan_stage
- bin/lib/plan.py#_plan_gate_template_text
- bin/lib/plan.py#cmd_plan_check
body: "## Scenario\n\nAs a plan moves through its FSM (draft → specs → trial → accepted\
  \ → decomposition → executing →\npostcheck → realized), the transition verb (`plan\
  \ stage <NEXT>`) asks the external auditor a\nper-gate question template (homed\
  \ in THIS spec §Plan-stage question templates — re-homed from\n<workshop-spec>).\
  \ This spec answers the\nORTHOGONAL question for each gate: does a bad verdict (RED/ABORT)\
  \ HOLD the transition, or is the\nverdict merely recorded while the transition proceeds?\
  \ The owner sees ONE table: which plan\ntransitions are mandatory-blocking gates\
  \ and which are advisory.\n\n## Internal\n\nTHE PLAN-STAGE GATE POLICY. Re-homed\
  \ from <workshop-spec> §Plan-stage overlays ( stable-surface\nsplit, <workshop-spec>\
  \ §7) so the policy table has ONE home (P5). The per-gate QUESTION TEMPLATES (a\n\
  different concern — WHAT is asked, not WHETHER it blocks) followed it here in (§Plan-stage\n\
  question templates below); <workshop-spec> keeps a pointer.\n\n**Gate policy (one\
  \ contract-line per gate):**\n| Gate | Policy | Effect on transition |\n|---|---|---|\n\
  | draft shaping (P1) | ON-DEMAND | owner-invoked `plan check`; advisory |\n| draft→specs\
  \ (P2) | MANDATORY-BLOCKING | `plan stage specs` asks `gate-specs`; RED/ABORT HOLDS\
  \ the transition (status unchanged); the 2-pass audit-loop ceiling applies (ABORT\
  \ burns no pass) |\n| specs→trial (P3) | MANDATORY-BLOCKING (trial-eligible plans)\
  \ | RED/ABORT holds the transition; ceiling applies |\n| trial→accepted (P4) | MANDATORY-BLOCKING\
  \ when a trial ran | RED holds; joins the accept-gate `plan check` prompt |\n| decomposition→executing\
  \ (P5) | MANDATORY-BLOCKING (every decomposed plan) | RED/ABORT holds; a fingerprint-fresh\
  \ GREEN/YELLOW verdict required; ceiling applies (SPEC-0070 §3) |\n| terminals (partial/rejected/cancelled)\
  \ | NONE | `--reason` required by the verb; no audit |\n\nAll plan-level audits\
  \ run FULL-capability (SPEC-0034 §Audit-posture).\n\n**P2 made mandatory-blocking\
  \ — the change this spec carries.** draft→specs was\nAUTO-ADVISORY (the audit ran,\
  \ the verdict was recorded, the transition NEVER held) with the\nmandatory-vs-desirable\
  \ question left OPEN (SPEC-0034 §Audit-posture). settles it: P2 is\nMANDATORY-BLOCKING,\
  \ wired the SAME inline-blocking way as the adjacent P3 gate-trial\n(`_run_plan_gate_audit(...,\
  \ \"mandatory-blocking\", blocking=True)`). Rationale: composing the\ndraft specs\
  \ is a high-stakes design commitment; a RED draft-shaping verdict should hold the\n\
  transition, not be advisory-only — consistent with every other forward plan gate\
  \ (P3/P4/P5 all\nblock). `specs→onward` was already mandatory (P3 blocks; the `specs→accepted`\
  \ skip is gated by\nthe accept-gate `plan check`), so this aligns the one remaining\
  \ advisory forward gate.\n\n**Enforcement (code, single home).** Each gate's policy\
  \ is realized as the `gate_policy` +\n`blocking=` arguments to `_run_plan_gate_audit`\
  \ in `cmd_plan_stage` (bin/yitc-v2). A\nMANDATORY-BLOCKING gate `_die`s on a RED/ABORT\
  \ verdict (transition held, status unchanged) and\nenforces the 2-pass audit-loop\
  \ ceiling (<workshop-spec> §Audit-loop ceiling); an ABORT burns no pass.\nWhat happens\
  \ AT that ceiling is homed in SPEC-1039 rule 9 (the plan-gate arm): the Controller\
  \ records\none typed decision per residual and ONE bounded pass then rides the FSM\
  \ advance this gate blocks. The\nconsult-governed continuation this policy previously\
  \ pointed at is retired there (rule 6).\nAn ADVISORY gate records the verdict and\
  \ always proceeds. This spec is the doctrine; the verb is\nthe chokepoint (`implements:`\
  \ above).\n\n**Correction invalidation — relative to EACH gate's question.** A plan\
  \ or its cut is\ncorrected between gates. A correction invalidates only the gate\
  \ conclusions whose claims, governing\nassumptions or relevant inputs it changes,\
  \ judged against what THAT gate asks — never through a\nuniversal \"text-only\"\
  \ exemption: a correction inert for trial evidence can be material to a textual\n\
  gate. A gate's conclusion falls when the correction changes:\n  - P2 — the scope,\
  \ a contradiction, or the build order;\n  - P3 — trial eligibility, the trial protocol,\
  \ its criteria, or the safety envelope;\n  - P4 — whether the recorded trial evidence\
  \ still applies to the current design (SPEC-0035 rule 5's\n    semantic-effect test\
  \ decides which run-refs stand);\n  - P5 — the filed cut: its coverage, dependencies,\
  \ activation ownership, or closure probes. A\n    card-cut or completion-criterion\
  \ correction is NEVER exempt here, however small its text, and\n    P5's fingerprint-fresh\
  \ verdict stays REQUIRED after any change to the cut — obtained by a delta\n   \
  \ check over the change AND every card, dependency edge, activation owner and closure\
  \ probe that\n    depends on it, plus any prior finding the change could reopen;\
  \ never carried stale.\nA wording-only correction (spelling, formatting, an equivalent\
  \ reference) keeps the P2-P4\nconclusions. A conclusion that falls is re-examined\
  \ by the NEXT gate the plan must pass anyway: a\npassed transition is never re-run,\
  \ no gate or pass is added, and every currently required fresh\nverdict (the accept-gate's\
  \ freshness, P5's fingerprint) is still obtained.\n**The record — ONE existing home\
  \ for every correction.** Whatever prompted it (a trial run, a RED\nor YELLOW gate\
  \ finding, or no finding at all) and whatever it touches (the plan, a draft spec\
  \ or a\nfiled card), the correcting session writes ONE line into the plan's own\
  \ External checks / audits\nsection (a section every plan carries from its skeleton):\
  \ what changed (before → after), its\nclassification by SPEC-0035 rule 5's semantic-effect\
  \ test, which gate conclusions or run-refs it\nkeeps or invalidates, and a reference\
  \ to the correction. Every plan-gate prompt carries the plan\nbody, so that line\
  \ reaches every later gate, and the P2-P5 templates below each ask their auditor\n\
  to scrutinize it; the convergence read is asked the same (SPEC-0035 rule 5). The\
  \ accept-gate check\nof a plan that skipped trial reuses no conclusion — it audits\
  \ the whole assembled package fresh —\nso it needs no such question. The two Plan-FINALIZATION\
  \ overlays below are unchanged.\n**A disputed label is a note, not a hold.** A gate\
  \ that cannot confirm a line's classification\nreads the line as behaviour-bearing\
  \ and re-examines, in that same pass, the conclusions and\nrun-refs the line kept.\
  \ Its disagreement with the label is by itself a report-only note at\nseverity info\
  \ and holds no gate. A gate is held only by what that re-examination finds in the\n\
  plan, its draft specs, its cut or its evidence as they now stand, or by a conclusion\
  \ or run-ref\nthe gate relies on that it cannot re-establish. Every correction still\
  \ gets its line and its\nclassification.\n**A clerical record defect is a note,\
  \ not a hold.** The same reading covers the whole class: a\ndefect of how the process\
  \ recorded something — a label, a missing field of a record row, a\nmissing cite\
  \ where the governing contract is named elsewhere in the same artifact — is by itself\n\
  a report-only note at severity info at every plan gate, and the gate still re-establishes\
  \ each\nconclusion the record carries. Evidence a conclusion rests on that cannot\
  \ be re-established —\nthe authority for a decision, adoption proof, freshness,\
  \ trial evidence that applies — keeps its\nconsequence.\n\n### Plan-stage question\
  \ templates (re-homed VERBATIM from <workshop-spec> §Plan-stage overlays)\n\n**Selection\
  \ carrier (deterministic — the VERB invocation, never bare `status`):**\n- **ad-hoc\
  \ check** (`plan check <slug>` [+`--focus`]) → the ONE shaping template that exists:\n\
  \  `draft` → P1 below. Ad-hoc shaping is DRAFT-ONLY; at `specs`+ the checks ride\
  \ the gate\n  templates (P2-P4) and the accept-gate lens;\n- **gate template** →\
  \ asked by the TRANSITION verb itself: `plan stage <NEXT>` asks the\n  entry-gate\
  \ template FOR `<NEXT>` (the verb already gates the prior stage and delivers the\
  \ stage\n  bundle — the template question joins that exact moment). No new flag,\
  \ no new verb.\n\n**Gate policy — homed in SPEC-0083 ( stable-surface split, P5).**\
  \ WHICH plan-FSM\ntransition blocks on the audit verdict vs records-and-proceeds\
  \ is the ORTHOGONAL concern to the\nquestion TEMPLATES below (WHAT is asked); the\
  \ one-table gate POLICY lives single-SoT in SPEC-0083\n(`graph query SPEC-0083`).\
  \ The per-gate question templates (P1-P5) below are UNAFFECTED by the split.\n\n\
  **Plan-FINALIZATION overlay — reached-active acceptance (mirrors SPEC-0034 §realized\n\
  clause (a)).** The aggregate `audit post --plan` finalization overlay tells the\
  \ external\nauditor the SAME realize-gate semantics the code gate (`_require_plan_finalization_ready`)\
  \ enforces:\na `proposed_by` spec satisfies the gate when it has REACHED `active`\
  \ — current `active` OR a\nPOST-active state (`superseded` / `retired`), which the\
  \ spec FSM (proposed -> active -> superseded\n-> retired) makes reachable ONLY after\
  \ `active`, so either status PROVES the spec became normative. So a\nlineage-evolved\
  \ corpus of superseded/retired specs is CORRECT and realized — the auditor must\
  \ NOT\nRED it for \"zero currently-active specs\" nor YELLOW it for \"a superseded\
  \ spec in the corpus\". ONLY a\nnever-active NON-TERMINAL status (proposed / draft)\
  \ or an unknown status is a genuine half-realized\nfinding; a DELIBERATE terminal\
  \ (withdrawn / rejected) is EXEMPT (mirrors SPEC-0034 §realized\nclause (a)) — a\
  \ deliberately-abandoned plan-born spec is a tracked scope-cut, NOT an unrealized\n\
  obligation, so it is flagged `[deliberately abandoned]`, EXCLUDED from the reached-active\
  \ tally, and\nis NEVER a finding (the lens mirrors the code gate `_require_plan_finalization_ready`).\
  \ The corpus\nbody reports `reached-active? N/N` (active + post-active, deliberate\
  \ terminals excluded) for this gate;\nthe auditor judges against THAT, not a bare\
  \ current-active tally. (P5 — the lens reads the code gate.)\n\n**Plan-FINALIZATION\
  \ overlay — drain-at-realize correctness.** A `realized` plan is a\nTERMINAL carrier\
  \ (historical record + pointer only), so the finalization auditor ALSO checks that\
  \ any\ndurable/living content the plan HOSTED — criteria, rosters, checklists, standing\
  \ rules, living tables\n— was DRAINED to a STABLE home (a spec or a non-FSM pattern)\
  \ before realize: no durable content is\norphaned in the terminal plan (P5 one-home\
  \ / P7; SPEC-0034 §realized). A plan retaining ONLY a\nhistorical record + a pointer\
  \ to the stable home is GREEN; durable/living content still authored IN\nthe terminating\
  \ plan (not merely pointed-to) is a drain finding. Living/WIP content was legitimate\n\
  while the plan was ACTIVE — the check fires AT the realize transition, NOT before.\n\
  \n**P1 — plan-draft shaping template («prover' draft» (\"check the draft\"), owner-invoked):**\n\
  - Is the problem GROUNDED — real incident / prior-art / external analog (anti-cx\
  \ F4)?\n- Are all angles/halves of the carve ENUMERATED — completeness ONLY: is\
  \ every part LISTED at all\n  (a deliverable simply omitted is invisible to a resolver)?\
  \ Includes the status-template-matrix\n  completeness check (trial-run-2): everything\
  \ a carrier/mechanism section PROMISES (e.g. a\n  template per status/gate) must\
  \ appear in the deliverables — a promised-but-undelivered member\n  is an omitted\
  \ half. Whether listed parts should be SEPARATE plans is the NEXT question, not\
  \ this one.\n- **Plan-split criterion — one convergence regime / one fate per plan\
  \ (<workshop-spec>):** do parts have\n  different validation horizons (one provable\
  \ now, one needs accumulated real data)? independently\n  rejectable fates? does\
  \ one part consume the other's real-data output? Any YES → recommend\n  splitting\
  \ into cross-referenced plans (tracked ids, no requires between them). **Trial-FSM\n\
  \  carve-out (trial-run-1):** for a trial-ELIGIBLE plan, its own design-convergence\
  \ (trial) phase\n  followed by implementation (executing) is ONE sequential regime\
  \ — that built-in sequence is NOT\n  a split signal; apply the split signals only\
  \ to parts whose fates stay independently rejectable\n  AFTER accept.\n- Trial-eligibility\
  \ pre-assessment: mechanism/behavioral (trial-bound) vs prose/docs (skips trial)?\n\
  - Is the existing-analog sweep honest — corpus + plans/ + journal searched?\n- Are\
  \ references inside the draft body CURRENT — no superseded/stale FSM or artifact\
  \ references?\n  Judge stage vocabulary against the AUTHORITATIVE plan FSM (LIFECYCLE\
  \ §Plan-lifecycle:\n  draft→specs→trial→accepted→executing→postcheck→realized),\
  \ which the prompt assembly MUST include.\n  The assembled FSM line (`_plan_fsm_line`)\
  \ ALSO states that `trial` is OWNER-INVOKED and\n  conditionally SKIPPED for trial-ineligible\
  \ (prose/docs) plans (SPEC-0035): a `specs → accepted`\n  transition that skips\
  \ `trial` is a SANCTIONED path, NOT a process bypass — do NOT RED-flag a\n  trial-skipping\
  \ plan as a stale-FSM reference or a process violation.\n\n**P2 — draft→specs gate\
  \ template (asked by `plan stage specs`):**\n- Is the draft THOUGHT-THROUGH enough\
  \ to compose specs — scope stable across recent edits?\n- Every carve-out / deferral\
  \ carried by a TRACKED id (<workshop-spec> — never prose)?\n- Contradictions resolved\
  \ or explicitly named (P7)?\n- Multi-part plan: is the build ORDER fixed (instrument-before-policy\
  \ where applicable)?\n- Recorded correction classifications — for each correction\
  \ line the plan's External\n  checks / audits section records since the verdict\
  \ or trial evidence this gate relies on, does\n  its before → after support its\
  \ classification for THIS gate's question: could the correction change what a conforming\
  \ implementation or trial judgement permits,\n  requires, produces or accepts for\
  \ ANY supported case (eligibility, authority, failure handling,\n  safety, scope,\
  \ observability, evidence or exit criteria)?\n  A line you cannot confirm is behaviour-bearing,\
  \ and the conclusions or run-refs it kept do\n  not stand.\n  Re-examine in this\
  \ pass the conclusions and run-refs such a line kept. Your disagreement with\n \
  \ a line's classification is by itself a report-only note at severity info: it does\
  \ not hold\n  this gate. Report a finding above info only for what that re-examination\
  \ finds in the plan,\n  its draft specs, its cut or its evidence as they now stand,\
  \ or for a conclusion or run-ref\n  this gate relies on that you cannot re-establish.\n\
  - Clerical record defects — a defect of how the process recorded something (a label,\
  \ a missing\n  field of a record row, a missing cite where the governing contract\
  \ is named elsewhere in the\n  same artifact) is by itself a report-only note at\
  \ severity info: it does not hold this gate.\n  Evidence a conclusion rests on that\
  \ you cannot re-establish (the authority for a decision,\n  adoption proof, freshness,\
  \ trial evidence that applies) keeps its consequence.\n\n**P3 — specs→trial gate\
  \ template (asked by `plan stage trial`; MANDATORY-BLOCKING):**\n- Eligibility rationale\
  \ honest — BOTH legs (mechanism-class AND convergence not honestly\n  obtainable\
  \ by text audit alone)?\n- Trial or postcheck — do the protocol's runs exercise\
  \ the design before it is built, or do\n  they build or ship a version and watch\
  \ it behave (for example «trial = ship an opt-in v1»)?\n  The second is a shipped-behaviour\
  \ soak: it belongs at postcheck, not in trial — SPEC-0035\n  rule 10(a).\n- `##\
  \ Trial protocol` baked and sound: mode + why, probe targets, exit criteria, safety\
  \ envelope\n  (never mutates production data) — per `patterns/trial-methods.md`?\n\
  - Draft specs composed + checked (the prior stage actually complete)?\n- Recorded\
  \ correction classifications — for each correction line the plan's External\n  checks\
  \ / audits section records since the verdict or trial evidence this gate relies\
  \ on, does\n  its before → after support its classification for THIS gate's question:\
  \ could the correction change what a conforming implementation or trial judgement\
  \ permits,\n  requires, produces or accepts for ANY supported case (eligibility,\
  \ authority, failure handling,\n  safety, scope, observability, evidence or exit\
  \ criteria)?\n  A line you cannot confirm is behaviour-bearing, and the conclusions\
  \ or run-refs it kept do\n  not stand.\n  Re-examine in this pass the conclusions\
  \ and run-refs such a line kept. Your disagreement with\n  a line's classification\
  \ is by itself a report-only note at severity info: it does not hold\n  this gate.\
  \ Report a finding above info only for what that re-examination finds in the plan,\n\
  \  its draft specs, its cut or its evidence as they now stand, or for a conclusion\
  \ or run-ref\n  this gate relies on that you cannot re-establish.\n- Clerical record\
  \ defects — a defect of how the process recorded something (a label, a missing\n\
  \  field of a record row, a missing cite where the governing contract is named elsewhere\
  \ in the\n  same artifact) is by itself a report-only note at severity info: it\
  \ does not hold this gate.\n  Evidence a conclusion rests on that you cannot re-establish\
  \ (the authority for a decision,\n  adoption proof, freshness, trial evidence that\
  \ applies) keeps its consequence.\n\n**P4 — trial→accepted trial-evidence block\
  \ (joins the accept-gate `plan check` prompt when a\ntrial ran; MANDATORY-BLOCKING):**\n\
  - Does the JOURNALED trial evidence (runs + convergence claim) support «design converged»\
  \ — or\n  did runs stop while the design was still moving?\n- Did the trial feed\
  \ the plan/specs (co-evolution visible), or were they untouched despite\n  divergent\
  \ runs (a smell)?\n- Recorded correction classifications — for each correction line\
  \ the plan's External\n  checks / audits section records since the verdict or trial\
  \ evidence this gate relies on, does\n  its before → after support its classification\
  \ for THIS gate's question: could the correction change what a conforming implementation\
  \ or trial judgement permits,\n  requires, produces or accepts for ANY supported\
  \ case (eligibility, authority, failure handling,\n  safety, scope, observability,\
  \ evidence or exit criteria)?\n  A line you cannot confirm is behaviour-bearing,\
  \ and the conclusions or run-refs it kept do\n  not stand.\n  Re-examine in this\
  \ pass the conclusions and run-refs such a line kept. Your disagreement with\n \
  \ a line's classification is by itself a report-only note at severity info: it does\
  \ not hold\n  this gate. Report a finding above info only for what that re-examination\
  \ finds in the plan,\n  its draft specs, its cut or its evidence as they now stand,\
  \ or for a conclusion or run-ref\n  this gate relies on that you cannot re-establish.\n\
  - Clerical record defects — a defect of how the process recorded something (a label,\
  \ a missing\n  field of a record row, a missing cite where the governing contract\
  \ is named elsewhere in the\n  same artifact) is by itself a report-only note at\
  \ severity info: it does not hold this gate.\n  Evidence a conclusion rests on that\
  \ you cannot re-establish (the authority for a decision,\n  adoption proof, freshness,\
  \ trial evidence that applies) keeps its consequence.\n\n**P4 round — the accept-gate\
  \ ROUND template (asked by `plan check --round`, appended after the stage\ntemplate;\
  \ a round is checking, never admission):**\n- Mark EVERY finding with a `scope:`\
  \ field, `plan` or `card`, by ONE question: can the one unit\n  it names resolve\
  \ it inside the contracts already settled, without changing what another unit\n\
  \  must do and without undoing what the plan's acceptance judged? YES is `card`,\
  \ with that unit in\n  `where`; NO is `plan`. Always `plan`, however few units it\
  \ touches: a violation of a settled\n  contract (an accepted spec, an owner decision),\
  \ feasibility, the validity of a proof. A finding\n  that names no single unit is\
  \ `plan`. A detail several units share is `card` when one named\n  defining unit\
  \ settles it and the others only use it.\n  Examples — `plan`: the coherence of\
  \ owner\n  decisions, build and rollout order, security boundaries, acceptance,\
  \ done and realization\n  criteria, and the reach of each decision to the items\
  \ it governs; completeness — every\n  requirement, deliverable and rule change of\
  \ the plan carried by a named unit or a verification\n  probe, and the carry registry's\
  \ coverage when the plan has one. `card`: local to one item, screen\n  or component\
  \ whose carrying unit will own it (its error, empty, loading or retry states, the\n\
  \  wording or granularity of one item that hides no unregistered requirement, a\
  \ stale or partial\n  reference, quoting, a missing test path); `where` names that\
  \ carrying unit. When unsure, `plan`.\n- The round's verdict is read from the plan-scope\
  \ findings only: GREEN — none; YELLOW — all low;\n  RED — any medium or high. Card-scope\
  \ findings are recorded with their carrying unit and reach the\n  cut as card content;\
  \ they never move the round's verdict.\n- The record carries `round: N` and is saved\
  \ under its own name\n  (`decisions/<slug>-audit-round-<N>.yaml`); it never overwrites\
  \ the plain `plan check` record and\n  never admits the plan — acceptance reads\
  \ only the plain record and its change checks.\n- Rounds end when the last round\
  \ has no plan-scope HIGH, not on GREEN: a round is not repeated to\n  turn plan-scope\
  \ mediums into GREEN.\n- Between rounds: ONE fix batch over the plan-scope findings,\
  \ then ONE change check before the next\n  round — `audit adhoc --routine` over\
  \ the diff since the last check, with the owner decisions and\n  the full text of\
  \ every registry item or requirement the diff touches, asking whether the change\n\
  \  closes each finding and whether it introduces a contradiction or a regression.\
  \ A blind\n  reconciliation of the edit against the plan's draft documents takes\
  \ at most one turn per round.\n  A fix that breaks a previous fix is the CHARTER\
  \ §Failure trigger case, applied from that home;\n  the simplification taken is\
  \ stated with the next change check.\n\n**P5 — decomposition→executing fidelity\
  \ template (asked by `plan stage executing`; MANDATORY-BLOCKING — SPEC-0070 §3):**\n\
  Audit the FILED TASK CARD SET (delivered in the prompt as `## Decomposition — the\
  \ filed task CARD\nSET`) against the plan AND its goals — the SET-level properties\
  \ no single-card audit-pre can reach\n(the cut, not one card):\n- Coverage 1:1 —\
  \ is every plan part / accept-unit mapped to exactly ONE card, with no plan part\n\
  \  unmapped and no card outside the plan's scope?\n- One coherent change-set per\
  \ card (SPEC-0046 §A) — the default grain: related claims on the same\n  files or\
  \ surface, proven by one verify pass, belong in one card. Does any card BUNDLE parts\
  \ a split\n  ground separates — the parts are independent and each pays for its\
  \ own fixed cost, a reviewer must\n  judge them separately, or one part must land\
  \ first — or carry an acceptance OVERLAPPING a sibling\n  card's claim? Is one coherent\
  \ change-set FRAGMENTED across cards no split ground separates? A finding\n  that\
  \ a card should be SPLIT (or cards MERGED) is a RECOMMENDATION — ADVISORY, never\
  \ blocking\n  : report it with the split it proposes; split recommendations, however\
  \ many,\n  never make the verdict RED; whether to follow one is the project's call\
  \ under its own declared\n  grouping rules (SPEC-0046 §A). An acceptance overlapping\
  \ a sibling card's claim is not a split\n  recommendation and is reported at its\
  \ own severity.\n- Declared grouping preference (SPEC-0046 §A) — where the cut material\
  \ (the plan body or\n  a card) names a project-declared task-grouping preference,\
  \ whether a grouping FOLLOWS it or the\n  cutter DECLINED it, are that preference's\
  \ SOURCE and RATIONALE named there (for a declined one,\n  with the reason it was\
  \ not followed)? The project's declared rules DECIDE its grouping: a card\n  grouped\
  \ by them is not re-cut by this gate — a split you would still recommend is the\
  \ advisory\n  recommendation above. A cut that names NO preference is ANSWERED-CLEAN\
  \ — it is judged by SPEC-0046\n  §A alone and must NOT be reported for lacking a\
  \ declaration.\n- `requires:` ordering encoded, not prose — is every intended precedence\
  \ (a «first» / «before» /\n  verifier-after-settled relationship) carried by a `requires:`\
  \ edge, so no later writer can legally\n  run before a card it depends on? (A named-first\
  \ card with NO outgoing dependency edge is the defect.)\n- Singular activation —\
  \ does each `proposed` spec have EXACTLY ONE `activation_owner_task` across its\n\
  \  sibling cards (the others `cite` it) — never zero, never two? Answer this ONLY\
  \ from the\n  `## Proposed-spec activation` block appended to the card set (X-0707)\
  \ — it is the\n  AUTHORITATIVE evidence and the ONLY evidence: in V2 the activation\
  \ owner is a spec→task POINTER on\n  the SPEC yaml, NOT a per-card field, so a card's\
  \ `cites:` is NOT a proxy for ownership and MUST NOT\n  be read as one. The block\
  \ lists every spec with `proposed_by ==` this plan, resolving each\n  `activation_owner_task`\
  \ against the cut. The DEFECT SHAPES are exactly two: a spec reading\n  `NO activation_owner_task\
  \ — UNOWNED` (zero owners — nothing in the cut will ever activate it), and a\n \
  \ spec whose owner reads `NOT a member of this cut` (the cut cannot deliver the\
  \ activation it\n  promises). A spec reading `owner: T-NNNN — IN this cut` is CORRECT\
  \ and must NOT be reported, and the\n  explicit `(no spec is born of this plan …)`\
  \ line means the question is ANSWERED-CLEAN — NOT\n  unchecked — so it must NOT\
  \ be reported either. A blocking RED must rest only on findings that can be verified.\n\
  - Anchor wiring carried by the cut (SPEC-0070 §3) — for each `proposed` plan spec\
  \ in the\n  `## Proposed-spec activation` block, does its `activation_owner_task`\
  \ card either CARRY the\n  code-anchor wiring work itself OR `requires:` the card\
  \ that does (a predecessor may wire it), OR\n  does the spec declare a SPEC-0151\
  \ `execution:` disposition — and is the owner card `requires:`-ordered\n  after\
  \ every implementing card? The DEFECT SHAPE: an owner card whose scope wires no\
  \ anchor, with no\n  `requires:` edge to a card that does and no `execution:` disposition\
  \ — the spec would activate\n  anchor-less.\n- Probe quality — is each card's acceptance\
  \ probe satisfiable AND journalable AT THAT task's OWN\n  closure (no future-bound\
  \ / soak-dependent / luck-only probe), and does a promised invariant carry\n  an\
  \ explicit probe rather than only a prose promise?\n- No reopened settled choice\
  \ — does any card REOPEN a design choice the plan/specs already settled\n  (e.g.\
  \ a «confirm-or-revise» embedded in the card instead of implementing the accepted\
  \ unit)?\n- Successor or in-place, per touched spec — for each ACTIVE spec a card\
  \ changes, does the card\n  choose between an in-place amend and a successor by\
  \ the SPEC-1037 §7 probe, and is that choice\n  stated on the card? A successor\
  \ where the probe answers in-place (or the reverse) is a finding;\n  when several\
  \ cards of the cut restate one active spec, read\n  `patterns/restating-an-active-spec-across-cards.md`\
  \ for how the cut carries it.\n- Path evidence for a verifier card — for each card\
  \ the card set marks with a\n  `path-evidence cue:` line, and for any other card\
  \ whose essence is to verify the cut's result,\n  does its acceptance meet the verifier\
  \ template of SPEC-1058 §3? That template is the one home of\n  what a verifier's\
  \ proof must show; read it there — it is not restated here.\n- Fixtures only for\
  \ named preconditions — does any card's acceptance or test plan use a fixture or\n\
  \  a mock to stand in for a runtime contract the cut has not yet delivered? A fixture\
  \ establishes\n  only a precondition the card names; a mocked missing runtime contract\
  \ makes a test green over a\n  contract that does not exist, and is a finding.\n\
  - Touch-forecast present + plausible — does each card carry an `expected_touch`\
  \ naming the\n  concrete files/symbols its scope implies, and is that plausibly\
  \ the cut's blast-radius (present,\n  non-empty, not obviously mismatched vs the\
  \ card's scope)? An empty `expected_touch` on a decomposed\n  card is a cut-fidelity\
  \ gap (SPEC-0046 §Persist-the-enumerated-blast-radius) — the cutter already\n  enumerated\
  \ the touch to size the cut, so a blank forecast is reason-then-discard, not \"\
  unknown yet\".\n- Set-level semantic coherence over a SHARED SURFACE (X-0593) —\
  \ do any two cards in this\n  cut WRITE or KEY the same named surface, and if so\
  \ does the cut state which definition GOVERNS?\n  Read the `## Shared surfaces`\
  \ block appended to the card set: it lists every surface named by >=2\n  cards (grouped\
  \ by the `expected_touch` path, so `a.py` and `a.py#sym` count as one surface) with\n\
  \  the sharing cards' COMMON `cites:` resolved against the corpus. A shared surface\
  \ whose line reads\n  `(no ACTIVE governing spec cited in common)` is the DEFECT\
  \ SHAPE: two independent workers can then\n  each implement a self-consistent reading,\
  \ and nothing before the merge land verify compares them.\n  Ask it card-to-card,\
  \ not card-to-plan: are the two cards' acceptance/scope readings of that surface\n\
  \  mutually satisfiable? The cut must either cite the ACTIVE spec that governs the\
  \ surface, or name\n  ONE card as its definer and `requires:`-order the other after\
  \ it.\n- Fidelity to intent — taken as a whole, does the cut faithfully realize\
  \ the plan's PURPOSE, not\n  merely the literal `implementation_plan` map?\n- Correction\
  \ since a prior verdict of this gate — where the cut changed after a recorded\n\
  \  verdict of this gate, this pass IS the required fresh verdict: judge the changed\
  \ cards AND every\n  card, `requires:` edge, activation owner and closure probe\
  \ that depends on them, and any prior\n  finding the change could reopen. A card-cut\
  \ or completion-criterion change is never wording,\n  however small its text, whatever\
  \ its recorded classification says.\n- Recorded correction classifications — for\
  \ each correction line the plan's External\n  checks / audits section records since\
  \ the verdict or trial evidence this gate relies on, does\n  its before → after\
  \ support its classification for THIS gate's question: could the correction change\
  \ what a conforming implementation or trial judgement permits,\n  requires, produces\
  \ or accepts for ANY supported case (eligibility, authority, failure handling,\n\
  \  safety, scope, observability, evidence or exit criteria)?\n  A line you cannot\
  \ confirm is behaviour-bearing, and the conclusions or run-refs it kept do\n  not\
  \ stand.\n  Re-examine in this pass the conclusions and run-refs such a line kept.\
  \ Your disagreement with\n  a line's classification is by itself a report-only note\
  \ at severity info: it does not hold\n  this gate. Report a finding above info only\
  \ for what that re-examination finds in the plan,\n  its draft specs, its cut or\
  \ its evidence as they now stand, or for a conclusion or run-ref\n  this gate relies\
  \ on that you cannot re-establish.\n- Clerical record defects — a defect of how\
  \ the process recorded something (a label, a missing\n  field of a record row, a\
  \ missing cite where the governing contract is named elsewhere in the\n  same artifact)\
  \ is by itself a report-only note at severity info: it does not hold this gate.\n\
  \  Evidence a conclusion rests on that you cannot re-establish (the authority for\
  \ a decision,\n  adoption proof, freshness, trial evidence that applies) keeps its\
  \ consequence.\n\n**`--focus \"<text>\"` — the composable append (on `plan check`\
  \ / `audit post --plan`):** appends an\nowner/session-specific question block AFTER\
  \ the stage template (the ad-hoc form made composable —\nit never REPLACES the template).\
  \ The appended text is recorded VERBATIM in the saved verdict\n`notes` field — **`notes`\
  \ IS the single verbatim carrier** (full text, byte-equal);\n`prompt_excerpt` stays\
  \ a ~200-char excerpt and is NEVER the carrier. No new schema field.\n\n**Verdict\
  \ recording (ONE canonical schema — P5):** every plan-gate verdict saves to the\
  \ canonical\naudit-result schema (AGENTS §Saved audit result) extended by TWO additive\
  \ fields:\n`stage_template:` (the template name asked — e.g. `plan-draft`, `gate-specs`,\
  \ `gate-trial`,\n`gate-accepted`) and `gate_policy:` (`on-demand | auto-advisory\
  \ | mandatory-blocking`). The legacy\ndraft-check shape (`draft:`/`kind:`/`content_hash`)\
  \ is NORMALIZED onto this schema — its\nfreshness extras (`content_hash`/`accept_freshness_hash`)\
  \ join as additive fields; no second\nverdict format survives.\n\n**Retirement (what\
  \ this head removes):** (a) hand-authored free-form external-auditor prompts for\n\
  plan-stage questions are DEMOTED to the documented manual fallback ONLY (CLI unavailable\
  \ /\nrecovery — same posture as LIFECYCLE §4/§8 manual fallback); (b) the habit\
  \ of pasting ad-hoc\nquestion blocks into bespoke auditor runs for plans is RETIRED\
  \ — its replacement IS `--focus`.\n\n## Parameters\n\nNone consumed. The audit-loop\
  \ ceiling constant (= 2) lives in its own home (<workshop-spec>) — not\nduplicated\
  \ here.\n\n## Rationale\n\nPrior-art: <workshop-spec> carved a stable surface out\
  \ of SPEC-0055 (`supersedes: ~`, parent lives on)\n— the same carve shape used here.\
  \ The P2-P5 gate infrastructure already existed; the\npolicy table was a sub-surface\
  \ of the large multi-concern <workshop-spec>. Splitting the policy into\nits own\
  \ spec lets the normative P2 reshape (advisory→blocking) route cleanly through the\
  \ spec FSM\n(<workshop-spec> §7) without a normative in-place edit of an active\
  \ spec, and gives the gate policy one\nlegible home (P5). Real driver: (owner-approved\
  \ option A — settle the SPEC-0034 open\nquestion).\n\nDisputed correction labels.\
  \ Public issue #80 item 1 (a consumer project, release\nv2.9.0, 2026-10-11): on\
  \ one plan, gate-specs rounds 5, 6 and 7 each returned one finding of the\nsame\
  \ kind — the line recording the previous round's fix was classed as wording where\
  \ the gate\nwanted behaviour-bearing. Every fix adds a line, so every round could\
  \ find a new one, at one\npaid round per label. The templates told the auditor how\
  \ to read an unconfirmed line and were\nsilent on how to report the disagreement\
  \ itself; SPEC-0035 rule 5 already said of the same\nrecord that the classification\
  \ is never a gate of its own. The paragraph «A disputed label is a\nnote, not a\
  \ hold» and the last three sentences of the templates' correction bullet state that\n\
  reading where the gate auditor meets it.\n\n added the three P5 questions on successor-or-in-place,\
  \ verifier path evidence and\nfixtures, from a consumer's cut passes (cross items\
  \ X-2376, X-2378, X-2379): a project rule of\none successor per card cost a lineage\
  \ review per card with no gate objecting; a verifier card\npassed on aggregate counts\
  \ over unrelated records; a mocked missing runtime contract was caught\nonly at\
  \ that card's own audit-pre. Additive questions asked on the next gate run, in place.\n\
  \n added the P4 round template: a consumer checked a large plan's accept gate in\
  \ rounds under a\nscope lens nine times with a hand-typed focus block (cross items\
  \ X-2376, X-2379); its plan-scope\nmediums stayed about twelve per round and never\
  \ converged, while one round stood RED with no high.\nRounds therefore end on no\
  \ plan-scope high, not on GREEN. Additive, in place.\n\n added the P3 trial-or-postcheck\
  \ question: a plan's trial protocol was to ship an opt-in\nv1 and watch it run,\
  \ and three gate-trial rounds judged that protocol without asking whether\nsuch\
  \ a soak belongs in trial at all; the owner named it (events.jsonl#ts=).\nSPEC-0035\
  \ binds only at trial entry, so before this question its rule 10(a) was first judged\n\
  after the plan was already in trial. Additive question, in place.\n\n stated the\
  \ P4 round's plan|card boundary as one question and widened the disputed-label\n\
  reading to the class of clerical record defects. A trial (plan\nplan-checks-stay-at-plan-depth-label-each-finding-,\
  \ cancelled after it; records\ndecisions/plan-depth-trial-r1-audit-adhoc.yaml and\
  \ decisions/plan-depth-trial-r1b-audit-adhoc.yaml;\ncross X-2446) labelled 65 real\
  \ findings of one large consumer plan under the question: scope\nagreement 65 of\
  \ 74 labels between the external auditor and a blind reading, no protected kind\n\
  labelled `card`, about one finding in nine card-scope. The requester's own re-sort\
  \ counted 9 of\n56 findings as defects of the process's own records, none high.\
  \ Both changes keep every\nalready-covered case as it was (the old lists stay as\
  \ the question's examples; a disputed label\nstays a note), so they are in place.\n\
  \n## Verification\n\n- VP1 (P2 blocks): `plan stage specs <slug>` with a RED/ABORT\
  \ `gate-specs` verdict REFUSES\n  (non-zero, no status write). Probe: tests/test_plan_stage.py\
  \ RED-GREEN.\n- VP2 (one home, P5): the gate-policy table AND the P1-P5 question\
  \ templates live ONLY here;\n  <workshop-spec> carries a POINTER, not the table.\
  \ Probe: `_plan_gate_template_text` resolves every\n  PLAN_GATE_TEMPLATE_ANCHORS\
  \ key from this spec (tests/test_t0349_plan_gate_templates.py).\n- VP3 (code link):\
  \ `graph build` resolves `implements: bin/lib/plan.py#cmd_plan_stage` (non-dangling\n\
  \  without a binding).\n- VP4 (activation): this spec resolves to exactly one `activation_owner_task`;\
  \ closing\n  it flips proposed→active.\n- VP5 (correction invalidation): §Correction\
  \ invalidation states the per-gate rule (P2-P5,\n  P5's delta-checked fresh verdict,\
  \ card-cut / completion-criterion never exempt, wording-only keeps\n  P2-P4, one\
  \ record home), and the P2-P5 templates the real gate reader extracts each carry\
  \ the\n  scrutinize instruction. Probe: tests/test_t13597_semantic_evidence_invalidation.py.\n\
  - VP6 (advisory split): the P5 template the real gate reader extracts states that\
  \ a split\n  recommendation is advisory and never makes the verdict RED, and that\
  \ the project's declared\n  grouping rules decide. Probe: tests/test_decomposition_fidelity_gate.py.\n\
  - VP7 (disputed correction label): the correction bullet of each P2-P5 template,\
  \ as the\n  real gate prompt carries it, keeps the unconfirmed-line reading, reports\
  \ a disagreement with a\n  label alone as a note that holds no gate, and still holds\
  \ the gate on what the re-examination\n  finds or cannot re-establish. Probe: tests/test_t13859_correction_label_report_only.py.\n\
  - VP8 (three cut questions): the P5 template the real gate reader extracts asks\n\
  \  successor-or-in-place per touched spec, path evidence for a verifier card by\
  \ naming SPEC-1058 §3\n  without restating its template, and fixtures only for named\
  \ preconditions. Probe:\n  tests/test_p5_template_questions.py.\n- VP9 (accept-gate\
  \ round): the P4 round template the real gate reader extracts carries\n  the scope\
  \ definitions, the plan-scope verdict rule, the end-of-rounds rule and the between-rounds\n\
  \  batching limits; a `plan check --round` prompt carries it after the stage template,\
  \ and its\n  record never admits the plan. Probe: tests/test_plan_check_rounds.py.\n\
  - VP10 (trial-or-postcheck): the prompt `plan stage trial` sends carries the P3\
  \ question\n  routing a shipped-behaviour soak to postcheck with its pointer to\
  \ SPEC-0035 rule 10(a). Probe:\n  tests/test_t0349_plan_gate_templates.py.\n- VP11\
  \ (boundary question + clerical class): the P4 round template the real gate reader\n\
  \  extracts asks the one plan-or-card question with its three always-`plan` kinds,\
  \ the no-single-unit\n  and unsure rules and the shared-detail sentence; §The record\
  \ and each P2-P5 template state the\n  clerical record defect as a report-only note\
  \ at severity info and keep the consequence of evidence\n  that cannot be re-established.\
  \ Probe: tests/test_t14700_plan_boundary_and_clerical.py.\n"
