id: SPEC-0083
title: Plan-stage gate policy — which plan-FSM transitions block on the external audit verdict
# `class:` REMOVED — a spec carries both layers as body sections (Scenario + Internal).

status: active

created_at:

travels: ~ # UNMARKED = the spec class-default (kernel). The plan-gate policy IS
                               # methodology a consumer pins — it travels.

