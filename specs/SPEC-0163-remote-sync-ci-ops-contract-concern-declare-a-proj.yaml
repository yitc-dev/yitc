body: |
  ## Scenario

  A project that rides the kernel answers ONE question at activation: does this project SYNC to a git
  remote — and if so, WHICH remote, WHO pushes to it, and is CI live (and is CI a gate or merely an
  extra check)? It declares the three together in its `yitc-ops.yaml` `remote_sync:` section, or it
  waives with a reason. The owner/AI reads ONE file to see where this project's code goes when it
  leaves the machine, which identity puts it there, and what — if anything — runs on the far side. A
  project with no remote says so explicitly, which is what makes any CI workflow still sitting in that
  repo legible as a DORMANT leftover rather than as working coverage.

  ## Internal

  THE REMOTE-SYNC/CI OPS-CONTRACT CONCERN. It is a seed-and-grow concern in the SPEC-0128 registry:
  this spec is its ONE authoritative declaration (the `concern:` + `init_concern:` blocks below), and
  every surface — the born carrier section, the fail-closed `-C init` declare-or-waive sweep, the
  generated activation checklist — is DERIVED from it (SPEC-0128 Rule 2/3). SPEC-0093 owns the carrier
  FRAMEWORK (one file, one section per concern, declare-or-waive fail-closed); SPEC-0096 owns the
  checklist generator. This spec owns only what is specific to THIS concern: the three parts, their
  implementation-agnosticism, the completeness contract, and the waiver semantics. Six rules.

  ### 1. The three parts are ONE concern (no separable declaration)
  `remote:` (WHERE the code syncs), `pusher:` (WHICH identity pushes there), and `ci:` (whether CI is
  LIVE on the far side and what ROLE it plays) are ONE concern with ONE stance, not three independent
  toggles. They are inseparable because each is worthless alone: a declared remote nobody can push to
  is not a sync path; a pusher with no declared remote names no destination; a CI stance without a
  remote describes work that cannot run (the X-0346 boomrocket shape — a dormant workflow whose repo
  has no remote at all). A project takes ONE stance on the three together: declare, or waive.

  ### 2. Implementation-agnostic — this concern mandates NO forge, NO CI system, NO push mechanism
  Like `verify:` and `tests:`, this concern asks WHETHER and WHAT, never HOW. It does NOT mandate
  GitHub, GitHub Actions, any forge, any hosted CI, or any particular push automation. `remote:` may
  name any git remote (a forge URL, a bare mirror, an internal host); `ci:` may name any system or
  none. The kernel checks that a STANCE exists and is complete; it does NOT judge the remote's
  reachability, the pusher's credentials, or the CI system's quality (the SPEC-0093 rule-3 boundary:
  the kernel seeds + checks the stance, it does not judge the command's correctness). A concern that
  named a vendor would be unanswerable by the projects that do not use it — and would quietly become a
  second normative core (CHARTER §Principle 4b, provider-neutral rule text).

  ### 3. `ci:` declares LIVENESS **and ROLE** — "there is a workflow file" is not a stance
  A `ci:` declaration answers two things a workflow file's mere existence cannot: is it LIVE (does it
  actually run, on what trigger / for what paths), and what is its ROLE — is CI a **gate** (a blocking
  quality bar) or an **extra check** (a non-blocking signal beside the project's real land gate,
  `verify.layers`)? The role is the load-bearing half: it is the difference between "CI red blocks the
  work" and "CI red is a known signal we ship past". This is a genuine owner decision, so it is
  DECLARED, never inferred from the repo's contents. Grounds: aiseller's CI role was decided by the
  owner (2026-07-12, journaled: CI stays a **product-only extra check**; `verify.layers` is the land
  quality gate) — a decision that was correct and yet lived only in one migration card's plan row,
  reachable by nobody who did not already know to look. `ci: none` (or a `ci:` naming no live system)
  is a COMPLETE and legitimate answer; silence is not.

  ### 4. Completeness — a DECLARED section answers all three (fail-closed), via the named shape hook
  The generic registry sweep is a stance check: it counts a section DECLARED when its `declare_key`
  (`remote`) is present and non-empty (SPEC-0128 Rule 2). That check alone would accept a section
  declaring `remote:` and silently omitting `pusher:` and `ci:` — i.e. two of the three parts rule 1
  says are inseparable, dropped without a word. So this concern NAMES a kernel-owned deep-shape
  validator (`shape_hook: remote_sync_shape` → `bin/lib/init.py#_hook_remote_sync`), the escape hatch
  SPEC-0128 Rule 2 explicitly permits for a residual shape richer than the generic stance check. It is
  the 11th instance of an existing mechanism, not a new one (CHARTER §P1 F1) — the same shape as the
  STRICT security waiver's hook and the `deploy.policy` C1 hook.
  The hook is FAIL-CLOSED on a PRESENT, NON-WAIVED declaration ONLY:
  - an ABSENT section (checked-if-present) or a WAIVED one is a STANCE the generic check owns — the
    hook returns nothing and NEVER backfills, mirrors or auto-heals it
    (`lessons/a-stance-mirror-is-only-sound-at-birth.md`);
  - a section declaring `remote:` MUST carry a non-empty `pusher:` and a non-empty `ci:`; a missing or
    blank one is an init ERROR naming the gap, never a silent pass.
  This is EXACTLY the deep-shape case the hook exists for, and it is why this concern does not follow
  SPEC-0145 §6's no-hook resolution: SPEC-0145 could defer three-key completeness to a downstream gate
  that already applied its own completeness contract (the deploy security gate). This concern has NO
  such downstream consumer — nothing else ever re-reads the section — so without the hook the
  completeness rule would be text nobody enforces: coverage-shaped silence, the very thing rule 6's
  incidents are made of.

  ### 4a. The ANY-AUTHOR LAND FLOOR holds regardless of the declared CI stance
  A project declares HOW its land-time security floor runs, never WHETHER it exists: `land` runs a
  kernel-provided verify layer (`kernel-floor` — secrets scan on the candidate · dependency hygiene ·
  every declared SPEC-0098 probe carrying a definition-bound, fresh passing verdict) for EVERY branch
  regardless of AUTHOR, and no `ci:` stance declared under rule 4 — gate, extra-check, or a waived
  section with no remote at all — narrows or removes it. A project may re-declare an atom's
  implementation (`verify.floor.<atom>.command`), and that command is ALWAYS ADDITIVE: it runs BESIDE
  the kernel check and can never replace or relax it. Any `waiver:` at or under `verify.floor`, and any
  `verify.layers` entry wearing the reserved `kernel-floor` name, is REFUSED at the declaration read.
  WHY HERE: rule 5 below makes a DORMANT CI workflow legible, and this is the other half of the same
  honesty — with CI dormant (or advisory), the land is the only gate the code actually passes through,
  and the SPEC-0100 floor triggers reach only AI-authored code, so a human collaborator's (SPEC-0169)
  branch would otherwise meet no security check at all. The CARRIER SHAPE this rule speaks of —
  every `verify.floor` key, its default and its refusals — is documented at its authoritative home,
  SPEC-0093; this spec carries the POLICY and never a second copy of the schema.

  ### 4b. A floor COMMAND is read only from the TRUSTED BASE (owner ruling 2026-09-06)
  The floor runs on EVERY branch regardless of author, so a `verify.floor.<atom>.command` is an
  executable the kernel PROMISES TO RUN on behalf of whoever wrote the branch. The trust boundary is
  therefore the SOURCE of that command, not its syntax: every floor-declared executable or script is
  read ONLY from the `yitc-ops.yaml` at the MERGE-BASE with `main` — the landed main — never from the
  candidate branch's copy. A candidate branch can neither ADD nor ALTER a floor command; a change to
  the floor commands themselves lands through its OWN reviewed path (a card whose diff is the
  yitc-ops floor section, audited like any other, landing on main first — the next land then trusts
  it). The candidate's copy of the section is IGNORED for EXECUTION, and a difference between the
  candidate's and the base's floor commands is REPORTED — a report-only WARN naming the keys, never a
  refusal — so a legitimate floor change stays visible rather than being silently dropped.
  THE PROGRAM'S BYTES, NOT ONLY ITS NAME. Reading the command STRING from the base settles WHICH
  program runs; it does not settle WHOSE BYTES that program is — the floor runs the command with the
  CANDIDATE worktree as its working directory, so a base-declared `./scripts/audit.sh` would still
  execute the candidate's copy of that script, reaching the rejected option C by a second route. So a
  floor-declared program named by a PATH that resolves INSIDE the repo is MATERIALIZED FROM THE BASE
  — its bytes read out of the merge-base into a temp file outside the worktree, and THAT is what
  runs. A path absent from the base is a REFUSAL, never a fallback to the candidate's copy: land the
  script on main through its own reviewed card first. A bare program NAME is a `PATH` lookup — host
  tooling, not candidate-authored — and passes through unchanged.
  RESIDUAL, STATED RATHER THAN HIDDEN: a trusted-base script may itself invoke an in-repo target
  (`python3./tool.py`) and so reach candidate bytes. That reach is decided by BASE-REVIEWED code —
  a candidate branch cannot introduce it — which is the same boundary `verify.layers` holds and is
  precisely what «lands through its OWN reviewed path» buys.
  BOUNDED, so the rule is not read wider than it is. Only the EXECUTABLE is base-read. Everything in
  the section that is NOT a command still reads from the CANDIDATE, because reading it there can only
  ever TIGHTEN: the rule-4a declaration refusals (a candidate declaring a waiver is refused on its own
  branch), the REQUIREMENT that a repo carrying a dependency manifest declare
  `verify.floor.dependencies.command` (so the bootstrap card that first declares the command
  satisfies its own duty and lands — its command then runs from the NEXT land, exactly the flow
  above), and the probe knobs. An UNREADABLE base trusts NOTHING and says so; it never silently
  passes a command that merely looked declared.
  WHY A TRUSTED BASE AND NOT A SANDBOX: `shell=False` plus a scrubbed child environment (retained,
  as defence in depth) remove shell SYNTAX and the launching session's identity carriers, but the
  candidate still NAMES the program — so a collaborator branch could still have the kernel run an
  arbitrary networked executable at land. An execution sandbox and trusting candidate-authored
  scripts were BOTH considered and REJECTED by the same ruling: the sandbox is a platform this
  methodology does not want to own (CHARTER §P1 F1/F3), and trusting the candidate is the weakness
  itself. Reusing the merge-base read the layer-identity check already performs adds no new
  mechanism.

  ### 5. The waiver is LOOSE — and it is what makes a dormant CI leftover VISIBLE
  A project with no remote legitimately waives with a bare reason (the SPEC-0093 rule-6 clean
  unconditional-waive case: a project refusing a concern it genuinely does not have). No compensating
  control, no expiry — an un-synced local-only repo hides no risk the kernel needs to age.
  But the waiver is not a formality, because it carries a CONSEQUENCE the project should read as it
  writes it: **a waived remote means every CI workflow in this repo is DORMANT.** CI runs on the far
  side of a remote; with no remote there is no far side. So the act of waiving is the moment a
  leftover workflow becomes legible as a leftover — which is precisely the surface X-0346 lacked. A
  waiver never converts a dormant workflow into coverage, and it never silently satisfies anything:
  there is nothing downstream for it to satisfy (rule 4).

  ### 6. Scope bound (honest +1 spec, +1 hook instance)
  Exactly +1 spec + ONE new instance of the existing `_SHAPE_HOOKS` extension point. NO new file,
  parser, node-type, edge, gate, verb, event, or hand-maintained list (CHARTER §P1 F2/F5). The born
  section, the sweep row, and the activation-checklist row are GENERATED from the two declaration
  blocks at `graph build` (SPEC-0128 Rule 3 — "author its spec with a `concern:` block. That is the
  WHOLE registration"). This spec restates no per-surface rule: the carrier framework stays in
  SPEC-0093, the checklist generator in SPEC-0096, the registry invariant in SPEC-0128.

  ## Parameters

  None `consumed`. A project's concrete remote / pusher / CI values are project ops config on the
  `remote_sync` carrier (SPEC-0093 §Parameters), never kernel-read governance scalars.

  ## Rationale

  Two real incidents, both the X-0088 silent-born-waiver class (a stance nobody is forced to take is
  invisible), and both from the same week:
  - **aiseller (commit 4e79f6498, 2026-07-12).** Its post-v1 push path (`git push origin
    main` — the v1 auto-pusher died at quiesce, as designed), the pushing actor, and the CI role
    (owner-decided: product-only extra check, not the land gate) were all settled AD HOC inside one
    migration card and recorded only as a plan leftover-tail row. The decisions were sound; the
    problem is that no concern surface asked for them, so nothing keeps them legible or re-asks them
    of the next project.
  - **boomrocket (followup `fu_d7881b6b0864`, 2026-07-11 → routed X-0346).** It carries
    `.github/workflows/product-safety-guards.yml` with NO git remote — a dormant CI leftover the B5
    leftover-tail missed, found only by an ad-hoc human read.
  Class prior-art: **X-0088** (a deploy-autonomy born-waiver that "never surfaced … discovered only
  because the owner asked") and **X-0313** (the operating-context stub), whose fix — /
  SPEC-0125 — is this concern's direct structural precedent: register the concern, let the generated
  surfaces do the rest. Prior-art REUSED (CHARTER §P1 F1 — extend, don't create): the SPEC-0128
  concern registry, the SPEC-0096 checklist generator, the SPEC-0093 carrier framework, and the
  existing `_SHAPE_HOOKS` deep-shape extension point (10 prior instances). Deliberation lives with the
  proposing task, not here (SPEC-0005 rule 3).

  ## Verification

  - **state-check (AC1, differential):** the `remote_sync` row renders into BOTH generated
    activation-checklist views (Init-walk SET + Doc-checklist) with `_activation_checklist_drift ==
    []`; stripping this spec's `init_concern` DROPS the row from both — proving derivation, not a hand
    edit. The row is ABSENT from the checklist before this change.
  - **state-check (AC2, the three stances):** over REAL `-C init` runs — a consumer DECLARING
    (remote+pusher+ci) sweeps clean; one WAIVING (no remote) sweeps clean; a SILENT section (neither
    key) FAILS CLOSED naming the section.
  - **state-check (rule 4, the hook is, not inert):** a section declaring `remote:` while
    omitting `pusher:`/`ci:` FAILS CLOSED — the differential that separates the hook from the generic
    stance check.
  - **adoption (at activation, CHARTER §P8):** the concern round-trips from this ONE declaration to
    every generated surface (`concern-registry.json` + `born-ops.yaml` + the checklist) with NO edit to
    any hand-maintained list; a fresh `-C init` surfaces it in the born-waiver sweep.

