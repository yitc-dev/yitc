- bin/lib/init.py#_staged_secret_hits
body: "## Scenario\n\nA project that rides the kernel answers ONE question at activation:\
  \ does this project SYNC to a git\nremote — and if so, WHICH remote, WHO pushes\
  \ to it, and is CI live (and is CI a gate or merely an\nextra check)? It declares\
  \ the three together in its `yitc-ops.yaml` `remote_sync:` section, or it\nwaives\
  \ with a reason. The owner/AI reads ONE file to see where this project's code goes\
  \ when it\nleaves the machine, which identity puts it there, and what — if anything\
  \ — runs on the far side. A\nproject with no remote says so explicitly, which is\
  \ what makes any CI workflow still sitting in that\nrepo legible as a DORMANT leftover\
  \ rather than as working coverage.\n\n## Internal\n\nTHE REMOTE-SYNC/CI OPS-CONTRACT\
  \ CONCERN. It is a seed-and-grow concern in the SPEC-0128 registry:\nthis spec is\
  \ its ONE authoritative declaration (the `concern:` + `init_concern:` blocks below),\
  \ and\nevery surface — the born carrier section, the fail-closed `-C init` declare-or-waive\
  \ sweep, the\ngenerated activation checklist — is DERIVED from it (SPEC-0128 Rule\
  \ 2/3). SPEC-0093 owns the carrier\nFRAMEWORK (one file, one section per concern,\
  \ declare-or-waive fail-closed); SPEC-0096 owns the\nchecklist generator. This spec\
  \ owns only what is specific to THIS concern: the three parts, their\nimplementation-agnosticism,\
  \ the completeness contract, and the waiver semantics. Six rules.\n\n### 1. The\
  \ three parts are ONE concern (no separable declaration)\n`remote:` (WHERE the code\
  \ syncs), `pusher:` (WHICH identity pushes there), and `ci:` (whether CI is\nLIVE\
  \ on the far side and what ROLE it plays) are ONE concern with ONE stance, not three\
  \ independent\ntoggles. They are inseparable because each is worthless alone: a\
  \ declared remote nobody can push to\nis not a sync path; a pusher with no declared\
  \ remote names no destination; a CI stance without a\nremote describes work that\
  \ cannot run (the X-0346 <project> shape — a dormant workflow whose repo\nhas no\
  \ remote at all). A project takes ONE stance on the three together: declare, or\
  \ waive.\n\n### 2. Implementation-agnostic — this concern mandates NO forge, NO\
  \ CI system, NO push mechanism\nLike `verify:` and `tests:`, this concern asks WHETHER\
  \ and WHAT, never HOW. It does NOT mandate\nGitHub, GitHub Actions, any forge, any\
  \ hosted CI, or any particular push automation. `remote:` may\nname any git remote\
  \ (a forge URL, a bare mirror, an internal host); `ci:` may name any system or\n\
  none. The kernel checks that a STANCE exists and is complete; it does NOT judge\
  \ the remote's\nreachability, the pusher's credentials, or the CI system's quality\
  \ (the SPEC-0093 rule-3 boundary:\nthe kernel seeds + checks the stance, it does\
  \ not judge the command's correctness). A concern that\nnamed a vendor would be\
  \ unanswerable by the projects that do not use it — and would quietly become a\n\
  second normative core (CHARTER §Principle 4b, provider-neutral rule text).\n\n###\
  \ 3. `ci:` declares LIVENESS **and ROLE** — \"there is a workflow file\" is not\
  \ a stance\nA `ci:` declaration answers two things a workflow file's mere existence\
  \ cannot: is it LIVE (does it\nactually run, on what trigger / for what paths),\
  \ and what is its ROLE — is CI a **gate** (a blocking\nquality bar) or an **extra\
  \ check** (a non-blocking signal beside the project's real land gate,\n`verify.layers`)?\
  \ The role is the load-bearing half: it is the difference between \"CI red blocks\
  \ the\nwork\" and \"CI red is a known signal we ship past\". This is a genuine owner\
  \ decision, so it is\nDECLARED, never inferred from the repo's contents. Grounds:\
  \ <project>'s CI role was decided by the\nowner (2026-07-12, journaled: CI stays\
  \ a **product-only extra check**; `verify.layers` is the land\nquality gate) — a\
  \ decision that was correct and yet lived only in one migration card's plan row,\n\
  reachable by nobody who did not already know to look. `ci: none` (or a `ci:` naming\
  \ no live system)\nis a COMPLETE and legitimate answer; silence is not.\n\n### 4.\
  \ Completeness — a DECLARED section answers all three (fail-closed), via the named\
  \ shape hook\nThe generic registry sweep is a stance check: it counts a section\
  \ DECLARED when its `declare_key`\n(`remote`) is present and non-empty (SPEC-0128\
  \ Rule 2). That check alone would accept a section\ndeclaring `remote:` and silently\
  \ omitting `pusher:` and `ci:` — i.e. two of the three parts rule 1\nsays are inseparable,\
  \ dropped without a word. So this concern NAMES a kernel-owned deep-shape\nvalidator\
  \ (`shape_hook: remote_sync_shape` → `bin/lib/init.py#_hook_remote_sync`), the escape\
  \ hatch\nSPEC-0128 Rule 2 explicitly permits for a residual shape richer than the\
  \ generic stance check. It is\nthe 11th instance of an existing mechanism, not a\
  \ new one (CHARTER §P1 F1) — the same shape as the\nSTRICT security waiver's hook\
  \ and the `deploy.policy` C1 hook.\nThe hook is FAIL-CLOSED on a PRESENT, NON-WAIVED\
  \ declaration ONLY:\n- an ABSENT section (checked-if-present) or a WAIVED one is\
  \ a STANCE the generic check owns — the\n  hook returns nothing and NEVER backfills,\
  \ mirrors or auto-heals it\n  (`lessons/a-stance-mirror-is-only-sound-at-birth.md`);\n\
  - a section declaring `remote:` MUST carry a non-empty `pusher:` and a non-empty\
  \ `ci:`; a missing or\n  blank one is an init ERROR naming the gap, never a silent\
  \ pass.\nThis is EXACTLY the deep-shape case the hook exists for, and it is why\
  \ this concern does not follow\nSPEC-0145 §6's no-hook resolution: SPEC-0145 could\
  \ defer three-key completeness to a downstream gate\nthat already applied its own\
  \ completeness contract (the deploy security gate). This concern has NO\nsuch downstream\
  \ consumer — nothing else ever re-reads the section — so without the hook the\n\
  completeness rule would be text nobody enforces: coverage-shaped silence, the very\
  \ thing rule 6's\nincidents are made of.\n\n### 4a. The ANY-AUTHOR LAND FLOOR holds\
  \ regardless of the declared CI stance\nA project declares HOW its land-time security\
  \ floor runs, never WHETHER it exists: `land` runs a\nkernel-provided verify layer\
  \ (`kernel-floor` — secrets scan on the candidate · dependency hygiene ·\nevery\
  \ declared SPEC-0098 probe carrying a definition-bound, fresh passing verdict) for\
  \ EVERY branch\nregardless of AUTHOR, and no `ci:` stance declared under rule 4\
  \ — gate, extra-check, or a waived\nsection with no remote at all — narrows or removes\
  \ it. A project may re-declare an atom's\nimplementation (`verify.floor.<atom>.command`),\
  \ and that command is ALWAYS ADDITIVE: it runs BESIDE\nthe kernel check and can\
  \ never replace or relax it. Any `waiver:` at or under `verify.floor`, and any\n\
  `verify.layers` entry wearing the reserved `kernel-floor` name, is REFUSED at the\
  \ declaration read.\nWHY HERE: rule 5 below makes a DORMANT CI workflow legible,\
  \ and this is the other half of the same\nhonesty — with CI dormant (or advisory),\
  \ the land is the only gate the code actually passes through,\nand the SPEC-0100\
  \ floor triggers reach only AI-authored code, so a human collaborator's (SPEC-0169)\n\
  branch would otherwise meet no security check at all. The CARRIER SHAPE this rule\
  \ speaks of —\nevery `verify.floor` key, its default and its refusals — is documented\
  \ at its authoritative home,\nSPEC-0093; this spec carries the POLICY and never\
  \ a second copy of the schema.\n\n### 4b. A floor COMMAND is read only from the\
  \ TRUSTED BASE (owner ruling 2026-09-06)\nThe floor runs on EVERY branch regardless\
  \ of author, so a `verify.floor.<atom>.command` is an\nexecutable the kernel PROMISES\
  \ TO RUN on behalf of whoever wrote the branch. The trust boundary is\ntherefore\
  \ the SOURCE of that command, not its syntax: every floor-declared executable or\
  \ script is\nread ONLY from the `yitc-ops.yaml` at the MERGE-BASE with `main` —\
  \ the landed main — never from the\ncandidate branch's copy. A candidate branch\
  \ can neither ADD nor ALTER a floor command; a change to\nthe floor commands themselves\
  \ lands through its OWN reviewed path (a card whose diff is the\nyitc-ops floor\
  \ section, audited like any other, landing on main first — the next land then trusts\n\
  it). The candidate's copy of the section is IGNORED for EXECUTION, and a difference\
  \ between the\ncandidate's and the base's floor commands is REPORTED — a report-only\
  \ WARN naming the keys, never a\nrefusal — so a legitimate floor change stays visible\
  \ rather than being silently dropped.\nTHE PROGRAM'S BYTES, NOT ONLY ITS NAME. Reading\
  \ the command STRING from the base settles WHICH\nprogram runs; it does not settle\
  \ WHOSE BYTES that program is — the floor runs the command with the\nCANDIDATE worktree\
  \ as its working directory, so a base-declared `./scripts/audit.sh` would still\n\
  execute the candidate's copy of that script, reaching the rejected option C by a\
  \ second route. So a\nfloor-declared program named by a PATH that resolves INSIDE\
  \ the repo is MATERIALIZED FROM THE BASE\n— its bytes read out of the merge-base\
  \ into a temp file outside the worktree, and THAT is what\nruns. A path absent from\
  \ the base is a REFUSAL, never a fallback to the candidate's copy: land the\nscript\
  \ on main through its own reviewed card first. A bare program NAME is a `PATH` lookup\
  \ — host\ntooling, not candidate-authored — and passes through unchanged.\nRESIDUAL,\
  \ STATED RATHER THAN HIDDEN: a trusted-base script may itself invoke an in-repo\
  \ target\n(`python3./tool.py`) and so reach candidate bytes. That reach is decided\
  \ by BASE-REVIEWED code —\na candidate branch cannot introduce it — which is the\
  \ same boundary `verify.layers` holds and is\nprecisely what «lands through its\
  \ OWN reviewed path» buys.\nBOUNDED, so the rule is not read wider than it is. Only\
  \ the EXECUTABLE is base-read. Everything in\nthe section that is NOT a command\
  \ still reads from the CANDIDATE, because reading it there can only\never TIGHTEN:\
  \ the rule-4a declaration refusals (a candidate declaring a waiver is refused on\
  \ its own\nbranch), the REQUIREMENT that a repo carrying a dependency manifest declare\n\
  `verify.floor.dependencies.command` (so the bootstrap card that first declares the\
  \ command\nsatisfies its own duty and lands — its command then runs from the NEXT\
  \ land, exactly the flow\nabove), and the probe knobs. An UNREADABLE base trusts\
  \ NOTHING and says so; it never silently\npasses a command that merely looked declared.\n\
  CWD IS THE CONTRACT, AND A BROKEN LEG IS REPAIRED BY A LAND THAT ALTERS IT (X-1486).\
  \ A\nmaterialized program runs from OUTSIDE the repo with the worktree root as cwd,\
  \ so a script may\nanchor on cwd and never on its own path (`$0`-anchoring resolves\
  \ outside the repo and mounts the\nwrong tree into a container); a failing materialized\
  \ program is refused WITH that contract named.\nAnd because the base's program runs\
  \ on every branch including the one repairing it, a failing base\nleg is given a\
  \ NAMED exit rather than an emergency lane: a land whose candidate ALTERS the failing\n\
  leg (its bytes, or its command string with the replacement program present) has\
  \ that atom's\nexecution SKIPPED once — the candidate's bytes are never run on this\
  \ land; the NEXT land runs the\nrepaired program from main — recorded as `floor_repair`\
  \ on the land row and admitted at the\nwork-batch gate under the `floor-repair`\
  \ carrier. A candidate that leaves the failing leg untouched\nis refused as before.\
  \ The SHAPE (both predicates and their bounds) is SPEC-0093 rule 27.\nWHY A TRUSTED\
  \ BASE AND NOT A SANDBOX: `shell=False` plus a scrubbed child environment (retained,\n\
  as defence in depth) remove shell SYNTAX and the launching session's identity carriers,\
  \ but the\ncandidate still NAMES the program — so a collaborator branch could still\
  \ have the kernel run an\narbitrary networked executable at land. An execution sandbox\
  \ and trusting candidate-authored\nscripts were BOTH considered and REJECTED by\
  \ the same ruling: the sandbox is a platform this\nmethodology does not want to\
  \ own (CHARTER §P1 F1/F3), and trusting the candidate is the weakness\nitself. Reusing\
  \ the merge-base read the layer-identity check already performs adds no new\nmechanism.\n\
  \n### 4c. A BRANCH-WRITTEN JOURNAL ROW has a governed route out — `journal redact`\
  \ (X-1507)\nRule 4a makes the secrets atom unwaivable and scans the branch's ADDED\
  \ lines with NO path\nexclusion, and `events.jsonl` (with its `archive/events-*.jsonl`\
  \ segments) is one of those paths.\nSo a row THIS BRANCH WROTE carrying a credential-shaped\
  \ token had NO route out at all: the journal\nis append-only, the floor cannot be\
  \ waived, a project `verify.floor.<atom>.command` is ADDITIVE\nonly, and the land-seam\
  \ rotation writes a NEW archive file every line of which is diff-added. The\nmeasured\
  \ consequence (<project>, 2026-09-19) is a DONE card with a GREEN audit-post that\n\
  cannot land, with its whole plan chain behind it, and a refusal sentence — «remove\
  \ it and rotate\nit» — that is not performable on an append-only row. This rule\
  \ gives that row one narrow verb.\n\nTHE ROUTE. `bin/yitc-v2 journal redact --ts\
  \ <row-ts> --atom <floor-atom> [--path <segment>]\n[--line <n>]` replaces the matched\
  \ token(s) IN THAT ROW with `<redacted:<atom>:<rid>>` and appends\nexactly ONE `journal_redacted`\
  \ receipt carrying `{ts_redacted, atom, path, line, label,\nredaction_id, redacted_sha256,\
  \ actor, source}` — the LAST of which is the journal envelope's own\nemitter marker\
  \ every governed row carries, named here so the normative list and the exact-key\
  \ probe\ndescribe ONE receipt — so the redaction is itself journaled and no history\
  \ is\nrewritten unrecorded. `ts_redacted` is the REDACTED ROW's `ts` (the envelope\
  \ `ts` is already the\ntime of the redaction). Rotating the credential at its source\
  \ remains the operator's duty: this\nverb unwedges the land, it does not make a\
  \ leaked credential safe.\n\nTHE `rid` IS RANDOM, NEVER SECRET-DERIVED. An unkeyed\
  \ digest of a low-entropy password is an\noffline guessing oracle, and a keyed one\
  \ would need a key store — a new mechanism. The `rid` is\nthe stable handle joining\
  \ the placeholder to its receipt; `redacted_sha256` digests the FULLY\nREDACTED\
  \ line, which already carries the placeholder in place of the credential and therefore\n\
  leaks nothing about the token. THIS ROUTE PERSISTS NO SECRET-DERIVED MATERIAL (the\
  \ write-time\nredaction's one scoped exception, for high-entropy token shapes only,\
  \ is rule 4e).\n\nTHE ORDER IS RECEIPT-BEFORE-REWRITE, and that is the whole failure-atomicity\
  \ argument. Two files\nand a non-re-entrant journal lock mean no single critical\
  \ section can span both, so the two\norderings are judged by what a CRASH BETWEEN\
  \ THEM leaves. Rewrite-then-receipt leaves REWRITTEN\nHISTORY WITH NO RECORD — silent,\
  \ irreversible, the governance failure. Receipt-then-rewrite leaves\na RECORD OF\
  \ A REDACTION THAT DID NOT HAPPEN — the credential still in the row, the floor still\n\
  refusing it, and the state SELF-CORRECTING. Only the second is fail-closed.\n\n\
  THE ORPHAN-RECEIPT READER — the verb CONSUMES the signal its own ordering creates.\
  \ An ORPHAN is,\nmechanically, a `journal_redacted` receipt whose row does NOT carry\
  \ that receipt's PLACEHOLDER —\ndetectable by anyone from the bytes alone, with\
  \ no second store, no new event type and no\nrecovery file. THE PLACEHOLDER, not\
  \ the bare `redaction_id`: an id is eight hex characters, and a\nraw substring test\
  \ for it matches any row that happens to CONTAIN them — a replacement\ncredential,\
  \ an unrelated ticket reference — so a false «already complete» would SUPPRESS recovery\n\
  and the ordinary path would append a second receipt. The placeholder is what a redaction\
  \ actually\nwrites. AND THE PLACEHOLDER ALONE IS STILL NOT THE COMPLETION: because\
  \ completeness is asked of\nthe whole `ts` population (next paragraph) and a `ts`\
  \ is not a row id, a DIFFERENT same-ts row\nthat merely CARRIES the marker — it\
  \ quotes a refusal, an operator pasted it, a redaction of its\nown collided on the\
  \ id — would answer «already complete» for a row still holding its credential.\n\
  COMPLETION IS THEREFORE THE CONJUNCTION: one row carrying the placeholder AND reproducing\
  \ the\nreceipt's recorded `redacted_sha256`, the digest of the exact bytes the rewrite\
  \ was to leave\nbehind — already recorded, and already the identity the completion\
  \ path judges candidates by. A\nreceipt that records no digest can prove no completion,\
  \ so it reads as an orphan and is refused\nby name with nothing written, never fallen\
  \ through to a second receipt.\nAND THE COMPLETENESS QUESTION IS ASKED OF THE WHOLE\
  \ `ts` POPULATION, never of a pinned\nsubset: a receipt is keyed `(ts, atom)` while\
  \ a `ts` is NOT a row id, so judging one against a\n`--path`/`--line`-narrowed candidate\
  \ set asks «is this receipt complete HERE» and answers\n«orphan» whenever the operator\
  \ pinned a DIFFERENT row sharing the ts — which then completes row\nA's receipt\
  \ onto row B, leaving ONE receipt apparently governing TWO rows. The pinned set\
  \ still\ndecides what an invocation OPERATES on; only completeness is asked of everything\
  \ the receipt\ncould describe. On EVERY invocation, BEFORE any write, the verb looks\
  \ for one. Finding\nit, it COMPLETES that redaction under the SAME receipt (reusing\
  \ its `redaction_id`, appending NO\nsecond receipt — a second one would be a contradictory\
  \ attestation, which is the failure this\nreader closes) and otherwise REFUSES BY\
  \ NAME with nothing written. The completion needs no record\nof its own, because\
  \ it makes the EXISTING record true, and that truth is checkable from the bytes.\n\
  \nTHE TWO HORIZONS ARE DIFFERENT, and the asymmetry is load-bearing. ROW discovery\
  \ reads the\nsegments overlapping the row's own UTC date ± one day of skew margin.\
  \ RECEIPT discovery reads from\nits floor THROUGH NOW, with NO upper bound: a receipt\
  \ is written when the redaction RUNS, which\nmay be weeks after the row's date,\
  \ and it may itself have rotated into a LATER-dated archive.\nTHE RECEIPT FLOOR\
  \ IS `min(row-date, today) − skew`, NOT the row's date. «A receipt cannot predate\n\
  its row» is FALSE: an envelope `ts` is written by its emitter and may be FUTURE-dated,\
  \ while the\nreceipt is written at a real wall-clock instant — so a future-dated\
  \ row rotates into a\nfuture-labelled archive while its receipt rotates into TODAY's,\
  \ and a floor taken from the row's\ndate would skip today's archive, miss the receipt,\
  \ and let the rerun append a SECOND one over a\nlive orphan. The `min` is sound\
  \ because a redaction cannot have RUN in the future, and it stays\nbounded: for\
  \ an ordinary past-dated row the two floors coincide exactly. Both horizons use\
  \ the\nSPEC-0190 rule-4 bounded segment resolver; neither walks the whole history.\
  \ Rotation is therefore\nRESOLVED, not special-cased, on both sides.\n\nTHE FOUR\
  \ ORPHAN REFUSALS, each naming the orphaned `redaction_id`, each writing nothing:\
  \ ROW GONE\n(no candidate row resolves — deleted, or rotated away and unresolvable);\
  \ NOT REWRITABLE (the row\nresolves but is on `main` / not provably branch-written);\
  \ ROW NO LONGER THE RECORDED ROW (no\ncandidate reproduces `redacted_sha256`); AMBIGUOUS\
  \ (more than one candidate reproduces it — pin\nwith `--path` / `--line`). In every\
  \ one, refusal is the CORRECT outcome: an orphan the verb cannot\ncomplete is a\
  \ contradiction a human must read (CHARTER §Principle 7), and writing a fresh receipt\n\
  over it would bury it.\n\nTHE WHOLE OPERATION IS SERIALIZED by a dedicated redaction\
  \ lock — a THIRD caller of the same\ndiscriminated sidecar primitive the trail lock\
  \ introduced (`events.redact_lock`), over the same\nLOGICAL journal (rule 1 of SPEC-0190),\
  \ on its own inode. Ordering is fixed and acyclic: the\nredaction lock is always\
  \ taken FIRST and the journal lock only INSIDE it. The window held is the\nwhole\
  \ operation — orphan lookup, read, receipt, rewrite — which is what makes «at most\
  \ one receipt\nper row» an invariant rather than a hope.\n\nPROVENANCE IS LOGICAL,\
  \ NOT PATH-LOCAL. A branch that ROTATES the journal writes a brand-new\n`archive/events-<date>.jsonl`\
  \ every line of which is diff-ADDED, so a path-local added-line test\nalone would\
  \ call a row that has been on `main` for weeks \"branch-written\". The admission\
  \ predicate\ntherefore ALSO requires the row's exact bytes to be ABSENT from `main`'s\
  \ LOGICAL journal at the\nmerge-base — read through the rule-4b revision segment\
  \ resolver, never a literal\n`git show <rev>:events.jsonl`, which sees the live\
  \ segment alone after rotation. A row whose bytes\nare on `main` is `main`'s row\
  \ however the branch re-addresses it.\n\nAND THAT PREDICATE IS FAIL-CLOSED IN THE\
  \ ONE DIRECTION THAT MATTERS. It answers on-main /\nnot-on-main / UNANSWERABLE,\
  \ and the caller reads UNANSWERABLE as ON MAIN, which refuses. The\nanswer that\
  \ ADMITS a rewrite is returned ONLY after the merge-base revision RESOLVED, its\
  \ segment\nset ENUMERATED without error, and every enumerated segment READ WHOLE\
  \ — because «not found» is an\nabsence claim, and an absence claim over a partially-read\
  \ history is exactly the false green this\npredicate exists to prevent. FIVE distinct\
  \ faults are therefore detected rather than inherited:\n(i) the shared rule-4b resolver\
  \ DEGRADES to the live path alone on a git fault of its own — right\nfor a reader\
  \ that FOLDS, wrong for one that must tell «the row is not in this history» from\
  \ «this\nhistory could not be read», so the enumeration's own failure is witnessed\
  \ and makes the whole\nanswer unanswerable; (ii) an enumerated segment that will\
  \ not read answers unanswerable, never\n«absent»; and (iii) that unreadability is\
  \ memoized as ITS OWN SENTINEL, never as an empty\nsuccessful read — a cache entry\
  \ that conflated the two made a first call's failure invisible to\nevery later call\
  \ sharing the memo, which is a fail-open with no visible cause at all; and (iv)\n\
  «WOULD NOT READ» IS NOT «ABSENT» FOR THE LIVE JOURNAL EITHER. The resolver appends\
  \ the live\n`events.jsonl` UNCONDITIONALLY whether or not it exists at the revision,\
  \ so — unlike an\nenumerated archive — its absence there is an ordinary fact the\
  \ predicate continues past. EXISTENCE\nIS THEREFORE SETTLED FIRST: a live journal\
  \ that EXISTS at the merge-base and merely fails to READ\nis unanswerable, while\
  \ one genuinely not in that tree still contributes nothing. The settle\nDISCRIMINATES;\
  \ it does not blanket-refuse. AND (v) THAT SETTLE IS AN ENUMERATION WHOSE SUCCESSFUL\n\
  EMPTY RESULT PROVES ABSENCE — NEVER AN EXIT CODE. An exit-code existence test\n\
  (`git cat-file -e <rev>:<rel>`) cannot carry this decision, and that is not a style\
  \ preference: its\nnon-zero exit means BOTH «the path is not in that tree» AND «that\
  \ object could not be read», which\nare exactly the two answers this limb must tell\
  \ apart, so a Git object-database / I/O fault took\nthe absent limb and returned\
  \ «not on main» — REDACTABLE — for a main-owned row. Resolving the\nREVISION separately\
  \ does not close it either, because the revision is already resolved here; the\n\
  residual ambiguity is path-absent vs object-unreadable AT a resolvable revision.\
  \ The settle\ntherefore ENUMERATES the tree path (`git ls-tree`, which reads the\
  \ TREE OBJECTS and not the blob —\nthe same enumeration the rule-4b resolver already\
  \ uses for the archive side) and reads it\nthree-valued: a run that could not START\
  \ or exited non-zero is the ENUMERATION FAILING, so the\nanswer is UNANSWERABLE;\
  \ a successful run that NAMES something at that path proves the entry is\nthere,\
  \ so the failed read is a READ FAULT and the answer is UNANSWERABLE; only a SUCCESSFUL\
  \ run\nthat named NOTHING proves absence. THE GENERAL RULE THIS INSTANCE CARRIES:\
  \ every fault — a failed\nenumeration, a failed object read, a read that could not\
  \ be RUN AT ALL — answers UNKNOWN, and a\nfault is NEVER memoized as an empty successful\
  \ read, on this limb exactly as on (iii)'s.\n\nEVERY READ THIS VERB MAKES IS FAIL-CLOSED\
  \ ON THE SAME TERMS. A journal segment that will not open\nor decode is a NAMED\
  \ REFUSAL with nothing rewritten — never a silently empty one. Each of this\nverb's\
  \ reads is deciding something about ABSENCE (is there another candidate\nrow? is\
  \ there a prior receipt?), so a segment silently read as empty hides exactly the\
  \ row that\nwould have changed the decision, and a rerun could append a SECOND receipt\
  \ over an orphan sitting\nin a segment nobody could open. A file that does not EXIST\
  \ is an ordinary fact, not a failure:\nthe segment resolver returns the live segment\
  \ whether or not it is on disk.\n\nAND THAT REFUSAL STATES WHAT IS TRUE OF **THIS**\
  \ RUN, because the verb's body CROSSES the receipt\nappend partway through. Before\
  \ the crossing, nothing was appended and nothing was rewritten, and\nthe refusal\
  \ says so. AFTER it — the read that fails is the rewrite's own — the receipt IS\
  \ on disk\nand only the rewrite is missing, so the refusal names the ORPHANED `redaction_id`\
  \ instead: a\nblanket «nothing was appended» there would be a false attestation\
  \ about the verb's own writes,\nsending the operator to look for a receipt it told\
  \ them was not there and burying the orphan the\nreader would otherwise complete.\
  \ Both renderings are the same fail-closed outcome (the credential\nstays in the\
  \ row and the floor keeps refusing it); only the claim differs, and it differs because\n\
  the facts do.\n\nTHE SCOPE BOUND, fail-closed, every check BEFORE one byte is written.\
  \ The verb REFUSES: a row\nalready on `main` (**`main` is NEVER rewritten**); a\
  \ row the named atom does not match (which is\nalso the idempotent outcome of re-running\
  \ a completed redaction); a NON-journal `--path` (it\ntouches ONLY `events.jsonl`\
  \ and its archive segments, never a source file); a run outside a\nwriting worktree;\
  \ an ambiguous `--ts`, naming every candidate; an atom that names no token shape\n\
  (`dependencies` / `probes`); a match whose removable span cannot be determined (a\
  \ private-key\nheader with no matching END marker on the line — removing the header\
  \ while leaving the key body\nwould disarm the floor over live key material); and\
  \ a redaction that would stop the row parsing as\na valid event line. A redacted\
  \ row still parses as a valid event line.\n\nTHE FLOOR AND THE VERB SHARE ONE ADMISSION\
  \ PREDICATE, so the floor can never recommend a route the\nverb refuses. The refusal\
  \ text names `journal redact` in EXACTLY ONE rendering — the one where the\noffending\
  \ path is a journal path AND the verb would ADMIT the row. A SOURCE path keeps rule\
  \ 4a's\nwording unchanged and does not mention the verb. A journal row that is NOT\
  \ provably\nbranch-written — on `main` at the merge-base, rotated, or with unresolvable\
  \ added-line provenance\n— ALSO keeps rule 4a's wording, byte-for-byte, and does\
  \ not mention the verb EITHER, not even to\nsay it does not apply: a reader must\
  \ not have to work out that the route printed beside a refusal\nis one they cannot\
  \ take. It gains one honest clause that names NO verb — this row is not this\nbranch's,\
  \ no branch-side redaction route reaches it, `main` is never rewritten, and the\
  \ route for\na row whose bytes ARE on `main` is rule 4d's named allowlist entry\
  \ (after rotating the credential).\nSo the surface never implies that «remove and\n\
  rotate» is performable on a row nobody can edit, and never offers a verb that would\
  \ refuse.\n\nREJECTED ALTERNATIVE, recorded so it is not re-proposed: EXCLUDING\
  \ journal paths from the floor.\nIt would hide a REAL leak written into the journal,\
  \ which is the one failure a credential floor\nmay not have.\n\nRESIDUAL, STATED\
  \ RATHER THAN HIDDEN (Controller ceiling decision, accepted 2026-09-20,\nfp1:9402b694b343ab5b):\
  \ an orphan receipt's identity cannot distinguish two pre-redaction rows that\n\
  differ ONLY INSIDE the removed secret span, because any identity that could would\
  \ be a function of\nthe secret — which the no-secret-derived-material bound above\
  \ forbids. The consequence is bounded:\nthe only row a mis-bound recovery can touch\
  \ is one that ALSO carries a credential-shaped token at\nthe same span, so the outcome\
  \ is a redaction of a secret under an imprecise receipt, never an\nun-redacted secret\
  \ and never a rewritten non-secret. Every mismatch OUTSIDE the span (path-class,\n\
  line, label, prefix, suffix, digest) still refuses. A SECOND residual, inherited\
  \ from rule 4a's\nown scope: under the `shared-repo-floor` lens a row on `main`\
  \ can arm the floor while this verb\nrefuses it — `main` is never rewritten, the\
  \ floor's remedy is CONDITIONED so it never recommends\nthe verb there, and rule\
  \ 4d is its route.\n\n### 4d. A MAIN-OWNED JOURNAL ROW is admitted ONLY by a named,\
  \ reasoned allowlist entry\nOwner ruling 2026-09-27 (OWNER-ITEMS O8, option A —\
  \ the ACCEPTED RESIDUAL). Under the\n`shared-repo-floor` lens a credential-shaped\
  \ row ALREADY on `main` refuses EVERY land and rule 4c\ncannot reach it, so without\
  \ this rule it is a permanent wedge. The admission is deliberately\nNARROW, and\
  \ every narrowing is load-bearing:\n- JOURNAL PATHS ONLY (the `_floor_is_journal_path`\
  \ predicate). A source file never consults the\n  list: a credential in a source\
  \ file can be removed, a journal row cannot.\n- EXACT ROW, never a path or a pattern.\
  \ An entry names the row by the sha256 of its bytes as\n  scanned; a different row\
  \ carrying the same credential is not admitted.\n- ON `main` AT THE MERGE-BASE,\
  \ proven by rule 4c's own byte-identity predicate\n  (`_floor_journal_row_on_main`\
  \ returning True — uncertainty is NOT on-main here). A row the land\n  ADDS is never\
  \ admitted, whatever the list says, and keeps rule 4c's `journal redact` route.\n\
  - WELL-FORMED OR IGNORED. Each entry carries `sha256` (64 hex), `reason` and `rotation`\
  \ (non-empty\n  strings — the rotation note says the exposed credential was rotated,\
  \ or why not) and `date` (a\n  valid `YYYY-MM-DD`). An entry missing or blanking\
  \ any of them is MALFORMED, admits nothing, and\n  is named in the refusal. The\
  \ carrier is SPEC-0093 rule 27's `verify.floor.secrets.journal_allowlist`.\nThe\
  \ unlisted refusal names this route and the row's hash, and says to ROTATE first.\
  \ This is NOT a\nwaiver of the atom (rule 4a / the declaration refusal are unchanged):\
  \ the scan still runs over\nevery other row, and an admitted row cannot hide another\
  \ — admitted rows are set aside BEFORE the\nper-file de-duplication. The list is\
  \ read from the CANDIDATE carrier (a trusted-base read would\nmake the first entry\
  \ unlandable behind the very refusal it lifts); every entry is therefore\nauthored\
  \ content in the branch diff, visible to its audit.\n\n### 4e. The credential never\
  \ reaches the journal or the bootstrap commit in the first place\nRules 4a-4d act\
  \ at the LAND, after a row exists. Two earlier seams close the path a pasted\ncredential\
  \ took on a newcomer's repo (owner chat -> `owner_directive.data.text` -> `init`'s\n\
  bootstrap commit, which is not a land and so meets no floor):\n- WRITE-TIME REDACTION.\
  \ Every journal row written through the host write path (`_append_event` —\n  the\
  \ CLI verbs and the transcript adapter alike) has every string its `data` serializes\
  \ — values\n  AND keys, through dicts, lists and tuples — passed through the rule-4a\
  \ shapes, REUSED, never forked: a template token is spared by the same\n  interpolation\
  \ opt-out, and the removed material is rule 4c's span (a URL's password group; a\n\
  \  PEM block BEGIN..END, and with no END marker in the string, through end-of-string,\
  \ since a\n  write is never refused). Each removal becomes `<redacted:secrets:<rid>>`.\
  \ The transcript\n  adapter redacts BEFORE the SPEC-0002 text cap, so a cap never\
  \ keeps a partial token. A payload\n  with no shape is stored byte-identical. This\
  \ is the one exception wherever the journal promises\n  an owner's words verbatim\
  \ (SPEC-0002 §Size cap); a mid-turn `owner_text` is proven against the\n  unredacted\
  \ transcript entry BEFORE the write, then stored redacted.\n- THE `rid` CARRIES\
  \ A SHORT DIGEST ONLY WHERE IT IS NO ORACLE. For a self-delimiting token shape\n\
  \  (every shape without a `secret` group) the rid is `sha256-` plus the first 12\
  \ hex of the removed\n  value's sha256: such tokens are long random strings, so\
  \ guessing cannot invert the digest, and\n  it lets equal redactions be matched\
  \ against a known credential when rotating. A shape whose\n  credential is a `secret`\
  \ GROUP (the PostgreSQL URL password, as short as 6 characters) gets rid\n  `unhashed`:\
  \ a digest of a low-entropy password is the guessing oracle rule 4c refuses to\n\
  \  persist. A removal merging spans of both kinds is `unhashed`.\n- THE BOOTSTRAP\
  \ COMMIT IS SCANNED. `init`'s one-time direct-to-`main` bootstrap commit runs the\n\
  \  rule-4a shapes over the ADDED lines of the STAGED diff before committing — the\
  \ WHOLE index,\n  because that commit takes no pathspec, so the staged diff IS its\
  \ snapshot. A hit refuses: no\n  commit, no host-registry registration, exit 1,\
  \ each `file:line` and shape named, the value never\n  printed. A staged diff that\
  \ cannot be read refuses the same way (fail-closed). The refused\n  scaffolds stay\
  \ staged, and a re-run commits them once the scan is clean (the born ops contract\n\
  \  still staged against HEAD is the derived signal that the bootstrap never reached\
  \ `main`).\nNeither seam replaces rotation: a redacted or refused credential was\
  \ still exposed where it was\ntyped, and rotating it stays the operator's duty.\n\
  \n### 5. The waiver is LOOSE — and it is what makes a dormant CI leftover VISIBLE\n\
  A project with no remote legitimately waives with a bare reason (the SPEC-0093 rule-6\
  \ clean\nunconditional-waive case: a project refusing a concern it genuinely does\
  \ not have). No compensating\ncontrol, no expiry — an un-synced local-only repo\
  \ hides no risk the kernel needs to age.\nBut the waiver is not a formality, because\
  \ it carries a CONSEQUENCE the project should read as it\nwrites it: **a waived\
  \ remote means every CI workflow in this repo is DORMANT.** CI runs on the far\n\
  side of a remote; with no remote there is no far side. So the act of waiving is\
  \ the moment a\nleftover workflow becomes legible as a leftover — which is precisely\
  \ the surface X-0346 lacked. A\nwaiver never converts a dormant workflow into coverage,\
  \ and it never silently satisfies anything:\nthere is nothing downstream for it\
  \ to satisfy (rule 4).\n\n### 6. Scope bound (honest +1 spec, +1 hook instance)\n\
  Exactly +1 spec + ONE new instance of the existing `_SHAPE_HOOKS` extension point.\
  \ NO new file,\nparser, node-type, edge, gate, verb, event, or hand-maintained list\
  \ (CHARTER §P1 F2/F5). The born\nsection, the sweep row, and the activation-checklist\
  \ row are GENERATED from the two declaration\nblocks at `graph build` (SPEC-0128\
  \ Rule 3 — \"author its spec with a `concern:` block. That is the\nWHOLE registration\"\
  ). This spec restates no per-surface rule: the carrier framework stays in\nSPEC-0093,\
  \ the checklist generator in SPEC-0096, the registry invariant in SPEC-0128.\n\n\
  ## Parameters\n\nNone `consumed`. A project's concrete remote / pusher / CI values\
  \ are project ops config on the\n`remote_sync` carrier (SPEC-0093 §Parameters),\
  \ never kernel-read governance scalars.\n\n## Rationale\n\nTwo real incidents, both\
  \ the X-0088 silent-born-waiver class (a stance nobody is forced to take is\ninvisible),\
  \ and both from the same week:\n- **<project> (commit 4e79f6498, 2026-07-12).**\
  \ Its post-v1 push path (`git push origin\n  main` — the v1 auto-pusher died at\
  \ quiesce, as designed), the pushing actor, and the CI role\n  (owner-decided: product-only\
  \ extra check, not the land gate) were all settled AD HOC inside one\n  migration\
  \ card and recorded only as a plan leftover-tail row. The decisions were sound;\
  \ the\n  problem is that no concern surface asked for them, so nothing keeps them\
  \ legible or re-asks them\n  of the next project.\n- **<project> (followup `fu_d7881b6b0864`,\
  \ 2026-07-11 → routed X-0346).** It carries\n  `.github/workflows/product-safety-guards.yml`\
  \ with NO git remote — a dormant CI leftover the B5\n  leftover-tail missed, found\
  \ only by an ad-hoc human read.\nClass prior-art: **X-0088** (a deploy-autonomy\
  \ born-waiver that \"never surfaced … discovered only\nbecause the owner asked\"\
  ) and **X-0313** (the operating-context stub), whose fix — /\nSPEC-0125 — is this\
  \ concern's direct structural precedent: register the concern, let the generated\n\
  surfaces do the rest. Prior-art REUSED (CHARTER §P1 F1 — extend, don't create):\
  \ the SPEC-0128\nconcern registry, the SPEC-0096 checklist generator, the SPEC-0093\
  \ carrier framework, and the\nexisting `_SHAPE_HOOKS` deep-shape extension point\
  \ (10 prior instances). Deliberation lives with the\nproposing task, not here (SPEC-0005\
  \ rule 3).\n\n## Verification\n\n- **state-check (AC1, differential):** the `remote_sync`\
  \ row renders into BOTH generated\n  activation-checklist views (Init-walk SET +\
  \ Doc-checklist) with `_activation_checklist_drift ==\n  []`; stripping this spec's\
  \ `init_concern` DROPS the row from both — proving derivation, not a hand\n  edit.\
  \ The row is ABSENT from the checklist before this change.\n- **state-check (AC2,\
  \ the three stances):** over REAL `-C init` runs — a consumer DECLARING\n  (remote+pusher+ci)\
  \ sweeps clean; one WAIVING (no remote) sweeps clean; a SILENT section (neither\n\
  \  key) FAILS CLOSED naming the section.\n- **state-check (rule 4, the hook is,\
  \ not inert):** a section declaring `remote:` while\n  omitting `pusher:`/`ci:`\
  \ FAILS CLOSED — the differential that separates the hook from the generic\n  stance\
  \ check.\n- **adoption (at activation, CHARTER §P8):** the concern round-trips from\
  \ this ONE declaration to\n  every generated surface (`concern-registry.json` +\
  \ `born-ops.yaml` + the checklist) with NO edit to\n  any hand-maintained list;\
  \ a fresh `-C init` surfaces it in the born-waiver sweep.\n"
