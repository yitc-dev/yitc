init_concern:
  init_question: Does this project SYNC to a git remote — and if so, WHICH remote
    (`remote:`), WHO pushes to it (`pusher:` — a real named identity, not a retired
    system's auto-pusher), and is CI LIVE on the far side and in what ROLE (`ci:`
    — a blocking GATE, or an extra check beside `verify.layers`)? Declare `remote_sync`
    (all three — they are one stance), or waive.
  waiver: 'A project with no git remote may bare-waive (LOOSE — a reason only; nothing
    to age, so no compensating control or expiry). But the waiver carries a consequence
    to read as you write it: with no remote, every CI workflow committed in this repo
    is DORMANT, never coverage — waiving is what makes such a leftover legible (X-0346).
    A waiver never converts a dormant workflow into coverage.'
  evidence: the project's `remote_sync` block in yitc-ops.yaml carrying all three
    parts (`remote:` + `pusher:` + `ci:`) and passing the fail-closed `-C init` sweep
    + the rule-4 completeness hook; or the named waiver recorded for the concern.
  recommended: 'If the project pushes to a git remote: declare `remote_sync` naming
    that remote, yourself as `pusher:`, and `ci:` none unless CI already runs there.
    If it has no remote yet: waive with reason "local-only repository".'
  record_at: '`yitc-ops.yaml` — the `remote_sync:` section: `remote:`, `pusher:` and
    `ci:`, or a `waiver: {reason: <why>}`.'
  tier: universal
