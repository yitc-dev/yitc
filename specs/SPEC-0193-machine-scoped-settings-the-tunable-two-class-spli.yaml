  - bin/lib/verify_runner.py#_verify_heartbeat_interval

body: |
  ## Scenario
  A machine runs slower or faster than the one the engine's defaults were written on, and its owner
  wants the engine to poll, beat and parallelise to suit it. They run `bin/yitc-v2 config list`, see
  every tunable with its CLASS, its effective value and — where the knob declares one — its
  admissible BAND, and `config set` the ones they may. Editing that file is not a repo change: it
  needs no worktree, no land and no lifecycle, because the values belong to the MACHINE and not to
  any checkout.

  THE BAND IS PART OF THE LISTING, not just of the refusal. A knob carrying `bounds=` is
  enforced at TWO doors — `set_value` refuses an out-of-range write, and the knob's own resolver
  ignores an out-of-range value and stands on the default — but before this the band was visible at
  NEITHER: the only way to learn it was to guess wrong and read the refusal text. `config list`
  therefore renders the band from the SAME `knob.bounds` tuple both doors read, so a listing can
  never state a band the doors do not enforce, and a knob with no declared band prints nothing
  rather than an empty column. This is a rendering obligation on the listing, not a new field: it
  adds no second source of truth for a band, and a knob's admissibility is unchanged by whether it
  is printed.

  What they may NOT do is tune a value that decides whether work PASSES. `config set` on such a value
  refuses, says why, and says that changing it is a task. There is no flag and no environment value
  that gets past that refusal, and hand-writing the key into the file does not work either — readers
  ignore it. So the answer to «why did this branch pass on your machine and abort on mine» can never
  be «because of a file nobody read».

  ## Internal
  RULE 1 — ONE INVENTORY. Every runtime tunable the engine reads — the `YITC_*` environment knobs and
  the hardcoded module constants of the same nature — is enumerated ONCE, in
  `machine_settings.INVENTORY`, and each entry carries exactly one class. A knob absent from the
  inventory is unclassified, and an unclassified knob is the thing nobody notices.

  RULE 2 — THREE CLASSES, MECHANICAL AND FAIL-CLOSED.
    PERFORMANCE — the value changes how FAST or how CONCURRENTLY work runs and can never change
                  whether it passes: parallelism, poll intervals, batch/page sizes, heartbeat cadence.
    BINDING — a LOCATOR the operator declares: WHICH external tool runs on THIS machine
                  (added by SPEC-0202 rule 1). It is neither cadence nor a threshold a refusal reads:
                  it changes WHO judges, never whether a judged thing passes. The class is a CLOSED
                  enumeration — today exactly `auditor.<tier>.provider|binary|home|model` for tier
                  `routine` | `full`, eight keys. Every other name under `auditor.*` —
                  `auditor.routine.effort` included — is unclassified and therefore GATE.
    GATE — the value participates in a pass/fail verdict: a verify/test timeout whose expiry
                  aborts a land, an audit timeout, any threshold a refusal reads.
  Anything that cannot be confidently classified is GATE. A dynamic PREFIX STEM names an open family
  and therefore cannot be classified at all — it is GATE.

  RULE 3 — THE FILE CARRIES PERFORMANCE- AND BINDING-CLASS VALUES ONLY, and lives OUTSIDE any repo
  checkout. Its
  path has ONE resolution site (`resolve_settings_path`): `YITC_MACHINE_SETTINGS` wins, else the file
  sits beside the shared coordination store, whose out-of-repo placement is already governed
  (SPEC-0084 rule 3). Deriving rather than restating means no second host-literal path exists to drift.

  RULE 4 — THE GATE REFUSAL IS HARD, ON BOTH SIDES. `set_value` REFUSES a gate-class key and writes
  nothing; `load`/`get_value` DROP a gate-class key that reached the file some other way. No bypass
  flag and no environment escape exists — `_refuse_gate` deliberately takes no override parameter,
  because a parameter there IS the second door. A governed write also removes inert non-performance
  keys the file was carrying, and reports what it removed.

  RULE 5 — THE ENTRYPOINT INVENTORY. Every supported way to reach the setter is DECLARED as data
  (`ENTRYPOINTS`), and each declared entrypoint is driven with a gate-class key by the verifier.
  Stated as an inventory on purpose: «no bypass exists» is an unfalsifiable universal negative,
  whereas an unenumerated entrypoint is a findable gap.

  RULE 6 — ABSENT-FILE FALLBACK. A missing, unreadable or malformed file contributes NO overrides:
  every reader observes its built-in default and nothing errors. The file is an OVERRIDE LAYER, never
  a prerequisite — no verb may come to require it.

  RULE 7 — PRECEDENCE AT A READ SITE: environment > machine file > built-in default. The environment
  layer stays the deterministic test seam; a file that could beat it would make that seam unreliable.

  RULE 8 — A GOVERNED SET IS JOURNALLED. `config set` emits `config_changed` carrying key + old + new
  (class), so a later reader asking why behaviour changed reads the journal rather than an mtime.

  ## Parameters
  None consumed from this spec — by construction. A governing scalar read out of a spec would be the
  very machine-independent/repo-coupled shape rules 2-4 exist to keep apart from the machine file.

  ## Rationale
  SPEC-0132 forbids making a gate load- or machine-dependent: the same branch must not pass on one
  host and abort on another. Owner directive 2026-09-02 makes the refusal HARD (no bypass flag, no
  environment escape) for the same reason — a bypass "for testing" is a bypass in production, and the
  verifier drives the refusal rather than evading it. The placement follows the shared coordination
  store (SPEC-0084 rule 3, `cross.resolve_log_path`), whose reasoning — the artifact belongs to the
  machine, not to a repo, so writing it is not a repo write — is exactly this file's. The entrypoint
  inventory shape is C1 of decisions/offserver-release-contract-concept-audit-adhoc.yaml.

  ## Verification
    bin/yitc-v2 config list # every knob: class, effective value, band
    bin/yitc-v2 config set YITC_AUDIT_TIMEOUT_SECONDS 900 # REFUSES (gate-class); writes nothing
    bin/yitc-v2 config set YITC_VENUE_STAGE6_WORKERS_FRACTION 1.5 # REFUSES (outside the 0.0..1.0
                                                            # band) — the two-door rule above, worked
                                                            # on the venue knob: the same
                                                            # tuple the listing renders is the one
                                                            # `set_value` refuses on and the one
                                                            # `remote_verify.venue_stage6_workers_
                                                            # fraction` ignores an out-of-range
                                                            # value against. A knob NAME appears here
                                                            # as a worked example only: rule 1 keeps
                                                            # the enumeration single-SoT in
                                                            # `machine_settings.INVENTORY`, so this
                                                            # section must never grow into a roster
                                                            # of knobs.
    python3 tests/test_config_inventory.py # rule 1 + rule 2 (differential)
    python3 tests/test_config_verb.py # rules 4, 5, 8 (entrypoint inventory)
    python3 tests/test_config_read_site.py # rules 6, 7 + the wired read site

