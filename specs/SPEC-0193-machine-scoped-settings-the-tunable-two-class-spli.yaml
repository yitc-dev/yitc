id: SPEC-0193
title: Machine-scoped settings — the tunable two-class split and the hard gate refusal

status: active
created_at:
travels: ~
consumed: false
extension: ~

implements:
  - bin/lib/machine_settings.py#INVENTORY
  - bin/lib/cli.py#cmd_config_list
  - bin/lib/machine_settings.py#ENTRYPOINTS
