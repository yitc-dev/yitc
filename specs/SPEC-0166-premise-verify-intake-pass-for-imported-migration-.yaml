body: |
  ## Scenario
  A brownfield onboarding re-files an existing backlog into v2 task cards — from ANY source (YITC v1, a
  different methodology like Jira/Linear/another framework, a vibe-coding TODO dump, or a hand-migrated
  list). Each imported card carries `imported_from: <source-ref>` (source-agnostic; set at import time).
  Before those cards can be dispatched, a
  cheap intake pass re-checks each card's PREMISE against today's code (the Stage-1 anti-reinvention
  grep, moved to the cheap intake moment) and marks it `premise: verified | already-done | stale`.
  Only a `premise: verified` card (or a card with no `imported_from:`) is dispatchable; `already-done`
  routes to `task update --status wont-do`, `stale` to `task update --status parked`, each carrying the
  finding (a `ready` imported card, so the in-progress-only `task close` is not the route). The
  owner sees: no imported card reaches a worker for a full 9-stage run on a premise that no longer holds.

  **WIDENED — the same cheap check, over ANY ready card, premise-only.** The pass above was
  admitted only for cards carrying `imported_from:`, so the check that is cheapest at intake was
  reachable only by a migration import. MEASURED (kernel, 2026-08-18..09-02): 64 dispatched workers
  refused pre-claim on a FALSE PREMISE — each a full worker bootstrap spent to learn what this
  deterministic classifier reads for free. `task intake --task`/`--all` therefore accepts ANY `ready`
  card and runs the SAME verifier writing the SAME `premise:` field. For a NON-imported card that is
  ALL it does — see the premise-only guard in §Internal. Nothing about the imported-card scenario
  above changes; this is an ADDITIVE case (SPEC-0005 rule 7 in-place amend), not a reshape.

  ## Internal
  - **Ownership split (single-source, gate-trial finding 4):** the FIELD SCHEMA
    (`imported_from:` string legacy-backlog ref; `premise:` enum `verified|already-done|stale`, absent
    on a non-imported card) is OWNED BY **SPEC-0028** (the task-schema spec, existing parser — no new
    store). THIS spec (SPEC-0166) owns the BEHAVIOR that CONSUMES those fields: the intake pass + the
    dispatchability rule below. It does not re-home the schema.
  - **Enum semantics (trial run 1 fold):** `verified` = premise still holds, dispatchable. `already-done`
    = the WHOLE card's outcome already exists in today's code. `stale` = the scope PARTIALLY matches /
    references a moved-or-retired subject → the card needs re-scoping, not closing.
  - **The pass is CODE-READ-ONLY but TASK-METADATA-MUTATING:** it reads product code without editing
    it, and writes `premise:` via the EXISTING `task update` governed route (no new mutation path).
    **Routes (trial run 1 fold — an imported card is `ready`, NOT in-progress, so `task close` (which
    is in-progress-only) is not reachable):** `already-done` → **`task update --status wont-do`** (the
    ready→terminal route aiseller actually used for the already-fixed); `stale` →
    **`task update --status parked`** (re-scope later). All via the existing `task update` verb.
  - **Dispatchability rule:** `dispatch` (and the picker) treat a card with `imported_from:` set AND
    `premise:` != `verified` as NOT-ready — refuse with the exact next step (run the intake pass).
    Derives ONLY from the two card fields (named carrier, existing parser, no gate ledger).
  - **Second, orthogonal cause on the SAME predicate ( — rule home SPEC-0133, not here):**
    `_premise_dispatch_block` also blocks a card carrying a PRE-CLAIM REFUSAL (`refused_at`, written
    by `task refuse`), checked BEFORE the premise arm because it is the more specific fact and it
    applies to EVERY card, not only imported ones. Extending this ONE predicate is deliberate: the
    claim gate, the dispatch preflight and the picker all derive their refusal from it and nowhere
    else, so a second cause reaches all three with no call site edited and cannot drift across them.
    THIS SPEC'S OWN RULE IS UNCHANGED — the premise arm above still derives only from
    `imported_from` / `premise`; the refusal arm's contract lives single-SoT in SPEC-0133 rule 2f.
  - EXTENDS SPEC-0133 (reactive pre-claim refusal) to the proactive intake seam — same
    anti-reinvention #5 discipline, one card-at-a-time analysis burn replaced by a cheap batch read.
  - **WIDENED SCOPE + THE PREMISE-ONLY GUARD (ad-hoc consult `pre-land-friction-premises`
    finding 2).** `task intake --task`/`--all` accepts ANY `ready` card, imported or not, and runs the
    SAME verifier writing the SAME `premise:` field. `imported_from:` is no longer an ADMISSION test —
    it selects the OUTCOME arm. For a card WITHOUT `imported_from:` the pass writes `premise:` and
    **NOTHING ELSE**:
      - **no imported-card transform and NO status write** — `PREMISE_STATUS_ROUTE` (already-done →
        wont-do, stale → parked) is consulted ONLY for an imported card. A non-imported card with a
        false premise is recorded `premise: stale` (or `already-done`) and **STAYS `ready`**. The
        reason the routing does not travel: an import census is a bulk re-file nobody has re-read, so
        a machine verdict disposing of those cards is the agreed design; a card someone filed by hand
        is not that, and a classifier verdict is EVIDENCE about it, never a disposition of it.
      - **no refusal and NO gate.** The dispatchability rule above is UNCHANGED: its premise arm stays
        scoped to `imported_from`, so a non-imported card is ALWAYS dispatchable whatever is recorded
        here — a recorded `premise:` on such a card can never block a claim, a dispatch or the picker.
      - **`dispatch` only REPORTS.** Its preflight emits ONE report-only line naming the cards in the
        wave that carry no `premise` record, **and still launches every one of them** — no `_die`, no
        filtering, no exit code moved (CHARTER non-goal #7: filing and dispatch are never blocked).
        The line is emitted AFTER the existing fail-closed refusals, so a genuine refusal is never
        buried under advice, and **on STDERR**: dispatch's STDOUT is a contracted surface (the terminal
        `DISPATCH: <VERDICT>` token, and the single-task output shape pinned as a full-output BYTE
        EQUALITY whose atom is that the common path must not move), so an advisory belongs on the
        diagnostic channel — the same split the land verify-heartbeat already uses. An advisory that
        moved a machine-readable contract would be a second cost, not a saving.
    **No new store, no new gate, no new FSM, and no enum change** — `premise` stays exactly
    `verified|already-done|stale` (owned by SPEC-0028). The whole widening is a relaxed predicate
    plus one guard, so the enumerated bounds above are what a reader must check when touching it.

  ## Rationale
  aiseller 2026-07-13: 85 imported cards in a day, 28/31 ready-queue citing v1 ids; (OTP oracle)
  already fixed in April burned a full pre-claim analysis; cited a script retired hours earlier.
  The pre-claim refusal (SPEC-0133) caught them REACTIVELY, expensively. Moving the check to intake is
  the same discipline at a cheaper moment. Full design + prior-art: plan
  `migration-import-safety-provenance-marker-premise-`. Origin cross X-0372.

  ## Verification
  Differential pinned test: a synthetic `imported_from:` card whose premise is stale is marked `stale`
  and REFUSED by dispatch; a verified one passes; a non-imported card is unaffected. Real-data soak:
  replay a slice of the aiseller import census; the pass flags the already-fixed class.

  Widening + premise-only guard — `tests/test_task_intake_any_ready.py`, three differential
  tripwires: (1) a NON-imported ready card takes `task intake --task` and the card is byte-identical
  apart from the added `premise:` line — the differential failing input is the same card gaining any
  status/stage/imported transform; (2) a non-imported card whose `premise-check:` names an absent site
  is recorded `premise: stale` and its status is still `ready`, with no `bg_dispatch_halted` — the
  failing input is intake mutating status; (3) `_resolve_dispatch_routing` over a wave holding one
  premise-less card prints the report line naming it AND returns routing for every task — the failing
  input is dispatch refusing or dropping a task on a missing premise.

