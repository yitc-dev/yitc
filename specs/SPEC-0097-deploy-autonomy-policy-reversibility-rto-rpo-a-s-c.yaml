    \     # [ $c -eq 0 ] && exit 0; { [ $c -eq 7 ] || [ $c -eq 28 ]; } && exit 1;\
    \ exit 2\"\n        # liveness_probe_budget_seconds: 10\n        # REPLACE <host>\
    \ and uncomment BOTH lines; never uncomment a placeholder verbatim.\n        #\
