init_concern:
  init_question: Does this project deploy AUTONOMOUSLY — the AI runs the governed
    `deploy` verb without an extra per-deploy owner approval, gated only when a change's
    worst case is not acceptably reversible within the project's RTO/RPO (the A/S/C1/C2
    classification)? Declare the `deploy.policy` block (its per-class evidence + any
    per-class waivers), or waive to stay owner-gated on every deploy.
  waiver: A project that does NOT deploy autonomously bare-waives — it stays in the
    pre-policy owner-gated mode (the AI asks the owner every deploy); a non-deploying
    project (no `deploy:` seam) waives for that reason. A declared-then-waived security-bearing
    Class-S requires a compensating control + an expiry (SPEC-0093 rule 6 / SPEC-0097
    §6).
  evidence: 'the project''s declared `deploy.policy` block in yitc-ops.yaml (declare-or-waive,
    SPEC-0093 rule 3) + the per-class deploy evidence at the seam — A: smoke + live-probe;
    S: the security live-probe; C1: a pg_dump + restore-drill + the delayed re-check;
    C2: an owner escalation, no autonomous deploy_completed (SPEC-0097 §5).'
  recommended: Waive for now — stay owner-gated, so the AI asks you before every deploy.
    Declare a `deploy.policy` later, once deploys are routine and each change class
    has its reversibility evidence.
  record_at: '`yitc-ops.yaml` — the `deploy.policy:` block: the policy, or a `waiver:
    {reason: <why>}` to stay owner-gated.'
  tier: universal
