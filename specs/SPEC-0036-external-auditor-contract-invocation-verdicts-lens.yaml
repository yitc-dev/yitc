  **`### DEFERRED BY DECLARATION` — the FAMILY-WIDE reading of every carve-out above.**
  The per-flag entries in the table each exempt an ABSENT proof, but each speaks about "that
  acceptance event" IN THE ABSTRACT. Nothing in the packet ever enumerated, in ONE place, WHICH
  criteria of THIS card are deferred and BY WHAT declaration — so handed a per-flag paragraph and an
  acceptance list in which two criteria both read "post-land", the auditor cannot map exemption to
  criterion and falls back on the criteria it CAN read. Measured: audit-post recorded
  `overlay_source: derived` with `post_ship_observation: true` and STILL RED-ed on AC2 and AC3
  COLLAPSED TOGETHER; its consult, which sees no overlay at all, held on the same. This is the SAME
  failure mode X-0837 proved once for a single flag («the exemption never said WHICH evidence it
  covered»); fixed it for `--land-emitted-event` ALONE and the fix was never generalized.
  This section generalizes it.

  A TASK `audit post` packet AND the ceiling-convergence CONSULT packet both render a
  `### DEFERRED BY DECLARATION — judge the declaration, not the absence` section, derived from the
  card ALONE (pure f(card); no store, no field, no flag, no new event type — CHARTER §P1 F1/F2). It
  enumerates each deferred CRITERION with the DECLARATION that defers it. THREE kinds, each reusing
  the one existing predicate rather than restating a grammar:
  - **post-ship-observation** — a grammar-valid, UNSETTLED `post_ship_observation:` (the same
    predicate the table entry and the debt lens read). A SETTLED declaration yields NO row: the proof
    exists, so nothing is deferred.
  - **land-emitted** — built ENTRY BY ENTRY so each name maps deterministically back to the criterion
    that defers it, but a candidate is admitted ONLY if `land_emitted_named_evidence` also returns it.
    That flat namer stays the TRUST-BOUNDARY oracle, so this rendering and the `_require_*` guard can
    never disagree about what the card named; the per-entry walk adds only the CRITERION.
  - **settle-probe-owed** — probe keys already recorded `deferred`, plus acceptance entries naming a
    SETTLE VERB (`--settle-probe` / `--settle-observation` / `--settle-evidence` / `task close
    --settle`) or the explicit `deferred until Stage 9` shape. Prose that merely says "later" matches
    nothing and yields no row — that emptiness is the differential.

  **How it binds, and how it does NOT.** The UNIVERSAL LENS carries a matching paragraph, appended
  ONLY when the section is actually rendered, making the section BINDING on the verdict class: for a
  criterion listed there the ABSENCE of its proof is EXPECTED and is NEVER a finding and NEVER a RED.
  The list is EXHAUSTIVE — a criterion NOT listed is judged exactly as usual, so the section widens
  nothing. What the auditor STILL judges is the DECLARATION: whether it corresponds to the criterion
  it defers, and whether it is dated/tracked. A deferral naming no reading, no due date and no settle
  carrier IS a finding — the section is not a blanket «my proof is in the future» excuse and says so
  in its own text.

  **Scope.** Audit-POST and CONSULT only; audit-PRE renders nothing (a pre-audit judges a plan, not
  absent evidence), matching the family's own `--task audit-post only` scoping. INERT by construction
  — a card that declares nothing renders no section and gets an unchanged lens. RETIREMENT (§P1 F3):
  the consult's single-kind post-ship-observation block is SUBSUMED and removed — it rendered
  one of these three kinds, leaving the consult blind to the other two.

  **`### DEFERRED PROBES — settled after landing by the Controller` — the FILING-TIME declaration,
  read at BOTH task stage overlays.** The section above is audit-POST-only, and its
  three kinds are all written at CLOSE. That leaves the shape whose proof is IMPOSSIBLE before the
  land by its own wording — an acceptance criterion whose probe is a FIRST REAL USE AFTER LANDING —
  invisible to BOTH audits at the moment they judge it. Measured, one day, this repo: on 2026-09-10
  six such cards were RED-flagged on exactly that criterion ( audit-pre RED x2 → ceiling same / audit-post RED audit-post RED x2 → ceiling
  warned), for a finding that is never a defect. Two of the six were audit-PRE, which the section
  above does not reach at all.

  A TASK `audit pre` AND `audit post` packet both render a
  `### DEFERRED PROBES — settled after landing by the Controller` section, derived from the card
  ALONE — pure f(card); no store, no new field, no flag, no new event type (CHARTER §P1 F1/F2). Its
  ONE source is the card's `probe_moments:` (schema home SPEC-0028), the carrier SPEC-0060 requires
  such a criterion to declare AT FILING. It enumerates each declared CRITERION with its AWAITED
  MOMENT, and tells the auditor that the absence of that proof pre-land is the DECLARED ORDERING,
  never a defect.

  **TWO admission conditions, both required; either failing drops the entry silently.**
  - **GRAMMAR** — the moment parses under the ONE existing grammar home (an ISO `due_by` date, or an
    `awaits:` ref `` / `X-0042` / `events.jsonl#type=<t>[@after=<ISO>]`). A moment no reader
    can decide declares nothing.
  - **NAMESPACE** — the key names a criterion THIS CARD'S OWN ACCEPTANCE declares. Without this an
    orphan key (`probe_moments: {AC99:...}` on a card with no AC99) would let a card exempt a
    criterion it does not have, and the parse floor below would refuse a RED naming AC99 instead of
    recording it. A card whose acceptance names no parseable criterion ids yields NO rows.

  **The RED parse floor — the ENFORCED half (the shape, reused).** A RED whose ONLY findings
  are P8-adoption-class AND every one of which names, by the SPEC-0204 rule-1 key precedence, a
  criterion this card DECLARED deferred is REFUSED at the parse floor: no verdict recorded, no pass
  spent, so re-running costs nothing. It sits inside the SAME narrowing as its sibling floors
  (`target_kind == "task"`, a genuine auditor response), and the refusal is the USE SITE's — the
  predicate is pure and judges only shape.

  **How it binds, and how it does NOT.** «EVERY finding», not «any», is the whole safety of it: a RED
  that raises a real defect ALONGSIDE a P8-adoption remark is recorded exactly as before, and a
  P8-adoption finding against an UNDECLARED criterion is judged exactly as today. The section is
  EXHAUSTIVE — a criterion not listed is judged as usual, so it widens nothing. What the auditor
  STILL judges is the DECLARATION: whether it corresponds to the criterion it defers, and whether its
  moment is machine-resolvable. INERT by construction: a card declaring nothing renders no section
  and gets an unchanged lens.

  **Why this is not a fourth kind of the section above.** That section is audit-POST-only by its own
  scoping rule and reads three close-time sources; this one is filing-time, reads a fourth source
  those three do not (`probe_moments`), and must reach audit-PRE — where two of the six measured
  incidents happened. In practice they do not overlap: a filed-but-unclosed card carries
  `probe_moments` and no `probes:`, so the same criterion is not rendered twice.

  **MACHINE-REFUTED P8-adoption finding on a NON-infra card — the second admissible class
  of the machine-refutation seam.** CHARTER §8 (Adoption Verification Strength) binds
  INFRA-class work only; Principle-3 probe evidence governs a product / feature card, and the packet
  readiness block already prints `P8 carrier: n/a (class <x>)` on every non-infra card. So a finding
  whose class is P8-adoption / `adoption-gap` («no consumer_read_evidence / live_trigger_evidence /
  blocking adoption follow-up») on a card whose `class` is NOT `infra` is machine-decidable, and the
  engine RECORDS it `machine_refuted: true` with a `machine_refutation` evidence dict
  (`kind: p8-adoption-on-non-infra`, the card's `task_class`, the reason «CHARTER §8 binds infra-class
  only; packet readiness: P8 carrier n/a», `charter_ref`, `checked_at`, the policy string) — the
  finding's own text is never edited. The class is read BOTH from the SPEC-0204 rule-1 structured
  `class_id` slot (`P8-adoption` or the auditor-spelled `adoption-gap`) AND from prose naming the P8
  evidence types / the principle over EVERY prose field (the measured pass-2 finding,
  fp1:04687d12731e4141, carried its claim in `failing_input`, which the `finding_class` sniff does
  not read); the prose arm reads ONLY the §8 carrier vocabulary — the P8 evidence types
  (consumer_read_evidence / live_trigger_evidence) or the principle itself (P8 / Principle 8 /
  CHARTER §8): it never admits the bare `adopt` token, so a correctness finding that merely says
  «adopts» is never touched, and it never admits a generic «no adoption evidence / probe» complaint
  against the card's OWN criterion either — that is a Principle-3 probe complaint about a deferred
  probe, judged by the declared-deferred floor (declared → refused at the parse floor;
  undeclared / orphan → the RED stands and the pass is recorded). Measured: 2026-09-11 round 4 (post-decision RED →
  terminal → wont-do) and pass 2 (ceiling) — fingerprint
  auditor-p8-adoption-gap-on-feature-card-contradicts-packet-readiness; the medium/low
  absorption does not reach this class because it arrives HIGH.

  **How it binds, and how it does NOT.** INFRA-class cards are UNCHANGED — there the finding is
  exactly what §8 asks for and stands as written; a caller that supplies no class (a plan / decision
  target) refutes nothing. The pass is skipped ONLY when EVERY finding in it is machine-refuted — a
  real finding beside the P8 one charges the pass exactly as before. The count of refuted findings
  (parse-refuted + P8-refuted together) is the one `machine_refuted_count`. Home of the predicate and
  the seam: `bin/lib/audit.py#p8_adoption_gap_on_non_infra` / `#machine_refute_findings`.

  **BUNDLED FINDINGS ARE NOT REFUTED.** A finding that carries the §8 wording BESIDE an
  independent defect claim — a concrete source location the kernel does not own the judgement of (a
  `.py` path under `bin/` or `tests/`), or an explicit execution-failure claim (a failing assertion or
  test, a raised exception, a traceback) — is NOT refuted, on EITHER arm (the structured `class_id`
  slot as well as the prose sniff): the auditor bundled two claims into one finding and only one of
  them is machine-decidable, so the WHOLE finding stands and the pass is charged. Judgement vocabulary
  (scope / coherence / adequacy) is deliberately NOT an independent-defect signal — an auditor may
  legitimately phrase the §8 claim that way, and admitting it would stop the refutation firing on the
  shapes it exists for. Predicate: `bin/lib/audit.py#bundles_an_independent_defect`.

  **THE ALL-REFUTED FOLD — what the recorded verdict is when NOTHING the auditor raised
  survives.** The contract «the VERDICT is never touched» is AMENDED here, and only here. It
  left the all-refuted pass with no exit at all: the pass is not charged, so the SPEC-0124 ceiling is
  never reached, so the SPEC-0204 `audit decide` route does not exist, so `task close` stays
  RED-blocked and the worker's only moves are a third identical pass (CHARTER §Principle 7 forbids
  it) or `blocked-on-land`. MEASURED on kernel (2026-09-12: built, 3/3 ACs, 1539/1539,
  audit-pre GREEN, two consecutive audit-post REDs whose sole finding is fp1:35d7971ae2afe775, kind
  `p8-adoption-on-non-infra`, on a class:fix card, passes 0) and again on. The external ad-hoc
  consult `all-refuted-red-verdict` (FULL model, GREEN, `decisions/all-refuted-red-verdict-audit-adhoc.yaml`)
  recommended the smallest resolution: fold to GREEN, reusing the SPEC-0204 rule-8
  `verdict_excluding_late` shape — a kernel-computed recorded verdict that differs from the auditor's
  word, with the auditor's word preserved and the reason in `notes` — rather than a third
  audit-ceiling path or a human-signature route.

  So: a TASK audit-pre/post whose auditor verdict is RED or YELLOW, and EVERY one of whose findings is
  machine-refuted, RECORDS `verdict: GREEN`. THE FENCE, all of it conjunctive and all of it fail-closed
  to the auditor's verdict:
  (1) a CLOSED allowlist of exactly the two machine-decidable classes — `governed-artifact-parse-claim`
  and `p8-adoption-on-non-infra` — so a FUTURE refutation kind is NOT foldable until it is NAMED there
  by an explicit change; (2) a NON-EMPTY finding set (a clean pass has nothing to refute and is not a
  fold); (3) EVERY finding individually refuted, its count re-derived from the findings rather than
  trusted from the caller; (4) every refutation block produced by THIS pass (`checked_at` and `policy`
  must match), so a block carried in from a prior record is stale and never folds; (5) unknown, stale,
  malformed or unavailable refutation data fails closed. An ABORT is never folded — it means the
  auditor produced no usable outcome, which a refutation cannot disprove; a plan / decision target is
  out of scope.

  WHAT IS PRESERVED, so no reader can mistake the fold for the auditor having passed the change: the
  saved record and the `audit_{pre,post}_completed` row BOTH carry `verdict_as_returned` (the auditor's
  own word, captured before any kernel seam recomputes the verdict) and `machine_refuted_all: true`,
  additive-optional and ABSENT (never false) on every pass that did not fold; every finding keeps its
  verbatim `machine_refutation` block; `notes` states the fold and names the kinds. `passes` is
  UNCHANGED — the existing ledger-skip already leaves it at `prior_passes`, and this fold neither reads
  nor writes it. SEAM ORDER is load-bearing: the fold runs AFTER the SPEC-0204 rule-8 record seam (so
  rule 1's fingerprints and every verdict-driven upstream guard — the unchanged-HEAD GREEN-flip refusal
  in particular — judge the AUDITOR's own word) and BEFORE the rule-3 on-decisions seam (so rule 3's
  absolute «a `fix` residual echoed OPEN forces RED» clause can still re-raise a folded verdict; a
  recorded Controller decision outranks a category-error fold). Home of the fence and the seam:
  `bin/lib/audit.py#machine_refutation_folds_to_green` / `#FOLDABLE_REFUTATION_KINDS`, and the policy
  string `MACHINE_REFUTATION_POLICY` every saved verdict carries states the same rule.

  **DERIVED-FROM-THE-CARD selection — four of the flags above need not be passed at all.**
  Every guard in this family already anchors its trust in a CARD-SIDE DECLARATION (SPEC-0028), so on a
  TASK `audit post` invoked with NO overlay flag the verb DERIVES the overlay from the card itself:
  a grammar-valid, **UNSETTLED** `post_ship_observation:` → `--post-ship-observation`; a declared
  `activation_gated_radius:` → `--activation-gated-radius`; `host_config: true` → `--host-config`; an
  acceptance naming a land-emitted event token and/or an `X-NNNN` the card ALSO carries in
  `resolves_cross` → `--land-emitted-event`. A derived overlay is only the same BOOLEAN the flag
  supplies: it passes the SAME scoping check and the SAME fail-closed `_require_*` guard, unchanged and
  in the same order, so a card that declares something it is not entitled to is refused exactly as it
  would be with the flag — the derivation is a TRIGGER, never a GRANT, and can widen no exemption.
  A SETTLED `post_ship_observation:` derives NOTHING, deliberately: the proof exists, so there is
  nothing to defer and the ORDINARY audit applies.
  **The flags remain the explicit override** — an explicitly passed derivable flag wins and derivation
  steps aside. **A flag that CONTRADICTS the card's declaration is REFUSED before the auditor is
  invoked** (no `audit_prompt_sent`, no pass spent), naming BOTH the declared field and the passed flag:
  silently preferring either side would leave a verdict marked with an overlay the card never declared.
  **NOT DERIVED** — `--event-emit-only`, `--serve-deploy`, `--external-action`,
  `--preshipped-deliverable`, `--settlement-sweep`, `--zero-ship-diff`, `--reaudit-after-close`: none
  has a card-side declaration to key on (`--event-emit-only` describes the SHIP's shape, not a field the
  card carries), so they stay explicit-only.
  **Recorded marker:** every task audit-post verdict carries `overlay_source: derived | explicit | none`
  BESIDE the per-flag markers in the table above, never instead of them — those say WHICH overlay ran,
  this says WHERE it came from, so a later reader can tell a card-anchored deferral from an
  invocation-side one without re-deriving it from the card as it stands today.
  **THE FAMILY IS CLOSED AGAINST A DECLARING-CARD VARIANT (X-1240) — a named retirement,
  recorded here so the next reader does not re-derive it.** A carrier-/entry-DECLARING card — one whose
  deliverable IS a declaration (a live entrance, a carrier, a host config) — cannot read the evidence
  of its own declaration at this pre-land audit-post: the reading is taken from the artifact at its
  REGISTERED path, which does not carry the branch's edit until the land, and the land comes after the
  closure this audit gates. That shape looks like a sixth deferred-adoption member and IS NOT ONE. The
  reading that it needs an overlay variant of its own (`--declaration-evidence-at-land`) is RETIRED:
  its ORDERING half is covered by whichever EXISTING member matches the ship (`host_config: true` →
  `--host-config`; a serve/deploy ship → `--serve-deploy`), which the derivation above picks off the
  card's own declaration without any flag being passed; and its remaining half is not an audit problem
  at all but a COMMIT one — a RED naming the card's own RECORDED EVIDENCE is repaired through
  `task commit --fix-red --card-repair` (SPEC-0015 §Internal, the route home). A new row would have
  duplicated two live analogs (F1) and removed nothing (F3).
  MEASURED, and it is the whole grounds: aiseller (2026-09-03) shipped a complete, live,
  MEASURED entrance, was cut WITHOUT the `host_config` marker its own deliverable earned, took the
  ordering false-RED this family exists to prevent, and its worker read all three commit routes as
  closed and self-halted. It then closed GREEN on the SAME commit once the card DECLARED
  `host_config` and the existing overlay ran (`overlays: [host_config]`,
  `corrected_overlay_reaudit: true`) — resolved end to end by mechanisms that already existed. So the
  incident is evidence AGAINST the variant, not for it; what it actually indicts is a card cut without
  its declaration, and the fix for that is to declare it.

  WHY: the family was invocation-side only, so a card that DECLARED its deferral still RED'd as
  adoption-missing whenever the worker forgot the flag — P8-adoption was 142/383 (37%) of RED
  audit-post passes (kernel since 2026-08-18); kupiclub deviation
  `audit-post-pass-burned-on-known-deferred-adoption-overlay-not-applied-first`.

  **RESERVED-NAMESPACE naming constraint — the `decisions/<task-id>-*` prefix belongs to a
  card's OWN records, so an authored DELIVERABLE must not wear it.** The allow-listed bookkeeping named
  in the `--zero-ship-diff` row above is PATH-SHAPED (`_zero_ship_diff_bookkeeping`, `bin/lib/cli.py`):
  `decisions/<task-id>-*.yaml` reads as this card's own audit / consult record for ANY suffix. That
  reservation is also what the no-authored-content guard reads, so it has a consequence for
  AUTHORING, not just for waiving: a card whose DELIVERABLE is an authored record under `decisions/`
  — a saved finding, a measurement, a recorded verdict — and which names it `decisions/<its-own-task-id>-*.yaml`
  produces a ship whose authored-path set is EMPTY. `audit post` then refuses the ship that carries the
  work, and the card is structurally unauditable. **So name such a deliverable by SUBJECT (optionally
  +date), never by task id** — the shape the corpus already demonstrates
  (`decisions/spec-0080-remeasure-2026-08-25-finding.yaml`, which hit this seam and resolved it
  exactly this way; the pre-guard `decisions/-spec-0080-live-use-finding.yaml` is the shape that
  would refuse today and is frozen history, not a model). This is a NAMING rule, deliberately not a
  narrowing of the guard: enumerating the audit writer's own filenames here would re-encode a vocabulary
  that module owns, and its drift would fail PERMISSIVELY — letting a contentless subject reach the
  auditor, the defect the guard exists to close. The authoring-surface pointer lives at
  `patterns/doc-conventions.md` §Naming (LIFECYCLE §Stage 2 routes new-artifact authors there); this row
  is the rule home.

  **GOVERNED CARD-REPAIR SUBJECT (X-1233) — an admission on the MEASUREMENT, not a waiver.**
  The guard asks whether the subject the auditor RECEIVES carries authored content, and answers
  it off the subject commit's OWN diff. For every shape it was written against those are the same
  thing. For ONE shape they are not: `get_audit_post_diff` has sent the CUMULATIVE range
  `merge-base(sha, main)..sha` since, so a commit that is itself record-only but sits ON TOP of
  the card's audited ship hands the auditor that whole ship PLUS the record change — strictly MORE
  material than the RED pass saw, not less. Refusing it closed the last door on a kernel-caused card
  corruption (kupiclub, parked with its deliverable shipped and verified). So the guard ADMITS
  such a subject, on FOUR conjuncts, every one DERIVED and fail-closed — a missing injection, an
  absent marker, an unreadable record and any git failure all REFUSE:
    (a) PROVENANCE — the subject IS the task's RECORDED commit, and that `commit_landed` record
        carries the `data.card_repair` marker the `task commit --fix-red --card-repair` arm writes.
        This is what ties the admission to the GOVERNED route rather than to a commit shape;
    (b) SHAPE — the subject's diff carries THIS card's OWN card file, read off GIT;
    (c) the PRIOR audit-post record is RED **and its cause DERIVES to this card's own record** — so
        the repair being admitted is the repair that verdict actually asked for. Read from the
        governed `decisions/<tid>-audit-post.yaml` pinned to that custody sha, NEVER from the journal,
        and judged by the ONE shared predicate `_red_cause_is_card_record` that the governed
        `task commit --fix-red --card-repair` arm reads TOO. **That sharing is the rule, not
        an implementation note:** until this conjunct existed HERE and not at the commit door,
        so the two verbs on one governed route could answer differently about one RED — and on
        kupiclub they did, the commit door admitting a repair this door then refused (X-1251,
        CHARTER §Principle 7). One predicate makes that disagreement structurally impossible.
        **RETIRED (P1 F3) by : the KEYWORD TEST this conjunct used to be** — a match on whether
        the auditor happened to write `tasks/<tid>*.yaml`, the word "card", or "recorded
        evidence". Admission turned on PHRASING, so each miss bought one more keyword. The derivation
        that replaces it is homed with the arm in SPEC-0015 §Internal (the two-part read — no authored
        reference anywhere in the record, AND at least one reference that IS this card's own record by
        path / by an acceptance-named task-tied event type / by an acceptance-criterion id the card
        declares); it is not restated here, so the two homes cannot diverge (CHARTER §P5);
    (d) that covered commit provably carries authored content, read through the SAME predicate this
        guard already uses (one definition of "authored" — CHARTER §P5), so the cumulative range the
        packet sends is not empty;
    (e) CHAIN CONTINUITY — the subject's FIRST PARENT *is* that covered ship, read off git. The arm
        builds the repair directly on the commit the RED graded, so parenthood is its exact shape;
        mere ancestry would admit a card-only commit made anywhere later on the branch.
  **(a) IS REQUIRED BUT NEVER SUFFICIENT — every other conjunct is read from something the actor being
  fenced does not author.** Both halves of this were found by AUDIT, not by the author. A GIT-ONLY
  admission takes any card-only commit sitting on an audited ship, however made, un-tying the
  admission from the governed arm this rule names as its bound (audit-post pass 1). But ANDing in the
  marker does not repair that on its own, because a `commit_landed` row is HAND-EMITTABLE — an event
  append is the bypass class the protocol names outright — so a forged row merely names a forged
  subject (audit-post pass 2). Hence the shape above: the marker stays as the governed arm's
  provenance, and what CARRIES the admission is git (shape + parenthood) plus the audit verb's own
  recorded verdict. A hand-made card-only commit with a perfect hand-emitted row is REFUSED unless it
  also sits directly on the audited ship AND answers a RED that actually named the card record.
  The residual — an actor who can rewrite the audit RECORD itself — is the trust boundary every
  governed record in this kernel sits behind, and no predicate here can narrow it. The provenance read
  reuses the EXISTING `_recorded_commit_landed` payload reader, so no new journal consumer enters the
  system (CHARTER §P1 F1/F2; the SPEC-0190 census is untouched).
  **Deliberately NOT a member of the exempt-flag family above.** Those rows are for ships that are not
  diffs AT ALL, and they are operator-DECLARED; a card repair IS a diff, and this admission is derived
  from governed records with no flag for an operator to get wrong. Every other empty subject — a
  park/pause/wont-do displacement, an empty ship, an ordinary bookkeeping commit — carries no marker
  and is refused byte-identically to before.

  **SCENARIO-STATUS COMPUTED-VIEW carve-out (SPEC-0076 §3) — unconditional, NO flag,** so it
  is not a row above: a scenario's `status` is a COMPUTED, DERIVED read-only VIEW (`draft → building →
  live`). It MUST NOT be stored — only `retired` (human-set) or an ABSENT status frontmatter field is
  legal, and `graph build` exits 2 on any illegally-stored status. So a scenario file with NO `status:`
  frontmatter is CORRECT BY CONSTRUCTION: its absence is NEVER a 'missing required status field'
  finding (the X-0081 false-positive this kills). Fires whenever a scenario file is in the shipped diff.
    An
    adoption-honesty finding routes to a FILED follow-up (not absorb-by-narrowing, E-0005);
    coherence with other docs/state; Review-only : the auditor does NOT execute the test
    suite — Stage 6 owns test runs; VERIFY the recorded Stage-6 evidence exists + is plausible +
    matches the probes.

  ### Spec coverage of touched files ( — task pre + post)
  A derived `### Spec coverage of touched files` section rides EVERY task audit prompt (pre + post),
  appended right after the body. It is pure f(graph, plan/diff) and REPORT-NOT-BLOCK (GRAPH is not a
  validator). Pre lists the files the `implementation_plan` + `expected_touch` FORECAST; post lists the
  files of the shipped diff. Per file it shows the governing ACTIVE specs (graph `code_to_specs`,
  status-filtered) or a `(no governing spec)` marker, plus symbol-level `possibly-stale` drift flags
  (reuse `_anchor_drift_warning` via `_changed_anchor_spec_drift`, touched-scoped) for a touched
  `implements:` anchor whose spec was not updated. BOTH task overlays carry the two questions this
  section exists to let the auditor answer — closing the «code born/changed outside the documentation»
  fear at both gates: (1) code touched with NO governing spec → justified spec-less (SPEC-0005
  admission) or a documentation gap? (2) a touched active-spec `implements:` anchor whose spec is NOT
  updated in the same change → justified (unrelated symbol / deliberate) or undeclared doc drift?
  BOTH questions are about the DOCUMENTATION of the code, never about the COMPLETENESS of the
  forecast itself. A file or spec missing FROM the forecast is CONTEXT and is NEVER a finding of any
  severity (§Universal lens): the forecast is refreshed from the committed diff at `task
  commit`, and a RED whose only findings carry `class_id: forecast-completeness` is refused at the
  parse floor. The section's `## Declared vs audited touch` sibling carries the same
  reading in the packet the auditor reads.

  ### Plan-stage overlays — the per-gate question templates (NEW in this head)

  **Selection carrier (deterministic — the VERB invocation, never bare `status`):**
  - **ad-hoc check** (`plan check <slug>` [+`--focus`]) → the ONE shaping template that exists:
    `draft` → P1 below. Ad-hoc shaping is DRAFT-ONLY (trial-run-2 — a per-status template family
    was promised but never delivered; narrowed honestly); at `specs`+ the checks ride the gate
    templates (P2-P4) and the accept-gate lens;
  - **gate template** → asked by the TRANSITION verb itself: `plan stage <NEXT>` asks the
    entry-gate template FOR `<NEXT>` (the verb already gates the prior stage and delivers the stage
    bundle — the template question joins that exact moment). No new flag, no new verb.

  **Gate policy — homed in SPEC-0083 ( stable-surface split, P5).** WHICH plan-FSM
  transition blocks on the audit verdict vs records-and-proceeds is the ORTHOGONAL concern to the
  question TEMPLATES below (WHAT is asked); the one-table gate POLICY lives single-SoT in SPEC-0083
  (`graph query SPEC-0083`). The per-gate question templates (P1-P5) below are UNAFFECTED by the split.

  **Plan-FINALIZATION overlay — reached-active acceptance (mirrors SPEC-0034 §realized
  clause (a)).** The aggregate `audit post --plan` finalization overlay tells the external
  auditor the SAME realize-gate semantics the code gate (`_require_plan_finalization_ready`) enforces:
  a `proposed_by` spec satisfies the gate when it has REACHED `active` — current `active` OR a
  POST-active state (`superseded` / `retired`), which the spec FSM (proposed -> active -> superseded
  -> retired) makes reachable ONLY after `active`, so either status PROVES the spec became normative
  (its content typically carried forward by lineage, e.g. SPEC-0037 -> SPEC-0040 -> SPEC-0046). So a
  lineage-evolved corpus of superseded/retired specs is CORRECT and realized — the auditor must NOT
  RED it for "zero currently-active specs" nor YELLOW it for "a superseded spec in the corpus". ONLY a
  never-active NON-TERMINAL status (proposed / draft) or an unknown status is a genuine half-realized
  finding; a DELIBERATE terminal (withdrawn / rejected) is EXEMPT (mirrors SPEC-0034 §realized
  clause (a)) — a deliberately-abandoned plan-born spec is a tracked scope-cut, NOT an unrealized
  obligation, so it is flagged `[deliberately abandoned]`, EXCLUDED from the reached-active tally, and
  is NEVER a finding (the lens mirrors the code gate `_require_plan_finalization_ready`). The corpus
  body reports `reached-active? N/N` (active + post-active, deliberate terminals excluded) for this gate;
  the auditor judges against THAT, not a bare current-active tally. (P5 — the lens reads the code gate.)

  **Plan-FINALIZATION overlay — drain-at-realize correctness.** A `realized` plan is a
  TERMINAL carrier (historical record + pointer only), so the finalization auditor ALSO checks that any
  durable/living content the plan HOSTED — criteria, rosters, checklists, standing rules, living tables
  — was DRAINED to a STABLE home (a spec or a non-FSM pattern) before realize: no durable content is
  orphaned in the terminal plan (P5 one-home / P7; SPEC-0034 §realized). A plan retaining ONLY a
  historical record + a pointer to the stable home is GREEN; durable/living content still authored IN
  the terminating plan (not merely pointed-to) is a drain finding. Living/WIP content was legitimate
  while the plan was ACTIVE — the check fires AT the realize transition, NOT before.

  **P1 — plan-draft shaping template («prover' draft» ("check the draft"), owner-invoked):**
  - Is the problem GROUNDED — real incident / prior-art / external analog (anti-cx F4)?
  - Are all angles/halves of the carve ENUMERATED — completeness ONLY: is every part LISTED at all
    (a deliverable simply omitted is invisible to a resolver)? Includes the status-template-matrix
    completeness check (trial-run-2): everything a carrier/mechanism section PROMISES (e.g. a
    template per status/gate) must appear in the deliverables — a promised-but-undelivered member
    is an omitted half. Whether listed parts should be SEPARATE plans is the NEXT question, not
    this one (trial-run-1: asked together, the two collapsed for the auditor).
  - **Plan-split criterion — one convergence regime / one fate per plan (SPEC-0012):** do parts have
    different validation horizons (one provable now, one needs accumulated real data)? independently
    rejectable fates? does one part consume the other's real-data output? Any YES → recommend
    splitting into cross-referenced plans (tracked ids, no requires between them). **Trial-FSM
    carve-out (trial-run-1):** for a trial-ELIGIBLE plan, its own design-convergence (trial) phase
    followed by implementation (executing) is ONE sequential regime — that built-in sequence is NOT
    a split signal; apply the split signals only to parts whose fates stay independently rejectable
    AFTER accept.
  - Trial-eligibility pre-assessment: mechanism/behavioral (trial-bound) vs prose/docs (skips trial)?
  - Is the existing-analog sweep honest — corpus + plans/ + journal searched?
  - Are references inside the draft body CURRENT — no superseded/stale FSM or artifact references?
    Judge stage vocabulary against the AUTHORITATIVE plan FSM (LIFECYCLE §Plan-lifecycle:
    draft→specs→trial→accepted→executing→postcheck→realized), which the prompt assembly MUST
    include (trial-run-1: without it, `executing` was falsely flagged as a stale reference).
    The assembled FSM line (`_plan_fsm_line`) ALSO states that `trial` is OWNER-INVOKED and
    conditionally SKIPPED for trial-ineligible (prose/docs) plans (SPEC-0035): a `specs → accepted`
    transition that skips `trial` is a SANCTIONED path, NOT a process bypass — do NOT RED-flag a
    trial-skipping plan as a stale-FSM reference or a process violation (the X-0132 false-RED fix).

  **P2 — draft→specs gate template (asked by `plan stage specs`):**
  - Is the draft THOUGHT-THROUGH enough to compose specs — scope stable across recent edits?
  - Every carve-out / deferral carried by a TRACKED id (SPEC-0012 — never prose)?
  - Contradictions resolved or explicitly named (P7)?
  - Multi-part plan: is the build ORDER fixed (instrument-before-policy where applicable)?

  **P3 — specs→trial gate template (asked by `plan stage trial`; MANDATORY-BLOCKING):**
  - Eligibility rationale honest — BOTH legs (mechanism-class AND convergence not honestly
    obtainable by text audit alone)?
  - `## Trial protocol` baked and sound: mode + why, probe targets, exit criteria, safety envelope
    (never mutates production data) — per `patterns/trial-methods.md`?
  - Draft specs composed + checked (the prior stage actually complete)?

  **P4 — trial→accepted trial-evidence block (joins the accept-gate `plan check` prompt when a
  trial ran; MANDATORY-BLOCKING):**
  - Does the JOURNALED trial evidence (runs + convergence claim) support «design converged» — or
    did runs stop while the design was still moving?
  - Did the trial feed the plan/specs (co-evolution visible), or were they untouched despite
    divergent runs (a smell)?

  **P5 — decomposition→executing fidelity template (asked by `plan stage executing`; MANDATORY-BLOCKING — SPEC-0070 §3):**
  Audit the FILED TASK CARD SET (delivered in the prompt as `## Decomposition — the filed task CARD
  SET`) against the plan AND its goals — the SET-level properties no single-card audit-pre can reach
  (the cut, not one card). Seeded from the two by-hand fidelity audits already run
  (`lifecycle-path-decomp-fidelity`, `two-plan-decomposition-review`) + the SPEC-0070 §3 SET-quality list:
  - Coverage 1:1 — is every plan part / accept-unit mapped to exactly ONE card, with no plan part
    unmapped and no card outside the plan's scope?
  - One provable claim per card (SPEC-0046) — does any card BUNDLE two concerns, or carry an
    acceptance OVERLAPPING a sibling card's claim, instead of one provable accept-unit?
  - `requires:` ordering encoded, not prose — is every intended precedence (a «first» / «before» /
    verifier-after-settled relationship) carried by a `requires:` edge, so no later writer can legally
    run before a card it depends on? (A named-first card with NO outgoing dependency edge is the defect.)
  - Singular activation — does each `proposed` spec have EXACTLY ONE `activation_owner_task` across its
    sibling cards (the others `cite` it) — never zero, never two? Answer this ONLY from the
    `## Proposed-spec activation` block appended to the card set (X-0707) — it is the
    AUTHORITATIVE evidence and the ONLY evidence: in V2 the activation owner is a spec→task POINTER on
    the SPEC yaml, NOT a per-card field, so a card's `cites:` is NOT a proxy for ownership and MUST NOT
    be read as one. The block lists every spec with `proposed_by ==` this plan, resolving each
    `activation_owner_task` against the cut. The DEFECT SHAPES are exactly two: a spec reading
    `NO activation_owner_task — UNOWNED` (zero owners — nothing in the cut will ever activate it), and a
    spec whose owner reads `NOT a member of this cut` (the cut cannot deliver the activation it
    promises). A spec reading `owner: T-NNNN — IN this cut` is CORRECT and must NOT be reported, and the
    explicit `(no spec is born of this plan …)` line means the question is ANSWERED-CLEAN — NOT
    unchecked — so it must NOT be reported either. Grounds: bc-community 2026-08-08 — with no activation
    block in the prompt the auditor inferred ownership from `cites:` and emitted a HIGH
    ("no card owns activation of SPEC-XXXX") that was both false and unverifiable; in a
    MANDATORY-BLOCKING gate that inflated the finding count AND burned one of the two ceiling passes
    that exist to resolve REAL findings. A blocking RED must rest only on findings that can be verified.
  - Probe quality — is each card's acceptance probe satisfiable AND journalable AT THAT task's OWN
    closure (no future-bound / soak-dependent / luck-only probe), and does a promised invariant carry
    an explicit probe rather than only a prose promise?
  - No reopened settled choice — does any card REOPEN a design choice the plan/specs already settled
    (e.g. a «confirm-or-revise» embedded in the card instead of implementing the accepted unit)?
  - Touch-forecast present + plausible — does each card carry an `expected_touch` naming the
    concrete files/symbols its scope implies, and is that plausibly the cut's blast-radius (present,
    non-empty, not obviously mismatched vs the card's scope)? An empty `expected_touch` on a decomposed
    card is a cut-fidelity gap (SPEC-0046 §Persist-the-enumerated-blast-radius) — the cutter already
    enumerated the touch to size the cut, so a blank forecast is reason-then-discard, not "unknown yet".
  - Set-level semantic coherence over a SHARED SURFACE (X-0593) — do any two cards in this
    cut WRITE or KEY the same named surface, and if so does the cut state which definition GOVERNS?
    Read the `## Shared surfaces` block appended to the card set: it lists every surface named by >=2
    cards (grouped by the `expected_touch` path, so `a.py` and `a.py#sym` count as one surface) with
    the sharing cards' COMMON `cites:` resolved against the corpus. A shared surface whose line reads
    `(no ACTIVE governing spec cited in common)` is the DEFECT SHAPE: two independent workers can then
    each implement a self-consistent reading, and nothing before the merge land verify compares them.
    Ask it card-to-card, not card-to-plan: are the two cards' acceptance/scope readings of that surface
    mutually satisfiable? The cut must either cite the ACTIVE spec that governs the surface, or name
    ONE card as its definer and `requires:`-order the other after it. Grounds: boomrocket 2026-07-24 —
     and, from one cut and closed 15 minutes apart, landed contradictory key-semantics for
    prod-absent proposal deltas (one attempt-keyed, one record-keyed); both were independently
    well-formed and correctly ordered, so every other question here passed.
  - Fidelity to intent — taken as a whole, does the cut faithfully realize the plan's PURPOSE, not
    merely the literal `implementation_plan` map?

  **`--focus "<text>"` — the composable append (on `plan check` / `audit post --plan`):** appends an
  owner/session-specific question block AFTER the stage template (the ad-hoc form made composable —
  it never REPLACES the template). The appended text is recorded VERBATIM in the saved verdict
  `notes` field — **`notes` IS the single verbatim carrier** (full text, byte-equal);
  `prompt_excerpt` stays a ~200-char excerpt and is NEVER the carrier (accept-check F1 sharpening
  2026-06-05). No new schema field.

  **Verdict recording (ONE canonical schema — P5):** every plan-gate verdict saves to the canonical
  audit-result schema (AGENTS §Saved audit result) extended by TWO additive fields:
  `stage_template:` (the template name asked — e.g. `plan-draft`, `gate-specs`, `gate-trial`,
  `gate-accepted`) and `gate_policy:` (`on-demand | auto-advisory | mandatory-blocking`). The legacy
  draft-check shape (`draft:`/`kind:`/`content_hash`) is NORMALIZED onto this schema — its
  freshness extras (`content_hash`/`accept_freshness_hash`) join as additive fields; no second
  verdict format survives.

  **Retirement (what this head removes):** (a) hand-authored free-form external-auditor prompts for
  plan-stage questions are DEMOTED to the documented manual fallback ONLY (CLI unavailable /
  recovery — same posture as LIFECYCLE §4/§8 manual fallback); (b) the habit of pasting ad-hoc
  question blocks into bespoke auditor runs for plans is RETIRED — its replacement IS `--focus`.

  ### Saved audit result
  Every invocation saves the result to `decisions/<id>-audit-<stage>.yaml` — the annotated schema
  below is the SoT home, `<id>` = `T-XXXX` for a task audit OR `D-XXXX` for a decision
  audit. A CLOSED task's saved YAML is later `git mv`d into
  `decisions/archive/audit-{routine,escalation}/` by the displacement-retention drain (SPEC-0052), so the ceiling reader `_count_audit_passes` resolves the active OR the archive path —
  same pass COUNT, only the WHERE widens; an IN-FLIGHT task's audits are never moved. A PLAN
  audit-post verdict ALSO records `lens_version:` ( — the FINALIZATION-overlay lens version it
  was rendered under; drives the lens-version freshness re-audit, SPEC-0124 §Audit-loop ceiling):
  additive-optional, plan audit-post only, absent on task/decision audits.

  ```yaml
  target_kind: task # task | decision | plan ( plan-gate audits) | ad-hoc
                      # ( `audit adhoc`, free-slug consult). The audited node's kind.
  target_id: T-XXXX # T-XXXX | D-XXXX | <plan-slug> | <consult-slug> — the audited node id
  task: T-XXXX # LEGACY alias = target_id when target_kind=task. STILL active : read by
                      # the cmd_audit SPEC-0001 self-test + the graph audit-edge; generalization to
                      # target_id-only is DEFERRED — no consumer has migrated yet (NOT a pending S2/ step).
                      # When target_kind is absent, readers DEFAULT it to `task` (additive, no drift #10).
                      # For a NON-task target_kind the key is OMITTED entirely — never written null.
  stage: pre # pre | post | ad-hoc
  date: '2026-05-26'
  verdict: GREEN # GREEN | YELLOW | RED | ABORT
  passes: 1 # optional — absorption pass count (per SPEC-0124 §Audit-loop ceiling)
  commit: <git-sha> # REQUIRED for stage=post (commit being audited); optional for stage=pre / ad-hoc
  findings:
    - severity: high # high | medium | low
      what: <one-line>
      where: <file:line OR description>
      fix: <one-line concrete fix>
  # ── PER-FINDING RESPONSE CONTRACT — additive-optional at schema level ──
  # A finding MAY additionally carry the keys below. They are consumed ONLY at a baseline-bearing
  # post-ceiling consult; the SEMANTICS (what makes a finding blocking, how a retest echo is judged)
  # live single-SoT in SPEC-0200 rules 3-4 — this table declares WHICH keys exist and WHO supplies
  # each, never the blocking definition. `bin/yitc-v2 graph query SPEC-0200`
  #
  # ELEVEN new key names in total, split by SUPPLIER — the auditor is never asked for an engine field:
  #
  # AUDITOR-supplied — NINE key names occupying EIGHT slots, because `criterion_ref` and `class_id`
  # are two ALTERNATIVE keys sharing ONE slot (a blocking finding carries one or the other):
  # disposition: blocking | deferrable
  # criterion_ref: an exact acceptance-criterion id of the target's lens } one slot,
  # class_id: one of SPEC-0200 rule 3's six CLOSED must-not-land classes } alternatives
  # (BASE audit-pre/post response: the prompt's closed vocabulary is those six PLUS the
  # finding-class names P8-adoption | spec-coherence | scope-fidelity | test-evidence, and a finding
  # that fails no ACn MUST carry class_id; an omitted one may be engine-derived, marked
  # class_id_derived: true — SPEC-0204 rule 1)
  # locator: file:symbol or scope ref
  # failing_input: the concrete input/state that fails
  # causality: introduced-by-subject | pre-existing-in-subject
  # baseline_ref: the baseline/residual id this finding echoes (a retest echo)
  # resolution: open | closed
  # resolution_evidence: reviewable closure evidence — required for `resolution: closed`
  #
  # ENGINE-supplied — TWO: `id` (the allocated B<n> / R<k>.<n>) and `subject_revision` (the basis
  # fingerprint judged). Derived by the engine, never requested from the auditor.
  #
  # `severity` above is OUTSIDE this set: it is pre-existing OPTIONAL TRIAGE METADATA and it NEVER
  # derives `disposition` — a `severity: high` finding without the rule-3 fields is deferrable, and a
  # `severity: low` one with them is blocking. Ranking a finding is not classifying it.
  #
  # READ vs JUDGED: `parse_audit_verdict` TRANSCRIBES these keys faithfully — present -> verbatim,
  # absent -> absent, no defaulting and no validation. Every missing-value judgement belongs to the
  # READER that classifies them (lessons/fail-closed-belongs-to-the-reader-not-the-parser.md), not to
  # the parser. Absent on every audit that is not a baseline-bearing consult.
  findings_complete: true # OPTIONAL report-only metadata: did the auditor VOLUNTEER that the
                      # findings list above is exhaustive? true | false | absent ("not stated").
                      # REPORT-ONLY on this record: no gate, verdict, exit code or pass count reads
                      # it, and nothing INFERS it — since withdrew the full-verdict rule
                      # (§Universal lens) no prompt surface asks for the declaration, so in practice
                      # it is absent unless an auditor volunteers it. The field is kept because it is
                      # additive, harmless, and reused by the narrowed successor in plan
                      # `frozen-defect-baseline-at-the-audit-loop-ceiling-d`. The CONSULT record
                      # carries the same field — see SPEC-0124 §Ceiling-convergence triage.
  absorbed: [] # finding indices absorbed inline this commit
  followups: [] # follow-up task IDs filed for residual findings
  # OPTIONAL markers — the ceiling-skip / re-audit markers (tooling_absence_abort · timeout_abort ·
  # unchanged_fp_reaudit · concurrent_merge_reaudit · task_lens_reaudit · passable_absorption_reaudit ·
  # consult_governed) each mark a no-real-outcome re-audit whose `passes` is NOT advanced (the
  # ledger-skip); `lens_version` is instead the ordinary version field recording which lens a verdict
  # was rendered under (PLAN audit-post). Per-marker presence + pass-count semantics are homed in
  # SPEC-0124 §Audit-loop ceiling. Absent on every normal run. `bin/yitc-v2 graph query SPEC-0124`
  auditor_provider: <abstract identifier — not a provider brand>
  auditor_independence: external | same-provider
                      # REQUIRED on every saved verdict (task pre/post, plan gates, ad-hoc, consult).
                      # `external` = the auditor's resolved provider differs from the primary AI's
                      # provider for this session; `same-provider` = it does NOT, or the primary
                      # cannot be determined (fail-closed toward the honest reading). A
                      # `same-provider` verdict is ADMITTED on every gate — never refused, never a
                      # wait — and ALSO journals one `audit_self_provider_used` row (SPEC-0025).
                      # Written at the ONE invocation chokepoint, no second writer.
                      # Rule home: `bin/yitc-v2 graph query SPEC-0201`.
  auditor_model: <the model id the adapter actually ran>
                      # REQUIRED beside the stamp above: which model produced this verdict, as the
                      # adapter actually invoked it (never the configured default re-stated). What
                      # makes a bound non-default model honest rather than silent. Same rule home.
  prompt_excerpt: <first ~200 chars of prompt sent>
  notes: <free-form context, optional> # codified audit-pre F2 absorption — de-facto used in 10+ artifacts
  # ── SPEC-0204 ceiling-decision keys — additive-optional, absent on an ordinary pass ─────
  findings[].finding_fingerprint: fp1:<16 hex>
  # The ENGINE-computed matching key for this finding (SPEC-0204 rule 1), written on EVERY RED
  # verdict's findings. Here it is a HUMAN-READABLE PROJECTION: the CANONICAL value rides the
  # `external_audit_completed` journal row, and every reader resolves fingerprints from the journal
  # ONLY — so hand-editing this line changes nothing. Never supplied by the auditor: an
  # auditor-written key is dropped and the engine's written in its place. A finding the engine could
  # not key fully carries the marked degraded form `fp1d:`.
  basis: on-decisions
  # Present ONLY on the ONE bounded pass past the audit-loop ceiling that SPEC-0204 rule 3 admits —
  # the pass whose authority is the Controller's recorded `ceiling_decision` rows rather than an
  # auditor or an owner grant. It rides beside `ceiling_ref: <tid>/<stage>/pass-<N>`, which names the
  # ceiling row those decisions were bound to. A RED on this pass is TERMINAL for that (task, stage).
  # It REPLACES the retired `owner_reset` / `owner_reset_basis` / `worker_auto_consult` /
  # `consult_governed` carriers: no route writes those any more, records already holding them stay
  # readable, and no new record may claim an admission basis that no longer exists.
  ```

  ### What was JUDGED, beside what custody PINS (audit-post only)

  `commit:` above is the CUSTODY pin — the repository state the verdict is tied to at the moment
  of judgement. It is NOT, and never was, a statement of what the auditor read: `get_audit_post_diff`
  sends a cumulative RANGE (`merge-base(commit, main)..commit`). Those two facts differ routinely,
  because Stages 6 and 7 append their own records on top of the ship, so the commit standing at Stage 8
  is frequently a record rather than a ship — measured over 728 rows in one consumer, 56% name a commit
  carrying no product file at all. A reader given only `commit:` therefore read reach as coverage, and
  one forensic review built its strongest finding on that gap (X-1108).

  So an audit-post verdict records BOTH, and a reader needs both:

  ```yaml
  commit: <git-sha> # CUSTODY — what this verdict is pinned to (unchanged, still required)
  audited_base: <git-sha> # the merge-base the judged diff was taken from
  audited_files: <int> # how many files the judged range carried
  ```

  - The pair is ADDITIVE-OPTIONAL and appears on audit-POST only. It is derived (`audit_post_range`),
    never authored, and is bounded by the SAME exclude list that bounds the diff — so the count
    describes exactly the material the auditor saw, not a second notion of what counts as bookkeeping.
  - It is FAIL-SAFE: an underivable range omits both keys rather than refusing the audit or recording a
    zero. These are observability fields; absent means "not derivable", never "nothing was judged".
  - The SAME pair rides the `audit_post_completed` event, from the same value, so the record and the
    event cannot disagree.
  - It DOES NOT re-point custody. `commit:` keeps its meaning and every chain-of-custody rule standing
    on it is untouched — the range is recorded BESIDE the sha, never instead of it.

  This is the audit trail. Trail enables post-hoc analysis (which auditor verdict governed which ship),
  audit-loop ceiling enforcement (count passes per task per stage), and methodology drift detection
  (per-stage finding patterns over time).

  The ceiling ledger-skip MARKER catalog (the `tooling_absence_abort` / `freshness_reaudit` /
  `consult_governed` / `unchanged_fp_reaudit` / `concurrent_merge_reaudit` / `task_lens_reaudit` /
  `passable_absorption_reaudit` additive-optional markers documenting which re-audits do NOT advance
  `passes`) is RE-HOMED to SPEC-0124 §Saved-result ledger-skip markers — fetch via
  `bin/yitc-v2 graph query SPEC-0124`.

  **Consult verdict — `decisions/<tid>-audit-consult-<stage>.yaml`, `target_kind: consult`,
  `stage: consult-<pre|post>`.** The ceiling-convergence triage saves the canonical schema PLUS the
  structured triage fields: `options` (the submitted candidate resolutions), `survivors` (a list of
  {option, text}, a SUBSET of `options` — fail-closed: an out-of-set survivor or a recommendation
  that is not exactly one survivor → verdict ABORT, no usable basis), `recommendation` (the single
  surviving option number)
  — **and the RENDERINGS an option index may be named in, on the way back IN (X-0835).** The
  reader normalizes an index written as a plain integer (`survivors: [2]`), as a QUOTED string
  (`["2"]` / `recommendation: "2"`), or as a MAPPING carrying an `option:` key (`- option: 2`, with or
  without its `text:` sibling) — the last being this very schema's OWN saved survivor shape, which the
  reader previously rejected, so a real adjudication expressed in the system's own vocabulary was
  recorded as the auditor-unavailable/malformed ABORT class and the ceiling escalated to the owner on a
  PARSE mismatch instead of on substance. **This widens which RENDERING is recognised, never which
  INDICES are admissible:** the subset check, the exactly-one-survivor convergence requirement and
  every fail-closed downgrade are unchanged, so an out-of-set index, a mapping naming no `option:`, a
  non-list `survivors:` scalar, and a genuinely non-converged verdict (zero survivors, or more than
  one) are all still refused and still escalate, and `basis_fingerprint` (the exact-match freshness
  carrier — pre = plan_fingerprint, post = recorded commit SHA). A consult emits ONE audit-family event
  surface (`external_audit_completed` with `target_kind: consult` + `stage: consult-<pre|post>`), never
  a second parallel event.

  **WHICH CONSULTS STILL WRITE THIS RECORD.** SPEC-0204 rule 6 retired the CEILING-adjudication
  consult, so this schema is now written by the two surviving forms ONLY: `audit consult --on-demand`
  (the below-ceiling technical-fork pick, key `on-demand`) and `audit consult --plan <slug> --gate <id>`
  (the plan-gate consult, which `plan stage --owner-reset` still verifies as its basis). The TASK
  `--task --stage` form REFUSES with a pointer to `audit decide` / `--on-decisions`. Consequently a
  consult record is NO LONGER A BASIS FOR ANY TASK audit pass: the `owner_reset_basis:
  consult:<file> | owner-authorized` line this section used to describe is retired with the flag that
  read it, and records already carrying it stay readable history.

  ### Packet preview — `audit pre|post --preview` (X-1060)
  The flag ASSEMBLES AND PRINTS the packet and STOPS: no auditor is invoked, no ceiling pass is
  consumed, no verdict is written, no stage gate is satisfied. It is this same verb stopping ONE
  STEP EARLIER — it returns immediately after `_build_audit_prompt`, before the `audit_prompt_sent`
  emit and `_invoke_auditor` — which is what makes what it prints THE packet the next real
  invocation assembles rather than a description of one. It invents no second assembler, and a
  second assembler is the thing to refuse if this is ever extended.
  WHY. Owner-authorized ask from kupiclub (2026-08-21), measured at their : the only way to
  learn what the auditor would SEE was to invoke it, which costs a ceiling pass and past the
  ceiling costs an owner grant — so the one question whose answer prevents the failure ("is my
  packet right?") was gated behind the resource the failure consumes. Three RED passes plus the
  grant were each spent on something a free look answers.
  CEILING-NEUTRAL BY CONSTRUCTION. The preview runs AT and PAST the audit-loop ceiling (SPEC-0124):
  the ceiling bounds AUDITOR PASSES, and a preview invokes none and advances no ledger, so it has
  no pass to bound and refusing it would enforce nothing while withholding the look exactly where
  it is worth most. It therefore also skips the ceiling region's mutating machinery (the trend
  grant, the L3 dispatched-worker auto-consult). REFUSED with `--owner-reset` (nothing to grant)
  and with `--absorb` (no record to field-edit).
  RECEIPT, AND ITS INERTNESS. One event, `audit_packet_previewed` — the read receipt, and the only
  surface on which "did anyone look before re-invoking?" is answerable. It is EXCLUDED
  unconditionally from `_ac_probe_evidence_events_for`, ahead of every tie-route: the
  card-opt-in route renders any task_id-tied type a card's acceptance NAMES, so without the
  exclusion a preview would enter the NEXT packet's evidence section and be made a lie by its own
  act. A read receipt is evidence of a LOOK, never of a probe.
  TWO DIAGNOSTICS, BOTH ADVISORY — and that is a RULING, not an omission: X-1060's own external
  consult ruled they must NOT become hard gates, because they are lifecycle behaviour rather than
  artifact integrity. (1) declared-touch (the card's `expected_touch`) vs audited-touch (the paths
  in the assembled diff) vs intersection — the X-1056 comparison, advisory here. (2) "no journal
  row for this card since the previous RED verdict at <ts>" — the re-run-vs-resolve fork of CHARTER
  Principle 7, surfaced at the moment it applies instead of as a rule to be remembered; it EXCLUDES
  the preview's own receipt, since a preview is a look and not a fix. NEITHER PRINTS AS ITS OWN LINE
  ANY MORE : both are FOLDED into the packet-readiness block below — diagnostic (1) as its
  `touch:` row, diagnostic (2) as its `prior findings without response:` row. The comparisons, their
  data on the `audit_packet_previewed` receipt, and the advisory ruling are unchanged; what is
  retired is the third redundant surface (`packet_touch_advisory`), leaving ONE report surface, not
  three (CHARTER §P1 F3).
  PACKET READINESS — the REPORT-ONLY block the preview prints. Every `--preview` run (no
  flag; the block is not opt-in) prints, on STDERR beside the packet, a block of machine-stable rows
  derived from the packet's own inputs — so the FORM failures that dominate RED verdicts are visible
  BEFORE a pass is spent. Measured over the kernel journal since 2026-08-18: of 383 RED audit-post
  passes, P8-adoption 37% + test-evidence 24% + spec-coherence 17% + scope-fidelity 11% are form
  mismatches these inputs already reveal, and 23% of REDs are withdrawn on the SAME commit with no
  code change. The rows, ONE per line, with fixed labels (downstream surfaces parse them, so the
  shape is a contract, not a rendering choice):
    `AC<n>: verifier <PRESENT|ABSENT|WAIVED>; evidence <PRESENT|ABSENT>`
    `P8 carrier: <PRESENT|DEFERRED-DECLARED <field>|ABSENT|n/a (class <x>)>`
    `stale anchors: <file> -> <SPEC-ID>` (one row per pair) or `stale anchors: none`
    `touch: declared <n> audited <m> outside-forecast <k>`
    `prior findings without response: <n>`
  Anything else the block prints is an INDENTED detail line beneath its row, never a row itself.
  `AC<n>` is the criterion's own leading `ACn` token when it carries one, else its positional index;
  the verifier state reuses the SPEC-0060 item 4 test-or-waive predicate (`test-not-applicable:
  <reason>` reads WAIVED); evidence is PRESENT only when the packet carries a row the criterion's own
  text points at. The P8 row is `n/a` outside `class: infra`, and `DEFERRED-DECLARED <field>` names
  the SPEC-0028 deferred-proof declaration the card carries.
  IT IS ADVISORY, and that is the X-1060 ruling carried forward UNCHANGED: exit 0, no verdict, no
  ceiling pass, no gate, no counted set — nothing branches on a row, here or downstream. It is made
  mandatory by DELIVERY (the audit stage bundles and the worker preamble name the preview step), never
  by a gate. ONE ASSEMBLER, still: the block is built INSIDE `build_audit_prompt` on the preview path,
  from the parts that one assembly pass already computed (acceptance, the counted adoption evidence,
  the Stage-6 row, the coverage walk's stale anchors, the touch reconciliation, the prior record) and
  handed back through an optional sink — the `evidence_sink` shape. It appends NOTHING to the packet,
  so the preview stays byte-identical to the real invocation. A SECOND ASSEMBLER, or a re-parse of the
  rendered packet, remains the thing to refuse.
  DIAGNOSTIC (1) IS NO LONGER PREVIEW-EXCLUSIVE. The same comparison ALSO renders into the
  TASK AUDIT-POST PACKET as a report-only section (`packet_touch_section`, appended by the one
  assembler `build_audit_prompt`), so the auditor reads the card's ON-DISK `expected_touch`. WHY: the
  packet's task body renders acceptance / plan / stage-6 / adoption / diff and NOT `expected_touch`,
  so the auditor's only view of the forecast was the card YAML hunk in the shipped diff — its
  COMMITTED state. That collided with the governed correction route: `task analyze
  --forecast-correction` deliberately leaves the card DIRTY so the audited commit does not
  move, which made the sanctioned correction structurally invisible to the gate demanding it
  ( — audit-post pass 3 restated pass 2 verbatim against a card whose on-disk forecast already
  covered the diff; two owner-authorized ceiling resets). BOUNDS, all three load-bearing: it is
  AUDIT-POST ONLY (audit-pre carries no diff, so the comparison there is noise, and audit-pre has
  `_forecast_touched_files` already); it is built INSIDE the SAME assembler, which is what keeps the
  preview byte-identical to the real invocation — no second assembler is introduced, and one is
  still the thing to refuse; and it stays ADVISORY, the X-1060 consult's ruling unchanged — the
  section states in its own text that it gates nothing, and no verdict, exit code, ceiling pass or
  counted set moves on it.
  NO PACKET TO PREVIEW. On the three short-circuit branches that record a verdict without
  assembling a packet (consult-governed carry-forward, unchanged-fingerprint carry-forward,
  zero-ship-diff waive) the preview NAMES the governing branch and prints no packet — printing one
  the real invocation never builds is the failure mode the preview exists to prevent.
  BOUND: the preview runs the same stage-correspondence and read gates as the real invocation. That
  is deliberate — a preview assembled under different preconditions would not be the same packet.
  ONE GATE IT DOES NOT RUN, and only this one (X-1121): the / WRITE-ISOLATION
  guard. `cmd_audit` takes it because the verb WRITES `decisions/<id>-audit-<stage>.yaml`; a preview
  writes no such record, and its only record is the `audit_packet_previewed` journal append, which
  AGENTS-SESSIONS §Writes-happen-in-a-worktree exempts from the worktree requirement. So a
  preview runs wherever a journal append may run, INCLUDING the main checkout. The condition is on
  the PREVIEW PATH, never on the verb: a NON-preview `audit pre|post` off a writing worktree is
  refused exactly as before, because its verdict YAML is the non-bookkeeping dirt that guard exists
  to keep off `main` (E-0014). WHY IT MATTERS beyond the message: the shape that needs the
  preview most could not get one at all — a card in-progress at Audit-post whose ship already landed
  has no worktree, and `worktree new --task` validates the card is `ready`, so kupiclub had no
  legal route to a look.

  ### Anti-pattern (do not do)
  Run audit "just to check" on hygiene tasks; iterate >2 absorption passes; cherry-pick verdict
  (run multiple auditors, pick the favorable one); bypass audit via env var; hand-author a bespoke
  plan-gate prompt when the template+`--focus` path is available; make either `--preview` diagnostic
  gate anything; assemble a preview packet through any path but the one real assembler.

  ## Verification

  - Bound: `graph build` maps the Audit-pre + Audit-post stage-entries to this spec once active
    (the ONE delivery axis — `binding:`); the plan gates carry NO plan-stage-entry binding: `plan
    stage specs|trial` and the accept-gate `plan check` ASK the matching template themselves (the
    prompt builders consume the template text from this one home —; dissonance
    spec-0036-verification-vs-binding-axis-contradiction resolved toward the binding carrier).
  - A saved plan-gate verdict YAML carries `stage_template:` + `gate_policy:` (state check).
  - A `--focus` text appears verbatim in a saved verdict (live-trigger, P8).
  - On activation SPEC-0016 flips `superseded` atomically (activation_owner_task close).

