body: |
  ## Scenario

  Before the AI runs an audit it must hold the audit contract: that the auditor is an INDEPENDENT
  second agent, what each verdict means, the absorption ceiling, and the V2 evaluation lens the
  prompt must carry — otherwise audits drift to generic "good practice" and lose their
  blind-spot-catching value. THIS head additionally carries the PLAN-STAGE QUESTION TEMPLATES: the
  owner-visible, durable question sets asked at each plan-FSM gate (so the owner can see WHAT the
  external auditor checks, correct it controllably, and append case-specific questions via
  `--focus`) — closing the gap where early plan transitions (draft→specs, specs→trial) had no
  named audit questions at all. One contract body serves the task-audit stages AND the plan gates;
  splitting would duplicate the universal lens (P5).

  ## Internal

  THE AUDIT CONTRACT. The external auditor IS the second AI agent — a DIFFERENT provider from the
  primary (CHARTER §Principle 4a); each catches the other's blind spots.

  ### Auditor selection — provider + model + EFFORT (per-tier)
  The auditor for an invocation is selected by THREE per-tier knobs in `bin/audit-config.yaml`
  (routine vs full tier — CHARTER §P4b keeps the concrete bindings in config, not in this normative
  text): `provider:` (which adapter — `<external-auditor>` default, or `the AI provider`), `model:` (the provider's model
  id), and `effort:` (per-invocation reasoning effort — low|medium|high|xhigh|max; default `medium`,
  the explicit real-work level). Effort is honored by BOTH adapters : the the AI provider adapter
  passes the AI provider's native `--effort <lvl>`; <external-auditor> has no native flag, so its adapter passes the
  `-c model_reasoning_effort="<lvl>"` config-override (the CODEX_HOME `model_reasoning_effort` key,
  whose own default is medium). An ABSENT `effort:` adds no flag / no override — each provider stays
  its own config-default (<external-auditor> byte-identical to a no-effort invocation). `effort` is a RUNTIME
  invocation knob, not a consumed-spec governing param.

  **ENV override — per-context auditor selection (precedence: env > audit-config tier default).**
  Each of the three knobs has a matching environment variable — `YITC_AUDIT_PROVIDER`,
  `YITC_AUDIT_MODEL`, `YITC_AUDIT_EFFORT`. When a var is set (non-empty) it WINS over the
  `bin/audit-config.yaml` tier default; when unset, resolution returns the config default UNCHANGED
  (byte-identical — the committed config is test-pinned to <external-auditor>/medium by, so the env path
  must not perturb it). This lets a caller select the auditor PER-INVOCATION without editing the
  committed config — e.g. the bench harness exports the trio into each dispatched polygon worker's
  launch subshell (parity with its CODEX_HOME export) so a per-cell auditor is honored, and an ad-hoc
  consult can override on the command line. The override is read in `bin/lib/audit.py`
  resolve_audit_provider/model/effort (the single resolution chokepoint). It is a RUNTIME selection
  knob, same class as `effort` above — not a consumed-spec governing param.

  ### When invoked
  audit-pre/post apply to a TASK (Stage 4/8) OR a DECISION OR a PLAN — for a plan: the
  aggregate `audit post --plan` at the close-gate (Part B) PLUS the per-gate QUESTION
  TEMPLATES below (§Plan-stage overlays) asked by `plan check` / `plan stage <NEXT>`. For a TASK:
  audit-pre = "does the plan match scope + acceptance?" governs proceed-to-execution; audit-post =
  "does the shipped diff match the plan?" governs close-vs-reimplement. Hygiene fast-path tasks
  skip BOTH. CLI target: `audit pre|post --task T-XXXX` OR `--decision D-XXXX` OR
  `audit post --plan <slug>`.

  **Re-audit-after-close carve-out (X-0040 non-empty-delta half) — the ONE exception to
  "TASK audits run in-progress only."** A TASK audit-post normally requires `status: in-progress`
  (audits ARE Stage 4/8, which only exist for an open task). The narrow exception: a status:**done**
  task whose worktree carries LEGITIMATE post-audit-post SOURCE changes (e.g. recovery test-fixes)
  needs a FRESH audit-post over the CURRENT tree to reach a post-close `land --rebaseline` WITHOUT the
  blunt `--no-tests` (the deadlock live-hit on : the original audit no longer covers the changed
  tree, and a done task previously refused re-audit). `audit post --reaudit-after-close --task T-XXXX`
  is that path: it is **post-only + --task-only + status:done-only** (drop any one → the ordinary
  in-progress audit-post path runs unchanged; the flag rides the shared `audit post` parser surface, so
  it is FAIL-CLOSED REJECTED on a non-task `--decision`/`--plan` target rather than silently ignored),
  it ALWAYS audits **HEAD** (the current tree; `--commit`
  is rejected — the freshness guarantee is "audit the current tree"), and it records the fresh
  `audit_post_completed` GREEN/YELLOW at HEAD. The honoring of that fresh audit on the `--rebaseline`
  land rides the EXISTING `_change_is_audited` inert-delta gate (delta HEAD..HEAD is empty → audited) —
  no new honoring path (SPEC-0077 §3a sibling). The read-gate + stage-correspondence bypass this path
  requires (a done task cannot enter `stage Audit-post`) is governed by SPEC-0050's Instance.
  This SUPERSEDES the prior SPEC-0077 §3a claim that the post-close case "needs NO re-audit-after-close
  path, so SPEC-0036's in-progress-only audit rule is untouched" — it is now touched, exactly here.

  ### Verdict handling (uniform across pre / post / ad-hoc / plan-gates)
  | Verdict | Action |
  |---|---|
  | GREEN | Proceed. |
  | YELLOW (medium findings) | Absorb inline if quick; file a follow-up for residual; proceed. |
  | RED (critical/high findings) | STOP at a BLOCKING gate (re-plan / escalate; never silent-pass). At an ADVISORY plan-gate: recorded, transition proceeds (§Plan-stage overlays gate policy). |
  | ABORT (auditor unavailable / malformed) | STOP. Don't proceed without a verdict. Surface to owner. **Exception : a TRANSIENT no-read-tooling ABORT** — the auditor ABORTs claiming it lacks file-read tooling, carrying NO findings — is retried ONCE by `audit pre|post`; if it persists it is recorded (`tooling_absence_abort: true`) but does NOT burn an audit pass (the ledger is not advanced — re-run later, it is not a real ABORT). **Exception : a <external-auditor> TIMEOUT ABORT** — `_invoke_auditor` hits its hard timeout (rc==124), which maps to verdict ABORT carrying NO findings — is the SAME no-real-outcome class: recorded (`timeout_abort: true`) but does NOT burn an audit pass (ledger-skip), so a timeout never forces an `--owner-reset` (the incident). **SUPERSEDED by — the ledger now keys on the NO-OUTCOME INVARIANT, not on the cause.** ANY ABORT carrying NO findings is ledger-skipped, whatever the rc: the auditor produced no verdict, so nothing was absorbed against one (`is_no_data_verdict` — the SPEC-0173 rule-1 predicate that ALREADY classifies this shape as a run that did not complete). It strictly SUBSUMES the two per-cause predicates above, which survive as forensic MARKERS (`tooling_absence_abort` / `timeout_abort`) and keep their other jobs (the retry loop; the auto-park) — only the LEDGER stopped keying on them. FAIL-CLOSED, and this is the whole boundary: the skip needs verdict==ABORT **AND** findings==[]; an ABORT that CARRIES findings is the auditor having RUN and refused with content — a real outcome that STILL advances — and no non-ABORT verdict (GREEN/YELLOW/RED) can ever open it. **What OVERRIDES, named so it is traceable:** clause held it DELIBERATE that a non-124 no-outcome failure (auth / network / malformed config) still advances the ledger, so a broken ENVIRONMENT would surface through ceiling pressure. Overridden because (i) an ABORT ALREADY STOPs on pass 1 (this same row), so the environment surfaces IMMEDIATELY — ceiling pressure only adds a later, opaquer signal that spends the card's `--owner-reset` on the way, exactly what incident measured (rc==1 with EMPTY stdout, twice, each advancing the ledger to 3 against a HEALTHY auditor); and (ii) the ceiling counts ABSORPTION passes against an AUDITOR, so charging a run that invoked none makes the counter measure something other than what it bounds (the / measurement-validity argument, already ratified on this ledger). ACCEPTED COST: a persistent no-outcome fault matching no outage signature accrues no ceiling pressure at all — safe because nothing auto-retries an ABORT, so it cannot spin silently. Compliance on a GENUINE ABORT (one carrying findings) is unchanged. Compliance on a GENUINE ABORT is unchanged. **Exception : an AUDITOR-OUTAGE ABORT** — the auditor genuinely could not RUN (`is_auditor_outage_abort`: verdict ABORT, NO findings, AND rc in {126,127} — subscription-preflight refusal / <external-auditor> CLI missing — OR an env/config / usage-limit / quota signature; EXCLUDES the rc==124 timeout above) is a no-plan-defect class: there is nothing in-scope to fix, so a DISPATCHED worker (`YITC_EXPECTED_SESSION_REF` set) is AUTO-PARKED GRACEFULLY by `audit pre|post` — the worktree+branch are torn down (`worktree park` / the shared `_park_worktree` core, emitting `worker_parked`) and the task stays `ready` on main → cleanly re-dispatchable, no dead-but-unlanded orphan (the X-0098/X-0092 incident — twice in one session). An INTERACTIVE session prints the manual `worktree park` hint instead (never auto-destroy an interactive worktree). The dispatched-worker park-not-escalate behavior is the SPEC-0103 §3a subclass. |

  ### Auditor-tier policy — routine vs FULL, and no relitigation of a FULL-settled point
  Two standing policies (owner precedent 2026-06-11). NO new mechanism: session DISCIPLINE on
  the EXISTING `--full` flag + the EXISTING consult path, never a detector or gate (CHARTER non-goal
  #7 — no behavioral auto-classifier).

  - **(b) Tier selection — doctrine/scope-sensitive gates default to FULL.** The BASE tier guidance
    lives in AGENTS §External auditor (FULL for big-plan / architectural / conceptual-coherence;
    lighter routine for small mechanical pre/post) — read it there, not duplicated here (P5). This
    SHARPENS it on the GATE axis: when the gate turns on a DOCTRINE, GOVERNANCE, SCOPE-BOUNDARY, or
    CONCEPTUAL-COHERENCE judgement — not a mechanical diff check — the session passes `--full` BY
    DEFAULT. The session JUDGES sensitivity (a routine/mechanical change stays routine); this is a
    behavioral discipline, NEVER an auto-classifier or gate (non-goal #7). Rationale: a weaker model
    relitigates settled doctrine, so a doctrine gate starts at the tier where doctrine is adjudicated.

  - **(a) No relitigation after a FULL consult settles a point.** Once a FULL consult (the
    ceiling-convergence consult, or a FULL ad-hoc) has SETTLED a point — a FRESH single-survivor
    GREEN/YELLOW on the CURRENT subject — a subsequent ROUTINE re-audit MUST NOT relitigate that
    settled point. The FULL consult is the authoritative adjudication; a routine RED that merely
    RE-ASSERTS what the fresh FULL consult resolved is treated as DOCTRINE-INCONSISTENT and is NOT
    relitigated — it is dispositioned in the audit YAML `session_disposition` citing the consult
    (the owner standing precedent «doverit umnomu» ("trust the smart one")). This GENERALIZES, as standing doctrine,
    the already-shipped MECHANIZED instance: at the `--owner-reset` ceiling-continuation the
    consult-GOVERNS path (SPEC-0124 §Audit-loop ceiling) carries the consult verdict VERBATIM with
    no weaker-model re-invocation. SAME freshness guard binds BOTH: only a consult matching the CURRENT
    subject (pre = plan_fingerprint, post = commit SHA) settles a point — a STALE / multi-survivor /
    ABORT consult settles NOTHING, and a routine RED with no settling consult governs normally.

  ### Audit-loop ceiling (CHARTER §Principle 1 applied to audits)
  RE-HOMED to SPEC-0124, which binds the SAME Audit-pre/Audit-post stage-entries and is
  therefore always delivered alongside this spec — read the ceiling contract there.

  ### Universal V2 evaluation lens (include in EVERY prompt)
  Evaluate against CHARTER principles:
  - Anti-complexity: does this add mechanism/file/rule? 4 filters passed?
  - Done = adopted: acceptance includes probe evidence (event/state/measurable)?
  - Documentation-first: relevant docs read/updated?
  - Single source of truth: parallel storage/parser created?
  - AI independence: provider-specific terms in normative text?
  - Controller+Worker only (CHARTER §P6 — the live session taxonomy; Build+Review is retired): pipeline/role-split crept in?
  - Repeated work (audit-pre / any plan-shaped artifact): does the plan add repeated work — an N+1, a
    re-read, a re-fetch, an unbounded loop or poll, a repeated scan, an unwatermarked pass — WITHOUT
    naming the neighbouring mechanism at the same seam that it reuses (or recording that none exists)?
    The classes + detect heuristics live single-home in `patterns/repeated-work-lens.md`; this lens
    asks the ONE question and never restates them (SPEC-0005 rule 8). Its authoring-side counterparts
    are SPEC-0032 §Internal item 1a (Analysis) and SPEC-0027 §Stage 3 (the plan's `reuses:` /
    `adds-first:` line) — the absence of that line is at most a finding here, never a refusal there.
    Inert for an artifact that adds no read / loop / poll / fetch / scan / worker pass.
  - **Touch-forecast / coverage COMPLETENESS is CONTEXT, never a finding.** That a file or
    a spec is ABSENT from the card's `expected_touch`, or from the `### Spec coverage of touched
    files` forecast, is NOT a defect at any severity and the auditor MUST NOT raise it as a finding —
    not high, not low, not a note dressed as one. `expected_touch` is an OPTIONAL plan-time forecast
    (SPEC-0028) whose three consumers are dispatch/planning/claim, and `task commit` now REFRESHES it
    from the committed diff (`bin/lib/task.py#refresh_expected_touch`), so a gap is a fact about WHEN
    the card was written, not about the change. The comparison stays rendered — as CONTEXT for the
    scope-fidelity judgement: a path in the diff the card's SCOPE does not justify is still a
    scope-fidelity finding, judged on the CHANGE and never on the forecast's completeness.
    ENFORCED, not merely asked: a RED whose ONLY findings carry `class_id: forecast-completeness`
    (`bin/lib/audit.py#FORECAST_COMPLETENESS_CLASS_ID`) is REFUSED at the parse floor —
    `bin/lib/audit.py#red_findings_forecast_completeness_only`, the sibling of SPEC-0204 rule 1's
    contract-fields floor — so no verdict is recorded and NO pass is spent. A RED carrying a genuine
    finding ALONGSIDE a forecast remark is recorded normally; the refusal can only ever discard a
    verdict with nothing else in it. Grounds: three of four RED audit-pre passes on 2026-09-09
    ( pass 2 pass 2 + its consult) were of this class, each a ceiling exit.
  - **WITHDRAWN-TEMPORARILY (owner directive 2026-09-05) — the full-verdict rule
     is NOT in force.** It required every RED verdict (audit-pre AND audit-post) to
    enumerate the COMPLETE defect set over the WHOLE subject, with a `findings_complete: true |
    false` declaration read fail-closed on omission, and a one-shot completion re-prompt in the same
    pass. Measured over the day it ran, ordering a fresh whole-subject survey on EVERY pass made the
    loop worse, not shorter: audit-post RED share 16% -> 44%, post-audits per task median 2 -> 3
    (share with 3+ passes 41% -> 62%), max consult rounds per (task,stage) 1 -> 11. An external
    ad-hoc consult confirmed the mechanism (the clause re-surveys the whole subject each pass, and
    `findings_complete` records a model assertion rather than an exhaustive boundary) and ruled a
    prompt-only narrowing UNSAFE, naming a plain revert the safe temporary rollback. No auditor
    surface carries the clause and no verdict schema asks for the declaration. The NARROWED
    successor — ONE exhaustive survey at the baseline-establishing consult, later rounds scoped to
    that baseline's closure plus fix-induced regressions — is being designed in plan
    `frozen-defect-baseline-at-the-audit-loop-ceiling-d`; read the rule there, not here. The CONSULT
    half was withdrawn on the same terms in SPEC-0124 §Ceiling-convergence triage.
  - Amendment-merit (a CHARTER-amending artifact — E-0013): IF the artifact EXPLICITLY proposes to
    AMEND a CHARTER principle/section AND states the amendment's
    merit, do NOT RED it merely for being incoherent with the CURRENT CHARTER text — that
    incoherence is the POINT of an amendment, not a defect. Evaluate the amendment ON ITS MERITS
    (justified by a real need / prior-art? scoped? retirements named? probe-shaped? does it EXPLICITLY
    amend the surface it changes, not silently bypass it?); RED only if the amendment ITSELF is
    unsound / unjustified / out of scope. Inert for ordinary artifacts proposing no amendment —
    coherence-with-current-CHARTER still governs those. Parity with the decision audit-pre amendment
    overlay (AGENTS §Per-stage overlays); without it any §N-amendment plan is incoherent-by-construction
    and structurally cannot pass before the amendment lands (E-0013, N=2).

  ### Monotonic per-pass re-audit prompt (pass N>=2) ( — lever #1 of plan
  audit-reliability-and-convergence-overhaul-monoton; X-0134 RC1a)
  The auditor prompt is MONOTONIC across re-audit passes — it does NOT re-survey from scratch.
  - **NEW (account-for-prior FIRST):** on pass N>=2 (a prior saved audit record exists for this
    target+stage) the prompt LEADS with a monotonic re-audit section — placed AFTER the fixed lens but
    BEFORE the fresh-survey overlay/body so it is read first. It (a) inlines the PRIOR verdict's
    findings verbatim, (b) renders the plan/diff DELTA — the prior artifact IDENTITY (plan_fingerprint
    for pre / commit sha for post) as the FROM endpoint, plus a computed unified diff when the prior
    artifact text is available, else an explicit framing of the current plan/diff (in the body) as the
    TO endpoint — and (c) makes the auditor's FIRST task per-prior-finding RESOLVED / NOT-RESOLVED
    against that delta. Only THEN may it raise a finding, and a NEW finding MUST be justified as
    genuinely-new (a real defect the current change introduced OR the prior pass missed) — NOT a
    re-survey of settled ground and NOT a goalpost-shift. CONVERGENCE: all prior findings resolved +
    no new REAL defect -> GREEN.
  - **NOT BLINDED (constraint #2):** monotonic means "account for prior first", NOT "new findings
    forbidden". A genuinely-new REAL defect STILL surfaces and STILL blocks (verdict != GREEN); the
    section says so explicitly, so the convergence pressure never suppresses a real defect.
  - **CONDITION-BASED resolution, NOT diff-delta-only ( — X-0134 RC1a out-of-diff half; live
    incident false-RED):** marking a prior finding RESOLVED is judged against its CURRENT
    SATISFACTION in the FULL packet the auditor now sees (the body, the attached/referenced files,
    AND the surfaced adoption/state evidence) — NOT only against whether the audited DIFF changed
    since the prior pass. A resolution may live OUTSIDE the audited diff: an ENGINE / environment fix
    or freshly-surfaced evidence that now renders a once-missing thing PRESENT (e.g. an
    adoption-evidence SURFACER fix that makes `state_checked` / `external_audit_completed` evidence
    visible in the packet). So an UNCHANGED audited diff is NOT, by itself, grounds to carry a prior
    finding forward — the auditor must re-check the FINDINGS CONDITION, and mark it RESOLVED when
    that condition is now met REGARDLESS of diff change. The diff-DELTA stays an AID for justifying a
    genuinely-NEW finding (what the current change introduced), NOT the sole resolved-test for a prior
    finding. This NEVER becomes a blanket clear-on-no-change: resolution must be GENUINE — RESOLVED
    only when the condition is ACTUALLY satisfied now; a still-unmet condition STILL blocks (verdict
    != GREEN) even with no diff change. This is an in-place ADDITIVE clarification (SPEC-0005 §7): the
    rule was silent on out-of-diff resolution; the in-diff path + the not-blinded + goalpost-shift
    invariants are UNCHANGED.
  - **AMENDMENTS ARE RENDERED ( — X-1182; kupiclub):** the section ALSO inlines the
    card's `amend_notes:` entries — the notes `task update --note` appends — but ONLY those written
    AFTER the prior pass. `task update --note` is the governed route for ANSWERING a finding, yet
    `amend_notes` was rendered NOWHERE in the packet: an author answered three findings through it and
    the next pass returned the identical three, each prefixed "Prior finding N NOT-RESOLVED". The
    auditor was not disagreeing — it never saw the answer, and the only other route out was a further
    commit that `task commit --fix-red` correctly refuses as bookkeeping-only. So the answer is made
    VISIBLE where it is used, rather than the write being warned about. Three bounds: the cut is
    DIFFERENTIAL (entries after the prior pass only, so the prompt budget stays flat as a card
    accumulates amendments) and FAIL-CLOSED (an unparseable prior timestamp or entry prefix renders
    nothing — the whole history is never dumped); an amendment is EVIDENCE the auditor must engage,
    NEVER by itself a resolution — a finding whose CONDITION is still unmet STILL blocks whatever the
    amendment argues, which leaves the condition-based resolution rule above untouched; and pass-1
    packets are unchanged, since the whole section renders only on pass N>=2.
  - **RESOLUTION ROWS — the auditor judges a CHECK instead of re-surveying :** an
    `amend_notes` entry written after the prior pass (the SAME differential cut as the bullet above,
    never widened) whose note body matches the one-line grammar
    `RESOLVED <finding-index>: <text> | CHECK: <text> | OUTPUT: <text>` — the literal `RESOLVED`, a
    1-based index into the PRIOR verdict's findings order, then the three `|`-separated fields — is
    rendered as a TABLE ROW aligned to that prior finding, and the section instructs the auditor to
    judge THAT recorded check FIRST. A prior finding no entry names rows as `no resolution recorded`,
    which carries no claim either way. The grammar is a READING convention over the existing field:
    the raw note stays the source of truth (every entry, parsed or not, still renders verbatim), the
    row is an INDEX into it, and NO new field, store or verb is introduced — `task update --note`
    remains the writer. The ENGINE NEVER EXECUTES THE CHECK: the author records the OUTPUT and the
    auditor reads it, so a row is EVIDENCE — never by itself a resolution, and a finding whose
    condition is still unmet STILL blocks (the framing, unchanged). PARSE FAILURE: an entry
    beginning `RESOLVED` that does not match the grammar, or that names an index outside the prior
    findings, renders UNSTRUCTURED exactly as it did before this rule PLUS ONE diagnostic line naming
    the entry and the expected shape — never silent loss, never a refusal. Pass-1 packets are
    unchanged (the whole section renders only on pass N>=2).
  - **Scope:** the absorption-loop audits only — TASK audit-pre/post + PLAN gate audit-post (the shared
    `build_audit_prompt` engine). The consult / ad-hoc / decision target-kinds carry their own
    prior-trail handling and are passed NO `prior_record`, so they are unaffected.
  - **Compatibility (additive — SPEC-0005 §7 in-place extension; no new SPEC-ID):** the section is
    rendered ADDITIVELY and ONLY on pass N>=2; pass-1 prompts are unchanged. The audit-record SCHEMA is
    untouched — the ledger-skip family (single-homed at SPEC-0124 §Ledger-skip axes) and the
    recorded `passes:` semantics are PRESERVED (the ceiling still counts passes identically — this
    changes the PROMPT, not the counting). The
    prompt text is DERIVED implementation wording (SPEC-0005 rule 8 cue+pointer); the canonical rule is
    THIS section, the code home is `build_audit_prompt` / `_format_monotonic_reaudit_section`.

  ### Task per-stage overlays

  - **audit-pre (Stage 4) — plan quality:** scope match with task AC; alternatives / prior-art
    considered (existing analog — spans current artifacts AND the PLAN layer, `plan list --status
    accepted`); scope-creep risk; implementation-plan completeness (file list / test strategy /
    risks); adoption-honesty (E-0005: narrowing a claim about an out-of-scope downstream obligation
    is valid ONLY if a tracked blocking follow-up is filed); PLACEMENT (SPEC-0073): is each new / re-scoped artifact the plan forecasts correctly placed kernel (methodology a consumer pins) vs v2-self (this repo's dev-history that never travels) vs project — flag a V2-SELF class treated as kernel (export-slice leak), or an exception-capable artifact (spec/pattern) whose placement the plan leaves implicit (`spec new` fails closed without a `--travels` decision). ALSO inline relevant `lessons/` entries to the design-judging auditor via the EXISTING `audit pre --from-file <lesson>` carrier — the audit lessons read-surface (SPEC-0091 Rule 1). CONTENT-BOUNDARY BINDING (SPEC-0005 §3 / X-0134 RC1b): when a forecast change AUTHORS or EDITS a spec, implementation detail — DTO / payload / schema SHAPES, field / function signatures, data-structure layouts, runtime flags / env-var names / config keys / CLI spellings — is METHODOLOGY-FORBIDDEN spec content (it lives in the code or the plan, never the spec body); the audit-pre lens binds the auditor to NOT flag the ABSENCE of such impl detail as a defect and NOT DEMAND that a spec ADD it, because demanding it asks the author to VIOLATE SPEC-0005 §3 — a spec that states its rule and omits the wire-level / code-level shape is CORRECT and complete, not 'under-specified' / 'missing detail'. This is DERIVED prompt wording; the canonical content-boundary rule stays single-homed in SPEC-0005 §3 / SPEC-0046 (cue + pointer, SPEC-0005 rule 8), guarded by a drift-probe test.
  - **audit-post is CONDITIONAL on exactly one thing — a project-declared exemption case (SPEC-0178,
    additive amendment; rule 8 makes this a PRECONDITION of that spec's activation).** A project MAY
    declare, in its own `yitc-ops.yaml`, named cases whose matching cards close WITHOUT the Stage-8
    audit-post below, each carrying a mandatory reason recording who accepted the risk and why.
    Everything else about this contract is unchanged. The bounds are stated identically here, in
    SPEC-0015 and in the CHARTER — a surface stating a DIFFERENT bound is a standing contradiction
    (CHARTER §P7), not a wording variation:
    **audit-post ONLY (rule 2)** — a case never reaches audit-pre, the Tests stage, the land-verify
    layers, the worktree-before-write rule, or the Closure probes;
    **a skipped audit-post burns NO audit-loop pass and CANNOT satisfy Principle-8 adoption evidence
    (rule 4)** — an absent audit is not a failed one, so nothing is counted against the audit-loop
    ceiling, and an infra-class card takes audit-post regardless of any case matching it;
    **a card whose diff touches a GOVERNANCE surface takes audit-post whatever a case says (rule 3)**
    — computed on the diff, never on the declaration;
    **automation may only RESTORE this gate, never remove one (rule 5)** — removing it is always an
    explicit project act — **AND that automatic restoration is INOPERATIVE wherever the `kind`
    judgement is not made**, since it counts only captures judged a DEFECT at triage, a call that is
    optional and, measured across three consumers' entire history, never made; where it is not made,
    restoration is carried by the SPEC-0178 rule 7 periodic review. That qualification is not
    optional wording: without it this contract would promise a stronger safeguard than SPEC-0178
    provides. A card closed under a case records `task_closed.data.exempted_case` (SPEC-0025).
  - **audit-post (Stage 8) — ship quality:** shipped-diff drift from plan; each AC has a probe
    result; missing adoption (code shipped but not invoked) — for an infra-class task confirm a
    Principle-8 adoption artifact exists. **The P8 artifact has THREE equally-valid forms per CHARTER
    §8: a `consumer_read_evidence` event, a `live_trigger_evidence` event, OR — the THIRD
    satisfier — an EXPLICITLY BLOCKING ADOPTION FOLLOW-UP FILED. ANY one is sufficient.
    NEVER RED because the task used one valid form when you expected the other.**
    **The third satisfier's SHAPE is three-part and fail-closed (SPEC-0119 rule 31):** a followup
    whose text DECLARES `P8-CARRIER: <the audited task id>`, carrying BOTH (a) a named trigger
    condition and (b) a machine-resolvable awaited artifact (`--awaits`, the SPEC-0095 fire key,
    which is also its ownership). All three parts, or it is not a carrier: a followup missing the
    marker, the trigger or the awaits buys nothing and is judged exactly as before. Such a carrier
    is rendered in the audit-post packet's `### Adoption evidence` section, labelled `blocking
    adoption follow-up (SPEC-0015 third satisfier): <id> awaits <artifact>`
    (`bin/lib/debt.py#p8_carrier_followups` folds it — the SAME reader the `debt` view uses — and
    `bin/lib/audit.py#format_p8_carrier_followup_section` renders it).
    **SCOPE — it satisfies THIS gate, and defers rather than discharges.** It satisfies the
    audit-post adoption criterion, which is where a DEFERRED adoption (one whose live firing is
    unreachable before the ship lands) previously had no route at all: filed exactly such a
    carrier and RED-ed through two further passes because the accepted-carrier set omitted it. It
    does NOT change closure: the `task close` CHARTER §P8 / E-0005 WARN logic still reads only the
    two P8 EVENT types, and the followup stays on the `debt` echo — un-dischargeable by time
    passing — until its named trigger fires. This is NOT a member of the deferred-adoption OVERLAY
    family below: those exempt an ABSENCE and take a flag, while this renders an artifact that
    EXISTS, takes no flag, and adds no store, event or gate.
    **TRIGGER-FIRED MECHANISM — adoption demand is keyed on BEHAVIOUR, not the `class:` label
    (X-0089):** for ANY shipped mechanism whose SUCCESS DEPENDS ON AN EXTERNAL TRIGGER FIRING —
    a scheduler/cron/celery-beat, a hook, an event-consumer, or any periodic/background runner —
    demand **live-trigger OR synthetic-load** evidence that the mechanism ACTUALLY FIRED (the
    `live_trigger_evidence` form), REGARDLESS of the task's `class:` label. A direct-call UNIT test
    proves the code runs WHEN CALLED, not that the trigger invokes it in production — so a unit test
    alone is NOT adoption evidence for such a mechanism. This catches the mis-classification path: a
    triggered mechanism filed `class:feature` (e.g. a periodic cache-GC) escapes the class:infra-scoped
    confirmation above and ships audit-post-GREEN though no runner ever fires it in prod (the X-0089
    incident). This is **NARROWLY scoped to trigger-fired success-depends-on-firing mechanisms** — it is
    NOT a blanket live-trigger demand on all infra or all features; an intrinsic-behaviour change whose
    success does NOT depend on an external trigger is unaffected (judge by behaviour, never by a
    keyword). NO new mechanism/detector — this is the auditor's adoption-honesty judgement (CHARTER §P8),
    sharpened in prompt only.
    **DIFFERENTIAL PROBE — per acceptance criterion, name the input that would make it FAIL (X-0246):**
    for EACH acceptance criterion, the auditor MUST answer: *would this criterion still pass if the thing
    under test were BROKEN?* If yes it is a smoke check, not a probe — the criterion is **NOT met**, and
    that is a **RED** no matter how exactly the shipped diff matches the plan. Diff-matches-plan and
    criterion-is-differential are two INDEPENDENT questions; a card can pass the first and fail the second,
    and until now only the first was asked. **VACUOUS-ABSENCE sub-class (the named failure mode):** a
    criterion satisfied by asserting an artifact is ABSENT (no event fired / no command ran / no file
    written) is VACUOUS unless the shipped diff shows the mechanism that PRODUCES that artifact was
    actually INVOKED in the same scenario — an absence asserted over a state where the mechanism was never
    called is true of the EMPTY state and proves nothing. Its mirror: a criterion asserting an artifact IS
    present while the property under test is VIOLATED enshrines the defect as expected behaviour. Real
    incident (corrected by): a proof card shipped a test whose escalate-branch never
    invoked the verb it claimed to gate, so its `no deploy_completed` assertion was vacuously true; it
    passed byte-for-byte against a verb carrying NO gate at all — which is exactly what had. This
    is a lens DEMAND, not a new mechanism: the differential discipline is homed at CHARTER §Principle 3
    (done = adopted) and cued at authoring by SPEC-0060 §4 — one rule, now ASKED at verify where filing
    only PROMPTED it.
    **ORDERING (E-0008 sub-cause 2):** for an event-based P8 task the adoption event is emitted
    DURING Execution (Stage 5) — by the SESSION running `bin/yitc-v2 event …` (V2 has NO automated
    emitter code path and adds none) — so it is EXPECTED already present at audit-post. Read it from
    the `### Adoption evidence` prompt section (events.jsonl is excluded from the diff).
    Judge ONLY whether SOME P8 event of either form EXISTS — the absence of an automated emit
    call-site is NEVER a finding. A still-absent event is the adoption gap ONLY if NO P8 event of
    EITHER form exists; never RED a not-yet-emitted timing artifact (closure-time emission would
    post-date you); `task_closed` metadata absent now is expected (Stage 9 follows you).
