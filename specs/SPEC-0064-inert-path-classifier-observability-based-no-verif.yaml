id: SPEC-0064
title: Inert-path classifier — observability-based no-verify classification of a changed-path set

status: active

created_at:

consumed: false # documentary/contract spec — code calls the classifier helper; it does
                               # not read a governing SCALAR param from this spec body.

implements: [bin/lib/worktree.py#_classify_inert_paths] # design-phase draft ( B5): the code anchor — the single
