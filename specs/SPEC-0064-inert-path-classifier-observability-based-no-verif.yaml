id: SPEC-0064
title: Inert-path classifier — observability-based no-verify classification of a changed-path
  set
status: active
created_at: 2026-06-09 10:14:10+00:00
consumed: false
implements:
- bin/lib/worktree.py#_classify_inert_paths
- bin/lib/worktree.py#_resign_only_spec_paths
body: "## Scenario\n\nLand's verification (the test suite + the host-leak canary)\
  \ is expensive (~96s, ~the whole land).\nSome changes that ride a land CANNOT alter\
  \ the verification's outcome, because the verification\nenvironment never OBSERVES\
  \ them. The classifier answers one question over a set of changed paths —\n**\"\
  is every path INERT to what land's verification can observe?\"** — so callers can\
  \ safely skip\nverification work that provably cannot change its verdict. It is\
  \ a pure classification primitive: it\ndecides nothing about WHEN to skip (that\
  \ is each caller's rule); it only labels a path-set.\n\n## Internal\n\nTHE INERT-PATH\
  \ CLASSIFIER — one shared authority, consumed by every land-verification skip decision\n\
  (the inert-retry re-verify skip; the conditional host-leak canary). One helper,\
  \ one reason taxonomy,\none evaluation point — callers MUST NOT re-encode \"inert\"\
  .\n\n### 1. Definition (observability, not a path whitelist by convenience)\nA path\
  \ is **INERT** iff a change confined to it cannot alter the outcome of land's verification.\n\
  The verification environment OBSERVES: which test files exist (test discovery);\
  \ the code the tests\nimport and execute (`bin/**`); env / config the run reads\
  \ (e.g. `bin/*-config.yaml`); generated\nfixtures; repo-root behaviour; and the\
  \ host-leak canary's clean-checkout shape. A change to anything\nin that observable\
  \ set is **OBSERVABLE** (NOT inert).\n\n### 2. The fail-closed allowlist (the operational\
  \ rule)\nA changed-path set is classified **INERT only if EVERY path is in the proven-inert\
  \ allowlist**;\nANY path outside it makes the whole set **OBSERVABLE**. Proven-inert\
  \ allowlist:\n`tasks/** · decisions/** · plans/** · ideas/** · errors/** · events.jsonl\
  \ · graph/**`.\n(`errors/**` added by trial run 1 — the E-XXXX case-files are artifact-data\
  \ the suite isolates in\ntempdirs exactly like `decisions/`, proven by the tests/\
  \ sweep; see §5.)\nEverything else is OBSERVABLE — explicitly including `bin/**\
  \ · tests/** · specs/** · patterns/** ·\ntop-level *.md · _template.yaml · repo-root\
  \ config/build files · any unrecognised or new path`.\n(`patterns/**` was a trial-1\
  \ candidate — trial run 2 DISPROVED inertness: several tests ASSERT on\nthe REAL\
  \ `patterns/*.md` content — `test_decomposition_ordering_rule.py` reads\n`patterns/plan-lifecycle.md`\
  \ + `patterns/big-plan-checklist.md`; `test_t0393` reads\n`patterns/event-emit-only-audit-post.md`\
  \ — so a `patterns/` change CAN alter a verify verdict.\nCORRECTLY OBSERVABLE. The\
  \ contrast with `errors/`: no test asserts real `errors/` content.)\n**Fail-closed:**\
  \ an unknown/new path is OBSERVABLE by default; widening the allowlist requires\
  \ a\nseparate proof that the added class is unobserved (a spec change), never an\
  \ ad-hoc exception.\n\n### 2a. Verified re-sign — the ONE content-level case (narrow,\
  \ fail-closed)\nA `specs/` path is INERT, as an exception to §2, only when ALL of\
  \ these hold for its change between\nthe two revisions the delta was read from:\n\
  \  - it is a top-level `specs/SPEC-*.yaml` file, a regular file at BOTH revisions\
  \ (an added, deleted\n    or mode-changed spec is OBSERVABLE);\n  - the two texts\
  \ differ in NOTHING but the top-level `implements_signature:` mapping — every other\n\
  \    byte, comments and the body included, is identical;\n  - both mappings carry\
  \ the same anchors (an added or dropped signature is OBSERVABLE);\n  - every changed\
  \ value is the LIVE signature of its anchor over the anchor's file at the newer\n\
  \    revision — exactly what `spec reverify` writes for the code being landed.\n\
  Anything not proven — an unreadable revision, an unsignable anchor, a value of another\
  \ shape — keeps\nthe path OBSERVABLE. Every other `specs/` change stays OBSERVABLE:\
  \ a body, `implements:`, `status:`,\n`binding:` or any other field edit, even when\
  \ it rides beside a re-sign in the same file.\nThe rule is applied inside the one\
  \ authority (§4), and only where the caller hands it the delta the\npaths came from:\
  \ the land's inert retry skip and inert first-attempt skip (SPEC-0065) and the\n\
  Stage-6 credit's comparison of the tested tree with the candidate (SPEC-0065 §Bound,\
  \ condition 2),\nin the kernel and in consumers alike; asked without that delta\
  \ the authority answers on paths alone,\nas before. A path the rule admits STAYS\
  \ in those callers' reader check: a test of the project that\nnames the spec file\
  \ still ends the skip or the credit, because the §5 proof covers the engine's own\n\
  tests/ only, never a consumer's.\n\n### 3. Evaluation point — the FINAL merged tree,\
  \ measured against the base it will ff onto\nThe classifier is ALWAYS evaluated\
  \ on the diff of the **final merged tree about to fast-forward\n`main`** — concretely\
  \ `merged_base..HEAD`, where `merged_base` is the `main` tip THIS attempt\nmerged.\
  \ So the classified set is the **landing branch's OWN delta, the one the ff is about\
  \ to\napply** on top of that tip. Two things it is NOT: never an initial branch\
  \ diff, and never the set\nof paths the re-merge BROUGHT IN from newer `main` —\
  \ content that arrived with `main` is present\nin both `merged_base` and `HEAD`,\
  \ so it cancels out of this diff by construction. (Both consumers\nevaluate this\
  \ same point: SPEC-0065 for the inert-retry re-verify skip, SPEC-0066 §2 for the\n\
  conditional canary.)\nUnder concurrency a land re-merges newer `main` on each retry,\
  \ which MOVES `merged_base` — so the\ndelta is RECOMPUTED against the CURRENT base\
  \ on every attempt, never carried over from an earlier\none. That recomputation\
  \ is what keeps the classification honest: the base changed, and resolving\nthe\
  \ branch against that newer base can put observable content into the branch's own\
  \ delta that an\nearlier attempt's evaluation did not contain.\n\n### 4. One implementation\
  \ authority\nExactly ONE helper computes the classification and returns a single\
  \ result shape — a verdict\n(`inert` | `observable`) plus a reason (the offending\
  \ path-class when observable). Every caller\nconsumes THAT helper's output; no caller\
  \ re-derives \"inert\" from its own path test (the drift the\none-authority rule\
  \ forbids).\n\n### 5. Why the allowlist members are inert (interpreting note, not\
  \ the rule)\n`tasks/ decisions/ plans/ ideas/ errors/` are artifact YAML/markdown\
  \ the suite never imports as code,\nand tests run in process-isolated tempdir git\
  \ repos that do not read the real checkout's artifact\ndirs (the trial-1 tests/\
  \ sweep confirmed every `errors/` reference in tests is a tempdir fixture —\ntest_t0246:\
  \ \"…errors/… at an empty tmp dir, so the build NEVER opens\" the real one);\n`events.jsonl`\
  \ is append-only journal data; `graph/**` is derived (land rebuilds it). So a change\n\
  confined to them changes nothing the suite or canary executes or observes. `specs/\
  \ patterns/ *.md`\nare EXCLUDED on purpose — they are not proven unobserved (a spec/pattern\
  \ may be read by a code path a\ntest exercises), so the fail-closed rule keeps them\
  \ OBSERVABLE.\n**Correction — the \"tests do not read the real artifact dirs\" clause\
  \ is not literally true.**\nMeasured: `test_decomposition_ordering_rule.py` reads\
  \ real cards `tasks/` + ``,\n`test_t0526_measurement.py` reads `tasks/`, `test_event_catalog_completeness.py`\
  \ folds the\nreal journal, and the `test_spec0178_*` tests glob real `tasks/`. The\
  \ allowlist (§2) is UNCHANGED:\nlever B stays sound because an earlier attempt of\
  \ the same land verified the branch's own bytes, and\na skip WITHOUT that backstop\
  \ must add its own reader check (SPEC-0065 §Bound, condition (d)).\n**Exact paths.**\
  \ The classifier judges each path EXACTLY as git names it — no decoded\nfilename\
  \ character is stripped, whitespace and line terminators included; only a leading\
  \ `./` is\nnormalised — so `\" tasks/x.py\"` (an unknown top-level dir) is OBSERVABLE,\
  \ never the inert\n`tasks/x.py`, and a decoded name that ends in a line feed is\
  \ never the inert journal; its delta\ncallers enumerate with renames off.\n**Why\
  \ a verified re-sign is inert (§2a) — the tests/ sweep.** Of the tests that read\
  \ the REAL\ncheckout's `implements_signature:` values, one compares a stored value\
  \ with the live signature\n(`tests/test_anchor_signature_currency.py`) — a value\
  \ §2a admits only when it IS the live signature,\nso that test stays green; two\
  \ read only that the keys are present and the values are 64-hex digests\n(`tests/test_spec1010_ownership_judgement_tripwires.py`,\
  \ `tests/test_t13151_audit_terminal_token.py`)\n— §2a admits no key change and no\
  \ other shape; the rest read the real spec files but cannot tell one\nwell-formed\
  \ value from another (both sides of their comparison come from the same file, or\
  \ they read\nthe key's position only). Every other test naming the key builds its\
  \ specs in a temporary repository.\nNo test runs a signature-currency check (`graph\
  \ conformance --strict`, `spec reverify --check`) over\nthe real checkout. A test\
  \ added later that reads a signature value of the real checkout re-opens\nthis proof.\n\
  \n## Parameters\n\nThe proven-inert allowlist (§2) is the governing set. It is a\
  \ code constant in the classifier helper,\nNOT a runtime/config param; changing\
  \ it is a normative spec change (§2 fail-closed clause).\n\n## Rationale\n\nLand\
  \ median ≈ 96s ≈ the whole land; worst-case 457s comes from re-running full verify\
  \ on concurrency\nretries; ~79% of real ship commits touch only the inert allowlist\
  \ (2026-06-09 telemetry, plan\n`speed-up-land-under-concurrency-inert-retry-re-ver`).\
  \ The observability framing + the exclusion of\n`specs/`/`*.md` are the load-bearing\
  \ safety conditions established by the external consults\n(`decisions/land-canary-conditional-audit-adhoc.yaml`)\
  \ + the plan-check (the deliberation lives in\nthe plan, per <workshop-spec> rule\
  \ 3).\n\n§2a was added by (owner directive 2026-10-27: a spec re-sign must not force\
  \ tests to re-run),\nin place as an additive extension (SPEC-1037 §7): before it\
  \ a re-sign after a Stage-6 run refused that\nrun's credit (`tree-differs:specs`,\
  \ twice in one consumer in the week to 2026-10-27), and every\nalready-covered `specs/`\
  \ case reads as before. The tests/ sweep of §5 was taken for that card.\n\n## Verification\n\
  \nUnit: the classifier returns `inert` for a path-set drawn only from the allowlist;\
  \ `observable`\n(with the offending class) for any set containing a `bin/**`/`tests/**`/`specs/**`/`*.md`/unknown\n\
  path; evaluated on a constructed final-merged-tree delta (not a branch diff). Adoption:\
  \ both\nconsumers (lever-B re-verify skip; the conditional canary) call the SAME\
  \ helper — provable by a\nsingle-authority test asserting one code path produces\
  \ both decisions.\nVerified re-sign (§2a): `tests/test_t14275_resign_only_inert.py`\
  \ — the authority asked with the delta\ncalls a re-sign-only spec change inert and\
  \ each other spec change in its differential observable; a\ngreen Stage-6 run followed\
  \ by a re-sign-only commit lands on the run's credit, a body edit instead is\nrefused\
  \ it, and so is the re-sign when a project test names the spec file.\n"
