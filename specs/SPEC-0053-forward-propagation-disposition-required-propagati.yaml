id: SPEC-0053
title: Forward-propagation disposition — required propagation decision at task close
status: active
created_at: 2026-06-07 11:17:41+00:00
consumed: false
implements: []
binding:
- stage-entry:Closure
body: "## Scenario\n\nWhen an infra-class task closes (the class V2 treats as mechanism/infrastructure-class),\
  \ the system must not silently skip the\nforward question: «now that this exists,\
  \ where ELSE must it be applied, and what consequent changes\ndoes that imply?».\
  \ V2 already DEFERS «apply elsewhere» to separately-filed tasks (SPEC-0034\nretrospective-routing),\
  \ but nothing GUARANTEED those tasks were considered — the prompt had no\ntrigger,\
  \ so a forward-adoption gap could leak silently (the E-0005 class). At closure the\
  \ session is\nnow FORCED to record a propagation DECISION: the follow-up task IDs\
  \ it filed (consequent work\nactionable now), a forward concern parked as an idea\
  \ (real but not yet actionable), OR an explicit\n«nowhere-else-applies» with a reason.\
  \ The owner sees, on every mechanism ship, a recorded answer to\n«where else?» —\
  \ never an unasked question.\n\n## Internal\n\nTHE FORWARD-PROPAGATION DISPOSITION\
  \ — a required closure decision for infra-class tasks (the\nmechanism/infrastructure\
  \ class; see §Scope for why infra is the required FLOOR, not a universal\nmechanism-shipping\
  \ selector). This is the SOLE home of the rule; SPEC-0015 (closure contract) and\
  \ SPEC-0034 (plan postcheck) carry only\na sibling POINTER / a read-only detection\
  \ backstop, never a second statement of it (P5, one home).\n\n### Scope — infra-class\
  \ task close (the required FLOOR, not a universal selector)\nThe disposition is\
  \ REQUIRED at `task close` for `class: infra` tasks — the SAME class V2 already\n\
  treats as mechanism/infrastructure-class for CHARTER §P8 adoption-evidence (SPEC-0015\n\
  §Infrastructure-class adoption strength; the infra catalog: format-migration / generator\
  \ / event /\ngraph / audit / parser / hook / verb / rule). The normative scope is\
  \ precisely this — **«an\ninfra-class closure requires a propagation disposition»**,\
  \ NOT «every mechanism-shipping closure in\nevery class». `class: infra` is the\
  \ required FLOOR: a clean, false-positive-free machine selector,\nnot a claim to\
  \ capture every propagation-bearing ship. Non-infra classes (feature / fix / refactor\
  \ /\ndocs / hygiene) are NOT required to record one (a disposition MAY be recorded,\
  \ but absence is not\nrefused). A blanket required-disposition across ALL classes\
  \ would need a new author-declared «ships a\nmechanism» selector + judgment call\
  \ at close; that is DEFERRED until a real incident pulls it\n(anti-complexity F4).\n\
  \n### The disposition — three valid outcomes, recorded in `task_closed`\nAt close,\
  \ an infra-class task records `propagation_disposition` in the `task_closed` event,\
  \ with\nEXACTLY ONE of three shapes:\n  - `follow_ups_filed: [T-NNNN | fu_XXXXXXXXXXXX,\
  \ …]` — ≥1 ids that capture the consequent «apply\n    elsewhere» work that is ACTIONABLE\
  \ now. (The work itself is NOT done inside this task — it is\n    FILED, per LIFECYCLE\
  \ §Filing rule; this records WHICH ids carry it.) **TWO accepted carriers\n    :**\
  \ a TASK id `T-NNNN`, or a FOLLOWUP id `fu_` + 12 lowercase hex (the kernel's own\n\
  \    carrier for consequent work, SPEC-0095). A malformed token still refuses, and\
  \ the three outcomes\n    stay mutually exclusive.\n  - `deferred_to_idea: <ideas-slug>`\
  \ — a REAL forward concern that is NOT YET actionable (no\n    task-shape yet) is\
  \ captured in the EXISTING `ideas/` home (LIFECYCLE §Planning artifacts — a\n  \
  \  flat forward note held until an incident makes it actionable), NOT forced into\
  \ a premature task.\n    **BOUNDARY (do not let the idea sink weaken filing):**\n\
  \    this outcome is ONLY for the not-yet-actionable case — an ACTIONABLE consequence\
  \ STILL becomes a\n    task via `follow_ups_filed` (SPEC-0034 routing). `deferred_to_idea`\
  \ never substitutes for filing\n    work that is already actionable at closure.\n\
  \  - `nowhere_else_applies: <reason>` — a non-empty reason asserting the mechanism\
  \ has no other\n    application site. An owner-judged claim, not a proven one (see\
  \ anti-busywork bound).\nThe three exhaust the honest answers — «filed it», «noted\
  \ it for later», «nothing else» — so the\nrequired field never forces a premature\
  \ task or a dishonest `nowhere_else_applies`.\n\n### Tooling — enumerate the candidate\
  \ sites (the disposition sweep)\nTo answer «where ELSE must it be applied?» deterministically\
  \ rather than by ad-hoc grep, run the saved\nlens `bin/yitc-v2 graph query propagation-surfaces\
  \ <SPEC>` — for a multi-site spec it returns\nthe sites already citing it (candidate\
  \ consequent-change surfaces) + the code implementing it, reusing\nthe existing\
  \ tasks_citing / code_to_specs reverse-index (no new store). It surfaces CANDIDATES,\
  \ never\nasserts completeness — the disposition decision stays owner/closer judgement.\
  \ This is a navigational\nPOINTER to the tool (SPEC-0005 rule 8); the recipe TEXT\
  \ lives in that view's own description, not here.\n\n### Structural presence-gate,\
  \ NOT a semantic correctness gate\n`task close` REFUSES an infra-class closure that\
  \ records NONE of the three outcomes (an empty /\nabsent disposition) — the same\
  \ structural, false-positive-free shape as the EXISTING empty-probe-set\nrejection\
  \ (SPEC-0015 §Probe verification): the gate checks only that a DECISION is PRESENT,\
  \ never\nwhether it is the right one. Whether the session truly found every other\
  \ site is owner-judgement,\nNOT machine-checked — V2 adds no behavioral detector\
  \ for it (CHARTER non-goal #7).\n\n### Delivery + read-contract — co-shipped with\
  \ the presence-gate (do not let policy outrun delivery)\nA required field MUST NOT\
  \ become enforceable without its rule being in the closer's declared\npre-read set.\
  \ SPEC-0053 binds `stage-entry:Closure` (delivered by `stage Closure` alongside\n\
  SPEC-0015 / SPEC-0038), but delivery-at-stage-entry alone is NOT the enforcement\
  \ contract: the\n`task close` REQUIRE-READS gate (<workshop-spec>, `_require_reads`\
  \ on `cmd_task_close`) is what refuses a\nclose until the closure contract was fetched\
  \ THIS session. Therefore the implementing task that wires\nthe presence-gate MUST,\
  \ in the SAME change, ADD SPEC-0053 to that `task close` require-reads set —\nthe\
  \ presence-gate (policy) and the read-contract inclusion co-ship (the SPEC-0007\
  \ §5b co-design\ndiscipline: a delivery obligation and its enforcement land together,\
  \ never apart). The SPEC-0015\npointer (a separate implementing task) also NAMES\
  \ SPEC-0053 so it is visible in the closure contract\na reader already holds.\n\n\
  ### Distinct from the P8 adoption-evidence WARN — adjacent axes, do not conflate\n\
  The CHARTER §P8 `adoption_evidence_seen` handling (SPEC-0015) is the VERTICAL axis\
  \ — «was THIS\ntask's shipped mechanism adopted by its own consumer?». The propagation\
  \ disposition is the\nHORIZONTAL axis — «where ELSE in the system must this now\
  \ be applied?». Both fire at infra close and\nare recorded in `task_closed`, but\
  \ they answer different questions; a task satisfies each\nindependently (P8 evidence\
  \ does not satisfy the disposition, nor vice-versa).\n\n### Relationship to SPEC-0034\
  \ retrospective-routing (what this replaces — CHARTER §P1 F3)\nSPEC-0034's retrospective-routing\
  \ guidance («an actionable rule change → file a task») is the\nEXISTING soft, non-guaranteed\
  \ forward-propagation prompt. The disposition is the missing TRIGGER\nthat makes\
  \ it guaranteed at closure. After this rule is active, retrospective-routing is\
  \ a\nREFERENCED sibling (the routing target for the filed follow-ups), NOT the mechanism\
  \ relied on to\nremember to file them — the reliance on an un-triggered prompt is\
  \ what is removed. SPEC-0034 carries\nonly a read-only DETECTION backstop (surfacing\
  \ dispositionless infra closures in a plan's corpus at\npostcheck), which references\
  \ THIS rule and does not restate it.\n\n### Anti-busywork bound\nThe disposition\
  \ asks for a recorded DECISION, not a proof of completeness. `nowhere_else_applies`\n\
  with an honest one-line reason is a first-class, expected outcome — most infra ships\
  \ legitimately\napply in one place. If the disposition degrades into ignored boilerplate\
  \ (e.g. a reflexive\n`nowhere_else_applies` with no thought), that is a methodology-rework\
  \ signal (a deviation capture),\nNOT a reason to add more gating.\n\n## Parameters\n\
  \nNone consumed.\n\n## Rationale\n\nReal incident / prior-art (CHARTER §P1 F4):\
  \ E-0005 — a shipped mechanism whose forward adoption was\nmissed behind a non-blocking\
  \ WARN. Shape prior-art: SPEC-0038 (a self-contained `stage-entry:Closure`\nsub-rule\
  \ with a SPEC-0015 pointer). Presence-gate prior-art: SPEC-0015's empty-probe rejection.\
  \ The\ndeliberation lives in the plan [[forward-propagation-adoption-trigger-disposition-r]]\
  \ (SPEC-0005 rule 3).\n\n### History moved from the rule body\n\nEach entry is a\
  \ passage moved word for word out of the rule text of the section it names;\nthe\
  \ rule it explains stays there.\n\n- From «The disposition»: (gate-specs / ad-hoc\
  \ external finding, 2026-06-07)\n- From «Delivery + read-contract»: (External ad-hoc\
  \ finding, 2026-06-07.)\n\n### Moved from the rule body\n\nEach entry is a passage\
  \ moved word for word out of the rule text of the section it names.\n\n- From «Structural\
  \ presence-gate»: So this STRENGTHENS the previously soft, skippable\n  forward-propagation\
  \ prompt into a required outcome, without becoming a content gate.\n\n## Implementation\
  \ notes\n\nNotes for the maintainer of the code, moved word for word out of the\
  \ rule text of the section\neach names.\n\n- From «The disposition — deferred_to_idea»:\
  \ This is the «not-yet-actionable forward seed» route\n  SPEC-0034 retrospective-routing\
  \ already recognises — reused here, no new store.\n- From «Structural presence-gate»:\
  \ (Contrast: the P8 `adoption_evidence_seen` signal stays a\n  non-blocking WARN\
  \ because consumer-adoption evidence CAN false-positive; a disposition's\n  PRESENCE\
  \ cannot.)\n- From «Parameters»: The infra-class scope selector reuses the EXISTING\
  \ `class:` task field + the\n  same infra-class detection SPEC-0015 §P8 already\
  \ uses — no new parameter, selector, or store.\n\n## Verification\n\n- **VP1 (presence-gate,\
  \ RED→GREEN):** an infra-class `task close` with no `propagation_disposition`\n\
  \  is REFUSED before the change and accepted after only when a disposition is present\
  \ — observe the\n  refusal flip. Evidence: the `task close` exit + `task_closed.data.propagation_disposition`.\n\
  - **VP2 (three outcomes recorded):** a real infra closure records EXACTLY ONE of\
  \ `follow_ups_filed:\n  [T-…]` / `deferred_to_idea: <slug>` / `nowhere_else_applies:\
  \ <reason>` in `task_closed` (grep\n  events.jsonl); a not-yet-actionable forward\
  \ concern routes to `deferred_to_idea`, not a premature task.\n- **VP3 (scope):**\
  \ a non-infra task closes with NO disposition and is NOT refused (the gate is\n\
  \  infra-class only).\n- **VP4 (distinct axis):** a task carrying P8 `adoption_evidence_seen`\
  \ evidence but NO disposition\n  is still refused at infra close — the two axes\
  \ are independent.\n- **VP5 (non-dangling):** empty `implements:` + non-empty `binding:\
  \ [stage-entry:Closure]` ⇒ excluded\n  from `dangling_specs`; `graph build` maps\
  \ `Closure → SPEC-0053` in `binding_report.stage_to_specs`\n  once active.\n- **VP6\
  \ (one home, P5):** the rule TEXT appears only here; SPEC-0015 / SPEC-0034 carry\
  \ only a pointer\n  / a read-only detection reference, verified by grep (no restated\
  \ rule body).\n- **VP7 (read-contract co-ship):** when the presence-gate is active,\
  \ SPEC-0053 is in the `task close`\n  require-reads set (<workshop-spec>) — a close\
  \ attempt without having fetched it is refused with the\n  require-reads message,\
  \ NOT a closure that enforces the field while the rule was never delivered.\n"
