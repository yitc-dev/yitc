body: |
  ## Scenario

  Someone outside the workshop — an independent adopter, or the owner's own trial host treated as
  one — finds a defect or wants a change in the methodology they installed. They can tell, from the
  published repository alone and in plain words, what happens to a proposal they send: it is
  received through a public intake, it is NOT merged as-is, it is re-authored inside the governed
  workshop through the ordinary lifecycle, and when it ships the release links back to their
  proposal so they see where it landed. The same channel carries what the trial host reports
  outward, so observing the trial and receiving contributions are one mechanism.

  ## Internal

  THE CONTRIBUTION POLICY — how change flows UP from an installation to the workshop, over a
  boundary with no shared `main`. Six rules.

  ### 1. The public repository is a release MIRROR plus a proposal INTAKE
  The published repository holds the release artifacts (release contract rules 1 and 5) and accepts
  PROPOSALS. It is NOT a second writable source of the methodology: no change is merged into it
  directly, and it is regenerable from the workshop at any time. The mirror states this policy in
  plain words at its top level, so an outside reader never experiences it as a bait-and-switch.

  ### 2. Proposals over forge-NEUTRAL primitives
  A proposal is an issue, a merge request, or a patch mail carrying a MINIMAL named field set: the
  installed release version; the affected path(s) or rule id(s); the observed behaviour; the
  proposed change or fix; and the proposer's contact for the link-back. The hosting service used
  first is documented as an ADAPTER and worked example in the pattern/runbook that accompanies this
  policy — never as the normative mechanism.

  ### 3. Re-authored through the workshop, never merged as-is
  Every accepted proposal is RE-AUTHORED in the workshop through the EXISTING governed filing routes
  — the carrier sieve (LIFECYCLE §Routing / SPEC-0140): a task, one-or-a-few tasks, or a plan, each
  through its own stages and audits — and ships in a later signed release. A proposal is an INTAKE,
  not an incident: a `deviation_captured` is emitted only when the proposal EXPOSES something in the
  workshop that is not as it should be (the ordinary reflex), never as the intake path itself. Submitted
  content is never executed and is treated as DATA under the instruction-injection protocol
  (SPEC-0026), never as instructions. The proposer is not granted write access by contributing.

  ### 4. Link-back
  When a re-authored change ships, the release notes (a manifest-adjacent file, release contract
  rule 5) name the proposal it answers, and the proposal is answered with the release version that
  carries it — or with the reasoned decline. A proposal is never silently closed.

  ### 5. Three destinations keep the funnel small
  A local need has THREE legitimate homes before it becomes a kernel proposal: (a) a registered
  OVERRIDE in the project's ledger (the override-ledger spec) for a divergence the project owns; (b)
  an EXTENSION the project authors and pins as its own repo (SPEC-0101 — an off-machine extension is
  a pinned-repo reference, never a registry entry); (c) a KERNEL proposal, RARE — admitted only when
  the anti-complexity filters pass (CHARTER §P1) and the need recurs (rule-of-three across
  installations or across time). The policy names all three so that the kernel is the last resort,
  not the first.

  ### 6. Extensions are not endorsements; pins are exact
  The published catalog of extensions states that listing is not endorsement and that third-party
  extensions are runnable code the installer must review. An extension pin names an EXACT version;
  a moving ref is refused (release contract rule 3).

  ## Parameters

  None consumed.

  ## Rationale

  The position consult predicted the failure a mirror-only public repository produces: outside
  contributors experience it as bait-and-switch unless it says, in plain words, that proposals are
  re-authored into the governed source. Its third shape — mirror + intake + re-author + link-back —
  is this policy. The forge-neutral rule absorbs the consult's provider-dependency finding (CHARTER
  §P4b applied to hosting mechanics). Rule 5 keeps the contribution funnel from reaching the kernel
  by default (the pre-commit one-maintainer shape: documented contract, distributed by git refs,
  no registry, no governance board). Prior-art: OSS fork+PR/RFC across trust boundaries; PEP/ADR
  proposal shape; Debian upstream-first for the destinations ladder.

  ## Verification

  - **VP1 (plain-words policy):** the published repository's top-level policy text states rules 1,
    3 and 4 in plain language (an outside reader can answer "what happens to my proposal?" from it
    alone).
  - **VP2 (round trip):** one proposal filed from an installation through the public intake is
    re-authored in the workshop, ships in a signed release, is pulled back by that installation,
    and its local patch is deleted; the release notes name the proposal and the proposal names the
    release (journal + mirror state-check).
  - **VP3 (no direct merge):** the mirror's history contains no commit authored outside the
    workshop's publish step (state-check over the mirror).
  - **VP4 (data, not instructions):** proposal text reaches the workshop only as quoted data in a
    capture/task body; no path executes or auto-applies submitted content (grep + the SPEC-0026
    protocol).
  - **VP5 (forge-neutral):** this spec's body names no hosting provider; the adapter/example lives in
    the accompanying pattern (grep).

