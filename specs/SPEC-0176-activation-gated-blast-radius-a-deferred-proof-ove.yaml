id: SPEC-0176
title: Activation-gated blast radius — a deferred-proof overlay for scope fidelity,
  never a waiver of it
status: active
created_at: 2026-08-13 01:49:29+00:00
travels: null
consumed: false
extension: null
implements:
- bin/lib/cli.py#_require_activation_gated_radius
- bin/lib/cli.py#_activation_gated_specs
- bin/lib/task.py#_activation_gated_radius_declaration_error
- bin/lib/audit.py#cmd_audit
body: "## Scenario\n\nA card activates a mandatory concern. Because the concern registry\
  \ answers only for what is\nALREADY live, the set of fixtures that activation touches\
  \ cannot be seen until the flip happens —\nand the flip is performed by the closure\
  \ of that very card. So the author cannot write an\n`expected_touch` forecast, audit-post\
  \ faults the card for the missing forecast, and the argument\nthat follows is about\
  \ a prediction nobody could have made.\n\nWith this overlay the author declares\
  \ the condition UP FRONT, ships, and then supplies a MEASURED\nreconciliation naming\
  \ the fixtures the activation actually touched. The check still runs. What\nmoves\
  \ is WHEN its evidence becomes available — not whether it is owed.\n\n## Internal\n\
  \n**Rule 1 — this is a member of the deferred-proof overlay family, not a new rule\
  \ about scope\nfidelity.** It sits on the same axis as `--event-emit-only`, `--serve-deploy`,\
  \ `--host-config`,\n`--land-emitted-event` and `--post-ship-observation` (SPEC-0036):\
  \ each names a ship whose proof\nlegitimately cannot exist at the pre-land, diff-only\
  \ audit-post. Adding a sixth member reuses an\nexisting analog (CHARTER §P1 F1);\
  \ a bespoke scope-fidelity exception was REJECTED as\nover-design by the external\
  \ consult of 2026-08-13\n(`decisions/scope-fidelity-unknowable-forecast-audit-adhoc.yaml`,\
  \ YELLOW finding 2).\n\n**Rule 2 — eligibility is an OBJECTIVE STRUCTURAL PREDICATE,\
  \ never a self-declaration.** The\ncard qualifies only if it PERFORMS a concern\
  \ activation whose affected fixtures are hidden by\nlive-active-only gating. A declaration\
  \ alone is not falsifiable and would let a card whose radius\nWAS knowable dress\
  \ itself as unknowable — the consult's YELLOW finding 1, which corrected the\ncontroller's\
  \ original proposal. The declaration is the ADMISSION TICKET (it must be present\n\
  before activation, so the exception can never be claimed retroactively); the predicate\
  \ is the\nGATE.\n\n**Rule 3 — the measured reconciliation is MANDATORY and is verified,\
  \ not accepted.** Audit-post\nchecks the reconciliation against the ACTUAL post-activation\
  \ diff and requires it to list the\nfixtures genuinely touched. A reconciliation\
  \ that is absent, unmeasured, or unverifiable against\nthe diff fails the gate exactly\
  \ as a missing forecast does today.\n\n**Rule 4 — the BOUNDARY (from the consult,\
  \ carried verbatim in substance).** Activation-gated\nmust remain an auditable structural\
  \ condition, declared before activation, UNAVAILABLE to\nordinary knowable-radius\
  \ cards, and always followed by the measured reconciliation. This overlay\nNEVER\
  \ waives scope fidelity. If a future reader can use it to skip a forecast they could\
  \ have\nwritten, the rule has been broken, not extended.\n\n**Rule 5 — the stronger\
  \ fix is named, not foreclosed.** The consult ranked a registry\ndry-run/projection\
  \ query (\"what WOULD activate\") ABOVE this overlay in principle, because it\n\
  makes the forecast writable and leaves audit-post untouched entirely. It is not\
  \ adopted here\nbecause it must model hypothetical activation semantics correctly\
  \ and would add a new query\nsurface. If the registry ever gains that projection\
  \ cheaply, this overlay becomes retirable —\nrecord that as its retirement trigger\
  \ rather than treating it as permanent.\n\n## Rationale\n\nReal incident: burned\
  \ 4 audit passes, 2 owner-reset authorizations and one full\nconvergence consult\
  \ arguing about the quality of a touched-file forecast that could not have\nexisted,\
  \ because the 20-fixture blast radius of the activation was invisible until its\
  \ own\nclosure performed the flip. The cost is not local — every future mandatory-concern\
  \ activation\npays it again. A sibling followup (fu_0357d26ef695) records a second\
  \ consequence of the same\nlive-active-only gating.\n\n## Verification\n\n- A card\
  \ WITHOUT the up-front declaration that omits an `expected_touch` forecast still\
  \ fails\n  audit-post scope fidelity, unchanged (the ordinary path is untouched).\n\
  - A card WITH the declaration but WITHOUT a measured reconciliation fails.\n- A\
  \ card WITH the declaration whose reconciliation does not match the actual post-activation\n\
  \  diff fails.\n- A card that does NOT perform an activation hidden by live-active-only\
  \ gating is refused the\n  overlay even when it declares it (rule 2 — the predicate,\
  \ not the claim, is the gate).\n"
