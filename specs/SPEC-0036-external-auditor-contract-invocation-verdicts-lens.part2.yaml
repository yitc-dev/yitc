body: "### Task per-stage overlays\n\n- **audit-pre (Stage 4) — plan quality:** scope\
  \ match with task AC; alternatives / prior-art\n  considered (existing analog —\
  \ spans current artifacts AND the PLAN layer, `plan list --status\n  accepted`);\
  \ scope-creep risk; implementation-plan completeness (file list / test strategy\
  \ /\n  risks); adoption-honesty (E-0005: narrowing a claim about an out-of-scope\
  \ downstream obligation\n  is valid ONLY if a tracked blocking follow-up is filed);\
  \ PLACEMENT (SPEC-0073): is each new / re-scoped artifact the plan forecasts correctly\
  \ placed kernel (methodology a consumer pins) vs v2-self (this repo's dev-history\
  \ that never travels) vs project — flag a V2-SELF class treated as kernel (export-slice\
  \ leak), or an exception-capable artifact (spec/pattern) whose placement the plan\
  \ leaves implicit (`spec new` fails closed without a `--travels` decision). ALSO\
  \ inline relevant `lessons/` entries to the design-judging auditor via the EXISTING\
  \ `audit pre --from-file <lesson>` carrier — the audit lessons read-surface (SPEC-0091\
  \ Rule 1). CONTENT-BOUNDARY BINDING (SPEC-0005 §3): when a forecast change AUTHORS\
  \ or EDITS a spec, implementation detail — DTO / payload / schema SHAPES, field\
  \ / function signatures, data-structure layouts, runtime flags / env-var names /\
  \ config keys / CLI spellings — is METHODOLOGY-FORBIDDEN in a spec's rule text (it\
  \ lives in the code or the plan; a note the code's maintainer needs has its own\
  \ section of the spec, outside the rule text); the audit-pre lens binds the auditor\
  \ to NOT flag the ABSENCE of such impl detail as a defect and NOT DEMAND that a\
  \ spec ADD it, because demanding it asks the author to VIOLATE SPEC-0005 §3 — a\
  \ spec that states its rule and omits the wire-level / code-level shape is CORRECT\
  \ and complete, not 'under-specified' / 'missing detail'. This is DERIVED prompt\
  \ wording; the canonical content-boundary rule stays single-homed in SPEC-0005 §3\
  \ / SPEC-0046 (cue + pointer, SPEC-0005 rule 8), guarded by a drift-probe test.\n\
  - **audit-post is CONDITIONAL on exactly one thing — a project-declared exemption\
  \ case (SPEC-0178,\n  additive amendment; rule 8 makes this a PRECONDITION of that\
  \ spec's activation).** A project MAY\n  declare, in its own `yitc-ops.yaml`, named\
  \ cases whose matching cards close WITHOUT the Stage-8\n  audit-post below, each\
  \ carrying a mandatory reason recording who accepted the risk and why.\n  Everything\
  \ else about this contract is unchanged. The bounds are stated identically here,\
  \ in\n  SPEC-0015 and in the CHARTER — a surface stating a DIFFERENT bound is a\
  \ standing contradiction\n  (CHARTER §P7), not a wording variation:\n  **audit-post\
  \ ONLY (rule 2)** — a case never reaches audit-pre, the Tests stage, the land-verify\n\
  \  layers, the worktree-before-write rule, or the Closure probes;\n  **a skipped\
  \ audit-post burns NO audit-loop pass and CANNOT satisfy Principle-8 adoption evidence\n\
  \  (rule 4)** — an absent audit is not a failed one, so nothing is counted against\
  \ the audit-loop\n  ceiling, and an infra-class card takes audit-post regardless\
  \ of any case matching it;\n  **a card whose diff touches a GOVERNANCE surface takes\
  \ audit-post whatever a case says (rule 3)**\n  — computed on the diff, never on\
  \ the declaration;\n  **automation may only RESTORE this gate, never remove one\
  \ (rule 5)** — removing it is always an\n  explicit project act — **AND that automatic\
  \ restoration is INOPERATIVE wherever the `kind`\n  judgement is not made**, since\
  \ it counts only captures judged a DEFECT at triage, a call that is\n  optional\
  \ and never made; where it is not made,\n  restoration is carried by the SPEC-0178\
  \ rule 7 periodic review. That qualification is not\n  optional wording: without\
  \ it this contract would promise a stronger safeguard than SPEC-0178\n  provides.\
  \ A card closed under a case records `task_closed.data.exempted_case` (SPEC-0025).\n\
  - **audit-post (Stage 8) — ship quality:** shipped-diff drift from plan; each AC\
  \ has a probe\n  result; missing adoption (code shipped but not invoked) — for an\
  \ infra-class task confirm a\n  Principle-8 adoption artifact exists. **The P8 artifact\
  \ has THREE equally-valid forms per CHARTER\n  §8: a `consumer_read_evidence` event,\
  \ a `live_trigger_evidence` event, OR — the THIRD\n  satisfier — an EXPLICITLY BLOCKING\
  \ ADOPTION FOLLOW-UP FILED. ANY one is sufficient.\n  NEVER RED because the task\
  \ used one valid form when you expected the other.**\n  **The third satisfier's\
  \ SHAPE is three-part and fail-closed (SPEC-0119 rule 31):** a followup\n  whose\
  \ text DECLARES `P8-CARRIER: <the audited task id>`, carrying BOTH (a) a named trigger\n\
  \  condition and (b) a machine-resolvable awaited artifact (`--awaits`, the SPEC-0095\
  \ fire key,\n  which is also its ownership). All three parts, or it is not a carrier:\
  \ a followup missing the\n  marker, the trigger or the awaits buys nothing and is\
  \ judged exactly as before. Such a carrier\n  is rendered in the audit-post packet's\
  \ `### Adoption evidence` section, labelled `blocking\n  adoption follow-up (SPEC-0015\
  \ third satisfier): <id> awaits <artifact>`\n  **SCOPE — it satisfies THIS gate,\
  \ and defers rather than discharges.** It satisfies the\n  audit-post adoption criterion.\
  \ It\n  does NOT change closure: the `task close` CHARTER §P8 / E-0005 WARN logic\
  \ still reads only the\n  two P8 EVENT types, and the followup stays on the `debt`\
  \ echo — un-dischargeable by time\n  passing — until its named trigger fires. This\
  \ is NOT a member of the deferred-adoption OVERLAY\n  family below: those exempt\
  \ an ABSENCE and take a flag, while this renders an artifact that\n  EXISTS, takes\
  \ no flag, and adds no store, event or gate.\n  **TRIGGER-FIRED MECHANISM — adoption\
  \ demand is keyed on BEHAVIOUR, not the `class:` label\n  (X-0089):** for ANY shipped\
  \ mechanism whose SUCCESS DEPENDS ON AN EXTERNAL TRIGGER FIRING —\n  a scheduler/cron/celery-beat,\
  \ a hook, an event-consumer, or any periodic/background runner —\n  demand **live-trigger\
  \ OR synthetic-load** evidence that the mechanism ACTUALLY FIRED (the\n  `live_trigger_evidence`\
  \ form), REGARDLESS of the task's `class:` label. A direct-call UNIT test\n  proves\
  \ the code runs WHEN CALLED, not that the trigger invokes it in production — so\
  \ a unit test\n  alone is NOT adoption evidence for such a mechanism. This is **NARROWLY\
  \ scoped to trigger-fired success-depends-on-firing mechanisms** — it is\n  NOT\
  \ a blanket live-trigger demand on all infra or all features; an intrinsic-behaviour\
  \ change whose\n  success does NOT depend on an external trigger is unaffected (judge\
  \ by behaviour, never by a\n  keyword). NO new mechanism/detector — this is the\
  \ auditor's adoption-honesty judgement (CHARTER §P8),\n  sharpened in prompt only.\n\
  \  **DIFFERENTIAL PROBE — per acceptance criterion, name the input that would make\
  \ it FAIL (X-0246):**\n  for EACH acceptance criterion, the auditor MUST answer:\
  \ *would this criterion still pass if the thing\n  under test were BROKEN?* If yes\
  \ it is a smoke check, not a probe — the criterion is **NOT met**, and\n  that is\
  \ a **RED** no matter how exactly the shipped diff matches the plan. Diff-matches-plan\
  \ and\n  criterion-is-differential are two INDEPENDENT questions; a card can pass\
  \ the first and fail the second. **VACUOUS-ABSENCE sub-class (the named failure\
  \ mode):** a\n  criterion satisfied by asserting an artifact is ABSENT (no event\
  \ fired / no command ran / no file\n  written) is VACUOUS unless the shipped diff\
  \ shows the mechanism that PRODUCES that artifact was\n  actually INVOKED in the\
  \ same scenario — an absence asserted over a state where the mechanism was never\n\
  \  called is true of the EMPTY state and proves nothing. Its mirror: a criterion\
  \ asserting an artifact IS\n  present while the property under test is VIOLATED\
  \ enshrines the defect as expected behaviour. This\n  is a lens DEMAND, not a new\
  \ mechanism: the differential discipline is homed at CHARTER §Principle 3\n  (done\
  \ = adopted) and cued at authoring by SPEC-0060 §4.\n  **ORDERING (E-0008 sub-cause\
  \ 2):** for an event-based P8 task the adoption event is emitted\n  DURING Execution\
  \ (Stage 5) — by the SESSION running `bin/yitc-v2 event …` (V2 has NO automated\n\
  \  emitter code path and adds none) — so it is EXPECTED already present at audit-post.\
  \ Read it from\n  the `### Adoption evidence` prompt section (events.jsonl is excluded\
  \ from the diff).\n  Judge ONLY whether SOME P8 event of either form EXISTS — the\
  \ absence of an automated emit\n  call-site is NEVER a finding. A still-absent event\
  \ is the adoption gap ONLY if NO P8 event of\n  EITHER form exists; never RED a\
  \ not-yet-emitted timing artifact (closure-time emission would\n  post-date you);\
  \ `task_closed` metadata absent now is expected (Stage 9 follows you).\n**Deferred-adoption\
  \ + waive carve-out family (ONE table; each flag is `--task audit-post only`).**\n\
  EVERY row is a `re-lens` overlay: each INVOKES the auditor on the real subject and\
  \ only tells it\nan artifact is legitimately ABSENT/PRESENT. No row invokes NO auditor.\n\
  \n| Flag (audit-post) | What the auditor must NOT RED | Scope / predicate | Recorded\
  \ marker |\n|---|---|---|---|\n| `--event-emit-only` | the closure-event-absent\
  \ category — judge ONLY diff-drift / non-adoption AC / coherence | a ship whose\
  \ adoption probe IS a single Stage-9-recorded P8 event (the emission IS the closure\
  \ substance, not a Stage-5 side-effect): the P8 event legitimately does NOT yet\
  \ exist at audit-post — the NORMAL ordering for that ship class, NEVER a finding.\
  \ Makes the \"closure-time emission would post-date you\" exemption OPERATIVE |\
  \ `event_emit_only: true` |\n| `--serve-deploy` (SPEC-0094 §5) | the adoption-missing\
  \ category — judge ONLY diff-drift / non-adoption AC / coherence | a serve/deploy\
  \ ship is a live deploy — an ACTION, not a code diff — so live-adoption is proven\
  \ at the DEPLOY seam and recorded at Stage-9 Closure (`live_probe`), AFTER this\
  \ diff-only audit-post; EXPECTED absent here | `serve_deploy: true` |\n| `--host-config`\
  \ (SPEC-0094 §3 / SPEC-0111) | the adoption-missing category | a `host_config: true`\
  \ ship: adoption proof is the THREE hostapply evidences (`apply_confirmed` / `host_health_sweep_passed`\
  \ / `host_reconciliation_recorded`) recorded by the SPEC-0111 apply seam at Stage-9\
  \ Closure, AFTER audit-post | `host_config: true` |\n| `--land-emitted-event` (X-0188;\
  \ NAMED + guarded, X-0837) | the acceptance-probe-not-satisfied / event-absent category\
  \ — judge ONLY diff-drift / non-deferred AC / coherence | the GENERALIZATION of\
  \ event-emit-only to a NON-P8 event: an acceptance probe EMITTED BY `land` AT Stage\
  \ 9 (e.g. `verify_layer_prep`) is legitimately ABSENT at this pre-land diff-only\
  \ audit-post; the P8-closure-specific event-emit-only overlay does NOT extend to\
  \ it. **The overlay NAMES the deferred evidence :** it lists the evidence the CARD'S\
  \ OWN acceptance names, and states that such a not-yet-closed coordination row IS\
  \ that pending evidence, never an unmet criterion. Evidence the card does NOT name\
  \ is NOT exempted. **Guard (fail-closed) — this is what stops a naming carve-out\
  \ becoming a blanket excuse:** the overlay entry REFUSES (emitting the EXISTING\
  \ `read_gate_refused`) unless the card's acceptance names at least one piece of\
  \ pending-until-land evidence — an event token in a land-emitted-phrased criterion,\
  \ an event type that only `land` emits (e.g. `land_completed`) named in any criterion\
  \ (the type is itself the land-tie), or an `X-NNNN` id the card ALSO carries in\
  \ `resolves_cross` (that link is the structural land-tie; a bare prose mention is\
  \ not enough). A card naming NONE of these still REDs for its absent evidence on\
  \ the ordinary path | `land_emitted_event: true` + `land_emitted_named_evidence:\
  \ [<names>]` |\n| prototype (SPEC-0205 rules 5/6) — engine-derived, no flag | audit-pre:\
  \ nothing is exempted — the card's `prototype_ref` diff (`merge-base main..spike/<slug>`)\
  \ is inlined as the ТЗ with the overlay «the prototype is the specification, not\
  \ the deliverable; a plan that reduces to copying named paths from it is RED; state\
  \ your own design». audit-post: the `prototype_identity:` context line — a PROJECTION\
  \ of the `spike_content_previewed` row this audit wrote (a `--reaudit-after-close`\
  \ cites the land's `spike_content_checked` row), whole-file hits / hunk-subset verdict\
  \ / verbatim share, CITED by `events.jsonl#ts=`, never recomputed; context for judging\
  \ the derivation, never a verdict | a card built on a spike. **Refusal (governed,\
  \ before any auditor call, no pass counted):** `audit post` on a card with NO `prototype_ref`\
  \ whose preview reports a NON-ZERO share numerator refuses, naming the spike and\
  \ `task update <id> --prototype-ref spike/<slug>`; a zero-share card (whatever its\
  \ T1 hits) and a preview that errored proceed and are never asked to declare. Content\
  \ refusals live at `land` (SPEC-0205 rule 2), never at the auditor | the card's\
  \ `prototype_ref:` (SPEC-0028) |\n| `--post-ship-observation` (X-0710) | the acceptance-probe-not-satisfied\
  \ / no-observation-result / adoption-missing category — judge ONLY diff-drift /\
  \ non-deferred AC / coherence / whether the declared observation actually corresponds\
  \ to the AC it defers | an acceptance whose probe is a MULTI-DAY POST-SHIP PRODUCTION\
  \ OBSERVATION (<project> : «the daily count is flat or falling over 7 days»): the\
  \ reading cannot exist at this pre-land diff-only audit-post because the observation\
  \ WINDOW OPENS ONLY AFTER THE SHIP. **Guard (fail-closed) — this is what stops it\
  \ being a blanket «my proof is in the future» excuse:** the overlay entry AND the\
  \ `task close` seam both REFUSE (emitting the EXISTING `read_gate_refused`) unless\
  \ the CARD declares a well-formed, UNSETTLED `post_ship_observation: {observation,\
  \ due_by}` (SPEC-0028); an already-settled declaration is refused too (nothing left\
  \ to defer). **The deferral is TRACKED, not waived:** that same declaration is folded\
  \ by the `overdue-recheck` debt lens (SPEC-0094 §3, extended) from the moment it\
  \ is declared until a `settled_by` locator names where the recorded reading landed\
  \ — time passing moves it `pending` → `overdue`, and NOTHING but recording it clears\
  \ it | `post_ship_observation: true` + `post_ship_observation_due_by: <ISO date>`.\
  \ **SENSITIVITY (X-1126) — the declaration also names the historical evidence that\
  \ its predicate FIRES when the defect IS present** (the OPTIONAL `sensitivity:`\
  \ key, rule home SPEC-0028). An observation settles by READING A PREDICATE, and\
  \ a predicate that can never match anything reads EMPTY — indistinguishable from\
  \ «the defect is absent» — so a vacuous predicate settles on having measured nothing.\
  \ This overlay CONSUMES the key: declared, it NAMES the evidence to the auditor\
  \ alongside the observation and due window, to be weighed under judgement (4) —\
  \ does the declared observation actually correspond to the AC it defers; undeclared,\
  \ it SAYS SO and states in the same breath that the absence is an AUTHORING PROMPT,\
  \ **never a finding and never a RED on its own**. The prompt for the author is printed\
  \ report-only at the declaring seam (`_require_post_ship_observation`), which refuses\
  \ nothing new and leaves its exit code unchanged. Deliberately NO gate and NO predicate\
  \ analyser (CHARTER non-goals #2/#7) — a DISCIPLINE, not a validator |\n| `--activation-gated-radius`\
  \ (SPEC-0176) | the missing-up-front-touched-file-forecast / unforecast-diff category,\
  \ **for the reconciled paths ONLY** — judge every other touched path under ORDINARY\
  \ scope fidelity against the card's still-required `expected_touch`, and judge a\
  \ reconciliation entry that is plainly ordinary authored work as a FINDING | a card\
  \ whose OWN CLOSURE flips a `proposed` spec carrying a `concern:`/`init_concern:`:\
  \ the concern registry + activation checklist are gated LIVE-ACTIVE-ONLY, so the\
  \ fixtures the activation invalidates are structurally invisible until the flip\
  \ — and the flip is performed by the very closure that follows this audit, so no\
  \ author could have written the forecast. **Guard (fail-closed) — the least trust-based\
  \ member of the family, because what it defers is scope fidelity itself:** the overlay\
  \ entry REFUSES unless (a) the card declares a well-formed `activation_gated_radius:\
  \ {declaration, reconciliation}` (SPEC-0028), (b) an OBJECTIVE STRUCTURAL PREDICATE\
  \ holds — the card really owns such a proposed concern-bearing spec (a self-declaration\
  \ is not falsifiable: the external consult's finding 1), (c) `expected_touch` is\
  \ still NON-EMPTY, (d) the reconciliation matches the REAL diff and ENUMERATES it\
  \ (entries must be LITERAL touched paths — a glob or bare directory is refused even\
  \ when it would match, because one `*` would cover the whole diff and collapse (e)+(f)\
  \ back into the blanket waiver), (e) no ACTUAL touched path is claimed in both sets,\
  \ and (f) no touched path falls outside BOTH. **It never waives scope fidelity —\
  \ it moves WHEN the evidence exists** (SPEC-0176 rule 4); the stronger fix, a registry\
  \ projection query, is named as its retirement trigger (rule 5) | `activation_gated_radius:\
  \ true` + `activation_gated_specs:` + `activation_gated_reconciliation:` + `activation_gated_forecast:`\
  \ |\n| `--reaudit-after-close` | a \"closed inside shipped diff\" finding — REVERSES\
  \ the STAGE-BOUNDARY closure-absence expectation for this re-audit only | INVERTED\
  \ from the adoption-absence siblings — those exempt an ABSENT adoption artifact,\
  \ this exempts a PRESENT closure artifact: a re-audit of an already-CLOSED (status:done)\
  \ task audits HEAD, whose diff CONTAINS the Stage-9 closure metadata. Diff-drift\
  \ / unmet AC / coherence judged unchanged | `reaudit_after_close: true` |\n| `--zero-ship-diff`\
  \ ( guard; re-lens — the SHORT-CIRCUIT is RETIRED) | the EMPTY authored ship-diff\
  \ / \"nothing shipped\" / \"code shipped but not invoked\" category ON ITS OWN |\
  \ **re-lens overlay, the auditor IS INVOKED** on the named evidence-locator plus\
  \ any subject the caller supplies (`--from-file` / `--prompt-extra` ride the packet\
  \ as on every other overlay). CLOSING an already-LIVE task whose ship diff is **zero**\
  \ after subtracting governed lifecycle bookkeeping (task YAML, `events.jsonl`, the\
  \ task's own audit records): NO change in ANY authored artifact. An invariant of\
  \ delivery SHAPE, **NOT a size tier**. Affects Stage-8 audit-post only — **NEVER\
  \ audit-pre**. **Guard (fail-closed):** the overlay entry AND the `task close` seam\
  \ both REFUSE (emitting the EXISTING `read_gate_refused`) on ANY unresolved git\
  \ delta beyond the allow-listed bookkeeping, and both REQUIRE an `evidence-locator`\
  \ naming the pre-existing immutable record/probe; the guard is a PRECONDITION on\
  \ the delivery shape, never a review. An acceptance criterion the evidence fails\
  \ is RED exactly as usual | `zero_ship_diff: true` + `external_invoked: <derived\
  \ — true iff the auditor judged this pass>` + `ship_diff_after_exclusions: zero`\
  \ + `evidence_locator` + `verdict_producer` (§Verdict producer) |\n\n**`### DEFERRED\
  \ BY DECLARATION` — the FAMILY-WIDE reading of every carve-out above.**\nA TASK\
  \ `audit pre` packet, a TASK `audit post` packet AND the ceiling-convergence CONSULT\
  \ packet all render a\n`### DEFERRED BY DECLARATION — judge the declaration, not\
  \ the absence` section, derived from the\ncard ALONE (pure f(card); no store, no\
  \ field, no flag, no new event type — CHARTER §P1 F1/F2). It\nenumerates each deferred\
  \ CRITERION with the DECLARATION that defers it. FOUR kinds, each reusing\nthe one\
  \ existing predicate rather than restating a grammar:\n- **post-ship-observation**\
  \ — a grammar-valid, UNSETTLED `post_ship_observation:` (the same\n  predicate the\
  \ table entry and the debt lens read). A SETTLED declaration yields NO row: the\
  \ proof\n  exists, so nothing is deferred.\n- **land-emitted** — built ENTRY BY\
  \ ENTRY so each name maps deterministically back to the criterion\n  that defers\
  \ it, but a candidate is admitted ONLY if `land_emitted_named_evidence` also returns\
  \ it.\n  That flat namer stays the TRUST-BOUNDARY oracle, so this rendering and\
  \ the `_require_*` guard can\n  never disagree about what the card named; the per-entry\
  \ walk adds only the CRITERION.\n- **settle-probe-owed** — probe keys already recorded\
  \ `deferred`, plus acceptance entries naming a\n  SETTLE VERB (`--settle-probe`\
  \ / `--settle-observation` / `--settle-evidence` / `task close\n  --settle`) or\
  \ the explicit `deferred until Stage 9` shape. Prose that merely says \"later\"\
  \ matches\n  nothing and yields no row — that emptiness is the differential.\n-\
  \ **probe-moment** — each filing-time `probe_moments:` entry admitted by the reader\
  \ of the\n  `### DEFERRED PROBES` section below (its grammar + criterion-namespace\
  \ admission), one row per\n  criterion — so an orphan or undecidable moment is kept\
  \ out of both sections alike.\n\n**How it binds, and how it does NOT.** The UNIVERSAL\
  \ LENS carries a matching paragraph, appended\nONLY when the section is actually\
  \ rendered, making the section BINDING on the verdict class: for a\ncriterion listed\
  \ there the ABSENCE of its proof is EXPECTED and is NEVER a finding and NEVER a\
  \ RED.\nThe list is EXHAUSTIVE — a criterion NOT listed is judged exactly as usual,\
  \ so the section widens\nnothing. What the auditor STILL judges is the DECLARATION:\
  \ whether it corresponds to the criterion\nit defers, and whether it is dated/tracked.\
  \ A deferral naming no reading, no due date and no settle\ncarrier IS a finding\
  \ — the section is not a blanket «my proof is in the future» excuse and says so\n\
  in its own text.\n\n**Scope.** Audit-PRE, audit-POST and CONSULT. At audit-pre it\
  \ tells the auditor that a plan whose\ncriterion is DECLARED provable only after\
  \ landing is not missing its adoption proof — the plan is\njudged, the declared\
  \ absence is not. INERT by construction\n— a card that declares nothing renders\
  \ no section and gets an unchanged lens.\n\n**`### DEFERRED PROBES — settled after\
  \ landing by the Controller` — the FILING-TIME declaration,\nread at BOTH task stage\
  \ overlays.** The section above's first three kinds are all\nwritten at CLOSE. That\
  \ leaves the shape whose proof is IMPOSSIBLE before the\nland by its own wording\
  \ — an acceptance criterion whose probe is a FIRST REAL USE AFTER LANDING —\ninvisible\
  \ to BOTH audits at the moment they judge it.\n\nA TASK `audit pre` AND `audit post`\
  \ packet both render a\n`### DEFERRED PROBES — settled after landing by the Controller`\
  \ section, derived from the card\nALONE — pure f(card); no store, no new field,\
  \ no flag, no new event type (CHARTER §P1 F1/F2). Its\nONE source is the card's\
  \ `probe_moments:` (schema home SPEC-0028), the carrier SPEC-0060 requires\nsuch\
  \ a criterion to declare AT FILING. It enumerates each declared CRITERION with its\
  \ AWAITED\nMOMENT, and tells the auditor that the absence of that proof pre-land\
  \ is the DECLARED ORDERING,\nnever a defect.\n\n**TWO admission conditions, both\
  \ required; either failing drops the entry silently.**\n- **GRAMMAR** — the moment\
  \ parses under the ONE existing grammar home (an ISO `due_by` date, or an\n  `awaits:`\
  \ ref `` / `X-0042` / `events.jsonl#type=<t>[@after=<ISO>]`). A moment no reader\n\
  \  can decide declares nothing.\n- **NAMESPACE** — the key names a criterion THIS\
  \ CARD'S OWN ACCEPTANCE declares. Without this an\n  orphan key (`probe_moments:\
  \ {AC99:...}` on a card with no AC99) would let a card exempt a\n  criterion it\
  \ does not have, and the parse floor below would refuse a RED naming AC99 instead\
  \ of\n  recording it. A card whose acceptance names no parseable criterion ids yields\
  \ NO rows.\n\n**The RED parse floor — the ENFORCED half (the shape, reused).** A\
  \ RED whose ONLY findings\nare P8-adoption-class AND every one of which names, by\
  \ the SPEC-0204 rule-1 key precedence, a\ncriterion this card DECLARED deferred\
  \ is REFUSED at the parse floor: no verdict recorded, no pass\nspent, so re-running\
  \ costs nothing. It sits inside the SAME narrowing as its sibling floors\n(`target_kind\
  \ == \"task\"`, a genuine auditor response), and the refusal is the USE SITE's —\
  \ the\npredicate is pure and judges only shape.\n\n**How it binds, and how it does\
  \ NOT.** «EVERY finding», not «any», is the whole safety of it: a RED\nthat raises\
  \ a real defect ALONGSIDE a P8-adoption remark is recorded exactly as before, and\
  \ a\nP8-adoption finding against an UNDECLARED criterion is judged exactly as today.\
  \ The section is\nEXHAUSTIVE — a criterion not listed is judged as usual, so it\
  \ widens nothing. What the auditor\nSTILL judges is the DECLARATION: whether it\
  \ corresponds to the criterion it defers, and whether its\nmoment is machine-resolvable.\
  \ INERT by construction: a card declaring nothing renders no section\nand gets an\
  \ unchanged lens.\n\n**Why this is not a fourth kind of the section above.** That\
  \ section is audit-POST-only by its own\nscoping rule and reads three close-time\
  \ sources; this one is filing-time, reads a fourth source\nthose three do not (`probe_moments`),\
  \ and must reach audit-PRE. In practice they do not overlap: a filed-but-unclosed\
  \ card carries\n`probe_moments` and no `probes:`, so the same criterion is not rendered\
  \ twice.\n\n**Two rare task-audit shapes → SPEC-1013 (index).** Two shapes are decided\
  \ by the audit verb itself,\nfrom governed records, with no flag to pass. (1) A\
  \ verdict comes back and the engine marks one or\nmore of its findings machine-refuted\
  \ — a claim of a class the kernel can decide on its own. A pass\nin which every\
  \ finding is so marked is not charged; where such a pass came back RED or YELLOW\
  \ the\nverb records GREEN only inside the fence the reference states, keeps the\
  \ auditor's own word beside\nit, and a recorded Controller decision can still re-raise\
  \ the verdict. The stage follows the\nverdict as finally recorded. (2) After an\
  \ audit-post RED whose only fix is the card's own record,\nthe repair commit made\
  \ through the card-repair arm of `task commit` may stand as the audit-post\nsubject\
  \ although it is record-only: the guard admits it only when every conjunct the reference\n\
  lists holds, and every other subject with no authored content is refused. The rules\
  \ of both —\nwhich finding classes are machine-decidable and the fence around the\
  \ fold; the conjuncts of the\ncard-repair admission and its pass-1 form — are the\
  \ reference SPEC-1013: read it when either shape\nappears (`graph query SPEC-1013`),\
  \ from its heading «Rare task-audit shapes».\n\n**DERIVED-FROM-THE-CARD selection\
  \ — five of the flags above need not be passed at all.**\nEvery guard in this family\
  \ already anchors its trust in a CARD-SIDE DECLARATION (SPEC-0028), so on a\nTASK\
  \ `audit post` invoked with NO overlay flag the verb DERIVES the overlay from the\
  \ card itself:\na grammar-valid, **UNSETTLED** `post_ship_observation:` → `--post-ship-observation`;\
  \ a declared\n`activation_gated_radius:` → `--activation-gated-radius`; `host_config:\
  \ true` → `--host-config`; an\nacceptance naming a land-emitted event token and/or\
  \ an `X-NNNN` the card ALSO carries in\n`resolves_cross` → `--land-emitted-event`;\
  \ a probing `live_probe:` (`url` assertion / `attested`) or a\n`probe_moments` entry\
  \ awaiting `deploy_completed` / `live_probe_passed` → `--serve-deploy` (a\n`none`\
  \ waiver / `unprobeable` escalation derives nothing). A derived overlay is only\
  \ the same BOOLEAN the flag\nsupplies: it passes the SAME scoping check and the\
  \ SAME fail-closed `_require_*` guard, unchanged and\nin the same order, so a card\
  \ that declares something it is not entitled to is refused exactly as it\nwould\
  \ be with the flag — the derivation is a TRIGGER, never a GRANT, and can widen no\
  \ exemption.\nA SETTLED `post_ship_observation:` derives NOTHING, deliberately:\
  \ the proof exists, so there is\nnothing to defer and the ORDINARY audit applies.\n\
  **The flags remain the explicit override** — an explicitly passed derivable flag\
  \ wins and derivation\nsteps aside. **A flag that CONTRADICTS the card's declaration\
  \ is REFUSED before the auditor is\ninvoked** (no `audit_prompt_sent`, no pass spent),\
  \ naming BOTH the declared field and the passed flag:\nsilently preferring either\
  \ side would leave a verdict marked with an overlay the card never declared.\n**NOT\
  \ DERIVED** — `--event-emit-only`, `--external-action`,\n`--preshipped-deliverable`,\
  \ `--settlement-sweep`, `--zero-ship-diff`, `--reaudit-after-close`: none\nhas a\
  \ card-side declaration to key on (`--event-emit-only` describes the SHIP's shape,\
  \ not a field the\ncard carries), so they stay explicit-only.\n**Recorded marker:**\
  \ every task audit-post verdict carries `overlay_source: derived | explicit | none`\n\
  BESIDE the per-flag markers in the table above, never instead of them — those say\
  \ WHICH overlay ran,\nthis says WHERE it came from, so a later reader can tell a\
  \ card-anchored deferral from an\ninvocation-side one without re-deriving it from\
  \ the card as it stands today.\n**THE FAMILY IS CLOSED AGAINST A DECLARING-CARD\
  \ VARIANT (X-1240) — a named retirement,\nrecorded here so the next reader does\
  \ not re-derive it.** A carrier-/entry-DECLARING card — one whose\ndeliverable IS\
  \ a declaration (a live entrance, a carrier, a host config) — cannot read the evidence\n\
  of its own declaration at this pre-land audit-post: the reading is taken from the\
  \ artifact at its\nREGISTERED path, which does not carry the branch's edit until\
  \ the land, and the land comes after the\nclosure this audit gates. That shape looks\
  \ like a sixth deferred-adoption member and IS NOT ONE. The\nreading that it needs\
  \ an overlay variant of its own (`--declaration-evidence-at-land`) is RETIRED:\n\
  its ORDERING half is covered by whichever EXISTING member matches the ship (`host_config:\
  \ true` →\n`--host-config`; a serve/deploy ship → `--serve-deploy`), which the derivation\
  \ above picks off the\ncard's own declaration without any flag being passed; and\
  \ its remaining half is not an audit problem\nat all but a COMMIT one — a RED naming\
  \ the card's own RECORDED EVIDENCE is repaired through\n`task commit --fix-red --card-repair`\
  \ (SPEC-0015 §Internal, the route home).\n**RESERVED-NAMESPACE naming constraint\
  \ — the `decisions/<task-id>-*` prefix belongs to a\ncard's OWN records, so an authored\
  \ DELIVERABLE must not wear it.** The allow-listed bookkeeping named\nin the `--zero-ship-diff`\
  \ row above is PATH-SHAPED:\n`decisions/<task-id>-*.yaml` reads as this card's own\
  \ audit / consult record for ANY suffix. That\nreservation is also what the no-authored-content\
  \ guard reads, so it has a consequence for\nAUTHORING, not just for waiving: a card\
  \ whose DELIVERABLE is an authored record under `decisions/`\n— a saved finding,\
  \ a measurement, a recorded verdict — and which names it `decisions/<its-own-task-id>-*.yaml`\n\
  produces a ship whose authored-path set is EMPTY. `audit post` then refuses the\
  \ ship that carries the\nwork, and the card is structurally unauditable. **So name\
  \ such a deliverable by SUBJECT (optionally\n+date), never by task id**. This is\
  \ a NAMING rule, deliberately not a\nnarrowing of the guard: enumerating the audit\
  \ writer's own filenames here would re-encode a vocabulary\nthat module owns, and\
  \ its drift would fail PERMISSIVELY — letting a contentless subject reach the\n\
  auditor, the defect the guard exists to close. The authoring-surface pointer lives\
  \ at\n`patterns/doc-conventions.md` §Naming (LIFECYCLE §Stage 2 routes new-artifact\
  \ authors there); this row\nis the rule home.\n\n**SCENARIO-STATUS COMPUTED-VIEW\
  \ carve-out (SPEC-0076 §3) — unconditional, NO flag,** so it\nis not a row above:\
  \ a scenario's `status` is a COMPUTED, DERIVED read-only VIEW (`draft → building\
  \ →\nlive`). It MUST NOT be stored — only `retired` (human-set) or an ABSENT status\
  \ frontmatter field is\nlegal, and `graph build` exits 2 on any illegally-stored\
  \ status. So a scenario file with NO `status:`\nfrontmatter is CORRECT BY CONSTRUCTION:\
  \ its absence is NEVER a 'missing required status field'\nfinding. Fires whenever\
  \ a scenario file is in the shipped diff.\n  An\n  adoption-honesty finding routes\
  \ to a FILED follow-up (not absorb-by-narrowing, E-0005);\n  coherence with other\
  \ docs/state; Review-only : the auditor does NOT execute the test\n  suite — Stage\
  \ 6 owns test runs; VERIFY the recorded Stage-6 evidence exists + is plausible +\n\
  \  matches the probes.\n  **Anchor-less activation is a RED-class closure defect\
  \ (SPEC-0151).** When the audited\n  card is the `activation_owner_task` of a `proposed`\
  \ spec, its `task close` performs the\n  `proposed → active` flip and nothing re-checks\
  \ the spec after it. So the audit-post packet carries\n  an `## Activates at closure`\
  \ section listing each such spec's `implements:`, `binding:`,\n  `execution:` disposition\
  \ and the all-specs SPEC-0151 anchor-rule result; a spec file the\n  packet cannot\
  \ read is LISTED as unverified and a section it cannot derive renders UNAVAILABLE\
  \ —\n  never silently omitted. Activating a spec with NO code anchor, NO delivering\
  \ binding and NO\n  explicit `execution:` disposition is a RED-class closure defect\
  \ — NEVER LOW, NEVER a followup; the\n  in-scope fix is a `spec edit` of that spec\
  \ before close. Report-and-judge only: no close-time\n  refusal is added here.\n\
  \n### Spec coverage of touched files ( — task pre + post)\nA derived `### Spec coverage\
  \ of touched files` section rides EVERY task audit prompt (pre + post),\nappended\
  \ right after the body. It is pure f(graph, plan/diff) and REPORT-NOT-BLOCK (GRAPH\
  \ is not a\nvalidator). Pre lists the files the `implementation_plan` + `expected_touch`\
  \ FORECAST; post lists the\nfiles of the shipped diff. Per file it shows the governing\
  \ ACTIVE specs (graph `code_to_specs`,\nstatus-filtered) or a `(no governing spec)`\
  \ marker, plus symbol-level `possibly-stale` drift flags for a touched\n`implements:`\
  \ anchor whose spec was not updated. BOTH task overlays carry the two questions\
  \ this\nsection exists to let the auditor answer — closing the «code born/changed\
  \ outside the documentation»\nfear at both gates: (1) code touched with NO governing\
  \ spec → justified spec-less (SPEC-0005\nadmission) or a documentation gap? (2)\
  \ a touched active-spec `implements:` anchor whose spec is NOT\nupdated in the same\
  \ change → justified (unrelated symbol / deliberate) or undeclared doc drift?\n\
  BOTH questions are about the DOCUMENTATION of the code, never about the COMPLETENESS\
  \ of the\nforecast itself. A file or spec missing FROM the forecast is CONTEXT and\
  \ is NEVER a finding of any\nseverity (§Universal lens): the forecast is refreshed\
  \ from the committed diff at `task\ncommit`, and a RED whose only findings carry\
  \ `class_id: forecast-completeness` is refused at the\nparse floor. The section's\
  \ `## Declared vs audited touch` sibling carries the same\nreading in the packet\
  \ the auditor reads.\n**Drift ORIGIN — signature staleness is attributed, not assumed.**\
  \ Each drift flag is\nclassified per anchor over the PAIR (code region, stored `implements_signature`\
  \ entry) along the\ncard's first-parent range `HEAD ^main`: CARD-OWNED when an\n\
  uncommitted edit or a non-merge branch commit changed either half; INDETERMINATE\
  \ when a merge left\na half equal to neither parent, the pair is not main's at the\
  \ merge-base, main carries no stored\nentry, or anything is unreadable; NON-CARD\
  \ only on positive proof — the card touched neither half\nand both are byte-identical\
  \ to main's, already stale there (`base-pre-existing` or `main-only`).\nCard-owned\
  \ and indeterminate flags keep question (2) exactly as above. A proven non-card\
  \ flag\nrenders as a `stale-signature DEBT` line — the corpus's standing set that\
  \ `graph build` reports as\npossibly-stale — is NEVER a finding against the card,\
  \ and is not a readiness `stale anchors:` row.\nThe exception settles ATTRIBUTION\
  \ ONLY: the card's own delta is still judged against every\ngoverning spec's CURRENT\
  \ meaning at HEAD and on the resolved tree. Land preflight, `spec reverify`,\nthe\
  \ SPEC-0077 §3a re-audit and the SPEC-0204 ceiling are unchanged by it.\n**Plan\
  \ activation ordering (X-1564).** When a `proposed` spec's activation owner — through\n\
  its recorded `requires:` chain — comes AFTER the audited card, the section also\
  \ names that owner,\nthe chain, and the LAGGING CORPUS the owner reconciles: the\
  \ proposed spec, its `supersedes:` target,\nand the active specs the owner's own\
  \ touch forecast declares it edits (never specs it merely\ncites). A spec-coherence\
  \ residual whose ONLY cause is that lag is the recorded ordering — a note\nciting\
  \ the owner, never a RED or YELLOW finding; a contradiction with any other active\
  \ spec, the\ncode failing the proposed spec, or a code defect is judged as usual.\
  \ The owner card itself keeps\nthe ACTIVATING marker. A view over recorded fields\
  \ — NOT a deferred-adoption overlay.\n\n### Plan-stage overlays — the per-gate question\
