id: SPEC-0031
title: 'Graph build and query reference — index format, query CLI, projected, saved views'
# `class:` REMOVED — a spec carries both layers as body sections (Scenario + Internal).

status: active
                               # proposed→active at close (work-first). proposed ⇒ consumed:false.

created_at:

consumed: false # documentary reference — no code reads a scalar PARAM from it.

implements: # durable anchors — the graph tooling this reference documents.
                               # Non-empty ⇒ NON-DANGLING (SPEC-0013). Query-only delivery (SPEC-0007 §5a).
  - bin/lib/graph.py#cmd_graph_build # builds graph/index.json (the format + walk documented here).
  - bin/lib/graph.py#cmd_graph_query # the query CLI (point lookup, filters, --projected, saved views).
  - bin/lib/graph.py#repo_state_fingerprint # : the content-exact cache key (step 0).
  - bin/lib/graph.py#index_cache_lookup # : the consult gate + the hit (step 0).
  - bin/lib/graph.py#index_cache_store # : the store + the measured-cost refresh (step 0).
  - bin/lib/graph.py#graph_cache_report_lines # : the self-reported hit rate (step 0).
  - bin/lib/graph.py#_regen_manifest_managed_regions # : the §1/§2/§3 managed-region regen of the
                               # generated manifests, LIFTED out of cmd_graph_build so the one re-derivation
                               # rule has a single home — build calls it over the checkout, land calls it
                               # over a merged candidate tree it did not author. Normative here: an EMPTY
