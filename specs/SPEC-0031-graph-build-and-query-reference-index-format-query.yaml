body: "## Scenario\n\nWhen the AI works ON the graph tooling — building the index,\
  \ querying it, adding a saved view, or\nreasoning about the projected/reverse-mapping\
  \ queries — it needs the build walk, the `index.json`\nformat, and the full query-CLI\
  \ surface. This is situational reference consulted WHEN touching the\ngraph tooling,\
  \ fetched via `bin/yitc-v2 graph query SPEC-0031` (the GRAPH.md pointer-stub names\
  \ this\nspec). The always-loaded GRAPH core keeps the 7-node / 4-edge schema, the\
  \ Spec lifecycle FSM, and\n\"What a spec is FOR\".\n\n## Internal\n\nTHE GRAPH BUILD\
  \ + QUERY REFERENCE. Faithfully carried from GRAPH.md §Build tool + §Query CLI +\
  \ §Query\nlayer (the always-loaded copies until demoted them to this retrieved home).\n\
  \n### Release-view generator — `bin/yitc-v2 graph release-view`\nSibling derived-artifact\
  \ generator: cuts the identity-agnostic RELEASE VIEW of the handbook from the\n\
  single engine source into `release-view/` (regenerated by `graph build`, freshness-checked\
  \ by\n`graph conformance`). Engine-only (refused under -C). NORMATIVE output contract:\
  \ SPEC-0074 — this\nreference only INDEXES it.\n\n### Build tool — `bin/yitc-v2\
  \ graph build`\n\n0. **Result cache — an unchanged checkout is served, not recomputed.**\
  \ The build is a\n   PURE function of the checkout, so it is consulted against a\
  \ cache BEFORE step 1. The invariants\n   below govern it; each is a tripwire in\
  \ `tests/test_t11326_graph_build_cache.py` (the list is the\n   contract — it carries\
  \ no count, because a count is what goes stale when a further invariant is\n   established):\n\
  \   - **Content-exact key.** The key covers every class of input the build reads\
  \ — the artifact\n     trees, the handbook docs, the code its `implements:` anchors\
  \ resolve against, the git history\n     its drift warnings walk, and the BUILDER'S\
  \ OWN SOURCE. It is derived from content, never from\n     a stat shape, because\
  \ a stat-shaped key can repeat across a checkout that changed. The HISTORY\n   \
  \  term is not raw HEAD but the newest first-parent commit whose first-parent diff\
  \ touches a path\n     outside the excluded set : a journal-only or empty commit\
  \ on top no longer moves the\n     key, yet every read path's last-touch commit\
  \ is still covered, because the drift warnings read\n     it via a default `git\
  \ log -1 -- <path>`, which passes straight through a commit TREESAME to its\n  \
  \   first parent for that path — so no such commit can sit above the kept sha, and\
  \ a history\n     rewrite of any input-touching commit changes that sha. Exactly\
  \ two\n     paths are EXCLUDED, each with a proof rather than a heuristic: the append-only\
  \ JOURNAL (the\n     build takes no journal input at all since the graph-slim cut,\
  \ while every command\n     appends to it — left in, the cache could never hit once)\
  \ and the machine-local operational\n     dir that holds this repo's machine-local\
  \ operational state. (The cache's own files live\n     under the checkout's GIT\
  \ DIR, never in the working tree: a working-tree cache file shows as\n     untracked\
  \ dirt in any repo whose.gitignore does not name it, and the claim verb refuses\
  \ on\n     main dirt — measured, it broke the blank-consumer lifecycle outright.)\n\
  \   - **A miss is fail-safe.** Every failure inside the cache — an unreadable input,\
  \ a corrupt or\n     absent payload, a foreign schema version, an unavailable git\
  \ — falls through to an ordinary\n     FULL build, as does an explicit disable.\
  \ A stale HIT is the one unacceptable failure; a miss\n     costs only time.\n \
  \  - **Inert by measurement, not by configuration.** ONE kernel code path serves\
  \ every repo. The\n     key is computed only where a hit can pay for it, judged\
  \ on the PREVIOUS build's measured cost\n     against the measured cost of the key\
  \ itself. A repo whose build is cheap relative to its own\n     key never consults\
  \ the cache and pays nothing; the measured cost is refreshed on every build,\n \
  \    so a corpus that grows past the ratio re-arms itself with no per-project mechanism,\
  \ config\n     key, or threshold that fits nobody.\n   - **It reports its own hit\
  \ rate.** Every build records its cache state — hit, miss, skipped or\n     disabled\
  \ — on the `graph_built` event, on EVERY outcome and not only on a hit; the rate\
  \ is\n     folded into the land tail. That line is deliberately NOT suppressed-when-clean:\
  \ a 0% rate and\n     an inert repo both PRINT. The prior art is the reason : a\
  \ cache wrote 1135\n     markers, read none across 1390 lands, recorded its field\
  \ only on the hit that never came, and\n     so was indistinguishable from a working\
  \ one until someone went looking.\n   - **ONE document, published atomically.**\
  \ The key and the index it describes live in a SINGLE\n     object, written to a\
  \ temp file in the same directory and published by an atomic `os.replace`,\n   \
  \  under a filename namespaced by the resolved checkout path. This is a RULE, not\
  \ an\n     implementation detail, because the alternative reads reasonable: a payload\
  \ file beside a meta\n     file naming its key carries a cross-file invariant nothing\
  \ holds, so two interleaving stores\n     leave a meta naming key A beside a payload\
  \ built for key B and the next reader is served a\n     mismatched pair — a stale\
  \ hit reached with NO staleness in the key, which is why the\n     content-exact\
  \ key above does not cover it. A reader observes the WHOLE previous document or\n\
  \     the WHOLE new one, never a partial write; a lock was the explicitly worse\
  \ option (tripwires `a_torn_document_reads_as_a_miss`,\n     `no_interleaving_can_pair_one_key_with_another_builds_index`,\n\
  \     `the_document_is_published_by_atomic_replace`).\n1. Walk `specs/*.yaml`, `patterns/*.md`\
  \ + `plans/*.md` +\n   `ideas/*.md` frontmatter (planning artifacts → `plan` nodes,\
  \ `kind: plan|idea`) + `errors/E-*.yaml`\n   (→ `error` nodes; the `E-*` glob excludes\
  \ `errors/_template.yaml`)\n - NON-EMITTING passes: the build STILL walks `tasks/*.yaml`\
  \ (for the `tasks_citing`\n   reverse-index — the surviving `cites` edge) and reads\
  \ `tasks/*.yaml` + the audit-verdict /\n   `D-NNNN-` files under `decisions/` via\
  \ `_read_yaml(errors=parse_errors)` for parse-error\n   observability (→ `_parse_errors`\
  \ → exit 2 / land block). These passes EMIT no `tasks` /\n   `decisions` / `audits`\
  \ graph SECTION (those node-types are cut) — they are reverse-indexing\n   + parse-error-surfacing\
  \ reads only.\n   - For each spec `implements:` anchor (`<file>` / `<file>#<symbol>`),\
  \ **resolve** it\n     against the current tree (file exists; symbol = a def/class/const/heading\
  \ present). Unresolved\n     anchors are collected as **report-only warnings** (stderr,\
  \ NOT a build failure — report-not-block).\n     The `code_to_specs` reverse index\
  \ is keyed by the normalized **file component** (so `graph query\n     <file>` matches\
  \ `<file>#<symbol>`).\n2. **[ — the commit/event/audit_verdict build-walk steps\
  \ were REMOVED by the graph-slim cut: the build no longer parses git `from:` trailers,\
  \ `events.jsonl`, or `decisions/<id>-audit-*.yaml` into graph sections.]**\n3. *(removed\
  \ — event/emitted_by cut)*\n4. *(removed — audit_verdict/audited cut)*\n5. **Parse\
  \ canonical docs (CHARTER + AGENTS + LIFECYCLE + QUEUE + GRAPH) for rule extraction:**\n\
  \   - Match lines with markers `[MUST]` / `[SHOULD]` / `[MAY]` or keywords (`Must`\
  \ / `Cannot` / `Required`)\n   - Generate rule node per match: `rule:<doc-slug>:<section-slug>:<severity>`\n\
  \   - Store with fields `{source_doc, source_section, source_line, severity, content,\
  \ status}`\n   - Emit `defined_in` edge (rule → source doc node)\n6. Output `graph/index.json`\
  \ ( — the DERIVED index is JSON-serialized: json.dumps\n   sort_keys=True + indent=1\
  \ + ensure_ascii=False, datetime/date values serialized as ISO-8601\n   strings\
  \ at build time; ~100x cheaper than the prior yaml.safe_dump/parse on the ~2.3MB\
  \ tree.\n   P5 unchanged: one-YAML-format governs AUTHORED operational state, not\
  \ this derived view.\n   Structure (shown as YAML for readability — keys identical\
  \ in JSON)):\n```yaml\nspecs:\n  <workshop-spec>:\n    title: All operational state\
  \ is YAML\n    status: active\n    implements: # durable anchors — file / file#symbol,\
  \ NOT line ranges\n      - bin/lib/task.py#cmd_task_file\n      - bin/lib/state.py\n\
  code_to_specs: # keyed by the normalized FILE component ( — so\n  bin/yitc-v2: #\
  \ `graph query <file>` matches a `<file>#<symbol>` anchor)\n    - <workshop-spec>\n\
  \    - <workshop-spec>\n  bin/lib/state.py:\n    - <workshop-spec>\ntasks_citing:\n\
  \  <workshop-spec>:\n    -\n    -\nerrors: # : 11th node type — promotion-only case\
  \ files (errors/E-XXXX.yaml)\n  E-0001:\n    kind: friction # defect | friction\
  \ | improvement\n    severity: low\n    status: open\n    fingerprint: <stable-dedup-key>\n\
  \    relates_to: '#10 Format drift'\n    refs: [events.jsonl#ts=..., <git-sha>]\n\
  ```\n**Read-order regen side-effect — EXPLICIT build only.** Beyond the index +\
  \ the floor\ntrigger-map (both via `_write_graph_index`, the shared path), the EXPLICIT\
  \ `bin/yitc-v2 graph build`\nALSO regenerates the `AGENTS.md` `<!--GEN:read-order:STYLE-->`\
  \ managed regions from the single carrier\n`HANDBOOK_READ_ORDER` (`_regen_handbook_read_order`).\
  \ In `cmd_graph_build` ONLY — NOT in\n`_write_graph_index` / the land-time `_auto_rebuild_graph`\
  \ (AGENTS ∉ `_BOOKKEEPING_ALLOWLIST`, so a\nland-path write would break land). The\
  \ read-order RULE + its non-divergence backstop (the\n`_read_order_drift` conformance\
  \ check, report-at-land) are homed at SPEC-0007 §5b; this is only the\nbuild-tool's\
  \ side-effect note.\n\n**Audience-scoped seed views (SPEC-0127) — BOTH build seams\
  \ (amended).** Via the\nshared `_write_audience_views`, called by BOTH the explicit\
  \ `cmd_graph_build` AND land's derived-regen\n(`_auto_rebuild_graph`) — the SAME\
  \ placement + rationale as the `release-view/` regen, NOT the\nread-order regen.\
  \ **Amended from \"EXPLICIT build only\" by **: the original clause filed these\n\
  views with the AUTHORED explicit-build-only surfaces (the AGENTS.md read-order regions\
  \ / the placement\nmanifest), but SPEC-0074 §6 draws the line at the artifact's\
  \ CLASS, not its input — a PURELY-DERIVED\nartifact regenerates at both seams and\
  \ rides `_BOOKKEEPING_ALLOWLIST` + `_DERIVED_MERGE_ARTIFACTS`,\nwhile explicit-build-only\
  \ exists to stop land CLOBBERING an author's edits. These views are\nderived-only\
  \ (`DO NOT EDIT`, drift-checked), so nothing of an author's can be clobbered; being\n\
  handbook-TEXT-derived made them look authored, which is the misclassification. It\
  \ also matches what\nSPEC-0127 §3 already declares them to be — \"the SIBLING pattern\
  \ of `graph/floor-trigger-map.md`\",\nwhich IS land-regenerated + allowlisted. Cost\
  \ of the old placement (2026-07-16/17): a source edit\nlanding without a view regen\
  \ left drift on main that land could not fold — it ABORTed an\nunrelated land and\
  \ was swept into an unrelated ship commit as an out-of-scope audit-post RED\n; and\
  \ land re-published the STALE view into `release-view/`, which is generated FROM\
  \ these\nviews, so `-C` consumers read it as their seed (the E-0034 class). `graph\
  \ build` derives THREE committed\nderived-only views from the seed docs' `<!--AUDIENCE:core|controller|worker-->`\
  \ section markers\n(`_render_audience_views`): the **worker-seed PART CHAIN** —\
  \ `graph/worker-seed.md` (part 1, which keeps\nthe pre-split name) plus its `graph/worker-seed-<n>.md`\
  \ continuation parts, each size-bounded so it loads\nin ONE bounded read (the part\
  \ COUNT is DERIVED from the packing, never a declared list, and a\nbuild that shrinks\
  \ the seed PRUNES the orphaned parts) — the core+worker sections a Worker reads;\n\
  `graph/controller-supplement.md` (the controller-only sections), and\n`graph/worker-startup-inventory.md`\
  \ (the per-section audience map + the worker-seed size, total AND per\npart + the\
  \ three-part §5 hard probe). Engine-only (a consumer has no engine handbook of its\
  \ own). Non-divergence is\nthe report-at-land `_audience_views_drift` conformance\
  \ check (committed == regenerated; fail-closed on\na malformed marker) — the exact\
  \ sibling of `_read_order_drift` / `_floor_map_drift`. The audience\nMECHANISM +\
  \ the derivation rule are homed at SPEC-0127; this is only the build-tool's output\
  \ note\n(SPEC-0031 stays the ONE home for what `graph build` emits + where, P5).\n\
  Maybe 50-100 LOC to build, walking 2 directories. `graph build` also surfaces `counts.errors`\
  \ in the\n`graph_built` event payload (auto-derived from the `errors` index key).\
  \ **Output committed to repo**\n(not gitignored — V1's gitignored `.yitc/liveness-registry.yaml`\
  \ made gates depend on machine-local\nstate; V2: if generated, it's committed).\n\
  \n**Consumer-build attribution (F-001).** When `graph build` targets a CONSUMER\
  \ checkout\n(REPO_ROOT != ENGINE_ROOT — the engine's own root captured at import;\
  \ reached via the `-C <path>`\nflag), the structural layers `verb_to_specs` / `floor_trigger_map`\
  \ / `binding_report` are\nKERNEL-derived (their shape comes from the engine constants\
  \ BINDING_VERB_SURFACES / FLOOR_TRIGGERS,\nnon-zero even on an EMPTY consumer),\
  \ NOT project-derived. The build adds an additive top-level\n`kernel_provided` marker\
  \ {engine: a STABLE literal kernel label (never a path/checkout name —\nreproducible),\
  \ layers: the 3 layer names, note} so they are not mistaken for the consumer's own\n\
  rules->code nodes (MARK, do NOT omit — a consumer still consumes them for read-gate\
  \ delivery). The\nENGINE self-build (REPO_ROOT == ENGINE_ROOT) is UNCHANGED — no\
  \ marker. (The floor-trigger-map.md\nconsumer header-note counterpart is documented\
  \ at SPEC-0013 §Derived views.)\n\n**Consumer READ-side resolution (F-010/F-012).**\
  \ The read-side complement of the build-side\nattribution above: a `-C` consumer\
  \ LACKS the kernel's methodology CONTENT locally, so a point-lookup\nof a KERNEL\
  \ spec absent from the consumer index resolves its node + source body from the ENGINE\n\
  index/specs (consumer-OWN specs still WIN per-id). The same ENGINE_ROOT fallback\
  \ resolves kernel\npatterns + scaffolding templates + the SPEC-0036 gate-template\
  \ for a consumer. The TASK-axis read-gate\nDOC-SET (`_stage_bundle_specs`) IS engine-merged\
  \ under `-C` (amended / F-016 — supersedes the\n own-only rule): it resolves `include_kernel=_is_consumer_build`,\
  \ SYMMETRIC with the delivery\nsurfaces below, so a consumer's stage read-check\
  \ ENFORCES the kernel stage-entry contract it is SHOWN.\nThe gate stays SATISFIABLE,\
  \ never a deadlock: the consumer fetches the contract via the kernel-spec\npoint-lookup\
  \ above (`graph query <SPEC>` → the `cli_invoked` row credits it) and the verb then\
  \ proceeds.\nPre- the doc-set was own-only and a blank consumer's stage read-check\
  \ was VACUOUS — the F-016\nsilent-OFF (`read_gate_refused`=0 read as compliant while\
  \ the read-CHECK leg never fired); that own-only\nrule is RETIRED for the read-gate.\
  \ **Plan-axis is UNCHANGED** (`_plan_stage_bundle_specs` has no\nkernel-merge knob,\
  \ so plan-stage delivery AND enforcement both stay own-only — already symmetric,\
  \ NOT\nthe F-016 asymmetry). The engine self-build is byte-unchanged (`_is_consumer_build`\
  \ is false there). **DELIVERY + DOC-SET vs BUILD (amended).** Under `-C` BOTH the\
  \ delivery surfaces AND the TASK-axis read-gate DOC-SET (the set the gate REQUIRES\
  \ fetched before the stage action) are kernel-MERGED; the graph BUILD stays own-only\
  \ (below). The DELIVERY surfaces are kernel-MERGED so kernel content is DISCOVERABLE\
  \ on a blank consumer, not just point-resolvable: the `stage <NAME>` bundle (`_stage_bundle_specs`/`_stage_bundle_patterns`\
  \ include_kernel=True), the claim-moment Analysis surfacing, `graph query --type\
  \ view` (`_list_views`) + a saved kernel view's execution path, and `graph query\
  \ --type pattern` (`_emit_node_list` include_kernel —, the pattern node-class only;\
  \ other `--type` listings stay own-only) — each merges the engine specs/patterns/views\
  \ UNDER the consumer's own (own-WINS per id/name). The graph BUILD (`graph_build_index`)\
  \ stays own-only ON PURPOSE — index exposure is READ-side via the engine-index fallback,\
  \ so the build-side kernel_provided attribution stays intact. Under `-C` the TASK-axis\
  \ gate fires on the kernel-MERGED stage-entry doc-set (own-WINS per id); so on a\
  \ blank consumer \"the read-gate path is satisfiable\" means the consumer must FETCH\
  \ the shown kernel contract (via the point-lookup) before the stage action, then\
  \ proceeds — enforcement is symmetric with delivery, not vacuous (the F-016 fix).\
  \ The ENGINE self-build is byte-\nunchanged (fallback guarded by `_is_consumer_build`);\
  \ the consolidated engine↔target seam doctrine is\nthe kernel-extraction plan's\
  \ finalization spec.\n\n### Query CLI — `bin/yitc-v2 graph query <id>`\n- `<id>`\
  \ is `SPEC-NNNN` → return all code locations that implement it + all tasks citing\
  \ it\n  + `superseded_by:` — the DERIVED reverse link for a **COMPLETED** supersession:\
  \ the\n  head(s) whose durable `supersedes:` names this spec AND which actually\
  \ TOOK EFFECT (status\n  `active` / `superseded` / `retired` — a head later superseded\
  \ or retired still replaced the\n  target, so the lineage chain does not break).\
  \ Derived at QUERY time from the same index that\n  resolved the node (so `--kernel`\
  \ / the `-C` engine-fallback read KERNEL heads) — NEVER stored:\n  SPEC-0030 carries\
  \ no `superseded_by` field and a superseded spec is frozen-immutable (rule 7),\n\
  \  so graph code is the link's only legal carrier (a VIEW over existing data, CHARTER\
  \ §P1 F2). A\n  head that is `proposed` (the PENDING supersession — `--projected`\
  \ owns that, §Projected view),\n  `draft` / `withdrawn` / `rejected`, or ABSENT\
  \ yields NO pointer, and the key is OMITTED entirely\n  when there is no head (never\
  \ an empty list). Closes X-0290: before this, the reverse link existed\n  ONLY inside\
  \ `--projected` for the pending case, so once a supersession completed no query\
  \ surface\n  showed what replaced a superseded spec.\n- `<id>` is `<file-path>`\
  \ → return all specs that this file implements; when any listed implementer is not\
  \ `active`, a sibling `non_active_implementers` map names each such spec with its\
  \ `status` and, where a supersession completed, its `superseded_by` head(s) — OMITTED\
  \ when every implementer is active (never an empty map), so `implements_specs` keeps\
  \ its exact shape\n- `<id>` is `<file-path>#<symbol>` (the anchor form SPEC-0088\
  \ prefers) → return the specs whose `implements:` carry that exact anchor, over\
  \ the same locations index; a known file with an unknown symbol is refused naming\
  \ the file, the symbol and the known symbols; its non-active implementers are annotated\
  \ exactly as the `<file-path>` form's\n- `<id>` is `T-NNNN` / `D-NNNN` → the node\
  \ is re-sourced ON DEMAND from the authored `tasks/` / `decisions/` YAML ( — the\
  \ task/decision build sections were cut, so there is no index section; the graft\
  \ restores T-/D- point-lookup + the spec→T-/D- `requires:` known-id universe). `E-NNNN`\
  \ resolves its `error` node from the index. The post-cut task point-lookup payload\
  \ is the node only (no `commits_from`/`events`/`audits` — those edges are cut);\
  \ the plan point-lookup likewise drops its `audits` line (plan-check verdicts read\
  \ directly from `decisions/<plan>-audit-*.yaml`).\nOutput: structured YAML or markdown\
  \ table. No JSON-only mode (humans read this too).\n\n**Point-lookup appends the\
  \ SOURCE artifact.** After the metadata block, a point-lookup of\na body-bearing\
  \ node — `spec` / `pattern` / `plan` / `error` — ALSO appends the full source artifact\n\
  of that node (the spec `body:` + structured fields; the pattern/plan markdown body;\
  \ the error\nstructured YAML), so the documented \"Read it via `bin/yitc-v2 graph\
  \ query <ID>`\" path delivers the\nrule itself, not only the index node. The body\
  \ is read from the SOURCE FILE at query time via a\nshared by-type loader (`specs/SPEC-XXXX-*.yaml`\
  \ / `errors/E-XXXX-*.yaml` / `patterns/<name>.md` /\n`plans/<slug>.md` | `ideas/<slug>.md`)\
  \ — it is NEVER stored in `graph/index.json` (§NOT a caching\nlayer / CHARTER §P5:\
  \ the body lives in ONE place). **A SPEC-0120-SPLIT spec's source is a CHAIN,\n\
  not one file.** When a spec is split for the one-bounded-read ceiling, its source\
  \ is the\nBASE `specs/SPEC-XXXX-<slug>.yaml` PLUS an ordered chain of continuation\
  \ parts\n`specs/SPEC-XXXX-<slug>.part<N>.yaml` (`N >= 2`, ordered numerically).\
  \ The point-lookup appends the\nWHOLE chain as the one body, so a reader of `graph\
  \ query SPEC-XXXX` receives the complete spec and\nnever a truncated head. The chain\
  \ is DISCOVERED off the sibling files, never declared\n(`bin/lib/state.py#spec_part_paths`);\
  \ a part is NOT a node of its own and is excluded from the spec\nscan (`scan_specs`),\
  \ so it has no id, no `binding:` and never resolves as a separate point-lookup —\n\
  the split shape itself is homed in SPEC-0120 §3. Default-on is point-lookup-ONLY:\
  \ never\nflag-gated, and the `--type` / `--projected` / `--carve-out` / view / file-path\
  \ / `T-`/`D-` forms\nare UNCHANGED (no body append).\n\n**Implemented surface today\
  \ (verified against `bin/yitc-v2 graph query --help`):** the\npositional `<id>`\
  \ (`SPEC | T | D | E | file`) point-lookup + the flags `--type <node-type>`,\n`--recurring`\
  \ (with `--type error`), `--as-of <commit|date>`, `--projected`/`--diff`, and\n\
  `--include-draft <plan-slug>`. (The `--carve-out` dispatch-selection flag also lives\
  \ on this\nverb but is HOMED in SPEC-0044, not here — the carve-out picker's surface;\
  \ `graph query SPEC-0044`.\nReviewed 2026-06-06: re-verified `cmd_graph_query` vs\
  \ anchor a628154e1 — the only region\nchange since is `--carve-out` branch (SPEC-0044),\
  \ so the query-CLI contract THIS spec owns\nis undrifted; cross-pointer added so\
  \ the full-surface enumeration stays truthful.) The richer\n`--since` / `--source`\
  \ / `--type rule --mandatory` and the\n**Aggregations** + **Reverse-mapping** queries\
  \ documented just below are the ** query-LAYER\nDESIGN** — NOT yet implemented (deferred\
  \ until empirical pull, same status as the explicitly-marked\n`--mandatory-unread`).\
  \ They are retained here as the intended design surface, not the shipped CLI.\n\n\
  ### Query layer ( — consolidated views as queries)\nThe graph IS a **data layer**\
  \ (7 nodes + 4 edges — the SPEC-0076 scenario node + covers edge). Consolidated\
  \ views = **query layer** over the same\ndata — NO parallel mechanisms per concern.\n\
  \n**Query CLI shape:**\n```\nyitc-v2 graph query <id> # point lookup (single node)\n\
  yitc-v2 graph query --type <node-type> # filter by node type\nyitc-v2 graph query\
  \ --type rule --mandatory # show all MUST rules\nyitc-v2 graph query --since <window>\
  \ # time-filtered\nyitc-v2 graph query --source <doc> # filter by sourcing doc\n\
  yitc-v2 graph query --type rule --as-of <commit|date> # rule-set AS IT WAS at a\
  \ past point\nyitc-v2 graph query --projected # «what-will-be» view (a.k.a. --diff);\
  \ see below\n```\n`--as-of <commit-ish|YYYY-MM-DD>` reads the **committed** `graph/index.json`\
  \ as of that\ncommit (date → newest commit on/before that day) and runs the query\
  \ against it — the point-in-time\nrule-set for behavioral audit. Pure read over\
  \ git history; no new state. Composes with `--type` / id.\nFormat history : a pre-switch\
  \ SHA falls back to the legacy `graph/index.yaml` ONLY when\n`index.json` is ABSENT\
  \ at that SHA; a present-but-malformed `index.json` fails loudly (never\nYAML-masked).\
  \ The fallback is permanent — git history is immutable.\n\n`--projected` (a.k.a.\
  \ `--diff`, B4) is a **PURE f(graph)** projection over the current\nindex: `active\
  \ − superseded-by-proposed + proposed`, annotated with **STRUCTURAL flags only**\n\
  (`added` / `changed` / `superseded` / `stale` / `multi-proposer-unordered` / `dangling`).\
  \ It is the\nstanding way to see staged spec changes and to detect the concurrent-change\
  \ invariant violation\n(`multi-proposer-unordered`). It writes **no durable state**\
  \ — no stored snapshots, no named futures,\nno merge / adjudication / semantic-contradiction\
  \ analysis (all DEFERRED). The moment it\nwould need any of those, or become a gate,\
  \ STOP and file (anti-complexity, CHARTER §1).\n\n**Aggregations:**\n```\nyitc-v2\
  \ graph query --session-size # total injected this session (lines + chars)\nyitc-v2\
  \ graph query --by-rationale # group injections by rationale source\nyitc-v2 graph\
  \ query --order-by size_lines desc # sort by size\n```\n\n**Reverse-mapping queries\
  \ ( insight #6) — PRIMARY tool for bloat-prevention audit** (the\nrationale field\
  \ enables «what cost does X impose?»):\n```\nyitc-v2 graph query --injections-triggered-by\
  \ AGENTS.md§At-session-start\n  # → all instruction_injected events citing this\
  \ rationale\n  # → sum of size_lines / size_chars = total burden this protocol imposes\
  \ per session\nyitc-v2 graph query --never-cited-in-rationale --window 30d\n  #\
  \ → docs/decisions/specs not cited as rationale in last 30 days → retirement / supersession\
  \ candidates\nyitc-v2 graph query --top-rationale-by-volume --session current\n\
  \  # → top 5 protocols by injection burden (hotspot detection)\nyitc-v2 graph query\
  \ --mandatory-unread <task-id> # DEFERRED Day 6+\n  # → MUST_READ_NOW injections\
  \ for task without matching Read events = discipline violations\n  # Requires `instruction_read`\
  \ event source decision (or native AI-tool Read tracking).\n```\n\n**Saved views\
  \ — `views/<name>.yaml` (ACTIVE):** a **view** is a named, saved\n**query-lens**\
  \ — it stores the QUERY, never a materialized output, so the result is **recomputed\n\
  fresh** on every run (no stale stored output — CHARTER §P5). Views make consolidated\
  \ reports\n*discoverable* via a deterministic catalog instead of AI memory.\nSchema\
  \ (`views/<name>.yaml`):\n```yaml\nname: rule-catalog # canonical name (the file\
  \ stem is the fallback)\ndescription: <one line — what question it answers> # shown\
  \ in the catalog listing\nlens: # the query to run (NOT its output)\n  kind: node-list\
  \ # node-list (over a graph node type) | verb-map (pure f(graph))\n            \
  \                  # | binding-bundle (specs carrying one binding token)\n     \
  \                         # | token-rollup (raw-transcript read-side)\n        \
  \                      # | trend-report (journal-windowed L4 trends)\n         \
  \                     # | task-scorecard (per-task journal-derived metrics) | further\
  \ code-lenses\n  node_type: rule # for kind: node-list\nwhy: <why this report exists>\n\
  ```\nCatalog + execution: `graph query --type view` → lists the catalog as `name\
  \ — description`, sorted by\ncanonical name, read from `views/` on demand (a DERIVED\
  \ listing — no stored index, no new node/edge).\n`graph query <view-name>` → runs\
  \ the saved lens against the current index.\nInaugural views : `rule-catalog` (consolidated\
  \ rule listing, `lens: node-list` over `rule`);\n`verb-map` (per-verb governance,\
  \ **pure f(graph)** — verb universe from `build_parser`, governance\nfrom `code_to_specs`;\
  \ file-level today, labels itself `file-level approximation`). Future views added\n\
  per pull: `open-tasks`, `audit-compliance`, `protocol-cost`, etc.\n**Binding-bundle\
  \ lenses :** a lens `kind: binding-bundle` takes a `binding_token:` and returns\n\
  the active specs carrying it — read straight from `index[\"verb_to_specs\"][binding_token]`,\
  \ the EXACT\nlist `_build_binding_views` inverts from each spec's `binding:` field\
  \ and that the `floor_trigger_map`\nis itself built from (graph.py:197). So the\
  \ view and the floor-trigger-map are TWO SURFACES over ONE\nsource (the floor-map\
  \ fires the bundle BEFORE an action; the view answers \"what governs X?\" on demand):\n\
  a spec added/removed from the bundle reflects in both without a second list — single\
  \ source, no new\nstore. Inaugural: `consumer-dimension-bundle` (token `before-project-dimension-judgement`)\
  \ —\nthe REF_AVAILABLE discovery path for the kernel↔consumer project-dimension\
  \ doctrine.\n**Raw-source lenses :** a lens MAY read a raw out-of-graph source instead\
  \ of the index when\nthe data deliberately lives outside the journal/graph — `token-rollup`\
  \ sums per-session token usage\nfrom raw provider transcripts (`.yitc/transcript-archive/`\
  \ UNION live, deduped newest-mtime-first)\n× CURRENT `bin/pricing-config.yaml` rates\
  \ (the reroute: tokens are NOT journal-materialized;\ncost is computed at read-time,\
  \ price never stored). Still a saved view: stores the query, recomputes\nfresh,\
  \ writes nothing.\n**Windowed journal lenses :** a lens MAY read the JOURNAL (`events.jsonl`\
  \ full `data`\npayloads — which the slim index `events` projection lacks) plus the\
  \ committed index for current\nnode STATUS, and accept a date window via `graph\
  \ query <view> --since/--until` (ISO date or\ntimestamp, UTC-normalized — `since`\
  \ inclusive, `until` exclusive). `trend-report` is the L4\nsystem-trend feed for\
  \ inspections ( revizii): journal growth + test-leak share, op-duration\ntrends\
  \ (graph-build / suite / land), queue flow (filed→picked latency, WIP age, throughput,\n\
  parked/blocked age stats (oldest/median/n)), adoption-debt aging, churn (re-audit\
  \ passes, land aborts, post-close\ncollateral, recurring deviation fingerprints),\
  \ and overhead share. Journal-only (the index it also\nreads is a derived journal+corpus\
  \ projection, not a second authored store); every section reports\nnumbers OR an\
  \ explicit `n/a` — an empty trend is never silently dropped. Still a saved view:\n\
  stores the query, recomputes fresh, writes nothing.\n\n**Targeted lenses :** a lens\
  \ MAY take a target via the optional second positional —\n`task-scorecard` (`graph\
  \ query task-scorecard T-XXXX`) reports a closed task's journal-derived\nlifecycle\
  \ metrics (lead time, per-stage wall, audit passes + GREEN-first, land attempts\
  \ both-outcome,\ndeviations) + a tokens/cost column reusing the `token-rollup` lens\
  \ (clean attribution when 1 task = 1\nsession, explicit n/a when ambiguous). A no-arg\
  \ run prints the usage hint (never errors).\n\n**Plan-gate lenses :** a lens MAY\
  \ re-derive a plan-lifecycle gate's verdict as a\nNON-BLOCKING report by reusing\
  \ the SAME canonical gate helpers (P5, no drift) — never calling the\n`_die`-ing\
  \ gate itself. `plans-pending-finalization` (kind `plans-pending-finalization`)\
  \ lists accepted\nplans with zero open citing tasks. `postcheck-plans-readiness`\
