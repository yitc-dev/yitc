  \ drift (deviation 2026-06-19) is the real incident; the `scenario` node-type (SPEC-0076)\
  \ is the immediate +1-node-reuses-`cites` prior-art; ≥3-project local-craft accumulation\
  \ (<project>/<project> specifics) is the scale driver.\n\n**Scope bound (honest\
  \ +1/0):** the `lesson` node REUSES `cites` — NO new edge (the 4-edge bound is UNCHANGED).\
  \ A lesson is indexed PER-REPO, by each repository's own build: a lesson never travels\
  \ (project realm, SPEC-0073). So the change is EXACTLY +1 node, +0 edge.\n\n####\
  \ Why this schema (not more, not less) — per CHARTER §1 Filter 4 refined\n\n- **Prior-art\
  \ from v1**: the entity + edge patterns were observed across months of v1 production\
  \ usage. Not speculation.\n- **V2 Day 2+ projection**: ~30 cite-able artifacts after\
  \ closure; 100+ within first production-task week; 500+ within first month. Indexed\
  \ graph beats grep at that scale.\n- **Build cost**: ~200 LOC (build script + query\
  \ CLI). All data already structured.\n\n### Node-volume — consolidation is a Review\
  \ judgement, not a count-gate\nThere is **no numeric node-volume trigger** for any\
  \ node type. Consolidating / retiring / archiving\nnodes (tasks, decisions, patterns)\
  \ is a **regular Review judgement** made on observed cost — never an\narbitrary\
  \ count threshold: counts grow with the work, so a fixed number signals nothing\
  \ (owner\ndirective 2026-06-06). The arbitrary per-node-type count thresholds that\
  \ once lived here\nare removed. The **spec count cap is likewise REPLACED** by the\
  \ admission test + two-bound volume\ndiscipline (homed in SPEC-0005 rules 2 + 6;\
  \ GRAPH.md §When-to-add points there) — anti-bloat is held\nby that discipline +\
  \ retrieval precision + currency, not a count cap (SPEC-0005 rule 6).\n\n## Rationale\n\
  \nDemoted to the retrieved tier (SPEC-0007 §5a query-only): the build walk + query-CLI\
  \ surface are\nconsulted only when working ON the graph tooling — not before a gated\
