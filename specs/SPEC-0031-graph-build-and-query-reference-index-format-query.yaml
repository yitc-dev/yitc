  \ against the 3 CODED `plan stage realized` exit clauses\n— `finalization_ready`\
  \ (specs reached-active + fresh GREEN/YELLOW aggregate `audit post --plan`),\n`retire_on_proof_resolved`,\
  \ `captures_routed` — plus `realize_ready` (their AND — exactly the 3 clauses,\n\
  no hidden gate), per-plan `blockers`, an explicit `plan_file_readable` flag, and\
