body: |
  ## Scenario

  When the AI works ON the graph tooling — building the index, querying it, adding a saved view, or
  reasoning about the projected/reverse-mapping queries — it needs the build walk, the `index.json`
  format, and the full query-CLI surface. This is situational reference consulted WHEN touching the
  graph tooling, fetched via `bin/yitc-v2 graph query SPEC-0031` (the GRAPH.md pointer-stub names this
  spec). The always-loaded GRAPH core keeps the 7-node / 4-edge schema, the Spec lifecycle FSM, and
  "What a spec is FOR".

  ## Internal

  THE GRAPH BUILD + QUERY REFERENCE. Faithfully carried from GRAPH.md §Build tool + §Query CLI + §Query
  layer (the always-loaded copies until demoted them to this retrieved home).

  ### Release-view generator — `bin/yitc-v2 graph release-view`
  Sibling derived-artifact generator: cuts the identity-agnostic RELEASE VIEW of the handbook from the
  single engine source into `release-view/` (regenerated by `graph build`, freshness-checked by
  `graph conformance`). Engine-only (refused under -C). NORMATIVE output contract: SPEC-0074 — this
  reference only INDEXES it.

  ### Build tool — `bin/yitc-v2 graph build`

  0. **Result cache — an unchanged checkout is served, not recomputed.** The build is a
     PURE function of the checkout, so it is consulted against a cache BEFORE step 1. The invariants
     below govern it; each is a tripwire in `tests/test_t11326_graph_build_cache.py` (the list is the
     contract — it carries no count, because a count is what goes stale when a further invariant is
     established):
     - **Content-exact key.** The key covers every class of input the build reads — the artifact
       trees, the handbook docs, the code its `implements:` anchors resolve against, the git history
       its drift warnings walk, and the BUILDER'S OWN SOURCE. It is derived from content, never from
       a stat shape, because a stat-shaped key can repeat across a checkout that changed. Exactly two
       paths are EXCLUDED, each with a proof rather than a heuristic: the append-only JOURNAL (the
       build takes no journal input at all since the graph-slim cut, while every command
       appends to it — left in, the cache could never hit once) and the machine-local operational
       dir that holds this repo's machine-local operational state. (The cache's own files live
       under the checkout's GIT DIR, never in the working tree: a working-tree cache file shows as
       untracked dirt in any repo whose.gitignore does not name it, and the claim verb refuses on
       main dirt — measured, it broke the blank-consumer lifecycle outright.)
     - **A miss is fail-safe.** Every failure inside the cache — an unreadable input, a corrupt or
       absent payload, a foreign schema version, an unavailable git — falls through to an ordinary
       FULL build, as does an explicit disable. A stale HIT is the one unacceptable failure; a miss
       costs only time.
     - **Inert by measurement, not by configuration.** ONE kernel code path serves every repo. The
       key is computed only where a hit can pay for it, judged on the PREVIOUS build's measured cost
       against the measured cost of the key itself. A repo whose build is cheap relative to its own
       key never consults the cache and pays nothing; the measured cost is refreshed on every build,
       so a corpus that grows past the ratio re-arms itself with no per-project mechanism, config
       key, or threshold that fits nobody.
     - **It reports its own hit rate.** Every build records its cache state — hit, miss, skipped or
       disabled — on the `graph_built` event, on EVERY outcome and not only on a hit; the rate is
       folded into the land tail. That line is deliberately NOT suppressed-when-clean: a 0% rate and
       an inert repo both PRINT. The prior art is the reason : a cache wrote 1135
       markers, read none across 1390 lands, recorded its field only on the hit that never came, and
       so was indistinguishable from a working one until someone went looking.
     - **ONE document, published atomically.** The key and the index it describes live in a SINGLE
       object, written to a temp file in the same directory and published by an atomic `os.replace`,
       under a filename namespaced by the resolved checkout path. This is a RULE, not an
       implementation detail, because the alternative reads reasonable: a payload file beside a meta
       file naming its key carries a cross-file invariant nothing holds, so two interleaving stores
       leave a meta naming key A beside a payload built for key B and the next reader is served a
       mismatched pair — a stale hit reached with NO staleness in the key, which is why the
       content-exact key above does not cover it. A reader observes the WHOLE previous document or
       the WHOLE new one, never a partial write; a lock was the explicitly worse option (tripwires `a_torn_document_reads_as_a_miss`,
       `no_interleaving_can_pair_one_key_with_another_builds_index`,
       `the_document_is_published_by_atomic_replace`).
  1. Walk `specs/*.yaml`, `patterns/*.md` + `plans/*.md` +
     `ideas/*.md` frontmatter (planning artifacts → `plan` nodes, `kind: plan|idea`) + `errors/E-*.yaml`
     (→ `error` nodes; the `E-*` glob excludes `errors/_template.yaml`)
   - NON-EMITTING passes: the build STILL walks `tasks/*.yaml` (for the `tasks_citing`
     reverse-index — the surviving `cites` edge) and reads `tasks/*.yaml` + the audit-verdict /
     `D-NNNN-` files under `decisions/` via `_read_yaml(errors=parse_errors)` for parse-error
     observability (→ `_parse_errors` → exit 2 / land block). These passes EMIT no `tasks` /
     `decisions` / `audits` graph SECTION (those node-types are cut) — they are reverse-indexing
     + parse-error-surfacing reads only.
     - For each spec `implements:` anchor (`<file>` / `<file>#<symbol>`), **resolve** it
       against the current tree (file exists; symbol = a def/class/const/heading present). Unresolved
       anchors are collected as **report-only warnings** (stderr, NOT a build failure — report-not-block).
       The `code_to_specs` reverse index is keyed by the normalized **file component** (so `graph query
       <file>` matches `<file>#<symbol>`).
  2. **[ — the commit/event/audit_verdict build-walk steps were REMOVED by the graph-slim cut: the build no longer parses git `from:` trailers, `events.jsonl`, or `decisions/<id>-audit-*.yaml` into graph sections.]**
  3. *(removed — event/emitted_by cut)*
  4. *(removed — audit_verdict/audited cut)*
  5. **Parse canonical docs (CHARTER + AGENTS + LIFECYCLE + QUEUE + GRAPH) for rule extraction:**
     - Match lines with markers `[MUST]` / `[SHOULD]` / `[MAY]` or keywords (`Must` / `Cannot` / `Required`)
     - Generate rule node per match: `rule:<doc-slug>:<section-slug>:<severity>`
     - Store with fields `{source_doc, source_section, source_line, severity, content, status}`
     - Emit `defined_in` edge (rule → source doc node)
  6. Output `graph/index.json` ( — the DERIVED index is JSON-serialized: json.dumps
     sort_keys=True + indent=1 + ensure_ascii=False, datetime/date values serialized as ISO-8601
     strings at build time; ~100x cheaper than the prior yaml.safe_dump/parse on the ~2.3MB tree.
     P5 unchanged: one-YAML-format governs AUTHORED operational state, not this derived view.
     Structure (shown as YAML for readability — keys identical in JSON)):
  ```yaml
  specs:
    SPEC-0042:
      title: All operational state is YAML
      status: active
      implements: # durable anchors — file / file#symbol, NOT line ranges
        - bin/lib/task.py#cmd_task_file
        - bin/lib/state.py
  code_to_specs: # keyed by the normalized FILE component ( — so
    bin/yitc-v2: # `graph query <file>` matches a `<file>#<symbol>` anchor)
      - SPEC-0042
      - SPEC-0017
    bin/lib/state.py:
      - SPEC-0042
  tasks_citing:
    SPEC-0042:
      -
      -
  errors: # : 11th node type — promotion-only case files (errors/E-XXXX.yaml)
    E-0001:
      kind: friction # defect | friction | improvement
      severity: low
      status: open
      fingerprint: <stable-dedup-key>
      relates_to: '#10 Format drift'
      refs: [events.jsonl#ts=..., <git-sha>]
  ```
  **Read-order regen side-effect — EXPLICIT build only.** Beyond the index + the floor
  trigger-map (both via `_write_graph_index`, the shared path), the EXPLICIT `bin/yitc-v2 graph build`
  ALSO regenerates the `AGENTS.md` `<!--GEN:read-order:STYLE-->` managed regions from the single carrier
  `HANDBOOK_READ_ORDER` (`_regen_handbook_read_order`). In `cmd_graph_build` ONLY — NOT in
  `_write_graph_index` / the land-time `_auto_rebuild_graph` (AGENTS ∉ `_BOOKKEEPING_ALLOWLIST`, so a
  land-path write would break land). The read-order RULE + its non-divergence backstop (the
  `_read_order_drift` conformance check, report-at-land) are homed at SPEC-0007 §5b; this is only the
  build-tool's side-effect note.

  **Audience-scoped seed views (SPEC-0127) — BOTH build seams (amended).** Via the
  shared `_write_audience_views`, called by BOTH the explicit `cmd_graph_build` AND land's derived-regen
  (`_auto_rebuild_graph`) — the SAME placement + rationale as the `release-view/` regen, NOT the
  read-order regen. **Amended from "EXPLICIT build only" by **: the original clause filed these
  views with the AUTHORED explicit-build-only surfaces (the AGENTS.md read-order regions / the placement
  manifest), but SPEC-0074 §6 draws the line at the artifact's CLASS, not its input — a PURELY-DERIVED
  artifact regenerates at both seams and rides `_BOOKKEEPING_ALLOWLIST` + `_DERIVED_MERGE_ARTIFACTS`,
  while explicit-build-only exists to stop land CLOBBERING an author's edits. These views are
  derived-only (`DO NOT EDIT`, drift-checked), so nothing of an author's can be clobbered; being
  handbook-TEXT-derived made them look authored, which is the misclassification. It also matches what
  SPEC-0127 §3 already declares them to be — "the SIBLING pattern of `graph/floor-trigger-map.md`",
  which IS land-regenerated + allowlisted. Cost of the old placement (2026-07-16/17): a source edit
  landing without a view regen left drift on main that land could not fold — it ABORTed an
  unrelated land and was swept into an unrelated ship commit as an out-of-scope audit-post RED
; and land re-published the STALE view into `release-view/`, which is generated FROM these
  views, so `-C` consumers read it as their seed (the E-0034 class). `graph build` derives THREE committed
  derived-only views from the seed docs' `<!--AUDIENCE:core|controller|worker-->` section markers
  (`_render_audience_views`): the **worker-seed PART CHAIN** — `graph/worker-seed.md` (part 1, which keeps
  the pre-split name) plus its `graph/worker-seed-<n>.md` continuation parts, each size-bounded so it loads
  in ONE bounded read (the part COUNT is DERIVED from the packing, never a declared list, and a
  build that shrinks the seed PRUNES the orphaned parts) — the core+worker sections a Worker reads;
  `graph/controller-supplement.md` (the controller-only sections), and
  `graph/worker-startup-inventory.md` (the per-section audience map + the worker-seed size, total AND per
  part + the three-part §5 hard probe). Engine-only (a consumer has no engine handbook of its own). Non-divergence is
  the report-at-land `_audience_views_drift` conformance check (committed == regenerated; fail-closed on
  a malformed marker) — the exact sibling of `_read_order_drift` / `_floor_map_drift`. The audience
  MECHANISM + the derivation rule are homed at SPEC-0127; this is only the build-tool's output note
  (SPEC-0031 stays the ONE home for what `graph build` emits + where, P5).
  Maybe 50-100 LOC to build, walking 2 directories. `graph build` also surfaces `counts.errors` in the
  `graph_built` event payload (auto-derived from the `errors` index key). **Output committed to repo**
  (not gitignored — V1's gitignored `.yitc/liveness-registry.yaml` made gates depend on machine-local
  state; V2: if generated, it's committed).

  **Consumer-build attribution (F-001).** When `graph build` targets a CONSUMER checkout
  (REPO_ROOT != ENGINE_ROOT — the engine's own root captured at import; reached via the `-C <path>`
  flag), the structural layers `verb_to_specs` / `floor_trigger_map` / `binding_report` are
  KERNEL-derived (their shape comes from the engine constants BINDING_VERB_SURFACES / FLOOR_TRIGGERS,
  non-zero even on an EMPTY consumer), NOT project-derived. The build adds an additive top-level
  `kernel_provided` marker {engine: a STABLE literal kernel label (never a path/checkout name —
  reproducible), layers: the 3 layer names, note} so they are not mistaken for the consumer's own
  rules->code nodes (MARK, do NOT omit — a consumer still consumes them for read-gate delivery). The
  ENGINE self-build (REPO_ROOT == ENGINE_ROOT) is UNCHANGED — no marker. (The floor-trigger-map.md
  consumer header-note counterpart is documented at SPEC-0013 §Derived views.)

  **Consumer READ-side resolution (F-010/F-012).** The read-side complement of the build-side
  attribution above: a `-C` consumer LACKS the kernel's methodology CONTENT locally, so a point-lookup
  of a KERNEL spec absent from the consumer index resolves its node + source body from the ENGINE
  index/specs (consumer-OWN specs still WIN per-id). The same ENGINE_ROOT fallback resolves kernel
  patterns + scaffolding templates + the SPEC-0036 gate-template for a consumer. The TASK-axis read-gate
  DOC-SET (`_stage_bundle_specs`) IS engine-merged under `-C` (amended / F-016 — supersedes the
   own-only rule): it resolves `include_kernel=_is_consumer_build`, SYMMETRIC with the delivery
  surfaces below, so a consumer's stage read-check ENFORCES the kernel stage-entry contract it is SHOWN.
  The gate stays SATISFIABLE, never a deadlock: the consumer fetches the contract via the kernel-spec
  point-lookup above (`graph query <SPEC>` → the `cli_invoked` row credits it) and the verb then proceeds.
  Pre- the doc-set was own-only and a blank consumer's stage read-check was VACUOUS — the F-016
  silent-OFF (`read_gate_refused`=0 read as compliant while the read-CHECK leg never fired); that own-only
  rule is RETIRED for the read-gate. **Plan-axis is UNCHANGED** (`_plan_stage_bundle_specs` has no
  kernel-merge knob, so plan-stage delivery AND enforcement both stay own-only — already symmetric, NOT
  the F-016 asymmetry). The engine self-build is byte-unchanged (`_is_consumer_build` is false there). **DELIVERY + DOC-SET vs BUILD (amended).** Under `-C` BOTH the delivery surfaces AND the TASK-axis read-gate DOC-SET (the set the gate REQUIRES fetched before the stage action) are kernel-MERGED; the graph BUILD stays own-only (below). The DELIVERY surfaces are kernel-MERGED so kernel content is DISCOVERABLE on a blank consumer, not just point-resolvable: the `stage <NAME>` bundle (`_stage_bundle_specs`/`_stage_bundle_patterns` include_kernel=True), the claim-moment Analysis surfacing, `graph query --type view` (`_list_views`) + a saved kernel view's execution path, and `graph query --type pattern` (`_emit_node_list` include_kernel —, the pattern node-class only; other `--type` listings stay own-only) — each merges the engine specs/patterns/views UNDER the consumer's own (own-WINS per id/name). The graph BUILD (`graph_build_index`) stays own-only ON PURPOSE — index exposure is READ-side via the engine-index fallback, so the build-side kernel_provided attribution stays intact. Under `-C` the TASK-axis gate fires on the kernel-MERGED stage-entry doc-set (own-WINS per id); so on a blank consumer "the read-gate path is satisfiable" means the consumer must FETCH the shown kernel contract (via the point-lookup) before the stage action, then proceeds — enforcement is symmetric with delivery, not vacuous (the F-016 fix). The ENGINE self-build is byte-
  unchanged (fallback guarded by `_is_consumer_build`); the consolidated engine↔target seam doctrine is
  the kernel-extraction plan's finalization spec.

  ### Query CLI — `bin/yitc-v2 graph query <id>`
  - `<id>` is `SPEC-NNNN` → return all code locations that implement it + all tasks citing it
    + `superseded_by:` — the DERIVED reverse link for a **COMPLETED** supersession: the
    head(s) whose durable `supersedes:` names this spec AND which actually TOOK EFFECT (status
    `active` / `superseded` / `retired` — a head later superseded or retired still replaced the
    target, so the lineage chain does not break). Derived at QUERY time from the same index that
    resolved the node (so `--kernel` / the `-C` engine-fallback read KERNEL heads) — NEVER stored:
    SPEC-0030 carries no `superseded_by` field and a superseded spec is frozen-immutable (rule 7),
    so graph code is the link's only legal carrier (a VIEW over existing data, CHARTER §P1 F2). A
    head that is `proposed` (the PENDING supersession — `--projected` owns that, §Projected view),
    `draft` / `withdrawn` / `rejected`, or ABSENT yields NO pointer, and the key is OMITTED entirely
    when there is no head (never an empty list). Closes X-0290: before this, the reverse link existed
    ONLY inside `--projected` for the pending case, so once a supersession completed no query surface
    showed what replaced a superseded spec.
  - `<id>` is `<file-path>` → return all specs that this file implements
  - `<id>` is `T-NNNN` / `D-NNNN` → the node is re-sourced ON DEMAND from the authored `tasks/` / `decisions/` YAML ( — the task/decision build sections were cut, so there is no index section; the graft restores T-/D- point-lookup + the spec→T-/D- `requires:` known-id universe). `E-NNNN` resolves its `error` node from the index. The post-cut task point-lookup payload is the node only (no `commits_from`/`events`/`audits` — those edges are cut); the plan point-lookup likewise drops its `audits` line (plan-check verdicts read directly from `decisions/<plan>-audit-*.yaml`).
  Output: structured YAML or markdown table. No JSON-only mode (humans read this too).

  **Point-lookup appends the SOURCE artifact.** After the metadata block, a point-lookup of
  a body-bearing node — `spec` / `pattern` / `plan` / `error` — ALSO appends the full source artifact
  of that node (the spec `body:` + structured fields; the pattern/plan markdown body; the error
  structured YAML), so the documented "Read it via `bin/yitc-v2 graph query <ID>`" path delivers the
  rule itself, not only the index node. The body is read from the SOURCE FILE at query time via a
  shared by-type loader (`specs/SPEC-XXXX-*.yaml` / `errors/E-XXXX-*.yaml` / `patterns/<name>.md` /
  `plans/<slug>.md` | `ideas/<slug>.md`) — it is NEVER stored in `graph/index.json` (§NOT a caching
  layer / CHARTER §P5: the body lives in ONE place). Default-on is point-lookup-ONLY: never
  flag-gated, and the `--type` / `--projected` / `--carve-out` / view / file-path / `T-`/`D-` forms
  are UNCHANGED (no body append).

  **Implemented surface today (verified against `bin/yitc-v2 graph query --help`):** the
  positional `<id>` (`SPEC | T | D | E | file`) point-lookup + the flags `--type <node-type>`,
  `--recurring` (with `--type error`), `--as-of <commit|date>`, `--projected`/`--diff`, and
  `--include-draft <plan-slug>`. (The `--carve-out` dispatch-selection flag also lives on this
  verb but is HOMED in SPEC-0044, not here — the carve-out picker's surface; `graph query SPEC-0044`.
  Reviewed 2026-06-06: re-verified `cmd_graph_query` vs anchor a628154e1 — the only region
  change since is `--carve-out` branch (SPEC-0044), so the query-CLI contract THIS spec owns
  is undrifted; cross-pointer added so the full-surface enumeration stays truthful.) The richer
  `--since` / `--source` / `--type rule --mandatory` and the
  **Aggregations** + **Reverse-mapping** queries documented just below are the ** query-LAYER
  DESIGN** — NOT yet implemented (deferred until empirical pull, same status as the explicitly-marked
  `--mandatory-unread`). They are retained here as the intended design surface, not the shipped CLI.

  ### Query layer ( — consolidated views as queries)
  The graph IS a **data layer** (7 nodes + 4 edges — the SPEC-0076 scenario node + covers edge). Consolidated views = **query layer** over the same
  data — NO parallel mechanisms per concern.

  **Query CLI shape:**
  ```
  yitc-v2 graph query <id> # point lookup (single node)
  yitc-v2 graph query --type <node-type> # filter by node type
  yitc-v2 graph query --type rule --mandatory # show all MUST rules
  yitc-v2 graph query --since <window> # time-filtered
  yitc-v2 graph query --source <doc> # filter by sourcing doc
  yitc-v2 graph query --type rule --as-of <commit|date> # rule-set AS IT WAS at a past point
  yitc-v2 graph query --projected # «what-will-be» view (a.k.a. --diff); see below
  ```
  `--as-of <commit-ish|YYYY-MM-DD>` reads the **committed** `graph/index.json` as of that
  commit (date → newest commit on/before that day) and runs the query against it — the point-in-time
  rule-set for behavioral audit. Pure read over git history; no new state. Composes with `--type` / id.
  Format history : a pre-switch SHA falls back to the legacy `graph/index.yaml` ONLY when
  `index.json` is ABSENT at that SHA; a present-but-malformed `index.json` fails loudly (never
  YAML-masked). The fallback is permanent — git history is immutable.

  `--projected` (a.k.a. `--diff`, B4) is a **PURE f(graph)** projection over the current
  index: `active − superseded-by-proposed + proposed`, annotated with **STRUCTURAL flags only**
  (`added` / `changed` / `superseded` / `stale` / `multi-proposer-unordered` / `dangling`). It is the
  standing way to see staged spec changes and to detect the concurrent-change invariant violation
  (`multi-proposer-unordered`). It writes **no durable state** — no stored snapshots, no named futures,
  no merge / adjudication / semantic-contradiction analysis (all DEFERRED). The moment it
  would need any of those, or become a gate, STOP and file (anti-complexity, CHARTER §1).

  **Aggregations:**
  ```
  yitc-v2 graph query --session-size # total injected this session (lines + chars)
  yitc-v2 graph query --by-rationale # group injections by rationale source
  yitc-v2 graph query --order-by size_lines desc # sort by size
  ```

  **Reverse-mapping queries ( insight #6) — PRIMARY tool for bloat-prevention audit** (the
  rationale field enables «what cost does X impose?»):
  ```
  yitc-v2 graph query --injections-triggered-by AGENTS.md§At-session-start
    # → all instruction_injected events citing this rationale
    # → sum of size_lines / size_chars = total burden this protocol imposes per session
  yitc-v2 graph query --never-cited-in-rationale --window 30d
    # → docs/decisions/specs not cited as rationale in last 30 days → retirement / supersession candidates
  yitc-v2 graph query --top-rationale-by-volume --session current
    # → top 5 protocols by injection burden (hotspot detection)
  yitc-v2 graph query --mandatory-unread <task-id> # DEFERRED Day 6+
    # → MUST_READ_NOW injections for task without matching Read events = discipline violations
    # Requires `instruction_read` event source decision (or native AI-tool Read tracking).
  ```

  **Saved views — `views/<name>.yaml` (ACTIVE):** a **view** is a named, saved
  **query-lens** — it stores the QUERY, never a materialized output, so the result is **recomputed
  fresh** on every run (no stale stored output — CHARTER §P5). Views make consolidated reports
  *discoverable* via a deterministic catalog instead of AI memory.
  Schema (`views/<name>.yaml`):
  ```yaml
  name: rule-catalog # canonical name (the file stem is the fallback)
  description: <one line — what question it answers> # shown in the catalog listing
  lens: # the query to run (NOT its output)
    kind: node-list # node-list (over a graph node type) | verb-map (pure f(graph))
                                # | binding-bundle (specs carrying one binding token)
                                # | token-rollup (raw-transcript read-side)
                                # | trend-report (journal-windowed L4 trends)
                                # | task-scorecard (per-task journal-derived metrics) | further code-lenses
    node_type: rule # for kind: node-list
  why: <why this report exists>
  ```
  Catalog + execution: `graph query --type view` → lists the catalog as `name — description`, sorted by
  canonical name, read from `views/` on demand (a DERIVED listing — no stored index, no new node/edge).
  `graph query <view-name>` → runs the saved lens against the current index.
  Inaugural views : `rule-catalog` (consolidated rule listing, `lens: node-list` over `rule`);
  `verb-map` (per-verb governance, **pure f(graph)** — verb universe from `build_parser`, governance
  from `code_to_specs`; file-level today, labels itself `file-level approximation`). Future views added
  per pull: `open-tasks`, `audit-compliance`, `protocol-cost`, etc.
  **Binding-bundle lenses :** a lens `kind: binding-bundle` takes a `binding_token:` and returns
  the active specs carrying it — read straight from `index["verb_to_specs"][binding_token]`, the EXACT
  list `_build_binding_views` inverts from each spec's `binding:` field and that the `floor_trigger_map`
  is itself built from (graph.py:197). So the view and the floor-trigger-map are TWO SURFACES over ONE
  source (the floor-map fires the bundle BEFORE an action; the view answers "what governs X?" on demand):
  a spec added/removed from the bundle reflects in both without a second list — single source, no new
  store. Inaugural: `consumer-dimension-bundle` (token `before-project-dimension-judgement`) —
  the REF_AVAILABLE discovery path for the kernel↔consumer project-dimension doctrine.
  **Raw-source lenses :** a lens MAY read a raw out-of-graph source instead of the index when
  the data deliberately lives outside the journal/graph — `token-rollup` sums per-session token usage
  from raw provider transcripts (`.yitc/transcript-archive/` UNION live, deduped newest-mtime-first)
  × CURRENT `bin/pricing-config.yaml` rates (the reroute: tokens are NOT journal-materialized;
  cost is computed at read-time, price never stored). Still a saved view: stores the query, recomputes
  fresh, writes nothing.
  **Windowed journal lenses :** a lens MAY read the JOURNAL (`events.jsonl` full `data`
  payloads — which the slim index `events` projection lacks) plus the committed index for current
  node STATUS, and accept a date window via `graph query <view> --since/--until` (ISO date or
  timestamp, UTC-normalized — `since` inclusive, `until` exclusive). `trend-report` is the L4
  system-trend feed for inspections ( revizii): journal growth + test-leak share, op-duration
  trends (graph-build / suite / land), queue flow (filed→picked latency, WIP age, throughput,
  parked/blocked age stats (oldest/median/n)), adoption-debt aging, churn (re-audit passes, land aborts, post-close
  collateral, recurring deviation fingerprints), and overhead share. Journal-only (the index it also
  reads is a derived journal+corpus projection, not a second authored store); every section reports
  numbers OR an explicit `n/a` — an empty trend is never silently dropped. Still a saved view:
  stores the query, recomputes fresh, writes nothing.

  **Targeted lenses :** a lens MAY take a target via the optional second positional —
  `task-scorecard` (`graph query task-scorecard T-XXXX`) reports a closed task's journal-derived
  lifecycle metrics (lead time, per-stage wall, audit passes + GREEN-first, land attempts both-outcome,
  deviations) + a tokens/cost column reusing the `token-rollup` lens (clean attribution when 1 task = 1
  session, explicit n/a when ambiguous). A no-arg run prints the usage hint (never errors).

  **Plan-gate lenses :** a lens MAY re-derive a plan-lifecycle gate's verdict as a
  NON-BLOCKING report by reusing the SAME canonical gate helpers (P5, no drift) — never calling the
  `_die`-ing gate itself. `plans-pending-finalization` (kind `plans-pending-finalization`) lists accepted
  plans with zero open citing tasks. `postcheck-plans-readiness` (kind `postcheck-plans-readiness`) lists
  plans at `postcheck` with their realize-readiness against the 3 CODED `plan stage realized` exit clauses
  — `finalization_ready` (specs reached-active + fresh GREEN/YELLOW aggregate `audit post --plan`),
  `retire_on_proof_resolved`, `captures_routed` — plus `realize_ready` (their AND — exactly the 3 clauses,
  no hidden gate), per-plan `blockers`, an explicit `plan_file_readable` flag, and a clearly-labelled
  `postcheck_probe_block_declared` ADVISORY (a plan-body PRESENCE heuristic over the explicit probe-block
  phrasing, NOT a content parser and NOT a "soak min-runs met" boolean — real-data ×N is owner-judged per
  plan, SPEC-0034 §postcheck). Both retire a manual grep; both are report-not-block (CHARTER §P1).

  **What query layer is NOT:** NOT a separate index mechanism (INDEX.md generator etc. — those are
  query outputs, not tools); NOT a caching layer beyond graph-build freshness; NOT a real-time dashboard
  (queries run on-demand); NOT mutating — a lens is a pure READ (over the graph artifact, or — for a
  raw-source lens like `token-rollup` — over raw transcript files + owner config; never a writer).

  ### Node-volume — consolidation is a Review judgement, not a count-gate
  There is **no numeric node-volume trigger** for any node type. Consolidating / retiring / archiving
  nodes (tasks, decisions, patterns) is a **regular Review judgement** made on observed cost — never an
  arbitrary count threshold: counts grow with the work, so a fixed number signals nothing (owner
  directive 2026-06-06). The arbitrary per-node-type count thresholds that once lived here
  are removed. The **spec count cap is likewise REPLACED** by the admission test + two-bound volume
  discipline (homed in SPEC-0005 rules 2 + 6; GRAPH.md §When-to-add points there) — anti-bloat is held
  by that discipline + retrieval precision + currency, not a count cap (SPEC-0005 rule 6).

  ## Rationale

  Demoted to the retrieved tier (SPEC-0007 §5a query-only): the build walk + query-CLI surface are
  consulted only when working ON the graph tooling — not before a gated control-point — so the
  always-loaded GRAPH core stays small (node/edge schema + Spec lifecycle FSM + What-a-spec-is-FOR). The
  build↔query contract (the `index.json` format) is kept in ONE spec so the producer-doc and
  consumer-doc do not drift apart (rule-1 merge: separating them would worsen change analysis).

