id: SPEC-0031
title: Graph build and query reference — index format, query CLI, projected, saved
  views
status: active
created_at: 2026-06-02 19:21:11+00:00
consumed: false
implements:
- bin/lib/graph.py#cmd_graph_build
- bin/lib/graph.py#cmd_graph_query
- bin/lib/graph.py#repo_state_fingerprint
- bin/lib/graph.py#index_cache_lookup
- bin/lib/graph.py#index_cache_store
- bin/lib/graph.py#graph_cache_report_lines
- bin/lib/graph.py#_regen_manifest_managed_regions
binding:
