body: "## Scenario\n\nWhen a Review session runs a triage sweep, it needs the precise\
  \ rule for HOW FAR BACK to route\nun-routed `deviation_captured` captures (the window).\
  \ (HOW a fix-task/decision back-references the\ndeviations it closes — the link\
  \ rule — is carved out to <workshop-spec>, `graph query <workshop-spec>`.) This\
  \ is\nsituational reference consulted at triage time, fetched\nvia `bin/yitc-v2\
  \ graph query SPEC-0055` (the QUEUE.md pointer-stub names this spec). The always-loaded\n\
  QUEUE core keeps the manual Review-scan CADENCE (weekly parking-lot/blocked, monthly\
  \ done-log,\nper-session observations) — those are short process policy with no\
  \ code home.\n\n## Internal\n\nTHE TRIAGE-RUN WINDOW + LINK RULE ( §3/§9). Faithfully\
  \ carried from QUEUE.md §Re-review (the\ntriage slow-lane portion only — the manual-cadence\
  \ bullets stay mandatory in QUEUE.md).\n\n### Triage run ( §3 slow lane)\nThe owner-invoked\
  \ Review scan ALSO sweeps the journal's un-routed `deviation_captured` captures\
  \ (one\nmore thing this control-point looks at — NOT a new recurring/cron procedure;\
  \ CHARTER §6/§7). Each\ncapture routes to exactly ONE of the **four routes**: `event-only`\
  \ · `linked` (an existing\nfix-task/decision already owns it) · `promote-to-fix-task`\
  \ · `promote-to-E-XXXX`. The triage VERB\nis `bin/yitc-v2 triage` (`cmd_triage_run`).\n\
  \n**Filing-contract delivery at the scan entry (X-0128 — pointer, the rule lives\
  \ in SPEC-0060).**\nBecause `promote-to-fix-task` is a route, the scan's expected\
  \ output is filing — so the scan entry\nDELIVERS the Filing/task-authoring doctrine\
  \ (SPEC-0060) at entry (an honest node_id-bearing\n`cli_invoked` delivery-receipt,\
  \ verb `\"triage run\"`), so a `task file` mid-batch is not surprise\nread-gate-refused.\
  \ This is SPEC-0060's delivery surface, not a new window/lineage rule; the receipt\n\
  semantics + credit-path are owned by SPEC-0060 §Delivery wiring (pointer only —\
  \ P5, not restated).\n\n### Triage-run window + the link rule ( §3/§9; watermark\
  \ BASIS hardened)\n- **Per-capture ROUTE recording at completion ( — X-0126).**\
  \ `triage run --complete` records\n  the route PER CAPTURE, not just the watermark\
  \ count: for each routed capture in the window it writes\n  a `routes[]` row `{ts,\
  \ fingerprint, target_kind, target_id}`, and `routed`/`linked` are DERIVED from\n\
  \  that set (`routed` = #routed capture events; `linked` = the cites-owned task/decision\
  \ subset; the\n  cross subset is routed-but-not-`linked`; `promoted` stays operator-supplied).\
  \ The capture->target\n  link is READ from the already-persisted carriers — a task\
  \ `cites:` the fp (the §9 LINK RULE,\n  `_fingerprint_cites_index`), a cross carries\
  \ it as `cross_requested.origin_fp`, and an errors/E-XXXX\n  case file OWNS it (`_error_fingerprint_index`,\
  \ values shaped `(E-id, status)`) — NOT a new store\n  (P1). This closes the X-0126\
  \ lineage gap: the routing audit-trail (which capture went to which\n  task/cross/case-file)\
  \ is now durable, where the bare `routed`/`linked` count alone lost it.\n  **All\
  \ THREE carriers are read (X-0344).** The E-file carrier was MISSING from the original\n\
  \   loop, so this section's own FOUR-route rule (§Triage run — `promote-to-E-XXXX`)\
  \ was invisible\n  to the derivation: a PROMOTED capture was counted as un-dispositioned\
  \ (`routed` short by one, the\n  capture mislabelled «genuinely unrouted»). An E-file\
  \ route is routed-but-NOT-`linked` (like a cross\n  route — `linked` stays the cites-owned\
  \ task/decision subset). The `--routed/--linked` flags remain\n  NON-authoritative\
  \ (reverting that IS the X-0126 defect), but a passed value that DISAGREES with\
  \ the\n  derived count now WARNs — naming both numbers + the carrier that makes\
  \ a route countable — instead\n  of being silently zeroed (the operator-facing half\
  \ of X-0344).\n- **Recorded-disposition window ( — supersedes the ts boundary as\
  \ the window key).** A capture\n  leaves the triage window ONLY by a RECORDED disposition:\
  \ a `triage_run_completed.data.routes` row —\n  a carrier route (task/decision `cites:`,\
  \ cross `origin_fp`, E-file) or an explicit\n  `target_kind: event-only` row the\
  \ operator records at `--complete` (`--event-only FP…` /\n  `--event-only-rest`).\
  \ Per-capture identity = `capture_id`, a digest of the capture event (two\n  captures\
  \ differing in any byte differ; byte-identical rows are one event after union-merge\
  \ dedup).\n  `--complete` may close a PARTIAL window: undispositioned captures get\
  \ no row and stay queued, and a\n  capture folded in late (ts <= a recorded window_through)\
  \ re-enters. **Legacy cut-over:** captures\n  at or before the frozen cut-over —\
  \ the boundary in force at the first completion recording\n  `window_rule: recorded-disposition`\
  \ — stay governed by the pre-change ts boundary (not re-queued);\n  `triage run`\
  \ prints this rule. `window_through` is still recorded, non-regressively, for the\n\
  \  ts-boundary readers (realize gate, postcheck view).\n- **Routing depth = the\
  \ window SINCE the last `triage_run_completed` watermark** (already-routed\n  captures\
  \ stay routed). **Bootstrap:** if no watermark exists yet, scan from the **start\
  \ of the\n  journal**. The watermark is a **closed boundary** — it is *excluded*\
  \ from the next window, so each\n  capture is routed exactly once. (The watermark\
  \ event is defined in `AGENTS.md §events.jsonl-schema`.)\n- **Watermark BASIS =\
  \ `data.window_through`, NOT the completion-event `ts` ( — supersedes the\n  pre-\
  \ `ts` basis carried by <workshop-spec>).** `window_through` is the max ts of the\
  \ window the\n  completing run ACTUALLY ROUTED, and `_last_triage_watermark` — the\
  \ SINGLE reader the three consumers\n  (`cmd_triage_run`, the realize-gate `_require_captures_routed`,\
  \ the postcheck-readiness view) all key\n  off — returns it. This closes a SILENT-LOSS\
  \ class: with a 1-second-resolution `ts` (`_utc_now_iso`)\n  and NO per-event tie-break\
  \ key (journal physical order is not stable after a union-merge, SPEC-0002),\n \
  \ a capture emitted in the SAME wall-clock second as `--complete` but AFTER it had\
  \ `ts == now` ⇒ the\n  closed `ts > prior` boundary excluded it from EVERY future\
  \ window ⇒ it was lost forever. Keying off\n  the routed-window max instead never\
  \ advances past a capture the run did not route, so a later-second\n  capture stays\
  \ in-window. **Gap-free recording:** the boundary MUST be the max ts of what the\
  \ READ run\n  SHOWED — so `triage run --complete --through <ts>` lets the operator\
  \ PIN it (the `triage run` read\n  prints the value), and a rescan-at-completion\
  \ is NOT used as the authority (it would advance past a\n  capture that arrived\
  \ in the read→complete gap). A pinned `--through` is VALIDATED — well-formed UTC\n\
  \  ISO and NEVER earlier than the current boundary — so it can only hold or advance\
  \ the boundary, never\n  regress it (the non-regression safety contract). **Back-compat:**\
  \ a pre- watermark with no\n  `window_through` falls back to its event `ts` — identical\
  \ to the old behaviour. The boundary\n  predicate (`ts > prior`) and the closed-boundary\
  \ / routed-exactly-once contract are UNCHANGED — only\n  the basis the boundary\
  \ is computed FROM is hardened, so consumers' compliance action is identical.\n\
  - **Residuals (deferred to):** two cases unclosable at the boundary level with `ts`\
  \ alone (1-s\n  resolution, no per-event tie-break key): (a) a capture at the EXACT\
  \ same second as the boundary,\n  arriving after the read — the IRREDUCIBLE 1-second\
  \ tie; (b) when `--through` is OMITTED, a capture\n  that arrived in the read→complete\
  \ GAP and is swept into the best-effort rescan max. Both are CLOSED at\n  the per-capture\
  \ level by per-capture routed-marker — the `triage-state` saved view\n  (`_view_triage_state`\
  \ view family) — which inherits THIS safe boundary (the hardening was the\n  precondition\
  \ the audit-pre consult ABORT required: \"harden the primitive FIRST, before building\n\
  \  new consumers on it\"). The view buckets EACH deviation_captured against `window_through`\
  \ as ROUTED /\n  genuinely-UNROUTED / BOUNDARY-TIE, SURFACING (a) the exact-equal-second\
  \ tie per-capture so it is never\n  silently mis-bucketed, and keeping (b) the read→complete-gap\
  \ capture VISIBLE (UNROUTED/TIE, not\n  silently-routed). It is a DERIVED verdict\
  \ — NO persisted stamp, NO new store, NO parallel cursor (the\n  consult rejected\
  \ those). The gap-free `--through` path additionally avoids (b) at completion time.\n\
  - **The LINK RULE — one canonical carrier:** carved out to its own narrow spec —\
  \ **<workshop-spec>**\n  (Triage LINK RULE — fingerprint↔fix linkage derived from\
  \ `cites:` exclusively). Fetch via\n  `bin/yitc-v2 graph query <workshop-spec>`.\
  \ It homes the `cites:`-EXCLUSIVE derivation rule + the\n  cited-rollup cluster-aware\
  \ recurrence count (`_capture_cluster_counts`). This spec keeps\n  the window, batch-run\
  \ journal isolation, discovery stem-clustering, and queue lineage.\n\n### Batch-run\
  \ journal isolation — emit from the run worktree, fold at land\nThe discipline,\
  \ in one line (verbatim state-probe phrase):\n**emit a long batch run's events from\
  \ the run worktree, fold at land.**\nA **long owner-invoked batch run** — the triage\
  \ run (this verb), the periodic inspection\n, or an ad-hoc audit batch — emits MANY\
  \ journal events over a multi-minute window (captures,\n`inspection_completed`,\
  \ `triage_run_completed`, audit events). Such a run **MUST emit ALL its run\nevents\
  \ from its OWN `work/<slug>` worktree** (the existing write-flow primitive) and\
  \ **fold\nthem into `main` with ONE `land`** at the end — so `main`'s `events.jsonl`\
  \ stays CLEAN across the\nwhole window and the run's captures appear on `main` only\
  \ at the single fold-land commit. This stops\nthe long-lived dirty-window on `main`\
  \ that feeds the E-0010 land-abort-on-dirt family for concurrent\nsessions (real\
  \ incident: the 2026-06-07 fresh-inspection run, ~40 emits from `main` over ~50\
  \ min).\nONE isolation rule covers ALL three batch families — not one per run type.\n\
  \n- **Invocation form is load-bearing (audit-pre F1):** `REPO_ROOT` is derived from\
  \ the\n  BINARY location (`Path(__file__).parent.parent`), NOT the cwd — so a bare\
  \ `cd <wt> && bin/yitc-v2\n  event …` that resolves the MAIN checkout's binary on\
  \ `PATH` still writes to MAIN's `events.jsonl`,\n  silently defeating the isolation.\
  \ Use a repo-root-rebinding form: **`bin/yitc-v2 -C <wt> event …`**\n  (the `-C`\
  \ flag rebinds `REPO_ROOT` to the worktree) **OR the worktree-local binary\n  `<wt>/bin/yitc-v2\
  \ event …`**. Same form as the proven prior-art `( cd <worktree> && bin/yitc-v2\n\
  \  event bg_dispatch_halted …)` / `bin/yitc-v2 -C <worktree> event …` (`patterns/background-session-\n\
  \  monitoring.md` §Abnormal — \"emitted FROM the worktree so it lands in the worktree\
  \ journal, folded\n  to main at land\").\n- **Boundary — deterministic (audit-pre\
  \ F-low):** the rule scopes to a run that OPENS a\n  `work/<slug>` worktree for\
  \ its own work (a batch run is one such) → emit there, fold at land. A\n  **single\
  \ from-anywhere ad-hoc `deviation_captured`** (the capture reflex) is the EXCLUDED\
  \ case: it\n  needs NO worktree and STAYS emittable from anywhere incl. the main\
  \ checkout, folded by the next\n  `land` (** single-deviation-capture-from-anywhere\
  \ reflex — PRESERVED, not banned**). The cut\n  is \"does this run already own a\
  \ `work/<slug>` worktree?\" — if yes (batch run), emit in it; if it is\n  one stray\
  \ capture with no worktree, the reflex applies.\n\n### Discovery stem-clustering\
  \ — the UNCITED half ( §5)\nThe cited-rollup (the LINK RULE cited-rollup, now homed\
  \ in <workshop-spec>) is the AUTHORITATIVE recurrence count, but it only rolls up\
  \ fingerprints a\ncase file ALREADY cites. A root whose near-synonym spellings are\
  \ **not yet cited anywhere** stays\nfragmented and invisible. The **discovery stem-cluster\
  \ view** (`_discovery_stem_clusters`) is its\ncomplement: it groups the LEFTOVER\
  \ fingerprints — those owned by NO case file (neither a canonical\n`fingerprint:`\
  \ nor a `cites:` member) — into families by a **deterministic root-stem** (two\n\
  fingerprints are same-family iff ANY of (1) one's hyphen-token sequence is a PREFIX\
  \ of the other's, OR\n(2) their SIGNIFICANT-token sets — tokens minus structural\
  \ stopwords — share >=3 tokens AND a Jaccard\nratio >=0.6 (order-INDEPENDENT root-stem\
  \ overlap), OR (3) both are spelled `<root>:<subject>`\nand their `<root>` is BYTE-IDENTICAL\
  \ (the DECLARED ROOT); merged transitively; the family key\n= the shortest-token\
  \ member, lexicographic tie-break — EXCEPT a family whose members ALL declare the\n\
  SAME root, which is keyed by that DECLARED ROOT, so the surfaced row NAMES the root\
  \ instead of an\narbitrary member (guarded so a key never shadows a real fingerprint).\
  \ A family of `>=2` distinct\nspellings surfaces as ONE candidate to act on, on\
  \ BOTH promotion-facing surfaces (answering cross item X-1187): `triage run` Section\
  \ **B2**, and `graph query --type error\n--recurring` — the surface that names itself\
  \ the promotion threshold. The second was\nadded because its absence WAS the defect:\
  \ that surface counted recurrence by BYTE-IDENTICAL\nfingerprint plus the cited\
  \ rollup only, so a family whose spellings are each N=1 contributed\nZERO rows and\
  \ a real root could never reach `N>=2` (measured in the kernel 2026-08-28: 91 of\
  \ the\n109 families were entirely invisible there, the largest at 17x across 14\
  \ spellings, while Section\nB2 had been rendering them all along). Counting root-CLUSTERS\
  \ rather than fingerprint EQUALITY is\nthe whole change — no new store, no new clusterer,\
  \ and the `N>=2` threshold value is untouched. A\ndiscovery row is LABELLED as a\
  \ discovery family on both surfaces, because it remains a hint (next\nbullet), never\
  \ the authoritative count.\n- This is **DISCOVERY ONLY** — a hint, never an authority:\
  \ confirm a single shared cause (one 5-whys §6) then cite the members under ONE\
  \ E-XXXX via the LINK RULE (<workshop-spec>); if no cause emerges,\n  DISBAND (a\
  \ false root is itself a defect, §6). It NEVER mutates a case.\n- It does **NOT\
  \ replace** the cites-LINK-RULE cited-rollup, and the two never double-claim a\n\
  \  fingerprint: an owned (cited or canonical) fp is EXCLUDED from the discovery\
  \ set. Token-PREFIX (not\n  blind substring) plus the TWO root-stem gates (>=3 shared\
  \ significant tokens AND Jaccard >=0.6) are the\n  anti-over-merge guard — `plan-check-on-main{,-dirties…,-writes…}`\
  \ merge (predicate 1), and a root\n  respelled with different word order — `hand-edited-spec-body-…`\
  \ / `spec-body-edited-by-hand-…` /\n  `spec-file-hand-edited-…` (the E-0026 spec-edit-bypass\
  \ family) — merges (predicate 2); but\n  `plan-check-verdict-stray…` / `plan-check-generic-lens…`,\
  \ and a fingerprint sharing only a generic\n  LENS (e.g. just `spec`+`edit`), stay\
  \ separate. Discovery is advisory anyway (confirm-cause-or-disband,\n  SPEC-0056\
  \ §2), never an authoritative count.\n- **Predicate (3) reads a DECLARATION; it\
  \ does not loosen (1) or (2) — and why neither could reach it\n  :** a `<root>:<subject>`\
  \ fingerprint does not RESPELL a root, it NAMES one and varies the\n  SUBJECT, so\
  \ the two heuristics beside it are STRUCTURALLY blind to it rather than mis-tuned.\
  \ The\n  tokenizer splits on `-` only, so the `:` fuses root-tail and subject into\
  \ ONE opaque token\n  (`land-verify-timeout:test_x.py` -> `['land','verify','timeout:test_x.py']`).\
  \ Predicate (1) then\n  fails because the token sequences DIVERGE at that token\
  \ and neither is a prefix of the other;\n  predicate (2) fails because the whole\
  \ subject rides inside that one token, so the two spellings\n  share only {land,\
  \ verify} — 2 significant tokens against the >=3 floor, Jaccard 0.5 against the\n\
  \  >=0.6 floor (MEASURED, not estimated: `land-verify-timeout:test_session_verb.py`\
  \ vs\n  `...:test_fleet_verdict.py`). BOTH of predicate (2)'s gates fail, and the\
  \ shared-token gate fails\n  first. So predicate (3) is EXACT (byte-identical root,\
  \ no threshold) precisely so it CANNOT widen\n  (2)'s fuzzy matching or manufacture\
  \ a family: it fires ONLY where both spellings declare the same\n  root, ADDING\
  \ a family the two heuristics never could while changing NO family they already\
  \ form.\n  The declared-root KEY is bounded the same way — a family not wholly composed\
  \ of one-root members\n  keeps the shortest-token/lexicographic key unchanged. A\
  \ declared root stays DISCOVERY: it never\n  confers ownership (the cited-rollup,\
  \ <workshop-spec>, remains the authoritative ownership view).\n- Corollary ( §5(1)):\
  \ an **alias-singleton of a known root** is therefore not hidden by the\n  `N>=2`\
  \ threshold — a CITED alias surfaces via the cited-rollup + the alias-aware reopen\n\
  \  (`_reopen_resolved_error` matches `cites:` members), and an UNCITED near-synonym\
  \ surfaces\n  here; `N>=2` stays advisory, never a gate that buries a known-root\
  \ alias.\n\n## Rationale\n\nDemoted to the retrieved tier (SPEC-0007 §5a query-only):\
  \ the window computation + link rule are\nconsulted only when running a triage sweep,\
  \ not before a gated control-point. The anchor\n(`cmd_triage_run`) is honest for\
  \ these rules (audit-pre F2) — the manual Review cadence and v1 lineage\nare NOT\
  \ claimed as code behavior; the cadence stays mandatory, the lineage is provenance\
  \ below.\n\n**Why supersede <workshop-spec> :** <workshop-spec> stated the closed-boundary\
  \ / routed-exactly-once\ncontract but its watermark BASIS (the completion-event\
  \ `ts`) silently broke it for a same-second\ncapture. The boundary basis change\
  \ (`ts` → `window_through`) changes WHICH capture is in-window —\nobservable consumer\
  \ behaviour — so per SPEC-0005 rule 7 it is a normative reshape routed through the\n\
  FSM (new `proposed` spec + `supersedes:`), not an in-place clarification. The window-section\
  \ is the\nonly substantive change; the link rule, batch-run isolation, discovery\
  \ stem-clustering, and queue\nlineage are carried forward verbatim.\n\n**Queue lineage\
  \ (what this REPLACES from v1 — provenance for the per-entry queue model):** the\
  \ V2\nqueue model replaced v1's scattered single-file aggregates with per-entry\
  \ YAML in one directory\n(CHARTER §P5):\n- `yitc-backlog.md` (single-file aggregate)\
  \ → `tasks/*.yaml` (per-entry)\n- `.yitc/index/backlog.yaml` (separate aggregate)\
  \ → derived only, not source\n- `yitc-deferred.md` → parking lot bucket (same `tasks/`\
  \ directory)\n- `yitc-decisions.md` → `decisions/*.yaml` (separate, per-entry)\n\
  - `REVIEW-TASKS.md` → `tasks/*.yaml` created by Review session (same directory)\n\
  One directory (`tasks/`), one format, one parser — CHARTER Principle 5. V1 split\
  \ storage (aggregate\nindex + per-entry workspace) caused 200-tool-call debugging;\
  \ V2 does not repeat it.\n\n## Verification\n\n- **Watermark basis hardened (RED-GREEN):**\
  \ the phrase `Watermark BASIS = ` + `window_through`\n  resolves in THIS spec §Internal;\
  \ a `deviation_captured` emitted in a later second than the\n  completing run's\
  \ max-observed capture is RECOVERED into the next window (RED before the fix on\
  \ the\n  `ts` basis, GREEN after) — probe tests/test_triage.py::{test_same_second_after_complete_not_lost,\n\
  \  test_window_through_recorded_on_complete, test_watermark_backcompat_falls_back_to_ts,\n\
  \  test_no_op_complete_does_not_regress_boundary, test_exact_equal_second_remainder_deferred}.\n\
  - **Per-capture routed-marker — residuals (a)/(b) CLOSED :** the `triage-state`\
  \ saved view\n  (`_view_triage_state` / `views/triage-state.yaml` view family) derives\
  \ per-capture\n  routed-state (ROUTED / genuinely-UNROUTED / BOUNDARY-TIE) from\
  \ `window_through` + `_scan_captures`,\n  NEVER from `kind` presence (the 535/660\
  \ over-read fix). A `kind: null` capture on either side of the\n  boundary classifies\
  \ purely from its ts; the exact-equal-second capture surfaces in BOUNDARY-TIE (not\n\
  \  silently routed). DERIVED verdict only — NO persisted stamp/store/cursor. Discoverable\
  \ in\n  `graph query --type view`; a live `graph query triage-state` emits cli_invoked\
  \ (P8 adoption). Probes\n  tests/test_triage_state_view.py::{test_unrouted_is_true_backlog_not_kind_absent,\n\
  \  test_kind_null_classifies_from_boundary_both_sides, test_boundary_tie_surfaced_not_silently_routed,\n\
  \  test_bootstrap_all_unrouted, test_e2e_cli_emits_cli_invoked_and_catalog_discoverable}.\n\
  - **Fidelity (RED-GREEN):** a substantive phrase (e.g. `The watermark is a **closed\
  \ boundary**` /\n  `yitc-backlog.md (single-file aggregate)`) resolves in THIS spec\
  \ and is ABSENT from QUEUE.md.\n- **Delivery (query-only):** `bin/yitc-v2 graph\
  \ query SPEC-0055` resolves; the QUEUE.md pointer-stub\n  names `SPEC-0055` + lookup\
  \ command. NO floor-trigger.\n- **Honest anchor (audit-pre F2):** `implements:`\
  \ lists ONLY `cmd_triage_run` (the code-backed rule);\n  the manual Review cadence\
  \ remains MANDATORY in QUEUE.md (grep: weekly/monthly bullets still present).\n\
  - **Non-dangling:** non-empty `implements:` ⇒ excluded from `dangling_specs` once\
  \ active.\n- **Supersession (P7, SPEC-0005 rule 4):** `supersedes: <workshop-spec>`;\
  \ on this spec's activation (\n  close) <workshop-spec> flips active→superseded\
  \ atomically. One active lineage ( B6).\n- **Batch-run journal isolation — state-probe:**\
  \ the phrase\n  `emit ALL its run events from its OWN ` + `fold them into ` + `with\
  \ ONE ` + `land` resolves in THIS\n  spec §Internal, AND the **invocation-form**\
  \ phrase `bin/yitc-v2 -C <wt> event` resolves here too.\n  **coherence-probe:**\
  \ the phrase ` single-deviation-capture-from-anywhere reflex — PRESERVED,\n  not\
  \ banned` resolves in §Internal — the from-anywhere reflex is the EXCLUDED case,\
  \ explicitly retained.\n- **Discovery stem-clustering :** `_discovery_stem_clusters`\
  \ groups the 3 uncited\n  `plan-check-on-main` spellings into ONE family (NOT 3\
  \ singletons) and EXCLUDES any fp owned by a\n  case file's canonical/`cites:`;\
  \ `triage run` prints Section **B2** for it. The cited-rollup\n  (`_capture_cluster_counts`,\
  \ E-0010 x15) is unchanged. Probes: tests/test_triage.py::{test_discovery_\n  merges_3_plan_check_spellings_one_family,\
  \ test_discovery_excludes_cited_and_owned_fingerprints,\n  test_cited_rollup_unchanged_alongside_discovery}\
  \ + tests/test_error_verbs.py::test_reopen_on_cited_\n  alias_not_canonical (the\
  \ alias-aware reopen).\n"
