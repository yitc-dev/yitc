id: SPEC-0155
title: Deploy-seam security-producer run — seam execution before the pre-deploy gate,
  single-writer atomic publication, advisory-cache degrade, code-identity binding
status: active
created_at: 2026-07-12 14:16:32+00:00
travels: null
consumed: false
extension: null
