body: |
  ## Scenario

  A consumer runs a governed `deploy`. BEFORE the pre-deploy security gate judges anything, the
  deploy verb itself EXECUTES the project's DECLARED security producer (the SPEC-0154 scaffold /
  the declared runner), so the gate judges a report produced from the code being deployed — not
  whatever vintage the cron last wrote. A deploy can no longer be blocked by findings already
  fixed in the code (the trend-finder stale-block: 13 already-fixed npm HIGHs held two C1
  deploys), nor passed on evidence older than the deploy candidate. Scheduled cadence runs
  continue unchanged; the operator never has to "run the producer by hand to unblock".

  ## Internal

  THE DEPLOY-SEAM PRODUCER-RUN CONTRACT — the per-deploy sibling of the SPEC-0145 cadence concern
  (same `security:` carrier family, distinct surface; the SPEC-0098 cadence-vs-deploy-seam split is
  the placement precedent). Six rules:

  1. **Seam execution — the verb runs the evidence.** The governed `deploy` (SPEC-0094 machinery)
     runs the project's DECLARED producer at the deploy seam, then the pre-deploy gate judges the
     FRESH report. Kernel-side in the deploy verb — the invariant belongs to the verb, never a
     consumer wrapper (prior-art: the C1 pg_dump seam; the Class-S security_probe).
     The producer the seam runs IS the declared `security.audit` runner (SPEC-0145 §6) — no second
     producer identity, no seam-only fork.

  2. **Single-writer, atomic publication (consult req a).** ONE producer identity serves BOTH
     triggers (cron cadence + deploy seam). The run is lock-guarded (concurrent cadence/seam runs
     serialize, never interleave); the run writes to a run-scoped temp location and ONLY a
     COMPLETED report is atomically promoted to latest. A transport/partial failure never
     overwrites the last completed report — a run killed mid-write leaves the prior latest intact.

  3. **Advisory-fetch cache semantics (consult req b).** Cadence runs PREWARM the advisory data;
     a deploy-seam run MAY use a bounded-fresh cache instead of a live advisory fetch.
     **"Bounded-fresh" is SINGLE-SOURCED (no new key):** the cache is bounded-fresh iff its
     advisory data is no older than the project's DECLARED `freshness_sla` on the
     `security.audit` carrier (SPEC-0145 §6 — the SAME window the gate already judges reports
     by; there is no separate cache-freshness value anywhere). An external
     advisory-service outage MUST NOT become fail-closed deploy flakiness: with a bounded-fresh
     cache present the seam run completes normally; with NO cache the PINNED degrade applies — the
     in-scope advisory check records `unavailable` with its exit code (the SPEC-0145 §5
     scope-honesty shape), the report stays COMPLETE and gate-acceptable, the deploy is NOT
     fail-closed by the outage itself, and the unavailability surfaces as a `warning`-severity
     finding (debt-visible via SPEC-0119, never silently dropped).
     **Bound — tool-ABSENCE is NOT this rule's outage class (X-0724).** This rule governs a
     scanner that RAN but could not reach its advisory data; exit 127 (the scanner is not installed at
     all) neither prewarms, reuses, nor degrades here, and is homed in **SPEC-0145 §5 scope honesty**,
     which gives it a BLOCKING `high` finding instead. The two must not be conflated: this rule's
     non-blocking treatment is deliberate for a transient external outage and would be a false-green if
     applied to a missing tool, which yields no coverage at all.

  4. **Code-identity binding (consult req c — the structural kill of vintage ambiguity), via
     EXPLICIT SPEC-0145 delegation — no parallel schema authority.** The report carries the CODE
     IDENTITY it covers: the commit hash of the scanned checkout, joining the existing SPEC-0145
     §5 `dependency_lockfile_hashes`. **The schema authority stays SPEC-0145:** the commit-identity
     field is added to SPEC-0145 §5 by an in-place ADDITIVE amendment (supplemental at cadence —
     gate-IGNORED for cadence completeness, exactly the §5 supplemental-fields lane), and SPEC-0145
     gains ONE delegation line: "the deploy-seam identity-match rule is homed in SPEC-0155". THIS
     spec homes only the SEAM-JUDGEMENT rule: at the deploy-seam judgement the gate PROVES the
     report covers the deploy candidate — a report whose commit/lockfile identity does not match
     the candidate is REFUSED. ADDITIVE by construction: identity fields are producer-additive and
     the identity-match is enforced ONLY at the deploy-seam judgement (where the binding exists) —
     an existing cadence report without them stays acceptable for cadence purposes (no
     fail-closing of live consumers). One field-home (SPEC-0145 §5), one seam-rule-home (here),
     explicitly cross-delegated — never two authorities for either.

  5. **Cadence unchanged (SPEC-0142 / SPEC-0145).** Scheduled runs remain the "is the audit alive"
     liveness answer on their provider-independent system trigger. This contract adds DEPLOY-TIME
     freshness guaranteed by machinery; it changes no cadence value and no freshness-SLA home, and
     touches the SPEC-0145 §5 schema ONLY via the rule-4 additive identity-field amendment +
     delegation line (SPEC-0145 remains the one schema authority).

  6. **Retirement (P1 F3).** The manual "run the producer by hand to unblock a stale-report
     deploy" operator step CEASES to be the unblock path (the workaround class); vintage-
     judged gate acceptance is REPLACED by code-identity-proven acceptance where the binding
     exists.

  7. **The owner-invoked, journaled OUTAGE-RECOVERY OVERRIDE of a rejecting gate (X-0362/X-0363).** A fail-closed gate with NO exception path pushes the operator OUT of
     governance exactly when governance matters most: during a LIVE prod auth outage, a consumer's
     governed deploy was blocked by a BUILD-TIME dep advisory not reachable from prod (a vite
     dev-server GHSA; fix = a 3-major upgrade), the only outs were a pre-authored fingerprint waiver
     or a report edit the TAMPER check refuses — so the restore ran in EMERGENCY mode. The deploy
     verb therefore admits ONE governed exception, and it is **NOT a gate weakening (SPEC-0121)**:
     the default is byte-identical (no flags ⇒ every reject refuses exactly as before), and the
     exception is admissible only under ALL of:
     - **OWNER-INVOKED** — an explicit flag pair on the command line
       (`--security-override-advisory <ID>` ×N + `--security-override-reason <WHY>`). Nothing infers
       it: no config key, no env var, no policy class enables it. It is the security-gate sibling of
       the SPEC-0097 §5 Class-C2 `--owner-approved` escalation (the prior-art shape it extends).
     - **REASON-BEARING** — a non-blank reason is REQUIRED and is journaled verbatim. A HALF-declared
       pair (ids with no reason, a reason with no ids) REFUSES; it never degrades silently to
       "no override".
     - **CLASS-BOUNDED** — admissible ONLY for the SEVERITY-blocking reject class (open critical/high
       findings). EVERY other class — tampered / incomplete / stale / scope-mismatch /
       identity-mismatch / missing / foreign-producer / config — means the EVIDENCE ITSELF is
       untrustworthy or does not cover the deployed code; overriding there deploys BLIND, so it stays
       unconditionally fail-closed. A FAILED PRODUCER (rule 1) is likewise unreachable by the
       override: it refuses before the gate ever runs. The reject class is read from the gate's own
       published verdict (below) — never guessed from an exit code.
     - **TRUTHFUL** — the override MUST NAME every finding the gate blocked on, by EXACT advisory-id
       or fingerprint token (`GHSA-xxxx-xxxx-xxxx` / `CVE-YYYY-NNNN` / the 16-hex fingerprint),
       matched at token boundaries. A free-text token is REFUSED as malformed; an UNNAMED blocking
       finding REFUSES the deploy. So the record can never claim to bypass one advisory while
       actually bypassing three.
     - **JOURNALED** — it emits its own `deploy_security_gate_overridden` event carrying the reason,
       the named advisories, and the GATE's OWN blocking-finding records (the judge's account of the
       bypass, not the operator's claim about it). It NEVER emits `deploy_security_gate_passed`: the
       gate did not pass, and the journal must not say it did.
     - **FREQUENCY-VISIBLE** — every override gets exactly one mandatory reading moment via the
       report-only debt echo (SPEC-0119 rule 14): the bypassed findings are still OPEN in the
       deployed code, and a REPEATING override is the signal that the BLOCKING RULE — not the deploy
       — is what needs to change. An escape hatch nobody reads back is indistinguishable from a gate
       quietly switched off.

     **The verdict channel (what makes the bounds enforceable).** A caller cannot bound what it cannot
     read: an exit code names no class and no findings. So the gate PUBLISHES its verdict as JSON
     (`{ok, reason, detail, blocking[], scope_stale{}, report}` — `scope_stale` added by,
     the SPEC-0145 §5 class-A profile-scope WARN record, populated ONLY on that path and read by
     the same seam for the same reason: the record of what a deploy proceeded over must be the
     GATE's judgement, not the caller's re-derivation) when the caller supplies the
     `SECURITY_GATE_VERDICT_FILE` env seam — the same env-seam idiom the gate already uses for
     `SECURITY_FINDINGS_FILE` / `WAIVERS_FILE` / `SECURITY_DEPLOY_COMMIT`, and PURELY ADDITIVE: with
     the env absent nothing is written and every exit code, message and judgement is byte-identical
     (cadence/CI callers are untouched). Fail-closed at the READER: an absent/unparseable verdict, a
     non-`blocking` class, or a `blocking` verdict naming no findings all mean "no override possible"
     and REFUSE — so a failed write can only ever make the deploy STRICTER, never laxer.

  ## Parameters

  None consumed. The advisory-cache freshness bound is NOT a new value — it IS the project's
  declared `freshness_sla` (`security.audit` carrier, single-sourced in SPEC-0145 §6; rule 3).
  The producer lock/timeout values are carrier/env config (SPEC-0093 family), not spec-embedded
  scalars.

  ## Rationale

  X-0328 (trend-finder, kind=task, owner-authorized 2026-07-12; requester-side external consult
  YELLOW — requirements a/b/c absorbed as rules 2/3/4). Real incidents: — all frontend
  dev-dep advisories fixed in the lockfile while the cadence-old report kept listing 13
  already-fixed npm HIGHs, TWO C1 deploys blocked, unblocked only by a MANUAL producer run
  (dep_vulns 23->1 gate PASS); same-day mirror — deploy outcomes swung on report vintage during
  the requester's migration. Prior-art reused (CHARTER §P1 F1): the verb-runs-the-evidence
  deploy machinery (SPEC-0094); the SPEC-0154 core+hook producer (the thing the
  seam runs); the SPEC-0098 per-deploy-sibling placement precedent. Kernel-side gate-specs audit
  YELLOW (2026-07-12): M1 absorbed as the rule-3 pinned no-cache degrade; M2 absorbed as this
  spec's placement (one new sibling SEAM-RULE spec). Plan-check RED (pass 1, 2026-07-12) absorbed:
  travels → kernel default (RED-1); the identity FIELD homes in SPEC-0145 §5 via additive
  amendment + explicit delegation line, this spec keeps only the seam-judgement rule (RED-2);
  implements anchors + activation-owner carry the code enforcement (YELLOW-3); the cache bound
  single-sources to the declared `freshness_sla` (YELLOW-4).

  ## Verification

  - **Stale-block killed (differential):** fixture consumer where the code fixed a finding after
    the last cadence report — governed deploy runs the producer, the fresh report drops the
    finding, the gate PASSES (pre-change: the stale report blocks).
  - **Fresh regression caught (differential):** a regression introduced after the cadence report —
    the seam run surfaces it, the gate REFUSES (pre-change: the stale report passes it).
  - **Atomicity (differential):** a producer run killed mid-write leaves the prior completed
    report as latest (the partial overwrite fails the test).
  - **Code identity (differential):** the gate refuses a report whose commit/lockfile hashes do
    not match the deploy candidate.
  - **Override (rule 7 — differential):** the SAME blocking fixture deploys WITH the owner
    flags and REFUSES without them (the flags, not the fixture, carry the pass — the default gate is
    unweakened); the override event carries the reason + the named advisory + the GATE's own blocking
    records, and no `deploy_security_gate_passed` is emitted. BOUNDS, each differential: a STALE report
    + the flags still REFUSES (class bound); naming ONE of two blocking findings REFUSES and names the
    uncovered one, as does a bogus id, while a free-text id refuses as malformed (coverage bound); an
    override on a PASSING gate journals nothing (it grants nothing by existing). The verdict-file seam
    is additive — with the env absent the gate writes nothing and its exit code is unchanged.
  - **Advisory outage:** unreachable advisory service + a cache no older than the declared
    `freshness_sla` (the rule-3 single source — the test reads THAT carrier value, no private
    threshold) → seam run completes; a cache OLDER than the SLA counts as no-cache; no cache →
    the rule-3 degrade: check recorded `unavailable`, report complete + accepted, deploy not
    fail-closed, `warning` finding present (differential: a silently-absent check or a
    fail-closed refuse fails the test).
  - **Real-data soak:** ≥1 real consumer deploy (trend-finder is the live case) through the
    seam-run path, 0 stale-evidence blocks, 0 gate regressions.

