  - before-project-dimension-judgement # AI-delivery axis (orthogonal to `implements:` code-link): where consumer project-context lives — the placement bundle (SPEC-0073/0090/0093)
init_concern: # (X-0313) — activation baseline-concern declaration (SPEC-0030
                                 # schema; DERIVED into graph/activation-checklist.md by SPEC-0096). The
                                 # provider-neutral operating-context home is a consumer baseline every
                                 # project inherits regardless of stack/archetype → tier: universal. The
                                 # ANSWER is a filled DOC (the neutral home), not a yitc-ops.yaml carrier
                                 # section — same doc-answer shape as SPEC-0100, so NO `concern:` block.
  init_question: >-
    Is this project's substantive operating-context (product profile, module map, integration
    constraints, safety bans, PII policy) FILLED into the ONE declared provider-neutral home the thin
    vendor adapter points at — product `CHARTER.md` if present, else the born project `AGENTS.md` (Rule
    1) — rather than left as the born `<fill in …>` stub or accreted into the vendor `<vendor-adapter>.md`? Fill
    the neutral home, or waive with a named explicit waiver (never a silent empty stub).
  waiver: >-
    A project with genuinely no substantive operating-context to record (a trivial repo with no safety
    bans / integrations / PII surface) may bare-waive — but as a NAMED explicit waiver (reason), never a
    silent unanswered `<fill in>` stub. The waiver records that the neutral home is intentionally empty;
    it never licenses operating-context to sit in the vendor adapter (Rule 1/2).
  evidence: >-
    the ONE declared provider-neutral home — product `CHARTER.md`, else the born project `AGENTS.md`
    (Rule 1 order) — carries a filled `## Product operating-context` replacing the born `<fill in …>`
    placeholder (the VP2 neutral-home probe), reached at `-C init` via the SPEC-0096 rule-8 born-waiver
    sweep; or a named waiver recorded for the concern. The thin vendor adapter (`<vendor-adapter>.md`) only POINTS
    here, never carries it.
  tier: universal
