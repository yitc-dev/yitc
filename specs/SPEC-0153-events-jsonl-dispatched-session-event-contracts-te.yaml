body: |
  ## Scenario

  Two SPEC-0025 event-schema sections, re-homed VERBATIM: (1) **§Terminal-marker contract** — the single
  terminal marker every DISPATCHED session ends on (`task_closed` | `bg_dispatch_halted`); and (2)
  **§Per-dispatch correlation (every event)** — the per-dispatch correlation fields that segment events
  by their launch, PLUS the per-dispatch / observability event contracts that section documents in-source
  (`read_gate_refused`, `external_action`, the error/friction protocol pointer, and the parser-captured
  chat-class events). NOTHING is moved beyond those two SPEC-0025 sections — the observability events live
  INSIDE §Per-dispatch correlation in the source. SPLIT VERBATIM under the SPEC-0120 one-bounded-read
  ceiling; the parent SPEC-0025 keeps the universal schema, the required event types, the
  normalized vocabulary, and the event-type catalog extension, and points here for these two sections.

  ## Internal

  ### Terminal-marker contract (dispatched sessions)
  A dispatched session ends in exactly one **terminal event** — `task_closed` (done) OR
  `bg_dispatch_halted` (halt). So that ONE scoped query finds the terminal regardless of which kind, both
  obey one keying + one location rule:
  - **KEY (always):** a terminal event MUST carry a **top-level `task_id`** (the universal envelope field,
    set via `event --task T-XXXX` / written by `task close`), **AND** the **dispatch tag in `data.dispatch`**.
    Never key a terminal ONLY by `data.task` — a reader scoped to top-level `task_id` then gets a FALSE
    NEGATIVE (the run-9 incident: emitted `bg_dispatch_halted` with only `data.task`, while
    carried top-level `task_id`; a `task_id`-scoped reader missed the halt). The combined key lets
    ONE query select a terminal by `task_id` AND filter the whole dispatch by `data.dispatch`.
  - **LOCATION (one canonical write path for BOTH kinds):** the dispatched sessions OWN **worktree
    journal** — where all its lifecycle events go — folded to main at `land`. A **self-halt before land**
    (the worker never lands) MUST be emitted FROM the worktree so it lands in the worktree journal, NOT the
    main checkout: `( cd <worktree> && bin/yitc-v2 event bg_dispatch_halted --task T-XXXX --data {...})`
    or `bin/yitc-v2 -C <worktree> event …`. Writing a halt to the main checkout journal is the run-9 defect —
    the per-worktree sweeper reads each worktrees own journal and a main-only halt reads as a false
    `SILENT_STOP`. (`task_closed` is already worktree-resident — `task close` runs in the worktree.)

  This contract closes the `data.task`-vs-`task_id` false-negative AND the halt-location variance with one
  rule. Append-only / P5-safe : adding the `bg_dispatch_halted` type + this keying rule changes no
  existing event; consumers ignore unknown keys.

  **Reader-recognized task-status terminal.** Beyond the two EMITTED dispatch markers
  above, the dispatch-status READER (`journal query --dispatch-status`) ALSO treats a **task-status
  terminal reached WITHOUT a dispatch marker — `task_wont_do`** (a worker correctly declining a
  superseded / self-unsatisfiable task via `task update --status wont-do`, which carries a top-level
  `task_id`) — as a dispatch TERMINAL, labelled `TERMINAL(wont-do)`. Rationale: the dispatch is over,
  so a polling controller must not read a FINISHED dispatch as a live worker, and `quiescent` reflects
  terminal (incident: read `working`, 2026-06-08). This is **additive and reader-only**: it adds
  NO new emitted marker and changes nothing an emitter must DO — the two-marker emission contract above
  is unchanged. (Code: `DISPATCH_TERMINAL_TYPES` / `DISPATCH_TERMINAL_DETAIL` in the reader.)

  **Stale terminal does not mask a live worker (the converse of).** When the
  worktree+main journals are UNIONED, an OLDER terminal marker from a SUPERSEDED/dead
  worker must NOT mask the progress of a LIVE worker on the SAME `task_id`. So the reader does NOT
  classify TERMINAL when a LIVE worktree claim is held by a session DIFFERENT from the terminal AND
  the latest event of that claim-session in the unioned chain is non-terminal and newer than the
  terminal — it classifies the live worker instead (working | silent_stop | hang_suspect). A
  SAME-session live claim (a worker that closed its own task) does not un-terminalize. Incident:
   read TERMINAL(halt) from a dead redundant worker while the live worker progressed, poisoning
  a controller monitor. Like this is **reader-only / additive**: no new emitted marker, and
  nothing an emitter must DO changes. (Code: the supersession check in `_classify_dispatch`.)

  **Closed-but-not-landed is NOT Done=Adopted.** A `task_closed` is the done MARKER,
  but CHARTER §P3 (Done=Adopted) is satisfied only when the work is INTEGRATED on main — and `main`
  advances ONLY via `land`, which fast-forwards main then REMOVES the `task/T-XXXX`
  worktree on success. So the dispatch-status READER labels a `task_closed` `TERMINAL(done)` ONLY
  when the task has LANDED — i.e. no live `task/T-XXXX` worktree claim remains; a `task_closed`
  whose worktree is STILL LIVE has not integrated and is labelled a distinct, NON-terminal
  **`closed_pending_land`** state (a worker that closed in-worktree then died before land, or is
  mid-land). A controller must then LAND it — never read it as a finished success (incident:
  `dispatched-worker-died-after-closure-before-land-ffstorm`). `bg_dispatch_halted` (halt) /
  `task_wont_do` (wont-do) are land-INDEPENDENT terminals — a halted / declined worker never
  claimed done — so this carve-out is scoped to `task_closed` ONLY. Like / this is
  **reader-only / additive** (SPEC-0005 rule 7 in-place additive extension): no new emitted marker,
  and nothing an emitter must DO changes — closure (SPEC-0015) still writes `status: done` IN the
  worktree, which is correct under worktree isolation. Quiescence is inapplicable to
  `closed_pending_land` (the recovery is LAND it, not respawn-adopt → `quiescent: null`). (Code:
  the `closed_pending_land` branch in `_classify_dispatch`.)

  ### Per-dispatch correlation (every event)
  The **per-EVENT correlation key** for a dispatched session is the envelope **`session_ref`** — NOT a
  per-event `data.dispatch` stamp. `_append_event` auto-stamps `session_ref` on EVERY event, and a
  dispatched background session is ONE session => ONE `session_ref`, so its WHOLE lifecycle chain is
  already filterable as one unit:
  - **ONE filter** — `bin/yitc-v2 journal query --session <session_ref>` — returns the full ordered chain
    `startup_protocol_completed -> task_picked -> … -> tests_passed -> <terminal>` (terminal =
    `task_closed` | `bg_dispatch_halted`, the §Terminal-marker contract). Order by `ts` (SPEC-0002).
  - **`data.dispatch` is the HUMAN boundary-tag, NOT the per-event key.** It is carried on the BOUNDARY
    events only — the startup proof (`startup_protocol_completed`) and the terminal (`bg_dispatch_halted`
    / `task_closed`) — as a readable label a controller chooses (e.g. `wave-317`). It is the convenience
    handle the §Terminal-marker contract uses to scope a terminal; it is NOT stamped on mid-lifecycle
    events and MUST NOT be — duplicating the correlation key onto every event would be a PARALLEL
    second source of truth alongside `session_ref` (CHARTER §P5 violation; §P1-F2 prefers a view over a
    new per-event field). The run-evidence gap "mid-lifecycle events are not filterable per dispatch" is
    closed by `session_ref`, which was always there.
  - **Why `session_ref` and not a new field:** it already uniquely identifies the dispatched session
    (the correlation unit), is on every event with zero new emission code, and union-merges/dedups under
    the existing SPEC-0002 rules. The terminals `data.dispatch` + `session_ref` together let a reader
    pivot from a known dispatch tag to the whole `session_ref` chain.

  Append-only / P5-safe : this standardizes an EXISTING field as the correlation key; it adds no
  per-event field and changes no existing event.

  **Error/friction protocol pointer.** The full procedure — 5 routine aspect-audits, the
  friction→promote→case-file path, the 4 gap probes, two-opinion-at-promotion — lives in
  `patterns/error-friction-tracking.md` (extends `patterns/verification-protocol.md`); governance in
  `decisions/`. The graph indexes `errors/E-XXXX.yaml` as the 11th node type (GRAPH.md); `graph
  query --type error --recurring` lists N≥2 fingerprints (the promotion threshold).

  **read_gate_refused** ( — the OBSERVABILITY trace of a blocking read-gate /
  stage-guard refusal; emitted before `_die`, so a DENIED work-verb is visible in the journal instead
  of dying silently). ONE umbrella event for ALL blocking refusal KINDS — NO second event name
  (SPEC-0059 §enforcement-split; plan D2). Best-effort + P5-safe: a journal write error never masks the
  refusal (the `_die` runs unconditionally afterward).
  ```jsonc
  {"ts": "...", "type": "read_gate_refused",
   "data": {"verb": "task close", "action": "closure", "kind": "read-check", "stage": "Closure",
            "reason": "no_session_started_anchor | contracts_unfetched",
            "missing": ["SPEC-0015", "SPEC-0038"]}}
  ```
  - `kind` — the LOCKED refusal-category enum (the SPEC-0059 three blocking legs; the discipline lens
    splits the `read_gate_refused` numerator BY this field — SPEC-0059 §enforcement-split, R9):
    - `read-check` — `_require_reads` block: the governing stage-entry contracts were not fetched this
      session (or there is no session anchor). `reason ∈ {no_session_started_anchor, contracts_unfetched}`.
      The SIBLING seed-read floor (`_require_seed_read`, SPEC-0050 §8) emits the SAME `read-check` kind with
      `reason ∈ {no_session_started_anchor, seed_read_unfetched, seed_read_stale_epoch}` (—
      `seed_read_stale_epoch` = a receipt exists but its stamped context epoch predates the current
      `/compact` epoch); `--help` (`_require_help_read`) likewise emits `help_inventory_unfetched`. Additive
      reasons P5-safe.
      `missing` = the unfetched contract spec ids (only on `contracts_unfetched`). `task_id` null (the
      read-gate carries no task id at the refusal moment; the envelope `session_ref` correlates it).
      Reconciled from the interim `kind: "stage"` literal by — historical rows carry
      `"stage"` (append-only), so a kind-aware reader maps the legacy value to `read-check`.
    - `stage-correspondence` — `_require_stage_correspondence` block : a stage work-verb invoked
      at the wrong `current_stage`. `reason: stage_mismatch`; `stage` = the EXPECTED stage,
      `current_stage` = the ACTUAL stage; `task_id` = the task. No `missing`.
    - `verification-exists` — RESERVED (enum-locked here; the emit is build-deferred — its gate, a stage
      work-verb refusing when its required verification artifact is absent, is built downstream).
  - `missing` — the unfetched governing-contract spec ids; `read-check`/`contracts_unfetched` only.
    Additive, consumers ignore unknown keys. Surfaced by `journal query --type read_gate_refused`.

  **external_action** (per SPEC-0116; emitted via the generic `bin/yitc-v2 event` — NO dedicated verb) —
  the FALLBACK capture FLOOR for a SUBSTANTIVE outbound external mutation (a write / side-effect to a
  system OUTSIDE every repo — a design project, a chat service, a third-party write API) that LACKS a
  dedicated capturing verb. Named external interactions that DO have a dedicated verb stay governed by
  THAT verb (deploy → `deploy_completed`, SPEC-0094; `cross` → `cross_requested`, SPEC-0085/0086; the
  shared-store append, SPEC-0084) — this floor covers the un-verbed remainder ONLY, never an escape from
  a covering verb (§Verb-execution discipline holds). READS / trivial calls emit NOTHING. Shape: the
  `deviation_captured` analog — a generic, no-worktree, fire-from-anywhere journal event. Required `data`
  fields: `channel` (HOW — e.g. `mcp:<server>` / `harness-tool:<name>` / `bash:<cmd>`), `target` (WHAT
  external object changed), `action` (WHAT was done), `from` (the durable basis — a task/plan/spec id or
  a journal locator).
  ```jsonc
  {"ts": "...", "type": "external_action", "task_id": "T-XXXX | null",
   "data": {"channel": "mcp:design", "target": "design-project:c95f02ff", "action": "write_files",
            "from": "T-XXXX | <plan-slug> | events.jsonl#ts=<ISO>"}}
  ```

  Other event types emerge organically as needed. No upfront catalog.

  **Parser-captured chat-class events ().** The chat-class events
  `owner_directive` + `instruction_injection` are now **parser-captured** — the adapter reads the
  source session log, materializes into events.jsonl with populated provenance fields (`source_ref`,
  `session_ref`, `agent`). AI manual-emit obligation REMAINS retired (preserved from) but the
  reason updated: the parser captures structurally, not from AI memory. The other retired
  chat-class events — `dissonance_detected`, `failed_attempt`, `ai_reasoning_note` — REMAIN
  manual-emit-optional per the original rationale (the parser does not extract these specifically —
  defer until an incident requires).

  Historical entries remain valid (append-only). Cite materialized journal entries
  (`events.jsonl#source_ref=...`), NOT the raw session log. CLI-emitted events above
  (`audit_pre_completed` / `task_closed` / etc.) are RETAINED — they fire deterministically from
  `bin/yitc-v2`, not from AI memory.

  ## Rationale

  SPEC-0025 grew past the SPEC-0120 §3 must-split ceiling (800 lines / 63000 bytes). Split by stable
  SURFACE/boundary (SPEC-0005 rule 6/7): the two self-contained dispatched-session contracts
  (terminal-marker; per-dispatch correlation) re-home VERBATIM here
  (SPLIT-never-delete, aggregate-neutral). No rule-node of the moved sections was cited anywhere and
  no active doc pointed at these sections, so the split perturbs no anchor ( analysis).

  ## Verification

  - Size: SPEC-0025 back under the SPEC-0120 §3 ceiling (durable_docs metrics; over_ceiling / over_ceiling_bytes
    no longer list it) after the two sections re-home here.
  - Verbatim: the moved body text is byte-identical to the SPEC-0025 pre-split source (no content deleted).
  - Retrieval: `bin/yitc-v2 graph query SPEC-0153` returns the two contracts; SPEC-0025 §Terminal-marker /
    §Per-dispatch pointer stubs name this spec id.

