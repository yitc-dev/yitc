id: SPEC-0052
title: Displacement-retention sweep — fired-unacted trigger check over un-capped surfaces
  + audit-YAML archive
status: active
created_at: 2026-06-07 10:18:27+00:00
consumed: false
implements:
- bin/lib/views.py#_view_displacement_retention
- bin/lib/cli.py#_displacement_retention_sweep
- bin/lib/audit.py#archive_terminal_nontask_audits
body: "## Scenario\n\nWhen the owner launches an inspection, or the weekly Review\
  \ backstop runs, the FIRST\nstep is a displacement-retention sweep. It is not a\
  \ new mechanism — it is a VIEW over the\nper-surface triggers that ALREADY exist\
  \ ( `events.jsonl > 10 MB`; CHARTER handbook hard-cap\n2500 / warn 2000; the `decisions/*-audit-*.yaml`\
  \ accretion). For EACH\nun-capped surface the sweep does not merely MEASURE the\
  \ value — it looks up that surface's governing\ntrigger and reports `fired? acted?`.\
  \ A surface whose governing trigger has been RETIRED is reported\nas a REPORT-ONLY\
  \ measurement instead, with no `fired`/`acted` (rule 2). A trigger that FIRED but\
  \ was never ACTED on is a flagged\naction the launcher must resolve. The sweep also\
  \ drains the acute audit-YAML surface: at/after a\ntask's closure its audit YAMLs\
  \ `git mv` out of active `decisions/` into two in-git archives, so the\nactive corpus\
  \ stays loadable while the provenance stays git-tracked.\n\n## Internal\n\nThis\
  \ spec is a PROCESS spec (SPEC-0005 rule 1 broadened identity). It adds no cron/hook/new\
  \ store —\nit EXTENDS the saved-view family + `cmd_triage_run` (<workshop-spec>)\
  \ + the retirement procedure\n(manual-first). Three rules + one classifier.\n\n\
  ### 1. The fired-unacted invariant (the load-bearing rule)\nFor each un-capped surface\
  \ the sweep MUST do BOTH: (a) MEASURE the current value, AND (b) resolve\nthat surface's\
  \ GOVERNING TRIGGER (the threshold + its home) and emit `fired` (value crossed the\n\
  threshold) + `acted` (a resolving action is on record — a rotation/split/compaction\
  \ decision, an\narchive run, an open follow-up task). `fired AND NOT acted` ⇒ a\
  \ FLAGGED ACTION (never a bare\nnumber). A surface with NO governing trigger is\
  \ reported as `ungoverned` (a coverage gap to file),\nnot silently dropped. This\
  \ closes the exact 2026-06-07 inspection gap: it measured\n`events.jsonl=13.1MB`\
  \ twice but never checked it against the 10 MB trigger, so no finding\nsurfaced\
  \ (fingerprints `inspection-size-count-probes-measure-but-dont-check-governing-threshold-fired-unacted`\n\
  + `journal-events-jsonl-past-d0030-10mb-rotate-trigger-unacted`).\n\n### 2. Surface\
  \ roster (a VIEW, not a redefinition of the triggers)\nThe surfaces + their governing\
  \ triggers are REFERENCES to existing homes — this spec owns the\nfired-unacted\
  \ CHECK, never the threshold values:\n  - `events.jsonl` size vs `> 10 MB` (rotation_policy)\
  \ — **TWO rows since **, because\none figure cannot serve both purposes. (i) A GOVERNED\
  \ row measuring the **LIVE SEGMENT** against\nthe `> 10 MB` trigger and against\
  \ the standing DEFER's `ROTATION_VERDICT_REREVIEW_MB` currency\nbound: the live\
  \ segment is the quantity rotation's own ACTION can move, and the unit the bound\n\
  was calibrated on (SPEC-0190 §Rotation policy's Origin datum is an `ls -l events.jsonl`).\n\
  (ii) A **`report_only: true`** row carrying the ALL-SEGMENT logical aggregate as\
  \ a TRAJECTORY —\nthe same shape as the done-log row below: measured, with `fired`/`acted`/`flagged_action`\n\
  ABSENT, so it can never reach `flagged_actions`. Against the aggregate both the\
  \ trigger and the\nbound are unactionable BY CONSTRUCTION — archive segments are\
  \ append-only history that is never\ndeleted and SPEC-0002 §Violations forbids an\
  \ in-place rewrite — so a verdict row there would be\nthe permanently-lit flag this\
  \ rule already retires twice. SPEC-0190 rule 8 states the same\ncontract from the\
  \ storage side and names the same quantity for the same purpose; this roster\nREFERENCES\
  \ it and never restates the bound (P5).\n  - `tasks/` done-count — **REPORT-ONLY,\
  \ no trigger **. The `> 500` done-log-split gate\n    is RETIRED at its own home:\
  \ QUEUE §Done log carries the dated KEEP-FLAT re-decision (2026-07-17) that the\
  \ `~500`/`~1500` marks are HISTORY and the SOLE trigger is OBSERVED grep or\n  \
  \  tooling friction — the count-gate class SPEC-0031 §Node-volume retired at. This\
  \ roster\n    REFERENCES homes, it never revives a threshold one has withdrawn,\
  \ so the row MEASURES the count\n    and carries NO `fired`/`acted`/`flagged_action`\
  \ (the keys are ABSENT, not False — a False\n    `fired` would still assert a live\
  \ threshold). The retained path is MANUAL: real friction is\n    captured as a deviation,\
  \ never derived from the count. Rule 1 is unweakened —\n    the surface is REPORTED,\
  \ not silently dropped; what is dropped is the verdict it can no longer\n    earn.\
  \ (Before this row read `fired: true, acted: false` permanently — the count only\n\
  \    grows, and its one `acted` disjunct was an open task CITING `QUEUE.md`, i.e.\
  \ an artificially\n    -open sentinel task. A permanently-lit flag on a withdrawn\
  \ trigger costs the OTHER rows their\n    signal.)\n  - handbook aggregate vs CHARTER\
  \ hard-cap `2500` (RED) / warn `2000` (YELLOW) — the LINE axis is the\n    cap's\
  \ stated unit AND the sole gate; a BYTE(est-token) axis is reported alongside REPORT-ONLY\
  \ and\n    never gates (owner declined a token bound, owner_directive 2026-07-10).\n\
  \  - active `decisions/*-audit-*.yaml` count — the acute surface (~152/day growth),\
  \ drained by rule 3.\nAdding/removing a surface is editing the roster, NOT inventing\
  \ a trigger; a new surface's threshold\nmust already be homed elsewhere (or filed\
  \ as `ungoverned`).\n**`acted?` resolver for the non-acute surfaces.** For a surface\
  \ whose remedy is a tracked\ntask, `acted?` is a DURABLE cited-task linkage, NOT\
  \ a keyword match over task title/scope text: an\nopen (non-terminal) task counts\
  \ as the recorded action only when its `cites:` list names the\nsurface's GOVERNING\
  \ ARTIFACT — `events.jsonl`→``, handbook→\n`CHARTER.md` (the `tasks/` done-log→`QUEUE.md`\
  \ linkage is GONE with that row's trigger) (the §9 `cites:` LINK-RULE analog; id-tokens\
  \ resolve via the repo's one cite-id\ngrammar, handbook-home tokens match the file\
  \ or its `#section` anchor). This is the same EXACT-signal\ndiscipline the acute\
  \ audit-YAML surface (rule 3) already uses on disk — the keyword heuristic it\n\
  replaces could false-positive on an unrelated mention ( audit-post F0).\n\n### 3.\
  \ Audit-YAML displacement to two in-git archives (the retention drain)\nThe sweep\
  \ `git mv`s a TERMINAL audit YAML out of active `decisions/` into ONE of two git-tracked\n\
  archives, chosen by the deterministic classifier (rule 4). TWO drain surfaces, by\
  \ how the audit YAML\nis keyed:\n  - **Task-keyed** (`decisions/<T-XXXX>-audit-*.yaml`\
  \ — pre/post/consult): drained at/after that\n    task's CLOSURE (status `done`\
  \ | `wont-do`), and by the backstop sweep over every closed task.\n  - **Non-task-keyed**\
  \ (the plan-slug-keyed gate/consult `<plan-slug>-audit-gate-*` /\n    `<plan-slug>-audit-consult-*`,\
  \ and the free-slug `<slug>-audit-adhoc`): drained by the backstop\n    sweep when\
  \ the TARGET is terminal. The target is read from the audit YAML's own\n    `target_kind`\
  \ / `target_id` fields: an `adhoc`/`ad-hoc` is a standalone one-shot consult with\
  \ no\n    lifecycle ⇒ always terminal; a `plan`/`consult` whose `target_id` resolves\
  \ to `plans/<slug>.md`\n    is terminal iff that plan's `status` is in the plan-terminal\
  \ set (the ONE truth `lib.plan.\n    PLAN_TERMINAL` — `realized` | `partial` | `rejected`\
  \ | `cancelled`, never restated here, P5). A\n    consult on a task id (or any target\
  \ that does not resolve to a terminal plan) is left to the\n    task-keyed surface.\n\
  IN-FLIGHT tasks' audit YAMLs and audits of NON-terminal plans are NEVER moved —\
  \ the audit-loop\nceiling reads them in place by exact path. The move MUST be idempotent:\
  \ a YAML already under an\narchive dir is skipped (re-running the sweep performs\
  \ no double-move). Both archives stay git-tracked\n(provenance for later analysis);\
  \ nothing is deleted ( retire ≠ delete data; the retire\nprocedure forbids deleting\
  \ append-only/done-task history).\n\n**\"Already archived\" is judged by CONTENT,\
  \ never by NAME (additive).** The rule above was\nsilent on a state the drain provably\
  \ reaches: a post-close re-audit (`audit post\n--reaudit-after-close`, or a mode-a\
  \ absorption written after `task close` already archived the\noriginal) writes a\
  \ NEWER record to the ACTIVE `decisions/<id>-audit-<stage>.yaml` path while the\n\
  OLDER one already sits in the archive under that SAME name. Such an active record\
  \ is NOT \"already\nunder an archive dir\" and MUST NOT be skipped: reading the\
  \ name collision as a completed move\nstranded 236 files that a `triage sweep` reported\
  \ archiving, all content-divergent from their twin,\nand left this spec's own surface-4\
  \ flag fired-and-unacted PERMANENTLY — a flag no verb could clear,\nat the first\
  \ step of every revizia (the skim-the-flag class). So, for an active record whose\n\
  destination name already exists:\n  - **byte-identical** ⇒ genuinely already archived;\
  \ the redundant ACTIVE copy is STILL drained (the\n    archived content is not rewritten).\
  \ Leaving it in `decisions/` would keep the surface lit for\n    that class, which\
  \ is the same defect wearing a different mask.\n  - **divergent** ⇒ the ACTIVE copy\
  \ is the NEWER record. RECONCILE, never discard: the older\n    archived copy is\
  \ preserved beside it, in its own lane, under a name derived from that record's\n\
  \    OWN content (`<stem>.superseded-<hash>.yaml`), and the newer record takes the\
  \ canonical archived\n    name — so the per-path readers named in §Consumer-coherence\
  \ keep resolving to the NEWEST record.\n    Both moves are reported, naming where\
  \ each record went (nothing is deleted —, above).\n  - **either side unreadable**\
  \ ⇒ NOTHING is moved and nothing is reported. This never claims \"already\n    archived\"\
  : the record stays visible on the surface instead of being mis-handled silently.\n\
  Idempotency is unchanged and in fact stronger — every moving branch leaves no active\
  \ file behind, so\na second consecutive run has nothing to move.\n\n### 4. The routine/escalation\
  \ classifier (deterministic, EXACT total function)\nEach audit YAML routes by a\
  \ pure total function of its own saved fields — no judgement, no network,\nevery\
  \ case covered:\n  - `decisions/archive/audit-escalation/` iff ANY of: `verdict`\
  \ in {RED, ABORT} | `passes >= 2` |\n    `target_kind` in {adhoc, consult} | `owner_reset`\
  \ truthy | `tooling_absence_abort` truthy.\n  - `decisions/archive/audit-routine/`\
  \ OTHERWISE — i.e. a GREEN/YELLOW verdict with `passes` in\n    {absent, 0, 1} and\
  \ none of the escalation markers. The zero-pass / absent-`passes` case is\n    ROUTINE\
  \ (it is a clean low-pass artifact); only `passes >= 2` escalates. ABORT is escalation\
  \ (a\n    blocked stage, not a clean close). A malformed/unparseable YAML routes\
  \ to escalation (fail-safe —\n    keep the suspect artifact in the inspected lane).\n\
  A task with a MIXED set (e.g. routine pre + escalation post) routes EACH file by\
  \ its OWN verdict, so\nthe escalation archive captures every escalation artifact\
  \ while routine clean ones drain separately.\n\n### Consumer-coherence requirement\
  \ (P5 — the migration that travels with the move)\nMoving the files relocates a\
  \ path every reader assumed at `decisions/<id>-audit-*.yaml`. The same\nchange MUST\
  \ keep every consumer correct: the chronology git-diff pathspec exclusion (`_DIFF_EXCL`)\n\
  ALSO excludes the archive subtree; the per-path audit readers (`_count_audit_passes`\
  \ /\n`_prior_audit_record` and the audit-pre/post existence gates) fall back to\
  \ the archive paths so a\nre-audit of an archived task still finds its prior record;\
  \ the SPEC-0001 self-test scope is\nunchanged (audits are always WRITTEN to `decisions/`,\
  \ archived only after closure); the plan-audit\nnamespace guard (`_reject_id_shaped_plan_slug`)\
  \ note covers the archive subtree. The graph (post\n) holds no audit nodes, and\
  \ the `external_audit_completed` journal event remains the durable\nrecord — neither\
  \ needs migration.\n\n## Parameters\n\nNone consumed. Governing thresholds (10 MB\
  \ / 500 / 2500 / 2000) live in / QUEUE / CHARTER —\nreferenced, never duplicated\
  \ or `consumed:` here (SPEC-0005 §Parameters discipline).\n\n## Rationale\n\nAnti-complexity\
  \ (CHARTER §P1, 4 filters, written down):\n(1) Existing analog — the `views/` saved-lens\
  \ family (`_run_view`), `cmd_triage_run`\n    (<workshop-spec>), and the retirement\
  \ procedure. EXTENDED, not paralleled.\n(2) New entity or new view — a VIEW: a view-lens\
  \ + a triage sub-routine; no new store/format/parser.\n(3) What gets removed — the\
  \ ~1001-strong active `decisions/*-audit-*.yaml` accretion drains to\n    archives;\
  \ the trend-report MEASURE-but-not-CHECK gap is closed by the fired-unacted invariant.\n\
  (4) Real incident — the 2026-06-07 inspection measured `events.jsonl=13.1MB` twice\
  \ yet never checked\n    it against the 10 MB trigger → no finding (the two fingerprints\
  \ in rule 1).\nPrior-art: log-rotation / retention tooling everywhere checks a measured\
  \ value against a configured\nthreshold and acts; the gap here was a measure step\
  \ with no governing-threshold check. Manual-first\n (the sweep is a verb the launcher/Review\
  \ runs, not a cron) until the steps repeat.\n\n## Verification\n\n- **VP1 (state-probe):**\
  \ this `proposed` spec exists and `graph query SPEC-0052` resolves it,\n  defining\
  \ the sweep, the two archive dirs, the fired-unacted invariant, and the deterministic\n\
  \  routine/escalation classifier (rule 4).\n- **VP2 (fired-unacted behavior-probe):**\
  \ `graph query displacement-retention` reports, for each\n  surface, BOTH the measured\
  \ value AND its trigger's `fired`/`acted` flags; a surface past its\n  threshold\
  \ with no recorded action shows as a FLAGGED action (RED-GREEN: a synthetic over-threshold\n\
  \  surface flags; an under-threshold one does not).\n- **VP3 (archive behavior-probe):**\
  \ running the sweep moves closed-task audit YAMLs AND terminal\n  adhoc/gate/consult\
  \ YAMLs into the two archives, the active `decisions/*audit*.yaml` count\n  drops\
  \ materially, and a re-run is idempotent (no double-move); in-flight tasks' audits\
  \ and audits of\n  NON-terminal plans stay in `decisions/`.\n- **VP4 (consumer coherence-probe):**\
  \ the chronology pathspec excludes the archive subtree, the\n  per-path readers\
  \ fall back to the archive paths, and the full test suite stays green (no consumer\n\
  \  breaks) — grep-checkable + `tests/test_displacement_retention.py`.\n- **VP5 (one\
  \ home, P5):** the thresholds are referenced from / QUEUE / CHARTER, never\n  restated\
  \ here; this spec owns only the fired-unacted CHECK + the archive drain.\n"
