body: '### Post-close reaudit exit — a done-but-UNLANDED task IS admitted (the circle)


  **The canonical exit for a done-but-UNLANDED task that needs a pass past the ceiling
  is the

  DECISION route, not park+redo (amended, SPEC-0204 rule 6).** A task on the sanctioned

  `--reaudit-after-close` post-close rebaseline flow is `status: done` while its closure
  lives

  only on the un-integrated branch. It is NOT stranded: SPEC-0204 rule 3''s admission
  carries its own

  `--reaudit-after-close` arm, so once every residual of the ceiling row carries a
  recorded

  `ceiling_decision` the card takes its ONE bounded `--on-decisions` pass at HEAD.
  The dead-end below is what the exit exists to

  prevent, and is why this section stays.


  **What is NOT the exit: park + rebuild the task elsewhere.** The refusal is self-delivering
  (`consult_status_refusal` — it names the flag). Treat a park+redo here as the

  workaround it is, and capture the deviation if the decision route above was reachable.


  **Boundary — a LANDED `done` has no reopen at all.** This exit is scoped to the
  UNLANDED case

  (closure on the branch, task still `ready` on main). A task whose `done` reached
  main is terminal:

  file a NEW task (LIFECYCLE §Stage 9 "no clean reopen", QUEUE §Prematurely-closed).
  No flag, no

  consult, and no `status:` hand-edit re-opens it.


  ### Worked example — the SPEC-0204 ceiling decision route


  A step-by-step worked example of what happens once the ceiling is reached — the
  Worker halts naming

  its residual fingerprints, the Controller records one `audit decide` per residual,
  and exactly ONE

  `audit pre|post --on-decisions` pass runs on those decisions — lives at

  **`patterns/audit-ceiling-consult-reopen-worked-example.md`** (path kept for link
  stability) — read

  it ON DEMAND at the moment a ceiling is actually reached. It is a NON-NORMATIVE
  illustration: the

  rule home is SPEC-0204, which WINS on any conflict.


  **Plan-target parity — the gate identities.** The ceiling applies IDENTICALLY to
  the

  ceiling-bearing PLAN gates — `draft-specs` (P2, mandatory-blocking), `specs-trial`
  (P3),

  `trial-accepted` (P4), `decomposition-executing` (P5), `finalization` (the aggregate
  `audit post

  --plan`): each `--gate` token reuses its EXISTING gate identity (no new namespace),
  and these five

  tokens are the gate ids every plan-gate verb form takes. What happens AT a plan-gate
  ceiling is

  homed in SPEC-0204 rule 9 (typed decisions, then `plan stage <NEXT> --on-decisions`),
  not here.


  ### Post-ceiling continuations — RETIRED (SPEC-0204 rule 6)


  The routes once described here — consult episodes, the audit-side owner reset, the
  reopen gate, the spent-budget commit bypass and the plan-gate reset — are RETIRED
  and refuse; what happens at the ceiling is homed in SPEC-0204 rule 6.

  '
