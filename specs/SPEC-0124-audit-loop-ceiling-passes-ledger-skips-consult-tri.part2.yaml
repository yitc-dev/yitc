body: "### Post-close reaudit exit — a done-but-UNLANDED task IS admitted (the circle)\n\
  \n**The canonical exit for a done-but-UNLANDED task that needs a pass past the ceiling\
  \ is the\nDECISION route, not park+redo (amended, SPEC-0204 rule 6).** A task on\
  \ the sanctioned\n`--reaudit-after-close` post-close rebaseline flow is `status:\
  \ done` while its closure lives\nonly on the un-integrated branch. It is NOT stranded:\
  \ SPEC-0204 rule 3's admission carries its own\n`--reaudit-after-close` arm, so\
  \ once every residual of the ceiling row carries a recorded\n`ceiling_decision`\
  \ the card takes its ONE bounded `--on-decisions` pass at HEAD. What USED to be\
  \ the\nexit — a HEAD-pinned consult on that target re-opening a spent `--owner-reset`\
  \ —\nis retired with both the consult basis and the reset. The dead-end below is\
  \ what the exit exists to\nprevent, and is why this section stays.\n\n**What is\
  \ NOT the exit: park + rebuild the task elsewhere.** The refusal is self-delivering\
  \ (`consult_status_refusal` — it names the flag). Treat a park+redo here as the\n\
  workaround it is, and capture the deviation if a governed reopen was reachable.\n\
  \n**Boundary — a LANDED `done` has no reopen at all.** This exit is scoped to the\
  \ UNLANDED case\n(closure on the branch, task still `ready` on main). A task whose\
  \ `done` reached main is terminal:\nfile a NEW task (LIFECYCLE §Stage 9 \"no clean\
  \ reopen\", QUEUE §Prematurely-closed). No flag, no\nconsult, and no `status:` hand-edit\
  \ re-opens it.\n\n### Worked example — the SPEC-0204 ceiling decision route\n\n\
  A step-by-step worked example of what happens once the ceiling is reached — the\
  \ Worker halts naming\nits residual fingerprints, the Controller records one `audit\
  \ decide` per residual, and exactly ONE\n`audit pre|post --on-decisions` pass runs\
  \ on those decisions — lives at\n**`patterns/audit-ceiling-consult-reopen-worked-example.md`**\
  \ (path kept for link stability) — read\nit ON DEMAND at the moment a ceiling is\
  \ actually reached. It is a NON-NORMATIVE illustration: the\nrule home is SPEC-0204,\
  \ which WINS on any conflict.\n**Exhaustion-with-late-finding — the COMMIT-side\
  \ owner-reset door (E-0030).** A distinct\nfailure mode (E-0030, DISTINCT from E-0008's\
  \ premature false-block): a LEGITIMATE, non-deferrable\nfinding surfaces AFTER the\
  \ audit-post budget is spent and its fix is NOT YET committed — so the\nin-CLI exits\
  \ are blocked together: `task commit --absorb` REFUSES past the ceiling (the\ncarve-out\
  \ interlock) unless the record it supersedes is the YELLOW-absorbable verdict SPEC-0204\n\
  rule 3 admits, a standalone `task commit` trips the chain-of-custody guard, and\
  \ `task close`\nrequires a non-RED audit-post. The door still admitted for that\
  \ state is an OWNER-AUTHORIZED\n`task commit {tid} --absorb --owner-reset`: it COMMITS\
  \ the late fix past the exhausted ceiling.\nIts sole purpose is to MATERIALIZE a\
  \ committed subject — it is a BOOTSTRAP, never a verdict and\nnever a pass. OWNER-GATED\
  \ (the session passes the flag only on explicit owner authorization) and\njournal-observable\
  \ (the `commit_landed` event carries `owner_reset: true`). FAIL-CLOSED: WITHOUT\n\
  the flag the exhausted-ceiling `--absorb` REFUSAL stands — the ceiling is never\
  \ silently disabled.\nStructurally NON-STACKABLE (NOT a repeatable ceiling bypass):\
  \ the escape commit folds the dirty\naudit-post YAML in (now clean) AND shifts the\
  \ recorded commit, so the hazard the `--absorb`\ncarve-out REQUIRES — a DIRTY audit-post\
  \ pinned to the recorded commit — is dissolved, and a SECOND\nescape is REFUSED\
  \ until a further audit-post pass has re-pinned custody. It widens the COMMIT door\n\
  ONLY: the AUDIT ceiling is untouched.\nCUSTODY RE-PIN (amended): the step this door\
  \ was first paired with — `audit post --commit\n<new>` under the audit-side owner\
  \ reset — no longer exists: SPEC-0204 rule 6 withdrew it and the\nflag refuses.\
  \ A pass on the new commit is admitted ONLY by the SPEC-0204 route: the Controller\
  \ records one `audit decide` per\nresidual, then the ONE bounded `audit post --on-decisions`\
  \ pass runs — on that spec's own terms\n(its rules 3-4 bind each decision to its\
  \ ceiling row and spend it on the pass). This door creates\nno pass of its own:\
  \ where SPEC-0204 admits none, the commit stays un-re-pinned and closure stays\n\
  blocked. The COMMIT-side refusal + its escape are co-homed in SPEC-0015 §\"Audit-stage\
  \ YAMLs\ncommitted BY task close \" (the guard's home) — kept in sync, not duplicated\
  \ (P7).\n\n**Plan-target parity — the gate identities.** The ceiling applies IDENTICALLY\
  \ to the\nceiling-bearing PLAN gates — `draft-specs` (P2, mandatory-blocking), `specs-trial`\
  \ (P3),\n`trial-accepted` (P4), `decomposition-executing` (P5), `finalization` (the\
  \ aggregate `audit post\n--plan`): each `--gate` token reuses its EXISTING gate\
  \ identity (no new namespace), and these five\ntokens are the gate ids every plan-gate\
  \ verb form takes. What happens AT a plan-gate ceiling is\nhomed in SPEC-0204 rule\
  \ 9 (typed decisions, then `plan stage <NEXT> --on-decisions`), not here;\nthe consult-governed\
  \ continuation this paragraph used to describe is history, kept at the end of\n\
  this section.\n\n### Post-ceiling continuations — RETIRED (SPEC-0204 rule 6)\n\n\
  **Every ROUTE described under this heading is HISTORY — none of them is admitted\
  \ today.** These\nparagraphs predate SPEC-0204 and describe the post-ceiling routes\
  \ its rule 6 RETIRED: consult\nepisodes, the consult-governed basis of the audit-side\
  \ owner reset, the `--reopen` gate, the\nspent-budget commit bypass and the plan-gate\
  \ reset — the same retirement this spec's §Audit-loop\nceiling already states («WHAT\
  \ HAPPENS AT THE CEILING — homed in SPEC-0204, not here»). Each\nretired surface\
  \ REFUSES with a pointer to `audit decide` / `--on-decisions`; where a paragraph\n\
  below conflicts with SPEC-0204, SPEC-0204 governs. They are kept as the record of\
  \ what the retired\nroutes were. What is NOT history here: a sentence below that\
  \ names the route which REPLACED a\nretired one states current guidance, and the\
  \ one owner-reset arm that is not retired is the\ncommit-side door stated above\
  \ this heading.\n\n**Consult GOVERNS the granted pass — no weaker-model relitigation\
  \ — RETIRED (SPEC-0204 rule 6).** The re-open\nabove secures the PASS; this secures\
  \ the PASSS VERDICT. When a `--owner-reset` continuation is\nCONSULT-GOVERNED —\
  \ `owner_reset_basis` resolves to `consult:<file>`, i.e. `_consult_basis` already\n\
  verified a FRESH single-survivor GREEN/YELLOW consult matching the CURRENT subject\
  \ (pre =\nplan_fingerprint, post = commit SHA) — the granted pass does NOT re-invoke\
  \ a routine (weaker)\nauditor. The FULL ceiling-convergence consult IS the governing\
  \ adjudication, so the granted pass\nCARRIES the consults verdict VERBATIM as its\
  \ recorded verdict (`consult_governed: true` +\n`owner_reset_basis: consult:<file>`;\
  \ the consult artifact path + verdict + recommendation are\nkept in `notes` for\
  \ a transparent adjudication trail. The structured `findings` field follows the\n\
  carried verdict: a consult-GREEN records `findings: []` (the consult RESOLVED everything),\
  \ a\nconsult-YELLOW records exactly ONE structural residual entry — the surviving\
  \ option carried from the\nconsult — so a carried residual is visible in the canonical\
  \ field, not only in free-form `notes`).\nThis is DETERMINISTIC: a consult-GREEN\
  \ single-survivor records GREEN and can NEVER be defeated by a\nroutine re-RED —\
  \ so the manual hand-edit / verdict override is RETIRED, replaced by this sanctioned\n\
  verb path. SAFETY rests ENTIRELY on the\nexisting freshness/convergence guards already\
  \ proven before this point — a stale / multi-survivor /\nABORT consult never reaches\
  \ `owner_reset_basis: consult:<file>` (it REFUSES → escalate-to-owner,\nunchanged),\
  \ so consult-governs fires ONLY on a fresh single-survivor FULL convergence the\
  \ session\nagreed with. A NON-consult `--owner-reset` (explicit owner-authorized)\
  \ re-invokes the auditor as\nbefore — consult-governs is the consult-basis-only\
  \ path. NB this is the consult-GOVERNS resolution\n(Option b): the FULL-consult\
  \ GREEN single-survivor is the governing verdict at the gate.\nHome of the ceiling\
  \ rule: this section (P5).\n\n**Adopted-plan axis (X-0111) — RETIRED (SPEC-0204\
  \ rule 6) — a consult whose\nrecommendation is to CHANGE the plan GOVERNS the FIRST\
  \ re-audit of the changed plan.** A TASK PRE ceiling-convergence consult can converge\
  \ to a\nsingle survivor whose adoption IS a plan edit (the session sets `implementation_plan`\
  \ to the\nrecommended option's text — the same self-staleness named). Adopting it\
  \ re-fingerprints the\nplan, so the consult's `basis_fingerprint` (pinned to the\
  \ PRE-change plan) no longer matches and the\nconsult-governs carry re-stales —\
  \ the SAME consult that adjudicated \"change the plan as recommended\"\ncould not\
  \ govern the changed plan, forcing a redundant fresh ceiling pass / re-consult (\n\
  re-consult against the already-changed plan asks a now-moot question). RESOLUTION\
  \ (no new mechanism —\none additional recorded field, reuses the consult_governed\
  \ / owner-reset carry): at convergence a PRE\nsingle-survivor consult ALSO records\
  \ `adopted_fingerprint` = `_plan_content_hash(survivor text)` — the\nfingerprint\
  \ the plan WILL hash to once adopted. `_consult_basis` (pre) then treats the consult\
  \ as\nFRESH when the CURRENT plan_fingerprint matches EITHER `basis_fingerprint`\
  \ (the normal pre-change\ncase) OR `adopted_fingerprint` (the post-change case);\
  \ the consult-governs carry binds its recorded\nbasis to that adopted (changed)\
  \ plan. The exact-match still PROVES the session adopted the\nauditor-approved option\
  \ VERBATIM — a paraphrase matches neither fingerprint and falls through to the\n\
  \ stale re-consult path (unchanged). FAIL-CLOSED + BOUND: fires ONCE per adopted\
  \ plan (a further\nedit away from the survivor text matches neither fingerprint\
  \ → stale → re-consult), POST adjudicates a\ncommit SHA not a plan so it is PRE-only,\
  \ and a multi-survivor / non-converged / plan-gate consult\nrecords no `adopted_fingerprint`\
  \ (the field is absent → the extra match is inert). Scope: TASK\n`audit pre` consult-governs\
  \ only (the X-0111 incident surface).\n\n**Exhaustion-with-late-finding — the consult-basis\
  \ arms — RETIRED (SPEC-0204\nrule 6).** The commit-side door above was designed\
  \ as the first step of a consult-governed chain,\nand the rest of that chain is\
  \ retired. The ceiling-convergence consult ABORTed on an uncommitted\nfix because\
  \ it adjudicated a COMMITTED subject (pre=plan_fingerprint, post=commit SHA), so\
  \ the\ndoor existed to give it one. Once committed, the chain ran: `audit consult`\
  \ (the committed diff\nnow contains the fix) → consult-reopen (re-opens one audit-side\
  \ owner reset) → consult-governs\n(carries the fresh single-survivor verdict verbatim)\
  \ → an owner-reset `audit post --commit <new>`\nRE-PINS custody (verdict.commit\
  \ == the new recorded commit). That re-pin was itself\nCONSULT-GOVERNED (a fresh\
  \ single-survivor FULL convergence), so escapes were interleaved with\nconsult-governed\
  \ re-pins, NEVER stacked, and the downstream re-audit pass stayed gated by the\n\
  consult-reopen freshness axis (a fresh single-survivor FULL convergence each cycle).\n\
  \n**The RED leg's spent-budget arm — RETIRED (SPEC-0204 rule 6).** `task commit\n\
  --fix-red --owner-reset` granted a one-pass-wide, owner-authorized, journal-observable\n\
  continuation (marker `owner_reset_commit: true` on `commit_landed`) when an IN-SCOPE\
  \ fix for a RED\naudit-post was green but the ceiling — including the owner-reset\
  \ pass — was spent: without it the\nfix reached no auditor at all, because the ceiling-convergence\
  \ consult judged the COMMITTED diff\nand so re-found the very findings the fix resolved.\
  \ It admitted ONLY a commit carrying AUTHORED\ncontent (so the `--card-repair` shape,\
  \ whose custody is earned by an already-audited ship, was\nrefused there), it was\
  \ exactly one pass wide (a second was refused with or without the flag), and\nit\
  \ widened the COMMIT door ONLY. The arm is gone: once the budget is spent `--fix-red`\
  \ REFUSES with\nor without the flag. The route that replaced it: the in-scope fix\
  \ is committed with plain\n`--fix-red` at the ceiling, the residual is DECIDED (`audit\
  \ decide --disposition fix` naming that\ncommit), and the ONE bounded `--on-decisions`\
  \ pass verifies it.\n\n**Plan-target parity — the consult-governed continuation\
  \ — RETIRED (SPEC-0204\nrule 6).** The ceiling-convergence triage extended to PLAN\
  \ gates. The triage\nabove is stated for a TASK (`--task … --stage pre|post`); it\
  \ applies IDENTICALLY to the\nceiling-bearing PLAN gates — `draft-specs` (P2, mandatory-blocking),\
  \ `specs-trial`\n(P3), `trial-accepted` (P4), `decomposition-executing` (P5), `finalization`\
  \ (the aggregate `audit\npost --plan`): the gates this section already marks \"\
  ceiling applies\", each `--gate` token reusing\nits EXISTING gate identity (no new\
  \ namespace). At a plan-gate ceiling the session formulates options\nand runs `audit\
  \ consult --plan <slug> --gate <id>` (FULL); it REFUSES below the ceiling\n(`prior_passes\
  \ >= 2`, read from the saved plan gate audit YAML) and returns `survivors:` + one\n\
  `recommendation:`, saved to `decisions/<slug>-audit-consult-<gate>.yaml` (the SAME\
  \ consult artifact\nschema as the task path — `target_kind: consult`, keyed by (slug,\
  \ gate); no new schema). A single\nagreed survivor proceeds AUTONOMOUSLY via the\
  \ matching gate verb's `--owner-reset` (`plan stage\n<NEXT> --owner-reset` for P2-P5,\
  \ `audit post --plan --owner-reset` for finalization), consult-GOVERNED\nVERBATIM\
  \ — but a plan consult basis is keyed to BOTH its `--gate <id>` AND its `basis_fingerprint`,\n\
  where the fingerprint REUSES the gate audit's already-RECORDED signature (INV-2:\
  \ `content_hash` for\nthe prose gates, `card_set_fingerprint` for decomposition-executing,\
  \ `corpus_signature` for\nfinalization — no second scheme): `owner_reset_basis:\
  \ consult:<file>` resolves ONLY on an exact\n(gate id, recorded fingerprint) match;\
  \ a consult from a DIFFERENT gate, or a stale fingerprint,\nsettles NOTHING (REFUSE\
  \ → escalate-to-owner). UNLIKE the task path the plan `--owner-reset` is\nCONSULT-GOVERNED\
  \ ONLY — there is no bare owner-authorized single-pass fallback for a plan gate\n\
  (a plan owner-reset without a fresh converged consult REFUSES). The four non-convergence\n\
  owner-escalation conditions and the consult-governs verdict-carry are identical\
  \ to the task path. No\nnew verb, no new event type — `audit consult` gains `--plan`/`--gate`,\
  \ the existing `owner_reset`\ncarrier + `audit_*` / `external_audit_completed` events\
  \ carry the plan case.\n"
