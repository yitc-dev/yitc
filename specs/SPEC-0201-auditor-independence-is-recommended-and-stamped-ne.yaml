id: SPEC-0201
title: 'Auditor independence is recommended and stamped, never a wall: same-provider
  audits are admitted, marked auditor_independence, and reminded against'
status: active
created_at: 2026-09-06 09:27:19+00:00
travels: null
consumed: false
extension: null
