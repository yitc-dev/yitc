id: SPEC-0056
title: Nonconformity triage methodology — analysis-order, root-clustering admission, null-check, four-routes + reopen-FSM, dual-track (currency classifier homed in SPEC-0063)
# `class:` REMOVED — a spec carries both layers as body sections (Scenario + Internal).

status: active
                               # (SPEC-0005 §4 FSM). `active` is the ONLY normative status.

created_at:

consumed: false # code-enforced methodology, not a code-read scalar param.

implements: # code-enforced delivery : the live triage functions ARE this
                               # spec's delivery; the AI does not fetch it before a verb.
  - bin/lib/cli.py#_journal_error_transition
  - bin/lib/error.py#cmd_error_resolve # extracted (was bin/yitc-v2#cmd_error_resolve)
  - bin/lib/triage.py#_declared_root # — the root-clustering delivery (§1 declared-root
  - bin/lib/triage.py#_stem_family_key # family grouping) now lives in triage.py; the spec named
  - bin/lib/triage.py#_declared_root_siblings # only the 2 transition/resolve anchors before.

body: |
  ## Scenario

  When a Review session runs a triage sweep over accumulated `deviation_captured` captures, each capture
  (or root cluster) must be ROUTED to exactly one disposition, classified by a single into-work token,
  and — if it becomes an `errors/E-XXXX` case — moved through a reopen-FSM whose every transition is
  journaled. This is the triage METHODOLOGY: how the route is decided, what "into-work" means, when a
  cluster is a real root vs a lens, and how a case's status reflects reality (filed ≠ fixed). It is
  realised in code (`_journal_error_transition` / `error resolve`; the into-work currency classifier
  `_suggest_route` / `_currency_status` is homed in SPEC-0063, carved out by);
  the AI does not read this spec before a verb — the code enforces it. (The triage-run WINDOW + the
  `cites:` LINK RULE + discovery stem-clustering live in SPEC-0055; capture-as-reflex + the
  `deviation_captured` schema live in AGENTS.md. This spec is the ANALYSIS/CLUSTERING/FSM half; the
  into-work ROUTING/currency classifier is SPEC-0063.)

  ## Internal

  Carried from §5/§6/§7/§8 (the live-rule half; is the historical decision that
  established it — provenance, not the home). The full taxonomy framing (nonconformity = error /
  friction / improvement / coherence / intent≠actual; ONE sink; capture-as-reflex) is in AGENTS.md +
  `patterns/error-friction-tracking.md`; this spec is the clustering + null-check + FSM + dual-track rules (the into-work routing/currency classifier is SPEC-0063).

  ### 1. The triage run's analysis, in order
  (1) **recurrence/reopen (ALIAS-AWARE)** — a recurrence reopens a resolved/waived root when its
      fingerprint is EITHER that case file's canonical `fingerprint:` OR a MEMBER of its `cites:` list
      (the LINK-RULE alias carrier, SPEC-0055), so a respelled-but-CITED recurrence of a known root is
      not silently missed. EXCEPT a DECLARED BY-DESIGN RESIDUAL (§4) — there the recurrence is the
      disposition working, so it SURFACES rather than reopening.
  (2) **the three analyses, THRESHOLDED** — "how to fix" ALWAYS; "already known/fixed?" ALWAYS (cheap);
      "why it occurred" (root-cause) BY THRESHOLD (reopened / high-blast-radius / unclear / systemic),
      using the EXISTING external auditor inside audit-pre for the thresholded subset — not a new role.
  (3) **root-clustering** (§2 below) — two complementary derived views (no new store): the CITED-ROLLUP
      (authoritative count) and the DISCOVERY stem-cluster view (the uncited half — homed in SPEC-0055).
  (4) **"null ≠ clean" data-sufficiency check** (§3 below).
  (4a) **WHO captured it — read the capturer, don't ask for it** (extending). Every
      capture carries a derived `actor`; `triage run`'s Section-A routing window surfaces it
      SUPPRESSED-WHEN-CLEAN — named only when a real PERSON captured the row (`memory.py#is_named_actor`),
      silent for the `ai-agent` default, so the ~1000 impersonal kernel captures add no noise. It is
      READ-ONLY context for the routing judgement (who hit this, and is one class one person's view?):
      it is provenance ONLY — like `captured_via` it never enters the `fingerprint` and is never a
      currency/route input, so recurrence counting is untouched. FIELD DEFINITION + derivation rules
      (never asked for, never caller-supplied, degrades to the default — a record, never a gate): the
      payload-schema home **SPEC-0025 §deviation_captured** — not restated here (P5 one-home).
  (5) **check the ACTIVE QUEUE before promoting — STATUS-AWARELY.** Route per the status-aware into-work
      currency classifier — the owner-status route table, the 5 currency tokens, recurs, and the
      TRULY-NEW remedy-existence sub-check — HOMED in SPEC-0063 (`_suggest_route` / `_currency_status`).
      ALSO flag a stale open case here:
        · case file OPEN | REOPENED, recurring N≥2, with NO owning fix-task → **STALE
          file-or-waive-overdue** — an open root that recurs but never got routed has sat in limbo;
          `triage run` Section B flags it `⚠ STALE file-or-waive-overdue` so the reviewer files a
          fix-task OR waives with a reason. Once a fix is filed the case is `investigating` and no
          longer stale. NOT a gate (observability, CHARTER non-goal #7) — a visible advisory.
  (6) **coverage-both-ways for coherence findings** — spec→code dead anchors via graph build stderr;
      code→spec via the SPEC-0005 admission test, NOT "every file = a spec".

  **SAME-ROOT DEDUPE BEFORE FILING — SCOPED, NOT BLANKET.** Before filing a NEW E-case for a
  fingerprint, check whether it is a RESPELLING of a PROVEN alias family — a confirmed root already
  routed/`linked`. If so, route the new spelling `linked` to that root (add it to the root's `cites:`),
  do NOT open a duplicate. EXPLICITLY NOT a blanket merge: dedupe ONLY a PROVEN alias family, never two
  findings that merely share a failure-CLASS (the CHARTER class is a §2 discovery LENS; the proven-alias
  family is the dedupe unit — collapsing distinct roots because they share a lens is the §2
  over-clustering defect).

  **N≥2 IS ADVISORY, NOT A VISIBILITY GATE ON A KNOWN ROOT.** The N≥2 promotion threshold governs
  whether an UNOWNED fingerprint is a promotion candidate; it does NOT hide a KNOWN root. A known-root
  ALIAS-SINGLETON (a `cites:`-member alias recurs once while its canonical is uncaptured) surfaces under
  the canonical as linked/regressed via the cited-rollup regardless of N. Only a truly UNOWNED fp is
  held to N≥2 before promotion.

  ### 2. Root-clustering — fix the root once
  Cluster fingerprints by shared root and fix the root ONCE; member fingerprints route `linked` to it.
  The CHARTER 20-class tags are a DISCOVERY LENS, NOT a causal ontology — a shared class is a candidate
  bucket to EXAMINE, never "the root" by itself. A real cluster exists only when a single shared cause
  is CONFIRMED (one 5-whys on the bucket); if none emerges, DISBAND the bucket (false roots are
  themselves a defect). Reopen the root only when a new finding hits the same causal hypothesis /
  root-fix surface — NOT merely the same class.

  **ROOT-FIX vs FILED (split-status carrier).** `resolved` attests the root-fix LANDED — so a promoted
  case is `investigating` (fix filed, root not yet fixed), reaching `resolved` only when the landed
  root-fix removes the recurrence. The `prevention:` field names that root-fix; the split-status keeps
  "filed" from masquerading as "fixed" (§4 reopen-FSM).

  **ADMISSION RULE — ONE FINGERPRINT → AT MOST ONE CONFIRMED-CAUSE CLUSTER (CONFIRM-CAUSE-OR-DISBAND).**
  A fingerprint belongs to at most ONE confirmed-cause cluster; a class-file may not silently
  double-claim it. A case file that asserts an UMBRELLA class but carries `cites: None` (rolls up NO
  member fingerprints) AND `rca: None` (no 5-whys confirming a shared cause) is a LENS, not a confirmed
  root → **CONFIRM-CAUSE-OR-DISBAND**: either do the one 5-whys + cite the members it subsumes (making
  it a real cluster), or DISBAND it (a false root is itself a defect — the v1 over-layering pattern).
  This is a TESTABLE predicate (`cites:None + rca:None = unconfirmed`), so over-clustering is caught at
  admission, not after it accretes.

  ### 3. "Null ≠ clean" — data sufficiency
  When any examination finds NO cause, classify the null: **no-problem vs no-data (blind)**. A no-data
  result → a `kind: improvement` capture, `relates_to: blind-spot`, naming the missing instrument.
  Bounded: ONE question per null result, incident-driven, closed by routing (no new state, no infinite
  loop). The "blind-spot map" is a VIEW over those captures — no new store.

  ### 4. Four routes + the reopen-FSM
  Each capture/cluster routes to exactly one of: **event-only · linked · promote-to-fix-task ·
  promote-to-E-XXXX** (improvements → ideas/, incl. adoption gaps + blind-spots).

  **Error reopen-FSM:** `open → investigating → resolved ⇄ reopened`; any → `waived` (ONE status; the
  legacy double status+triage_step is collapsed). The reopen/resolved rate = the symptom-treatment
  metric (read by the inspection meta-loop lens).

  **BY-DESIGN RESIDUAL.** A reopen ASSERTS "fixed badly" — the recurrence contradicts the
  disposition. Some waives claim the opposite: the residual REMAINS, by design, and a downstream guard
  catches it (E-0053 — SPEC-0005 sanctions-and-OBSERVES the spec-edit chokepoint, the land guard
  catches the irreducible slice). For those, `error promote --waive --by-design-residual` records
  `resolution.by_design_residual: true`, and a later capture whose fingerprint matches (canonically or
  by cited alias) SURFACES as `error_residual_recurrence` with the case file left UNWRITTEN, instead of
  flipping it to `reopened`. Scope, exactly: only a case that DECLARES it; the declaration is
  waive-only (a fix_task route claims the recurrence will STOP, so it cannot also call it by-design);
  every other resolved/waived case keeps the §1(1) reopen verbatim, so a genuine regression still
  flips and still surfaces. WHY it is a rule and not a nicety: the flip mutated the corpus mid-capture
  and ABORTed the land of the UNRELATED card that merely obeyed the mandatory capture reflex (2026-08-11). A reflex that is punished is a reflex that quietly stops firing — which is the exact
  failure the capture rule exists to prevent.

  BOTH SURFACES — the CLASSIFIER too, not only the capture path. This rule binds the
  into-work CURRENCY CLASSIFIER exactly as it binds the capture path above: a capture matching a case
  that DECLARES the residual is NOT `REGRESSED` and NOT into-work, and its route must NOT prescribe a
  reopen — it names the declaration and the `error_residual_recurrence` surface instead. Same scope,
  restated because it is what makes the rule safe: keyed on the DECLARATION FIELD and never on a case
  id, and seated BELOW the open-owner branch so genuinely live work still dominates
  (`OWNED-IN-FLIGHT`); every undeclared resolved/waived case keeps its REGRESSED semantics verbatim.
  The classifier itself stays homed in SPEC-0061 (`bin/lib/triage.py#_currency_status`) — this section
  owns the SEMANTICS it must honour, not the code anchor. WHY this is written down rather than left to
  follow from the paragraph above: wired the rule to the capture path ONLY, so the lens went
  on reporting the same recurrence as a regression and prescribing `confirm + reopen the root-fix` —
  the precise act this section forbids. Two governed surfaces then disagreed about the LARGEST
  recurring class in the corpus (E-0053, 67x across 56 respellings, 42 into-work flags) and neither
  yielded, with one of the two `done` owners driving the false REGRESSED being itself — the
  task whose whole content was the ruling that this recurrence must not reopen. A rule wired to one of
  the two surfaces it governs reads as settled while still firing a permanent false action on the
  biggest cluster, which is how a reader learns to ignore the flag — and that costs the signal on
  every OTHER cluster too.

  **SPLIT-STATUS.** `error promote --to-task` sets the case to `investigating`, NOT `resolved`: a
  promote FILES a fix-task; the fix has not LANDED, and `resolved` means a LANDED root-fix removed the
  recurrence. So filing ≠ fixed: the case stays in-flight (`investigating`, route OWNED-IN-FLIGHT) until
  the root-fix lands. `--waive` stays terminal `waived`. The real resolve writer is `error resolve
  E-XXXX` — it flips an in-flight (`investigating`/`reopened`) case to `resolved` ONLY after its
  root-fix landed (refusing a non-in-flight case), records the `prevention:` root-fix, and journals
  `error_resolved`. So `resolved` always attests a landed fix, never a bare hand-flip.

  **NON-FIX_TASK LANDED-ROOT-FIX ROUTE.** The fix-task done-gate above assumes the root-fix
  shipped as a `promote --to-task` fix-task. But a root-fix can LAND via a carrier that is NOT a
  promoted fix-task: an OPEN/never-promoted friction fixed elsewhere (a sibling task's guard), or a
  `deferred_to_plan` case whose fix-PLAN realized. Such a case has no `fix_task` to gate on, so the
  done-gate can never pass and `resolved` is unreachable (the verb-coverage gap). `error resolve
  E-XXXX --root-fix <ref>` closes it: `<ref>` is the EXPLICIT attestation of the landed carrier (a task
  id / plan slug / spec / verb change). It (a) admits `open` in addition to `investigating`/`reopened`
  (a never-promoted case is still `open`); (b) SKIPS the fix_task done-gate (there is no fix-task); and
  (c) REQUIRES `--prevention` naming the landed fix — so `resolved` STILL attests a landed root-fix,
  never a bare hand-flip. It stamps `resolution.root_fix: <ref>` (setting `kind: root_fix_landed` when
  no resolution kind exists; preserving an existing `deferred_to_plan` kind) and journals
  `error_resolved` like the fix_task path. Terminal `resolved`/`waived` stay refused. This is ADDITIVE
  — the ordinary fix_task-gated path (no `--root-fix`) is UNCHANGED (SPEC-0005 in-place amend, not a
  supersede). Do NOT `--waive` a prevented case: waive = accepted-not-prevented; a landed root-fix is
  prevention.

  **OWNER+DUE OPTIONAL FOR SOLO.** `error promote --to-task` does NOT require `--owner` / `--due`
  (QUEUE has no owner/due fields; V2 is solo-author) — they are recorded in `resolution:` only when
  supplied. What prevents the ownerless LIMBO is NOT a forced owner field but the routing + reopen-FSM +
  the §1(5) STALE open-N≥2 file-or-waive-overdue flag.

  **JOURNALED TRANSITIONS.** Every error-FSM status WRITE emits a typed event through ONE canonical
  journaling point (`_journal_error_transition`): `error_<to_status>` (`error_resolved` /
  `error_waived` / `error_reopened` / `error_investigating`). So resolve / waive / reopen each leave a
  journal line and the FSM history is queryable (no more hand-edited-only transitions). The umbrella
  `error_promoted` stays for back-compat; the typed events are additive / P5-safe (consumers ignore
  unknown types) and need no events-catalog rule change (SPEC-0025 is append-only).

  ### 4a. Incident-narrative home — the multi-error arc (one arc = one E-case)
  A single incident sometimes spans a whole ARC — many `deviation_captured` captures across days,
  several fix-tasks, lessons, and specs (boomrocket's 4-day arc: 48 deviations / 27 followups / 9
  lessons vs 1 lifetime E-file). The NARRATIVE of that arc — what happened, in what order, why — has a
  sanctioned home: the **promoted `errors/E-XXXX.yaml` case file's BODY** (its `title` / `rca` /
  `resolution` / `prevention` fields, the reference-first narrative surface an E-case already carries).
  **ONE arc = ONE E-case:** promote the arc to a single case whose canonical `fingerprint:` names the
  arc's root, and LINK its constituents — the member deviation fingerprints, the fix-tasks, the lessons,
  the specs — through the EXISTING `cites:` edge (§2 LINK RULE), never a duplicate case per member. This
  is **NOT a new doc class and NOT a new node type** (the promote-to-E-XXXX route of §4 + the `cites`
  edge already carry it): an unsanctioned `docs/incidents/` class or a per-arc parallel store is exactly
  the v1 accretion CHARTER §P1 forbids. Reference-first still binds (§Anti-pattern "Copying evidence into
  the case file"): the narrative HOME **cites** its arc by anchor, it does not copy evidence in.

  ### 5. CURRENCY_STATUS — homed in SPEC-0063
  The into-work currency classifier — the status-aware route table (§1 step 5), the 5 currency tokens
  {ALREADY-FIXED | OWNED-IN-FLIGHT | REGRESSED | TRULY-NEW | ALREADY-BUILT}, INTO-WORK = TRULY-NEW +
  REGRESSED only, recurs semantics, and the remedy-existence 3-state — is HOMED in SPEC-0063
  (`_currency_status` / `_suggest_route`), carved out of this spec by (a stable-surface split,
  SPEC-0005 §7; no behaviour change). SPEC-0061 refines it there (temporal recurs + fuzzy dedup).

  ### 6. Dual-track external verification + reconciliation (threshold-or-owner-invoked)
  After the session performs the §1(5)/§4 ROUTING of a triage window, that routing MAY itself be
  reviewed by an INDEPENDENT external-auditor pass over the SAME window — judging each route
  (event-only / linked / promote / disband) for missed promotes, wrong disbands, un-swept remedies,
  mis-linked roots. This is a four-eyes overlay on the ROUTING, distinct from §1(2)'s thresholded
  root-cause consult (that escalates "why it occurred" for a subset; this reviews the disposition set).

  - **TRIGGER — threshold-or-owner-invoked, NOT every window.** Run the dual-track pass only when the
    window meets the EXISTING §1(2) threshold set (a reopened / high-blast-radius / unclear / systemic
    item is present) OR on explicit owner invocation (incl. occasional spot-checks). A blanket pass over
    every singleton-heavy window is over-engineering (the E-0012 enforcement-maximalism class; cf.
    patterns/error-friction-tracking.md "dual-running the external auditor on every aspect burns quota")
    — the marginal catch-rate does not justify it.
  - **INDEPENDENCE is structural (§P4a).** The pass runs via the EXISTING `audit adhoc` verb, which
    invokes the external auditor — by construction a DIFFERENT provider than the session that performed
    the routing. No new provider-selection flag is added (a flag would be a new mechanism with no
    incident pulling for it, anti-cx F4); independence comes from `audit adhoc`'s standing
    external-auditor binding (bin/audit-config.yaml), not from new prose.
  - **TIER:** routine by default; full only for the thresholded subset OR when the reconciliation itself
    is disputed (bin/audit-config.yaml).
  - **RECONCILIATION (durable, narrowest carrier — no new store).** Reconcile the two conclusion sets:
    agreements stand; each divergence is resolved one of three ways — the session ADOPTS the external
    finding, ESCALATES to the owner, or RECORDS why it holds. The record is a `reconciliation:` block in
    the SAME `audit adhoc` YAML, cross-referencing the window's `triage_run_completed` watermark (window
    bounds + routed count). No new verb / store / parser (P5) — the dual-track is a DISCIPLINE over the
    existing `audit adhoc` verb + the existing watermark, not a mechanism.

  ## Parameters

  None consumed. The reopen-FSM states and the typed transition-event names are the triage functions'
  own constants in `bin/yitc-v2` (single source — the code IS the home). (The route-table statuses, the
  5 currency tokens, and the 3-state remedy verdict are SPEC-0063's constants — homed there.)

  ## Rationale

  This is a DISCIPLINE over existing primitives (one journal, the `cites:` LINK RULE, the E-XXXX
  reopen-FSM): root-clustering fixes causes not leaves (NET de-layering — one root-guard subsumes N
  narrow guards, the opposite of v1 accretion); failure-class tags are a lens, not a verdict (treating
  a class as the root would itself become a layering engine + a reopen-loop); split-status keeps a filed
  fix from masquerading as a shipped one (the "0-events-vs-on-disk" gap). Prior-art: ISO 9001 §10.2
  CAPA / 5-Whys / SRE postmortems are severity/recurrence-triggered, not blanket-every-bug. Provenance:
   (the decision that ratified the model) — the deliberation, rejected alternatives, and
  finalize-evidence stay there as history; this spec carries only the standing rule.

  ## Verification

  - **VP1–VP2 (currency classifier) → MOVED to SPEC-0063** ( surface split): the route-table
    code-enforcement (`_suggest_route` / `_currency_status` tokens; INTO-WORK = TRULY-NEW + REGRESSED)
    and the remedy-existence 3-state verification now live in SPEC-0063 §Verification.
  - **VP3 (CONFIRM-CAUSE-OR-DISBAND):** a case asserting an umbrella class with `cites:None` + `rca:None`
    is flagged unconfirmed (lens, not root) (tests/test_error_verbs.py / test_triage.py).
  - **VP4 (split-status + journaled transitions):** `error promote --to-task` → `investigating` (not
    resolved); `error resolve` flips in-flight → resolved only after a landed fix and emits
    `error_resolved`; every FSM write emits `error_<to_status>` via `_journal_error_transition`
    (tests/test_error_verbs.py).
  - **VP5 (one home, P5):** the CONFIRM-CAUSE / reopen-FSM rule text resolves in THIS spec and is
    ABSENT from the body (which carries only a forward pointer); the currency-classifier surface
    (route-table / currency-token / remedy-existence) is homed ONCE in SPEC-0063 (carved out by),
    NOT duplicated here; `patterns/error-friction-tracking.md` CITES this spec, not, as the
    normative home.
  - **VP6 (non-dangling):** non-empty `implements:` (the transition/resolve pair
    `_journal_error_transition` / `cmd_error_resolve`, plus the root-clustering trio in
    `bin/lib/triage.py` — `_declared_root` / `_stem_family_key` / `_declared_root_siblings`, anchored
    by) ⇒ excluded from `dangling_specs` once active.
  - **VP7 (dual-track §6 is threshold/owner-invoked + independent + reconciled):** the §6 rule names the
    INDEPENDENT external pass run via `audit adhoc`, its threshold-or-owner-invoked TRIGGER (not every
    window), and the durable `reconciliation:` block cross-referencing the `triage_run_completed`
    watermark — and adds NO new verb/store (grep-state on the SPEC-0056 body; the AC2 reconciliation
    record is the live exemplar).
  - **VP8 (§4a incident-narrative home):** §4a names the promoted `errors/E-XXXX.yaml` BODY as the
    multi-error incident-narrative home with the one-arc = one-E-case rule and the `cites`-linkage, and
    adds NO new doc class / node type (grep-state on the SPEC-0056 body; reference-first preserved —
    the narrative cites its arc, never copies evidence in per §Anti-pattern).

