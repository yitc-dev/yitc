body: |
  ## Scenario

  The owner + the primary AI + the external auditor all operate on the owner's machine with the
  owner's ambient credentials (git push auth, deploy creds, cloud CLIs, SSH keys, registry tokens,
  the auditor subscription identity). The single sharpest security question today is NOT a malicious
  collaborator or forged provenance — it is **accidental IRREVERSIBLE disclosure** by the AI (which
  runs AS the owner). A secret written into a durable artifact (the append-only journal, a committed
  doc, a diff, a probe) is **permanent in git history** — "append-only" means "permanently disclosed".
  A secret placed into an external-auditor payload has **left the machine** to a third-party provider
  (provider-side prompt retention). Neither can be recalled. So the owner sees ONE standing rule that
  keeps the irreversible channel clean, with no tooling to operate and nothing to configure.

  ## Internal

  THE SECURITY NOW-RULE (single normative statement; CONSTRAINT-ONLY — adds zero machinery, P1):

  1. **No secrets in durable artifacts.** Keep secrets / credential-bearing material OUT of every
     durable artifact: `events.jsonl` (the append-only journal), committed docs, diffs, and probe
     output / acceptance evidence. The ONLY defense is at the INPUT — a secret in an append-only,
     git-committed surface is permanently disclosed; there is no scrub-after.
  2. **No secrets in external-auditor payloads.** An audit prompt ships repo content to a third-party
     provider. Treat the **external auditor as a data-egress (confidentiality) boundary** — independent
     of its QUALITY value (auditor independence helps correctness, NOT confidentiality). Do not place
     secrets / credential-bearing material into any audit prompt.
  3. **No routine raw secrets in AI context.** Do not routinely pull raw env / config / token files
     (e.g. `.env`, credential files) into the AI's working context. Secrets live only in the owner's
     secrets store; reference them by name, never inline.
  4. **Name the authority model.** The **AI is high-authority + non-sandboxed**: it runs with the
     owner's ambient credentials, and worktree isolation / `land` / path-territory scope-guard are
     workflow-INTEGRITY controls, NOT least-privilege or confidentiality controls — they do not bound
     shell authority, credential use, or data access. The **standing control is human-in-loop** (the
     owner reviewing high-authority / irreversible actions), not a sandbox.

  SCOPE — this is the NOW-layer (single-owner, all content owner-authored). It is CONSTRAINT-ONLY: it
  introduces NO secret-scanner, pre-commit/pre-land gate, or detector. Those are DEFERRED roster slices
  (the cited roster idea §Roster — fail-closed CI gate / gitleaks pre-land BLOCK / TruffleHog
  live-verify), each gated on a real pain signal (P1 F4), NOT built now. Prompt-injection defenses,
  context sanitization, execution sandboxing, and signed/attested artifacts are likewise DEFERRED
  (gated on first untrusted-content project / multi-user), per the roster idea §Honestly DEFERRED.

  ## Rationale

  Today this rule lives ONLY in the non-normative global `<host-home>/<vendor-adapter>.md`, which declares
  read-only provenance — NOT binding for a V2 session. This spec is the V2-BINDING home, so a `/clear`'d
  V2 session holding zero global context still carries the rule. The failure mode (a secret permanently
  in the append-only journal / shipped to a third-party auditor) is IRREVERSIBLE, so codification is
  owner-cue-ready cheap insurance — it needs no incident (the roster idea §Reopen triggers names this
  exact "NOW-layer codification, no incident needed"). Source lifted verbatim from the roster idea
  `yitc-core-security-threat-model-disclosure-first-n` §"The ONE rule to state now" + §"What bites NOW".
  Anti-complexity (P1): reuses the existing spec surface, adds zero machinery (F3 — nothing new to
  operate); the scanner/gate alternatives are the named DEFERRED slices, not part of this constraint.

  ## Verification

  - `bin/yitc-v2 graph query SPEC-0099` exits 0 and prints this rule body.
  - After closes: `status: active` (activation_owner_task carrier) + the `task_closed`
    activation present in `events.jsonl`.
  - P8 adoption: a `cites` edge from the roster idea
    `yitc-core-security-threat-model-disclosure-first-n` to SPEC-0099 present in `graph/index.json`
    (a session reading the roster reaches the rule).
  - No new mechanism: the shipped diff is spec/doc text only — no scanner / hook / pre-land gate /
    detector (verifiable from the diff file-list).

