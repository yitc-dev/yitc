id: SPEC-0099
title: Security NOW-rule — no secrets in durable artifacts or auditor payloads; auditor = data-egress boundary; AI = high-authority non-sandboxed (human-in-loop)
# `class:` REMOVED — a spec carries both layers as body sections (Scenario + Internal).

