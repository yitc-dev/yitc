binding: [query-only]
init_concern: # — activation baseline-concern declaration (SPEC-0030 schema;
                                 # DERIVED into graph/activation-checklist.md by SPEC-0096). The no-secrets
                                 # NOW-rule is a cross-cutting baseline every project inherits regardless of
                                 # stack/archetype (the AI runs AS the owner everywhere) → tier: universal.
  init_question: >-
    Does this project keep secrets / credential-bearing material OUT of every durable artifact
    (the append-only `events.jsonl` journal, committed docs, diffs, probe output / acceptance
    evidence) AND out of external-auditor payloads? Acknowledge the no-secrets-in-durable-artifacts
    NOW-rule (input-side discipline — the irreversible channel stays clean), or waive.
  waiver: # near-non-waivable — a universal constraint, not a project capability
    >-
    The core (no secrets in durable artifacts / auditor payloads) is universal and effectively
    non-waivable — a project with zero credential-bearing material still inherits the input-side
    discipline at no cost. A waiver may only NARROW a peripheral scope with a reason (e.g. "no
    external-auditor use, so the data-egress clause is moot"); it never licenses a secret into a
    durable artifact.
  evidence: >-
    the standing NOW-rule itself (SPEC-0099) reachable via the `cites` edge from the security roster
    idea — adherence is a CONSTRAINT verified by absence (no secret appears in events.jsonl / committed
    docs / diffs / auditor payloads), never a stored status or emitted event.
  tier: universal
