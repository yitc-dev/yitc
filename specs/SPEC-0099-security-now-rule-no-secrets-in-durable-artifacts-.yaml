id: SPEC-0099
title: Security NOW-rule — no secrets in durable artifacts or auditor payloads; auditor
  = data-egress boundary; AI = high-authority non-sandboxed (human-in-loop)
status: active
created_at: 2026-06-22 11:38:47+00:00
travels: null
consumed: false
implements: []
body: "## Scenario\n\nThe owner + the primary AI + the external auditor all operate\
  \ on the owner's machine with the\nowner's ambient credentials (git push auth, deploy\
  \ creds, cloud CLIs, SSH keys, registry tokens,\nthe auditor subscription identity).\
  \ The single sharpest security question today is NOT a malicious\ncollaborator or\
  \ forged provenance — it is **accidental IRREVERSIBLE disclosure** by the AI (which\n\
  runs AS the owner). A secret written into a durable artifact (the append-only journal,\
  \ a committed\ndoc, a diff, a probe) is **permanent in git history** — \"append-only\"\
  \ means \"permanently disclosed\".\nA secret placed into an external-auditor payload\
  \ has **left the machine** to a third-party provider\n(provider-side prompt retention).\
  \ Neither can be recalled. So the owner sees ONE standing rule that\nkeeps the irreversible\
  \ channel clean, with no tooling to operate and nothing to configure.\n\n## Internal\n\
  \nTHE SECURITY NOW-RULE (single normative statement; CONSTRAINT-ONLY — adds zero\
  \ machinery, P1):\n\n1. **No secrets in durable artifacts.** Keep secrets / credential-bearing\
  \ material OUT of every\n   durable artifact: `events.jsonl` (the append-only journal),\
  \ committed docs, diffs, and probe\n   output / acceptance evidence. The ONLY defense\
  \ is at the INPUT — a secret in an append-only,\n   git-committed surface is permanently\
  \ disclosed; there is no scrub-after.\n2. **No secrets in external-auditor payloads.**\
  \ An audit prompt ships repo content to a third-party\n   provider. Treat the **external\
  \ auditor as a data-egress (confidentiality) boundary** — independent\n   of its\
  \ QUALITY value (auditor independence helps correctness, NOT confidentiality). Do\
  \ not place\n   secrets / credential-bearing material into any audit prompt.\n3.\
  \ **No routine raw secrets in AI context.** Do not routinely pull raw env / config\
  \ / token files\n   (e.g. `.env`, credential files) into the AI's working context.\
  \ Secrets live only in the owner's\n   secrets store; reference them by name, never\
  \ inline.\n4. **Name the authority model.** The **AI is high-authority + non-sandboxed**:\
  \ it runs with the\n   owner's ambient credentials, and worktree isolation / `land`\
  \ / path-territory scope-guard are\n   workflow-INTEGRITY controls, NOT least-privilege\
  \ or confidentiality controls — they do not bound\n   shell authority, credential\
  \ use, or data access. The **standing control is human-in-loop** (the\n   owner\
  \ reviewing high-authority / irreversible actions), not a sandbox.\n\nSCOPE — this\
  \ is the NOW-layer (single-owner, all content owner-authored). It is CONSTRAINT-ONLY:\
  \ it\nintroduces NO secret-scanner, pre-commit/pre-land gate, or detector. Those\
  \ are DEFERRED roster slices\n(the cited roster idea §Roster — fail-closed CI gate\
  \ / gitleaks pre-land BLOCK / TruffleHog\nlive-verify), each gated on a real pain\
  \ signal (P1 F4), NOT built now. Prompt-injection defenses,\ncontext sanitization,\
  \ execution sandboxing, and signed/attested artifacts are likewise DEFERRED\n(gated\
  \ on first untrusted-content project / multi-user), per the roster idea §Honestly\
  \ DEFERRED.\n\n## Rationale\n\nToday this rule lives ONLY in the non-normative global\
  \ `<host-home>/<vendor-adapter>.md`, which declares\nread-only provenance — NOT\
  \ binding for a V2 session. This spec is the V2-BINDING home, so a `/clear`'d\n\
  V2 session holding zero global context still carries the rule. The failure mode\
  \ (a secret permanently\nin the append-only journal / shipped to a third-party auditor)\
  \ is IRREVERSIBLE, so codification is\nowner-cue-ready cheap insurance — it needs\
  \ no incident (the roster idea §Reopen triggers names this\nexact \"NOW-layer codification,\
  \ no incident needed\"). Source lifted verbatim from the roster idea\n`yitc-core-security-threat-model-disclosure-first-n`\
  \ §\"The ONE rule to state now\" + §\"What bites NOW\".\nAnti-complexity (P1): reuses\
  \ the existing spec surface, adds zero machinery (F3 — nothing new to\noperate);\
  \ the scanner/gate alternatives are the named DEFERRED slices, not part of this\
  \ constraint.\n\n## Verification\n\n- `bin/yitc-v2 graph query SPEC-0099` exits\
  \ 0 and prints this rule body.\n- After closes: `status: active` (activation_owner_task\
  \ carrier) + the `task_closed`\n  activation present in `events.jsonl`.\n- P8 adoption:\
  \ a `cites` edge from the roster idea\n  `yitc-core-security-threat-model-disclosure-first-n`\
  \ to SPEC-0099 present in `graph/index.json`\n  (a session reading the roster reaches\
  \ the rule).\n- No new mechanism: the shipped diff is spec/doc text only — no scanner\
  \ / hook / pre-land gate /\n  detector (verifiable from the diff file-list).\n"
