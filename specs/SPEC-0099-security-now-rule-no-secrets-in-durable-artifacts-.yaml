init_concern:
  init_question: Does this project keep secrets / credential-bearing material OUT
    of every durable artifact (the append-only `events.jsonl` journal, committed docs,
    diffs, probe output / acceptance evidence) AND out of external-auditor payloads?
    Acknowledge the no-secrets-in-durable-artifacts NOW-rule (input-side discipline
    — the irreversible channel stays clean), or waive.
  waiver: The core (no secrets in durable artifacts / auditor payloads) is universal
    and effectively non-waivable — a project with zero credential-bearing material
    still inherits the input-side discipline at no cost. A waiver may only NARROW
    a peripheral scope with a reason (e.g. "no external-auditor use, so the data-egress
    clause is moot"); it never licenses a secret into a durable artifact.
  evidence: the standing NOW-rule itself (SPEC-0099) reachable via the `cites` edge
    from the security roster idea — adherence is a CONSTRAINT verified by absence
    (no secret appears in events.jsonl / committed docs / diffs / auditor payloads),
    never a stored status or emitted event.
  recommended: Acknowledge the rule. Keep secrets in `~/.secrets/<project>.env` with
    `chmod 600`, OUTSIDE the repository, and load them at runtime; never paste one
    into the journal, committed docs, diffs, probe output or an external-auditor prompt.
  record_at: 'Nothing is written — this rule is followed, not declared: it is checked
    by the absence of secrets from `events.jsonl`, committed docs, diffs and auditor
    prompts.'
  tier: universal
