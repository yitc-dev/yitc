id: SPEC-0092
title: Kernel-prefixed spec retrieval — graph query --kernel resolves the KERNEL spec
  under -C when a consumer owns the same id
status: active
created_at: 2026-06-20 05:09:40+00:00
travels: null
consumed: false
implements:
