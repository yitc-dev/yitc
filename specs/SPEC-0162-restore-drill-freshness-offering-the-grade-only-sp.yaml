id: SPEC-0162
title: Restore-drill freshness offering — the grade-only SPEC-0110 backup restore-drill
  capability as a first-class adoptable catalog extension
status: active
created_at: 2026-07-16 22:15:36+00:00
travels: kernel
consumed: false
extension: adoptable
implements:
- dev-utilities/reference-restore-drill-freshness-adapter.py#grade_restore_drill_freshness
- dev-utilities/reference-restore-drill-freshness-adapter.py#main
body: "## Scenario\n\nA project that runs a periodic **backup restore-drill** (a real\
  \ operator-owned command it runs to prove\nits backups actually restore) adopts\
  \ a first-class, discoverable capability: the kernel **GRADES the\ndrill's freshness**\
  \ — how long ago the drill last passed — and alerts when it goes stale or was never\n\
  run. The kernel NEVER runs the drill (that stays operator-owned); it only grades\
  \ the\nlast-run age, exactly the SPEC-0110 grade-only shape. The owner/AI discovers\
  \ the offering from the\nsystem itself — `bin/yitc-v2 graph query extensions-catalog`\
  \ lists it with its adopt-path — and a\nproject adopts it by declaring a `freshness:`\
  \ section naming a read-only restore-drill-age adapter and\nciting this spec. A\
  \ shipped **reference adapter template** makes the adopt-path concrete: copy it,\n\
  point it at where the drill records its passes, done.\n\n## Internal\n\nTHE RESTORE-DRILL-FRESHNESS\
  \ OFFERING — a grade-only SPEC-0110 capability packaged as a first-class\nadoptable\
  \ SPEC-0101 catalog extension. It adds NO new kernel grading mechanism (CHARTER\
  \ §P1 F2): the\ngrader is the already-generic, project-neutral SPEC-0110 monitor\
  \ (`bin/lib/nightly.py` `_check_freshness`\n→ `_default_freshness_adapter` → `_run_command_freshness_adapter`),\
  \ which consumes a project-declared\nadapter's NORMALIZED `{fresh|stale|miss}+age`\
  \ per pipeline and embeds no project source format. A\n`restore_drill`-named freshness\
  \ pipeline is just one more DECLARED pipeline that generic grader already\nhandles\
  \ (proven). This spec's deliverable is the **catalog packaging** + the **reference\n\
  adapter template**, not new grading code.\n\n### The offering (what a consumer adopts)\n\
  1. DECLARE a `freshness:` section in `yitc-ops.yaml` with `kind: command` and a\
  \ `command:` that runs a\n   read-only restore-drill-age adapter (SPEC-0110 rule\
  \ 2 — the adapter names the source; thresholds/SLAs\n   are OWNED by the adapter,\
  \ never inlined in the carrier).\n2. The adapter reads WHERE the drill records its\
  \ passes (a journaled `restore_drill_passed` event, a\n   timestamp file, etc.)\
  \ and prints the kernel adapter-return contract to stdout:\n   `{\"pipelines\":\
  \ [{\"name\": \"restore_drill\", \"state\": \"fresh|stale|miss\", \"age_hours\"\
  : <n>, \"detail\": …}], \"error\": null}`.\n3. CITE `SPEC-0162` in the `extensions:`\
  \ block (adopt-and-cite, SPEC-0093 rule 13 / SPEC-0101 rule 4).\nThe kernel SPEC-0110\
  \ monitor then grades the drill's freshness on its existing cadence — GRADE-only,\n\
  independent of the drill's own loop (SPEC-0110 rule 3), the kernel spawning NO drill\
  \ command.\n\n### The reference adapter (the concrete adopt-path artifact)\n`dev-utilities/reference-restore-drill-freshness-adapter.py`\
  \ is a REAL, runnable, READ-ONLY reference\n`kind: command` adapter a consumer copies\
  \ + points at its own pass-record. It reads a journaled\n`restore_drill_passed`\
  \ event's age from an `events.jsonl` and prints the normalized adapter-return JSON;\n\
  it runs NO drill, mutates nothing, and fails closed to a whole-project MISS on an\
  \ unreadable/absent\nsource (SPEC-0110 rule 3). It is the LIVE grade-run subject\
  \ that proves this offering end-to-end.\n\n### Activation is kernel-local, firing\
  \ is per-consumer ( doctrine)\nThis offering is ACTIVE with ZERO consumer preconditions.\
  \ The earlier reading — ship `proposed` and\ndefer activation until the whole registry\
  \ fleet declares-or-waives (a SPEC-0112 completeness gate on\nthe KERNEL) — is RETIRED\
  \ by the amendment (owner directive 2026-07-17): it made the kernel wait\non projects,\
  \ starved adopters until the slowest consumer answered, and asked consumers about\
  \ a spec that\nwas not yet active. Under the per-consumer scheme: activation is\
  \ written kernel-side by `task close` of\nthe activation_owner_task (the guard enforces\
  \ that only the NAMED owner task may\nflip it); a consumer's OWN `yitc-ops.yaml\
  \ extensions:` adopt record switches the feature on for THAT\nconsumer alone, and\
  \ a waive/silence fires nothing for them (the SPEC-0112 fail-closed declare-or-waive\n\
  pressure at that consumer's own `init` is UNCHANGED — it is per-consumer pressure,\
  \ never a kernel gate).\nFleet completeness remains a report-only progress view.\
  \ The kernel's own land verify reads no consumer's\nlive files (fixtures-only).\n\
  \n## Rationale\n\nReal pull: the 2026-07-04 T9 inspection unanimously GRADUATED\
  \ `backup/restore-drill` (grade-only,\nSPEC-0110 shape) and the follow-through was\
  \ to expose it as a first-class ADOPTABLE catalog offering\n(`t9-graduation-followthrough-stale-20260704`).\
  \ already shipped the grade-only grader wiring +\nreconciled the roster doctrine\
  \ (kernel GRADES, operator RUNS); this spec is the catalog-packaging\nfollow-through\
  \ it named. Prior-art: SPEC-0094 (the inaugural adoptable catalog extension) is\
  \ the\nstructural analog for the marker + adopt-path; SPEC-0110 is the reused generic\
  \ grader; SPEC-0112 is the\nper-consumer declare-or-waive pressure at each consumer's\
  \ own init.\n\n## Verification\n\nAdoption probe (CHARTER §P3/§P8 — infra-class),\
  \ both faces of the ONE claim \"restore_drill freshness is\na discoverable, adoptable,\
  \ grade-only offering\":\n- **catalog exposure (AC1 / consumer-read P8):** `bin/yitc-v2\
  \ graph query extensions-catalog` lists\n  SPEC-0162 with `adoptability: adoptable`\
  \ + a non-null `adopt_path` (running the lens emits the\n  `cli_invoked` consumer-read\
  \ evidence). Differential: a spec WITHOUT `extension: adoptable` would not\n  appear\
  \ / would carry a null adopt_path.\n- **live grade run (AC2 / live_trigger P8):**\
  \ the kernel grader (`nightly._check_freshness` via the\n  DEFAULT adapter `_default_freshness_adapter`,\
  \ `kind: command`) SPAWNS the reference adapter as a real\n  subprocess and grades\
  \ a `restore_drill` pipeline to fresh / stale / miss + age, WITHOUT the kernel\n\
  \  running the operator drill ( lock). Differential: change the adapter's recorded\
  \ pass-age and\n  the graded state flips fresh↔stale↔miss — a broken/never-run source\
  \ grades MISS, not fresh.\n- **per-consumer firing lock:** membership in the SPEC-0112\
  \ completeness set is decided MECHANICALLY by\n  `init._engine_catalog_members`\
  \ (status==active filter), and firing for any given consumer is decided\n  SOLELY\
  \ by that consumer's OWN yitc-ops.yaml record — an adopter grades, a waiver/silent\
  \ consumer gets\n  nothing. No consumer state gates the kernel's activation or its\
  \ land (fixtures-only suite).\nTest: `tests/test_t10612_restore_drill_freshness_offering.py`.\n"
