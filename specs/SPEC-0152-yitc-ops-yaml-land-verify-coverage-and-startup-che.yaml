id: SPEC-0152
title: 'yitc-ops.yaml land-verify, coverage and startup-check sections (split from SPEC-0093)'

status: active

created_at:

travels: ~ # kernel class-default (spec new --travels kernel; recorded in spec_filed).
                               # The moved carrier sections travel to a consumer via `-C` — kernel realm.

consumed: false # per-project ops config values only (verify commands / coverage globs /
                               # startup-check commands) — never a kernel-read governance scalar.

extension: ~

implements: # 6 anchors re-homed VERBATIM from SPEC-0093 ( split).
