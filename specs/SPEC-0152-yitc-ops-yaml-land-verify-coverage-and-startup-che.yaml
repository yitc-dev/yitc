body: "## Scenario\n\nThe land-verify, coverage-admission, and startup-check facets\
  \ of a project's `yitc-ops.yaml`\nops-contract carrier (SPEC-0093). In the SAME\
  \ one carrier file a project declares which land-verify\nLAYERS the `land` gate\
  \ runs, which load-bearing code surfaces are reasoned spec-less\n(coverage-admission),\
  \ and its own cheap report-only startup checks. These sections were SPLIT OUT\n\
  of SPEC-0093 (SPEC-0120 §3 aggregate-neutral split) when that carrier grew past\
  \ the one-bounded-read\nceiling; they are the code-backed cluster — their `implements:`\
  \ anchors are the land-verify runner,\nthe coverage / verify-layer WARNs, and the\
  \ startup-check reader.\n\n## Internal\n\nA SPLIT-OUT part of SPEC-0093 (the yitc-ops.yaml\
  \ project ops-contract carrier). It carries FOUR of\nthat carrier's rules VERBATIM\
  \ — the land-verify / coverage / startup-observability surface:\n**rule 5** (verify's\
  \ authoritative home is `verify.layers`), **rule 15** (`coverage:` section),\n**rule\
  \ 16** (`verify:` section — the per-layer land-verify policy), **rule 17** (`startup_checks:`\n\
  section). Every carrier-wide rule these depend on (rule 1 one-file/one-section,\
  \ rule 3\ndeclare-or-waive fail-closed, rule 6 per-section waiver policy, rule 7\
  \ derived-surfaces-only, rule\n18 registry-generated surfaces) stays in SPEC-0093\
  \ and governs unchanged.\n\n**Concern-registry blocks stay on SPEC-0093 (single-SoT\
  \ — NOT re-homed here).** This spec carries the\nmoved rules' PROSE + their `implements:`\
  \ anchors ONLY. The `concern:` / `born:` registry blocks for\n`verify` / `coverage`\
  \ / `startup_checks` REMAIN on the ACTIVE SPEC-0093: born-ops generation is\nactive-gated\
  \ (`_active_concern_blocks` / SPEC-0128), so a concern block on this PROPOSED spec\n\
  would silently vanish from every consumer's born `yitc-ops.yaml`. The generation\
  \ metadata is part of\nthe carrier's `init.py#cmd_init` seed/sweep mechanism (which\
  \ also stays on SPEC-0093), so it belongs\nwith the active carrier — there is exactly\
  \ ONE home for each concern block, never a duplicate.\n\n**Shared rule numbering\
  \ (the split-pair convention).** These rules KEEP their original SPEC-0093\nnumbers,\
  \ so the moved text is byte-identical and every in-code `rule N` ref changes only\
  \ its spec\nid. A bare `rule N` inside a moved rule body whose number is NOT one\
  \ of {5, 15, 16, 17} refers to\nthe SPEC-0093 rule of that number (e.g. rule 16's\
  \ references to \"rule 3 / rule 6 / rule 10\" are\nSPEC-0093 rules). The two specs\
  \ are ONE carrier contract split across two files (SPEC-0120 §3).\n\n### 5. `verify`'s\
  \ authoritative home is the carrier `verify.layers` (the slice-1 single-home, MIGRATED\
  \ — no straddle, P5)\nSlice-1 pinned `verify` to `yitc-verify.yaml`; that single-home\
  \ is now MIGRATED into the carrier\n`verify.layers` section (rule 16) — the AUTHORITATIVE\
  \ source-of-truth for the land-verify layer\nuniverse. This is the migration slice-1\
  \ itself NAMED as a tracked follow-up, realized in-place\non this active carrier\
  \ (the rule-4 extensibility). The POLICY moved here; the EXECUTABLE leg —\n`land`\
  \ reading `verify.layers` (run every declared layer / fail-on-any / per-layer +\
  \ section waiver),\nthe explicit RETIRE of `yitc-verify.yaml` (REFUSED on read at\
  \ land — never silently read), and its\ninit-time MIGRATION (a legacy `yitc-verify.yaml`\
  \ folded into `verify.layers` + removed) — SHIPPED in\n (bin/lib/worktree.py + bin/lib/init.py).\
  \ There are NEVER two LIVE homes: `yitc-verify.yaml` is\nRETIRED and `verify.layers`\
  \ is the SOLE home (gate-specs finding #4 — decided here, not on the fly).\n\n###\
  \ 15. The `coverage:` section schema (rule-4 section-add — the B5 coverage-admission\
  \ carrier;, X-0129)\nThe `coverage:` top-level section is the durable carrier for\
  \ the **B5 coverage-admission** — WHICH\nload-bearing code surfaces are REASONED\
  \ spec-less (a deliberate exclusion) vs a genuine NEW orphan.\nBefore this carrier\
  \ the judgment survived ONLY as a consumer's closed-task free-text (the <project>\n\
  \ ~30-module list) and ROTTED the moment no one re-read it: `graph build` reported\
  \ code↔spec\ncoverage but had no admission REFERENCE, so a NEWLY-added uncovered\
  \ load-bearing module tripped nothing\nand was indistinguishable from a reasoned\
  \ exclusion (X-0129). This rule OWNS the section SHAPE; the\nCHECK that consumes\
  \ it is `bin/lib/graph.py#_coverage_admission_warnings`, called report-only from\n\
  `graph build` (it diffs the project's live load-bearing surfaces against spec coverage\
  \ + the admission\nlist; GRAPH «NOT a validation layer» — it WARNs, never fails\
  \ the build).\n\n**OPT-IN — NOT declare-or-waive, NOT fail-closed (the `extensions:`\
  \ rule-13 model).** An ABSENT\n`coverage:` section, OR a present section with an\
  \ empty/absent `load_bearing:`, means the project does\nNO coverage-admission tracking\
  \ — a legitimate silent-clean default, never an error. A project opts in\nby declaring\
  \ its load-bearing surface universe. The kernel checks the section's SHAPE only\
  \ IF PRESENT.\n\n**DECLARE — two lists:**\n- `load_bearing:` — a list of globs (each\
  \ repo-relative, e.g. `bin/lib/*.py`) enumerating the\n  LOAD-BEARING surface universe\
  \ the check walks. Empty/absent = no tracking (the opt-in default).\n- `admitted:`\
  \ — a list of the REASONED spec-less surfaces that are NOT flagged. Each entry is\
  \ a\n  mapping carrying a non-empty `surface:` (a repo-relative path) AND a non-empty\
  \ `reason:` (why it is\n  a deliberate spec-less exclusion, not an orphan). An admission\
  \ entry missing either key does NOT\n  suppress — an evidence-less admission can\
  \ never silently hide a new orphan (the fail-OPEN safety\n  rule; audit-pre finding\
  \ 0).\n\n**The check (report-only):** for each file matching a `load_bearing:` glob,\
  \ if it is NEITHER\nspec-covered (a key in the graph's `code_to_specs` — an `implements`\
  \ edge from an active spec) NOR\nvalidly `admitted:`, `graph build` emits a report-only\
  \ stderr WARN naming it as a candidate new orphan.\nPURE per-project ops config\
  \ the graph-build check READS — never a kernel-read governance scalar (this\nspec\
  \ stays `consumed: false`).\n\n**WAIVE — the whole concern.** A `coverage:` section\
  \ may instead carry `waiver: { reason: <why> }` (a\nLOOSE bare reason — a project\
  \ that deliberately tracks no coverage admission); the check then skips.\n\n###\
  \ 16. The `verify:` section schema (rule-4 section-add — the per-layer land-verify\
  \ policy; / X-0140)\nThe `verify:` top-level section is the AUTHORITATIVE source-of-truth\
  \ for a project's LAND-VERIFY LAYER\nUNIVERSE — the set of test layers the `land`\
  \ gate runs at the `verify` moment (e.g. a backend pytest\nlayer AND a frontend\
  \ smoke layer). It is the slice-1 `verify` single-home (rule 5) MIGRATED from\n\
  `yitc-verify.yaml` into the carrier. This rule owns the section SHAPE; the EXECUTABLE\
  \ land RUN (run\nevery declared layer, FAIL on any failed layer — a SOLE failed\
  \ layer first gets ONE isolated re-run, §THE ISOLATED RE-RUN below — honor a per-layer\
  \ waiver, migrate/retire\n`yitc-verify.yaml`, per-layer command inherits the F-025\
  \ hermeticity contract) is owned by the\nimplementing land card. DECLARE-OR-WAIVE,\
  \ fail-closed, checked ONLY IF PRESENT (the\nsecurity/ui/tests/host_config backward-compat\
  \ precedent — a pre-`verify:` carrier still passes). The\nkernel checks the STANCE\
  \ + structural SHAPE, never the command's correctness (rule 3). PURE per-project\n\
  ops config the land/build verbs READ — never a kernel-read governance scalar (this\
  \ spec stays\n`consumed: false`).\n\n**The authoritative land-layer SoT (the design\
  \ spine, X-0140 finding #1).** `verify.layers` is the\nauthoritative enumeration\
  \ of the project's land-verify layers — fail-closed cannot catch an OMITTED\nlayer\
  \ without it (a frontend layer silently untested at land is exactly the X-0140 incident).\
  \ A \"known\nlayer\" is defined against this list, and the report-only verify-layer\
  \ coverage WARN below is computed\nagainst it.\n\n**DECLARE — a non-empty `layers:`\
  \ list.** Each entry is a mapping carrying a required non-empty\n`layer:` name (the\
  \ layer id, e.g. `backend` | `frontend`), and is itself PER-LAYER DECLARE-OR-WAIVE,\n\
  fail-closed:\n- DECLARE the layer — a non-empty `command:` string (the hermetic\
  \ verify command `land` runs for that\n  layer; the kernel checks shape, never correctness\
  \ — rule 3); OR\n- WAIVE the layer — a `waiver:` mapping with a non-empty `reason:`\
  \ (a LOOSE per-layer waiver — a layer\n  legitimately without a harness yet).\n\
  A layer entry carrying NEITHER `command:` nor a reasoned `waiver:` is an UNANSWERED\
  \ LAYER → ERROR (the\nper-layer fail-closed floor, rule 3). A layer entry carrying\
  \ BOTH is a contradiction → ERROR (a layer\nis EITHER declared OR waived). An OPTIONAL\
  \ `covers:` (a list of non-empty glob strings, repo-relative —\nshape-only, never\
  \ judged for value) names the code surface that layer verifies; it feeds the\nreport-only\
  \ coverage WARN below and — for the ONE tests-dir case in the §tests-sweep delegation\n\
  sub-rule below — the land RUN's tests-sweep delegation (the RUN otherwise ignores\
  \ it).\n`covers:` SCOPES VERIFICATION AND DECLARES NOTHING ABOUT WHAT THE REPO SHIPS\
  \ — see rule 27\n(`product_source:`), which owns that second question. Until the\
  \ work-batch carrier gate read\nTHIS field as its per-repo product-source set, which\
  \ loaded one field with two opposite incentives\n(narrow is good here, narrow is\
  \ bad there); it no longer reads it at all. Narrow `covers:` freely for\nverify-scoping\
  \ reasons — that is what it is for.\nA DECLARED\nlayer MAY additionally carry an\
  \ OPTIONAL `prep:` dependency-prep sub-field (the §per-layer prep sub-rule\nbelow):\
  \ the land runner runs it INSIDE the fresh worktree BEFORE that layer's `command:`.\n\
  \n**The `health:` sub-field — WHICH declared layers a NIGHTLY health run may execute\
  \ (a SECTION-level\nsub-rule of `verify:`, not a new section; / SPEC-0105 §1a).**\
  \ The OPTIONAL `verify.health:`\nis the project's per-layer OPT-IN for the nightly\
  \ project-verify health check: `layers:` — a\nnon-empty list of names that must\
  \ each match a `verify.layers[].layer` already declared above — or\na `waiver: {reason:}`\
  \ / absence, which are equally legitimate non-adoptions. It DECLARES NO COMMAND\n\
  AND NO LAYER OF ITS OWN: it SELECTS from the layer universe this rule already owns,\
  \ so there is one\nlayer vocabulary and it cannot drift between the land run and\
  \ the health run.\n\nWHY AN OPT-IN AT ALL, since it costs a project a second declaration:\
  \ a health run executes these\ncommands in the project's checkout unattended, on\
  \ the KERNEL's schedule. Running every layer is not\nfree (a container/browser layer\
  \ costs minutes), and the kernel cannot tell a cheap layer from an\nexpensive one\
  \ — `timeout:` is a BUDGET, not a cost — so any kernel-side selection rule would\
  \ be the\nkernel GUESSING which of another project's commands are safe to run in\
  \ that project's territory\n. Naming the layers here is that authorisation, at the\
  \ granularity the cost actually varies\nat. A layer's `prep:` is NOT run by a health\
  \ run (it is a dependency-tree write), so a layer that\ncannot pass without its\
  \ prep must not be named here.\n\nThe kernel checks STANCE + SHAPE only (rule 3),\
  \ and the READER's obligations are SPEC-0105 §1a's:\na name here that matches no\
  \ declared layer is a BROKEN WATCH and alerts (never a silent skip); a\ndeclared\
  \ layer NOT named here is reported as not-run BY NAME, never counted as passing;\
  \ and a\nproject with no opt-in reports that it declares none — never a silent healthy.\n\
  \n**The `combined_candidate_safe:` sub-field — the project's COMBINED-CANDIDATE\
  \ assertion about its own\nlayers (a SECTION-level sub-rule of `verify:`, not a\
  \ new section; / SPEC-0184 rule 2).** The\nOPTIONAL `verify.combined_candidate_safe:`\
  \ is a plain BOOLEAN by which the project asserts that its\nDECLARED layers behave\
  \ correctly when they run over a COMBINED candidate — a tree carrying several\n\
  changes merged together — rather than over one change at a time. Its ONE consumer\
  \ is land-verification\nbatching (SPEC-0184): with `true`, several queued lands\
  \ may be verified TOGETHER in one pass; without\nit, each land is verified alone.\n\
  \n**WHERE THE PROJECT MEETS THIS KEY.** A key the project must assert is worth nothing\
  \ if the\nproject is never told it exists — an opt-in nobody was told about is off\
  \ by IGNORANCE, not by the\ndecision this declare-or-waive shape assumes was made\
  \ (<project>: 154 land batches of ONE, every row\nstamped `engagement: project-authored-verify-undeclared`,\
  \ while the key lived only in kernel source\nand in this body). So `combined_candidate_safe`\
  \ is DECLARED on the `verify` concern's\n`gated_capabilities:` (SPEC-0093), and\
  \ the born `yitc-ops.yaml` template — plus every already-init'd\ncarrier, through\
  \ the idempotent update path — carries it as a COMMENTED key with its meaning. That\n\
  disclosure is generated, never hand-listed, and changes nothing while the key stays\
  \ commented; this\nsection remains the single home of the field's NAME, SHAPE and\
  \ SEMANTICS (SPEC-0128 Rule 2).\n\n**Why the project must assert it and the kernel\
  \ must not infer it.** This section's own rule 3 boundary\napplies at full strength\
  \ here: a layer is an ARBITRARY command (`bash scripts/verify-stack.sh`), so the\n\
  kernel cannot know whether it isolates one change from another — a shared fixture,\
  \ a port, a database,\na build cache shared across the combined tree can all make\
  \ one member's failure indistinguishable from\na peer's. Inferring the property\
  \ would be a guess dressed as a guarantee, so it is DECLARED, in the\ndeclare-or-waive\
  \ shape this carrier already runs on.\n\n**FAIL-CLOSED, and the three failing shapes\
  \ have ONE effect.** Only the BOOLEAN `true` engages\nbatching. ABSENT (the default\
  \ every existing carrier has — backward-compatible by construction),\nexplicitly\
  \ `false`, and MALFORMED (anything that is not the boolean, including the STRING\
  \ `\"true\"`)\nall mean the same thing: batches of one. They are distinguished in\
  \ the reader's DIAGNOSTIC only,\nnever in effect. An unreadable or unparseable carrier\
  \ is likewise not engaged — never widen a gate on\na file that could not be read.\n\
  \n**NOT consulted at all when the verify is KERNEL-AUTHORED.** The engagement predicate\
  \ keys on WHO\nAUTHORED the verify, never on repo identity (SPEC-0184 rule 2): where\
  \ there is no project-authored\n`layers:` list — no carrier, no `verify:` section,\
  \ a section-level `waiver:`, or an empty list — the\nverify in force is the kernel's\
  \ own pinned suite, whose author and whose enforcer are the same party,\nso no declaration\
  \ is read anywhere. This sub-field governs the PROJECT-AUTHORED branch only. Consumed\n\
  by `bin/lib/batch_landing.py#_land_batch_engagement`; this spec stays `consumed:\
  \ false` (pure per-project\nops config the land verb READS, never a kernel-read\
  \ governance scalar — rule 16 head).\n\n**The `independent_layers:` sub-field —\
  \ WHICH declared layers the land runner MAY execute\nCONCURRENTLY (a SECTION-level\
  \ sub-rule of `verify:`, not a new section; / X-1396).** The\nOPTIONAL `verify.independent_layers:`\
  \ is a list of layer names, each matching a `verify.layers[].layer`\ndeclared above,\
  \ by which the project asserts that the named layers share nothing with EACH OTHER\
  \ — no\nhost port, no compose project, no database, no build cache, no write into\
  \ the tree — their `prep:`\nincluded. It is a PAIRWISE claim about the named set,\
  \ so it is a SET on the section, not a boolean on\na layer; it DECLARES NO COMMAND\
  \ AND NO LAYER OF ITS OWN (it SELECTS from the layer universe this rule\nalready\
  \ owns — the `health.layers` shape). Its ONE consumer is the land runner\n(`bin/lib/worktree.py#_consumer_zero_probe_guard`),\
  \ which runs the named layers OVERLAPPED instead of\none after another. Like `combined_candidate_safe`,\
  \ it is DISCLOSED on the `verify` concern's\n`gated_capabilities:` (SPEC-0093) so\
  \ the born stanza names it; this section stays the single home of\nthe field's NAME,\
  \ SHAPE and SEMANTICS (SPEC-0128 Rule 2).\n\n**THE STANDING OF THE DECLARATION —\
  \ the project's own declared risk judgement.** A project\nthat names layers here\
  \ decides, and bears the risk. The declaration is admissible WITHOUT any `owns:`\n\
  mapping; the kernel checks its SHAPE ONLY and does not police independence; and\
  \ a wrong declaration\ncosts only the declaring project's own verify. That standing\
  \ — why it is sound (attributable,\nreviewable, reversible, on the terms of the\
  \ project-declared exemption), that it is the ONE key by\nwhich a project states\
  \ the conclusion directly, and the resource classes a project is advised to\nwalk\
  \ over each named pair before declaring — is homed SINGLE-SoT in SPEC-1007 rules\
  \ 1 and 2; read it\nvia `bin/yitc-v2 graph query SPEC-1007`. It is stated here because\
  \ this is where a reader meets the\nfield; the home is that spec, and `tests/test_spec0207_resource_ownership.py`\
  \ pins the two together.\n\n**WHAT A CONCURRENTLY-RUN LAYER IS GIVEN, AND WHY IT\
  \ MATTERS TO THE PROJECT.** A layer the\nrunner overlaps is published one extra\
  \ environment variable: `COMPOSE_PROJECT_NAME`, set to a compose\nproject name the\
  \ runner MINTS for that layer alone (unique by construction — `<pid>-<n>`, SPEC-0041\n\
  §1c guarantee source (A); no random component). It rides the SAME env-publication\
  \ seam as\n`YITC_VERIFY_LAYER_WORKERS` below and is published ONLY to a layer that\
  \ actually overlaps a peer — a\nserially-run layer's environment is untouched, so\
  \ the serial default is unchanged here too.\n\nIt exists because the per-layer container-CPU\
  \ reading (`per_layer_cpu`) must\nattribute a container to the LAYER that started\
  \ it. Before it attributed by the compose\n`working_dir` label, i.e. by the WORKTREE\
  \ — which every layer of a land shares, so overlapping layers\neach counted every\
  \ other layer's containers and every per-layer figure became the group's SUM. A\n\
  worktree path is a name DERIVED from an input the concurrent runs share, which SPEC-0041\
  \ §1c names\nexplicitly as NOT a uniqueness guarantee; the minted project name is\
  \ the run-issued identity that is.\n\nCONSEQUENCE A PROJECT CAN ACT ON: if a concurrent\
  \ layer's command sets its OWN compose project\n(`docker compose -p …`), it overrides\
  \ what the runner published, and that layer's containers are then\nreported under\
  \ the `unattributed_containers` gap instead of being credited to it. That is honest\n\
  rather than silently wrong, and the row says which predicate it used (`container_attribution`:\n\
  `layer` = the issued token, `worktree` = the serial predicate) — but a project that\
  \ wants the exact\nper-layer split should let the published name stand. This changes\
  \ NO verdict: the whole reading is\nreport-only and nothing that decides reads it.\n\
  \nABSENT = every layer runs serially, in declaration order — unchanged, the default\
  \ every existing\ncarrier has. PRESENT-BUT-INVALID — not a list, an element that\
  \ is not a non-empty string, a duplicate\nname, or a name matching no declared layer\
  \ — FAILS CLOSED before any layer runs (`mode: malformed`, the\n`timeout_seconds:`\
  \ stance): a typo'd declaration must never silently fall back to the serial path\
  \ it\nwas written to replace, and a name matching nothing is a broken declaration,\
  \ never a silent skip. The\nland runner's accepted set (`bin/lib/land_verify_legs.py#_declared_independent_layers`)\
  \ is EXACTLY the init\nshape hook's (`_hook_verify`), never looser.\n\nBARRIER semantics.\
  \ Layers are still taken in declaration order: consecutive RUNNABLE layers that\
  \ are\nALL named here overlap; a runnable layer NOT named here is a BARRIER — the\
  \ pending named layers finish\nfirst, then it runs alone, in its place. A row that\
  \ executes nothing (waived / malformed /\nskipped-disjoint-subject, or a layer whose\
  \ verdict the land took from the Stage-6 run — SPEC-0065\n§Bound) is not a barrier,\
  \ so a `subject_globs` skip between two named layers does not\nserialize them.\n\
  \n**The `post_sync_set:` sub-field — the layers a POST-SYNC PROOF runs (a SECTION-level\
  \ sub-rule of\n`verify:`, not a new section).** The OPTIONAL `verify.post_sync_set:`\
  \ is a list of names of layers\ndeclared above, in the `independent_layers:` shape\
  \ and checked by the same init shape hook. When the\nMAIN checkout's carrier declares\
  \ it non-empty, a `worktree sync --task` that merges `main` into the\ncard checks\
  \ that the merged HEAD is the tree of the card's newest green runner-marked Stage-6\
  \ run plus\n`main`'s own advance and nothing else, then runs ONLY those layers (no\
  \ subject skip), and records the\noutcome as `post_sync_proof` on its `worktree_synced`\
  \ row: `passed`, `failed`, `not-needed` (the run's\nbase already is the merged `main`;\
  \ nothing runs) or `ineligible` with the first reason found. It is\n`ineligible`,\
  \ and names the full run `task test <T> --run`, when: there is no green runner-marked\n\
  newest run (`no-green-run`, `newest-run-red`, `row-not-runner-marked`); a hand-resolved\
  \ merge was\nrecorded after the run (`hand-resolved-merge`); a non-inert change\
  \ is uncommitted\n(`uncommitted-changes`); an own non-merge commit not on the merged\
  \ `main`, made at or after the run\nstarted, leaves a non-inert path at another\
  \ content than the tested tree's — also when a later commit\nreverts it (`own-change-after-run`);\
  \ a non-inert path differs from the tested tree where `main` did not\nchange it\
  \ (`own-change-after-run`), or from `main`'s where it did (`main-change-not-taken`),\
  \ or both\nsides changed it (`merged-both-sides`); a declared test names an inert\
  \ path of that difference\n(`read-by`); a set name is not declared in the worktree's\
  \ carrier (`undeclared-layer`); or any read\nfails (`unknown:`). Inert is the SPEC-0064\
  \ classifier. ABSENT or empty = no proof, and the row carries\nno such key. `land`\
  \ reads a passed proof only when `main` moved since the run (SPEC-0065 §Bound, the\n\
  post-sync-proof arm of condition (1)); the key is reserved, `event` refuses it.\n\
  In a project that declares no `verify.layers`, and in the engine's own repository\
  \ whatever layers\nit declares (the engine's form is SPEC-0186 rule 6's: one layer,\
  \ its whole suite, and this set as\nfiles), `post_sync_set` names distinct repo-relative\
  \ `test_*.py` files inside a declared test-sweep\ndirectory instead, and the proof\
  \ runs those files through the engine's own runner; a name that is\nno such file\
  \ is `ineligible` (`unknown-test-file`). Two switches sit beside it, read only while\
  \ the\nSPEC-1045 admission queue is on, each true unless the section sets it false:\n\
  `sync_at_stage6_admission` — the queue runs `worktree sync --task` at a Stage-6\
  \ run's admission,\nthis proof unchanged; `post_sync_set_first` — the quick set\
  \ decides first: that sync's proof\n`failed` stops the run, `passed` ends it only\
  \ while the card's prior green run already covers\nClosure (SPEC-1038 §Tests), and\
  \ where the sync ran no set the queue runs the set ONCE as a screen —\nred stops\
  \ the run, anything else starts it, and a screen is never a proof. `--full`, `--whole`\
  \ and\n`--exclusive` take neither the end on a proof nor the screen. While the queue\
  \ is on, a hand sync's\nset run holds BUSY shared and waits while an exclusive run\
  \ holds it; past that wait's bound the\nproof is `ineligible` (`unknown:busy-held-exclusive`).\
  \ A switch that is not true or false is\nignored with one line.\n\n**The `layer_worker_shares:`\
  \ sub-field — HOW THE PROJECT SPLITS the land's worker allotment across\nits layers\
  \ (a SECTION-level sub-rule of `verify:`, not a new section).** The OPTIONAL\n`verify.layer_worker_shares:`\
  \ is a MAPPING from a `verify.layers[].layer` name declared above to that\nlayer's\
  \ FRACTION of the allotment the land publishes as `YITC_VERIFY_LAYER_WORKERS` (SPEC-0132\
  \ rule 2). Like `independent_layers:` it SPLITS the layer universe this rule already\
  \ owns and\ndeclares no layer of its own; like `combined_candidate_safe` it is DISCLOSED\
  \ on the `verify` concern's\n`gated_capabilities:` (SPEC-0093) so the born stanza\
  \ names it; this section stays the single home of\nthe field's NAME, SHAPE and SEMANTICS\
  \ (SPEC-0128 Rule 2).\n\nTHE DIVISION OF RESPONSIBILITY IS THE RULE. The KERNEL's\
  \ part is the FORM ONLY: it declares the key,\nvalidates its shape, RECORDS each\
  \ declared share on that layer's outcome row\n(`declared_worker_share`, report-only,\
  \ beside the CPU that layer actually consumed), and keeps\npublishing the allotment\
  \ — WHOLE — in the one universal `YITC_VERIFY_LAYER_WORKERS`, to a layer\ncarrying\
  \ a share exactly as to one that does not. The kernel does NOT compute shares, does\
  \ NOT\ndivide, and publishes NO per-layer number. The PROJECT fills in its layers,\
  \ splits the allotment as\nit judges, and scales its own runners from the allotment\
  \ it reads — because only the project knows\nwhat its layers do. A layer with no\
  \ entry, and every layer under a project that declares nothing, is\nsimply unsplit:\
  \ it reads the whole allotment, unchanged. A layer whose runner takes no worker\n\
  setting runs one process whatever the allotment, so it stays UNDECLARED and outside\
  \ the share sum:\na share on it would divide nothing and would still be counted\
  \ in the load reading below.\n\nTHE LAYERS THIS RUN EXECUTES ARE NAMED BESIDE THE\
  \ ALLOTMENT. Wherever the kernel publishes\n`YITC_VERIFY_LAYER_WORKERS` to a layer\
  \ command — the land, a Stage-6 run, the <workshop-spec> pre-deploy\nrun — it also\
  \ publishes `YITC_VERIFY_SELECTED_LAYERS`: the names of the layers this verify run\n\
  executes, in declaration order, as a JSON array of strings, so every layer name\
  \ reads back exactly;\na re-run of named layers names those layers only. A layer\
  \ that does not run its command in this run\nis not named: a waived layer, a layer\
  \ skipped because its `subject_globs` are disjoint from the\nchange, a layer credited\
  \ from the Stage-6 run, a layer the pre-deploy exclusion leaves out; a full\nrun\
  \ names every layer it runs. A run that publishes no allotment publishes no list,\
  \ and a value\ninherited from the calling environment never reaches a layer. The\
  \ kernel still divides nothing: the\nlist is a fact the runner already holds, and\
  \ what the project does with it — for instance dividing a\nlayer's share by the\
  \ sum of the shares of the layers named — is the project's arithmetic.\n\nBESIDE\
  \ THE LIST, A FORECAST OF WHAT EACH LISTED LAYER WILL RUN. Wherever the kernel publishes\n\
  `YITC_VERIFY_SELECTED_LAYERS`, it also publishes `YITC_VERIFY_LAYER_FORECAST`: the\
  \ path of ONE file\nwritten for this run before any layer runs, carrying this run's\
  \ id and one entry per listed layer,\nin the same order. An entry is an ESTIMATE,\
  \ never the selected set — a layer's units are chosen in\nits own pass, when the\
  \ run reaches it: it reads `estimate` or `unknown`, names its basis (the units\n\
  of that layer measured inside the journal's summary window), and gives an estimated\
  \ unit count and\nthe sum of the KNOWN medians, a group counting once. A missing\
  \ median is unknown cost, never zero; a\nlayer with no adapter or no measured unit\
  \ reads `unknown`; units listed since and never measured are\nnot seen, units removed\
  \ since may still be counted, and the selection, the credit and the pre-deploy\n\
  exclusion are applied later — the entry says each. Where the measured rows mix units\
  \ and groups, it\ngives no total count or time, only each kind's own. The forecast\
  \ is built from what the run already\nreads — the layer list and its one read of\
  \ the unit medians — and starts no adapter invocation.\nWhen it cannot be built,\
  \ nothing is published, a value inherited from the calling environment never\nreaches\
  \ a layer, and every layer runs exactly as it would have: a project reader keeps\
  \ its previous\nsplit. Each listed layer's outcome row records `forecast`: the run\
  \ id and the entry it ran under,\nwhat its first attempt requested after selection,\
  \ credit and the pre-deploy exclusion (files and\nentities, a re-run adding nothing),\
  \ the known-median sum of that request, and the gap to the\nentry — `unknown` where\
  \ either side is unknown, and `ran: false` for a layer whose command never\nran;\
  \ or `state: unavailable` with the reason when no forecast was built. What the project\
  \ does with\nthe forecast stays its own arithmetic, as for the list.\n\nA DECLARED\
  \ SHARE OWES A READER — that is the project half, stated as the one obligation the\n\
  declaration carries. Declaring a share for a layer OBLIGATES the project to READ\
  \ the allotment and\nAPPLY the share: the layer's `command:`, or an in-repo script\
  \ that command runs, reads\n`YITC_VERIFY_LAYER_WORKERS` and scales that layer's\
  \ own runners to `floor(allotment x share)`,\nfloored at 1 — a layer given zero\
  \ workers does not run. A share nobody reads divides nothing: it is\na FALSE DECLARATION,\
  \ recorded on the outcome row as though it governed a split that never happened.\n\
  This states explicitly the project half the paragraph above already writes descriptively;\
  \ it adds\nno kernel computation, no enforcement and no refusal — the kernel still\
  \ validates shape only, and a\nproject already reading the allotment and applying\
  \ its share is COMPLIANT AND UNAFFECTED.\n\nBY WAY OF EXPLANATION, NOT AS A SECOND\
  \ OBLIGATION — what the kernel EXPECTS of a reader run OFF the\nland path. On the\
  \ land path the variable is always there: the kernel keeps publishing the allotment\n\
  WHOLE in `YITC_VERIFY_LAYER_WORKERS` to every layer, as the paragraph above guarantees.\
  \ So a reader\nonly ever meets that variable's ABSENCE outside the land path — a\
  \ hand run, or the project's own CI\n— and there the kernel's expectation is that\
  \ the reader FAILS LOUD rather than silently falling\nback to a prior default, because\
  \ a silent fallback is exactly where a broken split hides. That is\nan expectation\
  \ about a case the kernel's own publication guarantee keeps off the land path; it\
  \ is a\ncompliance test of no project, and nothing refuses on it.\n\nA SHARE THAT\
  \ NAMES NO READER IS REPORTED, REPORT-ONLY. The init ops-carrier sweep emits\none\
  \ advisory WARN per share-declaring layer whose `command:` and resolved in-repo\
  \ scripts never\nmention the token `YITC_VERIFY_LAYER_WORKERS`. It is an ADVISORY\
  \ and nothing more: never a shape\nerror, never `mode: malformed`, and no filing,\
  \ init or land is ever refused on it. A malformed\nshares block is owned by the\
  \ fail-closed arm below and draws no advisory, so one declaration never\ndraws two\
  \ verdicts.\n\nA FRACTION, NEVER A CORE COUNT, and that is what the shape check\
  \ enforces per value: a number in\n`(0, 1]`, never a bool. A fraction is required\
  \ so that a change to the KERNEL's allotment re-splits\nautomatically with no project\
  \ rewritten, which a frozen count cannot do; `0` is refused because a\nlayer cannot\
  \ be given no workers at all, and `> 1` because one layer cannot claim more than\
  \ the\nwhole. The SUM across layers is DELIBERATELY NOT CHECKED — there is no kernel-side\
  \ over-allocation\nguard: a normalized split cannot exceed the whole by construction,\
  \ and the floor case (a share floors\nat one worker, so a small allotment with many\
  \ layers can make those floors sum above it) is the\nPROJECT's arithmetic, not the\
  \ kernel's. Shape, not value (rule 3): the kernel never judges whether a\ngiven\
  \ fraction is the RIGHT one for a given layer.\n\nTHE LOAD A DECLARATION ASKS FOR\
  \ IS REPORTED, REPORT-ONLY. The sum stays unchecked, and a project\nis free to declare\
  \ shares that sum above one; for such a declaration a change of the allotment —\
  \ a\nmachine setting, another host, a changed default — multiplies the workers its\
  \ layers ask for. Two\nseams say so. A land whose verify ran share-declaring layers\
  \ prints ONE line naming three numbers\n— the sum of those layers' shares, the allotment\
  \ that verify published, and the host's processor\ncount — whenever the sum times\
  \ the allotment EXCEEDS that count, and records the same reading on\nthat land's\
  \ row; at or under the count it prints and records nothing. And setting the machine's\n\
  per-verify worker ceiling prints, when the value changes, what the new allotment\
  \ means for a\nproject that declares shares — with that project's own numbers when\
  \ the call runs in a project\nthat declares them, otherwise as the plain statement.\
  \ The reading is an UPPER BOUND for layers\nthat run at the same time, not a measurement\
  \ of load; the processor count is the bound because it\nis the one a project owner\
  \ reads off the host and that stays the same from one land to the next.\nIt is a\
  \ REPORT and nothing more: no share and no sum is judged, and no land, filing, init\
  \ or\nsettings write is refused, delayed or changed on it.\n\nABSENT = every layer\
  \ reads the whole allotment — unchanged, the default every existing carrier has.\n\
  PRESENT-BUT-INVALID — not a mapping, a key that is not a non-empty string, a key\
  \ matching no declared\nlayer, or a value that is not a fraction in `(0, 1]` — FAILS\
  \ CLOSED before any layer runs\n(`mode: malformed`, the `timeout_seconds:` / `independent_layers:`\
  \ stance): a typo'd split must never\nsilently fall back to the unsplit default\
  \ it was written to replace. The land runner's accepted set\n(`bin/lib/land_verify_legs.py#_declared_layer_worker_shares`)\
  \ is EXACTLY the init shape hook's\n(`_hook_verify`), never looser.\n\n**The `pre_deploy_layer_worker_shares:`\
  \ sub-field — the table a PRE-DEPLOY RUN applies.** The\nOPTIONAL `verify.pre_deploy_layer_worker_shares:`\
  \ has exactly the shape, the validation and the\ndivision of responsibility of `layer_worker_shares:`\
  \ above — the same shape check refuses it, and the\nproject half is the same reader\
  \ obligation — and is applied ONLY by the <workshop-spec> pre-deploy run and\nits\
  \ lone-layer re-run, in place of `layer_worker_shares:` for that run. There the\
  \ kernel records each\nshare on its layer row together with the table it came from,\
  \ and names the table to every layer\ncommand as\n`YITC_VERIFY_WORKER_SHARES_KEY=pre_deploy_layer_worker_shares`\
  \ — the selector the project's reader\nreads to apply this table instead of the\
  \ ordinary one; still no per-layer number is published. A land\nand a Stage-6 run\
  \ never read the key, malformed or not, and no layer they run receives that variable,\n\
  an inherited value included. ABSENT = the\npre-deploy run applies `layer_worker_shares:`\
  \ as a land does; PRESENT-BUT-INVALID fails the pre-deploy\nrun CLOSED before any\
  \ layer runs.\n\nWhat the kernel KEEPS under concurrency — none of this is relaxed\
  \ by the declaration: EVERY layer still\nruns; the land still FAILS on ANY failed\
  \ / timed-out / prep-failed layer, NAMING that layer (never its\nconcurrent peer);\
  \ each layer keeps its OWN `timeout:` precedence chain, its own execution clock\
  \ and its\nown outcome row, appended in DECLARATION order (`per_layer_durations`\
  \ reads the rows exactly as before);\nthe group runs INSIDE the ONE SPEC-0132 §1\
  \ verify-admission slot the land already holds ( — no\nsecond slot is taken per\
  \ layer); and the shared journal append a layer command makes through the engine\n\
  `event` verb is serialized by the E-0021 sidecar lock, so concurrent members cannot\
  \ interleave a row.\nThe kernel checks STANCE + SHAPE only (rule 3): it never verifies\
  \ that the named layers are in fact\nindependent — that assertion is the project's,\
  \ on the same grounds as `combined_candidate_safe` (a\nlayer is an arbitrary command,\
  \ so inferring the property would be a guess dressed as a guarantee).\nThe standing\
  \ of that assertion is the paragraph above and SPEC-1007 rule 1: the project's own\n\
  declared risk judgement, never a kernel-derived eligibility.\n\n(Rule 16 continues\
  \ in `.part2.yaml`; rules 17-27 and the closing sections are in `.part3.yaml` —\
  \ SPEC-0120 §3 split.)\n"
