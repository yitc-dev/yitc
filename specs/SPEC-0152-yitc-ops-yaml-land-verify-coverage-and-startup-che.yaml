  \ gate moves. **The contract — the resource classes, the fail-closed default\nfor\
  \ anything undeclared, the probe-per-boundary requirement, the bounded allowlist\
  \ for a synchronized\nshared sink, and the dispositions — is homed SINGLE-SoT in\
  \ SPEC-0207; read it via `bin/yitc-v2 graph\nquery SPEC-0207`.** This row is a pointer\
  \ and restates none of it (SPEC-0005 rule 8 / SPEC-0067\ndrift-proof mention).\n\
  \n**The `subject_globs:` sub-field — per-layer diff-relevance subject (a SUB-rule\
