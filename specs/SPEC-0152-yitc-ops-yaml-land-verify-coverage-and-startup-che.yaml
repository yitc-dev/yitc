  \ a future extension of this key: it was refused on the merits (X-0884 —\nthe hardcoded\
  \ floor is what makes the pinned re-run fire on a verify-implementation touch, so\
  \ a\nconsumer must never hold the power to shrink the surface that guards it) and\
  \ the ask was retracted\n(X-0893). Absent key → behaviour unchanged. The reader\
  \ is `bin/lib/land_verify_legs.py#_declared_verify_infra_globs`.\n\n### 17. The\
  \ `startup_checks:` section schema (rule-4 section-add — OPT-IN report-only startup\
  \ surface; / X-0191)\nThe OPTIONAL `startup_checks:` top-level section lets a project\
  \ declare its OWN cheap, report-only\nstartup checks — so a project-specific \"\
  you have N things to look at\" (e.g. in-work proposals in a\nsubsystem, un-applied\
  \ config) is SURFACED at session-start instead of being invisible (the X-0191\n\
  real incident: 3 in-work proposals in a ticket subsystem were invisible at session\
  \ start). It is\n**OPT-IN, like `extensions:` (rule 13) / `coverage:` (rule 15)**\
  \ — ABSENT = the project declares no\nstartup checks (never fail-closed, never a\
  \ sweep ERROR). It is deliberately NOT in the concern\nregistry, so the generic\
  \ declare-or-waive sweep IGNORES it (the rule-3 non-whitelist invariant):\nadding\
  \ checks is zero-onboarding-friction and demands no waiver (P1 anti-complexity).\n\
  \n**DECLARE — a `startup_checks:` list.** Each entry is a mapping with three string\
  \ keys:\n- `label:` — a short slug naming the check (the echo label).\n- `command:`\
  \ — a CHEAP shell command run at each session-start / land seam; a NON-ZERO exit\
  \ means\n  the check FLAGS (there is something to look at), exit 0 means CLEAN.\n\
  - `detail:` — a short pointer (a doc path / a command to run) telling the reader\
  \ where to look.\n\n**Echo semantics — REUSE the SPEC-0119 proactive-debt echo plumbing\
  \ (no new mechanism, P1).** The\ndeclared checks are run and AGGREGATED into ONE\
  \ report-only line — count + per-check `label (detail)`\n— appended to the SPEC-0119\
  \ debt-echo output, so it rides the SAME seams for free\n(session-start and the\
  \ `bin/yitc-v2 debt` post-`/compact` re-fold; the land-tail seam was retired, SPEC-0119\
  \ rule 2(b)). Print discipline is\nSPEC-0119's verbatim: SUPPRESSED-WHEN-CLEAN (nothing\
  \ prints when zero checks flag), REPORT-ONLY (it\nnever gates / blocks / auto-acts).\
  \ TOKEN-FRUGAL by contract: count + pointer only, never the checks'\nstdout — coherent\
  \ with the always-loaded-seed-weight-trim doctrine (plan\n`reduce-always-loaded-startup-seed-weight-controlle`),\
  \ adding no new startup noise.\n\n**Fail-SAFE reader (never breaks startup).** The\
  \ reader is best-effort: an absent section, a malformed\nentry, an unreadable carrier,\
  \ or a command that errors/times-out is SKIPPED, never surfaced as a\nbroken session-start\
  \ (a report-only surface must never nag on the unknown — the SPEC-0119 rule-1\n\
  principle). Because the section is un-swept, the kernel does NOT shape-validate\
  \ it — a malformed entry\nis silently skipped rather than an init ERROR (the price\
  \ of zero-friction opt-in). The ENGINE ITSELF\nhas no `yitc-ops.yaml`, so this surface\
  \ is a no-op in the kernel's own sessions.\n\n**Read-only sessions run NOTHING.**\
  \ A declared check is arbitrary project code (measured:\none reaches a prod schema\
  \ via `docker exec … psql`), which the `--read-only` promise cannot admit. So\n\
  when `READ_ONLY_ROOT` is set no declared command is executed; the echo instead prints\
  \ ONE report-only\nline counting the declared check(s) as skipped under read-only.\
  \ The operating-mode path is unchanged.\n\n### 24. Test-class last-successful-execution\
  \ — a declared class records that it actually RAN (X-0375)\nSPEC-0156 admits a declared\
  \ kernel-graded check on a recorded RED demonstration — proof it CAN fail. It\n\
  never asks whether the check has ever ACTUALLY RUN green. <project>'s e2e test class\
  \ was DECLARED (rule 10\n`tests.classes[]`) but its browsers were never installed:\
  \ nothing ran, so nothing failed, and a class that\nnever executed read as coverage\
  \ while catching nothing (X-0375). This rule is the EXECUTION axis of that\nadmission\
  \ doctrine: a declared test class records its LAST SUCCESSFUL EXECUTION in the journal,\
  \ and a class\nwith none — or one gone stale — surfaces report-only in the debt\
  \ echo (SPEC-0119), never a gate.\n\n**JOURNAL-DERIVED, NO NEW STORE (the SPEC-0149\
  \ §2 acceptance boundary).** There is no stored last-run\nfield on the carrier and\
  \ no new FSM: the carrier says what is DECLARED, the journal says what was RUN,\
  \ and\nthe debt is the difference — recomputed fresh at read time by `bin/lib/debt_adoption.py#unexecuted_test_classes`.\n\
  The carrier holds NO computed status (rule 7).\n\n**THE PRODUCER IS A DELIBERATE,\
  \ EVIDENCE-BEARING ACT — never a declaration-derived auto-emit.** A pinned\nsuite\
  \ PASSING does NOT positively observe that a SPECIFIC declared class ran: `land`\
  \ runs `verify.layers`\nby LAYER id, never per tests-class, so auto-recording \"\
  executed\" from the declaration list would be the\nvery \"nothing ran, nothing failed\"\
  \ false-green this doctrine exists to end ( audit-pre). The\nexecution is recorded\
  \ by whoever ACTUALLY RAN the class — a CI job, a post-deploy hook, a human — via\
  \ the\nEXISTING generic `event` verb: `bin/yitc-v2 event test_class_executed --data\
  \ '{\"class\":…,\"outcome\":\n\"pass\",\"evidence\":…}'`. This is the SPEC-0156\
  \ `check_admission_demonstrated` producer precedent EXACTLY:\nno new verb, no new\
  \ emitter, no new store (the event is catalogued in SPEC-0025).\n\n**RECORD contract\
  \ — the fold CLEARS a class ONLY on a COMPLETE record** (the SPEC-0156 conservative\n\
  direction — under-evidenced ⇒ still owed): a non-empty `class`, an `outcome` of\
  \ `pass`, AND a non-empty\n`evidence:` naming the run (a CI url / a log ref / a\
  \ harness id). A bare \"it ran\" with no named run is a\nCLAIM anyone could type,\
  \ and clearing a class on a claim is the false-green this rule exists to end. A\n\
  non-pass / under-evidenced / mis-attributed record does not clear — the class stays\
  \ visible as debt.\n\n**DECLARED-CLASS validation AT THE POINT OF CONSTRUCTION —\
  \ an undeclared `class:` does not pass silently\n(X-1057).** The RECORD contract\
  \ above is a COMPLETENESS test: it asks whether the payload names\nan outcome and\
  \ an evidence, never whether the `class:` it names is one this project DECLARED.\
  \ A row naming\nan undeclared class is therefore complete — it is written, it reads\
  \ to a human as coverage, it matches no\ndeclared class so it clears nothing, and\
  \ it appears on no surface at all (the near-miss report of the same\nrule is scoped\
  \ to still-surfaced DECLARED names, so it does not see the row either). MEASURED,\
  \ <project>\n2026-08-20: two rows emitted with `class=stack` and `class=static`\
  \ — verify LAYER ids, not any of the\neight classes that carrier declares — were\
  \ accepted without a word, the next morning's fold still reported\nthe same declared-but-unproven\
  \ count, and the acceptance criterion that named the event stayed unmet for a\n\
  day. The wrong value is the EASY one to write, which is why this is a kernel defect\
  \ and not carelessness:\nboth vocabularies live in ONE file a few sections apart,\
  \ they OVERLAP (<project>'s `frontend-unit` is BOTH\na layer id and a class name,\
  \ so the right KIND of name cannot be settled by inspection), and the run output\n\
  on screen at the moment of recording prints the LAYER names, never the class names.\n\
  \nSo the `class:` is validated against the project's OWN `tests.classes[]` declaration\
  \ AT THE EMIT — the one\nseam where the mistake is still cheap and the vocabulary\
  \ is already in hand. It FAILS BY IMPROVING THE\nARTIFACT, not by a bare refusal:\
  \ the append is refused so no false coverage row is ever written, and the\nmessage\
  \ hands back what the author lacked — every legal value NAMED, and, where the given\
  \ value is a\ndeclared `verify.layers[]` LAYER id, that layer's own `covers_classes:`\
  \ named as the classes it carries\n(the exact translation the author needed). A\
  \ silent accept is the defect this replaces; a BARE refusal\nwould be the weaker\
  \ fix, sending the author back to the same confusing file with no more information\
  \ than\nthey started with.\n\nIt ABSTAINS wherever the declaration cannot be read\
  \ — no carrier (the engine kernel itself), a waived or\nabsent `tests:` section,\
  \ zero declared classes, or any parse failure. A project that has declared no\n\
  vocabulary has authorised no refusal, and history is never retro-charged (the SPEC-0149\
  \ lesson, and the\nreader-owns-the-missing-value discipline). The declaration is\
  \ read in FULL, the UNION of declared classes,\nnever a first match (SPEC-0185 §1b).\
  \ This adds NO new verb, NO new flag, NO new gate class: it is one\nvocabulary check\
  \ at the existing generic `event` write, in the same fail-closed family as the\n\
  `deviation_captured` realm and `deviation_resolved` disposition checks that already\
  \ live there. Contract\nhome `bin/lib/debt.py#undeclared_class_remedy`; the `event`\
  \ verb is the call site.\n\n**The DEBT view (report-only, two surfaces).** For each\
  \ declared `tests.classes[]` class (a waived section\nor a waived entry declares\
  \ no class — rule 6, an ANSWERED question): a class with NO matching complete\n\
  record surfaces `never`; one whose latest one has aged past the staleness floor\n\
  (`YITC_DEBT_TEST_CLASS_STALE_FLOOR_DAYS`, default 30 days) surfaces `stale`. NEVER-run\
  \ is unconditional\ndebt (unfloored); STALE surfaces only while the floor is active\
  \ (a non-positive floor disables the\nstaleness arm, the sibling-fold AGE-floor\
  \ discipline). Wired at the ONE shared debt residue\n(`bin/yitc-v2#_debt_echo_lines`)\
  \ so it rides every debt seam (session-start / `debt` re-fold),\nsuppressed-when-clean.\
  \ A repo that declares no test class (the engine kernel itself, no yitc-ops.yaml)\n\
  folds to zero, so history is never retro-charged (the SPEC-0149 lesson).\n\n###\
  \ 25. Hermetic-class admission — a class declared HERMETIC is hermetic in TIME,\
  \ not just DATA (X-0431)\nRules 10/16 let a project DECLARE a test class or verify-layer\
  \ HERMETIC (the `tests.classes[]` taxonomy\n+ the rule-16 F-025 per-layer hermeticity\
  \ contract — `land` runs it on the LIVE tree with no network /\nno shared fixture\
  \ mutation). That contract is hermetic in DATA: no test sees another's rows, no\
  \ external\nis really mutated. It says nothing about TIME. A declared-hermetic suite\
  \ can still, per test, fire a\nprod code path that reaches out to an external infra\
  \ dependency that the hermetic container does NOT\nprovide (a broker `.delay` with\
  \ no Redis, a cache client with no cache, a third-party HTTP client) and\nthen WAIT\
  \ OUT that dependency's connect/retry timeout — a hidden per-test stall that is\
  \ invisible to\nevery DATA-hermeticity check. This rule is the TIME axis of the\
  \ hermetic-class admission doctrine.\n\n**THE ADMISSION CRITERION (report-only authoring\
  \ doctrine).** A suite/class declared hermetic MUST be\nhermetic in TIME: **every\
  \ external infrastructure dependency it can reach (broker / queue / cache /\nthird-party\
  \ API) is stubbed, run EAGER (in-process, e.g. celery `task_always_eager`), or mocked\
  \ — OR it\nfails FAST** (a short connect timeout configured in the TEST environment,\
  \ so an absent external errors in\nmilliseconds instead of waiting out a real ~15-20s\
  \ connect/retry). **Waiting out a real connect timeout\nto an absent external is\
  \ a DOCTRINE VIOLATION, not a slow test** — the class was never hermetic in time.\n\
  The unmocked external is easy to miss precisely because the OBVIOUS externals (email,\
  \ a bot API) are\nalready mocked: it takes only ONE prod code path firing ONE unmocked\
  \ infra call to silently set a whole\nsuite's per-test floor (X-0431: <project>'s\
  \ declared-hermetic backend suite carried a hidden\n~19.5s-per-test celery result-backend\
  \ connect-retry stall — 7 tests ≈ 136s of a 145s file — that\nsurvived 990-test\
  \ growth and pinned the whole suite's parallel floor, found only by a faulthandler\
  \ stack\ndump; PuzzleBot + email were mocked, celery was the ONE unmocked external\
  \ and no methodology rule asked\nthe question).\n\n**REPORT-ONLY — an authoring/declaration\
  \ criterion, no gate, no scanner (the rule-16 subject-scoping\nsibling — X-0426).**\
  \ The kernel does NOT time-profile a consumer's suite or scan for unmocked\nexternals\
  \ — it judges STANCE + shape, never behaviour (rule 3). This criterion is the QUESTION\
  \ an author\nanswers when declaring a class hermetic, and the doctrine an audit/review\
  \ cites; it composes with the\nrule-24 last-successful-execution debt (a class that\
  \ RAN green) and the rule-16 hermeticity contract (a\nclass hermetic in DATA). The\
  \ DIAGNOSTIC SIGNATURE + triage recipe (uniform per-test durations clustering\n\
  near a configured timeout ⇒ hidden external wait; `--durations=N` → confirm with\
  \ a `faulthandler_timeout`\nstack dump; <project> worked example) travel as `patterns/hermetic-in-time-suite-latency-triage.md`\n\
  — the hermetic-in-TIME half assumed by `patterns/consumer-suite-parallelization.md`'s\
  \ \"hermetic first,\nparallel second\" precondition. Consumer-side fix worked example:\
  \ <project> (celery\n`task_always_eager` + a short test-env broker timeout).\n\n\
  ### 27. The `product_source:` section — what this repo SHIPS, declared SEPARATELY\
  \ from what it VERIFIES (rule-4 section-add; / external audit ad-hoc 2026-09-01,\
  \ MEDIUM)\nThe `product_source:` top-level section is the AUTHORITATIVE per-repo\
  \ statement of WHICH code surfaces\nthis repo SHIPS — its product source. It exists\
  \ because that question and rule 16's question are\nDIFFERENT questions that were\
  \ being answered by ONE field, and this rule's whole job is to keep the\nnext reader\
  \ from re-deriving that coupling from rule 16.\n\n**THE SPLIT, stated plainly —\
  \ two fields, one purpose each:**\n- **`verify.layers[].covers` SCOPES VERIFICATION**\
  \ (rule 16). It answers «which layer verifies this\n  surface?», and its incentive\
  \ runs NARROW: fewer covered globs mean fewer layers run for a diff and\n  faster\
  \ lands. Narrowing it is a legitimate, even desirable, act of project hygiene.\n\
  - **`product_source.globs` DECLARES SHIPPED SOURCE** (this rule). It answers «what\
  \ does this repo\n  ship?», and its incentive runs WIDE: every glob missing from\
  \ it is product source that a governance\n  gate cannot recognise. Narrowing it\
  \ is a loss of governance.\n- **The work-batch carrier gate (`bin/lib/worktree.py`)\
  \ reads `product_source.globs`\n  and NEVER `verify.layers[].covers`** — under any\
  \ condition, including when `product_source:` is\n  absent. That sentence is the\
  \ rule; everything below is its shape and its consequences.\n\n**WHY the two must\
  \ not share a field (the defect this replaces).** Until the carrier gate read\n\
  `covers:` as its per-repo recognition set. One field then carried two purposes with\
  \ OPPOSITE\nincentives, so a project that honestly optimised its verify time silently\
  \ weakened its own governance\ngate, with no signal that it had. shipped a bounded\
  \ kernel carrier floor which BOUNDED that\nblast radius; the external auditor's\
  \ finding says in terms that a floor «does not actually decouple the\ntwo meanings»,\
  \ and it does not — the inversion lives in the FIELD, so only separating the fields\
  \ ends\nit. This is a P1 F3 REPLACEMENT: `bin/lib/worktree.py#_work_batch_declared_source_globs`,\
  \ the reader\nthat made `covers:` load-bearing for governance, is DELETED, not deprecated.\
  \ There is no fallback path\nand therefore no second live home (rule 5's never-two-live-homes\
  \ discipline, applied to the new field).\n\n**DECLARE — `globs:`.** A list of non-empty,\
  \ repo-relative PATH globs (`app/**`, `frontend/src/**`),\nshape-only and never\
  \ judged for value (rule 3). A glob that is not a string, is blank, or escapes\n\
  upward (`/…`, `../…`) is dropped — a malformed carrier NARROWS recognition and can\
  \ never widen it.\n\n**WAIVE — `waiver: { reason: <why> }`**, for a repo that genuinely\
  \ ships no product source of its own.\n\n**OPT-IN, NOT declare-or-waive, NOT fail-closed\
  \ — the rule-15 `coverage:` model, reused deliberately\n(P1 F1/F2).** An ABSENT\
  \ section is legitimate and is never an error: it means the repo has not\ndeclared,\
  \ and recognition falls to the kernel carrier floor alone. This is NOT the rule-3\n\
  declare-or-waive stance and MUST NOT become it: a fail-closed stance here would\
  \ refuse every land in\nevery already-init'd consumer on the day it. For the same\
  \ reason this section takes NO\n`concern:` registry block, so it changes no born\
  \ template, no `init` sweep, and no existing carrier.\n\n**ABSENT AND WAIVED ARE\
  \ IDENTICAL IN RECOGNITION AND DIFFERENT IN MEANING.** Both fall to the kernel\n\
  floor: no glob either one names is recognised as product source. For RECOGNITION\
  \ they differ ONLY in\nwhat may be SAID about them: a waiver is an answer somebody\
  \ gave, an absence is a question nobody has\nbeen asked. That distinction is the\
  \ waiver form's entire function — do not collapse the two, and do\nnot add an effect\
  \ to the waiver to justify it. The ONE place the difference carries an effect is\
  \ the\n§refusal-arm below, and the effect sits on the ABSENCE, never on the waiver:\
  \ an unanswered\nrepo's uncarried covers-path batch is refused until it answers,\
  \ and a waived repo lands it.\n\n**THE ABSENT-DECLARATION RULE IS A DECIDED FORK,\
  \ AND ITS COST WAS MEASURED, NOT ASSUMED.** The\nalternative — an absent section\
  \ falling back to the covers union — was migration-friendly and was\nrejected: it\
  \ would have preserved the coupling permanently for every repo that never declares,\
  \ which\non the evidence is every repo, since nothing would ever pull them. The\
  \ accepted cost, swept across all\n10 registered v2 consumers at 2026-09-01 (`git\
  \ ls-files` through the live recogniser, with covers vs\nwithout): <project> 692→138,\
  \ <project> 234→51, <project> 238→63, <project> 164→7, <project>\n36→5 recognised\
  \ paths; <project>, <project>, <project> and <project> are UNCHANGED (they\ndeclare\
  \ no covers, or only `tests/**`, which the tests-segment subtraction already removed);\
  \ <project>\nwas not git-readable and is REPORTED as unswept rather than counted\
  \ as zero. So ~1100 application-tree\nfiles in 5 consumers stop being recognised\
  \ until each declares. That loss is BOUNDED: this gate fires\nonly on a `work/<slug>`\
  \ batch carrying NO card and NO emergency marker, so no task deliverable, no\ncarried\
  \ batch, no verify layer and no audit changes.\n\n**THE NARROWING MUST NEVER BE\
  \ SILENT — the report-only migration note.** When a repo's stance is\nABSENT and\
  \ it still declares `verify.layers[].covers`, `land` prints ONE report-only note\
  \ naming the\nglobs that are no longer recognised and both ways to answer. It is\
  \ REPORT-ONLY in the rule-16\ndelegation/uncommitted-surface sense: no verdict,\
  \ no refusal, no event, no stored state, and it prints\non the refusal path too.\
  \ It is suppressed by a declaration or by a waiver, and by nothing else — an\nunanswered\
  \ repo keeps being told. This is the DISCLOSURE, not the gate; the narrowing has\
  \ already\nhappened by the time it prints.\n\n**THE REFUSAL ARM — what actually\
  \ pulls an unanswered repo to answer.** The note alone did\nnot: MEASURED on <project>,\
  \ the adoption ask went out as cross item X-1224 and stood unanswered 26\ndays,\
  \ bc's `yitc-ops.yaml` still carried no `product_source:`, and bc commit f25d4ec\
  \ (2026-09-16, a\n`frontend/package.json` + lockfile vite bump) landed as an uncarried\
  \ work batch with no card and no\naudit while the note printed. So, for a repo whose\
  \ stance is ABSENT, an UNCARRIED `work/<slug>` batch\n(no card, no emergency marker)\
  \ is REFUSED at land with its own class\n`work-batch-product-source-unanswered`\
  \ WHEN its diff touches a path the repo's own\n`verify.layers[].covers` recognised\
  \ before — computed by re-running the SAME pure carrier\nverdict with the covers\
  \ globs and the SAME carriers (`#_work_batch_unanswered_paths`). The refusal\nnames\
  \ both answers (`globs:` / `waiver:`) plus the card and emergency routes. It keeps\
  \ BOTH of this\nrule's constraints: it is NOT a covers fallback — covers only SELECT\
  \ the refusal cohort, the\nrecognition verdict is never re-ruled, and `covers:`\
  \ still declares nothing; and it is NOT\ndeclare-or-waive — a carried batch, a batch\
  \ touching nothing covers named, and every repo that\nanswered (either form) are\
  \ untouched, so no land in any consumer is refused merely for the absence.\nThe\
  \ note stays REPORT-ONLY itself; its text now says the cohort is refused until the\
  \ repo answers.\n\n**The kernel floor is unchanged and the fence is NOT re-litigated\
  \ here.** Recognition stays\nPOSITIVE (an unrecognised path LANDS — the X-0857 decision),\
  \ the tests-segment subtraction applies to\nthe declared globs exactly as it did\
  \ to covers, `yitc-ops.yaml` stays excluded, and the principled\nboundary holds:\
  \ the kernel MAY name cross-project build/deploy/container carrier surfaces and\
  \ MUST NOT\nguess framework-specific application trees — which is precisely the\
  \ job this section exists to do.\n\n**PURE per-project ops config the land verb\
  \ READS** — never a kernel-read governance scalar, so this\nspec stays `consumed:\
  \ false`.\n\n## Parameters\n\nAs SPEC-0093: the carrier's values are PER-PROJECT\
  \ ops config (verify-layer commands, coverage\nglobs, startup-check commands) —\
  \ NEVER kernel-read governance scalars (the SPEC-0005 §Parameters\nnon-whitelist).\
  \ So this spec is `consumed: false`.\n\n## Rationale\n\nA SPEC-0120 §3 aggregate-neutral\
  \ split (SPLIT-never-delete) of SPEC-0093, which reached 979 lines /\n80945 bytes\
  \ — over BOTH the 800-line and 63000-byte one-bounded-read ceilings. The seam is\
  \ by stable\nSURFACE (SPEC-0005 rule 6): the land-verify / coverage / startup cluster\
  \ owns 6 of the carrier's 7\n`implements:` anchors (the 7th, `init.py#cmd_init`,\
  \ is the generic seed/sweep and stays with the\ncore). Split under — its own card,\
  \ decomposed off because it re-homes rule->code\nanchors, not a plain doc relocation.\n\
  \n## Verification\n\n- the `verify:` section (rule 16) is checked-if-present declare-or-waive:\
  \ `init` on a fresh consumer\n  seeds it born WAIVED (section-level); a non-empty\
  \ `layers:` list passes when EVERY layer is declared\n  (`command:`) or waived (`waiver:\
  \ {reason}`); an UNANSWERED layer (neither), a layer carrying BOTH, a\n  layer missing\
  \ its `layer:` name, and a `layers:` + section-`waiver:` together each FAIL closed;\
  \ a\n  pre-`verify:` carrier still passes; the report-only verify-layer coverage\
  \ WARN fires at `graph build`\n  for a load-bearing surface covered by no declared\
  \ layer (rule-15 `coverage:` shape reused) — state\n  checks in tests/test_t9718_verify_layers_carrier.py.\
  \ A `tests.classes[].command` for\n  `moment: verify` is REJECTED once a `verify:`\
  \ section is present (the rule-10 forbiddance\n  enforcement — no second command\
  \ home; same test).\n- the `verify.layers[].prep` sub-field (rule 16 amend / X-0140)\
  \ is checked-if-present\n  declare-or-waive: a DECLARED layer MAY carry `prep: {\
  \ mode: npm-ci... }` and the land runner prepares\n  that layer's deps from the\
  \ lockfile INSIDE the worktree before running its `command:`; a `prep:`\n  carrying\
  \ BOTH a `mode:` and a `waiver:`, or NEITHER, FAILS closed; a layer with no `prep:`\
  \ prepares\n  nothing (backward-compat, checked-if-present). The runner records\
  \ the `verify_layer_prep` state/event\n  (layer key + resolved lockfile hash + package-manager\
  \ + runtime matched) — the executable land leg +\n  fail-closed-on-mismatch + state-check\
  \ tests ship in the sibling land-runner card\n  (bin/lib/worktree.py); the events\
  \ catalog is code-derived, so `verify_layer_prep` enters it at that\n  emit (no\
  \ SPEC-0025 edit here).\n- the `verify.layers[].boundary` sub-field + OUTSIDE-EVERY-BOUNDARY\
  \ WARN (rule 16 amend / X-0375)\n  is checked-if-present + opt-in report-only: `graph\
  \ build` lists a `coverage.load_bearing` surface that\n  falls outside every declared\
  \ `boundary:` glob and is not `admitted:`; it no-ops unless BOTH\n  `coverage.load_bearing`\
  \ AND ≥1 layer `boundary:` are declared (never a false 'everything outside'); a\n\
  \  zero-resolving `boundary:` glob folds into the zero-glob WARN — `bin/lib/graph.py#\n\
  \  _verify_layer_boundary_warnings`, tests/test_coverage_boundary.py.\n- the test-class\
  \ last-successful-execution debt (rule 24 / X-0375) is journal-derived + zero\n\
  \  stored state: a declared `tests.classes[]` class with no COMPLETE `test_class_executed`\
  \ (pass + a named\n  `evidence:`) surfaces `never`; one aged past `YITC_DEBT_TEST_CLASS_STALE_FLOOR_DAYS`\
  \ surfaces `stale`; a\n  non-pass / under-evidenced record does NOT clear it; a\
  \ waiver answers; a repo with no carrier owes\n  nothing — `bin/lib/debt_adoption.py#unexecuted_test_classes`,\
  \ differential probes in tests/test_coverage_boundary.py.\n- the `product_source:`\
  \ section (rule 27) is OPT-IN, checked-if-present: a declared\n  `globs:` list IS\
  \ read by the work-batch carrier gate and DOES govern (an uncarried `work/<slug>`\n\
  \  batch touching a declared glob refuses at land with `work-batch-uncarried-product-source`);\
  \ a\n  `waiver: {reason}` and an ABSENT section both fall to the kernel carrier\
  \ floor for RECOGNITION and\n  differ there only in whether the report-only migration\
  \ note prints — the separate refusal arm\n  below is what distinguishes them in\
  \ effect (absent refuses its uncarried covers-path batch, waived\n  lands it); a\
  \ repo declaring `verify.layers[].covers` and NO\n  `product_source:` does NOT get\
  \ those globs recognised (the `_work_batch_declared_product_source`\n  reader reads\
  \ ABSENT); instead an uncarried batch touching them refuses with its own class\n\
  \  `work-batch-product-source-unanswered` ( — the refusal arm), and lands again\
  \ once the repo\n  declares `globs:` or a `waiver:`, is carried, or touches nothing\
  \ covers named; malformed entries narrow and\n  never widen — `bin/lib/worktree.py#_work_batch_declared_product_source`\
  \ +\n  `#_work_batch_product_source_migration_note` + `#_work_batch_unanswered_paths`,\
  \ land-level differentials in\n  tests/test_work_batch_carrier_gate.py.\n- AC2 aggregate-neutrality\
  \ : the concatenated SPEC-0093-remaining + SPEC-0152 `### N.` rule\n  blocks reproduce\
  \ the pre-split rule text byte-for-byte (a reconstruction check, not an eyeball).\n"
