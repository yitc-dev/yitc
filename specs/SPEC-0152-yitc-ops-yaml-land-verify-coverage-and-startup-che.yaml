body: "## Scenario\n\nThe land-verify, coverage-admission, and startup-check facets\
  \ of a project's `yitc-ops.yaml`\nops-contract carrier (SPEC-0093). In the SAME\
  \ one carrier file a project declares which land-verify\nLAYERS the `land` gate\
  \ runs, which load-bearing code surfaces are reasoned spec-less\n(coverage-admission),\
  \ and its own cheap report-only startup checks. These sections were SPLIT OUT\n\
  of SPEC-0093 (SPEC-0120 §3 aggregate-neutral split) when that carrier grew past\
  \ the one-bounded-read\nceiling; they are the code-backed cluster — their `implements:`\
  \ anchors are the land-verify runner,\nthe coverage / verify-layer WARNs, and the\
  \ startup-check reader.\n\n## Internal\n\nA SPLIT-OUT part of SPEC-0093 (the yitc-ops.yaml\
  \ project ops-contract carrier). It carries FOUR of\nthat carrier's rules VERBATIM\
  \ — the land-verify / coverage / startup-observability surface:\n**rule 5** (verify's\
  \ authoritative home is `verify.layers`), **rule 15** (`coverage:` section),\n**rule\
  \ 16** (`verify:` section — the per-layer land-verify policy), **rule 17** (`startup_checks:`\n\
  section). Every carrier-wide rule these depend on (rule 1 one-file/one-section,\
  \ rule 3\ndeclare-or-waive fail-closed, rule 6 per-section waiver policy, rule 7\
  \ derived-surfaces-only, rule\n18 registry-generated surfaces) stays in SPEC-0093\
  \ and governs unchanged.\n\n**Concern-registry blocks stay on SPEC-0093 (single-SoT\
  \ — NOT re-homed here).** This spec carries the\nmoved rules' PROSE + their `implements:`\
  \ anchors ONLY. The `concern:` / `born:` registry blocks for\n`verify` / `coverage`\
  \ / `startup_checks` REMAIN on the ACTIVE SPEC-0093: born-ops generation is\nactive-gated\
  \ (`_active_concern_blocks` / SPEC-0128), so a concern block on this PROPOSED spec\n\
  would silently vanish from every consumer's born `yitc-ops.yaml`. The generation\
  \ metadata is part of\nthe carrier's `init.py#cmd_init` seed/sweep mechanism (which\
  \ also stays on SPEC-0093), so it belongs\nwith the active carrier — there is exactly\
  \ ONE home for each concern block, never a duplicate.\n\n**Shared rule numbering\
  \ (the split-pair convention).** These rules KEEP their original SPEC-0093\nnumbers,\
  \ so the moved text is byte-identical and every in-code `rule N` ref changes only\
  \ its spec\nid. A bare `rule N` inside a moved rule body whose number is NOT one\
  \ of {5, 15, 16, 17} refers to\nthe SPEC-0093 rule of that number (e.g. rule 16's\
  \ references to \"rule 3 / rule 6 / rule 10\" are\nSPEC-0093 rules). The two specs\
  \ are ONE carrier contract split across two files (SPEC-0120 §3).\n\n### 5. `verify`'s\
  \ authoritative home is the carrier `verify.layers` (the slice-1 single-home, MIGRATED\
  \ — no straddle, P5)\nSlice-1 pinned `verify` to `yitc-verify.yaml`; that single-home\
  \ is now MIGRATED into the carrier\n`verify.layers` section (rule 16) — the AUTHORITATIVE\
  \ source-of-truth for the land-verify layer\nuniverse. This is the migration slice-1\
  \ itself NAMED as a tracked follow-up, realized in-place\non this active carrier\
  \ (the rule-4 extensibility). The POLICY moved here; the EXECUTABLE leg —\n`land`\
  \ reading `verify.layers` (run every declared layer / fail-on-any / per-layer +\
  \ section waiver),\nthe explicit RETIRE of `yitc-verify.yaml` (REFUSED on read at\
  \ land — never silently read), and its\ninit-time MIGRATION (a legacy `yitc-verify.yaml`\
  \ folded into `verify.layers` + removed) — SHIPPED in\n (bin/lib/worktree.py + bin/lib/init.py).\
  \ There are NEVER two LIVE homes: `yitc-verify.yaml` is\nRETIRED and `verify.layers`\
  \ is the SOLE home (gate-specs finding #4 — decided here, not on the fly).\n\n###\
  \ 15. The `coverage:` section schema (rule-4 section-add — the B5 coverage-admission\
  \ carrier;, X-0129)\nThe `coverage:` top-level section is the durable carrier for\
  \ the **B5 coverage-admission** — WHICH\nload-bearing code surfaces are REASONED\
  \ spec-less (a deliberate exclusion) vs a genuine NEW orphan.\nBefore this carrier\
  \ the judgment survived ONLY as a consumer's closed-task free-text (the <project>\n\
  \ ~30-module list) and ROTTED the moment no one re-read it: `graph build` reported\
  \ code↔spec\ncoverage but had no admission REFERENCE, so a NEWLY-added uncovered\
  \ load-bearing module tripped nothing\nand was indistinguishable from a reasoned\
  \ exclusion (X-0129). This rule OWNS the section SHAPE; the\nCHECK that consumes\
  \ it is `bin/lib/graph.py#_coverage_admission_warnings`, called report-only from\n\
  `graph build` (it diffs the project's live load-bearing surfaces against spec coverage\
  \ + the admission\nlist; GRAPH «NOT a validation layer» — it WARNs, never fails\
  \ the build).\n\n**OPT-IN — NOT declare-or-waive, NOT fail-closed (the `extensions:`\
  \ rule-13 model).** An ABSENT\n`coverage:` section, OR a present section with an\
  \ empty/absent `load_bearing:`, means the project does\nNO coverage-admission tracking\
  \ — a legitimate silent-clean default, never an error. A project opts in\nby declaring\
  \ its load-bearing surface universe. The kernel checks the section's SHAPE only\
  \ IF PRESENT.\n\n**DECLARE — two lists:**\n- `load_bearing:` — a list of globs (each\
  \ repo-relative, e.g. `bin/lib/*.py`) enumerating the\n  LOAD-BEARING surface universe\
  \ the check walks. Empty/absent = no tracking (the opt-in default).\n- `admitted:`\
  \ — a list of the REASONED spec-less surfaces that are NOT flagged. Each entry is\
  \ a\n  mapping carrying a non-empty `surface:` (a repo-relative path) AND a non-empty\
  \ `reason:` (why it is\n  a deliberate spec-less exclusion, not an orphan). An admission\
  \ entry missing either key does NOT\n  suppress — an evidence-less admission can\
  \ never silently hide a new orphan (the fail-OPEN safety\n  rule; audit-pre finding\
  \ 0).\n\n**The check (report-only):** for each file matching a `load_bearing:` glob,\
  \ if it is NEITHER\nspec-covered (a key in the graph's `code_to_specs` — an `implements`\
  \ edge from an active spec) NOR\nvalidly `admitted:`, `graph build` emits a report-only\
  \ stderr WARN naming it as a candidate new orphan.\nPURE per-project ops config\
  \ the graph-build check READS — never a kernel-read governance scalar (this\nspec\
  \ stays `consumed: false`).\n\n**WAIVE — the whole concern.** A `coverage:` section\
  \ may instead carry `waiver: { reason: <why> }` (a\nLOOSE bare reason — a project\
  \ that deliberately tracks no coverage admission); the check then skips.\n\n###\
  \ 16. The `verify:` section schema (rule-4 section-add — the per-layer land-verify\
  \ policy; / X-0140)\nThe `verify:` top-level section is the AUTHORITATIVE source-of-truth\
  \ for a project's LAND-VERIFY LAYER\nUNIVERSE — the set of test layers the `land`\
  \ gate runs at the `verify` moment (e.g. a backend pytest\nlayer AND a frontend\
  \ smoke layer). It is the slice-1 `verify` single-home (rule 5) MIGRATED from\n\
  `yitc-verify.yaml` into the carrier. This rule owns the section SHAPE; the EXECUTABLE\
  \ land RUN (run\nevery declared layer, FAIL on any failed layer, honor a per-layer\
  \ waiver, migrate/retire\n`yitc-verify.yaml`, per-layer command inherits the F-025\
  \ hermeticity contract) is owned by the\nimplementing land card. DECLARE-OR-WAIVE,\
  \ fail-closed, checked ONLY IF PRESENT (the\nsecurity/ui/tests/host_config backward-compat\
  \ precedent — a pre-`verify:` carrier still passes). The\nkernel checks the STANCE\
  \ + structural SHAPE, never the command's correctness (rule 3). PURE per-project\n\
  ops config the land/build verbs READ — never a kernel-read governance scalar (this\
  \ spec stays\n`consumed: false`).\n\n**The authoritative land-layer SoT (the design\
  \ spine, X-0140 finding #1).** `verify.layers` is the\nauthoritative enumeration\
  \ of the project's land-verify layers — fail-closed cannot catch an OMITTED\nlayer\
  \ without it (a frontend layer silently untested at land is exactly the X-0140 incident).\
  \ A \"known\nlayer\" is defined against this list, and the report-only verify-layer\
  \ coverage WARN below is computed\nagainst it.\n\n**DECLARE — a non-empty `layers:`\
  \ list.** Each entry is a mapping carrying a required non-empty\n`layer:` name (the\
  \ layer id, e.g. `backend` | `frontend`), and is itself PER-LAYER DECLARE-OR-WAIVE,\n\
  fail-closed:\n- DECLARE the layer — a non-empty `command:` string (the hermetic\
  \ verify command `land` runs for that\n  layer; the kernel checks shape, never correctness\
  \ — rule 3); OR\n- WAIVE the layer — a `waiver:` mapping with a non-empty `reason:`\
  \ (a LOOSE per-layer waiver — a layer\n  legitimately without a harness yet).\n\
  A layer entry carrying NEITHER `command:` nor a reasoned `waiver:` is an UNANSWERED\
  \ LAYER → ERROR (the\nper-layer fail-closed floor, rule 3). A layer entry carrying\
  \ BOTH is a contradiction → ERROR (a layer\nis EITHER declared OR waived). An OPTIONAL\
  \ `covers:` (a list of non-empty glob strings, repo-relative —\nshape-only, never\
  \ judged for value) names the code surface that layer verifies; it feeds the\nreport-only\
  \ coverage WARN below and — for the ONE tests-dir case in the §tests-sweep delegation\n\
  sub-rule below — the land RUN's tests-sweep delegation (the RUN otherwise ignores\
  \ it).\n`covers:` SCOPES VERIFICATION AND DECLARES NOTHING ABOUT WHAT THE REPO SHIPS\
  \ — see rule 27\n(`product_source:`), which owns that second question. Until the\
  \ work-batch carrier gate read\nTHIS field as its per-repo product-source set, which\
  \ loaded one field with two opposite incentives\n(narrow is good here, narrow is\
  \ bad there); it no longer reads it at all. Narrow `covers:` freely for\nverify-scoping\
  \ reasons — that is what it is for.\nA DECLARED\nlayer MAY additionally carry an\
  \ OPTIONAL `prep:` dependency-prep sub-field (the §per-layer prep sub-rule\nbelow):\
  \ the land runner runs it INSIDE the fresh worktree BEFORE that layer's `command:`.\n\
  \n**The `health:` sub-field — WHICH declared layers a NIGHTLY health run may execute\
  \ (a SECTION-level\nsub-rule of `verify:`, not a new section; / SPEC-0105 §1a).**\
  \ The OPTIONAL `verify.health:`\nis the project's per-layer OPT-IN for the nightly\
  \ project-verify health check: `layers:` — a\nnon-empty list of names that must\
  \ each match a `verify.layers[].layer` already declared above — or\na `waiver: {reason:}`\
  \ / absence, which are equally legitimate non-adoptions. It DECLARES NO COMMAND\n\
  AND NO LAYER OF ITS OWN: it SELECTS from the layer universe this rule already owns,\
  \ so there is one\nlayer vocabulary and it cannot drift between the land run and\
  \ the health run.\n\nWHY AN OPT-IN AT ALL, since it costs a project a second declaration:\
  \ a health run executes these\ncommands in the project's checkout unattended, on\
  \ the KERNEL's schedule. Running every layer is not\nfree (a container/browser layer\
  \ costs minutes), and the kernel cannot tell a cheap layer from an\nexpensive one\
  \ — `timeout:` is a BUDGET, not a cost — so any kernel-side selection rule would\
  \ be the\nkernel GUESSING which of another project's commands are safe to run in\
  \ that project's territory\n. Naming the layers here is that authorisation, at the\
  \ granularity the cost actually varies\nat. A layer's `prep:` is NOT run by a health\
  \ run (it is a dependency-tree write), so a layer that\ncannot pass without its\
  \ prep must not be named here.\n\nThe kernel checks STANCE + SHAPE only (rule 3),\
  \ and the READER's obligations are SPEC-0105 §1a's:\na name here that matches no\
  \ declared layer is a BROKEN WATCH and alerts (never a silent skip); a\ndeclared\
  \ layer NOT named here is reported as not-run BY NAME, never counted as passing;\
  \ and a\nproject with no opt-in reports that it declares none — never a silent healthy.\n\
  \n**The `combined_candidate_safe:` sub-field — the project's COMBINED-CANDIDATE\
  \ assertion about its own\nlayers (a SECTION-level sub-rule of `verify:`, not a\
  \ new section; / SPEC-0184 rule 2).** The\nOPTIONAL `verify.combined_candidate_safe:`\
  \ is a plain BOOLEAN by which the project asserts that its\nDECLARED layers behave\
  \ correctly when they run over a COMBINED candidate — a tree carrying several\n\
  changes merged together — rather than over one change at a time. Its ONE consumer\
  \ is land-verification\nbatching (SPEC-0184): with `true`, several queued lands\
  \ may be verified TOGETHER in one pass; without\nit, each land is verified alone.\n\
  \n**WHERE THE PROJECT MEETS THIS KEY.** A key the project must assert is worth nothing\
  \ if the\nproject is never told it exists — an opt-in nobody was told about is off\
  \ by IGNORANCE, not by the\ndecision this declare-or-waive shape assumes was made\
  \ (<project>: 154 land batches of ONE, every row\nstamped `engagement: project-authored-verify-undeclared`,\
  \ while the key lived only in kernel source\nand in this body). So `combined_candidate_safe`\
  \ is DECLARED on the `verify` concern's\n`gated_capabilities:` (SPEC-0093), and\
  \ the born `yitc-ops.yaml` template — plus every already-init'd\ncarrier, through\
  \ the idempotent update path — carries it as a COMMENTED key with its meaning. That\n\
  disclosure is generated, never hand-listed, and changes nothing while the key stays\
  \ commented; this\nsection remains the single home of the field's NAME, SHAPE and\
  \ SEMANTICS (SPEC-0128 Rule 2).\n\n**Why the project must assert it and the kernel\
  \ must not infer it.** This section's own rule 3 boundary\napplies at full strength\
  \ here: a layer is an ARBITRARY command (`bash scripts/verify-stack.sh`), so the\n\
  kernel cannot know whether it isolates one change from another — a shared fixture,\
  \ a port, a database,\na build cache shared across the combined tree can all make\
  \ one member's failure indistinguishable from\na peer's. Inferring the property\
  \ would be a guess dressed as a guarantee, so it is DECLARED, in the\ndeclare-or-waive\
  \ shape this carrier already runs on.\n\n**FAIL-CLOSED, and the three failing shapes\
  \ have ONE effect.** Only the BOOLEAN `true` engages\nbatching. ABSENT (the default\
  \ every existing carrier has — backward-compatible by construction),\nexplicitly\
  \ `false`, and MALFORMED (anything that is not the boolean, including the STRING\
  \ `\"true\"`)\nall mean the same thing: batches of one. They are distinguished in\
  \ the reader's DIAGNOSTIC only,\nnever in effect. An unreadable or unparseable carrier\
  \ is likewise not engaged — never widen a gate on\na file that could not be read.\n\
  \n**NOT consulted at all when the verify is KERNEL-AUTHORED.** The engagement predicate\
  \ keys on WHO\nAUTHORED the verify, never on repo identity (SPEC-0184 rule 2): where\
  \ there is no project-authored\n`layers:` list — no carrier, no `verify:` section,\
  \ a section-level `waiver:`, or an empty list — the\nverify in force is the kernel's\
  \ own pinned suite, whose author and whose enforcer are the same party,\nso no declaration\
  \ is read anywhere. This sub-field governs the PROJECT-AUTHORED branch only. Consumed\n\
  by `bin/lib/batch_landing.py#_land_batch_engagement`; this spec stays `consumed:\
  \ false` (pure per-project\nops config the land verb READS, never a kernel-read\
  \ governance scalar — rule 16 head).\n\n**The `independent_layers:` sub-field —\
  \ WHICH declared layers the land runner MAY execute\nCONCURRENTLY (a SECTION-level\
  \ sub-rule of `verify:`, not a new section; / X-1396).** The\nOPTIONAL `verify.independent_layers:`\
  \ is a list of layer names, each matching a `verify.layers[].layer`\ndeclared above,\
  \ by which the project asserts that the named layers share nothing with EACH OTHER\
  \ — no\nhost port, no compose project, no database, no build cache, no write into\
  \ the tree — their `prep:`\nincluded. It is a PAIRWISE claim about the named set,\
  \ so it is a SET on the section, not a boolean on\na layer; it DECLARES NO COMMAND\
  \ AND NO LAYER OF ITS OWN (it SELECTS from the layer universe this rule\nalready\
  \ owns — the `health.layers` shape). Its ONE consumer is the land runner\n(`bin/lib/worktree.py#_consumer_zero_probe_guard`),\
  \ which runs the named layers OVERLAPPED instead of\none after another. Like `combined_candidate_safe`,\
  \ it is DISCLOSED on the `verify` concern's\n`gated_capabilities:` (SPEC-0093) so\
  \ the born stanza names it; this section stays the single home of\nthe field's NAME,\
  \ SHAPE and SEMANTICS (SPEC-0128 Rule 2).\n\n**WHAT A CONCURRENTLY-RUN LAYER IS\
  \ GIVEN, AND WHY IT MATTERS TO THE PROJECT.** A layer the\nrunner overlaps is published\
  \ one extra environment variable: `COMPOSE_PROJECT_NAME`, set to a compose\nproject\
  \ name the runner MINTS for that layer alone (unique by construction — `<pid>-<n>`,\
  \ SPEC-0041\n§1c guarantee source (A); no random component). It rides the SAME env-publication\
  \ seam as\n`YITC_VERIFY_LAYER_WORKERS` below and is published ONLY to a layer that\
  \ actually overlaps a peer — a\nserially-run layer's environment is untouched, so\
  \ the serial default is unchanged here too.\n\nIt exists because the per-layer container-CPU\
  \ reading (`per_layer_cpu`) must\nattribute a container to the LAYER that started\
  \ it. Before it attributed by the compose\n`working_dir` label, i.e. by the WORKTREE\
  \ — which every layer of a land shares, so overlapping layers\neach counted every\
  \ other layer's containers and every per-layer figure became the group's SUM. A\n\
  worktree path is a name DERIVED from an input the concurrent runs share, which SPEC-0041\
  \ §1c names\nexplicitly as NOT a uniqueness guarantee; the minted project name is\
  \ the run-issued identity that is.\n\nCONSEQUENCE A PROJECT CAN ACT ON: if a concurrent\
  \ layer's command sets its OWN compose project\n(`docker compose -p …`), it overrides\
  \ what the runner published, and that layer's containers are then\nreported under\
  \ the `unattributed_containers` gap instead of being credited to it. That is honest\n\
  rather than silently wrong, and the row says which predicate it used (`container_attribution`:\n\
  `layer` = the issued token, `worktree` = the serial predicate) — but a project that\
  \ wants the exact\nper-layer split should let the published name stand. This changes\
  \ NO verdict: the whole reading is\nreport-only and nothing that decides reads it.\n\
  \nABSENT = every layer runs serially, in declaration order — unchanged, the default\
  \ every existing\ncarrier has. PRESENT-BUT-INVALID — not a list, an element that\
  \ is not a non-empty string, a duplicate\nname, or a name matching no declared layer\
  \ — FAILS CLOSED before any layer runs (`mode: malformed`, the\n`timeout_seconds:`\
  \ stance): a typo'd declaration must never silently fall back to the serial path\
  \ it\nwas written to replace, and a name matching nothing is a broken declaration,\
  \ never a silent skip. The\nland runner's accepted set (`bin/lib/land_verify_legs.py#_declared_independent_layers`)\
  \ is EXACTLY the init\nshape hook's (`_hook_verify`), never looser.\n\nBARRIER semantics.\
  \ Layers are still taken in declaration order: consecutive RUNNABLE layers that\
  \ are\nALL named here overlap; a runnable layer NOT named here is a BARRIER — the\
  \ pending named layers finish\nfirst, then it runs alone, in its place. A row that\
  \ executes nothing (waived / malformed /\nskipped-disjoint-subject) is not a barrier,\
  \ so a `subject_globs` skip between two named layers does not\nserialize them.\n\
  \n**The `layer_worker_shares:` sub-field — HOW THE PROJECT SPLITS the land's worker\
  \ allotment across\nits layers (a SECTION-level sub-rule of `verify:`, not a new\
  \ section).** The OPTIONAL\n`verify.layer_worker_shares:` is a MAPPING from a `verify.layers[].layer`\
  \ name declared above to that\nlayer's FRACTION of the allotment the land publishes\
  \ as `YITC_VERIFY_LAYER_WORKERS` (SPEC-0132 rule 2). Like `independent_layers:`\
  \ it SPLITS the layer universe this rule already owns and\ndeclares no layer of\
  \ its own; like `combined_candidate_safe` it is DISCLOSED on the `verify` concern's\n\
  `gated_capabilities:` (SPEC-0093) so the born stanza names it; this section stays\
  \ the single home of\nthe field's NAME, SHAPE and SEMANTICS (SPEC-0128 Rule 2).\n\
  \nTHE DIVISION OF RESPONSIBILITY IS THE RULE. The KERNEL's part is the FORM ONLY:\
  \ it declares the key,\nvalidates its shape, RECORDS each declared share on that\
  \ layer's outcome row\n(`declared_worker_share`, report-only, beside the CPU that\
  \ layer actually consumed), and keeps\npublishing the allotment — WHOLE — in the\
  \ one universal `YITC_VERIFY_LAYER_WORKERS`, to a layer\ncarrying a share exactly\
  \ as to one that does not. The kernel does NOT compute shares, does NOT\ndivide,\
  \ and publishes NO per-layer number. The PROJECT fills in its layers, splits the\
  \ allotment as\nit judges, and scales its own runners from the allotment it reads\
  \ — because only the project knows\nwhat its layers do. A layer with no entry, and\
  \ every layer under a project that declares nothing, is\nsimply unsplit: it reads\
  \ the whole allotment, unchanged.\n\nA DECLARED SHARE OWES A READER — that is the\
  \ project half, stated as the one obligation the\ndeclaration carries. Declaring\
  \ a share for a layer OBLIGATES the project to READ the allotment and\nAPPLY the\
  \ share: the layer's `command:`, or an in-repo script that command runs, reads\n\
  `YITC_VERIFY_LAYER_WORKERS` and scales that layer's own runners to `floor(allotment\
  \ x share)`,\nfloored at 1 — a layer given zero workers does not run. A share nobody\
  \ reads divides nothing: it is\na FALSE DECLARATION, recorded on the outcome row\
  \ as though it governed a split that never happened.\nThis states explicitly the\
  \ project half the paragraph above already writes descriptively; it adds\nno kernel\
  \ computation, no enforcement and no refusal — the kernel still validates shape\
  \ only, and a\nproject already reading the allotment and applying its share is COMPLIANT\
  \ AND UNAFFECTED.\n\nBY WAY OF EXPLANATION, NOT AS A SECOND OBLIGATION — what the\
  \ kernel EXPECTS of a reader run OFF the\nland path. On the land path the variable\
  \ is always there: the kernel keeps publishing the allotment\nWHOLE in `YITC_VERIFY_LAYER_WORKERS`\
  \ to every layer, as the paragraph above guarantees. So a reader\nonly ever meets\
  \ that variable's ABSENCE outside the land path — a hand run, or the project's own\
  \ CI\n— and there the kernel's expectation is that the reader FAILS LOUD rather\
  \ than silently falling\nback to a prior default, because a silent fallback is exactly\
  \ where a broken split hides. That is\nan expectation about a case the kernel's\
  \ own publication guarantee keeps off the land path; it is a\ncompliance test of\
  \ no project, and nothing refuses on it.\n\nA SHARE THAT NAMES NO READER IS REPORTED,\
  \ REPORT-ONLY. The init ops-carrier sweep emits\none advisory WARN per share-declaring\
  \ layer whose `command:` and resolved in-repo scripts never\nmention the token `YITC_VERIFY_LAYER_WORKERS`.\
  \ It is an ADVISORY and nothing more: never a shape\nerror, never `mode: malformed`,\
  \ and no filing, init or land is ever refused on it. A malformed\nshares block is\
  \ owned by the fail-closed arm below and draws no advisory, so one declaration never\n\
  draws two verdicts.\n\nA FRACTION, NEVER A CORE COUNT, and that is what the shape\
  \ check enforces per value: a number in\n`(0, 1]`, never a bool. A fraction is required\
  \ so that a change to the KERNEL's allotment re-splits\nautomatically with no project\
  \ rewritten, which a frozen count cannot do; `0` is refused because a\nlayer cannot\
  \ be given no workers at all, and `> 1` because one layer cannot claim more than\
  \ the\nwhole. The SUM across layers is DELIBERATELY NOT CHECKED — there is no kernel-side\
  \ over-allocation\nguard: a normalized split cannot exceed the whole by construction,\
  \ and the floor case (a share floors\nat one worker, so a small allotment with many\
  \ layers can make those floors sum above it) is the\nPROJECT's arithmetic, not the\
  \ kernel's. Shape, not value (rule 3): the kernel never judges whether a\ngiven\
  \ fraction is the RIGHT one for a given layer.\n\nABSENT = every layer reads the\
  \ whole allotment — unchanged, the default every existing carrier has.\nPRESENT-BUT-INVALID\
  \ — not a mapping, a key that is not a non-empty string, a key matching no declared\n\
  layer, or a value that is not a fraction in `(0, 1]` — FAILS CLOSED before any layer\
  \ runs\n(`mode: malformed`, the `timeout_seconds:` / `independent_layers:` stance):\
  \ a typo'd split must never\nsilently fall back to the unsplit default it was written\
  \ to replace. The land runner's accepted set\n(`bin/lib/land_verify_legs.py#_declared_layer_worker_shares`)\
  \ is EXACTLY the init shape hook's\n(`_hook_verify`), never looser.\n\nWhat the\
  \ kernel KEEPS under concurrency — none of this is relaxed by the declaration: EVERY\
  \ layer still\nruns; the land still FAILS on ANY failed / timed-out / prep-failed\
  \ layer, NAMING that layer (never its\nconcurrent peer); each layer keeps its OWN\
  \ `timeout:` precedence chain, its own execution clock and its\nown outcome row,\
  \ appended in DECLARATION order (`per_layer_durations` reads the rows exactly as\
  \ before);\nthe group runs INSIDE the ONE SPEC-0132 §1 verify-admission slot the\
  \ land already holds ( — no\nsecond slot is taken per layer); and the shared journal\
  \ append a layer command makes through the engine\n`event` verb is serialized by\
  \ the E-0021 sidecar lock, so concurrent members cannot interleave a row.\nThe kernel\
  \ checks STANCE + SHAPE only (rule 3): it never verifies that the named layers are\
  \ in fact\nindependent — that assertion is the project's, on the same grounds as\
  \ `combined_candidate_safe` (a\nlayer is an arbitrary command, so inferring the\
  \ property would be a guess dressed as a guarantee).\n\n**The tests-sweep DELEGATION\
  \ (X-0297; a SUB-rule of `verify.layers[]`).** The kernel's own\nland-verify runs\
  \ a BARE sweep of the repo-root `tests/` dir — each `tests/test_*.py` executed as\n\
  `python3 <file>`, exit 0 = pass (the ENGINE suite convention). On a `-C` consumer\
  \ that sweep ran IN\nADDITION to the declared layers, making the root `tests/` a\
  \ SECOND de-facto verify home — contradicting\nrule 5 (`verify.layers` is the authoritative\
  \ land-verify home; never two live homes). It also forced a\nreal cost: a pytest/venv\
  \ consumer had to make EVERY test file script-runnable under the SYSTEM\n`python3`,\
  \ and its layer then re-ran the same suite properly (a double run per land).\n\n\
  **The rule.** When a consumer declares an EXECUTABLE layer (a non-empty `command:`,\
  \ not waived) whose\n`covers:` globs name the ROOT tests dir (first path segment\
  \ `tests`), that layer IS the verify for that\nsurface — so the land RUN DELEGATES\
  \ the bare sweep to it and SKIPS the sweep as redundant. This makes\nrule 5 TRUE\
  \ BY CONSTRUCTION for a covering consumer: one home, the declared layer. It is the\
  \ ONE case\nwhere `covers:` is load-bearing at the land RUN rather than report-only.\n\
  \n**NO verify hole — only the REDUNDANT half is skipped.** The layer itself still\
  \ runs (the land RUN over\n`verify.layers` is unchanged), so the tests stay verified\
  \ — by the layer that claims to cover them.\n\n**§DELEGATION-IS-A-DECLARATION —\
  \ the kernel never prints an unqualified PASS over a surface it did\nnot run (X-0860).**\
  \ The paragraph above is true about the LAYER and says nothing about the\nFILES:\
  \ `covers:` is the consumer's ASSERTION that the layer verifies `tests/`, and the\
  \ kernel\nverifies no execution behind it. Where that gap became a lie: <project>'s\
  \ layer was a hand-written\nscript registering each suite EXPLICITLY, one test file\
  \ had ZERO references in it, and `task test\n--run` printed `PASS — full subprocess\
  \ suite green` while that file was executed by NOTHING — four\nmutation-verified\
  \ tripwires shipped through `land` believing they were gated. Two obligations follow,\n\
  at EVERY delegating site (one renderer, so they cannot drift):\n\n1. **STATE THE\
  \ TRUST BOUNDARY, unconditionally.** The delegation note says the kernel did NOT\
  \ run the\n   files under `tests/` and does NOT verify the layer executed them,\
  \ and the `task test --run` PASS\n   line is QUALIFIED accordingly — «the declared\
  \ layer exited 0», never «the full subprocess suite is\n   green» (which, on this\
  \ branch, no longer describes anything that happened). This half is NEVER\n   suppressed\
  \ by a clean-looking check: an advisory is cheap by construction, and buying quiet\
  \ with a\n   suppression rule is the failure mode.\n2. **NAME WHAT IS PROVABLY UNREGISTERED,\
  \ and claim nothing more.** There is no generic execution\n   ledger — a layer is\
  \ an arbitrary command — so the kernel asks the NARROW PROVABLE question, «does\n\
  \   the layer's execution registry NAME this file?», reading the layer's `command:`\
  \ plus the in-repo\n   script(s) it names, TRANSITIVELY to a small depth cap (bounded:\
  \ repo-relative, worktree-contained,\n   depth-, size- and count-capped, and cycle-safe).\
  \ Depth 1 — the scripts the command names — is not\n   enough once a layer splits\
  \ into a DRIVER plus per-surface scripts, the split this kernel asks\n   consumers\
  \ to perform: the suites are then named one level further down, and a depth-1 read\
  \ accuses\n   files that all execute (<project> measured 37 of 38, X-0883 / X-0886).\
  \ The cap is REQUIRED, not\n   optional — an unbounded follow is what the bound\
  \ exists to refuse; it is a safety bound, never a\n   tuning knob.\n   The registry\
  \ read is over the UNION of the declared layers, never the delegated one alone\n\
  \   (X-0894). `covers:` names THE single layer that answers for `tests/`, but real\
  \ coverage\n   in a consumer is per-UNION: a covered file is routinely executed\
  \ BY A DIFFERENT declared layer.\n   Read singly, the check CRIES WOLF — <project>\
  \ moved `covers: [tests/**]` onto their `stack` layer\n   and 8 of 39 covered files\
  \ were reported unnamed while `scripts/verify-static.sh`, a SIBLING\n   layer, executes\
  \ all 8 by name (the host-side tripwires the in-container pytest cannot run). So\
  \ a\n   covered file counts as named when ANY EXECUTABLE declared layer's registry\
  \ names it; each layer\n   is walked under its OWN caps (a shared cap would let\
  \ one layer starve the next, and a starved\n   read removes text, which ACCUSES\
  \ more) and the per-layer texts are joined on a newline so no\n   cross-layer adjacency\
  \ forges a match. A WAIVED layer never joins the union — it does not run, so\n \
  \  naming a file there absolves nothing. There is no layer-count cap: capping would\
  \ re-create the\n   same false accusation one layer further out.\n   This widening\
  \ is a FALSE-ALARM fix, NOT a verify hole being patched — the error direction was\n\
  \   OVER-reporting — and it must stay one: when that union registry names >=1 covered\
  \ file the\n   declared layers demonstrably ENUMERATE their suites, and every covered\
  \ file named NOWHERE IN ANY\n   OF THEM is still reported BY NAME. When it names\
  \ none (a `pytest tests/`-style discovery runner)\n   NO per-file claim is made\
  \ at all. A union that reported zero for everything would have REMOVED\n   the check\
  \ rather than fixed it.\n\n**Registry-based in BOTH directions.** A textual mention\
  \ is not proof of execution — a comment or a\ndead branch can name a file that never\
  \ runs — so the report says a file is NOT NAMED IN THE REGISTRY,\nand a named file\
  \ is never rendered or implied as kernel-verified-as-executed.\n\n**§STAGE-6 READS\
  \ A WORKING TREE, LAND READS A COMMIT (X-1209).** The sibling clause above\nbounds\
  \ what `covers:` proves about EXECUTION. This one bounds what the Stage-6 mirror\
  \ proves about the\nINPUT, and it is a different gap: `task test --run` runs the\
  \ SAME checks `land` runs (the\n / / parity invariant), but it runs them at Stage\
  \ 6 — BEFORE the Stage-7 commit.\nSo a declared layer whose command reads COMMITTED\
  \ state (a `git diff <merge-base>..HEAD`) judges a tree\nthat does not yet contain\
  \ this task's work, and its exit 0 says nothing about the branch that will land.\n\
  Measured (<project>, 2026-08-31): the `file-size-limit` layer's script collected\
  \ over\n`<base>..HEAD`, the task's new 312-line test file was still untracked, the\
  \ layer passed, and the\nIDENTICAL command after the commit failed the same branch\
  \ — costing a post-commit in-scope split plus a\nre-audit on an already-RED card,\
  \ on that card's third dispatch. The Stage-6 output over that input was\nBYTE-IDENTICAL\
  \ to the output over a branch with nothing wrong on it; that indistinguishability\
  \ is the\ndefect, not the block. One obligation follows:\n\n**NAME THE UNCOMMITTED\
  \ PATHS INSIDE A LAYER'S OWN DECLARED SURFACE, and claim nothing more.** Whether\
  \ a\ngiven command reads committed state is UNPROVABLE from the kernel — a layer\
  \ is an arbitrary command —\nso the kernel asks the narrow provable question, «are\
  \ there paths inside this layer's own declared\nsurface whose content is in NO commit?»,\
  \ and says only that this Stage-6 result does not cover them and\nthat it cannot\
  \ rule out that the layer did not see them. The surface is the CONSUMER'S OWN declaration\n\
  (`subject_globs:` ∪ `covers:`), read with the same fnmatch idiom that decides whether\
  \ the layer RUNS —\nso ordinary bookkeeping dirt is excluded by construction rather\
  \ than by a hand-maintained ignore list,\nand a consumer that declared those paths\
  \ meant to. The remedy the note names is the consumer's: commit\nfirst and re-run,\
  \ or make the layer read the WORKING TREE plus untracked files, which is what the\n\
  kernel's own `_task_diff_files` already does. NO new field, no new gate, no verdict\
  \ — this is the same\nreport-only family as the clause above, with the same inverted\
  \ fail-safe direction (any doubt yields\nFEWER rows, never a fabricated one), so\
  \ the parity invariant is stated honestly rather than weakened.\n\n**REPORT-ONLY,\
  \ and it fails toward not accusing.** Nothing here joins a `bad` list, changes a\
  \ verdict\nor moves an exit path — so the / / Stage-6==land parity invariant holds\
  \ BY\nCONSTRUCTION. Note the fail-safe direction is INVERTED relative to the delegation\
  \ predicate above:\nthat predicate GUARDS an action, so any doubt runs the sweep\
  \ (fail-CLOSED); this is a SIGNAL\nDESCRIBING what a layer did, so any doubt makes\
  \ NO per-file claim — one false accusation gets the\nwhole signal skimmed, while\
  \ a missed detection only leaves the silence that already existed.\n\n**Every bare-sweep\
  \ site delegates, or the rule is a half-rule.** ONE predicate decides it, keyed\
  \ off by\nevery path that would otherwise bare-sweep a consumer tree: the `land`\
  \ candidate verify, its SPEC-0077\npinned last-green re-run (which fires precisely\
  \ when the diff touches `tests/**` or `yitc-ops.yaml` —\nthe change a delegating\
  \ consumer makes most), and the Stage-6 `task test --run` self-check (so the\n /\
  \ / Stage-6==land parity holds BY CONSTRUCTION, never re-encoded). The skip is\n\
  REPORTED, never silent: a gate that stops running must say so, and name the layer\
  \ now covering it.\n\n**Fail-CLOSED — any doubt runs the sweep.** No delegation\
  \ on: the engine's OWN build (inert); an\nabsent / unreadable / malformed carrier;\
  \ a SECTION-level `verify.waiver` (the land RUN short-circuits on\nit, so the layers\
  \ would NOT run — delegating there would leave the tests verified by nothing); a\n\
  layer that is waived, carries no executable `command:`, or names no `covers:` glob\
  \ under `tests/`; or\na layer that names `tests/` but whose whole `command:` PROVABLY\
  \ COVERS NOTHING.\n\n**RUNNING IS NOT COVERING.** The executability test above proves\
  \ a layer RUNS. It proves\nnothing about the layer being able to COVER the surface\
  \ it claims — so a layer declaring `covers:\n[tests/**]` with `command: 'true'`\
  \ passed every axis, SILENTLY REPLACED the bare sweep, and the land\nread green\
  \ while the suite that would have caught a defect never ran. Silent by construction:\n\
  nothing failed and nothing warned. So a layer whose whole `command:` is one of the\
  \ shell's own\nDO-NOTHING ATOMS does not delegate, and — since a gate that keeps\
  \ running owes the same account as\none that stops — the refusal is REPORTED, naming\
  \ the layer, its command and the carrier. It is never\na bare fall-through to the\
  \ sweep, which would be indistinguishable from a project that declared no\nrouting\
  \ at all.\n\n**The discriminator is a CLOSED ENUMERATION, and that bound is the\
  \ rule, not a shortfall.** It asks\nonly «is this command one of the shell's do-nothing\
  \ atoms?» — never «does this command look weak».\nAn unrecognised command (a script,\
  \ a test-runner invocation, a compound, an unparseable string) is\nNOT provably\
  \ a no-op and is HONOURED exactly as before, which is what keeps this fence from\
  \ becoming\nrefuse-all-routing; a shape like `sh -c true` is deliberately out of\
  \ reach, because widening the test\ninto a shell parser would re-introduce the guessing\
  \ the enumeration exists to remove. The kernel\nstill checks STANCE + SHAPE only\
  \ (rule 3): it judges no command's correctness, only whether the\ncommand IS the\
  \ null one.\n\n**The pinned re-run reads its ROUTING from the CANDIDATE carrier\
  \ (X-0657).** On the SPEC-0077\npinned last-green path the predicate runs over a\
  \ worktree whose `yitc-ops.yaml` is the LAST-GREEN\noverlay — while the candidate's\
  \ NEW test files SURVIVE in its `tests/` (the overlay restores last-green's\nfiles,\
  \ it does not delete extra ones). Evaluated on the last-green carrier alone, that\
  \ is a BOOTSTRAP\nTRAP: a consumer ADOPTING delegation in the SAME land as the test\
  \ file that needs it gets a fully GREEN\ncandidate verify and a RED pinned bare\
  \ sweep → LAND: ABORT, with no one-land route to adoption (the\nX-0657 incident:\
  \ <project>, both layers OK + 49 domain-unit probes green in-container). So on that\n\
  path, when the last-green carrier does not itself delegate, the ROUTING — WHICH\
  \ layer answers for\n`tests/` — is read from the CANDIDATE carrier, and honoured\
  \ ONLY IF that layer is one the LAST-GREEN\ncarrier will actually RUN (present,\
  \ non-waived, executable `command:`, no section-level waiver) AND\nwhose command\
  \ in the LAST-GREEN carrier is not a provable no-op (the §RUNNING IS NOT COVERING\
  \ axis\nabove). That last qualifier is not decorative: matching the routed NAME\
  \ against\nexecutability alone let a candidate route `tests/` to a last-green layer\
  \ that does nothing — the\nrouting face of the same hole, reachable by an operator\
  \ who lands the route by itself.\n\n**Why that is NOT a self-approval hole.** The\
  \ pinned CHECKS still come from last-green on BOTH halves —\nthe overlaid last-green\
  \ `tests/` files and the last-green `verify.layers` commands the land RUN executes\n\
  over the candidate subject. Only the ROUTING among those already-last-green layers\
  \ is read from the\ncandidate; a candidate cannot conjure a verifier. A candidate\
  \ that DELEGATES AWAY to nothing — naming a\nlayer that is absent, waived or commandless\
  \ in last-green, or delegating under a last-green section\nwaiver — routes to a\
  \ layer that will not run, so the predicate REFUSES, the bare sweep fires, and the\n\
  ABORT survives. Same ONE predicate, one optional `routing_from` carrier argument:\
  \ no second predicate,\nand the candidate verify + Stage-6 `task test --run` paths\
  \ are unchanged (they read one carrier only).\n\n**The `prep:` sub-field — per-layer\
  \ dependency-prep (X-0140; a SUB-rule of `verify.layers[]`,\nnot a new section).**\
  \ A `land`-verify layer runs inside a short-lived git worktree, but a frontend\n\
  layer's `node_modules` is git-ignored and therefore ABSENT in a freshly-created\
  \ worktree — so that\nlayer cannot run there (the X-0140 incident: a frontend layer\
  \ left un-wired at land, or hand-symlinked\nby workers, ships untested by the gate).\
  \ The `prep:` sub-field is the kernel fix: a per-layer\ndependency-preparation step\
  \ the land runner runs in the worktree BEFORE the layer's `command:`. It is\nDECLARE-OR-WAIVE,\
  \ the SAME fail-closed discipline the carrier uses, and checked ONLY IF PRESENT\
  \ (a\nlayer with NO `prep:` prepares nothing — the backward-compat default; a Dockerized\
  \ backend layer that\nbakes its deps into an isolated image needs none). This is\
  \ a SUB-rule of the existing `verify.layers[]`\ncontract (gate-specs finding [4]\
  \ — keep `prep` inside `verify.layers[]`, no new section/file/parser),\nauthored\
  \ as an IN-PLACE amend of this active spec (SPEC-0005 §7 in-place amend / one-home).\
  \ The kernel\nchecks the declared STANCE + structural SHAPE, never the command's/lockfile's\
  \ correctness (rule 3).\n\n- **DECLARE — a `prep:` mapping carrying a required non-empty\
  \ `mode:`** naming the built-in prep mode.\n  The kernel BUILT-IN mode in this slice\
  \ is **`npm-ci`**: the runner runs the equivalent of `npm ci`\n  INSIDE the worktree,\
  \ installing the layer's deps from the project LOCKFILE + the declared RUNTIME (a\n\
  \  CLEAN install from the lockfile — never a mutate-in-place `npm install`). OPTIONAL\
  \ keys pin the prep\n  inputs when they are not at the repo/layer default (shape-only,\
  \ never judged for value): `lockfile:`\n  (repo-relative path to the lockfile, e.g.\
  \ `frontend/package-lock.json`), `manifest:` (the\n  `package.json` path), `package_manager:`\
  \ (e.g. `npm`), `runtime:` (e.g. `node@20`), and `workdir:`\n  (the sub-directory\
  \ the install + layer command run in, e.g. `frontend`). OR\n- **WAIVE — a `waiver:`\
  \ mapping with a non-empty `reason:`** (a LOOSE per-layer-prep waiver — a layer\n\
  \  that legitimately needs no prep, e.g. a Dockerized backend that bakes deps into\
  \ its image).\n- A `prep:` carrying BOTH a `mode:` and a `waiver:` is a contradiction\
  \ → ERROR; a `prep:` carrying\n  NEITHER is an UNANSWERED prep → ERROR (the per-layer\
  \ fail-closed floor, rule 3). `prep:` ABSENT\n  entirely = the layer prepares nothing\
  \ (the checked-if-present backward-compat default — NOT an error,\n  distinct from\
  \ a present-but-empty `prep:`).\n\n**The machine-checkable prep record `verify_layer_prep`\
  \ (gate-specs finding [5] — the stable contract\nfield name).** When the runner\
  \ executes a layer's `prep`, it records a **`verify_layer_prep`**\nstate/event carrying:\
  \ the `layer:` key, the RESOLVED `lockfile_hash:` (the content hash of the lockfile\n\
  the deps were installed from), the `package_manager:` it used, and the `runtime:`\
  \ it matched. SPEC-0093\nfixes this record's NAME + fields HERE so the sibling land-runner\
  \ code card has a stable\ncontract to implement + emit, and the postcheck probe\
  \ is machine-checkable. No SPEC-0025 events-catalog\nedit is needed — the events\
  \ catalog is code-derived from emit call-sites, so `verify_layer_prep` enters\n\
  the catalog when emits it.\n\n**Fail-closed contract (no silent best-effort → no\
  \ false-green).** If ANY prep input dimension cannot be\nmatched — the manifest,\
  \ the lockfile, the package-manager, or the declared runtime is\nmissing / un-resolvable\
  \ / mismatched — the prep FAILS the land (the layer is NOT run best-effort against\n\
  the wrong deps). Clean-install-from-lockfile + fail-on-mismatch is exactly what\
  \ covers the 7\nauditor-named failure modes: native-addon rebuilds, platform-specific\
  \ optional packages, Node-version\ndrift, package-manager drift, postinstall side-effects,\
  \ stale lockfiles, and tests that mutate\n`node_modules`.\n\n**Deferred NON-scope\
  \ (named — gate-specs finding [1], later opt-in only).** Two optimizations are\n\
  EXPLICITLY out of this slice and NOT built pre-emptively (CHARTER §P1 F4 — add only\
  \ when a real\nland-time-cost incident pulls it): the shared **content-addressed\
  \ dependency store** (approach D — a\nwarm cache keyed by lockfile hash; needs locking\
  \ + GC + hash validation) and the **symlink / reuse-the-\nmain-checkout `node_modules`**\
  \ cache (approach A — cheapest but weakest: false-green under a lockfile /\nruntime\
  \ / platform / native-addon-ABI mismatch, unsafe under concurrent parallel lands\
  \ mutating one\nshared tree). Approach A is admissible LATER ONLY as an opt-in cache\
  \ guarded by an exact lockfile-hash +\nruntime match + read-only discipline + a\
  \ fall-back to `npm ci` on any mismatch — never the default. The\nslice-1 built-in\
  \ is the conservative per-worktree `npm ci` (approach C).\n\n**The `timeout:` sub-field\
  \ — a project DECLARES its land-verify bound (X-0204; a SUB-rule of\n`verify.layers[]`\
  \ + one OPTIONAL section scalar, not a new section).** `land` bounds every layer\
  \ command\nby a wall clock (the / SPEC-0071 hang guard — a verify must never hang\
  \ the gate forever). That\nbound was a GLOBAL 300s default, overridable ONLY by\
  \ the `YITC_VERIFY_TEST_TIMEOUT` env var — so a\nconsumer whose verify is legitimately\
  \ slower (a Docker bring-up running ~251s, passing standalone but\nflaky-timing-out\
  \ under land Docker-load) could only be rescued by a REMEMBERED env override on\
  \ every\nland: undurable, forgettable, and invisible to the carrier (the X-0204\
  \ incident, filed by <project>).\nA project may now declare that bound DURABLY,\
  \ in the carrier that already owns its verify policy:\n\n- **Per layer — an OPTIONAL\
  \ `timeout:`** on a DECLARED layer entry: positive seconds bounding THAT\n  layer's\
  \ `command:` (and its `prep:`, which shares the layer's budget). Shape-only: the\
  \ kernel checks\n  it is a positive number, never whether the number is big enough\
  \ (rule 3).\n  **HOW THE NUMBER IS CHOSEN is governed by SPEC-0208** (measured under\
  \ the declared worker/slot/share\n  tuple · predefined statistic + margin BAND ·\
  \ an upper bound so it cannot be inflated into inertness ·\n  provenance recorded\
  \ beside the declaration · invalidation when the tuple moves). The shape contract\n\
  \  here is UNCHANGED by it; this is a pointer to the calibration home, not a second\
  \ copy of it — read\n  `bin/yitc-v2 graph query SPEC-0208` before declaring or changing\
  \ a bound.\n- **Per project — an OPTIONAL section-level `timeout_seconds:`** on\
  \ the `verify:` section: the default\n  bound for every layer that declares no `timeout:`\
  \ of its own.\n- **PRECEDENCE, highest first:** the `YITC_VERIFY_TEST_TIMEOUT` env\
  \ ESCAPE HATCH · the layer's\n  `timeout:` · the section's `timeout_seconds:` ·\
  \ the 300s global default (whose VALUE is unchanged by\n  this rule). Env stays\
  \ on top by design: a per-host/CI operator override a committed declaration could\n\
  \  veto would not be an escape hatch.\n- **BOTH keys are OPTIONAL** — absent = the\
  \ prior global-only behaviour, unchanged (the checked-if-\n  present backward-compat\
  \ default; a pre-`timeout:` carrier still passes). Neither key participates in\n\
  \  the declare-or-waive stance: a timeout is a BOUND, not a probe, so omitting it\
  \ waives nothing.\n- **FAIL-CLOSED when present-but-malformed** — a declared timeout\
  \ is a positive UNQUOTED NUMBER: not\n  null, not a string (`timeout: \"900\"` is\
  \ a typo, not a declaration), not a bool (`timeout: true` is a\n  stance, not a\
  \ bound), not non-positive. The land runner's accepted set is EXACTLY the init shape\n\
  \  hook's: the land-time reader is never LOOSER than the declare-time check, else\
  \ a carrier `init`\n  rejects would still run at land. A bad section `timeout_seconds:`\
  \ fails the land BEFORE any layer\n  runs; a bad per-layer `timeout:` is that layer's\
  \ `malformed` outcome and its command does NOT run.\n  This is the OPPOSITE stance\
  \ from the env override's fail-SAFE fall-through (: an operator's\n  typo must never\
  \ disable the bound) — and deliberately so: a typo'd DECLARATION must never silently\n\
  \  revert to the global default it was written to replace, silently resurrecting\
  \ the flake it was\n  declared to fix. A timed-out layer's abort NAMES the effective\
  \ bound + how to raise it.\n\n**WAIVE — the whole concern (section-level).** The\
  \ section may instead carry a section-level `waiver:`\nwith a non-empty `reason:`\
  \ (a LOOSE bare reason — a project with no land-verify layer declared yet).\n\n\
  **Exclusivity (fail-closed, mirrors rule 8).** A `verify:` section MUST NOT carry\
  \ BOTH a `layers:`\ndeclaration AND a section-level `waiver:` — a non-empty `layers:`\
  \ XOR a section `waiver:`, never both →\nERROR. A `verify:` section present but\
  \ carrying NEITHER is also an ERROR (declare-or-waive is\nfail-closed, rule 3).\n\
  \nConcrete pinned shape (the kernel pins the SHAPE; a section waiver OR a non-empty\
  \ layers list):\n\n    verify:\n      timeout_seconds: 600 # OPTIONAL — the default\
