  - `graph build` **6.06 s**, which is ABOVE the 5 s mark named above — but that leg reads
    «a graph build that begins CONSUMING the journal AND exceeds 5 s», and this one is NOT
    journal-driven: measured by `strace`, one build reads events.jsonl 20,597,243 B in 14 reads
    (a bounded ~10 MB tail, twice — not the 110 MB file), and `cProfile` attributes the time to
    YAML loading + `_resolve_implements_anchor` regex (~2.9 s in `re.search` over 442 anchors)
    + 74 git subprocesses. Recording it as a literal reopen would fire the criterion on false
    grounds; it is a real but journal-INDEPENDENT slowdown, routed as its own observation.
  **Who decided and on what basis** (the acceptance requirement): decided by the
  dispatched Worker executing the owner-filed card, on the basis of (i) the
  measurements above, (ii) SPEC-0002 §Violations, which reserves PHYSICAL rotation to explicit owner
  approval, so a worker cannot self-authorize it, and (iii) the owner's own card wording, which
  admits the recorded-DEFER disjunct. The 2026-08-07 test-timeout incident (four lost builds)
  is NOT dismissed: it was a real size-driven incident, it was fixed AT SOURCE by hermetizing
  the two offending pinned tests ( — both landed), and it FIRES the second
  disjunct of the parked `return_trigger`, which is where the owner's rotation
  override decision lives. That routing is this task's followup, not a silent defer.

  ## Parameters

  | Parameter | Meaning | `consumed` |
  |---|---|---|
  | `JOURNAL_LIVE_WINDOW_DAYS` | age boundary separating the live segment from the archive (rule 2) | yes — read by the rotation seam |

  **THE VALUE, as a machine-readable token the rotation seam READS.** `consumed: true`
  means code reads a governing scalar FROM this spec, so the parameter needs a value HERE and not a
  constant in `bin/` — rule 2 says so in as many words: *the live window is a governing parameter, not
  a constant buried in code.* The token is read by `bin/lib/worktree.py#journal_live_window_days`, the
  same read-only text scan `views.py#_rotation_rereview_bound_mb` already performs on this same file
  for `ROTATION_VERDICT_REREVIEW_MB` — one carrier, one idiom, no second config path.

      JOURNAL_LIVE_WINDOW_DAYS: 7 # rule 2's live window. NOT a pick from the table above: 7 is the
                                    # FLOOR the existing readers impose — two journal readers declare
                                    # a seven-day horizon and the read-gate's tail window is seven
                                    # days, so any shorter window puts declared rows in the archive on
                                    # every ordinary read. Changing it is a governed spec edit.

  FAIL-CLOSED, and in the direction that cannot lose a row: a carrier or token that cannot be read
  yields no value and **rotation does not run**. It never falls back to a default, because a default
  would be exactly the decreed number rule 2 forbids, and a rotation on a guessed window would move
  rows a reader had declared it would find in the live file. Not rotating is always recoverable.

  **SET BY MEASUREMENT, and its floor is set by the READERS — not decreed.** Sensitivity over the
  authoring corpus, as git loose-object cost per commit against ~293 commits/day:

  | window | live rows | live raw | loose | GB/day | vs today |
  |---|---|---|---|---|---|
  | 1 d | 18,829 | 7.9 MB | 0.91 MB | 0.27 | 29.1x |
  | 3 d | 41,380 | 23.2 MB | 3.55 MB | 1.04 | 7.5x |
  | **7 d** | **82,449** | **43.3 MB** | **6.71 MB** | **1.97** | **4.0x** |
  | 14 d | 132,171 | 67.0 MB | 10.39 MB | 3.04 | 2.6x |
  | 30 d | 155,282 | 76.5 MB | 11.60 MB | 3.40 | 2.3x |

  A shorter window buys more, so the value is NOT chosen by picking the best row: **two journal
  readers declare a seven-day horizon and the read-gate's tail window is seven days**, so any window
  below that puts declared rows in the archive on every ordinary read. That is legal under rule 4, and
  it is also self-defeating — those readers would pay the archive read every time. Seven days is
  therefore the FLOOR the existing readers impose, and 4.0x is what the change buys at that floor.
  Recording the whole table rather than the chosen row, so a later reader can see the shape of the
  trade instead of re-deriving it. A different project resolves a different number from the same rule
  and the same method: measure the sensitivity, then take the floor its own readers impose.

  ## Rationale

  Held to what interprets the rules (SPEC-0005 rule 3); the deliberation, the rejected one-off cut,
  and the ratification history live in the proposing plan.

  - Rules 1-3 exist because the cost being removed is git-object churn, not parse time: a full parse
    of the whole file measured 1.45s, while ~293 commits/day each wrote a fresh ~6 MB loose object,
    and `.git` twice reached tens of gigabytes (42 GB over 34 blocked days; 16 GB one day after a
    clear). Read rule 2's age boundary against that: the ground for the change is UNBOUNDEDNESS,
    which is why a one-off cut cannot satisfy it and why the trigger cannot be a size.
  - Rule 5's phrasing is the one an earlier draft got wrong, and the correction is the point: the
    honest guarantee is multiset identity, and every downstream acceptance criterion must be phrased
    against it rather than against "identical output".
  - Rule 8 names a real, live instance rather than a hypothetical: a bound whose whole purpose is to
    expire a standing deferral by size, computed from a `.stat` of the journal file.
  - Rule 9 rests on measurement: two lands died the same day on journal-driven test timeouts (a 180s
    subprocess cap, and a 300s per-file cap against a 286s measured runtime — a 5% margin), the
    recorded suite total is 431.7 min across 879 files with 102 files at >=60s carrying 63% of it,
    and nine files grew 55-63% in one window on tests whose diffs did not change. The startup anchor
    pays it too: `session start` in a fresh worktree measured 2m27s and blocked a governed verb
    behind it.

  ## Verification

  - **Rule 1 / rule 7 (no second journal, citations survive) — phrased as a DIFFERENTIAL, because the
    absolute is already false.** Measured before any segmentation: of 201 well-formed historical
    `#ts=` citations sampled from the corpus, **176 resolve and 25 (12%) do not** — and every miss is
    in-range, so it is genuinely absent rather than older than the journal. The criterion is therefore
    **no citation that resolves TODAY may stop resolving after segmentation**, never "all citations
    resolve": a probe written against the absolute fails on a pre-existing condition this change
    neither caused nor promises to repair, which would make it unrunnable and eventually ignored.
    Differential: a citation pointing at a row now in the ARCHIVE half must resolve; if every sampled
    citation happens to sit in the live window, the probe proves nothing (122 of the resolving 176 sit
    in the archive half at a 7-day boundary, so a real sample is available).
    **The 12% is a SEPARATE finding, not this rule's business** — it means some `from:` citations
    already point at rows the journal does not carry. Recorded here because a reader of this rule must
    not mistake the differential for a claim that the chain is whole.
  - **Rule 4 / rule 5 (identity):** for each reader in the census, compare pre- and post-change
    output as MULTISETS over the real corpus. The differential needs BOTH directions: a deliberately
    DROPPED row must make the comparison fail, AND a deliberately DUPLICATED one must too. The second
    half is not symmetry for its own sake — measured on the real corpus, the journal contains **zero
    exact-duplicate lines**, so set-identity and multiset-identity coincide there today. A comparison
    written against SETS therefore passes on this corpus while being blind to duplication, and no
    natural input exists to catch the confusion. Plant it, or the probe cannot witness rule 5.
  - **Rule 6 (order-sensitive readers):** each such reader carries its own probe; the tail-window and
    latest-wins readers are the named instances.
  - **Rule 8 (the bound reads what its action moves, and the aggregate stays visible):** compute the
    governance bound after rotation and show it reads the LIVE SEGMENT, while the logical size is
    still REPORTED beside it as a trajectory carrying no trigger. Differential: two fixtures
    differing ONLY in live-segment size across the recorded bound must produce DIFFERENT verdicts
    (a probe that only checks the aggregate is present cannot witness this), and an aggregate over
    every threshold must contribute NO flagged action — the unsatisfiable-bound failure is what this
    probe exists to catch, alongside the vanished-aggregate one.
  - **Rule 9 (verify cost decoupled):** re-measure `tests/verify-durations.json` and show the named
    journal-driven files flat against a journal grown by a KNOWN amount. This is a differential, not
    an absolute: "the suite got faster" does not satisfy it, and an unchanged-but-decoupled suite
    does.
  - **Rules 2-3 (bounded growth, no manual intervention):** one week of ordinary concurrent operation
    with bounded `.git` growth and no manual gc, including at least one abandoned branch to exercise
    the unreachable-object path.
