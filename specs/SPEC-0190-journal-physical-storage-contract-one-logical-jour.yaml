  - `graph build` **~2.2 s** and it does NOT read events.jsonl at all (it walks
    `specs/`+`tasks/`+`decisions/` YAML — `graph_build_index` references no `EVENTS_PATH`), so
    the `> 5 s graph build` trigger above is UNCOUPLED from journal size.
  Decision: **defer rotation; keep ONE append-only journal** (CHARTER §Principle 5 — no parallel
  archive read-path, no second log). **SCOPED (additive amendment, SPEC-0084):** "no second log" forbids a
  second FORMAT / parser / discipline within a repo OPERATIONAL-STATE storage — NOT the kernel-owned
  SHARED coordination INSTANCE, which this entry schema GOVERNS IDENTICALLY (same envelope / provenance /
