body: |
  ## Scenario

  A consumer project adopts the methodology by PINNING the released handbook. The engine's own
  handbook (CHARTER · AGENTS · LIFECYCLE · QUEUE · GRAPH + the floor-trigger-map) is DEV-ENTANGLED —
  it carries development provenance (D-/T- artifact citations, host paths, host tokens) that is the
  engine's own development history, not methodology a consumer needs. So the engine publishes a
  RELEASE VIEW: a clean, identity-agnostic rendering of the same handbook, DERIVED from the single
  writable source, that a consumer can read as a methodology contract without inheriting V2-internal
  provenance.

  ## Internal

  THE RULE (the output contract + the strip ruleset). The generator is the SOLE writer of the release
  view; the engine handbook stays the ONE writable source (CHARTER §P5).

  1. SINGLE SOURCE, engine-only. The release view is cut from the ENGINE's own handbook (read from
     ENGINE_ROOT), NEVER from a rebound REPO_ROOT. `graph release-view` is ENGINE-ONLY: it REFUSES
     under `-C` (`_is_consumer_build` true) — a consumer pins the released view, it never regenerates
     it. Source-root = ENGINE_ROOT; output-root = `release-view/` under ENGINE_ROOT.

  2. INPUT SET, derived from existing carriers (no second source-of-truth list). The view covers the
     five handbook files (from `CANONICAL_DOCS`, itself derived from the single `HANDBOOK_READ_ORDER`
     carrier) PLUS the always-loaded `graph/floor-trigger-map.md` seed. No hand-maintained second copy
     of the file list.

  3. DERIVED, never a fork. `release-view/` is a committed derived artifact (CHARTER §P5 — derived
     artifacts are committed, never.gitignored), regenerated by `graph build` AND land's derived-regen
     (§6) and freshness-checked by `graph conformance`. It is NOT a separate authoring home; editing it
     by hand is forbidden (it is overwritten on regen).

  4. IDENTITY-AGNOSTIC OUTPUT CONTRACT. Each released file is grep-clean of dev-provenance:
     - NO `from: T-` commit-trailer shape;
     - NO `D-NNNN` / `T-NNNN` artifact citations (dev provenance);
     - NO `<host-home>` (or other host home) absolute paths;
     - NO host-specific tokens (IPv4 addresses, `<host-token>
     - NO V1-incident cites (V1 tracker bug-ids `B-NNNNN`, incident-timestamp provenance refs).
     - NO provider/tool BRAND tokens (provider-neutral per CHARTER §P4b): no `the AI provider*` (`<vendor-adapter>.md`,
       `CLAUDE_CODE_*`), no `<provider-config>` config-dir paths, no external-auditor tool brand (`<external-auditor>`), no
       `the provider` / bare provider brand word.
     While PRESERVING the full methodology content (the rule prose of all six files) AND the `SPEC-NNNN`
     identifiers (specs TRAVEL as part of core — they are not dev provenance). Re-generation is
     DETERMINISTIC: identical source → byte-identical output (no timestamps / randomness in the view).

     4a. THE CONTRACT EXTENDS TO THE TRAVELLING ENGINE CODE, and the PUBLISH SEAM enforces it
       (additive). Rule 4 above was written for the released handbook DOCS; but `bin/` is
       kernel-realm and travels to every consumer, so an engine-code default spelled as this host's
       absolute path is inherited verbatim by a machine where that path does not exist. The
       identity-agnostic output contract therefore applies to EVERY released file, the engine CODE
       included — the same grep-clean bar, on the same reasoning.
       Two enforcement points, deliberately at different moments:
       - the STANDING guard `tests/test_engine_code_host_path_guard.py` — an AST walk refusing a host
         absolute path in any non-docstring string constant under `bin/**`, with a report-only soft arm
         over docstrings and comments (a comment that CITES an incident verbatim is provenance, not a
         default, and abstracting it would falsify the record);
       - the PUBLISH SEAM — `work publish` runs that same check over the CUT and REFUSES to publish,
         NAMING the offending file(s), so a release is never cut from a tree the guard fails. Fail-closed:
         a module in the cut that will not parse is REFUSED, not skipped, because an unparseable module
         is exactly where a literal would hide.
       The seam is the publish-time half of the standing guard, not a second rule: both judge the same
       property with the same semantics, and a release that reaches a consumer has passed it twice.

  5. THE STRIP RULESET (`_release_view_strip`) — ordered, pure, deterministic passes:
     (a) host paths → abstracted placeholders (`<repo-root>` / `<host-home>`);
     (b) host tokens (IPv4 / `<host-token>
     (b2) provider/tool BRAND tokens neutralized (CHARTER §P4b): `<vendor-adapter>.md`→`<vendor-adapter>.md`,
          `CLAUDE_CODE_*`→`<provider-session-env>`, `<provider-config>`→`<provider-config>`, `<external-auditor>`→`<external-auditor>`,
          `the provider`/bare `the AI provider`→provider-neutral (ordered most-specific-first);
     (c) `from: T-NNNN` trailer → `from: <durable artifact>`;
     (d) D-/T- citations removed — provenance-only parentheticals dropped whole; mixed parentheticals
         keep their non-provenance content (and any SPEC ids); standalone D-/T- ids swept; SPEC ids kept;
     (d2) V1-incident cites removed — V1 tracker bug-ids (`B-NNNNN`) and incident-timestamp
          references (an ISO-8601 instant cited as deviation/incident provenance) are swept (the
          acceptance bar: a released file carries no V1-incident cite);
     (e) tidy — emptied punctuation / doubled separators / trailing space collapsed deterministically.
     The ruleset targets the grep-clean + content-preserved + deterministic bar above; it is NOT a
     prose-perfection pass (a citation that was a sentence's grammatical subject may leave minor
     roughness — methodology content is preserved, which is the contract).

  5b. THE PER-DOC CONSUMER-CORRECTNESS PASS — a pass applied to ONE named doc of the cut,
     AFTER the §5 strip, for a statement whose MEANING differs in a consumer's session. Today there is
     exactly one: the always-loaded `graph/floor-trigger-map.md` (the §7-delivered seed). Its bound rows
     name KERNEL specs by BARE id, and a bare `graph query SPEC-XXXX` in a `-C` session resolves
     consumer-own-FIRST (SPEC-0092) — so a consumer that owns a spec at the same id silently fetched the
     WRONG document while obeying the row correctly. `_release_view_floor_kernel_explicit` rewrites each
     bound row to SPEC-0092's EXISTING kernel-explicit command `bin/yitc-v2 graph query --kernel <SPEC-ID>`
     (and names that form in the how-to-read line), so the row's meaning is true by construction of the
     command it emits. Same purity bar as §5: pure, deterministic, idempotent — identical source still
     yields byte-identical output, so §6's drift check is unaffected. CONSUMER-FACING ONLY: the engine's
     own committed `graph/floor-trigger-map.md` is untouched (`--kernel` is a no-op in the engine's own
     session), and bare-lookup resolution order is NOT changed anywhere.

  6. FRESHNESS. `release-view/` is regenerated on BOTH the explicit `graph build` AND land's
     derived-regen (`_auto_rebuild_graph`) — because it is a PURELY-DERIVED artifact (the generator is
     its sole writer, §3), so it belongs in the same derived-regen+fold path as `graph/index.json`, NOT
     with the explicit-build-only AGENTS.md read-order / placement-manifest regen (those are AUTHORED
     canonical files whose managed regions land must not clobber). The land regen is engine-only +
     complete-handbook-guarded (a consumer pins the released view; a partial repo is tolerated without a
     partial view); the regenerated paths are in `_BOOKKEEPING_ALLOWLIST` + `_DERIVED_MERGE_ARTIFACTS`, so
     land folds + auto-resolves them. So a canonical-handbook change reaches `main` with a FRESH view (it
     was previously stale-on-main, consumer-visible — the E-0034 defect). `graph conformance` re-derives
     the view in-memory and STILL fails (non-zero) if the committed `release-view/` diverges — the
     deterministic backstop is unchanged.
     The drift check is BIDIRECTIONAL (content mismatch, MISSING expected file, AND an EXTRA/stale file
     the generator no longer emits). `_build_release_view` FAILS HARD if any expected source is absent —
     completeness is all-or-nothing, never a silent partial view (the explicit verb fail-hards; `graph
     build` skips regen on an incomplete handbook so a partial repo is tolerated without a partial view).

  7. CONSUMER DELIVERY (the view is what a -C consumer actually READS). A -C consumer's session-start
     methodology seed — the five handbook files + the always-loaded `graph/floor-trigger-map.md` —
     resolves from the release-view (`ENGINE_ROOT/release-view/<rel>`), NEVER the raw engine handbook.
     The single resolver `_kernel_handbook_file` returns the release-view path under `-C`
     (`_is_consumer_build` true) and `REPO_ROOT/<rel>` on engine self-build (byte-unchanged). It is
     FAIL-CLOSED: a missing release-view file is reported against the release-view path, never silently
     resolved to the raw dev-entangled engine handbook (nor the consumer's own product file). So the
     consumer reads the identity-agnostic contract (§4), not V2-dev provenance — the §4 output contract
     is what gets DELIVERED, closing F-002 part 2.

  ## Rationale

  F-002 + external audit 2026-06-15 MED-4: the only handbook was the dev-entangled one, so a consumer
  pointed at it (the interim echo) read V2-internal provenance, not a clean contract. Design
  home: plan `export-slice-contract-and-core-authoring-model` §2 (`core = a RELEASE VIEW cut from the
  single source`; ONE writable source — P5). The derived-artifact + conformance model reuses the
  existing `graph build` / floor-trigger-map analog (CHARTER §P1 F1 — extend, don't add parallel).

  ## Verification

  - `bin/yitc-v2 graph release-view` emits `release-view/` files that are grep-clean of every token
    class in §4 AND preserve the per-file methodology anchors + ≥1 SPEC id; re-running is byte-identical.
  - `bin/yitc-v2 graph release-view -C <checkout>` exits non-zero (engine-only, §1).
  - `bin/yitc-v2 graph build` regenerates `release-view/`; `bin/yitc-v2 graph conformance` fails when
    the committed view diverges from the freshly re-derived one (§6).
  - The six SOURCE handbook files are byte-unchanged after generation (single writable source).
  - Probe test: `tests/test_release_view.py` exits 0.

