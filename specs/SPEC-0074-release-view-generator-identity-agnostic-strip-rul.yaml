body: "## Scenario\n\nA consumer project adopts the methodology by PINNING the released\
  \ handbook. The engine's own\nhandbook (CHARTER · AGENTS · LIFECYCLE · QUEUE · GRAPH\
  \ + the floor-trigger-map) is DEV-ENTANGLED —\nit carries development provenance\
  \ (D-/T- artifact citations, host paths, host tokens) that is the\nengine's own\
  \ development history, not methodology a consumer needs. So the engine publishes\
  \ a\nRELEASE VIEW: a clean, identity-agnostic rendering of the same handbook, DERIVED\
  \ from the single\nwritable source, that a consumer can read as a methodology contract\
  \ without inheriting V2-internal\nprovenance.\n\n## Internal\n\nTHE RULE (the output\
  \ contract + the strip ruleset). The generator is the SOLE writer of the release\n\
  view; the engine handbook stays the ONE writable source (CHARTER §P5).\n\n1. SINGLE\
  \ SOURCE, engine-only. The release view is cut from the ENGINE's own handbook (read\
  \ from\n   ENGINE_ROOT), NEVER from a rebound REPO_ROOT. `graph release-view` is\
  \ ENGINE-ONLY: it REFUSES\n   under `-C` (`_is_consumer_build` true) — a consumer\
  \ pins the released view, it never regenerates\n   it. Source-root = ENGINE_ROOT;\
  \ output-root = `release-view/` under ENGINE_ROOT.\n\n2. INPUT SET, derived from\
  \ existing carriers (no second source-of-truth list). The view covers the\n   five\
  \ handbook files (from `CANONICAL_DOCS`, itself derived from the single `HANDBOOK_READ_ORDER`\n\
  \   carrier) PLUS the always-loaded `graph/floor-trigger-map.md` seed. No hand-maintained\
  \ second copy\n   of the file list.\n\n3. DERIVED, never a fork. `release-view/`\
  \ is a committed derived artifact (CHARTER §P5 — derived\n   artifacts are committed,\
  \ never.gitignored), regenerated by `graph build` AND land's derived-regen\n   (§6)\
  \ and freshness-checked by `graph conformance`. It is NOT a separate authoring home;\
  \ editing it\n   by hand is forbidden (it is overwritten on regen).\n\n4. IDENTITY-AGNOSTIC\
  \ OUTPUT CONTRACT. Each released file is grep-clean of dev-provenance:\n   - NO\
  \ `from: T-` commit-trailer shape;\n   - NO `D-NNNN` / `T-NNNN` artifact citations\
  \ (dev provenance);\n   - NO `<host-home>` (or other host home) absolute paths;\n\
  \   - NO host-specific tokens (IPv4 addresses, `<host-token>\n   - NO V1-incident\
  \ cites (V1 tracker bug-ids `B-NNNNN`, incident-timestamp provenance refs).\n  \
  \ - NO provider/tool BRAND tokens (provider-neutral per CHARTER §P4b): no `the AI\
  \ provider*` (`<vendor-adapter>.md`,\n     `CLAUDE_CODE_*`), no `<provider-config>`\
  \ config-dir paths, no external-auditor tool brand (`<external-auditor>`), no\n\
  \     `the provider` / bare provider brand word.\n   - NO PROJECT IDENTITY of the\
  \ publishing host : no name or domain of a project its\n     project registry registers\
  \ — abstracted in prose and provenance positions, REFUSED in values\n     (§4b).\n\
  \   While PRESERVING the full methodology content (the rule prose of all six files)\
  \ AND the `SPEC-NNNN`\n   identifiers (specs TRAVEL as part of core — they are not\
  \ dev provenance). Re-generation is\n   DETERMINISTIC: identical source → byte-identical\
  \ output (no timestamps / randomness in the view).\n\n   4a. THE CONTRACT EXTENDS\
  \ TO THE TRAVELLING ENGINE CODE, and the PUBLISH SEAM enforces it\n     (additive).\
  \ Rule 4 above was written for the released handbook DOCS; but `bin/` is\n     kernel-realm\
  \ and travels to every consumer, so an engine-code default spelled as this host's\n\
  \     absolute path is inherited verbatim by a machine where that path does not\
  \ exist. The\n     identity-agnostic output contract therefore applies to EVERY\
  \ released file, the engine CODE\n     included — the same grep-clean bar, on the\
  \ same reasoning.\n     Two enforcement points, deliberately at different moments:\n\
  \     - the STANDING guard `tests/test_engine_code_host_path_guard.py` — an AST\
  \ walk refusing a host\n       absolute path in any non-docstring string constant\
  \ under `bin/**`, with a report-only soft arm\n       over docstrings and comments\
  \ (a comment that CITES an incident verbatim is provenance, not a\n       default,\
  \ and abstracting it would falsify the record);\n     - the PUBLISH SEAM — `work\
  \ publish` runs that same check over the CUT and REFUSES to publish,\n       NAMING\
  \ the offending file(s), so a release is never cut from a tree the guard fails.\
  \ Fail-closed:\n       a module in the cut that will not parse is REFUSED, not skipped,\
  \ because an unparseable module\n       is exactly where a literal would hide.\n\
  \     The seam is the publish-time half of the standing guard, not a second rule:\
  \ both judge the same\n     property with the same semantics, and a release that\
  \ reaches a consumer has passed it twice.\n\n   4b. PROJECT IDENTITY IS DEV PROVENANCE\
  \ (additive). The projects the publishing host runs\n     were cited across the\
  \ travelling corpus as the source of an incident or a measurement, and every\n \
  \    release carried their names and production domains to a public mirror — meaningless\
  \ to an\n     adopter, a map of what runs where to a stranger.\n     - OPERANDS\
  \ — derived on the publishing host at publish time, never written into the corpus\
  \ (a\n       list in `bin/` would ship the names it guards): from the host project\
  \ registry's `projects:`\n       map ONLY — each entry's key, the basename of its\
  \ `path` as registered and as resolved, every\n       `domains:` value\n       (`release.project_identity_operands`).\
  \ Two exclusions, each reported with its reason: the entry\n       whose path is\
  \ the engine repository (the methodology's own name travels by definition), and\
  \ a\n       GENERIC name — every `-` part an ordinary word (`website`, `server-bot`,\
  \ `dev-dashboard`), which\n       running prose uses as that word. A generic project's\
  \ DOMAINS still count.\n     - MATCHING (`release.abstract_project_identity`) —\
  \ a domain with any subdomain labels in front of\n       it (wildcard `*.` and service\
  \ `_x.` labels included, a leading dot too), then a name wherever no\n       LETTER\
  \ flanks it, both case-insensitive. COMPOUND-TOKEN BOUNDARY : `_`, a digit, `-`\n\
  \       and `/` are separators, so a name inside a compound token — `name_x`, `name2`,\
  \ `x-name`,\n       `x/name2` — counts in every position, abstracted as provenance\
  \ and refused as a value (a\n       whole-token boundary let two names reach a published\
  \ release inside such tokens). A domain\n       keeps its DNS-label boundary — another\
  \ label is another domain. The generic exclusion is\n       unchanged: an excluded\
  \ name is no operand, so its compounds are never touched.\n       Only the two canonical\
  \ placeholders are protected — including a\n       placeholder the domain pass just\
  \ wrote — so a name inside any other `<...>` is still caught; a\n       non-UTF-8\
  \ blob is matched on the operands' own UTF-8 bytes.\n     - ABSTRACTED — every PROVENANCE\
  \ position: published prose (patterns, specs, views, onboarding, the\n       handbook\
  \ release view, the published graph index), the comment lines of a machine-read\
  \ file,\n       and the comments + docstrings of engine code — a domain to `<project-domain>`,\
  \ a name to\n       `<project>` (`release.strip_published_text`). In engine code\
  \ the rewrite is kept ONLY when the\n       module re-parses to the same AST modulo\
  \ docstrings: rule 4a's asymmetry exactly — a comment or\n       docstring is provenance,\
  \ never behaviour. A shebang and a coding cookie are READ by the OS and\n      \
  \ the parser, so they are values, not comments: kept verbatim, refused if they name\
  \ a project.\n     - REFUSED, never rewritten — every VALUE: an engine-code string\
  \ constant, a machine-read value, a\n       non-UTF-8 blob, a published path. `release.published_project_identity`\
  \ judges the WHOLE final\n       tree and `work publish` refuses naming each file:line\
  \ and token; the fix is at the source (a\n       role word such as \"a consumer\"\
  , or `<project>`).\n     - METADATA — the publish COMMIT and its annotated TAG travel\
  \ with the tree, so they are\n       published surfaces too. `work publish` writes\
  \ both under ONE fixed neutral release identity\n       (`release.RELEASE_IDENTITY`),\
  \ never the publishing host's, with host git hooks disabled; it\n       REFUSES,\
  \ before anything is written, a commit or tag identity, message or tag name that\
  \ carries\n       a registered name or domain (`release.published_metadata_identity`,\
  \ the same matcher); after\n       writing it reads both objects back and refuses,\
  \ before the publish is journaled, when what was\n       written is not what was\
  \ checked (`release.written_metadata_mismatches`).\n     - FAIL-CLOSED on the inventory\
  \ — an ABSENT or unreadable registry refuses the publish (a missing\n       inventory\
  \ never reads as \"nothing to protect\"); a readable `projects: {}` is the one explicit\n\
  \       judged-nothing input.\n     - REPRODUCIBILITY — the operands are host-derived\
  \ exactly as rule 5(a)'s home-path operands are,\n       so the published bytes\
  \ are a function of the tag AND the workshop registry. SPEC-0195 rule 5\n      \
  \ states that rebuild input; `release_published` journals the operand counts and\
  \ fingerprint\n       (`release.project_identity_fingerprint` — never the names),\
  \ so a rebuild proves it used the same.\n\n5. THE STRIP RULESET (`_release_view_strip`)\
  \ — ordered, pure, deterministic passes:\n   (a) host paths → abstracted placeholders\
  \ (`<repo-root>` / `<host-home>`);\n   (b) host tokens (IPv4 / `<host-token>\n \
  \  (b2) provider/tool BRAND tokens neutralized (CHARTER §P4b): `<vendor-adapter>.md`→`<vendor-adapter>.md`,\n\
  \        `CLAUDE_CODE_*`→`<provider-session-env>`, `<provider-config>`→`<provider-config>`,\
  \ `<external-auditor>`→`<external-auditor>`,\n        `the provider`/bare `the AI\
  \ provider`→provider-neutral (ordered most-specific-first). A repo path\n      \
  \  (`patterns/…` / `specs/…`) or a URL is NOT prose: it is masked for this pass\
  \ and kept\n        verbatim, since its spelling is what resolves it ( — rewriting\
  \ it shipped a dead\n        path). The rule-4 brand bar applies to prose, never\
  \ to a path or address;\n   (c) `from: T-NNNN` trailer → `from: <durable artifact>`;\n\
  \   (d) D-/T- citations removed — provenance-only parentheticals dropped whole;\
  \ mixed parentheticals\n       keep their non-provenance content (and any SPEC ids);\
  \ standalone D-/T- ids swept; SPEC ids kept;\n   (d2) V1-incident cites removed\
  \ — V1 tracker bug-ids (`B-NNNNN`) and incident-timestamp\n        references (an\
  \ ISO-8601 instant cited as deviation/incident provenance) are swept (the\n    \
  \    acceptance bar: a released file carries no V1-incident cite);\n   (e) tidy\
  \ — emptied punctuation / doubled separators / trailing space collapsed deterministically.\n\
  \   The ruleset targets the grep-clean + content-preserved + deterministic bar above;\
  \ it is NOT a\n   prose-perfection pass (a citation that was a sentence's grammatical\
  \ subject may leave minor\n   roughness — methodology content is preserved, which\
  \ is the contract).\n\n5b. THE PER-DOC CONSUMER-CORRECTNESS PASS — a pass applied\
  \ to ONE named doc of the cut,\n   AFTER the §5 strip, for a statement whose MEANING\
  \ differs in a consumer's session. Today there is\n   exactly one: the always-loaded\
  \ `graph/floor-trigger-map.md` (the §7-delivered seed). Its bound rows\n   name\
  \ KERNEL specs by BARE id, and a bare `graph query SPEC-XXXX` in a `-C` session\
  \ resolves\n   consumer-own-FIRST (SPEC-0092) — so a consumer that owns a spec at\
  \ the same id silently fetched the\n   WRONG document while obeying the row correctly.\
  \ `_release_view_floor_kernel_explicit` rewrites each\n   bound row to SPEC-0092's\
  \ EXISTING kernel-explicit command `bin/yitc-v2 graph query --kernel <SPEC-ID>`\n\
  \   (and names that form in the how-to-read line), so the row's meaning is true\
  \ by construction of the\n   command it emits. Same purity bar as §5: pure, deterministic,\
  \ idempotent — identical source still\n   yields byte-identical output, so §6's\
  \ drift check is unaffected. CONSUMER-FACING ONLY: the engine's\n   own committed\
  \ `graph/floor-trigger-map.md` is untouched (`--kernel` is a no-op in the engine's\
  \ own\n   session), and bare-lookup resolution order is NOT changed anywhere.\n\n\
  5c. THE PUBLISHED CITE-CLOSURE REWORD — a tree-level pass run at the end of the\
  \ publish-time\n   strip, where the published spec set is finally known. Placement\
  \ stands: a spec that does not\n   travel is NOT re-pinned so that a cite can resolve;\
  \ the cite is reworded instead. In every\n   published `patterns/*.md` and `specs/*.yaml`,\
  \ a SPEC id the release does not carry is DROPPED only\n   from the pure graph-edge\
  \ fields (the `cites` / `requires` lists, a `supersedes` / `superseded_by`\n   scalar);\
  \ everywhere else — body prose, any other key or list item, a mapping key — it is\
  \ replaced\n   IN PLACE by the placeholder `<workshop-spec>`, so no non-edge value\
  \ is ever deleted (a key whose\n   reword would collide with a sibling is left as\
  \ is). Pure, deterministic, idempotent (the\n   placeholder carries no id). The\
  \ publish refusal that closes the init + seed surfaces covers these\n   files too,\
  \ as the backstop naming any id the reword could not reach (a non-UTF-8 blob).\n\
  \   Its PATH sibling : a `patterns/…` or `specs/…` file path named in a published\
  \ spec\n   must be a file the release carries, else the publish is refused before\
  \ any write, naming each\n   path and the spec naming it. A placeholder template\
  \ and an id-shaped `specs/SPEC-NNNN…` path\n   are exempt (the id closure above\
  \ already governs those).\n\n6. FRESHNESS. `release-view/` is regenerated on BOTH\
  \ the explicit `graph build` AND land's\n   derived-regen (`_auto_rebuild_graph`)\
  \ — because it is a PURELY-DERIVED artifact (the generator is\n   its sole writer,\
  \ §3), so it belongs in the same derived-regen+fold path as `graph/index.json`,\
  \ NOT\n   with the explicit-build-only AGENTS.md read-order / placement-manifest\
  \ regen (those are AUTHORED\n   canonical files whose managed regions land must\
  \ not clobber). The land regen is engine-only +\n   complete-handbook-guarded (a\
  \ consumer pins the released view; a partial repo is tolerated without a\n   partial\
  \ view); the regenerated paths are in `_BOOKKEEPING_ALLOWLIST` + `_DERIVED_MERGE_ARTIFACTS`,\
  \ so\n   land folds + auto-resolves them. So a canonical-handbook change reaches\
  \ `main` with a FRESH view (it\n   was previously stale-on-main, consumer-visible\
  \ — the E-0034 defect). `graph conformance` re-derives\n   the view in-memory and\
  \ STILL fails (non-zero) if the committed `release-view/` diverges — the\n   deterministic\
  \ backstop is unchanged.\n   The drift check is BIDIRECTIONAL (content mismatch,\
  \ MISSING expected file, AND an EXTRA/stale file\n   the generator no longer emits).\
  \ `_build_release_view` FAILS HARD if any expected source is absent —\n   completeness\
  \ is all-or-nothing, never a silent partial view (the explicit verb fail-hards;\
  \ `graph\n   build` skips regen on an incomplete handbook so a partial repo is tolerated\
  \ without a partial view).\n\n7. CONSUMER DELIVERY (the view is what a -C consumer\
  \ actually READS). A -C consumer's session-start\n   methodology seed — the five\
  \ handbook files + the always-loaded `graph/floor-trigger-map.md` —\n   resolves\
  \ from the release-view (`ENGINE_ROOT/release-view/<rel>`), NEVER the raw engine\
  \ handbook.\n   The single resolver `_kernel_handbook_file` returns the release-view\
  \ path under `-C`\n   (`_is_consumer_build` true) and `REPO_ROOT/<rel>` on engine\
  \ self-build (byte-unchanged). It is\n   FAIL-CLOSED: a missing release-view file\
  \ is reported against the release-view path, never silently\n   resolved to the\
  \ raw dev-entangled engine handbook (nor the consumer's own product file). So the\n\
  \   consumer reads the identity-agnostic contract (§4), not V2-dev provenance —\
  \ the §4 output contract\n   is what gets DELIVERED, closing F-002 part 2.\n   OUTPUT\
  \ NAMES. The view publishes NO file under a name an AI tool attaches on its own\n\
  \   when a file inside that directory is read — the agent-instructions name `AGENTS.md`,\
  \ or a\n   vendor-adapter file name. A file so named is attached beside the commanded\
  \ read, so a consumer\n   session loaded that part twice at start and again at every\
  \ post-`/compact` re-read. A source doc\n   carrying such a name is PUBLISHED under\
  \ a release-view name taken from ONE output-name map\n   (`bin/lib/graph.py#release_view_name`;\
  \ today `AGENTS.md` is published as `AGENTS-STARTUP.md`).\n   That one map names\
  \ the part wherever a release-view path is formed: the builder's output path,\n\
  \   `_kernel_handbook_file`, the `-C` read-order echo, the commanded-read journal\
  \ target, and the\n   derived-path set land folds. Inside the view's own text a\
  \ mention of the source name is rewritten\n   to the published name, EXCEPT a mention\
  \ naming a consumer's OWN file (the project `AGENTS.md`, its\n   SPEC-0125 operating-context\
  \ home). SOURCE names (`HANDBOOK_READ_ORDER`) never change, and the\n   engine's\
  \ own session — which reads the source files — is unaffected. Regeneration prunes\
  \ a\n   retired source-named copy, so the §6 drift check never meets the part under\
  \ two names.\n\n## Rationale\n\nF-002 + external audit 2026-06-15 MED-4: the only\
  \ handbook was the dev-entangled one, so a consumer\npointed at it (the interim\
  \ echo) read V2-internal provenance, not a clean contract. Design\nhome: plan `export-slice-contract-and-core-authoring-model`\
  \ §2 (`core = a RELEASE VIEW cut from the\nsingle source`; ONE writable source —\
  \ P5). The derived-artifact + conformance model reuses the\nexisting `graph build`\
  \ / floor-trigger-map analog (CHARTER §P1 F1 — extend, don't add parallel).\n\n\
  ## Verification\n\n- `bin/yitc-v2 graph release-view` emits `release-view/` files\
  \ that are grep-clean of every token\n  class in §4 AND preserve the per-file methodology\
  \ anchors + ≥1 SPEC id; re-running is byte-identical.\n- `bin/yitc-v2 graph release-view\
  \ -C <checkout>` exits non-zero (engine-only, §1).\n- `bin/yitc-v2 graph build`\
  \ regenerates `release-view/`; `bin/yitc-v2 graph conformance` fails when\n  the\
  \ committed view diverges from the freshly re-derived one (§6).\n- The six SOURCE\
  \ handbook files are byte-unchanged after generation (single writable source).\n\
  - No released file is named `AGENTS.md` or a vendor-adapter file name; the AGENTS\
  \ part is\n  `release-view/AGENTS-STARTUP.md`, and with the output-name map emptied\
  \ the builder emits\n  `release-view/AGENTS.md` again (§7 OUTPUT NAMES — the differential).\n\
  - Probe test: `tests/test_release_view.py` exits 0.\n"
