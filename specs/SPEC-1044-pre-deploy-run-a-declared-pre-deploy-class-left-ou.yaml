id: SPEC-1044
title: Pre-deploy run — a declared pre-deploy class, left out of land and Stage-6
  runs even when they run forced full, and a deploy to a guarded target that first
  runs the full verify plus that class on the exact revision it ships
status: active
created_at: 2026-10-24 09:01:00+00:00
travels: null
consumed: false
extension: null
implements:
