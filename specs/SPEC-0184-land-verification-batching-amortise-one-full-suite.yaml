body: "## Scenario\n\nSeveral changes are ready to land at the same moment. Today\
  \ each waits for the one ahead, then pays\nthe full pinned suite by itself — so\
  \ five queued changes cost five full passes and the last one waits\nfor four. Under\
  \ this spec the changes waiting when the slot frees are verified TOGETHER, as one\n\
  candidate, in ONE pass; if it is green they all land. Nobody skips verification\
  \ and nobody's change\nreaches `main` untested — the cost is shared, not waived.\n\
  \n## Internal\n\nTHE BATCH IS WHOEVER IS QUEUED — nine rules (rule 8 added by :\
  \ the amortised pass is only a saving if the members do not each re-pay it afterwards;\
  \ rule 9 by : which change the batch forms AROUND must be decided by cost, not by\
  \ arrival order).\n\n**What SPEC-0186 resolves to `never` is INERT for class assignment\
  \ — the pinned-supersession key AND\nthe cost ladder's two-pass rung alike.** Class\
  \ assignment reads the project's\n`verify_policy.pinned_last_green` through the\
  \ SAME resolver the land verify path uses (one authority,\nread from the base tree\
  \ at every call site), so a member is NOT isolated one-at-a-time for a check that\n\
  will not run — whether it was carrying the supersession key or merely touching the\
  \ verifier's own\nsurface (rule 9). This spec remains the ONE normative home for\
  \ HOW batches form and for the class set;\nSPEC-0186 supplies only that policy input.\
  \ Navigational pointer, not a second rule (SPEC-0005 rule 8).\n\n**Red-batch BISECTION\
  \ is OUT of this spec's scope** (plan-check finding 1, 2026-08-16). A red batch\
  \ is\nanswered by rule 4 — no member lands — and DISSOLVED back into the queue.\
  \ Identifying WHICH member was\nthe culprit without re-running every member separately\
  \ is a cost optimisation with its own later\ncarrier, deliberately excluded here:\
  \ this spec activates when the card implementing rules 1-7 closes,\nand an `active`\
  \ spec must not claim behaviour nobody has adopted (CHARTER §P3 / §P8). `BATCH_MAX`\n\
  below still bounds the diagnosis bill, because that bill is paid by re-queueing\
  \ either way.\n\n### 1. Formation is queue-driven — never repo-driven, and never\
  \ ACTOR-driven\nWhen the land slot frees, the batch is exactly the set of lands\
  \ queued AT THAT MOMENT, capped at\n`BATCH_MAX`. Nothing waits to \"fill\" a batch:\
  \ a quiet repo forms a batch of ONE, which MUST be\nbyte-identical to pre-spec behaviour\
  \ — same events, same commits, same tokens. This is what makes the\nmechanism self-disabling\
  \ where it is not needed, with no flag and no per-repo branch (CHARTER §P1 —\nno\
  \ second code path to choose between). A repo is never named in this logic; only\
  \ its queue depth is.\n\n**QUEUE ORDER IS ACCUMULATED AGE, OLDEST FIRST — and it\
  \ is a RULE, not an accident of the read**\n(measured 2026-08-26). \"Queue order\"\
  \ was previously left implicit here and the reader\nsupplied FIRST-SEEN-IN-TAIL\
  \ order, whose docstring claimed it meant \"whoever has been waiting\nlongest is\
  \ ahead\". It did not: every live waiter re-beats every ~20s, so within the freshness\n\
  window first-seen order is heartbeat-emit PHASE and is uncorrelated with age. That\
  \ silently\ncontradicted the §Cap clause below, which has always required WAITING\
  \ TIME to decide who is first.\nReplayed on this repo's own journal at 11:18:20Z,\
  \ first-seen order ranked the YOUNGEST of five\nqueued branches (307s) SECOND, ahead\
  \ of three aged 1161s, 478s and 413s; task/ waited from\n10:44:08Z while TWELVE\
  \ branches landed.\n\nThe age a branch is ranked by is the wait it has ACCUMULATED,\
  \ not the wait since its current park.\nA land's per-park counter (`waited_s`) restarts\
  \ on every re-park — a dissolution, or simply losing\nthe flock again — so the branch\
  \ that has paid the most re-entered as a newcomer; measured on\ntask/ as four restarts\
  \ under ONE pid and ONE attempt. The wait rows therefore carry an\nADDITIVE `queued_since_s`:\
  \ seconds since the land PROCESS first parked at either queue seam\n(SPEC-0132's\
  \ admission slot or the reservation). A row without it falls back to\n`waited_s`,\
  \ so every row already written stays readable.\n\nTWO BOUNDS, both load-bearing.\
  \ **This orders MEMBERSHIP and the rule-9 YIELD target, never the\nflock**: both\
  \ queue seams are non-blocking flock races that consult no age, and this rule does\
  \ not\nmake either FIFO. **And it does not starve new arrivals** — oldest-first\
  \ is FIFO, whose property is\nthat a branch's rank is NON-INCREASING (a later arrival\
  \ is younger and can never be inserted\nahead), so a branch arriving behind `k`\
  \ waiters is admitted within `ceil((k+1)/BATCH_MAX)` rounds.\nThat is a BOUND; the\
  \ ordering it replaces had none at any `k`. An age nothing can compute keeps its\n\
  first-seen position — it must not silently become the best or the worst rank — and\
  \ a queue where\nnothing can be dated is unchanged.\n\n**The FLOCK stays age-blind\
  \ — a seniority / FIFO acquisition of the land reservation is a STANDING\nOWNER-REJECTED\
  \ option, not an open design question.** A card that proposes «the released reservation\n\
  goes to the oldest waiter» (the shape) fails premise-verify against this rule: the\
  \ owner has\nruled the land order stays AS IS (SPEC-0132's bounded park + the rule-9\
  \ cost ladder above are the\nonly orderings), and the ruling is recorded with its\
  \ rationale in `patterns/methodology-lessons.md`\nLesson 10 — read it there BEFORE\
  \ re-proposing, do not re-litigate it here.\n\n**THE CAP IS REACHED BY WALKING THE\
  \ QUEUE, NOT BY SLICING IT** (measured 2026-08-19). The\nset above is capped at\
  \ the first `BATCH_MAX` MUTUALLY-COMPATIBLE candidates in queue order — not at\n\
  the first `BATCH_MAX` candidates. Formation walks the snapshot IN ORDER and admits\
  \ a candidate only\nwhen the cheap conflict predictor says it merges with those\
  \ ALREADY selected; one it does not is\nSKIPPED, and the walk CONTINUES down the\
  \ remainder until the cap or exhaustion. Before this,\nformation sliced at `BATCH_MAX`\
  \ and learned about incompatibility only from rule 3, AFTER the slice\n— so a candidate\
  \ proven unmergeable had already consumed a capped place and the replacement behind\n\
  it had been discarded. Measured over the whole journal: 18 `evicted-for-conflict`\
  \ verdicts across 7\nbranches, of which 11 are REPEAT evictions of a branch formation\
  \ had already failed to merge\n(task/ seven times, task/ four, task/ three, spanning\
  \ 08-16/-17/-19), while\n4-member batches landed 3 and 2 with up to EIGHT branches\
  \ queued. Back-filling after a skip is not\nan added feature; it is what walking\
  \ does and slicing could not.\n\n**QUEUE ORDER STILL SETS PRIORITY — a selector\
  \ that reorders by compatibility is WRONG.** Members\nare taken in ITERATION order\
  \ and nothing sorts, ranks or scores them, so WAITING TIME, not\nmergeability, decides\
  \ who is first. A skip is ATTEMPT-SCOPED and never a permanent exclusion: the\n\
  skipped branch keeps its place and is first in line in a round where nothing selected\
  \ ahead of it\nconflicts. The HEAD is never skippable — it holds the slot, and the\
  \ accumulator is seeded from it\nexplicitly before any peer is judged.\n\n**THE\
  \ SKIP IS NAMED IN THE RECORD, or the blindness returns.** A pre-emptive skip writes\n\
  `incompatible-with-selected` into the same `queue_excluded` sink the other exclusion\
  \ reasons use.\nAn incompatibility between two BRANCHES is discoverable ONLY at\
  \ this seam, and a drop that writes no\nrow is indistinguishable from a queue that\
  \ was simply empty — the 2026-08-17 defect the\nclause above already refused. It\
  \ is a SINK REASON, never a member verdict: `evicted-for-conflict`\n(rule 3) remains\
  \ the only durable claim this family makes about somebody's changes.\n\n**FAIL-OPEN,\
  \ and rule 3 remains the AUTHORITY.** This predictor skips ONLY on a PROVEN blocking\
  \ set\n— `_classify_land_merge_conflicts` actually ran and named an unresolvable\
  \ path — the same test and\nthe same oracle rule 3's pre-queue refusal applies.\
  \ Every unprovable answer ADMITS and lets rule 3's\nfail-CLOSED eviction decide,\
  \ so a false admit costs exactly the pre-change eviction while a false\nskip would\
  \ cost the very capacity this clause recovers. That polarity is deliberately the\
  \ INVERSE of\nthe per-branch eligibility filters, which have no authority behind\
  \ them and so fail closed.\n\n**A CANDIDATE'S OWN CORPUS INTEGRITY IS A PER-BRANCH\
  \ ADMISSION QUESTION** (measured\n2026-08-20). The three corpus-integrity guards\
  \ — spec-hand-edit (SPEC-0005), decision\ncontent-freeze (SPEC-0054), card-shape\
  \ rationale (SPEC-0165) — are asked of EACH CANDIDATE ALONE,\nagainst ITS OWN MERGE-BASE\
  \ with the current land base, as a filter in this walk, BEFORE the\npairwise predictor\
  \ above: a candidate ineligible on its own diff never needs a coexistence answer.\n\
  \nTHE MERGE-BASE IS LOAD-BEARING, not an implementation detail (X-1072). The guards\
  \ compare\na TWO-DOT `git diff <base> <head>`, which is SYMMETRIC: against the land\
  \ base's TIP it reports\nevery file where the two trees differ, INCLUDING files\
  \ MAIN changed after the candidate forked. So\na spec body a spec-touching land\
  \ already put on main read, from an unmerged peer's side, as a body\nchange with\
  \ no `spec_edited` receipt in that branch — and the peer's journal, being behind,\
  \ carried\nnone of main's newer events to clear it. The peer was skipped as an off-path\
  \ spec editor for the\nsole offence of being BEHIND, which cancels batching precisely\
  \ on the busiest queues. Asking\nagainst the candidate's fork point restores the\
  \ question the assembled-tree check has always\nasked — \"what did THIS branch author?\"\
  \ — without doing a merge, and weakens no guard: a branch\nthat really edited a\
  \ spec body off-path carries that edit ABOVE its merge-base. An UNRESOLVABLE\nmerge-base\
  \ is the checker's `error` answer below, never a fabricated clean and never a fallback\
  \ to\nthe moved base. Its skip reason is\n`corpus-integrity-violation` in the same\
  \ `queue_excluded` sink, and it carries the guard's own\nmessage so the branch that\
  \ must act can self-diagnose — the delivery half is a REQUIREMENT, not\npresentation,\
  \ because a member's land log otherwise shows only its reservation wait while the\n\
  rejection goes to the head's process. MULTIPLE violators are all skipped: a corpus\
  \ violation is a\nproperty of ONE diff with no ambiguity, so the two-or-more-owners\
  \ silence that governs assertion\nattribution does not apply — nothing is being\
  \ attributed.\n\nITS POLARITY IS THE COMPAT PREDICTOR'S, NOT THE PER-BRANCH FILTERS'.\
  \ It skips ONLY on a PROVEN\nviolation: the checker returns clean / violation /\
  \ **error** as three distinct answers, and both\n`clean` and `error` ADMIT. An error\
  \ is a fact about the CHECKER, never a claim about someone's\nchanges, and the aggregate\
  \ guard on the assembled tree remains the authority behind this filter —\nso an\
  \ unprovable answer costs at most the pre-change outcome, while a spurious skip\
  \ would cost the\ncapacity this whole rule recovers. This is why it does NOT fail\
  \ closed like `cost-class`.\n\n**A VIOLATING HEAD DISENGAGES FORMATION**. The head\
  \ is never skippable — it holds the\nslot — but it must not draw peers into a batch\
  \ its own diff has already doomed. A head that\nPROVABLY violates therefore makes\
  \ this formation NOT ENGAGED, which rule 2 already expresses as a\nbatch of ONE\
  \ with everyone else waiting, on this same path; the reason is `head-corpus-violation`,\n\
  a named member of rule 2's existing reason vocabulary. No head exemption and no\
  \ second mechanism.\nThe filter and the head check are built under the SAME `engaged\
  \ and peers` condition as the compat\npredictor, so rule 1's quiet-repo byte-identity\
  \ — no subprocess, no object written — is preserved.\n\n**OVER-SELECT-THEN-TRIM\
  \ WAS CONSIDERED AND REJECTED.** Taking `BATCH_MAX + k`, merging, and dropping\n\
  back to the cap requires REWINDING merges out of the candidate — the most fragile\
  \ path in this\nmachinery, and one that failed observably on 2026-08-18 (`could\
  \ NOT take the batch's peer merges\nback off... they are STILL IN ITS HISTORY`).\
  \ Skipping a candidate BEFORE the merge costs nothing;\nunmerging one after costs\
  \ the rewind path and sometimes does not work. Routine formation must not\ndepend\
  \ on it.\n\n**\"QUIET\" IS THE SCOPE OF THAT PROMISE, AND IT IS NOT A LOOPHOLE**\
  \ (measured 2026-08-17).\nByte-identity is owed to a repo whose queue was EMPTY.\
  \ A land that goes solo because the candidates\nthat WERE queued got dropped is\
  \ a different event, and reading the silence as covering it made the\nformation\
  \ decision unobservable: \"the queue was empty\" and \"a candidate was excluded\
  \ for reason X\"\nproduced identical journals, so two solo lands that day could\
  \ not be classified at all — and one of\nthem had a candidate queued continuously\
  \ for ten minutes. So a solo land WITH exclusions records\nthem on the existing\
  \ `land_batch_formed` row (`solo: true` + `queue_depth` + the per-candidate\nreasons;\
  \ no new event type, no new store), while a solo land with a genuinely empty queue\
  \ still\nemits nothing. This changes WHAT IS RECORDED about a formation, never WHICH\
  \ candidates are\nadmitted: rule 1's set and the strictly-newer admission test are\
  \ untouched.\n\n**THE RECORD IS EXHAUSTIVE OVER THE CANDIDATES ENUMERATED, AND CARRIES\
  \ THE CLOCK IT READ THEM AT**\n(measured 2026-08-19). The clause above makes a DROP\
  \ legible; it does not make the\ncandidate SET legible, and the two are not the\
  \ same guarantee. The sinks it produced are total over\nthe filters that OWN a reason,\
  \ so a candidate leaving by any other door was absent from `members`\nand from `queue_excluded`\
  \ alike — and an absent branch is indistinguishable from one that was never\nqueued,\
  \ which is the very confusion the clause above exists to end. Measured at 10:55:02Z\
  \ that day:\na formation reporting one member and nine exclusions, with a branch\
  \ that beat wait heartbeats\ncontinuously across the instant appearing in NEITHER\
  \ list. So a formation row records **a\ndisposition for EVERY branch the queue source\
  \ yielded** — `admitted`, or the exclusion reason, or\nthe fail-loud `unaccounted`\
  \ for a branch that reached neither — and the **`read_ts` at which the\ncandidate\
  \ snapshot was READ**, which is NOT the row's own `ts` (the journal stamps that\
  \ at emit,\nafter the merge probe and the cost classification have run, so the two\
  \ date different instants).\nThree drops that were previously unreasoned each acquire\
  \ a named one: the HEAD short-circuit that\ndiscards already-enumerated peers, the\
  \ rule-4 requeue filter, and the cap REMAINDER.\n\nThree bounds, all load-bearing:\n\
  - **Admission is UNTOUCHED.** This changes only what the event can PROVE. Which\
  \ branches are\n  admitted is a separate question with its own carrier — as was\
  \ the `queue_depth` derivation,\n  which this clause left exactly as it was and\
  \ the clause below now repairs.\n- **The dispositions ride EVERY formation row,\
  \ not only the solo fork.** An accounting confined to\n  the solo fork would inherit\
  \ the `queue_depth` inversion described below.\n- **The quiet repo stays byte-identical.**\
  \ The N=1 no-row clause widens by exactly one term — a\n  formation that SAW candidates\
  \ emits a row — so a repo whose queue read yielded nobody still emits\n  nothing,\
  \ and this is not the blanket always-emit the clause above already refused.\n\n\
  **THE RECORDED QUEUE DEPTH IS THE LIVE CANDIDATES, AND IT RIDES EVERY FORMATION\
  \ ROW** (measured 2026-08-19). `queue_depth` was written only under the N<=1 branch\
  \ and derived as the\nmember count plus the whole exclusion sink, so it went silent\
  \ exactly when peers existed and loud\nexactly when they did not: that day every\
  \ multi-member row carried it absent — including a batch of\ntwo paying members\
  \ — while all five solo rows carried 8-10, composed entirely of candidates the\n\
  queue read had ITSELF judged no longer waiting. A field that reads backwards is\
  \ worse than a\nmissing one: it does not merely mislead, it removes the ability\
  \ to reason about the mechanism's\noutput at all, because the number can be trusted\
  \ in neither direction.\n\nSo the depth is **the candidates that were LIVE at the\
  \ read instant** — the admitted peers plus the\nbranches a filter DOWNSTREAM of\
  \ the queue read declined to carry — and it is recorded on **every**\nformation\
  \ row, solo and multi alike. A candidate the queue read itself judged absent (its\
  \ wait\nevidence was not evidence of now, or its land had already ended) is NOT\
  \ queue load; it stays in the\nexclusion sink, which is where its reason belongs\
  \ and where the differential lives. The\nsolo MARK stays on the N<=1 branch: it\
  \ describes the batch, not the queue.\n\nTwo bounds. **Admission is untouched**\
  \ — this is a derived REPORT, and the member set, the sink,\nthe dispositions and\
  \ the quiet-repo no-row clause are all what they were. And **the classification\n\
  names the not-live family, never its complement**: those reasons are written by\
  \ the queue read\nalone and are bounded by what a wait-row read can conclude, while\
  \ the live-but-not-carried family\ngrows with every filter added — so an unclassified\
  \ future reason counts as LIVE and reads loud,\nrather than silently vanishing from\
  \ the count.\n\n**AFTER A `landed` VERDICT THE WAIT EVIDENCE MUST BE A NEW WAIT,\
  \ NOT A NEWER HEARTBEAT** (traced 2026-08-18). admission test asks whether a branch's\
  \ newest wait row is STRICTLY\nNEWER than its newest terminal row, and it applies\
  \ that question VERDICT-BLIND. For every verdict but\none that is right. For `landed`\
  \ it is not: the member's own land is parked in the land\nreservation, a flock poll\
  \ that consults the lock and the clock and never opens the journal, so NO\nbatch\
  \ verdict can reach it and it keeps beating after its work is already in `main`.\
  \ Traced end to\nend on task/ — landed at 04:06:13Z, still beating 22 minutes later,\
  \ announced as a member into\nthree later formations and delivering a verdict in\
  \ NONE of them; 7 of 14 carried-landed peers show the\nsame tail. So for a `landed`\
  \ member verdict — and for NO other verdict — admission ADDITIONALLY\nrequires the\
  \ newest in-window wait row to be a NEW wait: its `waited_s` restarts at 0 when\
  \ a new land\nparks and does not restart across a verdict, so `row_ts - waited_s`\
  \ at or after the verdict proves a\nnew land and anything earlier is the same one\
  \ still parked. A wait that cannot be dated that way is\nundecidable and EXCLUDES,\
  \ the same fail-closed direction rule 1 already takes everywhere. This\nNARROWS\
  \ the discrimination; it does not replace the mechanism, and it is NOT a permanent\
  \ exclusion —\na branch that genuinely re-lands with new commits parks a new land\
  \ and is admitted again (task/,\ntask/ and task/ all did). `requeued-after-red-batch`\
  \ keeps the untouched verdict-blind\npath, so rule 4's one-round penalty stays ONE\
  \ round. No new event type, no new store, no new entity:\n`verdict` and `waited_s`\
  \ are already on the rows this read parses.\n\n**Nor is the CLAIMANT'S KIND named\
  \ — an interactive Controller's land is an ordinary member** (owner\nquestion, 2026-08-16).\
  \ Everything motivating this spec is worker-framed: the deaths counted are\ndispatched\
  \ workers', the metric segments dispatched workers, and the SPEC-0180 seam is a\
  \ worker\nholding its turn. A reader can fairly conclude batching is a worker-only\
  \ mechanism. It is NOT. A\nController landing a `work/<slug>` filing batch enters\
  \ the SAME serialized merge→verify→ff span\n and takes the SAME admission slot (SPEC-0132)\
  \ as any worker, so by this rule it is queued,\nand therefore batchable, on identical\
  \ terms. Making membership depend on the claimant's kind would be\na second code\
  \ path selected by session label — exactly what this rule and CHARTER §P1 forbid,\
  \ and it\nwould also shrink batches precisely in the interactive+worker mix where\
  \ queueing is worst.\n\nThe asymmetry that IS real lives in rule 6, not here: what\
  \ \"the claimant died\" MEANS differs between a\nheadless worker (whose process\
  \ exits when it yields its turn) and an interactive session (which does\nnot). Rule\
  \ 6 therefore defines eviction on a signal both kinds emit — see there. Membership\
  \ itself\nstays actor-agnostic.\n\n**A MEMBER IS `paying` WHEN ITS OWN LAND WOULD\
  \ ACTUALLY HAVE RUN THE SUITE — never when its paths\nmerely classify inert**. `paying_members`\
  \ on the formation row counts the members that\nwould each have paid a full pass\
  \ alone, and it is carried as its OWN key because `members` by itself\nreads as\
  \ \"N lands per pass\" whether or not any pass was actually amortised. The test\
  \ is the ACTUAL\nquestion, answered per engagement (rule 2): on a KERNEL-AUTHORED\
  \ verify a first attempt always\nverifies and therefore PAYS, and only a RETRY whose\
  \ delta is inert skips — the inert class is that\nskip's PRECONDITION, never the\
  \ skip itself; on a PROJECT-AUTHORED verify a member pays only when some\ndeclared\
  \ layer would actually RUN for its changed paths, since a change every layer skips\
  \ runs\nnothing. A land running no tests pays nothing whatever its diff.\n\n**THE\
  \ PROJECT-AUTHORED HALF IS ASKED THROUGH `subject_globs`, NEVER `covers:`.** They\
  \ are different\ndeclarations with OPPOSITE defaults, and confusing them inverts\
  \ the answer on real projects: `covers:`\nnames the test surface a layer OWNS (SPEC-0152\
  \ delegation), while `subject_globs:` is what the verify\nseam actually skips on\
  \ — and a layer declaring NO `subject_globs` runs ALWAYS. A layer may therefore\n\
  own `tests/**` by `covers:` while its subject spans `app/**`, so a change under\
  \ `app/` really runs it\nand PAYS although no `covers:` glob matches. The question\
  \ is put to the SAME authority the seam skips\non, so this metric and the gate that\
  \ decides what a land pays cannot answer differently; a WAIVED or\ncommandless layer\
  \ runs for nothing whatever its globs say, and a carrier declaring nothing runnable\
  \ at\nall is UNDECIDABLE rather than free — inventing a saving out of an unusable\
  \ declaration is the same\nlie in the other direction.\n\n**UNKNOWN IS NOT PAYING,\
  \ and the direction is the point.** An unreadable or undiffable member, an\nunknown\
  \ attempt, or an undecidable engagement is never counted, so the number under-claims\
  \ rather\nthan over-claims: this metric exists to expose a repo assumed to benefit\
  \ while saving nothing, and\none that guessed upward would manufacture the very\
  \ reassurance it is meant to withhold. Reading the\ninert CLASS as the answer instead\
  \ conflates it with a skip gated on `attempt > 1`, which reports zero\nsaving on\
  \ the cheapest and most frequent class of land — the mechanism then reads as worthless\n\
  exactly where it works.\n\n**Read the kernel consequence honestly.** Where every\
  \ queued land really does pay a full pass — this\nrepo — `paying_members` converges\
  \ to `members`. That is the repo's true cost, not the metric going\ndegenerate,\
  \ and it must not be reported as a preserved kernel-side distinction: the separation\n\
  between the two numbers does its discriminating work on projects whose declared\
  \ layers cover only\npart of the tree.\n\n**BESIDE THE TWO MEMBER COUNTS, THE ROW\
  \ REPORTS WHAT A PASS COST** (owner direction\nrecorded 2026-08-25). `members` and\
  \ `paying_members` are both counts of MEMBERS; neither is a\nprice. Batching amortises\
  \ exactly ONE pass, so the benefit of forming a batch is that pass's price\ntimes\
  \ the members who would otherwise each have paid it — and the row carried both factors\
  \ of that\nproduct except the one that decides its size. `verify_wall_ms_median`\
  \ (with\n`verify_wall_ms_median_n`, the sample it rests on) is folded READ-ONLY\
  \ from completed lands' own\nrecorded `land_completed.data.verify_duration_ms` over\
  \ a bounded journal tail. Why it matters here\nand not merely as telemetry: the\
  \ narrowing shipped made a kernel pass materially cheaper,\nwhich MOVES the value\
  \ of every batch this spec forms — measured on this repo 2026-08-29, the median\n\
  fell from about 7.4 min to about 3.0 min post-narrowing (n=715 since 2026-08-25),\
  \ i.e. roughly 2.5x\ncheaper rather than the six-fold the direction predicted. The\
  \ benefit therefore fell by about that\nfactor while the fate-binding cost is UNCHANGED,\
  \ and no surface reported it.\n\n**IT IS A REPORT AND IT DECIDES NOTHING.** Nothing\
  \ reads the figure back: membership, the cap, the\ncost ladder of rule 9, the class\
  \ grouping of rule 10 and every fail-closed direction are exactly\nwhat they were.\
  \ It informs a HUMAN re-judging whether the amortisation is still worth the fate\
  \ it\nbinds; it never makes that judgement. Two bounds follow and both are load-bearing:\
  \ the fold happens\nBELOW the emitter's N=1 early return, so rule 1's quiet-repo\
  \ promise (a solo formation reads\nnothing and writes no object) is untouched; and\
  \ an unmeasurable pass OMITS both keys rather than\nreporting a zero, because a\
  \ zero reads as \"a pass is free\" and would invert the very argument the\nfigure\
  \ is reported to inform.\n\n### 2. Engagement requires a DECLARED property from\
  \ the project\nThe gate keys on WHO AUTHORED THE VERIFY, never on which repo this\
  \ is (plan-check finding 1,\n2026-08-16 — an earlier draft keyed it on the project\
  \ `yitc-ops.yaml` carrier alone, which\nself-disabled for the kernel, the one repo\
  \ whose pain motivated the whole plan and which has no\n`yitc-ops.yaml` at all):\n\
  \n- **Verify is the kernel's OWN pinned suite** (the bare `tests/` sweep) — batching\
  \ engages without a\n  per-project declaration, because the AUTHOR of that suite\
  \ and the enforcer of this rule are the same\n  party: the declaration and the thing\
  \ declared about have one owner, so a separate assertion would be\n  the kernel\
  \ telling itself what it already knows.\n- **Verify is PROJECT-AUTHORED** (`verify.layers`\
  \ commands) — a declaration is REQUIRED, because the\n  kernel cannot reason about\
  \ `bash scripts/verify-stack.sh`.\n\n**This is an AUTHORSHIP predicate, not a repo-identity\
  \ bypass** (plan-check finding 2, 2026-08-16 —\nread as an identity exception, which\
  \ would contradict rule 1's \"no repo is ever named\"). Nothing here\nasks \"is\
  \ this repo the kernel\". It asks who WROTE the verify the batch is about to run,\
  \ and the\nkernel-authored branch would apply to ANY verify the kernel itself authors\
  \ and owns. Rule 1's boundary\nis intact: no repository is named, and a consumer\
  \ never gets a different code path for being that\nconsumer. **The branch is nonetheless\
  \ SPEC-0152's to own, with its own adoption probe** — SPEC-0152\nowns the declaration\
  \ surface, so it owns BOTH branches of the predicate including the\nkernel-authored\
  \ default and the evidence that the default was deliberate rather than an omission.\
  \ It\nis not left implicit here; this spec cites it and enforces the consequence\
  \ (rule 2 head).\n\nThis is the same seam SPEC-0132 already draws (X-0678 named\
  \ exactly these two verify-paying\nphases when it fixed the unslotted consumer land),\
  \ so it reuses an existing boundary rather than\ninventing one, and no rule anywhere\
  \ names a repository.\n\nFor the project-authored case: **SPEC-0152 DEFINES the\
  \ declaration; this spec only CITES it and\nenforces its consequence** (plan-check\
  \ finding 2, 2026-08-16 — an earlier draft had the field\ndescribed in two places\
  \ at once, which is the duplication CHARTER §P5 forbids). SPEC-0152 rule 16\nowns\
  \ the `yitc-ops.yaml` `verify:` carrier, so the field's NAME, SHAPE and WORDING\
  \ are settled there\nand are deliberately NOT restated here. What this spec states\
  \ is the CONSEQUENCE only, and it is\nfail-closed: **anything other than an explicit\
  \ affirmative declaration means batches of one** —\nabsent, malformed, or false\
  \ are not distinguished here, because telling them apart is the defining\nspec's\
  \ job, not this one's.\nBisection semantics cannot be PROVEN for arbitrary project-authored\
  \ commands, and inferring them\nwould be a guess dressed as a guarantee — so the\
  \ project asserts the property about its own surfaces\nand the kernel enforces the\
  \ consequence, the declare-or-waive shape the corpus already runs on.\n\n### 3.\
  \ Merge-and-evict happens BEFORE the pass is spent\nMembers are merged onto the\
  \ current `main` in queue order. A member whose merge conflicts with an\nalready-merged\
  \ peer is EVICTED back to the queue before any verify starts — never after. A verify\
  \ pass\nis the scarce resource this whole spec exists to conserve; spending one\
  \ to discover a merge conflict\nwould defeat it.\n\n**A conflict with `main` ITSELF\
  \ is refused BEFORE the queue, by this same oracle** (external-auditor consult `land-conflict-check-before-queue`).\
  \ Rule 3 above evicts a member that\nconflicts with a PEER; it says nothing about\
  \ a branch that cannot merge with `main` at all, and\nthat branch pays the FULL\
  \ queue before the in-lock `_update_from_main` tells it so. Measured\n2026-08-17:\
  \ task/ waited 71 minutes across 197 queue-wait rows and 7 batches, was evicted\n\
  from every one, and then aborted correctly on a non-union conflict with `main` —\
  \ an answer\ncomputable in milliseconds at the moment it entered. So the SAME classification\
  \ runs as a DRY\nPROBE above the land reservation: a proven blocking conflict aborts\
  \ immediately, taking no\nreservation, no verify slot and no batch membership. This\
  \ spec's own rule-3 argument that an\nevicted member \"takes its own slot and verifies\
  \ alone\" is true but INERT for this class —\nverifying alone fails for exactly\
  \ the same reason.\n\n**A SECOND pre-queue class: AUDIT CURRENCY**. The same argument\
  \ holds for the other\nquestion a land answers late and could answer first — is\
  \ the diff about to land still the diff\nthat was audited (SPEC-0077 §3a). Measured\
  \ 2026-08-21: that gate refused task/ once and\ntask/ twice, each refusal AFTER\
  \ the reservation. So the SAME computation runs as a dry\nprobe beside the merge\
  \ one — `_land_preflight_currency_lines`, which is itself a\ncaller of `_land_audited_footprint_split`,\
  \ the in-lock gate's own classifier, so all three\nsites answer from one definition.\
  \ The three properties below govern it UNCHANGED (one oracle;\nfail-OPEN, the gate\
  \ stays the fail-closed authority; the refusal names the shas it is true\nrelative\
  \ to), and it rides the existing abort carrier with the existing `audited-diff-stale`\n\
  class — no new abort path, class or event type. It carries ONE ADDITIONAL admission\
  \ condition,\nbecause currency is judgeable only AFTER update-from-main: the verdict\
  \ is computed against the\nMERGE-BASE of `main` and the branch — an ancestor of\
  \ HEAD for EVERY branch, so a verdict always\nEXISTS — and acted on ONLY where the\
  \ pending merge provably cannot change it, i.e. where main\nhas touched NONE of\
  \ the offending paths (`own_post_audit` + `unclassified`) since that base. For\n\
  such a path the merge takes the branch's content verbatim, so its pre-merge bucket\
  \ IS its\npost-merge bucket. Where even ONE offending path HAS moved on main since\
  \ the base, the branch\nproceeds unjudged — that merge can still move it into `mechanical_resolve`\
  \ or\n`merge_inherited`, and refusing on a verdict the merge could overturn would\
  \ be exactly the false\nabort the first property forbids.\n\n shipped this admission\
  \ at the BRANCH level — \"refuses ONLY when the branch ALREADY\nCONTAINS main's\
  \ tip\" — and narrowed it to the per-path test above, of which the old rule\nis\
  \ the DEGENERATE CASE: when the branch contains main's tip, the merge-base IS that\
  \ tip, so the\noracle's base is unchanged and `base..main` is empty, making the\
  \ test trivially true. Nothing\nadmitted under the old rule is admitted differently;\
  \ the widening only ADDS the behind-main\ncases whose verdict is provable. Its grounds\
  \ are MEASURED: the tip-containment condition almost\nnever held in this repo's\
  \ land traffic — five consecutive attempts on 2026-08-21, each a\n`worktree sync`\
  \ immediately followed by `land`, ALL found main advanced again by the time land\n\
  read it (a sync takes ~30s and main moves inside that window), so the probe fail-opened\
  \ and the\nbranch queued exactly as before. The check was correct and rarely reached\
  \ its verdict.\n\nThree properties make that early refusal safe rather than merely\
  \ fast, and none is optional:\n\n- **ONE ORACLE, NOT TWO.** The pre-queue probe\
  \ and the rule-3 eviction probe consume a single\n  shared definition, which is\
  \ the same `_classify_land_merge_conflicts` authority the in-lock\n  merge runs.\
  \ The consult's medium finding is why: a name-only `merge-tree` feed makes\n  auto-resolvable\
  \ spec-signature and row-append conflicts read as BLOCKING, so an early path\n \
  \ with a feed of its own would FALSE-ABORT a land that would have succeeded — the\
  \ mirror image\n  of the defect rule 3 already fixed. A false abort is worse than\
  \ a slow success.\n- **FAIL-OPEN, the inverse polarity of the in-lock check — deliberately.**\
  \ The in-lock merge\n  remains the AUTHORITY and remains fail-CLOSED; the pre-queue\
  \ probe is a cheap PREDICTOR of it\n  and refuses ONLY on a proven blocking set.\
  \ Every answer it cannot prove — a git that could not\n  run, an unreadable ref,\
  \ an unparsable stream, a classifier that could not decide — proceeds\n  into the\
  \ queue and lets the authority decide. It never invents a refusal it could not prove.\n\
  - **THE REFUSAL NAMES WHAT IT IS TRUE RELATIVE TO.** The abort text and its journal\
  \ row carry\n  both the `main` sha and the branch sha the refusal was proved against,\
  \ because a branch refused\n  now may merge cleanly once `main` advances: this is\
  \ stale-current-state, not a weaker merge\n  authority. The land-abort carrier,\
  \ its class and its journal side effects are otherwise\n  unchanged — no new event\
  \ type and no new abort class.\n\n### 4. One pass, then all-or-nothing — and a red\
  \ batch NEVER reforms itself\nThe combined candidate is verified ONCE. On green,\
  \ every surviving member is fast-forwarded onto\n`main` atomically: partial application\
  \ of a verified batch is forbidden, because `main` would then\nhold a combination\
  \ that nothing verified. On red, NO member lands.\n\n**The safety guarantee is COMBINED-CANDIDATE\
  \ safety, and it is stated here so nothing downstream\npromises more** (gate-executing\
  \ finding 1, 2026-08-16): what reaches `main` is EXACTLY what was\nverified, as\
  \ a SET. `main` is never green by assumption — it is green by having been run. A\
  \ member\nthat is red ALONE but green IN COMBINATION (a peer masks its breakage)\
  \ WILL land, and this design\ncannot detect that: under batching a member has no\
  \ personal candidate leg to be red on. Detecting it\nwould require verifying every\
  \ member separately, which is the per-change pass this spec exists to\namortise\
  \ — so the residual is ACCEPTED, not solved. What it costs: a latent breakage can\
  \ sit in the\ntree until the masking peer is reverted or the combination changes.\
  \ What it never costs: a red\n`main`. Every merge queue this spec cites as prior\
  \ art carries the identical residual.\n\n**A red batch DISSOLVES, and its members\
  \ become batch-INELIGIBLE for their next attempt: each is\nverified ALONE** (plan-check\
  \ finding 1, 2026-08-16 — a livelock this spec would otherwise have\n). \"Return\
  \ them to the queue\" is not sufficient on its own: the same members are still queued\n\
  together, so the next slot reforms the SAME batch, which fails identically, forever.\
  \ The members must\ntherefore be marked single-verify for one round, which terminates\
  \ the loop by construction — every\nmember reaches an INDIVIDUAL verdict on its\
  \ own candidate leg, and the queue makes progress even\nwhen nothing about the red\
  \ is understood.\n\nThis is what makes dissolution SELF-CORRECTING, and it is the\
  \ reason bisection can be deferred rather\nthan being load-bearing: after one dissolve\
  \ round the genuinely red change has failed alone and is\nout, while a PEER-DEPENDENT\
  \ red — green for every member alone — passes alone and lands. Bisection\nwould\
  \ reach the same outcome in fewer passes; it is a cost optimisation on top of this\
  \ rule, never a\nprerequisite for correctness. Without this paragraph deferring\
  \ bisection would be unsound, so the two\nbelong together: **whatever else changes,\
  \ a red batch may never be re-formed identically.**\n\nA member returning from a\
  \ dissolve regains ordinary batch eligibility once it has had its single\nverdict\
  \ — the ineligibility is one round, not a quarantine, and it is not a penalty box:\
  \ a member\nevicted for a PEER's red did nothing wrong and must not be disadvantaged\
  \ beyond that one pass.\n\n**AND THE MARK DOES NOT FALL ON A TIMEOUT AT ALL** (measured).\
  \ The\nguarantee above — a red batch may never be re-formed identically — is what\
  \ JUSTIFIES the blanket,\nand it needs the red to be a VERDICT ABOUT THE MEMBER\
  \ COMBINATION: only then does \"the next slot\nwould re-form the same batch and\
  \ fail identically forever\" follow. A verify TIMEOUT is not such a\nverdict. It\
  \ is an INCONCLUSIVE run — the abort class the red-ISOLATION probe one rule over\n\
  already refuses to convict anybody on, whose own words are that a launch error and\
  \ a timeout arrive\nin the same shape as an assertion failure and each must turn\
  \ the probe UNDECIDABLE rather than name\na culprit. Re-forming the same batch under\
  \ lighter load may well pass, so the livelock the mark\nprevents cannot be INFERRED\
  \ from a timeout, and marking the members converts ONE inconclusive run\ninto N\
  \ full verifies. Batch `bat-621a860a8cbb` (four members) went red with BOTH failures\
  \ reading\nonly `TIMED OUT after 300s`; no culprit was attributed — correctly, since\
  \ a timeout belongs to\nnobody — and all four were penalised anyway, 4 of the 28\
  \ member-verifies burned by red batches that\nday. So when the red consists ENTIRELY\
  \ of timeout entries the members requeue with rule 5's\nordinary `requeued-after-red-batch`\
  \ verdict and NO one-round mark.\n\nTHE DISCRIMINATOR IS POSITIVE, and that bound\
  \ is the rule, not an implementation note\n(`lessons/carving-an-exception-into-a-fail-closed-gate`).\
  \ The question is not \"did we fail to find\na culprit?\" — which would swallow\
  \ the rule — but \"is EVERY entry the red surfaced a timeout?\",\nasked through\
  \ the SAME predicate the isolation probe uses, never a second detector that could\
  \ drift\nfrom it. Every other shape keeps today's blanket: a MIXED red (a timeout\
  \ BESIDE a genuine failing\nassertion) is still a verdict about the combination,\
  \ so the livelock is live and the mark applies\nunchanged; a red with nothing surfaced\
  \ explains nothing and keeps the blanket; and a marker that\nnever reached the decision\
  \ fails closed to the blanket, so broken plumbing can never open the\ncarve-out.\
  \ UNDECIDED HERE, deliberately: the per-test timeout VALUE, and whether a timed-out\
  \ batch\nshould be RETRIED — this rule withholds a penalty, it does not rescue the\
  \ pass.\n\n**BUT THE VERDICT MUST HAVE SETTLED SOMETHING, OR IT IS NOT THE ROUND\
  \ THIS RULE PROMISES**\n(measured 2026-08-27). The guarantee above — a red batch\
  \ may never be re-formed\nidentically — is not delivered by the mark alone, because\
  \ the mark is discharged by the member's\nown individual verdict, and when the red\
  \ is owned by NO MEMBER every member's individual verdict\nfails on the SAME assertions,\
  \ resolves nothing, and discharges its own mark. The composition then\nre-forms\
  \ and dies identically. `task/` was requeued at 12:09:10Z carrying `red_assertions`\n\
  {t11444, t11417}; its own solo land ran a full 681s verify and aborted at 13:41:05Z\
  \ on EXACTLY\n{t11444, t11417} — and that abort cleared its round. `task/` went\
  \ round the loop four times\n(10:52:19Z, 12:09:10Z, 12:48:37Z, 13:28:13Z), while\
  \ `task/` and `task/` waited 8362s\nand 2468s WITHOUT EVER REACHING VERIFY — `task/`\
  \ behind `main` by ZERO commits. Nobody was\nat fault: once the composition CHANGED,\
  \ `task/` and `task/` landed clean at\n14:20:41Z with no fix from anyone. So an\
  \ individual verdict that RE-OBSERVED the batch's own\nUNOWNED red does NOT discharge\
  \ the mark.\n\nThis is the qualifier one layer deeper, not a second mechanism: that\
  \ card demanded positive\nevidence the individual leg RAN, and this one adds that\
  \ a leg which ran and then re-observed the\nvery assertions the batch was requeued\
  \ for resolved exactly as little. Both are this rule's own\nwords (\"every member\
  \ reaches an INDIVIDUAL verdict on its own candidate leg\") being read, and\nneither\
  \ states a new obligation on any actor.\n\n**UNOWNED means the dissolve's own decline\
  \ record NAMED NOBODY** — outcome `interaction` (the\noracle PROVED no member reproduces\
  \ alone) or `undecidable` (it named nobody at all, incl. the\n`pinned-entry` gate:\
  \ 8 of the 10 decline rows measured that day). `culprits-not-actionable` and\n`partially-explained`\
  \ NAME an owner, or part of one, so the red IS somebody's and the ordinary\nclearing\
  \ above is correct for them, unchanged. Nothing here changes the ORACLE, its outcomes\
  \ or\ntheir classification: this governs only what happens AFTER a decline.\n\n\
  **AND IT IS STILL NOT A QUARANTINE.** The member is not blocked and not penalised\
  \ — it is verified\nALONE, which is the cheapest honest thing left to do with it,\
  \ so it reaches its OWN terminal land\noutcome on every pass instead of being dragged\
  \ round inside a batch that cannot land. The mark\nself-clears on the FIRST individual\
  \ verdict that says anything new: a green land, or a leg that\nfails on a different\
  \ assertion. Nothing waits for the red to clear. The read stays FAIL-OPEN in the\n\
  direction it already takes: the mark is KEPT only on a positive, measured overlap,\
  \ and every absent,\nempty or unreadable input clears exactly as before — because\
  \ a wrongly-KEPT mark on bad data is the\none thing that WOULD make this a quarantine.\n\
  \n**THE MARK FALLS ON THE ATTRIBUTED CULPRITS, NOT ON EVERY MEMBER — WHEN THE ATTRIBUTION\
  \ ACCOUNTS FOR\nTHE WHOLE RED** (measured 2026-08-18). The blanket above was correct\
  \ while a dissolve could\nnot tell WHO broke the batch. Since rule 5's attribution\
  \ it often can, and marking everyone then\ncharges innocents a round for a peer's\
  \ supersession: the four-member batch that died at\n failed on two assertions BOTH\
  \ attributed to `task/`, yet all four were\nmarked, so the queue paid one red pass\
  \ PLUS four individual passes — one MORE than doing nothing, and\nthree of those\
  \ passes were spent on members with no evidence against them.\n\nSo dissolution\
  \ marks the attributed culprits alone, under a POSITIVE condition and never on the\n\
  absence of a detected problem: **every failing entry the red surfaced must be a\
  \ pinned entry\nattributed to some member.** A non-pinned candidate failure, an\
  \ entry naming no assertion, a key that\nresolves to no path or to two, an entry\
  \ with zero or with several candidate owners — each leaves part\nof the red unexplained,\
  \ hence a culprit possibly unnamed, and the BLANKET is retained unchanged. The\n\
  unnamed-culprit hole is what makes this conditional rather than free: an unmarked\
  \ culprit rejoins the\nnext batch and kills it.\n\n**WHEN THE CULPRIT IS PROVEN,\
  \ THE BATCH IS NOT DISSOLVED AT ALL — IT EVICTS AND CARRIES ON**\n(measured 2026-08-19).\
  \ Everything above describes a red batch that cannot say WHO broke\nit, and that\
  \ stays the DEFAULT and the fallback. But dissolution answers a red batch the way\
  \ rule 3\nanswers a conflicted one only in outcome, never in blast radius: a member\
  \ that cannot MERGE is\nevicted and the rest carry on, while a member that fails\
  \ the TESTS took every peer down with it —\nmeasured over the whole journal as the\
  \ LARGEST non-landing category, 39 member-slots against 20\n`evicted-for-conflict`.\
  \ The 20:07:40Z batch that day landed NOBODY and requeued three; one of them\nwas\
  \ unrelated to all three failing assertions and paid ~19 minutes of pure overhead.\n\
  \nSo before dissolving, the land ASKS WHO, with an ORACLE rather than a heuristic:\
  \ re-run ONLY the\nFAILING assertions against each member ALONE (`_land_red_isolation_probe`).\
  \ Cheap by construction —\nthe failing set is typically one to three files and the\
  \ batch is at most BATCH_MAX, so this is not\na suite pass per member. It is a DIAGNOSTIC,\
  \ exactly as the external-auditor consult framed it\n(`decisions/batch-member-rebaseline-authority-audit-adhoc.yaml`,\
  \ 2026-08-19: \"keep the merged-tree\npinned leg as the protective check; use per-member\
  \ or subset runs only as diagnostics for\nattribution\"). THREE OUTCOMES, and the\
  \ third is not optional:\n  * exactly one member reproduces alone -> evict it and\
  \ carry the rest;\n  * several reproduce alone -> evict each, every one on its OWN\
  \ reproduction;\n  * NO member reproduces alone -> the failure belongs to the MERGED\
  \ tree. Nobody may be evicted,\n    and the dissolution above is the CORRECT answer\
  \ rather than a misattribution to whichever\n    member a search happened to isolate\
  \ first.\nAnything the oracle cannot run, parse or decide — a verify timeout, a\
  \ runner that could not launch,\na member that will not isolate, a red only partly\
  \ accounted for — likewise falls back to the\ndissolution above, byte-identically.\
  \ A wrongly evicted member is an innocent branch told it broke\nsomething it did\
  \ not, so nothing is ever evicted on a guess.\n\n**A PINNED ENTRY IS THE ONE NAMED\
  \ EXCEPTION, AND IT IS ANSWERED BY THE ATTRIBUTION THIS RULE\nALREADY TRUSTS** (measured\
  \ 2026-08-25). The oracle's refusal of a `[pinned/last-green] `\nentry stays exactly\
  \ as it is and is correct — reproducing one needs the pinned OVERLAY\nconstruction\
  \ (last-green checks over a candidate subject), not a plain re-run of a test file,\
  \ and\nthe merge-base probe cannot help either: its axis separates MAIN from BRANCH,\
  \ and every member of\na batch shares one merge-base. But that refusal is a statement\
  \ about the PROBE's reach, not about\nthe batch's knowledge. Two calls later the\
  \ dissolution ALREADY names the culprit: rule 5's\nattribution marks the member\
  \ that uniquely modified the resolved test file, and the POSITIVE\nwhole-red condition\
  \ stated three paragraphs above decides whether that naming accounts for the\nentire\
  \ red. The answer simply existed too late to save anybody.\n\nSo on THIS decline\
  \ reason alone the land ASKS THE ATTRIBUTION before dissolving, under the\nIDENTICAL\
  \ whole-red condition and the IDENTICAL two structural bounds. Nothing is widened:\
  \ no\nattribution gate is loosened, no new gate is added, the culprit set IS the\
  \ complement the\nineligibility mark already falls on, and the record carries `reason:\
  \ pinned-entry-attribution`\nwith an EMPTY `reproduced`, so an attributed culprit\
  \ is never mistaken on the row for a\nre-run-PROVEN one. It costs zero test subprocesses\
  \ — it reads diffs, not tests — so it takes no\nadmission slot. What entitles an\
  \ eviction here is narrower than blame: gate 4 proves the member\nCHANGED the very\
  \ file whose last-green assertion the merged tree now fails, and that supersession\n\
  is the member's own to declare on its own land (SPEC-0077 §3a) and no peer's to\
  \ declare for it.\nEvicting it routes the branch to the only land that can legitimately\
  \ resolve its red.\n\n**THE BOUND IS MEASURED AND PARTIAL BY CONSTRUCTION.** Over\
  \ this repo's journal, 39 member rows\nacross 13 batches declined `pinned-entry`\
  \ in the five days after the oracle. On 7 of those\n13 the attribution reaches a\
  \ culprit set that accounts for the whole red and leaves a survivor; on\n3 of the\
  \ 7 that set contains the HEAD, which the head bound below still forbids evicting,\
  \ so 4\nbatches evict — 8 innocent peers spared. The other 6 stay dissolved because\
  \ part of their red is\nunowned, or because every member is a culprit and there\
  \ is no survivor. That the fix is partial is\nthe discriminator working: it under-claims\
  \ by design, and an unnamed culprit left in the candidate\nis the failure this rule\
  \ exists to prevent.\n\n**THE REMAINDER MUST RE-VERIFY, AND THAT IS A CORRECTNESS\
  \ BOUND, NOT AN OPTIMISATION.** The verify\nthat went red ran over a merged tree\
  \ that INCLUDED the culprit. After eviction the tree is\nDIFFERENT, so the survivors\
  \ hold no green pass and take a FRESH one before any fast-forward.\nLanding them\
  \ on the strength of a run that failed would be a false green — the exact class\n\
  SPEC-0077's pinned leg exists to prevent. What this saves is N innocent peers skipping\
  \ a full\nrequeue plus re-wait, at the price of ONE extra verify; it never saves\
  \ the verify itself.\n\n**TWO BOUNDS, BOTH STRUCTURAL.** The HEAD is never evicted:\
  \ it owns the candidate branch the\nfast-forward pushes to `main`, so removing it\
  \ would rewrite the land's own subject — the same bound\nrule 3 states as \"the\
  \ head is never evictable\". And AT MOST ONE eviction round per land: a second\n\
  red after an eviction means the remainder is red too, so the batch is unhealthy\
  \ and dissolves.\n\n**WHEN THE PROVEN CULPRIT IS THE HEAD, THE PEERS ARE RELEASED\
  \ AND THE HEAD VERIFIES ALONE**\n(measured 2026-08-21). The head bound above is\
  \ UNCHANGED and is not overcome here: the\nhead still owns the ff branch and is\
  \ still never evicted. What changes is the DISPOSITION OF THE\nPEERS when the oracle\
  \ has proven the head reproduces the red alone. Dissolving there requeues every\n\
  innocent peer for a failure already attributed to somebody else — three consecutive\
  \ red batches on\n2026-08-21 (06:27:46, 06:37:07, 06:44:23) requeued twelve member-attempts\
  \ and landed nothing, two of\nthem declining as `head-is-culprit`, i.e. the offender\
  \ WAS identified and could not be acted on.\n\nA PINNED red REACHES THIS ARM TOO,\
  \ since. Before the pinned attribution above, a\npinned entry could never produce\
  \ `culprits` at all — the oracle refused it at gate 1 — so no pinned\nred ever derived\
  \ `head-is-culprit` and this arm was UNREACHABLE for one. Now a pinned entry\nuniquely\
  \ owned by the HEAD yields exactly that: the attribution names index 0 alone, the\
  \ head bound\nrefuses the eviction, the decline derives `head-is-culprit`, and the\
  \ peers are RELEASED rather than\ndissolved. That is the 3-of-7 head-containing\
  \ case the measured bound above counts — they are no\nlonger merely spared an eviction,\
  \ they are de-escalated. The route is asserted end-to-end, with a\ndifferential\
  \ per mechanism, by `tests/test_t11645_pinned_red_head_is_culprit_routing.py`.\n\
  \nNARROWED BY — \"the proven culprit is the head\" means the head is the ONLY proven\
  \ culprit.\nThe head arm is asked LAST of the two, not first: a culprit set naming\
  \ the head BESIDE an evictable\nNON-HEAD member is not this decline at all, it is\
  \ an ordinary eviction, and the non-head member is\nevicted while the head stays.\
  \ Only a set whose sole member is index 0 reaches `head-is-culprit` and\ntherefore\
  \ this release. That ordering is the code's\n(`_land_red_decline_record`, `bin/lib/batch_landing.py`),\
  \ and it does not weaken anything above —\nthe head is still never evicted, and\
  \ a release still costs nobody a punished requeue. It sharpens\nWHEN the release\
  \ fires, so a reader does not infer from \"the proven culprit is the head\" that\
  \ a\nhead-containing set suffices.\n\nSo on that ONE decline reason the land RELEASES\
  \ its peers and re-forms ALONE. Nobody lands on this\npass either — this de-escalates\
  \ the batch, it does not rescue it — but the head then fails or passes\nON ITS OWN,\
  \ which makes its next verdict unambiguously its own, and the released peers form\
  \ the NEXT\nbatch without it. This is deliberately NOT the deferred carry-the-survivors\
  \ design (landing the peers\nPAST a red head), which would need a different ff target\
  \ — a throwaway branch off `merged_base`\ncarrying only the peers — plus rework\
  \ of this rule's atomicity argument and of\n`_land_members_carried_by_ff`. Nothing\
  \ of the sort is introduced: the head keeps its own ff branch, a\nSOLO batch is\
  \ an already-supported formation shape (the head short-circuit in `_land_batch_members`,\n\
  entered here by the same gate rebaselining and pinned-supersession already use),\
  \ and the carried-by-ff\naccounting is untouched.\n\nTHREE BOUNDS ON THE RELEASE,\
  \ all of them existing mechanisms rather than new ones:\n  * A RELEASE IS NOT A\
  \ PUNISHMENT. A released peer keeps the ordinary `requeued-after-red-batch`\n  \
  \  verdict (rule 5's vocabulary stays closed — it IS requeued) and is marked `batch_ineligible:\n\
  \    False`, so the one-round mark does NOT fall on it and it re-enters the very\
  \ next formation on the\n    same terms as any other candidate. It carries an additive\
  \ `released_from_batch` record naming the\n    reason and the head, so a reader\
  \ can tell a release from a punished requeue on the row alone\n    rather than by\
  \ inferring it from an absent penalty.\n    **AND IT CARRIES WHOSE THE RED IS**\
  \ (`failure_attribution`) — the OTHER HALF of the\n    cause below, and the one\
  \ that makes the head-is-culprit verdict CHECKABLE rather than merely\n    readable.\
  \ The attribution probe re-runs only the failing files at the merge-base and\n \
  \   returns `{outcome: branch | main | undecidable, reason, failing, at_main, at_branch}`;\
  \ that\n    record reaches the `land_completed` ABORT row, but a peers-released\
  \ red does not ABORT, it\n    RETRIES, so no abort row is written for the attempt\
  \ and the verdict never travelled. Folded\n    over the engine's journal at filing\
  \ time: 327 `land_member_verdict` rows, 40 of them released,\n    and ZERO carrying\
  \ a verdict. With the cause alone a reader on main sees that a head was blamed\n\
  \    and on what — not whether that same assertion still fails WITHOUT the branch,\
  \ which on\n    2026-08-23 evening was the whole answer (three heads later passed\
  \ alone, one was genuinely\n    branch-attributed, three carried `outcome: main`\
  \ from an environment cause). The record is\n    HANDED to the arm, never recomputed:\
  \ the probe runs under the rule's admission slot and must\n    not be paid twice.\
  \ **THE `not-probed` SENTINEL READS AS ABSENCE on a member row**, and that is\n\
  \    not an inconsistency with the abort row: `cmd_land` initialises the record\
  \ to\n    `{outcome: undecidable, reason: not-probed}` when no slot was held and\
  \ the probe never ran, and\n    the abort row records that deliberately because\
  \ both readings are about an attempt the reader\n    is already looking at. A member\
  \ row carries no such context, so an `undecidable` for a red\n    nobody probed\
  \ would be a FABRICATED verdict — worse than a missing one. A PROBE-PRODUCED\n \
  \   `undecidable` IS recorded; the gate therefore keys on the reason, not on the\
  \ outcome, since the\n    two share one. It records the verdict the probe ALREADY\
  \ produced and changes WHO GETS BLAMED\n    not at all — rule 4's culprit-naming\
  \ boundary is untouched.\n    **AND IT CARRIES THE BATCH'S CAUSE** (`red_assertions`,\
  \ measured\n..) — on the SAME absent-means-UNRECORDED terms as a\n    dissolve's\
  \ rows, and through the SAME single marking site, not a second mechanism. Twelve\n\
  \    multi-member batches went red in those twelve hours; TEN ended on THIS arm\
  \ and put no cause on\n    any row that reaches `main`, while the two that DISSOLVED\
  \ carried it. The cause was not lost —\n    it reached the head's own `land_completed`\
  \ abort row — but that row is written in the HEAD\n    BRANCH's worktree journal\
  \ and a failed land never integrates, so from `main` alone a red batch\n    was\
  \ undiagnosable and triage meant opening `events.jsonl` inside each head worktree\
  \ by hand\n    (where the causes proved NOT to be uniform). This is the arm where\
  \ the peer is MOST entitled to\n    the answer: it is released precisely because\
  \ the red was attributed to somebody else, and it\n    still has to decide what\
  \ to do next. The key claims nothing about whose change it was — it is a\n    BATCH\
  \ fact, the head is the attributed member, and `released_from_batch` on the same\
  \ row already\n    says the peer was not blamed — so rule 5's verdict vocabulary\
  \ and the no-culprit-naming bound\n    are untouched.\n  * THE ANTI-LIVELOCK GUARANTEE\
  \ IS INHERITED, NOT WEAKENED. The releasing land re-forms with its head\n    SOLO\
  \ for the rest of its life, so the batch that was red cannot re-form on its retry.\
  \ The peers\n    are eligible again immediately, which is correct: nothing was shown\
  \ about them, and the member\n    that WAS shown to be the cause is the one branch\
  \ the next batch cannot contain, because it is\n    still this land's own head.\n\
  \  * THE SAME ONE-ROUND BUDGET, not a second one. A red AFTER a release means the\
  \ head is red ALONE —\n    the individual verdict this rule wants — so there is\
  \ nothing left to de-escalate and the land\n    reaches its ordinary abort.\n\n\
  **THE ANTI-LIVELOCK GUARANTEE IS INHERITED, NOT RE-IMPLEMENTED.** The evicted culprit\
  \ keeps the\nordinary `requeued-after-red-batch` verdict — it IS requeued, for its\
  \ own solo land — so it is\nbatch-INELIGIBLE for one round by the UNCHANGED mechanism\
  \ above and cannot rejoin the retry's\nbatch or re-form the identical one. Rule\
  \ 5's verdict vocabulary is therefore untouched: the\neviction rides ADDITIVE keys\
  \ on that row (`evicted_as_culprit`, `red_isolation`), the same\ncopy-never-decide\
  \ shape the attribution already uses. What changes is WHO gets a row — the\ninnocent\
  \ peers no longer do, because they are no longer requeued.\n\n**This does not weaken\
  \ the anti-livelock guarantee above, and the guarantee is what bounds it.** A\n\
  dissolve marks either at least one attributed culprit or every member — never nobody\
  \ — so the culprit\nis still excluded, the next formation is drawn from a strictly\
  \ smaller candidate set, and the\nidentical batch still cannot re-form. A member\
  \ left eligible is not \"released early\": it was never\nshown to be part of the\
  \ cause, and it simply re-enters ordinary formation with no residual mark, no\n\
  retry counter and no timer. What is NOT changed is how long the mark lasts or what\
  \ discharges it —\none round, cleared by the member's own individual verdict whose\
  \ verify actually ran.\n\n**THE HEAD MEMBER'S BRANCH IS RESTORED ON EVERY NON-LANDING\
  \ END, NOT ONLY ON A RED DISSOLVE**\n(measured 2026-08-17). A batch is built by\
  \ merging the PEERS INTO THE HEAD MEMBER'S OWN\nBRANCH, so on a green batch those\
  \ merges ARE the joint land and correctly stay. On every OTHER end\nthey are another\
  \ card's commits sitting in this card's history. The restoration was originally\n\
  written as the first of the red dissolve's two acts, which made it reachable ONLY\
  \ from the red\npath: an abort, an uncaught exception, or exhausted retries all\
  \ bypassed it. The batch formed at\n produced ZERO member verdicts — it neither\
  \ landed nor dissolved — and its head\n`task/` still carries `7c1db2aad` and `5cd3567ae`.\
  \ It then INHERITED a peer's un-landable\nconflict and sat roughly an hour blocked\
  \ on a conflict that was never its own. Unlike a wasted pass,\nthis damage does\
  \ not clear on the next attempt; it stays in that branch's history until a human\n\
  notices.\n\nThe rule is therefore stated on the END, not on the CAUSE: **whenever\
  \ a land that merged peers into\nthe head member's branch ends WITHOUT fast-forwarding,\
  \ that branch returns to its pre-formation\nstate.** The green path is the sole\
  \ exception and it is decided by a positive fact — the ff\nsucceeded — never inferred\
  \ from how the land exited. Enumerating the failing ends is NOT an\nacceptable implementation:\
  \ it is fail-open by construction, since the next exit added to the land\npath silently\
  \ reopens the hole this paragraph exists to close.\n\n**AN UNPERFORMABLE RESTORATION\
  \ IS LOUD.** The original implementation guarded the reset on three\nconditions\
  \ and wrapped it in a bare `except: pass`, while this rule's own text promised the\
  \ peers'\ncommits leave the branch — a promise stated and not kept, the same stated-fail-closed\
  \ /\nimplemented-fail-open class as. Worse, the swallow was invisible rather than\
  \ merely\ntolerant: the git helper returns a completed process instead of raising,\
  \ so a FAILING reset produced\nno exception to catch at all. A restoration that\
  \ cannot be performed or cannot be proven is\njournaled and surfaced; it is never\
  \ silent. It stays NON-FATAL — every caller is on a path that is\nalready ending,\
  \ and raising there would replace a precise diagnosis with a git error — because\
  \ \"not\nfatal\" and \"not recorded\" are different things and only the first was\
  \ ever intended.\n\n**THE BOUND THIS RULE DOES NOT CLAIM TO COVER.** A process KILLED\
  \ outright runs no cleanup of its\nown, so no in-process restoration reaches every\
  \ case. That residue is NOT solved here and must not\nbe read as solved; what the\
  \ rule requires instead is that it be DETECTABLE — a named read identifies\na head\
  \ branch carrying peers' merge commits, names those commits, and says what to do.\
  \ Detection\nand advice only: repairing such a branch stays a human act, because\
  \ the read cannot know which\ncommits above the contamination are the author's own.\n\
  \n**A LAND THAT IS REBASELINING A PINNED ASSERTION IS BATCH-INELIGIBLE BEFORE THE\
  \ PASS, NOT AFTER IT**\n(measured 2026-08-17). Everything above learns ineligibility\
  \ from a red batch — i.e. after a\nfull combined pass has already been spent. One\
  \ class is knowable BEFORE: a member whose change\nSUPERSEDES a pinned assertion\
  \ reddens any combined candidate it joins, and the only thing that clears\nthat\
  \ red is a `--rebaseline` declaration scoped to the assertions ONE `--rebaseline-waive`\
  \ set NAMES,\nauthorised by THAT card's own audit-post (SPEC-0077 §3a). No other\
  \ member can carry it. So such a\nmember is not a batch that MIGHT fail; it is a\
  \ batch that CANNOT land. It is therefore excluded at\nthe SAME two decision points\
  \ rule 4 already owns — a rebaselining HEAD forms a batch of ONE, a\nrebaselining\
  \ PEER is dropped BEFORE the cap — and the exclusion is REPORTED through the rule-1\n\
  exclusion sink with its own named reason, so a solo land still says why it was solo.\
  \ What does NOT\nchange: the rebaselining land itself lands SOLO exactly as before,\
  \ with its own declaration and its\nown fresh audit-post. No gate is removed, no\
  \ authority widened, no event type or store added, and the\nland is NOT refused\
  \ — the pre-queue refusal shape is for a land that cannot succeed AT ALL, and a\n\
  rebaselining land succeeds fine alone.\n\nRate, so the rule is sized rather than\
  \ guessed: 6 of 48 branches that landed on 2026-08-17 carried a\nrebaseline (~12.5%),\
  \ giving a batch of N a superseder with probability ≈ 1 − 0.875^N — 23% at N=2,\n\
  41% at N=4. BOTH formations that day contained one and BOTH died red; under this\
  \ rule neither would\nhave formed, costing zero successful batches and saving two\
  \ combined passes. The second occurrence\nlanded the cost entirely on a bystander:\
  \ a filing land of two YAML cards (an inert diff) was batched\nwith a superseding\
  \ peer and reddened by it, `paying_members` 1 of 2.\n\n**THE PEER'S INTENT RIDES\
  \ THE WAIT ROW THE QUEUE READ ALREADY CONSUMES.** The head knows its own\nflags;\
  \ a peer's declaration must be visible in the journal. It is, and early enough by\
  \ construction:\n`--rebaseline` is declared at ARGUMENT-PARSE time and an EMPTY\
  \ `--rebaseline-waive` is refused right\nthere, so an intending land carries a complete\
  \ declaration before the reservation, before\nthe queue read and before formation\
  \ — and it beats `waiting_for_*` heartbeats the whole time it is\nqueued. Those\
  \ rows carry an ADDITIVE `rebaselining: true`, present ONLY when declared, on BOTH\
  \ wait\ntypes (the reservation row matters most: lands serialize behind the reservation,\
  \ so a queued peer is\nnormally parked there and only the holder reaches the admission\
  \ slot). This is the same additive-key\ngrowth `solo` / `queue_depth` already ride\
  \ — no second store and no new event type, and a\nnon-rebaselining land's rows stay\
  \ byte-identical. Freshness is load-bearing: only rows inside the\nqueue read's\
  \ own window count, newest-wins, so a PRIOR attempt's declaration never excludes\
  \ a later\nflagless attempt of the same branch — the exclusion is attempt-scoped,\
  \ and rule 4 is not a quarantine.\n\n**THERE ARE TWO DOORS TO THAT KEY, AND THE\
  \ SECOND IS TOKENLESS ( — an ADDITIVE extension;\na `--rebaseline` land's behaviour\
  \ is UNCHANGED).** The paragraph above describes the GRANT door, and\nfor a while\
  \ it was the only one — which STARVED this whole filter. `--rebaseline` conflates\
  \ two\nseparable things: the DECLARATION of intent (\"I expect to supersede a pinned\
  \ assertion; verify me\nALONE\"), which is a batch-formation input, and the GRANT\
  \ of a waive (\"waive these named assertions\"),\nwhich needs a `KEY::ASSERTION`\
  \ token. That token names what actually FAILED, so the sanctioned way to\nlearn\
  \ it is to read it off a LIVE refusal — i.e. AFTER the branch has already reddened\
  \ a batch and\ncost its peers a shared pass. To avoid poisoning you had to declare;\
  \ to declare you had to first\npoison. The filter was not wrong, it was unreachable\
  \ in time.\n\nSo `land --expect-rebaseline` reaches the SAME key with NO waive token\
  \ and no prior failure. It is a\nDECLARATION ONLY and **GRANTS NOTHING**: the full\
  \ candidate verify, the pinned last-green suite, the\n`--rebaseline-waive` matcher\
  \ and the audit-currency gate are untouched, and a pinned assertion that\nfails\
  \ still REFUSES that land exactly as before — the operator then reads the authoritative\
  \ token off\nits OWN solo refusal and re-lands with `--rebaseline`, having cost\
  \ no peer anything. Every property\nthe paragraph above states is INHERITED rather\
  \ than re-engineered, because the carrier is the same\nwait row: absent-unless-true,\
  \ so a non-declaring land's rows stay byte-identical; folded by the same\n`_land_rebaselining_branches`\
  \ through the same freshness window, so the exclusion stays ATTEMPT-SCOPED\nand\
  \ rule 4 still is not a quarantine; and reported under the same rule-1 sink reason,\
  \ so no new\n`queue_excluded` string exists. In the land path one derived name —\
  \ `declares_rebaseline =\nowner_rebaseline or expect_rebaseline` — feeds the formation\
  \ call and the admission heartbeat, while\nthe reservation heartbeat reaches the\
  \ key through its own second branch; every OTHER `owner_rebaseline`\nsite is a GRANT\
  \ or EXEMPTION site and is deliberately NOT widened, which is what confines a tokenless\n\
  declaration to moving batch formation and nothing else.\n\n**THE CHAIN HAS A SECOND\
  \ EXPLICIT GROUND, AND IT IS NOT A THIRD DOOR TO THE KEY ABOVE ( —\nadditive; every\
  \ `--rebaseline` / `--expect-rebaseline` behaviour is UNCHANGED).** Both doors above\n\
  state the SAME thing: \"I expect to supersede a pinned assertion\". A branch whose\
  \ ACCEPTANCE PROBE\ncannot read a MERGED tree states something else. The canonical\
  \ shape, and this ground's first real\ninstance, is : a probe that measures the\
  \ branch's own diff against `main` and asserts a file\nset, which inside a batch\
  \ measures the PEERS' files and reddens the combined candidate through no\nfault\
  \ of the branch. Such a branch supersedes NO pinned assertion and has NOTHING to\
  \ waive, so\ndeclaring a rebaseline would be a FALSE STATEMENT — in prose, and in\
  \ the two machine-readable places\nthe wait-row key `rebaselining` and the sink\
  \ reason `rebaselining-pinned-assertion` occupy.\ndeclined to make it and therefore\
  \ had no honest way to ask for the solo verify it needed. MEASURED\nCOST OF THAT\
  \ GAP: 6 batches in ~60 minutes all reddening on ONE assertion; requeues ×5 ×4 ×3\
  \ ×2 — each a fully paid verify that shipped nothing. The ground's NAME\nand the\
  \ shape of the remedy are the external auditor's (2026-08-28): «Add a separate ground\
  \ such as\n`acceptance-assertion-merge-invalid`; keep the rebaseline declaration,\
  \ hint behavior, and\nper-assertion waive-token rule distinct.»\n\nSo `land --merge-invalid-acceptance\
  \ --merge-invalid-assertion <NAME>` enters at exactly the two\ndecision points above\
  \ — a declaring HEAD forms a batch of one, a declaring PEER is dropped before the\n\
  cap — with its OWN additive wait-row key (`merge_invalid_acceptance`, on BOTH\n\
  `_LAND_QUEUE_WAIT_TYPES` rows), its OWN sink reason (`acceptance-assertion-merge-invalid`),\
  \ and its\nown reader, which is a thin WRAPPER over `_land_rebaselining_branches`\
  \ rather than a fork of it, so\nthe freshness window, the newest-wins rule and the\
  \ fail-open direction cannot drift apart. It\ntherefore inherits attempt-scoping\
  \ unchanged: this is a declaration for ONE round, never a quarantine.\n\n**WHAT\
  \ IT DOES NOT DO IS THE LOAD-BEARING PART.** It GRANTS NOTHING — the full candidate\
  \ verify, the\npinned last-green suite, the `--rebaseline-waive` matcher and the\
  \ audit-currency gate are all\nuntouched. It is deliberately absent from `declares_rebaseline`,\
  \ and — the part a reader must not\nskim — deliberately absent from the `_sup =\
  \ _sup - _reb` precedence subtraction: that subtraction\nencodes an AUTHORITY (a\
  \ declared rebaseline is the sanctioned way to supersede a pinned assertion,\nSPEC-0077\
  \ §3a), and this ground carries none. A branch that supersedes a pinned assertion\
  \ still owes\nits own `--rebaseline` and still fails closed without one. For the\
  \ same reason the new filter runs\nLAST, after `_sup`: a candidate carrying both\
  \ facts is reported under the SUPERSESSION reason,\nbecause that is the one that\
  \ names an obligation the operator still owes — reporting it under this\nground\
  \ would read as \"handled\" and suppress that obligation through the sink instead\
  \ of through the\nsubtraction. THE GROUND IS EXPLICIT, NEVER INFERRED: a bare declaration\
  \ naming no assertion is\nREFUSED at argument-parse time (abort class `merge-invalid-acceptance-undeclared`,\
  \ the fail-closed\ndoor put on an empty `--rebaseline-waive`), and the names it\
  \ does give are RECORDED on the\nwait rows and on `land_completed`, so a false declaration\
  \ is attributable rather than quietly\ngranted. Inferring the ground from a diff\
  \ would be exactly the positional guessing the red-batch\nculprit probe was retired\
  \ for.\n\n**THIS DOES NOT CLOSE THE CIRCULARITY COMPLETELY, and the spec says so\
  \ rather than letting a reader\nassume it.** The available pre-failure HINT — a\
  \ branch that MODIFIES an existing `tests/` file — is\noffered as an ASK at `worktree\
  \ sync` and is NEVER acted on by exclusion: measured over 283 branches in\n7 days\
  \ it scores recall 94%, false-positive 43%, PRECISION 30% (`fu_74b26470c694`), so\
  \ excluding on it\nwould drop about half the queue and disable batching. And it\
  \ MISSES source-only supersessions\nentirely — a branch that breaks a pinned test\
  \ WITHOUT touching it, by changing the source that test\nreads. That case needs\
  \ a pinned-test-to-source coverage map and is not addressed here.\n\n**RECORDED,\
  \ SO IT IS NOT RE-PROPOSED: PER-MEMBER REBASELINE DECLARATIONS WERE DECLINED BY\
  \ THE OWNER**\n(2026-08-17). The alternative design — a batch carrying one rebaseline\
  \ declaration per member, each\nbound to its own author's audit-post — was put to\
  \ the owner and declined explicitly to avoid widening\nwho may waive a gate. Exclusion\
  \ is the chosen design, not a stopgap for that one, and roughly 12.5%\nof lands\
  \ staying outside amortisation is the ACCEPTED cost.\n\n**A CANDIDATE WHOSE OWN\
  \ COMMIT ROW ALREADY CARRIES A PINNED-SUPERSESSION NOTICE IS BATCH-INELIGIBLE\n\
  TOO** (filed 2026-08-18). The clause above learns the supersession from the author's\
  \ own\n`--rebaseline` DECLARATION. There is a third source, and the system was already\
  \ writing it down and\nthen ignoring it: when a commit's diff REMOVES an assertion\
  \ line from the pinned surface, `task\ncommit` / `work commit` prints the notice\
  \ and records it as\n`data.pinned_supersession` on that commit's `commit_landed`\
  \ row. A candidate whose LATEST such row\ncarries that key has probably superseded\
  \ a pinned assertion WITHOUT declaring it — the exact shape\nthat reddens a combined\
  \ candidate and that no peer can clear. It is therefore excluded at the SAME\ntwo\
  \ decision points rule 4 already owns — such a HEAD forms a batch of ONE, such a\
  \ PEER is dropped\nBEFORE the cap — and the peer drop is REPORTED through the rule-1\
  \ exclusion sink with its own named\nreason, so a solo land still says why it was\
  \ solo.\n\n**PRECEDENCE: A DECLARED REBASELINE CLEARS THIS EXCLUSION.** A `--rebaseline`\
  \ declaration is the\nAUTHORISED way to supersede a pinned assertion (SPEC-0077\
  \ §3a), so a candidate that has declared\none is not excluded by THIS input at all;\
  \ it may still be dropped for that attempt by the\ndeclaration clause above, and\
  \ is then reported EXACTLY ONCE, by that clause's reason. Reporting it\ntwice would\
  \ inflate `queue_depth`, whose meaning is the candidates the formation SAW.\n\n\
  **NON-PERMANENCE IS CARRIED BY A MEANINGFUL EVENT, NOT BY A TIME WINDOW AND NOT\
  \ BY A ROW'S MERE\nARRIVAL** (tightened; the criterion this replaces is recorded\
  \ at the end of this\nclause). A commit row carrying the notice ARMS the exclusion.\
  \ The exclusion is DISCHARGED only by\nan event that RESOLVES the supersession,\
  \ and there are exactly two: an evidence-bound\n`--rebaseline` declaration naming\
  \ the assertion (the precedence clause above), or a later SHIP\nCOMMIT — a task-tied\
  \ `commit_landed` row for a real code change-set — that itself fired no notice.\n\
  Every other row is BOOKKEEPING and is PASS-THROUGH: it neither arms nor discharges,\
  \ and leaves the\nbranch exactly as the last meaningful event left it. A branch\
  \ that declares its waive, or ships\nagain cleanly, is admissible IMMEDIATELY —\
  \ one round, never a quarantine.\n\nThe SHIP/BOOKKEEPING test is the field the row\
  \ already carries and is FAIL-CLOSED: `task commit` —\nthe only emitter of a task's\
  \ ship row — writes no `data.kind`, while every bookkeeping emitter\nnames one (`closure`,\
  \ `pause`, `wont-do`, `park`, `closes_fp_link`, `pv_late_link`,\n`probe_settle_link`,\
  \ `reaudit-after-close`, `history-rewrite-repin`, `plan-*`, and `work` for the\n\
  task-id-less `work commit`). So the reader requires the ABSENCE of a kind to discharge,\
  \ expressed\nas a positive ship test rather than as a bookkeeping blocklist — a\
  \ kind invented later cannot\ndischarge by default, and no enumeration has to be\
  \ kept current for that to hold. Arming is\nunconditional on kind: a substantive\
  \ notice is a fact about a diff whatever row carries it.\n\nWHY THE EARLIER CRITERION\
  \ HAD TO GO, measured on this rule's OWN founding case. shipped\n\"the LATEST row\
  \ wins; a later row without the key clears\", which made the rule STRUCTURALLY INERT:\n\
  the Stage-9 CLOSURE record is a commit row the lifecycle emits for every task between\
  \ its ship\ncommit and its land, so the ship commit armed the flag and the closure\
  \ commit disarmed it before\nany land could be attempted. task/ — the very branch\
  \ this rule was built from — emitted its\nkeyed ship row at and a `kind: closure`\
  \ row at 06:43:05Z, 2m38s BEFORE the\n06:45:43Z formation, so it would have been\
  \ admitted exactly as it was. This generalises rather than\nbeing one unlucky ordering:\
  \ 2189 of 2376 task ids carry more than one `commit_landed` row and 2052\nof those\
  \ rows are closure records.\n\n**THE THIRD DISCHARGE IS EXPIRY, REPLACING \"deliberately\
  \ still NO freshness window\".**\nThat clause reasoned that a wait heartbeat is\
  \ evidence of NOW and goes stale while a commit row is\na fact that does not, so\
  \ a window would EXPIRE a live supersession and admit the very member this\nexcludes.\
  \ The first half is true; the second answers the wrong question. THE CLAIM WAS NEVER\n\
  ACTUALLY KEPT: the reader implemented a 512KB byte tail covering roughly 36 minutes\
  \ of a busy\njournal, so the operative lifetime was a write-rate artefact — shortest\
  \ exactly when the journal is\nbusiest, which is when the answer is load-bearing\
  \ — that nothing declared and nothing reported. An\nunbounded lifetime cannot be\
  \ served by a LIVE-SEGMENT read AT ALL, and the coverage report cannot\nrescue it\
  \ — loudness is not reach. made the archive case LOUD (reaching offset 0 counts\
  \ as\ncoverage only when no older segment sits beside the journal, so a short live\
  \ segment is REPORTED as\nthe SPEC-0190 rule-4 archive-branch condition it is),\
  \ but a report that an answer is truncated is\nnot an answer: an arming row rotation\
  \ moved into an archive is still outside what this read can\n. So the rule is BOUNDED\
  \ instead, and read and rule became one number\n(`_LAND_PINNED_SUPERSESSION_HORIZON_SEC`,\
  \ pinned to the live window — the longest span a\nlive-segment read can serve without\
  \ the segment-aware archive fold SPEC-0190 rule 4 prescribes).\nA flag now discharges\
  \ on a later clean SHIP row, on an evidence-bound `--rebaseline` declaration,\n\
  or by EXPIRY that many seconds after the arming row.\nIT IS A RULE, NOT AN ARTEFACT\
  \ OF THE READ — the age test runs over every row that arrives,\nincluding an injected\
  \ list no window ever bounded, which is what makes the older-than-horizon case\n\
  assertable as behaviour. An UNDATABLE row is kept, never discharged: its age is\
  \ unknown, and this\nclause is fail-open about missing an exclusion, not licensed\
  \ to invent an expiry it cannot date.\nTHE FAIL DIRECTION MAKES IT SOUND: this clause\
  \ fails OPEN, so a missed exclusion costs ONE repeated\nbatch while a spurious one\
  \ would shrink batches on bad data — an expiry can only cost a pass, never\nadmit\
  \ a wrong exclusion. And rule 4's red-batch fallback stands unchanged behind it:\
  \ a branch that\nreally does supersede still reddens its batch, still takes the\
  \ one-round mark and is still verified\nalone. This clause SAVES that pass; it is\
  \ not what makes the outcome safe. The horizon is\nDECLARED-BY-CARRIER, never measured\
  \ — at n=1 firings (see the paragraph below) there is no\narm->discharge distribution\
  \ to measure, and reporting one would be a fabricated measurement.\n\n**THIS SHIPS\
  \ A HYPOTHESIS, NOT A MEASURED PRECISION, and the spec records that rather than\
  \ a rate.**\nThe notice has fired EXACTLY ONCE since it began being journaled at,\
  \ and that\none firing (commit_landed, 06:40:56Z, count=1 naming `tests/test_pinned_verify.py`)\n\
  preceded the death of the four-member batch formed 4m47s later, which died on two\
  \ pinned assertions\n— the FIRST of them that same file ( attributed both to). n=1:\
  \ one firing predicting\none death is not a precision measurement. What supports\
  \ the rule beyond n=1 is the notice's DESIGN\n(it fires only on a REMOVED assertion\
  \ line, so it stays off the ~90% of branches that merely touch\n`tests/`, and an\
  \ add-only diff records no key at all) and undeclared supersession being 3-for-3\
  \ as\nthe cause of post-fix batch deaths. The heavier alternative — a\nfile-touch\
  \ predictor — was MEASURED over 107 task-branches (recall 96%, precision 32%, excluding\n\
  66% of the pool) and is NOT built: the notice is the sharper instrument and already\
  \ exists.\n\n**PARTIAL COVERAGE, STATED SO THE INSTRUMENT IS NOT OVERSTATED.** The\
  \ notice named ONE of the two\nassertions that killed that batch; one named supersession\
  \ suffices to EXCLUDE, but the notice does\nnot enumerate every supersession a diff\
  \ causes. And the read sees a candidate's commit rows only\nonce they are in the\
  \ journal it reads: a QUEUED PEER's freshest rows live in its own worktree\njournal\
  \ until its land folds them (measured 2026-08-18). The read is therefore pointed\
  \ at the\nLANDING worktree's journal — a superset of main's, and the only place\
  \ the HEAD's own rows exist\nbefore the ff — which covers the traced shape (the\
  \ superseder was the HEAD). A peer whose\nsupersession is still branch-local is\
  \ not seen; that is a bound of the carrier, not of this rule.\n\n**THE FORMATION\
  \ ROW CARRIES THE THREE IDS OF THE DECISION IT RECORDS.** Rule 5's join key\ntold\
  \ a reader WHICH batch a row belonged to; it never told them WHAT that batch was.\
  \ Measured over\n687 `land_batch_formed` rows (2026-08-18..25, 115 multi-member),\
  \ members were identified by BRANCH\nNAME ONLY — and a branch is DELETED when it\
  \ lands, so afterwards the name resolves to nothing. Why\nthis cannot be a later\
  \ derivation: formation MERGES its members onto the head member's branch (rule\n\
  3, above) about one second after emitting its row, so the row, the branch tips,\
  \ git ancestry and\nmerge-tree all show POST-merge state, which is indistinguishable\
  \ from pre-existing containment. The\nrow therefore RECORDS, at the formation instant\
  \ and ABOVE that merge, exactly the three facts that\nbecome unrecoverable: `member_tips`\
  \ (a commit id per member), `base` (the `main` commit the batch\nwas formed on)\
  \ and `pinned_baseline` (the pinned last-green verifier surface in force — its parts\n\
  AND a digest, so a reader recovers WHICH surface moved across a rebaseline, not\
  \ merely that one\ndid). ADMISSION RULE, and the bound on this growth: RECORD WHAT\
  \ BECOMES UNRECOVERABLE, DERIVE\nEVERYTHING ELSE — containment between members,\
  \ file overlap and per-member distance from `main` all\nfall out of those three\
  \ and are deliberately NOT fields. Additive keys on the existing row\n(SPEC-0025),\
  \ conditional on the reader being supplied, so rule 1's quiet-repo byte-identity\n\
  is untouched. This makes the formation decision AUDITABLE; it changes no batching\
  \ behaviour.\n\n### 5. Every member gets its own verdict\nEach member's outcome\
  \ — **landed · evicted-for-conflict · requeued-after-red-batch ·\ndropped-dead-member**\
  \ — is journaled individually. That vocabulary is EXACTLY the set cards 1-4\ndeliver,\
  \ and it deliberately omits `evicted-as-culprit` (plan-check finding 2, 2026-08-16):\
  \ naming a\nculprit requires the bisection this spec puts out of scope, so a verdict\
  \ vocabulary carrying it would\npromise an outcome nothing can produce. This is\
  \ not reporting garnish — it is what lets a member\nlearn its own fate without reconstructing\
  \ the batch, and it is the seam SPEC-0180 needs (below).\n\n**THE OMISSION STANDS,\
  \ BUT ITS REASON HAS MOVED.** Rule 4's isolation oracle CAN now name\na culprit,\
  \ so \"nothing can produce that outcome\" is no longer why the value is absent.\
  \ The\nvocabulary stays CLOSED at these four for a better reason: an evicted culprit\
  \ IS\n`requeued-after-red-batch` — it goes back to the queue for its own solo land,\
  \ which is exactly what\nthat value says — and it is the value rule 4's one-round\
  \ ineligibility read consults, so a fifth\nvalue would need that mechanism taught\
  \ a second name to keep the anti-livelock guarantee. The\neviction is carried instead\
  \ by ADDITIVE keys on the same row (`evicted_as_culprit`,\n`red_isolation`), which\
  \ is the growth SPEC-0025 / already sanction. What rule 4's change\naltered is WHO\
  \ gets a row — the innocent peers no longer get one, because they are no longer\n\
  requeued — never what a row may SAY.\n\n**EVERY DECLARED MEMBER ENDS THE LAND WITH\
  \ EXACTLY ONE VERDICT ROW, AND THE FIFTH VALUE IS\n`unaccounted`.** The four values\
  \ above are the OUTCOMES, and they are emitted from\nexplicit member lists at four\
  \ call sites; nothing reconciled those lists against the set the\n`land_batch_formed`\
  \ row DECLARED. Measured : a batch declared three members,\ntwo verdict rows were\
  \ emitted, and `task/` received nothing at all — not landed, not\nevicted, not requeued,\
  \ not dropped — and formed its own batch a minute later. A member that\nleaves the\
  \ declared set with no row is indistinguishable from one that was never declared,\
  \ which\nis the same silence the FORMATION-side `queue_dispositions` closed one\
  \ step earlier on\nthe CANDIDATE axis. So the declared members are RECONCILED against\
  \ the rows actually emitted, at\nthe one catch-all end (`cmd_land`'s `finally`,\
  \ where the rule-4 batch restoration already runs —\na per-outcome-seam pair would\
  \ be fail-open by enumeration and would miss exactly the ends this\nincident sits\
  \ in), and each member left silent is journaled `unaccounted`.\n\n**`unaccounted`\
  \ IS NOT A FIFTH OUTCOME, AND THE TWO PRIOR DECISIONS BOTH STAND.** The\naudit-absorbed\
  \ 2026-08-16 decision (a removal reason must not become a claim about somebody's\n\
  CHANGES) and the sink below (diagnostic, non-terminal, `{branch, reason}`) are UNCHANGED:\
  \ the\nsink keeps recording every non-conflict removal, and none of the four outcome\
  \ values is widened.\n`unaccounted` asserts nothing about the member's changes.\
  \ It states the only fact the land owns\nabout a member it dropped — *this batch\
  \ declared you and produced no outcome for you* — and it is\nthe value already uses\
  \ for the same question one step earlier, reused rather than\nrespelled. It is deliberately\
  \ the value a drop point NOBODY HAS WRITTEN YET produces: a future\nfilter that\
  \ forgets its sink entry yields a visible row instead of a silent disappearance.\n\
  \nWhere a removal reason WAS recorded, it rides the row as `removal_reason` — BEST-EFFORT\n\
  enrichment, never the guarantee. The guarantee is the row; a reason nobody threaded\
  \ degrades to a\nbare `unaccounted`, which is still loud. **Rule 1 is untouched:**\
  \ the reconciler emits through the\nsame emitter, whose N=1 clause owns the byte-identity,\
  \ so a declared set of one produces nothing.\nThis amends only the sink paragraph's\
  \ sentence that read a sink entry as meaning \"has received NO\nverdict\" — it now\
  \ receives exactly one, and that row still carries no outcome.\n\n**A REMOVAL IS\
  \ RECORDED IN A SINK, AND A SINK IS NOT A VERDICT.** A member can leave a\nbatch\
  \ BEFORE the verify, and only ONE removal reason — `conflict` — produces a verdict\n\
  (`evicted-for-conflict`). The other four — `candidate-merge-failed`, `already-on-candidate`,\n\
  `head-unresolvable`, `not-in-landed-history` — deliberately produce NONE, and that\
  \ exclusion STANDS:\na verdict is a durable claim about a member's CHANGES, while\
  \ those four are facts about THIS\nATTEMPT (a ref that moved, a git error, work\
  \ already carried elsewhere), so journaling one as a\nverdict would invite a reader\
  \ to treat a transient failure as a property of somebody's change\n(audit-absorbed\
  \ 2026-08-16). What that decision never provided was ANY record: measured\n2026-08-18,\
  \ a member announced into a batch whose head then landed ok had its removal reason\n\
  UNRECOVERABLE from the journal. So every non-conflict removal is recorded as an\
  \ ATTEMPT-SCOPED\nSINK entry — `{branch, reason}` under `members_removed` on the\
  \ HEAD's own `land_completed` row,\npresent ONLY when non-empty so a land that removed\
  \ nobody stays byte-identical.\n\nThe sink is **DIAGNOSTIC, NON-TERMINAL, and NOT\
  \ a verdict**, and the naming carries that: it says\nwhat this ATTEMPT did, never\
  \ what a member IS. A branch listed there has received NO verdict and is\nstill\
  \ in its own queue — the terminal signal remains the member verdict alone, and a\
  \ reader must\nnot treat a sink entry as an outcome. That guard is the rule, not\
  \ a stylistic note: the one real\nrisk here is semantic drift, downstream readers\
  \ gradually reading sink entries as terminal\n(external consult, 2026-08-18, GREEN).\
  \ Conflicts are EXCLUDED from the sink because they already\ncarry the verdict,\
  \ and double-recording would blur exactly this line. Same shape and same argument\n\
  as the FORMATION-side `queue_excluded` sink — an exclusion nobody can see is\nindistinguishable\
  \ from one that never happened.\n\n**Bound, named not hidden:** the sink rides the\
  \ OK payload only. The abort row is composed by a\nseparate helper fed from many\
  \ call sites, so an abort at verify can still leave a pre-verify-removed\nmember\
  \ unrecorded while its surviving peers receive `requeued-after-red-batch`. Tracked,\
  \ not\nprose-deferred (followup `fu_ee82d6562144`).\n\n**At N=1 attribution REUSES\
  \ the existing land events and emits NO new row** (plan-check finding 1,\n2026-08-16).\
  \ Rule 1 requires a batch of one to be byte-identical to the pre-spec path — same\
  \ events,\nsame commits, same tokens — while this rule requires every member to\
  \ carry its own verdict. Read\nnaively the two collide: a new per-member row on\
  \ a singleton would break the identity Rule 1 promises.\nThey do not collide, and\
  \ the reason is not a carve-out but an observation: a singleton's land ALREADY\n\
  carries its member's verdict, because the member IS the land. The existing `land_completed`\
  \ row and\nits `^LAND:` token are that member's individual outcome, in full. So\
  \ attribution introduces NO new\ncarrier at N=1; the per-member rows this rule adds\
  \ exist ONLY for N>1, where there is no longer a\none-to-one land to read a member's\
  \ verdict from. As a probe-shaped invariant: the row set a land emits\nis UNCHANGED\
  \ at N=1 and grows only for N>1.\n\nWhat is being claimed compatible is BEHAVIORAL,\
  \ at three named levels — journal EVENTS (row set and\npayload shape), COMMITS (the\
  \ footprint the land leaves on `main`), and the terminal TOKEN contract\n(`^LAND:\
  \ (OK|ABORT)` as the final stdout line). It is NOT a claim of byte-identical process\
  \ output in\ngeneral: timings, verify heartbeats and progress lines are free to\
  \ differ, and a probe that keys on\nthem is testing the wrong thing.\n\n### 6. A\
  \ dead member is DROPPED; the batch is not — AMENDS SPEC-0180\n**This rule AMENDS\
  \ an ACTIVE spec and must ship as an amendment, not as a contradiction left for\
  \ a\nreader to reconcile** (plan-check finding 2, 2026-08-16). SPEC-0180 states\
  \ that a detached land dies\nwith the worker that claimed it. Under batching that\
  \ sentence, taken literally, lets ONE worker's\ndeath destroy a verify pass carrying\
  \ up to three uninvolved peers — a safety property turned into a\ndenial of service.\
  \ SPEC-0180's rule is therefore RESTATED there, by the card that builds this, as:\n\
  *a detached land dies with its claimant when the land carries only that claimant's\
  \ change; when the\nland carries a batch, the claimant's DEATH REMOVES ITS MEMBER,\
  \ and the land continues for the\nothers.* Until that amendment lands, the two specs\
  \ disagree and this one does not govern.\n\nThe protected property is unchanged:\
  \ no land may outlive the turn that authorised it. What changes is\nthe unit the\
  \ binding acts on — the member, not the pass.\n\nUnder batching the binding therefore\
  \ changes SUBJECT, not strength: a dead member is EVICTED from the\nbatch and its\
  \ change is not applied; the pass continues for everyone else.\n\nWHEN the death\
  \ is detected decides what that costs, and the two cases are NOT symmetric:\n\n\
  - **Before the verify starts** — the member is simply dropped from the candidate\
  \ and the pass runs\n  over the remaining set. Nothing is wasted.\n- **While the\
  \ verify is RUNNING** (plan-check finding 5, 2026-08-16) — the pass in flight is\
  \ over a\n  tree that includes the dead member, so its result cannot be applied\
  \ to anyone as-is. The pass is\n  NOT killed (that would waste the scarce resource\
  \ and punish the survivors for a peer's death): it\n  runs to completion and its\
  \ verdict is recorded for diagnosis, but the fast-forward is refused and\n  the\
  \ survivors are re-batched over the actual surviving set. A green verdict over a\
  \ tree containing\n  a change nobody will apply proves nothing about the tree that\
  \ would result from applying the rest.\n- **After the verify has passed** — the\
  \ surviving set is a DIFFERENT TREE from the one that was\n  verified, and it has\
  \ been verified by nothing. A and B can be green together precisely because\n  they\
  \ are together; B alone may be red. So the survivors are NOT fast-forwarded: the\
  \ batch either\n  RE-VERIFIES over the actual surviving set, or every survivor is\
  \ returned to the queue for the next\n  batch. Which of the two is a cost decision\
  \ the decomposition settles; that neither may be skipped\n  is not.\n\nAn earlier\
  \ draft of this rule allowed the survivors to land as one step, reasoning that the\n\
  surviving set is \"the verified set minus a change merely not applied\". That reasoning\
  \ is WRONG and\nis recorded here so it is not re-invented: removing a member from\
  \ a verified combination produces a\ncombination nobody verified, which is the exact\
  \ failure rule 4 exists to forbid (plan-check finding\n1, 2026-08-16).\n\nWhat must\
  \ NOT happen is the inverse: a member's land surviving its own worker. That is the\
  \ original\nF2 worker-death class and it stays forbidden.\n\n**The eviction signal\
  \ must exist for an INTERACTIVE member too** (owner question, 2026-08-16). Rule\
  \ 1\nadmits a Controller's `work/<slug>` land as an ordinary member, but this rule's\
  \ trigger — the\nclaimant's death — is drawn from the dispatched-worker case, where\
  \ the process exits at turn-yield and\nthat exit IS the signal. An interactive session\
  \ does not die that way: it can sit idle indefinitely\nwithout its member becoming\
  \ abandoned. So the trigger MUST NOT be \"the claimant process exited\",\nwhich\
  \ would evict every interactive member the moment its session backgrounded the land\
  \ — the\nhandbook's own recommended interactive posture (AGENTS-SESSIONS §land:\
  \ an interactive caller PREFERS\nto background the land). Defining it that way would\
  \ make the recommended path self-defeating.\n\nThe card that owns per-member liveness\
  \ therefore defines eviction on a claimant-kind-agnostic signal —\nthe member's\
  \ own claim ceasing to be held, however the claimant is structured — and proves\
  \ it on BOTH\nkinds: a dispatched worker's death evicts its member, and an interactive\
  \ member whose session merely\nbackgrounded its land does NOT get evicted. Until\
  \ both are proven, batching admits worker members\nonly; that restriction is a temporary\
  \ consequence of an unbuilt signal, NOT a rule about who may batch.\n\n### 7. The\
  \ SPEC-0077 pinned leg is evaluated on the COMBINED diff — fail-closed\nA third\
  \ of lands run the suite TWICE: SPEC-0077 re-runs `main`'s pre-change (\"pinned\
  \ last-green\")\nverifier alongside the candidate verifier whenever the diff touches\
  \ the verifier's OWN executable\nsurface, so a verifier-weakening change cannot\
  \ self-approve. A batch's candidate IS the merged tree,\nso the trigger MUST be\
  \ evaluated over the UNION of the members' diffs: **if ANY member touches the\n\
  verify path, the whole batch pays both legs.**\n\nThis is a CORRECTNESS constraint,\
  \ not tuning. In a batch, member A may weaken the verifier while\nmember B is a\
  \ bad change — the candidate leg then runs A's weakened verifier over B, and the\
  \ only\nthing still protecting B's peers is the pinned leg re-running the pre-change\
  \ verifier over that same\ncombined tree. Evaluating the trigger per-member, or\
  \ on the first member, or skipping the pinned leg\nto preserve the amortised saving,\
  \ silently voids SPEC-0077 for EVERY member of the batch — the exact\nself-approval\
  \ hole that spec exists to close, widened from one change to four.\n\nThe cost consequence\
  \ is stated so it is not discovered late: one verify-path-touching member imposes\n\
  the doubled regime on peers who did not touch it (measured ~3.1× the median single-leg\
  \ land). That is\nreal cost-shifting, and it is also where batching pays most —\
  \ amortising a DOUBLED pass across four\nmembers is the largest single saving available.\
  \ Neither observation licenses skipping the leg.\n\n### 8. A member whose content\
  \ the head already landed does NOT re-verify it\n\nMEASURED, and it is why this\
  \ rule exists: batching was saving ZERO. Of every batch member whose own\nland subsequently\
  \ completed ok, **16 of 16 ran a FULL verify anyway** (224837ms..541226ms; zero\n\
  `reverify_skipped`) — over the engine repo's whole history of `land_member_verdict`\
  \ rows with\n`verdict: landed` and `batch_size > 1`, captured `events.jsonl#ts=`.\
  \ The head puts\na member's content on `main` early via its fast-forward, but nothing\
  \ ever told the member so: its own\nland parks in a flock poll that reads the lock\
  \ and the clock and NOTHING else, so no verdict from\nrule 5 can reach it. It then\
  \ takes a verify slot and re-verifies content already in main. Rules 1-7\namortise\
  \ the pass ACROSS members; without this rule the member simply pays it again afterwards.\n\
  \n**The rule.** A land that carries nothing not already in `main` takes no land\
  \ reservation, no\nSPEC-0132 verify slot and runs no verify. It still fast-forwards\
  \ (a no-op), commits its bookkeeping,\ntears its worktree down and emits `LAND:\
  \ OK` — \"extinguished\" names what it PAYS, not an early exit.\nAn early return\
  \ would have to re-implement the ff, the bookkeeping, the teardown and the terminal\n\
  token, i.e. a second integration path (CHARTER §P5), and would strand the worktree\
  \ that land owns.\n\n**TWO QUESTIONS, KEPT SEPARATE — and this separation is the\
  \ rule, not an implementation note.**\n- A **per-branch marker**, written by the\
  \ head at the rule-5 verdict seam inside the ff lock and read\n  by the parked member,\
  \ decides **WHERE** a land stops paying: on the park path, before the\n  reservation.\
  \ It exists for PROMPTNESS and must be as cheap to read as the lock beside it —\
  \ ONE\n  existence test of a fixed path in the same off-tree sidecar as the reservation\
  \ flock and the\n  SPEC-0132 slots. **The park poll never reads the journal.** Parsing\
  \ a large append-only log every\n  poll interval is the wrong cost class, and is\
  \ precisely the defect a marker exists to avoid.\n- A **content check** decides\
  \ **WHETHER** the land is extinguished at all, and it is the only thing\n  that\
  \ does. A marker hit is a HINT TO LOOK, never a decision — which is what lets the\
  \ marker be\n  cheap without being trusted: the worst a stale, wrong or forged marker\
  \ can buy is one wasted git\n  call. The marker is consumed at the read, so it is\
  \ single-use and cannot go stale onto a reused\n  branch name.\n\n**BOUND — FAIL-CLOSED\
  \ ON CONTENT.** A land whose branch carries commits NOT in main is NEVER\nextinguished,\
  \ whatever the marker says, and an UNDECIDABLE answer keeps the land alive. Both\
  \ oracles\nmust answer POSITIVELY: the branch adds no commits the base lacks, AND\
  \ the delta about to fast-forward\nis INERT by SPEC-0064's one authority (consumed\
  \ here, never re-derived). The commit axis is the\nbinding one — a tree-only test\
  \ would admit a branch whose commits net out to no file change, i.e. real\nunlanded\
  \ history this land is the only carrier of. The cost asymmetry sets the direction:\
  \ a missed\nextinguish costs one pass, a wrong one loses work.\n\n**THE MARK IS\
  \ ALSO READ AT FORMATION — A MARKED PEER IS NOT A BATCH CANDIDATE.** The\nmarker\
  \ says a head's fast-forward already carried that branch's content, so such a branch\
  \ has\nnothing left to integrate; taking it as a candidate spends one of `BATCH_MAX`'s\
  \ places on a member\nthat can contribute nothing. So at rule-1 formation a QUEUED\
  \ PEER whose mark is set is DROPPED\nBEFORE the cap and REPORTED through the rule-1\
  \ exclusion sink with its own named reason — never\nsilently, because a drop that\
  \ writes no row is indistinguishable from a queue that was simply\nempty (`queue_depth`\
  \ is derived as the sink length plus the members, so a silent drop is blind in\n\
  BOTH directions; measured and 08:00:35Z). The read is the marker's own cost\nclass\
  \ — ONE existence test per candidate, no journal parse — and it is NON-CONSUMING:\
  \ the park\npath consumes the marker, formation only reads it, because unlinking\
  \ it here would destroy the\nhint that member's own parked land is about to use.\n\
  \n**BOUND — THIS STATES NOTHING ABOUT A MARKED HEAD, and that is the rule rather\
  \ than a gap**\n(controller resolution 2026-08-18). A genuinely superseded land\
  \ never reaches formation: it exits\nat the park site above, before it takes the\
  \ reservation formation runs under. Where this rule\nfails closed — an observable\
  \ tree delta, or a content oracle that cannot answer — the marker is\nOVERRIDDEN\
  \ and the land proceeds as an ordinary land carrying REAL content, and narrowing\
  \ THAT\nhead to a batch of one would cost a pass for nothing. The head is handled\
  \ upstream; formation\nanswers the peer half only.\n\n**BOUND — THE SUPERSEDED LAND\
  \ IS NOT PRESERVED AS A FUTURE BATCH HEAD.** An earlier reading argued it\nshould\
  \ stay alive because such a land often becomes head of the next batch and carries\
  \ other branches.\nThat argument is WITHDRAWN and must not be reintroduced: those\
  \ carried branches re-verified on their\nown regardless (the 16 of 16 above), so\
  \ the benefit never existed. The head role is not scarce —\nwhoever holds the slot\
  \ is head — so freeing it sooner strands nobody. Owner decision 2026-08-18.\n\n\
  **MARK BY BRANCH, NEVER BY TASK.** Of the 16 measured members, 9 were `task/` branches\
  \ and 7 were\n`work/` branches — including a bookkeeping-only controller-session\
  \ land that still burned 238880ms\nfor content already in main. A task-keyed marker\
  \ would leave nearly half the population uncovered.\n\n**THE SAVING IS RECORDED,\
  \ at the boundaries actually saved.** An extinguished land's `land_completed`\n\
  carries `superseded_extinguished`, `verify_slot_taken` and `land_reservation_taken`\
  \ beside the\nexisting `reverify_skipped` pair — separately, because a land that\
  \ skipped its verify but had already\ntaken the reservation saved ONE boundary and\
  \ a single flag would let that read as two. It reuses\n`reverify_skipped` deliberately:\
  \ that is the field the founding measurement read as zero, so the fix\nis counted\
  \ by the instrument that found the gap. **Coverage is bounded and stated, not assumed:**\
  \ a\nmember whose branch left containment before its own land — e.g. an earlier\
  \ ABORTED land of the same\nbranch already committed its step-2b/step-3 bookkeeping\
  \ onto it — fails the content fence and\nre-verifies. Over the 15 distinct measured\
  \ member branches, 10 were still contained and 5 were not.\n\n**Relationship to\
  \ SPEC-0065.** That spec's lever B is the existing analog and its safety argument\
  \ is\nreused verbatim: `main` advances ONLY via a green land, so the base is already\
  \ verified, and a delta\nthat changes nothing the verification environment executes\
  \ or observes yields a tree that is\nverification-EQUIVALENT to that already-green\
  \ base. The green-before-ff gate is preserved, not\nrelaxed — there is no untested\
  \ combination because there is no new combination. What differs is the\nquestion:\
  \ lever B asks it of a CONCURRENCY RETRY and is bounded to `attempt > 1` for its\
  \ own reasons;\nthis rule asks it of a SUPERSEDED MEMBER, on a strictly narrower\
  \ condition (no commits at all, not\nmerely an inert tree). SPEC-0065's bound is\
  \ untouched, and `reverify_skipped` now has two producers,\ndiscriminated by `reverify_skip_reason`.\n\
  \n### 9. A slot holder YIELDS to a strictly cheaper unmarked queued class\n\nRules\
  \ 1-8 make the batch cheaper to VERIFY. This rule is about WHOSE change the batch\
  \ is composed\naround, and it exists because that was being decided by chance: the\
  \ head is whoever happened to\ntake the reservation, so the batch class — and therefore\
  \ what the whole queue waits behind — is set\nby arrival order rather than by cost.\
  \ Owner directive 2026-08-18.\n\n**The rule.** A land holding the reservation, BEFORE\
  \ it verifies, reads the queue it already reads\nfor formation (rule 1). If a STRICTLY\
  \ CHEAPER class is queued behind it, it RELEASES the reservation\nand re-contends.\
  \ That is the whole rule: the decision is LOCAL, taken by each lander for itself,\n\
  from signals that already exist. There is no central assembler, no shared queue\
  \ state, and no\nwaiting for future arrivals — the batch-assembler alternative was\
  \ rejected by the owner precisely\nbecause it requires the head to WAIT for a composition\
  \ decision, which is the queue-state machinery\nCHARTER §6 forbids.\n\n**THE QUESTION\
  \ IS ASKED TWICE PER ATTEMPT, and the second time is where the queue has actually\n\
  changed (2026-08-19).** As first shipped the target was decided ONCE, at the instant\
  \ the\nreservation was taken, and was not re-decided until the holder's NEXT attempt.\
  \ A verify runs 4-8\nminutes (measured 241-951s that day), so the COMMON case —\
  \ a cheaper branch arriving DURING the\nholder's window — could never be offered\
  \ the slot. Measured under a deliberate six-worker load:\nZERO yields fired in ~90\
  \ minutes while the queue reached eight branches with cheap and expensive\nclasses\
  \ side by side, and FOUR branches degraded at the 2242s park bound; task/ (class\
  \ 2)\nheld the reservation ~08:13:15..08:30:05 while work/approved-asks-and-new-defects\
  \ (class 1,\nstrictly cheaper) began waiting at 08:27:44, fourteen minutes after\
  \ that holder's only evaluation.\nSo the holder ASKS AGAIN at the END of its pre-verify\
  \ integrate — after the merge from main, the\njournal fold and the graph rebuild,\
  \ and strictly BEFORE the rule-1 batch formation and the\nSPEC-0132 admission slot.\
  \ It still holds the reservation and has still verified nothing, so the\ncost invariant\
  \ is untouched: a yield costs a handover and never a verify.\n\n**AND THE SECOND\
  \ ASK IS PAIRED WITH A REDO, which is the rule rather than an implementation\ndetail.**\
  \ `merged_base` — the optimistic-concurrency key — is captured before the merge,\
  \ and a\nyield that fires AFTER the merge lets the addressee land, which advances\
  \ main and makes that key\nstale. A holder that then verified against it would lose\
  \ the entire pass to `retry-main-advanced`:\n3 lost attempts and 44 minutes of burned\
  \ verify were measured that same day, every one of them on\na branch that had degraded.\
  \ So a fired second yield RE-INTEGRATES against the newer main — a git\nmerge, a\
  \ journal fold and a graph rebuild, all seconds-class — instead of paying a second\
  \ suite.\nA bare late re-ask without the redo would be a NET REGRESSION on this\
  \ rule's own metric.\n\n**WHERE THE SECOND ASK MUST NOT BE, and this is load-bearing.**\
  \ NOT on the park poll tick. Both\npark loops read the flock, the clock and the\
  \ rule-8 offer marker and NOTHING else BY DESIGN; a\nqueue read there is the wrong\
  \ cost class, and audit-post already refused that shape.\nNOT after the verify either\
  \ — post-verify pre-ff is the same stale-base arithmetic as above, only\nworse,\
  \ because the pass is already paid when the handover invalidates it.\n\n**STILL\
  \ NO NEW BOUND: offer-once now means once-per-ATTEMPT, not once-per-CALL.** ONE\
  \ candidate\nset spans both evaluations, so each redo consumes at least one previously-unoffered\
  \ branch of the\nFINITE queue the read already bounds, and the rounds stop when\
  \ no new strictly-cheaper candidate\nis left. That is the SAME termination argument\
  \ this rule already makes, applied one level up — it\nnames no number, adds no counter,\
  \ cap, timer or tunable, and expires nothing. A per-call set would\nlet a peer that\
  \ is queued and never contends hold the holder in a release/re-take spin forever,\n\
  which is precisely why the set is the caller's.\n\n**THE HANDOVER IS ADDRESSED,\
  \ not a released window (2026-08-19).** As first shipped the\nrelease was UNADDRESSED\
  \ — the reservation simply went free and whoever polled first took it — so the\n\
  starving branch the yield existed FOR could miss its own handover. Measured 2026-08-18:\
  \ 4 yields fired\nwhile two class-0 branches degraded at their park limit, and a\
  \ bare `slot_yields` count could not tell\nthat apart from four successful handovers.\
  \ The yielder now publishes ONE off-tree offer NAMING the\nsuccessor; every other\
  \ peer abstains for that window, and the addressee CONSUMES the offer as it takes\n\
  the slot (consumption is the addressed branch's own act, exactly as with the rule-8\
  \ marker). Carrier,\ncost class and fail-open contract are rule 8's — one cheap\
  \ read on the poll path, never a journal read,\nand any unreadable or unwritable\
  \ offer degrades to the pre-rule race rather than failing a land.\n\n**The yielder\
  \ is NOT exempt from its own offer**, and that is load-bearing rather than incidental:\n\
  exempting it lets it release and instantly re-take, so the addressee still misses\
  \ the same millisecond\nwindow and the rule collapses back into the arrival-order\
  \ accident it exists to remove (established at\naudit-pre, RED/high, 2026-08-19).\
  \ Its abstention is bounded by the EXISTING land-reservation park limit\n, whose\
  \ degrade path withdraws the offer — so an addressee that stays queued and never\n\
  contends cannot hold the slot open. That reuse was the surviving option of a ceiling-convergence\n\
  consult, and it is why this rule still adds NO bound, timer, counter or tunable\
  \ of its own. An offer\nwhose WRITER has died reads as ABSENT (one liveness probe),\
  \ so an offer never outlives its author.\n\n**THREE LIVENESS FENCES, and the third\
  \ one is the ADDRESSEE'S LAND** (measured 2026-08-30).\nAn offer is consumable by\
  \ the addressed branch's live land process ALONE, so the condition that makes\n\
  one permanently unconsumable is «no live land will come for it» — and the writer\
  \ fence (the AUTHOR\nlives) and the fence (the addressee's BRANCH ref lives) both\
  \ answer a different question. On\n2026-08-30 no land in the kernel repo completed\
  \ between 05:45:51Z and a recovery ~2h later, with six\nor more parked, on ONE offer\
  \ naming `task/`: its writer was alive and parked, its branch and\nworktree existed,\
  \ and its worker had halted `blocked-on-land` at 05:43:17Z with no process surviving\n\
  it. The handle is RECORDED, never derived: the writer picks its addressee out of\
  \ the queue read, and\nthe `waiting_for_*` rows that queue folds from already carry\
  \ the queued land's pid — so the offer's\noptional THIRD line is that pid and the\
  \ fence is one more `os.kill(pid, 0)`, the writer fence's own\nsyscall asked about\
  \ the other party. This keeps the rule's cost class exactly as stated above: no\n\
  journal read and no subprocess on the poll path, and NO bound, number, threshold\
  \ or tunable — it\nfires only on PROOF. An offer recording NO addressee pid is UNKNOWN,\
  \ not failed-open: the check is\nnot asked, the offer stays live and the branch\
  \ fence governs alone. That distinction is load-bearing\n— a blanket fail-open would\
  \ close the deadlock and delete the fair-queueing this rule exists to\nprovide.\n\
  \n**THE FOURTH HOLE IS CLOSED ON THE WRITE SIDE: AN OFFER IS PUBLISHED ONLY WHEN\
  \ IT CAN BE PROVEN\nCONSUMABLE** (measured 2026-09-11). The three fences above all\
  \ ask about a land that HAS\nSTARTED. None asks about one that never did — and a\
  \ queued land that has not begun publishes no pid\nin its `waiting_for_*` rows,\
  \ so the writer could not resolve a handle, so the offer went out with no\nthird\
  \ line and read UNKNOWN forever. Measured 13:33Z-14:50Z: 17 lands parked on\n`waiting_for_land_reservation`\
  \ (4706 heartbeat rows in three hours) with the reservation flock\nUNHELD, on ONE\
  \ offer naming `task/` whose worker was ALIVE but in Stage 6. Every fence\nanswered\
  \ correctly, none could fire, and nothing in existence could consume the file. So\
  \ the WRITER\nnow refuses to publish what it cannot prove consumable: with no resolvable\
  \ addressee land pid, or one\nthat does not answer, it records NOTHING and the yielder\
  \ simply re-takes the reservation — an\nunaddressed round, which is this rule's\
  \ own pre- behaviour for a peer that cannot be named,\nand strictly better than\
  \ a park nobody can end. The liveness probe discriminates by ERRNO: ESRCH\nproves\
  \ absence, EPERM proves EXISTENCE (a cross-uid land), and anything else is unproven\
  \ and never\npublished as live. THE READ SIDE IS UNCHANGED, and the paragraph above\
  \ still governs it: a two-line\noffer already on disk — written by a pre- binary,\
  \ in flight across the upgrade — still reads\nUNKNOWN and still fences. What changed\
  \ is only that this rule no longer CREATES one. No bound,\ntimeout, TTL, counter\
  \ or tunable is added: it is the same liveness derivation the three fences above\n\
  are built on, asked at the one moment the handle is already in hand and free.\n\n\
  **AND A STALE OFFER HAS A GOVERNED CLEAR**. The 14:50Z removal above was a hand\
  \ `mv`,\nbecause no verb reached `_land_clear_yield_offer` from outside the yield\
  \ loop — a genuine gap, so the\nact left no record of who removed a repo-wide park\
  \ or why. `bin/yitc-v2 worktree clear-yield-offer\n--reason <why>` is the covering\
  \ verb: it journals `yield_offer_cleared {addressee, writer_pid,\naddressee_pid,\
  \ reason, age_s}`, records NOTHING when no offer is on disk (idempotent — one removal\n\
  never yields two rows), and is REFUSED while the recorded addressee land pid is\
  \ ALIVE, because that\nland consumes the offer itself and taking it away mid-handover\
  \ destroys the evidence the handover\nrests on. `age_s` is REPORTED and decides\
  \ nothing — this rule still names no number.\n\n**THE COST CLASS IS A RANKING OVER\
  \ EXISTING SIGNALS, never a new classifier.** `0` this member's own\nland would\
  \ run NO suite at all · `1` ONE pass, the ordinary candidate verify · `2` TWO passes,\
  \ the\ncandidate verify PLUS the SPEC-0077 pinned last-green leg. An UNDECIDABLE\
  \ answer is its own value and\nNEVER yields on either side — a branch that cannot\
  \ be diffed must not read as the cheapest thing in\nthe repo (the same two-positive-oracles\
  \ shape rule 8 uses).\n\n**THE RUNGS COUNT PASSES, and both ends of the original\
  \ ladder named a path CLASS instead** (owner directive 2026-08-18). The rank decides\
  \ which members batch together and who the reservation is\nyielded to, so a rung\
  \ that describes anything other than cost hands the road to whoever is cheapest\
  \ in\nname only.\n\n**Rung 0 is asked of the rule-1 paying predicate, NEVER of the\
  \ inert-path proxy.** The original rung 0\nread SPEC-0064's inert verdict directly,\
  \ but the inert skip is SPEC-0065's lever B, gated on\n`attempt > 1` — so a FIRST-attempt\
  \ inert land runs the full suite and only its canary is skipped.\nMeasured 2026-08-18:\
  \ an inert-path branch on attempt 1 ranked 0 while paying a verify of 422129 ms\n\
  (`reverify_skipped` false, `attempt_count` 1) — ranked the cheapest thing in the\
  \ repo while paying the\nmost frequent full pass, so the slot was yielded TO the\
  \ expensive branch, the inverse of what this rule\nwas built to do. The question\
  \ is now the SAME one rule 1's paying metric asks — «would this member's own\nland\
  \ actually have run the suite?» — consumed from that one predicate, never answered\
  \ a second time.\n**Honest consequence, stated rather than implied:** in a repo\
  \ running the kernel-authored suite rung 0 is\nnearly EMPTY by construction, because\
  \ the rank counts attempt 1 as paying (the inert first-attempt\nskip, SPEC-0065\
  \ §Bound, is proven only on the merged tree this pre-merge rank cannot see — \"\
  pays\" is\nthe fail-safe answer) — only a RETRY with an inert delta or a land running\
  \ no tests is free. The populated cheap rung lives on CONSUMERS, where a diff disjoint\
  \ from\nevery declared layer's subject really does run nothing, and rule 1's own\
  \ consumer clause governs how that\nis asked (through the declaration the verify\
  \ seam skips on, never through the test-ownership declaration).\n\n**Rung 2 collapses\
  \ to rung 1 where the pinned leg is OFF.** Rung 2 is a SECOND pass, so it is only\
  \ real\nif that pass will happen: SPEC-0186 lets a project declare the pinned last-green\
  \ leg off, and there a\nverify-surface touch buys nothing and must not isolate a\
  \ member for a pass that does not exist. The\npolicy is read through SPEC-0186's\
  \ ONE resolver over the BASE tree (its rule 4) — the same authority the\npinned-supersession\
  \ key narrowing above already consults, so formation reads ONE answer, not two.\n\
  FAIL-CLOSED both ways, in the direction each error costs least: an UNKNOWN paying\
  \ answer (an unresolved\nattempt, an unreadable declaration, an oracle that could\
  \ not be asked) never reaches rung 0 but falls\nthrough to the observable ladder,\
  \ and an unresolved policy leaves the rank at 2 — isolating a member that\ndid not\
  \ need it costs one unamortised pass, while batching one that DID need the pinned\
  \ leg is a false\ngreen.\n\n**THE YIELD READS THE SUPERSESSION MARKS, and tests\
  \ them FIRST.** A land must never hand the slot to\na branch whose rule-8 marker\
  \ is set: that branch has nothing to integrate and would take the slot\nonly to\
  \ exit. So a marked branch is never even ranked. The read is READ-ONLY — consuming\
  \ a peer's\nmarker here would destroy the evidence that peer is parked waiting to\
  \ read; consumption stays the\nmarked branch's own act.\n\n**IT PROMISES A RELEASE,\
  \ NOT A HANDOFF — and the distinction is the rule, not a caveat.** The\nreservation\
  \ is a first-come flock, so after a yield the slot may be taken by the queued cheaper\n\
  candidate, by a third lander, or by the YIELDER ITSELF re-contending on equal terms.\
  \ A DETERMINISTIC\nhandoff would require the yielder to WAIT until someone else\
  \ holds the lock, and the owner withdrew\nthat shape (2026-08-18). Convergence to\
  \ the cheapest queued candidate is therefore PROBABILISTIC and\nis MEASURED, not\
  \ asserted: `land_completed` carries `slot_yields` on any land that yielded (absent\n\
  otherwise, so a quiet repo's row is byte-identical), and that count is what keeps\
  \ the claim honest.\n\n**WHAT MAKES IT WORK IS THAT LOSING IS CHEAP, not that the\
  \ race is biased.** `_LAND_RESERVATION_POLL_SEC`\ndrops 1.0 -> 0.1, so a parked\
  \ peer notices the freed window, and a yielder that re-takes its own slot\nre-decides,\
  \ within a tenth of a second. The race stays fair; only the cost of a wrong grab\
  \ falls. The\nyielder is never made to wait — it is only made to stop HOLDING while\
  \ it re-reads the queue, and that\nunlocked read IS the window. An earlier owner\
  \ amendment prescribing a skip-a-tick back-off was\nWITHDRAWN (2026-08-18) and must\
  \ not be reintroduced.\n\n**NO NEW BOUND — and what actually terminates a mutual\
  \ yield is MEASURED, not assumed.** No deferral\ncounter and no yield cap. Two things\
  \ keep the yield from cycling. First, under the shipped ranking a\nmutual yield\
  \ is UNREACHABLE: a strict order cannot hold A<B and B<A. Second, within one attempt\
  \ a\ncandidate is offered the slot ONCE — the yielder skips the branches it has\
  \ already yielded to, so a\ncandidate that is queued but never contends cannot hold\
  \ it in a release/re-take spin. That is\nidempotence over a queue the read already\
  \ bounds, not a counter: it names no number and expires\nnothing.\n\n**The founding\
  \ directive's stated backstop does NOT hold, and the correction is recorded rather\
  \ than\nquietly relied on** (measured 2026-08-18, deviation `t11275-park-limit-does-not-terminate-mutual-yield`).\n\
  The directive said mutual yielding was \"already terminated by the EXISTING land-reservation\
  \ park\nlimit\". It is not: that limit bounds a contender WAITING on a reservation\
  \ somebody else HOLDS, and a\nmutual yield never waits — each side releases and\
  \ re-acquires within microseconds, so the limit is\nnever approached. Two real contenders\
  \ with the offer bookkeeping disabled run indefinitely. The\nno-new-bound conclusion\
  \ is unchanged — nothing numeric was added — but it rests on the two properties\n\
  above, not on that limit. The park limit remains bound on a contender parked behind\
  \ a\ngenuinely held reservation; it is simply not the one that catches this.\n\n\
  **AGE ORDERS THE HANDOVER WITHIN A COST CLASS — the reservation grant is no longer\
  \ a lottery\n(2026-09-23).** Acquisition itself stays the unordered flock contention\
  \ above, so on\nevery release the next holder was whoever polled first: a solo or\
  \ rebaselining waiter was\novertaken by newer contenders for 2,310-5,030 s (5 captures,\
  \ 4 sessions, revizia 2026-09-23).\nThe cure is the SAME addressed handover, asked\
  \ one more question: after the queue-jump and\nstrictly-cheaper passes find nobody,\
  \ a holder yields to the OLDEST queued, unmarked branch that\nhas waited LONGER\
  \ than it has and whose known cost class is NOT above its own. Age is\nwait start\
  \ (`queued_since_s`, falling back to `waited_s`) read off the rows the queue read\n\
  already folds, and the holder's own age is its `queued_since` baseline — a land\
  \ that never\nqueued is the youngest. No new store, no new bound: termination is\
  \ still the strict order plus\n`already_yielded`. Age is a strict order, and «not\
  \ above its own» means the target is never a\nbranch the cost pass would hand straight\
  \ back, so the two passes cannot ping-pong. A strictly\ncheaper YOUNGER branch still\
  \ goes first — that is the cost rule, and it costs the older waiter\nseconds, not\
  \ a verify. An undatable age is never ranked older (fail-closed: no handover).\n\
  \n**AN OPT-IN CARD MARK OUTRANKS THE COST LADDER — the emergency place (2026-08-26).**\n\
  Rules 1-11 make a queue cheaper and fairer to SERVE, and rule 9 above decides who\
  \ is served first by\nCOST. Neither helps the one card whose whole purpose is to\
  \ REMOVE the congestion: the admission slot\nis single and serial and its order\
  \ of service is arrival-driven, so a queue-FIXING change waits\nbehind the queue\
  \ it fixes. Measured 2026-08-26 — (the batch-cap re-tune) sat blocked while\nTHREE\
  \ separate batches of four dissolved, each costing four full verifies; and task/\
  \ waited\n56 minutes while NINE later arrivals overtook it, because a dissolved\
  \ member re-enters the queue\nwith its `waited_s` reset. So a task card MAY carry\
  \ an OPT-IN `queue_jump: {reason: <text>}` mark,\nand a queued branch whose card\
  \ carries a LIVE mark is served ahead of the PAYING cost classes.\n\n**IT YIELDS\
  \ TO A BOOKKEEPING LAND AND OVERTAKES ONLY PAYING ONES — the mark is a RANK BETWEEN\
  \ the\nrungs, not above them (owner directive 2026-08-27).** The mark once won the\
  \ scan OUTRIGHT,\nahead of EVERY cost class including rung 0. It now sits between\
  \ them: **rung-0 < marked < paying**.\nA rung-0 land runs no suite, so letting one\
  \ through costs the jumper a fraction of a paying land's\nwall — it gives up SECONDS,\
  \ never a verify — while overtaking a PAYING land is where the emergency\nplace\
  \ actually buys something, and that half is UNCHANGED. The rank has TWO halves and\
  \ both are the\nrule: a rung-0 CANDIDATE is scanned before the mark, and a rung-0\
  \ HOLDER does not enter the pass at\nall (yielding its slot to a paying marked branch\
  \ would put a bookkeeping land behind exactly the\nwall this narrowing spares it).\
  \ The paying/non-paying question is NOT asked a second time: it is\nrung 0 of the\
  \ cost ladder above — «this member's own land would not run the suite» — the same\n\
  answer rule 1's paying metric counts. A second predicate, a new field or a new store\
  \ would be the\nparallel encoding CHARTER §P1 forbids.\n\n**WHERE THE PAYOFF LIVES,\
  \ so its near-absence in the kernel is not read as failure.** Bookkeeping\nlands\
  \ are 0 of 294 batch members in the kernel and 173 of 293 (59%) in the <project>\
  \ consumer, both\nfolded read-only from the respective journals on 2026-08-27. In\
  \ a repo running the kernel-authored\nsuite rung 0 is nearly empty BY CONSTRUCTION\
  \ (the rung-0 clause above says why), so this narrowing\nis nearly INERT here and\
  \ is the MAJORITY case on a consumer. Nothing is measured in the kernel to\nprove\
  \ it, and nothing should be.\n\n**THE OBSERVATION THAT MADE IT CONCRETE.** On 2026-08-27\
  \ the mark fired repeatedly for task/\n— a branch whose own land had ABORTED on\
  \ a pinned verify failure at 11:19:22Z — while the admission\nqueue grew to 10 and\
  \ the oldest waiter sat at 3629 s. A mark that outranks EVERYTHING hands a\nfailing\
  \ branch repeated priority over branches that would have cleared, including ones\
  \ that would\nhave cleared for free.\n\n**IT IS ORDER OF SERVICE, AND — SINCE —\
  \ IT ALSO MAKES THE CARD SOLO.** A branch whose card\ncarries a LIVE mark is batch-INELIGIBLE\
  \ for as long as the mark lives: an ineligible HEAD forms a\nbatch of ONE, an ineligible\
  \ PEER is dropped before the cap (rule 4's existing membership seam,\nreused unchanged).\
  \ Owner decision 2026-08-27, and it OVERTURNS this paragraph's former reading\n\
  («it does not make a card solo — being verified alone is ALREADY derived where it\
  \ belongs and needs\nno second carrier»). The grounds: order of service alone does\
  \ not deliver what the mark is FOR. A\nmarked card is served first and then verified\
  \ INSIDE a batch, so its land is hostage to every peer\nin it — a red raised by\
  \ any member dissolves the batch and the urgent card waits another full\nround.\
  \ Serving it first and then making it wait on peers is the same delay wearing a\
  \ different\nname.\n\n**ONE HOME, TWO SOURCES — the design, and why it is not a\
  \ second carrier.** There is no stored solo\nFIELD, here or anywhere: batch-ineligibility\
  \ is DERIVED in\n`bin/lib/batch_landing.py#_land_batch_ineligible_branches`. That\
  \ ONE predicate now answers from TWO\nsources — the rule-4 red-batch history, and\
  \ a live rule-9 mark — so every existing consumer of\nbatch-ineligibility keeps\
  \ working unchanged and nothing new is stored. In particular a mark\nwrites NO journal\
  \ row: synthesising a `requeued-after-red-batch` verdict to fake ineligibility would\n\
  record a red batch that never happened in an append-only history, which is the one\
  \ thing that must\nstay true.\n\n**THE TWO SOURCES HAVE DELIBERATELY DIFFERENT LIFETIMES,\
  \ and this is the rule rather than an\nartefact.** The red-batch source is ONE ROUND\
  \ and self-clearing — its clearing signal is the\nmember's own individual verdict\
  \ (rule 4: «one round, not a quarantine»). The mark source is\nPERSISTENT: it holds\
  \ while the mark holds and ends when the mark ends, which per safeguard (b)\nbelow\
  \ is when the card goes terminal. An individual verdict therefore does NOT clear\
  \ a mark. Two\nconsequences follow, and both are load-bearing: the mark source is\
  \ unioned AFTER the red-batch\nfold rather than into it (entering that state machine\
  \ would let its `land_completed` arm clear the\nmark, shipping one round instead\
  \ of the decided lifetime), and the entry SNAPSHOT `cmd_land` takes\nfor the abort\
  \ clearing-copy stays the red-batch-only read — a clearing row is meaningful\nonly\
  \ for a penalty some verdict clears.\n\n**THE COST, RECORDED RATHER THAN LEFT TO\
  \ BE REDISCOVERED AS AN OBJECTION.** A marked head can no\nlonger amortise: a green\
  \ batch of 4 headed by a marked branch forfeits 3 passes. Measured\n2026-08-27,\
  \ marked branches headed two batches (bat-6e225d5f2ee4 n=2, bat-0f20f334cc5c n=4)\
  \ and\nBOTH went red, so nothing was actually forfeited in either — two observations,\
  \ not proof that a\nmarked head never carries a green batch. The owner weighed that\
  \ trade and accepted it: marked cards\nare RARE BY CONSTRUCTION (the opt-in field\
  \ below), and making an urgent queue-FIXING land wait\ninside a batch is worse than\
  \ the time its peers lose landing separately.\n\n**WHAT IT STILL DOES NOT DO.**\
  \ It is NOT derived from `priority`, and that was measured before being\nrejected:\
  \ 28 of 78 ready cards carried `priority: high`, a third of the queue, so deriving\n\
  precedence from it would have pushed bookkeeping lands to the back wholesale. The\
  \ signal must be\nRARE BY CONSTRUCTION, which an opt-in field is and a priority\
  \ band is not.\n\n**EVERY RULE-9 INVARIANT SURVIVES LITERALLY, which is why the\
  \ mark is a rank rather than a bypass.**\nThe supersession mark is still tested\
  \ FIRST (a branch with nothing to integrate is never ranked,\njump or no jump);\
  \ offer-once-per-attempt still bounds the loop on the finite queue, so no counter,\n\
  cap or timer is added; an UNDECIDABLE holder still yields to nobody; and A JUMPER\
  \ DOES NOT YIELD TO\nA JUMPER. That last clause is load-bearing rather than cautious:\
  \ this rule's termination argument is\nthat a STRICT order cannot hold A<B and B<A,\
  \ so placing the mark below the PAYING cost classes is\nsafe only while marked branches\
  \ are EQUAL to each other — the same «strictly cheaper, never equal»\nclause the\
  \ cost ladder already enforces. The narrowing (rung-0 < marked < paying) keeps that\n\
  order STRICT, and only because BOTH of its halves hold: excluding the rung-0 HOLDER\
  \ from the pass is\nwhat stops marked < rung-0 holding alongside rung-0 < marked.\
  \ That exclusion is part of the\ntermination argument, not an ergonomic detail,\
  \ and removing it re-opens the mutual yield this rule\nrefuses to bound with a counter.\n\
  \n**THREE SAFEGUARDS, AND THEY ARE THE RULE RATHER THAN DECORATION.**\n* **(a) The\
  \ reason is refused at WRITE time.** The mark carries, in itself, the blockage it\
  \ claims\n  to clear; a reasonless mark is REFUSED by the writing verb (`task update\
  \ --queue-jump`), not\n  merely discouraged. An unexplained pin is precisely the\
  \ artifact nobody can judge later, and\n  «discouraged» has never yet stopped one\
  \ being written.\n* **(b) The mark DIES WITH ITS CARD, and the expiry is DERIVED,\
  \ never swept.** The reader answers\n  «no precedence» for a card whose own status\
  \ is terminal, so there is no second store to go stale\n  and no cleanup to forget.\
  \ This is the direct lesson of ATOM3 — a hand-set pin that outlived its\n  own card\
  \ by two days and reddened four unrelated batches before it was found. A mark that\
  \ cannot\n  expire is the same defect wearing a different name. **The SETTER asks\
  \ the same rule.**\n  `task update --queue-jump` refuses, before any write, a mark\
  \ the reader would answer «no\n  precedence» for — a `wont-do` card, or a `done`\
  \ card whose closure is already on `main` — so an\n  inert mark is never silently\
  \ committed. The reader reads the card from `main`, where a card\n  closed only\
  \ on its branch is still `ready`/`in-progress`: a mark set THERE takes effect until\
  \ the\n  land merges the closure and expires it, while the same mark written on\
  \ the closed branch copy\n  would only reach `main` with that land, already expired.\
  \ So on a done-unlanded card's branch the\n  verb refuses and names the main-checkout\
  \ route. This is the reader's answer asked early, not a\n  second copy of the expiry.\n\
  * **(c) A FIRING is journaled and surfaced.** When the mark actually reorders admission\
  \ the yield\n  site emits `land_queue_jump_fired` naming the card and the reason,\
  \ and the `debt` view surfaces\n  those firings — so overuse needs no audit to notice.\
  \ The row is emitted ONLY when the mark DECIDED\n  the handover: a mark that exists\
  \ and changed nothing emits nothing, which is what makes the record\n  a reading\
  \ of real reorderings rather than a census of the corpus.\n\nReader-side fail-closure\
  \ is the same polarity as everything else in this family: an absent card, an\nunparseable\
  \ one, a blank reason and an unreadable tasks directory each answer «no precedence».\
  \ A\nreader that GUESSED a jump from something it could not parse would hand the\
  \ road away on noise —\nstrictly worse than the arrival-order lottery this exists\
  \ to fix.\n\n**THE MAIN-ROUTE MARK IS WRITTEN UNDER THE LAND RESERVATION.** The\
  \ mark set or cleared on\n`main` is a direct-to-main commit, and a `queue_jump`\
  \ card delta is one a holder's in-lock re-check\ncannot fold (SPEC-0065), so committed\
  \ between a holder's merge and its fast-forward it discarded that\nholder's whole\
  \ verify. So the main route takes the land reservation — with the venue publisher's\n\
  precedence (SPEC-0203 rule 6) — BEFORE it writes, re-decides every card-state question\n\
  above (safeguard (b)'s inert refusal, the identical-mark no-op, the preflight) on\
  \ the card as re-read\nunder it, and releases right after its one scoped commit:\
  \ it never enters `main` between a holder's\nmerge and its fast-forward. Its issuer\
  \ waits for the CURRENT holder's release within the EXISTING\npark bound and refuses\
  \ with nothing written when that bound expires; while it waits it writes\nnothing\
  \ and holds no journal lock. That wait delays no land: the mark is read only at\
  \ a holder's\nyield seams and at batch formation, both of which the next holder\
  \ runs after that release. The\nworktree route (a clear only) takes no reservation\
  \ — its mark reaches `main` inside its own\nland.\n\n### 11. A candidate whose WORKTREE\
  \ IS DIRTY does not consume a batch place\n\n**The rule.** At formation, a candidate\
  \ whose own worktree holds UNCOMMITTED changes is\nbatch-INELIGIBLE for that attempt.\
  \ Such a HEAD forms a batch of ONE; such a PEER is dropped BEFORE\nthe cap. Those\
  \ are the same two decision points rules 4 and 8 already own, reused rather than\n\
  duplicated — one mechanism, a fifth source of the answer.\n\n**THIS IS A PRECONDITION\
  \ FAILURE, NOT A COUPLING RISK, and conflating the two is what made the\nfounding\
  \ wave read as a batching defect.** Every other ineligibility source in this spec\
  \ exists for\na CLEAN but suspect candidate that must not carry peers — a red-batch\
  \ requeue (rule 4), a declared\nrebaseline, a recorded supersession notice, a supersession\
  \ mark (rule 8). A dirty branch is a\ndifferent thing entirely: it aborts IDENTICALLY\
  \ whether it lands alone or in a batch, because what\nrefuses it is its own tree\
  \ and not its company. So \"give it its own slot\" is not the remedy here\nand never\
  \ was — COMMITTING is — and this rule is not a widening of rule 4`s family.\n\n\
  **What it excludes and what it must not do.** The input is the candidate`s own WORKTREE\
  \ DIRTY\nPATHS — the paths its working tree holds uncommitted — read READ-ONLY.\
  \ This rule NEVER writes to a\ncandidate: no commit, no stash, no checkout, and\
  \ specifically **no `worktree sync`, nor any other\nwriting sync/update operation,\
  \ on a candidate worktree**. The verb is named as well as the general\nprohibition\
  \ stated, deliberately: `worktree sync` merges `main` into a worktree IN PLACE,\
  \ and\nauto-merging into another session`s LIVE worktree is exactly what the worktree-stamp\n\
  discipline forbids — a paraphrase alone would leave the next reader to decide for\
  \ themselves\nwhether that verb is covered. Formation READS and REPORTS; the owning\
  \ session commits.\n\n**EVERY DIRTY CANDIDATE NAMES WHAT IT MUST COMMIT.** An exclusion\
  \ that does not say why sends its\noperator back to the queue a second time, which\
  \ is the same argument rules 1 and 4 already make for\ntheir own sinks. A dropped\
  \ PEER is reported through the rule-1 exclusion sink with its own named\nreason\
  \ AND a bounded list of its dirty paths. A dirty HEAD reports the same bounded list\
  \ on its own\nMEMBER record — not in the exclusion sink, for the reason a rebaselining\
  \ head is not there either:\nthe head is not a queue candidate, so a sink row would\
  \ describe the slot holder as one of its own\nexclusions and would inflate `queue_depth`,\
  \ whose meaning is the candidates the formation SAW.\nBoth halves report; each through\
  \ the carrier its own position already owns.\n\n**A QUIET REPO IS UNTOUCHED — the\
  \ reader is not built when there is nothing to select between.**\nRule 1 promises\
  \ that a solo formation runs no subprocess and writes no object, and reading a\n\
  candidate's worktree is a subprocess. So this rule is consulted only when a PEER\
  \ is actually\npresent. Nothing is lost by that: a solo head has no peers to drag\
  \ into a batch it cannot finish,\nand it aborts on its own tree exactly as it does\
  \ today. Same construction gate, and the same\npromise, as rule 1's own compatibility\
  \ predictor.\n\n**FAIL-OPEN, and the direction is the point.** A branch with no\
  \ resolvable worktree, an unreadable\ntree, or any error at all reads as NOT DIRTY\
  \ and is admitted. The exclusion fires only on PROVEN\ndirt. A false admit therefore\
  \ costs exactly today`s abort — the status quo — while a false exclusion\nwould\
  \ cost batch capacity, which is the thing this spec exists to produce. Same polarity,\
  \ and the\nsame reason, as rules 4 and 8`s own readers.\n\n**WHY THE COMMIT-ONLY\
  \ ORACLE COULD NOT ANSWER THIS.** Rule 3`s eviction probe composes a merge in a\n\
  throwaway index and checks nothing out, and since it asks the SAME admission authority\
  \ the\nland path uses — one oracle, per CHARTER §Principle 5. But it compares COMMITS.\
  \ No commit-vs-commit\nquestion can observe an uncommitted working tree, so before\
  \ this rule no formation-time reader could\nsee dirt at all. This rule adds a reader,\
  \ not a second conflict authority: it answers a candidate`s\nOWN precondition, never\
  \ whether two branches can coexist.\n\n**FOUNDING MEASUREMENT** (2026-08-25). A\
  \ wave of five lands produced four aborts, and four\nof them were the branch`s own\
  \ uncommitted state rather than anything about batching: task/\n(04:45:50Z and again\
  \ 04:59:31Z) and task/ (05:10:58Z) on uncommitted non-journal changes,\ntask/ (05:10:03Z)\
  \ and task/ (05:11:21Z) on local `events.jsonl` changes the merge\nwould overwrite.\
  \ The fifth, task/, was CLEAN and died at 05:08:04Z on a BATCH ATTRIBUTION\nfailure\
  \ carrying two peers` assertions — it then landed unchanged once it went alone.\
  \ Cost of the\ncheck: 19 ms median per worktree, 0.3 s across all 12 live at the\
  \ time, against land-reservation\nwaits of median 12.2 min and p90 225.9 min over\
  \ the preceding week (n=309).\n\n**THE JOURNAL-ONLY CASE IS NO LONGER COUNTED —\
  \ SUPERSEDED 2026-08-27.** Dirt confined to\nthe journal is FOLDABLE — the land`s\
  \ own pre-merge step commits the bookkeeping allowlist and\nrefuses only the remainder\
  \ — so a candidate whose ENTIRE dirt is foldable now reads CLEAN at\nformation.\
  \ The reader consults the land`s OWN foldable notion (`_is_foldable_bookkeeping`,\
  \ extracted\nto one home from `_fold_trailing_bookkeeping`), never a second definition\
  \ that could drift from the\nfold actually performed.\n\n**WHAT THIS CHANGES AND\
  \ WHAT IT DOES NOT.** NON-foldable dirt still excludes, unchanged, and MIXED\ndirt\
  \ — a foldable path ALONGSIDE a source path — still reads DIRTY: the remainder is\
  \ non-empty, so a\nfoldable path can never mask a forgotten `task commit`. The reported\
  \ path list is now the\nnon-foldable REMAINDER, i.e. the paths its operator must\
  \ actually commit, since naming a path the\nland was going to fold sends them to\
  \ stage a file for nothing. Every case the founding measurement\nwas built on —\
  \ task/ and task/, both uncommitted NON-journal changes — is caught\nexactly as\
  \ before.\n\n**WHY THE ORIGINAL REASONING DID NOT HOLD, stated plainly because it\
  \ was DELIBERATE and not an\noversight.** It ran: a peer carried as a batch MEMBER\
  \ is merged from its COMMITTED tip, so its\nuncommitted rows are folded by nothing\
  \ and simply do not travel — therefore the candidate is not\nready to be carried.\
  \ The premise is TRUE and remains true. The conclusion does not follow, because\n\
  non-travel is not LOSS: a successful batch removes only the HEAD`s own worktree,\
  \ never a peer`s, so\nthe peer`s uncommitted rows survive on disk and reach `main`\
  \ through that peer`s own next land —\nthe identical path they would take had it\
  \ been excluded. The exclusion therefore bought a deferral\nthe peer was going to\
  \ take anyway, and charged a whole batch place for it.\n\n**THE MEASURED COST OF\
  \ COUNTING IT** (2026-08-27): 9 `uncommitted-worktree-dirt` exclusions\nacross 45\
  \ formations in one day, and task/ dropped from two consecutive formations\n(09:40:25Z,\
  \ 09:51:30Z) with `events.jsonl` as its ONLY dirty path. The burden fell on PEERS\
  \ alone,\nand asymmetrically: a HEAD reaches formation ALREADY folded clean by `cmd_land`s\
  \ two\n`_fold_trailing_bookkeeping` calls, while a peer`s tree is folded by nobody.\
  \ So the two candidate\npositions were being judged by different standards — not\
  \ by design, but as a side effect of where\nthe fold runs.\n\n### 12. An exact member\
  \ SET that already reddened is not RE-FORMED — recompose, never block\n\n**The rule.**\
  \ At formation, once the members have been selected and the cap applied, a batch\
  \ whose\nEXACT member set already produced a red batch is not formed. A member is\
  \ dropped, and another if\nneeded, until the composition DIFFERS. This is rule 4's\
  \ own closing promise —\n*\"whatever else changes, a red batch may never be re-formed\
  \ identically\"* — held at the FORMATION\nseam as well as by the one-round mark,\
  \ and it is a sixth SOURCE of an answer formation already\nmakes, not a new mechanism.\n\
  \n**IT RECOMPOSES, IT DOES NOT BLOCK, and that is the load-bearing half.** Blocking\
  \ would convert a\nCOST problem into a LIVENESS one. Every member still reaches\
  \ a batch in the same round, down to a\nbatch of one; a dropped member leaves through\
  \ the rule-1 exclusion sink with its own named reason and\nwaits for its own slot,\
  \ exactly as an over-cap member does. An implementation that forms NOTHING\nfails\
  \ this rule outright. What recomposition buys beyond the prevention is the reason\
  \ it is the right\nshape rather than merely the safe one: splitting the group makes\
  \ members meet DIFFERENT peers each\nround, which incidentally ISOLATES them across\
  \ rounds and yields cheap bisection — the diagnosis that\nred-batch culprit ATTRIBUTION\
  \ has repeatedly failed to deliver.\n\n**THE ANTI-LOOP INVARIANT — the rule's most\
  \ important bound, and what keeps it from becoming a\nLOCKOUT** (owner concern raised\
  \ at filing, 2026-08-28). **The exclusion applies to MULTI-MEMBER sets\nONLY. A\
  \ batch of ONE is NEVER refused by this rule, whatever its history.** A branch whose\
  \ SOLO run\nreddened must still be allowed to run solo again, because solo is the\
  \ terminating case every\nrecomposition descends toward. Without this bound the\
  \ rule is not a loop but something worse: a\nbranch that fails alone could never\
  \ form a batch again and would be permanently unlandable, with no\nverb to release\
  \ it. So recomposition always TERMINATES, because the descent multi-member -> smaller\n\
  -> solo has a floor that is always eligible.\n\n**DERIVED, NEVER STORED.** Rule\
  \ 1 keeps formation queue-driven and stateless, so the \"already\nreddened\" fact\
  \ is read from the journal that already carries it: a dissolve journals one\n`land_member_verdict`\
  \ per member with verdict `requeued-after-red-batch`, carrying `batch_id` and\n\
  `batch_size`, so grouping those rows by `batch_id` RECONSTRUCTS the exact member\
  \ set of every red\nbatch from rows written for another purpose. A persisted composition\
  \ ledger is FORBIDDEN — it is the\nparallel state home CHARTER §Principle 1 forbids,\
  \ and it would also be wrong within a day, since the\njournal rotates and a ledger\
  \ would not.\n\n**A RECONSTRUCTED SET COUNTS ONLY WHEN IT IS PROVABLY COMPLETE.**\
  \ Two emitters write\n`requeued-after-red-batch`: the dissolve, which names EVERY\
  \ member, and the solo-head peer release\n(rule 4's head-is-culprit arm), which\
  \ names the PEERS ONLY while carrying the whole batch's\n`batch_size`. A group short\
  \ of the size its own rows declare is a PARTIAL view of some batch, and\nexcluding\
  \ on it would refuse a set that never existed — so a group counts iff its row count\
  \ EQUALS\nthe declared `batch_size` and that size is greater than one. Rows carrying\
  \ no `batch_id` are skipped\nrather than joined by branch-plus-timestamp, which\
  \ mis-attributes whenever one branch appears in\nseveral batches.\n\n**THE EXCLUSION\
  \ IS VISIBLE WHEN IT FIRES.** A recomposition names its reason in the EXISTING rule-1\n\
  `queue_excluded` vocabulary on the `land_batch_formed` row, so journal and debt\
  \ readers can COUNT\nfirings. A silent recomposition would be indistinguishable\
  \ from ordinary formation, and the predicted\n~1-per-day rate could then never be\
  \ checked against reality — which is the one thing that would let\na wrong rule\
  \ live forever.\n\n**FAIL-OPEN, the polarity every reader on this path takes.**\
  \ An unreadable journal, a missing path,\nan unparseable row: all yield \"no composition\
  \ is known to have reddened\", i.e. ordinary formation. A\nmissed exclusion costs\
  \ one repeated batch, which then dissolves and IS recorded, so the next\nformation\
  \ has the fact; a spurious one would shrink batches on bad data, which is the capacity\
  \ this\nspec exists to produce.\n\n**MEASURED — INCLUDING WHAT ARGUES AGAINST THIS\
  \ RULE, recorded so nobody has to rediscover it**\n(2026-08-28). Over the live journal\
  \ segment 2026-08-21..28: **194 multi-member batches, 189\nunique compositions,\
  \ only 5 exact repeats** — an expected firing rate of roughly one per day. Of the\n\
  two informative repeats **one went red then GREEN** (this rule would have prevented\
  \ a batch that\nSUCCEEDED) and one went green then RED. **So an exact-set repeat\
  \ does NOT predict the outcome.** A\nnear-miss cohort — a later batch sharing >=2\
  \ members with a red one — reds at 76% against a 57%\nbaseline, but that cohort\
  \ is **CONFOUNDED**: a single genuinely-broken branch touring the queue\ninflates\
  \ it, so it is not evidence that the COMBINATION causes the red, and the figure\
  \ must not be\nquoted as a rate this rule acts on. **The honest case for the rule\
  \ is CHEAP PREVENTION plus the free\nbisection recomposition yields, NOT predictive\
  \ power** — do not write it up as the latter. The owner\nwas shown this and decided\
  \ to proceed.\n\n**WHAT THIS RULE IS NOT.** It is not rule 4's one-round dissolution,\
  \ not the rule-9 queue-jump mark,\nnot the rebaseline declaration or its per-assertion\
  \ waive-token gate, and it makes NO attempt to NAME\nthe culprit. Two ad-hoc audits\
  \ on red-batch culprit attribution (both RED) concluded attribution\nshould be RETIRED\
  \ rather than repaired, with prevention moved into cheaper pre-merge solo-exclusion\n\
  rules; this rule joins that family and is designed as a member of it, never as attribution\
  \ by another\nname.\n\n### 13. Three batch rides without landing sends a branch\
  \ SOLO — whether or not anyone was named\n\n**The rule.** A branch that has been\
  \ a MEMBER of three or more multi-member batch formations since\nits last completed\
  \ verify, without landing, is batch-INELIGIBLE: its next attempt is verified ALONE.\n\
  It is a SEVENTH SOURCE feeding the ONE existing ineligibility predicate — not a\
  \ new mechanism, not a\nnew mark, and not a second rule.\n\n**IT COUNTS; IT DOES\
  \ NOT JUDGE, and that is the whole point of it.** Every other ineligibility source\n\
  keys on a VERDICT or a MARK about a branch or a set: rule 4's one-round requeue,\
  \ rule 12's exact red\nset, a declared rebaseline, a rule-8 supersession mark, a\
  \ rule-9 queue-jump mark, a dirty worktree.\nAll of them are silent BY CONSTRUCTION\
  \ in the case this rule exists for: **a red batch whose\nattribution DECLINES to\
  \ name anyone.** Measured 2026-08-28 — `bat-f2749263764c` reddened with every\n\
  member requeued, the head itself unaccounted, and NO name produced. A count needs\
  \ no name, so it\nreaches that case and nothing else does. An implementation that\
  \ consults any verdict has reproduced\nthe gap under a new name.\n\n**ONE RULE SERVING\
  \ BOTH SIDES, which is why it is one rule and not two.** For a branch that keeps\n\
  breaking batches it RESTRAINS — it stops burning peers. For an innocent eternal\
  \ passenger it\nRELEASES: `task/` rode six batches, was never at fault, and landed\
  \ green on its first solo\nattempt. The same predicate frees one and constrains\
  \ the other; two mechanisms here would be a\nmisreading of the shape.\n\n**IT SELF-CLEARS,\
  \ and this bound matters more than it looks.** The count is RESET — never marked\
  \ — by\nthe branch's own `land_completed` WHOSE VERIFY ACTUALLY RAN, which is rule\
  \ 4's clearing signal reused\nunchanged. Once the solo attempt COMPLETES, whatever\
  \ its outcome, the branch is an ordinary candidate\nagain. The reason this is not\
  \ optional: the trigger reads HISTORY, and a count of past rides can only\nGROW,\
  \ so a mark that did not clear would be **PERMANENT by construction**. Solo is the\
  \ SLOWEST lane (a\nfull verify alone, 8-12 min measured 2026-08-28, against 3-9\
  \ s as a rider in a green batch), so an\nunclearing mark would condemn an innocent\
  \ branch to the expensive lane for other branches' defects —\n`task/` would have\
  \ been marked on ride three and never released. Worse, every permanently\nmarked\
  \ branch LEAVES the shared batches, so batching would shrink toward nothing while\
  \ still\nappearing to run. Rule 4 already gets this right — one round, not a quarantine,\
  \ cleared by the\nindividual verdict itself — and this rule MATCHES it rather than\
  \ inventing a second lifetime.\n\n**WHAT COUNTS AS A RIDE: being NAMED in a formed\
  \ MULTI-MEMBER batch.** Formation is the moment a\nbranch's fate is coupled to its\
  \ peers', which is exactly what this rule bounds. \"Paid a verify as a\nmember\"\
  \ was considered and rejected: the `land_batch_formed` row carries `paying_members`\
  \ as a COUNT,\nnot a SET, so that reading is not per-member derivable from anything\
  \ journaled today and would need\nnew attribution and a new field — a strictly larger\
  \ blast radius for no gain. **A SOLO formation is\nNEVER a ride** (`members: 1`),\
  \ so the routing this rule produces can never feed itself.\n\n**DERIVED, NEVER STORED\
  \ — and read through the SAME window as the mark it joins.** Rule 1 keeps\nformation\
  \ queue-driven and stateless, so the count is folded from `land_batch_formed` rows\
  \ that\nalready exist, inside the SAME journal read the ineligibility predicate\
  \ already performs (the\n`land_` superset prescan over the horizon window). No second\
  \ reader, no extra read, and no store.\n**The window must be the LIFETIME-SIZED\
  \ read, never a byte-bounded tail** : under the former\n512KB tail a first ride\
  \ 630833 bytes from EOF was invisible, so a counter built on it would report\ntwo\
  \ rides forever on exactly the busy days this rule exists for — a counter that appears\
  \ to work and\ncounts nothing.\n\n**FAIL-OPEN, the polarity every reader on this\
  \ path takes.** An unreadable journal, a missing path,\nan unparseable row: all\
  \ yield \"nobody has ridden\", i.e. ordinary formation.\n\n**WHAT THIS RULE IS NOT.**\
  \ It does not attribute a red, does not tell the branch WHY it was routed\n(that\
  \ is), and does not replace any verdict-keyed source — those already work and are\n\
  untouched.\n\n### 14. A refuted head-blame sends the peers it released SOLO — for\
  \ one round, and only then\n\n**The rule.** When a red batch names its HEAD and\
  \ releases every peer UNPENALISED\n(`batch_ineligible: false`, reason `head-is-culprit`),\
  \ and the head's FIRST OWN `land_completed`\nat-or-after that blame comes back **`ok`**\
  \ — the head passed ALONE, so the blame is **REFUTED** —\nevery peer that release\
  \ let go is batch-INELIGIBLE for ONE ROUND. It is an EIGHTH SOURCE feeding the\n\
  ONE existing ineligibility predicate: no new event, no new field, no new store,\
  \ no new read.\n\n**THE MEASUREMENT THAT BOTH JUSTIFIES IT AND BOUNDS IT.** The\
  \ head-blame confirmation rate is\n**32/48 = 66.7%** over `..` (48 red batches ending\n\
  peers-released blaming the head, deduped by `batch_id`, 40 distinct heads, 51 distinct\
  \ peers, 0\nunresolved) — stable against 15/22 = 68.2% over the shorter window.\
  \ On the AC1-literal\nsame-assertion reading over the carried-verdict population\
  \ it is **11/30 = 36.7%**. So the blame is\nright about two times in three and **wrong\
  \ 16 times in 48**; in those 16 the head passed alone, the\nred came from a peer\
  \ or from the combination, and the set containing it went back to the queue\nunmarked.\
  \ Derivation: `dev-utilities/head-blame-refutation-.md`.\n\n**WHAT THAT NUMBER REJECTS,\
  \ so it is never proposed as the simpler version of this rule.** Marking\nevery\
  \ released peer the way rule 4 marks a dissolve's members would tax **32 innocent\
  \ peer-sets to\ncatch 16 guilty ones**. Rule 4's blanket mark is justified on the\
  \ dissolve path for a reason that\ndoes NOT transfer: there **no attribution was\
  \ made at all**, so there is no innocence to protect.\nHere an attribution WAS made,\
  \ and the head's own solo run either upholds it or overturns it. This\nrule consumes\
  \ that verdict instead of guessing, so it fires in the 16 and never in the 32 —\
  \ it taxes\nno innocent peer, and it reads a signal the record already produces\
  \ and nothing else consults.\n**Releasing unpenalised on a CONFIRMED blame stays\
  \ deliberate and correct, exactly as before.**\n\n**THE LIVELOCK IT CLOSES, observed\
  \ and not postulated.** A peer released unpenalised is re-admitted\nto the very\
  \ next batch and is then blamed itself by the SAME assertion. **15 such recurrence\
  \ pairs**\nover the window, across **7 distinct branches**: `task/` (2026-08-25,\
  \ the single trace\n recorded), `task/`, `task/`, `task/`, `task/` (released five\n\
  times before its own turn), `task/`, `task/`. This is the ordinary failure of the\n\
  path, not one incident. **AND THE HONEST BOUND ON WHAT THIS RULE FIXES: only 10\
  \ of those 15 follow\na REFUTED blame, so rule 14 would have marked 10 and left\
  \ 5 alone.** The other 5 followed a\nCONFIRMED blame — the head really was red AND\
  \ a released peer was also red — and this rule\ndeliberately does not reach them,\
  \ because reaching them means marking on suspicion. **It closes\ntwo thirds of the\
  \ observed recurrence, not all of it.**\n\n**THREE OUTCOMES, NOT TWO — the head's\
  \ first own land at-or-after the blame decides.** `ok`\n**REFUTES** and marks the\
  \ peers. An abort of class `verify-failed` **CONFIRMS** and marks NOBODY.\n**ANY\
  \ OTHER abort class is UNRESOLVED** — a rebaseline refusal, a stale-diff preflight,\
  \ a merge\nconflict all say nothing about whether the head's code was red — so the\
  \ peers stay PENDING and the\nrow decides NEITHER way. Collapsing that third case\
  \ into either answer would mark or absolve on\nevidence that settled nothing, which\
  \ is the defect removed from rule 4's clearing signal.\n\n**RETROACTIVE, NOT HELD\
  \ — decided on measured cost, because the timing is the design problem.** The\n\
  peers are released BEFORE the head's solo run concludes, so the mark cannot be written\
  \ at release\ntime. Both shapes were costed over the window above:\n  - **HOLD the\
  \ release** until the head resolves: **2603 peer-minutes** across **109 peers**\
  \ in all\n    48 blames (median blame→head-own-land gap 7.9 min, max 155.9). Two\
  \ thirds of that is paid in\n    the CONFIRMED cases where the mark never fires,\
  \ and it needs a new held state against rule 1's\n    stateless, queue-driven formation.\n\
  \  - **RETROACTIVE** (this rule): nothing at release time; the mark is DERIVED at\
  \ the next\n    ineligibility read from rows that already exist. Its cost is that\
  \ the mark arrives LATE — a\n    peer re-forming inside the gap rides that round\
  \ unmarked, measured at **23** such formations\n    across the 16 refuted blames'\
  \ 38 peers.\n23 late rounds in the refuted cases only beats 2603 peer-minutes paid\
  \ in every case, so the mark is\nretroactive. **This bound is stated, not hidden:\
  \ the rule is late by design and does not claim to\ncatch the first re-admission.**\n\
  \n**IT SELF-CLEARS ON RULE 4'S OWN SIGNAL, and shares rule 4's lifetime exactly.**\
  \ The mark ends at the\npeer's own `land_completed` WHOSE VERIFY RAN, or at its\
  \ own `landed` member verdict. **One round,\nnever a quarantine.** For the same\
  \ reason the mark is written into rule 4's own state rather than\nunioned after\
  \ the fold the way rules 9 and 13 are: those two are unioned precisely because their\n\
  lifetimes are LONGER than one round, and this one's is not. A **round already served**\
  \ is not owed a\nsecond: a peer whose own verify completed between the release and\
  \ the refutation is never marked,\nbecause a second round from one blame is the\
  \ quarantine this rule and rule 4 both forbid.\n\n**SEVERAL OPEN BLAMES AGAINST\
  \ ONE PEER, and ANY ONE refutation fires.** A peer is routinely\nreleased by more\
  \ than one blame before ANY of their heads resolves — `task/` was released\nunpenalised\
  \ by **five** different heads before its own turn came. Each release is a SEPARATE\
  \ claim\nabout who owned that batch's red, so each is separately refutable: the\
  \ peer is marked when the\nFIRST of them is overturned, a head whose own run CONFIRMS\
  \ its blame withdraws only ITS OWN claim,\nand the peer is owed nothing only once\
  \ every blame against it has been confirmed. A rule that kept\none blame per peer\
  \ would go quiet in exactly the pile-up the livelock is made of.\n\n**WHAT THIS\
  \ RULE IS NOT.** It does not change WHO gets blamed — rule 4's culprit-naming boundary\
  \ is\nuntouched. It does not change the DISSOLVE path, whose blanket one-round mark\
  \ stays unconditional.\nIt introduces no parameter and no threshold: the trigger\
  \ is a verdict that already exists.\n\n### 15. A queued branch pre-merges main WHILE\
  \ PARKED — and step 2 consumes only a PROVEN-CURRENT result\n**The problem.** `land`\
  \ merges `main` into the branch only AFTER the serialized reservation is\nacquired\
  \ (`_land_integrate` step 2), so the WHOLE reservation wait sits between the branch's\
  \ last\ncommit and its merge from main. Measured 2026-09-05: waits of 45-111 minutes,\
  \ and three\n`merge-non-union-conflict` aborts (78.6 / 110.8 / 44.3 min) on pins\
  \ a sibling had just landed —\neach sending the branch to the queue tail AFTER it\
  \ had already paid the wait.\n\n**The rule.** A land that is PARKED on the land\
  \ reservation MAY bring its own worktree up to date\nwith `main` from inside the\
  \ wait, under these terms and no others:\n1. **The tick is the land's own merge,\
  \ run earlier — never a second merge implementation.** It runs\n   the SAME `_fold_trailing_bookkeeping`\
  \ + `_update_from_main` pair the land and `worktree sync`\n   already run, under\
  \ the SAME `land` label, so a conflict it meets aborts with the identical class\n\
  \   and text step 2 would have produced.\n2. **It is throttled on the MAIN-TIP WATERMARK,\
  \ not on a clock alone.** A tick is skipped unless\n   `main` has MOVED since the\
  \ tip the last tick attempted, never once per throttle interval.\n   **A BLOCKING\
  \ conflict met by a QUEUED (non-forced) tick LEAVES THE QUEUE AT ONCE.**\n   When\
  \ the tick's conflict is `merge-non-union-conflict` — the blocking set; auto-resolvable\n\
  \   paths were already resolved in place — the land aborts NOW with the identical\
  \ class and\n   `_update_from_main` text (plus the `worktree sync --resolved` route),\
  \ the reservation released,\n   `reservation_disposition: surfaced_while_queued`\
  \ and `queued_premerge.aborted_while_queued`\n   recorded (never `consumed_by_step2`\
  \ — step 2 did not run). A hand-conflict is not cured by main\n   advancing, so\
  \ waiting on to abort at acquisition only cost the wait ( census: 5 of 7\n   such\
  \ aborts, up to 106 min). The forced-tick, unsafe-state and `derived-conflict-unresolved`\n\
  \   arms, and the `YITC_LAND_QUEUED_PREMERGE=0` kill switch, keep the wait-then-abort\
  \ shape.\n3. **A FORCED tick runs at reservation ACQUISITION** — bypassing the min-wait\
  \ and the throttle but\n   NOT the watermark — for any land that actually queued,\
  \ closing the window between the last\n   queued tick and the acquisition.\n4. **A\
  \ BASE-CAPTURE FAILURE FAILS OPEN.** The tick captures the branch tip before the\
  \ FIRST\n   pre-merge (step 5 re-anchors `pre_merge_sha` to it). If that lookup\
  \ fails OR RAISES, the tick\n   declines: no merge, NO watermark, a recorded non-consumable\
  \ error, and land runs its ordinary\n   step-2 merge exactly as it does without\
  \ this rule. The tick MUST NOT raise into the reservation\n   wait — an exception\
  \ there aborts a land that a freshness OPTIMISATION was supposed to help.\n5. **AN\
  \ UNSAFE WORKTREE STOPS THE LAND — it is the one uncertainty that does NOT fail\
  \ open.** Every\n   non-success tick path runs a cleanup that must PROVE the pre-tick\
  \ state restored (`merge --abort`\n   succeeded, no `MERGE_HEAD`, no unmerged paths).\
  \ When that proof fails, disabling later ticks is\n   NOT sufficient: it bounds\
  \ what the pre-merge may still do and says nothing about the tree step 2\n   is\
  \ handed, and an ordinary `git merge` over a half-resolved index commits a partial\
  \ resolution as\n   branch-authored content. The land therefore ABORTS at acquisition,\
  \ BEFORE step 2, with its own\n   `queued-premerge-unsafe-state` class naming what\
  \ survived (the failed abort / `MERGE_HEAD` / the\n   unmerged paths). Main is untouched\
  \ and the worktree is left intact for inspection. It is placed\n   ahead of the\
  \ generic `uncommitted-dirt` refusal deliberately: that class tells the reader they\n\
  \   left files uncommitted, which is not what happened.\n6. **Step 2 CONSUMES the\
  \ pre-merge result ONLY when `main`'s tip STILL equals the last ATTEMPTED\n   tip**,\
  \ and only for an outcome the MERGE PATH produced (`merged` / `conflict`) or for\
  \ `current`,\n   which is the proof no merge was needed. A `current` may never be\
  \ INFERRED from an absent answer:\n   a failed or non-numeric behind-count is an\
  \ `error`. A `dirty`/unsafe record is NEVER one of\n   them: it is TERMINAL under\
  \ clause 5 and the land has ALREADY ABORTED at acquisition, BEFORE\n   step 2 is\
  \ reached at all, so on that record there is no fall-through to describe. FAIL-OPEN\
  \ IS\n   RESERVED FOR CLEAN ERROR RESULTS — a base-lookup failure or a failed/non-numeric\
  \ behind-count,\n   where NOTHING was merged and the tree is provably as it was.\
  \ Those, together with any advance\n   of main and the kill switch, fall through\
  \ to running step 2's own merge exactly as today.\n7. **The tick takes NO LOCK and\
  \ touches ONLY the branch's worktree.** It never opens, writes or\n   locks the\
  \ reservation path, so acquisition stays the unordered flock contention rule 9 assumes.\n\
  \n**Why here.** This is the reservation WAIT — the window rule 9 already governs\
  \ from the holder's\nside. This rule governs it from the WAITER's side, and it deliberately\
  \ introduces no new ordering,\nno new lock and no new class of batch member: a land\
  \ that never parks is byte-identical to one\nwithout it.\n\n**A SECOND waiter activity,\
  \ on the same terms — the parked PRE-SHIP.** A ROUTED land parked\nhere may also\
  \ ship its branch to the venue box (SPEC-0203 rule 3), so its verify push carries\
  \ only\nwhat the hold adds. It obeys clause 7 verbatim — it never opens, writes\
  \ or locks the reservation\npath and never takes a SPEC-0132 slot — and it runs\
  \ OFF the poll: the poll only marks a pre-ship\npending (at park start, and after\
  \ a tick that MERGED, so it rides the tick's own main-tip\nwatermark) and starts\
  \ at most ONE background pre-ship per land. Its only lock is a machine-wide\npre-ship\
  \ cap taken LOCK_NB-ONLY, beside a summed host-memory reservation; a refusal is\
  \ retried on\na later poll and never waited for. So it introduces no ordering against\
  \ reservation → slot →\nrepo lock and leaves rule 9 untouched. It stops at acquisition\
  \ (the forced tick of clause 3 starts\nnone), and it is FAIL-OPEN: nothing it does\
  \ changes a land's outcome. A land that never parks — or\nparks with no venue published\
  \ — is still byte-identical.\n\n### 16. A QUEUED land observes a withdrawal request\
  \ and withdraws ITSELF; an ADMITTED land is never interrupted\n**The rule, in one\
  \ sentence.** A withdrawal request addressed to ONE land attempt (the\nmarker family)\
  \ is observed at the VERIFY-SLOT ADMISSION SEAM and nowhere else: a land that is\
  \ still\nQUEUED for a slot observes it and withdraws ITSELF, while a land that has\
  \ already been ADMITTED\nnever observes it, is never signalled, and runs its verify\
  \ to completion. The decision \"withdraw\"\nversus \"admitted, proceed\" is made\
  \ ONCE, by ONE holder of ONE lock.\n\n**TWO OBSERVATION POINTS, AND ONLY ONE OF\
  \ THEM MAY GRANT PROCEEDING.** The asymmetry IS the rule:\n1. **The in-flock seam\
  \ — THE AUTHORITY.** Inside the verify-admission slot flock, immediately\n   before\
  \ the verify runs. This is the last instant before the pass is PAID, and a land\
  \ is admitted\n   only by getting past this read WHILE HOLDING the slot. Whatever\
  \ any earlier read did or did not\n, nothing but this one grants proceeding.\n2.\
  \ **The slot-wait poll tick — ABORT-ONLY.** On a tick at which the land is PROVABLY\
  \ still parked\n   waiting for a slot, holding nothing and having paid nothing.\
  \ Its single reachable outcome is\n   withdrawal; it can never admit. It exists\
  \ because a withdrawal is wanted precisely WHILE a land\n   is queued: honouring\
  \ it at (1) alone would make the withdrawal latency equal to the queue\n   latency,\
  \ so the remedy would arrive exactly when the problem ends.\n\n**Why (2) does not\
  \ re-open the check-to-admission race** (audit-pre finding G2, and the race that\n\
  killed the signalling design). G2's defect is check-then-ADMIT across two lock states:\
  \ a\nread taken outside the lock can be invalidated between the check and the admission\
  \ it grants. An\nabort-only read GRANTS NOTHING, so there is no admission for a\
  \ later event to invalidate. Nor can\nthe observation go stale in the unsafe direction:\
  \ a request is addressed to ONE attempt, and the\nonly process that can consume\
  \ it is that attempt itself, so once a land reads it, nothing any peer\ndoes can\
  \ make \"do not withdraw\" the right answer. An early observation and a late one\
  \ are the same\nfact.\n\n**THE NEVER-INTERRUPT INVARIANT, stated as a prohibition\
  \ because that is what it is.** Past\nadmission, NO path observes the request and\
  \ NO signal of any kind is sent on any path — no\n`os.kill`, no `pidfd_send_signal`,\
  \ no confirmation poll. This is not a small-window promise: the\nwindow is ABSENT,\
  \ not narrow, and a design that needed the window merely to be SMALL would fail\n\
  this rule. Concretely, the probe is wired into the CANDIDATE verify call ALONE;\
  \ the\nfailure-attribution and red-isolation probes, which run only after the candidate\
  \ pass has been\npaid, are deliberately NOT given it, and that absence is a decision\
  \ rather than an omission. Nor is\nany probe wired into the land-RESERVATION wait:\
  \ that is a different, earlier wait, and a third\nobservation point there would\
  \ reverse the G2 absorption a second time with no incident behind it\n(CHARTER §Principle\
  \ 1 filter 4).\n\n**A LAND THAT CANNOT CLEAR ITS OWN REQUEST DOES NOT REPORT A CLEAN\
  \ WITHDRAWAL** (consult round-6\nfinding C4). The terminal exit first consumes THIS\
  \ attempt's own request through the verified\nconsume — one that re-checks and reports\
  \ what it FINDS, never merely the absence of an exception.\nOn a failure the land\
  \ aborts NAMING the un-cleared path and emits no withdrawal record: attesting a\n\
  clean withdrawal from a fact about control flow would be an assertion about the\
  \ world the code has\nnot made, and vanishing quietly would leave a request still\
  \ addressing this same attempt.\n\n**THE OBSERVABLE.** A completed withdrawal emits\
  \ **`land_withdrawn`**, whose payload keys are named\nin SPEC-0161's recorded run\
  \ and NOT here (a rule body carries no payload shape — SPEC-0005 rule 8).\nNothing\
  \ else changes on the caller-facing surface: a withdrawn land is an ordinary refusal\
  \ reported\nthrough the ONE shipped `^LAND: (OK|ABORT)` terminal token (SPEC-0180\
  \ rule 2c), with no verify run,\nthe slot released or never taken, `main` untouched\
  \ and the worktree intact.\n\n**Bound, named.** The abort-only poll tick exists\
  \ only where the admission wait is POLLED. Where\nthe heartbeat is disabled the\
  \ admission is a single blocking lock acquisition with no ticks, and\nthe withdrawal\
  \ is honoured at the in-flock seam alone — later, never wrongly. Forcing the polling\n\
  path whenever a withdrawal is possible would silently change what that documented\
  \ switch does. The\ndegradation runs in this family's fail-closed direction throughout:\
  \ the worst outcome anywhere in\nthis rule is a withdrawal that does not happen,\
  \ never an admitted land that is interrupted.\n\n### Interaction with SPEC-0180\
  \ (the detached held-turn land)\nSPEC-0180 lets a dispatched worker hold its turn\
  \ while its land runs detached, polling ITS OWN land\nprocess for `^LAND: (OK|ABORT)`\
  \ or process exit — token-or-exit, nothing else. Under batching a member\nhas NO\
  \ personal land process: there is one shared batch run. The terminality contract\
  \ therefore\nextends — a member's terminal signal becomes its OWN journaled verdict\
  \ (rule 5), including the case\nwhere the batch was red for someone else's change\
  \ and this member will be re-batched. SPEC-0180 is a\nhard PREREQUISITE, not a companion:\
  \ batching lengthens the wait (formation plus a verdict on other\npeople's changes),\
  \ so without a survivable wait it kills workers faster than the status quo.\n\n\
  ### Relationship to SPEC-0132 — a different axis, not a new rung\nSPEC-0132's escalation\
  \ ladder is about SHARING THE HOST (serialize-ff → raise the verify worker cap →\n\
  per-land core-sharing). This spec does not move along that ladder: it amortises\
  \ the PASS across\nchanges rather than redistributing the machine. The two compose\
  \ and must not be read as alternatives —\na host-sharing decision never substitutes\
  \ for batching, and batching never licenses raising the cap.\n\n## Parameters\n\n\
  | param | value | meaning | carrier |\n|---|---|---|---|\n| `BATCH_MAX` | **4**\
  \ | upper bound on members per batch — bounds the COST OF DIAGNOSING a red batch,\
  \ not formation | code constant in `bin/lib/worktree.py` CITING this spec; `consumed:\
  \ false` |\n| `RIDES_WITHOUT_LANDING_SOLO_THRESHOLD` | **3** | rule 13 — batch rides\
  \ since the last completed verify after which a branch is routed SOLO | code constant\
  \ `_LAND_RIDES_WITHOUT_LANDING_SOLO_THRESHOLD` in `bin/lib/batch_landing.py` CITING\
  \ this spec; `consumed: false` |\n\n**The value is 4, and it is a code constant,\
  \ not a spec-consumed scalar** (plan-check finding 4,\n2026-08-16). `consumed: true`\
  \ is reserved for governance scalars an existing control-point READS\nfrom the spec;\
  \ a batch cap is ordinary tuning that belongs beside the code that enforces it,\
  \ with a\ncitation back here — the same shape `_VERIFY_WORKER_CEILING` already uses\
  \ for SPEC-0132.\n\n**`RIDES_WITHOUT_LANDING_SOLO_THRESHOLD` is 3, and it is AUTHOR-DECLARED\
  \ AND REVISABLE — never\nmeasured.** A later reader must not treat it as derived\
  \ from anything. The readings it was chosen\nAGAINST, recorded beside it so the\
  \ choice can be re-argued rather than rediscovered: `task/`\nrode four batches,\
  \ `task/` rode six, and the external consult\n(`decisions/land-conveyor-blindspots-audit-adhoc.yaml`,\
  \ finding 3) proposed one or two passenger\nturn-backs. It is a code constant for\
  \ the same reason `BATCH_MAX` is — ordinary tuning that belongs\nbeside the code\
  \ that enforces it, with a citation back here, so re-tuning costs nothing.\n\nMeasured\
  \ basis: over 675 distinct branches attempting to land in August 2026, 8.8% were\
  \ ever red on\ntheir own candidate leg. At that rate a batch of 4 is all-green about\
  \ 69% of the time; 8+ inverts the\ntrade (all-green drops below half). 4 also halves\
  \ cleanly, which keeps the eventual bisection\noptimisation (out of scope here)\
  \ at two passes rather than an uneven three.\n\n**The 69% ASSUMES member reds are\
  \ INDEPENDENT** — it is 0.912^4 — and they may not be: a broken\n`main`, a flaky\
  \ pinned test, or one bad merge-base correlates redness across a batch, pushing\
  \ the\nall-green rate DOWN and the re-queue bill UP. The trial must REPORT the observed\
  \ batch-level red rate\nagainst this 69% rather than assume it; if reds correlate\
  \ materially, `BATCH_MAX` is the parameter to\nre-tune, and it is a code constant\
  \ precisely so that costs nothing to change.\n\nProbes belong AT and OVER the cap:\
  \ a queue of exactly `BATCH_MAX` forms one batch; a queue of\n`BATCH_MAX + 1` forms\
  \ a full batch plus a remainder that waits, never an oversized batch.\n\n## Rationale\n\
  \nMeasured, not assumed (2026-08-16):\n\n- **Verify cost is FIXED, not proportional\
  \ to the change.** Regression over 165 (audited-files,\n  verify-seconds) pairs\
  \ gives ~515s base and −1.0s per file — the slope is zero. audited 53\n  files in\
  \ 438s; a 2-file land took 460s. So per-change cost cannot be reduced by making\
  \ changes\n  smaller; only the NUMBER of passes can fall.\n- **That fixed cost now\
  \ exceeds what a worker survives.** August median land verify 325s (n=743), p95\n\
  \  743s, against a ~590s harness per-call cap; on 2026-08-15, 22% of dispatched\
  \ workers halted\n  `blocked-on-land`. SPEC-0132 Rule 4's Tier-C triggers (median\
  \ >5min OR p95 >12min) have both fired.\n- **Test selection is unavailable as a\
  \ lever here.** 70% of the 830-file corpus asserts on kernel\n  SOURCE TEXT rather\
  \ than executing it; the union of executed lines across a traced sample covers only\n\
  \  6.1% of `worktree.py`. Coverage cannot observe those dependencies and selection\
  \ on it would produce\n  a false green. The suite can be amortised but not shortened.\n\
  - **Queueing is deliberate and correct.** serialized merge→verify→ff after measuring\
  \ 71% of\n  the verify budget as redo (11.6h discarded against 4.6h that counted,\
  \ all `retry-main-advanced`).\n  Racing is worse. What that change did not provide\
  \ is a way to survive the queue it created.\n\nPrior art extended rather than replaced:\
  \ SPEC-0132 (governor + ladder) (serialized span),\nSPEC-0077 (doubled verify) (pinned-verdict\
  \ cache, keyed on the whole candidate tree so it\nonly hits on a repeated attempt\
  \ of the SAME branch — it does not amortise across different changes).\nIndustry\
  \ precedent for this exact shape: Bors / GitHub merge queue (batch then bisect),\
  \ Zuul\n(speculative chains).\n\n## Verification\n\n- **Rule 15 (the queued pre-merge\
  \ — four differentials, `tests/test_t12150_queued_land_branch_freshness.py`):**\n\
  \  (a) FRESHNESS — a branch parked on a real held reservation gains main's commit\
  \ WHILE STILL\n  PARKED and the merge path is invoked exactly ONCE across the whole\
  \ land; with\n  `YITC_LAND_QUEUED_PREMERGE=0` the same fixture leaves the branch\
  \ untouched during the wait and\n  merges only after acquisition. (b) WATERMARK\
  \ — a persistent blocking conflict costs exactly ONE\n  attempt across many throttle\
  \ intervals and then leaves the queue (`tests/test_t13345_queued_conflict_leaves_queue.py`:\
  \ the land aborts while the holder still\n  holds; with the kill switch it is still\
  \ parked at release), and an unproven behind-count is\n  recorded as a non-consumable\
  \ `error`, never as a consumable `current`. (c) FAIL-OPEN — an injected exception\n\
  \  in the base capture leaves the land SUCCEEDING, sets no watermark, consumes nothing\
  \ and lets\n  step 2 run its own merge. (d) THE ONE NON-FAIL-OPEN ARM — with `git\
  \ merge --abort` genuinely\n  wedged, the record carries `unsafe_state` naming what\
  \ survived AND the land aborts at\n  acquisition with class `queued-premerge-unsafe-state`,\
  \ the post-release step-2 merge invocation\n  counter reading 0 and main untouched.\
  \ A rule that only disabled later ticks passes (a)-(c) and\n  MUST fail (d).\n\n\
  - **Rule 1:** a queue of depth 1 produces a land whose journalled events, commits\
  \ and terminal token\n  are identical to the pre-spec path at the three levels rule\
  \ 5 names (differential: the same branch\n  landed before and after shows no new\
  \ rows — and specifically NO per-member attribution row, per\n  rule 5's N=1 clause);\
  \ a queue of depth N>1 produces ONE verify for N members.\n- **Rule 1 (the `paying`\
  \ metric — a DIFFERENTIAL, never an assertion):** over one fixture family,\n  a\
  \ FIRST-attempt member whose paths are inert is counted as paying while a RETRY\
  \ carrying the same\n  inert delta is not, and a member whose paths cannot be read\
  \ is counted on neither. A rule that\n  simply counted every member would satisfy\
  \ the first half and MUST fail the second; a rule that\n  kept the inert-path proxy\
  \ fails the first. The consumer cohort is probed in the same family: a\n  member\
  \ whose paths every declared layer would SKIP stays non-paying while one some layer\
  \ RUNS\n  for pays, so one classifier is proven to give opposite answers in a kernel-authored\
  \ and a\n  project-authored repo. That half is probed against `subject_globs` on\
  \ a REAL declared shape\n  whose `covers:` and `subject_globs:` DISAGREE — a layer\
  \ owning `tests/**` while its subject\n  spans `app/**` — because a probe where\
  \ the two coincide cannot tell the carriers apart, and a\n  `covers:`-read passes\
  \ it while inverting the live answer. A layer declaring NO `subject_globs`\n  runs\
  \ always, and that default is probed too.\n- **Rule 2 (declaration half):** a project\
  \ without the declaration never forms a batch of 2+,\n  asserted with the declaration\
  \ present and absent over the same queue.\n- **Rule 2 (kernel half — combined-candidate\
  \ blame is VALID on the kernel's own suite)** (plan-check\n  finding 2, 2026-08-16).\
  \ Rule 2 engages batching for the kernel with NO declaration, on the grounds\n \
  \ that the kernel owns its suite's isolation properties. That is an ASSERTION until\
  \ probed, and the\n  entire red-path safety argument rests on it — an unprobed assertion\
  \ here is exactly the shape that\n  lets a red change ride a green batch. So it\
  \ is probed directly, on the kernel suite:\n  a red combined candidate lands NO\
  \ member and dissolves the batch back into the queue, and each\n  re-queued member\
  \ is then verified ALONE. Blame is not computed and is not needed (plan-check finding\n\
  \  1, 2026-08-16 — the earlier wording probed bisection, which this spec no longer\
  \ scopes): dissolution\n  is SELF-CORRECTING. A genuinely red member fails again\
  \ on its own candidate leg and is caught; a\n  PEER-DEPENDENT red — one that fails\
  \ only for the COMBINATION — goes green alone and lands, which is\n  the correct\
  \ outcome rather than a misattribution to whichever member a bisection happened\
  \ to isolate\n  first. What the probe must show is that the kernel suite behaves\
  \ this way over a COMBINED candidate\n  at all: that a combined red is detected,\
  \ that it is total (no member rides it onto `main`), and that\n  re-verifying the\
  \ members singly reproduces each one's true individual verdict. A failure here is\
  \ a\n  finding against rule 2's no-declaration path itself — it would mean the kernel\
  \ suite needs the same\n  declaration a project-authored verify does, and rule 2's\
  \ asymmetry is wrong.\n- **Rule 3:** two members whose merges conflict — the loser\
  \ is evicted with ZERO verify passes spent\n  (probe: no verify-start row between\
  \ formation and eviction).\n- **Rule 13 (differential, both directions):** a fixture\
  \ branch named in THREE multi-member\n  `land_batch_formed` rows with no completed-verify\
  \ land since is NOT placed in a multi-member batch\n  at the next formation, while\
  \ the SAME branch with the rides absent or below threshold IS — nothing\n  counts\
  \ rides before this rule.\n- **Rule 13 (it needs no name):** the fixture red batch\
  \ names NO culprit (attribution declined) and\n  the routing still fires on the\
  \ third ride. An implementation keying on any verdict fails this.\n- **Rule 13 (it\
  \ self-clears):** after the solo attempt COMPLETES — ok or abort, verify having\
  \ run —\n  the branch is an ordinary batch candidate again; an unclearing mark fails.\n\
  - **Rule 13 (it survives a busy day):** a third ride is still counted when the first\
  \ ride row has\n  scrolled far beyond the former 512KB tail bound — the count rides\
  \ the lifetime-sized window.\n- **Rule 4:** a red batch leaves `main` unchanged\
  \ for EVERY member; a green batch moves `main` by all\n  members in one step. The\
  \ hard failure this guards: a member on `main` whose own candidate leg was\n  red.\n\
  - **Rule 5:** each member's verdict is readable from the journal alone, without\
  \ reconstructing the\n  batch — including a member re-queued because a PEER was\
  \ red.\n- **Rule 7 (the safety probe of this spec — a differential, not an assertion):**\
  \ a batch in which\n  exactly ONE member touches the verify path runs BOTH legs\
  \ for the whole batch (probe: `verify_mode`\n  records the doubled regime for a\
  \ batch whose other members touch nothing verify-related). And the\n  property that\
  \ leg protects is probed directly: a batch pairing a verifier-WEAKENING member with\
  \ a\n  member the pre-change verifier would reject must NOT land — the candidate\
  \ leg passes under the\n  weakened verifier, and the PINNED leg is what refuses\
  \ it. A green result there is the failure this\n  probe exists to catch, not a pass.\n\
  - **Rule 9 (differential, on the YIELD — not on the successor):** with an expensive-class\
  \ slot\n  holder and a strictly cheaper UNMARKED candidate queued behind it, the\
  \ holder releases the\n  reservation without verifying; with the class comparison\
  \ removed (the holder ranked cheapest) it\n  does not. **The successor half is no\
  \ longer silent (2026-08-19).** While the handover was\n  a first-come flock this\
  \ criterion asserted nothing about WHO takes the slot next, because the\n  mechanism\
  \ genuinely lacked that property. It has it now — the yield is ADDRESSED — so the\
  \ paired\n  criteria are: only the NAMED successor may take the offered slot (a\
  \ third contender must abstain,\n  and with the offer removed it must not), the\
  \ named successor TAKES it on the poll tick it already\n  runs and consumes the\
  \ offer, and an offer nobody answers is ended by the EXISTING park limit rather\n\
  \  than holding the slot open.\n- **Rule 9 (the mark, owner requirement):** a cheaper\
  \ candidate whose rule-8 supersession marker is\n  SET is NOT a yield target, and\
  \ the marker SURVIVES the read (a rule that yields to any cheaper\n  candidate passes\
  \ the differential above and fails here).\n- **Rule 9 (complement — the quiet repo):**\
  \ with no strictly cheaper unmarked candidate queued\n  (empty queue, equal class,\
  \ or an undecidable one), there is no yield, no extra wait and no\n  `slot_yields`\
  \ key — byte-identical to the pre-rule path. A rule that yields whenever anything\
  \ is\n  queued passes the differential and fails here.\n- **Rule 9 (no new bound,\
  \ no livelock) — a DIFFERENTIAL over two real contenders, not an\n  assertion:**\
  \ the decision path reads no yield count and no cap exists. A mutual-yield fixture,\n\
  \  constructible only by INJECTING an inconsistent ranking (the shipped strict order\
  \ makes it\n  unreachable), drives the SHIPPED loop from two separate PROCESSES\
  \ against a real reservation\n  flock. WITH the offer bookkeeping it settles at\
  \ once; with that bookkeeping disabled — one line\n  of injected difference — the\
  \ same pair does NOT settle inside a window many times the pinned\n  park limit.\
  \ That is what establishes which property terminates it, and it is why the rule\
  \ above\n  records that the park limit is not the backstop the founding directive\
  \ named.\n- **Rule 9 (convergence, MEASURED not assumed):** yields-per-slot-acquisition\
  \ stays at or below a\n  small named bound (start: 2) on the differential fixture,\
  \ driven through the SHIPPED fairness\n  dispatch against a real flock with a real\
  \ parked peer. A rule that satisfies the differential but\n  ping-pongs until the\
  \ park limit fails here; the answer to a failure is a MEASURED poll value, not\n\
  \  a re-introduced back-off.\n- **Rule 9 (age) — a DIFFERENTIAL over real contenders:**\
  \ an OLDER solo waiter and\n  repeatedly arriving NEWER contenders of the same class\
  \ contend on a real reservation flock\n  through the shipped acquire/yield path;\
  \ the older waiter is granted first. With the age pass\n  disabled (`_older=None`)\
  \ the same fixture grants a newer contender first. Complement: a\n  strictly cheaper\
  \ younger branch still goes first, and an undatable age triggers no handover.\n"
