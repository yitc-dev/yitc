id: SPEC-0044
title: Parallel dispatch selection — eligibility boundary + carve-out picker (read-only)
status: active
created_at: 2026-06-06 07:46:32+00:00
consumed: false
implements:
- bin/lib/cli.py#_carve_out_selection
body: "## Scenario\n\nA session dispatching parallel work (the controller) asks two\
  \ questions: «which of the ready\ntasks can be worked on safely at the same time?»\
  \ and «what is already in flight, that we must\nnot touch?». The answer is COMPUTED,\
  \ read-only, from existing state (the graph projection + the\ntask queue + the git\
  \ worktree list) — never hand-screened from task prose under load. The output\n\
  is a dispatch-shaped selection: ordered chains, independent singletons, silent waits\
  \ with their\nrelease predicates, and a short clash report carrying ONLY genuine\
  \ owner questions. The picker\nSELECTS and FLAGS; the owner/controller decides and\
  \ dispatches.\n\n## Internal\n\n### 1. Eligibility boundary (what is screenable\
  \ at all)\n\n- The spec-lineage screen operates on tasks with a KNOWN activating\
  \ spec — typically\n  plan-decomposed tasks (the plan-accept gate is the discovery-before-dispatch\
  \ boundary: it\n  forces the spec-footprint to be known up-front). A RAW ready task\
  \ has no activating spec until\n  its Plan stage — there is nothing to lineage-screen;\
  \ it parallelizes on the SAFETY FLOOR\n  (per-write worktree isolation + ff-only\
  \ `land`).\n- **STOP-rule (floor escape):** the moment a floor task's Analysis reveals\
  \ it would reshape a\n  shared design surface OR birth/alter a coordinating spec,\
  \ it MUST NOT continue in parallel on\n  the floor — it halts and folds into a plan\
  \ path (re-check against the current projection;\n  escalate to a plan if it coordinates\
  \ with others).\n- Advisory routing line (NOT a gate — deliberately unenforced):\
  \ work touching a shared /\n  coordinating spec surface is routed through a plan;\
  \ independent work is not. Enforcement is\n  deferred; the boundary above is the\
  \ conceptual ground the screen rests on.\n\n### 2. The selection rule (the dispatchable\
  \ set)\n\nAt any moment the dispatchable set =\n\n1. **Eligible:** `ready` ∩ every\
  \ `requires:` target `done` on `main` — the QUEUE §Picker-logic\n   requires-edge\
  \ gate (homed there; not restated). This rule CONSUMES the `requires:` edges as\n\
  \   decomposition set them; WHAT belongs in those edges (incl. the verifier-class\
  \ content\n   discipline — a verifier's `requires:` names every writer of its settled\
  \ subject) is\n   DECOMPOSITION-side doctrine homed with <workshop-spec>, not here.\n\
  2. **∩ collision-free** vs the in-flight set AND each other, screened at TWO altitudes:\n\
  \   - **spec-lineage** (tasks with a known activating spec): shared lineage + ordered\n\
  \     (`requires:`/`supersedes:`) → a silent **WAIT** with the deterministic release\
  \ predicate\n     `all(requires) done on main` — sequencing, not a question; shared\
  \ lineage + UNORDERED\n     co-writers → a **P7 clash report** entry (owner question;\
  \ detector = the\n     `multi-proposer-unordered` projection flag B6).\n   - **code-surface\
  \ (floor tasks, no activating spec) — DUTY-grade, not screen-grade (crisp\n    \
  \ boundary):** the NORMATIVE screen of this rule is the spec-lineage altitude above;\
  \ for\n     floor tasks this rule names a JUDGEMENT DUTY of the dispatching session,\
  \ no automated\n     screen: judge on the TOUCHED code surface — never on output-artifact\
  \ names; same file /\n     different functions → parallel (`land` reconciles); same\
  \ FUNCTION/region → serialize. The\n     judgement MAY consume the optional `expected_touch:`\
  \ forecast (field semantics homed in\n     SPEC-0028) by plain list intersection.\
  \ The AUTOMATED coarse screen is OUTSIDE this spec —\n     a deferred tracked task\
  \ (return-trigger: pain-record N≥2); `land`'s ff-only reconcile is\n     the safety\
  \ net either way.\n3. **Substrate reads (each one mandatory):**\n   - the in-flight\
  \ frontier is read from **`git worktree list`** — a claim is visible there\n   \
  \  immediately; `status:` on `main` lags the claim by a whole `land` and is NEVER\
  \ the\n     frontier source;\n   - the lineage screen reads the **projection itself**\
  \ (`graph query --projected`,\n     SPEC-0031) — a hand-screen from task prose is\
  \ never the substrate;\n   - the WHOLE computation is **recomputed after every `land`**\
  \ — a selection is a snapshot,\n     not a standing assignment (the queue is a living\
  \ system; lands shrink the frontier and\n     release waits);\n   - at release of\
  \ a held task, **retarget** stale scope text onto the CURRENT spec head —\n    \
  \ head-succession between filing and dispatch is normal under parallelism.\n\n###\
  \ 3. Output shape\n\nNot a flat antichain — the selection RETURNS the structure\
  \ the dispatcher needs:\n- `requires:`-ordered **chains** (necessarily-sequential\
  \ spines, grouped);\n- independent **singletons**;\n- silent **waits** — ordered\
  \ exclusions, each with its release predicate;\n- the **clash report** — P7 questions\
  \ ONLY (an ordered-pair exclusion is silent sequencing,\n  never a question; question-spam\
  \ is a defect).\nHow the dispatcher RANKS and LAUNCHES the safe shapes (speed-vs-token\
  \ policy, warm-session\nfront-loading, the chain cap) is operating practice homed\
  \ in the background-session pattern —\ndeliberately OUTSIDE this rule.\n\n### 4.\
  \ Read-only invariant (the make-or-break guard)\n\nThe picker is a pure read-only\
  \ query — `f(graph, queue, worktree-list)`. It NEVER spawns,\ndispatches, caps parallelism,\
  \ holds stateful queue state, or decides without the owner.\n**SELECTION ≠ RESERVATION:**\
  \ the picker selecting a task does not prevent a concurrent claim —\nrace prevention\
  \ (publish/claim discipline) is a SEPARATE, deliberately-unconverged concern\n(tracked\
  \ parked task; observation-held). If any extension of this rule wants scheduler\n\
  semantics — spawn, cap, stateful queue, auto-decide — STOP: that is the forbidden\
  \ orchestrator\n(CHARTER §6 + §What-V2-is-NOT).\n\n### 5. Scope — the honest claim\n\
  \nThis rule closes the spec-conflict pre-check for accepted-plan decompositions\
  \ whose activating\nspecs are known before execution — NOT for parallel work in\
  \ general. Stays land-time (not\nclosed here): work-first spec birth mid-Execution\
  \ (rare; the STOP-rule pushes discovery\nup-front); code overlap between floor tasks\
  \ (surfaces as an ordinary ff conflict at `land`;\nthe coarse pre-screen is the\
  \ deferred tracked task).\n\n## Parameters\n\nNone consumed. The dispatch-side operating\
  \ parameters (the warm-session front-load cap, the\nspeed-vs-token ranking) are\
  \ deliberately NOT homed here — they live with the dispatcher's\noperating practice\
  \ (`patterns/background-session-operation.md` §Launch), outside this rule.\n\n##\
  \ Rationale\n\nFilter-4 pull: the dispatch/stale-main deviation cluster (~16 fingerprints,\
  \ 2026-06-01..06) +\nthe live 2026-06-05 double-claim incident (a published `ready`\
  \ task picked by a concurrent\ndispatch while held in a worktree — the claim invisible\
  \ on `main` until land). The selection\nrule was exercised by hand across three\
  \ real controller runs (2026-06-04/05/06): chains,\npredicate-held releases (×3,\
  \ one requiring retarget), and a same-function collision invisible\nto an output-file\
  \ screen all confirmed the rule's content empirically. Full evidence +\ndeliberation:\
  \ the authoring plan (content boundary, SPEC-0005 rule 3 — only the rule lives here).\n\
  Reviewed coherent vs the current _carve_out_selection at 9cea9f27b : the symbol\
  \ region\nshifted when the per-task projection _task_safety_verdict landed nearby,\
  \ but the SELECTION\nRULE itself (§2-4) is unchanged — _task_safety_verdict PROJECTS\
  \ this whole-graph carve onto one id,\nit does not alter the rule — so no drift;\
  \ this is an in-place currency re-touch, not a reshape.\n\n## Verification\n\n-\
  \ **VP1 (substrate honesty):** a selection computation demonstrably reads the projection\
  \ +\n  `git worktree list` (query-observability evidence: the existing `cli_invoked`\
  \ journal events\n  for the underlying reads), and the frontier is never derived\
  \ from `status:` on `main`.\n- **VP2 (screen correctness, synthetic):** a synthetic\
  \ pair of ready tasks whose activating\n  specs share an UNORDERED lineage yields\
  \ a clash-report entry; the same pair `requires:`-ordered\n  yields a silent wait\
  \ with the `all(requires) done on main` predicate — no owner question.\n- **VP3\
  \ (currency):** after a `land_completed`, a re-computation yields an updated selection\n\
  \  (released waits / shrunk frontier) — observable as two journaled selections around\
  \ one land.\n- **VP4 (read-only):** a selection run leaves task/spec/queue/source\
  \ artifacts unchanged;\n  the routine append-only `cli_invoked` entry in `events.jsonl`\
  \ is the allowed observability\n  trace and does not count as a read-only violation.\
  \ (\"Empty diff\" means no mutation of\n  task/spec/queue/source artifacts — NARROW\
  \ carve-out: only the standard append-only journal\n  trace identical to every other\
  \ read verb is allowed; any other tracked mutation stays\n  forbidden.)\n- **VP5\
  \ (shadow soak — the plan's postcheck form):** the first N selection waves run SHADOW\
  \ —\n  computed, compared against the controller's hand-carve BEFORE dispatch, divergences\
  \ journaled\n  and examined; promotion is an owner judgement over a bounded recent\
  \ run with no unresolved\n  picker-loss divergence (N owner-set at decomposition).\n"
