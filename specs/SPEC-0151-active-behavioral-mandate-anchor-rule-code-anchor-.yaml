body: "## Scenario\n\nAn ACTIVE spec that tells the system to BEHAVE somehow always\
  \ answers \"who executes this?\" —\na code anchor, a delivered human obligation,\
  \ or an honest \"not executed\". A reader can no longer\nmistake a closed task id\
  \ for a shipped mechanism.\n\n## Internal\n\n1. An ACTIVE spec whose body carries\
  \ a behavioral mandate MUST name at least one of:\n   (a) an `implements:` code\
  \ anchor covering the mandate;\n   (b) a `binding:`-delivered HUMAN obligation (the\
  \ rule reaches a person at a moment of use);\n   (c) an explicit execution-status\
  \ marker DECLARATION in the body — a line-anchored\n  `execution: not-executed`\
  \ or `execution: operator-owned`. A prose MENTION of those\n  tokens is NOT a marker:\
  \ this spec was its own first false-negative, silencing the check\n  on itself merely\
  \ by DESCRIBING satisfier (c). Same class as SPEC-0150's \"a log mention\n  is not\
  \ a read site\" (deviation prose-mention-satisfies-structural-marker-check).\n2.\
  \ Task ids are PROVENANCE, never execution carriers: `status: done` proves a card\
  \ closed, not\n   that a mechanism runs (lessons/proof-card-after-wiring-card.md).\n\
  3. Enforcement starts REPORT-ONLY: a WARN at spec-new/spec-edit + a graph-conformance\
  \ sweep line\n   (anti-complexity — no new hard gate until the WARN provably fails;\
  \ hardening is its own\n   follow-up with its own incident). Documentary/binding-only\
  \ specs are OUT of scope by\n   construction (the consult: \"overbroad for documentary\
  \ specs\" — scoped to behavioral mandates).\n4. A FOURTH disposition satisfies (c):\
  \ the line-anchored declaration `execution: documentary`\n   FOLLOWED BY a non-empty\
  \ reason on the same line (e.g. `execution: documentary — <reason>`) —\n   the machine-recognizable\
  \ form of SPEC-0005 §7 empty-implements mode (a). A bare documentary\n   declaration\
  \ with no reason does NOT satisfy (an unexplained opt-out is the silence this rule\n\
  \   forbids), and a prose mention stays not-a-marker as in (c). Separately, the\
  \ check has an\n   explicit ALL-SPECS evaluation scope that drops the mandate-scoping\
  \ of §3 and judges every spec\n   in scope: the mandate detection is an English\
  \ modal-verb set, so a body written in another\n   natural language is otherwise\
  \ never evaluated. The default scope is unchanged; the all-specs\n   scope is report-only\
  \ too and is used only by the seams that opt into it.\n\n## Rationale\n\nSPEC-0097\
  \ §5 said \"execution lives in tasks /17/18\"; the tasks closed; no code existed\n\
  (level 1-2 of the 2026-07-09 family). The consult refined the blunt \"active spec\
  \ needs\nimplements:\" into exactly this three-way rule.\n\n## Verification\n\n\
  Named tests: (a) an anchor-less active behavioral-mandate fixture draws the WARN\
  \ + the sweep\nline; (b) each of the three satisfiers silences it; (c) a documentary\
  \ spec with no mandate is\nnever flagged; (d) a task-id-only \"anchor\" still WARNs\
  \ (provenance is not execution).\n"
