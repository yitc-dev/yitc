  - **`land_process_group_escaped`** — `bin/lib/worktree.py` — a NON-WORKER (interactive / controller / CI / consumer) `land` LEFT the process group of whatever launched or watches it, at land entry and before any lock, merge or integration; carries `mechanism` (`setsid` | `setpgrp` | `already-leader` | `opted-out` | `unavailable`) / `pid` / `reason`. It exists because the four measured deaths of fingerprint `interactive-background-land-killed-in-admission-wait` were all group-directed kills aimed at the land's OBSERVER, and because a land whose lifetime is owned by its watcher cannot keep the AGENTS-SESSIONS promise to "key ALL recovery off the JOURNAL, NEVER off the wrapper's process lifetime". The row is what makes the decoupling READABLE — it is the adoption evidence a later session reads to know this land could not have died with its wrapper. Deliberately scoped AWAY from the DISPATCHED WORKER, whose land must stay in its worker's group (SPEC-0103 / SPEC-0180): a worker land emits this type ZERO times, and that absence is meaningful, not missing data. `mechanism` is REPORTED rather than asserted — the escape is a hardening and fails SOFT, so `unavailable` is a real value and never an error.
  - **`watch_process_group_escaped`** — `bin/lib/dispatch.py` — a `dispatch --watch` LEFT the process group of the shell that launched it, at watch entry and BEFORE the poll loop blocks; carries `mechanism` (`setsid` | `setpgrp` | `already-leader` | `opted-out` | `unavailable`) / `pid` / `watched_tasks` / `watch_fleet` / `reason`. The WATCHER sibling of `land_process_group_escaped` above, emitted by the SAME helper (`worktree._escape_observer_process_group`, one mechanism and two callers) for the same measured cause: aiseller X-1103 saw a backgrounded watcher SWEPT twice in a row while every worker it watched stayed healthy, because the harness kill is group-directed and the watcher shared its shell's group. The row is what makes the decoupling READABLE — it is how a later session knows this watcher could not have died with its wrapper, so a swept, timed-out or never-armed wrapper costs a re-arm and nothing else. It covers `--watch-fleet` too (that flag only widens which verdicts may WAKE the same loop), which is why `watch_fleet` rides the payload. `mechanism` is REPORTED rather than asserted — the escape is a hardening that fails SOFT, so `unavailable` is a real value and never an error, and the emit itself is fail-open so a broken journal never refuses a watch.
  - **`land_terminated_externally`** — `bin/lib/worktree.py` — this land was terminated by a CATCHABLE external signal (SIGTERM / SIGHUP / SIGINT); carries `signal` / `pid` / `reason`. The POSITIVE half of the same concern: before it, a land killed while queued and a land still queued and perfectly healthy left IDENTICAL durable state — queue-wait heartbeats and no `LAND:` token — so nothing on record could ever ATTRIBUTE one of these deaths to its cause. Sibling of `land_worker_liveness_lost` above and distinguished from it on the same axis that separates that type from `land_synchronous_guard_refused`: this one means "something OUTSIDE killed this land", that one means "the kernel killed it because the worker holding its turn died". SIGKILL cannot be caught, and that residual is covered NOT by this row but by heartbeat STALENESS against the published cadence (`_classify_queued_land_liveness` / `_queue_heartbeat_stale_after`) — which is why both halves exist. As with the liveness kill, an unwritable row does not cancel the termination: it is announced on stderr instead, because an unrecorded kill is a silent death.
