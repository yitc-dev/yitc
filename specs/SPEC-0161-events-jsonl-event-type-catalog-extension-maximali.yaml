  The **cataloged contract is the ENVELOPE** (`ts` / `type` / `task_id` / `data`, SPEC-0025 §universal
  schema). A type's **`data` payload is OPEN by the append-only rule** — a consumer parses `data` as an
  opaque map and MUST tolerate unknown keys — so a payload key added by its emitter is **not** a catalog
  breach, and the **emitter is that type's payload source-of-truth**. Where this spec shows a JSONC block,
  that block is **illustrative of the shape, never an exhaustive closed key list**.

