  - **`land_queue_jump_fired`** — `bin/lib/worktree.py` — a card's OPT-IN `queue_jump` mark ACTUALLY REORDERED land admission: the reservation holder handed the slot to that branch ahead of the cost ladder (SPEC-0184 rule 9). Carries `branch`/`reason`/`yielded_by` and rides `task_id`. Emitted ONLY when the mark DECIDED the handover — a mark that exists and changed nothing emits nothing — which is what makes the row a reading of real reorderings rather than a count of marks in the corpus, and what lets overuse be seen on the `debt` view without anyone running an audit (safeguard c).
