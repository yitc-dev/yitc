  ### Who is charged for an unnamed payload key (2026-09-07)

  **The rule: a governing (event, payload-key) pair is named in the record above BY THE BRANCH THAT
  INTRODUCES IT, in the SAME diff.** Not by whoever happens to land next.

  THE DEFECT THIS CLOSES, measured in this repo's own journal on 2026-09-07. The measurement above
  reads a SHARED, GROWING input — the journal's live (type, key) census — against a record that moves
  only by a human edit. The CONDITION it detects is therefore repo-wide while the REFUSAL it issues is
  per-branch, and the two do not line up. `queued_premerge` reached main's journal at 10:45Z;
  from 10:50Z every land's candidate leg reddened on `tests/test_spec0161_payload_key_refresh.py` —
  7 aborted lands, 4 workers halted `blocked-on-land`, ~70 minutes on `queued_premerge` — none of which
  had touched that emitter, until a human named the pairs at 12:01Z. Then introduced
  `measurement_recorded.test_files` and reddened its OWN land 3x the same way: the branch that WAS
  answerable learned it minutes in and past the venue slot, from a whole-suite verify, when a
  `git diff` at the door knew it for free. Both faces are one defect — the failure is not ATTRIBUTED.

  **WHERE IT IS ENFORCED — four readers, ONE predicate.** `bin/lib/debt.py#spec0161_branch_unnamed`
  is the ONE entry point (the existing `spec0161_payload_key_coverage` oracle plus a pure attribution
  split — no second oracle, per the one-oracle discipline):
  1. **`task commit` / `work commit` — a WARN** naming the introduced-but-unnamed pairs. Report-only,
     stderr, exit code untouched. Stage 7 is where the diff exists, nothing is spent, and the fix is
     one `spec edit` in the same commit.
  2. **that branch's `land` — a REFUSAL**, on the cheap P0 preflight beside the / /
      arms: after `main_wt` resolves and BEFORE the land reservation, the SPEC-0132
     verify-admission slot, the merge from main and the suite. Seconds, not minutes. It reuses the
     existing `abort_detail={"preflight": True}` row shape, so it is exempt from the
     repeated-abort streak exactly as its siblings are.
  3. **the two live-corpus land-verify gates** (`tests/test_spec0161_payload_key_refresh.py` and the
     coverage-floor arm of `tests/test_event_catalog_completeness.py`) charge THIS branch only for
     pairs it introduced. Inherited pairs are REPORTED and do not fail a bystander.
  All three paste ONE text, and that text NAMES THE CHARGING SITE — `<path>:<line>` of an added
  structural occurrence, per charged key. A charge the charged party cannot check is a
  charge they must re-derive the structural scan by hand to locate, at a gate that fires seconds
  before a venue slot; the site is carried out of the same materialiser pass that computes the
  charge, so the message and the verdict cannot name different places. A pair charged by count 2
  (un-naming) has no code site and is listed bare — correctly: its charge is in the record, not in
  the diff.

  **WHAT ATTRIBUTION MEANS, exactly — and it is STRUCTURAL, never a mention.** A branch is answerable
  for a key on either of two counts:
  1. **it ADDS the key TO CODE** — the key appears on a line the branch adds under `bin/`, in a
     position that actually makes it a payload key: `.get("k")` or `["k"]` (VERBATIM the two regexes
     the oracle derives its own `readback` conjunct from — the same expressions, not lookalikes) or
     `"k":` (the key as a payload-dict KEY LITERAL, needed because a branch may add the emitting dict
     while the readback already existed on main). Every form requires the key QUOTED. **AND no
     structural occurrence of that key existed under `bin/` AT THE MERGE-BASE.** Adding an
     occurrence is not the same fact as INTRODUCING the key: a branch that adds a SECOND readback of
     a key main already reads back made nothing govern that did not govern before, so charging it
     re-reads a key that governed before the branch existed. Measured — aiseller X-1343 / ``:
     its land was refused for `spike_channel_grant.compose_project` because it added
     `meta.get("compose_project")` in `bin/tests/spike_live_support.py`, while `bin/spike-lib.sh:46`
     had carried `m.get("compose_project")` at the merge-base all along. The base side is a
     BASELINE-vs-CURRENT comparison of the same shape count 2 already has, and it is affordable for
     the same reason: it is TARGETED. Only the FEW keys this branch added can change an answer, so
     one `git grep -l -F` over `<base>:bin` restricted to those literals yields a handful of
     CANDIDATE files, and each candidate is read at the base rev and judged by the SAME structural
     matcher the branch side is judged by — the grep is a FILE FILTER, never the verdict, so a
     comment or a quoted example at the base can no more exempt a branch than it can charge one. The
     earlier concession that this arm could not afford the family's baseline shape priced the WRONG
     question (the whole `bin/` tree plus the re-folded journal at base) and is retired. **`git grep`
     exit status 1 is "no match", an ANSWER — the common case, and the key stays charged;** only a
     genuine git fault is unknowable (None), because reading a fault as "nothing pre-existed" would
     restore the over-charge at a refusing gate, and reading rc 1 as a fault would make every
     genuinely-new key unattributable, i.e. disable this gate rather than narrow it.
  2. **it UN-NAMES the key** — the key was in this record's span at the merge-base and is not in it
     now. That arm is a BASELINE comparison (`git show <base>:<spec>` versus the span on disk), which
     is the diff-aware family's own shape and is affordable here because the input is one small file
     at one rev.

  **NEITHER ARM IS A WORD SCAN, and that is load-bearing.** A bare mention — in a comment, a
  docstring, a refusal message, a test name, or an unrelated `specs/` deletion that happens to
  contain the literal — must NOT charge a branch, because a false positive at a REFUSING gate is the
  most expensive kind of wrong. Attribution is BY KEY, not by (type, key): the record names keys, and
  requiring the type in the diff too would let a branch add a new key to an existing type and be
  charged nothing.

  **WHAT MAKES "NEVER A MENTION" TRUE IS TWO CONCRETE MECHANISMS, named here because the claim above
  is only as good as them — and BOTH were missing on the first pass (audit-post pass 2, findings B1
  and B2).** Each arm needs its own, because each reads a different text:
  - Arm 2 parses this record's own ROW GRAMMAR — the backtick-quoted `type.key|key` tokens that are
    members of the `·`-separated enumerated set — never every identifier in the span. Under a word
    scan, deleting a key-shaped word from an explanatory SENTENCE, with every recorded row untouched,
    charges the branch and refuses its land. Prose in this span may be freely edited; only removing a
    ROW un-names a key.
  - Arm 1 derives comment/docstring status from the POST-IMAGE FILE, not from the added lines. The
    three forms match just as happily inside a quoted code EXAMPLE (`# e.g. row.get("some_key")`),
    which is prose about code, not code; without the removal, a branch that added no emitter at all
    is refused. The added lines ALONE cannot decide this — a line added INSIDE a pre-existing
    docstring carries no opening delimiter, so a blob-level reading scans it as code (audit-post
    pass 3, residual B2). So each touched `bin/` file's post-image is tokenised by Python's own
    lexer, COMMENT and DOCSTRING tokens are blanked in place, and only THEN are this branch's added
    LINE NUMBERS selected. A post-image that does not tokenise charges nothing (fail-OPEN).
  Both resolve their residual ambiguity toward NOT charging, for the reason the paragraph above
  gives: at a refusing gate, a false positive is the expensive direction.

  **THE FLOOR IS NOT WEAKENED — only the numerator moves.** `SPEC0161_COVERAGE_FLOOR` is unchanged
  and the coverage DENOMINATOR stays the full corpus-wide governing set; no pair is ever dropped from
  it. A pair inherited from main is credited as not-chargeable-to-this-branch while remaining counted
  in the aggregate, and the raw corpus-wide coverage is printed beside the chargeable one on every
  run. The corpus-wide net is not removed, it MOVES to where it can be acted on: per-pair on the
  introducing branch (strictly stronger than an 80% aggregate), and the SPEC-0119 rule-28 debt echo
  still reads the RAW figure, report-only, unchanged.

  **THE ATTRIBUTION BINDS EVERY ARM OF THE CHECK, NOT ONE OF THEM.** A pair no branch diff
  introduces — a key first emitted by a kernel-path emitter such as a `land` tail, the venue runner or
  a bookkeeping write — is REPORTED as inherited from main and is NEVER charged to the branch that
  happens to be landing, in EVERY arm of `tests/test_spec0161_payload_key_refresh.py`, including the
  differential pre-refresh arm; an arm left reading the whole corpus reds every branch for a key none
  of them touched, which is the condition the attribution exists to end. Excusing an inherited pair is
  conditional on the attribution being AVAILABLE: on `attributable: False` every arm keeps the
  whole-corpus bar, per the opposite-fail-safe-directions rule below.

  **THE TWO FAIL-SAFE DIRECTIONS ARE DELIBERATELY OPPOSITE.** When the diff cannot be computed the
  attribution is UNKNOWN — a NAMED third state (`attributable: False`), never an empty `introduced`
  list. The two commit WARNs and the `land` preflight ADMIT on unknown: a guard whose whole purpose
  is to make a refusal CHEAPER must never invent one out of a fact about the checker. The two
  land-verify GATES fall back to the whole-corpus bar on unknown: a governance gate that cannot
  attribute keeps its old strictness rather than going quiet.

  **THE NAMED RESIDUE (the honest bound).** A pair that becomes govern-and-unnamed without either
  diff mentioning the key — a row appended from the main checkout with no worktree, or a key
  that becomes governing because an unrelated spec edit removed its only other corpus mention — reads
  as inherited on every branch, so no branch is failed for it. That is deliberate and is the same
  trade `graph.uncatalogued_type_findings` documents one level up (the event-TYPE sibling of
  this rule, whose incident and reasoning are identical): a gate that cannot name a responsible party
  can only punish bystanders. The residue is not dropped — the rule-28 debt echo surfaces it.

  **RETIRED by this rule (CHARTER §P1 F3):** (a) the main-side whole-corpus red that charged EVERY
  branch for a key it did not introduce; (b) the dispatch-brief line the Controller had been
  hand-adding to every worker brief («a NEW journal payload key in your diff MUST be named in the
  SPEC-0161 record in the SAME diff») — it is now the verb's own message, so it reaches every branch
  that introduces a key rather than only the briefs someone remembered to write it into.

