  \ distinguishable from one\n  that passed first time; the land-tail entry fold reads\
  \ only the scalar. Reported-only.\n- `land_audited_footprint.hand_resolved` — `bin/lib/rebaseline_currency.py`:\
  \ the\n  `merge_resolved_by_hand` rows (merge commit, resolved paths, `resolved_source`)\
  \ on this branch\n  since the audited commit, so an audited-footprint SHIFT is ATTRIBUTABLE\
  \ — deliberately never\n  EXCUSABLE (a reader that admitted a path on this key would\
  \ invert the rule). Fail-safe absent when\n  unmeasured; an absent key is never\
  \ a claimed empty set.\n- `read_gate_refused.audited_commit`, `read_gate_refused.latest_tests_passed_ts`\
