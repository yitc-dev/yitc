  \ §3) and the fleet verdict exist to remove); when the row cannot be written the\
  \ kill still happens and says so on stderr.\n- **`land_process_group_escaped`**\
  \ — `bin/lib/worktree.py` — a NON-WORKER (interactive / controller / CI / consumer)\
  \ `land` LEFT the process group of whatever launched or watches it, at land entry\
