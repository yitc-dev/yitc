  \n**Why the pairs are named LATE rather than forward, and what that cost.** Every\
  \ prior addition to\nthis record was named FORWARD — spending the refusal on the\
  \ card whose job was to spend it, before\nthe row carrying the key reached `main`.\
  \ did not, and the ordering rule above says why that\nmatters: the pair becomes\
  \ governing the moment such a row reaches `main`. The first land the queued\npre-merge\
  \ served put `queued_premerge` onto `main`'s journal at; from 10:50Z the\nland-verify\
  \ candidate leg reddened for EVERY branch, not only for the card that introduced\
  \ the key,\nbecause the gate reads the live journal while the record it checks against\
  \ is a spec-corpus text\nthat only a human edit moves. Four lands aborted and two\
  \ workers halted `blocked-on-land` before\nthis amendment. The record refreshes\
  \ on DRIFT, not on breach — the pre-refresh state sat at 97%,\ncomfortably above\
  \ the floor — so no threshold could have caught it either. The structural gap (a\n\
  key-adding card has no pre-land check that this record names its new key) is captured\
  \ as a\nfollowup rather than resolved here, deliberately: naming the pairs is what\
  \ unblocks the queue, and\na mechanism change is not a thing to design while every\
  \ land on `main` is red.\n\n**Naming a key HERE does not spec-carry it.** This paragraph\
  \ is a MEASUREMENT RECORD, not a\npayload-key catalog entry — so a re-run must EXCLUDE\
  \ it from the corpus it reads, or the measurement\nerases itself (recording 38 candidates\
  \ makes the next run see 0). The probe\n`tests/test_event_catalog_completeness.py`\
  \ does exactly that, via the one shared oracle\n`bin/lib/debt_spec0161.py#spec0161_payload_key_coverage`;\
  \ a hand re-run must too.\n\n**The counts above are load-bearing, and the WINDOW\
  \ is what makes them so.** An open-ended\n\"measured over the whole journal\" triple\
  \ cannot be equality-pinned: the journal is APPEND-ONLY, and\nthe original open-ended\
  \ reading (194/100/1762) had already moved to 194/128/2141 when re-measured\nwith\
  \ the identical method later in the same 2026-08-19 session. Pinning THAT would\
  \ be the SPEC-0046\nred-flag (e) self-invalidating temporal anchor — green now,\
  \ permanently red after the next event\nlands. Freezing the window removes the decay\
  \ instead of tolerating it: the set of events with\n`ts` at or below the cutoff\
  \ does not change as the journal grows, so the recomputation is stable and\nthe\
  \ probe asserts EXACT EQUALITY on all three counts whenever the recorded corpus\
  \ digest still matches.\n\nThe corpus is the one mutable input left (editing any\
  \ spec can move a key from absent to carried),\nso on a digest MISMATCH the probe\
  \ degrades explicitly rather than failing on unrelated spec edits:\nthe live-type\
  \ count stays an EXACT equality (it reads only the frozen event window, no corpus\
  \ at\nall) and the two corpus-dependent counts get a tight +/-10% tolerance — a\
  \ fixed band around a frozen\nmeasurement, which does NOT widen with time. That\
  \ degraded mode is a fallback, not a resting place:\nthis refresh re-records the\
  \ digest precisely so the probe is back in its EXACT mode, which the prior\nrecord\
  \ had silently left behind once later spec edits moved the corpus.\n`tests/test_event_catalog_completeness.py`\
  \ also carries\na MUTATION ARM against this triple: fixtures that delete, zero,\
  \ inflate, gut, swap or off-by-one\nthese counts must EACH fail the predicate, and\
  \ a corruption that fails to bite (because the sentence\nwas reworded out of the\
  \ probe's reach) is reported as a survivor too. Re-measuring is the way to\nupdate\
  \ this line — re-run the probe's method with a NEW cutoff and record the new triple\
  \ + digest.\n\n**These are CANDIDATES, not a promotion, and the readback test is\
  \ deliberately LENIENT** — it matches\na key literal anywhere in `bin/`, so a name\
  \ that collides with an unrelated dict key reads as governing.\nPromoting a key\
  \ into spec text is a separate change with its own gate; what this run OWES, and\n\
  delivers, is the measurement and its named candidate set. A key here is promoted\
  \ when a reader is\nconfirmed to branch on THAT event's `data`.\n\n### Who is charged\
  \ for an unnamed payload key (2026-09-07)\n\n**The rule: a governing (event, payload-key)\
  \ pair is named in the record above BY THE BRANCH THAT\nINTRODUCES IT, in the SAME\
  \ diff.** Not by whoever happens to land next.\n\nTHE DEFECT THIS CLOSES, measured\
  \ in this repo's own journal on 2026-09-07. The measurement above\nreads a SHARED,\
  \ GROWING input — the journal's live (type, key) census — against a record that\
  \ moves\nonly by a human edit. The CONDITION it detects is therefore repo-wide while\
  \ the REFUSAL it issues is\nper-branch, and the two do not line up. `queued_premerge`\
  \ reached main's journal at 10:45Z;\nfrom 10:50Z every land's candidate leg reddened\
  \ on `tests/test_spec0161_payload_key_refresh.py` —\n7 aborted lands, 4 workers\
  \ halted `blocked-on-land`, ~70 minutes on `queued_premerge` — none of which\nhad\
  \ touched that emitter, until a human named the pairs at 12:01Z. Then introduced\n\
  `measurement_recorded.test_files` and reddened its OWN land 3x the same way: the\
  \ branch that WAS\nanswerable learned it minutes in and past the venue slot, from\
  \ a whole-suite verify, when a\n`git diff` at the door knew it for free. Both faces\
  \ are one defect — the failure is not ATTRIBUTED.\n\n**WHERE IT IS ENFORCED — four\
  \ readers, ONE predicate.** `bin/lib/debt_spec0161.py#spec0161_branch_unnamed`\n\
  is the ONE entry point (the existing `spec0161_payload_key_coverage` oracle plus\
  \ a pure attribution\nsplit — no second oracle, per the one-oracle discipline):\n\
  1. **`task commit` / `work commit` — a WARN** naming the introduced-but-unnamed\
  \ pairs. Report-only,\n   stderr, exit code untouched. Stage 7 is where the diff\
  \ exists, nothing is spent, and the fix is\n   one `spec edit` in the same commit.\n\
  2. **that branch's `land` — a REFUSAL**, on the cheap P0 preflight beside the /\
  \ /\n    arms: after `main_wt` resolves and BEFORE the land reservation, the SPEC-0132\n\
  \   verify-admission slot, the merge from main and the suite. Seconds, not minutes.\
  \ It reuses the\n   existing `abort_detail={\"preflight\": True}` row shape, so\
  \ it is exempt from the\n   repeated-abort streak exactly as its siblings are.\n\
  3. **the two live-corpus land-verify gates** (`tests/test_spec0161_payload_key_refresh.py`\
  \ and the\n   coverage-floor arm of `tests/test_event_catalog_completeness.py`)\
  \ charge THIS branch only for\n   pairs it introduced. Inherited pairs are REPORTED\
  \ and do not fail a bystander.\nAll three paste ONE text, and that text NAMES THE\
  \ CHARGING SITE — `<path>:<line>` of an added\nstructural occurrence, per charged\
  \ key. A charge the charged party cannot check is a\ncharge they must re-derive\
  \ the structural scan by hand to locate, at a gate that fires seconds\nbefore a\
  \ venue slot; the site is carried out of the same materialiser pass that computes\
  \ the\ncharge, so the message and the verdict cannot name different places. A pair\
  \ charged by count 2\n(un-naming) has no code site and is listed bare — correctly:\
  \ its charge is in the record, not in\nthe diff.\n\n**WHAT ATTRIBUTION MEANS, exactly\
  \ — and it is STRUCTURAL, never a mention.** A branch is answerable\nfor a key on\
  \ either of two counts:\n1. **it ADDS the key TO CODE** — the key appears on a line\
  \ the branch adds under `bin/`, in a\n   position that actually makes it a payload\
  \ key: `.get(\"k\")` or `[\"k\"]` (VERBATIM the two regexes\n   the oracle derives\
  \ its own `readback` conjunct from — the same expressions, not lookalikes) or\n\
  \   `\"k\":` (the key as a payload-dict KEY LITERAL, needed because a branch may\
  \ add the emitting dict\n   while the readback already existed on main). Every form\
  \ requires the key QUOTED. **AND no\n   structural occurrence of that key existed\
  \ under `bin/` AT THE MERGE-BASE.** Adding an\n   occurrence is not the same fact\
  \ as INTRODUCING the key: a branch that adds a SECOND readback of\n   a key main\
  \ already reads back made nothing govern that did not govern before, so charging\
  \ it\n   re-reads a key that governed before the branch existed. Measured — <project>\
  \ X-1343 / ``:\n   its land was refused for `spike_channel_grant.compose_project`\
  \ because it added\n   `meta.get(\"compose_project\")` in `bin/tests/spike_live_support.py`,\
  \ while `bin/spike-lib.sh:46`\n   had carried `m.get(\"compose_project\")` at the\
  \ merge-base all along. The base side is a\n   BASELINE-vs-CURRENT comparison of\
  \ the same shape count 2 already has, and it is affordable for\n   the same reason:\
  \ it is TARGETED. Only the FEW keys this branch added can change an answer, so\n\
  \   one `git grep -l -F` over `<base>:bin` restricted to those literals yields a\
  \ handful of\n   CANDIDATE files, and each candidate is read at the base rev and\
  \ judged by the SAME structural\n   matcher the branch side is judged by — the grep\
  \ is a FILE FILTER, never the verdict, so a\n   comment or a quoted example at the\
  \ base can no more exempt a branch than it can charge one. The\n   earlier concession\
  \ that this arm could not afford the family's baseline shape priced the WRONG\n\
  \   question (the whole `bin/` tree plus the re-folded journal at base) and is retired.\
  \ **`git grep`\n   exit status 1 is \"no match\", an ANSWER — the common case, and\
  \ the key stays charged;** only a\n   genuine git fault is unknowable (None), because\
  \ reading a fault as \"nothing pre-existed\" would\n   restore the over-charge at\
  \ a refusing gate, and reading rc 1 as a fault would make every\n   genuinely-new\
  \ key unattributable, i.e. disable this gate rather than narrow it.\n2. **it UN-NAMES\
  \ the key** — the key was in this record's span at the merge-base and is not in\
  \ it\n   now. That arm is a BASELINE comparison (`git show <base>:<spec>` versus\
  \ the span on disk), which\n   is the diff-aware family's own shape and is affordable\
  \ here because the input is one small file\n   at one rev.\n\n**NEITHER ARM IS A\
  \ WORD SCAN, and that is load-bearing.** A bare mention — in a comment, a\ndocstring,\
  \ a refusal message, a test name, or an unrelated `specs/` deletion that happens\
  \ to\ncontain the literal — must NOT charge a branch, because a false positive at\
  \ a REFUSING gate is the\nmost expensive kind of wrong. Attribution is BY KEY, not\
  \ by (type, key): the record names keys, and\nrequiring the type in the diff too\
  \ would let a branch add a new key to an existing type and be\ncharged nothing.\n\
  \n**WHAT MAKES \"NEVER A MENTION\" TRUE IS TWO CONCRETE MECHANISMS, named here because\
  \ the claim above\nis only as good as them — and BOTH were missing on the first\
  \ pass (audit-post pass 2, findings B1\nand B2).** Each arm needs its own, because\
  \ each reads a different text:\n- Arm 2 parses this record's own ROW GRAMMAR — the\
  \ backtick-quoted `type.key|key` tokens that are\n  members of the `·`-separated\
  \ enumerated set — never every identifier in the span. Under a word\n  scan, deleting\
  \ a key-shaped word from an explanatory SENTENCE, with every recorded row untouched,\n\
  \  charges the branch and refuses its land. Prose in this span may be freely edited;\
  \ only removing a\n  ROW un-names a key.\n- Arm 1 derives comment/docstring status\
  \ from the POST-IMAGE FILE, not from the added lines. The\n  three forms match just\
  \ as happily inside a quoted code EXAMPLE (`# e.g. row.get(\"some_key\")`),\n  which\
  \ is prose about code, not code; without the removal, a branch that added no emitter\
  \ at all\n  is refused. The added lines ALONE cannot decide this — a line added\
  \ INSIDE a pre-existing\n  docstring carries no opening delimiter, so a blob-level\
  \ reading scans it as code (audit-post\n  pass 3, residual B2). So each touched\
  \ `bin/` file's post-image is tokenised by Python's own\n  lexer, COMMENT and DOCSTRING\
  \ tokens are blanked in place, and only THEN are this branch's added\n  LINE NUMBERS\
  \ selected. A post-image that does not tokenise charges nothing (fail-OPEN).\nBoth\
  \ resolve their residual ambiguity toward NOT charging, for the reason the paragraph\
  \ above\ngives: at a refusing gate, a false positive is the expensive direction.\n\
  \n**THE FLOOR IS NOT WEAKENED — only the numerator moves.** `SPEC0161_COVERAGE_FLOOR`\
  \ is unchanged\nand the coverage DENOMINATOR stays the full corpus-wide governing\
  \ set; no pair is ever dropped from\nit. A pair inherited from main is credited\
  \ as not-chargeable-to-this-branch while remaining counted\nin the aggregate, and\
  \ the raw corpus-wide coverage is printed beside the chargeable one on every\nrun.\
  \ The corpus-wide net is not removed, it MOVES to where it can be acted on: per-pair\
  \ on the\nintroducing branch (strictly stronger than an 80% aggregate), and the\
  \ SPEC-0119 rule-28 debt echo\nstill reads the RAW figure, report-only, unchanged.\n\
  \n**THE ATTRIBUTION BINDS EVERY ARM OF THE CHECK, NOT ONE OF THEM.** A pair no branch\
  \ diff\nintroduces — a key first emitted by a kernel-path emitter such as a `land`\
  \ tail, the venue runner or\na bookkeeping write — is REPORTED as inherited from\
  \ main and is NEVER charged to the branch that\nhappens to be landing, in EVERY\
  \ arm of `tests/test_spec0161_payload_key_refresh.py`, including the\ndifferential\
  \ pre-refresh arm; an arm left reading the whole corpus reds every branch for a\
  \ key none\nof them touched, which is the condition the attribution exists to end.\
  \ Excusing an inherited pair is\nconditional on the attribution being AVAILABLE:\
  \ on `attributable: False` every arm keeps the\nwhole-corpus bar, per the opposite-fail-safe-directions\
  \ rule below.\n\n**THE TWO FAIL-SAFE DIRECTIONS ARE DELIBERATELY OPPOSITE.** When\
  \ the diff cannot be computed the\nattribution is UNKNOWN — a NAMED third state\
  \ (`attributable: False`), never an empty `introduced`\nlist. The two commit WARNs\
  \ and the `land` preflight ADMIT on unknown: a guard whose whole purpose\nis to\
  \ make a refusal CHEAPER must never invent one out of a fact about the checker.\
  \ The two\nland-verify GATES fall back to the whole-corpus bar on unknown: a governance\
  \ gate that cannot\nattribute keeps its old strictness rather than going quiet.\n\
  \n**THE NAMED RESIDUE (the honest bound).** A pair that becomes govern-and-unnamed\
  \ without either\ndiff mentioning the key — a row appended from the main checkout\
  \ with no worktree, or a key\nthat becomes governing because an unrelated spec edit\
  \ removed its only other corpus mention — reads\nas inherited on every branch, so\
  \ no branch is failed for it. That is deliberate and is the same\ntrade `graph.uncatalogued_type_findings`\
  \ documents one level up (the event-TYPE sibling of\nthis rule, whose incident and\
  \ reasoning are identical): a gate that cannot name a responsible party\ncan only\
  \ punish bystanders. The residue is not dropped — the rule-28 debt echo surfaces\
  \ it.\n\n**RETIRED by this rule (CHARTER §P1 F3):** (a) the main-side whole-corpus\
  \ red that charged EVERY\nbranch for a key it did not introduce; (b) the dispatch-brief\
  \ line the Controller had been\nhand-adding to every worker brief («a NEW journal\
  \ payload key in your diff MUST be named in the\nSPEC-0161 record in the SAME diff»)\
  \ — it is now the verb's own message, so it reaches every branch\nthat introduces\
  \ a key rather than only the briefs someone remembered to write it into.\n\n**THE\
  \ NINE pairs the record left unnamed, each given its disposition here (Controller\
  \ refresh,\n2026-09-17, work batch `spec0161-name-nine-unnamed-pairs-2026-09-17`;\
  \ the immediate unblock exit (b)\n names — the structural fix, attributing the floor\
  \ arm by branch, stays own).**\nMEASURED, not judged: the oracle (`bin/lib/debt_spec0161.py#spec0161_payload_key_coverage`)\
  \ run on\n`task/` at commit 352c473430 reads **85 governing pairs, 76 named, 9 unnamed\
  \ — 89%** against\nthe 0.80 floor; `main` reads 84 (the 85th, `measurement_recorded.all_in_wall_s`,\
  \ arrives with any\nbranch that carries a routed venue-measurement row). That one\
  \ pair reconstructs the pre-refresh state\nof every such branch at exactly 68/85\
  \ = 0.80 on a strict `>` floor arm, which is why `task/`\nand `task/` both redded\
  \ on `tests/test_spec0161_payload_key_refresh.py` for a corpus-wide\ndrift neither\
  \ branch decided (deviation `spec0161-test-floor-arm-whole-corpus-reds-every-branch-at-\n\
  exact-floor`, events.jsonl#ts=). Naming all nine lifts the record to 85/85 on\n\
  that branch shape and 84/84 on `main`. Every one carries CANDIDATE standing — read\
  \ the emitter for\nthe authoritative key set:\n`bg_dispatch_halted.audited_commit`\
  \ · `land_audited_footprint.hand_resolved` ·\n`measurement_recorded.all_in_wall_s|isolated_attempts`\
  \ ·\n`read_gate_refused.audited_commit|intervening_commit|latest_tests_passed_ts|named_revision`\
  \ ·\n`task_amended.audited_commit`\n- `measurement_recorded.all_in_wall_s` — `bin/lib/remote_verify.py`:\
  \ the routed venue pass's\n  whole-request wall seconds (`round(time.monotonic -\
  \ started, 1)`, written onto EVERY routed\n  result, fault path included) and copied\
  \ onto the journal row by `remote_verify_row`\n  (`result.get(\"all_in_wall_s\"\
  )`) — that read-back is what makes the pair governing. The same key\n  rides the\
  \ / venue-isolated classification rows. Reported, never branched on.\n- `measurement_recorded.isolated_attempts`\
  \ — `bin/lib/verify_runner.py`: the per-attempt verdict\n  list (`[\"fail\", \"\
  pass\"]` at most — two calls, not a loop) recorded BESIDE the scalar `isolated`\
