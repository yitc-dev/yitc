  \ and rides `task_id`. Emitted ONLY when the mark DECIDED the handover — a mark\
  \ that exists and changed nothing emits nothing — which is what makes the row a\
  \ reading of real reorderings rather than a count of marks in the corpus, and what\
  \ lets overuse be seen on the `debt` view without anyone running an audit (safeguard\
  \ c).\n- **`land_synchronous_guard_refused`** — `bin/lib/worktree.py` — a dispatched\
  \ worker's backgrounded `land` refused (the synchronous-to-LAND guard).\n- **`land_worker_liveness_lost`**\
  \ — `bin/lib/worktree.py` — (SPEC-0180 rule 3 names THIS spec as the type's catalog\
  \ home — corrected from the pre-split \"SPEC-0025\" address by before that spec\
  \ activated; parent SPEC-0025 §Event-type catalog extension is the pointer stub,\
  \ and the three sibling land-guard types below live here too) — an ADMITTED detached\
  \ worker land was TERMINATED MID-FLIGHT because the worker process holding its turn\
