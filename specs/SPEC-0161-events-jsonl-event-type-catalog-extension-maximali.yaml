  \ being governing.\n\n**Named by the 2026-09-20 branch `task/` (X-1504) — three\
  \ pairs this branch INTRODUCES**, on\nthe same kept-NAMED terms as the blocks above:\n\
  `bg_dispatch_halted.refused_class|holder_session_ref|holder_worktree`\n- `bg_dispatch_halted.refused_class`\
  \ — `bin/lib/task.py#cmd_task_refuse` : the sub-reason\n  discriminator on a `kind:\
  \ refused` halt, whose only value is\n  `journal.REFUSED_CLASS_CLAIM_LOST` (`claim-lost-to-live-peer`).\
  \ This one IS branched on, not\n  merely reported: `journal._terminal_detail` reads\
  \ it to mint `refused(claim-lost)` instead of\n  `refused(pre-claim)`, and `debt_adoption._is_pre_claim_refusal`\
