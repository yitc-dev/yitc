  \ rule 4). Carries `request` / `leg` / `live` / `cap` / `waited_s` / `branch` /\
  \ `box`. It is a THIRD queue and reports as itself: it is deliberately NOT a member\
  \ of `journal.LAND_QUEUE_WAIT_TYPES`, because that tuple is the one source through\
  \ which two independent readers — the SPEC-0132 admission lens and SPEC-0119 rule\
  \ 27's abort phase-split — resolve the LOCAL per-repo wait series, and joining it\
  \ would silently re-attribute box waits into local admission statistics (the exact\
  \ conflation homed that tuple to prevent). The row is emitted LOCALLY, by the land,\
  \ off a throttled line the leg prints on stderr while it waits — the box cannot\
  \ write this journal, and the module that runs the pass writes no journal of its\
  \ own (CHARTER §P5), so the relay is injected at the land call site that already\
  \ owns the row.\n- **`land_retry_started`** — `bin/lib/worktree.py` — emitted AT\
