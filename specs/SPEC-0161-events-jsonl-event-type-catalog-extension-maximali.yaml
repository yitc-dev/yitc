  \ is meaningful, not missing data. `mechanism` is REPORTED rather than asserted\
  \ — the escape is a hardening and fails SOFT, so `unavailable` is a real value and\
  \ never an error.\n- **`watch_process_group_escaped`** — `bin/lib/dispatch.py` —\
  \ a `dispatch --watch` LEFT the process group of the shell that launched it, at\
  \ watch entry and BEFORE the poll loop blocks; carries `mechanism` (`setsid` | `setpgrp`\
  \ | `already-leader` | `opted-out` | `unavailable`) / `pid` / `watched_tasks` /\
  \ `watch_fleet` / `reason`. The WATCHER sibling of `land_process_group_escaped`\
