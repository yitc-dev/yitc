body: "## Scenario\n\nOne SPEC-0025 event-schema section, re-homed VERBATIM: **§Event-type\
  \ catalog extension ** —\nthe maximalist-capture event types (the fundamental-gap\
  \ events, the general maximalist-capture events,\nthe retired stage entry/exit timing\
  \ events, the LIVE `stage_entered` content-delivery event,\n`check_admission_demonstrated`,\
  \ `spec_activated`, `test_class_executed`, and the followup-capture\nevents). NOTHING\
  \ is moved beyond that one SPEC-0025 section. SPLIT VERBATIM under the SPEC-0120\n\
  one-bounded-read ceiling; the parent SPEC-0025 keeps the universal schema, the required\
  \ event\ntypes, and the normalized provider×model×effort vocabulary, and points\
  \ here for this section. A moved\nevent that references «§Normalized provider×model×effort\
  \ vocabulary» (e.g. `task_paused` `wait_reason`)\nstill points at that vocabulary\
  \ in the parent SPEC-0025 — the reference is preserved verbatim.\n\n## Internal\n\
  \n### Event-type catalog extension\nExtension of `events.jsonl` event types for\
  \ maximalist data capture ( query layer). All added\ntypes are payload variations,\
  \ not a new mechanism. **Compatibility rule (per F5 audit absorption):** the\nevent-types\
  \ catalog is **append-only**; consumers MUST ignore unknown event types gracefully\
  \ (parse as\nan opaque `{ts, type, data}` triple, not fail). A closed enum is NOT\
  \ assumed; future additions don't\nbreak existing consumers. When typed validation\
  \ is needed (e.g. a specific query), a consumer declares a\nversioned schema reference\
  \ per event type — opt-in, not required by default.\n\n#### Fundamental-gap-related\
  \ events\n**`dissonance_detected`** (per CHARTER §Principle 7) — retained legacy/manual\
  \ pointer, **subsumed by\n`deviation_captured`** (: `kind: defect`, `relates_to:\
  \ #7`); manual-emit-optional.\nFull prior schema in / git history. Still the named\
  \ event when a P7 artifact contradiction is\nrecorded.\n\n**`consumer_read_evidence`**\
  \ (per CHARTER §Principle 8 adoption strength):\n```jsonc\n{\"ts\": \"...\", \"\
  type\": \"consumer_read_evidence\", \"task_id\": \"T-XXXX\",\n \"data\": {\"target\"\
  : \"specs/<workshop-spec>.yaml\", \"consumer\": \"bin/yitc-v2 graph build\",\n \
  \         \"verified_by\": \"event_emit|state_check|live_invocation\"}}\n```\n\n\
  **`live_trigger_evidence`** (per CHARTER §Principle 8 adoption strength):\n```jsonc\n\
  {\"ts\": \"...\", \"type\": \"live_trigger_evidence\", \"task_id\": \"T-XXXX\",\n\
  \ \"data\": {\"mechanism\": \"<hook|cron|cli|api>\", \"trigger_event\": \"<ts>\"\
  ,\n          \"outcome\": \"fired_as_expected|deviated|failed\"}}\n```\n\n**`task_paused`**\
  \ (per Resume contract — LIFECYCLE):\n```jsonc\n{\"ts\": \"...\", \"type\": \"task_paused\"\
  , \"task_id\": \"T-XXXX\",\n \"data\": {\"current_stage\": 5, \"resume_from\": \"\
  <step>\", \"last_verified\": \"<artifact>\",\n          \"next_action\": \"<one-line>\"\
  , \"paused_reason\": \"owner-wait|auditor-abort|session-end\"}}\n```\nMAY additionally\
  \ carry the OPTIONAL normalized `wait_reason` (per SPEC-0135 §5 — the shared pause/block\n\
  reason vocabulary defined at §Normalized provider×model×effort vocabulary), ALONGSIDE\
  \ the free\n`paused_reason` detail string; additive / P5-safe.\n\n**`task_resumed`**:\n\
  ```jsonc\n{\"ts\": \"...\", \"type\": \"task_resumed\", \"task_id\": \"T-XXXX\"\
  ,\n \"data\": {\"prior_pause_event\": \"<ts of task_paused>\", \"verification_passed\"\
  : true|false,\n          \"diff_from_pause\": \"none|<description>\"}}\n```\n\n\
  #### General maximalist capture events\n**Retired manual-emit.** `owner_directive`,\
  \ `ai_reasoning_note`, `failed_attempt` (plus\n`dissonance_detected` above) are\
  \ no longer obligated for manual emission — the provider session log\ncaptures them\
  \ durably. Schemas kept for reference + optional use; historical entries preserved.\
  \ Cite the\nsession log for chat-derived rationale instead.\n\n**`owner_directive`**\
  \ — chat directives durable-captured (ephemeral chat → event):\n```jsonc\n{\"ts\"\
  : \"...\", \"type\": \"owner_directive\", \"task_id\": \"T-XXXX\",\n \"data\": {\"\
  directive\": \"<verbatim or summary>\", \"classification\": \"approval|stop|redirect|question\"\
  ,\n          \"captured_durable_as\": \"decisions/D-XXXX OR n/a\",\n          \"\
  arrival\": \"<OPTIONAL — `mid_turn` when the answer ARRIVED mid-turn; ABSENT on\
  \ a turn-opening one>\"}}\n```\n**`arrival: mid_turn` — the mid-turn ARRIVAL MARKER\
  \ (X-1465).** A mid-turn owner answer has\nalways been materialized with its OWN\
  \ utterance ts; what the record could not say is that it arrived\nMID-TURN — and\
  \ that is exactly what distinguishes a row which AUTHORISES work already in flight\
  \ from\none which merely PRECEDES it. Without it a Controller under pressure can\
  \ cite SOME earlier owner row\nand nothing in the mechanism tells the two apart\
  \ (the X-1465 shape). Derived at materialization from\nthe provider's own marker\
  \ by `bin/lib/journal.py#_journal_sync`, never caller-supplied.\n`arrival` is the\
  \ EXISTING chat-channel key (values `auto` / `commanded`), EXTENDED here rather\n\
  than duplicated. **ADDITIVE-OPTIONAL and ASYMMETRIC BY DESIGN:** a turn-opening\
  \ entry carries NO\n`arrival` key at all (never `false`, never a second value),\
  \ so presence alone is the signal and old\nrows are not back-filled. Greppable via\
  \ `journal query --grep`.\n\n**`ai_reasoning_note`** / **`failed_attempt`** — retained\
  \ legacy/manual pointers, **subsumed by\n`deviation_captured`** (— a reasoning note\
  \ rides as `kind: improvement`; a failed attempt\nas `kind: friction`/`defect`);\
  \ manual-emit-optional. Full prior schemas in / git history.\n\n#### Stage entry/exit\
  \ events (timing analytics — Day 5+ query layer)\n**Manual hand-emit RETIRED (retired-by-).**\
  \ The MANUAL hand-emit obligation for `stage_entry`,\n`stage_exit`, and `task_picked`\
  \ is retired — do NOT hand-emit them. The obligation lapsed ( F4:\n142 broken stage_entry/exit\
  \ pairs + 168 manual task_picked). retired the **manual** emit ONLY; a\n**deterministic\
  \ CLI auto-emit is the sanctioned replacement**. The three types split into two\
  \ cases:\n  - **`stage_entry` / `stage_exit`** — NO callsite; genuinely not emitted.\
  \ Recoverable from the\n    deterministic auto-emit chain (audit_pre_completed →\
  \ commit_landed → audit_post_completed →\n    task_closed) + git log. Schemas below\
  \ are kept as historical reference (append-only). If\n    stage-timing / pickup-latency\
  \ analytics are ever needed, auto-emit via a future deterministic CLI\n    command\
  \ ( rejected_ideas) — never re-impose the manual obligation.\n  - **`task_picked`**\
  \ — IS auto-emitted, deterministically, by the claim path `_claim_task` — the claim\n\
  \    that `worktree new --task` performs. This IS the -sanctioned deterministic\
  \ CLI\n    auto-emit, NOT the retired manual emit — so it is a **live event, not\
  \ historical**; only the\n    hand-emit obligation was retired. (`task pick` is\
  \ a read-only inspector and does NOT emit it;\n    QUEUE.md §Picker logic describes\
  \ the same claim-path emit — doc and code agree.)\n\n**`stage_entry`** / **`stage_exit`**\
  \ (historical schema — retired-by-, do not hand-emit):\n```jsonc\n{\"ts\": \"...\"\
  , \"type\": \"stage_entry\", \"task_id\": \"T-XXXX\",\n \"data\": {\"stage\": 5,\
  \ \"stage_name\": \"Execution\", \"entered_from_stage\": 4}}\n{\"ts\": \"...\",\
  \ \"type\": \"stage_exit\", \"task_id\": \"T-XXXX\",\n \"data\": {\"stage\": 5,\
  \ \"stage_name\": \"Execution\", \"outcome\": \"complete|paused|aborted\",\n   \
  \       \"duration_seconds\": 1234}}\n```\n\n#### Stage-declaration content-delivery\
  \ event (per the stage-declaration plan, AU-2)\n**`stage_entered`** — a **LIVE,\
  \ first-class** event (NOT the retired timing `stage_entry`/`stage_exit`\nabove).\
  \ DISTINCT concern: `stage_entry`/`stage_exit` were *timing analytics* (duration,\
  \ entered-from)\nand are retired; `stage_entered` records the **content bundle that\
  \ stage-entry DELIVERED** — the\ndeclared lifecycle `stage` (reusing `current_stage`)\
  \ plus the specs + work-verbs the\nbinding-derived delivery lens routed to that\
  \ stage (plan §2–§3). It is the journal trace that a stage\nwas declared and its\
  \ reads delivered. The PRODUCTION emitter is the `stage <NAME>` verb, which ships\
  \ in\n**AU-3** (the core cutover, which `requires:` this task); this task (AU-2)\
  \ only registers the contract +\nconfirms journal-query discoverability. Until AU-3,\
  \ it is emittable via the generic `event` verb.\n```jsonc\n{\"ts\": \"...\", \"\
  type\": \"stage_entered\", \"task_id\": \"T-XXXX\",\n \"data\": {\"stage\": \"Commit\"\
  , \"delivered\": [\"SPEC-0014\"], \"delivered_verbs\": [\"task commit\"]}}\n```\n\
  - `stage` — the declared lifecycle stage NAME (the `current_stage` semantic value;\n\
  \  e.g. `Analysis | Plan | Audit-pre | Execution | Tests | Commit | Audit-post |\
  \ Closure`).\n- `task_id` — the task whose stage was entered (top-level envelope\
  \ field, as for other task events).\n- `delivered` — the spec IDs routed to this\
  \ stage by the binding-derived lens (the reads to fetch via\n  `graph query`); MAY\
  \ be `[]` for a stage with no bound specs.\n- `delivered_verbs` — the work-verb\
  \ name(s) the stage bundle names for that stage; MAY be `[]`.\n- `ctx_pct` — OPTIONAL\
  \ raw observation-loop field (per SPEC-0135 §3): the context-fullness percent\n\
  \  (0–100 int, the `session context` gauge, SPEC-0115) at stage entry, so the loop\
  \ can see where in a\n  task's arc context pressure builds. OMITTED when unmeasured\
  \ ( no-fabricated-0s); a raw fact\n  only — no derived score. Additive / P5-safe.\n\
  - `ctx_no_data` — OPTIONAL sibling of `ctx_pct`, present EXACTLY when it is absent\
  \ (X-0588): the machine-readable REASON the gauge had no percent — `model-unmapped`\
  \ (the session's\n  model is absent from the `context_window` map) / `config-unread`\
  \ / `no-completed-turn`. A bare\n  omission was itself the silence the loud-failure\
  \ doctrine forbids: a reader could not tell an\n  unmeasured session from any other\
  \ absence, so a session whose threshold had gone dark read like\n  one comfortably\
  \ below the bound. Still NO fabricated number — the percent stays absent (SPEC-0115\n\
  \  §5 \"never guessed\"); only the cause is added. Never emitted alongside `ctx_pct`.\
  \ Additive /\n  P5-safe.\n\nAppend-only + P5-safe : additive — no existing event\
  \ type is changed or removed, and\nconsumers that don't know `stage_entered` parse\
  \ it as an opaque `{ts,type,data}` triple. It needs **no\nper-type recognition branch**\
  \ in `journal query`: `cmd_journal_query` + `_event_summary` are\ntype-agnostic,\
  \ so `journal query --type stage_entered` (and `--grep` / the bare `grep events.jsonl`\n\
  fallback) surface it through the existing generic path — discoverability is a property\
  \ of that path,\nnot new code (anti-complexity F1/F2: extend the existing query\
  \ path, no parallel one).\n\n#### Check-admission demonstration event (per SPEC-0156)\n\
  **`check_admission_demonstrated`** — the recorded FAILING DEMONSTRATION that admits\
  \ a kernel-graded\ncheck (SPEC-0156 §2). The kernel GRADES a project's declared\
  \ checks — a `live_probe` (SPEC-0094), a\nsecurity probe (SPEC-0098), a per-class\
  \ deploy evidence command (SPEC-0097), a `yitc-ops.yaml tests:`\nclass, a `verify.layers[].covers`\
  \ claim — and this event is the durable answer to the differential\nquestion the\
  \ kernel already asks of task ACs (SPEC-0060 §4 / X-0246) but never asked of what\
  \ it grades\nitself: **\"would this check still pass if the thing under test were\
  \ BROKEN?\"** One journaled RED run\nagainst a NAMED deliberately-broken input,\
  \ captured once at the declaration seam.\n```jsonc\n{\"ts\": \"...\", \"type\":\
  \ \"check_admission_demonstrated\", \"task_id\": \"T-XXXX\",\n \"data\": {\"check\"\
  : \"security.probes[auth-required]\",\n          \"declaration\": \"yitc-ops.yaml#security.probes[auth-required]\"\
  ,\n          \"broken_input\": \"<the named deliberately-broken input>\", \"outcome\"\
  : \"red\",\n          \"definition_identity\": \"<16-hex of the check declaration\
  \ subtree at demonstration time>\"}}\n```\n- `check` — WHICH declared check (surface\
  \ + name), as the carrier names it.\n- `declaration` — the carrier locator (`yitc-ops.yaml#<section>.<key>`)\
  \ the check is declared at.\n- `broken_input` — the deliberately-broken input the\
  \ check was shown RED against. Naming it is what\n  makes the demonstration auditable\
  \ rather than a claim. **REQUIRED to admit the check** (\n  audit-post finding 1):\
  \ a RED that names no broken input records a verdict with no evidence — nothing\n\
  \  anyone could re-run — and admitting a check on that would be the very false-green\
  \ this contract exists\n  to end. `check`, `declaration`, `broken_input`, a RED\
  \ `outcome` and `definition_identity` must ALL be\n  present and non-empty for a\
  \ record to admit a check; an incomplete record simply does not clear it, so\n \
  \ the check stays visible as UNPROVEN debt (the conservative direction — under-evidenced\
  \ ⇒ still owed).\n- `outcome` — **must be `red` to admit the check.** A green (or\
  \ absent, or misspelt) outcome\n  demonstrates NOTHING and admits nothing: a check\
  \ nobody has seen FAIL is not evidence.\n- `definition_identity` — a content hash\
  \ of the check's own declaration subtree AT demonstration time\n  (`debt._definition_identity`).\
  \ It is what makes \"the demonstration is re-owed only when the check's\n  COMMAND/DEFINITION\
  \ changes\" true by CONSTRUCTION: a REWIRE changes the subtree, so the identity\n\
  \  changes, so this record stops matching and the question re-opens; a RE-RUN of\
  \ the same check changes\n  nothing and owes nothing. No stored state is needed\
  \ for either half.\n- It rides the EXISTING generic `event` verb (`bin/yitc-v2 event\
  \ check_admission_demonstrated --data`)\n  — SPEC-0156 §2 admits **no new verb,\
  \ no new emitter, no new store, and no event family** (CHARTER §P5,\n  one journal).\
  \ The consumer is the DERIVED debt view `debt.unproven_checks`, which folds carrier\
  \ +\n  journal at read time and surfaces every declared check with no matching RED\
  \ demonstration as UNPROVEN\n  (report-only, never a gate — SPEC-0156 §3).\n- Append-only\
  \ + P5-safe : additive — no existing event type changes, and a consumer that does\n\
  \  not know this type parses it as the opaque `{ts,type,data}` triple.\n\n#### Spec-activation\
  \ event (per GRAPH §Spec lifecycle)\n**`spec_activated`** — the recorded `proposed\
  \ → active` flip, appended by the SOLE activation writer\n(`bin/lib/task.py#_activate_task_proposed_specs`,\
  \ reached from `task close`) once per activated spec,\nAFTER the durable status\
  \ write it attests. Activation is a governed write with real consequences —\n`active`\
  \ is the ONLY normative status (GRAPH §What a spec is FOR) and the flip atomically\
  \ supersedes\nthe target lineage — yet it was SILENT until (X-0411 / <project> :\
  \ no activat*\nevent existed in any journal, while `bin/lib/views.py` already NAMED\
  \ `spec_activated` as a SUBSTANTIVE\ntype nothing emitted). Without it the GRAPH\
  \ drift-#10 check (an active spec with no activating carrier)\nhas no evidence surface,\
  \ and a work-first spec-activating task cannot satisfy P8 from its own activation.\n\
  ```jsonc\n{\"ts\": \"...\", \"type\": \"spec_activated\", \"task_id\": \"T-XXXX\"\
  ,\n \"data\": {\"spec_id\": \"SPEC-XXXX\", \"supersedes\": \"SPEC-YYYY\", \"supersedes_status\"\
  : \"superseded\"}}\n```\n- `task_id` — the ACTIVATING task (the closing task that\
  \ owns the spec per SPEC-0005 §5 — work-first\n  `proposed_by == tid` or an explicit\
  \ `activation_owner_task == tid`). The envelope slot: this event's\n  subject IS\
  \ that task.\n- `spec_id` — the spec that reached `active`. One event per activated\
  \ spec (a close may activate several).\n- `supersedes` / `supersedes_status` — present\
  \ ONLY when the activation flipped a target, reporting the\n  flip that ACTUALLY\
  \ happened: `superseded` (the target was active) or `withdrawn` (still proposed),\n\
  \   one-active-lineage. Absent when the spec supersedes nothing.\n- Emitted from\
  \ the ONE write, so both call paths are covered: the normal `cmd_task_close` AND\
  \ the\n  `_recover_close_tail` crash-heal re-run. IDEMPOTENT by construction — the\
  \ writer's `status == proposed`\n  filter skips an already-active spec, so the heal\
  \ re-run re-emits nothing.\n- Append-only + P5-safe : additive — no existing event\
  \ type changes, and a consumer that does\n  not know this type parses it as the\
  \ opaque `{ts,type,data}` triple.\n\n#### Test-class execution event (per SPEC-0152\
  \ rule 24)\n**`test_class_executed`** — the recorded LAST SUCCESSFUL EXECUTION of\
  \ a declared test class (SPEC-0152\nrule 24). SPEC-0156 asks \"would this check\
  \ go RED if broken?\"; this answers the sibling question \"has this\nclass ever\
  \ actually RUN green?\". <project>'s e2e class was DECLARED but its browsers were\
  \ never installed —\nnothing ran, nothing failed, and a class that never executed\
  \ read as coverage (X-0375). This event is the\ndurable proof a declared class actually\
  \ ran, recorded by whoever RAN it.\n```jsonc\n{\"ts\": \"...\", \"type\": \"test_class_executed\"\
  , \"task_id\": \"T-XXXX\",\n \"data\": {\"class\": \"live-app-e2e\", \"outcome\"\
  : \"pass\",\n          \"evidence\": \"<what run — a CI url / a log ref / a harness\
  \ id>\"}}\n```\n- `class` — WHICH declared `tests.classes[]` class ran, as the carrier\
  \ names it.\n- `outcome` — **must be `pass` to record a successful run.** A non-pass\
  \ (or absent, or misspelt) outcome\n  records no successful run and clears nothing.\n\
  - `evidence` — what run this attests to (a CI url / a log ref / a harness id). **REQUIRED\
  \ to clear the\n  class** (the SPEC-0156 `broken_input` discipline): a bare \"it\
  \ ran\" with no named run is a CLAIM anyone\n  could type, and clearing a class\
  \ on a claim is the false-green this contract exists to end. `class`, a\n  `pass`\
  \ `outcome`, and a non-empty `evidence` must ALL be present; an incomplete record\
  \ does not clear it,\n  so the class stays visible as debt (the conservative direction\
  \ — under-evidenced ⇒ still owed).\n- It rides the EXISTING generic `event` verb\
  \ (`bin/yitc-v2 event test_class_executed --data`) — SPEC-0152\n  rule 24 admits\
  \ **no new verb, no new emitter, no new store** (the SPEC-0156 producer precedent).\
  \ It is\n  NOT auto-emitted from the declaration: a pinned suite pass does not positively\
  \ observe a per-class run\n  (`land` runs `verify.layers` by layer, never per class),\
  \ so an auto-emit would be the very false-green\n  this ends. The consumer is the\
  \ DERIVED debt view `debt.unexecuted_test_classes`, which folds\n  carrier + journal\
  \ at read time and surfaces every declared class with no matching record as unexecuted\n\
  \  (report-only, never a gate).\n- Append-only + P5-safe : additive — no existing\
  \ event type changes; a consumer that does not know\n  this type parses it as the\
  \ opaque `{ts,type,data}` triple.\n\n#### Followup-capture events (per SPEC-0095;\
  \ `followup_armed` + `trigger`)\nThe `followup` verb family records a lightweight\
  \ capture + its 2-state lifecycle as append-only events;\nstate (`open` = added\
  \ not yet promoted|dropped) is FOLDED from these, never stored (the cross\ninbox/outbox\
  \ derived-view model). Authority for the mechanism: SPEC-0095. No new store/parser.\n\
  ```jsonc\n{\"ts\": \"...\", \"type\": \"followup_added\",\n \"data\": {\"followup_id\"\
  : \"fu_<12hex>\", \"text\": \"<the follow-up>\", \"relates_to\": \"<T-NNNN|fp|file>?\"\
  ,\n          \"trigger\": \"<the NAMED future moment awaited>?\", \"awaits\": \"\
  <T-NNNN, the AWAITED artifact>?\"}}\n{\"ts\": \"...\", \"type\": \"followup_armed\"\
  ,\n \"data\": {\"followup_id\": \"fu_<12hex>\", \"trigger\": \"<named>|null\", \"\
  awaits\": \"<T-NNNN>|null\"}}\n{\"ts\": \"...\", \"type\": \"followup_promoted\"\
  , \"data\": {\"followup_id\": \"fu_<12hex>\", \"into\": \"T-NNNN?\"}}\n{\"ts\":\
  \ \"...\", \"type\": \"followup_dropped\", \"data\": {\"followup_id\": \"fu_<12hex>\"\
  , \"reason\": \"<why>?\"}}\n```\n- `followup_id` — `fu_` + a hash of the text +\
  \ a uuid4 nonce (collision-safe; two identical captures\n  get DISTINCT ids).\n\
  - `trigger` — the OPTIONAL armed-waiter ATTRIBUTE (SPEC-0095 §Armed): the NAMED\
  \ future moment an open\n  followup waits for. Born on `followup_added` (`add --trigger`)\
  \ and re-set by any later\n  `followup_armed` (`arm`); a `followup_armed` carrying\
  \ `trigger: null` CLEARS it (`unarm`). Last write\n  wins, and an armed event against\
  \ an unknown or already-terminal id is INERT. It is an ATTRIBUTE, NOT\n  a status:\
  \ `followup_armed` never transitions the 2-state FSM, which stays `open -> promoted|dropped`.\n\
  - `awaits` — the OPTIONAL AWAITED-ARTIFACT ATTRIBUTE (SPEC-0095 §Armed): the artifact\
  \ whose\n  CLOSURE is the arrival of the awaited moment, and the SOLE key the `armed_fired`\
  \ fire check reads.\n  Distinct from `relates_to`, which is PROVENANCE (what the\
  \ followup is ABOUT) and is NEVER a fire key.\n  Born on `followup_added` (`add\
  \ --awaits`) and re-set together with `trigger` by any later\n  `followup_armed`\
  \ (`arm`); an absent/`null` value CLEARS it (`unarm`, or an `arm` that omits it).\
  \ A\n  record with no `awaits` can never auto-fire — the pre- records, which fold\
  \ to `awaits: null`.\n- Append-only + P5-safe: a transition for an unknown / already-terminal\
  \ id is refused by the verb, and\n  a consumer that doesn't know these types parses\
  \ them as the opaque `{ts,type,data}` triple.\n\n#### Frontend-error ack marker\
  \ (per SPEC-0170 §Parameters \"TTL / ack\")\nThe ack that stops an ALREADY-JUDGED\
  \ confirmed error cluster from nagging on every session start. It\nreuses the followup\
  \ shape above wholesale — one append-only event, FOLDED at read time, no store,\
  \ no\ntable, no status field, no FSM. Authority for the rule: SPEC-0170.\n```jsonc\n\
  {\"ts\": \"...\", \"type\": \"frontend_error_acked\", \"data\": {\"fingerprint\"\
  : \"<kind|normalized message>\"}}\n```\n- `fingerprint` — the cluster key (`kind\
  \ | normalized message`, SPEC-0170 §Parameters), never the\n  human LABEL: the label\
  \ is a rendering and two labels can collide, while the fingerprint is the fold's\n\
  \  own identity. Last write wins (re-acking a RECURRED cluster moves its ack forward).\n\
  - The ack instant is the envelope `ts` and NOT a payload field — an ack is stamped\
  \ when it happens, so\n  it cannot be back-dated over a recurrence that already\
  \ arrived.\n- There is no un-ack event and none is wanted: suppression is DERIVED\
  \ (`last_seen <= acked_at`), so the\n  cluster's own next occurrence un-suppresses\
  \ it. An ack can therefore never become a permanent mute.\n- The event is namespaced\
  \ `frontend_error_acked` because the cross channel already owns `cross_acked`\n\
  \  (a different mechanism on a different id space).\n\n#### Session hand-off events\
  \ (per SPEC-1004 §4)\nThe `session handoff` verbs (`bin/lib/session.py#cmd_session_handoff`)\
  \ record that a hand-off was\nwritten / taken / dropped / expired. The hand-off\
  \ FILE (`<git-common-dir>/yitc/handoffs/H-<N>.md`) is\nthe sole open/closed state;\
  \ these rows are HISTORY only and never change state. **No row ever carries\nthe\
  \ hand-off title or text** — only the id, a hash, a size and an age. The acting\
  \ session travels on\nthe envelope `session_ref` (never a second payload copy).\n\
  ```jsonc\n{\"ts\": \"...\", \"type\": \"handoff_written\", \"data\": {\"id\": \"\
  H-<N>\", \"sha256\": \"<64 hex>\", \"bytes\": 1234}}\n{\"ts\": \"...\", \"type\"\
  : \"handoff_taken\", \"data\": {\"id\": \"H-<N>\", \"sha256\": \"<64 hex>\"}}\n\
  {\"ts\": \"...\", \"type\": \"handoff_dropped\", \"data\": {\"id\": \"H-<N>\", \"\
  sha256\": \"<64 hex>\"}}\n{\"ts\": \"...\", \"type\": \"handoff_expired\", \"data\"\
  : {\"id\": \"H-<N>\", \"sha256\": \"<64 hex>\", \"age_days\": 8}}\n```\n- `id` —\
  \ the hand-off id `H-<N>` (shared allocator key `handoff`; unique and increasing\
  \ across\n  deletions and linked worktrees). Validation: `^H-[1-9][0-9]*$`.\n- `sha256`\
  \ — SHA-256 (64 lowercase hex) over the EXACT stored `H-<N>.md` bytes (after redaction\
  \ and\n  serialization); every terminal row hashes those same unchanged bytes, so\
  \ a written row and its\n  taken / dropped / expired row PAIR by `id` + `sha256`.\n\
  - `bytes` — the stored file's length in bytes (<= 32768, the file cap), `handoff_written`\
  \ only.\n- `age_days` — whole days between the file's frontmatter `written` and\
  \ the cleanup instant\n  (> 7 by construction — opportunistic cleanup at the next\
  \ `write`), `handoff_expired` only.\n\n## Rationale\n\nSplit from SPEC-0025 under\
  \ the SPEC-0120 §3 one-bounded-read ceiling (must-split: the parent was 817\nlines\
  \ / 65649 B, over BOTH the line and the byte ceiling). The §Event-type catalog extension\
  \ section\n re-homes VERBATIM here (SPLIT-never-delete, aggregate-neutral) at the\
  \ document's own\ntop-level seam — the section already carried its own append-only\
  \ compatibility preamble and is a\nstable-surface boundary (SPEC-0005 rule-6: split\
  \ by surface, never perspective). Prior art: /\nSPEC-0153 carved the terminal-marker\
  \ + per-dispatch sections from this same spec identically.\n\n### Catalog completeness\
  \ reconcile (2026-07-17)\n\n**The catalog is FEDERATED — absence from SPEC-0025/SPEC-0161\
  \ alone is NOT a gap.** Recorded because\nthree T1 sweeps (fp `spec-0025-event-catalog-lags-emitted-types`,\
  \ 2026-06-06 + 2026-07-17 x2) measured\nthe emitted surface against SPEC-0025+SPEC-0161\
  \ ONLY and so over-counted ~2x (110 raw \"missing\" vs 61\nreal). A type is **cataloged\
  \ iff SOME active spec homes it**. The homes:\n- **SPEC-0025** — the universal envelope\
  \ schema, the required event types, the normalized\n  provider x model x effort\
  \ vocabulary.\n- **SPEC-0161** (this spec) — the maximalist-capture extension; the\
  \ **append-only home** for a type\n  belonging to no dedicated mechanism spec.\n\
  - **SPEC-0153** — terminal-marker + per-dispatch correlation + the observability\
  \ events\n  (`read_gate_refused`, `external_action`, error/friction, chat-class);\
  \ split VERBATIM from SPEC-0025\n  at.\n- **Per-mechanism homes** — a mechanism\
  \ spec catalogs its OWN events: SPEC-0050 (`read_gate_refused`),\n  SPEC-0094 (`deploy_*`),\
  \ SPEC-0116 (`external_action`), SPEC-0085 (`cross_*`), SPEC-0095 (`followup_*`).\n\
  \n**Sweep method (mechanical, so the next run is reproducible).** Ground truth =\
  \ the journal window\n(types with a `last` emission inside the window) UNION a code-grep\
  \ of emitters in `bin/`, measured\nagainst the WHOLE `specs/` corpus — never the\
  \ parent alone. The **discriminator** for what the catalog\nowes an entry: **does\
  \ an emitter exist in `bin/`?** A verb-emitted type is a governed surface and is\n\
  rostered; a hand `bin/yitc-v2 event <type>` one-shot append is not (see the defer\
  \ marker below).\n\n**The completeness gate is judged on the DIFF, not on main's\
  \ accumulated journal (2026-08-21).** The reconcile above says WHICH types the catalog\
  \ owes an entry; this says WHO is\nanswerable when one is missing. `tests/test_event_catalog_completeness.py`\
  \ used to quantify its AC1 /\nAC1-prime arms over main's whole journal, so the verdict\
  \ was identical for every branch in the repo. On\n2026-08-21 seven `watch_verdict_recorded`\
  \ rows reached main while their emitter sat unlanded in\n worktree; with rows present\
  \ and no emitter the type fell into the no-emitter residual, AC1-prime\nfailed ON\
  \ MAIN, and EVERY land in the repo was refused for roughly an hour — aborts at 04:33:54Z\n\
  , 04:39, 04:45, 04:49, each paying a full verify to be indicted\nfor a state none\
  \ of them created. It cleared at 05:04 only when happened to land and supply the\n\
  emitter.\n\nThe window is STRUCTURAL, not anyone's mistake: a journal append may\
  \ reach main with NO worktree (deliberately, so a deviation capture is never gated\
  \ behind opening one) while code reaches main only\nthrough `land` — so a type's\
  \ ROWS legitimately precede its EMITTER on main. Closing it by gating journal\n\
  appends would trade a rare freeze for a permanent chill on capture, so the asymmetry\
  \ STAYS and the\nQUANTIFIER moved instead: the gate asks whether THIS DIFF introduces\
  \ or leaves an uncatalogued live type,\nmeasured against `git merge-base HEAD main`.\
  \ The branch that brings a type in is then the branch that\nfails, and it can clear\
  \ it on its own branch — self-clearing instead of repo-wide. Modeled on the\ndiff-aware\
  \ `seed_growth_warnings` / `new_test_file_warnings` shape (CHARTER §P1 F1 — extend\
  \ the analog).\n\n**The federated PREDICATE above is UNCHANGED by this — only the\
  \ quantifier over it moved.** One function\n(`graph.classify_event_types`) is applied\
  \ identically to the working tree and the merge-base tree, so\nthere is no second,\
  \ weaker baseline catalog. homing its type in SPEC-0133 is exactly why landing\n\
  it RESOLVED the freeze rather than repeating it, and that route is untouched. (That\
  \ the shipped predicate\nis a raw whole-corpus substring rather than structured\
  \ active-spec homing is a real, separate concern —\nraised at audit-pre and ruled\
  \ out of scope by the SPEC-0124 ceiling-convergence consult,\ntracked as followup\
  \ fu_f5305ac63f6f: a stronger predicate strictly WIDENS the failing set and so must\
  \ be\nmeasured report-only before it is ever allowed to gate a land.)\n\n**THE NAMED\
  \ RESIDUE — what a diff-scoped gate stops seeing, and where it is reported instead.**\
  \ A type\nwhose rows reach main from a checkout that NEVER LANDS — the no-worktree\
  \ append from the main\ncheckout, for a type no branch's diff ever introduces —\
  \ is uncatalogued at the merge-base of every branch\nthat runs the gate. It is therefore\
  \ INHERITED forever and NO branch is failed for it. That is deliberate:\nthe state\
  \ is by construction unattributable, and a gate that cannot name a responsible party\
  \ can only\npunish bystanders, which is the incident above. It is NOT dropped: it\
  \ is reported by the report-only\n`uncatalogued-type:` WARN at the `graph conformance`\
  \ seam (beside `seed-growth` and `test-new-file`),\nwhich never joins the RED set\
  \ and never moves an exit code, plus a note printed by the gate itself so a\nreader\
  \ of a GREEN run still sees it. Report, never gate — a fail-closed default for the\
  \ attributable\ncase, a visible reading for the unattributable one.\n\n**Second\
  \ run recorded — 2026-08-19.** The lenient 2-spec match fired a FOURTH time (the\
  \ card\nread \"64 of 175 uncatalogued\"). Re-run mechanically it measures **77 of\
  \ 194** against SPEC-0025 +\nSPEC-0161 alone, and those 77 partition EXHAUSTIVELY\
  \ as **77 = 30 + 13 + 34**: **30** resolve by name\nto another active spec (the\
  \ federated homes above — e.g. `canary_backstop_ran`→SPEC-0066,\n`concern_drift_surfaced`→SPEC-0143,\
  \ `deviation_resolved`→SPEC-0085, `error_*`→SPEC-0056/<workshop-spec>,\n`blocked_on_land`→SPEC-0103/<workshop-spec>,\
  \ `audit_*`→SPEC-0124), **13** earned a roster entry here (below),\nand **34** are\
  \ the named no-emitter deferrals. So the raw count over-reported by ~5x, and the\
  \ REAL\nuncatalogued set — the thing the card is about — was 13. A FIFTH firing\
  \ on the raw 2-spec number\nresolves BY CITATION to this paragraph; only a re-run\
  \ against the WHOLE corpus is evidence of a gap.\n\n#### Roster — verb-emitted types\
  \ homed here ( reconcile)\nCompact roster lines, deliberately NOT per-type JSONC\
  \ blocks: the envelope is already specified once in\nSPEC-0025 §universal schema,\
  \ and the per-type `data` payload SoT is the emitter (see the payload-key\nmarker\
  \ below) — full blocks would duplicate both and re-breach the SPEC-0120 §3 ceiling\
  \ that forced\nthis spec's own split from SPEC-0025.\n\n- **`execution_started`**\
  \ — `bin/lib/task.py` `task execute` — Stage-5 entry marker.\n- **`analysis_finalized`**\
  \ — `bin/lib/task.py` `task analyze --finalize` — Stage-1 decision-record sealed;\
  \ gates Plan entry.\n- **`tests_entered`** — `bin/lib/task.py` `task test` — Stage-6\
  \ entry marker.\n- **`task_parked`** / **`task_unparked`** — `bin/lib/task.py` `task\
  \ update --status parked|ready` — parking-lot transitions (QUEUE §Parking lot).\n\
  - **`audit_yamls_archived`** — `bin/lib/triage.py` — audit-record archival sweep.\n\
  - **`land_started`** — `bin/lib/worktree.py` — a land BEGAN on this branch, in this\
  \ process: emitted at land entry immediately after the three structural branch guards\
  \ (detached-HEAD / on-main / not-a-linked-worktree) and BEFORE the spike guard,\
  \ the dirt guard, the land reservation, the SPEC-0132 verify-admission slot and\
  \ `_land_integrate` — so it is above everything that can queue. Carries `branch`\
  \ / `pid` / `ppid` / `reason`, and rides `task_id` for a `task/T-NNNN` branch; the\
  \ `session_ref` and `ts` that place the launch act are the ordinary envelope fields\
  \ every row carries, never re-derived in the payload. It exists because nothing\
  \ recorded that a land had STARTED: `land_completed` is emitted only at the END\
  \ and not at all when the land is killed, and start attribution was inferable ONLY\
  \ from `waiting_for_land_reservation`, which exists only under admission CONTENTION\
  \ — of 199 lands carrying a `land_completed` since 2026-08-26, 15 emitted no queue-wait\
  \ row whatsoever, so for those nothing on record said a land had ever run. `pid`\
  \ is load-bearing rather than decorative: four separate `task/` lands between 04:00:27Z\
  \ and 05:16:34Z on 2026-08-27 carried the SAME `session_ref` and differed only by\
  \ pid, so a row keyed on branch or session alone would have collapsed four launch\
  \ acts into one — the exact ambiguity that let an owner-directed hold be lost twice\
  \ (fu_72c83eccd466). UNCONDITIONAL over session kind, unlike its neighbour `land_process_group_escaped`,\
  \ which is deliberately non-worker-only: every land emits this row, which is what\
  \ makes its ABSENCE for a given land a real signal rather than missing data. The\
  \ emit is FAIL-SOFT — it is observability, never a gate, so an unwritable journal\
  \ announces itself on stderr and the land PROCEEDS. It records a fact and nothing\
  \ more: it is not a hold, lock or lease, and changes nothing about admission, batching\
  \ or the `os.setsid` escape.\n- **`waiting_for_land_reservation`** — `bin/lib/worktree.py`\
  \ — land queued behind the land reservation (concurrency governor heartbeat, cf.\
  \ SPEC-0132).\n- **`land_reservation_park_requeued`** — `bin/lib/worktree.py#_take_land_reservation`\
  \ — a land EVICTED by the SPEC-0132 §1a park bound RE-ENTERED the same wait BY ITSELF,\
  \ instead of being handed back to a human. Emitted once per automatic requeue, on\
  \ the MAIN checkout's journal, carrying `branch` / `attempt` (1-based, this process)\
  \ / `holders_seen` (DISTINCT reservation-holder pids watched go by during the bound\
  \ that just fired). The requeue fires ONLY when `holders_seen >= 2` — i.e. the QUEUE\
  \ WAS MOVING and this land was merely slow — and is capped by the GATE-class `YITC_LAND_PARK_REQUEUE_MAX`\
  \ (default 2); a bound served out behind ONE holder is the wedged-holder case exists\
  \ for and still STOPS, unchanged, and so does a land past the cap. Ground : on 2026-09-11\
  \ four lands were evicted by the bound while naming DIFFERENT holders across their\
  \ waits, were each re-run BY HAND by the Controller, and then landed on the re-run\
  \ — the bound was reading a 9-10-deep MOVING queue as a wedge. Reading the pair:\
  \ a `land_reservation_park_halted` row WITHOUT any preceding `land_reservation_park_requeued`\
  \ for the branch is either a genuine wedge or a cap-0 fleet; one WITH them is a\
  \ land that queued, requeued and still did not get through. FAIL-CLOSED on an unresolvable\
  \ holder: `holders_seen` cannot then reach 2, so the land takes the stop.\n- **`waiting_for_venue_admission`**\
  \ — `bin/lib/worktree.py` (relayed from the box-side leg) — a land queued behind\
