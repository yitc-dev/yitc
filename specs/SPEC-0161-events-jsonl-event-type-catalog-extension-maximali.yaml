  \ this pass would audit, so the two-arm refusal is readable off the row.\n- `task_amended.audited_commit`\
  \ — `bin/lib/task.py` : the `expected_touch` CORRECTION\n  record's own audited\
  \ sha, which makes the «the recorded audited commit does not move» claim\n  CHECKABLE\
  \ from the journal rather than asserted in a docstring.\n- `bg_dispatch_halted.audited_commit`\
  \ — NO emitter in `bin/` writes it: it rides two hand-authored\n   halt payloads\
