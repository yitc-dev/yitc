  Compact roster lines, deliberately NOT per-type JSONC blocks: the envelope is already specified once in
  SPEC-0025 §universal schema, and the per-type `data` payload SoT is the emitter (see the payload-key
  marker below) — full blocks would duplicate both and re-breach the SPEC-0120 §3 ceiling that forced
  this spec's own split from SPEC-0025.

  - **`execution_started`** — `bin/lib/task.py` `task execute` — Stage-5 entry marker.
