  \ a backgrounded watcher SWEPT twice in a row while every worker it watched stayed\
  \ healthy, because the harness kill is group-directed and the watcher shared its\
  \ shell's group. The row is what makes the decoupling READABLE — it is how a later\
  \ session knows this watcher could not have died with its wrapper, so a swept, timed-out\
  \ or never-armed wrapper costs a re-arm and nothing else. It covers `--watch-fleet`\
