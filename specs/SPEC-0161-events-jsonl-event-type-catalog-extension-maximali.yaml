  - **`tests_entered`** — `bin/lib/task.py` `task test` — Stage-6 entry marker.
  - **`task_parked`** / **`task_unparked`** — `bin/lib/task.py` `task update --status parked|ready` — parking-lot transitions (QUEUE §Parking lot).
  - **`audit_yamls_archived`** — `bin/lib/triage.py` — audit-record archival sweep.
  - **`land_started`** — `bin/lib/worktree.py` — a land BEGAN on this branch, in this process: emitted at land entry immediately after the three structural branch guards (detached-HEAD / on-main / not-a-linked-worktree) and BEFORE the spike guard, the dirt guard, the land reservation, the SPEC-0132 verify-admission slot and `_land_integrate` — so it is above everything that can queue. Carries `branch` / `pid` / `ppid` / `reason`, and rides `task_id` for a `task/T-NNNN` branch; the `session_ref` and `ts` that place the launch act are the ordinary envelope fields every row carries, never re-derived in the payload. It exists because nothing recorded that a land had STARTED: `land_completed` is emitted only at the END and not at all when the land is killed, and start attribution was inferable ONLY from `waiting_for_land_reservation`, which exists only under admission CONTENTION — of 199 lands carrying a `land_completed` since 2026-08-26, 15 emitted no queue-wait row whatsoever, so for those nothing on record said a land had ever run. `pid` is load-bearing rather than decorative: four separate `task/` lands between 04:00:27Z and 05:16:34Z on 2026-08-27 carried the SAME `session_ref` and differed only by pid, so a row keyed on branch or session alone would have collapsed four launch acts into one — the exact ambiguity that let an owner-directed hold be lost twice (fu_72c83eccd466). UNCONDITIONAL over session kind, unlike its neighbour `land_process_group_escaped`, which is deliberately non-worker-only: every land emits this row, which is what makes its ABSENCE for a given land a real signal rather than missing data. The emit is FAIL-SOFT — it is observability, never a gate, so an unwritable journal announces itself on stderr and the land PROCEEDS. It records a fact and nothing more: it is not a hold, lock or lease, and changes nothing about admission, batching or the `os.setsid` escape.
  - **`waiting_for_land_reservation`** — `bin/lib/worktree.py` — land queued behind the land reservation (concurrency governor heartbeat, cf. SPEC-0132).
  - **`land_reservation_park_requeued`** — `bin/lib/worktree.py#_take_land_reservation` — a land EVICTED by the SPEC-0132 §1a park bound RE-ENTERED the same wait BY ITSELF, instead of being handed back to a human. Emitted once per automatic requeue, on the MAIN checkout's journal, carrying `branch` / `attempt` (1-based, this process) / `holders_seen` (DISTINCT reservation-holder pids watched go by during the bound that just fired). The requeue fires ONLY when `holders_seen >= 2` — i.e. the QUEUE WAS MOVING and this land was merely slow — and is capped by the GATE-class `YITC_LAND_PARK_REQUEUE_MAX` (default 2); a bound served out behind ONE holder is the wedged-holder case exists for and still STOPS, unchanged, and so does a land past the cap. Ground : on 2026-09-11 four lands were evicted by the bound while naming DIFFERENT holders across their waits, were each re-run BY HAND by the Controller, and then landed on the re-run — the bound was reading a 9-10-deep MOVING queue as a wedge. Reading the pair: a `land_reservation_park_halted` row WITHOUT any preceding `land_reservation_park_requeued` for the branch is either a genuine wedge or a cap-0 fleet; one WITH them is a land that queued, requeued and still did not get through. FAIL-CLOSED on an unresolvable holder: `holders_seen` cannot then reach 2, so the land takes the stop.
  - **`waiting_for_venue_admission`** — `bin/lib/worktree.py` (relayed from the box-side leg) — a land queued behind the MACHINE-WIDE venue request cap (`YITC_VENUE_MAX_REQUESTS`, default 1 — SPEC-0203 rule 4). Carries `request` / `leg` / `live` / `cap` / `waited_s` / `branch` / `box`. It is a THIRD queue and reports as itself: it is deliberately NOT a member of `journal.LAND_QUEUE_WAIT_TYPES`, because that tuple is the one source through which two independent readers — the SPEC-0132 admission lens and SPEC-0119 rule 27's abort phase-split — resolve the LOCAL per-repo wait series, and joining it would silently re-attribute box waits into local admission statistics (the exact conflation homed that tuple to prevent). The row is emitted LOCALLY, by the land, off a throttled line the leg prints on stderr while it waits — the box cannot write this journal, and the module that runs the pass writes no journal of its own (CHARTER §P5), so the relay is injected at the land call site that already owns the row.
