body: |
  ## Scenario

  One SPEC-0025 event-schema section, re-homed VERBATIM: **§Event-type catalog extension ** —
  the maximalist-capture event types (the fundamental-gap events, the general maximalist-capture events,
  the retired stage entry/exit timing events, the LIVE `stage_entered` content-delivery event,
  `check_admission_demonstrated`, `spec_activated`, `test_class_executed`, and the followup-capture
  events). NOTHING is moved beyond that one SPEC-0025 section. SPLIT VERBATIM under the SPEC-0120
  one-bounded-read ceiling; the parent SPEC-0025 keeps the universal schema, the required event
  types, and the normalized provider×model×effort vocabulary, and points here for this section. A moved
  event that references «§Normalized provider×model×effort vocabulary» (e.g. `task_paused` `wait_reason`)
  still points at that vocabulary in the parent SPEC-0025 — the reference is preserved verbatim.

  ## Internal

  ### Event-type catalog extension
  Extension of `events.jsonl` event types for maximalist data capture ( query layer). All added
  types are payload variations, not a new mechanism. **Compatibility rule (per F5 audit absorption):** the
  event-types catalog is **append-only**; consumers MUST ignore unknown event types gracefully (parse as
  an opaque `{ts, type, data}` triple, not fail). A closed enum is NOT assumed; future additions don't
  break existing consumers. When typed validation is needed (e.g. a specific query), a consumer declares a
  versioned schema reference per event type — opt-in, not required by default.

  #### Fundamental-gap-related events
  **`dissonance_detected`** (per CHARTER §Principle 7) — retained legacy/manual pointer, **subsumed by
  `deviation_captured`** (: `kind: defect`, `relates_to: #7`); manual-emit-optional.
  Full prior schema in / git history. Still the named event when a P7 artifact contradiction is
  recorded.

  **`consumer_read_evidence`** (per CHARTER §Principle 8 adoption strength):
  ```jsonc
  {"ts": "...", "type": "consumer_read_evidence", "task_id": "T-XXXX",
   "data": {"target": "specs/SPEC-0042.yaml", "consumer": "bin/yitc-v2 graph build",
            "verified_by": "event_emit|state_check|live_invocation"}}
  ```

  **`live_trigger_evidence`** (per CHARTER §Principle 8 adoption strength):
  ```jsonc
  {"ts": "...", "type": "live_trigger_evidence", "task_id": "T-XXXX",
   "data": {"mechanism": "<hook|cron|cli|api>", "trigger_event": "<ts>",
            "outcome": "fired_as_expected|deviated|failed"}}
  ```

  **`task_paused`** (per Resume contract — LIFECYCLE):
  ```jsonc
  {"ts": "...", "type": "task_paused", "task_id": "T-XXXX",
   "data": {"current_stage": 5, "resume_from": "<step>", "last_verified": "<artifact>",
            "next_action": "<one-line>", "paused_reason": "owner-wait|auditor-abort|session-end"}}
  ```
  MAY additionally carry the OPTIONAL normalized `wait_reason` (per SPEC-0135 §5 — the shared pause/block
  reason vocabulary defined at §Normalized provider×model×effort vocabulary), ALONGSIDE the free
  `paused_reason` detail string; additive / P5-safe.

  **`task_resumed`**:
  ```jsonc
  {"ts": "...", "type": "task_resumed", "task_id": "T-XXXX",
   "data": {"prior_pause_event": "<ts of task_paused>", "verification_passed": true|false,
            "diff_from_pause": "none|<description>"}}
  ```

  #### General maximalist capture events
  **Retired manual-emit.** `owner_directive`, `ai_reasoning_note`, `failed_attempt` (plus
  `dissonance_detected` above) are no longer obligated for manual emission — the provider session log
  captures them durably. Schemas kept for reference + optional use; historical entries preserved. Cite the
  session log for chat-derived rationale instead.

  **`owner_directive`** — chat directives durable-captured (ephemeral chat → event):
  ```jsonc
  {"ts": "...", "type": "owner_directive", "task_id": "T-XXXX",
   "data": {"directive": "<verbatim or summary>", "classification": "approval|stop|redirect|question",
            "captured_durable_as": "decisions/D-XXXX OR n/a"}}
  ```

  **`ai_reasoning_note`** / **`failed_attempt`** — retained legacy/manual pointers, **subsumed by
  `deviation_captured`** (— a reasoning note rides as `kind: improvement`; a failed attempt
  as `kind: friction`/`defect`); manual-emit-optional. Full prior schemas in / git history.

  #### Stage entry/exit events (timing analytics — Day 5+ query layer)
  **Manual hand-emit RETIRED (retired-by-).** The MANUAL hand-emit obligation for `stage_entry`,
  `stage_exit`, and `task_picked` is retired — do NOT hand-emit them. The obligation lapsed ( F4:
  142 broken stage_entry/exit pairs + 168 manual task_picked). retired the **manual** emit ONLY; a
  **deterministic CLI auto-emit is the sanctioned replacement**. The three types split into two cases:
    - **`stage_entry` / `stage_exit`** — NO callsite; genuinely not emitted. Recoverable from the
      deterministic auto-emit chain (audit_pre_completed → commit_landed → audit_post_completed →
      task_closed) + git log. Schemas below are kept as historical reference (append-only). If
      stage-timing / pickup-latency analytics are ever needed, auto-emit via a future deterministic CLI
      command ( rejected_ideas) — never re-impose the manual obligation.
    - **`task_picked`** — IS auto-emitted, deterministically, by the claim path `_claim_task` — the claim
      that `worktree new --task` performs. This IS the -sanctioned deterministic CLI
      auto-emit, NOT the retired manual emit — so it is a **live event, not historical**; only the
      hand-emit obligation was retired. (`task pick` is a read-only inspector and does NOT emit it;
      QUEUE.md §Picker logic describes the same claim-path emit — doc and code agree.)

  **`stage_entry`** / **`stage_exit`** (historical schema — retired-by-, do not hand-emit):
  ```jsonc
  {"ts": "...", "type": "stage_entry", "task_id": "T-XXXX",
   "data": {"stage": 5, "stage_name": "Execution", "entered_from_stage": 4}}
  {"ts": "...", "type": "stage_exit", "task_id": "T-XXXX",
   "data": {"stage": 5, "stage_name": "Execution", "outcome": "complete|paused|aborted",
            "duration_seconds": 1234}}
  ```

  #### Stage-declaration content-delivery event (per the stage-declaration plan, AU-2)
  **`stage_entered`** — a **LIVE, first-class** event (NOT the retired timing `stage_entry`/`stage_exit`
  above). DISTINCT concern: `stage_entry`/`stage_exit` were *timing analytics* (duration, entered-from)
  and are retired; `stage_entered` records the **content bundle that stage-entry DELIVERED** — the
  declared lifecycle `stage` (reusing `current_stage`) plus the specs + work-verbs the
  binding-derived delivery lens routed to that stage (plan §2–§3). It is the journal trace that a stage
  was declared and its reads delivered. The PRODUCTION emitter is the `stage <NAME>` verb, which ships in
  **AU-3** (the core cutover, which `requires:` this task); this task (AU-2) only registers the contract +
  confirms journal-query discoverability. Until AU-3, it is emittable via the generic `event` verb.
  ```jsonc
  {"ts": "...", "type": "stage_entered", "task_id": "T-XXXX",
   "data": {"stage": "Commit", "delivered": ["SPEC-0014"], "delivered_verbs": ["task commit"]}}
  ```
  - `stage` — the declared lifecycle stage NAME (the `current_stage` semantic value;
    e.g. `Analysis | Plan | Audit-pre | Execution | Tests | Commit | Audit-post | Closure`).
  - `task_id` — the task whose stage was entered (top-level envelope field, as for other task events).
  - `delivered` — the spec IDs routed to this stage by the binding-derived lens (the reads to fetch via
    `graph query`); MAY be `[]` for a stage with no bound specs.
  - `delivered_verbs` — the work-verb name(s) the stage bundle names for that stage; MAY be `[]`.
  - `ctx_pct` — OPTIONAL raw observation-loop field (per SPEC-0135 §3): the context-fullness percent
    (0–100 int, the `session context` gauge, SPEC-0115) at stage entry, so the loop can see where in a
    task's arc context pressure builds. OMITTED when unmeasured ( no-fabricated-0s); a raw fact
    only — no derived score. Additive / P5-safe.
  - `ctx_no_data` — OPTIONAL sibling of `ctx_pct`, present EXACTLY when it is absent (X-0588): the machine-readable REASON the gauge had no percent — `model-unmapped` (the session's
    model is absent from the `context_window` map) / `config-unread` / `no-completed-turn`. A bare
    omission was itself the silence the loud-failure doctrine forbids: a reader could not tell an
    unmeasured session from any other absence, so a session whose threshold had gone dark read like
    one comfortably below the bound. Still NO fabricated number — the percent stays absent (SPEC-0115
    §5 "never guessed"); only the cause is added. Never emitted alongside `ctx_pct`. Additive /
    P5-safe.

  Append-only + P5-safe : additive — no existing event type is changed or removed, and
  consumers that don't know `stage_entered` parse it as an opaque `{ts,type,data}` triple. It needs **no
  per-type recognition branch** in `journal query`: `cmd_journal_query` + `_event_summary` are
  type-agnostic, so `journal query --type stage_entered` (and `--grep` / the bare `grep events.jsonl`
  fallback) surface it through the existing generic path — discoverability is a property of that path,
  not new code (anti-complexity F1/F2: extend the existing query path, no parallel one).

  #### Check-admission demonstration event (per SPEC-0156)
  **`check_admission_demonstrated`** — the recorded FAILING DEMONSTRATION that admits a kernel-graded
  check (SPEC-0156 §2). The kernel GRADES a project's declared checks — a `live_probe` (SPEC-0094), a
  security probe (SPEC-0098), a per-class deploy evidence command (SPEC-0097), a `yitc-ops.yaml tests:`
  class, a `verify.layers[].covers` claim — and this event is the durable answer to the differential
  question the kernel already asks of task ACs (SPEC-0060 §4 / X-0246) but never asked of what it grades
  itself: **"would this check still pass if the thing under test were BROKEN?"** One journaled RED run
  against a NAMED deliberately-broken input, captured once at the declaration seam.
  ```jsonc
  {"ts": "...", "type": "check_admission_demonstrated", "task_id": "T-XXXX",
   "data": {"check": "security.probes[auth-required]",
            "declaration": "yitc-ops.yaml#security.probes[auth-required]",
            "broken_input": "<the named deliberately-broken input>", "outcome": "red",
            "definition_identity": "<16-hex of the check declaration subtree at demonstration time>"}}
  ```
  - `check` — WHICH declared check (surface + name), as the carrier names it.
  - `declaration` — the carrier locator (`yitc-ops.yaml#<section>.<key>`) the check is declared at.
  - `broken_input` — the deliberately-broken input the check was shown RED against. Naming it is what
    makes the demonstration auditable rather than a claim. **REQUIRED to admit the check** (
    audit-post finding 1): a RED that names no broken input records a verdict with no evidence — nothing
    anyone could re-run — and admitting a check on that would be the very false-green this contract exists
    to end. `check`, `declaration`, `broken_input`, a RED `outcome` and `definition_identity` must ALL be
    present and non-empty for a record to admit a check; an incomplete record simply does not clear it, so
    the check stays visible as UNPROVEN debt (the conservative direction — under-evidenced ⇒ still owed).
  - `outcome` — **must be `red` to admit the check.** A green (or absent, or misspelt) outcome
    demonstrates NOTHING and admits nothing: a check nobody has seen FAIL is not evidence.
  - `definition_identity` — a content hash of the check's own declaration subtree AT demonstration time
    (`debt._definition_identity`). It is what makes "the demonstration is re-owed only when the check's
    COMMAND/DEFINITION changes" true by CONSTRUCTION: a REWIRE changes the subtree, so the identity
    changes, so this record stops matching and the question re-opens; a RE-RUN of the same check changes
    nothing and owes nothing. No stored state is needed for either half.
  - It rides the EXISTING generic `event` verb (`bin/yitc-v2 event check_admission_demonstrated --data`)
    — SPEC-0156 §2 admits **no new verb, no new emitter, no new store, and no event family** (CHARTER §P5,
    one journal). The consumer is the DERIVED debt view `debt.unproven_checks`, which folds carrier +
    journal at read time and surfaces every declared check with no matching RED demonstration as UNPROVEN
    (report-only, never a gate — SPEC-0156 §3).
  - Append-only + P5-safe : additive — no existing event type changes, and a consumer that does
    not know this type parses it as the opaque `{ts,type,data}` triple.

  #### Spec-activation event (per GRAPH §Spec lifecycle)
  **`spec_activated`** — the recorded `proposed → active` flip, appended by the SOLE activation writer
  (`bin/lib/task.py#_activate_task_proposed_specs`, reached from `task close`) once per activated spec,
  AFTER the durable status write it attests. Activation is a governed write with real consequences —
  `active` is the ONLY normative status (GRAPH §What a spec is FOR) and the flip atomically supersedes
  the target lineage — yet it was SILENT until (X-0411 / boomrocket : no activat*
  event existed in any journal, while `bin/lib/views.py` already NAMED `spec_activated` as a SUBSTANTIVE
  type nothing emitted). Without it the GRAPH drift-#10 check (an active spec with no activating carrier)
  has no evidence surface, and a work-first spec-activating task cannot satisfy P8 from its own activation.
  ```jsonc
  {"ts": "...", "type": "spec_activated", "task_id": "T-XXXX",
   "data": {"spec_id": "SPEC-XXXX", "supersedes": "SPEC-YYYY", "supersedes_status": "superseded"}}
  ```
  - `task_id` — the ACTIVATING task (the closing task that owns the spec per SPEC-0005 §5 — work-first
    `proposed_by == tid` or an explicit `activation_owner_task == tid`). The envelope slot: this event's
    subject IS that task.
  - `spec_id` — the spec that reached `active`. One event per activated spec (a close may activate several).
  - `supersedes` / `supersedes_status` — present ONLY when the activation flipped a target, reporting the
    flip that ACTUALLY happened: `superseded` (the target was active) or `withdrawn` (still proposed),
     one-active-lineage. Absent when the spec supersedes nothing.
  - Emitted from the ONE write, so both call paths are covered: the normal `cmd_task_close` AND the
    `_recover_close_tail` crash-heal re-run. IDEMPOTENT by construction — the writer's `status == proposed`
    filter skips an already-active spec, so the heal re-run re-emits nothing.
  - Append-only + P5-safe : additive — no existing event type changes, and a consumer that does
    not know this type parses it as the opaque `{ts,type,data}` triple.

  #### Test-class execution event (per SPEC-0152 rule 24)
  **`test_class_executed`** — the recorded LAST SUCCESSFUL EXECUTION of a declared test class (SPEC-0152
  rule 24). SPEC-0156 asks "would this check go RED if broken?"; this answers the sibling question "has this
  class ever actually RUN green?". aiseller's e2e class was DECLARED but its browsers were never installed —
  nothing ran, nothing failed, and a class that never executed read as coverage (X-0375). This event is the
  durable proof a declared class actually ran, recorded by whoever RAN it.
  ```jsonc
  {"ts": "...", "type": "test_class_executed", "task_id": "T-XXXX",
   "data": {"class": "live-app-e2e", "outcome": "pass",
            "evidence": "<what run — a CI url / a log ref / a harness id>"}}
  ```
  - `class` — WHICH declared `tests.classes[]` class ran, as the carrier names it.
  - `outcome` — **must be `pass` to record a successful run.** A non-pass (or absent, or misspelt) outcome
    records no successful run and clears nothing.
  - `evidence` — what run this attests to (a CI url / a log ref / a harness id). **REQUIRED to clear the
    class** (the SPEC-0156 `broken_input` discipline): a bare "it ran" with no named run is a CLAIM anyone
    could type, and clearing a class on a claim is the false-green this contract exists to end. `class`, a
    `pass` `outcome`, and a non-empty `evidence` must ALL be present; an incomplete record does not clear it,
    so the class stays visible as debt (the conservative direction — under-evidenced ⇒ still owed).
  - It rides the EXISTING generic `event` verb (`bin/yitc-v2 event test_class_executed --data`) — SPEC-0152
    rule 24 admits **no new verb, no new emitter, no new store** (the SPEC-0156 producer precedent). It is
    NOT auto-emitted from the declaration: a pinned suite pass does not positively observe a per-class run
    (`land` runs `verify.layers` by layer, never per class), so an auto-emit would be the very false-green
    this ends. The consumer is the DERIVED debt view `debt.unexecuted_test_classes`, which folds
    carrier + journal at read time and surfaces every declared class with no matching record as unexecuted
    (report-only, never a gate).
  - Append-only + P5-safe : additive — no existing event type changes; a consumer that does not know
    this type parses it as the opaque `{ts,type,data}` triple.

  #### Followup-capture events (per SPEC-0095; `followup_armed` + `trigger`)
  The `followup` verb family records a lightweight capture + its 2-state lifecycle as append-only events;
  state (`open` = added not yet promoted|dropped) is FOLDED from these, never stored (the cross
  inbox/outbox derived-view model). Authority for the mechanism: SPEC-0095. No new store/parser.
  ```jsonc
  {"ts": "...", "type": "followup_added",
   "data": {"followup_id": "fu_<12hex>", "text": "<the follow-up>", "relates_to": "<T-NNNN|fp|file>?",
            "trigger": "<the NAMED future moment awaited>?", "awaits": "<T-NNNN, the AWAITED artifact>?"}}
  {"ts": "...", "type": "followup_armed",
   "data": {"followup_id": "fu_<12hex>", "trigger": "<named>|null", "awaits": "<T-NNNN>|null"}}
  {"ts": "...", "type": "followup_promoted", "data": {"followup_id": "fu_<12hex>", "into": "T-NNNN?"}}
  {"ts": "...", "type": "followup_dropped", "data": {"followup_id": "fu_<12hex>", "reason": "<why>?"}}
  ```
  - `followup_id` — `fu_` + a hash of the text + a uuid4 nonce (collision-safe; two identical captures
    get DISTINCT ids).
  - `trigger` — the OPTIONAL armed-waiter ATTRIBUTE (SPEC-0095 §Armed): the NAMED future moment an open
    followup waits for. Born on `followup_added` (`add --trigger`) and re-set by any later
    `followup_armed` (`arm`); a `followup_armed` carrying `trigger: null` CLEARS it (`unarm`). Last write
    wins, and an armed event against an unknown or already-terminal id is INERT. It is an ATTRIBUTE, NOT
    a status: `followup_armed` never transitions the 2-state FSM, which stays `open -> promoted|dropped`.
  - `awaits` — the OPTIONAL AWAITED-ARTIFACT ATTRIBUTE (SPEC-0095 §Armed): the artifact whose
    CLOSURE is the arrival of the awaited moment, and the SOLE key the `armed_fired` fire check reads.
    Distinct from `relates_to`, which is PROVENANCE (what the followup is ABOUT) and is NEVER a fire key.
    Born on `followup_added` (`add --awaits`) and re-set together with `trigger` by any later
    `followup_armed` (`arm`); an absent/`null` value CLEARS it (`unarm`, or an `arm` that omits it). A
    record with no `awaits` can never auto-fire — the pre- records, which fold to `awaits: null`.
  - Append-only + P5-safe: a transition for an unknown / already-terminal id is refused by the verb, and
    a consumer that doesn't know these types parses them as the opaque `{ts,type,data}` triple.

  #### Frontend-error ack marker (per SPEC-0170 §Parameters "TTL / ack")
  The ack that stops an ALREADY-JUDGED confirmed error cluster from nagging on every session start. It
  reuses the followup shape above wholesale — one append-only event, FOLDED at read time, no store, no
  table, no status field, no FSM. Authority for the rule: SPEC-0170.
  ```jsonc
  {"ts": "...", "type": "frontend_error_acked", "data": {"fingerprint": "<kind|normalized message>"}}
  ```
  - `fingerprint` — the cluster key (`kind | normalized message`, SPEC-0170 §Parameters), never the
    human LABEL: the label is a rendering and two labels can collide, while the fingerprint is the fold's
    own identity. Last write wins (re-acking a RECURRED cluster moves its ack forward).
  - The ack instant is the envelope `ts` and NOT a payload field — an ack is stamped when it happens, so
    it cannot be back-dated over a recurrence that already arrived.
  - There is no un-ack event and none is wanted: suppression is DERIVED (`last_seen <= acked_at`), so the
    cluster's own next occurrence un-suppresses it. An ack can therefore never become a permanent mute.
  - The event is namespaced `frontend_error_acked` because the cross channel already owns `cross_acked`
    (a different mechanism on a different id space).


  ## Rationale

  Split from SPEC-0025 under the SPEC-0120 §3 one-bounded-read ceiling (must-split: the parent was 817
  lines / 65649 B, over BOTH the line and the byte ceiling). The §Event-type catalog extension section
   re-homes VERBATIM here (SPLIT-never-delete, aggregate-neutral) at the document's own
  top-level seam — the section already carried its own append-only compatibility preamble and is a
  stable-surface boundary (SPEC-0005 rule-6: split by surface, never perspective). Prior art: /
  SPEC-0153 carved the terminal-marker + per-dispatch sections from this same spec identically.

  ### Catalog completeness reconcile (2026-07-17)

  **The catalog is FEDERATED — absence from SPEC-0025/SPEC-0161 alone is NOT a gap.** Recorded because
  three T1 sweeps (fp `spec-0025-event-catalog-lags-emitted-types`, 2026-06-06 + 2026-07-17 x2) measured
  the emitted surface against SPEC-0025+SPEC-0161 ONLY and so over-counted ~2x (110 raw "missing" vs 61
  real). A type is **cataloged iff SOME active spec homes it**. The homes:
  - **SPEC-0025** — the universal envelope schema, the required event types, the normalized
    provider x model x effort vocabulary.
  - **SPEC-0161** (this spec) — the maximalist-capture extension; the **append-only home** for a type
    belonging to no dedicated mechanism spec.
  - **SPEC-0153** — terminal-marker + per-dispatch correlation + the observability events
    (`read_gate_refused`, `external_action`, error/friction, chat-class); split VERBATIM from SPEC-0025
    at.
  - **Per-mechanism homes** — a mechanism spec catalogs its OWN events: SPEC-0050 (`read_gate_refused`),
    SPEC-0094 (`deploy_*`), SPEC-0116 (`external_action`), SPEC-0085 (`cross_*`), SPEC-0095 (`followup_*`).

  **Sweep method (mechanical, so the next run is reproducible).** Ground truth = the journal window
  (types with a `last` emission inside the window) UNION a code-grep of emitters in `bin/`, measured
  against the WHOLE `specs/` corpus — never the parent alone. The **discriminator** for what the catalog
  owes an entry: **does an emitter exist in `bin/`?** A verb-emitted type is a governed surface and is
  rostered; a hand `bin/yitc-v2 event <type>` one-shot append is not (see the defer marker below).

  **The completeness gate is judged on the DIFF, not on main's accumulated journal (2026-08-21).** The reconcile above says WHICH types the catalog owes an entry; this says WHO is
  answerable when one is missing. `tests/test_event_catalog_completeness.py` used to quantify its AC1 /
  AC1-prime arms over main's whole journal, so the verdict was identical for every branch in the repo. On
  2026-08-21 seven `watch_verdict_recorded` rows reached main while their emitter sat unlanded in
   worktree; with rows present and no emitter the type fell into the no-emitter residual, AC1-prime
  failed ON MAIN, and EVERY land in the repo was refused for roughly an hour — aborts at 04:33:54Z
, 04:39, 04:45, 04:49, each paying a full verify to be indicted
  for a state none of them created. It cleared at 05:04 only when happened to land and supply the
  emitter.

  The window is STRUCTURAL, not anyone's mistake: a journal append may reach main with NO worktree (deliberately, so a deviation capture is never gated behind opening one) while code reaches main only
  through `land` — so a type's ROWS legitimately precede its EMITTER on main. Closing it by gating journal
  appends would trade a rare freeze for a permanent chill on capture, so the asymmetry STAYS and the
  QUANTIFIER moved instead: the gate asks whether THIS DIFF introduces or leaves an uncatalogued live type,
  measured against `git merge-base HEAD main`. The branch that brings a type in is then the branch that
  fails, and it can clear it on its own branch — self-clearing instead of repo-wide. Modeled on the
  diff-aware `seed_growth_warnings` / `new_test_file_warnings` shape (CHARTER §P1 F1 — extend the analog).

  **The federated PREDICATE above is UNCHANGED by this — only the quantifier over it moved.** One function
  (`graph.classify_event_types`) is applied identically to the working tree and the merge-base tree, so
  there is no second, weaker baseline catalog. homing its type in SPEC-0133 is exactly why landing
  it RESOLVED the freeze rather than repeating it, and that route is untouched. (That the shipped predicate
  is a raw whole-corpus substring rather than structured active-spec homing is a real, separate concern —
  raised at audit-pre and ruled out of scope by the SPEC-0124 ceiling-convergence consult,
  tracked as followup fu_f5305ac63f6f: a stronger predicate strictly WIDENS the failing set and so must be
  measured report-only before it is ever allowed to gate a land.)

  **THE NAMED RESIDUE — what a diff-scoped gate stops seeing, and where it is reported instead.** A type
  whose rows reach main from a checkout that NEVER LANDS — the no-worktree append from the main
  checkout, for a type no branch's diff ever introduces — is uncatalogued at the merge-base of every branch
  that runs the gate. It is therefore INHERITED forever and NO branch is failed for it. That is deliberate:
  the state is by construction unattributable, and a gate that cannot name a responsible party can only
  punish bystanders, which is the incident above. It is NOT dropped: it is reported by the report-only
  `uncatalogued-type:` WARN at the `graph conformance` seam (beside `seed-growth` and `test-new-file`),
  which never joins the RED set and never moves an exit code, plus a note printed by the gate itself so a
  reader of a GREEN run still sees it. Report, never gate — a fail-closed default for the attributable
  case, a visible reading for the unattributable one.

  **Second run recorded — 2026-08-19.** The lenient 2-spec match fired a FOURTH time (the card
  read "64 of 175 uncatalogued"). Re-run mechanically it measures **77 of 194** against SPEC-0025 +
  SPEC-0161 alone, and those 77 partition EXHAUSTIVELY as **77 = 30 + 13 + 34**: **30** resolve by name
  to another active spec (the federated homes above — e.g. `canary_backstop_ran`→SPEC-0066,
  `concern_drift_surfaced`→SPEC-0143, `deviation_resolved`→SPEC-0085, `error_*`→SPEC-0056/SPEC-0058,
  `blocked_on_land`→SPEC-0103/SPEC-0121, `audit_*`→SPEC-0124), **13** earned a roster entry here (below),
  and **34** are the named no-emitter deferrals. So the raw count over-reported by ~5x, and the REAL
  uncatalogued set — the thing the card is about — was 13. A FIFTH firing on the raw 2-spec number
  resolves BY CITATION to this paragraph; only a re-run against the WHOLE corpus is evidence of a gap.

