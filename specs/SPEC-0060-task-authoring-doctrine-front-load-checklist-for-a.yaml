id: SPEC-0060
title: Task-authoring doctrine — front-load checklist for a good task card, delivered
  at Filing
status: active
created_at: 2026-06-08 20:13:45+00:00
consumed: false
implements:
- bin/lib/task.py#cmd_task_file
- bin/lib/session.py#cmd_session_start
- bin/lib/triage.py#cmd_triage_run
body: "## Scenario\n\nWhen the owner/AI files a TASK, the card is FRONT-LOADED rather\
  \ than left a bare title: `task file`\nseeds a skeleton whose sections prompt the\
  \ same questions a good card answers UPFRONT — what changes,\nthe smallest concrete\
  \ edit, and the acceptance criteria WITH probe evidence — and the session holds\n\
  the authoring doctrine that says what a good card carries. So a task is never a\
  \ one-line stub someone\nlater reverse-engineers intent from. This is the TASK-axis\
  \ analog of the plan-draft authoring doctrine\n(SPEC-0043). It reaches the author\
  \ the way SPEC-0059's Filing carve-out describes: a session-start\nREFERENCE pointer\
  \ (availability, no gate) + the `task file` work-verb checks it was read before\n\
  writing the card.\n\n## Internal\n\nTHE TASK-AUTHORING DOCTRINE — the retrieved\
  \ home for WHAT a good task card front-loads. It is a\nCHECKLIST, not a gate (no\
  \ card-completeness validator — CHARTER non-goal #2/#7). It is POINTER-BASED:\n\
  every schema rule and every cutting rule stays normative in ITS OWN home (cited\
  \ inline); this spec\nNEVER restates them (SPEC-0005 rule 3 content-boundary / P5\
  \ one-home / rule 8\nprompts-checklists-cue+pointer — a front-load checklist item\
  \ carries a discipline CUE + a POINTER,\nnever a restated corpus rule).\n\n### The\
  \ front-load checklist — authoring PROMPTS only (accept-gate F3, 2026-06-08)\nEach\
  \ item is the QUESTION to ask while writing the card — NOT a re-statement of the\
  \ field's rule\n(the schema rule lives in SPEC-0028, the cutting rule in SPEC-0046;\
  \ this list only front-loads the\nthinking and POINTS). The load-bearing authoring\
  \ content this spec genuinely OWNS is items 3-4 (the\nfront-load thinking — scope\
  \ + acceptance/probe); items 1/2/5/6 are one-line prompts that defer\nentirely to\
  \ their home:\n1. **Title** — is it one imperative line that says what the card\
  \ DOES? (convention → SPEC-0028.)\n2. **Class** — picked from the catalog? (catalog\
  \ + meaning → SPEC-0028.)\n3. **Scope (front-load thinking — OWNED here)** — can\
  \ you name what EXISTS, what CHANGES, and the\n   SMALLEST concrete edit, as your\
  \ CURRENT understanding? Filing precedes this task's own Analysis\n   (entered later\
  \ at the claim), so this is the filer's front-load, not a completed Analysis output;\n\
  \   the picked-up task re-confirms it at Analysis (procedure → SPEC-0032).\n   **Touch\
  \ forecast — name the units you KNOW; the commit refreshes the rest.** The\n   card's\
  \ `expected_touch` is an OPTIONAL forecast for dispatch/planning/claim (SPEC-0028),\
  \ NOT a\n   completeness obligation: declare the units you can name at filing and\
  \ stop there. Do NOT try to\n   forecast every file the change will touch, nor pair\
  \ each with its governing spec — `task commit`\n   REFRESHES the field from the\
  \ committed diff, so what the work actually touched reaches those\n   readers whatever\
  \ the filer guessed. The under-citation cue at item 6(a) still reads whatever IS\n\
  \   declared, and is unchanged by this: it asks you to CITE the spec governing a\
  \ surface you named,\n   never to name more surfaces. On the AUDIT side the completeness\
  \ of this forecast is CONTEXT and\n   is never a finding (SPEC-0036 §Universal lens)\
  \ — so an incomplete forecast costs a filer nothing,\n   which is exactly why over-forecasting\
  \ to be safe is the wrong instinct here.\n   **Observation-vs-hypothesis cue (2026-08-12)\
  \ —** does a scope line\n   state a CAUSE? Separate what you MEASURED from what\
  \ you SUSPECT. A card may report measured\n   observations and may PROPOSE a suspected\
  \ cause; but a causal claim made BEFORE this task's own\n   Analysis defaults to\
  \ HYPOTHESIS, and becomes load-bearing only when the card carries the probe\n  \
  \ evidence and its `from:` chain (evidence discipline → CHARTER §Principle 2 `from:`\
  \ + §Principle 3\n   probe evidence; the Analysis re-confirmation is this item's\
  \ own rule above → SPEC-0032). Labelling\n   a cause does not license it as the\
  \ card's premise — write it as the hypothesis the work TESTS, so\n   the reader\
  \ can tell which half is proven. The same separation applies to a MEASURED claim:\
  \ name the\n   surface and scope you actually measured whenever that scope is narrower\
  \ than the claim you draw\n   from it. The same holds for the INSTRUMENT and not\
  \ only the scope (X-1012): when you report a\n   VISUAL or USER-FACING property,\
  \ do not claim more than you DIRECTLY OBSERVED — either back it\n   with rendered\
  \ evidence (a screenshot, a rendered read, a gate re-run), OR scope the claim to\
  \ the\n   PROXY you actually checked. A cheap DOM / selector / console / timing\
  \ check is never forbidden\n   and stays fully legitimate for steering your own\
  \ work; the cue binds the REPORT, not the check,\n   so a proxy stays legitimate\
  \ whenever the report says what it actually observed — what it forbids\n   is UPGRADING\
  \ a proxy into a claim about what a user saw.\n   An authoring PROMPT only: no card\
  \ is refused for omitting it.\n   **Premise-verify cue — AT THE FILING SEAM (owner\
  \ directive 2026-08-16, re-confirmed\n   2026-08-30) —** does this card rest on\
  \ a PREMISE about the CURRENT code — a quoted line\n   number, a stated absence\
  \ (\"nothing does X\"), a reported behaviour, a peer's or a report's\n   claim?\
  \ Then CHECK IT against today's checkout BEFORE you cut the card. This is the cheapest\n\
  \   check in the lifecycle and the one nobody makes: the premise arrives with the\
  \ request, so it\n   reads as given rather than as something to verify.\n   **Which\
  \ seam this is, and why the existing ones do not reach it.** This cue fires BEFORE\
  \ A\n   CARD EXISTS. The two premise disciplines already in the corpus are both\
  \ DOWNSTREAM and stay\n   where they are (pointers, not restated here — SPEC-0005\
  \ rule 3): SPEC-0133 rule 2f owns the\n   PRE-CLAIM seam, where a dispatched worker\
  \ that finds a ready card's premise false refuses it\n   via `task refuse` — by\
  \ then the card was cut, queued and dispatched, and a whole worker\n   bootstrap\
  \ is spent to discover it; SPEC-0166 owns a narrower earlier pass, but its predicate\n\
  \   is `imported_from:`, so it reaches imported migration backlog only and says\
  \ nothing about a\n   card filed from a live request. Verifying at filing is what\
  \ makes the wasted card never get\n   cut at all.\n   **The shape to watch — the\
  \ fact holds, the LOCATOR rots.** A quoted LINE NUMBER goes stale the\n   moment\
  \ anything lands above it: nothing about the observation is wrong, only its address\
  \ moved,\n   which a reader cannot tell from the card. So cite what does not rot\
  \ (a symbol or `#anchor`, the\n   form `implements:` uses) or re-read the locator\
  \ at filing; and treat any \"as of today\" claim the\n   same way (the expiring-premise\
  \ arm of the evidence-availability cue in item 4 is this same\n   failure one stage\
  \ later).\n   An authoring PROMPT only: no card is refused for omitting it, and\
  \ nothing validates it — this\n   item is a checklist by construction (no card-completeness\
  \ validator — CHARTER non-goals), and\n   a filing suppressed here would cost more\
  \ than the premise it screened.\n   **The ONE place this item's thinking is MECHANICALLY\
  \ floored —** `task plan\n   --finalize` REFUSES a plan that never REFERENCES a\
  \ canonical `ACn` id, naming the uncovered\n   ids. A NECESSARY condition only —\
  \ the auditor still judges substance — so it floors the\n   scope↔plan relation\
  \ this item asks you to think through; it does not check it.\n   **The premise-verify\
  \ cue's own MECHANICAL FLOOR —** `task file` and `task update\n   --old/--new` (on\
  \ `scope`/`acceptance`) print two report-only lines,\n   `non-active spec cited\
  \ (advisory — filing not blocked)` and\n   `retired flag named (advisory — filing\
  \ not blocked)` (registry rows 12 + 13 in `## Implementation notes`), when a\n \
  \  cited or named spec resolves in the graph index to a non-active status\n   or\
  \ the card text names a retired `audit` CLI flag (SPEC-0204 rule 6) — the two premise\
  \ faults the\n   graph already knew at the filing. A NECESSARY condition only (status\
  \ and token, never\n   substance); filing is never blocked.\n4. **Acceptance WITH\
  \ probe (front-load thinking — OWNED here, load-bearing)** — does each criterion\n\
  \   name a probe (event / state / measurable effect)? \"code committed\" is NOT\
  \ \"done\" (done=adopted +\n   infra-adoption → CHARTER §P3/§P8). This IS the per-unit\
  \ verification artifact SPEC-0059's\n   readiness gate checks before Tests/Closure.\n\
  \   **THE ONE QUESTION (X-1403, 2026-09-14) — ask it of EVERY criterion before filing:\n\
  \   what would make this criterion impossible for a conforming run to satisfy?**\
  \ A criterion no\n   conforming 9-stage run can satisfy reads at audit as UNMET\
  \ WORK, never as the authoring defect it\n   is — so it burns audit passes, the\
  \ audit-loop ceiling, a worker halt and a re-dispatch that no\n   re-audit converts.\
  \ The named cues below are NOT a checklist that grows one narrow entry per\n   incident:\
  \ each is a WORKED EXAMPLE of this one question on one axis, and each carries its\
  \ own\n   provenance id in its own heading — that heading is the one place it is\
  \ listed. A new incident on\n   a new axis is added below as a worked example of\
  \ this question, never as a standalone rule. Having READ the family is not having\
  \ ASKED the question: X-1403 measured a controller the\n   read gate credited with\
  \ SPEC-0060 four times in one hour still writing two fresh violations — so\n   ask\
  \ it of the criterion in front of you, not of the list. An authoring PROMPT only:\
  \ no gate, no\n   advisory, no card is refused for omitting it.\n   **WORKED EXAMPLES\
  \ → SPEC-1021 (index).** A cue below that ends «→ worked example in the reference»\n\
  \   keeps here only its lead: the heading with the provenance ids where it has one,\
  \ and the question or\n   instruction that states the cue. The whole block — that\
  \ lead again, the measured cases, the failing\n   and the passing wordings, what\
  \ to write instead — is in the reference spec SPEC-1021 (`graph query\n   SPEC-1021`),\
  \ section «Worked examples of the one question», under the same lead. Fetch it when\
  \ the\n   criterion in front of you has the shape that cue names, or when you are\
  \ not sure. A new block of\n   this kind is authored there, with its lead added\
  \ here (SPEC-0005 §6).\n   **Give each criterion a leading `ACn` token —** that\
  \ token is the criterion's\n   CANONICAL id, and `task plan --finalize` REFUSES\
  \ a plan that never references one, naming the\n   uncovered ids (a necessary condition\
  \ only). A tokenless entry still gets an id, assigned BY\n   POSITION — which moves\
  \ when the list is reordered, so the explicit token is what makes the id\n   stable\
  \ across the card's life. **Audit-post verifiability (additive)** —\n   each criterion\
  \ must be VERIFIABLE AT AUDIT-POST from the shipped diff + the surfaced\n   journal-evidence\
  \ sections; do NOT write a criterion that references the audit-pre verdict (or any\n\
  \   audit-record file) — those are EXCLUDED from the audit-post diff and structurally\n\
  \   unverifiable there (the recurring false-RED class). A residual surfaced at audit-pre\
  \ is\n   discharged AT audit-pre (mode-b absorption → LIFECYCLE §Stage 4), never\
  \ deferred to an\n   audit-post-checked closure criterion.\n   **Triggered-mechanism\
  \ cue (X-0089) —** does the card ship a mechanism whose success depends on an\n\
  \   external trigger firing (scheduler/hook/event/periodic)? Then `class:infra`\
  \ + a live-trigger/\n   synthetic-load probe, NOT a direct-call unit test (rule\
  \ home → CHARTER §P8 + SPEC-0036 audit-post\n   overlay).\n   **Differential-probe\
  \ cue (X-0246) —** would this criterion still pass if the thing under test were\n\
  \   BROKEN? If yes it is a smoke check, not a probe — name the input that must make\
  \ it FAIL (rule home\n   → CHARTER §P3 done=adopted). An authoring PROMPT only:\
  \ no card is refused for omitting it.\n   **Cohort-complement cue (X-0419) —** does\
  \ this card REMEDIATE a cohort its fix SELECTS (a filter, a\n   fence, a WHERE clause,\
  \ an id list)? Then probe the COMPLEMENT, not only the selected set: name what\n\
  \   the selector EXCLUDES and why that exclusion is right. A card that probes only\
  \ its own selector is\n   green by construction — it cannot see the rows its own\
  \ fence silently dropped (rule home → CHARTER\n   §P3 done=adopted: what is adopted\
  \ is the OUTCOME, not the selector). An authoring PROMPT only: no\n   card is refused\
  \ for omitting it.\n   **Cited-desired-exclusion cue (X-0419) —** does a criterion\
  \ assert an exclusion is DESIRED (a\n   NEGATIVE probe — \"these stay excluded\"\
  \ / \"this stays absent\")? Then CITE the artifact or\n   owner-decision that DECIDED\
  \ that exclusion. An uncited negative probe encodes the AUTHOR'S\n   ASSUMPTION\
  \ as an executable green guarantee — and the assumption outlives the author (rule\
  \ home →\n   CHARTER §P3 + SPEC-0005 rule 3 content-boundary: a claim resolves to\
  \ the home that decided it, or\n   it is not a decided claim yet). An authoring\
  \ PROMPT only: no card is refused for omitting it.\n   **Test-or-waive cue —** does\
  \ each criterion NAME the executable test that verifies it (a\n   test path or a\
  \ pinned-suite test id) OR carry an explicit waive `test-not-applicable:` when the\n\
  \   criterion is genuinely verified another way (a `graph query` state-check, an\
  \ event emit)? An AC\n   that names NEITHER is a claim with no named verifier —\
  \ \"done\" is asserted with nothing that runs\n   to prove it. The waive's form\
  \ and fields are SPEC-0165 item 4's (one home); a bare marker with no\n   reason\
  \ still counts as unnamed. `task file` surfaces the per-AC status as the report-only\n\
  \   `AC test/waive status (advisory — filing not blocked)` line, and a waive missing\
  \ an item-4 key on\n   the `AC waive fields (advisory — filing not blocked)` line\
  \ (registry row 9 in `## Implementation notes`). An authoring PROMPT only: no card\
  \ is\n   refused for omitting it (rule home → this item + CHARTER §P3 done=adopted).\n\
  \   **Born-armed-carrier cue —** does a criterion defer work to a FOLLOW-UP (a CHARTER\
  \ §P8\n   adoption carrier, a staged dodelka) whose firing moment is a NAMEABLE\
  \ artifact — a task or\n   coordination id whose closure IS that moment? Then capture\
  \ it BORN ARMED, `followup add --trigger\n   '<the moment>' --awaits <T-NNNN|X-NNNN>`,\
  \ never with the wait written as prose: a prose wait lands\n   in the actionable\
  \ headline and reads as do-now for as long as it is open. Leave it ACTIONABLE only\
  \ when nothing resolvable names the moment — an event class fires\n   on MEMBERSHIP,\
  \ so a «next occurrence of <type>» wait has no artifact at all. `followup\n   add`\
  \ surfaces this itself as a report-only advisory when the capture text names a still-open\n\
  \   reference. **First ask WHOSE journal the moment lands in (owner ruling 2026-09-04):**\
  \ a\n   KERNEL-side moment takes the armed followup above, while a CONSUMER-side\
  \ one — the next deploy,\n   run or reading in ANOTHER project — cannot be carried\
  \ by a followup here at all and routes as a\n   `cross request --kind task --to\
  \ <consumer>` asking that project to arm its own followup and\n   report the reading\
  \ back, with at most ONE followup on this side armed on the resulting `X-NNNN`.\n\
  \   An authoring PROMPT only: no card is refused for omitting it (rule home → SPEC-0095\
  \ §Armed).\n   **How a named test is RECOGNIZED is not this item's rule —** a project\
  \ that declares where its\n   test files live is read from that declaration, and\
  \ the kernel's own filename pattern is only\n   the fail-open default for a project\
  \ that declares none (rule home → SPEC-0185 half (c) + §2a;\n   the declarable carrier\
  \ is `tests.classes[].globs`, shape owned by SPEC-0160 rule 10).\n   **The named\
  \ verifier is NOT the P8 adoption-evidence payload —** the test this cue asks\n\
  \   you to NAME is the criterion's VERIFIER: what RUNS to prove the AC. That is\
  \ a DIFFERENT slot from\n   the CHARTER §P8 adoption-evidence event a `class: infra`\
  \ closure composes, whose payload has its\n   own admissibility contract — SPEC-0015\
  \ §\"The EVENT carrier must resolve machine evidence + a\n   differential\" owns\
  \ it, and the test run's journal trace is not among what it admits (not restated\n\
  \   here — P5). So naming a test path in an AC is always legitimate, but do NOT\
  \ write a criterion that\n   DEMANDS the P8 payload REFERENCE that test's run: it\
  \ is unsatisfiable by construction, green\n   nowhere, and reads at audit-post as\
  \ an unmet AC rather than an authoring defect. When a criterion needs\n   adoption\
  \ evidence, point the payload at the MECHANISM's own production event; the named\
  \ test stays\n   the verifier alongside it.\n   **Conforming-run satisfiability\
  \ cue (X-1054) —** does a criterion constrain the SHAPE OF THE DIFF\n   (\"the diff\
  \ touches only `<file>`\" / \"any file outside `<path>` fails this\")? Then ask\
  \ whether a\n   CONFORMING 9-stage run could satisfy it AS WRITTEN. As a bare shape\
  \ it cannot → worked example in\n   the reference.\n   **Deferred-proof ordering\
  \ cue —** can this criterion's proof exist BEFORE\n   this card's OWN land? Ask\
  \ it of every criterion whose evidence is a live reading, an adoption\n   trace,\
  \ or anything a RUN produces. When the answer is NO — the proof is produced by a\
  \ LATER\n   land, by production traffic, or by this card's own closure — the criterion\
  \ is not a bare\n   deferred probe and must not be written as one: audit-post reads\
  \ a structurally-impossible\n   absence as an UNMET AC rather than as the ordering\
  \ fact it is, and the card burns passes that\n   no re-audit can convert. Carry\
  \ it instead as one of\n   the SPEC-0028 OPTIONAL deferred-proof DECLARATIONS —\
  \ the family each of whose members is the\n   trust anchor of its own Stage-8 `audit\
  \ post` carve-out, so the absence is told to the auditor\n   as the NORMAL ordering\
  \ for that ship (rule home → SPEC-0028's field catalog for the forms,\n   SPEC-0036\
  \ for the matching overlays; nothing about them is restated here). Point at the\n\
  \   FAMILY and pick the member whose shape fits — and treat a shape NO member fits\
  \ as the finding\n   to capture, never a declaration to improvise. An authoring\
  \ PROMPT only: no card is refused for\n   omitting it.\n   **Evidence-availability\
  \ cue —** at the moment someone READS this criterion,\n   will the record it names\
  \ still NAME ITS SUBJECT? Two limbs, one question.\n   Limb (a), the record does\
  \ not name it YET (ordering) — is the proof emitted by `land` at Stage 9\n   (a\
  \ `land_completed` row, a `cross_done` row, a land-stamped field)? Then naming the\
  \ right\n   ARTIFACT is not enough: the Stage-8 overlay admits the carve-out only\
  \ for evidence the acceptance\n   ties to land IN WORDS, so WRITE THE TIE. Example\
  \ phrasings the guard reads —\n   [ \"land-emitted\" | \"emitted by `land`\" | \"\
  at land\" | \"after this lands\" | \"once it lands\" |\n   \"when this landed\"\
  \ ] — any one of them, in the same acceptance entry that names the event token.\n\
  \    AC3 named the `land_completed` row (the RIGHT artifact) with no such tie, `audit\
  \ post\n   --land-emitted-event` refused fail-closed, and clearing it cost a governed\
  \ acceptance amendment\n   plus a further audit round-trip on a card already at\
  \ its audit-loop ceiling. The fix is always\n   the wording, NEVER a request to\
  \ widen the matcher to fit it: naming WHICH evidence is pending is\n   the whole\
  \ reason the carve-out is not a blanket excuse (rule home → the guard and its phrase\
  \ set\n   at `bin/lib/audit.py#land_emitted_named_evidence`, the overlay at SPEC-0036;\
  \ neither is\n   restated here beyond the examples above).\n   AND THE TIE IS ONLY\
  \ HALF — THE ENTRY MUST ALSO NAME THE EVENT TOKEN. The guard admits on TWO\n   things\
  \ present in the SAME acceptance entry: a phrase from the set above, AND the snake_case\n\
  \   EVENT TOKEN that carries the proof. (One alternative shape, and only one: an\
  \ `X-NNNN`\n   coordination id the acceptance names that the card ALSO carries in\
  \ `resolves_cross` — that\n   link is what makes `land` emit the item's closing\
  \ row, so it is a STRUCTURAL land-tie and\n   needs no phrase.) Name NEITHER shape\
  \ and the guard returns nothing, `audit post\n   --land-emitted-event` refuses FAIL-CLOSED,\
  \ and the base audit-post REDs on evidence that could\n   not exist yet. **So an\
  \ acceptance criterion whose proof is LAND-EMITTED must NAME THE EVENT\n   TOKEN\
  \ CARRYING IT.** The why is not decorative, and it is the reason this is an obligation\n\
  \   rather than a style note: the overlay that would rescue such a criterion can\
  \ only match a\n   NAME, so a criterion it cannot match is UNSATISFIABLE BY CONSTRUCTION\
  \ — the Stage-8 audit REDs\n   on the absent evidence, and that RED blocks the very\
  \ land that would have produced it. No\n   execution order satisfies it and no re-audit\
  \ converts it.\n   **DO NOT read this as \"do not write land-emitted criteria\"\
  .** They are legitimate and in\n   routine use, and the whole deferred-proof declaration\
  \ family exists to carry them. What is\n   forbidden is a land-emitted criterion\
  \ that names NO carrier — the naming is precisely what\n   keeps the carve-out narrow\
  \ instead of a blanket excuse, so a rule banning the pattern would\n   remove real\
  \ coverage rather than fix the shape.\n   **Worked NEGATIVE example, beside the\
  \ wording that would have passed** — AC4. → worked\n   example in the reference.\n\
  \   An authoring PROMPT only: no card is refused for omitting it, and nothing validates\
  \ it.\n   Limb (b), the record STOPS naming it ON SUCCESS — two questions to ask\
  \ at the keyboard: does this\n   record DROP my subject once it improves? is this\
  \ number DOMINATED by something my change cannot\n   move? → worked example in the\
  \ reference.\n   **Durable-field cue —** NAME THE FIELD that will carry this\n \
  \  criterion's proof, and check it EXISTS on the side you need it. Not the artifact,\
  \ not the record —\n   the FIELD, written out, at the keyboard, before the card\
  \ is filed. Three arms, one question. Arm 1,\n   the BEFORE side is empty BY CONSTRUCTION\
  \ — a before/after comparison against a metric key THIS\n   CHANGE INTRODUCES has\
  \ zero rows on its before side the moment it is written. Arm 2, NO TRACE — the\n\
  \   proof is a production observation whose surface is never journaled. Arm 3, the\
  \ PREMISE EXPIRES when\n   someone touches the thing it names. The remedy is always\
  \ the same one sentence: name the field, and\n   say what is on the before side.\
  \ Where no such field exists, that is the finding — pick a different\n   probe,\
  \ or make the one-line change that creates the field, and say which. → worked example\
  \ in the\n   reference.\n   **Sibling-forbidden absolute cue —** does a criterion\
  \ demand an ABSOLUTE (a\n   count \"drops to zero\", \"no more X\", \"never again\"\
  ) that a SIBLING criterion on the SAME card\n   REQUIRES to keep happening? Read\
  \ the card's own criteria against each other before filing: an\n   absolute is settleable\
  \ only over the population its siblings leave free. → worked example in the\n  \
  \ reference.\n   **Subject-mismatched metric cue —** does the number a criterion\
  \ names measure\n   the SUBJECT this change acts on, or a wider transaction that\
  \ contains it? Ask it of every duration,\n   rate or aggregate. → worked example\
  \ in the reference.\n   **Observable-matches-mechanism cue (X-1277) —** is the OBSERVABLE\
  \ this criterion names one\n   the shipped mechanism PRODUCES? Name the OUTPUT the\
  \ mechanism WRITES — a classification, a marker, a\n   row, a field value — never\
  \ a DOWNSTREAM EFFECT the mechanism does not perform (a line VANISHING, a\n   count\
  \ DROPPING, a debt CLEARING) unless the card ALSO ships what performs it. **Worked\
  \ NEGATIVE\n   example, beside the wording that would have passed** — AC3. → worked\
  \ example in the\n   reference.\n   **Reachable-population quantifier cue —** does\
  \ a criterion conjoin an outcome\n   with a UNIVERSAL over a population (\"… AND\
  \ EVERY remaining one carries X\")? Then ask which members\n   of that population\
  \ THIS change actually reaches. → worked example in the reference.\n   **External-territory\
  \ probe cue —** is the evidence a criterion names produced in a\n   repository this\
  \ card may not write to (a consumer checkout — <project> / <project> / <project>)?\
  \ Then\n   it cannot be a probe from here, and saying \"out-of-scope\" in the criterion\
  \ text does not rescue it →\n   worked example in the reference.\n   **File-count\
  \ criterion cue —** does a criterion COUNT FILES in the diff (\"the\n   diff touches\
  \ exactly N file(s)\")? It is unsatisfiable for any task-flow card, whatever N →\
  \ worked\n   example in the reference.\n   **Worked example, axis A — the probe\
  \ names an instrument FORM the tool cannot answer (X-1403 /\n   <project>) —** does\
  \ a criterion name a command, verb, flag or query FORM? Then RUN IT ONCE\n   at\
  \ filing, against a known-good subject, before the card is cut. The probe reads\
  \ as obviously\n   correct prose, which is exactly why nobody runs it. Where the\
  \ form does not answer,\n   that is the finding: write the form that does, or route\
  \ the tool gap on its own card — never\n   leave the unanswerable form in the criterion.\
  \ An authoring PROMPT only: no card is refused for\n   omitting it.\n   **Worked\
  \ example, axis B — the criterion demands what an ACTIVE governing spec forbids\
  \ (X-1403 /\n   <project>) —** does a criterion, or the card's scope, demand something\
  \ on a surface\n   an ACTIVE spec governs? Then check the criterion AGAINST that\
  \ spec before filing — using the\n   read the existing read gate already delivered\
  \ (`graph query` it only when this session holds no\n   fresh read of it). An acceptance\
  \ criterion cannot override a\n   standing rule, and audit reads the conflict as\
  \ UNMET WORK, not as an authoring defect — the\n   auditor is right and the card\
  \ is wrong. Where the work genuinely needs the rule changed, that change\n   is\
  \ its own governed spec edit, ordered BEFORE the card via `requires:` — never carried\
  \ inside a\n   criterion. An authoring PROMPT only: no card is refused for omitting\
  \ it.\n   **Qualitative-outcome rule (2026-09-13 — this item is its SOLE home; every\
  \ derived\n   surface cites `from: SPEC-0060 item 4`).** An acceptance criterion\
  \ states the QUALITATIVE OUTCOME\n   observed through its probe. A NUMBER inside\
  \ it is EVIDENCE, never a pass/fail bar. A named\n   measurement does NOT turn a\
  \ decreed bound into a criterion — naming a command, a locator or a\n   baseline\
  \ beside «<= 90 s» still leaves a decreed threshold. An observed EXACT outcome that\
  \ happens\n   to be a count («zero delta», «exactly one row», «the same sha») stays\
  \ legal: the rule targets\n   DECREED thresholds, not observed outcomes. A number\
  \ not yet measured is written as «hypothesis»\n   and measured at Analysis. Where\
  \ two honest exits exist, both are named, and the\n   impossible/no-occurrence exit\
  \ records its measured cost and reason.\n   **Measured-bound cue (2026-09-08; re-scoped).**\
  \ The advisory below is a\n   report-only MISSING-NAMED-REFERENCE heuristic in service\
  \ of the rule above, never the rule: its\n   exemption forms (a `yitc-v2 <verb>`\
  \ command, an `events.jsonl#` locator, a spec id, a pytest node,\n   `baseline <value>`)\
  \ mix measurements with references and verifiers, so a match suppresses one\n  \
  \ advisory line and legalizes nothing. Its disposition says: rewrite the criterion\
  \ as the\n   qualitative outcome and record the number as evidence.\n   A bare «baseline»\
  \ / «measured» word exempts nothing — the value or the command must be there,\n\
  \   and a marker that GESTURES at a measurement without naming one exempts nothing\
  \ either: an empty\n   `(command:)`, a bare `events.jsonl#`, and an `events.jsonl#x`\
  \ that names no locator key all read\n   as UNMEASURED (narrowed at its audit-pre).\
  \ A journal locator exempts only in the form\n   `events.jsonl#ts=<value>` or `events.jsonl#source_ref=<value>`.\
  \ The bound itself may be SIGNED or\n   decimal — «delta <= -1 s» is a bound like\
  \ any other. The predicate fails CLOSED: over-narrowing\n   costs one advisory line\
  \ on an unusual locator form, over-widening restores the very false\n   exemption\
  \ the cue exists to close.\n   The status is surfaced as the report-only `AC measured-bound\
  \ status` block at BOTH authoring\n   seams — `task file` (beside the test/waive\
  \ block) and the governed `task update --old/--new`\n   field-edit that CHANGES\
  \ a card's `acceptance` (the verb has no `--acceptance` flag; field-edit\n   mode\
  \ is its only acceptance-writing route). One predicate, one printer, both seams\n\
  \   (`bin/lib/task.py#_ac_unmeasured_bounds` / `#_print_ac_measured_bound_status`).\
  \ An authoring\n   PROMPT only: no card is refused for omitting it.\n   **LIVE SIGNAL\
  \ (conditional authoring cue, not a gate) —, 2026-09-14.** If this card adds\n \
  \  or changes a mechanism that will keep running after closure and whose later failure\
  \ would matter\n   operationally—for example, a check, scheduled job, runtime path,\
  \ or verify layer—name in the\n   relevant acceptance criterion the durable signal\
  \ each run leaves or updates, the subject it\n   identifies, and the reader that\
  \ consumes it. If an apparently qualifying mechanism intentionally\n   needs no\
  \ live signal, give the mechanism-specific reason; omit this cue from all other\
  \ cards. Do\n   not use a bare ‘none’, create a store or cadence merely to satisfy\
  \ the cue, or turn an observed\n   number into a pass/fail bar. (Rule home → this\
  \ item; the closure probe and the Triggered-mechanism\n   cue above prove adoption\
  \ ONCE at closure — this names what LATER runs leave. Consult:\n   decisions/live-signal-task-authoring-2026-09-14-r3-audit-adhoc.yaml.)\n\
  5. **One provable claim?** — would this card prove >1 claim (then it should have\
  \ been SPLIT)? The\n   cut itself is an ANALYSIS decision (cut-by-one-claim / `requires:`-order\
  \ / verifier-after-settled\n   → SPEC-0046); filing only RECORDS the already-decided\
  \ cut, never re-opens it.\n6. **Cites** — related ids noted as context? (`cites:`\
  \ is informational; a blocking prerequisite is\n   `requires:` → QUEUE §Picker.)\n\
  \   **Under-citation cue (widened) — two halves, a MISSING cite AND a cite you never\n\
  \   opened.** (a) MISSING: does the card DECLARE (via `expected_touch`) a concrete\
  \ surface an ACTIVE\n   spec governs, without citing that spec? Then cite it — the\
  \ governing rule is the context the\n   picked-up Analysis needs. (b) PRESENT-BUT-UNREAD:\
  \ where a scope line or a criterion RESTS on a rule\n   you DO cite, did you OPEN\
  \ that rule and quote the clause verbatim — or write from what you remember\n  \
  \ it says? Author from the clause, never from a paraphrase, INCLUDING our own handbook's\
  \ paraphrase of\n   it: a citation you did not open reads as grounding while carrying\
  \ your remembered version, which can\n   be the rule INVERTED. What the cited\n\
  \   rule actually says is never restated here — open its OWN home (`graph query\
  \ <id>`), which is the\n   only text that cannot be stale. `task file` surfaces\
  \ half (a) as a report-only UNDER-CITATION\n   advisory (see `## Implementation\
  \ notes`); that advisory detects a missing cite, NOT a contradiction, and it\n \
  \  is unchanged by this widening — half (b) has NO detector and is yours to run\
  \ while authoring. An\n   authoring PROMPT only: no card is refused for either half,\
  \ and a deliberate non-cite is legitimate\n   (ack it via `task update --note`).\n\
  7. **Effort tier (stakes)** — is this change irreversible / wide-blast / critical?\
  \ Mark it\n   `--critical` (else the `normal` default). It is the one sizing judgment\
  \ you already make, and it\n   routes the background-dispatch worker's model/effort\
  \ by STAKES (rule → SPEC-0072; schema → SPEC-0028).\n   **One judgment, two names\
  \ (the stakes↔effort vocabulary):** the stakes tier you set here\n   (`normal` /\
  \ `critical`) IS what dispatch then shows as the worker's effort (`normal`→`low`,\n\
  \   `critical`→`high`) — so `effort=low (tier=normal)` in dispatch output is that\
  \ 1:1 map, NOT a\n   third level. Choose by STAKES (irreversible / wide-blast →\
  \ `critical`), NOT by how hard the work\n   looks (full mapping + the route-by-stakes-not-difficulty\
  \ rule → SPEC-0072 §4; pointer, not\n   restated here — P5).\n8. **Queue-jump mark\
  \ (only when the card's own PURPOSE is to clear the congestion)** — is THIS card\n\
  \   the change that REMOVES a land-admission blockage? Then set the mark AT FILING,\
  \ naming the\n   blockage: `task update --queue-jump <reason>` (field `queue_jump`;\
  \ mechanism → SPEC-0184 rule 9,\n   not restated here — P5). Setting it later, once\
  \ the card is already stuck behind the very queue it\n   fixes, is the failure this\
  \ prompt exists to catch.\n   **The trigger is PURPOSE, never urgency — read yourself\
  \ OUT of it if you are merely impatient.**\n   Ordinary work that merely happens\
  \ to be stuck behind a queue is NOT this: it is the common case,\n   and using an\
  \ EMERGENCY lane for convenience is how an emergency lane stops meaning anything.\
  \ Ask\n   what the card DOES, not how long it has waited: it qualifies only if landing\
  \ it is what\n   un-congests the queue.\n   An authoring PROMPT only: no card is\
  \ refused for omitting it, and nothing detects the trigger for\n   you — the mark\
  \ stays opt-in and author-judged (an automatic «this card unblocks lands» detector\n\
  \   would be a behavioural detector, a CHARTER non-goal).\n\n### A post-land proof\
  \ is DECLARED, never CLAIMED\nWhen a criterion's proof lands AFTER the ship, the\
  \ card must SAY SO where the machinery reads it —\nan authoring PROMPT, not a gate.\
  \ Name the declaration that carries the deferral:\n- a multi-day production reading\
  \ → `post_ship_observation: {observation, due_by}` (SPEC-0028).\n**NAME THE CRITERION\
  \ IN THE OBSERVATION TEXT** (`observation: \"AC3: <the reading>\"`): the\ndeclaration\
  \ is card-level, so the packet maps it to a criterion ONLY when the declaration\
  \ says\nwhich one — deterministically, never by guessing from prose. An unnamed\
  \ declaration still renders\n(as card-level, judged against the acceptance as a\
  \ whole) and is never wrong; a NAMED one is what\nmakes the exemption criterion-exact.\
  \ Name it when you declare it: the no-re-write bound\nmeans a declaration cannot\
  \ later be edited to add the name;\n- an event `land` itself emits at Stage 9 →\
  \ NAME the event token in the acceptance entry;\n- a proof settled later by verb\
  \ → say `--settle-probe` / `--settle-observation` in the criterion;\n- a FIRST-REAL-USE-AFTER-LANDING\
  \ observation → declare it AT FILING on `probe_moments:` (below).\nThen CLOSE that\
  \ criterion `--probe-deferred`, never `pass`: `task close` writes\n`probe_passed:\
  \ deferred` while any probe is undischarged, and the settle verb flips it to `true`\n\
  when the last one is discharged (SPEC-0015 §`probe_passed` is THREE-STATE).\n\n\
  WHY it is worth the sentence. A DECLARED deferral is rendered to the auditor as\n\
  `### DEFERRED BY DECLARATION` and its absence is then EXPECTED — never a finding,\
  \ never a RED\n(SPEC-0036). An UNDECLARED one is indistinguishable from missing\
  \ evidence, and the auditor is right\nto red it. The declaration is what\nmakes\
  \ «not yet» legible as an ordering rather than a gap — and a deferral that names\
  \ no reading, no\ndue date and no settle carrier is still a defect, so declaring\
  \ is not a way to promise less.\n\n### A FIRST-REAL-USE-AFTER-LANDING criterion\
  \ is a DEFERRED PROBE from the moment it is FILED\nThe section above says a post-land\
  \ proof is declared. THIS says WHEN, for the one shape whose\nproof is IMPOSSIBLE\
  \ before the land by its own wording: an acceptance criterion whose probe is a\n\
  FIRST REAL USE AFTER LANDING — «the first real session start after landing prints\
  \ the table»,\n«the first real dispatch after landing carries a composed brief»,\
  \ «the first real `audit pre\n--on-decisions` after landing invokes the auditor».\
  \ Such a criterion **MUST be declared a\ndeferred probe AT FILING**, not at close:\n\
  \n- **WHERE — the EXISTING carrier, no new field:** `probe_moments: {ACn: {awaits:\
  \ <moment>}}`\n  (schema home SPEC-0028, written until now only by `task close --probe-deferred`).\
  \ The moment is\n  admitted by the ONE grammar the corpus already has — an ISO `due_by`\
  \ date, or an `awaits:` ref\n  (`` / `X-0042` / `events.jsonl#type=<t>[@after=<ISO>]`,\
  \ or — preferred for this shape, since\n  any `<ISO>` a card writes predates its\
  \ own land — `events.jsonl#type=<t>@after=land`, the first row\n  after THIS card's\
  \ own `land_completed`) — so a moment the card declares is\n  one a reader can decide,\
  \ by construction.\n- **WHAT the criterion's own TEXT must say:** name the settling\
  \ verb, `task close --settle-probe`.\n  A moment with no settle carrier is still\
  \ a defect (§A post-land proof is DECLARED, above).\n- **The key must be a criterion\
  \ THIS CARD HAS.** A `probe_moments` key naming no acceptance\n  criterion of this\
  \ card declares nothing and is read as absent — the same namespace admission\n \
  \ close-time probe keys already take. An orphan declaration must never widen an\
  \ exemption.\n\n**What the declaration BUYS, and its exact bound.** The packet renders\
  \ declared deferred probes\nunder `### DEFERRED PROBES — settled after landing by\
  \ the Controller` at BOTH task stage overlays,\nand the RED parse floor REFUSES\
  \ a RED whose ONLY findings are P8-adoption-class against a DECLARED\ncriterion\
  \ — no pass spent, no record written (SPEC-0036, the reading home; the rule is not\
  \ restated\nhere). It buys NOTHING ELSE: a RED carrying any other finding is recorded\
  \ unchanged, a P8 finding\nagainst an UNDECLARED criterion is judged exactly as\
  \ today, and whether the declaration actually\ncorresponds to the criterion it defers\
  \ stays the auditor's to judge. Declaring is not a way to\npromise less.\n\n**Why\
  \ at FILING and not at close.** The whole deferred-probe vocabulary is otherwise\
  \ written at\nCLOSE — after both audits have run — so both audits RED-flag the criterion\
  \ for a finding that is\nnever a defect. Declaring at filing costs one authoring\
  \ line and is read by both audits.\n\n**`task file` SURFACES it, and never gates\
  \ it.** The skeleton carries the `probe_moments:` prompt\nbeside the acceptance\
  \ block, and `task file` prints a REPORT-ONLY warning naming any acceptance\ncriterion\
  \ whose text reads first-real-use-after-landing while no probe moment is declared\
  \ for it.\nReport-only means exactly that: no exit code moves, nothing is written,\
  \ and a card files unchanged.\nAn author who judges the sniff wrong simply proceeds.\n\
  \n### The fillable skeleton (what `task file` seeds)\n`task file` seeds the card\
  \ with comment-PROMPTS for the non-obvious fields — scope (the three\nquestions\
