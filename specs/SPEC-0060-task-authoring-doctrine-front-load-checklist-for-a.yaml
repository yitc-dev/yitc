  \   the change that REMOVES a land-admission blockage? Then set the mark AT FILING,\
  \ naming the\n   blockage: `task update --queue-jump <reason>` (field `queue_jump`;\
  \ mechanism → SPEC-0184 rule 9,\n   not restated here — P5). Setting it later, once\
  \ the card is already stuck behind the very queue it\n   fixes, is the failure this\
  \ prompt exists to catch.\n   **The trigger is PURPOSE, never urgency — read yourself\
  \ OUT of it if you are merely impatient.**\n   Ordinary work that merely happens\
  \ to be stuck behind a queue is NOT this: it is the common case,\n   and using an\
  \ EMERGENCY lane for convenience is how an emergency lane stops meaning anything.\
  \ Ask\n   what the card DOES, not how long it has waited: it qualifies only if landing\
  \ it is what\n   un-congests the queue.\n   An authoring PROMPT only: no card is\
  \ refused for omitting it, and nothing detects the trigger for\n   you — the mark\
  \ stays opt-in and author-judged (an automatic «this card unblocks lands» detector\n\
  \   would be a behavioural detector, a CHARTER non-goal).\n\n### A post-land proof\
  \ is DECLARED, never CLAIMED\nWhen a criterion's proof lands AFTER the ship, the\
  \ card must SAY SO where the machinery reads it —\nan authoring PROMPT, not a gate.\
  \ Name the declaration that carries the deferral:\n- a multi-day production reading\
  \ → `post_ship_observation: {observation, due_by}` (SPEC-0028).\n**NAME THE CRITERION\
  \ IN THE OBSERVATION TEXT** (`observation: \"AC3: <the reading>\"`): the\ndeclaration\
  \ is card-level, so the packet maps it to a criterion ONLY when the declaration\
  \ says\nwhich one — deterministically, never by guessing from prose. An unnamed\
  \ declaration still renders\n(as card-level, judged against the acceptance as a\
  \ whole) and is never wrong; a NAMED one is what\nmakes the exemption criterion-exact.\
  \ Name it when you declare it: the no-re-write bound\nmeans a declaration cannot\
  \ later be edited to add the name;\n- an event `land` itself emits at Stage 9 →\
  \ NAME the event token in the acceptance entry;\n- a proof settled later by verb\
  \ → say `--settle-probe` / `--settle-observation` in the criterion;\n- a FIRST-REAL-USE-AFTER-LANDING\
  \ observation → declare it AT FILING on `probe_moments:` (below).\nThen CLOSE that\
  \ criterion `--probe-deferred`, never `pass`: `task close` writes\n`probe_passed:\
  \ deferred` while any probe is undischarged, and the settle verb flips it to `true`\n\
  when the last one is discharged (SPEC-0015 §`probe_passed` is THREE-STATE).\n\n\
  WHY it is worth the sentence. A DECLARED deferral is rendered to the auditor as\n\
  `### DEFERRED BY DECLARATION` and its absence is then EXPECTED — never a finding,\
  \ never a RED\n(SPEC-0036). An UNDECLARED one is indistinguishable from missing\
  \ evidence, and the auditor is right\nto red it. The declaration is what\nmakes\
  \ «not yet» legible as an ordering rather than a gap — and a deferral that names\
  \ no reading, no\ndue date and no settle carrier is still a defect, so declaring\
  \ is not a way to promise less.\n\n### A FIRST-REAL-USE-AFTER-LANDING criterion\
  \ is a DEFERRED PROBE from the moment it is FILED\nThe section above says a post-land\
  \ proof is declared. THIS says WHEN, for the one shape whose\nproof is IMPOSSIBLE\
  \ before the land by its own wording: an acceptance criterion whose probe is a\n\
  FIRST REAL USE AFTER LANDING — «the first real session start after landing prints\
  \ the table»,\n«the first real dispatch after landing carries a composed brief»,\
  \ «the first real `audit pre\n--on-decisions` after landing invokes the auditor».\
  \ Such a criterion **MUST be declared a\ndeferred probe AT FILING**, not at close:\n\
  \n- **WHERE — the EXISTING carrier, no new field:** `probe_moments: {ACn: {awaits:\
  \ <moment>}}`\n  (schema home SPEC-0028, written until now only by `task close --probe-deferred`).\
  \ The moment is\n  admitted by the ONE grammar the corpus already has — an ISO `due_by`\
  \ date, or an `awaits:` ref\n  (`` / `X-0042` / `events.jsonl#type=<t>[@after=<ISO>]`,\
  \ or — preferred for this shape, since\n  any `<ISO>` a card writes predates its\
  \ own land — `events.jsonl#type=<t>@after=land`, the first row\n  after THIS card's\
  \ own `land_completed`) — so a moment the card declares is\n  one a reader can decide,\
  \ by construction.\n- **WHAT the criterion's own TEXT must say:** name the settling\
  \ verb, `task close --settle-probe`.\n  A moment with no settle carrier is still\
  \ a defect (§A post-land proof is DECLARED, above).\n- **The key must be a criterion\
  \ THIS CARD HAS.** A `probe_moments` key naming no acceptance\n  criterion of this\
  \ card declares nothing and is read as absent — the same namespace admission\n \
  \ close-time probe keys already take. An orphan declaration must never widen an\
  \ exemption.\n\n**What the declaration BUYS, and its exact bound.** The packet renders\
  \ declared deferred probes\nunder `### DEFERRED PROBES — settled after landing by\
  \ the Controller` at BOTH task stage overlays,\nand the RED parse floor REFUSES\
  \ a RED whose ONLY findings are P8-adoption-class against a DECLARED\ncriterion\
  \ — no pass spent, no record written (SPEC-0036, the reading home; the rule is not\
  \ restated\nhere). It buys NOTHING ELSE: a RED carrying any other finding is recorded\
  \ unchanged, a P8 finding\nagainst an UNDECLARED criterion is judged exactly as\
  \ today, and whether the declaration actually\ncorresponds to the criterion it defers\
  \ stays the auditor's to judge. Declaring is not a way to\npromise less.\n\n**Why\
  \ at FILING and not at close.** The whole deferred-probe vocabulary is otherwise\
  \ written at\nCLOSE — after both audits have run — so both audits RED-flag the criterion\
  \ for a finding that is\nnever a defect. Declaring at filing costs one authoring\
  \ line and is read by both audits.\n\n**`task file` SURFACES it, and never gates\
  \ it.** The skeleton carries the `probe_moments:` prompt\nbeside the acceptance\
  \ block, and `task file` prints a REPORT-ONLY warning naming any acceptance\ncriterion\
  \ whose text reads first-real-use-after-landing while no probe moment is declared\
  \ for it.\nReport-only means exactly that: no exit code moves, nothing is written,\
  \ and a card files unchanged.\nAn author who judges the sniff wrong simply proceeds.\n\
  \n### The fillable skeleton (what `task file` seeds)\n`task file` seeds the card\
  \ with comment-PROMPTS for the non-obvious fields — scope (the three\nquestions\
  \ of item 3) and acceptance+probe (item 4) — mirroring SPEC-0043's plan skeleton.\
  \ The\nprompts are authoring aids, not gates; an experienced author overwrites them.\
  \ The skeleton's base\nfield set is owned by `_template.yaml` + the SPEC-0028 schema\
  \ — this spec only says WHICH prompts\nfront-load the thinking, not the field list.\n\
  \n### Replacement map (what this spec owns vs what it must NOT duplicate — D2, P5\
  \ one-home)\n- **OWNS:** the authoring DOCTRINE (what a good card front-loads) +\
  \ the skeleton-prompt intent. The\n  role was previously SPLIT across SPEC-0028\
  \ (schema) + SPEC-0046 (shape) with no single\n  \"how to write a good task\" home;\
  \ this spec is that home (the SPEC-0043 analog).\n- **Does NOT own (pointers only):**\
  \ SPEC-0028 stays the field-catalog/schema; SPEC-0046 stays\n  decomposition/cutting;\
  \ CHARTER §P3/§P8 stays done=adopted + infra-adoption. Any overlapping\n  AUTHORING\
  \ prose in those homes is deleted/pointerized into this one on activation.\n\n###\
  \ Delivery wiring (WIRED by — the activation owner)\nPer SPEC-0059's Filing carve-out:\
  \ the doctrine is delivered as a session-start REFERENCE pointer\n(availability\
  \ — `bin/yitc-v2#_filing_reference_howto`, printed by `cmd_session_start`, generated\n\
  from the Filing stage bundle), and the `task file` work-verb CHECKS it was read\
  \ before writing the\ncard (`cmd_task_file` calls `_require_reads(\"stage\", {stage:\
  \ Filing})`). `task file --skeleton`\nemits the fillable skeleton (`_emit_task_skeleton`,\
  \ reusing `tasks/_template.yaml`). `binding:`\n(stage-entry:Filing) / `implements:`\
  \ are finalized above. No new read verb is added (the existing\n`_require_reads`\
  \ lever, SPEC-0050). The check goes live when this task closes (active-only binding).\n\
  \n**The task-file advisory line REGISTRY — what `task file` prints, and who owns\
  \ each line.**\nA DELIVERY REGISTRY, not a rule family: it records WHICH advisory\
  \ lines `cmd_task_file` prints and\nWHERE each line's semantics are homed. It deliberately\
  \ does NOT claim this spec owns all of them —\nthe thirteen lines answer different\
  \ questions and keep different homes. The blanket reading\n\"filing previews → SPEC-0044\"\
  \ is contradicted by this split, as is any reading that SPEC-0060 owns\nthe whole\
  \ family.\n\n| # | enumerated key (line prefix) | anchor (`bin/lib/task.py`) | shipped\
  \ | semantics homed in |\n|---|---|---|---|---|\n| 1 | `preview (advisory — claim-moment\
  \ screen re-checks): <SAFE\\|WAIT\\|CLASH\\|CLAIMED>` | `_declared_surface_preview`\
  \ | | **SPEC-0044 §2.2** (pointer — see below) |\n| 2 | `sibling-task overlap (advisory\
  \ — filing not blocked)` | `_print_sibling_task_overlap` | | this spec |\n| 3 |\
  \ `followup overlap (advisory — filing not blocked)` | `_print_followup_overlap`\
  \ | | this spec |\n| 4 | `deviation overlap (advisory — filing not blocked)` | `_print_capture_overlap`\
  \ | | this spec |\n| 5 | `cross-item overlap (advisory — filing not blocked)` |\
  \ `_print_cross_overlap` | | this spec |\n| 6 | `under-citation preview (advisory\
  \ — filing not blocked)` | `_print_undercitation_preview` | | this spec (detailed\
  \ below) |\n| 7 | `in-flight intent overlap (advisory — not blocked)` | `_print_inflight_intent_overlap`\
  \ | | this spec |\n| 8 | `already-linked (advisory — filing not blocked)` | the\
  \ `_auto_cross_pick_for_file` call-site | | **SPEC-0086** (the intake-hygiene rule\
  \ — pointer) |\n| 9 | `AC test/waive status (advisory — filing not blocked)` | `_print_ac_test_waive_status`\
  \ | | this spec (item 4 — each AC names a test or an explicit waive) |\n| 10 | `stranded-filing\
  \ (advisory — filing NOT blocked)` | `_print_stranded_filing_advisory` | | **AGENTS-SESSIONS\
  \ §Writes happen in a worktree** (pointer — the filing-is-not-executing hand-off)\
  \ |\n| 11 | `AC measured-bound status (advisory — filing not blocked)` | `_print_ac_measured_bound_status`\
  \ — fired at BOTH authoring seams: `task file` (via `_print_ac_test_waive_status`)\
  \ and the `task update --old/--new` field-edit that changes `acceptance` | | this\
  \ spec (item 4 — the Measured-bound cue: a missing-named-reference heuristic serving\
  \ the qualitative-outcome rule; a named measurement legalizes no bound) |\n| 12\
  \ | `non-active spec cited (advisory — filing not blocked)` | `_print_premise_advisory`\
  \ — fired at BOTH authoring seams: `task file` (off the grafted index) and the `task\
  \ update --old/--new` field-edit that changes `scope` or `acceptance` (off the committed\
  \ `graph/index.json`) | | this spec (item 3 — the premise-verify cue's mechanical\
  \ floor: a cited or scope/acceptance-named spec whose index status is `superseded\\\
  |retired\\|withdrawn\\|rejected`, naming its superseder; only `active` governs —\
  \ SPEC-0005) |\n| 13 | `retired flag named (advisory — filing not blocked)` | `_print_premise_advisory`\
  \ (same printer, same two seams as row 12) | | **SPEC-0204 rule 6** (pointer — the\
  \ retirement authority); the flag SET is read in place off the ONE carrier `bin/lib/audit.py#RETIRED_AUDIT_FLAGS`\
  \ that the pre-parse shim and graph conformance's `retired-audit-flags` probe read,\
  \ matched by that probe's own whole-token matcher — never a second list |\n\n**Line\
  \ 1 is a POINTER, never restated here (P5).** Its collision/lineage semantics —\
  \ the spec-lineage\nand code-surface altitudes, the SAFE/WAIT/CLASH/CLAIMED verdicts,\
  \ the release predicate — are\n**SPEC-0044 §2.2's** (parallel dispatch selection);\
  \ `_declared_surface_preview` PROJECTS that rule at\nfiling time by injecting the\
  \ not-yet-indexed card's declared surface into an index copy. This spec\nrecords\
  \ only that the line is DELIVERED at filing. To change what the verdict MEANS, edit\
  \ SPEC-0044,\nnot this registry. Lines 2-7 and 9 are this spec's own concern (line\
  \ 10 is a POINTER, like 1 and 8 — its hand-off rule is the handbook's): they answer\
  \ \"does this work already\nexist somewhere?\" (2-5, 7), \"does the card cite the\
  \ rules governing what it declares?\" (6), and \"does\neach AC name a test or an\
  \ explicit waive?\" (9) — authoring questions, not dispatch-collision\nquestions.\
  \ Within the related-input family, 2-5 read only LANDED /\nindex / journal state;\
  \ **line 7 alone reads OTHER LIVE SESSIONS' un-landed worktree intents** — the\n\
  gap that let two controllers build duplicates of one owner concern in a day.\n\n\
  **Line 2 reports TWO groups — live work AND recently-shipped work.** One emitter,\
  \ one\nregistry row, ONE printed key, two blocks with different dispositions. The\
  \ shipped block is a\nSUB-BLOCK printed beneath line 2's own `sibling-task overlap\
  \ (advisory — …)` key, and its sub-header\ndeliberately carries no `(advisory —\
  \ ` phrase — so that group adds NO row of its own and the pinned\nkey-string assertion\
  \ keeps passing on its own terms. Do NOT give this group its own key or\nits own\
  \ row: that is one concern printed in two parts, not a tenth advisory line. Line\
  \ 2's header\nnames BOTH counts, so a shipped-only hit is never printed keyless:\n\
  - **live** — the NON-TERMINAL siblings (`_overlapping_sibling_tasks`, unchanged):\
  \ a\n  `ready`/`in-progress`/`parked` card whose title OR expected_touch path already\
  \ claims this work.\n  Disposition: merge, or `requires:`-order.\n- **shipped**\
  \ — terminal cards (`_overlapping_shipped_tasks`) that closed within\n  `SHIPPED_OVERLAP_WINDOW_DAYS`\
  \ of the filing. Disposition: read the closed card first; if the work\n  already,\
  \ re-scope to the genuine residual or drop the card.\n\nWHY the second group exists:\
  \ reporting only non-terminal tasks put an already-DONE duplicate OUTSIDE\nthe screen\
  \ by construction, and the recorded duplicates were cards re-cut within a day of\
  \ the\noriginal closing.\n\n**The shipped group's two bounds ARE the rule, and they\
  \ are stated so a reader knows what the\nsilence means.** The done log grows with\
  \ the work, so an unbounded widening would flood every filing\nand train the reader\
  \ to skim. The bounds, each sized against the live corpus:\n- **RECENCY** — closed\
  \ within `SHIPPED_OVERLAP_WINDOW_DAYS`. The window is sized on the WORST case\n\
  \  (a dense single-theme filing burst, where sibling cards share heavy vocabulary\
  \ and closed days\n  apart), not the average: 7 halves the burst-case tail versus\
  \ 14 while keeping a duplicate filed a\n  week after the original in view, which\
  \ 3 would start to lose.\n- **TITLE ONLY** — the PATH signal is deliberately NOT\
  \ applied to shipped work (nor is the shipped\n  card's `expected_touch` folded\
  \ into the match text), unlike the live group where it is sound over\n  a small\
  \ pool. Against the done log the path signal alone matches every card that touches\
  \ a hot\n  file, in the hundreds. This is the decisive precision lever, and it is\
  \ why the quorum stays at\n  `FOLLOWUP_OVERLAP_SHARED_MIN` — raising the quorum\
  \ instead would have silenced BOTH recorded\n  duplicate-filing incidents (2 shared\
  \ tokens each).\nSo **work shipped longer ago than the window, or overlapping only\
  \ on a file surface, is OUTSIDE this\nline BY DESIGN** — the emitter prints that\
  \ bound beneath the group rather than letting silence read\nas \"nothing like this\
  \ has ever shipped\". A terminal card carrying no parseable `closed_at` is\nlikewise\
  \ out of the window (fail-quiet on the noise side, the registry's shared posture).\n\
  \n**This line detects, it never decides, and it never blocks** — the registry's\
  \ shared character below\napplies unchanged. NOT added alongside it: any rule obliging\
  \ the reader to read these lines. Every\nrecorded duplicate-filing incident is a\
  \ case where a screen could not SEE the case, never one where\nan advisory fired\
  \ and was skimmed, so a rule to re-read what is already printed would remove nothing\n\
  (CHARTER §P1 F3/F4).\n\n**Shared character of every line in the registry (stated\
  \ once).** Each is printed AFTER the id is\nallocated and the YAML written, so **none\
  \ can alter a filing**; each is report-not-block (CHARTER\nnon-goal #2/#7), fail-open\
  \ inside its own `try` (an index/journal/cross-fold error suppresses the\nadvisory,\
  \ never breaks a completed filing), emits **no event**, and leaves the exit code\
  \ unchanged.\nTogether they add **no gate, no card-completeness validator, and no\
  \ new store**, and they ride the\nONE grafted index the surface preview already\
  \ builds (no second build). The registry is NOT a\nsecond home for SPEC-0044's selection\
  \ rule and NOT a filing gate.\n\n**The registry table is PROSE by decision — do\
  \ NOT \"fix\" the missing anchors.** The listed\nhelpers above are deliberately\
  \ absent from every spec's `implements:` (this spec's and SPEC-0044's).\nRead that\
  \ as INTENDED, not as an oversight to tidy: region-drift on a helper is a poor proxy\
  \ for what\nthis table records (each line's KEY), so it would fire on every internal\
  \ refactor while the key is\nuntouched — the E-0019 broad-anchor false-positive\
  \ class (SPEC-0006). **Re-open only on the named\nreturn trigger:** an OBSERVED\
  \ divergence between this table and what `cmd_task_file` actually prints — EITHER\
  \ a row's enumerated key no longer matching the printed\nstring, OR a printed advisory\
  \ line having NO row here at all. BOTH halves are named deliberately: a\ntrigger\
  \ stating only the key-mismatch half already let a shipped line go unrowed while\
  \ the table\nstill stated the old count. Fix is a key-string assertion in the pinned\
  \ suite, not eight signature\nbaselines. The full CHARTER §P1 filter-by-filter weighing,\
  \ including the case FOR anchoring, is\nrecorded in `analysis:`, not restated here\
  \ (SPEC-0005 rule 3).\n\n**Under-citation filing preview — line 6, a report-only\
  \ DELIVERY surface for item-6's cite\ndiscipline.** `cmd_task_file`, after allocating\
  \ the id and writing the card, prints a filing-preview\nadvisory (`_print_undercitation_preview`,\
  \ one member of the registry above): for each CONCRETE\n`expected_touch` anchor\
  \ (an existing regular repo file,\nnever a broad directory or a generated/derived\
  \ `graph/`·`release-view/` path — the noise bound), it\nresolves via the graph's\
  \ `code_to_specs` reverse index to the ACTIVE specs whose own `implements`\nanchor\
  \ GOVERNS that surface (symbol-aware, so a spec on an unrelated symbol in the same\
  \ file is not\nnamed) and names any such spec the card does NOT `cite`. It surfaces\
  \ the unread-governing-rule gap at\nFILING, one dispatch cycle before an Analysis/audit\
  \ would. HONEST FRAMING: the WARN states it\ndetects UNDER-CITATION, NOT a\ncontradiction,\
  \ and does NOT prove the card conflicts with the named specs — citing a named spec\n\
  silences the line, and a deliberate non-cite is acked via `task update --note`.\
  \ It carries the\nregistry's shared character stated above (report-not-block, fail-open,\
  \ no event, exit unchanged —\nCHARTER non-goal #2/#7; no gate, no card-completeness\
  \ validator, no new store; it rides the ONE\ngrafted index the line-1 surface preview\
  \ already builds, no second build). Additive extension of the\nFiling delivery (SPEC-0005\
  \ rule 7); the cite discipline itself stays normative in item 6 above\n(cue+pointer).\n\
  \n**Triage/revizia-entry delivery — a SECOND delivery surface for the SAME doctrine.**\n\
  A revizia/triage scan (`bin/lib/triage.py#cmd_triage_run`) is the moment whose expected\
  \ OUTPUT is\nfiling (the promote-to-fix-task route), but it enters NO task Filing\
  \ stage — so a `task file`\nmid-batch would surprise-refuse on the `_require_reads(stage=Filing)`\
  \ gate even after the handbook\nseed was read. So the triage SCAN entry DELIVERS\
  \ this doctrine, symmetric with the Filing\nstage-entry, by emitting an HONEST node_id-bearing\
  \ delivery-RECEIPT: a `cli_invoked` event carrying\n`verb: \"triage run\"` (deliberately\
  \ NOT `\"graph query\"`, so a journal consumer never mistakes it for\na real interactive\
  \ fetch) + `node_id: SPEC-0060` + an explicit `delivery` marker. The read-gate's\n\
  credit path `_fetched_spec_ids` keys ONLY on `data.node_id` (verb-agnostic — bin/lib/gates.py),\
  \ so\nthe receipt credits the gate through the EXISTING path with no reducer change,\
  \ no new event type, no\nnew gate (CHARTER §P1; the same delivery-credit idiom the\
  \ journal recovery-rescan already uses). The\ndoctrine itself is unchanged — this\
  \ records an additional DELIVERY point, not a normative reshape.\n\n### Anti-complexity\
  \ note (SPEC-0005 §7 / CHARTER §P1)\nReuses the existing `task file` verb + the\
  \ `_template.yaml` skeleton + the `_require_reads` lever\n(SPEC-0050) — no new gate,\
  \ no new store, no card-completeness validator. Admitted because it fills a\nreal\
  \ CONTENT gap (no single task-authoring home existed); the only retirement is the\
  \ overlapping\nauthoring prose folded in from SPEC-0028/0046 on activation (replacement\
  \ map above).\n\n## Parameters\n\nNone consumed.\n\n## Rationale\n\nSymmetry confirms\
  \ the home: plans already have SPEC-0043 (plan-draft authoring doctrine); a task\
  \ had\nno analog, so the front-load thinking was never homed. Real incident class:\
  \ under-specified task\ncards later reverse-engineered for intent. Full design provenance\
  \ lives in the proposing plan\n(cited), not here (rule 3).\n\n## Verification\n\n\
  Behavioral (primary):\n- `task file` checks the task-authoring doctrine was read\
  \ (current session) before writing the card,\n  and REFUSES when unread (the SPEC-0059\
  \ Filing CHECK leg; emits `read_gate_refused`);\n- a card filed via `task file`\
  \ carries the front-loaded fields (scope + acceptance-with-probe), seeded\n  by\
  \ the skeleton prompts.\nStructural (secondary): no schema rule or decomposition\
  \ rule is restated here — each resolves to its\nowner (SPEC-0028 / SPEC-0046) by\
  \ pointer.\n\n## Drift review\n\nThis body has been AMENDED in place nine times\
  \ (each an SPEC-0005 rule 7 additive extension, none a\nsupersession): the item-4\
  \ audit-post-verifiability sub-clause; the X-0419 cohort-complement and\ncited-desired-exclusion\
  \ cues; the evidence-availability cue and its two limbs; the durable-field\ncue;\
  \ the born-armed-carrier cue; the qualitative-outcome rule with the Measured-bound\
  \ cue re-scoped\nbeneath it; plus two re-verifications of the `implements:` anchors\
  \ after unrelated drift. Every\namendment was an AUTHORING PROMPT: none added a\
  \ gate, an event, a store or a card-completeness\nvalidator, and none changed what\
  \ an already-compliant criterion had to do. The dated entries, their\nmeasured grounds\
  \ and the per-amendment CHARTER §P1 weighing are in git history for this file and\
  \ in\nthe cited proposing plan — not restated here (SPEC-0005 rule 3 / rule 8).\n\
  \nONE amendment ships a test, and it is the only one that could: the limb-(a) example\
  \ land-tie\nphrasings are literal strings a live matcher must keep accepting, so\n\
  `tests/test_land_emitted_cue_examples_match_the_matcher.py` asserts each of them\
  \ against\n`bin/lib/audit.py#land_emitted_named_evidence` — RED if an example is\
  \ edited to a non-matching\nphrasing, RED if the matcher is narrowed away from an\
  \ example. Every other cue quotes no\nmatcher-bound string, so a test there would\
  \ assert prose against itself.\n"
