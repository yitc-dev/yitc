  and code-surface altitudes, the SAFE/WAIT/CLASH/CLAIMED verdicts, the release predicate — are
  **SPEC-0044 §2.2's** (parallel dispatch selection); `_declared_surface_preview` PROJECTS that rule at
  filing time by injecting the not-yet-indexed card's declared surface into an index copy. This spec
  records only that the line is DELIVERED at filing. To change what the verdict MEANS, edit SPEC-0044,
  not this registry. Lines 2-7 and 9 are this spec's own concern (line 10 is a POINTER, like 1 and 8 — its hand-off rule is the handbook's): they answer "does this work already
  exist somewhere?" (2-5, 7), "does the card cite the rules governing what it declares?" (6), and "does
  each AC name a test or an explicit waive?" (9) — authoring questions, not dispatch-collision
  questions. Within the related-input family, 2-5 read only LANDED /
  index / journal state; **line 7 alone reads OTHER LIVE SESSIONS' un-landed worktree intents** — the
  gap X-0430 exploited when two controllers built duplicates of one owner concern in a day.

  **Line 2 reports TWO groups — live work AND recently-shipped work.** One emitter, one
  registry row, ONE printed key, two blocks with different dispositions. The shipped block is a
  SUB-BLOCK printed beneath line 2's own `sibling-task overlap (advisory — …)` key, and its sub-header
  deliberately carries no `(advisory — ` phrase — so that group adds NO row of its own and the pinned
  key-string assertion keeps passing on its own terms. Do NOT give this group its own key or
  its own row: that is one concern printed in two parts, not a tenth advisory line. Line 2's header
  names BOTH counts, so a shipped-only hit is never printed keyless:
  - **live** — the NON-TERMINAL siblings (`_overlapping_sibling_tasks`, unchanged): a
    `ready`/`in-progress`/`parked` card whose title OR expected_touch path already claims this work.
    Disposition: merge, or `requires:`-order.
  - **shipped** — terminal cards (`_overlapping_shipped_tasks`) that closed within
    `SHIPPED_OVERLAP_WINDOW_DAYS` of the filing. Disposition: read the closed card first; if the work
    already, re-scope to the genuine residual or drop the card.

  WHY the second group exists: reporting only non-terminal tasks put an already-DONE duplicate OUTSIDE
  the screen by construction — re-prescribed the cure had already shipped (commit
  0c752455), and re-cut the already-done. Both duplicated a card that had closed ONE DAY
  earlier.

  **The shipped group's two bounds ARE the rule, and they are stated so a reader knows what the
  silence means.** The done log grows with the work (~2000 terminal cards), so an unbounded widening
  would flood every filing and train the reader to skim — manufacturing the readership failure the
  record does not show. Measured against the live corpus, the bounds are:
  - **RECENCY** — closed within the window. Unbounded title-only matching ran median 15 / max 43 hits
    per card. Sizing the window needs the WORST case, not the average: by creation date the 25 newest
    cards run median 0 / max 4 at any of 3/7/14 days, but the 25 highest-numbered cards — a dense
    single-theme filing burst, where sibling cards share heavy vocabulary AND closed days apart — run
    median 4 / max 16 at 14 days, median 2 / max 9 at 7, median 1 / max 7 at 3. Both incidents survive
    all three (1-day gaps), so 7 was chosen: it halves the burst-case tail versus 14 while keeping a
    duplicate filed a week after the original in view, which 3 would start to lose.
  - **TITLE ONLY** — the PATH signal is deliberately NOT applied to shipped work (nor is the shipped
    card's `expected_touch` folded into the match text), unlike the live group where it is sound over
    a small pool. Against the done log the path signal alone returned up to 387 hits on one card: any
    card touching a hot file matches hundreds of shipped ones. This is the decisive precision lever,
    and it is why the quorum stays at `FOLLOWUP_OVERLAP_SHARED_MIN` — raising the quorum instead
    would have silenced BOTH named incidents (2 shared tokens each).
  So **work shipped longer ago than the window, or overlapping only on a file surface, is OUTSIDE this
  line BY DESIGN** — the emitter prints that bound beneath the group rather than letting silence read
  as "nothing like this has ever shipped". A terminal card carrying no parseable `closed_at` is
  likewise out of the window (fail-quiet on the noise side, the registry's shared posture).

  **This line detects, it never decides, and it never blocks** — the registry's shared character below
  applies unchanged. NOT added alongside it: any rule obliging the reader to read these lines. The
  record carries ZERO incidents of an advisory firing and being skimmed; all recorded duplicate-filing
  incidents are cases where a screen could not SEE the case ( own sweep). A rule to re-read
  what is already printed would remove nothing (CHARTER §P1 F3/F4).

  **Shared character of every line in the registry (stated once).** Each is printed AFTER the id is
  allocated and the YAML written, so **none can alter a filing**; each is report-not-block (CHARTER
  non-goal #2/#7), fail-open inside its own `try` (an index/journal/cross-fold error suppresses the
  advisory, never breaks a completed filing), emits **no event**, and leaves the exit code unchanged.
  Together they add **no gate, no card-completeness validator, and no new store**, and they ride the
  ONE grafted index the surface preview already builds (no second build). The registry is NOT a
  second home for SPEC-0044's selection rule and NOT a filing gate.

  **The registry table is PROSE by decision — do NOT "fix" the missing anchors.** The listed
  helpers above are deliberately absent from every spec's `implements:` (this spec's and SPEC-0044's).
  Read that as INTENDED, not as an oversight to tidy: region-drift on a helper is a poor proxy for what
  this table records (each line's KEY), so it would fire on every internal refactor while the key is
  untouched — the E-0019 broad-anchor false-positive class (SPEC-0006). **Re-open only on the named
  return trigger:** an OBSERVED divergence between this table and what `cmd_task_file` actually prints —
  EITHER a row's enumerated key no longer matching the printed string, OR a printed advisory line having
  NO row here at all (the miss: line 7 shipped with and the table still said "six",
  because the trigger as first written named only the key-mismatch half). Fix is a key-string assertion
  in the pinned suite, not eight signature baselines. Full deliberation (the CHARTER §P1 filter-by-filter weighing, incl. the case
  FOR anchoring) is recorded in `analysis:`, not restated here (SPEC-0005 rule 3).

  **Under-citation filing preview — line 6, a report-only DELIVERY surface for item-6's cite
  discipline.** `cmd_task_file`, after allocating the id and writing the card, prints a filing-preview
  advisory (`_print_undercitation_preview`, one member of the registry above): for each CONCRETE
  `expected_touch` anchor (an existing regular repo file,
  never a broad directory or a generated/derived `graph/`·`release-view/` path — the noise bound), it
  resolves via the graph's `code_to_specs` reverse index to the ACTIVE specs whose own `implements`
  anchor GOVERNS that surface (symbol-aware, so a spec on an unrelated symbol in the same file is not
  named) and names any such spec the card does NOT `cite`. It surfaces the unread-governing-rule gap at
  FILING, one dispatch cycle before an Analysis/audit would. HONEST FRAMING (external consult
  `decisions/t10556-recut-direction-audit-adhoc.yaml`): the WARN states it detects UNDER-CITATION, NOT a
  contradiction, and does NOT prove the card conflicts with the named specs — citing a named spec
  silences the line, and a deliberate non-cite is acked via `task update --note`. It carries the
  registry's shared character stated above (report-not-block, fail-open, no event, exit unchanged —
  CHARTER non-goal #2/#7; no gate, no card-completeness validator, no new store; it rides the ONE
  grafted index the line-1 surface preview already builds, no second build). Additive extension of the
  Filing delivery (SPEC-0005 rule 7); the cite discipline itself stays normative in item 6 above
  (cue+pointer).

  **Triage/revizia-entry delivery (X-0128) — a SECOND delivery surface for the SAME doctrine.**
  A revizia/triage scan (`bin/lib/triage.py#cmd_triage_run`) is the moment whose expected OUTPUT is
  filing (the promote-to-fix-task route), but it enters NO task Filing stage — so a `task file`
  mid-batch would surprise-refuse on the `_require_reads(stage=Filing)` gate even after the handbook
  seed was read. So the triage SCAN entry DELIVERS this doctrine, symmetric with the Filing
  stage-entry, by emitting an HONEST node_id-bearing delivery-RECEIPT: a `cli_invoked` event carrying
  `verb: "triage run"` (deliberately NOT `"graph query"`, so a journal consumer never mistakes it for
  a real interactive fetch) + `node_id: SPEC-0060` + an explicit `delivery` marker. The read-gate's
  credit path `_fetched_spec_ids` keys ONLY on `data.node_id` (verb-agnostic — bin/lib/gates.py), so
  the receipt credits the gate through the EXISTING path with no reducer change, no new event type, no
  new gate (CHARTER §P1; the same delivery-credit idiom the journal recovery-rescan already uses). The
  doctrine itself is unchanged — this records an additional DELIVERY point, not a normative reshape.

  ### Anti-complexity note (SPEC-0005 §7 / CHARTER §P1)
  Reuses the existing `task file` verb + the `_template.yaml` skeleton + the `_require_reads` lever
  (SPEC-0050) — no new gate, no new store, no card-completeness validator. Admitted because it fills a
  real CONTENT gap (no single task-authoring home existed); the only retirement is the overlapping
  authoring prose folded in from SPEC-0028/0046 on activation (replacement map above).

  ## Parameters

  None consumed.

  ## Rationale

  Symmetry confirms the home: plans already have SPEC-0043 (plan-draft authoring doctrine); a task had
  no analog — its "how to write a good card" was split across the schema (SPEC-0028) and the shape
  (SPEC-0046), so the front-load thinking was never homed. Real incident class: under-specified task
  cards later reverse-engineered for intent. The pairing on both axes: authoring-doctrine
  (SPEC-0043 ↔ this spec) + lifecycle (SPEC-0034 ↔ SPEC-0027). Full design provenance lives in the
  proposing plan (cited), not here (rule 3).

  ## Verification

  Behavioral (primary):
  - `task file` checks the task-authoring doctrine was read (current session) before writing the card,
    and REFUSES when unread (the SPEC-0059 Filing CHECK leg; emits `read_gate_refused`);
  - a card filed via `task file` carries the front-loaded fields (scope + acceptance-with-probe), seeded
    by the skeleton prompts.
  Structural (secondary): no schema rule or decomposition rule is restated here — each resolves to its
  owner (SPEC-0028 / SPEC-0046) by pointer.

