id: SPEC-0060
title: Task-authoring doctrine — front-load checklist for a good task card, delivered
  at Filing
status: active
created_at: 2026-06-08 20:13:45+00:00
consumed: false
implements:
- bin/lib/task.py#cmd_task_file
- bin/lib/session.py#cmd_session_start
- bin/lib/triage.py#cmd_triage_run
body: "## Scenario\n\nWhen the owner/AI files a TASK, the card is FRONT-LOADED rather\
  \ than left a bare title: `task file`\nseeds a skeleton whose sections prompt the\
  \ same questions a good card answers UPFRONT — what changes,\nthe smallest concrete\
  \ edit, and the acceptance criteria WITH probe evidence — and the session holds\n\
  the authoring doctrine that says what a good card carries. So a task is never a\
  \ one-line stub someone\nlater reverse-engineers intent from. This is the TASK-axis\
  \ analog of the plan-draft authoring doctrine\n(SPEC-0043). It reaches the author\
  \ the way SPEC-0059's Filing carve-out describes: a session-start\nREFERENCE pointer\
  \ (availability, no gate) + the `task file` work-verb checks it was read before\n\
  writing the card.\n\n## Internal\n\nTHE TASK-AUTHORING DOCTRINE — the retrieved\
  \ home for WHAT a good task card front-loads. It is a\nCHECKLIST, not a gate (no\
  \ card-completeness validator — CHARTER non-goal #2/#7). It is POINTER-BASED:\n\
  every schema rule and every cutting rule stays normative in ITS OWN home (cited\
  \ inline); this spec\nNEVER restates them (SPEC-0005 rule 3 content-boundary / P5\
  \ one-home / rule 8\nprompts-checklists-cue+pointer — a front-load checklist item\
  \ carries a discipline CUE + a POINTER,\nnever a restated corpus rule).\n\n### The\
  \ front-load checklist — authoring PROMPTS only (accept-gate F3, 2026-06-08)\nEach\
  \ item is the QUESTION to ask while writing the card — NOT a re-statement of the\
  \ field's rule\n(the schema rule lives in SPEC-0028, the cutting rule in SPEC-0046;\
  \ this list only front-loads the\nthinking and POINTS). The load-bearing authoring\
  \ content this spec genuinely OWNS is items 3-4 (the\nfront-load thinking — scope\
  \ + acceptance/probe); items 1/2/5/6 are one-line prompts that defer\nentirely to\
  \ their home:\n1. **Title** — is it one imperative line that says what the card\
  \ DOES? (convention → SPEC-0028.)\n2. **Class** — picked from the catalog? (catalog\
  \ + meaning → SPEC-0028.)\n3. **Scope (front-load thinking — OWNED here)** — can\
  \ you name what EXISTS, what CHANGES, and the\n   SMALLEST concrete edit, as your\
  \ CURRENT understanding? Filing precedes this task's own Analysis\n   (entered later\
  \ at the claim), so this is the filer's front-load, not a completed Analysis output;\n\
  \   the picked-up task re-confirms it at Analysis (procedure → SPEC-0032).\n   **Touch\
  \ forecast — name the units you KNOW; the commit refreshes the rest.** The\n   card's\
  \ `expected_touch` is an OPTIONAL forecast for dispatch/planning/claim (SPEC-0028),\
  \ NOT a\n   completeness obligation: declare the units you can name at filing and\
  \ stop there. Do NOT try to\n   forecast every file the change will touch, nor pair\
  \ each with its governing spec — `task commit`\n   REFRESHES the field from the\
  \ committed diff, so what the work actually touched reaches those\n   readers whatever\
  \ the filer guessed. The under-citation cue at item 6(a) still reads whatever IS\n\
  \   declared, and is unchanged by this: it asks you to CITE the spec governing a\
  \ surface you named,\n   never to name more surfaces. On the AUDIT side the completeness\
  \ of this forecast is CONTEXT and\n   is never a finding (SPEC-0036 §Universal lens)\
  \ — so an incomplete forecast costs a filer nothing,\n   which is exactly why over-forecasting\
  \ to be safe is the wrong instinct here.\n   **Observation-vs-hypothesis cue (2026-08-12)\
  \ —** does a scope line\n   state a CAUSE? Separate what you MEASURED from what\
  \ you SUSPECT. A card may report measured\n   observations and may PROPOSE a suspected\
  \ cause; but a causal claim made BEFORE this task's own\n   Analysis defaults to\
  \ HYPOTHESIS, and becomes load-bearing only when the card carries the probe\n  \
  \ evidence and its `from:` chain (evidence discipline → CHARTER §Principle 2 `from:`\
  \ + §Principle 3\n   probe evidence; the Analysis re-confirmation is this item's\
  \ own rule above → SPEC-0032). Labelling\n   a cause does not license it as the\
  \ card's premise — write it as the hypothesis the work TESTS, so\n   the reader\
  \ can tell which half is proven. The same separation applies to a MEASURED claim:\
  \ name the\n   surface and scope you actually measured whenever that scope is narrower\
  \ than the claim you draw\n   from it. The same holds for the INSTRUMENT and not\
  \ only the scope (X-1012): when you report a\n   VISUAL or USER-FACING property,\
  \ do not claim more than you DIRECTLY OBSERVED — either back it\n   with rendered\
  \ evidence (a screenshot, a rendered read, a gate re-run), OR scope the claim to\
  \ the\n   PROXY you actually checked. A cheap DOM / selector / console / timing\
  \ check is never forbidden\n   and stays fully legitimate for steering your own\
  \ work; the cue binds the REPORT, not the check,\n   so a proxy stays legitimate\
  \ whenever the report says what it actually observed — what it forbids\n   is UPGRADING\
  \ a proxy into a claim about what a user saw.\n   An authoring PROMPT only: no card\
  \ is refused for omitting it.\n   **Premise-verify cue — AT THE FILING SEAM (owner\
  \ directive 2026-08-16, re-confirmed\n   2026-08-30) —** does this card rest on\
  \ a PREMISE about the CURRENT code — a quoted line\n   number, a stated absence\
  \ (\"nothing does X\"), a reported behaviour, a peer's or a report's\n   claim?\
  \ Then CHECK IT against today's checkout BEFORE you cut the card. This is the cheapest\n\
  \   check in the lifecycle and the one nobody makes: the premise arrives with the\
  \ request, so it\n   reads as given rather than as something to verify.\n   **Which\
  \ seam this is, and why the existing ones do not reach it.** This cue fires BEFORE\
  \ A\n   CARD EXISTS. The two premise disciplines already in the corpus are both\
  \ DOWNSTREAM and stay\n   where they are (pointers, not restated here — SPEC-0005\
  \ rule 3): SPEC-0133 rule 2f owns the\n   PRE-CLAIM seam, where a dispatched worker\
  \ that finds a ready card's premise false refuses it\n   via `task refuse` — by\
  \ then the card was cut, queued and dispatched, and a whole worker\n   bootstrap\
  \ is spent to discover it; SPEC-0166 owns a narrower earlier pass, but its predicate\n\
  \   is `imported_from:`, so it reaches imported migration backlog only and says\
  \ nothing about a\n   card filed from a live request. Verifying at filing is what\
  \ makes the wasted card never get\n   cut at all.\n   **The shape to watch — the\
  \ fact holds, the LOCATOR rots.** A quoted LINE NUMBER goes stale the\n   moment\
  \ anything lands above it: nothing about the observation is wrong, only its address\
  \ moved,\n   which a reader cannot tell from the card. So cite what does not rot\
  \ (a symbol or `#anchor`, the\n   form `implements:` uses) or re-read the locator\
  \ at filing; and treat any \"as of today\" claim the\n   same way (the expiring-premise\
  \ arm of the evidence-availability cue in item 4 is this same\n   failure one stage\
  \ later).\n   An authoring PROMPT only: no card is refused for omitting it, and\
  \ nothing validates it — this\n   item is a checklist by construction (no card-completeness\
  \ validator — CHARTER non-goals), and\n   a filing suppressed here would cost more\
  \ than the premise it screened.\n   **The ONE place this item's thinking is MECHANICALLY\
  \ floored —** `task plan\n   --finalize` REFUSES a plan that never REFERENCES a\
  \ canonical `ACn` id, naming the uncovered\n   ids. A NECESSARY condition only —\
  \ the auditor still judges substance — so it floors the\n   scope↔plan relation\
  \ this item asks you to think through; it does not check it.\n   **The premise-verify\
  \ cue's own MECHANICAL FLOOR —** `task file` and `task update\n   --old/--new` (on\
  \ `scope`/`acceptance`) print two report-only lines,\n   `non-active spec cited\
  \ (advisory — filing not blocked)` and\n   `retired flag named (advisory — filing\
  \ not blocked)` (registry rows 12 + 13 below), when a\n   cited or named spec resolves\
  \ in the graph index to a non-active status\n   or the card text names a retired\
  \ `audit` CLI flag (SPEC-0204 rule 6) — the two premise faults the\n   graph already\
  \ knew at the filing. A NECESSARY condition only (status and token, never\n   substance);\
  \ filing is never blocked.\n4. **Acceptance WITH probe (front-load thinking — OWNED\
  \ here, load-bearing)** — does each criterion\n   name a probe (event / state /\
  \ measurable effect)? \"code committed\" is NOT \"done\" (done=adopted +\n   infra-adoption\
  \ → CHARTER §P3/§P8). This IS the per-unit verification artifact SPEC-0059's\n \
  \  readiness gate checks before Tests/Closure.\n   **THE ONE QUESTION (X-1403, 2026-09-14)\
  \ — ask it of EVERY criterion before filing:\n   what would make this criterion\
  \ impossible for a conforming run to satisfy?** A criterion no\n   conforming 9-stage\
  \ run can satisfy reads at audit as UNMET WORK, never as the authoring defect it\n\
  \   is — so it burns audit passes, the audit-loop ceiling, a worker halt and a re-dispatch\
  \ that no\n   re-audit converts. The named cues below are NOT a checklist that grows\
  \ one narrow entry per\n   incident: each is a WORKED EXAMPLE of this one question\
  \ on one axis, and each carries its own\n   provenance id in its own heading — that\
  \ heading is the one place it is listed. A new incident on\n   a new axis is added\
  \ below as a worked example of this question, never as a standalone rule. Having\
  \ READ the family is not having ASKED the question: X-1403 measured a controller\
  \ the\n   read gate credited with SPEC-0060 four times in one hour still writing\
  \ two fresh violations — so\n   ask it of the criterion in front of you, not of\
  \ the list. An authoring PROMPT only: no gate, no\n   advisory, no card is refused\
  \ for omitting it.\n   **Give each criterion a leading `ACn` token —** that token\
  \ is the criterion's\n   CANONICAL id, and `task plan --finalize` REFUSES a plan\
  \ that never references one, naming the\n   uncovered ids (a necessary condition\
  \ only). A tokenless entry still gets an id, assigned BY\n   POSITION — which moves\
  \ when the list is reordered, so the explicit token is what makes the id\n   stable\
  \ across the card's life. **Audit-post verifiability (additive)** —\n   each criterion\
  \ must be VERIFIABLE AT AUDIT-POST from the shipped diff + the surfaced\n   journal-evidence\
  \ sections; do NOT write a criterion that references the audit-pre verdict (or any\n\
  \   audit-record file) — those are EXCLUDED from the audit-post diff and structurally\n\
  \   unverifiable there (the recurring false-RED class). A residual surfaced at audit-pre\
  \ is\n   discharged AT audit-pre (mode-b absorption → LIFECYCLE §Stage 4), never\
  \ deferred to an\n   audit-post-checked closure criterion.\n   **Triggered-mechanism\
  \ cue (X-0089) —** does the card ship a mechanism whose success depends on an\n\
  \   external trigger firing (scheduler/hook/event/periodic)? Then `class:infra`\
  \ + a live-trigger/\n   synthetic-load probe, NOT a direct-call unit test (rule\
  \ home → CHARTER §P8 + SPEC-0036 audit-post\n   overlay).\n   **Differential-probe\
  \ cue (X-0246) —** would this criterion still pass if the thing under test were\n\
  \   BROKEN? If yes it is a smoke check, not a probe — name the input that must make\
  \ it FAIL (rule home\n   → CHARTER §P3 done=adopted). An authoring PROMPT only:\
  \ no card is refused for omitting it.\n   **Cohort-complement cue (X-0419) —** does\
  \ this card REMEDIATE a cohort its fix SELECTS (a filter, a\n   fence, a WHERE clause,\
  \ an id list)? Then probe the COMPLEMENT, not only the selected set: name what\n\
  \   the selector EXCLUDES and why that exclusion is right. A card that probes only\
  \ its own selector is\n   green by construction — it cannot see the rows its own\
  \ fence silently dropped (rule home → CHARTER\n   §P3 done=adopted: what is adopted\
  \ is the OUTCOME, not the selector). An authoring PROMPT only: no\n   card is refused\
  \ for omitting it.\n   **Cited-desired-exclusion cue (X-0419) —** does a criterion\
  \ assert an exclusion is DESIRED (a\n   NEGATIVE probe — \"these stay excluded\"\
  \ / \"this stays absent\")? Then CITE the artifact or\n   owner-decision that DECIDED\
  \ that exclusion. An uncited negative probe encodes the AUTHOR'S\n   ASSUMPTION\
  \ as an executable green guarantee — and the assumption outlives the author (rule\
  \ home →\n   CHARTER §P3 + SPEC-0005 rule 3 content-boundary: a claim resolves to\
  \ the home that decided it, or\n   it is not a decided claim yet). An authoring\
  \ PROMPT only: no card is refused for omitting it.\n   **Test-or-waive cue —** does\
  \ each criterion NAME the executable test that verifies it (a\n   test path or a\
  \ pinned-suite test id) OR carry an explicit fail-closed waive `test-not-applicable:\n\
  \   <reason>` when the criterion is genuinely verified another way (a `graph query`\
  \ state-check, an\n   event emit)? An AC that names NEITHER is a claim with no named\
  \ verifier — \"done\" is asserted with\n   nothing that runs to prove it. The waive\
  \ is a CONTRACT, not a silence: it MUST carry a REASON (a\n   bare `test-not-applicable:`\
  \ with no reason still counts as unnamed, fail-closed — mirroring the\n   SPEC-0038\
  \ `post_verification: {none: <reason>}` waive discipline). `task file` surfaces\
  \ the per-AC\n   status as the report-only `AC test/waive status (advisory — filing\
  \ not blocked)` line (registry\n   row 9 below). Sole SDD element adopted from the\
  \ truth-model consult\n   (`decisions/truth-model-sdd-replacement-audit-adhoc.yaml`\
  \ finding 2; owner ruling 2026-07-18 —\n   ephemeral cards + audit-skip modes explicitly\
  \ out of scope). An authoring PROMPT only: no card is\n   refused for omitting it\
  \ (rule home → this item + CHARTER §P3 done=adopted).\n   **Born-armed-carrier cue\
  \ —** does a criterion defer work to a FOLLOW-UP (a CHARTER §P8\n   adoption carrier,\
  \ a staged dodelka) whose firing moment is a NAMEABLE artifact — a task or\n   coordination\
  \ id whose closure IS that moment? Then capture it BORN ARMED, `followup add --trigger\n\
  \   '<the moment>' --awaits <T-NNNN|X-NNNN>`, never with the wait written as prose:\
  \ a prose wait lands\n   in the actionable headline and reads as do-now for as long\
  \ as it is open (measured on the kernel\n   2026-09-04: 246 actionable / 9 armed,\
  \ well over a hundred of the 246 naming a waiting moment in\n   prose). Leave it\
  \ ACTIONABLE only when nothing resolvable names the moment — an event class fires\n\
  \   on MEMBERSHIP, so a «next occurrence of <type>» wait has no artifact at all.\
  \ `followup\n   add` surfaces this itself as a report-only advisory when the capture\
  \ text names a still-open\n   reference. **First ask WHOSE journal the moment lands\
  \ in (owner ruling 2026-09-04):** a\n   KERNEL-side moment takes the armed followup\
  \ above, while a CONSUMER-side one — the next deploy,\n   run or reading in ANOTHER\
  \ project — cannot be carried by a followup here at all and routes as a\n   `cross\
  \ request --kind task --to <consumer>` asking that project to arm its own followup\
  \ and\n   report the reading back, with at most ONE followup on this side armed\
  \ on the resulting `X-NNNN`.\n   An authoring PROMPT only: no card is refused for\
  \ omitting it (rule home → SPEC-0095 §Armed).\n   **How a named test is RECOGNIZED\
  \ is not this item's rule —** a project that declares where its\n   test files live\
  \ is read from that declaration, and the kernel's own filename pattern is only\n\
  \   the fail-open default for a project that declares none (rule home → SPEC-0185\
  \ half (c) + §2a;\n   the declarable carrier is `tests.classes[].globs`, shape owned\
  \ by SPEC-0160 rule 10).\n   **The named verifier is NOT the P8 adoption-evidence\
  \ payload —** the test this cue asks\n   you to NAME is the criterion's VERIFIER:\
  \ what RUNS to prove the AC. That is a DIFFERENT slot from\n   the CHARTER §P8 adoption-evidence\
  \ event a `class: infra` closure composes, whose payload has its\n   own admissibility\
  \ contract — SPEC-0015 §\"The EVENT carrier must resolve machine evidence + a\n\
  \   differential\" owns it, and the test run's journal trace is not among what it\
  \ admits (not restated\n   here — P5). So naming a test path in an AC is always\
  \ legitimate, but do NOT write a criterion that\n   DEMANDS the P8 payload REFERENCE\
  \ that test's run: it is unsatisfiable by construction, green\n   nowhere, and reads\
  \ at audit-post as an unmet AC rather than an authoring defect ( burned 2\n   audit-post\
  \ passes plus a convergence consult before its AC2 was amended). When a criterion\
  \ needs\n   adoption evidence, point the payload at the MECHANISM's own production\
  \ event; the named test stays\n   the verifier alongside it.\n   **Conforming-run\
  \ satisfiability cue (X-1054) —** does a criterion constrain the SHAPE OF THE\n\
  \   DIFF (\"the diff touches only `<file>`\" / \"any file outside `<path>` fails\
  \ this\")? Then ask\n   whether a CONFORMING 9-stage run could satisfy it AS WRITTEN.\
  \ As a bare shape it cannot: the\n   shipped commit NECESSARILY also carries this\
  \ card's own lifecycle fields (written by the\n   stage verbs), `events.jsonl` rows,\
  \ and the audit YAML LIFECYCLE §Stage 8 explicitly instructs\n   be left dirty for\
  \ `task close` — and `task commit` owns staging and exposes no path filter\n   (→\
  \ SPEC-0014), so the only literally-satisfying path is hand-rolled git around the\
  \ governed\n   verbs, which AGENTS §Verb-execution discipline forbids. So scope\
  \ the criterion to the PRODUCT\n   hunks and SAY SO, with the exclusion written\
  \ as a CLOSED LIST that is PROVENANCE-BOUND, never\n   path-shaped: admit this task's\
  \ card lifecycle fields, its `events.jsonl` entries, and its own\n   governed audit/decision\
  \ artifacts — in each case ONLY where a REQUIRED STAGE VERB produced\n   them FOR\
  \ THIS SAME TASK. An exclusion that admits a PATH regardless of WHO WROTE IT is\
  \ the\n   soft edge to avoid: it lets a real product file ride in as bookkeeping.\
  \ Keep the criterion\n   DIFFERENTIAL by naming what still FAILS it — any application\
  \ / source / config / docs /\n   schema / test file, a hand-edited lifecycle artifact\
  \ carrying product semantics, another\n   task's metadata, and any path that changes\
  \ runtime behaviour, verification behaviour,\n   ownership declarations or review\
  \ scope. Worked instance to reuse: <project>'s landed\n   AC4. The generalisation\
  \ of the paragraph above — same failure mode (an AC that is\n   unsatisfiable BY\
  \ CONSTRUCTION reads at audit-post as an unmet AC, not as the authoring defect\n\
  \   it is), now on the diff-shape axis; measured cost: the same wording twice in\
  \ one day by one\n   author, the second time with the fix in view, burning the audit-loop\
  \ ceiling, two consults\n   reaching OPPOSITE conclusions, a halted worker and an\
  \ owner reset. An authoring PROMPT only:\n   no card is refused for omitting it,\
  \ and nothing validates it (rule home → this item).\n   **Deferred-proof ordering\
  \ cue —** can this criterion's proof exist BEFORE\n   this card's OWN land? Ask\
  \ it of every criterion whose evidence is a live reading, an adoption\n   trace,\
  \ or anything a RUN produces. When the answer is NO — the proof is produced by a\
  \ LATER\n   land, by production traffic, or by this card's own closure — the criterion\
  \ is not a bare\n   deferred probe and must not be written as one: audit-post reads\
  \ a structurally-impossible\n   absence as an UNMET AC rather than as the ordering\
  \ fact it is, and the card burns passes that\n   no re-audit can convert ( ceilinged\
  \ at passes=3 demanding evidence that could not exist\n   while its own change was\
  \ still off main; burned 4 passes, 2 owner resets and a\n   convergence consult\
  \ arguing about the same impossible forecast). Carry it instead as one of\n   the\
  \ SPEC-0028 OPTIONAL deferred-proof DECLARATIONS — the family each of whose members\
  \ is the\n   trust anchor of its own Stage-8 `audit post` carve-out, so the absence\
  \ is told to the auditor\n   as the NORMAL ordering for that ship (rule home → SPEC-0028's\
  \ field catalog for the forms,\n   SPEC-0036 for the matching overlays; nothing\
  \ about them is restated here). Point at the\n   FAMILY and pick the member whose\
  \ shape fits — and treat a shape NO member fits as the finding\n   to capture, never\
  \ a declaration to improvise. An authoring PROMPT only: no card is refused for\n\
  \   omitting it.\n   **Evidence-availability cue —** at the moment someone READS\
  \ this criterion,\n   will the record it names still NAME ITS SUBJECT? Two limbs,\
  \ one question. Neither measured case\n   was carelessness: both criteria were written\
  \ by capable authors and read as reasonable when\n   written — the record is chosen\
  \ at AUTHORING time, and nobody asks what it will say at READING\n   time.\n   Limb\
  \ (a), the record does not name it YET (ordering) — is the proof emitted by `land`\
  \ at Stage 9\n   (a `land_completed` row, a `cross_done` row, a land-stamped field)?\
  \ Then naming the right\n   ARTIFACT is not enough: the Stage-8 overlay admits the\
  \ carve-out only for evidence the acceptance\n   ties to land IN WORDS, so WRITE\
  \ THE TIE. Example phrasings the guard reads —\n   [ \"land-emitted\" | \"emitted\
  \ by `land`\" | \"at land\" | \"after this lands\" | \"once it lands\" |\n   \"\
  when this landed\" ] — any one of them, in the same acceptance entry that names\
  \ the event token.\n    AC3 named the `land_completed` row (the RIGHT artifact)\
  \ with no such tie, `audit post\n   --land-emitted-event` refused fail-closed, and\
  \ clearing it cost a governed acceptance amendment\n   plus a further audit round-trip\
  \ on a card already at its audit-loop ceiling. The fix is always\n   the wording,\
  \ NEVER a request to widen the matcher to fit it: naming WHICH evidence is pending\
  \ is\n   the whole reason the carve-out is not a blanket excuse (rule home → the\
  \ guard and its phrase set\n   at `bin/lib/audit.py#land_emitted_named_evidence`,\
  \ the overlay at SPEC-0036; neither is\n   restated here beyond the examples above).\n\
  \   AND THE TIE IS ONLY HALF — THE ENTRY MUST ALSO NAME THE EVENT TOKEN. The guard\
  \ admits on TWO\n   things present in the SAME acceptance entry: a phrase from the\
  \ set above, AND the snake_case\n   EVENT TOKEN that carries the proof. (One alternative\
  \ shape, and only one: an `X-NNNN`\n   coordination id the acceptance names that\
  \ the card ALSO carries in `resolves_cross` — that\n   link is what makes `land`\
  \ emit the item's closing row, so it is a STRUCTURAL land-tie and\n   needs no phrase.)\
  \ Name NEITHER shape and the guard returns nothing, `audit post\n   --land-emitted-event`\
  \ refuses FAIL-CLOSED, and the base audit-post REDs on evidence that could\n   not\
  \ exist yet. **So an acceptance criterion whose proof is LAND-EMITTED must NAME\
  \ THE EVENT\n   TOKEN CARRYING IT.** The why is not decorative, and it is the reason\
  \ this is an obligation\n   rather than a style note: the overlay that would rescue\
  \ such a criterion can only match a\n   NAME, so a criterion it cannot match is\
  \ UNSATISFIABLE BY CONSTRUCTION — the Stage-8 audit REDs\n   on the absent evidence,\
  \ and that RED blocks the very land that would have produced it. No\n   execution\
  \ order satisfies it and no re-audit converts it. AC3 named the right\n   ARTIFACT\
  \ and no tie; AC4, written the same week, named the right ROUTE and no token\n \
  \  — two halves of one obligation, missed independently, which is why both are now\
  \ stated and\n   not just the first.\n   **DO NOT read this as \"do not write land-emitted\
  \ criteria\".** They are legitimate and in\n   routine use, and the whole deferred-proof\
  \ declaration family exists to carry them. What is\n   forbidden is a land-emitted\
  \ criterion that names NO carrier — the naming is precisely what\n   keeps the carve-out\
  \ narrow instead of a blanket excuse, so a rule banning the pattern would\n   remove\
  \ real coverage rather than fix the shape.\n   **Worked NEGATIVE example, beside\
  \ the wording that would have passed** — AC4. The\n   FAILING wording:\n\n     \
  \  AC4: the land that ships this clears the pinned last-green failure by the SANCTIONED\n\
  \       route. Probe: the land records a narrow per-assertion re-baseline naming\
  \ this exact\n       assertion, authorized under SPEC-0077 A-prime — either an owner\
  \ ack or the\n       dispatched-Worker self-clear with all five conditions met and\
  \ the mechanical tie recorded\n       in the >=30-char reason. FAILS on --no-tests,\
  \ on a forced land, or on a reason that does\n       not name the assertion and\
  \ the change that obsoletes it.\n\n   It names the land, the sanctioned route, the\
  \ authorization and two failure modes — and no\n   event token. The overlay refused\
  \ fail-closed, the Stage-8 audit RED-ed on exactly one finding\n   (\"AC4 not evidenced\"\
  ), and clearing it cost a rung-2 adversarial consult plus a recorded\n   acceptance\
  \ amendment (`events.jsonl#ts=`). The wording that PASSES carries\n   the tie AND\
  \ the token in the same entry:\n\n       AC4: the land that ships this clears the\
  \ pinned last-green failure by the SANCTIONED\n       route. THIS PROBE IS LAND-EMITTED\
