  - **VP4 (graph-indexed):** `bin/yitc-v2 graph build` indexes SPEC-0007 as a `spec` node (the spec NODE
    — NOT the staged spec-body rule-extraction of rule 7, which is downstream). Evidence: `graph query
    SPEC-0007` resolves.
  - **VP5 (tier classification, dogfood):** the V2 self-adoption table classifies the 5 handbook files +
