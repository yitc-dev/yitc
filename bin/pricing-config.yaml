# Provider token pricing — owner-editable DATA for the token-rollup lens.
# CHARTER §P4b: provider-neutral normative text; concrete provider bindings live here.
#
# ESTIMATE-MARKED: rates sourced from the provider price-page cache of 2026-05-26;
# prices change — VERIFY against the current provider price page before relying on
# absolute $ figures. Comparisons across sessions computed with the SAME current
# table stay valid (the owner decision 2026-06-05: price is NEVER stored — cost is
# derived at read-time = archived tokens x CURRENT rates).
#
# Units: USD per 1,000,000 tokens (per-Mtok). cache_write_5m / cache_write_1h are
# the 5-minute / 1-hour cache-write tiers (1.25x / 2x input); cache_read ~= 0.1x input.
# A model absent from this table is reported as unpriced (cost_usd: null) — never guessed.

estimate: true
rates_source: provider price-page cache 2026-05-26 (owner-editable; verify before absolute use)

rates_per_mtok:
  the AI provider-opus-4-8:
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write_5m: 6.25
    cache_write_1h: 10.00
  the AI provider-opus-4-7:
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write_5m: 6.25
    cache_write_1h: 10.00
  the AI provider-opus-4-6:
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write_5m: 6.25
    cache_write_1h: 10.00
  the AI provider-sonnet-4-6:
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write_5m: 3.75
    cache_write_1h: 6.00
  the AI provider-haiku-4-5:
    input: 1.00
    output: 5.00
    cache_read: 0.10
    cache_write_5m: 1.25
    cache_write_1h: 2.00
  # OpenAI / <external-auditor> worker models — list price per the OpenAI API price page. gpt-5.5 per 2026-06-25
  #. gpt-5.4 + gpt-5.4-mini SHORT (<272K) rates re-aligned 2026-06-29 to the then-current page
  # (a post-5.5-launch reprice of the older models; deviation
  # `pricing-config-<external-auditor>-gpt-5.4-mini-rates-stale-vs-current-openai-page`). These are SHORT-context base
  # rates; the >272K long-context tier is now MODELED here via each model's `long_context:` block.
  # OpenAI has NO separate cache-WRITE surcharge, so cache_write_5m/1h mirror `input` (the <external-auditor>
  # economy lens reads only input/output/cache_read; the write tiers are present for schema parity).
  #
  # `long_context:` — the OpenAI >272K-input tier. When a request's context exceeds
  # `threshold_input_tokens`, THAT request (not the whole session) is billed at input × input_multiplier
  # and output × output_multiplier (cached-input follows input_multiplier). The scorecard buckets usage
  # PER-CALL — only the >272K calls are tiered; sub-272K calls stay flat (a mixed session is NOT
  # wholesale re-priced). ⚠ ESTIMATE — the 2.0/1.5 multipliers are the fu_2cbc4ae1fb99 author's
  # UNVERIFIED understanding, NOT an OpenAI price page; `source: estimate` marks them. Confirm the REAL
  # tier figure via the deferred >272K probe ( scope) before relying on absolute long-context $.
  # A model with NO long_context block is priced flat at all context sizes (the AI provider models: no block).
  # gpt-5.6-sol — the auditor model on BOTH tiers since 2026-09-04. Rates read from
  # developers.openai.com/api/docs/models/gpt-5.6-sol on 2026-09-04; these are PROMOTIONAL prices
  # stated to hold at least through 2026-11-21 — re-check the page after that date. Without this row
  # the economy lens would silently price Sol at the `openai` provider fallback below (5.00/30.00).
  gpt-5.6-sol:
    input: 4.00
    output: 20.00
    cache_read: 0.40
    cache_write_5m: 4.00
    cache_write_1h: 4.00
    long_context: {threshold_input_tokens: 272000, input_multiplier: 2.0, output_multiplier: 1.5, source: estimate}
  gpt-5.5:
    input: 5.00
    output: 30.00
    cache_read: 0.50
    cache_write_5m: 5.00
    cache_write_1h: 5.00
    long_context: {threshold_input_tokens: 272000, input_multiplier: 2.0, output_multiplier: 1.5, source: estimate}
  # RETIRED FROM THE PROVIDER (reported 2026-08-31; — not re-verifiable from this
  # checkout, the <external-auditor> CLI exposes no model list). The two rows below are KEPT ON PURPOSE and
