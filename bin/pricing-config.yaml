# ─────────────────────────────────────────────────────────────────────────────
# Provider-level FALLBACK rates — keyed by the normalized `provider` vocab
# (SPEC-0025 §Normalized provider×model×effort vocabulary; SPEC-0135 observation loop).
# The token-rollup lens tries the exact model in `rates_per_mtok:` FIRST; only when a
# model id is ABSENT there does it fall back to its provider's rate here — the provider
# is derived from the model-id prefix (the AI provider-* → the provider, gpt* → openai — the same
# rule that keys `provider_subscription:` below). This gives an observed cross-provider
# "bench prior-art" cost when a specific model is not individually priced yet, instead of
# an unpriced null. A model whose provider is unknown (no prefix match) still yields null
# — never guessed (the same discipline as the per-model table).
#
# ⚠ ESTIMATE — same units (USD per-Mtok) and same estimate caveat as rates_per_mtok above;
# these are representative provider rates, NOT an invoice. Owner-editable; verify before
# relying on absolute $. Cost stays read-time-derived, never stored (SPEC-0135).
rates_per_provider:
  the provider: # representative the AI provider flagship (opus-tier) rate
    input: 5.00
    output: 25.00
    cache_read: 0.50
    cache_write_5m: 6.25
    cache_write_1h: 10.00
  openai: # representative OpenAI/<external-auditor> flagship (gpt-5.5) rate
    input: 5.00
    output: 30.00
    cache_read: 0.50
    cache_write_5m: 5.00
    cache_write_1h: 5.00

# ─────────────────────────────────────────────────────────────────────────────
# Subscription window budgets — feed the scorecard ECONOMY %-of-window metrics
# (pct_short_window / pct_weekly_window; SPEC-0047 rule 6b). A flat-rate Pro
# subscription exposes no literal per-dollar meter, so each window `cap` is an
# OWNER-SET modeled budget-per-window ($-equivalent proxy), NOT a provider per-dollar
# rate — so price-never-stored holds: a cap is a budget figure, not a price.
# The scorecard reports run_cost / window_cap; these caps are the SOLE runtime home.
#
# ⚠ ESTIMATE — caps below are seeded from the owner's 2026-06-28 illustrative anchor
# ($2 = 2% of short → cap 100; $2 = 0.5% of weekly → cap 400). CONFIRM the real
# Pro200 window ceilings before relying on the postcheck %-of-window batch.
# Each window cap carries a `source:` provenance marker (SPEC-0047 rule 6b):
# estimate = a modeled budget-per-window proxy (the labelled FALLBACK, used until calibrated);
# calibrated = derived from a REAL provider window-utilization measurement (cap = cost / Δutilization).
# The calibrator (calibrate_windows.py) flips a window to `source: calibrated` with the real
# median cap + provenance once enough real samples exist; an under-sampled re-run RESTORES the window to
# `source: estimate` + cap = estimate_cap. `estimate_cap` is the NEVER-LOST modeled fallback (so a
# downgrade always has a value to restore to). A missing source reads as `estimate` (back-compat). The
# scorecard surfaces this provenance per row (win_cap_source).
subscriptions:
  openai-pro200:
    short: {period: 5h, cap: 100.0, estimate_cap: 100.0, source: estimate} # rolling 5-hour ("short") window
    weekly: {cap: 400.0, estimate_cap: 400.0, source: estimate}
    unit: usd-budget-proxy-per-window
  the provider-pro200:
    short: {period: 5h, cap: 100.0, estimate_cap: 100.0, source: estimate}
    weekly: {cap: 400.0, estimate_cap: 400.0, source: estimate}
    unit: usd-budget-proxy-per-window

# Provider → active subscription. The scorecard derives the provider from the model-id
# prefix (the AI provider-* → the provider, gpt-* → openai), then maps it here to the subscription
# whose window caps the run cost is measured against.
provider_subscription:
  the provider: the provider-pro200
  openai: openai-pro200

# ── Context-window utilization sensor (SPEC-0115) — DATA for `bin/yitc-v2 session context` ──
# Two owner-editable knobs the sensor reads (NOT spec-governed scalars — owner-tunable per deployment):
#
# context_refresh_threshold_pct — the refresh-due threshold as a % of the window (SPEC-0114 trigger
# source (b)). One knob for v1; start 55 (owner band 50–60). Units = % of window (survives a model /
# window change), never absolute tokens.
context_refresh_threshold_pct: 55
#
# context_window — per-model window SIZE in tokens. The sensor divides last-completed-turn occupancy
# by this. A model ABSENT here is reported `window: unknown` (verdict suppressed) — NEVER guessed,
# mirroring the rate table's "unpriced → null, never guessed" discipline. An absent model is now
# fail-VISIBLE: the sensor line WARNs, naming the model + this key ( — an unmapped model
# silently suppressed the SPEC-0114 refresh proposal for a full day).
# NOTE (deployment-specific): the provider transcript records the model id WITHOUT the long-context
# suffix (e.g. `the AI provider-opus-4-8`, not `the AI provider-opus-4-8[1m]`), so these windows reflect THIS owner's
# 1M-context ([1m]) deployment — verified live 2026-06-30 (the AI provider-opus-4-8 read 213.5K occupancy at
# ~21% of 1M). A non-[1m] deployment of the same model has a 200K window — re-tune here per deployment.
# CALIBRATE a new entry from the live transcripts, never by faith-copying a sibling: take the model's
# MAX observed input-side occupancy — a reading above 200K proves the [1m] deployment (the AI provider-fable-5
# read 659.3K on 2026-07-12, so 1M;. the AI provider-opus-5 read 390751 on 2026-08-06, so 1M).
# SECOND SANCTIONED PATH — a model with no calibration-sufficient reading yet (nothing above
# 200K) MAY be entered on an explicit OWNER DIRECTIVE, recorded as owner-set with the date + the
# max-observed datum at entry; re-check when the first >200K reading arrives. SPEC-0115 §Parameters
# names this map CONFIG DATA (owner-editable) and forbids only the SENSOR guessing, so an owner-set
# value is not a guess — but it must be labelled as owner-set, never as a calibration.
# (the AI provider-fable-5-1: owner-set 1M on 2026-09-02 per owner directive, entered when its max observed was
# 165534 — below 200K, proving nothing either way. Re-measured the same day at Execution: 259441, now
# ABOVE 200K, so the ordinary method above independently corroborates 1M;.)
context_window:
  the AI provider-opus-4-8: 1000000
  the AI provider-opus-4-7: 1000000
  the AI provider-opus-4-6: 1000000
  the AI provider-fable-5: 1000000
  the AI provider-opus-5: 1000000
  the AI provider-fable-5-1: 1000000
