spike_sandbox:
  # SPEC-0172 — the throwaway debugging SANDBOX wiring. DECLARE-OR-WAIVE; to declare, replace the
  # waiver with:
  # Rule text: `__YITC_CLI__ graph query SPEC-0172 --kernel`
  # bridge:
  # pin: <exact release ref of the shared bridge library this project runs — rule 3>
  # enabled: true # is the bridge actually in use here
  # cage_checks: <where the machine-checked cage rules live — rule 4>
  # The pin is a release ref, never a local copy; `enabled:` is a switch, not a permission.
  # see SPEC-0172 §2, §3, §4
  # Turning the full cage on later assumes docker compose with ports bound to <ip>.
  waiver:
    reason: >-
      no spike sandbox yet — this project runs no pinned bridge and keeps no caged spike stack.
      Replace this waiver with `bridge: {pin, enabled, cage_checks}` when it does (SPEC-0172
      rules 2-4); a spike is a throwaway exploration whose exit is knowledge, never landed code.
spike_data_safety:
  # SPEC-1054 — a RESTORED production copy in a spike sandbox. The kernel ships the mechanism;
  # WHAT it protects is your recorded decision.
  # Rule text: `__YITC_CLI__ graph query SPEC-1054 --kernel`
  # data_safety:
  # reachability: <your surfaces holding values that can route, authenticate, identify,
  # schedule or trigger — default verb NEUTRALIZE; a recorded ACCEPT overrides>
  # disclosure: <your surfaces holding content harmful merely by being READ —
  # mask / minimize / exclude, or a recorded ACCEPT>
  # operational_state: <your surfaces holding state that DOES WORK when anything consumes it
  # — outbox, jobs, schedulers, triggers, CDC — DEFUSE, or a recorded ACCEPT>
  # none_of_the_three: <surfaces you answer as carrying NO strand, each with a reason —
  # SILENCE is refused, not incompleteness>
  # proof: <where the querying proof RUNS — it must carry a control PER DETECTOR,
  # cover derived surfaces + executable schema, and fail closed>
  # Or by reference to a decision file:
  # `data_safety: {decisions: bin/spike-data-classes.yaml, proof: <where the proof RUNS>}`
  # Defaults (actor split, NEUTRALIZE, artifact window, destruction) hold until your decision file
  # records an ACCEPT or override naming class, purpose, readers, scope, destruction; the proof
  # names each. Probe output passes BOTH limbs of SPEC-1054 rule 4.
  # see SPEC-1054 §0, §3, §5, §6
  waiver:
    reason: >-
      no restored production copy — this project runs no spike sandbox filled from a production
      dump. Replace this waiver with `data_safety: {reachability, disclosure, operational_state,
      none_of_the_three, proof}` when it does (SPEC-1054 rules 5-6).
verify_policy:
  # SPEC-0186. Whether this project pays the pinned last-green verify leg at land: `all` (the
  # default) or `never` with a mandatory `reason:`. An audited edit; the engine declares it too
  # (SPEC-0186 rule 6).
  # Rule text: `__YITC_CLI__ graph query SPEC-0186 --kernel`
  # see SPEC-0186 §Rule 1, §Rule 5
  # The keys are COMMENTED by design — uncomment one to make a real choice:
  # pinned_last_green: all
  # reason: ~
  # BORN-PERMISSIVE DECLARATION (SPEC-0189): written only by
  # `init --confirm-born-permissive verify_policy:<owner>`; restore with `pinned_last_green: all`
  # (SPEC-0189 rule 4).
  # see SPEC-0189 §Rule 8
  pinned_last_green: never
  reason: "born permissive per the owner directive of 2026-08-21 — a new project does not pay the
    pinned last-green leg from day one; the periodic review watches for the absence starting to cost
    something and PROPOSES turning it back on (SPEC-0189). Restoration is this project's own explicit
    act — set `pinned_last_green: all` here."
kernel:
  # SPEC-0195 — WHICH engine and content release this project PINS, never copies. To declare,
  # replace the waiver with:
  # Rule text: `__YITC_CLI__ graph query SPEC-0195 --kernel`
  # engine: # the EXECUTABLE dependency (rule 3, first carrier)
  # release_repo: <absolute path to the local clone of the published release mirror>
  # release: <the EXACT release TAG — e.g. v0.5.0>
  # anchor: <OPTIONAL — the out-of-band trust-root fingerprint (rule 7); when declared, the
  # pinned tree is verified against the signed manifest before it is used>
  # content: # OPTIONAL — this project's own RECORD of the content pin (rule 3,
  # # second carrier). The carrier itself is the installed tree's
  # # signed manifest, moved by `release update`; no kernel reader
  # # consumes this mapping.
  # release: <the release tag the installed content was cut from>
  # answers: <OPTIONAL — where this project keeps its own init answers, if it keeps any, or ~;
  # no update reads it>
  # The ref is an EXACT release tag: a branch is refused, an unknown tag is a loud `pin-unresolved`.
  waiver:
    reason: >-
      Initialized via `bin/yitc-v2 init` — no pinned kernel release yet; this project runs the
      engine it was invoked with, from the
      workshop it lives beside. Replace this waiver with `engine: {release_repo, release}` once a
      release is published and this project installs from the artifact rather than the shared
      filesystem (SPEC-0195 rules 3-4).
overrides:
  # SPEC-0196 — the OVERRIDE LEDGER, the only sanctioned local divergence from an upstream-owned
  # file. Born EMPTY. Each entry carries exactly these four fields:
  # Rule text: `__YITC_CLI__ graph query SPEC-0196 --kernel`
  # path: the upstream-owned file diverged from
  # rationale: one plain sentence — why this project needs the divergence now
  # upstream_intent: temporary-patch | forwarded | accepted-exception | not-forwarded
