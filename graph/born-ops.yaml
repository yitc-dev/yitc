# yitc-ops.yaml — this project's OPS contract carrier: one top-level SECTION per concern. Each
# section is DECLARE-OR-WAIVE, fail-closed: its declaration OR `waiver: { reason: <text> }`; a section
# left unanswered is an init/sweep ERROR. The kernel owns each section's SHAPE, this project the VALUES.
# Each section carries a short cue and the command that prints its full rule — read it before answering.
# Carrier rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
# A hand-runnable deploy script EMBEDS the governed-deploy guard at its top: `__YITC_CLI__ deploy --print-guard`

deploy:
  # Rule text: `__YITC_CLI__ graph query SPEC-0094 --kernel`
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no deploy command yet; replace with `command: <cmd>` once a deploy exists."
  policy:
    # Deploy-AUTONOMY stance. Born WAIVED → owner-gated every deploy, never auto-granted.
    # `recommended:` below is INERT: tune it, rename it to `classes:` and remove this `waiver:`.
    # Rule text: `__YITC_CLI__ graph query SPEC-0097 --kernel`
    # see SPEC-0097 §2, §9
    waiver:
      reason: "Initialized via `bin/yitc-v2 init` — no deploy-autonomy policy yet; stays owner-gated every deploy (the pre-policy default, never auto-granted). A recommended A/S/C1/C2 template is seeded below under `recommended:` — tune its per-class values, then promote it to `classes:` (removing this waiver) to opt into autonomous deploys (SPEC-0097)."
    recommended:
      # RECOMMENDED A/S/C1/C2 starting template — NOT an active
      # declaration: it is a sibling of `waiver:` and is IGNORED by the deploy gate until promoted to
      # `classes:`.
      A:   # code-only / trivially reversible: an inline post-deploy health gate + the per-change live-probe.
        evidence: "<deploy command's inline post-deploy gate (health 200 + containers up + smoke, auto-rollback on failure) + the per-change live_probe at the deploy seam (SPEC-0094 §4)>"
      S:   # security-affecting: a read-only security probe asserts auth is STILL enforced.
        # BOTH keys are required to deploy S; a property not assertable read-only declares
        # `unprobeable: <reason>` instead (escalates).
        security_probe: "<a read-only command asserting the security property still holds — exit 0 = holds; e.g. curl -fsS -o /dev/null -w '%{http_code}' <url> | grep -qx 401>"   # ownership: kernel-executed reader=bin/lib/deploy.py#_security_probe_precondition effect=bin/lib/deploy.py#cmd_deploy:emit:deploy_security_probe_passed
        security_probe_budget_seconds: 60   # <positive int — the probe must answer read-only within it>   # ownership: kernel-executed reader=bin/lib/deploy.py#_security_probe_precondition effect=bin/lib/deploy.py#cmd_deploy:refuse
        # OPTIONAL — the declared `security.probes[]` properties this probe proves (SPEC-0093 rule 27).
        # security_probe_properties: ["<property>"]
        # OPTIONAL DOWN-surface carve-out, both keys or neither: exit 0 = serving, exit 1 = down
        # (the only exit that opens it), any other exit or a timeout = refuse — never «any non-zero ⇒ down».
        # see SPEC-0097 §2a
        # Worked example — map curl's connection refused (7) / timeout (28) onto 1:
        # liveness_probe: "curl -fsS -o /dev/null --max-time 5 https://<host>/healthz; c=$?; \
        # [ $c -eq 0 ] && exit 0; { [ $c -eq 7 ] || [ $c -eq 28 ]; } && exit 1; exit 2"
        # liveness_probe_budget_seconds: 10
        # REPLACE <host> and uncomment BOTH lines; never uncomment a placeholder verbatim.
        # liveness_probe: "<read-only; exit 0=serving / 1=down / other=unknown — see the worked example above>" # ownership: kernel-executed reader=bin/lib/deploy.py#_liveness_probe_precondition effect=bin/lib/deploy.py#cmd_deploy:refuse
        # liveness_probe_budget_seconds: 10 # <positive int — the probe must answer read-only within it> # ownership: kernel-executed reader=bin/lib/deploy.py#_liveness_probe_precondition effect=bin/lib/deploy.py#cmd_deploy:refuse
        evidence: "<the project's declared security live-probes (the `security:` section below) asserting auth is still enforced after deploy; read-only so autonomous; if a property is not read-only probeable → escalate (SPEC-0097 §2)>"
      C1:  # DB/state-changing but recoverable within RTO/RPO: pg_dump + restore-drill + a delayed re-check.
        # A command + its budget are both required; accepted flat alias: `pg_dump: "<cmd>"` +
        # `pg_dump_budget_seconds: 120`.
        pg_dump:   # ownership: kernel-executed reader=bin/lib/deploy.py#_normalize_pg_dump effect=bin/lib/deploy.py#cmd_deploy:emit:deploy_backup_taken
          command: "<pre-deploy pg_dump of the live DB — e.g. docker exec <db> pg_dump -U <user> -d <db> -Fc>"
          dump_budget_s: 120   # <positive int — §4 duration budget; exceeding it ⇒ Class C2 (escalate)>
        # expected_database: <the database this project's C1 deploy dumps, e.g. myapp_prod>
        # OPTIONAL — declared ⇒ the dump must name this database or the deploy refuses.
        # restore_drill is OPERATOR-OWNED (SPEC-0150): its PASS is journal-recorded, no kernel reader runs it.
        restore_drill: "<the restore-drill command proving the dump restores — e.g. bash bin/restore-drill.sh>"   # ownership: operator-owned
        evidence: "<the pg_dump (within budget) + the restore-drill record + the delayed re-check past the observation window — the class-proof is COMPLETE only after that later re-check (SPEC-0097 §5), never at deploy_completed alone>"
      C2:  # NOT acceptably reversible within RTO/RPO: owner escalation, NO autonomous deploy.
        # After owner approval the verb first runs the `C1:` dump (there is no C2 dump key);
        # a failed, empty or wrong-database dump refuses the deploy.
        # see SPEC-0097 §5
        escalate: "owner decision REQUIRED with the concrete RTO/RPO risk; `deploy --class C2` escalates (no autonomous deploy_completed — SPEC-0097 §5)"   # ownership: operator-owned
  convergence:
    # Post-deploy CONVERGENCE check. Born WAIVED → this project's deploy is NOT
    # convergence-verified: the kernel emits deploy_completed on the deploy command's exit-0 alone,
    # so a service left on old code is not caught. Opt in: every in-scope service + a command
    # printing the revision it RUNS; a mismatch fails the deploy.
    # Rule text: `__YITC_CLI__ graph query SPEC-0097 --kernel`
    waiver:
      reason: "Initialized via `bin/yitc-v2 init` — no convergence check declared yet; deploy_completed is emitted on the deploy command's exit-0 alone, so a service left on old code would NOT be caught (X-0374). Declare `services:` (each with a command printing the revision it runs) to opt in (SPEC-0097 §11)."
    recommended:
      # INERT until promoted: rename `recommended:` → `services:` and delete the `waiver:` above.
      # <service>: <command printing the revision that service RUNS — exit non-zero / silence = NOT converged>
      web: "<e.g. docker compose exec -T web cat /app/REVISION>"
      # OPTIONAL per service: the mapping form {command, health}.
      worker: "<e.g. docker compose exec -T worker cat /app/REVISION — the worker is the one that gets skipped (X-0374)>"
    # budget_seconds: 120 # OPTIONAL positive int — per-service ask timeout; absent ⇒ kernel default.
    # out_of_scope: # DECLARE-OR-WAIVE: a service deliberately NOT verified names itself + WHY.
    # nginx: "reverse proxy — carries no app revision" # never probed, but journalled: an exemption
    # # is declared, never silent (a blank reason refuses).
  host_config:
    # HOST-level config surface (SPEC-0093 rule 14). Born WAIVED → no host nginx/vhost surface.
    # To declare: `vhost_files:` + `live_base_url:` + `apply:`. Waiver LOOSE (bare `reason:`).
    # Rule text: `__YITC_CLI__ graph query SPEC-0111 --kernel`
    waiver:
      reason: "Initialized via `bin/yitc-v2 init` — no host-level (nginx/vhost) config surface yet; declare `vhost_files:` + `live_base_url:` + `apply:` once this project owns host config (SPEC-0093 rule 14)."
  runtime_delivery:
    # SPEC-0093 rule 22. DECLARE how code reaches the runtime: replace this waiver with ONE `model:`
    # (an unknown model fails closed):
    # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
    # model: image-baked # a built artifact runs — the deploy verb IS the only path to prod
    # model: source-mounted # bind-mounted source — a recreate ships main WITHOUT the verb (BYPASSABLE)
    # model: hot-reload # re-reads source on change — BYPASSABLE
    # model: hybrid # some baked, some mounted — BYPASSABLE; the halves can ship separately
    # A bypassable model gates nothing (SPEC-0119 rule 16). Waiver LOOSE.
    # see SPEC-0093 §22
    waiver:
      reason: "Initialized via `bin/yitc-v2 init` — no runtime-delivery model declared yet; declare a `model:` (image-baked | source-mounted | hot-reload | hybrid) once this project has a runtime, or keep this waiver if it legitimately has none (a library / CLI / no prod surface). A BIND-MOUNTED runtime makes the deploy verb BYPASSABLE — a container recreate ships main with no gate and no deploy_completed (X-0370: half a paired change shipped, 8h outage)."
rollback:
  # Rule text: `__YITC_CLI__ graph query SPEC-0094 --kernel`
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no rollback command yet; replace with `command: <cmd>` once a rollback exists."
live_probe:
  # Rule text: `__YITC_CLI__ graph query SPEC-0094 --kernel`
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no live probe yet; replace with `live_base_url:` + `dialect:` once a deploy target exists."
security:
  # SPEC-0093 rule 8. DECLARE a `probes:` list ({ property, assertion, url }) or keep this STRICT
  # waiver (SPEC-0093 rule 6): reason + compensating_control + a real-ISO-date expiry.
  # Rule text: `__YITC_CLI__ graph query SPEC-0098 --kernel`
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no project-specific security live-probe yet; declare a `probes:` list once this project has a security/auth surface."
    compensating_control: "Kernel always-on security baseline: prompt-injection protection, the `security-review` skill, secrets-out-of-git, the host-leak canary."
    expiry: "2026-12-31"   # review-by date — REPLACE with your real security-review date.
  audit:
    # SECURITY-AUDIT CADENCE: a deterministic script on a system trigger writes the report the deploy
    # gate checks. DECLARE `cadence:` + `freshness_sla:` + `runner:`, or keep this STRICT waiver
    # (SPEC-0093 rule 6).
    # Rule text: `__YITC_CLI__ graph query SPEC-0145 --kernel`
    waiver:
      reason: "Initialized via `bin/yitc-v2 init` — no project-specific security-audit cadence yet; declare `cadence:` + `freshness_sla:` + `runner:` once this project has a security surface (SPEC-0145)."
      compensating_control: "Kernel always-on security baseline: prompt-injection protection, the `security-review` skill, secrets-out-of-git, the host-leak canary."
      expiry: "2026-12-31"   # review-by date — REPLACE with your real security-review date.
    profile_snapshot:
      # PROFILE SNAPSHOT — active at birth, nothing to answer: `command:` is a kernel-rendered value
      # (SPEC-0119 rule 13). To opt out, replace it with a `waiver:` whose `reason:` says why.
      # Rule text: `__YITC_CLI__ graph query SPEC-0145 --kernel`
      command: "__YITC_CLI__ --read-only profile --json"
ui:
  # SPEC-0093 rule 9. DECLARE `baseline: <named design-system>` (optional styleguide/tokens/lint/
  # archetype) once there is a UI. This is the primary design intake (X-0054) — GREENFIELD: choose it;
  # BROWNFIELD — derive it from the existing UI code.
  # Waiver LOOSE.
  # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no UI baseline yet; declare a `baseline: <named design-system>` (+ `archetype:`) once this project has a UI surface — greenfield: declare up front; brownfield: derive it from existing UI code (the design-from-outside inversion, X-0054)."
tests:
  # SPEC-0093 rule 10. DECLARE a `classes:` list ({ class, moment }, optional command) — the test
  # INVENTORY, not the land gate (`verify.layers`). Timing-sensitive globs: SPEC-0160 rule 10.
  # Intake below — answer it in the `classes:` you declare.
  # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
  # TEST-CLASS intake — "what are your test classes, and what does each one DEPEND ON?" — in THREE passes:
  # PASS 1 — NAME THE CLASSES here. PASS 2 — name what each DEPENDS ON (a container, a database, a
  # browser, a bundle, an install — or nothing). That is the FIRST `verify.layers` cut rule:
  # CLASSES THAT SHARE AN ENVIRONMENT STAY IN ONE LAYER (a split pays that SETUP COST a second
  # time); a class with its OWN dependency earns its own layer + `subject_globs:`.
  # PASS 3 — INSIDE a class, name the GROUPS that are HEAVY AND NARROW IN SUBJECT (a few files that
  # hold most of the class's run time while exercising one small part of the project). That is
  # the SECOND cut rule, and for such a group it outweighs the first: give each ITS OWN LAYER +
  # `subject_globs:` naming that narrow subject — a second setup costs SECONDS, a heavy group run
  # on every land costs MINUTES. MEASURE both before you split; a group that is light, or whose
  # subject is the whole project, stays where it is.
  # GREENFIELD — declare the classes you intend; BROWNFIELD — DERIVE them from what runs today.
  # Passes 1 and 2 answered = a carrier that already satisfies rule 26 (cross-section correspondence).
  # see SPEC-0160 §10; SPEC-0093 §26
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no test taxonomy declared yet; declare a `classes:` list (each {class, moment}) once this project runs tests. The executable land-verify gate lives in the carrier `verify.layers` (SPEC-0152 rule 16)."
  # PRE-DEPLOY CLASS (SPEC-1051) — switch on after your first declared deploy, in place of the
  # waiver; `__YITC_CLI__ pre-deploy list --write` then writes `units:`.
  # classes:
  # - class: pre-deploy
  # moment: pre-deploy
  # reason: "<why these checks leave the lands>"
  # targets: [default]
  # units: []
verify:
  # SPEC-0152 rule 16. `verify.layers` is the land-layer universe: a `layers:` list ({ layer, command }
  # or { layer, waiver }) or a whole-concern waiver. `land` runs each command on the LIVE host — keep
  # it HERMETIC (ephemeral ports, never mutating prod/host state): a non-hermetic command makes
  # `land` destructive. Author `subject_globs:` from a DEPENDENCY AUDIT, NOT by copying `covers:`.
  # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
  # Container shape — choose it KNOWINGLY and write the reason in the layer comment:
  # - THROWAWAY: each probe brings up and tears down its own container (`compose run --rm`).
  # - EXEC: the layer brings a stack up ONCE and each probe runs inside it (`compose exec`).
  # see SPEC-0152 §16; SPEC-0093 §3
  # TIMEOUT — per-layer `timeout:` / section `timeout_seconds:`, read env · layer · section ·
  # machine setting · default; a malformed value fails the land CLOSED. HOW TO CHOOSE THE NUMBER: SPEC-0208.
  # BORN LAYER `integrity` — the engine's corpus check over THIS checkout: spec binding
  # tokens + the derived graph files (`graph build` refreshes them). Hermetic and read-only, needs
  # no test files. Add your own layers beside it; it is also the quick set `post_sync_set` names.
  # `--strict` also fails a dead implements anchor, a stale anchor signature, a stale index.
  layers:
    - layer: integrity
      command: __YITC_CLI__ -C "$PWD" graph conformance --strict
  post_sync_set: [integrity]
  # ── declaration-gated capabilities (generated from the concern registry) ──
  # An OPT-IN key this section gates a kernel capability on. ABSENT is the fail-closed default, so
  # nothing below is engaged until you write it in — and leaving it commented is a legitimate answer,
  # as long as it is a KNOWING one. Uncomment and answer to make the choice; the kernel never infers it.
  #
  # combined_candidate_safe: true # (SPEC-0152)
  # turns on: land-verify BATCHING — several queued lands verified TOGETHER, in ONE pass over a
  # combined candidate, instead of a full verify per land. Declare it only if your layers
  # isolate one change from another: a shared fixture, port, database or build cache can make
  # one member's failure indistinguishable from a peer's, which is why the kernel cannot infer
  # this.
  # while absent: every land is verified alone — batches of one, whatever the queue depth.
  #
  # independent_layers: [static, frontend-unit] # (SPEC-0152)
  # turns on: CONCURRENT land-verify layers — the layers named here run OVERLAPPED in one land
  # instead of one after another (the wall drops from their sum towards their longest). YOU
  # decide, and you bear the risk: naming layers here is your project's own risk judgement.
  # The kernel checks the shape of the list only and never polices independence, so a wrong
  # declaration costs only your own verify. Before declaring, check each named pair, their
  # `prep:` included, against every resource class two layers can collide on: mutable_files,
  # caches, temp_paths, services, locks, processes, shared_sinks. A per-layer `owns:`
  # declaration is an optional aid for that check, never a requirement. Fail-fast, per-layer
  # timeouts and the per-layer rows are unchanged; a name matching no declared layer fails the
  # land closed.
  # while absent: every declared layer runs serially, in declaration order — the verify wall is
  # their sum.
  #
  # layer_worker_shares: {static: 0.1, frontend-unit: 0.6, stack: 0.2, sandbox: 0.1} # (SPEC-0152)
  # turns on: HOW YOU SPLIT the land's worker allotment across your layers — a mapping of layer
  # name to that layer's FRACTION (a number in (0, 1], never a core count, so a change to the
  # kernel's allotment re-splits automatically and nothing here is rewritten). The kernel
  # declares the form, validates it, records each share beside the CPU that layer actually
  # consumed, and keeps publishing the WHOLE allotment in YITC_VERIFY_LAYER_WORKERS; it
  # computes nothing and publishes no per-layer number. YOU split it and scale your own
  # runners — only you know what your layers do. The sum is deliberately unchecked: there is
  # no over-allocation guard, and a share that floors at one worker is your arithmetic.
  # while absent: every layer reads the whole allotment — unsplit, as today.
audit_scrutiny:
  # SPEC-0178. OPT-IN. Absent ⇒ every substantive task takes audit-post. A declared case closes
  # matching cards WITHOUT audit-post, recorded with its reason.
  # Rule text: `__YITC_CLI__ graph query SPEC-0178 --kernel`
  # see SPEC-0178 §Rule 1, §Rule 5
  # cases: # ownership: kernel-executed reader=bin/lib/task.py#_audit_scrutiny_cases effect=bin/lib/task.py#cmd_task_close:emit:task_closed
  # - case: docs # ownership: kernel-executed reader=bin/lib/task.py#_case_valid effect=bin/lib/task.py#cmd_task_close:emit:task_closed
  # match: { paths: [docs/**] } # ownership: kernel-executed reader=bin/lib/task.py#_case_match effect=bin/lib/task.py#cmd_task_close:emit:task_closed
  # exempt: audit-post # ownership: kernel-executed reader=bin/lib/task.py#_case_exempt_refusal effect=bin/lib/task.py#cmd_task_close:refuse
  # reason: "<why this project accepts shipping these without a semantic diff review>" # ownership: kernel-executed reader=bin/lib/task.py#_case_valid effect=bin/lib/task.py#cmd_task_close:refuse
  # declared_at: 2026-08-13 # ownership: kernel-executed reader=bin/lib/task.py#_case_restoration_state effect=bin/lib/task.py#cmd_task_close:refuse
  # # restore_after: 3 # ownership: kernel-executed reader=bin/lib/task.py#_case_positive_int_override effect=bin/lib/task.py#cmd_task_close:refuse
  # # window_days: 90 # ownership: kernel-executed reader=bin/lib/task.py#_case_positive_int_override effect=bin/lib/task.py#cmd_task_close:refuse
  # A case exempts audit-post ONLY (never audit-pre, tests, land-verify or closure); a spec RE-SIGN
  # (a re-stamped `implements_signature`) takes the exemption back too. The guard takes back GOVERNANCE
  # surfaces: specs, an always-loaded seed, this file, AND the SPEC-0077 pinned-test surface —
  # `tests/**` and what `verify:` names — so prefer `paths:` over a class-only case.
  # see SPEC-0178 §Rule 2, §Rule 3, §Rule 6
  # BORN-PERMISSIVE DECLARATION (SPEC-0189): written only by
  # `init --confirm-born-permissive audit_scrutiny:<owner>`; restoring is this project's own act
  # (SPEC-0189 rule 4).
  # see SPEC-0189 §Rule 8
  # yitc:born-permissive-declaration
  cases:
    - case: docs
      match: { paths: [docs/**] }
      exempt: audit-post
      reason: "born permissive per the owner directive of 2026-08-21 — a new project does not
        pay a semantic diff review for a docs-only card from day one. Bounded to docs/**, and
        rule 3's governance guard takes back every governance surface regardless. The periodic
        review watches for the absence starting to cost something and PROPOSES restoring the
        gate (SPEC-0189); restoration is this project's own explicit act — delete or narrow this
        case."
      declared_at: 2026-08-21
  # yitc:end-born-permissive-declaration
inspection:
  # SPEC-0093 rule 12. DECLARE local inspection `themes:` ({ theme, probe, cadence }); `probe:` is
  # `view:` XOR `sweep:`. A `waiver:` beside the kernel-owned entry does not
  # cover: a project `waiver:` is the project's stance on its OWN themes (SPEC-0093 rule 12).
  # see SPEC-0057 §9; SPEC-0160 §12
  themes:
  # The KERNEL-OWNED baseline entry — keep it and `owner: kernel`; you MAY narrow `surfaces:`.
  # Rule text: `__YITC_CLI__ graph query SPEC-0057 --kernel`
  - theme: repeated-work
    owner: kernel
    probe:
      sweep:
        surfaces: "backend/**/* app/**/* frontend/src/**/* scripts/**/* workers/**/*"
        checks:
          - "n-plus-one-queries-in-loops"
          - "file-config-row-re-read-per-request-or-iteration"
          - "remote-resource-re-fetched-or-pagination-restarted"
          - "unbounded-loops-retries-polls"
          - "repeated-whole-table-or-dir-scans-per-lookup"
          - "frontend-effect-fetch-re-trigger-loops"
          - "worker-cron-reprocessing-without-watermark"
        against: "patterns/repeated-work-lens.md"
    cadence: monthly
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no project-local inspection themes declared yet; for its own project revizii it MAY use the kernel T1–T10 lens APPROACHES as adaptation examples (the METHOD travels, the engine themes do not). Declare a `themes:` list (each {theme, probe, cadence}, where `probe` is EXACTLY ONE KIND — `view:` XOR `sweep:`, per SPEC-0093 rule 12) once this project grows local revizia lenses."
# reads:
# # SPEC-0190 rule 10 (via SPEC-0160 rule 25) — the read-contract EXEMPTION carrier for a seam
# # that cannot hold the read contract. OPT-IN and born COMMENTED: absence exempts no seam.
# # Every entry needs all four fields; a malformed one is refused.
# # Rule text: `__YITC_CLI__ graph query SPEC-0190 --kernel`
# # see SPEC-0190 §Rule 10; SPEC-0160 §25
# exemptions: # the list; each entry carries ALL FOUR fields below
# - seam: "bin/lib/debt.py#_debt_echo_lines" # the VERB LABEL (e.g. journal query), or the WIRING SITE <file>#<symbol>
# ratio_bound: 2 # the POSITIVE folds-per-segment ceiling this seam is permitted
# reason: "<why this seam cannot hold folds <= 1 per segment>"
# until: 2026-12-31 # a real ISO review-by date
extensions:
  # SPEC-0093 rule 13. The shared extensions this project ADOPTS by citing. Each active adoptable
  # catalog member is declare-or-waive: `__YITC_CLI__ init --adopt-extension SPEC-XXXX`, or a
  # `waives:` entry {spec, reason}. Catalog: `__YITC_CLI__ graph query extensions-catalog`.
  # Rule text: `__YITC_CLI__ graph query SPEC-0101 --kernel`
  adopts: []
coverage:
  # SPEC-0152 rule 15 — coverage admission. OPT-IN: absent or an empty `load_bearing:` tracks nothing;
  # a load-bearing surface neither spec-covered nor `admitted:` WARNs at `graph build`. To opt in:
  # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
  # load_bearing: # globs naming the load-bearing surface universe (repo-relative)
  # - "bin/lib/*.py"
  # admitted: # reasoned spec-less surfaces NOT flagged — each needs surface + reason
  # - surface: "bin/lib/legacy.py"
  # reason: "<why this is a deliberate spec-less exclusion, not an orphan>"
  # Or waive the whole concern:
  # waiver: { reason: "<why this project tracks no coverage admission>" }
  load_bearing: []
  admitted: []
# startup_checks:
# # SPEC-0152 rule 17 — OPTIONAL report-only startup checks, each { label, command, detail };
# # a non-zero exit flags. Absent or commented declares none.
# # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
# - label: pending-proposals
# command: "test $(ls proposals/*.draft 2>/dev/null | wc -l) -eq 0"
# detail: "see proposals/ — drafts awaiting review"
product_source:
  # SPEC-0152 rule 27. DECLARE the trees this repo SHIPS — the work-batch carrier gate reads only
  # these — or waive. Empty reads as absent; `globs:` and `waiver:` together is a contradiction.
  # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
  # globs: [ "app/**", "frontend/src/**" ] # the trees this repo actually ships
  # waiver: { reason: "<why this repo ships no product source of its own>" }
  globs: []
# anchors:
# # SPEC-0006 (shape: SPEC-0160 rule 30) — this project's OWN `<file>#<symbol>` forms. OPT-IN, born
# # COMMENTED.
# # Rule text: `__YITC_CLI__ graph query SPEC-0006 --kernel`
# # see SPEC-0006 §Internal; SPEC-0160 §30
# symbol_forms: # the list; a file matched by several entries takes all of their forms
# - files: ["test/**/*.test.js"] # repo-relative globs naming the files the form applies to
# pattern: 'function\s+{symbol}\s*\(' # a regular expression; `{symbol}` stands for the anchored symbol
migrations:
  # SPEC-0093 rule 21. DECLARE a non-empty `command:` that brings a database to the current schema
  # (optional companions below), or keep this LOOSE waiver when there is no schema history.
  # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
  # tool: alembic # the named migration tool
  # versions: backend/alembic/versions # where the revision history lives
  # applied_at: deploy # WHERE the upgrade actually fires — `deploy` when the deploy
  # # script runs it (a deploy-coupled schema change: say so out
  # # loud rather than bury it in a shell script), or `manual`.
  # EITHER declared OR waived, never both.
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no schema-migration stance declared yet; declare a `command:` (e.g. `alembic upgrade head`, + optional tool/versions/applied_at) once this project migrates a persistent schema, or keep this waiver if it legitimately has none (lifespan-DDL / ORM create_all / schema-less)."
outcome_invariants:
  # SPEC-0093 rule 24. DECLARE `invariants:` for long-lived subsystems no single card owns —
  # X-0419: five remediation cards closed GREEN over three days while the product stayed broken —
  # and the owner was the only monitor.
  # Replace this waiver with an `invariants:` list; each entry needs FOUR keys:
  # invariants:
  # - id: stats-nonzero # the project-local invariant name (English slug)
  # subsystem: stats
  # invariant: "the stats page reports a non-zero row count for the last 24h" # prose for a human
  # probe: # READ-ONLY — stdout {"ok": true|false, "detail": "<why>"}
  # kind: command
  # command: ["python3", "scripts/probe_stats_nonzero.py"]
  # Surfaced report-only (SPEC-0119 rule 17). Waiver LOOSE; never both.
  # Rule text: `__YITC_CLI__ graph query SPEC-0093 --kernel`
  # see SPEC-0160 §24; SPEC-0093 §3
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no standing outcome-invariant declared yet; declare an `invariants:` list (each {id, subsystem, invariant, probe}) for any long-lived subsystem no single card owns, or keep this waiver if this project legitimately has none (a library / CLI / no product surface). Adoption evidence is framed on the DIFF, so an unowned subsystem has NO outcome probe and cannot be observed broken (X-0419: five cards closed green over three days while the product stayed broken; the owner was the only monitor)."
product_cron:
  # SPEC-0109. DECLARE this project's OWN scheduled work so v2 governs it (never runs it); example below.
  # Rule text: `__YITC_CLI__ graph query SPEC-0109 --kernel`
  # see SPEC-0109 §1, §2, §3, §4
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no product scheduler declared yet. This project runs no scheduled work of its own; if it gains one (a celery-beat schedule, a host cron), replace this waiver with `scheduler:` + `source:` (the definition that stays the sole source of truth) + a DERIVED `inventory:` (rendered from that source, never hand-entered — SPEC-0109 rule 2)."
  # SCHEDULED PRE-DEPLOY RUN (SPEC-1047) — switch on after your first declared deploy: commit the
  # line as ops/crontab, install it, and put the block below in place of the waiver:
  # 17 4 * * * cd <project> && <engine>/bin/yitc-v2 -C <project> session start >> <log> 2>&1 && YITC_SESSION_REF=cron-<name> <engine>/bin/yitc-v2 -C <project> deploy --scheduled-run >> <log> 2>&1
  # scheduler: crontab
  # source: ops/crontab
  # inventory:
  # - job: scheduled-pre-deploy-run
  # schedule: "17 4 * * *"
  # command: deploy --scheduled-run
freshness:
  # SPEC-0110. DECLARE a freshness contract if this project produces data on a cadence — a LIVE
  # read-only adapter the kernel runs at grade time:
  # Rule text: `__YITC_CLI__ graph query SPEC-0110 --kernel`
  # adapter: bin/freshness-adapter.py # the declaration key that ANSWERS this section
  # kind: command # the kernel runs it LIVE and parses its stdout JSON
  # command: [python3, bin/freshness-adapter.py]
  # see SPEC-0110 §1, §2, §3
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no freshness contract declared yet. This project produces no data on a cadence that must be graded for staleness; if it gains one (a sync / discovery / tracking pipeline), replace this waiver with an `adapter:` naming a read-only LIVE adapter command (never a static file — SPEC-0110 rule 3) that prints the kernel adapter-return JSON."
remote_sync:
  # SPEC-0163. DECLARE where code syncs, WHO pushes, and whether CI is live — all three:
  # Rule text: `__YITC_CLI__ graph query SPEC-0163 --kernel`
  # remote: git@github.com:<org>/<repo>.git # the declaration key that ANSWERS this section
  # pusher: "<who/what pushes — a named actor + credential path, or the automation that does it>"
  # ci: "<is CI live? on what trigger? and is it a GATE or an EXTRA CHECK? (rule 3)>"
  # No forge or CI is mandated (SPEC-0093 rule 3). With no remote, every CI workflow is DORMANT.
  # see SPEC-0163 §1, §3, §4, §5
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no git remote declared yet. This project syncs nowhere off this machine, so it has no pusher and no live CI; if it gains a remote, replace this waiver with `remote:` + `pusher:` (who pushes) + `ci:` (live? gate or extra check?) — all three (SPEC-0163 rule 4). NOTE: while this waiver stands, any CI workflow committed in this repo is DORMANT, never coverage (SPEC-0163 rule 5)."
alert_routing:
  # SPEC-0164. DECLARE where incident alerts GO and WHO acts — both keys:
  # Rule text: `__YITC_CLI__ graph query SPEC-0164 --kernel`
  # sink: "<WHERE an incident alert is delivered — a chat webhook, an email alias, a pager
  # rota, an issue tracker, a log a human really reads>"
  # receiver: "<WHO reads it and ACTS — a named human, rota, or on-call identity (or the
  # automation that escalates to one)>"
  # A LIVE project is also asked how it is WATCHED (optional; a present `slo:` needs both keys):
  # health: "<the endpoint a human or a monitor can hit to ask 'is it up?'>"
  # logs: "<the structured-log stance — what is logged, in what shape, and WHERE it is read>"
  # slo:
  # objective: "<the ONE thing promised, e.g. 'checkout responds under 500ms at p95'>"
  # target: "<the number that decides whether it was kept, e.g. '99.5% of requests'>"
  # GRADE-ONLY — the kernel never contacts the sink (SPEC-0093 rule 3 / SPEC-0110 rule 3).
  # see SPEC-0164 §1, §2, §5
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no alert routing declared yet. Incidents in this project reach a human only when someone looks. If this project gains a sink, replace this waiver with `sink:` (where alerts go) + `receiver:` (who reads it and acts) — both (SPEC-0164 rule 2)."
profile:
  # SPEC-0198. DERIVED by the kernel (`__YITC_CLI__ profile`). Declare here only what it cannot
  # derive, or an override; narrowing a latched high-risk dimension is an explicit act here:
  # Rule text: `__YITC_CLI__ graph query SPEC-0198 --kernel`
  # override:
  # traffic_scale: "<low | medium | high — the kernel cannot read real traffic from a checkout>"
  # collaborator_rights: "<solo | named-collaborators — a commit-author count is not a proof>"
  # surface: "<internal — ONLY if you know this project is never publicly reachable>"
  # money: "<present — spend moved through a third-party API (ad bids, price writes, marketplace calls) the kernel cannot derive>"
  waiver:
    reason: "Born with no override: the growth profile is DERIVED by the kernel from this checkout and its journal, so nothing is owed here. Replace this waiver with an `override:` mapping only to declare what the kernel cannot derive (traffic_scale / collaborator_rights) or to narrow a latched dimension deliberately."
environments:
  # SPEC-0199 — where config comes from and whether staging mirrors prod. Replace with:
  # Rule text: `__YITC_CLI__ graph query SPEC-0199 --kernel`
  # config_source: "<env | secrets store | file — and that no prod-only code path exists>"
  # staging: "<present: <how it mirrors prod> | absent: <why that is acceptable now>>"
  waiver:
    reason: "Initialized via `bin/yitc-v2 init` — no environments stance declared yet."
sandbox_entry:
  # SPEC-0169 — the collaborator sandbox ENTRY POINT, a location, never a credential. OPT-IN:
  # Rule text: `__YITC_CLI__ graph query SPEC-0169 --kernel`
  # entry: <the address or handle a collaborator enters through>
  # Entering still needs a grant (SPEC-0169 rule 1).
  # see SPEC-0169 §1, §1a
  waiver:
    reason: >-
      no collaborator sandbox yet — this project keeps no non-production stack, so it has no
      entry point to declare. Replace this waiver with `entry: <address>` when one exists
      (SPEC-0169 rule 1a; the grant contract, not this section, is what admits a person to a
      project at all).
data_obligation:
  # SPEC-0199 — what personal data is held, how long, how it is deleted. Born DECLARED none; a
  # project that HOLDS PII and defers uses the STRICT waiver (SPEC-0093 rule 6). Replace with:
  # Rule text: `__YITC_CLI__ graph query SPEC-0199 --kernel`
  # classification: "<which stores hold PII / sensitive data>"
  # retention: "<how long, and what enforces it>"
  # deletion: "<how a deletion request is honoured end-to-end>"
  classification: "none — no personal or sensitive data is stored (re-declared at the first PII-shaped migration; SPEC-0198 asks then)"
  retention: "n/a — nothing to retain"
  deletion: "n/a — nothing to delete"
cost:
  # SPEC-0199 — the spend at which cost becomes a task, and where it is read. Replace with:
